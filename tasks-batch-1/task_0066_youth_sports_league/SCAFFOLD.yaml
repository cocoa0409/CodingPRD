# =============================================================================
# Youth Sports League (Little League) — benchmark seed tables
# Difficulty band: Expert
# =============================================================================

scenario: |
  Youth Sports League (Little League): player registration, age verification
  (birth certificate), team draft (evaluation tiering), league schedule,
  referee assignment, rainout makeup, playoff elimination, parent volunteers

domain_name: youth-sports-league
api_prefix: /

complexity_profile:
  primary_archetype: temporal_windowing
  secondary_archetype: quota_allocation
  complexity_layers:
    - optimistic_concurrency
    - cascading_side_effects
    - dual_variant_calculation
    - rate_threshold_triggers
  entity_topology: hybrid
  # League is the aggregate root; Division/Field/Player/Team/Referee/Game hang
  # off it; DraftPick, RefereeAssignment, VolunteerCommitment are association
  # entities carrying cross-aggregate FKs (player->team, referee->game).
  state_machine_shape: cyclic
  # Game cycles SCHEDULED -> RAINED_OUT -> SCHEDULED via makeup rescheduling;
  # Player reverts DRAFTED -> EVALUATED when a draft pick is voided.
  relationship_patterns:
    - one_to_many
    - many_to_many        # Game references two Teams; Referee serves many Games
    - cross_aggregate     # DraftPick links Team(parent=Division) and Player
  role_model: peer_roles
  # LeagueAdmin runs registration/draft/schedule; Coach runs own team's draft
  # picks/lineups; Referee confirms own assignments; ParentGuardian registers
  # own players and logs own volunteer shifts. Each role owns distinct resources.
  consistency_model: immediate

# =============================================================================
# 1.0 Response Envelope (FIXED)
# =============================================================================
response_envelope:
  success: |
    { "meta": { "api_request_id": "req_xxx", "api_request_timestamp": "ISO8601" },
      "response_type": "object" | "array", "data": {} }
  error: |
    { "meta": { ... }, "response_type": "error",
      "data": { "error_id": "ERR_XXX", "message": "..." } }
  pagination_fields: ["limit", "offset", "total_count", "has_more"]
  pagination_defaults: { limit: 10, min: 1, max: 100, offset: 0 }

# =============================================================================
# 1.1 Entity-Relationship Table
# =============================================================================
entities:
  - name: League
    parent: null
    common_fields: true   # id, created_at, updated_at, version
    fields:
      - { name: name, type: string, source: input, description: "League name" }
      - { name: season_year, type: integer, source: input, description: "Calendar year of the season" }
      - { name: age_cutoff_date, type: string, source: input, description: "League-age cutoff date 'YYYY-MM-DD' (Aug 31 convention); a player's league age is their age in completed years as of this date" }
      - { name: registration_open_iso, type: datetime, source: input, description: "Registration window opens at this instant (inclusive)" }
      - { name: registration_close_iso, type: datetime, source: input, description: "Registration window closes at this instant (exclusive)" }
      - { name: draft_snake, type: boolean, source: input, default: true, description: "If true draft pick order snakes (reverses each round); if false it repeats forward each round" }
      - { name: status, type: enum, source: system, default: "SETUP", description: "SETUP -> REGISTRATION -> EVALUATION -> DRAFT -> SEASON -> PLAYOFFS -> CLOSED; gates child operations" }
      - { name: total_registered_players, type: integer, source: computed, default: 0, description: "Count of Players with status NOT IN {WITHDRAWN}" }
      - { name: draft_round_index, type: integer, source: system, default: 0, description: "Number of completed snake-draft rounds; 0 until DRAFT begins" }
      - { name: version, type: integer, source: system, description: "Optimistic concurrency version; starts at 1, +1 on every mutation including cascades" }

  - name: Division
    parent: League
    common_fields: true
    fields:
      - { name: league_id, type: string, source: system, description: "FK -> League.id; owning league" }
      - { name: name, type: string, source: input, description: "Division name, e.g. 'Majors'" }
      - { name: min_league_age, type: integer, source: input, description: "Minimum eligible league age (inclusive)" }
      - { name: max_league_age, type: integer, source: input, description: "Maximum eligible league age (inclusive)" }
      - { name: roster_cap, type: integer, source: input, description: "Maximum players per team in this division" }
      - { name: version, type: integer, source: system, description: "Optimistic concurrency version" }

  - name: Family
    parent: League
    common_fields: true
    fields:
      - { name: league_id, type: string, source: system, description: "FK -> League.id; owning league" }
      - { name: guardian_email, type: string, source: input, description: "Parent/guardian contact email; unique within the league" }
      - { name: guardian_name, type: string, source: input, description: "Parent/guardian full name" }
      - { name: volunteer_deposit_cents, type: integer, source: input, description: "Refundable volunteer deposit posted at registration, in cents" }
      - { name: volunteer_credit_cents, type: integer, source: computed, default: 0, description: "Accrued refundable credit from FULFILLED volunteer commitments, in cents; <= volunteer_deposit_cents" }
      - { name: version, type: integer, source: system, description: "Optimistic concurrency version" }

  - name: Player
    parent: League
    common_fields: true
    fields:
      - { name: league_id, type: string, source: system, description: "FK -> League.id; owning league" }
      - { name: family_id, type: string, source: input, description: "FK -> Family.id; registering family" }
      - { name: division_id, type: string, source: input, description: "FK -> Division.id; requested division" }
      - { name: full_name, type: string, source: input, description: "Player full name" }
      - { name: birth_date, type: string, source: input, description: "Player date of birth 'YYYY-MM-DD'" }
      - { name: league_age, type: integer, source: computed, description: "Completed years between birth_date and league.age_cutoff_date (see calc league_age_computation)" }
      - { name: birth_certificate_ref, type: string, source: input, default: null, description: "Document reference proving birth_date; required to leave REGISTERED" }
      - { name: eval_speed, type: integer, source: input, default: null, description: "Evaluation raw score 20-80 for speed; set at evaluation" }
      - { name: eval_hitting, type: integer, source: input, default: null, description: "Evaluation raw score 20-80 for hitting; set at evaluation" }
      - { name: eval_fielding, type: integer, source: input, default: null, description: "Evaluation raw score 20-80 for fielding; set at evaluation" }
      - { name: eval_score, type: number, source: computed, description: "Weighted evaluation score (see calc evaluation_tier_score)" }
      - { name: tier, type: enum, source: computed, description: "A | B | C | D draft tier derived from eval_score thresholds; null until EVALUATED" }
      - { name: team_id, type: string, source: computed, default: null, description: "FK -> Team.id; set when DRAFTED, cleared on pick void" }
      - { name: status, type: enum, source: system, default: "REGISTERED", description: "REGISTERED -> AGE_VERIFIED -> EVALUATED -> DRAFTED -> ROSTERED; or WITHDRAWN (terminal)" }
      - { name: version, type: integer, source: system, description: "Optimistic concurrency version" }

  - name: Team
    parent: Division
    common_fields: true
    fields:
      - { name: division_id, type: string, source: system, description: "FK -> Division.id; owning division" }
      - { name: league_id, type: string, source: system, description: "FK -> League.id; owning league (denormalized for scope)" }
      - { name: name, type: string, source: input, description: "Team name" }
      - { name: coach_user_id, type: string, source: input, description: "Opaque coach identifier who owns this team's draft picks" }
      - { name: draft_slot, type: integer, source: input, description: "1-based draft order position within the division (lottery seed)" }
      - { name: roster_count, type: integer, source: computed, default: 0, description: "Count of Players with team_id == this team and status IN {DRAFTED, ROSTERED}" }
      - { name: wins, type: integer, source: computed, default: 0, description: "Count of FINAL games this team won" }
      - { name: losses, type: integer, source: computed, default: 0, description: "Count of FINAL games this team lost" }
      - { name: run_differential, type: integer, source: computed, default: 0, description: "Sum over FINAL games of (own_runs - opponent_runs)" }
      - { name: seed, type: integer, source: computed, default: null, description: "Playoff seed within division (see calc playoff_seeding); null until PLAYOFFS" }
      - { name: version, type: integer, source: system, description: "Optimistic concurrency version" }

  - name: DraftPick
    parent: League
    common_fields: true
    fields:
      - { name: league_id, type: string, source: system, description: "FK -> League.id; owning league" }
      - { name: team_id, type: string, source: input, description: "FK -> Team.id; team making the pick" }
      - { name: player_id, type: string, source: input, description: "FK -> Player.id; player selected" }
      - { name: round_number, type: integer, source: system, description: "1-based draft round in which this pick was made" }
      - { name: overall_number, type: integer, source: system, description: "1-based global pick sequence across the whole draft" }
      - { name: status, type: enum, source: system, default: "ACTIVE", description: "ACTIVE -> VOIDED (terminal); VOIDED picks reopen the player and free the roster slot" }
      - { name: version, type: integer, source: system, description: "Optimistic concurrency version" }

  - name: Field
    parent: League
    common_fields: true
    fields:
      - { name: league_id, type: string, source: system, description: "FK -> League.id; owning league" }
      - { name: name, type: string, source: input, description: "Field/venue name" }
      - { name: turnover_buffer_minutes, type: integer, source: input, default: 30, description: "Minimum gap required between the end of one game and the start of the next on this field" }
      - { name: version, type: integer, source: system, description: "Optimistic concurrency version" }

  - name: Referee
    parent: League
    common_fields: true
    fields:
      - { name: league_id, type: string, source: system, description: "FK -> League.id; owning league" }
      - { name: user_id, type: string, source: input, description: "Opaque referee identifier used in X-User-ID when acting as Referee" }
      - { name: full_name, type: string, source: input, description: "Referee full name" }
      - { name: max_games_per_day, type: integer, source: input, default: 3, description: "Maximum CONFIRMED assignments this referee may hold on a single calendar day (UTC)" }
      - { name: version, type: integer, source: system, description: "Optimistic concurrency version" }

  - name: Game
    parent: League
    common_fields: true
    fields:
      - { name: league_id, type: string, source: system, description: "FK -> League.id; owning league" }
      - { name: division_id, type: string, source: input, description: "FK -> Division.id; division both teams belong to" }
      - { name: home_team_id, type: string, source: input, description: "FK -> Team.id; home team" }
      - { name: away_team_id, type: string, source: input, description: "FK -> Team.id; away team" }
      - { name: field_id, type: string, source: input, description: "FK -> Field.id; venue" }
      - { name: start_iso, type: datetime, source: input, description: "Scheduled start instant (inclusive)" }
      - { name: end_iso, type: datetime, source: input, description: "Scheduled end instant (exclusive)" }
      - { name: game_type, type: enum, source: input, default: "REGULAR", description: "REGULAR | PLAYOFF" }
      - { name: playoff_round, type: integer, source: input, default: null, description: "1-based bracket round; required when game_type=PLAYOFF" }
      - { name: home_runs, type: integer, source: input, default: null, description: "Home team runs; set at finalize" }
      - { name: away_runs, type: integer, source: input, default: null, description: "Away team runs; set at finalize" }
      - { name: winner_team_id, type: string, source: computed, default: null, description: "FK -> Team.id; team with more runs at FINAL (null until FINAL)" }
      - { name: rainout_count, type: integer, source: system, default: 0, description: "Number of times this game has been rained out and rescheduled" }
      - { name: status, type: enum, source: system, default: "SCHEDULED", description: "SCHEDULED -> IN_PROGRESS -> FINAL; SCHEDULED -> RAINED_OUT -> (makeup) SCHEDULED; or FORFEITED (terminal)" }
      - { name: version, type: integer, source: system, description: "Optimistic concurrency version" }

  - name: RefereeAssignment
    parent: Game
    common_fields: true
    fields:
      - { name: game_id, type: string, source: system, description: "FK -> Game.id; assigned game" }
      - { name: referee_id, type: string, source: input, description: "FK -> Referee.id; assigned referee" }
      - { name: role, type: enum, source: input, default: "PLATE", description: "PLATE | BASE umpire role on this game" }
      - { name: status, type: enum, source: system, default: "PROPOSED", description: "PROPOSED -> CONFIRMED -> CHECKED_IN; PROPOSED -> DECLINED; CONFIRMED -> RELEASED" }
      - { name: version, type: integer, source: system, description: "Optimistic concurrency version" }

  - name: VolunteerCommitment
    parent: Game
    common_fields: true
    fields:
      - { name: game_id, type: string, source: system, description: "FK -> Game.id; game the shift covers" }
      - { name: family_id, type: string, source: input, description: "FK -> Family.id; volunteering family" }
      - { name: role, type: enum, source: input, description: "SCOREKEEPER | CONCESSIONS | FIELD_PREP" }
      - { name: credit_cents, type: integer, source: input, description: "Refundable credit value of this shift in cents, set when the commitment is created" }
      - { name: status, type: enum, source: system, default: "PLEDGED", description: "PLEDGED -> FULFILLED (credits family) or NO_SHOW (terminal, no credit)" }
      - { name: version, type: integer, source: system, description: "Optimistic concurrency version" }

# =============================================================================
# 1.2 State Machine Table
# =============================================================================
state_machines:
  - entity: League
    initial_state: SETUP
    terminal_states: [CLOSED]
    transitions:
      - from: SETUP
        to: REGISTRATION
        trigger: "POST /leagues/{leagueId}/advance with target=REGISTRATION"
        actor: LeagueAdmin
        preconditions:
          - "At least one Division exists for the league"
        side_effects: ["increments League.version by 1"]
      - from: REGISTRATION
        to: EVALUATION
        trigger: "POST /leagues/{leagueId}/advance with target=EVALUATION"
        actor: LeagueAdmin
        preconditions:
          - "total_registered_players >= 1"
        side_effects: ["increments League.version by 1"]
      - from: EVALUATION
        to: DRAFT
        trigger: "POST /leagues/{leagueId}/advance with target=DRAFT"
        actor: LeagueAdmin
        preconditions:
          - "Every non-WITHDRAWN Player in the league is in status EVALUATED (none still REGISTERED or AGE_VERIFIED)"
        side_effects:
          - "draft_round_index set to 0"
          - "increments League.version by 1"
      - from: DRAFT
        to: SEASON
        trigger: "POST /leagues/{leagueId}/advance with target=SEASON"
        actor: LeagueAdmin
        preconditions:
          - "Every non-WITHDRAWN Player is DRAFTED or ROSTERED (no EVALUATED player remains undrafted)"
        side_effects:
          - "All DRAFTED players cascade to ROSTERED (see Player DRAFTED->ROSTERED)"
          - "increments League.version by 1"
      - from: SEASON
        to: PLAYOFFS
        trigger: "POST /leagues/{leagueId}/advance with target=PLAYOFFS"
        actor: LeagueAdmin
        preconditions:
          - "No Game in status SCHEDULED or IN_PROGRESS with game_type=REGULAR remains (all regular games FINAL/FORFEITED)"
        side_effects:
          - "Compute Team.seed per division via calc playoff_seeding"
          - "increments League.version by 1"
      - from: PLAYOFFS
        to: CLOSED
        trigger: "POST /leagues/{leagueId}/advance with target=CLOSED"
        actor: LeagueAdmin
        preconditions:
          - "No PLAYOFF Game in status SCHEDULED or IN_PROGRESS remains"
        side_effects:
          - "Refund each Family: settle volunteer_credit_cents (see calc volunteer_refund)"
          - "increments League.version by 1"

  - entity: Player
    initial_state: REGISTERED
    terminal_states: [WITHDRAWN]
    transitions:
      - from: REGISTERED
        to: AGE_VERIFIED
        trigger: "POST /players/{playerId}/verify-age"
        actor: LeagueAdmin
        preconditions:
          - "birth_certificate_ref is non-null"
          - "league_age within [division.min_league_age, division.max_league_age] of the player's division (ERR_AGE_OUT_OF_RANGE)"
        side_effects: ["increments Player.version by 1"]
      - from: AGE_VERIFIED
        to: EVALUATED
        trigger: "POST /players/{playerId}/evaluate"
        actor: LeagueAdmin
        preconditions:
          - "League.status == EVALUATION"
          - "eval_speed, eval_hitting, eval_fielding all provided and each in [20,80]"
        side_effects:
          - "Compute eval_score and tier via calc evaluation_tier_score"
          - "increments Player.version by 1"
      - from: EVALUATED
        to: DRAFTED
        trigger: "POST /draft-picks (this player selected)"
        actor: system
        preconditions:
          - "Pick is the drafting team's turn in snake order (see calc snake_draft_order)"
          - "team.roster_count < division.roster_cap (ERR_ROSTER_FULL)"
        side_effects:
          - "team_id set to the drafting team"
          - "Team.roster_count += 1"
          - "increments Player.version by 1"
      - from: DRAFTED
        to: EVALUATED
        trigger: "POST /draft-picks/{pickId}/void"
        actor: system
        preconditions:
          - "Owning DraftPick.status == ACTIVE"
        side_effects:
          - "team_id cleared to null"
          - "Team.roster_count -= 1"
          - "increments Player.version by 1"
        note: "Revert link that makes the Player machine cyclic"
      - from: DRAFTED
        to: ROSTERED
        trigger: "system (cascade during League DRAFT->SEASON advance)"
        actor: system
        preconditions: []
        side_effects: ["increments Player.version by 1"]
      - from: REGISTERED
        to: WITHDRAWN
        trigger: "POST /players/{playerId}/withdraw"
        actor: LeagueAdmin
        preconditions: []
        side_effects:
          - "League.total_registered_players recomputed (-1)"
          - "increments Player.version by 1"
      - from: AGE_VERIFIED
        to: WITHDRAWN
        trigger: "POST /players/{playerId}/withdraw"
        actor: LeagueAdmin
        preconditions: []
        side_effects:
          - "League.total_registered_players recomputed (-1)"
          - "increments Player.version by 1"
      - from: EVALUATED
        to: WITHDRAWN
        trigger: "POST /players/{playerId}/withdraw"
        actor: LeagueAdmin
        preconditions:
          - "Player has no ACTIVE DraftPick (must be undrafted)"
        side_effects:
          - "League.total_registered_players recomputed (-1)"
          - "increments Player.version by 1"

  - entity: DraftPick
    initial_state: ACTIVE
    terminal_states: [VOIDED]
    transitions:
      - from: ACTIVE
        to: VOIDED
        trigger: "POST /draft-picks/{pickId}/void"
        actor: LeagueAdmin
        preconditions:
          - "League.status == DRAFT"
          - "This is the most recent ACTIVE pick by overall_number (only the last pick may be voided; ERR_NOT_LAST_PICK)"
        side_effects:
          - "Player DRAFTED -> EVALUATED (cascade: team_id cleared, Team.roster_count -= 1)"
          - "increments DraftPick.version by 1"

  - entity: Game
    initial_state: SCHEDULED
    terminal_states: [FINAL, FORFEITED]
    transitions:
      - from: SCHEDULED
        to: IN_PROGRESS
        trigger: "POST /games/{gameId}/start"
        actor: LeagueAdmin
        preconditions:
          - "League.status IN {SEASON, PLAYOFFS}"
          - "At least one RefereeAssignment on the game is CONFIRMED or CHECKED_IN (ERR_NO_REFEREE_CONFIRMED)"
        side_effects: ["increments Game.version by 1"]
      - from: IN_PROGRESS
        to: FINAL
        trigger: "POST /games/{gameId}/finalize"
        actor: LeagueAdmin
        preconditions:
          - "home_runs and away_runs both provided and non-negative"
          - "home_runs != away_runs (no ties; ERR_TIE_NOT_ALLOWED)"
        side_effects:
          - "winner_team_id set to higher-run team"
          - "Update both teams' wins/losses/run_differential"
          - "If game_type=PLAYOFF: loser team eliminated (no further bracket games created for loser); winner advances per bracket"
          - "increments Game.version by 1"
      - from: SCHEDULED
        to: RAINED_OUT
        trigger: "POST /games/{gameId}/rainout"
        actor: LeagueAdmin
        preconditions:
          - "League.status IN {SEASON, PLAYOFFS}"
        side_effects:
          - "All PROPOSED/CONFIRMED RefereeAssignments on the game -> RELEASED"
          - "All PLEDGED VolunteerCommitments on the game remain PLEDGED (carried to makeup)"
          - "increments Game.version by 1"
      - from: RAINED_OUT
        to: SCHEDULED
        trigger: "POST /games/{gameId}/reschedule"
        actor: LeagueAdmin
        preconditions:
          - "New [start_iso,end_iso) does not collide with another non-terminal Game on the same field per calc field_slot_overlap (ERR_FIELD_SLOT_CONFLICT)"
        side_effects:
          - "start_iso/end_iso updated to makeup slot"
          - "rainout_count += 1"
          - "increments Game.version by 1"
        note: "Cyclic edge: a rained-out game returns to SCHEDULED at a new slot"
      - from: SCHEDULED
        to: FORFEITED
        trigger: "POST /games/{gameId}/forfeit"
        actor: LeagueAdmin
        preconditions: []
        side_effects:
          - "winner_team_id set to the non-forfeiting team; that team +1 win, forfeiting team +1 loss; run_differential unchanged"
          - "All non-terminal RefereeAssignments -> RELEASED"
          - "increments Game.version by 1"

  - entity: RefereeAssignment
    initial_state: PROPOSED
    terminal_states: [DECLINED, RELEASED]
    transitions:
      - from: PROPOSED
        to: CONFIRMED
        trigger: "POST /assignments/{assignmentId}/confirm"
        actor: Referee
        preconditions:
          - "Referee has fewer than referee.max_games_per_day CONFIRMED/CHECKED_IN assignments on the game's calendar day (ERR_REFEREE_DAY_LIMIT)"
          - "The referee has no other CONFIRMED/CHECKED_IN assignment whose game time window overlaps this game per calc referee_time_overlap (ERR_REFEREE_TIME_CONFLICT)"
        side_effects: ["increments RefereeAssignment.version by 1"]
      - from: PROPOSED
        to: DECLINED
        trigger: "POST /assignments/{assignmentId}/decline"
        actor: Referee
        preconditions: []
        side_effects: ["increments RefereeAssignment.version by 1"]
      - from: CONFIRMED
        to: CHECKED_IN
        trigger: "POST /assignments/{assignmentId}/check-in"
        actor: Referee
        preconditions:
          - "Owning Game.status == IN_PROGRESS or SCHEDULED"
        side_effects: ["increments RefereeAssignment.version by 1"]
      - from: CONFIRMED
        to: RELEASED
        trigger: "system (cascade on Game rainout/forfeit) OR POST .../assignments/{assignmentId}/release"
        actor: system
        preconditions: []
        side_effects: ["increments RefereeAssignment.version by 1"]
      - from: PROPOSED
        to: RELEASED
        trigger: "system (cascade on Game rainout/forfeit)"
        actor: system
        preconditions: []
        side_effects: ["increments RefereeAssignment.version by 1"]

  - entity: VolunteerCommitment
    initial_state: PLEDGED
    terminal_states: [FULFILLED, NO_SHOW]
    transitions:
      - from: PLEDGED
        to: FULFILLED
        trigger: "POST /volunteer-commitments/{commitmentId}/fulfill"
        actor: LeagueAdmin
        preconditions:
          - "Owning Game.status == FINAL"
        side_effects:
          - "Family.volunteer_credit_cents increased per calc volunteer_credit_accrual (capped at deposit)"
          - "increments VolunteerCommitment.version by 1"
      - from: PLEDGED
        to: NO_SHOW
        trigger: "POST /volunteer-commitments/{commitmentId}/mark-no-show"
        actor: LeagueAdmin
        preconditions:
          - "Owning Game.status == FINAL"
        side_effects:
          - "No credit accrued"
          - "increments VolunteerCommitment.version by 1"

# =============================================================================
# 1.2.1 Concurrency Rules
# =============================================================================
concurrency_rules:
  - rule_id: draft-pick-stale-league
    parent_entity: League
    write_endpoint: "POST /draft-picks"
    occ_field: "expected_league_version"
    description: |
      Submitting a draft pick against a League whose version has advanced since
      the client last observed it is rejected with a stale-version error. The
      draft is a single shared snake-order sequence on the League; once any pick
      is recorded the League.version advances (draft_round_index / pick sequence
      move forward), so a pick prepared against an earlier League view is stale
      and would corrupt the pick order if admitted.
    error_id: ERR_STALE_LEAGUE_VERSION
    http_status: 412

  - rule_id: reschedule-stale-game
    parent_entity: Game
    write_endpoint: "POST /games/{gameId}/reschedule"
    occ_field: "expected_game_version"
    description: |
      Rescheduling a rained-out Game to a makeup slot against a Game whose
      version has advanced since the client last read it is rejected. A makeup
      slot legitimately supersedes the prior slot, so a reschedule prepared from
      a stale Game view (e.g. before another reschedule already moved it) would
      overwrite the newer slot; OCC on Game.version forces the writer to re-read.
    error_id: ERR_STALE_GAME_VERSION
    http_status: 412

# =============================================================================
# 1.3 Calculation Rules Table
# =============================================================================
calculations:
  - name: league_age_computation
    trigger: "Player creation and on POST .../verify-age"
    algorithm: threshold
    formula: |
      # League age = completed years from birth_date to league.age_cutoff_date.
      cutoff = date(league.age_cutoff_date)
      bd     = date(player.birth_date)
      league_age = cutoff.year - bd.year
      if (bd.month, bd.day) > (cutoff.month, cutoff.day):
          league_age -= 1            # birthday falls AFTER cutoff -> not yet aged up
      # Eligibility (checked at verify-age):
      eligible = division.min_league_age <= league_age <= division.max_league_age
    input_set: "Single Player vs its requested Division; uses league.age_cutoff_date"
    constants: {}
    precision: "integer years; comparison is inclusive on both bounds (>= min AND <= max)"

  - name: evaluation_tier_score
    trigger: "Player AGE_VERIFIED -> EVALUATED (POST .../evaluate)"
    algorithm: weighted_scoring
    formula: |
      # Weighted blend of three raw scores, then bucket into a tier.
      eval_score = 0.50*eval_hitting + 0.30*eval_fielding + 0.20*eval_speed
      eval_score = round_half_up(eval_score, 2)        # round the blended score ONCE, here
      if   eval_score >= 70.00: tier = "A"
      elif eval_score >= 55.00: tier = "B"
      elif eval_score >= 40.00: tier = "C"
      else:                     tier = "D"
    input_set: "Single Player's three eval_* raw scores"
    constants:
      W_HITTING: 0.50
      W_FIELDING: 0.30
      W_SPEED: 0.20
      TIER_A_MIN: 70.00
      TIER_B_MIN: 55.00
      TIER_C_MIN: 40.00
    precision: "round_half_up to 2 decimals on eval_score; tier thresholds use >= (inclusive lower bound)"

  - name: snake_draft_order
    trigger: "POST /draft-picks (validates whose turn it is)"
    algorithm: chronological
    formula: |
      # Teams in a division pick in draft_slot order (1..T) each round.
      # Round 1: slots 1,2,...,T. If league.draft_snake: even rounds reverse (T,...,2,1).
      # If draft_snake false: every round is forward (1,2,...,T).
      T = number of Teams in the division (ordered by draft_slot ASC; draft_slot is unique)
      picks_made = count of ACTIVE DraftPick in this division
      round_number = floor(picks_made / T) + 1
      pos_in_round = picks_made mod T          # 0-based
      if league.draft_snake and (round_number % 2 == 0):
          expected_slot = T - pos_in_round     # reversed
      else:
          expected_slot = pos_in_round + 1     # forward
      # The submitting team's draft_slot MUST equal expected_slot else ERR_NOT_YOUR_PICK.
      overall_number = picks_made + 1
    input_set: "ACTIVE DraftPicks within the player's Division; Teams ordered by draft_slot ASC"
    constants: {}
    precision: "integer slot arithmetic; ordering key is draft_slot ASC (unique, never id)"

  - name: playoff_seeding
    trigger: "League SEASON -> PLAYOFFS advance"
    algorithm: aggregation
    formula: |
      # Rank teams within a division to assign seed 1..T.
      # win_pct = wins / (wins + losses); if wins+losses==0, win_pct = 0.
      # Base sort: win_pct DESC, then run_differential DESC, then created_at ASC.
    input_set: "Teams in a division; wins/losses/run_differential from FINAL REGULAR games only (PLAYOFF games excluded)"
    constants: {}
    precision: "win_pct computed as exact rational for comparison; ties broken by run_differential DESC then created_at ASC (never id)"
    variants:
      - name: win_pct_seeding
        when: "league.draft_snake is true (default competitive bracket)"
        difference: "Primary sort key is win_pct DESC (a 9-3 team outseeds an 8-2 team only if .750 < .800 is respected)"
      - name: head_to_head_first_seeding
        when: "league.draft_snake is false (recreational bracket)"
        difference: "Primary sort key is total wins DESC (raw win count), NOT win_pct; an 8-2 team (8 wins) outseeds a 7-1 team (7 wins) even though .800 < .875"

  - name: volunteer_credit_accrual
    trigger: "VolunteerCommitment PLEDGED -> FULFILLED"
    algorithm: aggregation
    formula: |
      # Per-commitment credit applied immediately on fulfill, capped so the
      # family's running credit never exceeds its posted deposit.
      proposed = family.volunteer_credit_cents + commitment.credit_cents
      family.volunteer_credit_cents = min(proposed, family.volunteer_deposit_cents)
    input_set: "Single VolunteerCommitment's credit_cents against owning Family's running credit and deposit"
    constants: {}
    precision: "integer cents; cap applied per-fulfill (running cap, NOT a sum-then-cap at season end)"

  - name: field_slot_overlap
    trigger: "POST .../games (create) and POST .../games/{id}/reschedule"
    algorithm: interval_merge
    formula: |
      # A new game [s,e) on a field conflicts with any existing non-terminal game
      # [s2,e2) on the SAME field when their BUFFERED windows touch. The buffer is
      # added on BOTH sides symmetrically, so adjacency is NOT allowed within the
      # turnover gap. Treat each existing game as occupying [s2 - buffer, e2 + buffer).
      buffer = timedelta(minutes = field.turnover_buffer_minutes)
      conflict = exists existing game g (status NOT IN {FINAL, FORFEITED, RAINED_OUT})
                 on same field, g != self, such that:
                     s < (g.end_iso + buffer)  AND  (g.start_iso - buffer) < e
      # Half-open intervals: touching exactly at a buffered boundary (s == g.end + buffer) does NOT conflict.
    input_set: "Existing Games on the same field with status NOT IN {FINAL, FORFEITED, RAINED_OUT}"
    constants: {}
    precision: "half-open [start,end); buffer subtracted/added symmetrically; boundary touch is allowed (strict <)"

  - name: referee_time_overlap
    trigger: "POST .../assignments/{id}/confirm"
    algorithm: interval_merge
    formula: |
      # A referee may not be CONFIRMED/CHECKED_IN on two games whose RAW time
      # windows overlap. Unlike field_slot_overlap there is NO buffer here — only
      # the bare game intervals matter (a referee can ump back-to-back games with
      # zero gap, but not overlapping ones).
      conflict = exists RefereeAssignment a2 (status IN {CONFIRMED, CHECKED_IN})
                 for same referee, a2.game != this.game, such that:
                     this.game.start_iso < a2.game.end_iso
                     AND a2.game.start_iso < this.game.end_iso
      # Half-open: touching at a boundary (this.start == a2.end) does NOT conflict.
    input_set: "CONFIRMED/CHECKED_IN RefereeAssignments of the same referee across the league"
    constants: {}
    precision: "half-open [start,end); NO buffer (distinct interval semantics from field_slot_overlap); boundary touch allowed (strict <)"

  - name: volunteer_refund
    trigger: "League PLAYOFFS -> CLOSED advance (per Family settlement)"
    algorithm: aggregation
    formula: |
      # Two valid refund interpretations diverge on rounding order of a 5% admin
      # fee deducted from per-commitment fulfilled credits.
      # PINNED ORDER for this scaffold: fee is applied per-commitment then summed
      # (round each commitment's net credit to whole cents, THEN sum), which can
      # differ by a cent or two from sum-then-round.
      fulfilled = [c for Family's VolunteerCommitments if c.status == FULFILLED]
      net = 0
      for c in fulfilled (ordered by created_at ASC):
          fee_c   = round_half_up(c.credit_cents * 0.05)   # whole cents, per commitment
          net    += (c.credit_cents - fee_c)
      refund_cents = min(net, family.volunteer_deposit_cents)
    input_set: "FULFILLED VolunteerCommitments of one Family, ordered created_at ASC"
    constants:
      ADMIN_FEE_PCT: 0.05
    precision: "round_half_up the 5% fee to whole cents PER COMMITMENT, then sum; NOT sum-then-round"

# =============================================================================
# 1.4 Validation Rules Table (ordered by priority)
# =============================================================================
validations:
  - priority: 1
    category: auth
    check: "X-User-Role and X-User-ID headers present"
    error_id: ERR_UNAUTHENTICATED
    http_status: 401
    applies_to: all

  - priority: 2
    category: auth
    check: "Role permitted for this operation per §1.7 RBAC matrix"
    error_id: ERR_FORBIDDEN
    http_status: 403
    applies_to: all

  - priority: 3
    category: existence
    check: "All path/body referenced resources exist within scope, validated left-to-right in path"
    error_id: ERR_NOT_FOUND
    http_status: 404
    applies_to: all

  - priority: 4
    category: business_referential
    check: "FK targets are consistent (player.division_id belongs to the league; game's two teams belong to game.division_id; assignment.referee_id in same league)"
    error_id: ERR_FK_SCOPE_MISMATCH
    http_status: 422
    applies_to: "POST .../players, POST .../games, POST .../assignments, POST .../draft-picks"

  - priority: 5
    category: state
    check: "Target resource and its owning League are in a state that permits this operation"
    error_id: ERR_INVALID_STATE
    http_status: 409
    applies_to: "all state-changing endpoints"

  - priority: 6
    category: business_temporal
    check: "Registration mutations only inside [registration_open_iso, registration_close_iso)"
    error_id: ERR_REGISTRATION_WINDOW_CLOSED
    http_status: 409
    applies_to: "POST .../players (create), POST .../players/{id}/withdraw"

  - priority: 7
    category: business_constraint
    check: "Player league_age within the requested division's [min_league_age, max_league_age]"
    error_id: ERR_AGE_OUT_OF_RANGE
    http_status: 422
    applies_to: "POST .../players/{id}/verify-age"

  - priority: 8
    category: business_constraint
    check: "Draft pick is the drafting team's turn in snake order"
    error_id: ERR_NOT_YOUR_PICK
    http_status: 409
    applies_to: "POST .../draft-picks"

  - priority: 9
    category: business_constraint
    check: "Only the most recent ACTIVE pick (highest overall_number) may be voided"
    error_id: ERR_NOT_LAST_PICK
    http_status: 409
    applies_to: "POST .../draft-picks/{id}/void"

  - priority: 10
    category: business_safety
    check: "Game cannot start without a CONFIRMED/CHECKED_IN referee"
    error_id: ERR_NO_REFEREE_CONFIRMED
    http_status: 409
    applies_to: "POST .../games/{id}/start"

  - priority: 11
    category: business_temporal
    check: "Referee confirming has no time-overlapping CONFIRMED/CHECKED_IN game (calc referee_time_overlap)"
    error_id: ERR_REFEREE_TIME_CONFLICT
    http_status: 409
    applies_to: "POST .../assignments/{id}/confirm"

  - priority: 12
    category: business_temporal
    check: "Field slot does not collide with another non-terminal Game on the same field (calc field_slot_overlap, includes turnover_buffer_minutes)"
    error_id: ERR_FIELD_SLOT_CONFLICT
    http_status: 409
    applies_to: "POST .../games (create), POST .../games/{id}/reschedule"

  - priority: 13
    category: business_constraint
    check: "Referee has not reached max_games_per_day CONFIRMED/CHECKED_IN assignments on the game's calendar day"
    error_id: ERR_REFEREE_DAY_LIMIT
    http_status: 409
    applies_to: "POST .../assignments/{id}/confirm"

  - priority: 14
    category: business_constraint
    check: "Team roster_count < division.roster_cap when drafting"
    error_id: ERR_ROSTER_FULL
    http_status: 409
    applies_to: "POST .../draft-picks"

  - priority: 15
    category: business_constraint
    check: "Game finalize requires non-equal runs (no ties)"
    error_id: ERR_TIE_NOT_ALLOWED
    http_status: 422
    applies_to: "POST .../games/{id}/finalize"

  - priority: 16
    category: business_constraint
    check: "guardian_email unique within league on Family create"
    error_id: ERR_DUPLICATE_FAMILY_EMAIL
    http_status: 409
    applies_to: "POST .../families"

  - priority: 17
    category: business_fiscal
    check: "OCC expected_<parent>_version matches current parent version"
    error_id: "ERR_STALE_LEAGUE_VERSION / ERR_STALE_GAME_VERSION"
    http_status: 412
    applies_to: "POST .../draft-picks, POST .../games/{id}/reschedule"

  - priority: 18
    category: business_constraint
    check: "Request body field types / required fields valid (enum membership, numeric ranges, missing required)"
    error_id: ERR_INVALID_REQUEST
    http_status: 400
    applies_to: all

# =============================================================================
# 1.5 API Endpoint Table
# =============================================================================
endpoints:
  # Flat topology: every entity is a top-level collection /<segment> with a
  # single-resource GET /<segment>/{id} and a filtered-list GET /<segment>?<fk>=.
  # Parent ids are carried in the request body / query, not in the URL path.

  # ---- League ----
  - method: POST
    path: "/leagues"
    description: "Create a league (status=SETUP)"
    roles: [LeagueAdmin]
    code: 201
    input: [name, season_year, age_cutoff_date, registration_open_iso, registration_close_iso, "draft_snake?"]
    output: League
    side_effects: ["status=SETUP, version=1"]

  - method: GET
    path: "/leagues/{leagueId}"
    description: "Get a league"
    roles: [LeagueAdmin, Coach, Referee, ParentGuardian]
    code: 200
    input: []
    output: League
    side_effects: []

  - method: POST
    path: "/leagues/{leagueId}/advance"
    description: "Advance league lifecycle to the next status"
    roles: [LeagueAdmin]
    code: 200
    input: [target]
    output: League
    side_effects:
      - "League.status -> target (per state machine)"
      - "DRAFT->SEASON cascades DRAFTED players to ROSTERED"
      - "SEASON->PLAYOFFS computes Team.seed"
      - "PLAYOFFS->CLOSED settles each Family volunteer refund"
      - "increments League.version by 1"

  - method: POST
    path: "/_clock/set"
    description: "Test-driving: set the server's current UTC instant"
    roles: [LeagueAdmin]
    code: 200
    input: [now_iso]
    output: League
    side_effects: ["server clock set to now_iso for window checks"]

  # ---- Division ----
  - method: POST
    path: "/divisions"
    description: "Create a division"
    roles: [LeagueAdmin]
    code: 201
    input: [league_id, name, min_league_age, max_league_age, roster_cap]
    output: Division
    side_effects: []

  - method: GET
    path: "/divisions"
    description: "List divisions (filtered; FK reverse for Division.league_id)"
    roles: [LeagueAdmin, Coach, Referee, ParentGuardian]
    code: 200
    input: ["league_id?"]
    output: Division[]
    side_effects: []

  - method: GET
    path: "/divisions/{divisionId}"
    description: "Get a division"
    roles: [LeagueAdmin, Coach, Referee, ParentGuardian]
    code: 200
    input: []
    output: Division
    side_effects: []

  # ---- Family ----
  - method: POST
    path: "/families"
    description: "Create a family account with a refundable volunteer deposit"
    roles: [LeagueAdmin, ParentGuardian]
    code: 201
    input: [league_id, guardian_email, guardian_name, volunteer_deposit_cents]
    output: Family
    side_effects: ["volunteer_credit_cents=0"]

  - method: GET
    path: "/families"
    description: "List families (filtered; FK reverse for Family.league_id)"
    roles: [LeagueAdmin, ParentGuardian]
    code: 200
    input: ["league_id?"]
    output: Family[]
    side_effects: []

  - method: GET
    path: "/families/{familyId}"
    description: "Get a family (includes volunteer_credit_cents)"
    roles: [LeagueAdmin, ParentGuardian]
    code: 200
    input: []
    output: Family
    side_effects: []

  # ---- Player ----
  - method: POST
    path: "/players"
    description: "Register a player (status=REGISTERED); computes league_age"
    roles: [LeagueAdmin, ParentGuardian]
    code: 201
    input: [league_id, family_id, division_id, full_name, birth_date, "birth_certificate_ref?"]
    output: Player
    side_effects:
      - "league_age computed via calc league_age_computation"
      - "League.total_registered_players recomputed (+1)"
      - "increments League.version by 1"

  - method: GET
    path: "/players/{playerId}"
    description: "Get a player"
    roles: [LeagueAdmin, Coach, ParentGuardian]
    code: 200
    input: []
    output: Player
    side_effects: []

  - method: GET
    path: "/players"
    description: "List players (filtered; FK reverse for Player.league_id, Player.family_id, Player.division_id, Player.team_id)"
    roles: [LeagueAdmin, Coach, ParentGuardian]
    code: 200
    input: ["league_id?", "family_id?", "division_id?", "team_id?"]
    output: Player[]
    side_effects: []

  - method: POST
    path: "/players/{playerId}/verify-age"
    description: "Verify a player's age from birth certificate (REGISTERED->AGE_VERIFIED)"
    roles: [LeagueAdmin]
    code: 200
    input: []
    output: Player
    side_effects: ["status->AGE_VERIFIED if eligible", "increments Player.version by 1"]

  - method: POST
    path: "/players/{playerId}/evaluate"
    description: "Record evaluation scores (AGE_VERIFIED->EVALUATED); computes eval_score and tier"
    roles: [LeagueAdmin]
    code: 200
    input: [eval_speed, eval_hitting, eval_fielding]
    output: Player
    side_effects:
      - "eval_score and tier computed via calc evaluation_tier_score"
      - "status->EVALUATED"
      - "increments Player.version by 1"

  - method: POST
    path: "/players/{playerId}/withdraw"
    description: "Withdraw a player (->WITHDRAWN)"
    roles: [LeagueAdmin]
    code: 200
    input: []
    output: Player
    side_effects:
      - "status->WITHDRAWN"
      - "League.total_registered_players recomputed (-1)"
      - "increments Player.version by 1"

  # ---- Team ----
  - method: POST
    path: "/teams"
    description: "Create a team in a division"
    roles: [LeagueAdmin]
    code: 201
    input: [league_id, division_id, name, coach_user_id, draft_slot]
    output: Team
    side_effects: ["roster_count=0, wins=0, losses=0, run_differential=0"]

  - method: GET
    path: "/teams"
    description: "List teams (filtered; FK reverse for Team.league_id and Team.division_id)"
    roles: [LeagueAdmin, Coach, Referee, ParentGuardian]
    code: 200
    input: ["league_id?", "division_id?"]
    output: Team[]
    side_effects: []

  - method: GET
    path: "/teams/{teamId}"
    description: "Get a team (standings + seed)"
    roles: [LeagueAdmin, Coach, Referee, ParentGuardian]
    code: 200
    input: []
    output: Team
    side_effects: []

  # ---- DraftPick ----
  - method: POST
    path: "/draft-picks"
    description: "Record a snake-draft pick (drafts a player onto a team)"
    roles: [LeagueAdmin, Coach]
    code: 201
    input: [league_id, team_id, player_id, expected_league_version]
    output: DraftPick
    side_effects:
      - "Player EVALUATED->DRAFTED (team_id set, Team.roster_count +=1)"
      - "round_number / overall_number assigned via calc snake_draft_order"
      - "increments League.version by 1"

  - method: GET
    path: "/draft-picks"
    description: "List draft picks (filtered; FK reverse for DraftPick.league_id, DraftPick.team_id, DraftPick.player_id)"
    roles: [LeagueAdmin, Coach]
    code: 200
    input: ["league_id?", "team_id?", "player_id?"]
    output: DraftPick[]
    side_effects: []

  - method: GET
    path: "/draft-picks/{pickId}"
    description: "Get a draft pick"
    roles: [LeagueAdmin, Coach]
    code: 200
    input: []
    output: DraftPick
    side_effects: []

  - method: POST
    path: "/draft-picks/{pickId}/void"
    description: "Void the most recent active draft pick (reopens the player)"
    roles: [LeagueAdmin]
    code: 200
    input: []
    output: DraftPick
    side_effects:
      - "status->VOIDED"
      - "Player DRAFTED->EVALUATED (team_id cleared, Team.roster_count -=1)"
      - "increments League.version by 1"

  # ---- Field ----
  - method: POST
    path: "/fields"
    description: "Create a field/venue"
    roles: [LeagueAdmin]
    code: 201
    input: [league_id, name, "turnover_buffer_minutes?"]
    output: Field
    side_effects: []

  - method: GET
    path: "/fields"
    description: "List fields (filtered; FK reverse for Field.league_id)"
    roles: [LeagueAdmin, Coach, Referee, ParentGuardian]
    code: 200
    input: ["league_id?"]
    output: Field[]
    side_effects: []

  - method: GET
    path: "/fields/{fieldId}"
    description: "Get a field"
    roles: [LeagueAdmin, Coach, Referee, ParentGuardian]
    code: 200
    input: []
    output: Field
    side_effects: []

  # ---- Referee ----
  - method: POST
    path: "/referees"
    description: "Register a referee in the league pool"
    roles: [LeagueAdmin]
    code: 201
    input: [league_id, user_id, full_name, "max_games_per_day?"]
    output: Referee
    side_effects: []

  - method: GET
    path: "/referees"
    description: "List referees (filtered; FK reverse for Referee.league_id)"
    roles: [LeagueAdmin, Referee]
    code: 200
    input: ["league_id?"]
    output: Referee[]
    side_effects: []

  - method: GET
    path: "/referees/{refereeId}"
    description: "Get a referee"
    roles: [LeagueAdmin, Referee]
    code: 200
    input: []
    output: Referee
    side_effects: []

  # ---- Game ----
  - method: POST
    path: "/games"
    description: "Schedule a game (status=SCHEDULED); field-slot overlap checked"
    roles: [LeagueAdmin]
    code: 201
    input: [league_id, division_id, home_team_id, away_team_id, field_id, start_iso, end_iso, "game_type?", "playoff_round?"]
    output: Game
    side_effects: ["status=SCHEDULED, rainout_count=0"]

  - method: GET
    path: "/games/{gameId}"
    description: "Get a game"
    roles: [LeagueAdmin, Coach, Referee, ParentGuardian]
    code: 200
    input: []
    output: Game
    side_effects: []

  - method: GET
    path: "/games"
    description: "List games (filtered; FK reverse for Game.league_id, Game.field_id, Game.home_team_id, Game.away_team_id, Game.division_id, Game.winner_team_id)"
    roles: [LeagueAdmin, Coach, Referee, ParentGuardian]
    code: 200
    input: ["league_id?", "field_id?", "home_team_id?", "away_team_id?", "division_id?", "winner_team_id?"]
    output: Game[]
    side_effects: []

  - method: POST
    path: "/games/{gameId}/start"
    description: "Start a game (SCHEDULED->IN_PROGRESS)"
    roles: [LeagueAdmin]
    code: 200
    input: []
    output: Game
    side_effects: ["status->IN_PROGRESS", "increments Game.version by 1"]

  - method: POST
    path: "/games/{gameId}/finalize"
    description: "Finalize a game with scores (IN_PROGRESS->FINAL); updates standings, advances playoff bracket"
    roles: [LeagueAdmin]
    code: 200
    input: [home_runs, away_runs]
    output: Game
    side_effects:
      - "winner_team_id set; both teams' wins/losses/run_differential updated"
      - "PLAYOFF loser eliminated"
      - "increments Game.version by 1"

  - method: POST
    path: "/games/{gameId}/rainout"
    description: "Mark a scheduled game rained out (SCHEDULED->RAINED_OUT)"
    roles: [LeagueAdmin]
    code: 200
    input: []
    output: Game
    side_effects:
      - "status->RAINED_OUT"
      - "non-terminal RefereeAssignments -> RELEASED"
      - "increments Game.version by 1"

  - method: POST
    path: "/games/{gameId}/reschedule"
    description: "Reschedule a rained-out game to a makeup slot (RAINED_OUT->SCHEDULED)"
    roles: [LeagueAdmin]
    code: 200
    input: [start_iso, end_iso, expected_game_version]
    output: Game
    side_effects:
      - "start_iso/end_iso updated; rainout_count +=1; status->SCHEDULED"
      - "field-slot overlap re-checked"
      - "increments Game.version by 1"

  - method: POST
    path: "/games/{gameId}/forfeit"
    description: "Forfeit a scheduled game (SCHEDULED->FORFEITED)"
    roles: [LeagueAdmin]
    code: 200
    input: [forfeiting_team_id]
    output: Game
    side_effects:
      - "winner_team_id set to non-forfeiting team; +1 win / +1 loss"
      - "non-terminal RefereeAssignments -> RELEASED"
      - "increments Game.version by 1"

  # ---- RefereeAssignment ----
  - method: POST
    path: "/assignments"
    description: "Propose a referee assignment to a game (status=PROPOSED)"
    roles: [LeagueAdmin]
    code: 201
    input: [game_id, referee_id, "role?"]
    output: RefereeAssignment
    side_effects: ["status=PROPOSED"]

  - method: GET
    path: "/assignments"
    description: "List assignments (filtered; FK reverse for RefereeAssignment.game_id and RefereeAssignment.referee_id)"
    roles: [LeagueAdmin, Referee]
    code: 200
    input: ["game_id?", "referee_id?"]
    output: RefereeAssignment[]
    side_effects: []

  - method: GET
    path: "/assignments/{assignmentId}"
    description: "Get a referee assignment"
    roles: [LeagueAdmin, Referee]
    code: 200
    input: []
    output: RefereeAssignment
    side_effects: []

  - method: POST
    path: "/assignments/{assignmentId}/confirm"
    description: "Referee confirms an assignment (PROPOSED->CONFIRMED); day-limit + time-overlap checked"
    roles: [Referee]
    code: 200
    input: []
    output: RefereeAssignment
    side_effects: ["status->CONFIRMED", "increments RefereeAssignment.version by 1"]

  - method: POST
    path: "/assignments/{assignmentId}/decline"
    description: "Referee declines an assignment (PROPOSED->DECLINED)"
    roles: [Referee]
    code: 200
    input: []
    output: RefereeAssignment
    side_effects: ["status->DECLINED", "increments RefereeAssignment.version by 1"]

  - method: POST
    path: "/assignments/{assignmentId}/check-in"
    description: "Referee checks in (CONFIRMED->CHECKED_IN)"
    roles: [Referee]
    code: 200
    input: []
    output: RefereeAssignment
    side_effects: ["status->CHECKED_IN", "increments RefereeAssignment.version by 1"]

  - method: POST
    path: "/assignments/{assignmentId}/release"
    description: "Release a confirmed assignment (CONFIRMED->RELEASED)"
    roles: [LeagueAdmin]
    code: 200
    input: []
    output: RefereeAssignment
    side_effects: ["status->RELEASED", "increments RefereeAssignment.version by 1"]

  # ---- VolunteerCommitment ----
  - method: POST
    path: "/volunteer-commitments"
    description: "A family pledges a volunteer shift for a game (status=PLEDGED)"
    roles: [LeagueAdmin, ParentGuardian]
    code: 201
    input: [game_id, family_id, role, credit_cents]
    output: VolunteerCommitment
    side_effects: ["status=PLEDGED"]

  - method: GET
    path: "/volunteer-commitments"
    description: "List commitments (filtered; FK reverse for VolunteerCommitment.game_id and VolunteerCommitment.family_id)"
    roles: [LeagueAdmin, ParentGuardian]
    code: 200
    input: ["game_id?", "family_id?"]
    output: VolunteerCommitment[]
    side_effects: []

  - method: GET
    path: "/volunteer-commitments/{commitmentId}"
    description: "Get a volunteer commitment"
    roles: [LeagueAdmin, ParentGuardian]
    code: 200
    input: []
    output: VolunteerCommitment
    side_effects: []

  - method: POST
    path: "/volunteer-commitments/{commitmentId}/fulfill"
    description: "Mark a commitment fulfilled (PLEDGED->FULFILLED); accrues capped family credit"
    roles: [LeagueAdmin]
    code: 200
    input: []
    output: VolunteerCommitment
    side_effects:
      - "Family.volunteer_credit_cents increased per calc volunteer_credit_accrual"
      - "increments VolunteerCommitment.version by 1"

  - method: POST
    path: "/volunteer-commitments/{commitmentId}/mark-no-show"
    description: "Mark a commitment no-show (PLEDGED->NO_SHOW); no credit"
    roles: [LeagueAdmin]
    code: 200
    input: []
    output: VolunteerCommitment
    side_effects: ["status->NO_SHOW", "increments VolunteerCommitment.version by 1"]

# =============================================================================
# 1.6 Error Code Catalog
# =============================================================================
errors:
  - { id: ERR_UNAUTHENTICATED, http: 401, condition: "Missing X-User-Role or X-User-ID header" }
  - { id: ERR_FORBIDDEN, http: 403, condition: "Role not permitted for the operation, or acting on a resource the entity_backed role does not own" }
  - { id: ERR_NOT_FOUND, http: 404, condition: "Referenced resource does not exist within scope" }
  - { id: ERR_INVALID_REQUEST, http: 400, condition: "Malformed body, missing required field, bad enum, or numeric out of allowed range" }
  - { id: ERR_FK_SCOPE_MISMATCH, http: 422, condition: "A foreign key references an entity in a different league/division than required" }
  - { id: ERR_INVALID_STATE, http: 409, condition: "Resource or owning League not in a state permitting this operation" }
  - { id: ERR_REGISTRATION_WINDOW_CLOSED, http: 409, condition: "Registration mutation outside [registration_open_iso, registration_close_iso)" }
  - { id: ERR_AGE_OUT_OF_RANGE, http: 422, condition: "Player league_age outside the requested division's [min_league_age, max_league_age]" }
  - { id: ERR_NOT_YOUR_PICK, http: 409, condition: "Draft pick submitted by a team that is not on the clock in snake order" }
  - { id: ERR_NOT_LAST_PICK, http: 409, condition: "Attempt to void a pick that is not the most recent ACTIVE pick" }
  - { id: ERR_ROSTER_FULL, http: 409, condition: "Drafting would exceed division.roster_cap for the team" }
  - { id: ERR_NO_REFEREE_CONFIRMED, http: 409, condition: "Game start attempted with no CONFIRMED/CHECKED_IN referee" }
  - { id: ERR_REFEREE_TIME_CONFLICT, http: 409, condition: "Referee confirm collides in time with another CONFIRMED/CHECKED_IN game" }
  - { id: ERR_REFEREE_DAY_LIMIT, http: 409, condition: "Referee already holds max_games_per_day CONFIRMED/CHECKED_IN assignments that day" }
  - { id: ERR_FIELD_SLOT_CONFLICT, http: 409, condition: "Game slot overlaps another non-terminal game on the same field within turnover buffer" }
  - { id: ERR_TIE_NOT_ALLOWED, http: 422, condition: "Finalize with equal home_runs and away_runs" }
  - { id: ERR_DUPLICATE_FAMILY_EMAIL, http: 409, condition: "guardian_email already used within the league" }
  - { id: ERR_STALE_LEAGUE_VERSION, http: 412, condition: "expected_league_version does not match current League.version on a draft pick" }
  - { id: ERR_STALE_GAME_VERSION, http: 412, condition: "expected_game_version does not match current Game.version on a reschedule" }

# =============================================================================
# 1.7 RBAC Matrix
# =============================================================================
roles:
  - name: LeagueAdmin
    description: "League operator: runs registration, age verification, evaluation, draft administration, scheduling, finalization, rainout/makeup, playoff advance, volunteer settlement."
    identity: "opaque"
    exclusive_operations:
      - "POST /leagues — create league"
      - "POST /leagues/{id}/advance — advance lifecycle"
      - "POST .../divisions — create division"
      - "POST .../divisions/{id}/teams — create team"
      - "POST .../players/{id}/verify-age — age verification"
      - "POST .../players/{id}/evaluate — record evaluation"
      - "POST .../players/{id}/withdraw — withdraw player"
      - "POST .../draft-picks/{id}/void — void a draft pick"
      - "POST .../fields — create field"
      - "POST .../referees — register referee"
      - "POST .../games — schedule game"
      - "POST .../games/{id}/start|finalize|rainout|reschedule|forfeit — game ops"
      - "POST .../games/{id}/assignments — propose assignment"
      - "POST .../assignments/{id}/release — release assignment"
      - "POST .../volunteer-commitments/{id}/fulfill|mark-no-show — settle commitments"
      - "POST .../_clock/set — test clock"
    shared_operations:
      - "POST .../players — register player (with ParentGuardian)"
      - "POST .../families — create family (with ParentGuardian)"
      - "POST .../draft-picks — record draft pick (with Coach)"
      - "POST .../volunteer-commitments — pledge shift (with ParentGuardian)"
      - "GET endpoints"

  - name: Coach
    description: "Team coach: makes draft picks for their own team and reads rosters/schedule. Identity is an opaque coach id matched against Team.coach_user_id for ownership."
    identity: "opaque"
    exclusive_operations: []
    shared_operations:
      - "POST .../draft-picks — record draft pick for own team (Team.coach_user_id == X-User-ID); shared with LeagueAdmin"
      - "GET .../players, GET .../teams, GET .../games, GET .../draft-picks, GET .../divisions, GET .../fields, GET .../leagues/{id}"

  - name: Referee
    description: "Umpire: confirms/declines/checks-in their own assignments and reads schedule. Entity-backed by Referee; X-User-ID equals Referee.user_id."
    identity: "entity_backed:Referee"
    exclusive_operations:
      - "POST .../assignments/{id}/confirm — confirm own assignment"
      - "POST .../assignments/{id}/decline — decline own assignment"
      - "POST .../assignments/{id}/check-in — check in to own assignment"
    shared_operations:
      - "GET .../assignments, GET .../referees, GET .../games, GET .../fields, GET .../teams, GET .../divisions, GET .../leagues/{id}"

  - name: ParentGuardian
    description: "Parent/guardian: registers own players, creates own family, pledges volunteer shifts, reads own children. Entity-backed by Family; X-User-ID equals Family.id."
    identity: "entity_backed:Family"
    exclusive_operations: []
    shared_operations:
      - "POST .../families — create own family (with LeagueAdmin)"
      - "POST .../players — register own player under own family (with LeagueAdmin)"
      - "POST .../volunteer-commitments — pledge own family shift (with LeagueAdmin)"
      - "GET .../players, GET .../families, GET .../volunteer-commitments, GET .../games, GET .../divisions, GET .../fields, GET .../leagues/{id}"
