              as: ChangeManager
              as_user_id: "u-cm-1"
          assert:
            - "the first trigger call returns 409 with error.code == ERR_MOP_WINDOW_CONFLICT (priority 21 outranks priority 37)"
            - "the second trigger call returns 422 with error.code == ERR_TENANT_NOTIFICATION_INCOMPLETE — rule 37 is live, it was merely outranked"
            - "MethodOfProcedure.${mop2_id}.status == APPROVED and MethodOfProcedure.${mop2_id}.tenant_notified_ids == [] (the rejected schedule stored nothing)"
            - "MethodOfProcedure.${mop3_id}.status == APPROVED and MethodOfProcedure.${mop3_id}.tenant_notified_ids == []"
            - "MethodOfProcedure.${mop1_id}.status == SCHEDULED and Hall.${hall_id}.open_mop_count == 1"
            - "MethodOfProcedure.${mop2_id}.approval_count == 2 and MethodOfProcedure.${mop2_id}.required_approval_count == 2"
            - "Hall.${hall_id}.release_posture == OPEN (a SCHEDULED MOP alone does not lock the hall)"

  - rule_id: boundary_precision_check
    instances:

      - name: busway_capacity_equality_admits_feed_at_exact_usable_kw
        grounds:
          - validations[priority=44]
          - calculations.busway_usable_kw
          - calculations.hall_power_ledger
          - entities.RackFeed.fields.allocated_kw
        distinguishing_aspect: |
          The busway gate compares committed_kw + round(requested_kw, 3) against the PUBLISHED usable_kw
          (196.66), not against the unrounded trunk term 196.658208, and it compares with <=. A 196.66 kW
          reservation is therefore admitted at exact equality even though it exceeds the unrounded value by
          0.001792 kW, while the very next 0.01 kW is refused with ERR_BUSWAY_CAPACITY_EXCEEDED. An
          implementation that gates on the unrounded number, or that uses <, rejects the first call.
        test_recipe:
          setup:
            - "Hall HM1 (design_kw_capacity 400.00) is in FIT_OUT with PDU-A1 (300.00 kW) and PDU-B1, plus containment zone CA-1."
            - "Busway BW-A1 (400 A / 415 V / N_PLUS_1) has raw_kw 273.136, usable_variant DESIGN and usable_kw 196.66 (unrounded trunk term 196.658208, PDU ceiling 240.000)."
            - "Racks R-1-1 and R-1-2 (each required_feed_count 1) are PLANNED and BW-A1 has committed_kw 0.000."
          setup_api_calls:
            - call: "POST /halls"
              payload: { name: "Data Hall M", code: "HM1", tenant_mode: "SINGLE_TENANT", design_kw_capacity: 400.00, gross_area_sqm: 600.0, cooling_redundancy: "N", planned_rack_count: 6 }
              as: FacilityPlanner
              captures: { hall_id: $.data.id }
            - call: "POST /pdus"
              payload: { hall_id: "${hall_id}", name: "PDU-A1", feed_side: "A", rated_kw: 300.00 }
              as: ElectricalContractor
              captures: { pdu_a_id: $.data.id }
            - call: "POST /pdus"
              payload: { hall_id: "${hall_id}", name: "PDU-B1", feed_side: "B", rated_kw: 300.00 }
              as: ElectricalContractor
              captures: { pdu_b_id: $.data.id }
            - call: "POST /busways"
              payload: { pdu_id: "${pdu_a_id}", name: "BW-A1", rated_amps: 400, voltage_v: 415, redundancy_topology: "N_PLUS_1" }
              as: ElectricalContractor
              captures: { bw_a_id: $.data.id }
            - call: "POST /containment-zones"
              payload: { hall_id: "${hall_id}", label: "CA-1", zone_type: "COLD_AISLE", containment_kind: "RIGID_ROOF", target_leakage_pct: 5.00, design_static_pressure_pa: 20.00 }
              as: MechanicalContractor
              captures: { zone1_id: $.data.id }
            - call: "POST /racks"
              payload: { hall_id: "${hall_id}", containment_zone_id: "${zone1_id}", grid_row: "1", grid_col: 1, design_kw: 200.00, u_height: 45, required_feed_count: 1 }
              as: FacilityPlanner
              captures: { rack1_id: $.data.id }
            - call: "POST /racks"
              payload: { hall_id: "${hall_id}", containment_zone_id: "${zone1_id}", grid_row: "1", grid_col: 2, design_kw: 10.00, u_height: 45, required_feed_count: 1 }
              as: FacilityPlanner
              captures: { rack2_id: $.data.id }
            - call: "POST /halls/${hall_id}/advance-phase"
              payload: { target_status: "FIT_OUT" }
              as: FacilityPlanner
          trigger:
            - call: "POST /rack-feeds"
              payload: { rack_id: "${rack1_id}", busway_id: "${bw_a_id}", feed_side: "A", requested_kw: 196.66, breaker_amps: 400 }
              as: ElectricalContractor
              captures: { feed_a_id: $.data.id }
            - call: "POST /rack-feeds"
              payload: { rack_id: "${rack2_id}", busway_id: "${bw_a_id}", feed_side: "A", requested_kw: 0.01, breaker_amps: 32 }
              as: ElectricalContractor
          assert:
            - "the first trigger call returns 201; RackFeed.${feed_a_id}.status == RESERVED and RackFeed.${feed_a_id}.allocated_kw == 196.660 (exact equality with usable_kw is admitted)"
            - "the second trigger call returns 422 with error.code == ERR_BUSWAY_CAPACITY_EXCEEDED (196.670 > 196.66)"
            - "Busway.${bw_a_id}.committed_kw == 196.660 and Busway.${bw_a_id}.feed_count == 1"
            - "Busway.${bw_a_id}.usable_kw == 196.66 and Busway.${bw_a_id}.raw_kw == 273.136 (unchanged by the reservation)"
            - "Hall.${hall_id}.committed_kw == 196.66, Hall.${hall_id}.commissioning_reserve_kw == 50.00 and Hall.${hall_id}.spare_kw == 153.34"
            - "Rack.${rack1_id}.connected_kw == 196.660 and Rack.${rack2_id}.connected_kw == 0.000"
            - "neither call returns ERR_BREAKER_DERATE_EXCEEDED: a 400 A breaker admits 218.51 kW"

      - name: cage_camera_coverage_empty_device_set_yields_zero_pct
        grounds:
          - calculations.cage_security_coverage
          - entities.Cage.fields.camera_coverage_pct
          - entities.Cage.fields.active_reader_zone_count
          - state_machines.Cage.FIT_OUT_to_SECURED
          - state_machines.SecurityDevice.PLANNED_to_ACTIVE
        distinguishing_aspect: |
          Three boundaries in one cage: the empty-ACTIVE-set case must yield exactly 0.00 (not a division
          artefact and not the PLANNED camera's 38.0 m), the SECURED gate must fire at exact equality when
          coverage reaches 95.00 against a required 95.00, and the min(100.00, …) cap must hold when a
          second camera pushes raw coverage to 120.00. A PLANNED camera contributing to coverage, a
          strictly-greater gate, or a missing cap each break exactly one of the three.
        test_recipe:
          setup:
            - "Hall HN1 is in PLANNING with tenant T1 and cage CG-1 (perimeter_length_m 40.0, required_camera_coverage_pct 95.00 by default, required_reader_zone_count 2 by default)."
            - "Camera CAM-1 (covered_length_m 38.0) and card readers RDR-N (zone Z-N) and RDR-S (zone Z-S) exist but are all PLANNED."
            - "Cage CG-1 therefore has camera_coverage_pct 0.00, active_reader_zone_count 0 and operational_status FIT_OUT."
          setup_api_calls:
            - call: "POST /halls"
              payload: { name: "Data Hall N", code: "HN1", tenant_mode: "MULTI_TENANT", design_kw_capacity: 400.00, gross_area_sqm: 600.0, cooling_redundancy: "N", planned_rack_count: 6 }
              as: FacilityPlanner
              captures: { hall_id: $.data.id }
            - call: "POST /tenants"
              payload: { name: "Northwind Systems", code: "T1", contracted_kw: 200.00, contract_start_date: "2026-01-01T00:00:00Z" }
              as: FacilityPlanner
              captures: { t1_id: $.data.id }
            - call: "POST /cages"
              payload: { hall_id: "${hall_id}", tenant_id: "${t1_id}", label: "CG-1", perimeter_length_m: 40.0 }
              as: SecurityAdministrator
              captures: { cage1_id: $.data.id }
            - call: "POST /security-devices"
              payload: { cage_id: "${cage1_id}", device_type: "CAMERA", label: "CAM-1", covered_length_m: 38.0 }
              as: SecurityAdministrator
              captures: { cam1_id: $.data.id }
            - call: "POST /security-devices"
              payload: { cage_id: "${cage1_id}", device_type: "CARD_READER", label: "RDR-N", reader_zone_label: "Z-N" }
              as: SecurityAdministrator
              captures: { rdr_n_id: $.data.id }
            - call: "POST /security-devices"
              payload: { cage_id: "${cage1_id}", device_type: "CARD_READER", label: "RDR-S", reader_zone_label: "Z-S" }
              as: SecurityAdministrator
              captures: { rdr_s_id: $.data.id }
          trigger:
            - call: "POST /security-devices/${rdr_n_id}/commission"
              payload: {}
              as: SecurityAdministrator
            - call: "POST /security-devices/${rdr_s_id}/commission"
              payload: {}
              as: SecurityAdministrator
            - call: "GET /cages/${cage1_id}"
              payload: {}
              as: SecurityAdministrator
              captures: { cov_before_cam: $.data.camera_coverage_pct, status_before_cam: $.data.operational_status }
            - call: "POST /security-devices/${cam1_id}/commission"
              payload: {}
              as: SecurityAdministrator
            - call: "GET /cages/${cage1_id}"
              payload: {}
              as: SecurityAdministrator
              captures: { cov_at_boundary: $.data.camera_coverage_pct, status_at_boundary: $.data.operational_status }
            - call: "POST /security-devices"
              payload: { cage_id: "${cage1_id}", device_type: "CAMERA", label: "CAM-2", covered_length_m: 10.0 }
              as: SecurityAdministrator
              captures: { cam2_id: $.data.id }
            - call: "POST /security-devices/${cam2_id}/commission"
              payload: {}
              as: SecurityAdministrator
          assert:
            - "${cov_before_cam} == 0.00 — with two ACTIVE readers but no ACTIVE camera the camera set is empty, so coverage is exactly 0.00 and the PLANNED CAM-1's 38.0 m contributes nothing"
            - "${status_before_cam} == FIT_OUT (the reader floor alone does not secure the cage)"
            - "${cov_at_boundary} == 95.00 — 38.0 / 40.0 * 100 lands exactly on the required_camera_coverage_pct"
            - "${status_at_boundary} == SECURED — the gate is >=, so exact equality secures the cage"
            - "Cage.${cage1_id}.camera_coverage_pct == 100.00 after CAM-2 (raw 48.0 / 40.0 * 100 == 120.00 is capped by min(100.00, …))"
            - "Cage.${cage1_id}.active_reader_zone_count == 2 and Cage.${cage1_id}.operational_status == SECURED"
            - "SecurityDevice.${cam1_id}.status == ACTIVE and SecurityDevice.${cam2_id}.status == ACTIVE"

  - rule_id: cross_entity_state_dependency
    instances:

      - name: rack_power_on_requires_both_feed_busways_energized
        grounds:
          - validations[priority=18]
          - validations[priority=17]
          - state_machines.Rack.INSTALLED_to_POWERED
          - state_machines.Busway.PLANNED_to_ENERGIZED
          - state_machines.PowerDistributionUnit.PLANNED_to_COMMISSIONED
        distinguishing_aspect: |
          Powering a rack depends on the status of entities two hops away: every RESERVED feed's Busway
          must be ENERGIZED, and a Busway can only be energized once its parent PDU is COMMISSIONED. With
          PDU-B1 still PLANNED the rack's own fields are all valid yet power-on fails with
          ERR_BUSWAY_NOT_ENERGIZED, and energizing BW-B1 first fails with ERR_PDU_NOT_COMMISSIONED — the
          same rack succeeds only after the two upstream entities move, with nothing about the rack changed.
        test_recipe:
          setup:
            - "Hall HO1 (design_kw_capacity 400.00, cooling_redundancy N) is in FIT_OUT with containment zone CA-1 at leakage_status PASS and cooling unit CU-1 (120.00 kW / 22000 cfm / dT 18.0 F) IN_SERVICE."
            - "PDU-A1 is COMMISSIONED (measured_derate_factor 1.00) and its busway BW-A1 is ENERGIZED."
            - "PDU-B1 is still PLANNED, so its busway BW-B1 is still PLANNED."
            - "Rack R-1-1 (design_kw 15.00, required_feed_count 2) is INSTALLED with a 7.50 kW RESERVED feed on BW-A1 (side A) and a 7.50 kW RESERVED feed on BW-B1 (side B)."
          setup_api_calls:
            - call: "POST /halls"
              payload: { name: "Data Hall O", code: "HO1", tenant_mode: "SINGLE_TENANT", design_kw_capacity: 400.00, gross_area_sqm: 600.0, cooling_redundancy: "N", planned_rack_count: 8 }
              as: FacilityPlanner
              captures: { hall_id: $.data.id }
            - call: "POST /pdus"
              payload: { hall_id: "${hall_id}", name: "PDU-A1", feed_side: "A", rated_kw: 300.00 }
              as: ElectricalContractor
              captures: { pdu_a_id: $.data.id }
            - call: "POST /pdus"
              payload: { hall_id: "${hall_id}", name: "PDU-B1", feed_side: "B", rated_kw: 300.00 }
              as: ElectricalContractor
              captures: { pdu_b_id: $.data.id }
            - call: "POST /busways"
              payload: { pdu_id: "${pdu_a_id}", name: "BW-A1", rated_amps: 400, voltage_v: 415, redundancy_topology: "N_PLUS_1" }
              as: ElectricalContractor
              captures: { bw_a_id: $.data.id }
            - call: "POST /busways"
              payload: { pdu_id: "${pdu_b_id}", name: "BW-B1", rated_amps: 400, voltage_v: 415, redundancy_topology: "N_PLUS_1" }
              as: ElectricalContractor
              captures: { bw_b_id: $.data.id }
            - call: "POST /containment-zones"
              payload: { hall_id: "${hall_id}", label: "CA-1", zone_type: "COLD_AISLE", containment_kind: "RIGID_ROOF", target_leakage_pct: 5.00, design_static_pressure_pa: 20.00 }
              as: MechanicalContractor
              captures: { zone1_id: $.data.id }
            - call: "POST /cooling-units"
              payload: { hall_id: "${hall_id}", name: "CU-1", rated_sensible_kw: 120.00, design_airflow_cfm: 22000, supply_delta_t_f: 18.0, redundancy_role: "PRIMARY" }
              as: MechanicalContractor
              captures: { cu1_id: $.data.id }
            - call: "POST /racks"
              payload: { hall_id: "${hall_id}", containment_zone_id: "${zone1_id}", grid_row: "1", grid_col: 1, design_kw: 15.00, u_height: 45, required_feed_count: 2 }
              as: FacilityPlanner
              captures: { rack1_id: $.data.id }
            - call: "POST /halls/${hall_id}/advance-phase"
              payload: { target_status: "FIT_OUT" }
              as: FacilityPlanner
            - call: "POST /containment-zones/${zone1_id}/leakage-test"
              payload: { measured_leakage_pct: 5.00, measured_static_pressure_pa: 20.00 }
              as: MechanicalContractor
            - call: "POST /cooling-units/${cu1_id}/commission"
              payload: { measured_airflow_cfm: 22000 }
              as: MechanicalContractor
            - call: "POST /cooling-units/${cu1_id}/place-in-service"
              payload: {}
              as: MechanicalContractor
            - call: "PATCH /pdus/${pdu_a_id}"
              payload: { measured_derate_factor: 1.00 }
              as: ElectricalContractor
            - call: "POST /busways/${bw_a_id}/energize"
              payload: {}
              as: ElectricalContractor
            - call: "POST /rack-feeds"
              payload: { rack_id: "${rack1_id}", busway_id: "${bw_a_id}", feed_side: "A", requested_kw: 7.50, breaker_amps: 32 }
              as: ElectricalContractor
              captures: { feed_a_id: $.data.id }
            - call: "POST /rack-feeds"
              payload: { rack_id: "${rack1_id}", busway_id: "${bw_b_id}", feed_side: "B", requested_kw: 7.50, breaker_amps: 32 }
              as: ElectricalContractor
              captures: { feed_b_id: $.data.id }
            - call: "POST /racks/${rack1_id}/install"
              payload: { asset_tag: "AT-0001" }
              as: FacilityPlanner
          trigger:
            - call: "POST /racks/${rack1_id}/power-on"
              payload: {}
              as: ElectricalContractor
            - call: "POST /busways/${bw_b_id}/energize"
              payload: {}
              as: ElectricalContractor
            - call: "PATCH /pdus/${pdu_b_id}"
              payload: { measured_derate_factor: 1.00 }
              as: ElectricalContractor
            - call: "POST /busways/${bw_b_id}/energize"
              payload: {}
              as: ElectricalContractor
            - call: "POST /racks/${rack1_id}/power-on"
              payload: {}
              as: ElectricalContractor
          assert:
            - "trigger call 1 returns 409 with error.code == ERR_BUSWAY_NOT_ENERGIZED (the side-B feed sits on a PLANNED busway)"
            - "trigger call 2 returns 409 with error.code == ERR_PDU_NOT_COMMISSIONED (BW-B1 cannot be energized while PDU-B1 is PLANNED)"
            - "after trigger call 3, PowerDistributionUnit.${pdu_b_id}.status == COMMISSIONED and PowerDistributionUnit.${pdu_b_id}.usable_cap_kw == 240.000"
            - "after trigger call 4, Busway.${bw_b_id}.status == ENERGIZED and Busway.${bw_b_id}.usable_kw == 196.66"
            - "trigger call 5 returns 200; Rack.${rack1_id}.status == POWERED and Rack.${rack1_id}.energized_feed_count == 2"
            - "RackFeed.${feed_a_id}.status == ENERGIZED and RackFeed.${feed_b_id}.status == ENERGIZED"
            - "Hall.${hall_id}.custody_ops_count == 1, Hall.${hall_id}.custody_fitout_count == 0 and Hall.${hall_id}.committed_kw == 15.00"
            - "Hall.${hall_id}.thermal_load_kw == 12.75, Hall.${hall_id}.cooling_margin_kw == 106.33 and Hall.${hall_id}.thermal_posture == NOMINAL"

      - name: package_witness_requires_hall_thermal_posture_nominal
        grounds:
          - validations[priority=33]
          - state_machines.CommissioningPackage.witness_status_PENDING_to_WITNESSED
          - state_machines.ContainmentZone.FAIL_to_REMEDIATION
          - calculations.hall_cooling_model
          - calculations.package_state_projection
        distinguishing_aspect: |
          The witness decision on a package depends on a hall-level derived field that is produced by a
          third entity type: a failing ContainmentZone drives thermal_posture to CONSTRAINED and the
          witness is refused with ERR_THERMAL_POSTURE_NOT_NOMINAL even though the package's own
