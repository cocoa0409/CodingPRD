  # ===========================================================================
  - section: validations
    instances:

      - name: missing_auth_headers_returns_unauthenticated
        claim_type: Violation → Error
        grounds:
          - validations[priority=1]
          - "errors[ERR_UNAUTHENTICATED]"
        distinguishing_aspect: "A request without X-User-Role / X-User-ID is a 401 ERR_UNAUTHENTICATED before any role or existence check runs."
        test_recipe:
          setup:
            - "Logical clock set; customer exists."
          setup_api_calls:
            - *c_clock
            - *c_cust
          trigger:
            - call: "GET /evfleet/fleet-customers/${cust_id}"
              payload: {}
          assert:
            - "status 401 with data.error_id == ERR_UNAUTHENTICATED (no X-User-Role / X-User-ID headers sent)"

      - name: fleet_manager_cannot_register_supplier_forbidden
        claim_type: Violation → Error
        grounds:
          - validations[priority=2]
          - "errors[ERR_FORBIDDEN]"
        distinguishing_aspect: "Role scoping: FleetManager is not in POST /evfleet/suppliers roles — 403 ERR_FORBIDDEN even though the caller is authenticated."
        test_recipe:
          setup:
            - "Logical clock set; customer exists."
          setup_api_calls:
            - *c_clock
            - *c_cust
          trigger:
            - call: "POST /evfleet/suppliers"
              payload: { name: "Sneaky Cells", contact_email: "x@sneaky.test" }
              as: FleetManager
              as_user_id: "${cust_id}"
              captures: { err: $.data.error_id }
          assert:
            - "status 403 and err == ERR_FORBIDDEN"
            - "no Supplier row created (authorization runs before persistence)"

      - name: stale_depot_version_rejected_on_project_create
        claim_type: Violation → Error
        grounds:
          - validations[priority=5]
          - concurrency_rules[charging-project-create-stale-depot]
          - "errors[ERR_STALE_VERSION]"
        distinguishing_aspect: "OCC on Depot.version: after a first project create bumps the depot to version 2, a second create carrying the stale captured version 1 is rejected 412 ERR_STALE_VERSION."
        test_recipe:
          setup:
            - "Logical clock set; customer and depot (500 kW, version 1) exist; project P1 created with the fresh version."
          setup_api_calls:
            - *c_clock
            - *c_cust
            - *c_depot
            - call: "POST /evfleet/charging-projects"
              payload: { depot_id: "${depot_id}", requested_capacity_kw: 40, install_window_start: "2026-10-01T00:00:00Z", install_window_end: "2026-10-10T00:00:00Z", crew_count: 1, expected_depot_version: "${depot_v}" }
              as: FleetManager
              as_user_id: "${cust_id}"
              captures: { cp1_id: $.data.id }
          trigger:
            - call: "POST /evfleet/charging-projects"
              payload: { depot_id: "${depot_id}", requested_capacity_kw: 30, install_window_start: "2026-11-01T00:00:00Z", install_window_end: "2026-11-08T00:00:00Z", crew_count: 1, expected_depot_version: "${depot_v}" }
              as: FleetManager
              as_user_id: "${cust_id}"
              captures: { err: $.data.error_id }
          assert:
            - "err == ERR_STALE_VERSION with status 412 (depot version advanced to 2 by P1; the replayed ${depot_v} is stale)"
            - "GET /evfleet/depots/${depot_id}/charging-projects returns exactly 1 project"

      - name: stale_order_version_rejected_on_vin_registration
        claim_type: Violation → Error
        grounds:
          - validations[priority=5]
          - concurrency_rules[vehicle-register-stale-order]
          - "errors[ERR_STALE_VERSION]"
        distinguishing_aspect: "OCC on VehicleOrder.version: after vehicle 1's registration bumps the order version, replaying the pre-registration version on vehicle 2's registration fails 412; refetching the version lets the identical registration through."
        test_recipe:
          setup:
            - "Logical clock set; base two-module order CONFIRMED (version 3); vehicle 1 registered (order now version 4)."
          setup_api_calls:
            - *c_clock
            - *c_cust
            - *c_depot
            - *c_sup
            - *c_mod1
            - *c_mod1_qa
            - *c_mod1_pass
            - *c_mod2
            - *c_mod2_qa
            - *c_mod2_pass
            - *c_order
            - *c_submit
            - *c_confirm
            - *c_veh1
          trigger:
            - call: "POST /evfleet/vehicles"
              payload: { vehicle_order_id: "${ord_id}", battery_module_id: "${mod2_id}", vin: "VIN-ACME-002", expected_vehicle_order_version: "${ord_v}" }
              as: ProductionPlanner
              as_user_id: "pp-1"
              captures: { err: $.data.error_id }
            - *c_read1
            - call: "POST /evfleet/vehicles"
              payload: { vehicle_order_id: "${ord_id}", battery_module_id: "${mod2_id}", vin: "VIN-ACME-002", expected_vehicle_order_version: "${ord_v3}" }
              as: ProductionPlanner
              as_user_id: "pp-1"
              captures: { veh2_ok: $.data.id }
          assert:
            - "err == ERR_STALE_VERSION (412) for the replayed ${ord_v}"
            - "after refetching, the registration succeeds: veh2_ok non-null, order registered_count == 2 and status FULFILLED"

      - name: franchise_hold_then_exemption_approval_succeeds
        claim_type: Satisfaction → Pass
        grounds:
          - validations[priority=8]
          - state_machines.VehicleOrder.FRANCHISE_HOLD_to_CONFIRMED
        distinguishing_aspect: "The franchise revert path works end-to-end: SUBMITTED -> FRANCHISE_HOLD on a TX depot, then CONFIRMED succeeds once exemption_document_ref is supplied — and promised_delivery_date is computed at that confirmation."
        test_recipe:
          setup:
            - "Logical clock 2026-09-01T00:00:00Z; customer with TX depot; supplier; DIRECT_DELIVERY order quantity 2, SUBMITTED."
          setup_api_calls:
            - *c_clock
            - *c_cust
            - call: "POST /evfleet/depots"
              payload: { fleet_customer_id: "${cust_id}", name: "Acme Depot TX", state_code: "TX", address: "7 Ranch Rd", total_capacity_kw: 500 }
              as: FleetManager
              as_user_id: "${cust_id}"
              captures: { depot_tx: $.data.id }
            - *c_sup
            - call: "POST /evfleet/vehicle-orders"
              payload: { fleet_customer_id: "${cust_id}", depot_id: "${depot_tx}", battery_supplier_id: "${sup_id}", quantity: 2, battery_pack_kwh: 77, telematics_tier: "STANDARD", delivery_method: "DIRECT_DELIVERY", requires_depot_charging: false }
              as: FleetManager
              as_user_id: "${cust_id}"
              captures: { ord_tx: $.data.id }
            - call: "POST /evfleet/vehicle-orders/${ord_tx}/transition"
              payload: { to_state: "SUBMITTED" }
              as: FleetManager
              as_user_id: "${cust_id}"
            - call: "POST /evfleet/vehicle-orders/${ord_tx}/transition"
              payload: { to_state: "FRANCHISE_HOLD" }
              as: ComplianceOfficer
              as_user_id: "co-1"
          trigger:
            - call: "POST /evfleet/vehicle-orders/${ord_tx}/transition"
              payload: { to_state: "CONFIRMED", exemption_document_ref: "TX-EXEMPT-2026-881" }
              as: ComplianceOfficer
              as_user_id: "co-1"
              captures: { st: $.data.status, prom: $.data.promised_delivery_date, exref: $.data.exemption_document_ref }
          assert:
            - "st == CONFIRMED (FRANCHISE_HOLD -> CONFIRMED with exemption is the legal revert path)"
            - "exref == \"TX-EXEMPT-2026-881\""
            - "prom == \"2026-10-06\" (promise computed at confirmation from the logical clock)"

