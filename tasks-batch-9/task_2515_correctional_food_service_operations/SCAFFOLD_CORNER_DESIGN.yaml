              payload: {}
              as: RegisteredDietitian
              as_user_id: "rd-001"
            - call: "POST /cfs/menu-cycles/${cycle_id}/activate"
              payload: {}
              as: ContractAdministrator
              as_user_id: "ca-001"
            - call: "POST /cfs/population-counts"
              payload: { facility_id: "${facility_id}", general_population: 10, segregation_population: 2, satellite_population: 1, medical_population: 0, source: "FORMAL_COUNT" }
              as: CorrectionalOfficer
              as_user_id: "co-001"
              captures: { count_id: $.data.id }
            - call: "POST /cfs/meal-forecasts"
              payload: { facility_id: "${facility_id}", population_count_id: "${count_id}", service_date: "2026-08-01", meal_slot: "LUNCH", forecast_variant: "COUNT_DRIVEN" }
              as: FoodServiceSupervisor
              as_user_id: "fs-001"
              captures: { forecast_id: $.data.id }
            - call: "POST /cfs/meal-forecasts/${forecast_id}/lock"
              payload: {}
              as: FoodServiceSupervisor
              as_user_id: "fs-001"
            - call: "POST /cfs/facilities/${facility_id}/sharps-audit"
              payload: { counted_on_board: 12 }
              as: CorrectionalOfficer
              as_user_id: "co-001"
