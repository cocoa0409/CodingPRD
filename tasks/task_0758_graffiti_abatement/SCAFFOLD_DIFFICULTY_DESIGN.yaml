              payload: { report_id: "${rep2}", crew_id: "${crew_b}", scheduled_start: "2026-03-05T20:00:00Z", scheduled_end: "2026-03-05T22:00:00Z", method: "PAINT_OVER", estimated_labor_hours: 2.0 }
              as: AbatementCoordinator
              captures: { err: $.data.error_id }
          assert:
            - "response.status == 409"
            - "response.data.error_id == ERR_SITE_ABATEMENT_BUFFER_CONFLICT"

  # =================================================================
  - rule_id: compensating_invariant
    instances:
      - name: material_reserve_release_conserves_total
        grounds:
          - state_machines.WorkOrder.SCHEDULED_to_CANCELLED
          - entities.Material.fields.quantity_available
          - entities.Material.fields.quantity_reserved
        distinguishing_aspect: "Conserved quantity = material volume: dispatch reserves 3.0 (available 7.0 / reserved 3.0), cancel releases it (available 10.0 / reserved 0.0); quantity_available + quantity_reserved stays 10.0 across the reserve+release pair."
        test_recipe:
          setup:
            - "PRIVATE site with owner, certified crew, material quantity_available=10.0; a report triaged then dispatched reserving 3.0 (available 7.0, reserved 3.0)."
          setup_api_calls:
            - call: "POST /abatement/property-owners"
              payload: { name: "Ivy Owner", mailing_address: "1 Elm St", contact_email: "ivy@x.com" }
              as: ProgramAdmin
              captures: { owner_id: $.data.id }
            - call: "POST /abatement/sites"
              payload: { ownership_type: "PRIVATE", address: "10 Maple Ave", latitude: 40.1, longitude: -74.1, property_owner_id: "${owner_id}" }
              as: AbatementCoordinator
              captures: { site_id: $.data.id }
            - call: "POST /abatement/materials"
              payload: { name: "Gray Paint", category: "PAINT", unit: "LITERS", unit_cost_cents: 1200, quantity_available: 10.0 }
              as: InventoryManager
              captures: { mat_id: $.data.id }
            - call: "POST /abatement/crews"
              payload: { name: "Crew A", crew_type: "CITY", is_offensive_certified: true }
              as: AbatementCoordinator
              captures: { crew_id: $.data.id }
            - call: "POST /abatement/reports"
              payload: { site_id: "${site_id}", reported_via: "PHONE_311", surface_type: "WALL", severity: "HIGH", description: "tag" }
              as: IntakeClerk
              captures: { rep_id: $.data.id }
            - call: "POST /abatement/reports/${rep_id}/triage"
              payload: {}
              as: IntakeClerk
            - call: "POST /abatement/work-orders"
              payload: { report_id: "${rep_id}", crew_id: "${crew_id}", scheduled_start: "2026-03-05T09:00:00Z", scheduled_end: "2026-03-05T12:00:00Z", method: "PAINT_OVER", estimated_labor_hours: 2.0, material_lines: [ { material_id: "${mat_id}", quantity: 3.0 } ] }
              as: AbatementCoordinator
              captures: { wo_id: $.data.id }
          trigger:
            - call: "POST /abatement/work-orders/${wo_id}/cancel"
              payload: { reason: "duplicate" }
              as: AbatementCoordinator
          assert:
            - "Material.${mat_id}.quantity_available == 10.0"
            - "Material.${mat_id}.quantity_reserved == 0.0"

      - name: recovery_assess_waive_conserves_outstanding
        grounds:
          - state_machines.CostRecovery.ASSESSED_to_WAIVED
          - calculations.outstanding_recovery_total
          - entities.Site.fields.outstanding_recovery_cents
        distinguishing_aspect: "Conserved quantity = money ledger: assessment credits site.outstanding_recovery_cents by 26565, waiving debits the same 26565 back to 0; outstanding equals the sum of active recoveries throughout, a different conserved quantity than material volume."
        test_recipe:
          setup:
            - "PRIVATE site fully remediated so its CostRecovery is ASSESSED (recoverable 26565) and site.outstanding_recovery_cents == 26565."
          setup_api_calls:
            - call: "POST /abatement/property-owners"
              payload: { name: "Ivy Owner", mailing_address: "1 Elm St", contact_email: "ivy@x.com" }
              as: ProgramAdmin
              captures: { owner_id: $.data.id }
            - call: "POST /abatement/sites"
              payload: { ownership_type: "PRIVATE", address: "10 Maple Ave", latitude: 40.1, longitude: -74.1, property_owner_id: "${owner_id}" }
              as: AbatementCoordinator
              captures: { site_id: $.data.id }
            - call: "POST /abatement/materials"
              payload: { name: "Gray Paint", category: "PAINT", unit: "LITERS", unit_cost_cents: 1200, quantity_available: 10.0 }
              as: InventoryManager
              captures: { mat_id: $.data.id }
            - call: "POST /abatement/crews"
              payload: { name: "Crew A", crew_type: "CITY", is_offensive_certified: true }
              as: AbatementCoordinator
              captures: { crew_id: $.data.id }
            - call: "POST /abatement/reports"
              payload: { site_id: "${site_id}", reported_via: "PHONE_311", surface_type: "WALL", severity: "HIGH", description: "tag" }
              as: IntakeClerk
              captures: { rep_id: $.data.id }
            - call: "POST /abatement/reports/${rep_id}/triage"
              payload: {}
              as: IntakeClerk
            - call: "POST /abatement/work-orders"
              payload: { report_id: "${rep_id}", crew_id: "${crew_id}", scheduled_start: "2026-03-05T09:00:00Z", scheduled_end: "2026-03-05T12:00:00Z", method: "PAINT_OVER", estimated_labor_hours: 2.5, material_lines: [ { material_id: "${mat_id}", quantity: 3.0 } ] }
              as: AbatementCoordinator
              captures: { wo_id: $.data.id }
            - call: "GET /abatement/cost-recoveries?work_order_id=${wo_id}"
              payload: {}
              as: AbatementCoordinator
              captures: { cr_id: "$.data[0].id" }
            - call: "POST /abatement/work-orders/${wo_id}/photos"
              payload: { phase: "BEFORE", url: "http://p/b.jpg" }
              as: CrewLead
              as_user_id: "${crew_id}"
            - call: "POST /abatement/work-orders/${wo_id}/start"
              payload: {}
              as: CrewLead
              as_user_id: "${crew_id}"
            - call: "POST /abatement/work-orders/${wo_id}/photos"
              payload: { phase: "AFTER", url: "http://p/a.jpg" }
              as: CrewLead
              as_user_id: "${crew_id}"
            - call: "POST /abatement/work-orders/${wo_id}/complete"
              payload: { actual_labor_hours: 3.0 }
              as: CrewLead
              as_user_id: "${crew_id}"
          trigger:
            - call: "POST /abatement/cost-recoveries/${cr_id}/waive"
              payload: { reason: "goodwill" }
              as: ProgramAdmin
          assert:
            - "CostRecovery.${cr_id}.status == WAIVED"
            - "Site.${site_id}.outstanding_recovery_cents == 0"
