            - "ResinLot.${lot}.status == QUARANTINED immediately after the quarantine call"
            - "ResinCharge.${ch1}.status == RELEASED and ResinCharge.${ch1}.released_reason == LOT_QUARANTINED   (CASCADE-F link 2)"
            - "MoldingCycle.${cyc1}.status == ABORTED and MoldingCycle.${cyc1}.abort_reason == LOT_QUARANTINED   (CASCADE-F link 3)"
            - "${po_status_blocked} == BLOCKED_RESIN and ${po_reason_blocked} == NO_QUALIFIED_RESIN_LOT   (CASCADE-F link 4, because completed_qty 0 < ordered_qty 2 and qualified_resin_lot_count fell to 0)"
            - "the 12:00 POST /molding-cycles issued while the order is BLOCKED_RESIN returns HTTP 409 with error_id ERR_ORDER_NOT_SCHEDULABLE (§1.4 priority 34), and it wins over §1.4 priority 62 because no arm conflict is even evaluated"
            - "ResinLot.${lot}.available_kg == 500.000 and reserved_kg == 0.000 and consumed_kg == 0.000 after the quarantine cascade — aborting from SCHEDULED returns the full reservation"
            - "${lot_status_r} == AVAILABLE after release-quarantine"
            - "${po_status_ok} == READY_TO_SCHEDULE and ${po_reason_ok} == null   (the only outbound edge from BLOCKED_RESIN; the order does NOT return to IN_PRODUCTION)"
            - "the IDENTICAL 12:00 POST /molding-cycles now returns HTTP 201 and MoldingCycle.${cyc2}.status == SCHEDULED with mold_id == ${mold}"
            - "ProductionOrder.${po}.status == IN_PRODUCTION after the accepted cycle and ${po_v3} == ${po_v2} + 1"

      - name: finished_unit_store_gated_by_warehouse_frozen_posture
        grounds:
          - state_machines.FinishedUnit.logistics.UNALLOCATED_to_STORED
          - state_machines.Warehouse.NORMAL_to_FROZEN
          - state_machines.Warehouse.FROZEN_to_NORMAL
          - state_machines.ProductionOrder.IN_PRODUCTION_to_BLOCKED_WAREHOUSE
          - state_machines.ProductionOrder.BLOCKED_WAREHOUSE_to_READY_TO_SCHEDULE
          - validations[priority=40]
          - errors.ERR_WAREHOUSE_FROZEN
          - "CASCADE-H link 4"
          - "CASCADE-C link 4"
        distinguishing_aspect: |
          The dependency crosses a DIFFERENT pair — FinishedUnit <- Warehouse — and runs in the
          DOWNSTREAM capacity direction rather than the upstream material direction of
          production_order_blocks_on_resin_lot_quarantine_and_unblocks_on_release: a hull's
          UNALLOCATED -> STORED transition is legal only while its target site's posture is not
          FROZEN, so the second store drives the site to 100.00 pct utilisation and the third
          store is refused 409 ERR_WAREHOUSE_FROZEN until a release-storage on a sibling pulls
          the site back to NORMAL.
        test_recipe:
          setup:
            - "ProductModel PM-X7B-KM: KAYAK/MID, gross_cube_m3 2.0000, nest_factor 0.5000, unit_weight_kg 8.000, nominal_charge_kg 8.000, charge_tolerance_pct 5.00, min_cooling_minutes 30, wall_thickness_min_mm 4.50, wall_cv_max_pct 12.00, impact_test_min_joules 90.00."
            - "THREE-cavity Mold MLD-X7B-3 with nominal_charge_kg 24.000 == 8.000 * 3 and service_interval_cycles 10, so a single accepted cycle mints three hulls in ascending cavity_index order."
            - "OvenStation OV-X7B (arm_count 2, changeover_buffer_min 15, max_size_class OVERSIZE) and CoolingBay CB-X7B (concurrent_slot_capacity 2, FORCED_AIR)."
            - "Four distinct ACTIVE Technicians T-X7B-RES / T-X7B-OPR / T-X7B-ASM / T-X7B-QCI, satisfying §1.4 priority 57 on every hull."
            - "Warehouse WH-X7B is deliberately TIGHT: footprint_capacity_cube_m3 3.0000 in one zone Z-A of 3.0000, restricted_threshold_pct 85.00 and frozen_threshold_pct 95.00 — so one anchor at 2.0000 plus one nested sibling at 1.0000 exactly fills it."
            - "Qualified ResinLot LOT-X7B (received_kg 500.000, regrind_pct_by_mass 10.00, expires_on 2027-12-31)."
            - "ProductionOrder PO-X7B targets WH-X7B with ordered_qty 4 and no demand_bucket_id, so the three hulls from the one cycle satisfy 3 <= floor(4 * 1.20) == 4 (§1.4 priority 79) while completed_qty 3 stays STRICTLY BELOW ordered_qty 4 — that is what keeps the order in IN_PRODUCTION and therefore inside the CASCADE-H link 4 candidate set instead of letting it reach COMPLETE."
            - "The one cycle ran 09:00 oven start, 10:00 oven end, 10:35 cooling end, and all three hulls PO-X7B-01-0001, PO-X7B-02-0002 and PO-X7B-03-0003 were trimmed, outfitted and inspected PASS, so all three are SELLABLE / UNALLOCATED and the order is IN_PRODUCTION with completed_qty 3."
            - "The logical clock sits at 2026-08-01T10:35:00Z when the triggers begin and is stepped forward before each store so stored_at ordering is unambiguous for anchor promotion."
