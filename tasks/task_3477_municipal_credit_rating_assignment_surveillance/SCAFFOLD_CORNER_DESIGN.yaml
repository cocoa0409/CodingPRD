        claim_type: Violation → Error
        grounds:
          - errors[ERR_ALTERNATE_NOT_PERMITTED]
        distinguishing_aspect: "Appointing an alternate for voter-1, who has no recorded recusal, is rejected 409 ERR_ALTERNATE_NOT_PERMITTED — alternates exist only to fill recused seats."
        test_recipe:
          setup:
