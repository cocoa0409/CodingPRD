  # ==========================================================================
  - rule_id: non_linear_state_machine
    instances:

      - name: booking_counter_self_loop_negotiation_cycle
        grounds:
          - state_machines.Booking.OFFERED_to_COUNTERED
          - state_machines.Booking.COUNTERED_to_COUNTERED
          - state_machines.Booking.COUNTERED_to_OFFERED
          - state_machines.BookingOffer.PENDING_to_COUNTERED
          - entities.Booking.fields.round_count
          - validations[priority=21]
          - concurrency_rules[booking-counter-stale-version]
        distinguishing_aspect: |
          The Booking machine is genuinely cyclic on the negotiation pair: COUNTERED -> COUNTERED is a
          self-loop and COUNTERED -> OFFERED walks the cycle back, so the same state is entered more
          than once and the state alone cannot tell you how far the negotiation has gone. Only the
          monotone round_count terminates it, at MAX_NEGOTIATION_ROUNDS 4 - so the machine's exit is
          governed by a counter, not by its state graph.
        test_recipe:
          setup:
            - "One venue, one distributor and one title."
            - "One booking created via POST /bookings, which lodges negotiation round 1 and leaves the booking in OFFERED with round_count 1."
          setup_api_calls:
            - call: "POST /venues"
              payload: { name: "Reel Repertory", seat_capacity: 12, house_hold_seats: 4, trailer_reel_minutes: 12, turnaround_minutes: 25, min_useful_gap_minutes: 45, dcp_ingest_lane_count: 2, open_local_time: "11:00", last_start_local_time: "22:00", utc_offset_minutes: 0, max_first_run_share: 0.60, weekly_repertory_target: 3, supported_formats: ["DCP_2K", "DCP_4K"], base_house_nut_weekly_cents: 200000 }
              as: ExecutiveDirector
              captures: { v_id: $.data.id }
            - call: "POST /distributors"
              payload: { name: "Coyote Films", contact_email: "book@coyote.example", default_terms_variant: "SLIDING_SCALE_90_10", default_min_run_days: 4, default_distributor_share_pct: 0.35, requires_advance_guarantee: false }
              as: Programmer
              captures: { d_id: $.data.id }
            - call: "POST /titles"
              payload: { title_name: "La Jetee Redux", release_year: 1962, runtime_minutes: 104, is_first_run: false, native_format: "DCP_2K", rights_holder_distributor_id: "${d_id}" }
              as: Programmer
              captures: { t1_id: $.data.id }
            - call: "POST /bookings"
              payload: { title_id: "${t1_id}", distributor_id: "${d_id}", venue_id: "${v_id}", terms_variant: "SLIDING_SCALE_90_10", house_nut_cents: 12500, distributor_share_pct: 0.35, guarantee_cents: 3000, min_run_days: 4, engagement_start_date: "2026-08-10", engagement_end_date: "2026-08-20" }
