            - "the read returns the marketplace view of the named studio's session only, and no row carries the other studio's id"
            - "the payload carries session and pricing fields but no client id, no roster count and no balance field for either studio"
            - "GET /wellness/marketplace/classes/${sess_b_id} is still reachable by its own id, so the studio filter narrows the collection without hiding inventory"
            - "the public affordability of the collection does not extend to a roster: GET /wellness/clients as Anonymous is refused"

      - name: studio_roster_count_and_outstanding_balance_are_reconciled_in_the_same_response
        claim_type: derived_field_reconciliation
        grounds:
          - entities.Studio.fields.client_roster_count
          - entities.Studio.fields.outstanding_balance_cents
          - entities.Client.fields.outstanding_fee_cents
          - calculations.cancellation_fee
        distinguishing_aspect: "The studio's derived counters are recomputed from their sources on every read, so a late cancellation changes both outstanding_balance_cents and the client's own outstanding_fee_cents in the same transaction — no stale denormalization is observable."
        test_recipe:
          setup:
            - "Logical clock at 2026-06-19T04:00:00Z. GROWTH studio with a payroll period, template, instructor, a client and a capacity-2 session starting 2026-06-20T17:00:00Z."
          setup_api_calls:
            - *h_tier_growth
            - *h_clock_jun
            - *h_studio
            - *h_sub_read
            - *h_maya
            - call: "POST /wellness/payroll-periods"
              payload: { studio_id: "${studio_id}", period_index: 1, start_date: "2026-06-01T00:00:00Z", end_date: "2026-06-30T23:59:59Z" }
              as: StudioOwner
              as_user_id: "${studio_id}"
              captures: { pp_id: $.data.id }
            - call: "POST /wellness/class-templates"
              payload: { studio_id: "${studio_id}", name: "Reformer Flow 50", duration_minutes: 50, base_price_cents: 4000, default_capacity: 2, credit_cost: 1, is_off_peak: true, buffer_minutes: 15 }
              as: StudioOwner
              as_user_id: "${studio_id}"
              captures: { tpl_id: $.data.id }
            - call: "POST /wellness/staff-members"
              payload: { studio_id: "${studio_id}", full_name: "Rai Sorenson", staff_role: "INSTRUCTOR", primary_class_template_id: "${tpl_id}", substitute_class_template_ids: ["${tpl_id}"], commission_rate_bps: 0 }
              as: StudioOwner
              as_user_id: "${studio_id}"
              captures: { rai_id: $.data.id }
            - call: "POST /wellness/class-sessions"
              payload: { studio_id: "${studio_id}", class_template_id: "${tpl_id}", instructor_staff_id: "${rai_id}", room_code: "ROOM-A", start_at: "2026-06-20T17:00:00Z", capacity: 2, expected_subscription_version: "${sub_v}" }
              as: StudioOwner
              as_user_id: "${studio_id}"
              captures: { sess_id: $.data.id }
            - call: "POST /wellness/bookings"
              payload: { client_id: "${maya_id}", class_session_id: "${sess_id}", channel: "STUDIO", payment_source: "DROP_IN" }
              as: Client
              as_user_id: "${maya_id}"
              captures: { bk_id: $.data.id }
          trigger:
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-06-20T06:00:00Z" }
              as: OperatorOnly
            - call: "POST /wellness/bookings/${bk_id}/cancel"
              payload: { reason: "overslept" }
              as: Client
              as_user_id: "${maya_id}"
            - call: "GET /wellness/studios/${studio_id}"
              payload: {}
              as: StudioOwner
              as_user_id: "${studio_id}"
          assert:
            - "the late cancel charged 3360 to the client: Client.${maya_id}.outstanding_fee_cents == 3360"
            - "the studio read in the same request reports Studio.${studio_id}.outstanding_balance_cents == 3360, so the derived aggregate already includes it"
            - "Studio.${studio_id}.client_roster_count == 1, counting the ACTIVE client"
            - "once the client is moved to PORTABILITY_HOLD the roster count drops to 0 while outstanding_balance_cents stays 3360, so the two derived fields are reconciled from different sources"

  # ===========================================================================
  - section: consistency_model
    instances:

      - name: every_write_is_visible_in_its_own_response_without_a_follow_up_read
        claim_type: immediate
        grounds:
          - complexity_profile.consistency_model
          - endpoints.POST_/wellness/bookings
          - response_envelope.success
          - calculations.seat_availability_posture
        distinguishing_aspect: "The model is immediate, so a booking creation returns the fully reconciled row — the derived seats_taken of the session it touched is already correct in the same response, with no second read required."
        test_recipe:
          setup:
            - "Logical clock at 2026-06-01T00:00:00Z. GROWTH studio with a payroll period, template, instructor, a capacity-2 session and two clients."
          setup_api_calls:
            - *h_tier_growth
            - *h_clock_jun
            - *h_studio
            - *h_sub_read
            - *h_maya
            - call: "POST /wellness/clients"
              payload: { home_studio_id: "${studio_id}", display_name: "Bea Tan", email: "bea@example.com", home_state_code: "CO" }
              as: Client
              captures: { bea_id: $.data.id }
            - call: "POST /wellness/payroll-periods"
              payload: { studio_id: "${studio_id}", period_index: 1, start_date: "2026-06-01T00:00:00Z", end_date: "2026-06-30T23:59:59Z" }
              as: StudioOwner
              as_user_id: "${studio_id}"
              captures: { pp_id: $.data.id }
            - call: "POST /wellness/class-templates"
              payload: { studio_id: "${studio_id}", name: "Reformer Flow 50", duration_minutes: 50, base_price_cents: 4000, default_capacity: 2, credit_cost: 1, is_off_peak: true, buffer_minutes: 15 }
              as: StudioOwner
              as_user_id: "${studio_id}"
              captures: { tpl_id: $.data.id }
            - call: "POST /wellness/staff-members"
              payload: { studio_id: "${studio_id}", full_name: "Rai Sorenson", staff_role: "INSTRUCTOR", primary_class_template_id: "${tpl_id}", substitute_class_template_ids: ["${tpl_id}"], commission_rate_bps: 0 }
              as: StudioOwner
              as_user_id: "${studio_id}"
              captures: { rai_id: $.data.id }
            - call: "POST /wellness/class-sessions"
              payload: { studio_id: "${studio_id}", class_template_id: "${tpl_id}", instructor_staff_id: "${rai_id}", room_code: "ROOM-A", start_at: "2026-06-20T17:00:00Z", capacity: 2, expected_subscription_version: "${sub_v}" }
              as: StudioOwner
              as_user_id: "${studio_id}"
              captures: { sess_id: $.data.id }
          trigger:
            - call: "POST /wellness/bookings"
              payload: { client_id: "${maya_id}", class_session_id: "${sess_id}", channel: "STUDIO", payment_source: "DROP_IN" }
              as: Client
              as_user_id: "${maya_id}"
              captures: { bk_1_id: $.data.id }
            - call: "POST /wellness/bookings"
              payload: { client_id: "${bea_id}", class_session_id: "${sess_id}", channel: "STUDIO", payment_source: "DROP_IN" }
              as: Client
              as_user_id: "${bea_id}"
              captures: { bk_2_id: $.data.id }
          assert:
            - "the first booking's own response already shows the session at 1 of 2 seats and fullness_posture OPEN"
            - "the second booking's own response shows the session at 2 of 2 seats and fullness_posture FULL, with no follow-up read needed"
            - "a third attempt is refused in the same breath with ERR_STUDIO_CAPACITY_EXCEEDED, so the posture the second response reported is the posture the third request observed"
            - "response_type is object on both creates and meta.api_request_timestamp is present on each"
