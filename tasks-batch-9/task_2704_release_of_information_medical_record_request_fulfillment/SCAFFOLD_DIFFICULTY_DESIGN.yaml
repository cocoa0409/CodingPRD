              as: FacilityAdmin
              as_user_id: "${fac}"
              captures: { pat: $.data.id }
            - call: "POST /roi/requesters"
              payload: { requester_type: "ATTORNEY", contact_email: "counsel@firm.example", organization_name: "Firm LLP", credential_number: "BAR-55", signature_on_file: true }
              as: IntakeSpecialist
              as_user_id: "u-intake-1"
              captures: { atty: $.data.id }
            - call: "GET /roi/patients/${pat}"
              payload: {}
              as: IntakeSpecialist
              as_user_id: "u-intake-1"
              captures: { pat_v: $.data.version }
            - call: "POST /roi/authorizations"
              payload: { patient_id: "${pat}", requester_id: "${atty}", expected_patient_version: "${pat_v}", signed_at: "2026-08-01T00:00:00Z", expires_at: "2026-12-31T00:00:00Z", scope_categories: ["GENERAL_MEDICAL", "BEHAVIORAL_HEALTH"], sensitive_categories_authorized: ["BEHAVIORAL_HEALTH"], designated_recipient_endpoint: "counsel@firm.example", signature_verified: true }
              as: IntakeSpecialist
