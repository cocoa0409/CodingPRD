            - { call: "POST /tennis/roster-spots", payload: { team_id: "${ta}", player_id: "${pa2}", expected_team_version: "${tva} + 1" }, as: Captain, as_user_id: "${pa1}", captures: { ra2: $.data.id } }
            - { call: "POST /tennis/roster-spots/${ra1}/activate", payload: {}, as: Captain, as_user_id: "${pa1}" }
