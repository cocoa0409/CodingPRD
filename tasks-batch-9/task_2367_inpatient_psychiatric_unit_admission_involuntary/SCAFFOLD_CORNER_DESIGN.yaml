      - name: debrief_blocked_by_incomplete_grid_compliance
        claim_type: precondition
        excluded_because:
          difficulty_instance: restraint_monitoring_grid_vs_raw_compliance_diverge
          rationale: "That difficulty instance already drives POST /restraints/{id}/debrief on an episode whose grid_compliance_pct is 50.0 while raw_compliance_pct is 100.0, asserting the 409 ERR_MONITORING_INCOMPLETE and then the acceptance once the missing interval slots are covered. A separate corner instance would repeat the same call sequence with no new distinguishing power."

      - name: seclusion_capacity_precondition_on_restraint_order
        claim_type: precondition
        excluded_because:
          difficulty_instance: unit_seclusion_capacity_half_open_interval
          rationale: "ERR_SECLUSION_CAPACITY_EXCEEDED and its strict-less-than boundary (the Nth seclusion accepted, the N+1th refused, and capacity released when an episode is released) are exercised end-to-end by that difficulty instance on POST /restraints with intervention_type SECLUSION."

      - name: petition_withdrawal_vacates_hearing_and_locks_the_row
        claim_type: terminal_lockdown
        grounds:
          - state_machines.HoldPetition.transitions
          - state_machines.CourtHearing.SCHEDULED_to_VACATED
          - validations[priority=18]
          - errors[ERR_PETITION_NOT_OPEN]
        distinguishing_aspect: "WITHDRAWN is terminal for HoldPetition and it drags the SCHEDULED hearing to VACATED, releasing the advocate's docket minutes; afterwards both a second withdrawal and a new hearing on that petition are refused 409 ERR_PETITION_NOT_OPEN, and even recording an outcome on the vacated hearing surfaces ERR_PETITION_NOT_OPEN because the petition-state check sits at priority 18, ahead of the hearing-state check at priority 19."
        test_recipe:
          setup:
            - "Roster: intake clinician, psychiatrists Reyes and Fenn, and rights advocate Cho; clock set to 2026-09-03T08:00:00Z (Thursday)."
            - "One adult patient with an evaluation signed at that instant scoring 7, a certified ACTIVE EMERGENCY_72H hold (release_deadline_at 2026-09-06T08:00:00.000Z), an EXTENSION_14D petition FILED, and one hearing scheduled for 2026-09-04T10:00:00Z for 60 minutes with Cho as advocate."
