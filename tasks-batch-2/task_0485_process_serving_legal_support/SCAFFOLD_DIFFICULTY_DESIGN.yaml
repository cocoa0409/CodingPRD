# =============================================================================
# §1.8 Scaffold Difficulty Design (Test Targeting Index) — task_0485
# Grounds reference SCAFFOLD.yaml §1.1–§1.7. Nine rule_ids, >=2 instances each.
# All formula-derived asserts are literals computed against calculations.* with
# their constants. Default clock = 2026-01-01T00:00:00Z.
# =============================================================================
scaffold_difficulty_design:

  # ---------------------------------------------------------------------------
  - rule_id: dual_variant_calc
    instances:
      - name: service_fee_quoted_vs_final_diverge_on_servicerequest
        grounds:
          - calculations.service_fee
          - entities.ServiceRequest.fields.quoted_fee_cents
          - entities.ServiceRequest.fields.final_fee_cents
        distinguishing_aspect: |
          On entity domain ServiceRequest, the quoted variant (billable_attempt_count
          fixed at 0, no stakeout/filing lines) yields 7575 while the final variant
          over the SAME request after 4 attempts + 1 stakeout + 1 accepted filing
          yields 32575 — same inputs, two algorithms, different cents.
        test_recipe:
          setup:
            - "County CA, e_file_enabled, min_diligent_attempts=3, filing_fee_cents=4000."
            - "Server S covers CA; Client C with 100000c deposit."
            - "Non-rush ServiceRequest SR with a 3-page Document, submitted (quoted=7575)."
            - "S accepts, logs 4 attempts on 4 distinct days, schedules 1 stakeout; service recorded PERSONAL; affidavit signed+notarized; filing submitted+accepted."
          setup_api_calls:
            - call: "POST /counties"
              payload: { name: "Alameda", state_code: "CA", e_file_enabled: true, min_diligent_attempts: 3, filing_fee_cents: 4000, max_concurrent_filings: 2 }
              as: Admin
              captures: { county_id: $.data.id }
            - call: "POST /servers"
              payload: { full_name: "Sam Server", license_no: "PS-1001" }
              as: Admin
              captures: { server_id: $.data.id }
            - call: "POST /servers/${server_id}/territories"
              payload: { county_id: "${county_id}" }
              as: Admin
            - call: "POST /clients"
              payload: { firm_name: "Acme Law", email: "a@law.com" }
              as: Admin
              captures: { client_id: $.data.id }
            - call: "POST /clients/${client_id}/deposits"
              payload: { amount_cents: 100000 }
              as: Admin
            - call: "POST /service-requests"
              payload: { client_id: "${client_id}", county_id: "${county_id}", recipient_name: "John Doe", service_address: "1 Main St", service_lat: 37.8, service_lng: -122.2, rush: false, skip_trace_requested: false }
              as: Dispatcher
              captures: { sr_id: $.data.id }
            - call: "POST /service-requests/${sr_id}/documents"
              payload: { doc_type: "SUMMONS", page_count: 3 }
              as: Dispatcher
            - call: "POST /service-requests/${sr_id}/submit"
              payload: {}
              as: Dispatcher
              captures: { sr_v: $.data.version, quoted: $.data.quoted_fee_cents }
            - call: "POST /service-requests/${sr_id}/assignments"
              payload: { server_id: "${server_id}", expected_service_request_version: "${sr_v}" }
              as: Dispatcher
              captures: { asg_id: $.data.id }
            - call: "POST /assignments/${asg_id}/accept"
              payload: {}
              as: Server
              as_user_id: "${server_id}"
            - call: "POST /assignments/${asg_id}/attempts"
              payload: { attempted_at_utc: "2026-01-01T09:00:00Z", gps_lat: 37.8, gps_lng: -122.2, outcome: "NO_ANSWER" }
              as: Server
              as_user_id: "${server_id}"
            - call: "POST /assignments/${asg_id}/attempts"
              payload: { attempted_at_utc: "2026-01-02T09:00:00Z", gps_lat: 37.8, gps_lng: -122.2, outcome: "EVADED" }
              as: Server
              as_user_id: "${server_id}"
            - call: "POST /assignments/${asg_id}/attempts"
              payload: { attempted_at_utc: "2026-01-03T09:00:00Z", gps_lat: 37.8, gps_lng: -122.2, outcome: "NO_ANSWER" }
              as: Server
              as_user_id: "${server_id}"
            - call: "POST /assignments/${asg_id}/attempts"
              payload: { attempted_at_utc: "2026-01-04T09:00:00Z", gps_lat: 37.8, gps_lng: -122.2, outcome: "CONTACT_MADE" }
              as: Server
              as_user_id: "${server_id}"
            - call: "POST /assignments/${asg_id}/stakeouts"
              payload: { window_start_utc: "2026-01-05T06:00:00Z", window_end_utc: "2026-01-05T10:00:00Z" }
              as: Server
              as_user_id: "${server_id}"
            - call: "POST /service-requests/${sr_id}/services"
              payload: { assignment_id: "${asg_id}", service_type: "PERSONAL", served_at_utc: "2026-01-04T09:05:00Z" }
              as: Server
              as_user_id: "${server_id}"
              captures: { service_id: $.data.id }
            - call: "GET /service-requests/${sr_id}/affidavits"
              payload: {}
              as: Server
              as_user_id: "${server_id}"
              captures: { aff_id: "$.data[0].id" }
            - call: "POST /affidavits/${aff_id}/sign"
              payload: {}
              as: Server
              as_user_id: "${server_id}"
            - call: "POST /affidavits/${aff_id}/notarize"
              payload: {}
              as: Notary
              as_user_id: "notary-1"
            - call: "POST /service-requests/${sr_id}/filings"
              payload: { affidavit_id: "${aff_id}", window_start_utc: "2026-01-06T00:00:00Z", window_end_utc: "2026-01-06T01:00:00Z" }
              as: Dispatcher
              captures: { filing_id: $.data.id }
            - call: "POST /filings/${filing_id}/state"
              payload: { to_status: "SUBMITTED" }
              as: Dispatcher
            - call: "POST /filings/${filing_id}/state"
              payload: { to_status: "ACCEPTED" }
              as: Dispatcher
          trigger:
            - call: "GET /service-requests/${sr_id}"
              payload: {}
              as: Dispatcher
              captures: { final: $.data.final_fee_cents }
          assert:
            - "ServiceRequest.${sr_id}.quoted_fee_cents == 7575"
            - "ServiceRequest.${sr_id}.final_fee_cents == 32575"
            - "ServiceRequest.${sr_id}.final_fee_cents != ServiceRequest.${sr_id}.quoted_fee_cents"

      - name: server_reliability_realized_vs_projected_diverge_on_server
        grounds:
          - calculations.server_reliability_score
          - entities.Server.fields.reliability_score
          - entities.Server.fields.active_assignment_count
        distinguishing_aspect: |
          On entity domain Server, the realized variant (base_pool excludes in-flight
          ACTIVE) gives 50.0 while the projected variant (base_pool includes the 1
          ACTIVE assignment) gives 33.33 for the SAME server — a different subject and
          a different divergence axis than the ServiceRequest fee variants.
        test_recipe:
          setup:
            - "County CA; Server S covers CA; one Client with funds."
            - "SR1: S accepted, served PERSONAL, completed-chain reaches COMPLETED (1 served)."
            - "SR2: S accepted then dispatcher reassigns (1 walked/REASSIGNED) -> realized base 2."
            - "SR3: S accepted, currently ACTIVE (1 in-flight, no terminal yet)."
          setup_api_calls:
            - call: "POST /counties"
              payload: { name: "Marin", state_code: "CA", e_file_enabled: true, min_diligent_attempts: 1, filing_fee_cents: 4000, max_concurrent_filings: 2 }
              as: Admin
              captures: { county_id: $.data.id }
            - call: "POST /servers"
              payload: { full_name: "Rita Reliable", license_no: "PS-2002" }
              as: Admin
              captures: { server_id: $.data.id }
            - call: "POST /servers/${server_id}/territories"
              payload: { county_id: "${county_id}" }
              as: Admin
            - call: "POST /clients"
              payload: { firm_name: "Beta Law", email: "b@law.com" }
              as: Admin
              captures: { client_id: $.data.id }
            # --- SR1: serve to COMPLETED-bubble (served) ---
            - call: "POST /service-requests"
              payload: { client_id: "${client_id}", county_id: "${county_id}", recipient_name: "D1", service_address: "1 A St", service_lat: 38.0, service_lng: -122.5 }
              as: Dispatcher
              captures: { sr1: $.data.id }
            - call: "POST /service-requests/${sr1}/documents"
              payload: { doc_type: "SUMMONS", page_count: 1 }
              as: Dispatcher
            - call: "POST /service-requests/${sr1}/submit"
              payload: {}
              as: Dispatcher
              captures: { sr1_v: $.data.version }
            - call: "POST /service-requests/${sr1}/assignments"
              payload: { server_id: "${server_id}", expected_service_request_version: "${sr1_v}" }
              as: Dispatcher
              captures: { asg1: $.data.id }
            - call: "POST /assignments/${asg1}/accept"
              payload: {}
              as: Server
              as_user_id: "${server_id}"
            - call: "POST /assignments/${asg1}/attempts"
              payload: { attempted_at_utc: "2026-01-01T09:00:00Z", gps_lat: 38.0, gps_lng: -122.5, outcome: "CONTACT_MADE" }
              as: Server
              as_user_id: "${server_id}"
            - call: "POST /service-requests/${sr1}/services"
              payload: { assignment_id: "${asg1}", service_type: "PERSONAL", served_at_utc: "2026-01-01T09:05:00Z" }
              as: Server
              as_user_id: "${server_id}"
            # --- SR2: accept then reassign (walked) ---
            - call: "POST /service-requests"
              payload: { client_id: "${client_id}", county_id: "${county_id}", recipient_name: "D2", service_address: "2 A St", service_lat: 38.0, service_lng: -122.5 }
              as: Dispatcher
              captures: { sr2: $.data.id }
            - call: "POST /service-requests/${sr2}/documents"
              payload: { doc_type: "SUMMONS", page_count: 1 }
              as: Dispatcher
            - call: "POST /service-requests/${sr2}/submit"
              payload: {}
              as: Dispatcher
              captures: { sr2_v: $.data.version }
            - call: "POST /service-requests/${sr2}/assignments"
              payload: { server_id: "${server_id}", expected_service_request_version: "${sr2_v}" }
              as: Dispatcher
              captures: { asg2: $.data.id }
            - call: "POST /assignments/${asg2}/accept"
              payload: {}
              as: Server
              as_user_id: "${server_id}"
            - call: "POST /service-requests/${sr2}/reassign"
              payload: {}
              as: Dispatcher
            # --- SR3: accept, leave ACTIVE ---
            - call: "POST /service-requests"
              payload: { client_id: "${client_id}", county_id: "${county_id}", recipient_name: "D3", service_address: "3 A St", service_lat: 38.0, service_lng: -122.5 }
              as: Dispatcher
              captures: { sr3: $.data.id }
            - call: "POST /service-requests/${sr3}/documents"
              payload: { doc_type: "SUMMONS", page_count: 1 }
              as: Dispatcher
            - call: "POST /service-requests/${sr3}/submit"
              payload: {}
              as: Dispatcher
              captures: { sr3_v: $.data.version }
            - call: "POST /service-requests/${sr3}/assignments"
              payload: { server_id: "${server_id}", expected_service_request_version: "${sr3_v}" }
              as: Dispatcher
              captures: { asg3: $.data.id }
            - call: "POST /assignments/${asg3}/accept"
              payload: {}
              as: Server
              as_user_id: "${server_id}"
          trigger:
            - call: "GET /servers/${server_id}/reliability-projection"
              payload: {}
              as: Dispatcher
              captures: { realized: $.data.realized_score, projected: $.data.projected_score }
          assert:
            - "Server.${server_id}.reliability_score == 50.0"
            - "reliability-projection.realized_score == 50.0"
            - "reliability-projection.projected_score == 33.33"
            - "reliability-projection.active_assignment_count == 1"

  # ---------------------------------------------------------------------------
  - rule_id: combinatorial_formula
    instances:
      - name: service_fee_tiered_attempt_plus_rush_labor_uplift_mode_a
        grounds:
          - calculations.service_fee
          - entities.ServiceRequest.fields.final_fee_cents
        distinguishing_aspect: |
          Mode (a): >=3 inputs with non-linear interaction — tiered per-attempt
          (free/tier1/tier2 selection via nested min/max) AND a conditional rush
          labor multiplier applied only to labor lines after tiering. A rush request
          with 2 attempts + 0 stakeout + 1 filing finalizes to 29350 cents.
        test_recipe:
          setup:
            - "County CA e_file, min_diligent_attempts=1; Server covers CA; Client funded."
            - "RUSH SR, skip_trace_requested=true, 4-page Document, submitted."
            - "S accepts; 2 attempts (2nd CONTACT_MADE); PERSONAL service within rush deadline; affidavit notarized; filing submitted+accepted."
          setup_api_calls:
            - call: "POST /counties"
              payload: { name: "Napa", state_code: "CA", e_file_enabled: true, min_diligent_attempts: 1, filing_fee_cents: 4000, max_concurrent_filings: 2 }
              as: Admin
              captures: { county_id: $.data.id }
            - call: "POST /servers"
              payload: { full_name: "Tim Tier", license_no: "PS-3003" }
              as: Admin
              captures: { server_id: $.data.id }
            - call: "POST /servers/${server_id}/territories"
              payload: { county_id: "${county_id}" }
              as: Admin
            - call: "POST /clients"
              payload: { firm_name: "Gamma Law", email: "g@law.com" }
              as: Admin
              captures: { client_id: $.data.id }
            - call: "POST /clients/${client_id}/deposits"
              payload: { amount_cents: 100000 }
              as: Admin
            - call: "POST /service-requests"
              payload: { client_id: "${client_id}", county_id: "${county_id}", recipient_name: "R", service_address: "9 St", service_lat: 38.3, service_lng: -122.3, rush: true, skip_trace_requested: true }
              as: Dispatcher
              captures: { sr_id: $.data.id }
            - call: "POST /service-requests/${sr_id}/documents"
              payload: { doc_type: "SUBPOENA", page_count: 4 }
              as: Dispatcher
            - call: "POST /service-requests/${sr_id}/submit"
              payload: {}
              as: Dispatcher
              captures: { sr_v: $.data.version }
            - call: "POST /service-requests/${sr_id}/assignments"
              payload: { server_id: "${server_id}", expected_service_request_version: "${sr_v}" }
              as: Dispatcher
              captures: { asg_id: $.data.id }
            - call: "POST /assignments/${asg_id}/accept"
              payload: {}
              as: Server
              as_user_id: "${server_id}"
            - call: "POST /assignments/${asg_id}/attempts"
              payload: { attempted_at_utc: "2026-01-01T08:00:00Z", gps_lat: 38.3, gps_lng: -122.3, outcome: "NO_ANSWER" }
              as: Server
              as_user_id: "${server_id}"
            - call: "POST /assignments/${asg_id}/attempts"
              payload: { attempted_at_utc: "2026-01-01T20:00:00Z", gps_lat: 38.3, gps_lng: -122.3, outcome: "CONTACT_MADE" }
              as: Server
              as_user_id: "${server_id}"
            - call: "POST /service-requests/${sr_id}/services"
              payload: { assignment_id: "${asg_id}", service_type: "PERSONAL", served_at_utc: "2026-01-01T20:05:00Z" }
              as: Server
              as_user_id: "${server_id}"
              captures: { service_id: $.data.id }
            - call: "GET /service-requests/${sr_id}/affidavits"
              payload: {}
              as: Server
              as_user_id: "${server_id}"
              captures: { aff_id: "$.data[0].id" }
            - call: "POST /affidavits/${aff_id}/sign"
              payload: {}
              as: Server
              as_user_id: "${server_id}"
            - call: "POST /affidavits/${aff_id}/notarize"
              payload: {}
              as: Notary
              as_user_id: "notary-7"
            - call: "POST /service-requests/${sr_id}/filings"
              payload: { affidavit_id: "${aff_id}", window_start_utc: "2026-01-01T22:00:00Z", window_end_utc: "2026-01-01T23:00:00Z" }
              as: Dispatcher
              captures: { filing_id: $.data.id }
            - call: "POST /filings/${filing_id}/state"
              payload: { to_status: "SUBMITTED" }
              as: Dispatcher
            - call: "POST /filings/${filing_id}/state"
              payload: { to_status: "ACCEPTED" }
              as: Dispatcher
          trigger:
            - call: "GET /service-requests/${sr_id}"
              payload: {}
              as: Dispatcher
              captures: { final: $.data.final_fee_cents }
          assert:
            - "ServiceRequest.${sr_id}.final_fee_cents == 29350"

      - name: service_fee_round_per_line_then_sum_mode_b
        grounds:
          - calculations.service_fee
          - entities.InvoiceLine.fields.amount_cents
        distinguishing_aspect: |
          Mode (b): nested rounding order pinned to round-per-line-then-sum. The
          PRINTING line ceil(page_count*PER_PAGE_CENTS) and the rush uplift
          ceil(labor*(RUSH_LABOR_MULT-1)) are each rounded at the line level before
          summation; summing raw then rounding once would differ. Verified via the
          per-line InvoiceLine breakdown, a different axis than mode (a).
        test_recipe:
          setup:
            - "Same finalized RUSH request as mode_a (final 29350)."
            - "InvoiceLines enumerate BASE 7500, PRINTING 100, RUSH 5000, SKIP_TRACE 9000, ATTEMPT 2500, FILING 4000, plus rush labor uplift folded into subtotal (1250)."
          setup_api_calls:
            - call: "POST /counties"
              payload: { name: "Sonoma", state_code: "CA", e_file_enabled: true, min_diligent_attempts: 1, filing_fee_cents: 4000, max_concurrent_filings: 2 }
              as: Admin
              captures: { county_id: $.data.id }
            - call: "POST /servers"
              payload: { full_name: "Rod Round", license_no: "PS-3004" }
              as: Admin
              captures: { server_id: $.data.id }
            - call: "POST /servers/${server_id}/territories"
              payload: { county_id: "${county_id}" }
              as: Admin
            - call: "POST /clients"
              payload: { firm_name: "Delta Law", email: "d@law.com" }
              as: Admin
              captures: { client_id: $.data.id }
            - call: "POST /clients/${client_id}/deposits"
              payload: { amount_cents: 100000 }
              as: Admin
            - call: "POST /service-requests"
              payload: { client_id: "${client_id}", county_id: "${county_id}", recipient_name: "R", service_address: "9 St", service_lat: 38.3, service_lng: -122.3, rush: true, skip_trace_requested: true }
              as: Dispatcher
              captures: { sr_id: $.data.id }
            - call: "POST /service-requests/${sr_id}/documents"
              payload: { doc_type: "SUBPOENA", page_count: 4 }
              as: Dispatcher
            - call: "POST /service-requests/${sr_id}/submit"
              payload: {}
              as: Dispatcher
              captures: { sr_v: $.data.version }
            - call: "POST /service-requests/${sr_id}/assignments"
              payload: { server_id: "${server_id}", expected_service_request_version: "${sr_v}" }
              as: Dispatcher
              captures: { asg_id: $.data.id }
            - call: "POST /assignments/${asg_id}/accept"
              payload: {}
              as: Server
              as_user_id: "${server_id}"
            - call: "POST /assignments/${asg_id}/attempts"
              payload: { attempted_at_utc: "2026-01-01T08:00:00Z", gps_lat: 38.3, gps_lng: -122.3, outcome: "NO_ANSWER" }
              as: Server
              as_user_id: "${server_id}"
            - call: "POST /assignments/${asg_id}/attempts"
              payload: { attempted_at_utc: "2026-01-01T20:00:00Z", gps_lat: 38.3, gps_lng: -122.3, outcome: "CONTACT_MADE" }
              as: Server
              as_user_id: "${server_id}"
            - call: "POST /service-requests/${sr_id}/services"
              payload: { assignment_id: "${asg_id}", service_type: "PERSONAL", served_at_utc: "2026-01-01T20:05:00Z" }
              as: Server
              as_user_id: "${server_id}"
          trigger:
            - call: "GET /service-requests/${sr_id}/invoice-lines"
              payload: {}
              as: Dispatcher
              captures: { printing_amt: "$.data[0].amount_cents" }
          assert:
            - "ServiceRequest.${sr_id}.final_fee_cents == 25350"
            - "exactly one InvoiceLine with kind=PRINTING has amount_cents == 100"
            - "exactly one InvoiceLine with kind=ATTEMPT has amount_cents == 2500"
            - "exactly one InvoiceLine with kind=BASE has amount_cents == 7500"

  # ---------------------------------------------------------------------------
  - rule_id: non_linear_state_machine
    instances:
      - name: servicerequest_reassign_cycle_assigned_back_to_submitted
        grounds:
          - state_machines.ServiceRequest.ASSIGNED_to_SUBMITTED
          - state_machines.Assignment.ACTIVE_to_REASSIGNED
          - entities.ServiceRequest.fields.assignment_id
        distinguishing_aspect: |
          ServiceRequest forms a cycle: ASSIGNED -> SUBMITTED (reassign) -> ASSIGNED
          again on a new accept. After reassign, assignment_id is null and status is
          SUBMITTED, a backward edge no linear pipeline allows.
        test_recipe:
          setup:
            - "County CA; two Servers S1,S2 cover CA; Client funded."
            - "SR submitted; S1 accepts (ASSIGNED); dispatcher reassigns (back to SUBMITTED)."
          setup_api_calls:
            - call: "POST /counties"
              payload: { name: "Yolo", state_code: "CA", e_file_enabled: true, min_diligent_attempts: 1 }
              as: Admin
              captures: { county_id: $.data.id }
            - call: "POST /servers"
              payload: { full_name: "S1", license_no: "PS-4001" }
              as: Admin
              captures: { s1: $.data.id }
            - call: "POST /servers"
              payload: { full_name: "S2", license_no: "PS-4002" }
              as: Admin
              captures: { s2: $.data.id }
            - call: "POST /servers/${s1}/territories"
              payload: { county_id: "${county_id}" }
              as: Admin
            - call: "POST /servers/${s2}/territories"
              payload: { county_id: "${county_id}" }
              as: Admin
            - call: "POST /clients"
              payload: { firm_name: "Eps Law", email: "e@law.com" }
              as: Admin
              captures: { client_id: $.data.id }
            - call: "POST /service-requests"
              payload: { client_id: "${client_id}", county_id: "${county_id}", recipient_name: "R", service_address: "1 St", service_lat: 38.5, service_lng: -121.7 }
              as: Dispatcher
              captures: { sr_id: $.data.id }
            - call: "POST /service-requests/${sr_id}/documents"
              payload: { doc_type: "SUMMONS", page_count: 1 }
              as: Dispatcher
            - call: "POST /service-requests/${sr_id}/submit"
              payload: {}
              as: Dispatcher
              captures: { sr_v: $.data.version }
            - call: "POST /service-requests/${sr_id}/assignments"
              payload: { server_id: "${s1}", expected_service_request_version: "${sr_v}" }
              as: Dispatcher
              captures: { asg1: $.data.id }
            - call: "POST /assignments/${asg1}/accept"
              payload: {}
              as: Server
              as_user_id: "${s1}"
          trigger:
            - call: "POST /service-requests/${sr_id}/reassign"
              payload: {}
              as: Dispatcher
              captures: { st: $.data.status }
          assert:
            - "ServiceRequest.${sr_id}.status == SUBMITTED"
            - "ServiceRequest.${sr_id}.assignment_id == null"
            - "Assignment.${asg1}.status == REASSIGNED"

      - name: filing_reject_resubmit_cycle_on_filing_entity
        grounds:
          - state_machines.Filing.SUBMITTED_to_REJECTED
          - state_machines.Filing.REJECTED_to_SUBMITTED
          - entities.Filing.fields.reject_count
        distinguishing_aspect: |
          Filing (a different entity from ServiceRequest) cycles SUBMITTED -> REJECTED
          -> SUBMITTED, incrementing reject_count to 1 on the resubmit — a backward
          edge distinct from the request reassignment loop.
        test_recipe:
          setup:
