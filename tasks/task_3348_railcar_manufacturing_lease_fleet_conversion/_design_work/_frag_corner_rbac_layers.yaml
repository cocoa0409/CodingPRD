              as: Lessee
              as_user_id: "${ls_b_id}"
              captures: { own_b_balance: $.data.outstanding_balance_cents }
          assert:
            - "The cross-account read returns HTTP 403 with data.error_id == ${err_id} == \"ERR_FORBIDDEN\""
            - "The denial is not a role ban: Lessee is a declared role and this very endpoint is in its shared_operations for its own id"
            - "Holding the path fixed at ${ls_b_id} and changing only X-User-ID to ${ls_b_id} flips the outcome to HTTP 200 with data.outstanding_balance_cents == ${own_b_balance} == 0"
            - "Account A's own read is the permitted half of the pair and is asserted by rbac_lessee_reads_own_outstanding_balance_succeeds"
            - "No field of account A's ledger is disclosed by the 403 response: the error envelope carries only data.error_id and data.message"

