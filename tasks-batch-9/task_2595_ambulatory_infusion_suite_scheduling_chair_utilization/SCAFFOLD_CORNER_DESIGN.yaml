      - name: cancel_cascade_down_side_effects
        claim_type: side_effect_execution
        excluded_because:
          difficulty_instance: cancel_wastes_dose_then_steers_patient_then_suspends_plan_then_cancels_sibling
          rationale: |
            The four-hop cascade-down that a patient-initiated cancellation fires — waste
            pricing on the PREPARED dose, Patient.waste_liability_cents crossing 50000,
            steering_status SUITE -> HOME_INFUSION_REVIEW, every ACTIVE plan to SUSPENDED,
            and each suspended plan's live siblings to CANCELLED with zero charge — is the
            entire subject of that §1.8 instance, which asserts every hop's row state and
            the released chair minutes. A separate corner instance would restate it.

      - name: lot_ledger_sync_side_effect
        claim_type: side_effect_execution
        excluded_because:
          difficulty_instance: lot_unit_ledger_fully_restored_by_returning_an_uncompounded_dose
          rationale: |
            The ledger-sync corner — a DrugPreparation transition writing back five
            DrugLot counters so that units_received == units_administered + units_wasted +
            units_returned + units_available + units_committed still holds, including the
            DEPLETED -> AVAILABLE re-open — is asserted counter-by-counter by that §1.8
            instance.

