# =============================================================================
# §1.9 Scaffold Corner Design (Coverage Index for Non-Difficulty Tests)
# Medical Financing / Patient Payment Plan — EXPERT
# Breadth probe over §1.1–§1.7 (claim-extraction-guide taxonomy).
# =============================================================================
scaffold_corner_design:

  # ===========================================================================
  - section: entities
    instances:
      - name: create_provider_returns_201_with_pending_status
        claim_type: Creation
        grounds: [entities.Provider, "endpoints[\"POST /providers\"]"]
        distinguishing_aspect: "POST /providers with all required fields returns 201; status defaults PENDING, monthly_settled_volume_cents=0, settled_net_cents=0, version=1."
        test_recipe:
          setup: ["Empty DB."]
          setup_api_calls: []
          trigger:
            - call: "POST /providers"
              payload: { legal_name: "New Clinic", specialty: "DENTAL", tax_id: "TX-NEW-1", base_merchant_discount_rate: 0.08 }
              as: PlatformAdmin
              captures: { p_id: $.data.id }
          assert:
            - "response 201; Provider.${p_id}.status == PENDING"
            - "Provider.${p_id}.monthly_settled_volume_cents == 0 and settled_net_cents == 0 and version == 1"

      - name: create_provider_missing_specialty_returns_invalid_request
        claim_type: Required Fields
        grounds: [entities.Provider.fields.specialty, "validations[priority=5]"]
        distinguishing_aspect: "Omitting specialty (source:input, no default) returns 400 ERR_INVALID_REQUEST."
        test_recipe:
          setup: ["Empty DB."]
          setup_api_calls: []
          trigger:
            - call: "POST /providers"
              payload: { legal_name: "No Spec", tax_id: "TX-NS-1", base_merchant_discount_rate: 0.08 }
              as: PlatformAdmin
              captures: { e: $.data.error_id }
          assert:
            - "response 400 ERR_INVALID_REQUEST"

      - name: create_provider_invalid_specialty_enum_returns_invalid_request
        claim_type: Type Constraints
        grounds: [entities.Provider.fields.specialty, "validations[priority=5]"]
        distinguishing_aspect: "specialty='CARDIOLOGY' (not in the five-member enum) returns 400 ERR_INVALID_REQUEST."
        test_recipe:
          setup: ["Empty DB."]
          setup_api_calls: []
          trigger:
            - call: "POST /providers"
              payload: { legal_name: "Bad Enum", specialty: "CARDIOLOGY", tax_id: "TX-BE-1", base_merchant_discount_rate: 0.08 }
              as: PlatformAdmin
              captures: { e: $.data.error_id }
          assert:
            - "response 400 ERR_INVALID_REQUEST"

      - name: create_provider_rate_above_cap_returns_validation_amount
        claim_type: Type Constraints
        grounds: [entities.Provider.fields.base_merchant_discount_rate, "errors[ERR_VALIDATION_AMOUNT]"]
        distinguishing_aspect: "base_merchant_discount_rate=0.40 (> 0.30 cap) returns 422 ERR_VALIDATION_AMOUNT."
        test_recipe:
          setup: ["Empty DB."]
          setup_api_calls: []
          trigger:
            - call: "POST /providers"
              payload: { legal_name: "High Rate", specialty: "VISION", tax_id: "TX-HR-1", base_merchant_discount_rate: 0.40 }
              as: PlatformAdmin
              captures: { e: $.data.error_id }
          assert:
            - "response 422 ERR_VALIDATION_AMOUNT"

      - name: provider_get_nonexistent_returns_not_found
        claim_type: Not Found
        grounds: [entities.Provider, "validations[priority=4]"]
        distinguishing_aspect: "GET /providers/{random-uuid} returns 404 ERR_NOT_FOUND."
        test_recipe:
          setup: ["Empty DB."]
          setup_api_calls: []
          trigger:
            - call: "GET /providers/00000000-0000-4000-8000-000000000000"
              payload: {}
              as: PlatformAdmin
              captures: { e: $.data.error_id }
          assert:
            - "response 404 ERR_NOT_FOUND"

      - name: provider_list_pagination_envelope_fields
        claim_type: Listing
        grounds: [entities.Provider, "endpoints[\"GET /providers\"]"]
        distinguishing_aspect: "GET /providers returns array envelope with total_count and has_more; limit/offset honored."
        test_recipe:
          setup: ["Two providers created."]
          setup_api_calls:
            - call: "POST /providers"
              payload: { legal_name: "L1", specialty: "DENTAL", tax_id: "TX-L-1", base_merchant_discount_rate: 0.08 }
              as: PlatformAdmin
            - call: "POST /providers"
              payload: { legal_name: "L2", specialty: "VISION", tax_id: "TX-L-2", base_merchant_discount_rate: 0.08 }
              as: PlatformAdmin
          trigger:
            - call: "GET /providers"
              payload: { limit: 1, offset: 0 }
              as: PlatformAdmin
          assert:
            - "response_type == array; data length == 1; meta/pagination total_count == 2 and has_more == true"

      - name: duplicate_tax_id_among_non_terminated_returns_duplicate
        claim_type: Type Constraints
        grounds: [entities.Provider.fields.tax_id, "validations[priority=12]"]
        distinguishing_aspect: "Second provider with the same tax_id as a non-TERMINATED provider returns 409 ERR_DUPLICATE_RESOURCE."
        test_recipe:
          setup: ["One ENROLLED provider with tax_id TX-DUP-1."]
          setup_api_calls:
            - call: "POST /providers"
              payload: { legal_name: "Dup A", specialty: "DENTAL", tax_id: "TX-DUP-1", base_merchant_discount_rate: 0.08 }
              as: PlatformAdmin
              captures: { pa_id: $.data.id }
            - call: "POST /providers/${pa_id}/enroll"
              payload: {}
              as: PlatformAdmin
          trigger:
            - call: "POST /providers"
              payload: { legal_name: "Dup B", specialty: "VISION", tax_id: "TX-DUP-1", base_merchant_discount_rate: 0.08 }
              as: PlatformAdmin
              captures: { e: $.data.error_id }
          assert:
            - "response 409 ERR_DUPLICATE_RESOURCE"

      - name: credit_application_provisional_computed_input_ignored
        claim_type: Computed Fields
        grounds: [entities.CreditApplication.fields.provisional_limit_cents, calculations.credit_decision]
        distinguishing_aspect: "provisional_limit_cents is server-computed (income 6,000,000, requested 1,500,000 -> 1,200,000); any client-sent value is ignored."
        test_recipe:
          setup: ["Empty DB."]
          setup_api_calls: []
          trigger:
            - call: "POST /credit-applications"
              payload: { applicant_full_name: "Comp Pat", applicant_ssn_last4: "2201", stated_annual_income_cents: 6000000, requested_limit_cents: 1500000 }
              as: Anonymous
              captures: { app_id: $.data.id, prov: $.data.provisional_limit_cents }
          assert:
            - "CreditApplication.${app_id}.provisional_limit_cents == 1200000"
            - "CreditApplication.${app_id}.status == SUBMITTED and approved_limit_cents == null"

      - name: account_id_is_uuid_without_type_prefix
        claim_type: System Fields
        grounds: [entities.PatientAccount, state_machines.CreditApplication.SUBMITTED_to_APPROVED]
        distinguishing_aspect: "Minted PatientAccount.id is a bare UUID (no 'acct_' prefix); created_at/version system-stamped."
        test_recipe:
          setup: ["An approved application minting an account."]
          setup_api_calls:
            - call: "POST /credit-applications"
              payload: { applicant_full_name: "Uuid Pat", applicant_ssn_last4: "2202", stated_annual_income_cents: 6000000, requested_limit_cents: 500000 }
              as: Anonymous
              captures: { app2_id: $.data.id }
          trigger:
            - call: "POST /credit-applications/${app2_id}/approve"
              payload: {}
              as: PlatformAdmin
              captures: { acct_id: $.data.patient_account_id }
          assert:
            - "the minted PatientAccount.id matches /^[0-9a-f-]{36}$/ with no type prefix"
            - "PatientAccount.${acct_id}.version == 1 and current_balance_cents == 0"

      - name: duplicate_ssn_last4_among_non_declined_returns_duplicate
        claim_type: Type Constraints
        grounds: [entities.CreditApplication.fields.applicant_ssn_last4, "validations[priority=12]"]
        distinguishing_aspect: "Second SUBMITTED application with the same ssn_last4 as a non-DECLINED application returns 409 ERR_DUPLICATE_RESOURCE."
        test_recipe:
          setup: ["One SUBMITTED application with ssn_last4 2203."]
          setup_api_calls:
            - call: "POST /credit-applications"
              payload: { applicant_full_name: "Ssn A", applicant_ssn_last4: "2203", stated_annual_income_cents: 6000000, requested_limit_cents: 500000 }
              as: Anonymous
          trigger:
            - call: "POST /credit-applications"
              payload: { applicant_full_name: "Ssn B", applicant_ssn_last4: "2203", stated_annual_income_cents: 6000000, requested_limit_cents: 500000 }
              as: Anonymous
              captures: { e: $.data.error_id }
          assert:
            - "response 409 ERR_DUPLICATE_RESOURCE"

  # ===========================================================================
  - section: state_machines
    instances:
      - name: enroll_already_enrolled_provider_returns_invalid_state
        claim_type: Invalid Transitions
        grounds: [state_machines.Provider.PENDING_to_ENROLLED]
        distinguishing_aspect: "Enrolling a provider already ENROLLED returns 409 ERR_INVALID_STATE; no version bump."
        test_recipe:
          setup: ["One ENROLLED provider."]
          setup_api_calls:
            - call: "POST /providers"
              payload: { legal_name: "EE Clinic", specialty: "DENTAL", tax_id: "TX-EE-1", base_merchant_discount_rate: 0.08 }
              as: PlatformAdmin
              captures: { ee_id: $.data.id }
            - call: "POST /providers/${ee_id}/enroll"
              payload: {}
              as: PlatformAdmin
          trigger:
            - call: "POST /providers/${ee_id}/enroll"
              payload: {}
              as: PlatformAdmin
              captures: { e: $.data.error_id }
          assert:
            - "response 409 ERR_INVALID_STATE"

      - name: terminate_provider_with_authorized_purchase_returns_invalid_state
        claim_type: Precondition Enforcement
        grounds: [state_machines.Provider.ENROLLED_to_TERMINATED]
        distinguishing_aspect: "Terminating a provider that still has an AUTHORIZED purchase returns 409 ERR_INVALID_STATE (precondition: no AUTHORIZED purchase)."
        test_recipe:
          setup: ["ENROLLED provider with one AUTHORIZED purchase."]
          setup_api_calls:
            - call: "POST /_clock/set"
              payload: { to_iso8601: "2026-01-01T00:00:00Z" }
              as: PlatformAdmin
            - call: "POST /providers"
              payload: { legal_name: "Term Clinic", specialty: "GENERAL", tax_id: "TX-TM-1", base_merchant_discount_rate: 0.08 }
              as: PlatformAdmin
              captures: { tm_id: $.data.id }
            - call: "POST /providers/${tm_id}/enroll"
              payload: {}
              as: PlatformAdmin
            - call: "POST /promotional-plans"
              payload: { name: "Term plan", plan_category: "DEFERRED_INTEREST", deferred_period_months: 12, promo_apr: 0.2, min_payment_factor: 0.05 }
              as: PlatformAdmin
              captures: { tmplan_id: $.data.id }
            - call: "POST /promotional-plans/${tmplan_id}/activate"
              payload: {}
              as: PlatformAdmin
            - call: "POST /provider-promotions"
              payload: { provider_id: "${tm_id}", promotional_plan_id: "${tmplan_id}", effective_start: "2026-01-01T00:00:00Z", effective_end: "2028-01-01T00:00:00Z" }
              as: PlatformAdmin
              captures: { tmpp_id: $.data.id }
            - call: "POST /credit-applications"
              payload: { applicant_full_name: "Term Pat", applicant_ssn_last4: "3301", stated_annual_income_cents: 6000000, requested_limit_cents: 500000 }
              as: Anonymous
              captures: { tmapp_id: $.data.id }
            - call: "POST /credit-applications/${tmapp_id}/approve"
              payload: {}
              as: PlatformAdmin
              captures: { tmacct_id: $.data.patient_account_id }
            - call: "GET /accounts/${tmacct_id}"
              payload: {}
              as: PlatformAdmin
              captures: { tmacct_v: $.data.version }
            - call: "POST /financed-purchases"
              payload: { provider_id: "${tm_id}", patient_account_id: "${tmacct_id}", provider_promotion_id: "${tmpp_id}", principal_cents: 100000, expected_patient_account_version: "${tmacct_v}" }
              as: Provider
              as_user_id: "${tm_id}"
          trigger:
            - call: "POST /providers/${tm_id}/terminate"
              payload: {}
              as: PlatformAdmin
              captures: { e: $.data.error_id }
          assert:
            - "response 409 ERR_INVALID_STATE; Provider.${tm_id}.status remains ENROLLED"

      - name: terminal_terminated_provider_rejects_further_transitions
        claim_type: Terminal State Lockdown
        grounds: [state_machines.Provider.terminal_states]
        distinguishing_aspect: "A TERMINATED provider rejects enroll/suspend with 409 ERR_INVALID_STATE (terminal lockdown)."
        test_recipe:
          setup: ["One ENROLLED-then-TERMINATED provider (no purchases)."]
          setup_api_calls:
            - call: "POST /providers"
              payload: { legal_name: "Lock Clinic", specialty: "DENTAL", tax_id: "TX-LK-1", base_merchant_discount_rate: 0.08 }
              as: PlatformAdmin
              captures: { lk_id: $.data.id }
            - call: "POST /providers/${lk_id}/enroll"
              payload: {}
              as: PlatformAdmin
            - call: "POST /providers/${lk_id}/terminate"
              payload: {}
              as: PlatformAdmin
          trigger:
            - call: "POST /providers/${lk_id}/enroll"
              payload: {}
              as: PlatformAdmin
              captures: { e: $.data.error_id }
          assert:
            - "response 409 ERR_INVALID_STATE"

      - name: provider_reinstatement_cycle_suspended_to_enrolled
        claim_type: Valid Transition
        grounds: [state_machines.Provider.SUSPENDED_to_ENROLLED]
        distinguishing_aspect: "A SUSPENDED provider can be re-enrolled (ENROLLED↔SUSPENDED cycle), version increments each hop."
        test_recipe:
          setup: ["One ENROLLED-then-SUSPENDED provider."]
          setup_api_calls:
            - call: "POST /providers"
              payload: { legal_name: "Reins Clinic", specialty: "VISION", tax_id: "TX-RI-1", base_merchant_discount_rate: 0.08 }
              as: PlatformAdmin
              captures: { ri_id: $.data.id }
            - call: "POST /providers/${ri_id}/enroll"
              payload: {}
              as: PlatformAdmin
            - call: "POST /providers/${ri_id}/suspend"
              payload: {}
              as: PlatformAdmin
          trigger:
            - call: "POST /providers/${ri_id}/enroll"
              payload: {}
              as: PlatformAdmin
              captures: { st: $.data.status }
          assert:
            - "Provider.${ri_id}.status == ENROLLED after re-enroll"

      - name: close_account_with_nonzero_balance_returns_invalid_state
        claim_type: Precondition Enforcement
        grounds: [state_machines.PatientAccount.ACTIVE_to_CLOSED]
        distinguishing_aspect: "Closing an account with current_balance_cents > 0 returns 409 ERR_INVALID_STATE (precondition balance==0)."
        test_recipe:
          setup: ["Account ACTIVE with one AUTHORIZED purchase principal 100,000 (balance 100,000)."]
          setup_api_calls:
            - call: "POST /_clock/set"
              payload: { to_iso8601: "2026-01-01T00:00:00Z" }
              as: PlatformAdmin
            - call: "POST /providers"
              payload: { legal_name: "Clo Clinic", specialty: "DENTAL", tax_id: "TX-CL-1", base_merchant_discount_rate: 0.08 }
              as: PlatformAdmin
              captures: { cl_id: $.data.id }
            - call: "POST /providers/${cl_id}/enroll"
              payload: {}
              as: PlatformAdmin
            - call: "POST /promotional-plans"
              payload: { name: "Clo plan", plan_category: "DEFERRED_INTEREST", deferred_period_months: 12, promo_apr: 0.2, min_payment_factor: 0.05 }
              as: PlatformAdmin
              captures: { clplan_id: $.data.id }
            - call: "POST /promotional-plans/${clplan_id}/activate"
              payload: {}
              as: PlatformAdmin
            - call: "POST /provider-promotions"
              payload: { provider_id: "${cl_id}", promotional_plan_id: "${clplan_id}", effective_start: "2026-01-01T00:00:00Z", effective_end: "2028-01-01T00:00:00Z" }
              as: PlatformAdmin
              captures: { clpp_id: $.data.id }
            - call: "POST /credit-applications"
              payload: { applicant_full_name: "Clo Pat", applicant_ssn_last4: "3302", stated_annual_income_cents: 6000000, requested_limit_cents: 500000 }
              as: Anonymous
              captures: { clapp_id: $.data.id }
            - call: "POST /credit-applications/${clapp_id}/approve"
              payload: {}
              as: PlatformAdmin
              captures: { clacct_id: $.data.patient_account_id }
            - call: "GET /accounts/${clacct_id}"
              payload: {}
              as: PlatformAdmin
              captures: { clacct_v: $.data.version }
            - call: "POST /financed-purchases"
              payload: { provider_id: "${cl_id}", patient_account_id: "${clacct_id}", provider_promotion_id: "${clpp_id}", principal_cents: 100000, expected_patient_account_version: "${clacct_v}" }
              as: Provider
              as_user_id: "${cl_id}"
          trigger:
            - call: "POST /accounts/${clacct_id}/close"
              payload: {}
              as: Patient
              as_user_id: "${clacct_id}"
              captures: { e: $.data.error_id }
          assert:
            - "response 409 ERR_INVALID_STATE; PatientAccount.${clacct_id}.status remains ACTIVE"

      - name: autopay_resume_into_defaulted_account_blocked
        claim_type: guarded transitions
        grounds: [state_machines.AutopayEnrollment.PAUSED_to_ACTIVE]
        distinguishing_aspect: "Resuming a PAUSED autopay is guarded on parent PatientAccount.status in {ACTIVE,DELINQUENT}; a DEFAULTED account's resume returns 409 ERR_INVALID_STATE. (Note: default cascade already REVOKES active enrollments; resume on a REVOKED one is independently invalid.)"
        test_recipe:
          setup: ["A PAUSED autopay whose account is then driven to DEFAULTED is REVOKED by cascade; resume on REVOKED is rejected."]
          setup_api_calls:
            - call: "POST /_clock/set"
              payload: { to_iso8601: "2026-01-01T00:00:00Z" }
              as: PlatformAdmin
            - call: "POST /providers"
              payload: { legal_name: "Gd Clinic", specialty: "GENERAL", tax_id: "TX-GD-1", base_merchant_discount_rate: 0.08 }
              as: PlatformAdmin
              captures: { gd_id: $.data.id }
            - call: "POST /providers/${gd_id}/enroll"
              payload: {}
              as: PlatformAdmin
            - call: "POST /promotional-plans"
              payload: { name: "Gd plan", plan_category: "DEFERRED_INTEREST", deferred_period_months: 36, promo_apr: 0.2, min_payment_factor: 0.05 }
              as: PlatformAdmin
              captures: { gdplan_id: $.data.id }
            - call: "POST /promotional-plans/${gdplan_id}/activate"
              payload: {}
              as: PlatformAdmin
            - call: "POST /provider-promotions"
              payload: { provider_id: "${gd_id}", promotional_plan_id: "${gdplan_id}", effective_start: "2026-01-01T00:00:00Z", effective_end: "2030-01-01T00:00:00Z" }
              as: PlatformAdmin
              captures: { gdpp_id: $.data.id }
            - call: "POST /credit-applications"
              payload: { applicant_full_name: "Gd Pat", applicant_ssn_last4: "3303", stated_annual_income_cents: 6000000, requested_limit_cents: 500000 }
              as: Anonymous
              captures: { gdapp_id: $.data.id }
            - call: "POST /credit-applications/${gdapp_id}/approve"
              payload: {}
              as: PlatformAdmin
              captures: { gdacct_id: $.data.patient_account_id }
            - call: "GET /accounts/${gdacct_id}"
              payload: {}
              as: PlatformAdmin
              captures: { gdacct_v: $.data.version }
            - call: "POST /financed-purchases"
              payload: { provider_id: "${gd_id}", patient_account_id: "${gdacct_id}", provider_promotion_id: "${gdpp_id}", principal_cents: 200000, expected_patient_account_version: "${gdacct_v}" }
              as: Provider
              as_user_id: "${gd_id}"
            - call: "POST /autopay-enrollments"
              payload: { patient_account_id: "${gdacct_id}", funding_token: "tok-gd", draft_day_of_month: 10 }
              as: Patient
              as_user_id: "${gdacct_id}"
              captures: { gdauto_id: $.data.id }
            - call: "POST /autopay-enrollments/${gdauto_id}/pause"
              payload: {}
              as: Patient
              as_user_id: "${gdacct_id}"
            - call: "POST /_cycle/open_statement"
              payload: { patient_account_id: "${gdacct_id}", period_start: "2026-01-01T00:00:00Z", period_end: "2026-01-31T00:00:00Z" }
              as: PlatformAdmin
            - call: "POST /_clock/set"
              payload: { to_iso8601: "2026-01-31T00:00:00Z" }
              as: PlatformAdmin
            - call: "POST /_cycle/close_statement"
              payload: { patient_account_id: "${gdacct_id}" }
              as: PlatformAdmin
            - call: "POST /_clock/set"
              payload: { to_iso8601: "2026-02-28T00:00:00Z" }
              as: PlatformAdmin
            - call: "POST /_cycle/close_statement"
              payload: { patient_account_id: "${gdacct_id}" }
              as: PlatformAdmin
            - call: "POST /_clock/set"
              payload: { to_iso8601: "2026-03-31T00:00:00Z" }
              as: PlatformAdmin
            - call: "POST /_cycle/close_statement"
              payload: { patient_account_id: "${gdacct_id}" }
              as: PlatformAdmin
          trigger:
            - call: "POST /autopay-enrollments/${gdauto_id}/resume"
              payload: {}
              as: Patient
              as_user_id: "${gdacct_id}"
              captures: { e: $.data.error_id }
          assert:
            - "PatientAccount.${gdacct_id}.status == DEFAULTED and AutopayEnrollment.${gdauto_id}.status == REVOKED"
            - "resume returns 409 ERR_INVALID_STATE"

      - name: settle_purchase_already_settled_returns_invalid_state
        claim_type: Idempotency
        grounds: [state_machines.FinancedPurchase.settlement_status_AUTHORIZED_to_SETTLED]
        distinguishing_aspect: "A second settle on an already-SETTLED purchase returns 409 ERR_INVALID_STATE (no duplicate Settlement)."
        test_recipe:
          setup: ["One SETTLED purchase principal 100,000."]
          setup_api_calls:
            - call: "POST /_clock/set"
              payload: { to_iso8601: "2026-01-01T00:00:00Z" }
              as: PlatformAdmin
            - call: "POST /providers"
              payload: { legal_name: "Idem Clinic", specialty: "DENTAL", tax_id: "TX-ID-1", base_merchant_discount_rate: 0.08 }
              as: PlatformAdmin
              captures: { id_id: $.data.id }
            - call: "POST /providers/${id_id}/enroll"
              payload: {}
              as: PlatformAdmin
            - call: "POST /promotional-plans"
              payload: { name: "Idem plan", plan_category: "DEFERRED_INTEREST", deferred_period_months: 12, promo_apr: 0.2, min_payment_factor: 0.05 }
              as: PlatformAdmin
              captures: { idplan_id: $.data.id }
            - call: "POST /promotional-plans/${idplan_id}/activate"
              payload: {}
              as: PlatformAdmin
            - call: "POST /provider-promotions"
              payload: { provider_id: "${id_id}", promotional_plan_id: "${idplan_id}", effective_start: "2026-01-01T00:00:00Z", effective_end: "2028-01-01T00:00:00Z" }
              as: PlatformAdmin
              captures: { idpp_id: $.data.id }
            - call: "POST /credit-applications"
              payload: { applicant_full_name: "Idem Pat", applicant_ssn_last4: "3304", stated_annual_income_cents: 6000000, requested_limit_cents: 500000 }
              as: Anonymous
              captures: { idapp_id: $.data.id }
            - call: "POST /credit-applications/${idapp_id}/approve"
              payload: {}
              as: PlatformAdmin
              captures: { idacct_id: $.data.patient_account_id }
            - call: "GET /accounts/${idacct_id}"
              payload: {}
              as: PlatformAdmin
              captures: { idacct_v: $.data.version }
            - call: "POST /financed-purchases"
              payload: { provider_id: "${id_id}", patient_account_id: "${idacct_id}", provider_promotion_id: "${idpp_id}", principal_cents: 100000, expected_patient_account_version: "${idacct_v}" }
              as: Provider
              as_user_id: "${id_id}"
              captures: { idfp_id: $.data.id, idfp_v: $.data.version }
            - call: "POST /financed-purchases/${idfp_id}/settle"
