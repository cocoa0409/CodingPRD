            - "${err} == ERR_STALE_VERSION"
            - "Production.${prod_id}.budget_cents == 21000000 (stale revision not applied)"

      - name: occ_stale_version_on_propose_settlement_rejected
        claim_type: optimistic_concurrency
        grounds:
          - "concurrency_rules[grievance-proposal-stale-grievance]"
          - "errors[ERR_STALE_VERSION]"
          - "entities.Grievance.fields.version"
        distinguishing_aspect: "OCC on Grievance.version: after a first proposal advances the version, a second proposal carrying the pre-proposal version is rejected 412 ERR_STALE_VERSION — the OCC check (priority 6) fires before the grievance-state check (priority 14) even though the grievance is no longer INVESTIGATING."
