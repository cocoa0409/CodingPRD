          setup:
            - "logical clock at 2026-08-03T06:00:00.000Z"
            - "one ELIGIBLE TRANSPLANT_OPTICAL tissue (ECD 3100, expires 2026-08-17T09:00:00.000Z)"
            - "one ACTIVE surgeon with one OPEN PK request for 2026-08-08T00:00:00.000Z"
