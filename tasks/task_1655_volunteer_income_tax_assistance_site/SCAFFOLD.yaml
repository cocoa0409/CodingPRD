# =============================================================================
# PRD Benchmark Seed Tables — IRS Volunteer Income Tax Assistance (VITA) Site
# =============================================================================

scenario: |
  Volunteer Income Tax Assistance Site Operations (IRS VITA site): site certification & volunteer training/testing requirements, appointment scheduling & document checklist, intake/interview & quality review process before e-file, scope limitations & out-of-scope referral, e-file rejection handling & taxpayer follow-up, refund & direct deposit/split refund options, site statistics reporting to sponsoring program, financial capability add-on services

domain_name: vita-site-ops
api_prefix: /

# =============================================================================
# Step 0: Complexity Profile
# =============================================================================
complexity_profile:
  primary_archetype: compliance_audit
  secondary_archetype: workflow_orchestration
  complexity_layers:
    - optimistic_concurrency
    - cascading_side_effects
    - dual_variant_calculation
    - rate_threshold_triggers
  entity_topology: flat            # peer entities linked by FKs; nested GETs are read-only reverse-reach views
  state_machine_shape: cyclic      # TaxReturn has two rework cycles; Volunteer ACTIVE<->INACTIVE; Site OPEN<->SUSPENDED
  relationship_patterns:
    - one_to_many
    - cross_aggregate
  role_model: segregation_of_duties  # quality reviewer MUST NOT be the preparer of the same return
  consistency_model: immediate

# =============================================================================
# §1.0 Response Envelope (FIXED)
# =============================================================================
response_envelope:
  success: |
    { "meta": { "api_request_id": "req_xxx", "api_request_timestamp": "ISO8601" },
      "response_type": "object" | "array", "data": {} }
  error: |
    { "meta": { ... }, "response_type": "error",
      "data": { "error_id": "ERR_XXX", "message": "..." } }
  pagination_fields: ["limit", "offset", "total_count", "has_more"]
  pagination_defaults: { limit: 10, min: 1, max: 100, offset: 0 }

# =============================================================================
# §1.1 Entity-Relationship Table
# =============================================================================
entities:
  - name: Site
    parent: null
    common_fields: true
    fields:
      - { name: name, type: string, source: input, description: "Site display name" }
      - { name: sponsor_org, type: string, source: input, description: "Sponsoring program organization name" }
      - { name: station_capacity, type: integer, source: input, description: "Max number of appointments whose [start_at, end_at) intervals may overlap at this site", constraints: ">= 1" }
      - { name: season_start, type: datetime, source: input, description: "Season opening instant (inclusive); appointments must start on or after this" }
      - { name: season_end, type: datetime, source: input, description: "Season closing instant (inclusive); appointments must end on or before this" }
      - { name: daily_open_hour, type: integer, source: input, description: "Daily operating window open hour, 0-23; appointments start at or after daily_open_hour:00", constraints: "0..23, < daily_close_hour" }
      - { name: daily_close_hour, type: integer, source: input, description: "Daily operating window close hour, 1-24; appointments end at or before daily_close_hour:00", constraints: "1..24, > daily_open_hour" }
      - { name: goal_returns, type: integer, source: input, description: "Season target of accepted returns used for the goal_met threshold", constraints: ">= 1" }
      - { name: status, type: enum, source: system, description: "SETUP | CERTIFIED | OPEN | SUSPENDED | CLOSED", default: SETUP }
      - { name: accepted_count, type: integer, source: computed, description: "Count of TaxReturns with site_id = this site and status IN {ACCEPTED, COMPLETED}" }
      - { name: goal_met, type: boolean, source: computed, description: "true iff accepted_count >= goal_returns" }
      - { name: version, type: integer, source: system, description: "Optimistic concurrency version" }

  - name: Volunteer
    parent: null
    common_fields: true
    fields:
      - { name: site_id, type: string, source: input, description: "FK -> Site.id; home site of the volunteer" }
      - { name: full_name, type: string, source: input, description: "Volunteer full name" }
      - { name: email, type: string, source: input, description: "Volunteer email; unique across all volunteers" }
      - { name: is_coordinator, type: boolean, source: input, description: "Whether the volunteer may act as SiteCoordinator for its site", default: false }
      - { name: status, type: enum, source: system, description: "REGISTERED | ACTIVE | INACTIVE", default: REGISTERED }
      - { name: certified_test_types, type: array, source: computed, description: "Test types for which the volunteer holds a Certification with status CURRENT, passed = true, tax_season = CURRENT_SEASON (2026)" }
      - { name: active_case_count, type: integer, source: computed, description: "Count of TaxReturns with preparer_id = this volunteer and status == IN_PREPARATION" }
      - { name: version, type: integer, source: system, description: "Optimistic concurrency version; incremented on every mutation including certification recording" }

  - name: Certification
    parent: null
    common_fields: true
    fields:
      - { name: volunteer_id, type: string, source: input, description: "FK -> Volunteer.id; volunteer who took the test" }
      - { name: test_type, type: enum, source: input, description: "ETHICS | INTAKE_QR | BASIC | ADVANCED" }
      - { name: score, type: integer, source: input, description: "Test score 0..100; passed iff score >= PASS_SCORE (80)", constraints: "0..100" }
      - { name: tax_season, type: integer, source: input, description: "Season year the certification is valid for (e.g. 2026)" }
      - { name: passed, type: boolean, source: computed, description: "score >= 80" }
      - { name: status, type: enum, source: system, description: "CURRENT | SUPERSEDED; the newest recorded attempt for (volunteer_id, test_type, tax_season) is CURRENT, all earlier ones SUPERSEDED", default: CURRENT }
      - { name: attempt_number, type: integer, source: computed, description: "1 + count of earlier Certification rows for the same (volunteer_id, test_type, tax_season)" }
      - { name: version, type: integer, source: system, description: "Optimistic concurrency version" }

  - name: Taxpayer
    parent: null
    common_fields: true
    fields:
      - { name: full_name, type: string, source: input, description: "Taxpayer legal name" }
      - { name: ssn_token, type: string, source: input, description: "Tokenized SSN stand-in; unique across all taxpayers" }
      - { name: phone, type: string, source: input, description: "Contact phone" }
      - { name: email, type: string, source: input, description: "Contact email", default: null }
      - { name: preferred_language, type: enum, source: input, description: "EN | ES | OTHER", default: EN }
      - { name: identity_status, type: enum, source: system, description: "UNVERIFIED | VERIFIED; VERIFIED after photo-ID check", default: UNVERIFIED }
      - { name: id_document_type, type: enum, source: system, description: "DRIVERS_LICENSE | PASSPORT | STATE_ID | MILITARY_ID; set by verify-identity", default: null }
      - { name: version, type: integer, source: system, description: "Optimistic concurrency version" }

  - name: Appointment
    parent: null
    common_fields: true
    fields:
      - { name: site_id, type: string, source: input, description: "FK -> Site.id; site hosting the appointment" }
      - { name: taxpayer_id, type: string, source: input, description: "FK -> Taxpayer.id; taxpayer being served" }
      - { name: volunteer_id, type: string, source: input, description: "FK -> Volunteer.id; assigned staff volunteer" }
      - { name: purpose, type: enum, source: input, description: "INTAKE | PREPARATION | FOLLOW_UP" }
      - { name: start_at, type: datetime, source: input, description: "Interval start (inclusive); must be >= current logical time at creation" }
      - { name: end_at, type: datetime, source: input, description: "Interval end (exclusive); duration 15..120 minutes" }
      - { name: status, type: enum, source: system, description: "SCHEDULED | CHECKED_IN | COMPLETED | CANCELLED | NO_SHOW", default: SCHEDULED }
      - { name: version, type: integer, source: system, description: "Optimistic concurrency version" }

  - name: TaxReturn
    parent: null
    common_fields: true
    fields:
      - { name: appointment_id, type: string, source: input, description: "FK -> Appointment.id; originating intake appointment (must be CHECKED_IN); at most one return per appointment" }
      - { name: taxpayer_id, type: string, source: system, description: "FK -> Taxpayer.id; copied from the appointment" }
      - { name: site_id, type: string, source: system, description: "FK -> Site.id; copied from the appointment" }
      - { name: preparer_id, type: string, source: system, description: "FK -> Volunteer.id; set to the acting Preparer's X-User-ID at creation" }
      - { name: reviewer_id, type: string, source: system, description: "FK -> Volunteer.id; set to the acting QualityReviewer on the latest review; null until first review", default: null }
      - { name: tax_year, type: integer, source: input, description: "Tax year of the return (e.g. 2025)" }
      - { name: filing_status, type: enum, source: input, description: "SINGLE | MARRIED_JOINT | HEAD_OF_HOUSEHOLD | MARRIED_SEPARATE; MARRIED_SEPARATE is out of VITA scope" }
      - { name: has_advanced_scope_items, type: boolean, source: input, description: "True when the return includes advanced-certification topics (requires an ADVANCED-certified preparer)", default: false }
      - { name: out_of_scope_flags, type: array, source: input, description: "Subset of {RENTAL_INCOME, BUSINESS_WITH_LOSS, FOREIGN_EARNED_INCOME, CASUALTY_LOSS}; any non-empty set makes the return out of scope", default: [] }
      - { name: status, type: enum, source: system, description: "INTAKE_STARTED | IN_PREPARATION | PENDING_QR | QR_FAILED | QR_PASSED | TRANSMITTED | ACCEPTED | REJECTED | COMPLETED | REFERRED | WITHDRAWN", default: INTAKE_STARTED }
      - { name: documents_received, type: array, source: input, description: "Subset of {PHOTO_ID, SSN_CARD, W2, FORM_1099, PRIOR_YEAR_RETURN, BANK_INFO}", default: [] }
      - { name: interview_confirmed, type: boolean, source: input, description: "True after the intake/interview sheet has been reviewed with the taxpayer", default: false }
      - { name: wages_cents, type: integer, source: input, description: "W-2 wages in cents", default: 0, constraints: ">= 0" }
      - { name: other_income_cents, type: integer, source: input, description: "Other income in cents", default: 0, constraints: ">= 0" }
      - { name: earned_income_cents, type: integer, source: input, description: "Earned income in cents (EITC base)", default: 0, constraints: ">= 0" }
      - { name: withholding_reported_cents, type: integer, source: input, description: "Taxpayer-reported withholding from intake (drives the estimate variant)", default: 0, constraints: ">= 0" }
      - { name: withholding_verified_cents, type: integer, source: input, description: "Document-verified withholding; required before submit-for-review (drives the final variant)", default: null, constraints: ">= 0 when present" }
      - { name: qualifying_children, type: integer, source: input, description: "Number of qualifying children for EITC", default: 0, constraints: "0..10" }
      - { name: refund_method, type: enum, source: input, description: "PAPER_CHECK | DIRECT_DEPOSIT", default: PAPER_CHECK }
      - { name: documents_complete, type: boolean, source: computed, description: "true iff {PHOTO_ID, SSN_CARD, W2} subset of documents_received AND (refund_method != DIRECT_DEPOSIT OR BANK_INFO in documents_received)" }
      - { name: out_of_scope, type: boolean, source: computed, description: "true iff out_of_scope_flags non-empty OR filing_status == MARRIED_SEPARATE" }
      - { name: out_of_scope_reasons, type: array, source: computed, description: "out_of_scope_flags plus FILING_STATUS_MFS when filing_status == MARRIED_SEPARATE" }
      - { name: estimated_refund_cents, type: integer, source: computed, description: "Provisional variant per calculations.refund_estimate; recomputed on every PATCH" }
      - { name: final_refund_cents, type: integer, source: computed, description: "Final variant per calculations.refund_final; computed on each entry into PENDING_QR; null before first submit", default: null }
      - { name: savings_match_cents, type: integer, source: computed, description: "Sponsor savings-match incentive per calculations.savings_match (derived from SAVINGS RefundAllocations)" }
      - { name: submission_count, type: integer, source: system, description: "Number of successful transmissions; increments on each entry into TRANSMITTED", default: 0 }
      - { name: first_ack_outcome, type: enum, source: system, description: "ACCEPTED | REJECTED; recorded on the first acknowledgement only; null until then", default: null }
      - { name: qr_failure_count, type: integer, source: system, description: "Number of PENDING_QR -> QR_FAILED transitions", default: 0 }
      - { name: reached_preparation, type: boolean, source: system, description: "Set true on first entry into IN_PREPARATION; never cleared", default: false }
      - { name: transmitted_at, type: datetime, source: system, description: "Timestamp of latest entry into TRANSMITTED", default: null }
      - { name: referral_reason, type: string, source: system, description: "Recorded on transition to REFERRED", default: null }
      - { name: referral_destination, type: string, source: system, description: "Recorded on transition to REFERRED", default: null }
      - { name: withdrawal_reason, type: string, source: system, description: "Recorded on transition to WITHDRAWN", default: null }
      - { name: version, type: integer, source: system, description: "Optimistic concurrency version" }

  - name: RefundAllocation
    parent: null
    common_fields: true
    fields:
      - { name: tax_return_id, type: string, source: input, description: "FK -> TaxReturn.id; return receiving the refund" }
      - { name: account_type, type: enum, source: input, description: "CHECKING | SAVINGS" }
      - { name: routing_number, type: string, source: input, description: "9-digit routing number", constraints: "^[0-9]{9}$" }
      - { name: account_number_mask, type: string, source: input, description: "Masked account number (e.g. ****6789)" }
      - { name: amount_cents, type: integer, source: input, description: "Fixed cents directed to this account", constraints: ">= 1" }
      - { name: version, type: integer, source: system, description: "Optimistic concurrency version" }

  - name: EfileRejection
    parent: null
    common_fields: true
    fields:
      - { name: tax_return_id, type: string, source: system, description: "FK -> TaxReturn.id; rejected return" }
      - { name: rejection_code, type: string, source: input, description: "IRS reject code recorded at acknowledgement (e.g. R0000-503)" }
      - { name: rejection_text, type: string, source: input, description: "Reject description recorded at acknowledgement" }
      - { name: submission_number, type: integer, source: system, description: "Value of the return's submission_count at the time of this rejection" }
      - { name: follow_up_status, type: enum, source: system, description: "OPEN | CONTACTED | RESOLVED", default: OPEN }
      - { name: follow_up_due_at, type: datetime, source: computed, description: "created_at + FOLLOW_UP_DUE_DAYS (5 days)" }
      - { name: follow_up_overdue, type: boolean, source: computed, description: "true iff follow_up_status != RESOLVED AND current logical time > follow_up_due_at" }
      - { name: contacted_at, type: datetime, source: system, description: "Set when follow_up records CONTACTED", default: null }
      - { name: resolved_at, type: datetime, source: system, description: "Set when follow_up records RESOLVED", default: null }
      - { name: resolution_note, type: string, source: system, description: "Required when recording RESOLVED", default: null }
      - { name: version, type: integer, source: system, description: "Optimistic concurrency version" }

  - name: SiteReport
    parent: null
    common_fields: true
    fields:
      - { name: site_id, type: string, source: system, description: "FK -> Site.id; reported site (from path)" }
      - { name: period_start, type: datetime, source: input, description: "Reporting period label start (inclusive); metadata only — aggregates are lifetime-to-date at generation" }
      - { name: period_end, type: datetime, source: input, description: "Reporting period label end; must be > period_start" }
      - { name: status, type: enum, source: system, description: "DRAFT | SUBMITTED | ACKNOWLEDGED", default: DRAFT }
      - { name: generated_at, type: datetime, source: system, description: "Logical timestamp when the report snapshot was computed" }
      - { name: returns_prepared_count, type: integer, source: computed, description: "Returns of the site with reached_preparation == true" }
      - { name: returns_transmitted_count, type: integer, source: computed, description: "Returns of the site with submission_count >= 1" }
      - { name: returns_accepted_count, type: integer, source: computed, description: "Returns of the site with status IN {ACCEPTED, COMPLETED}" }
      - { name: returns_rejected_open_count, type: integer, source: computed, description: "Returns of the site with status == REJECTED" }
      - { name: returns_referred_count, type: integer, source: computed, description: "Returns of the site with status == REFERRED" }
      - { name: returns_withdrawn_count, type: integer, source: computed, description: "Returns of the site with status == WITHDRAWN" }
      - { name: qr_rework_total, type: integer, source: computed, description: "Sum of qr_failure_count over returns of the site" }
      - { name: first_pass_accepted_count, type: integer, source: computed, description: "Returns of the site with first_ack_outcome == ACCEPTED" }
      - { name: first_pass_acceptance_rate_bp, type: integer, source: computed, description: "round_half_up(first_pass_accepted_count * 10000 / returns_transmitted_count); null when denominator is 0" }
      - { name: final_resolution_rate_bp, type: integer, source: computed, description: "round_half_up(returns_accepted_count * 10000 / returns_transmitted_count); null when denominator is 0" }
      - { name: financial_referrals_accepted_count, type: integer, source: computed, description: "FinancialServiceReferrals of the site's returns with status IN {ACCEPTED, ENROLLED}" }
      - { name: savings_match_total_cents, type: integer, source: computed, description: "Sum of savings_match_cents over the site's returns with status IN {TRANSMITTED, ACCEPTED, COMPLETED}" }
      - { name: version, type: integer, source: system, description: "Optimistic concurrency version" }

  - name: FinancialServiceReferral
    parent: null
    common_fields: true
    fields:
      - { name: tax_return_id, type: string, source: system, description: "FK -> TaxReturn.id; return whose taxpayer is referred (from path)" }
      - { name: service_type, type: enum, source: input, description: "SAVINGS_ACCOUNT | CREDIT_COUNSELING | BANK_ACCOUNT | FINANCIAL_COACHING" }
      - { name: status, type: enum, source: system, description: "OFFERED | ACCEPTED | ENROLLED | DECLINED | VOID", default: OFFERED }
      - { name: offered_by, type: string, source: system, description: "Volunteer id of the actor who offered; null for AUTO_ON_ACCEPT rows" }
      - { name: source, type: enum, source: system, description: "MANUAL | AUTO_ON_ACCEPT; AUTO_ON_ACCEPT rows are created by the ACCEPTED transition when the return has at least one SAVINGS RefundAllocation", default: MANUAL }
      - { name: version, type: integer, source: system, description: "Optimistic concurrency version" }

# =============================================================================
# §1.2 State Machine Table
# =============================================================================
state_machines:
  - entity: Site
    initial_state: SETUP
    terminal_states: [CLOSED]
    transitions:
      - from: SETUP
        to: CERTIFIED
        trigger: "POST /sites/{id}/state {to_status: CERTIFIED}"
        actor: SiteCoordinator
        preconditions:
          - "At least one Volunteer with site_id = this site, is_coordinator == true, status == ACTIVE (ERR_INVALID_TRANSITION otherwise)"
        side_effects: []
      - from: CERTIFIED
        to: OPEN
        trigger: "POST /sites/{id}/state {to_status: OPEN}"
        actor: SiteCoordinator
        preconditions:
          - "Current logical time within [season_start, season_end] inclusive (ERR_INVALID_TRANSITION otherwise)"
        side_effects: []
      - from: OPEN
        to: SUSPENDED
        trigger: "POST /sites/{id}/state {to_status: SUSPENDED}"
        actor: SiteCoordinator
        preconditions: []
        side_effects:
          - "Cascade link 1: every Appointment with site_id = this site and status IN {SCHEDULED, CHECKED_IN} -> CANCELLED"
          - "Cascade link 2: each Appointment cancelled by link 1 that is the appointment_id of a TaxReturn with status == INTAKE_STARTED causes that TaxReturn -> WITHDRAWN (withdrawal_reason = SITE_SUSPENDED)"
          - "Cascade link 3: each TaxReturn withdrawn by link 2 causes its FinancialServiceReferrals with status IN {OFFERED, ACCEPTED} -> VOID"
      - from: SUSPENDED
        to: OPEN
        trigger: "POST /sites/{id}/state {to_status: OPEN}"
        actor: SiteCoordinator
        preconditions: []
        side_effects: []
      - from: OPEN
        to: CLOSED
        trigger: "POST /sites/{id}/state {to_status: CLOSED}"
        actor: SiteCoordinator
        preconditions:
          - "No Appointments with site_id = this site and status IN {SCHEDULED, CHECKED_IN} (ERR_SITE_HAS_OPEN_WORK)"
          - "No TaxReturns with site_id = this site and status IN {INTAKE_STARTED, IN_PREPARATION, PENDING_QR, QR_FAILED, QR_PASSED, TRANSMITTED, REJECTED} (ERR_SITE_HAS_OPEN_WORK)"
        side_effects: []
      - from: SUSPENDED
        to: CLOSED
        trigger: "POST /sites/{id}/state {to_status: CLOSED}"
        actor: SiteCoordinator
        preconditions:
          - "Same open-work guard as OPEN -> CLOSED (ERR_SITE_HAS_OPEN_WORK)"
        side_effects: []

  - entity: Volunteer
    initial_state: REGISTERED
    terminal_states: []
    transitions:
      - from: REGISTERED
        to: ACTIVE
        trigger: "POST /volunteers/{id}/state {to_status: ACTIVE}"
        actor: SiteCoordinator | SponsorAdmin
        preconditions:
          - "Volunteer holds a Certification with test_type == ETHICS, status CURRENT, passed == true, tax_season == CURRENT_SEASON 2026 (ERR_VOLUNTEER_NOT_CERTIFIED)"
          - "Volunteer's Site status != CLOSED (ERR_INVALID_TRANSITION); activation is allowed while the site is still in SETUP so the first coordinator can bootstrap certification"
        side_effects: []
      - from: ACTIVE
        to: INACTIVE
        trigger: "POST /volunteers/{id}/state {to_status: INACTIVE} OR system auto-demotion when the volunteer's CURRENT ETHICS certification for season 2026 is superseded by a failed attempt"
        actor: SiteCoordinator | system
        preconditions: []
        side_effects:
          - "Cascade: every Appointment with volunteer_id = this volunteer and status == SCHEDULED -> CANCELLED; each such cancelled Appointment that is the appointment_id of a TaxReturn with status == INTAKE_STARTED causes that TaxReturn -> WITHDRAWN (withdrawal_reason = VOLUNTEER_INACTIVATED)"
      - from: INACTIVE
        to: ACTIVE
        trigger: "POST /volunteers/{id}/state {to_status: ACTIVE}"
        actor: SiteCoordinator | SponsorAdmin
        preconditions:
          - "Same ETHICS-certification precondition as REGISTERED -> ACTIVE (ERR_VOLUNTEER_NOT_CERTIFIED)"
        side_effects: []

  - entity: Certification
    initial_state: CURRENT
    terminal_states: [SUPERSEDED]
    transitions:
      - from: CURRENT
        to: SUPERSEDED
        trigger: "system: recording a new Certification for the same (volunteer_id, test_type, tax_season)"
        actor: system
        preconditions: []
        side_effects:
          - "The new Certification becomes the CURRENT row; attempt_number = old count + 1"
          - "If the superseded row was the volunteer's only CURRENT passed ETHICS certification for season 2026 and the new attempt has passed == false, the Volunteer auto-transitions ACTIVE -> INACTIVE (with its appointment-cancel cascade)"

  - entity: Taxpayer
    initial_state: UNVERIFIED
    terminal_states: [VERIFIED]
    transitions:
      - from: UNVERIFIED
        to: VERIFIED
        trigger: "POST /taxpayers/{id}/verify-identity"
        actor: Screener | SiteCoordinator
        preconditions: []
        side_effects:
          - "id_document_type set from request"

  - entity: Appointment
    initial_state: SCHEDULED
    terminal_states: [COMPLETED, CANCELLED, NO_SHOW]
    transitions:
      - from: SCHEDULED
        to: CHECKED_IN
        trigger: "POST /appointments/{id}/state {to_status: CHECKED_IN}"
        actor: Screener | SiteCoordinator
        preconditions:
          - "Site of the appointment has status == OPEN (ERR_SITE_NOT_OPEN)"
        side_effects: []
      - from: CHECKED_IN
        to: COMPLETED
        trigger: "POST /appointments/{id}/state {to_status: COMPLETED}"
        actor: Screener | SiteCoordinator
        preconditions: []
        side_effects: []
      - from: SCHEDULED
        to: CANCELLED
        trigger: "POST /appointments/{id}/state {to_status: CANCELLED} OR site-suspend / volunteer-inactivation cascades"
        actor: Screener | SiteCoordinator | system
        preconditions: []
        side_effects:
          - "If this Appointment is the appointment_id of a TaxReturn with status == INTAKE_STARTED, that TaxReturn -> WITHDRAWN (withdrawal_reason = APPOINTMENT_CANCELLED)"
      - from: CHECKED_IN
        to: CANCELLED
        trigger: "POST /appointments/{id}/state {to_status: CANCELLED} OR site-suspend cascade"
        actor: Screener | SiteCoordinator | system
        preconditions: []
        side_effects:
          - "If this Appointment is the appointment_id of a TaxReturn with status == INTAKE_STARTED, that TaxReturn -> WITHDRAWN (withdrawal_reason = APPOINTMENT_CANCELLED)"
      - from: SCHEDULED
        to: NO_SHOW
        trigger: "POST /appointments/{id}/state {to_status: NO_SHOW}"
        actor: Screener | SiteCoordinator
        preconditions:
          - "Current logical time >= start_at (ERR_INVALID_TRANSITION otherwise)"
        side_effects: []

  - entity: TaxReturn
    initial_state: INTAKE_STARTED
    terminal_states: [COMPLETED, REFERRED, WITHDRAWN]
    transitions:
      - from: INTAKE_STARTED
        to: IN_PREPARATION
        trigger: "POST /tax-returns/{id}/state {to_status: IN_PREPARATION}"
        actor: Preparer (X-User-ID == preparer_id, else ERR_NOT_RETURN_OWNER)
        preconditions:
          - "documents_complete == true (ERR_DOCUMENTS_INCOMPLETE)"
          - "interview_confirmed == true (ERR_DOCUMENTS_INCOMPLETE)"
          - "out_of_scope == false (ERR_OUT_OF_SCOPE)"
        side_effects:
          - "reached_preparation = true; preparer's active_case_count increases by 1"
      - from: IN_PREPARATION
        to: PENDING_QR
        trigger: "POST /tax-returns/{id}/state {to_status: PENDING_QR}"
        actor: Preparer (X-User-ID == preparer_id, else ERR_NOT_RETURN_OWNER)
        preconditions:
          - "withholding_verified_cents is not null (ERR_INVALID_REQUEST)"
          - "out_of_scope == false (ERR_OUT_OF_SCOPE)"
        side_effects:
          - "final_refund_cents computed per calculations.refund_final; preparer's active_case_count decreases by 1"
      - from: PENDING_QR
        to: QR_PASSED
        trigger: "POST /tax-returns/{id}/state {to_status: QR_PASSED}"
        actor: QualityReviewer
        preconditions:
          - "Reviewer is a Volunteer with status == ACTIVE and holds CURRENT passed INTAKE_QR and ADVANCED certifications for season 2026 (ERR_REVIEWER_NOT_CERTIFIED)"
          - "Reviewer X-User-ID != preparer_id (ERR_REVIEWER_IS_PREPARER)"
        side_effects:
          - "reviewer_id = acting reviewer's X-User-ID"
      - from: PENDING_QR
        to: QR_FAILED
        trigger: "POST /tax-returns/{id}/state {to_status: QR_FAILED}"
        actor: QualityReviewer
        preconditions:
          - "Same reviewer-certification and segregation preconditions as QR_PASSED"
          - "review_notes present (ERR_INVALID_REQUEST)"
        side_effects:
          - "reviewer_id = acting reviewer; qr_failure_count += 1"
      - from: QR_FAILED
        to: IN_PREPARATION
        trigger: "POST /tax-returns/{id}/state {to_status: IN_PREPARATION}"
        actor: Preparer (X-User-ID == preparer_id, else ERR_NOT_RETURN_OWNER)
        preconditions: []
        side_effects:
          - "preparer's active_case_count increases by 1"
      - from: QR_PASSED
        to: TRANSMITTED
        trigger: "POST /tax-returns/{id}/state {to_status: TRANSMITTED}"
        actor: SiteCoordinator
        preconditions:
          - "Site of the return has status == OPEN (ERR_SITE_NOT_OPEN)"
          - "If refund_method == DIRECT_DEPOSIT: RefundAllocation rows for the return number 1..3 and sum(amount_cents) == final_refund_cents (ERR_ALLOCATION_SUM_MISMATCH)"
        side_effects:
          - "submission_count += 1; transmitted_at = current logical time"
      - from: TRANSMITTED
        to: ACCEPTED
        trigger: "POST /tax-returns/{id}/state {to_status: ACCEPTED}"
        actor: SiteCoordinator
        preconditions: []
        side_effects:
          - "first_ack_outcome = ACCEPTED if null"
          - "If the return has at least one RefundAllocation with account_type == SAVINGS and no FinancialServiceReferral with service_type == SAVINGS_ACCOUNT exists for the return, auto-create one with status OFFERED, source AUTO_ON_ACCEPT"
      - from: TRANSMITTED
        to: REJECTED
        trigger: "POST /tax-returns/{id}/state {to_status: REJECTED}"
        actor: SiteCoordinator
        preconditions:
          - "rejection_code and rejection_text present (ERR_INVALID_REQUEST)"
        side_effects:
          - "first_ack_outcome = REJECTED if null"
          - "Create EfileRejection (tax_return_id = this return, submission_number = submission_count, follow_up_status = OPEN)"
      - from: REJECTED
        to: IN_PREPARATION
        trigger: "POST /tax-returns/{id}/state {to_status: IN_PREPARATION}"
        actor: Preparer (X-User-ID == preparer_id, else ERR_NOT_RETURN_OWNER)
        preconditions:
          - "All EfileRejections of the return have follow_up_status == RESOLVED (ERR_REJECTION_UNRESOLVED)"
          - "submission_count < MAX_SUBMISSIONS 3 (ERR_MAX_SUBMISSIONS_REACHED)"
        side_effects:
          - "preparer's active_case_count increases by 1"
      - from: REJECTED
        to: REFERRED
        trigger: "POST /tax-returns/{id}/state {to_status: REFERRED}"
        actor: Preparer | QualityReviewer | SiteCoordinator
        preconditions:
          - "referral_reason and referral_destination present (ERR_INVALID_REQUEST)"
        side_effects:
          - "FinancialServiceReferrals of the return with status IN {OFFERED, ACCEPTED} -> VOID"
      - from: INTAKE_STARTED
        to: REFERRED
        trigger: "POST /tax-returns/{id}/state {to_status: REFERRED}"
        actor: Preparer | QualityReviewer | SiteCoordinator
        preconditions: ["referral_reason and referral_destination present (ERR_INVALID_REQUEST)"]
        side_effects: ["FinancialServiceReferrals with status IN {OFFERED, ACCEPTED} -> VOID"]
      - from: IN_PREPARATION
        to: REFERRED
        trigger: "POST /tax-returns/{id}/state {to_status: REFERRED}"
        actor: Preparer | QualityReviewer | SiteCoordinator
        preconditions: ["referral_reason and referral_destination present (ERR_INVALID_REQUEST)"]
        side_effects:
          - "preparer's active_case_count decreases by 1"
          - "FinancialServiceReferrals with status IN {OFFERED, ACCEPTED} -> VOID"
      - from: PENDING_QR
        to: REFERRED
        trigger: "POST /tax-returns/{id}/state {to_status: REFERRED}"
        actor: Preparer | QualityReviewer | SiteCoordinator
        preconditions: ["referral_reason and referral_destination present (ERR_INVALID_REQUEST)"]
        side_effects: ["FinancialServiceReferrals with status IN {OFFERED, ACCEPTED} -> VOID"]
      - from: QR_FAILED
        to: REFERRED
        trigger: "POST /tax-returns/{id}/state {to_status: REFERRED}"
        actor: Preparer | QualityReviewer | SiteCoordinator
        preconditions: ["referral_reason and referral_destination present (ERR_INVALID_REQUEST)"]
        side_effects: ["FinancialServiceReferrals with status IN {OFFERED, ACCEPTED} -> VOID"]
      - from: QR_PASSED
        to: REFERRED
        trigger: "POST /tax-returns/{id}/state {to_status: REFERRED}"
        actor: Preparer | QualityReviewer | SiteCoordinator
        preconditions: ["referral_reason and referral_destination present (ERR_INVALID_REQUEST)"]
        side_effects: ["FinancialServiceReferrals with status IN {OFFERED, ACCEPTED} -> VOID"]
      - from: INTAKE_STARTED
        to: WITHDRAWN
        trigger: "POST /tax-returns/{id}/state {to_status: WITHDRAWN} OR appointment-cancel / site-suspend / volunteer-inactivation cascades"
        actor: Preparer | SiteCoordinator | system
        preconditions: ["withdrawal_reason present when actor-driven (ERR_INVALID_REQUEST)"]
        side_effects: ["FinancialServiceReferrals with status IN {OFFERED, ACCEPTED} -> VOID"]
      - from: IN_PREPARATION
        to: WITHDRAWN
        trigger: "POST /tax-returns/{id}/state {to_status: WITHDRAWN}"
        actor: Preparer | SiteCoordinator
        preconditions: ["withdrawal_reason present (ERR_INVALID_REQUEST)"]
        side_effects:
          - "preparer's active_case_count decreases by 1"
          - "FinancialServiceReferrals with status IN {OFFERED, ACCEPTED} -> VOID"
      - from: PENDING_QR
        to: WITHDRAWN
        trigger: "POST /tax-returns/{id}/state {to_status: WITHDRAWN}"
        actor: Preparer | SiteCoordinator
        preconditions: ["withdrawal_reason present (ERR_INVALID_REQUEST)"]
        side_effects: ["FinancialServiceReferrals with status IN {OFFERED, ACCEPTED} -> VOID"]
      - from: QR_FAILED
        to: WITHDRAWN
        trigger: "POST /tax-returns/{id}/state {to_status: WITHDRAWN}"
        actor: Preparer | SiteCoordinator
        preconditions: ["withdrawal_reason present (ERR_INVALID_REQUEST)"]
        side_effects: ["FinancialServiceReferrals with status IN {OFFERED, ACCEPTED} -> VOID"]
      - from: QR_PASSED
        to: WITHDRAWN
        trigger: "POST /tax-returns/{id}/state {to_status: WITHDRAWN}"
        actor: Preparer | SiteCoordinator
        preconditions: ["withdrawal_reason present (ERR_INVALID_REQUEST)"]
        side_effects: ["FinancialServiceReferrals with status IN {OFFERED, ACCEPTED} -> VOID"]
      - from: REJECTED
        to: WITHDRAWN
        trigger: "POST /tax-returns/{id}/state {to_status: WITHDRAWN}"
        actor: Preparer | SiteCoordinator
        preconditions: ["withdrawal_reason present (ERR_INVALID_REQUEST)"]
        side_effects: ["FinancialServiceReferrals with status IN {OFFERED, ACCEPTED} -> VOID"]
      - from: ACCEPTED
        to: COMPLETED
        trigger: "POST /tax-returns/{id}/state {to_status: COMPLETED}"
        actor: SiteCoordinator
        preconditions:
          - "disbursement_confirmed == true AND taxpayer_notified == true (ERR_INVALID_REQUEST)"
        side_effects: []

  - entity: EfileRejection
    initial_state: OPEN
    terminal_states: [RESOLVED]
    transitions:
      - from: OPEN
        to: CONTACTED
        trigger: "POST /efile-rejections/{id}/follow-up {outcome: CONTACTED}"
        actor: QualityReviewer | SiteCoordinator
        preconditions: []
        side_effects: ["contacted_at = current logical time"]
      - from: OPEN
        to: RESOLVED
        trigger: "POST /efile-rejections/{id}/follow-up {outcome: RESOLVED}"
        actor: QualityReviewer | SiteCoordinator
        preconditions: ["resolution_note present (ERR_INVALID_REQUEST)"]
        side_effects: ["resolved_at = current logical time"]
      - from: CONTACTED
        to: RESOLVED
        trigger: "POST /efile-rejections/{id}/follow-up {outcome: RESOLVED}"
        actor: QualityReviewer | SiteCoordinator
        preconditions: ["resolution_note present (ERR_INVALID_REQUEST)"]
        side_effects: ["resolved_at = current logical time"]

  - entity: SiteReport
    initial_state: DRAFT
    terminal_states: [ACKNOWLEDGED]
    transitions:
      - from: DRAFT
        to: SUBMITTED
        trigger: "POST /site-reports/{id}/state {to_status: SUBMITTED}"
        actor: SiteCoordinator
        preconditions: []
        side_effects: []
      - from: SUBMITTED
        to: ACKNOWLEDGED
        trigger: "POST /site-reports/{id}/state {to_status: ACKNOWLEDGED}"
        actor: SponsorAdmin
        preconditions: []
        side_effects: []

  - entity: FinancialServiceReferral
    initial_state: OFFERED
    terminal_states: [ENROLLED, DECLINED, VOID]
    transitions:
      - from: OFFERED
        to: ACCEPTED
        trigger: "POST /financial-referrals/{id}/state {to_status: ACCEPTED}"
        actor: Preparer | SiteCoordinator
        preconditions: []
        side_effects: []
      - from: ACCEPTED
        to: ENROLLED
        trigger: "POST /financial-referrals/{id}/state {to_status: ENROLLED}"
        actor: Preparer | SiteCoordinator
        preconditions: []
        side_effects: []
      - from: OFFERED
        to: DECLINED
        trigger: "POST /financial-referrals/{id}/state {to_status: DECLINED}"
        actor: Preparer | SiteCoordinator
        preconditions: []
        side_effects: []
      - from: OFFERED
        to: VOID
        trigger: "system: parent TaxReturn transitions to WITHDRAWN or REFERRED"
        actor: system
        preconditions: []
        side_effects: []
      - from: ACCEPTED
        to: VOID
        trigger: "system: parent TaxReturn transitions to WITHDRAWN or REFERRED"
        actor: system
        preconditions: []
        side_effects: []

# =============================================================================
# §1.2.1 Concurrency Rules (true races only; OCC on parent version)
# =============================================================================
concurrency_rules:
  - rule_id: return-update-stale-version
    parent_entity: TaxReturn
    write_endpoint: "PATCH /tax-returns/{id}"
    occ_field: "expected_return_version"
    description: |
      Updating a TaxReturn whose version has advanced since the client last
      observed it is rejected. The loser's intake edits were computed from a
      stale view of the return (e.g., another writer has since updated the
      verified withholding), so the server requires the client to re-read
      before writing.
    error_id: ERR_STALE_VERSION
    http_status: 412
  - rule_id: certification-record-stale-volunteer
    parent_entity: Volunteer
    write_endpoint: "POST /volunteers/{id}/certifications"
    occ_field: "expected_volunteer_version"
    description: |
      Recording a Certification against a Volunteer whose version has advanced
      since the client last observed it is rejected. Recording a new attempt
      legitimately supersedes the prior CURRENT attempt of the same
      (test_type, tax_season), so a client holding a stale view of the
      volunteer must re-read before its attempt is accepted.
    error_id: ERR_STALE_VERSION
    http_status: 412

# =============================================================================
# §1.3 Calculation Rules Table
# =============================================================================
calculations:
  - name: certification_result
    trigger: "POST /volunteers/{id}/certifications"
    algorithm: threshold
    formula: |
      passed = (score >= PASS_SCORE)              # PASS_SCORE = 80, inclusive
      attempt_number = 1 + count of existing Certification rows for
                       (volunteer_id, test_type, tax_season)
      The new row becomes CURRENT; every earlier row for the same triple -> SUPERSEDED.
    input_set: "the new attempt plus all existing Certification rows for the same (volunteer_id, test_type, tax_season)"
    constants:
      PASS_SCORE: 80
      CURRENT_SEASON: 2026
    precision: "integer score; no rounding"
    variants: []

  - name: refund_estimate
    trigger: "any PATCH /tax-returns/{id} that changes wages_cents, other_income_cents, earned_income_cents, withholding_reported_cents, or qualifying_children; also evaluated at creation (all money fields default 0)"
    algorithm: threshold
    formula: |
      eitc_estimate_cents   = min(round_half_up(EITC_EST_RATE * earned_income_cents), EITC_EST_CAP_CENTS)
      estimated_refund_cents = withholding_reported_cents + eitc_estimate_cents
      # Provisional variant deliberately assumes zero tax liability and uses
      # self-reported withholding; used only for the intake estimate.
    input_set: "the single TaxReturn being patched; no other entities"
    constants:
      EITC_EST_RATE: 0.15
      EITC_EST_CAP_CENTS: 600000
    precision: "integer cents; round_half_up applied to each rate multiplication before min()"
    variants:
      - name: provisional
        when: "intake stage, before document verification"
        difference: "flat 15% EITC estimate capped at $6,000, no tax liability subtracted, uses withholding_reported_cents"

  - name: refund_final
    trigger: "TaxReturn transition IN_PREPARATION -> PENDING_QR (submit-for-review); recomputed on every such entry"
    algorithm: tiered_pricing
    formula: |
      # Tier selection on qualifying_children, then a cap min(), then liability max().
      if qualifying_children == 0: rate = 0.10, cap = 60000
      elif qualifying_children == 1: rate = 0.20, cap = 400000
      else:                          rate = 0.25, cap = 650000
      eitc_final_cents = min(round_half_up(rate * earned_income_cents), cap)
      tax_liability_cents = round_half_up(TAX_RATE * (wages_cents + other_income_cents))
      final_refund_cents = max(0, withholding_verified_cents + eitc_final_cents - tax_liability_cents)
      # Evaluation order pinned: tier rate/cap -> eitc min() -> liability -> refund max().
    input_set: "the single TaxReturn entering PENDING_QR"
    constants:
      TAX_RATE: 0.12
    precision: "integer cents; round_half_up applied to each rate multiplication before min()/max()"
    variants:
      - name: final
        when: "quality-review submission, after document verification"
        difference: "tiered EITC by qualifying_children with per-tier caps, flat 12% liability subtracted, uses withholding_verified_cents; identical inputs yield a different refund than the provisional variant because the rate structure and liability treatment differ"

  - name: savings_match
    trigger: "any create/delete of a RefundAllocation for the return; also on any PATCH that changes allocations-relevant state"
    algorithm: aggregation
    formula: |
      # Rounding order pinned: floor EACH SAVINGS line to whole dollars first, then sum, then cap.
      for each RefundAllocation of the return where account_type == SAVINGS:
        line_match_cents = floor(amount_cents / 200) * 100    # 50% of line, floored to whole dollars
      savings_match_cents = min(sum(line_match_cents), MATCH_CAP_CENTS)
      # Note: floor(sum * 0.5) is the FORBIDDEN alternative order; e.g. two SAVINGS
      # lines of 3333 cents each yield 1600 + 1600 = 3200 here, not floor(3333.00) = 3300.
    input_set: "RefundAllocation rows of the single TaxReturn with account_type == SAVINGS"
    constants:
      MATCH_RATE: 0.5
      MATCH_CAP_CENTS: 10000
    precision: "integer cents; per-line floor to whole dollars BEFORE summation"
    variants: []

  - name: site_report_aggregates
    trigger: "POST /sites/{id}/reports — snapshot computed once at creation; immutable thereafter"
    algorithm: aggregation
    formula: |
      Let R = all TaxReturns with site_id == this site (any status, lifetime-to-date).
      returns_prepared_count        = |r in R : r.reached_preparation == true|
      returns_transmitted_count     = |r in R : r.submission_count >= 1|
      returns_accepted_count        = |r in R : r.status IN {ACCEPTED, COMPLETED}|
      returns_rejected_open_count   = |r in R : r.status == REJECTED|
      returns_referred_count        = |r in R : r.status == REFERRED|
      returns_withdrawn_count       = |r in R : r.status == WITHDRAWN|
      qr_rework_total               = sum(r.qr_failure_count for r in R)
      first_pass_accepted_count     = |r in R : r.first_ack_outcome == ACCEPTED|
      if returns_transmitted_count == 0:
        first_pass_acceptance_rate_bp = null; final_resolution_rate_bp = null
      else:
        first_pass_acceptance_rate_bp = round_half_up(first_pass_accepted_count * 10000 / returns_transmitted_count)
        final_resolution_rate_bp      = round_half_up(returns_accepted_count * 10000 / returns_transmitted_count)
      financial_referrals_accepted_count = |referrals of R with status IN {ACCEPTED, ENROLLED}|
      savings_match_total_cents     = sum(r.savings_match_cents for r in R with r.status IN {TRANSMITTED, ACCEPTED, COMPLETED})
    input_set: "all TaxReturns of the site at generation time; period_start/period_end are labels only"
    constants: {}
    precision: "rates in basis points, integer, round_half_up; counts and cents exact"
    variants:
      - name: first_pass_acceptance
        when: "numerator = returns whose FIRST acknowledgement was ACCEPTED"
        difference: "a return rejected then reworked and accepted counts 0 here but 1 in final_resolution; identical data yields a lower rate whenever any transmitted return was rejected on first acknowledgement"
      - name: final_resolution
        when: "numerator = returns currently ACCEPTED or COMPLETED"
        difference: "counts eventual success regardless of first-pass history; >= first_pass rate for the same data"

  - name: appointment_conflict_check
    trigger: "POST /appointments and PATCH /appointments/{id} (when start_at/end_at/volunteer_id change)"
    algorithm: interval_merge
    formula: |
      # Intervals are half-open [start_at, end_at): two intervals overlap iff
      # a.start_at < b.end_at AND b.start_at < a.end_at. Adjacent intervals
      # (a.end_at == b.start_at) do NOT overlap.
      # Volunteer exclusion (binary): reject when ANY Appointment with
      #   volunteer_id == new.volunteer_id, status IN {SCHEDULED, CHECKED_IN}, overlaps
      #   the new interval -> ERR_APPOINTMENT_OVERLAP_VOLUNTEER.
      # Station capacity (aggregate): let C = count of Appointments with
      #   site_id == new.site_id, status IN {SCHEDULED, CHECKED_IN}, overlapping the new
      #   interval. Reject when C >= site.station_capacity -> ERR_SITE_CAPACITY_FULL.
      #   (C == station_capacity - 1 is the last allowed boundary.)
    input_set: "Appointments of the same volunteer (exclusion) and of the same site (capacity), status IN {SCHEDULED, CHECKED_IN}; excludes the appointment being patched"
    constants:
      MIN_DURATION_MINUTES: 15
      MAX_DURATION_MINUTES: 120
    precision: "instants compared exactly (ISO 8601 UTC); no rounding"
    variants: []

  - name: window_check
    trigger: "POST /appointments and PATCH /appointments/{id} (when start_at/end_at change)"
    algorithm: threshold
    formula: |
      # All violations map to ERR_OUTSIDE_SITE_WINDOW.
      start_at >= current logical time
      season_start <= start_at AND end_at <= season_end
      daily_open_hour:00 <= time(start_at) AND time(end_at) <= daily_close_hour:00
      MIN_DURATION_MINUTES <= (end_at - start_at) minutes <= MAX_DURATION_MINUTES
    input_set: "the single appointment being written and its Site"
    constants: {}
    precision: "minute precision for duration; instants exact"
    variants: []

# =============================================================================
# §1.4 Validation Rules Table (ordered by priority)
# =============================================================================
validations:
  - priority: 1
    category: auth
    check: "X-User-Role and X-User-ID headers present; role is a declared role; for entity_backed roles X-User-ID references an existing Volunteer"
    error_id: ERR_MISSING_AUTH_HEADER
    http_status: 401
    applies_to: "all endpoints"
  - priority: 2
    category: auth
    check: "Acting role is listed in the endpoint's roles AND transition-level actor rules hold: SiteCoordinator acting on /sites/{id}/* must have Volunteer.site_id == that site and is_coordinator == true (else ERR_FORBIDDEN_ROLE); Preparer-only transitions (INTAKE_STARTED->IN_PREPARATION, IN_PREPARATION->PENDING_QR, rework->IN_PREPARATION) require X-User-ID == return.preparer_id (else ERR_NOT_RETURN_OWNER)"
    error_id: "ERR_FORBIDDEN_ROLE / ERR_NOT_RETURN_OWNER"
    http_status: 403
    applies_to: "all endpoints"
  - priority: 3
    category: existence
    check: "Path and body-referenced resource ids exist, validated left-to-right (site, volunteer, taxpayer, appointment, tax return, allocation, rejection, report, referral)"
    error_id: ERR_NOT_FOUND
    http_status: 404
    applies_to: "all endpoints with resource ids"
  - priority: 4
    category: existence
    check: "Request schema: required fields present, types correct, enum values valid, unknown fields rejected; conditional required fields (review_notes on QR_FAILED; rejection_code/rejection_text on REJECTED; referral_reason/referral_destination on REFERRED; withdrawal_reason on actor-driven WITHDRAWN; disbursement_confirmed/taxpayer_notified on COMPLETED; resolution_note on follow-up RESOLVED; withholding_verified_cents non-null before PENDING_QR)"
    error_id: ERR_INVALID_REQUEST
    http_status: 400
    applies_to: "all endpoints"
  - priority: 5
    category: state
    check: "Target resource is in a state from which the requested transition exists in its state machine; terminal states accept no transitions"
    error_id: ERR_INVALID_TRANSITION
    http_status: 409
    applies_to: "all /state endpoints, verify-identity, follow-up, PATCH /tax-returns/{id} (editable only in INTAKE_STARTED/IN_PREPARATION), POST/DELETE /refund-allocations (return must be INTAKE_STARTED, IN_PREPARATION, or QR_PASSED — allocations stay editable until transmit), PATCH /appointments/{id} (must be SCHEDULED)"
  - priority: 6
    category: business_safety
    check: "Compliance gates, in order: (a) taxpayer identity_status == VERIFIED before return creation (ERR_IDENTITY_NOT_VERIFIED); (b) preparer Volunteer status == ACTIVE and holds CURRENT passed ETHICS+BASIC (+ADVANCED when has_advanced_scope_items) for season 2026 (ERR_VOLUNTEER_NOT_CERTIFIED); (c) reviewer Volunteer status == ACTIVE and holds CURRENT passed INTAKE_QR+ADVANCED (ERR_REVIEWER_NOT_CERTIFIED); (d) reviewer != preparer (ERR_REVIEWER_IS_PREPARER); (e) out_of_scope == false before IN_PREPARATION/PENDING_QR (ERR_OUT_OF_SCOPE)"
    error_id: "ERR_IDENTITY_NOT_VERIFIED / ERR_VOLUNTEER_NOT_CERTIFIED / ERR_REVIEWER_NOT_CERTIFIED / ERR_REVIEWER_IS_PREPARER / ERR_OUT_OF_SCOPE"
    http_status: 422
    applies_to: "POST /tax-returns, POST /tax-returns/{id}/state"
  - priority: 7
    category: business_constraint
    check: "Uniqueness and cardinality: ssn_token unique among Taxpayers (ERR_TAXPAYER_DUPLICATE_SSN); email unique among Volunteers (ERR_INVALID_REQUEST on collision); at most one non-terminal TaxReturn per (taxpayer_id, site_id) where non-terminal = status NOT IN {COMPLETED, REFERRED, WITHDRAWN} (ERR_OPEN_RETURN_EXISTS); at most one TaxReturn per appointment_id (ERR_APPOINTMENT_ALREADY_USED); RefundAllocation count per return <= 3 (ERR_ALLOCATION_LIMIT); overlapping-appointment count at the site < station_capacity (ERR_SITE_CAPACITY_FULL)"
    error_id: "ERR_TAXPAYER_DUPLICATE_SSN / ERR_OPEN_RETURN_EXISTS / ERR_APPOINTMENT_ALREADY_USED / ERR_ALLOCATION_LIMIT / ERR_SITE_CAPACITY_FULL"
    http_status: 409
    applies_to: "POST /taxpayers, POST /volunteers, POST /tax-returns, POST /refund-allocations, POST /appointments, PATCH /appointments/{id}"
  - priority: 8
    category: business_temporal
    check: "Temporal rules, window before overlap: appointment window/duration rules per calculations.window_check (ERR_OUTSIDE_SITE_WINDOW); volunteer half-open overlap exclusion per calculations.appointment_conflict_check (ERR_APPOINTMENT_OVERLAP_VOLUNTEER); report period_end > period_start (ERR_REPORT_PERIOD_INVALID)"
    error_id: "ERR_OUTSIDE_SITE_WINDOW / ERR_APPOINTMENT_OVERLAP_VOLUNTEER / ERR_REPORT_PERIOD_INVALID"
    http_status: 422
    applies_to: "POST /appointments, PATCH /appointments/{id}, POST /sites/{id}/reports"
  - priority: 9
    category: business_referential
    check: "Cross-entity state gates: appointment create requires Site status IN {CERTIFIED, OPEN} and assigned Volunteer status == ACTIVE (ERR_SITE_NOT_OPEN / ERR_VOLUNTEER_NOT_ACTIVE); check-in requires Site OPEN (ERR_SITE_NOT_OPEN); return creation requires Appointment status == CHECKED_IN (ERR_APPOINTMENT_NOT_CHECKED_IN) and Site OPEN (ERR_SITE_NOT_OPEN); transmit requires Site OPEN (ERR_SITE_NOT_OPEN); rework from REJECTED requires all EfileRejections RESOLVED (ERR_REJECTION_UNRESOLVED) and submission_count < 3 (ERR_MAX_SUBMISSIONS_REACHED)"
    error_id: "ERR_SITE_NOT_OPEN / ERR_VOLUNTEER_NOT_ACTIVE / ERR_APPOINTMENT_NOT_CHECKED_IN / ERR_REJECTION_UNRESOLVED / ERR_MAX_SUBMISSIONS_REACHED"
    http_status: 409
    applies_to: "POST /appointments, POST /appointments/{id}/state, POST /tax-returns, POST /tax-returns/{id}/state"
  - priority: 10
    category: business_fiscal
    check: "Money conservation at transmit: when refund_method == DIRECT_DEPOSIT, RefundAllocation rows number 1..3 and sum(amount_cents) == final_refund_cents (ERR_ALLOCATION_SUM_MISMATCH)"
    error_id: ERR_ALLOCATION_SUM_MISMATCH
    http_status: 422
    applies_to: "POST /tax-returns/{id}/state {to_status: TRANSMITTED}"

# =============================================================================
# §1.5 API Endpoint Table
# =============================================================================
endpoints:
  # --- bootstrap / test-driving ---
  - method: POST
    path: "/_clock/set_current_utc"
    description: "Sets the server's logical clock. Startup default is exactly 2026-08-01T00:00:00Z; the logical clock never falls back to wall-clock time."
    roles: [SponsorAdmin]
    code: 200
    input: [to_iso8601]
    output: { current_utc: string }
    side_effects: []

  # --- Site ---
  - method: POST
    path: "/sites"
    description: "Create a VITA site (status SETUP)"
    roles: [SponsorAdmin]
    code: 201
    input: [name, sponsor_org, station_capacity, season_start, season_end, daily_open_hour, daily_close_hour, goal_returns]
    output: Site
    side_effects: ["status = SETUP"]
  - method: GET
    path: "/sites/{id}"
    description: "Get a site (includes computed accepted_count, goal_met)"
    roles: [SiteCoordinator, Preparer, QualityReviewer, Screener, SponsorAdmin]
    code: 200
    input: []
    output: Site
    side_effects: []
  - method: POST
    path: "/sites/{id}/state"
    description: "Transition site status per Site state machine (includes SUSPENDED cascade)"
    roles: [SiteCoordinator]
    code: 200
    input: [to_status]
    output: Site
    side_effects: ["State transition per Site state machine including appointment-cancel cascade"]
  - method: GET
    path: "/sites/{id}/volunteers"
    description: "List volunteers of a site (reverse-reach for Volunteer.site_id); ordered by created_at ascending"
    roles: [SiteCoordinator, Preparer, QualityReviewer, Screener, SponsorAdmin]
    code: 200
    input: []
    output: Volunteer[]
    side_effects: []
  - method: POST
    path: "/sites/{id}/reports"
    description: "Generate a season-to-date statistics report snapshot (status DRAFT) for the sponsoring program"
    roles: [SiteCoordinator]
    code: 201
    input: [period_start, period_end]
    output: SiteReport
    side_effects: ["Aggregates computed per calculations.site_report_aggregates and frozen"]
  - method: GET
    path: "/sites/{id}/reports"
    description: "List reports of a site (reverse-reach for SiteReport.site_id); ordered by created_at ascending"
    roles: [SiteCoordinator, SponsorAdmin]
    code: 200
    input: []
    output: SiteReport[]
    side_effects: []
  - method: POST
    path: "/site-reports/{id}/state"
    description: "Submit (SiteCoordinator: DRAFT->SUBMITTED) or acknowledge (SponsorAdmin: SUBMITTED->ACKNOWLEDGED) a report"
    roles: [SiteCoordinator, SponsorAdmin]
    code: 200
    input: [to_status]
    output: SiteReport
    side_effects: ["State transition per SiteReport state machine"]

  # --- Volunteer / Certification ---
  - method: POST
    path: "/volunteers"
    description: "Register a volunteer at a site"
    roles: [SiteCoordinator, SponsorAdmin]
    code: 201
    input: [site_id, full_name, email, "is_coordinator?"]
    output: Volunteer
    side_effects: ["status = REGISTERED"]
  - method: GET
    path: "/volunteers/{id}"
    description: "Get a volunteer (includes computed certified_test_types, active_case_count)"
    roles: [SiteCoordinator, Preparer, QualityReviewer, Screener, SponsorAdmin]
    code: 200
    input: []
    output: Volunteer
    side_effects: []
  - method: POST
    path: "/volunteers/{id}/state"
    description: "Activate / inactivate a volunteer (ACTIVE requires CURRENT passed ETHICS cert for season 2026)"
    roles: [SiteCoordinator, SponsorAdmin]
    code: 200
    input: [to_status]
    output: Volunteer
    side_effects: ["State transition per Volunteer state machine including appointment-cancel cascade on inactivation"]
  - method: POST
    path: "/volunteers/{id}/certifications"
    description: "Record a certification test attempt; supersedes the prior CURRENT attempt for the same (test_type, tax_season); OCC-guarded on the volunteer's version"
    roles: [SiteCoordinator, SponsorAdmin]
    code: 201
    input: [test_type, score, tax_season, expected_volunteer_version]
    output: Certification
    side_effects:
      - "passed computed per calculations.certification_result; prior CURRENT row for the same triple -> SUPERSEDED; attempt_number assigned"
      - "increments Volunteer.version by 1"
      - "If the volunteer loses its only CURRENT passed ETHICS cert for season 2026 (superseded by a failed attempt), Volunteer ACTIVE -> INACTIVE with cascade"
  - method: GET
    path: "/volunteers/{id}/certifications"
    description: "List certification attempts of a volunteer (reverse-reach for Certification.volunteer_id); ordered by created_at ascending"
    roles: [SiteCoordinator, Preparer, QualityReviewer, Screener, SponsorAdmin]
    code: 200
    input: []
    output: Certification[]
    side_effects: []

  # --- Taxpayer ---
  - method: POST
    path: "/taxpayers"
    description: "Register a taxpayer (identity_status UNVERIFIED)"
    roles: [Screener, SiteCoordinator]
    code: 201
    input: [full_name, ssn_token, phone, "email?", "preferred_language?"]
    output: Taxpayer
    side_effects: []
  - method: GET
    path: "/taxpayers/{id}"
    description: "Get a taxpayer"
    roles: [SiteCoordinator, Preparer, QualityReviewer, Screener, SponsorAdmin]
    code: 200
    input: []
    output: Taxpayer
    side_effects: []
  - method: POST
    path: "/taxpayers/{id}/verify-identity"
    description: "Record photo-ID verification (UNVERIFIED -> VERIFIED)"
    roles: [Screener, SiteCoordinator]
    code: 200
    input: [id_document_type]
    output: Taxpayer
    side_effects: ["identity_status = VERIFIED; id_document_type set"]

  # --- Appointment ---
  - method: POST
    path: "/appointments"
    description: "Schedule an appointment; validates window, volunteer overlap (half-open), and station capacity"
    roles: [Screener, SiteCoordinator]
    code: 201
    input: [site_id, taxpayer_id, volunteer_id, purpose, start_at, end_at]
    output: Appointment
    side_effects: ["status = SCHEDULED"]
  - method: GET
    path: "/appointments"
    description: "List appointments with optional filters (reverse-reach for Appointment FKs); paginated; ordered by created_at ascending"
    roles: [SiteCoordinator, Preparer, QualityReviewer, Screener, SponsorAdmin]
    code: 200
    input: ["site_id?", "taxpayer_id?", "volunteer_id?", "status?", "limit?", "offset?"]
    output: Appointment[]
    side_effects: []
  - method: GET
    path: "/appointments/{id}"
    description: "Get an appointment"
    roles: [SiteCoordinator, Preparer, QualityReviewer, Screener, SponsorAdmin]
    code: 200
    input: []
    output: Appointment
    side_effects: []
  - method: PATCH
    path: "/appointments/{id}"
    description: "Reschedule/reassign a SCHEDULED appointment; revalidates window, overlap, capacity"
    roles: [Screener, SiteCoordinator]
    code: 200
    input: ["start_at?", "end_at?", "volunteer_id?"]
    output: Appointment
    side_effects: []
  - method: POST
    path: "/appointments/{id}/state"
    description: "Transition appointment (CHECKED_IN / COMPLETED / CANCELLED / NO_SHOW)"
    roles: [Screener, SiteCoordinator]
    code: 200
    input: [to_status]
    output: Appointment
    side_effects: ["State transition per Appointment state machine; cancellation may withdraw an INTAKE_STARTED return"]

  # --- TaxReturn ---
  - method: POST
    path: "/tax-returns"
    description: "Open a return from a CHECKED_IN appointment; taxpayer/site derived from the appointment; preparer = acting Preparer"
    roles: [Preparer]
    code: 201
    input: [appointment_id, tax_year, filing_status, "has_advanced_scope_items?", "out_of_scope_flags?"]
    output: TaxReturn
    side_effects: ["status = INTAKE_STARTED; preparer_id = X-User-ID; estimated_refund_cents computed (0 while money fields are 0)"]
  - method: GET
    path: "/tax-returns"
    description: "List returns with optional filters (reverse-reach for TaxReturn FKs); paginated; ordered by created_at ascending"
    roles: [SiteCoordinator, Preparer, QualityReviewer, Screener, SponsorAdmin]
    code: 200
    input: ["taxpayer_id?", "site_id?", "appointment_id?", "preparer_id?", "reviewer_id?", "status?", "limit?", "offset?"]
    output: TaxReturn[]
    side_effects: []
  - method: GET
    path: "/tax-returns/{id}"
    description: "Get a return (includes all computed fields)"
    roles: [SiteCoordinator, Preparer, QualityReviewer, Screener, SponsorAdmin]
    code: 200
    input: []
    output: TaxReturn
    side_effects: []
  - method: PATCH
    path: "/tax-returns/{id}"
    description: "Edit intake/preparation fields while status IN {INTAKE_STARTED, IN_PREPARATION}; OCC-guarded on the return's version"
    roles: [Screener, Preparer, SiteCoordinator]
    code: 200
    input: ["documents_received?", "interview_confirmed?", "wages_cents?", "other_income_cents?", "earned_income_cents?", "qualifying_children?", "withholding_reported_cents?", "withholding_verified_cents?", "has_advanced_scope_items?", "out_of_scope_flags?", "refund_method?", expected_return_version]
    output: TaxReturn
    side_effects:
      - "recomputes documents_complete, out_of_scope, out_of_scope_reasons, estimated_refund_cents"
      - "increments TaxReturn.version by 1"
  - method: POST
    path: "/tax-returns/{id}/state"
    description: "Drive the return lifecycle: IN_PREPARATION (begin prep / rework), PENDING_QR (submit-for-review), QR_PASSED / QR_FAILED (review), TRANSMITTED (e-file), ACCEPTED / REJECTED (IRS acknowledgement), REFERRED (out-of-scope referral), WITHDRAWN, COMPLETED"
    roles: [Preparer, QualityReviewer, SiteCoordinator]
    code: 200
    input: [to_status, "review_notes?", "rejection_code?", "rejection_text?", "referral_reason?", "referral_destination?", "withdrawal_reason?", "disbursement_confirmed?", "taxpayer_notified?"]
    output: TaxReturn
    side_effects: ["State transition per TaxReturn state machine, including refund computation, EfileRejection creation, referral auto-voiding, auto savings-referral on ACCEPTED, and preparer case-load updates"]

  # --- RefundAllocation ---
  - method: POST
    path: "/refund-allocations"
    description: "Add a direct-deposit allocation to a return (max 3 per return; return must be INTAKE_STARTED, IN_PREPARATION, or QR_PASSED)"
    roles: [Preparer]
    code: 201
    input: [tax_return_id, account_type, routing_number, account_number_mask, amount_cents]
    output: RefundAllocation
    side_effects: ["Recomputes the return's savings_match_cents"]
  - method: DELETE
    path: "/refund-allocations/{id}"
    description: "Remove an allocation while its return is INTAKE_STARTED, IN_PREPARATION, or QR_PASSED"
    roles: [Preparer]
    code: 204
    input: []
    output: null
    side_effects: ["Recomputes the return's savings_match_cents"]
  - method: GET
    path: "/tax-returns/{id}/refund-allocations"
    description: "List allocations of a return (reverse-reach for RefundAllocation.tax_return_id); ordered by created_at ascending"
    roles: [SiteCoordinator, Preparer, QualityReviewer, Screener, SponsorAdmin]
    code: 200
    input: []
    output: RefundAllocation[]
    side_effects: []

  # --- EfileRejection ---
  - method: GET
    path: "/tax-returns/{id}/rejections"
    description: "List e-file rejections of a return (reverse-reach for EfileRejection.tax_return_id); ordered by created_at ascending"
    roles: [SiteCoordinator, Preparer, QualityReviewer, Screener, SponsorAdmin]
    code: 200
    input: []
    output: EfileRejection[]
    side_effects: []
  - method: POST
    path: "/efile-rejections/{id}/follow-up"
    description: "Record taxpayer follow-up on a rejection (OPEN -> CONTACTED -> RESOLVED; OPEN -> RESOLVED allowed)"
    roles: [QualityReviewer, SiteCoordinator]
    code: 200
    input: [outcome, "resolution_note?"]
    output: EfileRejection
    side_effects: ["State transition per EfileRejection state machine"]

  # --- FinancialServiceReferral ---
  - method: POST
    path: "/tax-returns/{id}/financial-referrals"
    description: "Offer a financial-capability add-on service to the return's taxpayer (return status must NOT be in {COMPLETED, REFERRED, WITHDRAWN})"
    roles: [Preparer, SiteCoordinator]
    code: 201
    input: [service_type]
    output: FinancialServiceReferral
    side_effects: ["status = OFFERED; offered_by = X-User-ID; source = MANUAL"]
  - method: GET
    path: "/tax-returns/{id}/financial-referrals"
    description: "List financial-service referrals of a return (reverse-reach for FinancialServiceReferral.tax_return_id); ordered by created_at ascending"
    roles: [SiteCoordinator, Preparer, QualityReviewer, Screener, SponsorAdmin]
    code: 200
    input: []
    output: FinancialServiceReferral[]
    side_effects: []
  - method: POST
    path: "/financial-referrals/{id}/state"
    description: "Advance a referral (OFFERED -> ACCEPTED -> ENROLLED; OFFERED -> DECLINED)"
    roles: [Preparer, SiteCoordinator]
    code: 200
    input: [to_status]
    output: FinancialServiceReferral
    side_effects: ["State transition per FinancialServiceReferral state machine"]

# =============================================================================
# §1.6 Error Code Catalog
# =============================================================================
errors:
  - { id: ERR_MISSING_AUTH_HEADER, http: 401, condition: "X-User-Role / X-User-ID missing, role undeclared, or entity_backed X-User-ID does not reference an existing Volunteer" }
  - { id: ERR_FORBIDDEN_ROLE, http: 403, condition: "Role not permitted for this endpoint/transition, or SiteCoordinator acting outside its own site" }
  - { id: ERR_NOT_RETURN_OWNER, http: 403, condition: "Preparer-only transition attempted by a Preparer whose X-User-ID != return.preparer_id" }
  - { id: ERR_NOT_FOUND, http: 404, condition: "Referenced resource id does not exist (validated left-to-right)" }
  - { id: ERR_INVALID_REQUEST, http: 400, condition: "Missing required field, bad type, invalid enum, unknown field, or missing conditional field (review_notes, rejection_code/text, referral fields, withdrawal_reason, resolution_note, verified withholding before submit)" }
  - { id: ERR_INVALID_TRANSITION, http: 409, condition: "Requested state transition is not defined from the resource's current state; terminal states accept no transitions; also NO_SHOW before start_at, verify-identity when already VERIFIED, activation when site is CLOSED, site certify/open guards" }
  - { id: ERR_STALE_VERSION, http: 412, condition: "expected_*_version does not match the parent's current version (OCC)" }
  - { id: ERR_TAXPAYER_DUPLICATE_SSN, http: 409, condition: "ssn_token already registered" }
  - { id: ERR_OPEN_RETURN_EXISTS, http: 409, condition: "Taxpayer already has a TaxReturn at this site with status NOT IN {COMPLETED, REFERRED, WITHDRAWN}" }
  - { id: ERR_APPOINTMENT_ALREADY_USED, http: 409, condition: "Appointment already originates another TaxReturn" }
  - { id: ERR_IDENTITY_NOT_VERIFIED, http: 422, condition: "Return creation requires taxpayer identity_status == VERIFIED" }
  - { id: ERR_VOLUNTEER_NOT_CERTIFIED, http: 403, condition: "Activation without CURRENT passed ETHICS cert (season 2026), or return creation by a preparer lacking CURRENT passed ETHICS+BASIC (+ADVANCED when has_advanced_scope_items)" }
  - { id: ERR_REVIEWER_NOT_CERTIFIED, http: 403, condition: "Quality review attempted by a reviewer who is not ACTIVE or lacks CURRENT passed INTAKE_QR+ADVANCED certs (season 2026)" }
  - { id: ERR_REVIEWER_IS_PREPARER, http: 422, condition: "Quality reviewer is the same volunteer as the return's preparer (segregation of duties)" }
  - { id: ERR_VOLUNTEER_NOT_ACTIVE, http: 409, condition: "Appointment assignment requires volunteer status == ACTIVE" }
  - { id: ERR_SITE_NOT_OPEN, http: 409, condition: "Operation requires Site status OPEN (transmit, check-in, return creation) or IN {CERTIFIED, OPEN} (appointment creation)" }
  - { id: ERR_SITE_HAS_OPEN_WORK, http: 409, condition: "Site close blocked by appointments in {SCHEDULED, CHECKED_IN} or returns not in {COMPLETED, REFERRED, WITHDRAWN}" }
  - { id: ERR_OUTSIDE_SITE_WINDOW, http: 422, condition: "Appointment violates season bounds, daily hours, past-start, or 15..120 minute duration; also report period_end <= period_start" }
  - { id: ERR_APPOINTMENT_OVERLAP_VOLUNTEER, http: 409, condition: "Assigned volunteer already has an overlapping appointment (half-open intervals) in {SCHEDULED, CHECKED_IN}" }
  - { id: ERR_SITE_CAPACITY_FULL, http: 409, condition: "Overlapping-appointment count at the site has reached station_capacity" }
  - { id: ERR_DOCUMENTS_INCOMPLETE, http: 422, condition: "Required document checklist incomplete for the chosen refund_method, or interview not confirmed" }
  - { id: ERR_OUT_OF_SCOPE, http: 422, condition: "Return is out of VITA scope (out_of_scope == true); only REFERRED/WITHDRAWN exits allowed" }
  - { id: ERR_ALLOCATION_LIMIT, http: 422, condition: "Return already has 3 RefundAllocations" }
  - { id: ERR_ALLOCATION_SUM_MISMATCH, http: 422, condition: "At transmit with DIRECT_DEPOSIT: allocation count not in 1..3 or sum(amount_cents) != final_refund_cents" }
  - { id: ERR_REJECTION_UNRESOLVED, http: 409, condition: "Rework from REJECTED blocked while any EfileRejection has follow_up_status != RESOLVED" }
  - { id: ERR_MAX_SUBMISSIONS_REACHED, http: 409, condition: "Rework from REJECTED blocked when submission_count >= 3; return must be REFERRED" }
  - { id: ERR_REPORT_PERIOD_INVALID, http: 422, condition: "Report period_end <= period_start" }

# =============================================================================
# §1.7 RBAC Matrix
# =============================================================================
roles:
  - name: SiteCoordinator
    description: "Volunteer leader of a site (is_coordinator == true); certifies/opens/suspends/closes the site, transmits e-files, records acknowledgements, generates and submits sponsor reports"
    identity: "entity_backed:Volunteer"
    exclusive_operations:
      - "POST /sites/{id}/state — transition own site (Volunteer.site_id must equal path site id)"
      - "POST /sites/{id}/reports — generate report snapshot"
      - "POST /site-reports/{id}/state — DRAFT -> SUBMITTED only"
      - "POST /tax-returns/{id}/state — to_status TRANSMITTED / ACCEPTED / REJECTED / COMPLETED"
    shared_operations:
      - "Volunteer registration and certification recording (with SponsorAdmin)"
      - "POST /volunteers/{id}/state (with SponsorAdmin)"
      - "Taxpayer registration and identity verification (with Screener)"
      - "Appointment create/reschedule/state (with Screener)"
      - "PATCH /tax-returns/{id} (with Screener, Preparer)"
      - "Rejection follow-up (with QualityReviewer)"
      - "Financial-service referral offer/state (with Preparer)"
      - "All read endpoints"
  - name: Preparer
    description: "Certified volunteer who prepares returns; owns the returns it creates (X-User-ID becomes preparer_id)"
    identity: "entity_backed:Volunteer"
    exclusive_operations:
      - "POST /tax-returns — open a return from a CHECKED_IN appointment"
      - "POST /tax-returns/{id}/state — to_status IN_PREPARATION / PENDING_QR / rework (own returns only)"
      - "POST /refund-allocations and DELETE /refund-allocations/{id}"
    shared_operations:
      - "PATCH /tax-returns/{id} (own returns; Screener/SiteCoordinator may edit intake fields)"
      - "POST /tax-returns/{id}/state — to_status REFERRED / WITHDRAWN (with QualityReviewer, SiteCoordinator)"
      - "Financial-service referral offer/state (with SiteCoordinator)"
      - "All read endpoints"
  - name: QualityReviewer
    description: "Experienced certified volunteer who performs the required quality review before e-file and handles e-file rejection follow-up; MUST NOT review a return it prepared"
    identity: "entity_backed:Volunteer"
    exclusive_operations:
      - "POST /tax-returns/{id}/state — to_status QR_PASSED / QR_FAILED"
    shared_operations:
      - "Rejection follow-up (with SiteCoordinator)"
      - "POST /tax-returns/{id}/state — to_status REFERRED (with Preparer, SiteCoordinator)"
      - "All read endpoints"
  - name: Screener
    description: "Intake volunteer: registers taxpayers, verifies photo IDs, schedules and checks in appointments, maintains the intake document checklist"
    identity: "entity_backed:Volunteer"
    exclusive_operations: []
    shared_operations:
      - "Taxpayer registration and identity verification (with SiteCoordinator)"
      - "Appointment create/reschedule/state (with SiteCoordinator)"
      - "PATCH /tax-returns/{id} intake fields (with Preparer, SiteCoordinator)"
      - "All read endpoints"
  - name: SponsorAdmin
    description: "Sponsoring-program administrator; onboards sites and the first coordinator, acknowledges submitted reports, drives the test clock"
    identity: "opaque"
    exclusive_operations:
      - "POST /sites — create a site"
      - "POST /site-reports/{id}/state — SUBMITTED -> ACKNOWLEDGED only"
      - "POST /_clock/set_current_utc"
    shared_operations:
      - "Volunteer registration and certification recording (with SiteCoordinator)"
      - "POST /volunteers/{id}/state (with SiteCoordinator)"
      - "GET /sites/{id}/reports (with SiteCoordinator)"
      - "All read endpoints"
