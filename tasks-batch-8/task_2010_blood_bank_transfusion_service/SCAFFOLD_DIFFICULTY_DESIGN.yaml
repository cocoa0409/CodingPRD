      - name: state_vs_safety_on_held_order_issue
        grounds:
          - validations[priority=7]
          - validations[priority=8]
        distinguishing_aspect: |
          Pair state x business_safety: issuing against an ON_HOLD order with an
          ABO-incompatible unit violates ERR_ORDER_NOT_ISSUABLE (P7) and
          ERR_UNIT_INCOMPATIBLE (P8); the state error must win.
