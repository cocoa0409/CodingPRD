              as: QualityInspector
              as_user_id: "qi-1"
            # sell both to D-X at day 0
            - call: "GET /distributors/${dx}"
              as: PlantAdmin
              captures: { dxv1: $.data.version }
            - call: "POST /reman-engines/sell"
              payload: { build_spec_id: "${s1}", expected_distributor_version: "${dxv1}" }
