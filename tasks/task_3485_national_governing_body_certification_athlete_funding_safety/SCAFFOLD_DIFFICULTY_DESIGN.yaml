  - rule_id: non_linear_state_machine
    instances:
      - name: athlete_parallel_dimensions_suspend_reinstate_loop
        grounds:
          - state_machines.Athlete
          - entities.Athlete.fields.eligibility_status
          - entities.Athlete.fields.screening_status
        distinguishing_aspect: |
          Entity: Athlete. Two independent state dimensions evolve on one row —
          the eligibility dimension cycles ELIGIBLE -> SUSPENDED -> ELIGIBLE while
          the screening dimension stays pinned at SCREENING_CLEARED, proving the
          dimensions are parallel rather than a single linear pipeline.
        test_recipe:
          setup:
            - "CERTIFIED body; athlete fully onboarded at the default clock: screening CLEARED, training current, eligibility ELIGIBLE"
          setup_api_calls:
            - call: "POST /api/governing-bodies"
              payload: { name: "US Fencing", sport_code: "FENC", funding_budget_cents: 5000000, sport_science_pool_hours: 100 }
              as: CommitteeAdmin
              captures: { gb_id: $.data.id }
            - call: "POST /api/governing-bodies/${gb_id}/certification-cycles"
              payload: { window_start: "2026-09-01T00:00:00Z", window_end: "2026-12-01T00:00:00Z" }
              as: CommitteeAdmin
              captures: { cyc_id: $.data.id }
            - call: "POST /api/certification-cycles/${cyc_id}/transitions"
              payload: { to_state: "OPEN" }
              as: CertificationAuditor
              as_user_id: "aud-1"
            - call: "POST /api/certification-cycles/${cyc_id}/transitions"
              payload: { to_state: "FINDINGS_ISSUED", governance_score: 90, athlete_rep_score: 88, financial_score: 92 }
              as: CertificationAuditor
              as_user_id: "aud-1"
            - call: "POST /api/certification-cycles/${cyc_id}/transitions"
              payload: { to_state: "CLOSED_PASSED" }
              as: CertificationAuditor
              as_user_id: "aud-2"
            - call: "POST /api/athletes"
              payload: { governing_body_id: "${gb_id}", full_name: "Rio Foil", date_of_birth: "2001-03-03", team_sport: false }
              as: CommitteeAdmin
              captures: { a_id: $.data.id }
            - call: "POST /api/athletes/${a_id}/transitions"
              payload: { to_state: "SCREENING_CLEARED" }
              as: SafeSportOfficer
              captures: { scr_exp_before: $.data.screening_expires_at }
            - call: "POST /api/athletes/${a_id}/transitions"
              payload: { to_state: "TRAINING_CURRENT" }
              as: SafeSportOfficer
            - call: "POST /api/athletes/${a_id}/transitions"
              payload: { to_state: "ELIGIBLE" }
              as: SafeSportOfficer
          trigger:
            - call: "POST /api/athletes/${a_id}/transitions"
              payload: { to_state: "SUSPENDED" }
              as: SafeSportOfficer
              captures: { elig_mid: $.data.eligibility_status, scr_mid: $.data.screening_status, scr_exp_mid: $.data.screening_expires_at }
            - call: "POST /api/athletes/${a_id}/transitions"
              payload: { to_state: "ELIGIBLE" }
              as: SafeSportOfficer
              captures: { elig_end: $.data.eligibility_status, scr_end: $.data.screening_status }
          assert:
            - "after suspension: eligibility_status == SUSPENDED while screening_status == SCREENING_CLEARED (dimension independence)"
            - "screening_expires_at is unchanged across the loop (${scr_exp_before} == ${scr_exp_mid})"
            - "after reinstatement: eligibility_status == ELIGIBLE and screening_status == SCREENING_CLEARED"
            - "the cycle REGISTERED -> ELIGIBLE -> SUSPENDED -> ELIGIBLE completed on one entity"

