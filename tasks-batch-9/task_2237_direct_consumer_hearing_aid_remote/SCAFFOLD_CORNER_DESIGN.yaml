  # =====================================================================
  # SECTION 3 -- Calculations  (guide: From Table 3)
  # =====================================================================
  - section: calculations
    instances:

      - name: calc_red_flag_severe_loss_at_threshold_71_is_inclusive
        claim_type: threshold_at_boundary
        grounds: [calculations.red_flag_referral_trigger.constants.SEVERE_LOSS_DB]
        distinguishing_aspect: "pure_tone_avg_db exactly 71.0 must emit the SEVERE_LOSS_THRESHOLD MANDATORY_REFERRAL finding (>= is inclusive), forcing outcome RED_FLAG even with no symptom codes at all."
        test_recipe:
          setup:
            - "POLICY_CA (min_age_years 18) and a 70-year-old patient; one screening measured at exactly the severe-loss threshold with a perfect symptom-free profile otherwise."
          setup_api_calls:
            - { call: "POST /_clock/set_current_utc", payload: { to_iso8601: "2026-08-01T00:00:00Z" }, as: PlatformAdmin }
            - { call: "POST /state-policies", payload: { state_code: "CA", otc_sales_permitted: true, telehealth_fitting_permitted: true, min_age_years: 18, trial_period_days: 45, restocking_fee_mode: "FLAT_PCT", restocking_fee_pct: 0.1, restocking_fee_cap_cents: 0, shipping_refundable: false, referral_validity_days: 180, waiver_required: false, max_loss_damage_claims: 2 }, as: PlatformAdmin, captures: { pol_ca: "$.data.id" } }
            - { call: "POST /patients", payload: { state_policy_id: "${pol_ca}", email: "sev71@x.test", full_name: "Sev At", age_years: 70 }, as: CareOpsAgent, captures: { pat_s1: "$.data.id" } }
            - { call: "POST /patients/${pat_s1}/screening-sessions", payload: {}, as: Patient, as_user_id: "${pat_s1}", captures: { scr_s1: "$.data.id" } }
            - { call: "PATCH /screening-sessions/${scr_s1}", payload: { pure_tone_avg_db: 71.0, asymmetry_db: 0.0, self_reported_difficulty_score: 0, speech_in_noise_pct: 100.0, symptom_codes: [] }, as: Patient, as_user_id: "${pat_s1}" }
          trigger:
            - { call: "POST /screening-sessions/${scr_s1}/submit", payload: {}, as: Patient, as_user_id: "${pat_s1}" }
          assert:
            - "HTTP 200"
            - "data.status == \"SCORED\""
            - "data.screening_outcome == \"RED_FLAG\""
            - "GET /screening-sessions/${scr_s1}/red-flag-findings returns total_count == 1, data[0].code == \"SEVERE_LOSS_THRESHOLD\", data[0].severity == \"MANDATORY_REFERRAL\", data[0].weight == 0.0"
            - "GET /patients/${pat_s1} returns data.status == \"REFERRAL_REQUIRED\", data.open_mandatory_flag_count == 1, data.advisory_weight_total == 0.0"
            - "GET /patients/${pat_s1} returns data.candidacy_risk_score == 0 (the provisional variant is only written by a candidacy approval)"

      - name: calc_red_flag_severe_loss_just_below_threshold_70_9
        claim_type: threshold_below_boundary
        grounds: [calculations.red_flag_referral_trigger.constants.SEVERE_LOSS_DB]
        distinguishing_aspect: "At 70.9 dB the severe-loss finding must NOT fire, so the empty finding set yields outcome PASS and the patient is approved with a provisional score of 47.1."
        test_recipe:
          setup:
            - "Same policy and patient shape as the 71.0 case, measured 0.1 dB lower."
          setup_api_calls:
            - { call: "POST /_clock/set_current_utc", payload: { to_iso8601: "2026-08-01T00:00:00Z" }, as: PlatformAdmin }
            - { call: "POST /state-policies", payload: { state_code: "CA", otc_sales_permitted: true, telehealth_fitting_permitted: true, min_age_years: 18, trial_period_days: 45, restocking_fee_mode: "FLAT_PCT", restocking_fee_pct: 0.1, restocking_fee_cap_cents: 0, shipping_refundable: false, referral_validity_days: 180, waiver_required: false, max_loss_damage_claims: 2 }, as: PlatformAdmin, captures: { pol_ca: "$.data.id" } }
            - { call: "POST /patients", payload: { state_policy_id: "${pol_ca}", email: "sev709@x.test", full_name: "Sev Below", age_years: 70 }, as: CareOpsAgent, captures: { pat_s2: "$.data.id" } }
            - { call: "POST /patients/${pat_s2}/screening-sessions", payload: {}, as: Patient, as_user_id: "${pat_s2}", captures: { scr_s2: "$.data.id" } }
            - { call: "PATCH /screening-sessions/${scr_s2}", payload: { pure_tone_avg_db: 70.9, asymmetry_db: 0.0, self_reported_difficulty_score: 0, speech_in_noise_pct: 100.0, symptom_codes: [] }, as: Patient, as_user_id: "${pat_s2}" }
          trigger:
            - { call: "POST /screening-sessions/${scr_s2}/submit", payload: {}, as: Patient, as_user_id: "${pat_s2}" }
          assert:
            - "HTTP 200"
            - "data.screening_outcome == \"PASS\""
            - "GET /screening-sessions/${scr_s2}/red-flag-findings returns total_count == 0 and has_more == false"
            - "GET /patients/${pat_s2} returns data.status == \"CANDIDATE_APPROVED\""
            - "GET /patients/${pat_s2} returns data.candidacy_risk_score == 31.5 (100 * 0.40 * (70.9/90) = 31.5111 rounded once to 1 dp)"
            - "GET /patients/${pat_s2} returns data.candidacy_risk_band == \"LOW\" and data.candidacy_risk_variant == \"PROVISIONAL_SELF_REPORTED\""

      - name: calc_red_flag_asymmetry_at_threshold_15_is_inclusive
        claim_type: threshold_at_boundary
        grounds: [calculations.red_flag_referral_trigger.constants.ASYMMETRY_DB]
        distinguishing_aspect: "asymmetry_db exactly 15.0 must emit a SUDDEN_UNILATERAL_LOSS MANDATORY finding from the asymmetry branch alone, with no SUDDEN_LOSS symptom present."
        test_recipe:
          setup:
            - "POLICY_CA and a 70-year-old patient; one screening with mild PTA but exactly threshold asymmetry."
          setup_api_calls:
            - { call: "POST /_clock/set_current_utc", payload: { to_iso8601: "2026-08-01T00:00:00Z" }, as: PlatformAdmin }
            - { call: "POST /state-policies", payload: { state_code: "CA", otc_sales_permitted: true, telehealth_fitting_permitted: true, min_age_years: 18, trial_period_days: 45, restocking_fee_mode: "FLAT_PCT", restocking_fee_pct: 0.1, restocking_fee_cap_cents: 0, shipping_refundable: false, referral_validity_days: 180, waiver_required: false, max_loss_damage_claims: 2 }, as: PlatformAdmin, captures: { pol_ca: "$.data.id" } }
            - { call: "POST /patients", payload: { state_policy_id: "${pol_ca}", email: "asym15@x.test", full_name: "Asym At", age_years: 70 }, as: CareOpsAgent, captures: { pat_a1: "$.data.id" } }
            - { call: "POST /patients/${pat_a1}/screening-sessions", payload: {}, as: Patient, as_user_id: "${pat_a1}", captures: { scr_a1: "$.data.id" } }
            - { call: "PATCH /screening-sessions/${scr_a1}", payload: { pure_tone_avg_db: 40.0, asymmetry_db: 15.0, self_reported_difficulty_score: 20, speech_in_noise_pct: 70.0, symptom_codes: [] }, as: Patient, as_user_id: "${pat_a1}" }
          trigger:
            - { call: "POST /screening-sessions/${scr_a1}/submit", payload: {}, as: Patient, as_user_id: "${pat_a1}" }
          assert:
            - "HTTP 200"
            - "data.screening_outcome == \"RED_FLAG\""
            - "GET /screening-sessions/${scr_a1}/red-flag-findings returns total_count == 1 and data[0].code == \"SUDDEN_UNILATERAL_LOSS\""
            - "GET /screening-sessions/${scr_a1}/red-flag-findings?severity=ADVISORY returns total_count == 0"
            - "GET /patients/${pat_a1} returns data.open_mandatory_flag_count == 1"

      - name: calc_red_flag_asymmetry_just_below_threshold_14_9
        claim_type: threshold_below_boundary
        grounds: [calculations.red_flag_referral_trigger.constants.ASYMMETRY_DB]
        distinguishing_aspect: "At 14.9 dB asymmetry the mandatory branch stays silent, so the same measurements pass and the provisional score picks up the asymmetry term as 100*0.15*(14.9/25) = 8.94 rather than a flag."
        test_recipe:
          setup:
            - "Same as the 15.0 asymmetry case, 0.1 dB lower."
          setup_api_calls:
