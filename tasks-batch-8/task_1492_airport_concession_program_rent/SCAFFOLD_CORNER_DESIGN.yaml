  # =====================================================================
  # Section: calculations
  # =====================================================================
  - section: calculations
    instances:
      - name: monthly_percentage_rent_tier_boundaries
        claim_type: correct_result_and_boundary
        grounds: ["calculations.monthly_percentage_rent"]
        distinguishing_aspect: "Tier boundary precision: gross exactly at breakpoint 500,000 stays in tier 1 (pct 40,000); gross 600,000 straddles tiers (pct 50,000). Observed through provisional settlement percentage_due_cents (single reported month plus 11 months projected at MAG/12 = 100,000 each)."
        test_recipe:
          setup: ["ACTIVE lease; settlement 2026"]
          setup_api_calls:
            - { call: "POST /concessions/tenants", payload: { legal_name: "SkyEats LLC", contact_email: "ops@skyeats.com" }, as: AirportAdmin, captures: { t1: $.data.id } }
            - { call: "POST /concessions/leases", payload: { tenant_id: "${t1}", premises_code: "A1", category: "FOOD", term_start_date: "2026-01-01", term_end_date: "2030-12-31", mag_annual_cents: 1200000, pct_rate_below_bp: 800, pct_breakpoint_cents: 500000, pct_rate_above_bp: 1000, acdbe_goal_bp: 2000, ti_allowance_cents: 500000, buildout_deadline: "2026-09-30", min_spe_cents: 1000 }, as: AirportAdmin, captures: { l1: $.data.id } }
            - { call: "POST /concessions/leases/${l1}/transition", payload: { action: "ACTIVATE" }, as: AirportAdmin }
            - { call: "POST /concessions/settlements", payload: { lease_id: "${l1}", period_year: 2026 }, as: AirportAdmin, captures: { s1: $.data.id } }
            - { call: "POST /concessions/sales-reports", payload: { lease_id: "${l1}", period_month: "2026-01", gross_sales_cents: 600000 }, as: Tenant, as_user_id: "${t1}", captures: { r1: $.data.id } }
            - { call: "POST /concessions/sales-reports/${r1}/transition", payload: { action: "SUBMIT" }, as: Tenant, as_user_id: "${t1}" }
            - { call: "POST /concessions/sales-reports/${r1}/transition", payload: { action: "ACCEPT" }, as: ConcessionAnalyst }
          trigger:
            - { call: "POST /concessions/settlements/${s1}/recalculate", payload: {}, as: ConcessionAnalyst, captures: { pct1: $.data.percentage_due_cents } }
            - { call: "POST /concessions/sales-reports", payload: { lease_id: "${l1}", period_month: "2026-02", gross_sales_cents: 500000 }, as: Tenant, as_user_id: "${t1}", captures: { r2: $.data.id } }
            - { call: "POST /concessions/sales-reports/${r2}/transition", payload: { action: "SUBMIT" }, as: Tenant, as_user_id: "${t1}" }
            - { call: "POST /concessions/sales-reports/${r2}/transition", payload: { action: "ACCEPT" }, as: ConcessionAnalyst }
            - { call: "POST /concessions/settlements/${s1}/recalculate", payload: {}, as: ConcessionAnalyst, captures: { pct2: $.data.percentage_due_cents } }
          assert:
            - "pct1 == 1150000   # 50,000 (straddle) + 11 * 100,000 projected"
            - "pct2 == 1090000   # 50,000 + 40,000 (boundary stays tier 1) + 10 * 100,000"

