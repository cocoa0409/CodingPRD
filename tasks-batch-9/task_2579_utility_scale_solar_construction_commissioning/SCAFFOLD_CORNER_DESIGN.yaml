        grounds:
          - calculations.string_test_disposition
          - entities.StringCircuit.fields.test_failure_reason
          - entities.StringCircuit.fields.expected_voc_v
          - state_machines.StringCircuit.WIRED_to_FAILED
        distinguishing_aspect: "The three declared constants are applied at their exact values and in the pinned order: IR_MIN_MOHM 40.0 is inclusive, expected_voc_v is 15 * 49.5 * (1 - 0.0028 * 15) == 711.32 with a 3% allowance of 21.3396 V, and when all three checks fail at once test_failure_reason must name INSULATION — the first check, not the worst one."
        test_recipe:
          setup:
            - "One project with an ACCEPTED grading area, an ACCEPTED 60-unit MODULE delivery (57 accepted), one MECH_COMPLETE block (1 pile, 1 circuit) and one WIRED string circuit with modules_in_series 15"
