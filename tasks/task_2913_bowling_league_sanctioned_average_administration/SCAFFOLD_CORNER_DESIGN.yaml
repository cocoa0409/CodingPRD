            - "One league ${lg_id} on CONFIG-B at status BYLAWS_ADOPTED with bylaws_adopted_at 2026-08-05T00:00:00Z, teams ${t1_id} and ${t2_id}, and five memberships ${ms1_id}..${ms5_id} (${ms5_id} is Gus Sub, an ADULT on team ${t1_id})."
