  - rule_id: boundary_precision_check
    instances:
      - name: slack_days_exactly_negative_at_risk_grace_days_is_at_risk_not_breached
        grounds:
          - calculations.site_order_commitment_status
          - constants.AT_RISK_GRACE_DAYS
          - state_machines.SiteOrder.COMMITTED_to_AT_RISK
          - entities.SiteOrder.fields.slack_days
        distinguishing_aspect: |
          The AT_RISK band's lower edge is inclusive at -AT_RISK_GRACE_DAYS: slack_days == -3 must
          yield AT_RISK while slack_days == -4 must yield BREACHED. Two site orders differing by
          exactly one day in committed_delivery_date (2026-09-15 vs 2026-09-14) against the same
          projected 2026-09-18 pin both sides of that single-day edge, and the program posture is
          driven by the worse of the two.
