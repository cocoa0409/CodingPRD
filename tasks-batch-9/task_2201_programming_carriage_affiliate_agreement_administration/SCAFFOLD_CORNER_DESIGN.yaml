            - call: "POST /carriage/rights-windows/${w3_id}/lifecycle"
              payload:
                action: "CLEAR"
              as: RightsAdministrator
              as_user_id: "u-rights-1"
          assert:
            - "all three windows were created 201 with status == \"PLANNED\" — neither guard applies at creation"
            - "the W1 CLEAR returns 409 with data.error_id == \"ERR_BLACKOUT_WINDOW_CONFLICT\""
            - "the W2 CLEAR returns 422 with data.error_id == \"ERR_WINDOW_OUTSIDE_TERM\""
            - "the W3 CLEAR returns 200 with data.status == \"CLEARED\", data.windowing_holdback_days == 47 and data.block_reason == \"NONE\""
            - "GET /carriage/rights-windows/${w1_id} and GET /carriage/rights-windows/${w2_id} both still return status == \"PLANNED\""
            - "GET /carriage/content-titles/${ct_id} returns cleared_window_count == 1 and distribution_coverage_status == \"LINEAR_ONLY\""
            - "after POST /carriage/blackout-rules/${bo_id}/lifecycle with action=\"WAIVE\" returns 200 with data.status == \"WAIVED\", the W1 CLEAR returns 200 with data.status == \"CLEARED\" — a WAIVED rule stops conflicting, so the blackout was the only obstacle"

      - name: one_engagement_yields_one_recovery_invoice
        claim_type: error_triggerable
        grounds:
          - validations[priority=83]
          - errors[ERR_RECOVERY_ALREADY_INVOICED]
          - entities.AuditEngagement.fields.recovery_invoice_id
          - state_machines.AuditEngagement.FINDINGS_ISSUED_to_RECOVERY_INVOICED
        distinguishing_aspect: >-
          Creating the AUDIT_RECOVERY invoice stamps recovery_invoice_id on the
          engagement, so a second AUDIT_RECOVERY invoice naming the same engagement is
          409 ERR_RECOVERY_ALREADY_INVOICED — the recovery cannot be double-billed even
          though the engagement's recovery_amount_cents is unchanged.
        test_recipe:
          setup:
            - "Cliffside Telco with an executed agreement and an ACCEPTED 2026-06 report at 130,000 subscribers."
            - "An AuditEngagement over 2026-06 in FINDINGS_ISSUED after a finding of 140,000 audited subscribers, issued by u-audit-1."
          setup_api_calls:
            - call: "POST /carriage/distributors"
              payload:
                legal_name: "Cliffside Telco"
                distributor_type: "TELCO"
                rate_card_class: "CLASS_B"
                total_subscribers: 200000
                credit_limit_cents: 150000000
              as: NetworkAdmin
