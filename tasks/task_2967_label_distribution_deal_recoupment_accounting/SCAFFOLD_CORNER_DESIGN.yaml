      - name: cascading_side_effects_layer
        claim_type: cascading_side_effects
        grounds:
          - complexity_profile.complexity_layers[cascading_side_effects]
          - state_machines[DspRevenueReport].transitions[SUBMITTED -> ACCEPTED]
          - state_machines[DistributionDeal].transitions[EXECUTED -> TERMINATION_NOTICE]
        distinguishing_aspect: |
          The layer's own claims (N-level chain end-to-end, ordering sensitivity, partial failure)
          are exactly what the §1.8 transitive_cascade rule was built to probe, on the two deepest
          chains in the API: the five-hop accept cascade and the three-entity terminate cascade.
        excluded_because:
          difficulty_instance: accept_cascades_lines_to_release_to_deal_to_recoupment_to_royalty_rate
          rationale: >-
            That instance walks all five hops of the accept cascade (line net receipts -> release and
            deal totals -> advance waterfall -> recoupment_status flip -> escalated royalty rate) and
            asserts the intermediate value at every hop, and its sibling
            terminate_cascades_release_then_agreement_then_statement covers the second chain plus the
            ordering claim (the release must reach REVERSION_PENDING before the agreement can reach
            POST_TERM). Partial-failure behaviour is covered from the other side by
            compensating_invariant.dispute_reverses_accept_with_zero_advance_drift, which shows the
            whole cascade unwinding with zero drift. A §1.9 breadth instance would only re-run the
            same chain with smaller numbers; the two consistency_model instances below instead probe
            the part §1.8 does not — that every hop is already visible in the mutation's own
            response.
      - name: dual_variant_calculation_layer
        claim_type: dual_variant_calculation
        grounds:
          - complexity_profile.complexity_layers[dual_variant_calculation]
          - calculations[advance_recoupment_waterfall].variants
          - calculations[artist_statement_net_payable].variants
        distinguishing_aspect: |
          Both variant pairs in §1.3 (CROSS vs SILOED recoupment, PROVISIONAL vs FINAL statement
          basis) already have a §1.8 instance built on a divergence-proof fixture where the two arms
          disagree, which is strictly stronger than the layer's "both variants produce expected
          results" claim.
        excluded_because:
          difficulty_instance: cross_collateralized_vs_siloed_advance_recoupment
          rationale: >-
            That instance runs the pinned divergence fixture (advance 650000, shares 600000/50000,
            pool 680001) through both arms of advance_recoupment_waterfall and asserts the full
            delta on switching variant, including the SILOED surplus that survives while the deal is
            still unrecouped; provisional_vs_final_statement_net_payable does the same for the
            statement basis, where the marketing basis and the reserve basis both change arm. The
            variant selector itself is additionally exercised as a query parameter by the §1.9
            instance calculations.recoupment_summary_variant_parameter_selects_the_arm_read_only, so
            no further breadth instance is needed.
      - name: rate_threshold_triggers_layer
        claim_type: rate_threshold_triggers
        grounds:
          - complexity_profile.complexity_layers[rate_threshold_triggers]
          - calculations[returns_reserve_obligation]
          - calculations[marketing_recoupability_and_budget]
        distinguishing_aspect: |
          Both thresholds in the API are cumulative-ratio thresholds evaluated at exact boundary
          values, and §1.8's boundary_precision_check rule already tests each one AT the boundary
          rather than merely across it.
        excluded_because:
          difficulty_instance: returns_rate_exactly_at_tier_2_threshold
          rationale: >-
            That instance lands units_returned / units_shipped on exactly 0.2500 to prove the
            >= comparison escalates at the boundary and not one unit later, and asserts the reserve
            recomputation that follows; inventory_obligation_at_exact_ceiling pins the ceil() side
            of the same family. The marketing budget ceiling is covered as a threshold by
            priority_pair_validation_conflict.spend_decide_state_beats_marketing_budget, which
            approves spends up to the last cent of the budget and rejects the cent past it. The
            layer's third claim, "reset works", has no counterpart in this domain: record-returns
            only ACCUMULATES returned_units and marketing_committed_cents only accumulates approved
            commitments, so both ratios are monotonically non-decreasing and no threshold ever
            re-arms downward — there is no reset path to test.

  # ---------------------------------------------------------------------------
  # Consistency model — §1.0 declares `immediate`, so every cascaded and
  # compensated field must be readable in the SAME request's response, with no
  # re-read, retry or settling delay. Both instances therefore assert the
  # mutation response body FIRST and only then confirm the sibling reads agree.
  # ---------------------------------------------------------------------------
  - section: consistency_model
    instances:
      - name: cascade_is_visible_in_the_mutation_response_itself
        claim_type: immediate
        grounds:
          - complexity_profile.consistency_model[immediate]
          - endpoints[POST /dsp-revenue-reports/{id}/accept]
          - endpoints[GET /distribution-deals/{id}/recoupment-summary]
        distinguishing_aspect: |
          One accept touches five entities. Under `immediate` the accept's OWN 200 body must already
          carry the report's settled figures, and a read of every downstream entity taken
          immediately afterwards — deal, release, revenue line, agreement, and the derived
          recoupment-summary projection — must agree with it to the cent. An implementation that
          defers any hop to a later recomputation (a nightly roll-up, a lazy read-time derivation)
          shows a stale advance balance or an unescalated royalty rate here even though it
          eventually converges.
        test_recipe:
          setup:
            - "one EXECUTED deal (advance 50000, cross_collateralized true, fee 0.1500) with one RELEASED release holding the full 50000 share and one ACTIVE agreement at 0.1000 escalating to 0.1500"
            - "one SUBMITTED report whose single line is worth 100000 gross, i.e. 85000 net — enough to fully recoup the advance and trip the escalation"
          setup_api_calls:
            - call: "POST /distributors"
              payload: { name: "Vector Digital", legal_entity: "Vector Digital LLC", default_returns_reserve_pct: 0.1000 }
              as: LabelAdmin
              as_user_id: "label-admin-01"
              captures: { dist_id: $.data.id }
            - call: "POST /artists"
              payload: { legal_name: "Nadia Frost", email: "nadia@example.com" }
              as: LabelAdmin
              as_user_id: "label-admin-01"
              captures: { artist_id: $.data.id }
            - call: "POST /stream-rate-cards"
              payload: { dsp_code: "STRM", territory_code: "US", tier: "PREMIUM", rate_micros_per_stream: 4000, effective_from: "2026-01-01" }
              as: LabelAdmin
              as_user_id: "label-admin-01"
            - call: "POST /distribution-deals"
              payload: { distributor_id: "${dist_id}", deal_type: "DISTRIBUTION_FEE", distribution_fee_pct: 0.1500, term_start_date: "2026-01-01", term_end_date: "2026-12-31", territory_codes: ["US"], cross_collateralized: true, advance_amount_cents: 50000, marketing_budget_cents: 0, objection_window_days: 30, post_term_collection_days: 90 }
              as: LabelAdmin
              as_user_id: "label-admin-01"
              captures: { deal_id: $.data.id }
            - call: "POST /releases"
              payload: { deal_id: "${deal_id}", primary_artist_id: "${artist_id}", upc: "099000000271", title: "Same Breath", planned_release_date: "2026-02-01", formats: ["DIGITAL"], advance_share_cents: 50000 }
              as: LabelAdmin
              as_user_id: "label-admin-01"
              captures: { rel1_id: $.data.id }
            - call: "POST /distribution-deals/${deal_id}/execute"
              payload: { advance_payment_reference: "WIRE-C1-0001" }
              as: LabelAdmin
              as_user_id: "label-admin-01"
            - call: "POST /releases/${rel1_id}/release"
              payload: { actual_release_date: "2026-02-01" }
              as: LabelAdmin
              as_user_id: "label-admin-01"
            - call: "POST /artist-agreements"
              payload: { artist_id: "${artist_id}", release_id: "${rel1_id}", royalty_rate_pct: 0.1000, escalated_royalty_rate_pct: 0.1500, advance_amount_cents: 0, recording_costs_cents: 0, recording_recoupable_pct: 0.0000, marketing_recoup_share_pct: 0.0000 }
              as: LabelAdmin
              as_user_id: "label-admin-01"
              captures: { agr_id: $.data.id }
            - call: "POST /artist-agreements/${agr_id}/activate"
              payload: {}
              as: LabelAdmin
              as_user_id: "label-admin-01"
              captures: { agr_rate_before: $.data.active_royalty_rate_pct }
            - call: "POST /dsp-revenue-reports"
              payload: { deal_id: "${deal_id}", dsp_code: "STRM", period_start: "2026-04-01", period_end: "2026-06-30" }
              as: DistributionPartner
              as_user_id: "${dist_id}"
              captures: { rep_id: $.data.id }
            - call: "POST /dsp-revenue-reports/${rep_id}/lines"
              payload: { release_id: "${rel1_id}", territory_code: "US", tier: "PREMIUM", stream_count: 250000 }
              as: DistributionPartner
              as_user_id: "${dist_id}"
              captures: { line_id: $.data.id, line_net_before: $.data.net_receipts_cents }
            - call: "POST /dsp-revenue-reports/${rep_id}/submit"
              payload: {}
              as: DistributionPartner
              as_user_id: "${dist_id}"
              captures: { rep_gross: $.data.gross_receipts_cents, rep_net: $.data.net_receipts_cents }
            - call: "GET /distribution-deals/${deal_id}"
              payload: {}
              as: RoyaltyAnalyst
              as_user_id: "analyst-01"
              captures: { deal_v: $.data.version }
          trigger:
            - call: "POST /dsp-revenue-reports/${rep_id}/accept"
              payload: { expected_deal_version: "${deal_v}" }
              as: RoyaltyAnalyst
              as_user_id: "analyst-01"
              captures: { rep_status: $.data.status, rep_applied: $.data.advance_applied_cents, rep_accepted_at: $.data.accepted_at }
            - call: "GET /distribution-deals/${deal_id}"
              payload: {}
              as: RoyaltyAnalyst
              as_user_id: "analyst-01"
              captures: { deal_net: $.data.net_receipts_to_date_cents, deal_recouped: $.data.advance_recouped_cents, deal_unrecouped: $.data.unrecouped_advance_cents, deal_excess: $.data.post_recoupment_net_receipts_cents, deal_rstatus: $.data.recoupment_status }
            - call: "GET /releases/${rel1_id}"
              payload: {}
              as: RoyaltyAnalyst
              as_user_id: "analyst-01"
              captures: { rel_net: $.data.net_receipts_to_date_cents, rel_recouped: $.data.release_advance_recouped_cents, rel_unrecouped: $.data.unrecouped_advance_share_cents }
            - call: "GET /releases/${rel1_id}/dsp-revenue-lines?limit=10&offset=0"
              payload: {}
              as: RoyaltyAnalyst
              as_user_id: "analyst-01"
              captures: { line_net_after: "$.data[0].net_receipts_cents" }
            - call: "GET /artist-agreements/${agr_id}"
              payload: {}
              as: RoyaltyAnalyst
              as_user_id: "analyst-01"
              captures: { agr_rate_after: $.data.active_royalty_rate_pct }
            - call: "GET /distribution-deals/${deal_id}/recoupment-summary?variant=CROSS"
              payload: {}
              as: RoyaltyAnalyst
              as_user_id: "analyst-01"
              captures: { sum_applied: $.data.advance_applied_cents, sum_unrecouped: $.data.unrecouped_advance_cents, sum_excess: $.data.post_recoupment_net_receipts_cents }
          assert:
            - "${line_net_before} is null and ${agr_rate_before} == 0.1000 before the accept; ${rep_gross} == 100000 and ${rep_net} == 85000 were already settled by the submit"
            - "the accept's OWN response carries ${rep_status} == \"ACCEPTED\", ${rep_applied} == 50000 == min(85000, 50000) and ${rep_accepted_at} == \"2026-08-01T00:00:00.000Z\" — no second call is needed to see the settlement"
            - "${deal_net} == 85000, ${deal_recouped} == 50000, ${deal_unrecouped} == 0, ${deal_excess} == 35000 and ${deal_rstatus} == \"RECOUPED\" on the very next read"
            - "${rel_net} == 85000, ${rel_recouped} == 50000 and ${rel_unrecouped} == 0: the release hop is not deferred either"
            - "${line_net_after} == 85000: the line that read null a moment earlier now carries its allocated share"
            - "${agr_rate_after} == 0.1500: the deepest hop, the royalty escalation, is visible immediately — not on the next statement preparation"
            - "${sum_applied} == 50000, ${sum_unrecouped} == 0 and ${sum_excess} == 35000: the derived projection reads the same committed state as the stored fields, so nothing is computed from a lagging snapshot"

      - name: compensation_is_visible_in_the_mutation_response_itself
        claim_type: immediate
        grounds:
          - complexity_profile.consistency_model[immediate]
          - state_machines[DspRevenueReport].transitions[ACCEPTED -> DISPUTED]
          - endpoints[POST /physical-runs/{id}/void-liquidation]
        distinguishing_aspect: |
          Immediate consistency has to hold in the REVERSE direction too, on both compensating
          actions in the API. The dispute's own body must already show advance_applied_cents back at
          0 while the deal, release, line and agreement have all unwound inside that same request — including the
          royalty rate falling back from 0.1500 to 0.1000 — and the void's own body must already
          show the whole reserve restored. §1.8's
          compensating_invariant.dispute_reverses_accept_with_zero_advance_drift asserts the
          arithmetic of that unwind; this instance asserts its VISIBILITY, i.e. that no hop lags
          behind the response that caused it.
        test_recipe:
          setup:
            - "the fully recouped deal of the previous instance, with the report ACCEPTED, the agreement escalated to 0.1500, and a PhysicalRun on the same release partially liquidated at 27000 of a 90000 reserve"
          setup_api_calls:
            - call: "POST /distributors"
              payload: { name: "Vector Digital", legal_entity: "Vector Digital LLC", default_returns_reserve_pct: 0.1000 }
              as: LabelAdmin
              as_user_id: "label-admin-01"
              captures: { dist_id: $.data.id }
            - call: "POST /artists"
              payload: { legal_name: "Nadia Frost", email: "nadia@example.com" }
              as: LabelAdmin
              as_user_id: "label-admin-01"
              captures: { artist_id: $.data.id }
            - call: "POST /stream-rate-cards"
              payload: { dsp_code: "STRM", territory_code: "US", tier: "PREMIUM", rate_micros_per_stream: 4000, effective_from: "2026-01-01" }
              as: LabelAdmin
              as_user_id: "label-admin-01"
            - call: "POST /distribution-deals"
              payload: { distributor_id: "${dist_id}", deal_type: "DISTRIBUTION_FEE", distribution_fee_pct: 0.1500, term_start_date: "2026-01-01", term_end_date: "2026-12-31", territory_codes: ["US"], cross_collateralized: true, advance_amount_cents: 50000, marketing_budget_cents: 0, objection_window_days: 30, post_term_collection_days: 90 }
              as: LabelAdmin
              as_user_id: "label-admin-01"
              captures: { deal_id: $.data.id }
            - call: "POST /releases"
              payload: { deal_id: "${deal_id}", primary_artist_id: "${artist_id}", upc: "099000000272", title: "Taken Back", planned_release_date: "2026-02-01", formats: ["DIGITAL", "VINYL"], advance_share_cents: 50000 }
              as: LabelAdmin
              as_user_id: "label-admin-01"
              captures: { rel1_id: $.data.id }
            - call: "POST /distribution-deals/${deal_id}/execute"
              payload: { advance_payment_reference: "WIRE-C2-0001" }
              as: LabelAdmin
              as_user_id: "label-admin-01"
            - call: "POST /releases/${rel1_id}/release"
              payload: { actual_release_date: "2026-02-01" }
              as: LabelAdmin
              as_user_id: "label-admin-01"
            - call: "POST /artist-agreements"
              payload: { artist_id: "${artist_id}", release_id: "${rel1_id}", royalty_rate_pct: 0.1000, escalated_royalty_rate_pct: 0.1500, advance_amount_cents: 0, recording_costs_cents: 0, recording_recoupable_pct: 0.0000, marketing_recoup_share_pct: 0.0000 }
              as: LabelAdmin
              as_user_id: "label-admin-01"
              captures: { agr_id: $.data.id }
            - call: "POST /artist-agreements/${agr_id}/activate"
              payload: {}
              as: LabelAdmin
              as_user_id: "label-admin-01"
            - call: "POST /dsp-revenue-reports"
              payload: { deal_id: "${deal_id}", dsp_code: "STRM", period_start: "2026-04-01", period_end: "2026-06-30" }
              as: DistributionPartner
              as_user_id: "${dist_id}"
              captures: { rep_id: $.data.id }
            - call: "POST /dsp-revenue-reports/${rep_id}/lines"
              payload: { release_id: "${rel1_id}", territory_code: "US", tier: "PREMIUM", stream_count: 250000 }
              as: DistributionPartner
              as_user_id: "${dist_id}"
            - call: "POST /dsp-revenue-reports/${rep_id}/submit"
              payload: {}
              as: DistributionPartner
              as_user_id: "${dist_id}"
            - call: "GET /distribution-deals/${deal_id}"
              payload: {}
              as: RoyaltyAnalyst
              as_user_id: "analyst-01"
              captures: { deal_v0: $.data.version }
            - call: "POST /dsp-revenue-reports/${rep_id}/accept"
              payload: { expected_deal_version: "${deal_v0}" }
              as: RoyaltyAnalyst
              as_user_id: "analyst-01"
            - call: "POST /physical-runs"
              payload: { release_id: "${rel1_id}", distributor_id: "${dist_id}", units_planned: 1000, unit_manufacturing_cost_cents: 300, window_start: "2026-03-01", window_end: "2026-05-31", returns_reserve_pct: 0.1000 }
              as: LabelAdmin
              as_user_id: "label-admin-01"
              captures: { run_id: $.data.id }
            - call: "POST /physical-runs/${run_id}/manufacture"
              payload: { units_manufactured: 1000 }
              as: LabelAdmin
              as_user_id: "label-admin-01"
            - call: "POST /physical-runs/${run_id}/ship"
              payload: { units_shipped: 900, wholesale_unit_price_cents: 1000 }
              as: DistributionPartner
              as_user_id: "${dist_id}"
              captures: { run_v0: $.data.version }
            - call: "POST /physical-runs/${run_id}/liquidate-reserve"
              payload: { expected_run_version: "${run_v0}", liquidation_pct: 0.3000 }
              as: RoyaltyAnalyst
              as_user_id: "analyst-01"
              captures: { run_v1: $.data.version, run_held_before: $.data.reserve_held_cents }
            - call: "GET /distribution-deals/${deal_id}"
              payload: {}
              as: RoyaltyAnalyst
              as_user_id: "analyst-01"
              captures: { deal_v1: $.data.version, deal_recouped_before: $.data.advance_recouped_cents }
          trigger:
            - call: "POST /dsp-revenue-reports/${rep_id}/dispute"
              payload: { expected_deal_version: "${deal_v1}", dispute_reason: "Premium tier streams double-counted for the quarter." }
              as: RoyaltyAnalyst
              as_user_id: "analyst-01"
              captures: { rep_status: $.data.status, rep_applied_after: $.data.advance_applied_cents, rep_reason: $.data.dispute_reason }
            - call: "GET /distribution-deals/${deal_id}"
              payload: {}
              as: RoyaltyAnalyst
              as_user_id: "analyst-01"
              captures: { deal_net_after: $.data.net_receipts_to_date_cents, deal_recouped_after: $.data.advance_recouped_cents, deal_unrecouped_after: $.data.unrecouped_advance_cents, deal_excess_after: $.data.post_recoupment_net_receipts_cents, deal_rstatus_after: $.data.recoupment_status }
            - call: "GET /releases/${rel1_id}/dsp-revenue-lines?limit=10&offset=0"
              payload: {}
              as: RoyaltyAnalyst
              as_user_id: "analyst-01"
              captures: { line_net_after: "$.data[0].net_receipts_cents" }
            - call: "GET /artist-agreements/${agr_id}"
              payload: {}
              as: RoyaltyAnalyst
              as_user_id: "analyst-01"
              captures: { agr_rate_after: $.data.active_royalty_rate_pct }
            - call: "GET /physical-runs/${run_id}"
              payload: {}
              as: RoyaltyAnalyst
              as_user_id: "analyst-01"
              captures: { run_v2: $.data.version }
            - call: "POST /physical-runs/${run_id}/void-liquidation"
              payload: { expected_run_version: "${run_v2}" }
              as: RoyaltyAnalyst
              as_user_id: "analyst-01"
              captures: { run_held_after: $.data.reserve_held_cents, run_liq_after: $.data.reserve_liquidated_cents, run_rstatus_after: $.data.reserve_status }
            - call: "GET /physical-runs?release_id=${rel1_id}&reserve_status=HELD&limit=10&offset=0"
              payload: {}
              as: RoyaltyAnalyst
              as_user_id: "analyst-01"
              captures: { listed_held: "$.data[0].reserve_held_cents" }
          assert:
            - "before the triggers: ${deal_recouped_before} == 50000 and ${run_held_before} == 63000"
            - "the dispute's OWN response carries ${rep_status} == \"DISPUTED\", ${rep_applied_after} == 0 and ${rep_reason} == \"Premium tier streams double-counted for the quarter.\""
            - "${deal_net_after} == 0, ${deal_recouped_after} == 0, ${deal_unrecouped_after} == 50000, ${deal_excess_after} == 0 and ${deal_rstatus_after} == \"UNRECOUPED\" on the next read — the four compensation hops all land inside the disputing request"
            - "${line_net_after} is null again and ${agr_rate_after} == 0.1000: even the escalation reversal is immediate, so no consumer can observe a RECOUPED-rate agreement under an unrecouped deal"
            - "${run_v2} == ${run_v1}: the dispute cascade never touched the PhysicalRun, so the reserve's own version is still the one the client read"
            - "the void's OWN response carries ${run_held_after} == 90000, ${run_liq_after} == 0 and ${run_rstatus_after} == \"HELD\" — the compensating action does not require a follow-up read either"
            - "${listed_held} == 90000: the filtered list projection matches the restored row in the same breath, so lists are not served from a lagging index"
