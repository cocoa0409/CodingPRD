  - section: endpoints
    instances:

      - name: certificate_exists_second_record_rejected
        claim_type: Conditional action
        grounds:
          - endpoints.POST_/gas-supply/deliveries/{deliveryId}/quality-certificates
          - errors[ERR_CERTIFICATE_EXISTS]
        distinguishing_aspect: "At most one certificate per delivery: a second POST against the same delivery is 409 ERR_CERTIFICATE_EXISTS regardless of role."
        test_recipe:
          setup:
            - "Delivery confirmed; first certificate recorded."
          setup_api_calls:
            - *k_clock
            - *k_cust_fab
            - *k_tank_std
            - *k_rd1
            - *k_rd2
            - call: "GET /gas-supply/deliveries"
              payload: { tank_id: "${t_std}" }
              as: PipelineDispatcher
              captures: { d_ce: "$.data[0].id" }
            - call: "POST /gas-supply/deliveries/${d_ce}/confirm-delivery"
              payload: { delivered_quantity_liters: 30000 }
              as: PipelineDispatcher
            - call: "POST /gas-supply/deliveries/${d_ce}/quality-certificates"
              payload: { sampled_at: "2026-10-01T08:00:00Z", measured_purity_percent: 99.9995, measured_impurity_ppm: 5 }
              as: QualityAnalyst
              as_user_id: "qa-1"
          trigger:
            - call: "POST /gas-supply/deliveries/${d_ce}/quality-certificates"
              payload: { sampled_at: "2026-10-01T09:00:00Z", measured_purity_percent: 99.9996, measured_impurity_ppm: 4 }
              as: QualityAnalyst
              as_user_id: "qa-2"
              captures: { err_ce: $.data.error_id }
          assert:
            - "the response status is 409 and ${err_ce} == ERR_CERTIFICATE_EXISTS"
            - "GET /gas-supply/deliveries/${d_ce}/quality-certificates returns exactly 1 row"

      - name: error_envelope_shape_on_not_found
        claim_type: response_envelope
        grounds:
          - response_envelope.error
        distinguishing_aspect: "The 404 body carries response_type \"error\" with data.error_id and data.message, plus meta.api_request_id and meta.api_request_timestamp — identical envelope shape to success responses."
        test_recipe:
          setup:
            - "Logical clock set. Empty database."
          setup_api_calls:
            - *k_clock
          trigger:
            - call: "GET /gas-supply/customers/00000000-0000-0000-0000-000000000000"
              payload: {}
              as: PlatformAdmin
              captures: { err_env: $.data.error_id }
          assert:
            - "response_type == \"error\""
            - "data.error_id == ERR_CUSTOMER_NOT_FOUND and data.message is a non-empty string"
            - "meta.api_request_id and meta.api_request_timestamp are present"

