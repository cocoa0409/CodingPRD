              as: Dealer
              as_user_id: "${cu1}"
              captures: { o1: $.data.id }
            - { call: "POST /_clock/set_current_utc", payload: { to_iso8601: "2026-06-15T09:00:00Z" }, as: PlantManager }
            - { call: "POST /coatings/containers/${k1}/ship", payload: { order_id: "${o1}" }, as: ProductionOperator }
            - { call: "POST /coatings/containers/${k2}/ship", payload: { order_id: "${o1}" }, as: ProductionOperator }
          trigger:
            - { call: "POST /_clock/set_current_utc", payload: { to_iso8601: "2026-07-15T09:00:00Z" }, as: PlantManager }
            - { call: "POST /coatings/credit-claims", payload: { customer_id: "${cu1}", container_id: "${k1}", claim_type: "FREEZE_DAMAGE", invoice_value_cents: 12000, claimed_exposure_count: 0 }, as: Dealer, as_user_id: "${cu1}", captures: { cl_ok: $.data.id } }
            - { call: "POST /_clock/set_current_utc", payload: { to_iso8601: "2026-07-15T09:00:01Z" }, as: PlantManager }
            - { call: "POST /coatings/credit-claims", payload: { customer_id: "${cu1}", container_id: "${k2}", claim_type: "FREEZE_DAMAGE", invoice_value_cents: 12000, claimed_exposure_count: 0 }, as: Dealer, as_user_id: "${cu1}", captures: { err: $.data.error_id } }
          assert:
            - "CreditClaim.${cl_ok} created at exactly shipped_at + 30 days (inclusive boundary)"
            - "err == ERR_CLAIM_WINDOW_EXPIRED at shipped_at + 30 days + 1 second"

      - name: duplicate_formula_code_rejected
        claim_type: violation_to_error
        grounds: ["validations[priority=10]", "errors[ERR_DUPLICATE_CODE]", entities.Formula.fields.formula_code]
        distinguishing_aspect: "Uniqueness is scoped to non-DEPRECATED rows: a second live formula with formula_code CLR-8841 is rejected; after deprecating the original the same code can be reused."
        test_recipe:
          setup: ["TB1, C1 exist; F1 (CLR-8841) DRAFT"]
          setup_api_calls:
            - { call: "POST /_clock/set_current_utc", payload: { to_iso8601: "2026-05-01T00:00:00Z" }, as: PlantManager }
            - call: "POST /coatings/tint-bases"
              payload: { base_code: "B-100", product_category: "NONFLAT", base_family: "LATEX_EXTERIOR", base_voc_gpl: 80, water_fraction_pct: 40, density_kg_per_gal: 4.6, base_cost_per_gal_cents: 1500, unit_price_per_gal_cents: 3200, shelf_life_months: 24, grind_spec_um: 25 }
              as: LabTechnician
              captures: { tb1: $.data.id }
            - call: "POST /coatings/colorants"
              payload: { colorant_code: "MAG-7", voc_g_per_unit: 5, cost_per_shot_cents: 30, is_hazmat: false }
              as: LabTechnician
              captures: { c1: $.data.id }
            - call: "POST /coatings/formulas"
              payload: { formula_code: "CLR-8841", color_name: "Desert Dusk", tint_base_id: "${tb1}", is_custom: false, target_delta_e: 0.8, lines: [ { colorant_id: "${c1}", shots_per_gallon: 4, sequence: 1 } ] }
              as: LabTechnician
              captures: { f1: $.data.id }
          trigger:
            - { call: "POST /coatings/formulas", payload: { formula_code: "CLR-8841", color_name: "Duplicate", tint_base_id: "${tb1}", is_custom: false, target_delta_e: 0.9, lines: [ { colorant_id: "${c1}", shots_per_gallon: 2, sequence: 1 } ] }, as: LabTechnician, captures: { err: $.data.error_id } }
            - { call: "POST /coatings/formulas/${f1}/deprecate", payload: {}, as: LabTechnician }
            - { call: "POST /coatings/formulas", payload: { formula_code: "CLR-8841", color_name: "Reuse OK", tint_base_id: "${tb1}", is_custom: false, target_delta_e: 0.9, lines: [ { colorant_id: "${c1}", shots_per_gallon: 2, sequence: 1 } ] }, as: LabTechnician, captures: { f2: $.data.id } }
          assert:
            - "err == ERR_DUPLICATE_CODE while ${f1} is DRAFT (non-DEPRECATED)"
            - "After deprecating ${f1}, the same code is reusable: Formula.${f2}.status == DRAFT"

      - name: claim_approve_exceeds_annual_credit_cap
        claim_type: violation_to_error
        grounds: [calculations.freeze_credit_calc, "errors[ERR_CREDIT_CAP_EXCEEDED]", entities.Customer.fields.annual_credit_cap_cents]
        distinguishing_aspect: "Aggregate fiscal validation at approval: each claim is individually valid, but approving the second pushes the customer past annual_credit_cap_cents (40000 settled + 40000 pending > 50000) and fails with ERR_CREDIT_CAP_EXCEEDED while the claim stays UNDER_REVIEW."
        test_recipe:
          setup: ["Full chain: CU1 cap 50000; 3-gal batch with cans K1, K2 shipped 2026-06-15 to AZ; claim CL1 on K1 (invoice 40000, band 1.00) approved and settled (used 40000); claim CL2 on K2 (invoice 40000) reviewed, awaiting approval"]
