      - name: lot_release_blocked_by_zone_in_sanitation_lockout
        grounds:
          - validations[priority=12]
          - validations[priority=21]
          - state_machines.Lot.QUARANTINED_to_AVAILABLE
          - entities.WarehouseZone.fields.status
          - errors[ERR_RELATED_ENTITY_STATE_INVALID]
        distinguishing_aspect: |
          A third (entity, blocker, endpoint) triple in a third direction: the Lot is QUARANTINED,
          which IS a legal from-state for release, but its parent WarehouseZone has flipped to
          SANITATION_LOCKOUT, and release requires zone.status == OPEN. Because the same call also
          violates the temporal lockout window of priority 21, the lower-numbered state check must
          win: ERR_RELATED_ENTITY_STATE_INVALID / 409, never ERR_ZONE_LOCKOUT_CONFLICT.
