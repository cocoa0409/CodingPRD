            - "StateProfile CA; Organization with FYE 6 and an online donation page; CURRENT FY2026 statement at REVIEW; a certifying officer and a separate preparing officer; a DRAFT CA FY2026 filing with GOVERNING_DOCUMENT, FINANCIAL_STATEMENT and REVIEW_REPORT attached."
