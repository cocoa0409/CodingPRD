        test_recipe:
          setup: ["ACTIVE contract with two DRAFT milestones; client reads contract version BEFORE any fund."]
          setup_api_calls:
            - call: "POST /clients"
              payload: { display_name: "C", email: "c26@x.com" }
              as: PlatformAdmin
              captures: { cid: $.data.id }
