        grounds:
          - state_machines.ExemptionClaim.CLAIMED_to_VERIFIED
          - validations[priority=9]
          - errors[ERR_EXEMPTION_INELIGIBLE]
        distinguishing_aspect: >
          stay_nights == 30 is exempt (>= min 30) and verifies; stay_nights == 29 is rejected with
          ERR_EXEMPTION_INELIGIBLE — inclusive boundary on the stay-length metric via the verify endpoint.
