  # ===========================================================================
  - rule_id: boundary_precision_check
    instances:
      - name: royalty_tier_exact_boundary
        grounds:
          - calculations.royalty_accrual
          - entities.LicenseAgreement.fields.royalty_tiers
        distinguishing_aspect: |
          Metric: cumulative annual units; endpoint: statement transition. The
          1,000,000th unit is billed entirely inside bracket 1 (750000 cents); the very
          next unit — sold in the following period of the same year — spills into bracket
          2 at 900 millicents (final royalty exactly 1 cent), proving marginal brackets and
          the closed upper boundary of each tier.
        test_recipe:
          setup:
            - "Clock 2026-09-01T00:00:00Z. ACTIVE non-exclusive agreement (tiers 750@1M, 900@5M, 1100@open), PASS audit defects 50. Statement S1 for 2026-08 sell_through exactly 1000000; statement S2 for 2026-09 sell_through exactly 1."
