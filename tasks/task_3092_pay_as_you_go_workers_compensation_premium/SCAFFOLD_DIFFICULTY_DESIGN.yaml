  # ===========================================================================
  - rule_id: transitive_cascade
    instances:

      - name: dispute_approval_supersede_reinvoice_adjustment_chain
        grounds:
          - state_machines.ClassCodeDispute.UNDER_REVIEW_to_APPROVED
          - state_machines.PayrollReport.ACCEPTED_to_SUPERSEDED
          - state_machines.PremiumInvoice.ISSUED_to_VOID
          - calculations.retro_adjustment_delta
        distinguishing_aspect: |
          Depth-3 chain: dispute APPROVED -> PolicyClassCode reassigned (hop 1)
          -> ACCEPTED PayrollReport SUPERSEDED (hop 2) -> original invoice
          VOIDed and replacement issued (hop 3) -> RETRO_ADJUSTMENT invoice for
          the signed delta (hop 4). Each hop is caused by the previous mutation,
          not by the decide call directly. Pinned literals: original invoice
          81000, replacement 95000, delta +14000.
        test_recipe:
          setup:
            - "Logical clock 2026-09-01. CA table per common fixtures (rates 8810:125, 8812:160)."
            - "Policy P6 (CA only, mod 1.0, class CA/8810) bound."
            - "One ACCEPTED report [09-01, 09-08) with a CA/8810 line: gross 4000000, headcount 4 -> original invoice total 81000."
            - "Dispute D6 on the CA/8810 assignment requesting 8812 effective 2026-09-01, in UNDER_REVIEW."
          setup_api_calls:
            - *dd_ca_table
            - &dd_emp6
              call: "POST /wc/employers"
              payload: { legal_name: "Cascade Ceramics Ltd", fein: "66-7777888", contact_email: "claims@cascade.example", home_state: "CA" }
              as: PlatformAdmin
              captures: { dd_emp6_id: $.data.id }
            - &dd_pol6
              call: "POST /wc/policies"
              payload: { employer_id: "${dd_emp6_id}", policy_number: "WC-CAS-006", effective_date: "2026-09-01T00:00:00Z", expiry_date: "2027-09-01T00:00:00Z", experience_mod: 1.0, class_codes: [{state_code: "CA", class_code: "8810", estimated_annual_payroll_cents: 2000000}] }
              as: Underwriter
              captures: { dd_pol6_id: $.data.id }
            - call: "POST /wc/policies/${dd_pol6_id}/bind"
              payload: {}
              as: Underwriter
            - &dd_rep6
              call: "POST /wc/payroll-reports"
              payload: { policy_id: "${dd_pol6_id}", period_start: "2026-09-01T00:00:00Z", period_end: "2026-09-08T00:00:00Z", idempotency_key: "cas-run-001", lines: [{state_code: "CA", class_code: "8810", gross_wages_cents: 4000000, ot_premium_cents: 0, severance_cents: 0, executive_wages_cents: 0, headcount: 4}] }
              as: PayrollProvider
              captures: { dd_rep6_id: $.data.id }
            - call: "GET /wc/policies/${dd_pol6_id}/class-codes"
              as: Underwriter
              captures: { dd_pcc6_id: "$.data[0].id" }
            - &dd_dispute6
              call: "POST /wc/disputes"
              payload: { policy_id: "${dd_pol6_id}", policy_class_code_id: "${dd_pcc6_id}", requested_class_code: "8812", effective_from: "2026-09-01T00:00:00Z" }
              as: EmployerAdmin
              as_user_id: "${dd_emp6_id}"
              captures: { dd_dispute6_id: $.data.id }
            - call: "POST /wc/disputes/${dd_dispute6_id}/open-review"
              payload: {}
              as: Underwriter
            - call: "GET /wc/policies/${dd_pol6_id}"
              as: Underwriter
              captures: { dd_pol6_v: $.data.version }
          trigger:
            - call: "POST /wc/disputes/${dd_dispute6_id}/decide"
              payload: { decision: "APPROVED", expected_policy_version: "${dd_pol6_v}" }
              as: Underwriter
              as_user_id: "uw-lee"
          assert:
            - "PayrollReport.${dd_rep6_id}.status == SUPERSEDED (hop 2 caused by the reassignment, not by any direct report call)"
            - "the original PAYROLL invoice status == VOID (hop 3) and a replacement PAYROLL invoice exists with total_cents == 95000"
            - "a PremiumInvoice with kind == RETRO_ADJUSTMENT and total_cents == 14000 exists (95000 - 81000)"
            - "Policy.${dd_pol6_id}.cumulative_billed_cents reflects VOID exclusion: replacement 95000 + adjustment 14000 counted, original 81000 excluded"

      - name: invoice_payment_billing_current_audit_closure_chain
        grounds:
          - state_machines.PremiumInvoice.ISSUED_to_PAID
          - state_machines.Policy.billing_status
          - state_machines.AuditReconciliation.VERIFIED_to_CLOSED
        distinguishing_aspect: |
          Depth-3 chain from a different trigger: paying the AUDIT_TRUEUP
          invoice (PremiumInvoice ISSUED -> PAID, hop 1) recomputes the policy
          billing aggregate and flips billing_status OVERDUE -> CURRENT (hop 2),
          and the same payment satisfies the audit's closure precondition so
          AuditReconciliation VERIFIED -> CLOSED (hop 3) — a cascade the
          dispute-triggered chain never exercises.
        test_recipe:
          setup:
            - "Logical clock 2026-10-02. CA table per common fixtures."
            - "Policy P2 from the audit variance fixture: reports A (basis 190000) and B (basis 10000000) ACCEPTED, filings 200000000 + 500000, audit window [09-01, 10-01)."
            - "Audit FILED then VERIFIED -> variance 190310000 -> AUDIT_TRUEUP invoice issued for the unreported wages' premium."
            - "Clock advanced past the true-up invoice due_date so billing_status == OVERDUE."
          setup_api_calls:
            - *dd_ca_table
            - *dd_emp2
            - *dd_pol2
            - call: "POST /wc/policies/${dd_pol2_id}/bind"
              payload: {}
              as: Underwriter
            - *dd_rep_a
            - *dd_rep_b
            - *dd_q3
            - *dd_q3
            - *dd_audit
            - call: "GET /wc/policies/${dd_pol2_id}"
              as: TaxFiler
              captures: { dd_pol2_v2: $.data.version }
            - call: "POST /wc/audits/${dd_audit_id}/file"
              payload: { expected_policy_version: "${dd_pol2_v2}" }
              as: TaxFiler
              as_user_id: "tf-nina"
            - call: "POST /wc/audits/${dd_audit_id}/verify"
              payload: {}
              as: Auditor
              as_user_id: "au-sam"
            - call: "GET /wc/audits/${dd_audit_id}"
              as: Auditor
              captures: { dd_trueup_id: $.data.trueup_invoice_id }
            - call: "GET /wc/invoices/${dd_trueup_id}"
              as: Auditor
              captures: { dd_trueup_total: $.data.total_cents }
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-10-20T00:00:00Z" }
              as: PlatformAdmin
          trigger:
            - call: "POST /wc/invoices/${dd_trueup_id}/payments"
              payload: { amount_cents: "${dd_trueup_total}" }
              as: EmployerAdmin
              as_user_id: "${dd_emp2_id}"
          assert:
            - "PremiumInvoice.${dd_trueup_id}.status == PAID (hop 1)"
            - "Policy.${dd_pol2_id}.billing_status == CURRENT (hop 2: no ISSUED invoice past due remains; the two PAYROLL invoices were paid or not-yet-due handling aside, the sweep re-evaluates on payment)"
            - "AuditReconciliation.${dd_audit_id}.status == CLOSED (hop 3: VERIFIED -> CLOSED precondition satisfied by the true-up payment)"
            - "Policy.${dd_pol2_id}.cumulative_collected_cents includes the true-up total"

  # ===========================================================================
  - rule_id: priority_pair_validation_conflict
    instances:

      - name: payroll_overlap_state_vs_temporal_on_pending_policy
        grounds:
          - validations.priority-5
          - validations.priority-10
          - errors.ERR_POLICY_NOT_ACTIVE
          - errors.ERR_PAYROLL_PERIOD_OVERLAP
        distinguishing_aspect: |
          Category pair state vs business_temporal: a payroll submission on a
          PENDING policy whose period ALSO overlaps an existing report (seeded
          by a prior bind-report-cancel-reissue sequence is impossible, so the
          overlap is simulated with a second policy) violates both the ACTIVE-
          state gate (priority 5) and the overlap rule (priority 10) — the
          response must be the state error ERR_POLICY_NOT_ACTIVE, not the
          temporal one.
        test_recipe:
          setup:
            - "Logical clock 2026-09-01. CA table per common fixtures."
            - "Policy P7 created (CA/8810) but NEVER bound — coverage_status PENDING."
          setup_api_calls:
            - *dd_ca_table
            - &dd_emp7
              call: "POST /wc/employers"
              payload: { legal_name: "Pending Pistons Co", fein: "77-8888999", contact_email: "hr@pending.example", home_state: "CA" }
              as: PlatformAdmin
              captures: { dd_emp7_id: $.data.id }
            - &dd_pol7
              call: "POST /wc/policies"
              payload: { employer_id: "${dd_emp7_id}", policy_number: "WC-PEN-007", effective_date: "2026-09-01T00:00:00Z", expiry_date: "2027-09-01T00:00:00Z", experience_mod: 1.0, class_codes: [{state_code: "CA", class_code: "8810", estimated_annual_payroll_cents: 1000000}] }
              as: Underwriter
              captures: { dd_pol7_id: $.data.id }
          trigger:
            - call: "POST /wc/payroll-reports"
              payload: { policy_id: "${dd_pol7_id}", period_start: "2026-09-01T00:00:00Z", period_end: "2026-09-08T00:00:00Z", idempotency_key: "pen-run-001", lines: [{state_code: "CA", class_code: "8810", gross_wages_cents: 100000, ot_premium_cents: 0, severance_cents: 0, executive_wages_cents: 0, headcount: 1}] }
              as: PayrollProvider
              captures: { dd_pen_err: $.data.error_id }
          assert:
            - "the response status is 409"
            - "error_id == ERR_POLICY_NOT_ACTIVE (state gate at priority 5 fires before the temporal overlap check at priority 10, which would otherwise also evaluate)"

      - name: dispute_decide_sod_vs_stale_version_priority
        grounds:
          - validations.priority-6
          - validations.priority-7
          - errors.ERR_STALE_VERSION
          - errors.ERR_SEGREGATION_OF_DUTIES
          - concurrency_rules.dispute-decide-stale-policy
        distinguishing_aspect: |
          Category pair state(OCC) vs business_safety: a decide call whose
          expected_policy_version is stale (expression over the observed
          version minus 1) AND whose decider equals the filer violates both
          the OCC state rule (priority 6) and segregation of duties (priority
          7) — the response must be ERR_STALE_VERSION (412), because OCC is
          checked before the SoD safety rule.
        test_recipe:
          setup:
            - "Logical clock 2026-09-01. CA table per common fixtures."
            - "Policy P8 (CA only, classes 8810) bound; dispute D8 filed by employer E8, in UNDER_REVIEW."
            - "Policy P8 has since mutated (the bind bumped version), so the version captured at dispute-filing time is stale by decide time when deliberately decremented."
          setup_api_calls:
            - *dd_ca_table
            - &dd_emp8
              call: "POST /wc/employers"
              payload: { legal_name: "Conflict Castings Inc", fein: "88-9999000", contact_email: "legal@conflict.example", home_state: "CA" }
              as: PlatformAdmin
              captures: { dd_emp8_id: $.data.id }
            - &dd_pol8
              call: "POST /wc/policies"
              payload: { employer_id: "${dd_emp8_id}", policy_number: "WC-CON-008", effective_date: "2026-09-01T00:00:00Z", expiry_date: "2027-09-01T00:00:00Z", experience_mod: 1.0, class_codes: [{state_code: "CA", class_code: "8810", estimated_annual_payroll_cents: 1000000}] }
              as: Underwriter
              captures: { dd_pol8_id: $.data.id }
            - call: "POST /wc/policies/${dd_pol8_id}/bind"
              payload: {}
              as: Underwriter
            - call: "GET /wc/policies/${dd_pol8_id}/class-codes"
              as: Underwriter
              captures: { dd_pcc8_id: "$.data[0].id" }
            - call: "POST /wc/disputes"
              payload: { policy_id: "${dd_pol8_id}", policy_class_code_id: "${dd_pcc8_id}", requested_class_code: "8812", effective_from: "2026-09-01T00:00:00Z" }
              as: EmployerAdmin
              as_user_id: "${dd_emp8_id}"
              captures: { dd_dispute8_id: $.data.id }
            - call: "POST /wc/disputes/${dd_dispute8_id}/open-review"
              payload: {}
              as: Underwriter
            - call: "GET /wc/policies/${dd_pol8_id}"
              as: Underwriter
              captures: { dd_pol8_v: $.data.version }
          trigger:
            - call: "POST /wc/disputes/${dd_dispute8_id}/decide"
              payload: { decision: "APPROVED", expected_policy_version: "${dd_pol8_v} - 1" }
              as: EmployerAdmin
              as_user_id: "${dd_emp8_id}"
              captures: { dd_conf_err: $.data.error_id }
          assert:
            - "the response status is 412"
            - "error_id == ERR_STALE_VERSION — the OCC state check (priority 6) wins over the segregation-of-duties safety check (priority 7), even though the decider also equals the filer"

  # ===========================================================================
  - rule_id: boundary_precision_check
    instances:

      - name: minimum_premium_substitution_strictly_less_than
        grounds:
          - calculations.invoice_total
          - entities.StateRatingTable.fields.min_payroll_threshold_cents
        distinguishing_aspect: |
          Numeric threshold boundary: the minimum-premium substitution triggers
          on strictly-less-than. A post-mod state subtotal of 100 (MT, threshold
          5000) is REPLACED by the 30000 minimum (total 50300); a subtotal of
          exactly 5000 is NOT replaced (total 25800) — one cent of rate input
          across the boundary flips the invoice by 25100 cents.
        test_recipe:
          setup:
            - "Logical clock 2026-09-01. MT table per common fixtures (threshold 5000, minimum 30000, per-capita 300, expense constant 20000, rate 8810:100, NET)."
            - "Policy P9 (MT only, mod 1.0, class MT/8810) bound."
          setup_api_calls:
            - &dd_mt_table
              call: "POST /wc/state-rating-tables"
              payload: { state_code: "MT", effective_from: "2026-01-01T00:00:00Z", effective_to: "2027-01-01T00:00:00Z", monopolistic: false, per_capita_admin_fee_cents: 300, expense_constant_cents: 20000, min_payroll_threshold_cents: 5000, state_minimum_premium_cents: 30000, ot_basis: "NET", class_rates: [{class_code: "8810", rate_per_100_cents: 100}], max_payroll_per_executive_cents: 250000 }
              as: PlatformAdmin
            - &dd_emp9
              call: "POST /wc/employers"
              payload: { legal_name: "Boundary Builders MT", fein: "22-3333444", contact_email: "payroll@boundary.example", home_state: "MT" }
              as: PlatformAdmin
              captures: { dd_emp9_id: $.data.id }
            - &dd_pol9
              call: "POST /wc/policies"
              payload: { employer_id: "${dd_emp9_id}", policy_number: "WC-BND-009", effective_date: "2026-09-01T00:00:00Z", expiry_date: "2027-09-01T00:00:00Z", experience_mod: 1.0, class_codes: [{state_code: "MT", class_code: "8810", estimated_annual_payroll_cents: 500000}] }
              as: Underwriter
              captures: { dd_pol9_id: $.data.id }
            - call: "POST /wc/policies/${dd_pol9_id}/bind"
              payload: {}
              as: Underwriter
          trigger:
            - call: "POST /wc/payroll-reports"
              payload: { policy_id: "${dd_pol9_id}", period_start: "2026-09-01T00:00:00Z", period_end: "2026-09-08T00:00:00Z", idempotency_key: "bnd-run-below", lines: [{state_code: "MT", class_code: "8810", gross_wages_cents: 10000, ot_premium_cents: 0, severance_cents: 0, executive_wages_cents: 0, headcount: 1}] }
              as: PayrollProvider
            - call: "POST /wc/payroll-reports"
              payload: { policy_id: "${dd_pol9_id}", period_start: "2026-09-08T00:00:00Z", period_end: "2026-09-15T00:00:00Z", idempotency_key: "bnd-run-at", lines: [{state_code: "MT", class_code: "8810", gross_wages_cents: 500000, ot_premium_cents: 0, severance_cents: 0, executive_wages_cents: 0, headcount: 1}] }
              as: PayrollProvider
          assert:
