              payload: {}
              as: Sponsor
              as_user_id: "sponsor-1"
              captures: { tv_stale: $.data.version }
            - call: "POST /trials/${trial_id}/consent-documents/${doc_v1}/activate"
              payload: { expected_trial_version: "${tv_stale}" }
              as: Sponsor
              as_user_id: "sponsor-1"
          trigger:
            - call: "POST /trials/${trial_id}/consent-documents/${doc_v2}/activate"
              payload: { expected_trial_version: "${tv_stale}" }
              as: Sponsor
              as_user_id: "sponsor-1"
              captures: { err: $.data.error_id }
          assert:
            - "response status == 412"
            - "response.data.error_id == ERR_STALE_TRIAL_VERSION"
            - "ConsentDocument.${doc_v1}.status == ACTIVE"
            - "ConsentDocument.${doc_v2}.status == IRB_APPROVED"

      - name: derived_enrolled_count_after_randomize
        claim_type: derived_field_reconciliation
        grounds:
          - entities.Trial.fields.enrolled_count
          - entities.RandomizationArm.fields.assigned_count
          - state_machines.Enrollment.CONSENTED_to_RANDOMIZED
        distinguishing_aspect: "After one RANDOMIZE, Trial.enrolled_count == 1 and the assigned arm's assigned_count == 1 (derived counters reconcile with the randomize side effects)."
        test_recipe:
          setup: ["An OPEN trial with one CONSENTED enrollment about to randomize."]
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-06-01T08:00:00Z" }
              as: Sponsor
            - call: "POST /trials"
              payload: { title: "DerivCount", target_enrollment: 5, randomization_method: "SIMPLE" }
              as: Sponsor
              as_user_id: "sponsor-1"
              captures: { trial_id: $.data.id }
            - call: "POST /trials/${trial_id}/arms"
              payload: { name: "TREATMENT", allocation_weight: 1 }
              as: Sponsor
              as_user_id: "sponsor-1"
              captures: { arm_t: $.data.id }
            - call: "POST /trials/${trial_id}/consent-documents"
              payload: { body_hash: "h1" }
              as: Sponsor
              as_user_id: "sponsor-1"
              captures: { doc_id: $.data.id }
            - call: "POST /trials/${trial_id}/irb-reviews"
              payload: { scope: "PROTOCOL" }
              as: Sponsor
              as_user_id: "sponsor-1"
              captures: { prot_review_id: $.data.id }
            - call: "POST /trials/${trial_id}/irb-reviews/${prot_review_id}/decide"
              payload: { action: "APPROVE" }
              as: IRBReviewer
              as_user_id: "irb-1"
            - call: "POST /trials/${trial_id}/irb-reviews"
              payload: { scope: "CONSENT", consent_document_id: "${doc_id}" }
              as: Sponsor
              as_user_id: "sponsor-1"
              captures: { cons_review_id: $.data.id }
            - call: "POST /trials/${trial_id}/irb-reviews/${cons_review_id}/decide"
              payload: { action: "APPROVE" }
              as: IRBReviewer
              as_user_id: "irb-1"
            - call: "GET /trials/${trial_id}"
              payload: {}
              as: Sponsor
              as_user_id: "sponsor-1"
              captures: { tv_act: $.data.version }
            - call: "POST /trials/${trial_id}/consent-documents/${doc_id}/activate"
              payload: { expected_trial_version: "${tv_act}" }
              as: Sponsor
              as_user_id: "sponsor-1"
            - call: "POST /participants"
              payload: { full_name: "P DC", age_years: 40, weight_kg: 80, hba1c: 6.0 }
              as: CoordinatorStaff
              captures: { participant_id: $.data.id }
            - call: "POST /trials/${trial_id}/screen-participant"
              payload: { participant_id: "${participant_id}" }
              as: CoordinatorStaff
              captures: { screening_id: $.data.id }
            - call: "POST /enrollments"
              payload: { screening_id: "${screening_id}" }
              as: CoordinatorStaff
              captures: { enr_id: $.data.id }
            - call: "POST /enrollments/${enr_id}/transition"
              payload: { action: "CONSENT", consent_document_id: "${doc_id}" }
              as: CoordinatorStaff
            - call: "GET /trials/${trial_id}"
              payload: {}
              as: CoordinatorStaff
              captures: { tv_r: $.data.version }
          trigger:
            - call: "POST /enrollments/${enr_id}/transition"
              payload: { action: "RANDOMIZE", expected_trial_version: "${tv_r}" }
              as: CoordinatorStaff
              captures: { arm_assigned: $.data.arm_id }
            - call: "GET /trials/${trial_id}"
              payload: {}
              as: Sponsor
              as_user_id: "sponsor-1"
              captures: { ec: $.data.enrolled_count }
            - call: "GET /trials/${trial_id}/arms"
              payload: {}
              as: Sponsor
              as_user_id: "sponsor-1"
          assert:
            - "Trial.${trial_id}.enrolled_count == 1"
            - "the arm referenced by Enrollment.${enr_id}.arm_id has assigned_count == 1"

      - name: rate_threshold_capacity_covered_by_difficulty
        claim_type: rate_threshold_triggers
        grounds:
          - validations[priority=21]
          - errors[ERR_TRIAL_AT_CAPACITY]
        excluded_because:
          difficulty_instance: bpc_capacity_ge_threshold_at_randomize
          rationale: "The capacity >= target_enrollment boundary trigger is the asserted path of the named §1.8 boundary-precision instance."

  # ===========================================================================
  - section: endpoints
    instances:
      - name: response_envelope_shape_on_trial_create
        claim_type: Standard CRUD
        grounds:
          - endpoints["POST /trials"]
        distinguishing_aspect: "POST /trials wraps the entity in the fixed success envelope: meta.api_request_id, meta.api_request_timestamp, response_type=object, data containing the Trial."
        test_recipe:
          setup: ["Empty DB."]
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-06-01T00:00:00Z" }
              as: Sponsor
          trigger:
            - call: "POST /trials"
              payload: { title: "Envelope", target_enrollment: 5, randomization_method: "SIMPLE" }
              as: Sponsor
              as_user_id: "sponsor-1"
              captures: { tid: $.data.id }
          assert:
            - "response has meta.api_request_id and meta.api_request_timestamp"
            - "response.response_type == object"
            - "response.data.id is a UUID with no type prefix"

      - name: enrollment_filtered_list_by_trial
        claim_type: Computed read
        grounds:
          - endpoints["GET /enrollments"]
          - entities.Enrollment.fields.trial_id
        distinguishing_aspect: "GET /enrollments with trial_id filter returns only enrollments for that trial (reverse-reachability filtered list), with pagination fields total_count and has_more."
        test_recipe:
          setup: ["A trial with one SCREENED enrollment."]
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-06-01T00:00:00Z" }
              as: Sponsor
            - call: "POST /trials"
              payload: { title: "FilterEnr", target_enrollment: 5, randomization_method: "SIMPLE" }
              as: Sponsor
              as_user_id: "sponsor-1"
              captures: { trial_id: $.data.id }
            - call: "POST /participants"
              payload: { full_name: "P FE", age_years: 40, weight_kg: 80, hba1c: 6.0 }
              as: CoordinatorStaff
              captures: { participant_id: $.data.id }
            - call: "POST /trials/${trial_id}/screen-participant"
              payload: { participant_id: "${participant_id}" }
              as: CoordinatorStaff
              captures: { screening_id: $.data.id }
            - call: "POST /enrollments"
              payload: { screening_id: "${screening_id}" }
              as: CoordinatorStaff
              captures: { enr_id: $.data.id }
          trigger:
            - call: "GET /enrollments"
              payload: { trial_id: "${trial_id}" }
              as: CoordinatorStaff
          assert:
            - "response is an array containing Enrollment ${enr_id}"
            - "response envelope carries total_count and has_more pagination fields"

  # ===========================================================================
  - section: consistency_model
    instances:
      - name: immediate_visibility_of_posture_after_activate
        claim_type: immediate
        grounds:
          - entities.Trial.fields.posture
          - state_machines.ConsentDocument.IRB_APPROVED_to_ACTIVE
        distinguishing_aspect: "Immediate consistency: the consent-activate response and an immediately-following GET /trials/{id} both show posture==OPEN with no lag."
        test_recipe:
          setup: ["A trial with protocol approved, one arm, an IRB_APPROVED consent ready to activate."]
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-06-01T08:00:00Z" }
              as: Sponsor
            - call: "POST /trials"
              payload: { title: "ImmPosture", target_enrollment: 5, randomization_method: "SIMPLE" }
              as: Sponsor
              as_user_id: "sponsor-1"
              captures: { trial_id: $.data.id }
            - call: "POST /trials/${trial_id}/arms"
              payload: { name: "TREATMENT", allocation_weight: 1 }
              as: Sponsor
              as_user_id: "sponsor-1"
            - call: "POST /trials/${trial_id}/consent-documents"
              payload: { body_hash: "h1" }
              as: Sponsor
              as_user_id: "sponsor-1"
              captures: { doc_id: $.data.id }
            - call: "POST /trials/${trial_id}/irb-reviews"
              payload: { scope: "PROTOCOL" }
              as: Sponsor
              as_user_id: "sponsor-1"
              captures: { prot_review_id: $.data.id }
            - call: "POST /trials/${trial_id}/irb-reviews/${prot_review_id}/decide"
              payload: { action: "APPROVE" }
              as: IRBReviewer
              as_user_id: "irb-1"
            - call: "POST /trials/${trial_id}/irb-reviews"
              payload: { scope: "CONSENT", consent_document_id: "${doc_id}" }
              as: Sponsor
              as_user_id: "sponsor-1"
              captures: { cons_review_id: $.data.id }
            - call: "POST /trials/${trial_id}/irb-reviews/${cons_review_id}/decide"
              payload: { action: "APPROVE" }
              as: IRBReviewer
              as_user_id: "irb-1"
            - call: "GET /trials/${trial_id}"
              payload: {}
              as: Sponsor
              as_user_id: "sponsor-1"
              captures: { tv_act: $.data.version }
          trigger:
            - call: "POST /trials/${trial_id}/consent-documents/${doc_id}/activate"
              payload: { expected_trial_version: "${tv_act}" }
              as: Sponsor
              as_user_id: "sponsor-1"
            - call: "GET /trials/${trial_id}"
              payload: {}
              as: Sponsor
              as_user_id: "sponsor-1"
              captures: { post: $.data.posture }
          assert:
            - "ConsentDocument.${doc_id}.status == ACTIVE"
            - "Trial.${trial_id}.posture == OPEN (visible immediately on the next GET)"
