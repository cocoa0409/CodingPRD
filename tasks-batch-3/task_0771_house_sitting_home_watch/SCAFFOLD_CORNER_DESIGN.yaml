  # ---------------------------------------------------------------------------
  - section: cross_cutting_complexity_layers
    instances:
      - name: occ_stale_sitter_version_supersede_returns_412
        claim_type: optimistic_concurrency
        grounds: ["concurrency_rules[coverage-policy-supersede-stale-sitter]", "errors[ERR_STALE_SITTER_VERSION]"]
        distinguishing_aspect: "A second coverage-policy create carrying the pre-first-create sitter version (now stale, since the first create bumped Sitter.version) is rejected with ERR_STALE_SITTER_VERSION 412."
        test_recipe:
          setup: ["A sitter exists; the client reads Sitter.version, then issues a first BOND policy (which bumps the version)."]
          setup_api_calls:
            - call: "POST /home-watch/sitters"
              payload: { full_name: "Sam", email: "sam@x.com" }
              as: Coordinator
              captures: { st_id: $.data.id }
            - call: "GET /home-watch/sitters/${st_id}"
              payload: {}
              as: Coordinator
              captures: { st_v: $.data.version }
            - call: "POST /home-watch/coverage-policies"
              payload: { sitter_id: "${st_id}", policy_type: "BOND", coverage_amount_cents: 1000000, effective_from: "2026-01-01T00:00:00Z", expires_at: "2027-01-01T00:00:00Z", expected_sitter_version: "${st_v}" }
              as: Coordinator
          trigger:
            - call: "POST /home-watch/coverage-policies"
              payload: { sitter_id: "${st_id}", policy_type: "BOND", coverage_amount_cents: 500000, effective_from: "2026-01-01T00:00:00Z", expires_at: "2027-01-01T00:00:00Z", expected_sitter_version: "${st_v}" }
              as: Coordinator
              captures: { err: $.data.error_id }
          assert:
            - "Response error_id == ERR_STALE_SITTER_VERSION"
            - "HTTP status == 412"

      - name: sitter_version_increments_on_background_submit
        claim_type: optimistic_concurrency
        grounds: [entities.Sitter.fields.version, state_machines.BackgroundCheck.SUBMITTED_to_CLEARED]
        distinguishing_aspect: "Submitting a background check mutates the sitter (background_check_status=SUBMITTED), so Sitter.version advances from 1 to 2."
        test_recipe:
          setup: ["A freshly created sitter (version 1)."]
          setup_api_calls:
            - call: "POST /home-watch/sitters"
              payload: { full_name: "Sam", email: "sam@x.com" }
              as: Coordinator
              captures: { st_id: $.data.id }
          trigger:
            - call: "POST /home-watch/background-checks"
              payload: { sitter_id: "${st_id}", provider_ref: "PRV-1", expires_at: "2027-01-01T00:00:00Z" }
              as: Coordinator
            - call: "GET /home-watch/sitters/${st_id}"
              payload: {}
              as: Coordinator
              captures: { st_v: $.data.version }
          assert:
            - "Sitter.${st_id}.version == 2"
            - "Sitter.${st_id}.background_check_status == SUBMITTED"

  # ---------------------------------------------------------------------------
  - section: consistency_model
    instances:
      - name: immediate_read_after_create_client
        claim_type: immediate
        grounds: [entities.Client, endpoints]
        distinguishing_aspect: "A client created via POST is immediately readable via GET /home-watch/clients/{id} in the same sequence with identical fields."
        test_recipe:
          setup: ["Empty DB."]
          setup_api_calls:
            - call: "POST /home-watch/clients"
              payload: { full_name: "Ada", email: "ada@x.com", billing_tier: "PREMIUM" }
              as: Coordinator
              captures: { cl_id: $.data.id }
          trigger:
            - call: "GET /home-watch/clients/${cl_id}"
              payload: {}
              as: Coordinator
          assert:
            - "Client.${cl_id}.billing_tier == PREMIUM"
            - "Client.${cl_id}.status == ACTIVE"

  # ---------------------------------------------------------------------------
  # Corners already exercised by §1.8 — stubs (no test_recipe)
  # ---------------------------------------------------------------------------
  - section: state_machines
    instances:
      - name: invoice_void_on_booking_cancel_stub
        claim_type: Compensation
        grounds: [state_machines.Invoice.ISSUED_to_VOID]
        excluded_because:
          difficulty_instance: transitive_cascade / booking_cancel_cascade_booking_visit_invoice_depth3
          rationale: "Invoice→VOID on booking cancel is asserted as hop 3 of the named §1.8 cascade instance."
      - name: key_return_on_booking_cancel_stub
        claim_type: Cross-entity
        grounds: [state_machines.KeyAssignment.CHECKED_OUT_to_RETURNED]
        excluded_because:
          difficulty_instance: transitive_cascade / booking_cancel_cascade_booking_visit_invoice_depth3
          rationale: "The CHECKED_OUT→RETURNED release on booking cancel is asserted in the same §1.8 cascade instance."
      - name: sitter_suspend_on_policy_exhaust_stub
        claim_type: Cross-entity
        grounds: [entities.Sitter.fields.status]
        excluded_because:
          difficulty_instance: transitive_cascade / incident_resolve_exhaust_suspend_depth2
          rationale: "Sitter→SUSPENDED on LIABILITY policy exhaustion is asserted as hop 2 of the named §1.8 cascade instance."
