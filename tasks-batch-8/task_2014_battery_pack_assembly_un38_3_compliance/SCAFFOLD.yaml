      - "GET /integration-programs/{id}/battery-packs/{id}"
      - "GET /integration-programs/{id}/battery-packs/{id}/welding-records"
      - "GET /integration-programs/{id}/battery-packs/{id}/welding-records/{id}"
      - "GET /integration-programs/{id}/battery-packs/{id}/bms-flash-records"
      - "GET /integration-programs/{id}/battery-packs/{id}/safety-test-dossiers"
      - "GET /integration-programs/{id}/battery-packs/{id}/safety-test-dossiers/{id}"
      - "GET /integration-programs/{id}/bms-firmwares"
      - "GET /integration-programs/{id}/bms-firmwares/{id}"
      - "GET /integration-programs/{id}/bms-firmwares/{id}/approvals"
      - "GET /integration-programs/{id}/storage-locations"
      - "GET /integration-programs/{id}/storage-locations/{id}"
      - "GET /integration-programs/{id}/storage-placements"
      - "GET /integration-programs/{id}/storage-placements/{id}"
      - "GET /integration-programs/{id}/transport-shipments"
      - "GET /integration-programs/{id}/transport-shipments/{id}"
      - "GET /integration-programs/{id}/transport-shipments/{id}/packs"
      - "GET /integration-programs/{id}/return-authorizations"
      - "GET /integration-programs/{id}/return-authorizations/{id}"
      - "GET /integration-programs/{id}/recall-campaigns"
