- method: POST
  path: /farm/racks
  description: Create a rack; auto-creates tower_count Tower rows (tower_index 1..N)
  roles:
  - FarmManager
  code: 201
  input:
  - rack_code
  - water_loop_id
  - zone
  - tower_count
  output: Rack
  side_effects:
