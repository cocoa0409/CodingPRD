          - errors[ERR_STALE_SOLICITATION_VERSION]
          - endpoints[POST /procurement/bids]
        distinguishing_aspect: "The bidder's expected_solicitation_version is checked against the live row, so a create citing the version observed before the addendum is refused with HTTP 412 ERR_STALE_SOLICITATION_VERSION even though every other precondition holds; re-reading the version makes the identical body succeed."
        test_recipe:
          setup:
            - "clock pinned to 2026-08-01T00:00:00Z; one Vendor; one ISSUED Solicitation SOL-2238-C51 with estimated_value_cents 10000000; the bidder captured the version, and only afterwards did the officer issue addendum 1 (extends_bid_due_by_days 0, no new requirements), which advanced Solicitation.version"
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-01T00:00:00Z" }
              as: SystemAdmin
              as_user_id: "U-ADMIN-1"
            - call: "POST /procurement/vendors"
              payload: { legal_name: "Ravensworth Striping", tax_id: "100000096", contact_email: "v96@example.gov" }
              as: SystemAdmin
              as_user_id: "U-ADMIN-1"
              captures: { c_v96_id: $.data.id }
