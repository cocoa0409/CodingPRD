      - name: appeal_filing_window_closes_exactly_thirty_days_after_the_determination
        claim_type: Violation → Error
        grounds: ["validations[priority=21]", "errors[ERR_APPEAL_WINDOW_CLOSED]"]
        distinguishing_aspect: |
          The window test is clock < determined_at + 30 days, so the last filing
          instant is one second before 2026-08-31T00:00:00Z and the boundary instant
          itself is already closed. Two determinations minted at the same clock let
          the same window be probed from both sides, and the refused filing must
          leave the determination's placement axis and version untouched.
        test_recipe:
          setup:
            - "Logical clock starts at 2026-08-01T00:00:00Z."
            - "Courses MATH-050 (level_rank 50) and MATH-100 (level_rank 100), both ACTIVE."
            - "One ACTIVE rule TRANSCRIPT_GPA -> MATH-050 (min_hs_gpa 2.0)."
