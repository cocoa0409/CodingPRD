              as: PlatformAdmin
              captures: { err: $.data.error_id }
          assert:
            - "status 422 and data.error_id == \"ERR_CREDIT_EXCEEDS_GROSS\""
            - "AffiliateInvoice.${inv_o_id}.status remains DISPUTED and credit_memo_cents == 0"

      - name: duplicate_constraint_errors
        claim_type: Violation → Error
        grounds:
          - validations[priority=10]
          - errors.ERR_SELECTION_EXISTS
          - errors.ERR_WAVE_MONTH_DUPLICATE
          - errors.ERR_POPULATION_YEAR_DUPLICATE
        distinguishing_aspect: "Three independent uniqueness constraints each return their own 409: (mailing_month, age_band) for selections, mailing_month for waves, (affiliate, effective_year) for population stats."
