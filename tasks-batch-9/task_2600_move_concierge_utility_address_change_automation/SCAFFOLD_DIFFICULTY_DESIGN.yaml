              as: MoveOpsAgent
              captures: { mv_id: $.data.id }
            - call: "POST /residents/${res_id}/consent-records"
              payload: { scope: "UTILITY_SETUP", source_channel: "PM_FEED", consent_text_version: "v3", expected_resident_version: "${res_v1}" }
