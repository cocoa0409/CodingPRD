            - "After reopen: the paint DeductionItem.status == DRAFT and statement_id is null (compensation)"
            - "After reopen: Dispute.${disp}.status == WITHDRAWN"
            - "After reopen: Tenancy.${ten}.total_deductions_cents == 0 and pending_deductions_cents == 60000"
            - "After second issue: DepositStatement.${stmt}.status == ISSUED, deduction_total_cents == 60000, refund_due_cents == 149337"

      - name: dispute_branching_paths_divergent_effects
        grounds:
          - state_machines.Dispute.MANAGER_COUNTERED_to_CLOSED_AGREED
          - state_machines.Dispute.OPEN_to_ESCALATED_SMALL_CLAIMS
          - calculations.small_claims_exposure
        distinguishing_aspect: |
          Dispute forks from the same OPEN state into two branches with
          divergent side effects: close_agreed releases 8,000c back onto the
          statement (refund_due 157,337c), while escalate releases nothing and
          instead computes exposure_cents == 20,000c (not late, so no
          bad-faith multiplier).
        test_recipe:
          setup:
            - "Two identical tenancies, each with paint damage 60,000c and an issued timely statement (refund_due 149,337c)"
            - "Each statement has an OPEN dispute of 20,000c"
            - "Dispute A: manager counters 12,000c, tenant accepts. Dispute B: tenant escalates directly"
          setup_api_calls:
            - { call: "POST /pm/_clock/set_current_utc", payload: { to_iso8601: "2025-01-10T00:00:00Z" }, as: ManagerAdmin }
            - call: "POST /pm/jurisdiction-profiles"
              payload: { code: "CA-ACT", deposit_return_deadline_days: 21, dispute_window_days: 30, interest_required: true, annual_interest_rate_bp: 300, interest_basis: "ACTUAL_DAYS", stale_check_days: 180, small_claims_cap_cents: 1000000, bad_faith_multiplier: 2, lock_change_allowed: true, allow_actual_cost_charge: false }
              as: ManagerAdmin
              captures: { jur: $.data.id }
            - call: "POST /pm/properties"
              payload: { name: "Maple Court", address: "1 Maple St", jurisdiction_profile_id: "${jur}", key_charge_cents: 5000, fob_charge_cents: 7500, lock_change_cents: 12000 }
              as: ManagerAdmin
              captures: { prop: $.data.id }
            - call: "POST /pm/units"
              payload: { property_id: "${prop}", unit_number: "1A", carpet_installed_on: "2022-08-01", carpet_life_years: 5, paint_applied_on: "2025-08-01", paint_life_years: 3 }
              as: ManagerAdmin
              captures: { unit_a: $.data.id }
            - call: "POST /pm/units"
              payload: { property_id: "${prop}", unit_number: "1B", carpet_installed_on: "2022-08-01", carpet_life_years: 5, paint_applied_on: "2025-08-01", paint_life_years: 3 }
              as: ManagerAdmin
              captures: { unit_b: $.data.id }
