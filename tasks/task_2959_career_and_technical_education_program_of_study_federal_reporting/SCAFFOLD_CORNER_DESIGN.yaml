      - name: negotiation_budget_drives_arbitration_and_then_refuses_further_offers
        claim_type: violation_to_error
        grounds:
          - validations[priority=30]
          - errors[ERR_NEGOTIATION_ROUNDS_EXHAUSTED]
          - state_machines.PerformanceIndicator.NEGOTIATING_to_NEGOTIATING
          - state_machines.PerformanceIndicator.NEGOTIATING_to_ARBITRATED
          - entities.PerformanceIndicator.fields.negotiation_round
        distinguishing_aspect: |
          MAX_NEGOTIATION_ROUNDS is 4, so the fifth alternating offer is not an error but a divergent branch: it discards
          the offered level, pins negotiated_level_pct to baseline_pct 85.00 and met_threshold_pct to 76.50, and moves the
          indicator to ARBITRATED. Only once the budget is spent does priority 30 bite, and it bites on BOTH negotiation
          calls — a further offer and an accept-level — which priority 30 owns rather than the generic state check at
          priority 9. Asserting the 422 rather than a 409 is what distinguishes a correctly routed exhausted-budget error
          from an ordinary invalid-transition rejection, and the unchanged version proves the refusals wrote nothing.
        test_recipe:
          setup:
            - "One DRAFT ProgramOfStudy with no students."
            - "One PerformanceIndicator 1S1_GRAD_RATE for reporting_year 2027 and cohort_year 2026 with baseline_pct 85.00, in status PROPOSED with negotiation_round 0."
            - "The logical clock stays at 2026-08-01T00:00:00Z."
          setup_api_calls:
            - call: "POST /cte/programs-of-study"
              payload: { cip_code: "43.0107", title: "Criminal Justice", cluster: "LAW_PUBLIC_SAFETY", labor_market_data_asof: "2026-03-01" }
              as: CteDirector
              as_user_id: "u_dir_1"
              captures: { pos_id: $.data.id }
            - call: "POST /cte/programs-of-study/${pos_id}/performance-indicators"
              payload: { indicator_code: "1S1_GRAD_RATE", reporting_year: 2027, baseline_pct: 85.00, cohort_year: 2026 }
              as: StateComplianceReviewer
              as_user_id: "u_rev_1"
              captures: { pi_id: $.data.id }
          trigger:
            - call: "POST /cte/performance-indicators/${pi_id}/negotiation-offers"
              payload: { offered_level_pct: 95.00, rationale: "Round 1." }
              as: StateComplianceReviewer
              as_user_id: "u_rev_1"
              captures: { n1_st: $.data.status, n1_rd: $.data.negotiation_round, n1_lvl: $.data.negotiated_level_pct, n1_mt: $.data.met_threshold_pct, n1_last: $.data.last_offer_pct, n1_v: $.data.version }
            - call: "POST /cte/performance-indicators/${pi_id}/negotiation-offers"
              payload: { offered_level_pct: 86.00, rationale: "Round 2." }
              as: CteDirector
              as_user_id: "u_dir_1"
              captures: { n2_st: $.data.status, n2_rd: $.data.negotiation_round, n2_lvl: $.data.negotiated_level_pct, n2_mt: $.data.met_threshold_pct, n2_last: $.data.last_offer_pct, n2_v: $.data.version }
            - call: "POST /cte/performance-indicators/${pi_id}/negotiation-offers"
              payload: { offered_level_pct: 94.00, rationale: "Round 3." }
              as: StateComplianceReviewer
              as_user_id: "u_rev_1"
              captures: { n3_st: $.data.status, n3_rd: $.data.negotiation_round, n3_lvl: $.data.negotiated_level_pct, n3_mt: $.data.met_threshold_pct, n3_last: $.data.last_offer_pct, n3_v: $.data.version }
            - call: "POST /cte/performance-indicators/${pi_id}/negotiation-offers"
              payload: { offered_level_pct: 87.00, rationale: "Round 4." }
              as: CteDirector
              as_user_id: "u_dir_1"
              captures: { n4_st: $.data.status, n4_rd: $.data.negotiation_round, n4_lvl: $.data.negotiated_level_pct, n4_mt: $.data.met_threshold_pct, n4_last: $.data.last_offer_pct, n4_v: $.data.version }
            - call: "POST /cte/performance-indicators/${pi_id}/negotiation-offers"
              payload: { offered_level_pct: 93.00, rationale: "Round 5." }
              as: StateComplianceReviewer
              as_user_id: "u_rev_1"
              captures: { n5_st: $.data.status, n5_rd: $.data.negotiation_round, n5_lvl: $.data.negotiated_level_pct, n5_mt: $.data.met_threshold_pct, n5_last: $.data.last_offer_pct, n5_v: $.data.version }
            - call: "POST /cte/performance-indicators/${pi_id}/negotiation-offers"
              payload: { offered_level_pct: 88.00, rationale: "One offer too many." }
              as: CteDirector
              as_user_id: "u_dir_1"
            - call: "POST /cte/performance-indicators/${pi_id}/accept-level"
              payload: { acceptance_note: "Too late to accept." }
              as: CteDirector
              as_user_id: "u_dir_1"
            - call: "GET /cte/performance-indicators/${pi_id}"
              payload: {}
              as: StateComplianceReviewer
