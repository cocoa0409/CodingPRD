              payload: { commodity_id: "${cm_peach}", cases_requested: 10 }
              as: AgencyCoordinator
              as_user_id: "${ag1}"
              captures: { ln1: $.data.id }
            - call: "POST /efap/commodity-orders/${ord1}/lines"
              payload: { commodity_id: "${cm_peach}", cases_requested: 15 }
              as: AgencyCoordinator
              as_user_id: "${ag1}"
