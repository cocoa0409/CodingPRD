      - name: discharge_event_links_a_lot_to_a_permit_allotment
        claim_type: cross_reference_link
        grounds:
          - endpoints[POST /recycling/lots/{lot_id}/discharge-events]
          - endpoints[GET /recycling/discharge-events]
          - errors[ERR_PERMIT_NOT_FOUND]
          - invariants.permit_allowance_invariant
        distinguishing_aspect: "The discharge event is the one row that names two unrelated parents - a lot in the path and an allotment in the body - so both must resolve before the link is made: an unknown allotment_id yields ERR_PERMIT_NOT_FOUND with no row created, and the successful booking is then discoverable from either side of the link while raising the allotment's consumed_kg."
        test_recipe:
          setup:
            - "Clock 2026-08-20T00:00:00.000Z; one campus; one ACTIVE WATER allotment valid 2026-08-01..2026-08-31 with daily_cap_kg 500.0 and consumed_kg 0.0; one NICKEL_RICH HYDROMET line with a RUNNING campaign holding one OPEN lot."
          setup_api_calls:
            - call: "POST /recycling/_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-20T00:00:00.000Z" }
              as: PlatformAdmin
            - call: "POST /recycling/facilities"
              payload: { name: "Reno Campus", state_code: "NV", mech_capacity_kg_per_day: 3000.0, hydro_capacity_kg_per_day: 2000.0 }
              as: PlatformAdmin
              captures: { fac_id: "$.data.id" }
            - call: "POST /recycling/permit-allotments"
              payload: { facility_id: "${fac_id}", medium: "WATER", permit_no: "NV-W-001", valid_from: "2026-08-01T00:00:00.000Z", valid_to: "2026-08-31T23:59:59.999Z", daily_cap_kg: 500.0 }
              as: ComplianceOfficer
              captures: { al_id: "$.data.id", al_v: "$.data.version" }
            - call: "POST /recycling/processing-lines"
              payload: { facility_id: "${fac_id}", line_code: "HYD-1", line_type: "HYDROMET", chemistry_family: "NICKEL_RICH", throughput_kg_per_hour: 100.0 }
              as: PlatformAdmin
              captures: { line_id: "$.data.id" }
            - call: "POST /recycling/campaigns"
              payload: { line_id: "${line_id}", chemistry_family: "NICKEL_RICH", window_start: "2026-08-20T00:00:00.000Z", window_end: "2026-08-21T00:00:00.000Z", planned_input_kg: 1000.0 }
              as: PlantOperator
              captures: { camp_id: "$.data.id" }
            - call: "POST /recycling/campaigns/${camp_id}/start"
              payload: {}
              as: PlantOperator
            - call: "POST /recycling/campaigns/${camp_id}/lots"
              payload: { lot_code: "LOT-1" }
              as: PlantOperator
              captures: { lot_id: "$.data.id" }
          trigger:
            - call: "POST /recycling/lots/${lot_id}/discharge-events"
              payload: { allotment_id: "77777777-7777-4777-8777-777777777777", event_date: "2026-08-20T06:00:00.000Z", mass_kg: 10.0, analyte: "NICKEL_DISSOLVED" }
              as: ComplianceOfficer
            - call: "POST /recycling/lots/${lot_id}/discharge-events"
              payload: { allotment_id: "${al_id}", event_date: "2026-08-20T06:00:00.000Z", mass_kg: 10.0, analyte: "NICKEL_DISSOLVED" }
              as: ComplianceOfficer
              captures: { ev_id: "$.data.id", ev_status: "$.data.status", ev_lot: "$.data.lot_id", ev_al: "$.data.allotment_id", ev_v: "$.data.version" }
            - call: "GET /recycling/discharge-events"
              payload: { allotment_id: "${al_id}" }
              as: ComplianceOfficer
              captures: { by_al_id: "$.data[0].id" }
            - call: "GET /recycling/discharge-events"
              payload: { lot_id: "${lot_id}" }
              as: PlantOperator
              captures: { by_lot_id: "$.data[0].id" }
            - call: "GET /recycling/discharge-events/${ev_id}"
              payload: {}
              as: AssayTechnician
              captures: { read_mass: "$.data.mass_kg", read_analyte: "$.data.analyte" }
          assert:
            - "${al_v} == 1 with consumed_kg 0.0 before the triggers"
            - "The unknown allotment_id returns HTTP 404 with data.error_id == ERR_PERMIT_NOT_FOUND and GET /recycling/discharge-events?lot_id=${lot_id} still reports total_count == 0"
            - "The valid booking returns HTTP 201 with ${ev_status} == POSTED, ${ev_lot} == ${lot_id}, ${ev_al} == ${al_id} and ${ev_v} == 1"
            - "PermitAllotment.${al_id}.consumed_kg == 10.0 with version == 2, satisfying permit_allowance_invariant"
            - "Both list filters find the same row: ${by_al_id} == ${ev_id} and ${by_lot_id} == ${ev_id}, each with total_count == 1"
            - "The single read returns ${read_mass} == 10.0 and ${read_analyte} == NICKEL_DISSOLVED"

      - name: provisional_settlement_read_exposes_the_per_metal_line_breakdown
        claim_type: computed_read
        grounds:
          - endpoints[GET /recycling/settlements]
          - calculations.feedstock_payable_value
          - calculations.settlement_net_payable
          - entities.SupplierSettlement.line_breakdown
        distinguishing_aspect: "The settlement is never returned by the call that creates it - release responds with the Intake - so the only way to see it is the list read, and that read must expose a four-line breakdown in the fixed order [NI, CO, LI, CU] with each line already rounded to whole cents; 12768 + 15960 + 7040 + 1620 == 37388 is the sum of rounded lines, not a rounding of the sum."
