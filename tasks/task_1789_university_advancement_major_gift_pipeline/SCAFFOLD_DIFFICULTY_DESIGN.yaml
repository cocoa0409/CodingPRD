            - call: "POST /advancement/prospects"
              payload: { full_name: "P Two", prospect_type: "INDIVIDUAL", contact_email: "p2@x.com" }
              as: ProspectResearcher
              as_user_id: "res-1"
              captures: { p2_id: $.data.id }
            - call: "POST /advancement/prospects"
              payload: { full_name: "P Three", prospect_type: "INDIVIDUAL", contact_email: "p3@x.com" }
              as: ProspectResearcher
              as_user_id: "res-1"
              captures: { p3_id: $.data.id }
            - call: "POST /advancement/fundraisers/${f_id}/assignments"
              payload: { prospect_id: "${p1_id}", expected_fundraiser_version: "${f_ver}" }
              as: AdvancementDirector
              as_user_id: "dir-1"
            - call: "GET /advancement/fundraisers/${f_id}"
              payload: {}
              as: AdvancementDirector
              as_user_id: "dir-1"
              captures: { f_ver2: $.data.version, cnt2: $.data.current_prospect_count }
            - call: "POST /advancement/fundraisers/${f_id}/assignments"
              payload: { prospect_id: "${p2_id}", expected_fundraiser_version: "${f_ver2}" }
              as: AdvancementDirector
              as_user_id: "dir-1"
            - call: "GET /advancement/fundraisers/${f_id}"
              payload: {}
              as: AdvancementDirector
              as_user_id: "dir-1"
              captures: { f_ver3: $.data.version, cnt3: $.data.current_prospect_count }
          trigger:
            - call: "POST /advancement/fundraisers/${f_id}/assignments"
              payload: { prospect_id: "${p3_id}", expected_fundraiser_version: "${f_ver3}" }
              as: AdvancementDirector
              as_user_id: "dir-1"
              captures: { err: $.data.error_id }
          assert:
            - "cnt2 == 1  # first assignment allowed: 1 >= 2 is false at creation time of #2"
            - "cnt3 == 2  # second assignment allowed, count reaches exactly the max"
            - "err == \"ERR_PORTFOLIO_CAPACITY_EXCEEDED\"  # third rejected: 2 >= 2 boundary is inclusive"
            - "Fundraiser.${f_id}.current_prospect_count == 2 after the rejection"

      - name: fund_activation_boundary_at_exact_minimum
        grounds:
          - state_machines.RestrictedFund.PENDING_MINIMUM_to_ACTIVE
