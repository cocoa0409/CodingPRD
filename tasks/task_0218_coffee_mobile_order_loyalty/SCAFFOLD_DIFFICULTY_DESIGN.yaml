          assert:
            - "First place: Order.${ord1}.fulfillment_status == PLACED"
            - "Second place: response status == 409 and data.error_id == ERR_SLOT_FULL"

      - name: redeem_star_cost_exact_boundary
        grounds:
          - calculations.member_star_balance
          - validations[priority=10]
          - entities.Member.fields.star_balance
