              payload: { step: "DRAWING" }
              as: ProcessEngineer
          trigger:
            - call: "GET /production-lots"
              payload: {}
              as: ProcessEngineer
              captures: { first_code: "$.data[0].lot_code", third_code: "$.data[2].lot_code" }
            - call: "GET /production-lots"
              payload: { line_code: "EXT-1" }
              as: QualityEngineer
            - call: "GET /production-lots"
              payload: { process_state: "QUEUED" }
              as: ShippingClerk
            - call: "GET /production-lots"
              payload: { line_code: "EXT-1", process_state: "DRAWN" }
              as: CertificationOfficer
            - call: "GET /production-lots"
              payload: { order_id: "${ord_id}" }
              as: ProcessEngineer
            - call: "GET /production-lots"
              payload: { rod_lot_id: "${rod_id}", limit: 1, offset: 1 }
              as: ProcessEngineer
              captures: { paged_code: "$.data[0].lot_code" }
            - call: "GET /production-lots"
              payload: { quality_state: "NONCONFORMING" }
              as: QualityEngineer
          assert:
            - "unfiltered: response_type == \"array\", 3 rows in created_at ASC order so ${first_code} == \"LOT-1\" and ${third_code} == \"LOT-3\", total_count == 3, limit == 10 (the default), offset == 0, has_more == false"
            - "line_code EXT-1: 2 rows [\"LOT-1\", \"LOT-3\"], total_count == 2 - LOT-2 on EXT-2 is excluded"
            - "process_state QUEUED: 1 row \"LOT-2\", total_count == 1; the two DRAWN lots are excluded even though the request came from a different role"
            - "line_code EXT-1 + process_state DRAWN: 2 rows [\"LOT-1\", \"LOT-3\"], total_count == 2 - the filters intersect, they do not union"
            - "order_id: 2 rows [\"LOT-1\", \"LOT-3\"], total_count == 2; LOT-2 has a null order_id and is excluded"
            - "rod_lot_id with limit 1 offset 1: exactly 1 row and ${paged_code} == \"LOT-2\", while total_count == 3 and has_more == true - the count describes the filtered set, not the page"
