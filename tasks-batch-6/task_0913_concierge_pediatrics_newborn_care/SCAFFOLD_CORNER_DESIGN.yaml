      - name: corner_family_version_increments_on_every_membership_write
        claim_type: optimistic_concurrency
        grounds:
          - entities.Family
          - endpoints.POST_/peds/memberships
          - endpoints.POST_/peds/memberships/{membership_id}/cancel
        distinguishing_aspect: "Family.version starts at 1, becomes 2 after an enrollment and 3 after a cancellation, and is untouched by writes that do not reshape the ladder, such as issuing or paying the invoice."
        test_recipe:
          setup:
            - "Logical clock at 2026-06-01T00:00:00Z"
