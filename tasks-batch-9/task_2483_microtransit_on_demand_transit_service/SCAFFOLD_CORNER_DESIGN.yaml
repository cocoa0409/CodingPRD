  - section: cross-cutting complexity layers
    instances:
      - name: stale_expected_vehicle_block_version_blocks_the_second_offer
        claim_type: optimistic_concurrency
        grounds:
          - concurrency_rules.offer-create-stale-block
          - errors.ERR_STALE_VEHICLE_BLOCK_VERSION
        distinguishing_aspect: "The version observed at open is invalidated by the first offer's capacity recompute, so replaying it on a second offer is 412 ERR_STALE_VEHICLE_BLOCK_VERSION; re-reading the block and retrying with the fresh token succeeds. The stale attempt must also leave seats_committed untouched — a 412 that has already consumed capacity is the failure mode."
        test_recipe:
          setup:
            - "Zone RBM ACTIVE; stops S0/S4 approved; block B1 OPEN on V1/D1 (version captured at open); riders R1 and R2 with trips T1 and T2 in RECEIVED."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-03T06:00:00Z" }
              as: ZoneAdmin
            - call: "POST /service-zones"
              payload: { name: "Riverbend Microtransit", zone_code: "RBM", max_walk_meters: 600, detour_tolerance_pct: 0.25, detour_tolerance_floor_minutes: 6, base_fare_cents: 250, fare_cap_cents_daily: 600, fare_cap_cents_weekly: 2500, on_time_window_minutes: 10, curb_capacity_per_bucket: 2 }
              as: ZoneAdmin
              captures: { z_id: $.data.id }
            - call: "POST /service-zones/${z_id}/activate"
              payload: {}
              as: ZoneAdmin
            - call: "POST /virtual-stops"
              payload: { zone_id: "${z_id}", stop_code: "S0", corridor_index: 0, walk_shed_meters: 400, accessibility: "ACCESSIBLE_PATH" }
              as: ZoneAdmin
              captures: { s0_id: $.data.id }
            - call: "POST /virtual-stops/${s0_id}/approve"
              payload: {}
              as: ZoneAdmin
            - call: "POST /virtual-stops"
              payload: { zone_id: "${z_id}", stop_code: "S4", corridor_index: 4, walk_shed_meters: 400, accessibility: "ACCESSIBLE_PATH" }
              as: ZoneAdmin
              captures: { s4_id: $.data.id }
            - call: "POST /virtual-stops/${s4_id}/approve"
              payload: {}
              as: ZoneAdmin
            - call: "POST /vehicles"
              payload: { zone_id: "${z_id}", vehicle_code: "V1", seat_capacity: 6, wav_positions: 2 }
              as: ZoneAdmin
              captures: { v1_id: $.data.id }
            - call: "POST /drivers"
              payload: { zone_id: "${z_id}", driver_code: "D1", wav_certified: true }
              as: ZoneAdmin
              captures: { d1_id: $.data.id }
            - call: "POST /riders"
              payload: { zone_id: "${z_id}", rider_code: "R1", fare_category: "FULL", mobility_device: "NONE" }
              as: ZoneAdmin
              captures: { r1_id: $.data.id }
            - call: "POST /riders"
              payload: { zone_id: "${z_id}", rider_code: "R2", fare_category: "FULL", mobility_device: "NONE" }
              as: ZoneAdmin
              captures: { r2_id: $.data.id }
            - call: "POST /vehicle-blocks"
              payload: { zone_id: "${z_id}", vehicle_id: "${v1_id}", driver_id: "${d1_id}", block_type: "BASE", start_utc: "2026-08-03T06:00:00Z", end_utc: "2026-08-03T10:00:00Z" }
              as: Dispatcher
              captures: { b1_id: $.data.id, b1_v_create: $.data.version }
            - call: "POST /vehicle-blocks/${b1_id}/open"
              payload: {}
              as: Dispatcher
              captures: { b1_v_open: $.data.version }
            - call: "POST /trip-requests"
              payload: { zone_id: "${z_id}", rider_id: "${r1_id}", origin_stop_id: "${s0_id}", destination_stop_id: "${s4_id}", requested_pickup_utc: "2026-08-03T07:00:00Z", party_size: 1 }
              as: Rider
              as_user_id: "${r1_id}"
              captures: { t1_id: $.data.id }
            - call: "POST /trip-requests"
              payload: { zone_id: "${z_id}", rider_id: "${r2_id}", origin_stop_id: "${s0_id}", destination_stop_id: "${s4_id}", requested_pickup_utc: "2026-08-03T07:10:00Z", party_size: 1 }
              as: Rider
              as_user_id: "${r2_id}"
              captures: { t2_id: $.data.id }
          trigger:
            - call: "POST /pool-assignments"
              payload: { trip_request_id: "${t1_id}", block_id: "${b1_id}", expected_vehicle_block_version: "${b1_v_open}" }
              as: Dispatcher
              captures: { pa1_id: $.data.id }
            - call: "POST /pool-assignments"
              payload: { trip_request_id: "${t2_id}", block_id: "${b1_id}", expected_vehicle_block_version: "${b1_v_open}" }
              as: Dispatcher
            - call: "GET /vehicle-blocks/${b1_id}"
              payload: {}
              as: Dispatcher
              captures: { b1_v_fresh: $.data.version }
            - call: "POST /pool-assignments"
