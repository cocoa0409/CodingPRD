      - name: fork_join_category_audit_cleared_branch_locks_out_the_sustained_branch
        grounds:
          - state_machines.MerchantCategoryAudit.SCHEDULED_to_FIELDWORK
          - state_machines.MerchantCategoryAudit.FIELDWORK_to_FINDINGS_CLEARED
          - state_machines.MerchantCategoryAudit.FINDINGS_CLEARED_to_CLOSED
          - state_machines.Merchant.UNDER_REVIEW_to_PENDING_VERIFICATION
          - entities.Merchant.fields.mcc_status_before_review
          - errors[ERR_INVALID_STATE]
        distinguishing_aspect: |
          FORK-JOIN shape: FIELDWORK forks into two DISJOINT branches and both re-join at CLOSED.
          Taking the clear-findings branch permanently locks out sustain-findings (second call is
          ERR_INVALID_STATE), and the join restores Merchant.mcc_status verbatim to the
          PENDING_VERIFICATION snapshot rather than to VERIFIED.
        test_recipe:
          setup:
            - "Clock at 2026-09-03T00:00:00Z; one platform, one US/USD acquirer."
            - "MCC 4900 defined with requires_documentation true, so the utility merchant is boarded in mcc_status PENDING_VERIFICATION."
