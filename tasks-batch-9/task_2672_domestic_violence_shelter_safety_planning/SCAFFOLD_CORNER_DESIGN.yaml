              as: HotlineAdvocate
              as_user_id: "${adv_id}"
              captures: { client_a: "$.data.id" }
            - call: "POST /hotline-calls"
              payload: { client_id: "${client_a}", caller_type: "SURVIVOR", presenting_concerns: "Needs a bed." }
