          assert:
            - "${index_before} == 100.00"
            - "AssessmentRun.${run_sr_id}.status == VOID"
            - "ProductComponent.${comp_id}.evidence_units_total == 0"
            - "ProductComponent.${comp_id}.coverage_pct == 0.00"
