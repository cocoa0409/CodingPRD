          spread_at_open 3.00) blocks five different operations with five
          different codes: closing review and requesting a revision are
          ERR_OPEN_DISCREPANCY, naming a reviewer of the abstract as arbiter is
          ERR_ARBITER_CONFLICT, naming a second arbiter is ERR_CASE_STATE_INVALID,
