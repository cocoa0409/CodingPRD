    side_effects: []
  - method: GET
    path: "/franchisees/{id}/training-enrollments"
    description: "List training enrollments of a franchisee"
    roles: [FranchisorOps, Franchisee]
    code: 200
    input: []
    output: TrainingEnrollment[]
    side_effects: []
  - method: GET
    path: "/franchisees/{id}/transfer-requests"
    description: "List transfer requests involving a franchisee (buyer or seller)"
    roles: [FranchisorOps, Franchisee]
    code: 200
    input: []
    output: TransferRequest[]
    side_effects: []
  - method: GET
    path: "/franchisees/{id}/site-applications"
    description: "List site applications filed for a franchisee as applicant"
    roles: [FranchisorOps, Franchisee, DevelopmentAgent]
    code: 200
    input: []
    output: SiteApplication[]
    side_effects: []
  - method: GET
    path: "/franchisees/{id}/promotion-votes"
    description: "List promotion votes cast by a franchisee"
    roles: [FranchisorOps, Franchisee]
    code: 200
    input: []
    output: PromotionVote[]
    side_effects: []

  # --- Store ---
  - method: POST
    path: "/stores"
    description: "Register a pre-existing operating store (OPEN)"
    roles: [FranchisorOps]
