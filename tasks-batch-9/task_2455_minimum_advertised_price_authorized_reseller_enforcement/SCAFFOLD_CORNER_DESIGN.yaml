            - *TP2NEW
            - *TP2CAP
            - *TP2CONF
            - *GETDISTV2
            - *CB6U
            - *CBDISPUTE
          trigger:
            - call: "GET /distributor-chargebacks"
              payload: { distributor_id: "${dist}", status: "DISPUTED", limit: 10, offset: 0 }
              as: BrandChannelManager
          assert:
            - "HTTP 200"
            - "exactly 1 row is returned and its id == ${cb}"
            - "GET /distributor-chargebacks?distributor_id=${dist} returns 2 rows"
            - "GET /distributor-chargebacks?test_purchase_id=${tp2} returns exactly 1 row whose id == ${cb2}"
            - "Distributor.${dist}.chargeback_balance_cents == 34000"

      # --- sweeps and the logical clock -------------------------------------
      - name: enforcement_sweep_reports_every_bucket_it_touched
        claim_type: bulk_action
        grounds: ["endpoints.POST /enforcement-sweeps"]
        distinguishing_aspect: "One empty-bodied sweep processes four independent buckets and reports each count separately: with a lapsed agreement and a lapsed exception in scope it returns 1 expired agreement, 1 expired exception, 0 escalations and 0 reinstatements."
        test_recipe:
          setup: ["An ACTIVE agreement whose term_ends_at has passed and an APPROVED exception whose ends_at has passed, with the clock advanced past both."]
          setup_api_calls:
            - *CLK0801
            - *POLNEW
            - *POLSUB
            - *POLDEC
            - *POLPUB
            - *PRODA1
            - *RESACME
            - *AGRNEW
            - *AGRSEND
            - *AGRSIGN
            - *AGRACT
            - *EXC13000
            - *EXCAPPROVE
            - *CLK0825
          trigger:
            - call: "POST /enforcement-sweeps"
              payload: {}
              as: PlatformAdmin
              as_user_id: "admin-1"
              captures: { at: $.data.swept_at, ea: $.data.expired_agreements, ee: $.data.expired_exceptions, ev: $.data.escalated_violations, rr: $.data.reinstated_resellers }
          assert:
            - "HTTP 200"
            - "${at} == '2026-08-25T00:00:00Z'"
            - "${ee} == 1"
            - "${ev} == 0"
            - "${rr} == 0"
            - "PricingException.${exc}.status == EXPIRED"
            - "Product.${prod}.open_exception_count == 0"

      - name: sweep_is_a_no_op_when_nothing_is_due
        claim_type: bulk_action
        grounds: ["endpoints.POST /enforcement-sweeps"]
        distinguishing_aspect: "Partial-scope semantics: with a live agreement, a live exception and a violation still inside its cure window, the sweep returns four zeros and mutates nothing."
        test_recipe:
          setup: ["Violation V1 NOTICED at clock 2026-08-20 with cure_deadline_at 2026-08-30; an ACTIVE agreement running to 2027-06-30 and an APPROVED exception running to 2026-08-25."]
          setup_api_calls:
            - *CLK0801
            - *POLNEW
            - *POLSUB
            - *POLDEC
            - *POLPUB
            - *PRODA1
            - *RESACME
            - *AGRNEW
            - *AGRSEND
            - *AGRSIGN
            - *AGRACT
            - *EXC13000
            - *EXCAPPROVE
            - *CLK0820
            - *OBS14000
            - *OBSEVAL
            - *GETRESV
            - *NOTICE1
          trigger:
            - call: "POST /enforcement-sweeps"
              payload: {}
              as: BrandChannelManager
              as_user_id: "bcm-1"
              captures: { ea: $.data.expired_agreements, ee: $.data.expired_exceptions, ev: $.data.escalated_violations, rr: $.data.reinstated_resellers }
          assert:
            - "HTTP 200"
            - "${ea} == 0"
            - "${ee} == 0"
            - "${ev} == 0"
            - "${rr} == 0"
            - "Violation.${vio}.status == NOTICED"
            - "PricingException.${exc}.status == APPROVED"
            - "ResellerAgreement.${agr}.status == ACTIVE"

      - name: clock_endpoint_reports_both_sides_of_the_jump
        claim_type: action_endpoint
        grounds: ["endpoints.POST /_clock/set_current_utc"]
        distinguishing_aspect: "The clock control returns previous_utc alongside current_utc, so a test can assert the exact interval it skipped; it is restricted to PlatformAdmin alone."
        test_recipe:
          setup: ["The logical clock has been set to 2026-08-01."]
          setup_api_calls:
            - *CLK0801
          trigger:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-20T00:00:00Z" }
              as: PlatformAdmin
              as_user_id: "admin-1"
              captures: { cur: $.data.current_utc, prev: $.data.previous_utc }
          assert:
            - "HTTP 200"
            - "${cur} == '2026-08-20T00:00:00Z'"
            - "${prev} == '2026-08-01T00:00:00Z'"

  # ===========================================================================
  # SECTION 6 — errors  (§1.4 error_id catalog; the frozen scaffold declares no
  # standalone §1.6 block, so every error id is grounded in the validation row
  # that raises it.  Codes already triggered by the `validations` section above
  # are not repeated here; this section closes the remaining gaps — the twelve
  # priority-4 path-existence codes, each on a different endpoint — plus two
  # cross-checks of shared codes on endpoint families the validations section
  # did not touch.
  # ===========================================================================
  - section: errors
    instances:

      - name: error_policy_not_found_on_submit_review_returns_not_found
        claim_type: violation_to_error
        grounds: ["validations[priority=4].error_id.ERR_POLICY_NOT_FOUND"]
        distinguishing_aspect: "An unknown {policy_id} in the path of a policy action yields ERR_POLICY_NOT_FOUND at 404 even though the caller holds the correct role and sends an empty, schema-valid body."
        test_recipe:
          setup: ["Clock at 2026-08-01; no PricingPolicy rows exist."]
          setup_api_calls:
            - *CLK0801
          trigger:
            - call: "POST /pricing-policies/pol-does-not-exist/submit-review"
              payload: {}
              as: BrandChannelManager
              captures: { err: $.data.error_id }
          assert:
            - "HTTP 404"
            - "${err} == 'ERR_POLICY_NOT_FOUND'"
            - "no PricingPolicy row is created"

      - name: error_product_not_found_on_patch_returns_not_found
        claim_type: violation_to_error
        grounds: ["validations[priority=4].error_id.ERR_PRODUCT_NOT_FOUND"]
        distinguishing_aspect: "PATCH on an unknown {product_id} fails at priority 4 before any field-level range check on standard_map_floor_cents can run."
        test_recipe:
          setup: ["Policy MAP-2026-A PUBLISHED; no products exist."]
          setup_api_calls:
            - *CLK0801
            - *POLNEW
            - *POLSUB
            - *POLDEC
            - *POLPUB
          trigger:
            - call: "PATCH /products/prod-does-not-exist"
              payload: { standard_map_floor_cents: 14000 }
              as: BrandChannelManager
              captures: { err: $.data.error_id }
          assert:
            - "HTTP 404"
            - "${err} == 'ERR_PRODUCT_NOT_FOUND'"

      - name: error_reseller_not_found_on_supply_status_returns_not_found
        claim_type: violation_to_error
        grounds: ["validations[priority=4].error_id.ERR_RESELLER_NOT_FOUND"]
        distinguishing_aspect: "The supply-status endpoint resolves the path reseller before touching the supply axis, so an unknown id returns ERR_RESELLER_NOT_FOUND rather than a state error."
        test_recipe:
          setup: ["Clock at 2026-08-01; no Reseller rows exist."]
          setup_api_calls:
            - *CLK0801
          trigger:
            - call: "POST /resellers/res-does-not-exist/supply-status"
              payload: { supply_status: "OPEN" }
              as: BrandChannelManager
              captures: { err: $.data.error_id }
          assert:
            - "HTTP 404"
            - "${err} == 'ERR_RESELLER_NOT_FOUND'"

      - name: error_distributor_not_found_on_exposure_read_returns_not_found
        claim_type: violation_to_error
        grounds: ["validations[priority=4].error_id.ERR_DISTRIBUTOR_NOT_FOUND"]
        distinguishing_aspect: "Even a pure computed read enforces path existence: an unknown {distributor_id} returns ERR_DISTRIBUTOR_NOT_FOUND instead of a zero-valued exposure envelope."
        test_recipe:
          setup: ["Clock at 2026-08-01; no Distributor rows exist."]
          setup_api_calls:
            - *CLK0801
          trigger:
            - call: "GET /distributors/dist-does-not-exist/diversion-exposure"
              payload: { variant: "TRACE_ATTRIBUTED" }
              as: BrandChannelManager
              captures: { err: $.data.error_id }
          assert:
            - "HTTP 404"
            - "${err} == 'ERR_DISTRIBUTOR_NOT_FOUND'"

      - name: error_agreement_not_found_on_send_returns_not_found
        claim_type: violation_to_error
        grounds: ["validations[priority=4].error_id.ERR_AGREEMENT_NOT_FOUND"]
        distinguishing_aspect: "The send action resolves {agreement_id} first, so an unknown id gives ERR_AGREEMENT_NOT_FOUND and no Reseller is moved to PENDING_AGREEMENT."
        test_recipe:
          setup: ["Reseller Acme exists in APPLIED / HOLD but holds no agreement."]
          setup_api_calls:
            - *CLK0801
            - *POLNEW
            - *POLSUB
            - *POLDEC
            - *POLPUB
            - *RESACME
          trigger:
            - call: "POST /reseller-agreements/agr-does-not-exist/send"
              payload: {}
              as: BrandChannelManager
              captures: { err: $.data.error_id }
          assert:
            - "HTTP 404"
            - "${err} == 'ERR_AGREEMENT_NOT_FOUND'"
            - "Reseller.${res}.authorization_status == APPLIED"

      - name: error_observation_not_found_on_evaluate_returns_not_found
        claim_type: violation_to_error
        grounds: ["validations[priority=4].error_id.ERR_OBSERVATION_NOT_FOUND"]
        distinguishing_aspect: "ERR_OBSERVATION_NOT_FOUND (unknown row) is distinct from ERR_ALREADY_EVALUATED (known row in the wrong state) on the same evaluate endpoint."
        test_recipe:
          setup: ["Policy MAP-2026-A PUBLISHED and product SKU-AUDIO-1 exist; no observations have been captured."]
          setup_api_calls:
            - *CLK0801
            - *POLNEW
            - *POLSUB
            - *POLDEC
            - *POLPUB
            - *PRODA1
          trigger:
            - call: "POST /price-observations/obs-does-not-exist/evaluate"
              payload: {}
              as: MonitoringAnalyst
              as_user_id: "analyst-1"
              captures: { err: $.data.error_id }
          assert:
            - "HTTP 404"
            - "${err} == 'ERR_OBSERVATION_NOT_FOUND'"
            - "no Violation row is created"

      - name: error_violation_not_found_on_dispute_returns_not_found
        claim_type: violation_to_error
        grounds: ["validations[priority=4].error_id.ERR_VIOLATION_NOT_FOUND"]
        distinguishing_aspect: "Path existence precedes the priority-6 ownership check, so a reseller disputing an unknown violation id gets 404 rather than the 403 it would get for someone else's violation."
        test_recipe:
          setup: ["Reseller Acme is AUTHORIZED; no Violation rows exist."]
          setup_api_calls:
            - *CLK0801
            - *POLNEW
            - *POLSUB
            - *POLDEC
            - *POLPUB
            - *RESACME
            - *AGRNEW
            - *AGRSEND
            - *AGRSIGN
            - *AGRACT
          trigger:
            - call: "POST /violations/vio-does-not-exist/dispute"
              payload: { dispute_reason: "Not our listing" }
              as: Reseller
              as_user_id: "${res}"
              captures: { err: $.data.error_id }
          assert:
            - "HTTP 404"
            - "${err} == 'ERR_VIOLATION_NOT_FOUND'"

      - name: error_notice_not_found_on_acknowledge_returns_not_found
        claim_type: violation_to_error
        grounds: ["validations[priority=4].error_id.ERR_NOTICE_NOT_FOUND"]
        distinguishing_aspect: "Acknowledging an unknown notice id returns ERR_NOTICE_NOT_FOUND with no acknowledged_at stamp written anywhere."
        test_recipe:
          setup: ["Reseller Acme is AUTHORIZED and holds no notices."]
          setup_api_calls:
            - *CLK0801
            - *POLNEW
            - *POLSUB
            - *POLDEC
            - *POLPUB
            - *RESACME
            - *AGRNEW
            - *AGRSEND
            - *AGRSIGN
            - *AGRACT
          trigger:
            - call: "POST /enforcement-notices/not-does-not-exist/acknowledge"
              payload: {}
              as: Reseller
              as_user_id: "${res}"
              captures: { err: $.data.error_id }
          assert:
            - "HTTP 404"
            - "${err} == 'ERR_NOTICE_NOT_FOUND'"

      - name: error_exception_not_found_on_decision_returns_not_found
        claim_type: violation_to_error
        grounds: ["validations[priority=4].error_id.ERR_EXCEPTION_NOT_FOUND"]
        distinguishing_aspect: "The decision endpoint resolves {exception_id} before computing any override floor, so an unknown id cannot reach the priority-12 range check."
        test_recipe:
          setup: ["Product SKU-AUDIO-1 exists with open_exception_count 0 and no exception rows."]
          setup_api_calls:
            - *CLK0801
            - *POLNEW
            - *POLSUB
            - *POLDEC
            - *POLPUB
            - *PRODA1
          trigger:
            - call: "POST /pricing-exceptions/exc-does-not-exist/decision"
              payload: { decision: "APPROVE", decision_reason: "Campaign approved" }
              as: BrandLegalCounsel
              as_user_id: "counsel-1"
              captures: { err: $.data.error_id }
          assert:
            - "HTTP 404"
            - "${err} == 'ERR_EXCEPTION_NOT_FOUND'"
            - "Product.${prod}.open_exception_count == 0"

      - name: error_serial_unit_not_found_on_ship_downstream_returns_not_found
        claim_type: violation_to_error
        grounds: ["validations[priority=4].error_id.ERR_SERIAL_UNIT_NOT_FOUND"]
        distinguishing_aspect: "ERR_SERIAL_UNIT_NOT_FOUND is raised for an unknown opaque {serial_unit_id} in the path, which is a different failure from ERR_SERIAL_NOT_REGISTERED for an unknown serial_number in a body."
        test_recipe:
          setup: ["Distributor Northwind and AUTHORIZED reseller Acme exist; no SerialUnit rows exist."]
          setup_api_calls:
            - *CLK0801
            - *POLNEW
            - *POLSUB
            - *POLDEC
            - *POLPUB
            - *RESACME
            - *AGRNEW
            - *AGRSEND
            - *AGRSIGN
            - *AGRACT
            - *DISTNW
          trigger:
            - call: "POST /serial-units/su-does-not-exist/ship-downstream"
              payload: { downstream_reseller_id: "${res}" }
              as: Distributor
              as_user_id: "${dist}"
              captures: { err: $.data.error_id }
          assert:
            - "HTTP 404"
            - "${err} == 'ERR_SERIAL_UNIT_NOT_FOUND'"

      - name: error_test_purchase_not_found_on_confirm_outcome_returns_not_found
        claim_type: violation_to_error
        grounds: ["validations[priority=4].error_id.ERR_TEST_PURCHASE_NOT_FOUND"]
        distinguishing_aspect: "An unknown {test_purchase_id} returns ERR_TEST_PURCHASE_NOT_FOUND and no SerialUnit is driven to TRACED_UNAUTHORIZED."
        test_recipe:
          setup: ["Northwind holds SN-0001 in SHIPPED_TO_DISTRIBUTOR; no test purchases exist."]
          setup_api_calls:
            - *CLK0801
            - *POLNEW
            - *POLSUB
            - *POLDEC
            - *POLPUB
            - *PRODA1
            - *DISTNW
            - *SU0001
          trigger:
            - call: "POST /test-purchases/tp-does-not-exist/confirm-outcome"
              payload: { outcome: "UNAUTHORIZED", outcome_reason: "No authorization on file" }
              as: MonitoringAnalyst
              as_user_id: "analyst-1"
              captures: { err: $.data.error_id }
          assert:
            - "HTTP 404"
            - "${err} == 'ERR_TEST_PURCHASE_NOT_FOUND'"
            - "SerialUnit.${su1}.status == SHIPPED_TO_DISTRIBUTOR"

      - name: error_chargeback_not_found_on_dispute_returns_not_found
        claim_type: violation_to_error
        grounds: ["validations[priority=4].error_id.ERR_CHARGEBACK_NOT_FOUND"]
        distinguishing_aspect: "A distributor disputing an unknown chargeback id gets ERR_CHARGEBACK_NOT_FOUND at priority 4, ahead of both the ownership check and the ASSESSED/UPHELD state check."
        test_recipe:
          setup: ["Distributor Northwind exists with a clean ledger and no chargebacks."]
          setup_api_calls:
            - *CLK0801
            - *DISTNW
          trigger:
            - call: "POST /distributor-chargebacks/cb-does-not-exist/dispute"
              payload: { dispute_reason: "Units were never in our custody" }
              as: Distributor
              as_user_id: "${dist}"
              captures: { err: $.data.error_id }
          assert:
            - "HTTP 404"
            - "${err} == 'ERR_CHARGEBACK_NOT_FOUND'"
            - "Distributor.${dist}.chargeback_balance_cents == 0"

      - name: error_validation_on_distributor_cap_rejected
        claim_type: violation_to_error
        grounds: ["validations[priority=3].error_id.ERR_VALIDATION"]
        distinguishing_aspect: "The priority-3 numeric-range check is not observation-specific: a negative annual_chargeback_cap_cents on distributor creation is rejected with the same ERR_VALIDATION at 400."
        test_recipe:
          setup: ["Clock at 2026-08-01."]
          setup_api_calls:
            - *CLK0801
          trigger:
            - call: "POST /distributors"
              payload: { legal_name: "Bad Cap Ltd", annual_chargeback_cap_cents: -1 }
              as: BrandChannelManager
              captures: { err: $.data.error_id }
          assert:
            - "HTTP 400"
            - "${err} == 'ERR_VALIDATION'"
            - "no Distributor row is created"

      - name: error_invalid_state_on_second_submit_review_returns_invalid_state
        claim_type: violation_to_error
        grounds: ["validations[priority=7].error_id.ERR_INVALID_STATE"]
        distinguishing_aspect: "ERR_INVALID_STATE is reachable from the PricingPolicy machine too: submit-review from IN_LEGAL_REVIEW is not a declared transition, so the second call is a 409 and the version does not move again."
        test_recipe:
          setup: ["Policy MAP-2026-A already in IN_LEGAL_REVIEW at version 2."]
          setup_api_calls:
            - *CLK0801
            - *POLNEW
            - *POLSUB
          trigger:
            - call: "POST /pricing-policies/${pol}/submit-review"
              payload: {}
              as: BrandChannelManager
              captures: { err: $.data.error_id }
          assert:
            - "HTTP 409"
            - "${err} == 'ERR_INVALID_STATE'"
            - "PricingPolicy.${pol}.status == IN_LEGAL_REVIEW"
            - "PricingPolicy.${pol}.version == 2"

  # ===========================================================================
  # SECTION 7 — rbac  (§1.5 `roles:` lists; role_model = segregation_of_duties)
  # ===========================================================================
  - section: rbac
    instances:

      - name: rbac_brand_channel_manager_can_create_products
        claim_type: can_perform_exclusive_operations
        grounds: ["endpoints.POST /products.roles"]
        distinguishing_aspect: "BrandChannelManager is the sole declared role on POST /products and the call succeeds with 201 for that role."
        test_recipe:
          setup: ["Policy MAP-2026-A PUBLISHED."]
          setup_api_calls:
            - *CLK0801
            - *POLNEW
            - *POLSUB
            - *POLDEC
            - *POLPUB
          trigger:
            - call: "POST /products"
              payload: { sku: "SKU-RBAC-1", name: "RBAC Probe", msrp_cents: 20000, standard_map_floor_cents: 15000, governing_policy_id: "${pol}" }
              as: BrandChannelManager
              captures: { p: $.data.id, sku: $.data.sku }
          assert:
            - "HTTP 201"
            - "${sku} == 'SKU-RBAC-1'"
            - "Product.${p}.lifecycle_status == ACTIVE"

      - name: rbac_monitoring_analyst_cannot_create_products_rejected
        claim_type: cannot_perform_other_roles_exclusive_operations
        grounds: ["endpoints.POST /products.roles", "validations[priority=2]"]
        distinguishing_aspect: "MonitoringAnalyst is absent from POST /products, so the catalogue write is refused with ERR_ROLE_NOT_PERMITTED at 403 even though the body is entirely valid."
        test_recipe:
          setup: ["Policy MAP-2026-A PUBLISHED."]
          setup_api_calls:
            - *CLK0801
            - *POLNEW
            - *POLSUB
            - *POLDEC
            - *POLPUB
          trigger:
            - call: "POST /products"
              payload: { sku: "SKU-RBAC-2", name: "Analyst Probe", msrp_cents: 20000, standard_map_floor_cents: 15000, governing_policy_id: "${pol}" }
              as: MonitoringAnalyst
              as_user_id: "analyst-1"
              captures: { err: $.data.error_id }
          assert:
            - "HTTP 403"
            - "${err} == 'ERR_ROLE_NOT_PERMITTED'"
            - "no Product row is created"

      - name: rbac_brand_legal_counsel_can_publish_policy
        claim_type: can_perform_exclusive_operations
        grounds: ["endpoints.POST /pricing-policies/{policy_id}/publish.roles"]
        distinguishing_aspect: "Publication is exclusive to BrandLegalCounsel and succeeds for that role, stamping published_by_user_id with the acting counsel."
        test_recipe:
          setup: ["Policy MAP-2026-A in APPROVED."]
          setup_api_calls:
            - *CLK0801
            - *POLNEW
            - *POLSUB
            - *POLDEC
          trigger:
            - call: "POST /pricing-policies/${pol}/publish"
              payload: { effective_from: "2026-08-01T00:00:00Z" }
              as: BrandLegalCounsel
              as_user_id: "counsel-2"
              captures: { st: $.data.status, pby: $.data.published_by_user_id }
          assert:
            - "HTTP 200"
            - "${st} == 'PUBLISHED'"
            - "${pby} == 'counsel-2'"

      - name: rbac_brand_channel_manager_cannot_publish_policy_rejected
        claim_type: cannot_perform_other_roles_exclusive_operations
        grounds: ["endpoints.POST /pricing-policies/{policy_id}/publish.roles", "validations[priority=2]"]
        distinguishing_aspect: "The manager who authored and submitted the policy still cannot publish it: publication is counsel-exclusive, so the same actor is refused at priority 2."
        test_recipe:
          setup: ["Policy MAP-2026-A in APPROVED, authored and submitted by the BrandChannelManager."]
          setup_api_calls:
            - *CLK0801
            - *POLNEW
            - *POLSUB
            - *POLDEC
          trigger:
            - call: "POST /pricing-policies/${pol}/publish"
              payload: { effective_from: "2026-08-01T00:00:00Z" }
              as: BrandChannelManager
              as_user_id: "bcm-1"
              captures: { err: $.data.error_id }
          assert:
            - "HTTP 403"
            - "${err} == 'ERR_ROLE_NOT_PERMITTED'"
            - "PricingPolicy.${pol}.status == APPROVED"
            - "PricingPolicy.${pol}.effective_from == null"

      - name: rbac_monitoring_analyst_can_capture_observations
        claim_type: can_perform_exclusive_operations
        grounds: ["endpoints.POST /price-observations.roles"]
        distinguishing_aspect: "Evidence capture is exclusive to MonitoringAnalyst and the acting analyst is recorded on the row as evidence_captured_by_user_id."
        test_recipe:
          setup: ["Product SKU-AUDIO-1 under PUBLISHED policy MAP-2026-A; clock 2026-08-20."]
          setup_api_calls:
            - *CLK0801
            - *POLNEW
            - *POLSUB
            - *POLDEC
            - *POLPUB
            - *PRODA1
            - *CLK0820
          trigger:
            - call: "POST /price-observations"
              payload: { product_id: "${prod}", channel: "MARKETPLACE", seller_display_name: "RBAC Store", listing_url: "https://mkt.example/l/rbac", listed_price_cents: 14000, observed_at: "2026-08-18T00:00:00Z", evidence_hash: "1a2b3c4d5e6f7a8b9c0d1e2f3a4b5c6d7e8f9a0b1c2d3e4f5a6b7c8d9e0f1a2b" }
              as: MonitoringAnalyst
              as_user_id: "analyst-1"
              captures: { o: $.data.id, cap: $.data.evidence_captured_by_user_id }
          assert:
            - "HTTP 201"
            - "${cap} == 'analyst-1'"
            - "PriceObservation.${o}.evaluation_status == CAPTURED"

      - name: rbac_reseller_cannot_capture_observations_rejected
        claim_type: cannot_perform_other_roles_exclusive_operations
        grounds: ["endpoints.POST /price-observations.roles", "validations[priority=2]"]
        distinguishing_aspect: "A Reseller cannot self-report evidence: POST /price-observations lists MonitoringAnalyst only, so the call is refused before any product FK lookup."
        test_recipe:
          setup: ["Product SKU-AUDIO-1 exists and reseller Acme is AUTHORIZED; clock 2026-08-20."]
          setup_api_calls:
            - *CLK0801
            - *POLNEW
            - *POLSUB
            - *POLDEC
            - *POLPUB
