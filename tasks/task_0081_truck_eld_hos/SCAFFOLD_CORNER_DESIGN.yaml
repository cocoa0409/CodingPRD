        claim_type: ownership_denial
        grounds: [roles, "validations[priority=5]", "errors[ERR_UNAUTHORIZED]"]
        distinguishing_aspect: "A Driver (X-User-ID = D2) appending an event with driver_id = D1 -> 403 ERR_UNAUTHORIZED (entity_backed ownership)."
        test_recipe:
          setup: ["Driver D1 BOUND to device; Driver D2 exists. D2 tries to append an event for D1."]
