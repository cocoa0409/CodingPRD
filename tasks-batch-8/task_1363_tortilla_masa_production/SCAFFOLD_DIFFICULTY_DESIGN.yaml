# =============================================================================
# Task 1363: Tortilla & Masa Production — §1.8 Scaffold Difficulty Design
# Test Targeting Index: 9 Difficulty Rules x >=2 instances (22 total)
# =============================================================================
scaffold_difficulty_design:
  # ---------------------------------------------------------------------------
  - rule_id: dual_variant_calc
    instances:
      - name: masa_yield_theoretical_vs_actual_diverge
        grounds:
          - calculations.theoretical_masa_yield
          - calculations.actual_masa_yield
          - entities.NixtamalBatch.fields.theoretical_masa_kg
          - entities.NixtamalBatch.fields.actual_masa_kg
          - entities.NixtamalBatch.fields.yield_variance_pct
        distinguishing_aspect: |
          Entity domain NixtamalBatch: the provisional variant (variety lookup
          factor on corn input, computed at creation) and the final variant
          (measured mill output netted for waste and moisture-corrected) yield
          different masa kg for the SAME batch: 1700.0 vs 1552.0.
        test_recipe:
          setup:
            - "CONDITIONED WHITE_CORN lot with 5000 kg received"
            - "batch of 1000 kg corn, cooked 90 min, steeped 8h, evaluated PASS"
            - "mill: milled 1620 kg, measured moisture 58%, waste 20 kg"
          setup_api_calls:
            - { call: "POST /plant/ingredient-lots", payload: { lot_code: "LOT-Y1", corn_variety: "WHITE_CORN", received_kg: 5000, moisture_pct: 12.5 }, as: PlantManager, captures: { lot_id: "$.data.id" } }
            - { call: "POST /plant/ingredient-lots/${lot_id}/condition", payload: {}, as: MillerOperator }
            - { call: "POST /plant/nixtamal-batches", payload: { ingredient_lot_id: "${lot_id}", corn_kg: 1000, lime_pct: 1.0, cook_minutes: 90, steep_target_hours: 8 }, as: MillerOperator, captures: { batch_id: "$.data.id", theo_kg: "$.data.theoretical_masa_kg" } }
            - { call: "POST /plant/nixtamal-batches/${batch_id}/start-cook", payload: {}, as: MillerOperator }
            - { call: "POST /plant/_clock/set_current_utc", payload: { to_iso8601: "2026-08-01T02:00:00Z" }, as: PlantManager }
            - { call: "POST /plant/nixtamal-batches/${batch_id}/start-steep", payload: {}, as: MillerOperator }
            - { call: "POST /plant/_clock/set_current_utc", payload: { to_iso8601: "2026-08-01T12:00:00Z" }, as: PlantManager }
            - { call: "POST /plant/nixtamal-batches/${batch_id}/evaluate", payload: { decision: "PASS" }, as: QualityInspector }
          trigger:
            - { call: "POST /plant/nixtamal-batches/${batch_id}/mill", payload: { milled_masa_kg: 1620, measured_moisture_pct: 58, masa_wasted_kg: 20 }, as: MillerOperator, captures: { act_kg: "$.data.actual_masa_kg", var_pct: "$.data.yield_variance_pct" } }
          assert:
            - "NixtamalBatch.${batch_id}.theoretical_masa_kg == 1700.0  (1000 x 1.70 provisional)"
            - "NixtamalBatch.${batch_id}.actual_masa_kg == 1552.0  ((1620-20) x (1 - (58-55)/100) final)"
            - "NixtamalBatch.${batch_id}.yield_variance_pct == -8.71"
            - "theoretical_masa_kg != actual_masa_kg for identical batch data"

      - name: pack_weight_average_vs_count_verify_diverge
        grounds:
          - calculations.pack_weight_verification
          - entities.PackOrder.fields.verification_method
          - entities.PackOrder.fields.count_accuracy_pct
          - entities.PackOrder.fields.avg_pack_weight_g
        distinguishing_aspect: |
          Entity domain PackOrder (different domain from masa yield): the same
          physical cartons pass AVERAGE_WEIGHT (avg 360.0 inside the 2% band)
          but fail COUNT_VERIFY (counts [12,13,11] not all == 12), so the two
          variants produce different pass/fail verdicts for identical inputs.
        test_recipe:
          setup:
            - "CORN_ONLY product P: 12 count x 30 g, tol 2% -> declared 360.0 g, band [352.8, 367.2]"
            - "run R IN_PROGRESS on a SHARED line with full masa coverage (batch milled 1552.0 kg available)"
            - "two pack orders under R, identical except verification_method"
          setup_api_calls:
            - { call: "POST /plant/ingredient-lots", payload: { lot_code: "LOT-WV", corn_variety: "WHITE_CORN", received_kg: 5000, moisture_pct: 12.5 }, as: PlantManager, captures: { lot_id: "$.data.id" } }
            - { call: "POST /plant/ingredient-lots/${lot_id}/condition", payload: {}, as: MillerOperator }
            - { call: "POST /plant/nixtamal-batches", payload: { ingredient_lot_id: "${lot_id}", corn_kg: 1000, lime_pct: 1.0, cook_minutes: 90, steep_target_hours: 8 }, as: MillerOperator, captures: { batch_id: "$.data.id" } }
            - { call: "POST /plant/nixtamal-batches/${batch_id}/start-cook", payload: {}, as: MillerOperator }
            - { call: "POST /plant/_clock/set_current_utc", payload: { to_iso8601: "2026-08-01T02:00:00Z" }, as: PlantManager }
            - { call: "POST /plant/nixtamal-batches/${batch_id}/start-steep", payload: {}, as: MillerOperator }
            - { call: "POST /plant/_clock/set_current_utc", payload: { to_iso8601: "2026-08-01T12:00:00Z" }, as: PlantManager }
            - { call: "POST /plant/nixtamal-batches/${batch_id}/evaluate", payload: { decision: "PASS" }, as: QualityInspector }
            - { call: "POST /plant/nixtamal-batches/${batch_id}/mill", payload: { milled_masa_kg: 1620, measured_moisture_pct: 58, masa_wasted_kg: 20 }, as: MillerOperator }
            - { call: "POST /plant/products", payload: { sku_code: "CORN-6-12", diameter_in: "D6", count_per_pack: 12, packs_per_case: 10, unit_weight_g: 30, channel: "RETAIL", preservative_system: "PROPIONATE", allergen_class: "CORN_ONLY", weight_tolerance_pct: 2.0 }, as: PlantManager, captures: { prod_id: "$.data.id" } }
            - { call: "POST /plant/lines", payload: { line_code: "L-WV", allergen_zone: "SHARED", cases_per_hour: 100 }, as: PlantManager, captures: { line_id: "$.data.id", line_v: "$.data.version" } }
            - { call: "POST /plant/runs", payload: { product_id: "${prod_id}", line_id: "${line_id}", planned_cases: 100, start_at: "2026-08-02T10:00:00Z", end_at: "2026-08-02T12:00:00Z", expected_line_version: "${line_v}" }, as: LineScheduler, captures: { run_id: "$.data.id" } }
            - { call: "POST /plant/runs/${run_id}/schedule", payload: {}, as: LineScheduler }
            - { call: "POST /plant/allocations", payload: { nixtamal_batch_id: "${batch_id}", production_run_id: "${run_id}", allocated_kg: 388.8 }, as: LineScheduler }
            - { call: "POST /plant/runs/${run_id}/start", payload: {}, as: LineScheduler }
            - { call: "POST /plant/pack-orders", payload: { production_run_id: "${run_id}", cases_planned: 50, verification_method: "AVERAGE_WEIGHT" }, as: PackagingLead, captures: { po_avg: "$.data.id" } }
            - { call: "POST /plant/pack-orders", payload: { production_run_id: "${run_id}", cases_planned: 50, verification_method: "COUNT_VERIFY" }, as: PackagingLead, captures: { po_cnt: "$.data.id" } }
            - { call: "POST /plant/pack-orders/${po_avg}/start-packing", payload: {}, as: PackagingLead }
            - { call: "POST /plant/pack-orders/${po_cnt}/start-packing", payload: {}, as: PackagingLead }
          trigger:
            - { call: "POST /plant/pack-orders/${po_avg}/weight-check", payload: { cases_packed: 50, sample_weights_g: [360.0, 370.0, 350.0] }, as: PackagingLead, captures: { avg_status: "$.data.pack_status", avg_w: "$.data.avg_pack_weight_g" } }
            - { call: "POST /plant/pack-orders/${po_cnt}/weight-check", payload: { cases_packed: 50, sample_weights_g: [360.0, 370.0, 350.0], sample_counts: [12, 13, 11] }, as: PackagingLead, captures: { cnt_status: "$.data.pack_status", cnt_acc: "$.data.count_accuracy_pct" } }
          assert:
            - "PackOrder.${po_avg}.pack_status == PASSED (avg 360.0 within [352.8, 367.2])"
            - "PackOrder.${po_avg}.avg_pack_weight_g == 360.0"
            - "PackOrder.${po_cnt}.pack_status == HOLD (counts [12,13,11] not all == 12)"
            - "PackOrder.${po_cnt}.count_accuracy_pct == 33.33"
            - "same samples, different verdict: PASSED under AVERAGE_WEIGHT, HOLD under COUNT_VERIFY"

  # ---------------------------------------------------------------------------
  - rule_id: combinatorial_formula
    instances:
      - name: changeover_matrix_allergen_downgrade_full_sanitation
        grounds:
          - calculations.changeover_requirement
          - entities.ChangeoverRecord.fields.required_level
          - entities.ChangeoverRecord.fields.required_downtime_min
        distinguishing_aspect: |
          Mode (a) — >=3 inputs with non-linear conditional branches: from
          SOY_BLENDED (rank 2) to CORN_ONLY (rank 0) is an allergen downgrade
          forcing FULL_SANITATION (120 min), and the +15 diameter penalty is
          suppressed at FULL level, so downtime is exactly 120, not 135.
        test_recipe:
          setup:
            - "SHARED line L"
            - "product SOY6 (SOY_BLENDED, D6) and product CORN6 (CORN_ONLY, D6)"
          setup_api_calls:
            - { call: "POST /plant/lines", payload: { line_code: "L-CO", allergen_zone: "SHARED", cases_per_hour: 100 }, as: PlantManager, captures: { line_id: "$.data.id" } }
            - { call: "POST /plant/products", payload: { sku_code: "SOY-6-12", diameter_in: "D6", count_per_pack: 12, packs_per_case: 10, unit_weight_g: 32, channel: "RETAIL", preservative_system: "PROPIONATE", allergen_class: "SOY_BLENDED" }, as: PlantManager, captures: { soy_id: "$.data.id" } }
            - { call: "POST /plant/products", payload: { sku_code: "CORN-6-12B", diameter_in: "D6", count_per_pack: 12, packs_per_case: 10, unit_weight_g: 30, channel: "RETAIL", preservative_system: "PROPIONATE", allergen_class: "CORN_ONLY" }, as: PlantManager, captures: { corn_id: "$.data.id" } }
          trigger:
            - { call: "POST /plant/changeovers", payload: { line_id: "${line_id}", from_product_id: "${soy_id}", to_product_id: "${corn_id}" }, as: SanitationTech, as_user_id: "san-01", captures: { co_id: "$.data.id", co_level: "$.data.required_level", co_min: "$.data.required_downtime_min" } }
          assert:
            - "ChangeoverRecord.${co_id}.required_level == FULL_SANITATION (allergen rank 2 -> 0 downgrade)"
            - "ChangeoverRecord.${co_id}.required_downtime_min == 120 (base 120, diameter penalty suppressed at FULL_SANITATION)"
            - "ChangeoverRecord.${co_id}.changeover_status == REQUIRED"

      - name: declared_weight_per_pack_rounding_order
        grounds:
          - calculations.declared_weight_rounding
          - entities.Product.fields.declared_pack_net_g
          - entities.Product.fields.declared_case_net_g
        distinguishing_aspect: |
          Mode (b) — nested rounding order matters: per-pack-first rounding of
          29.97 g x 12 gives 359.6 and case 3596.0; the forbidden naive order
          (29.97 x 120 then round) gives 3596.4. The scaffold pins per-pack-first.
        test_recipe:
          setup:
            - "no prerequisite state (empty DB)"
          setup_api_calls: []
          trigger:
            - { call: "POST /plant/products", payload: { sku_code: "RND-8-12", diameter_in: "D8", count_per_pack: 12, packs_per_case: 10, unit_weight_g: 29.97, channel: "FOODSERVICE", preservative_system: "FUMARIC_ACID", allergen_class: "CORN_ONLY" }, as: PlantManager, captures: { prod_id: "$.data.id", pack_g: "$.data.declared_pack_net_g", case_g: "$.data.declared_case_net_g", sld: "$.data.shelf_life_days" } }
          assert:
            - "Product.${prod_id}.declared_pack_net_g == 359.6 (round_half_up(29.97 x 12, 1))"
            - "Product.${prod_id}.declared_case_net_g == 3596.0 (359.6 x 10; NOT 3596.4 from the naive order)"
            - "Product.${prod_id}.shelf_life_days == 45 (FUMARIC_ACID)"

      - name: seasonal_allotment_waterfall_evaluation_order
        grounds:
          - calculations.seasonal_allotment_waterfall
          - entities.SeasonalAllotment.fields.allotted_cases
          - entities.SeasonalWindow.fields.is_strict
        distinguishing_aspect: |
          Mode (c) — circular-looking dependency with pinned evaluation order:
          the retail pool equals forecast minus foodservice allotments, so
          foodservice MUST be computed first; retail then draws tier A before B
          before C. Literals: FS=150, A=300, B=360, C=190 (pool exhausted).
        test_recipe:
          setup:
            - "window 2026-08-10..2026-08-16, multiplier 1.5 (strict), forecast 1000 cases"
            - "customers created in order: FS (FOODSERVICE_DIST, base 100, tier A), RA (RETAIL_GROCERY, 200, A), RB (300, B), RC (400, C); all GOOD"
          setup_api_calls:
            - { call: "POST /plant/customers", payload: { account_name: "FS Dist", channel: "FOODSERVICE_DIST", region: "TX-SOUTH", base_weekly_cases: 100, priority_tier: "A", min_shelf_life_pct: 30 }, as: PlantManager }
            - { call: "POST /plant/customers", payload: { account_name: "Retail A", channel: "RETAIL_GROCERY", region: "TX-SOUTH", base_weekly_cases: 200, priority_tier: "A", min_shelf_life_pct: 50 }, as: PlantManager }
            - { call: "POST /plant/customers", payload: { account_name: "Retail B", channel: "RETAIL_GROCERY", region: "TX-SOUTH", base_weekly_cases: 300, priority_tier: "B", min_shelf_life_pct: 50 }, as: PlantManager }
            - { call: "POST /plant/customers", payload: { account_name: "Retail C", channel: "TORTILLERIA", region: "TX-SOUTH", base_weekly_cases: 400, priority_tier: "C", min_shelf_life_pct: 40 }, as: PlantManager }
            - { call: "POST /plant/seasonal-windows", payload: { window_name: "CINCO_SURGE", starts_on: "2026-08-10", ends_on: "2026-08-16", demand_multiplier: 1.5, forecast_total_cases: 1000 }, as: PlantManager, captures: { win_id: "$.data.id", win_strict: "$.data.is_strict" } }
            - { call: "POST /plant/_clock/set_current_utc", payload: { to_iso8601: "2026-08-10T08:00:00Z" }, as: PlantManager }
          trigger:
            - { call: "POST /plant/seasonal-windows/${win_id}/activate", payload: {}, as: PlantManager, captures: { win_status: "$.data.window_status" } }
            - { call: "GET /plant/seasonal-windows/${win_id}/allotments", payload: {}, as: PlantManager, captures: { allo_fs: "$.data[0].id", allo_ra: "$.data[1].id", allo_rb: "$.data[2].id", allo_rc: "$.data[3].id" } }
          assert:
            - "SeasonalWindow.${win_id}.is_strict == true (1.5 >= 1.5 threshold, inclusive)"
            - "SeasonalAllotment[0] (foodservice).allotted_cases == 150 (ceil(100 x 1.5), computed FIRST)"
            - "SeasonalAllotment[1] (tier A).allotted_cases == 300 (min(ceil(200x1.5x1.0)=300, pool 850))"
            - "SeasonalAllotment[2] (tier B).allotted_cases == 360 (min(ceil(300x1.5x0.8)=360, pool 550))"
            - "SeasonalAllotment[3] (tier C).allotted_cases == 190 (min(360, remaining pool 190) — partial fill)"
            - "sum(allotted) == 1000 == forecast_total_cases"

  # ---------------------------------------------------------------------------
  - rule_id: non_linear_state_machine
    instances:
      - name: nixtamal_batch_recook_cycle
        grounds:
          - state_machines.NixtamalBatch.STEEPING_to_COOKING
          - entities.NixtamalBatch.fields.recook_count
        distinguishing_aspect: |
          Cyclic machine on NixtamalBatch: STEEPING -> COOKING recook loop
          (A->B->A) — the batch re-enters COOKING exactly once, recook_count
          becomes 1, and the steep clock resets so a second steep is required.
        test_recipe:
          setup:
            - "CONDITIONED lot; batch 800 kg in STEEPING after 90-min cook and 8h steep"
          setup_api_calls:
            - { call: "POST /plant/ingredient-lots", payload: { lot_code: "LOT-RC", corn_variety: "YELLOW_CORN", received_kg: 3000, moisture_pct: 13.0 }, as: PlantManager, captures: { lot_id: "$.data.id" } }
            - { call: "POST /plant/ingredient-lots/${lot_id}/condition", payload: {}, as: MillerOperator }
            - { call: "POST /plant/nixtamal-batches", payload: { ingredient_lot_id: "${lot_id}", corn_kg: 800, lime_pct: 1.2, cook_minutes: 90, steep_target_hours: 8 }, as: MillerOperator, captures: { batch_id: "$.data.id", theo: "$.data.theoretical_masa_kg" } }
            - { call: "POST /plant/nixtamal-batches/${batch_id}/start-cook", payload: {}, as: MillerOperator }
            - { call: "POST /plant/_clock/set_current_utc", payload: { to_iso8601: "2026-08-01T02:00:00Z" }, as: PlantManager }
            - { call: "POST /plant/nixtamal-batches/${batch_id}/start-steep", payload: {}, as: MillerOperator }
            - { call: "POST /plant/_clock/set_current_utc", payload: { to_iso8601: "2026-08-01T12:00:00Z" }, as: PlantManager }
          trigger:
            - { call: "POST /plant/nixtamal-batches/${batch_id}/evaluate", payload: { decision: "RECOOK" }, as: QualityInspector, captures: { st1: "$.data.batch_status", rc: "$.data.recook_count" } }
            - { call: "POST /plant/_clock/set_current_utc", payload: { to_iso8601: "2026-08-01T14:00:00Z" }, as: PlantManager }
            - { call: "POST /plant/nixtamal-batches/${batch_id}/start-steep", payload: {}, as: MillerOperator, captures: { st2: "$.data.batch_status" } }
            - { call: "POST /plant/_clock/set_current_utc", payload: { to_iso8601: "2026-08-02T00:00:00Z" }, as: PlantManager }
            - { call: "POST /plant/nixtamal-batches/${batch_id}/evaluate", payload: { decision: "PASS" }, as: QualityInspector, captures: { st3: "$.data.batch_status" } }
          assert:
            - "after RECOOK: batch_status == COOKING and recook_count == 1 (cycle back to a prior state)"
            - "theoretical_masa_kg == 1320.0 (800 x 1.65 YELLOW_CORN)"
            - "after second steep + PASS: batch_status == MILLING"
            - "recook loop required fresh cook/steep clocks (start-steep at 14:00 succeeded only because cook_started_at reset to 12:00 and 120 >= 90 min elapsed)"

      - name: production_run_parallel_qc_dimension
        grounds:
          - state_machines.ProductionRun
          - entities.ProductionRun.fields.production_status
          - entities.ProductionRun.fields.qc_status
        distinguishing_aspect: |
          Parallel state dimensions on ProductionRun: production_status advances
          SCHEDULED -> IN_PROGRESS while qc_status independently moves
          PENDING -> ON_HOLD -> PASSED; the ON_HOLD dimension gates PackOrder
          sealing (ERR_QC_HOLD_ACTIVE) without touching production_status.
        test_recipe:
          setup:
            - "batch MASA_AVAILABLE (1552.0 kg), CORN product, SHARED line, run SCHEDULED with 388.8 kg RESERVED coverage"
            - "pack order under the run, PACKING, then PASSED at weight-check"
          setup_api_calls:
            - { call: "POST /plant/ingredient-lots", payload: { lot_code: "LOT-QC", corn_variety: "WHITE_CORN", received_kg: 5000, moisture_pct: 12.5 }, as: PlantManager, captures: { lot_id: "$.data.id" } }
            - { call: "POST /plant/ingredient-lots/${lot_id}/condition", payload: {}, as: MillerOperator }
            - { call: "POST /plant/nixtamal-batches", payload: { ingredient_lot_id: "${lot_id}", corn_kg: 1000, lime_pct: 1.0, cook_minutes: 90, steep_target_hours: 8 }, as: MillerOperator, captures: { batch_id: "$.data.id" } }
            - { call: "POST /plant/nixtamal-batches/${batch_id}/start-cook", payload: {}, as: MillerOperator }
            - { call: "POST /plant/_clock/set_current_utc", payload: { to_iso8601: "2026-08-01T02:00:00Z" }, as: PlantManager }
            - { call: "POST /plant/nixtamal-batches/${batch_id}/start-steep", payload: {}, as: MillerOperator }
            - { call: "POST /plant/_clock/set_current_utc", payload: { to_iso8601: "2026-08-01T12:00:00Z" }, as: PlantManager }
            - { call: "POST /plant/nixtamal-batches/${batch_id}/evaluate", payload: { decision: "PASS" }, as: QualityInspector }
            - { call: "POST /plant/nixtamal-batches/${batch_id}/mill", payload: { milled_masa_kg: 1620, measured_moisture_pct: 58, masa_wasted_kg: 20 }, as: MillerOperator }
            - { call: "POST /plant/products", payload: { sku_code: "CORN-6-12C", diameter_in: "D6", count_per_pack: 12, packs_per_case: 10, unit_weight_g: 30, channel: "RETAIL", preservative_system: "PROPIONATE", allergen_class: "CORN_ONLY" }, as: PlantManager, captures: { prod_id: "$.data.id" } }
            - { call: "POST /plant/lines", payload: { line_code: "L-QC", allergen_zone: "SHARED", cases_per_hour: 100 }, as: PlantManager, captures: { line_id: "$.data.id", line_v: "$.data.version" } }
            - { call: "POST /plant/runs", payload: { product_id: "${prod_id}", line_id: "${line_id}", planned_cases: 100, start_at: "2026-08-02T10:00:00Z", end_at: "2026-08-02T12:00:00Z", expected_line_version: "${line_v}" }, as: LineScheduler, captures: { run_id: "$.data.id" } }
            - { call: "POST /plant/runs/${run_id}/schedule", payload: {}, as: LineScheduler }
            - { call: "POST /plant/allocations", payload: { nixtamal_batch_id: "${batch_id}", production_run_id: "${run_id}", allocated_kg: 388.8 }, as: LineScheduler }
            - { call: "POST /plant/runs/${run_id}/start", payload: {}, as: LineScheduler, captures: { prod_status: "$.data.production_status" } }
            - { call: "POST /plant/pack-orders", payload: { production_run_id: "${run_id}", cases_planned: 50, verification_method: "AVERAGE_WEIGHT" }, as: PackagingLead, captures: { po_id: "$.data.id" } }
            - { call: "POST /plant/pack-orders/${po_id}/start-packing", payload: {}, as: PackagingLead }
            - { call: "POST /plant/pack-orders/${po_id}/weight-check", payload: { cases_packed: 50, sample_weights_g: [360.0, 361.0, 359.0] }, as: PackagingLead }
          trigger:
            - { call: "POST /plant/runs/${run_id}/qc-hold", payload: {}, as: QualityInspector, captures: { qc1: "$.data.qc_status", ps1: "$.data.production_status" } }
            - { call: "POST /plant/pack-orders/${po_id}/seal", payload: {}, as: PackagingLead, captures: { seal_err: "$.data.error_id" } }
            - { call: "POST /plant/runs/${run_id}/qc-release", payload: {}, as: QualityInspector, captures: { qc2: "$.data.qc_status" } }
            - { call: "POST /plant/pack-orders/${po_id}/seal", payload: {}, as: PackagingLead, captures: { po_final: "$.data.pack_status" } }
          assert:
            - "qc-hold: qc_status == ON_HOLD while production_status stays IN_PROGRESS (independent dimensions)"
            - "seal during ON_HOLD rejected with ERR_QC_HOLD_ACTIVE"
            - "qc-release: qc_status == PASSED; production_status still IN_PROGRESS"
            - "seal after release succeeds: PackOrder.pack_status == SEALED"

      - name: changeover_failed_rework_loop
        grounds:
          - state_machines.ChangeoverRecord.FAILED_to_IN_PROGRESS
          - entities.ChangeoverRecord.fields.fail_count
        distinguishing_aspect: |
          Cyclic machine on ChangeoverRecord (different entity from
          NixtamalBatch): IN_PROGRESS -> FAILED -> IN_PROGRESS rework loop;
          fail_count increments and verification only succeeds after rework.
        test_recipe:
          setup:
            - "SHARED line; CORN_ONLY D6 product and CORN_ONLY D8 product (same class, diameter change -> WET_WASH 75 min)"
          setup_api_calls:
            - { call: "POST /plant/lines", payload: { line_code: "L-RW", allergen_zone: "SHARED", cases_per_hour: 100 }, as: PlantManager, captures: { line_id: "$.data.id" } }
