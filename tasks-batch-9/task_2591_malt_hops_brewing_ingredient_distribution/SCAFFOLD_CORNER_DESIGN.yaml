              as: Brewer
              as_user_id: "${nr_id}"
              captures: { nr_line_id: $.data.id, nr_line_ext: $.data.extended_cents, nr_line_cold: $.data.cold_chain_required, nr_line_pb: $.data.pallet_break }
            - call: "POST /sales-orders/${nr_o_id}/confirm"
