  # ---------------------------------------------------------------- price schedules
  - method: POST
    path: /price-schedules
    description: "Opens a draft monthly price schedule for a wholesaler."
    roles: [FilingAgent]
    success_code: 201
    input: [wholesaler_id, state_program_id, posting_month]
    output: PriceSchedule
    side_effects:
      - "computes effective_date per calculation schedule_effective_date"

  - method: POST
    path: /price-schedules/{id}/submit
    description: "Files a draft price schedule with the state, determining whether the filing is late."
    roles: [FilingAgent]
    success_code: 200
    input: []
    output: PriceSchedule
    side_effects:
      - "moves the schedule from DRAFT to SUBMITTED"
      - "sets filed_at, filed_by_user_id and is_late"
      - "accrues the program's late filing penalty on the wholesaler when the filing is late"
      - "increments PriceSchedule.version by 1"

  - method: POST
    path: /price-schedules/{id}/return-for-correction
    description: "Returns a submitted price schedule to draft so the wholesaler can revise it."
    roles: [ComplianceOfficer]
    success_code: 200
    input: [return_reason]
    output: PriceSchedule
    side_effects:
      - "moves the schedule from SUBMITTED back to DRAFT"
      - "records return_reason and increments return_count by 1"
      - "increments PriceSchedule.version by 1"

  - method: POST
    path: /price-schedules/{id}/certify
    description: "Certifies a submitted price schedule, posting its items and opening the post-and-hold window."
    roles: [CertifyingOfficer]
    success_code: 200
    input: []
    output: PriceSchedule
    side_effects:
      - "moves the schedule from SUBMITTED to POSTED"
      - "sets certified_at, certified_by_user_id and hold_window_ends_at"
      - "moves every item to POSTED and snapshots its certified prices"
      - "increments PriceSchedule.version by 1"

  - method: POST
    path: /price-schedules/{id}/withdraw
    description: "Withdraws a submitted price schedule before certification, reversing any late filing penalty."
    roles: [FilingAgent]
    success_code: 200
    input: []
    output: PriceSchedule
    side_effects:
      - "moves the schedule from SUBMITTED to WITHDRAWN and every item to WITHDRAWN"
      - "reverses the late filing penalty accrual when the schedule was late"
      - "increments PriceSchedule.version by 1"

  - method: GET
    path: /price-schedules/{id}
    description: "Retrieves one price schedule."
    roles: [ComplianceOfficer, FilingAgent, CertifyingOfficer]
    success_code: 200
    input: []
    output: PriceSchedule
    side_effects: []

  - method: GET
    path: /price-schedules
    description: "Lists price schedules."
    roles: [ComplianceOfficer, FilingAgent, CertifyingOfficer]
