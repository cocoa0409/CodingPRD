          Every state machine's declared initial_state must be what the POST actually persists, and the
          ProductModel's initial state is a PAIR (UNCERTIFIED x DRAFT) rather than a single token. Creating one
          row per machine in a single instance catches an implementation that starts a lot in WELDED, a batch in
          FIRED or a campaign in SCOPED because its create handler pre-runs the first transition.
        test_recipe:
          setup:
            - "The database is empty apart from the rows this recipe creates."
