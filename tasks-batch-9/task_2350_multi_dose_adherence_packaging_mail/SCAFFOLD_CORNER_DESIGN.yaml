          rationale: "That instance fires priority 18 alone (packer imaging or verifying their own roll) as its control case before combining it with priority 13."
      - name: third_rework_of_a_quarantined_roll_rejected
        claim_type: violation_to_error
        grounds:
          - validations.priority_36
          - errors.ERR_REWORK_LIMIT_REACHED
        excluded_because:
          difficulty_instance: non_linear_state_machine / pouch_roll_rework_loop_saturates_at_two
          rationale: "The loop is walked to saturation there, ending on the refused third rework."
      - name: fourth_chase_of_an_open_authorization_rejected
        claim_type: violation_to_error
        grounds:
          - validations.priority_34
          - errors.ERR_CHASE_LIMIT_REACHED
        excluded_because:
          difficulty_instance: non_linear_state_machine / refill_authorization_chase_loop_then_escalation_exit
          rationale: "The chase ceiling and the escalation exit are asserted there in sequence."
      - name: line_over_the_payer_day_supply_allowance_rejected
        claim_type: violation_to_error
        grounds:
          - validations.priority_37
          - errors.ERR_DAY_SUPPLY_EXCEEDS_ALLOWANCE
        excluded_because:
          difficulty_instance: combinatorial_formula / day_supply_allowance_four_way_min_chain
          rationale: "Each of the four ceilings is made the binding one there, including the case that trips priority 37."
      - name: forcing_a_non_packable_drug_into_the_pouch_route_rejected
        claim_type: violation_to_error
        grounds:
          - validations.priority_22
          - errors.ERR_NON_PACKABLE_IN_POUCH_ROUTE
        excluded_because:
          difficulty_instance: priority_pair_validation_conflict / non_packable_route_outranks_day_supply_allowance
          rationale: "Both the isolated violation and its precedence over priority 37 are asserted there."
      - name: forcing_a_refrigerated_drug_into_the_pouch_route_rejected
        claim_type: violation_to_error
        grounds:
          - validations.priority_20
          - errors.ERR_COLD_CHAIN_NOT_PACKABLE
        excluded_because:
          difficulty_instance: priority_pair_validation_conflict / cold_chain_not_packable_outranks_non_packable_route
          rationale: "A prescription that is both refrigerated and non-packable is forced there, pinning priority 20 above priority 22."

      - name: deciding_an_already_approved_travel_request_rejected
        claim_type: violation_to_error
        grounds:
          - validations.priority_16
          - errors.ERR_INVALID_VACATION_STATE
          - entities.VacationExceptionRequest.fields.status
          - endpoints.POST_/pharmacy/vacation-exceptions/{id}/decide
        distinguishing_aspect: "A decision is once-and-final: re-deciding a request that already consumed the patient's yearly override is refused on the status, not on the allowance, so the counter cannot be spent twice by replaying the approval."
        test_recipe:
          setup:
            - "logical clock at 2026-08-10T00:00:00Z; plan funds 1 override per year"
            - "patient with one non-controlled prescription and an APPROVED_PHARMACIST request for 2026-08-20..2026-08-27 granting 3 extra days"
          setup_api_calls:
            - call: "POST /pharmacy/_clock/set_current_utc"
              payload: { current_utc: "2026-08-10T00:00:00Z" }
              as: PlatformAdmin
            - call: "POST /pharmacy/insurance-plans"
              payload: { payer_name: "Northwind PBM", bin_number: "610502", generic_copay_cents_per_day: 34, brand_copay_cents_per_day: 74, specialty_copay_cents_per_day: 44, vacation_overrides_per_year: 1 }
              as: PlatformAdmin
              captures: { plan_id: $.data.id }
            - call: "POST /pharmacy/patients"
