            - "response error_id == ERR_SEGREGATION_OF_DUTIES"
            - "RepairOrder.${ro_id}.status == INSTALLED"
            - "RepairOrder.${ro_id}.installed_by_user_id == tech-1"
            - "RepairOrder.${ro_id}.verified_by_user_id == null"
            - "RepairOrder.${ro_id}.verification_failure_count == 0"
            - "EquipmentUnit.${u1_id}.recon_status == REPAIR_PENDING"
            - "ApprovedPart.${part_id}.consumed_qty == 1"

      - name: an_in_warranty_repair_without_a_claim_reference_rejected
        claim_type: Conditional validation
        grounds:
          - validations.v-warranty-claim-ref
          - errors.ERR_WARRANTY_CLAIM_REQUIRED
          - entities.EquipmentUnit.fields.warranty_coverage
        distinguishing_aspect: |
          The rule only exists for units the manufacturer still covers: a shell
          manufactured 2023-09-15 has service_age_years 2 <= warranty_years 5, so
          warranty_coverage is IN_WARRANTY and install without warranty_claim_ref
          must fail with ERR_WARRANTY_CLAIM_REQUIRED / 422 before any part is
          consumed (reserved 1, consumed 0). The identical install on the
          2018 shell used elsewhere is accepted with no claim reference at all.
        test_recipe:
          setup:
            - "one unit identified with manufacture_date 2023-09-15 (service_age_years 2, IN_WARRANTY)"
            - "a SUBMITTED RepairOrder with one reserved part line"
          setup_api_calls:
            - *k_clock
