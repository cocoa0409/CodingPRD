# §1.8 Scaffold Difficulty Design — Emergency Medical Dispatch Protocol Quality Assurance
# 9 rule_ids / 25 instances. Every numeric literal in `assert:` was computed by executing the
# corresponding §1.3 formula with its declared constants.

scaffold_difficulty_design:
  - rule_id: dual_variant_calc
    instances:
      - name: review_provisional_unweighted_versus_final_weighted_composite
        grounds:
          - calculations.review_composite_score
          - entities.Review.fields.provisional_composite_score
          - entities.Review.fields.pre_penalty_composite_score
          - entities.ScoreSheet.fields.key_questions_pct
          - state_machines.Review.SCORED_to_FINALIZED
        distinguishing_aspect: |
          The same single ScoreSheet yields provisional_composite_score 90.0 under variant
          section_unweighted_mean and pre_penalty_composite_score 86.0 under variant
          accreditation_weighted_composite, because the 60.00 key-questions section carries
          weight 0.35 in the final variant but only 0.25 in the provisional mean — a 4.0-point
          divergence produced entirely by which weight vector is applied to identical inputs.
        test_recipe:
          setup:
            - "A program with target_compliance_pct 90.0 and watch_floor_pct 80.0."
            - "An APPROVED MPDS_CARDSET protocol version with weights 0.20 / 0.35 / 0.30 / 0.15 effective from 2026-07-01."
            - "One dispatcher with one ingested CHEST_PAIN call dispatched as 10-C-4."
            - "The call is targeted into an OPEN MIXED sampling period and scored with a perfect case-entry, pre-arrival and final-coding sheet but only 18/30 on key questions; the reviewer's code matches the dispatched code."
            - "Logical clock at 2026-08-20T00:00:00Z."
          setup_api_calls:
            - call: "POST /audit-programs"
              payload: { name: "Metro EMD QA", accreditation_body: "IAED", target_compliance_pct: 90.0, watch_floor_pct: 80.0, high_risk_target_pct: 85.0, review_deadline_days: 30, rebuttal_window_days: 14, max_rebuttal_rounds: 2, escalated_sample_floor: 25, hours_owed_restriction_threshold: 6.0 }
              as: ProgramAdmin
              as_user_id: "admin-1"
              captures: { prog_id: $.data.id }
            - call: "POST /audit-programs/${prog_id}/protocol-versions"
              payload: { protocol_family: "MPDS_CARDSET", version_label: "MPDS-13.0", effective_from: "2026-07-01T00:00:00Z", case_entry_weight: 0.2000, key_questions_weight: 0.3500, pre_arrival_weight: 0.3000, final_coding_weight: 0.1500 }
              as: ProgramAdmin
              as_user_id: "admin-1"
              captures: { pv_id: $.data.id }
            - call: "POST /protocol-versions/${pv_id}/approve"
              payload: { approval_note: "adopted" }
              as: MedicalDirector
              as_user_id: "dir-1"
            - call: "POST /dispatchers"
              payload: { program_id: "${prog_id}", employee_code: "EMD-101", full_name: "Dana Ruiz", hire_date: "2024-03-01" }
              as: ProgramAdmin
              as_user_id: "admin-1"
              captures: { d1_id: $.data.id }
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-20T00:00:00Z" }
              as: ProgramAdmin
              as_user_id: "admin-1"
            - call: "POST /dispatchers/${d1_id}/call-records"
              payload: { call_reference: "C-1001", call_type: "CHEST_PAIN", received_at: "2026-08-05T09:00:00Z", dispatched_determinant_code: "10-C-4" }
              as: ProgramAdmin
              as_user_id: "admin-1"
              captures: { c1_id: $.data.id }
            - call: "POST /audit-programs/${prog_id}/sampling-periods"
              payload: { call_type: "CHEST_PAIN", period_start: "2026-08-01T00:00:00Z", period_end: "2026-09-01T00:00:00Z", sampling_mode: "MIXED", target_sample_count: 1 }
              as: QaSupervisor
              as_user_id: "sup-1"
              captures: { sp_id: $.data.id }
            - call: "POST /sampling-periods/${sp_id}/target-review"
              payload: { call_record_id: "${c1_id}", selection_reason: "COMPLAINT" }
              as: QaSupervisor
              as_user_id: "sup-1"
              captures: { r1_id: $.data.id, r1_v: $.data.version }
            - call: "POST /reviews/${r1_id}/scores"
              payload: { expected_review_version: "${r1_v}", case_entry_points_earned: 20, case_entry_points_possible: 20, key_questions_points_earned: 18, key_questions_points_possible: 30, pre_arrival_points_earned: 10, pre_arrival_points_possible: 10, final_coding_points_earned: 5, final_coding_points_possible: 5, reviewer_determinant_code: "10-C-4" }
              as: QaReviewer
              as_user_id: "rev-1"
              captures: { sheet1_id: $.data.id }
          trigger:
            - call: "POST /reviews/${r1_id}/finalize"
              payload: { finalization_note: "concur" }
              as: QaSupervisor
              as_user_id: "sup-1"
          assert:
            - "ScoreSheet.${sheet1_id}.case_entry_pct == 100.00"
            - "ScoreSheet.${sheet1_id}.key_questions_pct == 60.00"
            - "ScoreSheet.${sheet1_id}.provisional_composite_score == 90.0"
            - "Review.${r1_id}.provisional_composite_score == 90.0"
            - "Review.${r1_id}.pre_penalty_composite_score == 86.0"
            - "Review.${r1_id}.determinant_accuracy == ACCURATE"
            - "Review.${r1_id}.penalty_points == 0.0"
            - "Review.${r1_id}.final_composite_score == 86.0"
            - "Review.${r1_id}.compliant == false"
            - "Review.${r1_id}.status == FINALIZED"
            - "Dispatcher.${d1_id}.compliance_points_total == 86.0"
            - "Dispatcher.${d1_id}.compliance_pct == 86.0"
            - "Dispatcher.${d1_id}.compliance_posture == WATCH"

      - name: accreditation_case_weighted_versus_dispatcher_equal_weight_inverts_threshold
        grounds:
          - calculations.accreditation_compliance_percentage
          - entities.AccreditationReport.fields.variant
          - entities.AccreditationReport.fields.compliance_pct
          - entities.AccreditationReport.fields.threshold_met
        distinguishing_aspect: |
          Over the identical set of three finalized reviews (dispatcher A: one compliant; dispatcher B:
          one compliant and one not) the CASE_WEIGHTED variant reports 66.7 with threshold_met false
          while DISPATCHER_EQUAL_WEIGHT reports 75.0 with threshold_met true — the two variants
          disagree on the accreditation verdict itself, not merely on the number.
        test_recipe:
          setup:
            - "A program with target_compliance_pct 75.0 and watch_floor_pct 60.0."
            - "Two dispatchers: A with one finalized review scoring 92.0, B with two finalized reviews scoring 88.0 and 60.0."
            - "All three reviews finalized at clock 2026-08-20T00:00:00Z, inside the report window [2026-08-01, 2026-09-01)."
            - "A DRAFT CASE_WEIGHTED report already built over that window."
