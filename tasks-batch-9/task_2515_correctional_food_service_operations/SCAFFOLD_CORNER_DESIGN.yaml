        claim_type: error_triggerable
        grounds:
          - validations[priority=3]
          - errors.ERR_UNKNOWN_ROLE
          - rbac.roles
        distinguishing_aspect: "An unrecognised X-User-Role is an authentication fault (401 ERR_UNKNOWN_ROLE) decided before any authorisation check, so it never degrades into the 403 ERR_UNAUTHORIZED that a known-but-wrong role would produce."
        test_recipe:
          setup:
            - "Clock pinned; no domain rows required."
          setup_api_calls:
            - call: "POST /cfs/_clock/set_current_utc"
              payload: { current_utc: "2026-08-01T00:00:00Z" }
              as: ContractAdministrator
              as_user_id: "ca-001"
          trigger:
