              captures: { item10a: $.data.id }
            - call: "POST /archive/items"
              payload: { batch_id: "${batch9}", work_id: "${work10}", owning_library_id: "${lib9}", page_count: 60, condition_grade: "FINE" }
              as: ScanOperator
              captures: { item10b: $.data.id }
            - call: "POST /archive/scan-batches/${batch9}/seal"
              payload: {}
              as: ScanOperator
            - call: "POST /archive/patrons"
              payload: { email: "p12@example.org", full_name: "Patron Twelve" }
              as: Anonymous
              captures: { pat12: $.data.id }
            - call: "POST /archive/loans"
              payload: { item_id: "${item10a}", patron_id: "${pat12}", loan_kind: "STANDARD" }
              as: Patron
              as_user_id: "${pat12}"
              captures: { loan10a: $.data.id }
            - call: "POST /archive/loans"
              payload: { item_id: "${item10b}", patron_id: "${pat12}", loan_kind: "STANDARD" }
              as: Patron
              as_user_id: "${pat12}"
              captures: { loan10b: $.data.id }
          trigger:
            - call: "POST /archive/_clock/set_current_utc"
              payload: { to_iso8601: "2026-09-14T23:59:59.999Z" }
              as: Admin
            - call: "POST /archive/loans/${loan10a}/renew"
              payload: {}
              as: Patron
              as_user_id: "${pat12}"
            - call: "POST /archive/_clock/set_current_utc"
              payload: { to_iso8601: "2026-09-15T00:00:00Z" }
              as: Admin
            - call: "POST /archive/loans/${loan10b}/renew"
              payload: {}
              as: Patron
              as_user_id: "${pat12}"
              captures: { renew_err: $.data.error_id }
          assert:
            - "the first renewal at due_at - 1ms succeeds: Loan.${loan10a}.renewed == true and due_at == 2026-09-28T23:59:59.999Z (clock + 14 days, NOT due_at + 14 days)"
            - "the second renewal at exactly due_at fails with renew_err == ERR_LOAN_NOT_RENEWABLE (strict < boundary)"
            - "Loan.${loan10b}.status is still ACTIVE before the sweep runs (the sweep, not the clock, expires loans)"
      - name: crawl_start_schedule_gate_and_offer_expiry_boundary
        grounds:
          - validations[priority=14]
          - validations[priority=16]
          - errors.ERR_SCHEDULE_NOT_DUE
          - errors.ERR_OFFER_EXPIRED
        distinguishing_aspect: |
          Interval semantics: closed-start scheduling on the crawl job versus
          half-open expiry on the offer window — a crawl start at current_clock
          EXACTLY == scheduled_at is permitted (>= gate), while a waitlist
          claim at current_clock EXACTLY == offer_expires_at is rejected (strict
          < gate). Same clock, two resources (CrawlJob vs WaitlistEntry), two
          different adjacency treatments.
        test_recipe:
          setup:
            - "Work W11 with LENDABLE item I11; patron P13 with OFFERED entry E13 whose offer_expires_at == 2026-09-03T00:00:00Z (offered at 2026-09-01T00:00:00Z)."
            - "Crawl job J3 scheduled_at == 2026-09-01T00:00:00Z created while clock was 2026-08-31T23:00:00Z."
          setup_api_calls:
            - call: "POST /archive/_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-31T23:00:00Z" }
              as: Admin
            - call: "POST /archive/crawl-jobs"
              payload: { seed_url: "https://sched.site/", scheduled_at: "2026-09-01T00:00:00Z", requests_per_minute: 10 }
              as: CrawlOperator
              captures: { job3: $.data.id }
            - call: "POST /archive/partner-libraries"
              payload: { library_code: "LIB-J", display_name: "Library J", storage_commitment_years: 5 }
              as: LibraryAdmin
              captures: { lib10: $.data.id }
            - call: "POST /archive/works"
              payload: { title: "Offer Windows", author: "J. Lapse", publication_year: 2012 }
              as: Admin
              captures: { work11: $.data.id }
            - call: "POST /archive/scan-batches"
              payload: { operator_code: "op-10" }
              as: ScanOperator
              captures: { batch10: $.data.id }
            - call: "POST /archive/items"
              payload: { batch_id: "${batch10}", work_id: "${work11}", owning_library_id: "${lib10}", page_count: 45, condition_grade: "GOOD" }
              as: ScanOperator
              captures: { item11: $.data.id }
            - call: "POST /archive/patrons"
              payload: { email: "p13@example.org", full_name: "Patron Thirteen" }
              as: Anonymous
              captures: { pat13: $.data.id }
            - call: "POST /archive/waitlist-entries"
              payload: { work_id: "${work11}", patron_id: "${pat13}" }
              as: Patron
              as_user_id: "${pat13}"
              captures: { entry13: $.data.id }
            - call: "POST /archive/scan-batches/${batch10}/seal"
              payload: {}
              as: ScanOperator
            - call: "GET /archive/works/${work11}/waitlist-entries"
              payload: { status: "OFFERED" }
              as: Admin
              captures: { entry13_v: "$.data[0].version" }
          trigger:
            - call: "POST /archive/crawl-jobs/${job3}/start"
              payload: {}
              as: CrawlOperator
            - call: "POST /archive/_clock/set_current_utc"
              payload: { to_iso8601: "2026-09-03T00:00:00Z" }
              as: Admin
            - call: "POST /archive/waitlist-entries/${entry13}/claim"
              payload: { expected_entry_version: "${entry13_v}" }
              as: Patron
              as_user_id: "${pat13}"
              captures: { claim_err: $.data.error_id }
          assert:
            - "crawl start at clock exactly == scheduled_at (2026-09-01T00:00:00Z >= 2026-09-01T00:00:00Z) succeeds: CrawlJob.${job3}.status == RUNNING (closed-start gate)"
            - "claim at clock exactly == offer_expires_at fails with claim_err == ERR_OFFER_EXPIRED (half-open gate)"
            - "the failed claim does not consume the offer: WaitlistEntry.${entry13}.status is still OFFERED until the next sweep runs"

  # ===========================================================================
  - rule_id: compensating_invariant
    instances:
      - name: grant_release_settle_counter_invariant
        grounds:
          - calculations.grant_utilization
          - state_machines.BudgetLine.OPEN_to_RELEASED
          - state_machines.BudgetLine.OPEN_to_SETTLED
        distinguishing_aspect: |
          Conserved quantity: grant budget accounting — for every BudgetLine,
          reserve followed by release leaves reserved_cents, spent_cents, and
          the grant status bit-identical to their pre-reserve values
          (release compensates exactly); reserve followed by settle moves
          exactly actual_spend_cents from the reserved bucket into the spent
          bucket with utilization conserved when actual == reservation.
        test_recipe:
          setup:
            - "Grant G5 amount_cents 40000 OPEN."
          setup_api_calls:
            - call: "POST /archive/funding-grants"
              payload: { donor_name: "Hewlett", amount_cents: 40000 }
              as: FinanceAdmin
              captures: { grant5: $.data.id, g5_v0: $.data.version }
          trigger:
            - call: "POST /archive/budget-lines"
              payload: { grant_id: "${grant5}", category: "STORAGE", budget_reservation_cents: 15000 }
              as: FinanceAdmin
              captures: { bl6: $.data.id }
            - call: "GET /archive/funding-grants/${grant5}"
              payload: {}
              as: FinanceAdmin
              captures: { g5_v1: $.data.version }
            - call: "POST /archive/budget-lines/${bl6}/release"
              payload: { expected_grant_version: "${g5_v1}" }
              as: FinanceAdmin
            - call: "POST /archive/budget-lines"
              payload: { grant_id: "${grant5}", category: "BANDWIDTH", budget_reservation_cents: 9000 }
              as: FinanceAdmin
              captures: { bl7: $.data.id }
            - call: "GET /archive/funding-grants/${grant5}"
              payload: {}
              as: FinanceAdmin
              captures: { g5_v2: $.data.version }
            - call: "POST /archive/budget-lines/${bl7}/settle"
              payload: { actual_spend_cents: 9000, expected_grant_version: "${g5_v2}" }
              as: FinanceAdmin
          assert:
            - "after reserve(15000) + release: FundingGrant.${grant5}.reserved_cents == 0 and spent_cents == 0 and status == OPEN (exact compensation, no drift)"
            - "after reserve(9000) + settle(9000): reserved_cents == 0, spent_cents == 9000, and utilization was 9000 before and after the settle (conserved when actual == reservation)"
            - "FundingGrant.${grant5}.status remained OPEN throughout because utilization never reached 40000"
      - name: loan_checkout_return_counter_invariant
        grounds:
          - state_machines.Loan.ACTIVE_to_RETURNED
          - state_machines.ScanItem.LENDABLE_to_ON_LOAN
          - state_machines.ScanItem.ON_LOAN_to_LENDABLE
          - calculations.patron_loan_cap
        distinguishing_aspect: |
          Conserved quantity: the loan/accounting pair (patron
          active_loan_count, item occupancy) — checkout followed by return
          restores patron.active_loan_count to its pre-checkout value, returns
          the item to LENDABLE, and leaves zero ACTIVE loans for the pair
          (a different conserved quantity from grant cents).
        test_recipe:
          setup:
            - "Work W12 with LENDABLE item I12; patron P14 with active_loan_count == 0 and no waitlist entries."
          setup_api_calls:
            - call: "POST /archive/_clock/set_current_utc"
              payload: { to_iso8601: "2026-09-01T00:00:00Z" }
              as: Admin
            - call: "POST /archive/partner-libraries"
              payload: { library_code: "LIB-K", display_name: "Library K", storage_commitment_years: 5 }
              as: LibraryAdmin
              captures: { lib11: $.data.id }
            - call: "POST /archive/works"
              payload: { title: "Invariant Tract", author: "K. Balance", publication_year: 2018 }
              as: Admin
              captures: { work12: $.data.id }
            - call: "POST /archive/scan-batches"
              payload: { operator_code: "op-11" }
              as: ScanOperator
              captures: { batch11: $.data.id }
            - call: "POST /archive/items"
              payload: { batch_id: "${batch11}", work_id: "${work12}", owning_library_id: "${lib11}", page_count: 100, condition_grade: "GOOD" }
              as: ScanOperator
              captures: { item12: $.data.id }
            - call: "POST /archive/scan-batches/${batch11}/seal"
              payload: {}
              as: ScanOperator
            - call: "POST /archive/patrons"
              payload: { email: "p14@example.org", full_name: "Patron Fourteen" }
              as: Anonymous
              captures: { pat14: $.data.id }
          trigger:
            - call: "POST /archive/loans"
              payload: { item_id: "${item12}", patron_id: "${pat14}", loan_kind: "STANDARD" }
              as: Patron
              as_user_id: "${pat14}"
              captures: { loan12: $.data.id }
            - call: "POST /archive/loans/${loan12}/return"
              payload: {}
              as: Patron
              as_user_id: "${pat14}"
          assert:
            - "at peak: Patron.${pat14}.active_loan_count == 1 and ScanItem.${item12}.status == ON_LOAN"
            - "after return: Patron.${pat14}.active_loan_count == 0 (restored) and ScanItem.${item12}.status == LENDABLE (restored)"
            - "GET /archive/patrons/${pat14}/loans?status=ACTIVE returns 0 rows and GET /archive/items/${item12}/loans?status=RETURNED returns 1 row"
            - "Patron.${pat14}.strike_count == 0 (a return is not an expiry; the strike counter is untouched by the compensated pair)"
