  # ===========================================================================
  # Rule 3 — non_linear_state_machine (different entities)
  # ===========================================================================
  - rule_id: non_linear_state_machine
    instances:
      - name: assignment_parallel_dimensions
        grounds:
          - state_machines.Assignment
          - state_machines.AssignmentPaymentDimension
          - entities.Assignment.fields.editorial_status
          - entities.Assignment.fields.payment_status
        distinguishing_aspect: |
          Parallel state dimensions on the Assignment entity: editorial_status
          reaches the terminal KILLED while payment_status independently walks
          UNINVOICED -> INVOICED -> PAYABLE -> PAID. Editorial terminality does
          not freeze the payment axis — a killed assignment can still be
          invoiced and paid its kill fee.
        test_recipe:
          setup:
            - "DeskConfig defaults; DOMESTIC_US contributor with VERIFIED W9 and FLAT 80000 agreement"
            - "Assignment killed from IN_PROGRESS (final_fee_cents == 20000 via PRE_DELIVERY 25%)"
            - "Invoice submitted and verified against the KILLED assignment"
          setup_api_calls:
            - call: "POST /freelance-desk/desk-config"
              payload: {}
              as: DeskAdmin
            - call: "POST /freelance-desk/contributors"
              payload: { legal_name: "Killed Kate", email: "kate@x.com", tax_residency: "DOMESTIC_US" }
