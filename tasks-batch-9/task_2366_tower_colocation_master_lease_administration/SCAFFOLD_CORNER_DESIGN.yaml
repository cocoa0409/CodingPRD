        claim_type: tiered_pricing_boundary
        grounds:
          - calculations.equipment_line_load_units
          - calculations.equipment_line_load_units.constants.ELEV_TIER_1_LIMIT_FT
          - calculations.equipment_line_load_units.constants.ELEV_TIER_2_LIMIT_FT
        distinguishing_aspect: |
          The ladder is strict on the lower bound of each tier: a line mounted at exactly 100 ft
          takes 1.25 (62.5 load units) and one at exactly 200 ft takes 1.50 (75.0), while 99 ft
          takes 1.00 (50.0). The application rollup is 187.5 — inclusive-at-the-boundary tiering
          is the only reading that produces it.
        test_recipe:
          setup:
            - "Tower TIE (rated 9000), tenant TIE with an ACTIVE master lease and one DRAFT application."
          setup_api_calls:
            - call: "POST /tower-colo/towers"
              payload: { site_name: "Tier Edge Tower", structure_type: "MONOPOLE", rated_capacity_load_units: 9000, min_colocation_elevation_ft: 50, max_elevation_ft: 300, ground_space_total_sqft: 9000 }
