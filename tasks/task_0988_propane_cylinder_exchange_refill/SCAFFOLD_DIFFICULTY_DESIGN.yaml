              as: PlatformAdmin
              captures: { err: $.data.error_id }
          assert:
            - "P2 [2026-05-10, ...) created successfully: effective_from == P1.effective_to is adjacency, not overlap"
            - "P2.is_current == false (window starts in the future at default clock 2026-05-01)"
            - "P3 effective_from 2026-05-09: error_id == ERR_POLICY_WINDOW_OVERLAP (one day into P1's window)"

