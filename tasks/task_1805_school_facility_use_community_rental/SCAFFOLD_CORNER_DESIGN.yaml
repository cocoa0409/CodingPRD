        grounds: [state_machines.RentalRequest.UNDER_REVIEW_to_APPROVED, endpoints]
        distinguishing_aspect: "Approval fan-out verified end-to-end: Permit (ISSUED/DEPOSIT_PENDING), PROVISIONAL Invoice ISSUED, CustodialWorkOrder SCHEDULED, request APPROVED, RentalRequest.version incremented — all from one approve call, visible in the same response reads."
