    roles: [FeedMillOperator]
    code: 200
    input: [rejection_reason]
    output: FeedOrder
    side_effects: ["status=REJECTED"]

  - method: POST
    path: "/vfd/feed-orders/{id}/cancel"
    description: "Cancel a feed order (Producer or system)"
    roles: [Producer, Inspector]
    code: 200
    input: []
    output: FeedOrder
    side_effects: ["If was VALIDATED: VFD quota restored (compensating), FeedMill.pending_order_count -= 1, VFD.version incremented"]

  - method: POST
    path: "/vfd/feed-orders/{id}/ship"
    description: "Ship a validated feed order"
    roles: [FeedMillOperator]
    code: 200
    input: [tons_shipped]
    output: FeedShipment
    side_effects: ["FeedOrder.status=SHIPPED; FeedShipment created IN_TRANSIT"]

  # --- FeedShipment ---
  - method: GET
    path: "/vfd/feed-shipments/{id}"
    description: "Get a shipment"
    roles: [Inspector, Veterinarian, FeedMillOperator, Producer]
    code: 200
    input: []
    output: FeedShipment
    side_effects: []

  - method: GET
    path: "/vfd/feed-orders/{id}/feed-shipments"
    description: "List shipments for an order"
    roles: [Inspector, Veterinarian, FeedMillOperator, Producer]
    code: 200
    input: ["limit?", "offset?"]
    output: "FeedShipment[]"
    side_effects: []

  - method: POST
    path: "/vfd/feed-shipments/{id}/deliver"
    description: "Confirm delivery (Producer)"
    roles: [Producer]
    code: 200
    input: [last_feed_consumed_at]
    output: FeedShipment
    side_effects: ["status=DELIVERED; FeedOrder.status=DELIVERED; WithdrawalPlan finalized or violated; FeedMill.pending_order_count -= 1"]

  - method: POST
    path: "/vfd/feed-shipments/{id}/return"
    description: "Return shipment (Producer)"
    roles: [Producer]
    code: 200
    input: []
    output: FeedShipment
    side_effects: ["status=RETURNED; FeedOrder.status=CANCELLED; compensating quota return"]

  - method: POST
    path: "/vfd/feed-shipments/{id}/reject-receipt"
    description: "Reject at receipt (Producer)"
    roles: [Producer]
    code: 200
    input: []
    output: FeedShipment
    side_effects: ["status=REJECTED_AT_RECEIPT; same compensation as RETURNED"]

  # --- WithdrawalPlan ---
  - method: GET
    path: "/vfd/withdrawal-plans/{id}"
    description: "Get a withdrawal plan"
    roles: [Inspector, Veterinarian, FeedMillOperator, Producer]
    code: 200
    input: []
    output: WithdrawalPlan
    side_effects: []

  - method: GET
    path: "/vfd/feed-orders/{id}/withdrawal-plans"
    description: "List withdrawal plans for an order (0 or 1)"
    roles: [Inspector, Veterinarian, FeedMillOperator, Producer]
    code: 200
    input: []
    output: "WithdrawalPlan[]"
    side_effects: []

  # --- DistributorAcknowledgment ---
  - method: POST
    path: "/vfd/feed-mills/{id}/distributor-acknowledgments"
    description: "Record a distributor acknowledgment letter"
    roles: [FeedMillOperator, Inspector]
    code: 201
    input: [distributor_name, covers_drug_id, statement_text]
    output: DistributorAcknowledgment
    side_effects: ["status=ACKNOWLEDGED, acknowledged_at=now"]

  - method: GET
    path: "/vfd/feed-mills/{id}/distributor-acknowledgments"
    description: "List acknowledgments for a mill"
    roles: [Inspector, FeedMillOperator]
    code: 200
    input: ["limit?", "offset?", "covers_drug_id?", "status?"]
    output: "DistributorAcknowledgment[]"
    side_effects: []

  - method: GET
    path: "/vfd/distributor-acknowledgments"
    description: "Filtered list of acknowledgments (reverse-reachability for covers_drug_id FK)"
    roles: [Inspector, FeedMillOperator]
    code: 200
    input: ["limit?", "offset?", "covers_drug_id?", "feed_mill_id?", "status?"]
    output: "DistributorAcknowledgment[]"
    side_effects: []

  - method: GET
    path: "/vfd/distributor-acknowledgments/{id}"
    description: "Get an acknowledgment"
    roles: [Inspector, FeedMillOperator]
    code: 200
    input: []
    output: DistributorAcknowledgment
    side_effects: []

  # --- ResidueCase ---
  - method: POST
    path: "/vfd/producers/{id}/residue-cases"
    description: "Open a residue case on a producer"
    roles: [Inspector]
    code: 201
    input: [feed_order_id, detected_at, "residue_ppb?", "tolerance_ppb?", investigator_id]
    output: ResidueCase
    side_effects: ["status=OPEN"]

  - method: GET
    path: "/vfd/residue-cases/{id}"
    description: "Get a residue case"
    roles: [Inspector, Veterinarian, FeedMillOperator, Producer]
    code: 200
    input: []
    output: ResidueCase
    side_effects: []

  - method: GET
    path: "/vfd/producers/{id}/residue-cases"
    description: "List residue cases for a producer"
    roles: [Inspector, Veterinarian, Producer]
    code: 200
    input: ["limit?", "offset?", "status?"]
    output: "ResidueCase[]"
    side_effects: []

  - method: GET
    path: "/vfd/residue-cases"
    description: "Filtered list of residue cases (reverse-reachability for feed_order_id FK)"
    roles: [Inspector, Veterinarian, Producer, FeedMillOperator]
    code: 200
    input: ["limit?", "offset?", "status?", "producer_id?", "feed_order_id?"]
    output: "ResidueCase[]"
    side_effects: []

  - method: POST
    path: "/vfd/residue-cases/{id}/open-investigation"
    description: "Begin investigation"
    roles: [Inspector]
    code: 200
    input: []
    output: ResidueCase
    side_effects: ["status=UNDER_INVESTIGATION"]

  - method: POST
    path: "/vfd/residue-cases/{id}/confirm"
    description: "Confirm residue violation"
    roles: [Inspector]
    code: 200
    input: [residue_ppb, tolerance_ppb]
    output: ResidueCase
    side_effects: ["severity_tier computed; penalty_score_deduction computed; issuing clinic.compliance_score debited; audit_ready recomputed"]

  - method: POST
    path: "/vfd/residue-cases/{id}/dismiss"
    description: "Dismiss a residue case"
    roles: [Inspector]
    code: 200
    input: []
    output: ResidueCase
    side_effects: ["status=DISMISSED"]

  # --- AuditBundle ---
  - method: POST
    path: "/vfd/producers/{id}/audit-bundles"
    description: "Open an audit on a producer"
    roles: [Inspector]
    code: 201
    input: [window_start, window_end]
    output: AuditBundle
    side_effects: ["status=OPEN; required_record_count computed; produced_record_count=0"]

  - method: GET
    path: "/vfd/audit-bundles/{id}"
    description: "Get an audit bundle"
    roles: [Inspector, Producer]
    code: 200
    input: []
    output: AuditBundle
    side_effects: []

  - method: GET
    path: "/vfd/producers/{id}/audit-bundles"
    description: "List audit bundles for a producer"
    roles: [Inspector, Producer]
    code: 200
    input: ["limit?", "offset?", "status?"]
    output: "AuditBundle[]"
    side_effects: []

  - method: POST
    path: "/vfd/audit-bundles/{id}/record-produced"
    description: "Mark a record produced for the audit (increments produced_record_count)"
    roles: [Producer]
    code: 200
    input: []
    output: AuditBundle
    side_effects: ["produced_record_count += 1"]

  - method: POST
    path: "/vfd/audit-bundles/{id}/close"
    description: "Close audit as COMPLETE"
    roles: [Inspector]
    code: 200
    input: []
    output: AuditBundle
    side_effects: ["status=COMPLETE iff produced == required; else ERR_AUDIT_INCOMPLETE"]

  - method: POST
    path: "/vfd/audit-bundles/{id}/mark-deficient"
    description: "Mark audit DEFICIENT (cascades producer suspension)"
    roles: [Inspector]
    code: 200
    input: []
    output: AuditBundle
    side_effects: ["status=DEFICIENT; Producer.status=SUSPENDED; Producer's VFDs cascade EXPIRED"]

# =============================================================================
# §1.6 Error Code Catalog
# =============================================================================
errors:
  - { id: ERR_UNAUTHENTICATED, http: 401, condition: "Missing or malformed X-User-Role / X-User-ID headers" }
  - { id: ERR_UNAUTHORIZED, http: 403, condition: "Role not permitted for this endpoint" }
  - { id: ERR_FORBIDDEN, http: 403, condition: "Entity-backed identity mismatch (e.g., Producer not owner of order; Veterinarian not issuer of VFD)" }
  - { id: ERR_NOT_FOUND, http: 404, condition: "Referenced resource does not exist" }
  - { id: ERR_INVALID_REQUEST, http: 400, condition: "Missing required field, malformed payload, or invalid enum value" }
  - { id: ERR_INVALID_STATE, http: 409, condition: "Target resource is in a state that does not permit this transition" }
  - { id: ERR_STALE_VERSION, http: 412, condition: "expected_vfd_authorization_version does not match current VFD version" }
  - { id: ERR_EXTRA_LABEL_USE, http: 422, condition: "Attempted extra-label use of a VFD drug (prohibited per 21 CFR 530)" }
  - { id: ERR_SPECIES_CLASS_MISMATCH, http: 422, condition: "Animal group's species:class not in drug's allowed_species_classes" }
  - { id: ERR_VCPR_NOT_VERIFIED, http: 422, condition: "No ACTIVE VCPR covering (vet, producer) at required moment" }
  - { id: ERR_RESIDUE_CASE_OPEN, http: 422, condition: "Producer has an OPEN ResidueCase blocking validation" }
  - { id: ERR_VFD_EXPIRED, http: 409, condition: "Logical clock >= VFD expiration_date" }
  - { id: ERR_VFD_NOT_USABLE, http: 409, condition: "VFD status not in {ISSUED, PARTIALLY_USED}" }
  - { id: ERR_VFD_DURATION_EXCEEDED, http: 422, condition: "VFD expiration_date more than 6 months past issued_on" }
  - { id: ERR_VFD_QUOTA_EXCEEDED, http: 409, condition: "Order animal_count exceeds VFD remaining_animal_count" }
  - { id: ERR_PRODUCER_SUSPENDED, http: 409, condition: "Producer status is SUSPENDED or DEBARRED" }
  - { id: ERR_VET_INACTIVE, http: 409, condition: "Veterinarian status is SUSPENDED or REVOKED" }
  - { id: ERR_ACK_MISSING, http: 422, condition: "No ACKNOWLEDGED DistributorAcknowledgment covers (feed_mill, drug) at ship time" }
  - { id: ERR_AUDIT_INCOMPLETE, http: 409, condition: "produced_record_count < required_record_count on audit close" }
  - { id: ERR_DUPLICATE_DRUG_CODE, http: 409, condition: "VfdDrug.drug_code already exists" }
  - { id: ERR_DUPLICATE_PREMISE, http: 409, condition: "Producer.premise_id already exists" }
  - { id: ERR_DUPLICATE_FDA_REG, http: 409, condition: "FeedMill.fda_registration already exists" }
  - { id: ERR_DUPLICATE_CLINIC_LICENSE, http: 409, condition: "VeterinaryClinic.license_number already exists" }

# =============================================================================
# §1.7 RBAC Matrix
# =============================================================================
roles:
  - name: Inspector
    description: "Regulatory inspector; system administrator for the VFD registry; owns clock, clinic/mill/drug/producer onboarding, residue cases, audits, vet discipline"
    identity: opaque
    exclusive_operations:
      - "POST /vfd/_clock/set_current_utc"
      - "POST /vfd/clinics"
      - "POST /vfd/clinics/{id}/veterinarians"
      - "POST /vfd/veterinarians/{id}/suspend, /reinstate, /revoke"
      - "POST /vfd/producers"
      - "POST /vfd/drugs"
      - "POST /vfd/feed-mills"
      - "POST /vfd/producers/{id}/residue-cases"
      - "POST /vfd/residue-cases/{id}/open-investigation, /confirm, /dismiss"
      - "POST /vfd/producers/{id}/audit-bundles"
      - "POST /vfd/audit-bundles/{id}/close, /mark-deficient"
    shared_operations:
      - "GET most entities"
      - "POST /vfd/feed-orders/{id}/cancel (admin override)"

  - name: Veterinarian
    description: "Licensed DVM; issues VFDs and VCPRs; revokes own VFDs and VCPRs"
    identity: "entity_backed:Veterinarian"
    exclusive_operations:
      - "POST /vfd/vcp-verifications"
      - "POST /vfd/vcp-verifications/{id}/revoke"
      - "POST /vfd/vfd-authorizations"
      - "POST /vfd/vfd-authorizations/{id}/revoke"
    shared_operations:
      - "GET most entities"
    # Segregation of duties: a Veterinarian CANNOT validate/ship feed orders (mill's job)

  - name: FeedMillOperator
    description: "Feed mill compliance operator; validates and ships feed orders against VFDs"
    identity: "entity_backed:FeedMill"
    exclusive_operations:
      - "POST /vfd/feed-mills/{id}/feed-orders"
      - "POST /vfd/feed-orders/{id}/validate"
      - "POST /vfd/feed-orders/{id}/reject"
      - "POST /vfd/feed-orders/{id}/ship"
      - "POST /vfd/feed-mills/{id}/distributor-acknowledgments"
    shared_operations:
      - "GET most entities"
    # Segregation of duties: a FeedMillOperator CANNOT issue VFDs nor confirm residue cases

  - name: Producer
    description: "Livestock producer; owns animal groups, receives shipments, attests last-feed time"
    identity: "entity_backed:Producer"
    exclusive_operations:
      - "POST /vfd/producers/{id}/animal-groups"
      - "POST /vfd/feed-orders/{id}/cancel"
      - "POST /vfd/feed-shipments/{id}/deliver, /return, /reject-receipt"
      - "POST /vfd/audit-bundles/{id}/record-produced"
    shared_operations:
      - "GET most entities"
