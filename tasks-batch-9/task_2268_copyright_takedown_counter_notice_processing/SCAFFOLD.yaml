# Table 6: Error Code Catalog (§1.6)
# =============================================================================
errors:
  - id: ERR_UNAUTHENTICATED
    http: 401
    condition: "X-User-Role or X-User-ID header missing, or the role is not one of the five declared roles"
  - id: ERR_FORBIDDEN_ROLE
    http: 403
    condition: "the acting role is not listed in the endpoint's roles"
  - id: ERR_NOT_RESOURCE_OWNER
    http: 403
    condition: "an entity-backed role acts on a resource that does not belong to its own entity id"
  - id: ERR_SEGREGATION_OF_DUTIES
    http: 403
    condition: "the acting X-User-ID already performed the conflicting step (executed the termination, or opened the misrepresentation case)"
  - id: ERR_INVALID_REQUEST
    http: 400
    condition: "missing required field, enum out of range, malformed fingerprint_hash, empty or oversized claimed_urls, limit or offset out of range, limitation threshold not below termination threshold"

  - id: ERR_PROVIDER_NOT_FOUND
