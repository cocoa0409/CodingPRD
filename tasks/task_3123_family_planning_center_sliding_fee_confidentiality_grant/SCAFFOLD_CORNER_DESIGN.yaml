# =============================================================================
# §1.9 Scaffold Corner Design (Coverage Index for Non-Difficulty Tests)
# Task: task_3123_family_planning_center_sliding_fee_confidentiality_grant
# Breadth probe over §1.1-§1.7 claims not already exercised by §1.8.
# Corners §1.8 covers appear as excluded_because stubs.
# Anchors &c_* are defined once in the first entities instance and aliased below.
# =============================================================================
scaffold_corner_design:

  # ===========================================================================
  - section: entities
    instances:
      - name: affiliate_create_returns_defaults_and_system_fields
        claim_type: Creation
        grounds:
          - entities.Affiliate
          - endpoints.POST_/family-planning/affiliates
        distinguishing_aspect: "Creating an affiliate with the three required inputs returns 201 with status ACTIVE, grant_cycle_open true, version 1, and server-minted id/created_at/updated_at — status and grant_cycle_open are never client-supplied."
        test_recipe:
          setup:
            - "Logical clock at 2026-09-01T00:00:00Z. Empty database."
          setup_api_calls:
            - &c_clock
              call: "POST /family-planning/_clock/set_current_utc"
              payload: { to_iso8601: "2026-09-01T00:00:00Z" }
              as: GrantAdministrator
          trigger:
            - &c_aff
              call: "POST /family-planning/affiliates"
              payload: { affiliate_code: "PP-NM-02", state_code: "NM", low_income_priority_quota: 40 }
              as: GrantAdministrator
              captures: { c_aff_id: $.data.id, c_aff_v: $.data.version }
          assert:
            - "status 201, response_type object, data.id is a prefix-free UUID"
            - "Affiliate.${c_aff_id}.status == ACTIVE and grant_cycle_open == true and version == 1"
            - "Affiliate.${c_aff_id}.affiliate_code == \"PP-NM-02\" and state_code == \"NM\" and low_income_priority_quota == 40"
            - "meta.api_request_id and meta.api_request_timestamp are present"

      - name: patient_get_round_trips_computed_is_minor
        claim_type: Computed Fields
        grounds:
          - entities.Patient.fields.is_minor
          - endpoints.GET_/family-planning/patients/{patientId}
        distinguishing_aspect: "is_minor is computed from the logical clock, not stored from input: a patient born 2012-01-01 is_minor true at clock 2026-09-01 and false after the clock passes their 18th birthday in 2030."
        test_recipe:
          setup:
            - "Logical clock 2026-09-01. One affiliate. One patient born 2012-01-01."
          setup_api_calls:
            - *c_clock
            - *c_aff
            - call: "POST /family-planning/affiliates/${c_aff_id}/patients"
              payload: { external_ref: "MIN-1", date_of_birth: "2012-01-01" }
              as: FrontDeskStaff
              captures: { c_min_id: $.data.id }
          trigger:
            - call: "GET /family-planning/patients/${c_min_id}"
              payload: {}
              as: PrivacyOfficer
              captures: { c_minor_now: $.data.is_minor }
            - call: "POST /family-planning/_clock/set_current_utc"
              payload: { to_iso8601: "2030-01-02T00:00:00Z" }
              as: GrantAdministrator
            - call: "GET /family-planning/patients/${c_min_id}"
              payload: {}
              as: PrivacyOfficer
              captures: { c_minor_later: $.data.is_minor }
          assert:
            - "at clock 2026-09-01: Patient.${c_min_id}.is_minor == true (input false ignored — computed field)"
            - "at clock 2030-01-02: Patient.${c_min_id}.is_minor == false"

      - name: household_assessment_household_size_zero_rejected
        claim_type: Type Constraints
        grounds:
          - entities.HouseholdAssessment.fields.household_size
          - errors.ERR_INVALID_REQUEST
        distinguishing_aspect: "household_size declares >= 1; household_size 0 is a 400 ERR_INVALID_REQUEST, not a divide-by-zero in fpl_percentage and not a 422."
        test_recipe:
          setup:
            - "Logical clock 2026-09-01. One affiliate, one adult patient."
          setup_api_calls:
            - *c_clock
            - *c_aff
            - &c_pat
              call: "POST /family-planning/affiliates/${c_aff_id}/patients"
              payload: { external_ref: "HS-1", date_of_birth: "1990-01-01" }
              as: FrontDeskStaff
              captures: { c_pat_id: $.data.id, c_pat_v: $.data.version }
          trigger:
            - call: "POST /family-planning/patients/${c_pat_id}/household-assessments"
              payload: { household_size: 0, annual_income_cents: 1000000, income_basis: "DOCUMENTED", expected_patient_version: "${c_pat_v}" }
              as: FrontDeskStaff
              captures: { err_id: $.data.error_id }
          assert:
            - "status 400 and error_id == ERR_INVALID_REQUEST"
            - "GET /family-planning/patients/${c_pat_id}/household-assessments returns 0 rows"

      - name: fee_tier_defaults_nominal_copay_to_zero
        claim_type: Defaults
        grounds:
          - entities.FeeScheduleTier.fields.nominal_copay_cents
        distinguishing_aspect: "nominal_copay_cents declares default 0; omitting it stores 0 (not null) and a 100% discount then yields charge 0 with no copay floor."
        test_recipe:
          setup:
            - "Logical clock 2026-09-01. One affiliate."
          setup_api_calls:
            - *c_clock
            - *c_aff
          trigger:
            - call: "POST /family-planning/affiliates/${c_aff_id}/fee-tiers"
              payload: { tier_code: "Z", fpl_pct_min_inclusive: 0, fpl_pct_max_exclusive: 50, discount_pct: 100, requires_documentation: false }
              as: GrantAdministrator
              captures: { c_tierz_id: $.data.id }
          assert:
            - "status 201 and FeeScheduleTier.${c_tierz_id}.nominal_copay_cents == 0 (integer zero, not null)"

      - name: patient_list_paginates_with_envelope_fields
        claim_type: Listing
        grounds:
          - endpoints.GET_/family-planning/affiliates/{affiliateId}/patients
          - response_envelope.pagination_fields
          - response_envelope.pagination_defaults
        distinguishing_aspect: "With three patients, limit=2&offset=0 returns 2 rows with total_count 3 and has_more true; offset=2 returns 1 row with has_more false; no params defaults to limit 10 offset 0."
        test_recipe:
          setup:
            - "Logical clock 2026-09-01. One affiliate with three patients."
          setup_api_calls:
            - *c_clock
            - *c_aff
            - call: "POST /family-planning/affiliates/${c_aff_id}/patients"
              payload: { external_ref: "LP-1", date_of_birth: "1990-01-01" }
              as: FrontDeskStaff
            - call: "POST /family-planning/affiliates/${c_aff_id}/patients"
              payload: { external_ref: "LP-2", date_of_birth: "1991-01-01" }
              as: FrontDeskStaff
            - call: "POST /family-planning/affiliates/${c_aff_id}/patients"
              payload: { external_ref: "LP-3", date_of_birth: "1992-01-01" }
              as: FrontDeskStaff
          trigger:
            - call: "GET /family-planning/affiliates/${c_aff_id}/patients"
              payload: { limit: 2, offset: 0 }
              as: FrontDeskStaff
          assert:
            - "response_type array, exactly 2 rows, total_count == 3, has_more == true"
            - "offset=2 returns exactly 1 row with total_count == 3 and has_more == false"
            - "no query params returns 3 rows (defaults limit 10 offset 0)"

      - name: claim_get_unknown_id_returns_claim_not_found
        claim_type: Not Found
        grounds:
          - endpoints.GET_/family-planning/claims/{claimId}
          - errors.ERR_CLAIM_NOT_FOUND
        distinguishing_aspect: "A syntactically valid but unallocated claim id yields the entity-specific 404 ERR_CLAIM_NOT_FOUND, not a generic 404 body and not 400."
        test_recipe:
          setup:
            - "Logical clock 2026-09-01. Empty database."
          setup_api_calls:
            - *c_clock
          trigger:
            - call: "GET /family-planning/claims/00000000-0000-4000-8000-000000000000"
              payload: {}
              as: BillingSpecialist
              captures: { err_id: $.data.error_id }
          assert:
            - "status 404, error_id == ERR_CLAIM_NOT_FOUND, response_type error, data carries error_id and message"

  # ===========================================================================
  - section: state_machines
    instances:
      - name: encounter_initial_state_is_scheduled_unbilled
        claim_type: Initial State
        grounds:
          - state_machines.Encounter
          - endpoints.POST_/family-planning/patients/{patientId}/encounters
        distinguishing_aspect: "A newly created encounter starts clinical_status SCHEDULED and billing_status UNBILLED with version 1 — neither axis is client-settable at creation."
        test_recipe:
          setup:
            - "Logical clock 2026-09-01. Affiliate, tier D, in-scope catalog entry, licensed provider, adult tier-D patient with CURRENT assessment."
          setup_api_calls:
            - *c_clock
            - *c_aff
            - &c_tier_d
              call: "POST /family-planning/affiliates/${c_aff_id}/fee-tiers"
              payload: { tier_code: "D", fpl_pct_min_inclusive: 0, fpl_pct_max_exclusive: 1000, discount_pct: 0, nominal_copay_cents: 0, requires_documentation: false }
              as: GrantAdministrator
            - &c_cat
              call: "POST /family-planning/affiliates/${c_aff_id}/service-catalog"
              payload: { service_code: "CONTRACEPTIVE_COUNSELING", in_scope: true, telehealth_eligible: true, full_fee_cents: 20000 }
              as: GrantAdministrator
            - &c_prov
              call: "POST /family-planning/affiliates/${c_aff_id}/providers"
              payload: { display_name: "Dr. Corner", provider_type: "NP" }
              as: GrantAdministrator
              captures: { c_prov_id: $.data.id }
            - &c_lic
              call: "POST /family-planning/providers/${c_prov_id}/licenses"
              payload: { state_code: "NM", valid_from: "2026-01-01T00:00:00Z", valid_until: "2027-01-01T00:00:00Z" }
              as: GrantAdministrator
            - *c_pat
            - &c_asm
              call: "POST /family-planning/patients/${c_pat_id}/household-assessments"
              payload: { household_size: 1, annual_income_cents: 4000000, income_basis: "DOCUMENTED", expected_patient_version: "${c_pat_v}" }
              as: FrontDeskStaff
          trigger:
            - &c_enc
              call: "POST /family-planning/patients/${c_pat_id}/encounters"
              payload: { service_code: "CONTRACEPTIVE_COUNSELING", provider_id: "${c_prov_id}", channel: "IN_PERSON", scheduled_start: "2026-09-10T10:00:00Z", scheduled_end: "2026-09-10T10:30:00Z" }
              as: FrontDeskStaff
              captures: { c_enc_id: $.data.id }
          assert:
            - "Encounter.${c_enc_id}.clinical_status == SCHEDULED and billing_status == UNBILLED and version == 1"
            - "Encounter.${c_enc_id}.patient_charge_cents == 20000 (tier D, no discount)"

      - name: encounter_start_before_scheduled_start_rejected
        claim_type: Precondition Enforcement
        grounds:
          - state_machines.Encounter.transitions
          - errors.ERR_INVALID_STATE
        distinguishing_aspect: "start requires the logical clock to be at or past scheduled_start; starting a future encounter is a 409 ERR_INVALID_STATE — the clock gate is part of the transition precondition."
        test_recipe:
          setup:
            - "Logical clock 2026-09-01 (before the encounter's 2026-09-10 slot). Standard affiliate/catalog/provider/patient/assessment setup. One SCHEDULED encounter."
          setup_api_calls:
            - *c_clock
            - *c_aff
            - *c_tier_d
            - *c_cat
            - *c_prov
            - *c_lic
            - *c_pat
            - *c_asm
            - *c_enc
          trigger:
            - call: "POST /family-planning/encounters/${c_enc_id}/start"
              payload: {}
              as: Clinician
              captures: { err_id: $.data.error_id }
          assert:
            - "status 409 and error_id == ERR_INVALID_STATE"
            - "Encounter.${c_enc_id}.clinical_status still == SCHEDULED"

      - name: encounter_complete_from_scheduled_is_invalid_transition
        claim_type: Invalid Transition
        grounds:
          - state_machines.Encounter
          - errors.ERR_INVALID_STATE
        distinguishing_aspect: "complete is only legal from IN_PROGRESS; from SCHEDULED it is rejected and no device reservations would be fulfilled."
        test_recipe:
          setup:
            - "Logical clock advanced to the encounter slot. Standard setup; one SCHEDULED encounter, never started."
          setup_api_calls:
            - *c_clock
            - *c_aff
            - *c_tier_d
            - *c_cat
            - *c_prov
            - *c_lic
            - *c_pat
            - *c_asm
            - *c_enc
            - call: "POST /family-planning/_clock/set_current_utc"
              payload: { to_iso8601: "2026-09-10T10:00:00Z" }
              as: GrantAdministrator
          trigger:
            - call: "POST /family-planning/encounters/${c_enc_id}/complete"
              payload: {}
              as: Clinician
              captures: { err_id: $.data.error_id }
          assert:
            - "status 409 and error_id == ERR_INVALID_STATE"
            - "Encounter.${c_enc_id}.clinical_status == SCHEDULED and billing_status == UNBILLED"

      - name: affiliate_terminal_close_locks_all_further_transitions
        claim_type: Terminal State Lockdown
        grounds:
          - state_machines.Affiliate
          - errors.ERR_INVALID_STATE
        distinguishing_aspect: "From CLOSED no transition exists: suspend, reinstate, and close again are all 409 ERR_INVALID_STATE on a closed affiliate."
        test_recipe:
          setup:
            - "Logical clock 2026-09-01. One affiliate with no open encounters, already CLOSED."
          setup_api_calls:
            - *c_clock
            - *c_aff
            - call: "POST /family-planning/affiliates/${c_aff_id}/close"
              payload: {}
              as: GrantAdministrator
          trigger:
            - call: "POST /family-planning/affiliates/${c_aff_id}/suspend"
              payload: {}
              as: GrantAdministrator
              captures: { err_id: $.data.error_id }
          assert:
            - "status 409 and error_id == ERR_INVALID_STATE"
            - "Affiliate.${c_aff_id}.status == CLOSED"

      - name: referral_order_full_path_open_acknowledged_completed
        claim_type: Valid Transition
        grounds:
          - state_machines.ReferralOrder
        distinguishing_aspect: "The referral pipeline OPEN -> ACKNOWLEDGED -> COMPLETED works end to end, and withdraw from COMPLETED (a terminal state) is rejected."
        test_recipe:
          setup:
            - "Logical clock 2026-09-01. Standard setup; one SCHEDULED encounter; one OPEN referral created on it."
          setup_api_calls:
            - *c_clock
            - *c_aff
            - *c_tier_d
            - *c_cat
            - *c_prov
            - *c_lic
            - *c_pat
            - *c_asm
            - *c_enc
            - call: "POST /family-planning/encounters/${c_enc_id}/referral-orders"
              payload: { requested_service_code: "PRENATAL_CARE", receiving_org: "County Health", reason_code: "OUT_OF_SCOPE_AFFILIATE" }
              as: Clinician
              captures: { c_ref_id: $.data.id }
          trigger:
            - call: "POST /family-planning/referral-orders/${c_ref_id}/acknowledge"
              payload: {}
              as: CareCoordinator
            - call: "POST /family-planning/referral-orders/${c_ref_id}/complete"
              payload: {}
              as: CareCoordinator
            - call: "POST /family-planning/referral-orders/${c_ref_id}/withdraw"
              payload: {}
              as: CareCoordinator
              captures: { err_id: $.data.error_id }
          assert:
            - "after acknowledge: status == ACKNOWLEDGED; after complete: status == COMPLETED"
            - "withdraw from COMPLETED: status 409 and error_id == ERR_INVALID_STATE"
            - "ReferralOrder.${c_ref_id}.status == COMPLETED"

      - name: grant_report_finalize_then_amendment_supersedes
        claim_type: Side Effect Execution
        grounds:
          - state_machines.GrantReport
        distinguishing_aspect: "Creating a report with amendment_of a FINALIZED report flips the amended report to SUPERSEDED (system transition) while the amendment lands as DRAFT with its own aggregates."
        test_recipe:
          setup:
            - "Logical clock 2026-10-02 (September period closed). Affiliate with no encounters; original report FINALIZED over [2026-09-01, 2026-10-01)."
          setup_api_calls:
            - *c_clock
            - *c_aff
            - call: "POST /family-planning/_clock/set_current_utc"
              payload: { to_iso8601: "2026-10-02T00:00:00Z" }
              as: GrantAdministrator
            - call: "POST /family-planning/affiliates/${c_aff_id}/grant-reports"
              payload: { period_start: "2026-09-01T00:00:00Z", period_end: "2026-10-01T00:00:00Z", valuation_variant: "FIFO", expected_affiliate_version: "${c_aff_v}" }
              as: GrantAdministrator
              captures: { c_rep1_id: $.data.id }
            - call: "POST /family-planning/grant-reports/${c_rep1_id}/finalize"
              payload: {}
              as: GrantAdministrator
            - call: "GET /family-planning/affiliates/${c_aff_id}"
              payload: {}
              as: GrantAdministrator
              captures: { c_aff_v2: $.data.version }
          trigger:
            - call: "POST /family-planning/affiliates/${c_aff_id}/grant-reports"
              payload: { period_start: "2026-09-01T00:00:00Z", period_end: "2026-10-01T00:00:00Z", valuation_variant: "WEIGHTED_AVERAGE", amendment_of: "${c_rep1_id}", expected_affiliate_version: "${c_aff_v2}" }
              as: GrantAdministrator
              captures: { c_rep2_id: $.data.id }
          assert:
            - "GrantReport.${c_rep2_id}.status == DRAFT and amendment_of == ${c_rep1_id}"
            - "GrantReport.${c_rep1_id}.status == SUPERSEDED (system side effect)"
            - "GET /family-planning/grant-reports/${c_rep1_id}/amendments returns exactly 1 row (the amendment)"

  # ===========================================================================
  - section: calculations
    instances:
      - name: grant_quota_exact_equality_counts_as_met
        claim_type: Correct Result
        grounds:
          - calculations.grant_quota_check
          - entities.GrantReport.fields.low_income_quota_met
        distinguishing_aspect: "Boundary at exact equality: 2 low-income of 5 encounters against quota 40 gives 200 >= 200 -> true; a second affiliate with 1 non-low-income encounter against quota 41 gives 0 >= 41 -> false. Integer arithmetic, no float division."
        test_recipe:
          setup:
            - "Logical clock advanced past period end. Affiliate A (c_aff, quota 40) with five completed encounters: two patients at fpl 48 (low-income) and three at fpl 153 (not low-income). Affiliate B (quota 41) with one completed encounter whose patient is at fpl 265 (not low-income)."
          setup_api_calls:
            - *c_clock
            - *c_aff
            - &c_tier_a
              call: "POST /family-planning/affiliates/${c_aff_id}/fee-tiers"
              payload: { tier_code: "A", fpl_pct_min_inclusive: 0, fpl_pct_max_exclusive: 100, discount_pct: 100, nominal_copay_cents: 500, requires_documentation: true }
              as: GrantAdministrator
            - &c_tier_b
              call: "POST /family-planning/affiliates/${c_aff_id}/fee-tiers"
              payload: { tier_code: "B", fpl_pct_min_inclusive: 0, fpl_pct_max_exclusive: 150, discount_pct: 80, nominal_copay_cents: 500, requires_documentation: false }
              as: GrantAdministrator
            - &c_tier_c
              call: "POST /family-planning/affiliates/${c_aff_id}/fee-tiers"
              payload: { tier_code: "C", fpl_pct_min_inclusive: 150, fpl_pct_max_exclusive: 200, discount_pct: 50, nominal_copay_cents: 0, requires_documentation: false }
              as: GrantAdministrator
            - *c_tier_d
            - *c_cat
            - *c_prov
            - *c_lic
            - call: "POST /family-planning/_clock/set_current_utc"
              payload: { to_iso8601: "2026-09-10T12:00:00Z" }
              as: GrantAdministrator
            - call: "POST /family-planning/affiliates/${c_aff_id}/patients"
              payload: { external_ref: "Q-1", date_of_birth: "1990-01-01" }
              as: FrontDeskStaff
              captures: { q1: $.data.id, q1v: $.data.version }
            - call: "POST /family-planning/patients/${q1}/household-assessments"
              payload: { household_size: 4, annual_income_cents: 1500000, income_basis: "DOCUMENTED", expected_patient_version: "${q1v}" }
              as: FrontDeskStaff
            - call: "POST /family-planning/patients/${q1}/encounters"
              payload: { service_code: "CONTRACEPTIVE_COUNSELING", provider_id: "${c_prov_id}", channel: "IN_PERSON", scheduled_start: "2026-09-10T09:00:00Z", scheduled_end: "2026-09-10T09:30:00Z" }
              as: FrontDeskStaff
              captures: { qe1: $.data.id }
            - call: "POST /family-planning/affiliates/${c_aff_id}/patients"
              payload: { external_ref: "Q-2", date_of_birth: "1990-01-01" }
              as: FrontDeskStaff
              captures: { q2: $.data.id, q2v: $.data.version }
            - call: "POST /family-planning/patients/${q2}/household-assessments"
              payload: { household_size: 4, annual_income_cents: 1500000, income_basis: "DOCUMENTED", expected_patient_version: "${q2v}" }
              as: FrontDeskStaff
            - call: "POST /family-planning/patients/${q2}/encounters"
              payload: { service_code: "CONTRACEPTIVE_COUNSELING", provider_id: "${c_prov_id}", channel: "IN_PERSON", scheduled_start: "2026-09-10T09:30:00Z", scheduled_end: "2026-09-10T10:00:00Z" }
              as: FrontDeskStaff
              captures: { qe2: $.data.id }
            - call: "POST /family-planning/affiliates/${c_aff_id}/patients"
              payload: { external_ref: "Q-3", date_of_birth: "1990-01-01" }
              as: FrontDeskStaff
              captures: { q3: $.data.id, q3v: $.data.version }
            - call: "POST /family-planning/patients/${q3}/household-assessments"
              payload: { household_size: 4, annual_income_cents: 4800000, income_basis: "DOCUMENTED", expected_patient_version: "${q3v}" }
              as: FrontDeskStaff
            - call: "POST /family-planning/patients/${q3}/encounters"
              payload: { service_code: "CONTRACEPTIVE_COUNSELING", provider_id: "${c_prov_id}", channel: "IN_PERSON", scheduled_start: "2026-09-10T10:00:00Z", scheduled_end: "2026-09-10T10:30:00Z" }
              as: FrontDeskStaff
              captures: { qe3: $.data.id }
            - call: "POST /family-planning/affiliates/${c_aff_id}/patients"
              payload: { external_ref: "Q-4", date_of_birth: "1990-01-01" }
              as: FrontDeskStaff
              captures: { q4: $.data.id, q4v: $.data.version }
            - call: "POST /family-planning/patients/${q4}/household-assessments"
              payload: { household_size: 4, annual_income_cents: 4800000, income_basis: "DOCUMENTED", expected_patient_version: "${q4v}" }
              as: FrontDeskStaff
            - call: "POST /family-planning/patients/${q4}/encounters"
              payload: { service_code: "CONTRACEPTIVE_COUNSELING", provider_id: "${c_prov_id}", channel: "IN_PERSON", scheduled_start: "2026-09-10T10:30:00Z", scheduled_end: "2026-09-10T11:00:00Z" }
              as: FrontDeskStaff
              captures: { qe4: $.data.id }
            - call: "POST /family-planning/affiliates/${c_aff_id}/patients"
              payload: { external_ref: "Q-5", date_of_birth: "1990-01-01" }
              as: FrontDeskStaff
              captures: { q5: $.data.id, q5v: $.data.version }
            - call: "POST /family-planning/patients/${q5}/household-assessments"
              payload: { household_size: 4, annual_income_cents: 4800000, income_basis: "DOCUMENTED", expected_patient_version: "${q5v}" }
              as: FrontDeskStaff
            - call: "POST /family-planning/patients/${q5}/encounters"
              payload: { service_code: "CONTRACEPTIVE_COUNSELING", provider_id: "${c_prov_id}", channel: "IN_PERSON", scheduled_start: "2026-09-10T11:00:00Z", scheduled_end: "2026-09-10T11:30:00Z" }
              as: FrontDeskStaff
              captures: { qe5: $.data.id }
            - call: "POST /family-planning/encounters/${qe1}/start"
              payload: {}
              as: Clinician
            - call: "POST /family-planning/encounters/${qe1}/complete"
              payload: {}
              as: Clinician
