              as_user_id: "${fac}"
              captures: { st2: "$.data.status" }
            - call: "POST /modular/defect-claims/${claim}/adjudicate"
              payload: { adjudication_note: "evidence weighted" }
              as: WarrantyAdjudicator
              captures: { st3: "$.data.status", round3: "$.data.adjudication_round" }
            - call: "POST /modular/defect-claims/${claim}/dispute"
              payload: { dispute_note: "second appeal" }
              as: FactoryProductionManager
              as_user_id: "${fac}"
              captures: { err: "$.data.error_id" }
          assert:
            - "${st0} == 'OPEN' and ${round0} == 0"
            - "${st1} == 'ADJUDICATED' with ${round1} == 1, then ${st2} == 'DISPUTED'"
            - "${st3} == 'ADJUDICATED' with ${round3} == 2 — the same trigger re-enters the state it already visited"
            - "${err} == 'ERR_DISPUTE_ROUND_LIMIT' with HTTP 409 — the cycle terminates, it does not loop forever"
