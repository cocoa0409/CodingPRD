              payload: { stage: "PRINT", scanned_barcode: "${ec_p1_bar}", device_code: "SC-01" }
              as: IntegrityAuditor
            - call: "POST /bureau/mail-pieces/${ec_p1_id}/scans"
              payload: { stage: "INSERT", scanned_barcode: "${ec_p1_bar}", device_code: "SC-02" }
              as: IntegrityAuditor
            - call: "POST /bureau/mail-pieces/${ec_p1_id}/scans"
              payload: { stage: "INDUCT", scanned_barcode: "${ec_p1_bar}", device_code: "SC-03" }
              as: IntegrityAuditor
            - call: "POST /bureau/mail-pieces/${ec_p2_id}/scans"
              payload: { stage: "PRINT", scanned_barcode: "${ec_p2_bar}", device_code: "SC-01" }
              as: IntegrityAuditor
            - call: "POST /bureau/mail-pieces/${ec_p2_id}/scans"
              payload: { stage: "INSERT", scanned_barcode: "${ec_p2_bar}", device_code: "SC-02" }
              as: IntegrityAuditor
            - call: "POST /bureau/mail-pieces/${ec_p2_id}/scans"
              payload: { stage: "INDUCT", scanned_barcode: "${ec_p2_bar}", device_code: "SC-03" }
              as: IntegrityAuditor
            - call: "POST /bureau/print-runs/${ec_run_id}/complete"
              payload: {}
              as: ProductionScheduler
            - call: "POST /bureau/composition-jobs/${ec_job_id}/reconcile-integrity"
              payload: {}
              as: IntegrityAuditor
            - call: "GET /bureau/presort-batches?composition_job_id=${ec_job_id}"
              payload: {}
              as: PostageController
              captures: { ec_batch_id: "$.data[0].id" }
          trigger:
            - call: "POST /bureau/presort-batches/${ec_batch_id}/seal"
              payload: { expected_client_version: "${ec_client_v1}" }
              as: PostageController
              as_user_id: "postage-1"
              captures: { ec_est_1: "$.data.estimated_postage_cents" }
            - call: "POST /bureau/presort-batches/${ec_batch_id}/unseal"
              payload: {}
              as: PostageController
              as_user_id: "postage-1"
              captures: { ec_status_after_unseal: "$.data.status", ec_est_cleared: "$.data.estimated_postage_cents", ec_sealer_cleared: "$.data.sealed_by_user_id" }
            - call: "GET /bureau/clients/${ec_client_id}"
              payload: {}
              as: PostageController
              captures: { ec_client_v2: "$.data.version", ec_committed_mid: "$.data.postage_committed_cents", ec_available_mid: "$.data.postage_escrow_available_cents" }
            - call: "POST /bureau/presort-batches/${ec_batch_id}/seal"
              payload: { expected_client_version: "${ec_client_v2}" }
              as: PostageController
              as_user_id: "postage-1"
              captures: { ec_est_2: "$.data.estimated_postage_cents" }
          assert:
            - "Invariant at rest: ${ec_deposited} == 100000 and 100000 == 0 + 100000 (postage_committed_cents + postage_escrow_available_cents)"
            - "After the first seal: ${ec_est_1} == 112, Client.${ec_client_id}.postage_committed_cents == 112, postage_escrow_available_cents == 99888, and the invariant holds: 100000 == 112 + 99888"
            - "After unseal: ${ec_status_after_unseal} == OPEN, ${ec_est_cleared} is null and ${ec_sealer_cleared} is null — the derived estimate is erased, not merely ignored"
            - "After unseal the ledger is restored exactly: ${ec_committed_mid} == 0 and ${ec_available_mid} == 100000, and postage_deposited_cents is still 100000 (the deposit itself is untouched by either direction)"
            - "After the second seal: ${ec_est_2} == 112 (recomputed from the pieces, not remembered) with postage_committed_cents == 112 and postage_escrow_available_cents == 99888"
            - "No drift across the whole cycle: the final available balance equals the post-first-seal balance to the cent, and Client.${ec_client_id}.version has advanced by exactly 3 from ${ec_client_v1} (seal, unseal, seal)"
            - "PresortBatch.${ec_batch_id}.status == SEALED and sealed_by_user_id == postage-1 at the end, with manifested_postage_cents and postage_variance_cents both still null"

