              payload: { deficiency_note: "second round of questions" }
              as: Regulator
              captures: { fs4: $.data.filing_status, dc4: $.data.deficiency_count, note4: $.data.last_deficiency_note }
          assert:
            - "${fs0} == FILED, ${dc0} == 0, ${fs1} == UNDER_REVIEW and ${stage1} == SCOPING"
            - "${err_cure} == ERR_APPLICATION_STATE_INVALID with HTTP 409 (cure from UNDER_REVIEW)"
