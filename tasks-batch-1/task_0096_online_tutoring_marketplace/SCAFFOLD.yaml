# =============================================================================
# Online Tutoring Marketplace (Wyzant-style) — Scaffold Seed Tables (§1.0–§1.7)
# =============================================================================

scenario: |
  96. Online Tutoring Marketplace (Wyzant style): tutor credential verification,
  subject tagging, hourly pricing, trial lesson rules, per-session settlement and
  platform commission, refund arbitration, parent account child management

domain_name: online-tutoring-marketplace
api_prefix: ""   # flat multi-root topology: peer collections (/tutors, /subjects, /bookings, ...) at the API root

# =============================================================================
# Complexity Profile
# =============================================================================
complexity_profile:
  primary_archetype: multi_party_negotiation
  secondary_archetype: pricing_engine
  complexity_layers:
    - optimistic_concurrency
    - dual_variant_calculation
    - cascading_side_effects
    - rate_threshold_triggers

  entity_topology: flat
  # Flat: peer entities linked by foreign keys (TutorSubjectTag junction,
  # Booking references Tutor + Student, Session references Booking, RefundCase
  # references Session). No deep URL nesting; ids carried in request bodies.

  state_machine_shape: cyclic
  # RefundCase negotiation loops (PARENT_PROPOSED -> TUTOR_COUNTERED ->
  # PARENT_PROPOSED ...) plus branching fork/join on arbitration; Booking has a
  # revert (RESCHEDULE_REQUESTED -> SCHEDULED). Credential and Session machines
  # are non-cyclic but Session carries parallel financial + delivery dimensions.

  relationship_patterns:
    - one_to_many        # ParentAccount -> Student; Booking -> Session
    - many_to_many       # Tutor <-> Subject via TutorSubjectTag
    - cross_aggregate    # RefundCase references Session and ParentAccount
    - self_referential   # RefundCase.supersedes_case_id (re-opened arbitration)

  role_model: peer_roles
  # Tutor owns credentials/subject tags/availability; ParentGuardian owns
  # students/bookings/refund proposals; TrustOfficer verifies credentials;
  # Arbiter rules on refund cases; PlatformAdmin manages subjects + commission
  # config.

  consistency_model: immediate

# =============================================================================
# §1.0 Response Envelope (FIXED — EMIT VERBATIM)
# =============================================================================
response_envelope:
  success: |
    { "meta": { "api_request_id": "req_xxx", "api_request_timestamp": "ISO8601" },
      "response_type": "object" | "array", "data": {} }
  error: |
    { "meta": { ... }, "response_type": "error",
      "data": { "error_id": "ERR_XXX", "message": "..." } }
  pagination_fields: ["limit", "offset", "total_count", "has_more"]
  pagination_defaults: { limit: 10, min: 1, max: 100, offset: 0 }

# =============================================================================
# §1.1 Entity-Relationship Table
# =============================================================================
entities:
  # ---------------------------------------------------------------------------
  - name: Subject
    parent: null
    common_fields: true
    fields:
      - { name: id, type: string, source: system, description: "Server-minted UUID, no prefix; identity only" }
      - { name: code, type: string, source: input, description: "Unique subject code, e.g. MATH_ALGEBRA_2" }
      - { name: display_name, type: string, source: input, description: "Human-readable subject name" }
      - { name: category, type: enum, source: input, description: "STEM | LANGUAGE | HUMANITIES | TEST_PREP | MUSIC" }
      - { name: requires_credential, type: boolean, source: input, default: false, description: "If true, a Tutor must hold a VERIFIED Credential tagged to this subject before its TutorSubjectTag can be APPROVED" }
      - { name: status, type: enum, source: system, description: "ACTIVE (subjects are immutable configuration once created)", default: "ACTIVE", constraints: "ACTIVE" }

  # ---------------------------------------------------------------------------
  - name: CommissionPolicy
    parent: null
    common_fields: true
    fields:
      - { name: id, type: string, source: system, description: "Server-minted UUID, no prefix; identity only" }
      - { name: name, type: string, source: input, description: "Policy label" }
      - { name: tier_breakpoints_cents, type: array, source: input, description: "Ascending lifetime-earnings breakpoints in cents, e.g. [0, 100000, 1000000]; defines tutor commission tiers" }
      - { name: tier_rates_bps, type: array, source: input, description: "Commission rate per tier in basis points, parallel to tier_breakpoints_cents; e.g. [2500, 1500, 800] = 25%/15%/8%" }
      - { name: trial_commission_bps, type: integer, source: input, description: "Commission basis points charged on a trial session (overrides tier rate)" }
      - { name: trial_max_billed_minutes, type: integer, source: input, default: 30, description: "Hard cap on billed_minutes for any trial session" }
      - { name: refund_window_hours, type: integer, source: input, default: 168, description: "Hours after session end during which a RefundCase may be opened" }
      - { name: status, type: enum, source: system, description: "DRAFT | ACTIVE | SUPERSEDED", default: "DRAFT", constraints: "DRAFT, ACTIVE, SUPERSEDED" }
      - { name: activated_at, type: datetime, source: system, description: "Stamp when policy moved to ACTIVE; null while DRAFT" }

  # ---------------------------------------------------------------------------
  - name: Tutor
    parent: null
    common_fields: true
    fields:
      - { name: id, type: string, source: system, description: "Server-minted UUID, no prefix; identity only; equals X-User-ID when X-User-Role=Tutor" }
      - { name: email, type: string, source: input, description: "Unique tutor email" }
      - { name: full_name, type: string, source: input, description: "Tutor display name" }
      - { name: base_hourly_rate_cents, type: integer, source: input, description: "Default hourly rate in cents; min 1000, max 50000" }
      - { name: verification_status, type: enum, source: system, description: "UNVERIFIED | PENDING_REVIEW | VERIFIED | REJECTED | SUSPENDED", default: "UNVERIFIED", constraints: "UNVERIFIED, PENDING_REVIEW, VERIFIED, REJECTED, SUSPENDED" }
      - { name: lifetime_net_earnings_cents, type: integer, source: computed, description: "Sum of Settlement.tutor_net_cents for this tutor across SETTLED settlements; drives commission tier selection" }
      - { name: payout_balance_cents, type: integer, source: computed, description: "Withdrawable balance = sum of tutor_net_cents for SETTLED minus refund clawbacks; never negative" }
      - { name: clawback_owed_cents, type: integer, source: computed, description: "Outstanding clawback when refunds exceeded available balance; reduces future payout" }
      - { name: reliability_score, type: number, source: computed, description: "0-100 weighted reliability; chronic completion history minus acute no-show/refund penalties" }
      - { name: active_subject_count, type: integer, source: computed, description: "Count of TutorSubjectTag in APPROVED status for this tutor" }
      - { name: is_payable, type: boolean, source: computed, description: "True when verification_status=VERIFIED AND clawback_owed_cents=0" }

  # ---------------------------------------------------------------------------
  - name: Credential
    parent: null
    common_fields: true
    fields:
      - { name: id, type: string, source: system, description: "Server-minted UUID, no prefix; identity only" }
      - { name: tutor_id, type: string, source: input, description: "FK -> Tutor.id; owning tutor" }
      - { name: subject_id, type: string, source: input, description: "FK -> Subject.id; subject this credential attests competence in" }
      - { name: kind, type: enum, source: input, description: "DEGREE | CERTIFICATION | TEACHING_LICENSE | TRANSCRIPT" }
      - { name: document_ref, type: string, source: input, description: "Opaque storage reference for the uploaded document" }
      - { name: status, type: enum, source: system, description: "SUBMITTED | UNDER_REVIEW | VERIFIED | REJECTED | EXPIRED", default: "SUBMITTED", constraints: "SUBMITTED, UNDER_REVIEW, VERIFIED, REJECTED, EXPIRED" }
      - { name: reviewed_by, type: string, source: system, description: "X-User-ID of the TrustOfficer who reviewed it; opaque operator id" }
      - { name: rejection_reason, type: string, source: system, description: "Reason set when status=REJECTED; null otherwise" }

  # ---------------------------------------------------------------------------
  - name: TutorSubjectTag
    parent: null
    common_fields: true
    fields:
      - { name: id, type: string, source: system, description: "Server-minted UUID, no prefix; identity only" }
      - { name: tutor_id, type: string, source: input, description: "FK -> Tutor.id; tagged tutor" }
      - { name: subject_id, type: string, source: input, description: "FK -> Subject.id; tagged subject" }
      - { name: subject_rate_cents, type: integer, source: input, required: false, description: "Optional per-subject hourly rate override in cents; when null the tutor's base_hourly_rate_cents applies" }
      - { name: status, type: enum, source: system, description: "PROPOSED | APPROVED | REVOKED", default: "PROPOSED", constraints: "PROPOSED, APPROVED, REVOKED" }
      - { name: effective_hourly_rate_cents, type: integer, source: computed, description: "subject_rate_cents if non-null else Tutor.base_hourly_rate_cents at approval time" }

  # ---------------------------------------------------------------------------
  - name: ParentAccount
    parent: null
    common_fields: true
    fields:
      - { name: id, type: string, source: system, description: "Server-minted UUID, no prefix; identity only; equals X-User-ID when X-User-Role=ParentGuardian" }
      - { name: email, type: string, source: input, description: "Unique parent email" }
      - { name: full_name, type: string, source: input, description: "Parent display name" }
      - { name: wallet_balance_cents, type: integer, source: computed, description: "Prepaid balance available for bookings; credited by deposits and refunds, debited by booking holds" }
      - { name: held_balance_cents, type: integer, source: computed, description: "Sum of Booking.hold_amount_cents for this parent's bookings in HELD or DELIVERED state" }
      - { name: available_balance_cents, type: integer, source: computed, description: "wallet_balance_cents - held_balance_cents; never negative" }
      - { name: child_count, type: integer, source: computed, description: "Count of Student rows whose parent_account_id is this account and status != ARCHIVED" }
      - { name: status, type: enum, source: system, description: "ACTIVE (parent accounts have no freeze lifecycle in this version)", default: "ACTIVE", constraints: "ACTIVE" }

  # ---------------------------------------------------------------------------
  - name: Student
    parent: ParentAccount
    common_fields: true
    fields:
      - { name: id, type: string, source: system, description: "Server-minted UUID, no prefix; identity only" }
      - { name: parent_account_id, type: string, source: input, description: "FK -> ParentAccount.id; managing parent" }
      - { name: display_name, type: string, source: input, description: "Student display name" }
      - { name: grade_level, type: integer, source: input, description: "Grade 1-13 (13 = adult learner)" }
      - { name: status, type: enum, source: system, description: "ACTIVE | ARCHIVED", default: "ACTIVE", constraints: "ACTIVE, ARCHIVED" }

  # ---------------------------------------------------------------------------
  - name: Booking
    parent: null
    common_fields: true
    fields:
      - { name: id, type: string, source: system, description: "Server-minted UUID, no prefix; identity only" }
      - { name: parent_account_id, type: string, source: input, description: "FK -> ParentAccount.id; paying parent" }
      - { name: student_id, type: string, source: input, description: "FK -> Student.id; learner attending the lesson" }
      - { name: tutor_id, type: string, source: input, description: "FK -> Tutor.id; selected tutor" }
      - { name: subject_id, type: string, source: input, description: "FK -> Subject.id; lesson subject (must be an APPROVED TutorSubjectTag of the tutor)" }
      - { name: scheduled_start, type: datetime, source: input, description: "Lesson start (UTC); compared against the deterministic clock" }
      - { name: planned_minutes, type: integer, source: input, description: "Planned lesson length in minutes; min 15, max 240" }
      - { name: is_trial, type: boolean, source: computed, description: "True when this is the first non-cancelled booking for the (student_id, tutor_id) pair" }
      - { name: quoted_rate_cents, type: integer, source: computed, description: "TutorSubjectTag.effective_hourly_rate_cents captured at booking creation" }
      - { name: hold_amount_cents, type: integer, source: computed, description: "Estimated charge held against parent wallet at booking; round_half_up(quoted_rate_cents * planned_minutes / 60), trial-capped" }
      - { name: status, type: enum, source: system, description: "SCHEDULED | RESCHEDULE_REQUESTED | DELIVERED | SETTLED | CANCELLED | NO_SHOW", default: "SCHEDULED", constraints: "SCHEDULED, RESCHEDULE_REQUESTED, DELIVERED, SETTLED, CANCELLED, NO_SHOW" }
      - { name: reschedule_count, type: integer, source: computed, description: "Number of times a reschedule has been requested; max 3 before reschedule is blocked" }

  # ---------------------------------------------------------------------------
  - name: Session
    parent: null
    common_fields: true
    fields:
      - { name: id, type: string, source: system, description: "Server-minted UUID, no prefix; identity only" }
      - { name: booking_id, type: string, source: input, description: "FK -> Booking.id; the booking this delivered session realises" }
      - { name: tutor_id, type: string, source: system, description: "FK -> Tutor.id; copied from booking" }
      - { name: actual_minutes, type: integer, source: input, description: "Actual delivered minutes reported by tutor; min 1, max 480" }
      - { name: billed_minutes, type: integer, source: computed, description: "min(actual_minutes, Booking.planned_minutes + 15); trial-capped to CommissionPolicy.trial_max_billed_minutes when Booking.is_trial" }
      - { name: settlement_status, type: enum, source: system, description: "DELIVERED | SETTLED | REFUND_OPEN | REFUNDED | PARTIALLY_REFUNDED", default: "DELIVERED", constraints: "DELIVERED, SETTLED, REFUND_OPEN, REFUNDED, PARTIALLY_REFUNDED" }
      - { name: delivery_status, type: enum, source: system, description: "REPORTED | CONFIRMED | DISPUTED", default: "REPORTED", constraints: "REPORTED, CONFIRMED, DISPUTED" }

  # ---------------------------------------------------------------------------
  - name: Settlement
    parent: null
    common_fields: true
    fields:
      - { name: id, type: string, source: system, description: "Server-minted UUID, no prefix; identity only" }
      - { name: session_id, type: string, source: input, description: "FK -> Session.id; settled session (1:1)" }
      - { name: tutor_id, type: string, source: system, description: "FK -> Tutor.id; earning tutor" }
      - { name: gross_amount_cents, type: integer, source: computed, description: "round_half_up(effective_hourly_rate_cents * Session.billed_minutes / 60)" }
      - { name: commission_bps, type: integer, source: computed, description: "Basis points applied: trial_commission_bps when trial, else tier rate selected from CommissionPolicy by tutor lifetime earnings" }
      - { name: commission_cents, type: integer, source: computed, description: "round_half_up(gross_amount_cents * commission_bps / 10000)" }
      - { name: tutor_net_cents, type: integer, source: computed, description: "gross_amount_cents - commission_cents" }
      - { name: refunded_cents, type: integer, source: computed, description: "Cumulative amount refunded to parent against this settlement via RefundCase outcomes" }
      - { name: status, type: enum, source: system, description: "SETTLED | REVERSED | PARTIALLY_REVERSED", default: "SETTLED", constraints: "SETTLED, REVERSED, PARTIALLY_REVERSED" }

  # ---------------------------------------------------------------------------
  - name: RefundCase
    parent: null
    common_fields: true
    fields:
      - { name: id, type: string, source: system, description: "Server-minted UUID, no prefix; identity only" }
      - { name: session_id, type: string, source: input, description: "FK -> Session.id; disputed session" }
      - { name: parent_account_id, type: string, source: system, description: "FK -> ParentAccount.id; claimant parent, copied from session's booking" }
      - { name: tutor_id, type: string, source: system, description: "FK -> Tutor.id; responding tutor, copied from session" }
      - { name: supersedes_case_id, type: string, source: input, required: false, description: "FK -> RefundCase.id; prior REJECTED case this re-opening replaces (self-referential)" }
      - { name: claimed_amount_cents, type: integer, source: input, description: "Amount the parent claims back; min 1, max settlement gross_amount_cents" }
      - { name: parent_offer_cents, type: integer, source: computed, description: "Current standing offer from the parent side (starts at claimed_amount_cents)" }
      - { name: tutor_offer_cents, type: integer, source: computed, description: "Current standing counter-offer from the tutor side; null until first counter" }
      - { name: round_count, type: integer, source: computed, description: "Number of negotiation rounds (parent proposal + tutor counter = one round); max 3 before mandatory arbitration" }
      - { name: granted_amount_cents, type: integer, source: computed, description: "Final amount refunded to parent when case resolves; 0 when denied" }
      - { name: status, type: enum, source: system, description: "PARENT_PROPOSED | TUTOR_COUNTERED | AGREED | ARBITRATION | RESOLVED_REFUND | RESOLVED_DENY | WITHDRAWN", default: "PARENT_PROPOSED", constraints: "PARENT_PROPOSED, TUTOR_COUNTERED, AGREED, ARBITRATION, RESOLVED_REFUND, RESOLVED_DENY, WITHDRAWN" }

# =============================================================================
# §1.2 State Machine Table
# =============================================================================
state_machines:
  # ---------------------------------------------------------------------------
  - entity: Credential
    field: status
    initial_state: SUBMITTED
    terminal_states: [VERIFIED, REJECTED, EXPIRED]
    transitions:
      - from: SUBMITTED
        to: UNDER_REVIEW
        trigger: "POST /credentials/{id}/start-review"
        actor: TrustOfficer
        preconditions:
          - "Credential.status == SUBMITTED"
        side_effects:
          - "reviewed_by = X-User-ID"
          - "if owning Tutor.verification_status == UNVERIFIED, transition Tutor UNVERIFIED -> PENDING_REVIEW (cross-entity)"

      - from: UNDER_REVIEW
        to: VERIFIED
        trigger: "POST /credentials/{id}/verify"
        actor: TrustOfficer
        preconditions:
          - "Credential.status == UNDER_REVIEW"
        side_effects:
          - "Recompute owning Tutor.verification eligibility: if Tutor has >=1 VERIFIED Credential, transition Tutor PENDING_REVIEW -> VERIFIED (cross-entity bubble-up)"
          - "Any PROPOSED TutorSubjectTag for this subject whose approval was blocked by missing credential becomes eligible for approval"

      - from: UNDER_REVIEW
        to: REJECTED
        trigger: "POST /credentials/{id}/reject"
        actor: TrustOfficer
        preconditions:
          - "Credential.status == UNDER_REVIEW"
        side_effects:
          - "rejection_reason set from request body"
          - "if Tutor has zero VERIFIED Credential and zero other UNDER_REVIEW Credential, transition Tutor PENDING_REVIEW -> REJECTED (cross-entity)"

      - from: VERIFIED
        to: EXPIRED
        trigger: "POST /credentials/{id}/expire"
        actor: TrustOfficer
        preconditions:
          - "Credential.status == VERIFIED"
        side_effects:
          - "If owning Tutor now has zero VERIFIED Credential, transition Tutor VERIFIED -> SUSPENDED and REVOKE every APPROVED TutorSubjectTag whose subject requires_credential (cascade)"

  # ---------------------------------------------------------------------------
  - entity: Tutor
    field: verification_status
    initial_state: UNVERIFIED
    terminal_states: []
    transitions:
      - from: UNVERIFIED
        to: PENDING_REVIEW
        trigger: "system: first Credential moves to UNDER_REVIEW"
        actor: system
        preconditions:
          - "Tutor.verification_status == UNVERIFIED"
        side_effects: []
      - from: PENDING_REVIEW
        to: VERIFIED
        trigger: "system: a Credential of this tutor reaches VERIFIED"
        actor: system
        preconditions:
          - "Tutor has >=1 VERIFIED Credential"
        side_effects:
          - "is_payable recomputed"
      - from: PENDING_REVIEW
        to: REJECTED
        trigger: "system: last UNDER_REVIEW Credential rejected with no VERIFIED credential"
        actor: system
        preconditions:
          - "Tutor has zero VERIFIED Credential and zero UNDER_REVIEW Credential"
        side_effects: []
      - from: VERIFIED
        to: SUSPENDED
        trigger: "POST /tutors/{id}/suspend OR system on last VERIFIED credential expiry"
        actor: TrustOfficer
        preconditions:
          - "Tutor.verification_status == VERIFIED"
        side_effects:
          - "REVOKE every APPROVED TutorSubjectTag of this tutor (cascade); future bookings blocked"
      - from: SUSPENDED
        to: VERIFIED
        trigger: "POST /tutors/{id}/reinstate"
        actor: TrustOfficer
        preconditions:
          - "Tutor.verification_status == SUSPENDED"
          - "Tutor has >=1 VERIFIED Credential"
        side_effects:
          - "is_payable recomputed"

  # ---------------------------------------------------------------------------
  - entity: TutorSubjectTag
    field: status
    initial_state: PROPOSED
    terminal_states: [REVOKED]
    transitions:
      - from: PROPOSED
        to: APPROVED
        trigger: "POST /subject-tags/{id}/approve"
        actor: TrustOfficer
        preconditions:
          - "TutorSubjectTag.status == PROPOSED"
          - "Tutor.verification_status == VERIFIED"
          - "if Subject.requires_credential == true, the tutor holds a VERIFIED Credential for this subject_id (cross-entity)"
        side_effects:
          - "effective_hourly_rate_cents = subject_rate_cents if non-null else Tutor.base_hourly_rate_cents (snapshot)"
          - "increment Tutor.active_subject_count"
      - from: APPROVED
        to: REVOKED
        trigger: "POST /subject-tags/{id}/revoke OR cascade from Tutor SUSPENDED / Credential EXPIRED"
        actor: TrustOfficer
        preconditions:
          - "TutorSubjectTag.status == APPROVED"
        side_effects:
          - "decrement Tutor.active_subject_count"
          - "future bookings on this (tutor, subject) blocked; existing SCHEDULED bookings are unaffected"
      - from: PROPOSED
        to: REVOKED
        trigger: "POST /subject-tags/{id}/revoke"
        actor: TrustOfficer
        preconditions:
          - "TutorSubjectTag.status == PROPOSED"
        side_effects: []

  # ---------------------------------------------------------------------------
  - entity: Booking
    field: status
    initial_state: SCHEDULED
    terminal_states: [SETTLED, CANCELLED, NO_SHOW]
    transitions:
      - from: SCHEDULED
        to: RESCHEDULE_REQUESTED
        trigger: "POST /bookings/{id}/request-reschedule"
        actor: ParentGuardian
        preconditions:
          - "Booking.status == SCHEDULED"
          - "Booking.reschedule_count < 3"
          - "current clock < Booking.scheduled_start"
        side_effects:
          - "increment reschedule_count"
      - from: RESCHEDULE_REQUESTED
        to: SCHEDULED
        trigger: "POST /bookings/{id}/confirm-reschedule"
        actor: Tutor
        preconditions:
          - "Booking.status == RESCHEDULE_REQUESTED"
        side_effects:
          - "scheduled_start updated to proposed_start from request body; hold_amount_cents recomputed and parent wallet hold adjusted (cross-entity ledger sync)"
      - from: SCHEDULED
        to: DELIVERED
        trigger: "POST /bookings/{id}/deliver"
        actor: Tutor
        preconditions:
          - "Booking.status == SCHEDULED"
          - "current clock >= Booking.scheduled_start"
          - "Tutor.verification_status == VERIFIED"
        side_effects:
          - "create Session in delivery_status=REPORTED, settlement_status=DELIVERED; compute billed_minutes (calc)"
      - from: DELIVERED
        to: SETTLED
        trigger: "system: Session settles (Settlement created)"
        actor: system
        preconditions:
          - "Booking.status == DELIVERED"
          - "associated Session.delivery_status == CONFIRMED"
        side_effects:
          - "release parent wallet hold; debit wallet by Settlement.gross_amount_cents; credit Tutor payout_balance by tutor_net_cents (cross-entity ledger sync)"
      - from: SCHEDULED
        to: CANCELLED
        trigger: "POST /bookings/{id}/cancel"
        actor: ParentGuardian
        preconditions:
          - "Booking.status IN {SCHEDULED, RESCHEDULE_REQUESTED}"
          - "current clock < Booking.scheduled_start"
        side_effects:
          - "release full parent wallet hold (compensation): held_balance_cents decreases by hold_amount_cents, no wallet debit"
      - from: RESCHEDULE_REQUESTED
        to: CANCELLED
        trigger: "POST /bookings/{id}/cancel"
        actor: ParentGuardian
        preconditions:
          - "Booking.status == RESCHEDULE_REQUESTED"
          - "current clock < Booking.scheduled_start"
        side_effects:
          - "release full parent wallet hold (compensation)"
      - from: SCHEDULED
        to: NO_SHOW
        trigger: "POST /bookings/{id}/mark-no-show"
        actor: Tutor
        preconditions:
          - "Booking.status == SCHEDULED"
          - "current clock >= Booking.scheduled_start"
        side_effects:
          - "release parent wallet hold; apply acute no-show penalty to Tutor.reliability_score (cross-entity)"

  # ---------------------------------------------------------------------------
  - entity: Session
    field: delivery_status
    initial_state: REPORTED
    terminal_states: [CONFIRMED, DISPUTED]
    transitions:
      - from: REPORTED
        to: CONFIRMED
        trigger: "POST /sessions/{id}/confirm"
        actor: ParentGuardian
        preconditions:
          - "Session.delivery_status == REPORTED"
        side_effects:
          - "create Settlement (calc: gross, commission, net); transition Booking DELIVERED -> SETTLED; Session.settlement_status -> SETTLED; update Tutor.lifetime_net_earnings_cents and reliability_score (chronic completion); 3-hop cascade"
      - from: REPORTED
        to: DISPUTED
        trigger: "POST /sessions/{id}/dispute"
        actor: ParentGuardian
        preconditions:
          - "Session.delivery_status == REPORTED"
        side_effects:
          - "Session.settlement_status stays DELIVERED; opens a refund-eligible window without auto-settling"

  # ---------------------------------------------------------------------------
  - entity: RefundCase
    field: status
    initial_state: PARENT_PROPOSED
    terminal_states: [RESOLVED_REFUND, RESOLVED_DENY, WITHDRAWN]
    transitions:
      - from: PARENT_PROPOSED
        to: TUTOR_COUNTERED
        trigger: "POST /refund-cases/{id}/counter"
        actor: Tutor
        preconditions:
          - "RefundCase.status == PARENT_PROPOSED"
          - "counter_amount_cents <= parent_offer_cents"
          - "expected_refund_case_version matches"
        side_effects:
          - "tutor_offer_cents = counter_amount_cents; this is the tutor side of the current round"
      - from: TUTOR_COUNTERED
        to: PARENT_PROPOSED
        trigger: "POST /refund-cases/{id}/repropose"
        actor: ParentGuardian
        preconditions:
          - "RefundCase.status == TUTOR_COUNTERED"
          - "RefundCase.round_count < 3"
          - "new_offer_cents >= tutor_offer_cents AND new_offer_cents <= parent_offer_cents (monotone narrowing)"
          - "expected_refund_case_version matches"
        side_effects:
          - "parent_offer_cents = new_offer_cents; increment round_count (cyclic loop back)"
      - from: TUTOR_COUNTERED
        to: AGREED
        trigger: "POST /refund-cases/{id}/accept-counter"
        actor: ParentGuardian
        preconditions:
          - "RefundCase.status == TUTOR_COUNTERED"
          - "expected_refund_case_version matches"
        side_effects:
          - "granted_amount_cents = tutor_offer_cents"
      - from: PARENT_PROPOSED
        to: AGREED
        trigger: "POST /refund-cases/{id}/accept-offer"
        actor: Tutor
        preconditions:
          - "RefundCase.status == PARENT_PROPOSED"
          - "expected_refund_case_version matches"
        side_effects:
          - "granted_amount_cents = parent_offer_cents"
      - from: AGREED
        to: RESOLVED_REFUND
        trigger: "system: settlement reversal applied on AGREED"
        actor: system
        preconditions:
          - "RefundCase.status == AGREED"
        side_effects:
          - "reverse Settlement by granted_amount_cents: credit parent wallet, debit Tutor payout_balance (clawback if insufficient); update Session.settlement_status; conserve money (compensating invariant)"
      - from: PARENT_PROPOSED
        to: ARBITRATION
        trigger: "POST /refund-cases/{id}/escalate"
        actor: ParentGuardian
        preconditions:
          - "RefundCase.status IN {PARENT_PROPOSED, TUTOR_COUNTERED}"
          - "RefundCase.round_count >= 1"
        side_effects: []
      - from: TUTOR_COUNTERED
        to: ARBITRATION
        trigger: "POST /refund-cases/{id}/escalate"
        actor: ParentGuardian
        preconditions:
          - "RefundCase.status IN {PARENT_PROPOSED, TUTOR_COUNTERED}"
          - "RefundCase.round_count >= 1"
        side_effects: []
      - from: ARBITRATION
        to: RESOLVED_REFUND
        trigger: "POST /refund-cases/{id}/arbitrate"
        actor: Arbiter
        preconditions:
          - "RefundCase.status == ARBITRATION"
          - "ruling == REFUND"
          - "0 < awarded_amount_cents <= parent_offer_cents"
        side_effects:
          - "granted_amount_cents = awarded_amount_cents; reverse Settlement by granted_amount_cents (compensating); update Tutor.reliability_score acute penalty"
      - from: ARBITRATION
        to: RESOLVED_DENY
        trigger: "POST /refund-cases/{id}/arbitrate"
        actor: Arbiter
        preconditions:
          - "RefundCase.status == ARBITRATION"
          - "ruling == DENY"
        side_effects:
          - "granted_amount_cents = 0; Session.settlement_status returns to SETTLED; no money moves"
      - from: PARENT_PROPOSED
        to: WITHDRAWN
        trigger: "POST /refund-cases/{id}/withdraw"
        actor: ParentGuardian
        preconditions:
          - "RefundCase.status IN {PARENT_PROPOSED, TUTOR_COUNTERED}"
        side_effects:
          - "Session.settlement_status returns to SETTLED; no money moves"
      - from: TUTOR_COUNTERED
        to: WITHDRAWN
        trigger: "POST /refund-cases/{id}/withdraw"
        actor: ParentGuardian
        preconditions:
          - "RefundCase.status IN {PARENT_PROPOSED, TUTOR_COUNTERED}"
        side_effects:
          - "Session.settlement_status returns to SETTLED; no money moves"

# =============================================================================
# §1.2.1 Concurrency Rules
# =============================================================================
concurrency_rules:
  - rule_id: refund-case-counter-stale-version
    parent_entity: RefundCase
    write_endpoint: "POST /refund-cases/{id}/counter"
    occ_field: "expected_refund_case_version"
    description: |
      Submitting a tutor counter against a RefundCase whose version has advanced
      since the client last observed it is rejected as a stale-version write. This
      captures the case where the parent has already re-proposed (legitimately
      advancing the negotiation to a new round under the cyclic state machine) and
      the tutor's view of the case offers is therefore stale; the counter must be
      re-derived against the current parent_offer_cents.
    error_id: ERR_STALE_REFUND_CASE_VERSION
    http_status: 412

  - rule_id: refund-case-repropose-stale-version
    parent_entity: RefundCase
    write_endpoint: "POST /refund-cases/{id}/repropose"
    occ_field: "expected_refund_case_version"
    description: |
      Submitting a parent re-proposal against a RefundCase whose version has
      advanced since the client last observed it is rejected as a stale-version
      write. This captures the case where the case has already moved on (a counter
      accepted, or an escalation to arbitration recorded) and the re-proposal would
      otherwise overwrite a newer standing state.
    error_id: ERR_STALE_REFUND_CASE_VERSION
    http_status: 412

# =============================================================================
# §1.3 Calculation Rules Table
# =============================================================================
calculations:
  # --- Rule 1 dual-variant instance A (Session/Settlement domain) ---
  - name: session_settlement_amount
    trigger: "Session REPORTED -> CONFIRMED (Settlement creation)"
    algorithm: tiered_pricing
    formula: |
      Step 1 — gross:
        gross_amount_cents = round_half_up(effective_hourly_rate_cents * billed_minutes / 60)
        where effective_hourly_rate_cents = Booking.quoted_rate_cents (snapshot)
      Step 2 — commission basis points (variant-dependent, see variants):
        STANDARD: select tier from CommissionPolicy by Tutor.lifetime_net_earnings_cents
          as observed BEFORE this settlement is added:
            tier index i = largest i such that tier_breakpoints_cents[i] <= lifetime_net_earnings_cents
            commission_bps = tier_rates_bps[i]
        TRIAL: commission_bps = CommissionPolicy.trial_commission_bps
      Step 3 — commission and net (round per-settlement, NOT per-minute):
        commission_cents = round_half_up(gross_amount_cents * commission_bps / 10000)
        tutor_net_cents  = gross_amount_cents - commission_cents
      Evaluation order is fixed: gross first, then tier selection on the
      PRE-settlement lifetime earnings, then commission, then net. The tier read
      must use the value before this settlement's tutor_net is added, otherwise a
      tutor straddling a breakpoint would be charged the wrong rate.
    input_set: "Single Session being confirmed; tier lookup reads Tutor.lifetime_net_earnings_cents over the tutor's prior SETTLED settlements only."
    constants:
      ROUNDING: "round_half_up"
      OVERTIME_GRACE_MINUTES: 15
    precision: "integer cents, round_half_up at each named step"
    variants:
      - name: standard_settlement
        when: "Booking.is_trial == false"
        difference: "commission_bps from the lifetime-earnings tier; full gross debited from parent wallet and credited (net) to tutor."
      - name: trial_settlement
        when: "Booking.is_trial == true"
        difference: "billed_minutes capped at trial_max_billed_minutes; commission_bps = trial_commission_bps (typically higher), so tutor_net for an identical billed duration is strictly lower than the standard variant."

  # --- Rule 2 combinatorial instance A: mode (a) tiered selection + nested min/max ---
  - name: billed_minutes
    trigger: "Booking SCHEDULED -> DELIVERED (Session creation)"
    algorithm: threshold
    formula: |
      raw = Session.actual_minutes
      capped = min(raw, Booking.planned_minutes + OVERTIME_GRACE_MINUTES)
      if Booking.is_trial:
        billed_minutes = min(capped, CommissionPolicy.trial_max_billed_minutes)
      else:
        billed_minutes = capped
      billed_minutes is floored at 1 (a delivered session bills at least 1 minute).
      Three inputs interact non-linearly: actual_minutes, planned_minutes+grace,
      and the trial cap; the active cap is whichever min wins.
    input_set: "Single Session at delivery."
    constants:
      OVERTIME_GRACE_MINUTES: 15
      FLOOR_MINUTES: 1
    precision: "integer minutes"

  # --- Rule 1 dual-variant instance B (ParentAccount/RefundCase domain) ---
  - name: refund_grant_basis
    trigger: "RefundCase reaches AGREED (negotiated) or RESOLVED_REFUND (arbitrated)"
    algorithm: forward_looking
    formula: |
      granted_amount_cents is set by the resolving transition:
        AGREED via accept-offer: granted = parent_offer_cents
        AGREED via accept-counter: granted = tutor_offer_cents
        ARBITRATION via arbitrate(REFUND): granted = awarded_amount_cents
      Settlement reversal then runs (see settlement_reversal calc).
    input_set: "Single RefundCase plus its linked Settlement."
    constants: {}
    precision: "integer cents"
    variants:
      - name: negotiated_grant
        when: "Resolved without arbitration (AGREED path)"
        difference: "granted equals whichever standing offer the accepting party clicked; bounded by [tutor_offer_cents, parent_offer_cents]."
      - name: arbitrated_grant
        when: "Resolved via Arbiter ruling"
        difference: "granted equals the Arbiter's awarded_amount_cents, independent of the standing offers except the parent_offer_cents ceiling; additionally applies an acute reliability penalty to the tutor that the negotiated path does not."

  # --- Rule 2 combinatorial instance B: mode (c) explicit evaluation order (circular-looking) ---
  - name: settlement_reversal
    trigger: "RefundCase AGREED -> RESOLVED_REFUND or ARBITRATION -> RESOLVED_REFUND"
    algorithm: waterfall_allocation
    formula: |
      Inputs: g = RefundCase.granted_amount_cents; S = linked Settlement.
      The reversal looks circular because tutor clawback depends on the tutor's
      available payout_balance, which itself depends on prior reversals — so the
      evaluation order is pinned explicitly:
        1. parent_credit = g                       # parent wallet always made whole by g
        2. tutor_debit_from_balance = min(g, Tutor.payout_balance_cents)
        3. tutor_clawback = g - tutor_debit_from_balance   # remainder when balance short
        4. apply: parent.wallet_balance_cents += parent_credit
                  Tutor.payout_balance_cents  -= tutor_debit_from_balance
                  Tutor.clawback_owed_cents   += tutor_clawback
        5. Settlement.refunded_cents += g
           Settlement.status = REVERSED if refunded_cents == gross_amount_cents
                               else PARTIALLY_REVERSED
        6. Commission is NOT refunded to the tutor and platform retains it; the
           platform funds the gap between g and tutor_debit only via clawback, never
           by crediting commission back.
      Step 2 must read payout_balance BEFORE step 4 mutates it; step 3 derives from
      step 2's result. Reversing the order (clawback before debit) double-counts.
    input_set: "Single RefundCase + its Settlement + the two ledgers (parent wallet, tutor balance)."
    constants: {}
    precision: "integer cents"

  # --- Tutor reliability (chronic vs acute; supports Rule 4 cascade + Rule 9 invariant context) ---
  - name: tutor_reliability_score
    trigger: "Session confirmed (chronic), Booking NO_SHOW (acute), RefundCase arbitrated REFUND (acute)"
    algorithm: weighted_scoring
    formula: |
      chronic = 100 * confirmed_sessions / max(1, confirmed_sessions + no_show_count)
      acute_penalty = 8 * no_show_count + 12 * arbitrated_refund_count
      reliability_score = clamp(chronic - acute_penalty, floor=0, ceiling=100)
      where:
        confirmed_sessions = count of this tutor's Sessions with delivery_status=CONFIRMED
        no_show_count = count of this tutor's Bookings in NO_SHOW
        arbitrated_refund_count = count of RefundCases against this tutor RESOLVED_REFUND via ARBITRATION
      Recomputed in full on each trigger (no incremental drift).
    input_set: "All of a tutor's Sessions, Bookings, and arbitrated RefundCases."
    constants:
      NO_SHOW_PENALTY: 8
      ARBITRATED_REFUND_PENALTY: 12
      SCORE_FLOOR: 0
      SCORE_CEILING: 100
    precision: "1 decimal place, round_half_up"

  # --- Parent wallet hold (supports Rule 9 invariant: held + available == wallet) ---
  - name: wallet_hold_amount
    trigger: "Booking creation; recomputed on confirm-reschedule"
    algorithm: aggregation
    formula: |
      base = round_half_up(Booking.quoted_rate_cents * Booking.planned_minutes / 60)
      if Booking.is_trial:
        hold_amount_cents = round_half_up(Booking.quoted_rate_cents * min(planned_minutes, trial_max_billed_minutes) / 60)
      else:
        hold_amount_cents = base
      Invariant maintained at all times for each ParentAccount:
        wallet_balance_cents = available_balance_cents + held_balance_cents
        held_balance_cents = sum(Booking.hold_amount_cents for that parent's Bookings in {SCHEDULED, RESCHEDULE_REQUESTED, DELIVERED})
    input_set: "Single Booking for the hold; all of a parent's non-terminal Bookings for held_balance aggregate."
    constants:
      ROUNDING: "round_half_up"
    precision: "integer cents"

# =============================================================================
# §1.4 Validation Rules Table (ordered by priority)
# =============================================================================
validations:
  - priority: 1
    category: auth
    check: "X-User-ID and X-User-Role headers present and well-formed"
    error_id: ERR_MISSING_OR_INVALID_USER_CONTEXT_HEADER
    http_status: 400
    applies_to: "all"

  - priority: 2
    category: auth
    check: "Acting role is permitted to invoke this operation per §1.7"
    error_id: ERR_UNAUTHORIZED
    http_status: 403
    applies_to: "all"

  - priority: 3
    category: auth
    check: "For entity_backed roles acting on owned resources, X-User-ID equals the resource's owner FK (Tutor on own credentials/tags/sessions; ParentGuardian on own students/bookings/refund-cases)"
    error_id: ERR_NOT_RESOURCE_OWNER
    http_status: 403
    applies_to: "tutor-owned and parent-owned mutation endpoints"

  - priority: 4
    category: existence
    check: "All resource ids referenced in the path exist; unknown id -> typed not-found"
    error_id: "ERR_TUTOR_NOT_FOUND / ERR_SUBJECT_NOT_FOUND / ERR_CREDENTIAL_NOT_FOUND / ERR_SUBJECT_TAG_NOT_FOUND / ERR_PARENT_NOT_FOUND / ERR_STUDENT_NOT_FOUND / ERR_BOOKING_NOT_FOUND / ERR_SESSION_NOT_FOUND / ERR_SETTLEMENT_NOT_FOUND / ERR_REFUND_CASE_NOT_FOUND"
    http_status: 404
    applies_to: "all endpoints with path ids"

  - priority: 5
    category: existence
    check: "All foreign-key ids in the request body reference existing rows (e.g. Booking.tutor_id, Booking.student_id, RefundCase.session_id)"
    error_id: "ERR_TUTOR_NOT_FOUND / ERR_STUDENT_NOT_FOUND / ERR_SUBJECT_NOT_FOUND / ERR_SESSION_NOT_FOUND"
    http_status: 404
    applies_to: "create endpoints with body FKs"

  - priority: 6
    category: state
    check: "Target resource is in a state from which the requested transition is defined (per §1.2); reinstate requires SUSPENDED tutor with >=1 VERIFIED credential -> ERR_TUTOR_NOT_REINSTATABLE"
    error_id: "ERR_INVALID_STATE / ERR_TUTOR_NOT_REINSTATABLE"
    http_status: 409
    applies_to: "all transition endpoints"

  - priority: 7
    category: state
    check: "OCC: expected_refund_case_version matches RefundCase.version on counter / repropose / accept endpoints"
    error_id: ERR_STALE_REFUND_CASE_VERSION
    http_status: 412
    applies_to: "POST /refund-cases/{id}/counter, POST /refund-cases/{id}/repropose, POST /refund-cases/{id}/accept-counter, POST /refund-cases/{id}/accept-offer"

  - priority: 8
    category: business_safety
    check: "Credential gating: approving a TutorSubjectTag for a Subject with requires_credential=true requires the tutor hold a VERIFIED Credential for that subject"
    error_id: ERR_SUBJECT_REQUIRES_CREDENTIAL
    http_status: 409
    applies_to: "POST /subject-tags/{id}/approve"

  - priority: 9
    category: business_referential
    check: "Booking subject must be an APPROVED TutorSubjectTag of the chosen tutor; tutor must be VERIFIED"
    error_id: ERR_TUTOR_SUBJECT_NOT_APPROVED
    http_status: 409
    applies_to: "POST /bookings"

  - priority: 10
    category: business_temporal
    check: "Booking scheduled_start must be strictly in the future relative to the deterministic clock; planned_minutes within [15,240]"
    error_id: ERR_BOOKING_TIME_INVALID
    http_status: 422
    applies_to: "POST /bookings"

  - priority: 11
    category: business_temporal
    check: "A tutor cannot have two non-cancelled Bookings whose [scheduled_start, scheduled_start+planned_minutes) intervals overlap (tutor calendar overlap, half-open, zero-buffer)"
    error_id: ERR_TUTOR_TIME_CONFLICT
    http_status: 409
    applies_to: "POST /bookings, POST /bookings/{id}/confirm-reschedule"

  - priority: 12
    category: business_temporal
    check: "A student cannot attend two non-cancelled Bookings (status NOT IN {CANCELLED}) whose intervals are within STUDENT_GAP_MINUTES of each other (student calendar, closed-with-buffer): for an existing booking [start_a, end_a) and a new booking [start_b, end_b), reject when start_b < end_a + STUDENT_GAP_MINUTES AND start_a < end_b + STUDENT_GAP_MINUTES. STUDENT_GAP_MINUTES = 15."
    error_id: ERR_STUDENT_TIME_CONFLICT
    http_status: 409
    applies_to: "POST /bookings, POST /bookings/{id}/confirm-reschedule"

  - priority: 13
    category: business_constraint
    check: "Refund window: a RefundCase may only be opened while current clock <= Session end + CommissionPolicy.refund_window_hours and Session.settlement_status IN {SETTLED, DISPUTED}"
    error_id: ERR_REFUND_WINDOW_CLOSED
    http_status: 409
    applies_to: "POST /refund-cases"

  - priority: 14
    category: business_constraint
    check: "Negotiation monotonicity: tutor counter <= current parent_offer_cents; parent reprosal in [tutor_offer_cents, parent_offer_cents]; arbitration ceiling parent_offer_cents"
    error_id: ERR_OFFER_OUT_OF_BOUNDS
    http_status: 422
    applies_to: "POST /refund-cases/{id}/counter, POST /refund-cases/{id}/repropose, POST /refund-cases/{id}/arbitrate"

  - priority: 15
    category: business_constraint
    check: "round_count cap: reprosal blocked once round_count >= 3; escalation requires round_count >= 1"
    error_id: ERR_NEGOTIATION_ROUNDS_EXHAUSTED
    http_status: 409
    applies_to: "POST /refund-cases/{id}/repropose, POST /refund-cases/{id}/escalate"

  - priority: 16
    category: business_constraint
    check: "claimed_amount_cents must be in (0, linked Settlement.gross_amount_cents]"
    error_id: ERR_AMOUNT_OUT_OF_RANGE
    http_status: 422
    applies_to: "POST /refund-cases"

  - priority: 16.5
    category: business_constraint
    check: "reschedule_count cap 3: request-reschedule blocked once reschedule_count >= 3"
    error_id: ERR_RESCHEDULE_LIMIT_REACHED
    http_status: 409
    applies_to: "POST /bookings/{id}/request-reschedule"

  - priority: 17
    category: business_fiscal
    check: "Parent available_balance_cents must cover Booking.hold_amount_cents at booking creation"
    error_id: ERR_INSUFFICIENT_WALLET_BALANCE
    http_status: 402
    applies_to: "POST /bookings"

# =============================================================================
# §1.5 API Endpoint Table
# =============================================================================
endpoints:
  # --- Clock (test-driving) ---
  - method: POST
    path: "/_clock/set"
    description: "Set the deterministic UTC clock used for all temporal checks"
    roles: [PlatformAdmin]
    code: 200
    input: [to_iso8601]
    output: "{ current_utc: string }"
    side_effects: ["server clock set to to_iso8601"]

  # --- Subjects ---
  - method: POST
    path: "/subjects"
    description: "Create a subject"
    roles: [PlatformAdmin]
    code: 201
    input: [code, display_name, category, "requires_credential?"]
    output: Subject
    side_effects: ["status=ACTIVE"]
  - method: GET
    path: "/subjects/{id}"
    description: "Get a subject"
    roles: [PlatformAdmin, TrustOfficer, Tutor, ParentGuardian, Arbiter]
    code: 200
    input: []
    output: Subject
    side_effects: []
  # --- Commission policies ---
  - method: POST
    path: "/commission-policies"
    description: "Create a commission policy (DRAFT)"
    roles: [PlatformAdmin]
    code: 201
    input: [name, tier_breakpoints_cents, tier_rates_bps, trial_commission_bps, "trial_max_billed_minutes?", "refund_window_hours?"]
    output: CommissionPolicy
    side_effects: ["status=DRAFT"]
  - method: POST
    path: "/commission-policies/{id}/activate"
    description: "Activate a policy; supersedes any currently ACTIVE policy"
    roles: [PlatformAdmin]
    code: 200
    input: []
    output: CommissionPolicy
    side_effects: ["status=ACTIVE; activated_at stamped; previously ACTIVE policy -> SUPERSEDED"]
  - method: GET
    path: "/commission-policies/{id}"
    description: "Get a commission policy"
    roles: [PlatformAdmin, TrustOfficer, Arbiter]
    code: 200
    input: []
    output: CommissionPolicy
    side_effects: []

  # --- Tutors ---
  - method: POST
    path: "/tutors"
    description: "Register a tutor"
    roles: [PlatformAdmin, Tutor]
    code: 201
    input: [email, full_name, base_hourly_rate_cents]
    output: Tutor
    side_effects: ["verification_status=UNVERIFIED"]
  - method: GET
    path: "/tutors/{id}"
    description: "Get a tutor"
    roles: [PlatformAdmin, TrustOfficer, Tutor, ParentGuardian, Arbiter]
    code: 200
    input: []
    output: Tutor
    side_effects: []
  - method: POST
    path: "/tutors/{id}/suspend"
    description: "Suspend a verified tutor"
    roles: [TrustOfficer]
    code: 200
    input: []
    output: Tutor
    side_effects: ["verification_status VERIFIED->SUSPENDED; revoke all APPROVED TutorSubjectTag (cascade)"]
  - method: POST
    path: "/tutors/{id}/reinstate"
    description: "Reinstate a suspended tutor"
    roles: [TrustOfficer]
    code: 200
    input: []
    output: Tutor
    side_effects: ["verification_status SUSPENDED->VERIFIED"]

  # --- Credentials (FK: tutor_id -> Tutor, subject_id -> Subject) ---
  - method: POST
    path: "/credentials"
    description: "Submit a credential document for a tutor+subject"
    roles: [Tutor]
    code: 201
    input: [tutor_id, subject_id, kind, document_ref]
    output: Credential
    side_effects: ["status=SUBMITTED"]
  - method: GET
    path: "/credentials"
    description: "List/filter credentials (reverse-reachability for tutor_id and subject_id FKs)"
    roles: [PlatformAdmin, TrustOfficer, Tutor]
    code: 200
    input: ["tutor_id?", "subject_id?", "status?", "limit?", "offset?"]
    output: "Credential[]"
    side_effects: []
  - method: GET
    path: "/credentials/{id}"
    description: "Get a credential"
    roles: [PlatformAdmin, TrustOfficer, Tutor]
    code: 200
    input: []
    output: Credential
    side_effects: []
  - method: POST
    path: "/credentials/{id}/start-review"
    description: "Begin reviewing a submitted credential"
    roles: [TrustOfficer]
    code: 200
    input: []
    output: Credential
    side_effects: ["status SUBMITTED->UNDER_REVIEW; reviewed_by set; Tutor UNVERIFIED->PENDING_REVIEW (cross-entity)"]
  - method: POST
    path: "/credentials/{id}/verify"
    description: "Verify a credential under review"
    roles: [TrustOfficer]
    code: 200
    input: []
    output: Credential
    side_effects: ["status UNDER_REVIEW->VERIFIED; Tutor PENDING_REVIEW->VERIFIED if eligible (cross-entity bubble-up)"]
  - method: POST
    path: "/credentials/{id}/reject"
    description: "Reject a credential under review"
    roles: [TrustOfficer]
    code: 200
    input: [rejection_reason]
    output: Credential
    side_effects: ["status UNDER_REVIEW->REJECTED; Tutor PENDING_REVIEW->REJECTED if no other path (cross-entity)"]
  - method: POST
    path: "/credentials/{id}/expire"
    description: "Expire a verified credential"
    roles: [TrustOfficer]
    code: 200
    input: []
    output: Credential
    side_effects: ["status VERIFIED->EXPIRED; if tutor loses last VERIFIED credential, Tutor VERIFIED->SUSPENDED and credential-gated tags revoked (cascade)"]

  # --- Tutor subject tags (FK: tutor_id -> Tutor, subject_id -> Subject) ---
  - method: POST
    path: "/subject-tags"
    description: "Tutor proposes a subject tag with optional rate override"
    roles: [Tutor]
    code: 201
    input: [tutor_id, subject_id, "subject_rate_cents?"]
    output: TutorSubjectTag
    side_effects: ["status=PROPOSED"]
  - method: GET
    path: "/subject-tags"
    description: "List/filter subject tags (reverse-reachability for tutor_id and subject_id FKs)"
    roles: [PlatformAdmin, TrustOfficer, Tutor, ParentGuardian]
    code: 200
    input: ["tutor_id?", "subject_id?", "status?", "limit?", "offset?"]
    output: "TutorSubjectTag[]"
    side_effects: []
  - method: GET
    path: "/subject-tags/{id}"
    description: "Get a subject tag"
    roles: [PlatformAdmin, TrustOfficer, Tutor, ParentGuardian]
    code: 200
    input: []
    output: TutorSubjectTag
    side_effects: []
  - method: POST
    path: "/subject-tags/{id}/approve"
    description: "Approve a proposed subject tag"
    roles: [TrustOfficer]
    code: 200
    input: []
    output: TutorSubjectTag
    side_effects: ["status PROPOSED->APPROVED; effective_hourly_rate_cents snapshotted; Tutor.active_subject_count++"]
  - method: POST
    path: "/subject-tags/{id}/revoke"
    description: "Revoke a subject tag"
    roles: [TrustOfficer]
    code: 200
    input: []
    output: TutorSubjectTag
    side_effects: ["status->REVOKED; Tutor.active_subject_count-- if was APPROVED"]

  # --- Parent accounts ---
  - method: POST
    path: "/parent-accounts"
    description: "Register a parent account"
    roles: [PlatformAdmin, ParentGuardian]
    code: 201
    input: [email, full_name]
    output: ParentAccount
    side_effects: ["status=ACTIVE; wallet_balance_cents=0"]
  - method: GET
    path: "/parent-accounts/{id}"
    description: "Get a parent account"
    roles: [PlatformAdmin, ParentGuardian, Arbiter]
    code: 200
    input: []
    output: ParentAccount
    side_effects: []
  - method: POST
    path: "/parent-accounts/{id}/deposit"
    description: "Add prepaid funds to a parent wallet"
    roles: [PlatformAdmin, ParentGuardian]
    code: 200
    input: [amount_cents]
    output: ParentAccount
    side_effects: ["wallet_balance_cents += amount_cents"]

  # --- Students (child of ParentAccount; FK: parent_account_id -> ParentAccount) ---
  - method: POST
    path: "/parent-accounts/{id}/students"
    description: "Add a student under a parent account"
    roles: [ParentGuardian]
    code: 201
    input: [display_name, grade_level]
    output: Student
    side_effects: ["status=ACTIVE; ParentAccount.child_count++"]
  - method: GET
    path: "/parent-accounts/{id}/students"
    description: "List a parent's students (reverse-reachability for parent_account_id FK)"
    roles: [PlatformAdmin, ParentGuardian]
    code: 200
    input: ["status?", "limit?", "offset?"]
    output: "Student[]"
    side_effects: []
  - method: POST
    path: "/students/{id}/archive"
    description: "Archive a student"
    roles: [ParentGuardian]
    code: 200
    input: []
    output: Student
    side_effects: ["status=ARCHIVED; ParentAccount.child_count--"]

  # --- Bookings (FK: parent_account_id, student_id, tutor_id, subject_id) ---
  - method: POST
    path: "/bookings"
    description: "Create a booking; holds estimated charge against parent wallet"
    roles: [ParentGuardian]
    code: 201
    input: [parent_account_id, student_id, tutor_id, subject_id, scheduled_start, planned_minutes]
    output: Booking
    side_effects: ["status=SCHEDULED; is_trial, quoted_rate_cents, hold_amount_cents computed; parent held_balance_cents increases"]
  - method: GET
    path: "/bookings"
    description: "List/filter bookings (reverse-reachability for parent_account_id, student_id, tutor_id, subject_id FKs)"
    roles: [PlatformAdmin, TrustOfficer, Tutor, ParentGuardian, Arbiter]
    code: 200
    input: ["parent_account_id?", "student_id?", "tutor_id?", "subject_id?", "status?", "limit?", "offset?"]
    output: "Booking[]"
    side_effects: []
  - method: GET
    path: "/bookings/{id}"
    description: "Get a booking"
    roles: [PlatformAdmin, TrustOfficer, Tutor, ParentGuardian, Arbiter]
    code: 200
    input: []
    output: Booking
    side_effects: []
  - method: POST
    path: "/bookings/{id}/request-reschedule"
    description: "Parent requests a reschedule"
    roles: [ParentGuardian]
    code: 200
    input: [proposed_start]
    output: Booking
    side_effects: ["status SCHEDULED->RESCHEDULE_REQUESTED; reschedule_count++"]
  - method: POST
    path: "/bookings/{id}/confirm-reschedule"
    description: "Tutor confirms reschedule; updates start and re-holds"
    roles: [Tutor]
    code: 200
    input: [proposed_start]
    output: Booking
    side_effects: ["status RESCHEDULE_REQUESTED->SCHEDULED; scheduled_start updated; hold recomputed (cross-entity ledger sync)"]
  - method: POST
    path: "/bookings/{id}/cancel"
    description: "Parent cancels a future booking; releases wallet hold"
    roles: [ParentGuardian]
    code: 200
    input: []
    output: Booking
    side_effects: ["status->CANCELLED; full hold released (compensation)"]
  - method: POST
    path: "/bookings/{id}/deliver"
    description: "Tutor reports the lesson delivered; creates Session"
    roles: [Tutor]
    code: 201
    input: [actual_minutes]
    output: Session
    side_effects: ["Booking SCHEDULED->DELIVERED; Session created (REPORTED/DELIVERED); billed_minutes computed"]
  - method: POST
    path: "/bookings/{id}/mark-no-show"
    description: "Tutor marks the student a no-show"
    roles: [Tutor]
    code: 200
    input: []
    output: Booking
    side_effects: ["status->NO_SHOW; hold released; Tutor.reliability_score acute penalty (cross-entity)"]

  # --- Sessions (FK: booking_id -> Booking, tutor_id -> Tutor) ---
  - method: GET
    path: "/sessions"
    description: "List/filter sessions (reverse-reachability for booking_id and tutor_id FKs)"
    roles: [PlatformAdmin, TrustOfficer, Tutor, ParentGuardian, Arbiter]
    code: 200
    input: ["booking_id?", "tutor_id?", "settlement_status?", "delivery_status?", "limit?", "offset?"]
    output: "Session[]"
    side_effects: []
  - method: GET
    path: "/sessions/{id}"
    description: "Get a session"
    roles: [PlatformAdmin, TrustOfficer, Tutor, ParentGuardian, Arbiter]
    code: 200
    input: []
    output: Session
    side_effects: []
  - method: POST
    path: "/sessions/{id}/confirm"
    description: "Parent confirms delivery; settles the session (3-hop cascade)"
    roles: [ParentGuardian]
    code: 200
    input: []
    output: Session
    side_effects: ["delivery_status REPORTED->CONFIRMED; Settlement created; Booking->SETTLED; wallet debited, tutor credited; lifetime earnings + reliability updated"]
  - method: POST
    path: "/sessions/{id}/dispute"
    description: "Parent disputes the reported session"
    roles: [ParentGuardian]
    code: 200
    input: []
    output: Session
    side_effects: ["delivery_status REPORTED->DISPUTED; opens refund-eligible window"]

  # --- Settlements (FK: session_id -> Session, tutor_id -> Tutor) ---
  - method: GET
    path: "/settlements"
    description: "List/filter settlements (reverse-reachability for session_id and tutor_id FKs)"
    roles: [PlatformAdmin, TrustOfficer, Tutor, Arbiter]
    code: 200
    input: ["session_id?", "tutor_id?", "status?", "limit?", "offset?"]
    output: "Settlement[]"
    side_effects: []
  - method: GET
    path: "/settlements/{id}"
    description: "Get a settlement"
    roles: [PlatformAdmin, TrustOfficer, Tutor, Arbiter]
    code: 200
    input: []
    output: Settlement
    side_effects: []

  # --- Refund cases (FK: session_id -> Session, parent_account_id -> ParentAccount, tutor_id -> Tutor, supersedes_case_id -> RefundCase) ---
  - method: POST
    path: "/refund-cases"
    description: "Parent opens a refund case against a session within the refund window"
    roles: [ParentGuardian]
    code: 201
    input: [session_id, claimed_amount_cents, "supersedes_case_id?"]
    output: RefundCase
    side_effects: ["status=PARENT_PROPOSED; parent_offer_cents=claimed_amount_cents; Session.settlement_status->REFUND_OPEN"]
  - method: GET
    path: "/refund-cases"
    description: "List/filter refund cases (reverse-reachability for session_id, parent_account_id, tutor_id, supersedes_case_id FKs)"
    roles: [PlatformAdmin, TrustOfficer, Tutor, ParentGuardian, Arbiter]
    code: 200
    input: ["session_id?", "parent_account_id?", "tutor_id?", "supersedes_case_id?", "status?", "limit?", "offset?"]
    output: "RefundCase[]"
    side_effects: []
  - method: GET
    path: "/refund-cases/{id}"
    description: "Get a refund case"
    roles: [PlatformAdmin, TrustOfficer, Tutor, ParentGuardian, Arbiter]
    code: 200
    input: []
    output: RefundCase
    side_effects: []
  - method: POST
    path: "/refund-cases/{id}/counter"
    description: "Tutor counters the parent's standing offer (OCC-guarded)"
    roles: [Tutor]
    code: 200
    input: [counter_amount_cents, expected_refund_case_version]
    output: RefundCase
    side_effects: ["status PARENT_PROPOSED->TUTOR_COUNTERED; tutor_offer_cents set; increments RefundCase.version by 1"]
  - method: POST
    path: "/refund-cases/{id}/repropose"
    description: "Parent re-proposes a narrower offer, looping the negotiation (OCC-guarded)"
    roles: [ParentGuardian]
    code: 200
    input: [new_offer_cents, expected_refund_case_version]
    output: RefundCase
    side_effects: ["status TUTOR_COUNTERED->PARENT_PROPOSED; parent_offer_cents set; round_count++; increments RefundCase.version by 1"]
  - method: POST
    path: "/refund-cases/{id}/accept-counter"
    description: "Parent accepts the tutor's counter (OCC-guarded)"
    roles: [ParentGuardian]
    code: 200
    input: [expected_refund_case_version]
    output: RefundCase
    side_effects: ["status TUTOR_COUNTERED->AGREED->RESOLVED_REFUND; granted=tutor_offer_cents; settlement reversed (compensating); increments RefundCase.version by 1"]
  - method: POST
    path: "/refund-cases/{id}/accept-offer"
    description: "Tutor accepts the parent's standing offer (OCC-guarded)"
    roles: [Tutor]
    code: 200
    input: [expected_refund_case_version]
    output: RefundCase
    side_effects: ["status PARENT_PROPOSED->AGREED->RESOLVED_REFUND; granted=parent_offer_cents; settlement reversed (compensating); increments RefundCase.version by 1"]
  - method: POST
    path: "/refund-cases/{id}/escalate"
    description: "Parent escalates the case to arbitration"
    roles: [ParentGuardian]
    code: 200
    input: []
    output: RefundCase
    side_effects: ["status->ARBITRATION"]
  - method: POST
    path: "/refund-cases/{id}/arbitrate"
    description: "Arbiter rules on a case in arbitration"
    roles: [Arbiter]
    code: 200
    input: [ruling, "awarded_amount_cents?"]
    output: RefundCase
    side_effects: ["REFUND: granted=awarded, settlement reversed, tutor acute penalty; DENY: granted=0, Session back to SETTLED"]
  - method: POST
    path: "/refund-cases/{id}/withdraw"
    description: "Parent withdraws the refund case"
    roles: [ParentGuardian]
    code: 200
    input: []
    output: RefundCase
    side_effects: ["status->WITHDRAWN; Session.settlement_status back to SETTLED"]

# =============================================================================
# §1.6 Error Code Catalog
# =============================================================================
errors:
  # --- Request / auth ---
  - id: ERR_MISSING_OR_INVALID_USER_CONTEXT_HEADER
    http: 400
    condition: "X-User-ID or X-User-Role header missing or malformed"
  - id: ERR_VALIDATION
    http: 400
    condition: "Malformed body, wrong type, or missing required field"
  - id: ERR_UNAUTHORIZED
    http: 403
    condition: "Acting role not permitted for this operation"
  - id: ERR_NOT_RESOURCE_OWNER
    http: 403
    condition: "Entity-backed role acting on a resource it does not own"

  # --- Not found ---
  - id: ERR_TUTOR_NOT_FOUND
    http: 404
    condition: "Tutor id does not exist"
  - id: ERR_SUBJECT_NOT_FOUND
    http: 404
    condition: "Subject id does not exist"
  - id: ERR_CREDENTIAL_NOT_FOUND
    http: 404
    condition: "Credential id does not exist"
  - id: ERR_SUBJECT_TAG_NOT_FOUND
    http: 404
    condition: "TutorSubjectTag id does not exist"
  - id: ERR_PARENT_NOT_FOUND
    http: 404
    condition: "ParentAccount id does not exist"
  - id: ERR_STUDENT_NOT_FOUND
    http: 404
    condition: "Student id does not exist"
  - id: ERR_BOOKING_NOT_FOUND
    http: 404
    condition: "Booking id does not exist"
  - id: ERR_SESSION_NOT_FOUND
    http: 404
    condition: "Session id does not exist"
  - id: ERR_SETTLEMENT_NOT_FOUND
    http: 404
    condition: "Settlement id does not exist"
  - id: ERR_REFUND_CASE_NOT_FOUND
    http: 404
    condition: "RefundCase id does not exist"

  # --- State ---
  - id: ERR_INVALID_STATE
    http: 409
    condition: "Target resource is not in a state from which this transition is defined (covers Credential review, Booking lifecycle, Session confirm/dispute, RefundCase negotiation/arbitration preconditions)"
  - id: ERR_TUTOR_NOT_REINSTATABLE
    http: 409
    condition: "Reinstate requires a SUSPENDED tutor with >=1 VERIFIED credential"

  # --- OCC ---
  - id: ERR_STALE_REFUND_CASE_VERSION
    http: 412
    condition: "expected_refund_case_version does not match current RefundCase.version"

  # --- Business: credential / subject gating ---
  - id: ERR_SUBJECT_REQUIRES_CREDENTIAL
    http: 409
    condition: "Approving a tag for a credential-gated subject without a VERIFIED credential"
  - id: ERR_TUTOR_NOT_VERIFIED
    http: 409
    condition: "Operation requires the tutor to be VERIFIED"
  - id: ERR_TUTOR_SUBJECT_NOT_APPROVED
    http: 409
    condition: "Booking subject is not an APPROVED TutorSubjectTag of the tutor"

  # --- Business: temporal ---
  - id: ERR_BOOKING_TIME_INVALID
    http: 422
    condition: "scheduled_start not strictly in the future or planned_minutes out of [15,240]"
  - id: ERR_TUTOR_TIME_CONFLICT
    http: 409
    condition: "Booking interval overlaps another non-cancelled booking on the same tutor (half-open, zero buffer)"
  - id: ERR_STUDENT_TIME_CONFLICT
    http: 409
    condition: "Booking interval is within STUDENT_GAP_MINUTES of another non-cancelled booking for the same student (closed, buffered)"
  - id: ERR_REFUND_WINDOW_CLOSED
    http: 409
    condition: "Refund case opened after the refund window or against a non-settled/non-disputed session"

  # --- Business: negotiation / amounts ---
  - id: ERR_OFFER_OUT_OF_BOUNDS
    http: 422
    condition: "Counter/reproposal/arbitration amount violates monotone-narrowing bounds"
  - id: ERR_NEGOTIATION_ROUNDS_EXHAUSTED
    http: 409
    condition: "round_count cap reached for reproposal, or escalation attempted before round 1"
  - id: ERR_AMOUNT_OUT_OF_RANGE
    http: 422
    condition: "claimed_amount_cents outside (0, gross_amount_cents]"
  - id: ERR_RESCHEDULE_LIMIT_REACHED
    http: 409
    condition: "Booking already rescheduled the maximum number of times"

  # --- Business: fiscal ---
  - id: ERR_INSUFFICIENT_WALLET_BALANCE
    http: 402
    condition: "Parent available balance cannot cover the booking hold"

# =============================================================================
# §1.7 RBAC Matrix
# =============================================================================
roles:
  - name: PlatformAdmin
    description: "Platform operator; manages subjects, commission policies, and the deterministic clock"
    identity: "opaque"
    exclusive_operations:
      - "POST /subjects — create subject"
      - "POST /subjects/{id}/retire — retire subject"
      - "POST /commission-policies — create policy"
      - "POST /commission-policies/{id}/activate — activate policy"
      - "POST /_clock/set — set deterministic clock"
    shared_operations:
      - "POST /tutors — register tutor (shared with Tutor)"
      - "POST /parent-accounts — register parent (shared with ParentGuardian)"
      - "POST /parent-accounts/{id}/deposit — deposit (shared with ParentGuardian)"
      - "GET endpoints — broad read access"

  - name: TrustOfficer
    description: "Trust & safety reviewer; verifies credentials, approves subject tags, suspends tutors"
    identity: "opaque"
    exclusive_operations:
      - "POST /credentials/{id}/start-review — begin review"
      - "POST /credentials/{id}/verify — verify credential"
      - "POST /credentials/{id}/reject — reject credential"
      - "POST /credentials/{id}/expire — expire credential"
      - "POST /subject-tags/{id}/approve — approve tag"
      - "POST /subject-tags/{id}/revoke — revoke tag"
      - "POST /tutors/{id}/suspend — suspend tutor"
      - "POST /tutors/{id}/reinstate — reinstate tutor"

  - name: Tutor
    description: "Tutor; submits credentials, proposes subject tags, delivers lessons, negotiates refunds"
    identity: "entity_backed:Tutor"
    exclusive_operations:
      - "POST /credentials — submit credential (own tutor_id)"
      - "POST /subject-tags — propose subject tag (own tutor_id)"
      - "POST /bookings/{id}/confirm-reschedule — confirm reschedule"
      - "POST /bookings/{id}/deliver — report delivered"
      - "POST /bookings/{id}/mark-no-show — mark no-show"
      - "POST /refund-cases/{id}/counter — counter offer"
      - "POST /refund-cases/{id}/accept-offer — accept parent offer"
    shared_operations:
      - "POST /tutors — register tutor (shared with PlatformAdmin)"
      - "GET endpoints — read own and public resources"

  - name: ParentGuardian
    description: "Parent account holder; manages students, books lessons, confirms/disputes, drives refunds"
    identity: "entity_backed:ParentAccount"
    exclusive_operations:
      - "POST /parent-accounts/{id}/students — add student"
      - "POST /students/{id}/archive — archive student"
      - "POST /bookings — create booking"
      - "POST /bookings/{id}/request-reschedule — request reschedule"
      - "POST /bookings/{id}/cancel — cancel booking"
      - "POST /sessions/{id}/confirm — confirm delivery"
      - "POST /sessions/{id}/dispute — dispute delivery"
      - "POST /refund-cases — open refund case"
      - "POST /refund-cases/{id}/repropose — re-propose"
      - "POST /refund-cases/{id}/accept-counter — accept counter"
      - "POST /refund-cases/{id}/escalate — escalate to arbitration"
      - "POST /refund-cases/{id}/withdraw — withdraw case"
    shared_operations:
      - "POST /parent-accounts — register parent (shared with PlatformAdmin)"
      - "POST /parent-accounts/{id}/deposit — deposit (shared with PlatformAdmin)"
      - "GET endpoints — read own resources"

  - name: Arbiter
    description: "Independent arbitrator; rules on escalated refund cases"
    identity: "opaque"
    exclusive_operations:
      - "POST /refund-cases/{id}/arbitrate — rule on arbitration"
    shared_operations:
      - "GET endpoints — read case context"
