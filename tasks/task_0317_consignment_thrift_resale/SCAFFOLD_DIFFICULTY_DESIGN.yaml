# =============================================================================
# §1.8 Scaffold Difficulty Design (Test Targeting Index)
# Cross-references SCAFFOLD.yaml §1.1–§1.7 against the nine Difficulty Rules (§0.5).
# 9 rule_ids × 2 instances = 18 instances.
#
# Canonical setup chain to reach an ON_FLOOR item (referenced by name below):
#   set clock -> POST /consignors -> POST /markdown-schedules -> POST /agreements
#   -> POST /intake-batches -> POST /items -> grade ACCEPT -> (auth if required) -> list
# All money is integer cents. All formula-derived asserts are precomputed literals.
# =============================================================================
scaffold_difficulty_design:

  # ===========================================================================
  - rule_id: dual_variant_calc
    instances:
      - name: split_basis_gross_vs_net_diverge_on_saleline
        grounds:
          - calculations.split_base
          - calculations.consignor_proceeds
          - entities.ConsignorAgreement.fields.split_basis
          - entities.SaleLine.fields.consignor_proceeds_cents
        distinguishing_aspect: |
          On a SaleLine domain, GROSS basis vs NET basis applied to the SAME
          sold_price_cents=8000 yield different consignor_proceeds_cents
          (GROSS=4000 vs NET=3925), because NET removes the 150c processing fee
          before the 0.50 split.
        test_recipe:
          setup:
            - "Two consignors, one GROSS agreement and one NET agreement, each with one ON_FLOOR item priced 8000c on a tier-0 (age 0) schedule, split_pct 0.50."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-06-01T00:00:00Z" }
              as: StoreAdmin
            - call: "POST /markdown-schedules"
              payload: { name: "Std", tiers: [{min_age_days: 0, discount_pct: 0.0}, {min_age_days: 30, discount_pct: 0.20}, {min_age_days: 60, discount_pct: 0.40}], base_floor_pct: 0.30 }
              as: StoreAdmin
              captures: { sched_id: $.data.id }
            - call: "POST /consignors"
              payload: { full_name: "Gross Gail", email: "gross@x.com" }
              as: StoreAdmin
              captures: { cons_g: $.data.id }
            - call: "POST /consignors"
              payload: { full_name: "Net Ned", email: "net@x.com" }
              as: StoreAdmin
              captures: { cons_n: $.data.id }
            - call: "POST /agreements"
              payload: { consignor_id: "${cons_g}", markdown_schedule_id: "${sched_id}", split_pct: 0.50, split_basis: "GROSS", payout_method: "CASH" }
              as: StoreAdmin
              captures: { agr_g: $.data.id }
            - call: "POST /agreements"
              payload: { consignor_id: "${cons_n}", markdown_schedule_id: "${sched_id}", split_pct: 0.50, split_basis: "NET", payout_method: "CASH" }
              as: StoreAdmin
              captures: { agr_n: $.data.id }
            - call: "POST /intake-batches"
              payload: { agreement_id: "${agr_g}" }
              as: IntakeGrader
              captures: { batch_g: $.data.id }
            - call: "POST /intake-batches"
              payload: { agreement_id: "${agr_n}" }
              as: IntakeGrader
              captures: { batch_n: $.data.id }
            - call: "POST /items"
              payload: { batch_id: "${batch_g}", title: "Gross coat" }
              as: IntakeGrader
              captures: { item_g: $.data.id, iv_g: $.data.version }
            - call: "POST /items"
              payload: { batch_id: "${batch_n}", title: "Net coat" }
              as: IntakeGrader
              captures: { item_n: $.data.id, iv_n: $.data.version }
            - call: "POST /items/${item_g}/grade"
              payload: { decision: "ACCEPT", list_price_cents: 8000, expected_item_version: "${iv_g}" }
              as: IntakeGrader
            - call: "POST /items/${item_n}/grade"
              payload: { decision: "ACCEPT", list_price_cents: 8000, expected_item_version: "${iv_n}" }
              as: IntakeGrader
            - call: "POST /items/${item_g}/list"
              payload: {}
              as: IntakeGrader
            - call: "POST /items/${item_n}/list"
              payload: {}
              as: IntakeGrader
          trigger:
            - call: "POST /sales"
              payload: { lines: [{item_id: "${item_g}"}], payment_method: "CARD" }
              as: CashierClerk
              captures: { sale_g: $.data.id }
            - call: "POST /sales"
              payload: { lines: [{item_id: "${item_n}"}], payment_method: "CARD" }
              as: CashierClerk
              captures: { sale_n: $.data.id }
          assert:
            - "GET /sales/${sale_g}/lines -> data[0].consignor_proceeds_cents == 4000"
            - "GET /sales/${sale_n}/lines -> data[0].consignor_proceeds_cents == 3925"
            - "GET /sales/${sale_g}/lines -> data[0].split_base_cents == 8000"
            - "GET /sales/${sale_n}/lines -> data[0].split_base_cents == 7850"

      - name: cash_payout_vs_store_credit_payout_diverge_on_consignor
        grounds:
          - calculations.consignor_proceeds
          - calculations.store_credit_payout
          - entities.ConsignorAgreement.fields.payout_method
          - entities.Consignor.fields.store_credit_cents
        distinguishing_aspect: |
          On the Consignor domain, the same line proceeds=4000c flow to a CASH
          consignor as unsettled_payable_cents=4000 but to a STORE_CREDIT
          consignor as store_credit_cents=4400 (4000 + 10% tier-1 bonus) — two
          valid payout algorithms on the same proceeds give different consignor
          balances.
        test_recipe:
          setup:
            - "Two consignors with identical GROSS split_pct 0.50 agreements differing only in payout_method (CASH vs STORE_CREDIT), each with one ON_FLOOR item priced 8000c at age 0."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-06-01T00:00:00Z" }
              as: StoreAdmin
            - call: "POST /markdown-schedules"
              payload: { name: "Std", tiers: [{min_age_days: 0, discount_pct: 0.0}], base_floor_pct: 0.30 }
              as: StoreAdmin
              captures: { sched_id: $.data.id }
            - call: "POST /consignors"
              payload: { full_name: "Cash Cara", email: "cash@x.com" }
              as: StoreAdmin
              captures: { cons_c: $.data.id }
            - call: "POST /consignors"
              payload: { full_name: "Credit Cleo", email: "credit@x.com" }
              as: StoreAdmin
              captures: { cons_cr: $.data.id }
            - call: "POST /agreements"
              payload: { consignor_id: "${cons_c}", markdown_schedule_id: "${sched_id}", split_pct: 0.50, split_basis: "GROSS", payout_method: "CASH" }
              as: StoreAdmin
              captures: { agr_c: $.data.id }
            - call: "POST /agreements"
              payload: { consignor_id: "${cons_cr}", markdown_schedule_id: "${sched_id}", split_pct: 0.50, split_basis: "GROSS", payout_method: "STORE_CREDIT" }
              as: StoreAdmin
              captures: { agr_cr: $.data.id }
            - call: "POST /intake-batches"
              payload: { agreement_id: "${agr_c}" }
              as: IntakeGrader
              captures: { batch_c: $.data.id }
            - call: "POST /intake-batches"
              payload: { agreement_id: "${agr_cr}" }
              as: IntakeGrader
              captures: { batch_cr: $.data.id }
            - call: "POST /items"
              payload: { batch_id: "${batch_c}", title: "Cash coat" }
              as: IntakeGrader
              captures: { item_c: $.data.id, iv_c: $.data.version }
            - call: "POST /items"
              payload: { batch_id: "${batch_cr}", title: "Credit coat" }
              as: IntakeGrader
              captures: { item_cr: $.data.id, iv_cr: $.data.version }
            - call: "POST /items/${item_c}/grade"
              payload: { decision: "ACCEPT", list_price_cents: 8000, expected_item_version: "${iv_c}" }
              as: IntakeGrader
            - call: "POST /items/${item_cr}/grade"
              payload: { decision: "ACCEPT", list_price_cents: 8000, expected_item_version: "${iv_cr}" }
              as: IntakeGrader
            - call: "POST /items/${item_c}/list"
              payload: {}
              as: IntakeGrader
            - call: "POST /items/${item_cr}/list"
              payload: {}
              as: IntakeGrader
          trigger:
            - call: "POST /sales"
              payload: { lines: [{item_id: "${item_c}"}], payment_method: "CARD" }
              as: CashierClerk
            - call: "POST /sales"
              payload: { lines: [{item_id: "${item_cr}"}], payment_method: "CARD" }
              as: CashierClerk
          assert:
            - "GET /consignors/${cons_c} -> data.unsettled_payable_cents == 4000"
            - "GET /consignors/${cons_c} -> data.store_credit_cents == 0"
            - "GET /consignors/${cons_cr} -> data.store_credit_cents == 4400"
            - "GET /consignors/${cons_cr} -> data.unsettled_payable_cents == 0"

  # ===========================================================================
  - rule_id: combinatorial_formula
    instances:
      - name: store_credit_bonus_tiered_nonlinear_branch
        grounds:
          - calculations.store_credit_payout
          - entities.StoreCreditTransaction.fields.amount_cents
        distinguishing_aspect: |
          Mode (a): store_credit_payout has 3 inputs (proceeds, tier1 cutoff,
          tier2 cutoff) with a conditional branch selecting tier-2 (20%) over
          tier-1 (10%); proceeds=10000 issues 12000 while proceeds=9999 issues
          10999, a non-linear jump at the tier boundary.
        test_recipe:
          setup:
            - "One STORE_CREDIT consignor, GROSS split_pct 0.50, with one ON_FLOOR item priced 20000c at age 0 (so proceeds = 10000, tier-2)."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-06-01T00:00:00Z" }
              as: StoreAdmin
            - call: "POST /markdown-schedules"
              payload: { name: "Std", tiers: [{min_age_days: 0, discount_pct: 0.0}], base_floor_pct: 0.30 }
              as: StoreAdmin
              captures: { sched_id: $.data.id }
            - call: "POST /consignors"
              payload: { full_name: "Tier Two Tina", email: "t2@x.com" }
              as: StoreAdmin
              captures: { cons_id: $.data.id }
            - call: "POST /agreements"
              payload: { consignor_id: "${cons_id}", markdown_schedule_id: "${sched_id}", split_pct: 0.50, split_basis: "GROSS", payout_method: "STORE_CREDIT" }
              as: StoreAdmin
              captures: { agr_id: $.data.id }
            - call: "POST /intake-batches"
              payload: { agreement_id: "${agr_id}" }
              as: IntakeGrader
              captures: { batch_id: $.data.id }
            - call: "POST /items"
              payload: { batch_id: "${batch_id}", title: "Luxury bag" }
              as: IntakeGrader
              captures: { item_id: $.data.id, iv: $.data.version }
            - call: "POST /items/${item_id}/grade"
              payload: { decision: "ACCEPT", list_price_cents: 20000, expected_item_version: "${iv}" }
              as: IntakeGrader
            - call: "POST /items/${item_id}/list"
              payload: {}
              as: IntakeGrader
          trigger:
            - call: "POST /sales"
              payload: { lines: [{item_id: "${item_id}"}], payment_method: "CARD" }
              as: CashierClerk
          assert:
            - "GET /consignors/${cons_id} -> data.store_credit_cents == 12000"
            - "GET /consignors/${cons_id}/store-credit/transactions -> data[0].amount_cents == 12000"

      - name: settlement_round_per_line_then_sum_order_pinned
        grounds:
          - calculations.settlement_rollup
          - calculations.consignor_proceeds
          - state_machines.DailySettlement.OPEN_to_FINALIZED
          - entities.DailySettlement.fields.total_consignor_payable_cents
        distinguishing_aspect: |
          Mode (b): two NET lines each sold 8001c round to proceeds 3926 per line
          BEFORE summation (total 7852); the pinned round-per-line-then-sum order
          diverges by 1 cent from sum-then-round (which yields 7851), and the
          settlement reports 7852.
        test_recipe:
          setup:
            - "One CASH NET consignor split_pct 0.50; two ON_FLOOR items each priced 8001c; both sold on 2026-06-02 in a single sale; an OPEN settlement for 2026-06-02."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-06-02T09:00:00Z" }
              as: StoreAdmin
            - call: "POST /markdown-schedules"
              payload: { name: "Std", tiers: [{min_age_days: 0, discount_pct: 0.0}], base_floor_pct: 0.30 }
              as: StoreAdmin
              captures: { sched_id: $.data.id }
            - call: "POST /consignors"
              payload: { full_name: "Round Rita", email: "round@x.com" }
              as: StoreAdmin
              captures: { cons_id: $.data.id }
            - call: "POST /agreements"
              payload: { consignor_id: "${cons_id}", markdown_schedule_id: "${sched_id}", split_pct: 0.50, split_basis: "NET", payout_method: "CASH" }
              as: StoreAdmin
              captures: { agr_id: $.data.id }
            - call: "POST /intake-batches"
              payload: { agreement_id: "${agr_id}" }
              as: IntakeGrader
              captures: { batch_id: $.data.id }
            - call: "POST /items"
              payload: { batch_id: "${batch_id}", title: "Coat A" }
              as: IntakeGrader
              captures: { item_a: $.data.id, iv_a: $.data.version }
            - call: "POST /items"
              payload: { batch_id: "${batch_id}", title: "Coat B" }
              as: IntakeGrader
              captures: { item_b: $.data.id, iv_b: $.data.version }
            - call: "POST /items/${item_a}/grade"
              payload: { decision: "ACCEPT", list_price_cents: 8001, expected_item_version: "${iv_a}" }
              as: IntakeGrader
            - call: "POST /items/${item_b}/grade"
              payload: { decision: "ACCEPT", list_price_cents: 8001, expected_item_version: "${iv_b}" }
              as: IntakeGrader
            - call: "POST /items/${item_a}/list"
              payload: {}
              as: IntakeGrader
            - call: "POST /items/${item_b}/list"
              payload: {}
              as: IntakeGrader
            - call: "POST /sales"
              payload: { lines: [{item_id: "${item_a}"}, {item_id: "${item_b}"}], payment_method: "CARD" }
              as: CashierClerk
            - call: "POST /settlements"
              payload: { business_date: "2026-06-02" }
              as: SettlementManager
              captures: { settle_id: $.data.id, sv: $.data.version }
          trigger:
            - call: "POST /settlements/${settle_id}/finalize"
              payload: { expected_settlement_version: "${sv}" }
              as: SettlementManager
          assert:
            - "DailySettlement.${settle_id}.total_consignor_payable_cents == 7852"
            - "DailySettlement.${settle_id}.total_gross_cents == 16002"

  # ===========================================================================
  - rule_id: non_linear_state_machine
    instances:
      - name: authentication_review_dispute_reopen_cycle
        grounds:
          - state_machines.AuthenticationReview.IN_REVIEW_to_DISPUTED
          - state_machines.AuthenticationReview.DISPUTED_to_IN_REVIEW
          - entities.AuthenticationReview.fields.dispute_round
        distinguishing_aspect: |
          AuthenticationReview is cyclic: IN_REVIEW -> DISPUTED -> IN_REVIEW
          repeats and dispute_round increments each reopen, so after two
          dispute/reopen rounds dispute_round == 2 with status back at IN_REVIEW.
        test_recipe:
          setup:
            - "One item requires_authentication, graded ACCEPTED by grader U-GRADER, with an open AuthenticationReview opened by a DIFFERENT authenticator."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-06-01T00:00:00Z" }
              as: StoreAdmin
            - call: "POST /markdown-schedules"
              payload: { name: "Std", tiers: [{min_age_days: 0, discount_pct: 0.0}], base_floor_pct: 0.30 }
              as: StoreAdmin
              captures: { sched_id: $.data.id }
            - call: "POST /consignors"
              payload: { full_name: "Auth Anna", email: "auth@x.com" }
              as: StoreAdmin
              captures: { cons_id: $.data.id }
            - call: "POST /agreements"
              payload: { consignor_id: "${cons_id}", markdown_schedule_id: "${sched_id}", split_pct: 0.50 }
              as: StoreAdmin
              captures: { agr_id: $.data.id }
            - call: "POST /intake-batches"
              payload: { agreement_id: "${agr_id}" }
              as: IntakeGrader
              captures: { batch_id: $.data.id }
            - call: "POST /items"
              payload: { batch_id: "${batch_id}", title: "Designer scarf", requires_authentication: true }
              as: IntakeGrader
              captures: { item_id: $.data.id, iv: $.data.version }
            - call: "POST /items/${item_id}/grade"
              payload: { decision: "ACCEPT", list_price_cents: 5000, expected_item_version: "${iv}" }
              as: IntakeGrader
              as_user_id: "U-GRADER"
            - call: "POST /authentication-reviews"
              payload: { item_id: "${item_id}" }
              as: Authenticator
              as_user_id: "U-AUTH"
              captures: { rev_id: $.data.id }
          trigger:
            - call: "POST /authentication-reviews/${rev_id}/dispute"
              payload: {}
              as: SettlementManager
            - call: "POST /authentication-reviews/${rev_id}/reopen"
              payload: {}
              as: Authenticator
              as_user_id: "U-AUTH"
            - call: "POST /authentication-reviews/${rev_id}/dispute"
              payload: {}
              as: SettlementManager
            - call: "POST /authentication-reviews/${rev_id}/reopen"
              payload: {}
              as: Authenticator
              as_user_id: "U-AUTH"
              captures: { final_round: $.data.dispute_round }
          assert:
            - "AuthenticationReview.${rev_id}.status == IN_REVIEW"
            - "AuthenticationReview.${rev_id}.dispute_round == 2"

      - name: settlement_branching_open_to_finalized_or_voided
        grounds:
          - state_machines.DailySettlement.OPEN_to_FINALIZED
          - state_machines.DailySettlement.OPEN_to_VOIDED
          - entities.DailySettlement.fields.status
        distinguishing_aspect: |
          DailySettlement branches from OPEN to two divergent terminal states
          with different side-effect sets: VOID merely frees the date (no sweep),
          while FINALIZE sweeps sales and stamps settlement_id; voiding one date's
          settlement leaves a second date's settlement free to finalize.
        test_recipe:
          setup:
            - "Two OPEN settlements for distinct dates 2026-06-03 and 2026-06-04; no sales."
          setup_api_calls:
            - call: "POST /settlements"
              payload: { business_date: "2026-06-03" }
              as: SettlementManager
              captures: { s3: $.data.id }
            - call: "POST /settlements"
              payload: { business_date: "2026-06-04" }
              as: SettlementManager
              captures: { s4: $.data.id, s4v: $.data.version }
          trigger:
            - call: "POST /settlements/${s3}/void"
              payload: {}
              as: SettlementManager
            - call: "POST /settlements/${s4}/finalize"
              payload: { expected_settlement_version: "${s4v}" }
              as: SettlementManager
          assert:
            - "DailySettlement.${s3}.status == VOIDED"
            - "DailySettlement.${s4}.status == FINALIZED"
            - "DailySettlement.${s4}.swept_sale_count == 0"

  # ===========================================================================
  - rule_id: transitive_cascade
    instances:
      - name: counterfeit_verdict_cascade_depth3
        grounds:
          - state_machines.AuthenticationReview.IN_REVIEW_to_COUNTERFEIT
          - entities.Item.fields.authentication_status
          - entities.Item.fields.grading_status
          - validations[priority=8]
        distinguishing_aspect: |
          Depth-3 chain from a single COUNTERFEIT verdict: verdict mutates
          review.status=COUNTERFEIT -> that mutates item.authentication_status
          =COUNTERFEIT -> which itself cascades item.grading_status=REJECTED ->
          which then makes a subsequent list attempt fail ERR_AUTHENTICATION_REQUIRED.
        test_recipe:
          setup:
            - "One authentication-required item graded ACCEPTED by U-GRADER with an open review opened by U-AUTH (different user)."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-06-01T00:00:00Z" }
              as: StoreAdmin
            - call: "POST /markdown-schedules"
              payload: { name: "Std", tiers: [{min_age_days: 0, discount_pct: 0.0}], base_floor_pct: 0.30 }
              as: StoreAdmin
              captures: { sched_id: $.data.id }
            - call: "POST /consignors"
              payload: { full_name: "Fake Fred", email: "fake@x.com" }
              as: StoreAdmin
              captures: { cons_id: $.data.id }
            - call: "POST /agreements"
              payload: { consignor_id: "${cons_id}", markdown_schedule_id: "${sched_id}", split_pct: 0.50 }
              as: StoreAdmin
              captures: { agr_id: $.data.id }
            - call: "POST /intake-batches"
              payload: { agreement_id: "${agr_id}" }
              as: IntakeGrader
              captures: { batch_id: $.data.id }
            - call: "POST /items"
              payload: { batch_id: "${batch_id}", title: "Branded watch", requires_authentication: true }
              as: IntakeGrader
              captures: { item_id: $.data.id, iv: $.data.version }
            - call: "POST /items/${item_id}/grade"
              payload: { decision: "ACCEPT", list_price_cents: 30000, expected_item_version: "${iv}" }
              as: IntakeGrader
              as_user_id: "U-GRADER"
            - call: "POST /authentication-reviews"
              payload: { item_id: "${item_id}" }
              as: Authenticator
              as_user_id: "U-AUTH"
              captures: { rev_id: $.data.id }
          trigger:
            - call: "POST /authentication-reviews/${rev_id}/verdict"
              payload: { verdict: "COUNTERFEIT", verdict_note: "stitching off" }
              as: Authenticator
              as_user_id: "U-AUTH"
            - call: "POST /items/${item_id}/list"
              payload: {}
              as: IntakeGrader
              captures: { err: $.data.error_id }
          assert:
            - "AuthenticationReview.${rev_id}.status == COUNTERFEIT"
            - "Item.${item_id}.authentication_status == COUNTERFEIT"
            - "Item.${item_id}.grading_status == REJECTED"
            - "POST /items/${item_id}/list -> 409 ERR_AUTHENTICATION_REQUIRED"

      - name: sale_void_cascade_reverses_ledger_depth2
        grounds:
          - state_machines.Sale.COMPLETED_to_VOIDED
          - entities.Item.fields.listing_status
          - entities.PayoutLedgerEntry.fields.entry_type
          - entities.Consignor.fields.unsettled_payable_cents
        distinguishing_aspect: |
          Depth-2 chain triggered by sale void (distinct trigger from the
          COUNTERFEIT verdict): void mutates Sale.status=VOIDED -> that cascades
          item.listing_status back to ON_FLOOR AND creates a REVERSAL
          PayoutLedgerEntry -> which recomputes consignor.unsettled_payable_cents
          back to 0.
        test_recipe:
          setup:
            - "One CASH GROSS consignor split 0.50 with one item sold for 8000c (proceeds 4000 credited as SALE_PAYOUT, unsettled_payable_cents=4000), sale unsettled."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-06-01T00:00:00Z" }
              as: StoreAdmin
            - call: "POST /markdown-schedules"
              payload: { name: "Std", tiers: [{min_age_days: 0, discount_pct: 0.0}], base_floor_pct: 0.30 }
              as: StoreAdmin
              captures: { sched_id: $.data.id }
            - call: "POST /consignors"
              payload: { full_name: "Void Vera", email: "void@x.com" }
              as: StoreAdmin
              captures: { cons_id: $.data.id }
            - call: "POST /agreements"
              payload: { consignor_id: "${cons_id}", markdown_schedule_id: "${sched_id}", split_pct: 0.50, split_basis: "GROSS", payout_method: "CASH" }
              as: StoreAdmin
              captures: { agr_id: $.data.id }
            - call: "POST /intake-batches"
              payload: { agreement_id: "${agr_id}" }
              as: IntakeGrader
