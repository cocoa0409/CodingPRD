    code: 200
    input: [to_iso8601]
    output: "{ current_utc: string }"
    side_effects: ["logical clock advanced; window-gated calculations re-evaluate on next read"]

# =============================================================================
# 1.6 Error Code Catalog
# =============================================================================
errors:
  - { id: ERR_UNAUTHENTICATED, http: 401, condition: "Missing/invalid X-User-Role or X-User-ID headers" }
  - { id: ERR_UNAUTHORIZED, http: 403, condition: "Role not permitted for this endpoint, or ownership check failed (actor != resource.alumni_id where required)" }
  - { id: ERR_NOT_FOUND, http: 404, condition: "Path id does not exist or child not under the specified parent" }
  - { id: ERR_STALE_VERSION, http: 412, condition: "expected_*_version does not match the parent's current version" }
  - { id: ERR_INVALID_REQUEST, http: 400, condition: "Malformed body, missing required field, or invalid enum value" }
  - { id: ERR_INVALID_STATE, http: 409, condition: "Resource not in a valid from-state for the requested transition" }
  - { id: ERR_REFERENTIAL_INTEGRITY, http: 422, condition: "FK payload references an entity that is missing, mismatched, or in a non-linkable state (e.g., DECEASED alumnus)" }
  - { id: ERR_DUPLICATE_CHILD, http: 422, condition: "Second committee/campaign for the same event, or duplicate (alumni, channel) preference" }
  - { id: ERR_ALUMNUS_NOT_LOST, http: 422, condition: "Research-case log-lead requires linked AlumniRecord.status == LOST" }
  - { id: ERR_ALUMNUS_NOT_ACTIVE, http: 422, condition: "Membership accept requires AlumniRecord.status == ACTIVE" }
  - { id: ERR_LEAD_CONFIDENCE_TOO_LOW, http: 422, condition: "Verify requires lead_confidence >= 60" }
  - { id: ERR_CASE_REOPEN_LIMIT, http: 422, condition: "reopened_count would exceed 3" }
  - { id: ERR_QUORUM_NOT_MET, http: 422, condition: "committee_count < committee_quorum_required at open-registration" }
  - { id: ERR_NO_ACTIVE_TIER, http: 422, condition: "No TicketTier sales window covers the current logical clock at open-registration" }
  - { id: ERR_COMMITTEE_LOCKED, http: 422, condition: "Membership mutation attempted while ReunionCommittee.locked == true" }
  - { id: ERR_CHAIR_EXISTS, http: 422, condition: "Accepting a CHAIR membership while another CHAIR membership is ACTIVE on the same committee" }
  - { id: ERR_EVENT_NOT_OPEN, http: 422, condition: "confirm-payment requires parent event status == OPEN_FOR_REGISTRATION" }
  - { id: ERR_EVENT_ALREADY_HELD, http: 422, condition: "Refund after event marked HELD" }
  - { id: ERR_TIER_SOLD_OUT, http: 422, condition: "tier.capacity > 0 and tier.sold_count == tier.capacity at confirm time (capacity == 0 is unlimited and never sold out)" }
  - { id: ERR_SALES_WINDOW_CLOSED, http: 422, condition: "Registration creation outside [sales_start, sales_end) of the chosen tier" }
  - { id: ERR_WINDOW_OVERLAP, http: 422, condition: "New tier sales window overlaps an existing tier of the same event (half-open [start,end) arithmetic; touching endpoints allowed)" }
  - { id: ERR_VENUE_CONFLICT, http: 422, condition: "Program venue closed interval [start, end+60min] overlaps another APPROVED/PUBLISHED/COMPLETED program of the same group" }
  - { id: ERR_GROUP_NOT_ACTIVE, http: 422, condition: "Program propose/approve requires AffinityGroup.status == ACTIVE" }
  - { id: ERR_BUDGET_EXCEEDED, http: 422, condition: "budget_allocated_cents > group.budget_remaining_cents at approval" }
  - { id: ERR_SPEND_OVERRUN, http: 422, condition: "actual_spend_cents > budget_allocated_cents at completion" }
  - { id: ERR_PROGRAMS_OUTSTANDING, http: 422, condition: "Dissolve blocked by APPROVED/PUBLISHED programs" }
  - { id: ERR_CHANNEL_SUPPRESSED, http: 422, condition: "Operation targets a suppressed (alumnus, channel)" }
  - { id: ERR_NOT_MILESTONE_YEAR, http: 422, condition: "Campaign activate requires event.milestone_year > 0 and divisible by 5" }
  - { id: ERR_CAMPAIGN_NOT_ACTIVE, http: 422, condition: "Pledge create/fulfill requires campaign.status == ACTIVE" }
  - { id: ERR_CAMPAIGN_NOT_CLOSED, http: 422, condition: "Write-off requires campaign.status == CLOSED" }
  - { id: ERR_PLEDGES_OUTSTANDING, http: 422, condition: "Campaign close blocked by PLEDGED pledges" }
  - { id: ERR_AMOUNT_TOO_SMALL, http: 422, condition: "Pledge amount_cents < 100" }
  - { id: ERR_EVENT_NOT_PUBLISHABLE, http: 422, condition: "Publication publish requires event in OPEN_FOR_REGISTRATION/HELD/RECONCILED" }

# =============================================================================
# 1.7 RBAC Matrix
# =============================================================================
roles:
  - name: AlumniRelationsDirector
    description: "Head of alumni relations; superset of staff plus override-only operations (clear DNC, write-offs, dissolves, event cancel, publication approvals)"
    identity: opaque
    exclusive_operations:
      - "POST /alumni/records/{id}/clear-do-not-contact"
      - "POST /alumni/events/{id}/cancel"
      - "POST /alumni/pledges/{id}/write-off"
      - "POST /alumni/groups/{id}/suspend, /reactivate, /dissolve"
      - "POST /alumni/publications/{id}/return-for-edits, /approve, /request-re-review, /publish"
    shared_operations:
      - "All AlumniRelationsStaff operations"

  - name: AlumniRelationsStaff
    description: "Alumni relations operations staff; manages records, events, programs approvals, refunds, campaign lifecycle"
    identity: opaque
    exclusive_operations:
      - "POST /alumni/records, PUT /alumni/records/{id}, mark-lost, mark-deceased, set-do-not-contact"
      - "POST /alumni/research-cases and all research-case actions"
      - "POST /alumni/events and event lifecycle except cancel"
      - "POST /alumni/programs/{id}/approve, /cancel"
      - "POST /alumni/registrations/{id}/refund, /check-in"
      - "Gift campaign create/activate/close, pledge fulfill/lapse"
      - "Suppression list mutations, publication create/submit-review"
      - "POST /alumni/_clock/set_current_utc"
    shared_operations:
      - "GET endpoints"

  - name: ReunionChair
    description: "Active CHAIR committee member of a specific reunion event; can invite and end memberships on their committee"
    identity: "entity_backed:AlumniRecord"
    exclusive_operations:
      - "POST /alumni/memberships/{id}/end (as chair of the parent committee)"
      - "POST /alumni/committees/{committeeId}/memberships (invite)"
    shared_operations:
      - "GET event/committee/membership/campaign/registration lists"

  - name: CommitteeVolunteer
    description: "Invited committee member; accepts or declines own membership"
    identity: "entity_backed:AlumniRecord"
    exclusive_operations:
      - "POST /alumni/memberships/{id}/accept (own membership)"
      - "POST /alumni/memberships/{id}/decline (own membership)"
    shared_operations:
      - "GET committees/memberships"

  - name: AffinityGroupLeader
    description: "Leader of an affinity group; drives ChapterProgram lifecycle for programs they lead"
    identity: "entity_backed:AlumniRecord"
    exclusive_operations:
      - "POST /alumni/groups/{id}/programs (as leader_id)"
      - "POST /alumni/programs/{id}/propose, /withdraw, /publish, /complete (own programs)"
    shared_operations:
      - "GET groups/programs"

  - name: Alumni
    description: "Self-service alumnus; registers for events, manages own preferences, pledges"
    identity: "entity_backed:AlumniRecord"
    exclusive_operations:
      - "POST /alumni/events/{id}/registrations (self as alumni_id)"
      - "POST /alumni/registrations/{id}/confirm-payment, /cancel (own)"
      - "POST/PUT own CommunicationPreference rows"
      - "POST /alumni/campaigns/{id}/pledges (self)"
    shared_operations:
      - "GET events, ticket tiers, own registrations/pledges"
