            - call: "PATCH /ambient-clinical-documentation/note-drafts/${draft}"
              payload: { expected_note_draft_version: "${draft_v}", field_updates: [{ field_key: "chief_complaint", field_value: "fever" }] }
              as: Physician
              as_user_id: "${phy}"
            - call: "POST /ambient-clinical-documentation/note-drafts/${draft}/submit-review"
              payload: {}
              as: Physician
              as_user_id: "${phy}"
            - call: "POST /ambient-clinical-documentation/note-drafts/${draft}/attest"
              payload: {}
              as: Physician
