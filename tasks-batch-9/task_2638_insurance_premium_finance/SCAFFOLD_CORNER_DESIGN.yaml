# =============================================================================
# §1.9 Scaffold Corner Design (Breadth Coverage Index)
# Task 2638 — Insurance Premium Finance
#
# A row-by-row walk of references/claim-extraction-guide.md against this
# scaffold's §1.1–§1.7. `section:` values are the guide's nine sections;
# `claim_type:` values are the snake_case per-section table rows. Where a corner
# is already asserted by a §1.8 instance the entry is an `excluded_because:`
# stub with no test_recipe. Every name is unique across the union of
# SCAFFOLD_DIFFICULTY_DESIGN.yaml and this file.
#
# Standing conventions for every recipe below:
#   · the logical clock starts at 2026-08-01T00:00:00Z and is only ever moved
#     forward with POST /_clock/set_current_utc. Every recipe that originates an
#     agreement therefore opens by advancing the clock to 2026-08-15T00:00:00Z,
#     because §1.4 priority 33 requires
#     clock_date < first_installment_due_date <= clock_date + 60 days and the
#     canonical first due date 2026-10-01 is out of range from 2026-08-01;
#   · the canonical TX regime is ADD_ON / max_annual_rate_bps 1800 /
#     max_service_fee_cents 2000 / min_down_payment_bps 1500 / max_term_months 10 /
#     late_fee_bps 500 / 500..10000 clamp / grace 10 days / noic 10 days /
#     PRO_RATA / short_rate_penalty_bps 1000 / RULE_OF_78 /
#     max_late_fees_per_agreement 3 / license_required true;
#   · the canonical note ("the 600k note") is a single 600000 policy, down
#     payment 100000, service fee 2000, 6 installments, first due 2026-10-01,
#     which prices to amount_financed 502000 (tier 2, 1500 bps),
#     finance_charge 37650, total_of_payments 539650 and six installments of
#     89941 x 5 then 89945, each carrying finance_charge_component_cents 6275.
# =============================================================================

scaffold_corner_design:

  - section: entities
    instances:

      - name: creation_state_rate_rule_returns_201_with_every_declared_field
        claim_type: creation
        grounds:
          - entities.StateRateRule
          - endpoints.POST_state_rate_rules
        distinguishing_aspect: |
          POST /state-rate-rules with all sixteen declared inputs returns 201 and echoes every one
          of them unchanged, plus the computed active_agreement_count and the four common fields.
          The claim is that nothing is silently coerced: bps stay bps, the three enums round-trip,
          and late_fee_max_cents is accepted because it is >= late_fee_min_cents.
        test_recipe:
          setup:
            - "empty database; the logical clock is at its 2026-08-01T00:00:00Z default and is not moved"
          setup_api_calls: []
          trigger:
            - call: "POST /state-rate-rules"
              payload: { state_code: "TX", finance_charge_method: "ADD_ON", max_annual_rate_bps: 1800, max_service_fee_cents: 2000, min_down_payment_bps: 1500, max_term_months: 10, late_fee_bps: 500, late_fee_min_cents: 500, late_fee_max_cents: 10000, grace_period_days: 10, noic_notice_days: 10, unearned_premium_method: "PRO_RATA", short_rate_penalty_bps: 1000, rebate_method: "RULE_OF_78", max_late_fees_per_agreement: 3, license_required: true }
              as: ComplianceOfficer
              captures: { r1: "$.data.id", r1_state: "$.data.state_code", r1_method: "$.data.finance_charge_method", r1_rate: "$.data.max_annual_rate_bps", r1_fee_cap: "$.data.max_service_fee_cents", r1_min_down: "$.data.min_down_payment_bps", r1_term: "$.data.max_term_months", r1_lf_bps: "$.data.late_fee_bps", r1_lf_min: "$.data.late_fee_min_cents", r1_lf_max: "$.data.late_fee_max_cents", r1_grace: "$.data.grace_period_days", r1_noic: "$.data.noic_notice_days", r1_upm: "$.data.unearned_premium_method", r1_short: "$.data.short_rate_penalty_bps", r1_rebate: "$.data.rebate_method", r1_cap: "$.data.max_late_fees_per_agreement", r1_lic: "$.data.license_required", r1_count: "$.data.active_agreement_count", r1_ver: "$.data.version" }
            - call: "GET /state-rate-rules/${r1}"
              payload: {}
              as: FinanceAnalyst
              captures: { r1_reread_state: "$.data.state_code", r1_reread_count: "$.data.active_agreement_count" }
          assert:
            - "HTTP 201 with the §1.0 success envelope: meta.api_request_id, meta.api_request_timestamp, response_type == 'object' and a data object"
            - "${r1} is a non-empty string and ${r1_ver} == 1"
            - "every input is echoed verbatim: ${r1_state} == 'TX', ${r1_method} == 'ADD_ON', ${r1_rate} == 1800, ${r1_fee_cap} == 2000, ${r1_min_down} == 1500, ${r1_term} == 10"
            - "${r1_lf_bps} == 500, ${r1_lf_min} == 500, ${r1_lf_max} == 10000, ${r1_grace} == 10, ${r1_noic} == 10"
            - "${r1_upm} == 'PRO_RATA', ${r1_short} == 1000, ${r1_rebate} == 'RULE_OF_78', ${r1_cap} == 3, ${r1_lic} == true"
            - "${r1_count} == 0 — the computed active_agreement_count starts at 0 and was not an input"
            - "the re-read is identical: ${r1_reread_state} == 'TX' and ${r1_reread_count} == 0, so creation persisted rather than echoed"

      - name: default_license_required_and_reserve_balance_when_optional_inputs_omitted
        claim_type: defaults
        grounds:
          - entities.StateRateRule.fields.license_required
          - entities.Insurer.fields.status
          - entities.FinancedPolicy.fields.min_earned_days
          - entities.FinancedPolicy.fields.fully_earned
        distinguishing_aspect: |
          Four optional inputs across three entities are omitted and each must land on its declared
          default rather than on null: StateRateRule.license_required -> true, Insurer.status ->
          'ACTIVE', FinancedPolicy.min_earned_days -> 0 and FinancedPolicy.fully_earned -> false.
          license_required defaulting to TRUE is the load-bearing one, because a scaffold that
          defaults it to false would silently disable the ERR_STATE_NOT_LICENSED gate for every
          state created without the flag.
        test_recipe:
          setup:
            - "empty database at the 2026-08-01 clock default"
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-15T00:00:00Z" }
              as: ComplianceOfficer
            - call: "POST /insureds"
              payload: { legal_name: "Cascade Logistics Inc", mailing_state_code: "TX", email: "ap@cascade.example" }
              as: FinanceAnalyst
              captures: { d_insured: "$.data.id" }
            - call: "POST /agents"
              payload: { agency_name: "Gulf Coast Agency", state_code: "TX", agent_commission_bps: 1000, chargeback_basis: "COMMISSION_CAPPED", chargeback_liability_cap_cents: 400000, initial_reserve_balance_cents: 0 }
              as: ComplianceOfficer
              captures: { d_agent: "$.data.id" }
          trigger:
            - call: "POST /state-rate-rules"
              payload: { state_code: "OK", finance_charge_method: "ADD_ON", max_annual_rate_bps: 1800, max_service_fee_cents: 2000, min_down_payment_bps: 1500, max_term_months: 10, late_fee_bps: 500, late_fee_min_cents: 500, late_fee_max_cents: 10000, grace_period_days: 10, noic_notice_days: 10, unearned_premium_method: "PRO_RATA", short_rate_penalty_bps: 1000, rebate_method: "RULE_OF_78", max_late_fees_per_agreement: 3 }
              as: ComplianceOfficer
              captures: { d_rule: "$.data.id", d_lic_flag: "$.data.license_required" }
            - call: "POST /insurers"
              payload: { carrier_name: "Sooner Mutual", naic_code: "20777" }
              as: ComplianceOfficer
              captures: { d_insurer: "$.data.id", d_insurer_status: "$.data.status" }
            - call: "POST /state-rate-rules/${d_rule}/licenses"
              payload: { license_number: "PFC-OK-001", effective_date: "2026-01-01", expiration_date: "2027-12-31" }
              as: ComplianceOfficer
              captures: { d_lic_status: "$.data.status", d_lic_eff: "$.data.is_effective" }
            - call: "POST /agreements"
              payload: { insured_id: "${d_insured}", producer_agent_id: "${d_agent}", state_rule_id: "${d_rule}", down_payment_cents: 100000, service_fee_cents: 2000, installment_count: 6, first_installment_due_date: "2026-10-01" }
              as: FinanceAnalyst
              as_user_id: "analyst-origin"
              captures: { d_agr: "$.data.id" }
            - call: "POST /agreements/${d_agr}/policies"
              payload: { insurer_id: "${d_insurer}", policy_number: "SM-D-1", gross_premium_cents: 600000, effective_date: "2026-09-01", expiration_date: "2027-09-01" }
              as: FinanceAnalyst
              as_user_id: "analyst-origin"
              captures: { d_pol: "$.data.id", d_min_earned: "$.data.min_earned_days", d_fully: "$.data.fully_earned", d_pol_status: "$.data.status", d_carried: "$.data.carried_over", d_endorsed: "$.data.endorsed_premium_cents", d_returned: "$.data.unearned_premium_returned_cents" }
          assert:
            - "${d_lic_flag} == true — license_required was omitted and defaulted to true, so the OK regime is gated"
            - "${d_insurer_status} == 'ACTIVE' — Insurer.status was omitted and defaulted"
            - "${d_lic_status} == 'ACTIVE' (system default) and ${d_lic_eff} == true, because 2026-01-01 <= clock_date 2026-08-01 < 2027-12-31"
            - "${d_min_earned} == 0 and ${d_fully} == false — both FinancedPolicy optional inputs defaulted"
            - "${d_pol_status} == 'PENDING_VERIFICATION' (initial_state), ${d_carried} == false, ${d_endorsed} == 0 and ${d_returned} == 0"
            - "the ProducerAgent created with initial_reserve_balance_cents 0 reports chargeback_reserve_balance_cents == 0 and outstanding_chargeback_cents == 0"

      - name: system_fields_on_state_rate_rule_creation_are_server_stamped_input_ignored
        claim_type: system_fields
        grounds:
          - entities.StateRateRule.fields.active_agreement_count
          - response_envelope
        distinguishing_aspect: |
          id, created_at, updated_at and version are server-stamped, and the computed
          active_agreement_count is not writable. A request that supplies all five must be accepted
          with the client's values discarded, not rejected and not honoured: version comes back 1 and
          active_agreement_count comes back 0 even though the body asked for 99 and 7.
        test_recipe:
          setup:
            - "empty database at the 2026-08-01 clock default"
          setup_api_calls: []
          trigger:
            - call: "POST /state-rate-rules"
              payload: { state_code: "NM", finance_charge_method: "ADD_ON", max_annual_rate_bps: 1800, max_service_fee_cents: 2000, min_down_payment_bps: 1500, max_term_months: 10, late_fee_bps: 500, late_fee_min_cents: 500, late_fee_max_cents: 10000, grace_period_days: 10, noic_notice_days: 10, unearned_premium_method: "PRO_RATA", short_rate_penalty_bps: 1000, rebate_method: "RULE_OF_78", max_late_fees_per_agreement: 3, id: "client-chosen-id", version: 99, created_at: "1999-01-01T00:00:00Z", active_agreement_count: 7 }
              as: ComplianceOfficer
              captures: { sf_id: "$.data.id", sf_ver: "$.data.version", sf_created: "$.data.created_at", sf_updated: "$.data.updated_at", sf_count: "$.data.active_agreement_count" }
          assert:
            - "HTTP 201 — the unknown/system keys are ignored, not rejected"
            - "${sf_id} != 'client-chosen-id' and is a server-generated identifier"
            - "${sf_ver} == 1, not 99"
            - "${sf_created} is a 2026 ISO 8601 timestamp, not '1999-01-01T00:00:00Z', and ${sf_updated} equals ${sf_created} on a freshly created row"
            - "${sf_count} == 0, not 7 — active_agreement_count is computed from live agreements and never taken from input"

      - name: retrieval_of_producer_agent_returns_stored_and_computed_credit_fields
        claim_type: retrieval
        grounds:
          - entities.ProducerAgent
          - endpoints.GET_agents_id
        distinguishing_aspect: |
          GET /agents/{id} must return the four input fields together with the two computed credit
          fields and the system status. The probe is chargeback_reserve_balance_cents: it is seeded
          from the DIFFERENTLY NAMED input initial_reserve_balance_cents, so a read that returns 0
          proves the seeding was dropped, and a read that exposes initial_reserve_balance_cents
          proves the entity field was never mapped.
        test_recipe:
          setup:
            - "empty database at the 2026-08-01 clock default"
          setup_api_calls:
            - call: "POST /agents"
              payload: { agency_name: "Bluebonnet Insurance Services", state_code: "TX", agent_commission_bps: 1250, chargeback_basis: "RESERVE_CAPPED", chargeback_liability_cap_cents: 750000, initial_reserve_balance_cents: 250000 }
              as: ComplianceOfficer
              captures: { ra_agent: "$.data.id" }
          trigger:
            - call: "GET /agents/${ra_agent}"
              payload: {}
              as: FinanceAnalyst
              captures: { ra_name: "$.data.agency_name", ra_state: "$.data.state_code", ra_comm: "$.data.agent_commission_bps", ra_basis: "$.data.chargeback_basis", ra_cap: "$.data.chargeback_liability_cap_cents", ra_reserve: "$.data.chargeback_reserve_balance_cents", ra_out: "$.data.outstanding_chargeback_cents", ra_status: "$.data.status", ra_ver: "$.data.version" }
          assert:
            - "HTTP 200 with response_type == 'object'"
            - "${ra_name} == 'Bluebonnet Insurance Services', ${ra_state} == 'TX', ${ra_comm} == 1250, ${ra_basis} == 'RESERVE_CAPPED', ${ra_cap} == 750000"
            - "${ra_reserve} == 250000 — seeded from initial_reserve_balance_cents, which is an endpoint input and NOT a ProducerAgent field"
            - "${ra_out} == 0 and ${ra_status} == 'ACTIVE' (system default), ${ra_ver} == 1"

      - name: listing_agreements_paginated_and_filtered_by_insured
        claim_type: listing
        grounds:
          - endpoints.GET_agreements
          - response_envelope.pagination_fields
          - response_envelope.pagination_defaults
        distinguishing_aspect: |
          Three DRAFT agreements exist for two different insureds. The list endpoint has to report
          total_count over the FILTERED set (not the table), compute has_more from limit+offset
          against that same filtered count, and keep offset paging non-overlapping. The probe is the
          second page: with limit 2 offset 2 over a filtered set of 3 it must return exactly one row
          and has_more false, which an implementation that computes has_more from the unfiltered
          count gets wrong.
        test_recipe:
          setup:
            - "the canonical TX regime with an effective License"
            - "two Insureds; one ProducerAgent; three DRAFT agreements — agreements 1 and 2 for insured A, agreement 3 for insured B — created in that order so created_at ascending is deterministic"
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-15T00:00:00Z" }
              as: ComplianceOfficer
            - call: "POST /state-rate-rules"
              payload: { state_code: "TX", finance_charge_method: "ADD_ON", max_annual_rate_bps: 1800, max_service_fee_cents: 2000, min_down_payment_bps: 1500, max_term_months: 10, late_fee_bps: 500, late_fee_min_cents: 500, late_fee_max_cents: 10000, grace_period_days: 10, noic_notice_days: 10, unearned_premium_method: "PRO_RATA", short_rate_penalty_bps: 1000, rebate_method: "RULE_OF_78", max_late_fees_per_agreement: 3, license_required: true }
              as: ComplianceOfficer
              captures: { pg_rule: "$.data.id" }
            - call: "POST /state-rate-rules/${pg_rule}/licenses"
              payload: { license_number: "PFC-TX-001", effective_date: "2026-01-01", expiration_date: "2027-12-31" }
              as: ComplianceOfficer
            - call: "POST /insureds"
              payload: { legal_name: "Insured Alpha LLC", mailing_state_code: "TX", email: "ap@alpha.example" }
              as: FinanceAnalyst
              captures: { pg_a: "$.data.id" }
            - call: "POST /insureds"
              payload: { legal_name: "Insured Bravo LLC", mailing_state_code: "TX", email: "ap@bravo.example" }
              as: FinanceAnalyst
              captures: { pg_b: "$.data.id" }
            - call: "POST /agents"
              payload: { agency_name: "Lone Star Brokers", state_code: "TX", agent_commission_bps: 1200, chargeback_basis: "COMMISSION_CAPPED", chargeback_liability_cap_cents: 500000, initial_reserve_balance_cents: 100000 }
              as: ComplianceOfficer
              captures: { pg_agent: "$.data.id" }
            - call: "POST /agreements"
              payload: { insured_id: "${pg_a}", producer_agent_id: "${pg_agent}", state_rule_id: "${pg_rule}", down_payment_cents: 100000, service_fee_cents: 2000, installment_count: 6, first_installment_due_date: "2026-10-01" }
              as: FinanceAnalyst
              as_user_id: "analyst-origin"
              captures: { pg_agr1: "$.data.id" }
            - call: "POST /agreements"
              payload: { insured_id: "${pg_a}", producer_agent_id: "${pg_agent}", state_rule_id: "${pg_rule}", down_payment_cents: 150000, service_fee_cents: 2000, installment_count: 8, first_installment_due_date: "2026-10-01" }
              as: FinanceAnalyst
              as_user_id: "analyst-origin"
              captures: { pg_agr2: "$.data.id" }
            - call: "POST /agreements"
              payload: { insured_id: "${pg_a}", producer_agent_id: "${pg_agent}", state_rule_id: "${pg_rule}", down_payment_cents: 200000, service_fee_cents: 1000, installment_count: 6, first_installment_due_date: "2026-10-14" }
              as: FinanceAnalyst
              as_user_id: "analyst-origin"
              captures: { pg_agr3: "$.data.id" }
            - call: "POST /agreements"
              payload: { insured_id: "${pg_b}", producer_agent_id: "${pg_agent}", state_rule_id: "${pg_rule}", down_payment_cents: 100000, service_fee_cents: 2000, installment_count: 6, first_installment_due_date: "2026-10-01" }
              as: FinanceAnalyst
              as_user_id: "analyst-origin"
              captures: { pg_agr4: "$.data.id" }
          trigger:
            - call: "GET /agreements"
              payload: { insured_id: "${pg_a}", limit: 2, offset: 0 }
              as: FinanceAnalyst
              captures: { p1_first: "$.data[0].id", p1_second: "$.data[1].id" }
            - call: "GET /agreements"
              payload: { insured_id: "${pg_a}", limit: 2, offset: 2 }
              as: FinanceAnalyst
              captures: { p2_first: "$.data[0].id" }
            - call: "GET /agreements"
              payload: { insured_id: "${pg_b}" }
              as: FinanceAnalyst
              captures: { p3_first: "$.data[0].id" }
            - call: "GET /agreements"
              payload: { status: "DRAFT" }
              as: ComplianceOfficer
          assert:
            - "page 1: response_type == 'array', total_count == 3, limit == 2, offset == 0, has_more == true, and exactly two rows with ${p1_first} == ${pg_agr1} and ${p1_second} == ${pg_agr2} in created_at ascending order"
            - "page 2: total_count == 3 (the filtered count, unchanged by paging), limit == 2, offset == 2, has_more == false, exactly one row with ${p2_first} == ${pg_agr3}; the pages do not overlap and together cover all three"
            - "the insured B filter returns total_count == 1 with ${p3_first} == ${pg_agr4}, limit == 10 and offset == 0 from pagination_defaults because neither was supplied"
            - "the unfiltered status == 'DRAFT' listing returns total_count == 4 with has_more == false under the default limit of 10, proving the earlier total_count of 3 was filter-scoped"

      - name: agreement_not_found_on_unknown_identifier
        claim_type: not_found
        grounds:
          - errors[ERR_AGREEMENT_NOT_FOUND]
          - validations.priority_3_ERR_AGREEMENT_NOT_FOUND
        distinguishing_aspect: |
          A syntactically well-formed identifier that matches no row must produce
          ERR_AGREEMENT_NOT_FOUND (404) and not a 500 or an empty 200. The read path and a write
          path are both probed, and the write path additionally proves existence is resolved BEFORE
          the state machine: the void call cannot report ERR_AGREEMENT_STATE_INVALID for a row that
          does not exist.
        test_recipe:
          setup:
            - "the canonical TX regime and one DRAFT agreement exist, so the collection is non-empty and a wrong id cannot accidentally match nothing-at-all semantics"
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-15T00:00:00Z" }
              as: ComplianceOfficer
            - call: "POST /state-rate-rules"
              payload: { state_code: "TX", finance_charge_method: "ADD_ON", max_annual_rate_bps: 1800, max_service_fee_cents: 2000, min_down_payment_bps: 1500, max_term_months: 10, late_fee_bps: 500, late_fee_min_cents: 500, late_fee_max_cents: 10000, grace_period_days: 10, noic_notice_days: 10, unearned_premium_method: "PRO_RATA", short_rate_penalty_bps: 1000, rebate_method: "RULE_OF_78", max_late_fees_per_agreement: 3, license_required: true }
              as: ComplianceOfficer
              captures: { nf_rule: "$.data.id" }
            - call: "POST /insureds"
              payload: { legal_name: "Cascade Logistics Inc", mailing_state_code: "TX", email: "ap@cascade.example" }
              as: FinanceAnalyst
              captures: { nf_insured: "$.data.id" }
            - call: "POST /agents"
              payload: { agency_name: "Lone Star Brokers", state_code: "TX", agent_commission_bps: 1200, chargeback_basis: "COMMISSION_CAPPED", chargeback_liability_cap_cents: 500000, initial_reserve_balance_cents: 100000 }
              as: ComplianceOfficer
              captures: { nf_agent: "$.data.id" }
            - call: "POST /agreements"
              payload: { insured_id: "${nf_insured}", producer_agent_id: "${nf_agent}", state_rule_id: "${nf_rule}", down_payment_cents: 100000, service_fee_cents: 2000, installment_count: 6, first_installment_due_date: "2026-10-01" }
              as: FinanceAnalyst
              as_user_id: "analyst-origin"
              captures: { nf_agr: "$.data.id" }
          trigger:
            - call: "GET /agreements/00000000-0000-4000-8000-000000000999"
              payload: {}
              as: FinanceAnalyst
              captures: { nf_get_error: "$.data.error_id", nf_get_msg: "$.data.message" }
            - call: "POST /agreements/00000000-0000-4000-8000-000000000999/void"
              payload: { reason: "probe" }
              as: FinanceAnalyst
              as_user_id: "analyst-origin"
              captures: { nf_void_error: "$.data.error_id" }
            - call: "GET /agreements/00000000-0000-4000-8000-000000000999/installments"
              payload: { limit: 10 }
              as: FinanceAnalyst
              captures: { nf_sub_error: "$.data.error_id" }
          assert:
            - "${nf_get_error} == 'ERR_AGREEMENT_NOT_FOUND' with HTTP 404, response_type == 'error', and ${nf_get_msg} a non-empty string"
            - "${nf_void_error} == 'ERR_AGREEMENT_NOT_FOUND' with HTTP 404 — priority 3 resolves existence before priority 11's ERR_AGREEMENT_STATE_INVALID"
            - "${nf_sub_error} == 'ERR_AGREEMENT_NOT_FOUND' with HTTP 404 — a sub-resource list on a missing parent 404s rather than returning an empty array with total_count 0"
            - "the real agreement ${nf_agr} is untouched and still readable with status 'DRAFT'"

      - name: agreement_creation_missing_required_first_installment_due_date
        claim_type: required_fields
        grounds:
          - endpoints.POST_agreements
          - validations.priority_7_ERR_INVALID_REQUEST
          - errors[ERR_INVALID_REQUEST]
        distinguishing_aspect: |
          Every non-optional key in POST /agreements `input:` is required. The omission probed is
          first_installment_due_date, which is also the subject of the priority-33 temporal window
          check — so the expected error is ERR_INVALID_REQUEST (400) from priority 7 and NOT
          ERR_INVALID_FIRST_DUE_DATE (422) from priority 33: a missing value is a shape defect, not
          an out-of-window date, and no PremiumFinanceAgreement row may be created.
        test_recipe:
          setup:
            - "the canonical TX regime with an effective License, one Insured and one ProducerAgent, so every OTHER precondition of POST /agreements is satisfied and the omission is the only defect"
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-15T00:00:00Z" }
              as: ComplianceOfficer
            - call: "POST /state-rate-rules"
