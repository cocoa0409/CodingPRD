          2026-08-07). Priority 5 wins: ERR_WORK_ORDER_INVALID_STATE.
        test_recipe:
          setup:
            - "Full pipeline to CONSENT_GRANTED (close 2026-08-06, tally sweep at 2026-08-07)"
