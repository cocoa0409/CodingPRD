            - &AGRLAD2
              call: "POST /reseller-agreements"
              payload: { reseller_id: "${resl2}", policy_id: "${polf}", permitted_channels: ["MARKETPLACE"], quality_obligations: ["AUTHENTICITY_LABELING"], term_ends_at: "2027-06-30T00:00:00Z" }
              as: BrandChannelManager
              captures: { agrl2: $.data.id }
            - call: "POST /reseller-agreements/${agrl2}/send"
              payload: {}
              as: BrandChannelManager
            - call: "POST /reseller-agreements/${agrl2}/respond"
              payload: { decision: "COUNTERSIGN", non_negotiation_acknowledged: true }
              as: Reseller
              as_user_id: "${resl2}"
            - call: "POST /reseller-agreements/${agrl2}/activate"
              payload: {}
              as: BrandChannelManager
