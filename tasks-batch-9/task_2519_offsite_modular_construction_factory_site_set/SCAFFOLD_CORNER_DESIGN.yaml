          rationale: "The same-actor rejection and the successful peer review by a different X-User-ID are both asserted inside that instance's revision loop."

  # ===========================================================================
  - section: cross-cutting complexity layers
    instances:
      - name: stale_expected_project_version_is_rejected_on_design_package_create
        claim_type: optimistic_concurrency
        grounds:
          - concurrency_rules[design-revision-create-stale-project]
          - validations[priority=9]
          - endpoints[POST /modular/design-packages]
        distinguishing_aspect: |
          The §1.2.1 rule guards the design-package create against a Project whose version has moved.
          A weather observation is enough to advance it, so a client holding the version it read at
          project creation must be refused with 412 and must succeed after re-reading.
        test_recipe:
          setup: ["clock at 2026-09-01T08:00:00Z; Project Rainier Flats at version 1, no design packages"]
          setup_api_calls:
            - call: "POST /modular/_clock/set_current_utc"
              payload: { current_utc: "2026-09-01T08:00:00Z" }
              as: ProgramAdmin
            - call: "POST /modular/factories"
              payload: { name: "Puget Modular Plant 1", code: "PMP1", takt_minutes: 90, station_count: 6, parallel_station_capacity: 2, wip_unit_value_cents: 8750000 }
              as: ProgramAdmin
              captures: { fac: "$.data.id" }
            - call: "POST /modular/projects"
              payload: { name: "Rainier Flats", factory_id: "${fac}", state_code: "WA", ahj_code: "SEA", planned_module_count: 4, contract_price_cents: 3200000000, forecast_wind_gust_mph: 0, crane_capacity_chart: [{ radius_ft: 90, capacity_lb: 96000 }] }
              as: ProgramAdmin
              captures: { proj: "$.data.id", projv: "$.data.version" }
          trigger:
            - call: "POST /modular/projects/${proj}/weather-observations"
              payload: { forecast_precip_probability_pct: 20, forecast_wind_gust_mph: 5 }
              as: SiteSuperintendent
              as_user_id: "${proj}"
              captures: { pv2: "$.data.version" }
            - call: "POST /modular/design-packages"
              payload: { project_id: "${proj}", revision_index: 1, module_split_count: 4, expected_project_version: "${projv}", connection_detail_state: "COMPLETE" }
              as: DesignEngineer
              as_user_id: "eng-001"
              captures: { err: "$.data.error_id" }
            - call: "POST /modular/design-packages"
              payload: { project_id: "${proj}", revision_index: 1, module_split_count: 4, expected_project_version: "${pv2}", connection_detail_state: "COMPLETE" }
              as: DesignEngineer
              as_user_id: "eng-001"
              captures: { pkg: "$.data.id", fs: "$.data.freeze_state" }
          assert:
            - "${projv} == 1 and ${pv2} == 2 — the observation advanced the parent"
            - "${err} == 'ERR_STALE_PROJECT_VERSION' with HTTP 412, the error_id declared by the concurrency rule"
            - "${fs} == 'DRAFT' with ${pkg} stored once the refreshed version is supplied"
            - "GET /modular/design-packages?project_id=${proj} returns total_count == 1 — the rejected attempt created nothing"

      - name: stale_expected_shipment_version_is_rejected_on_load_module
        claim_type: optimistic_concurrency
        grounds:
          - concurrency_rules[shipment-load-stale-shipment]
          - validations[priority=10]
          - endpoints[POST /modular/shipments/{shipmentId}/load-module]
        distinguishing_aspect: |
          The second §1.2.1 rule guards the load against a shipment whose envelope has already been
          recomputed. The first load itself is what invalidates the client's view, so a coordinator
          replaying the version it read at shipment creation must be refused at 412 — and the guard
          runs at priority 10, ahead of every state and business check.
        test_recipe:
          setup:
            - "clock at 2026-09-01T08:00:00Z; FROZEN R1 pinned by an APPROVED state plan review; agency CIS ACCREDITED in WA"
            - "M-01 and M-02 both LINE_COMPLETE with qc RELEASED; empty DRAFT shipment at version 1"
