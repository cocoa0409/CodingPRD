          - "errors[ERR_SITE_CAPACITY_EXCEEDED]"
        distinguishing_aspect: "Stockpile capacity admits equality: net 0.30 cy into capacity 0.30 succeeds; the next 0.15 cy overflows and is rejected."
        test_recipe:
          setup: ["Program ACTIVE; site OPEN with capacity_cy 0.3"]
          setup_api_calls:
