          setup: ["empty DB"]
          setup_api_calls: []
          trigger:
            - { call: "GET /lien/projects/8a3e1c0b-2f4d-4a91-9c8b-12e7b6a0f1d2", payload: {}, as: OpsAgent, captures: { err: $.data.error_id, msg: $.data.message } }
          assert:
            - "response_type == 'error'; data.error_id == ERR_NOT_FOUND; data.message is a non-empty string"

      - name: error_file_from_draft_covered_by_difficulty
