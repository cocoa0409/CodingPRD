              payload: { blend_batch_id: "${batch1}", package_configuration_id: "${cfg_pail}", packaging_line_id: "${pline1}", window_start: "2026-08-03T12:00:00Z", window_end: "2026-08-03T14:00:00Z", planned_units: 100 }
              as: BlendOperator
              captures: { err: $.data.error_id }
          assert:
            - "run3 at [13:00, 15:00] touches run2's end at 13:00 and is therefore counted as overlapping, but the count is 1 which is below max_concurrent_runs 2, so it is ACCEPTED with status SCHEDULED"
            - "PackagingLine.${pline1}.scheduled_run_count == 3 after run3"
            - "the fourth run at [12:00, 14:00] overlaps run1 (touching at 12:00), run2 and run3, giving a count of 3, and returns HTTP 409 with data.error_id == ERR_LINE_CAPACITY_EXCEEDED"
            - "PackagingLine.${pline1}.scheduled_run_count is still 3 after the refusal"
            - "GET /packaging-runs?packaging_line_id=${pline1} returns exactly 3 rows"

  # ===========================================================================
  - rule_id: compensating_invariant
    instances:

      - name: cancel_charge_conserves_component_lot_mass
        grounds:
          - calculations.component_lot_availability
          - state_machines.BlendBatch.CHARGING_to_PLANNED
          - state_machines.ComponentLot.DEPLETED_to_AVAILABLE
          - entities.ComponentDraw.fields.status
          - entities.ComponentLot.fields.available_kg
        distinguishing_aspect: |
          Conserved quantity: MASS. For every ComponentLot the identity
          available_kg + sum(drawn_kg over RESERVED and CONSUMED draws) == received_kg must hold
          before the charge, after the charge and after the compensating cancel-charge, so the
          400.0 / 1500.0 / 300.0 / 400.0 kg lot balances return to their exact pre-charge values.
        test_recipe:
          setup:
            - "Logical clock at 2026-08-02T06:00:00Z."
            - "Four lots exist with received_kg 400.0, 1500.0, 300.0 and 400.0 and available_kg equal to received_kg."
            - "BlendBatch B-0001 is PLANNED against the ACTIVE recipe; TK-01 is AVAILABLE with a 10.0 L HDEO_API_CK4 heel."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-02T06:00:00Z" }
              as: PlatformAdmin
            - call: "POST /component-lots"
              payload: { component_type: "BASE_OIL", component_code: "GRP2-150N", received_kg: 400.0, unit_cost_cents_per_kg: 210, kv100_cst: 5.200, density_kg_per_l: 0.855, additive_family: "NONE", coa_viscosity_verified: true }
              as: PlatformAdmin
              captures: { lot_b1: $.data.id }
            - call: "POST /component-lots"
              payload: { component_type: "BASE_OIL", component_code: "GRP2-150N", received_kg: 1500.0, unit_cost_cents_per_kg: 250, kv100_cst: 5.200, density_kg_per_l: 0.855, additive_family: "NONE", coa_viscosity_verified: true }
              as: PlatformAdmin
              captures: { lot_b2: $.data.id }
            - call: "POST /component-lots"
              payload: { component_type: "VI_IMPROVER", component_code: "OCP-VII", received_kg: 300.0, unit_cost_cents_per_kg: 940, kv100_cst: 850.000, density_kg_per_l: 0.900, additive_family: "NONE", coa_viscosity_verified: true }
              as: PlatformAdmin
              captures: { lot_v1: $.data.id }
            - call: "POST /component-lots"
              payload: { component_type: "ADDITIVE_PACKAGE", component_code: "ADD-SN-PLUS", received_kg: 400.0, unit_cost_cents_per_kg: 620, kv100_cst: 105.000, density_kg_per_l: 0.960, additive_family: "ZDDP_PCMO", coa_viscosity_verified: true }
              as: PlatformAdmin
              captures: { lot_a1: $.data.id }
            - call: "POST /product-specs"
              payload: { product_code: "LUBE-0W20-SP", sae_grade: "0W-20", target_kv100_cst: 7.600, kv100_tolerance_pct: 3.0, min_additive_treat_pct: 8.00, base_stock_group: "GROUP_II", additive_family: "ZDDP_PCMO" }
              as: ProductManager
              captures: { spec1: $.data.id }
            - call: "POST /product-specs/${spec1}/activate"
              payload: {}
              as: ProductManager
            - call: "POST /blend-recipes"
              payload: { product_spec_id: "${spec1}", total_mass_basis_kg: 1000.0, components: [ { component_code: "GRP2-150N", component_type: "BASE_OIL", mass_fraction_pct: 84.00, nominal_kv100_cst: 5.200, additive_family: "NONE" }, { component_code: "OCP-VII", component_type: "VI_IMPROVER", mass_fraction_pct: 6.00, nominal_kv100_cst: 850.000, additive_family: "NONE" }, { component_code: "ADD-SN-PLUS", component_type: "ADDITIVE_PACKAGE", mass_fraction_pct: 10.00, nominal_kv100_cst: 105.000, additive_family: "ZDDP_PCMO" } ] }
              as: ProductManager
              captures: { recipe1: $.data.id }
            - call: "POST /blend-recipes/${recipe1}/activate"
              payload: {}
              as: ProductManager
            - call: "POST /blend-tanks"
              payload: { tank_code: "TK-01", capacity_l: 5000.0, heel_volume_l: 10.0, heel_additive_family: "HDEO_API_CK4", heel_product_code: "HDEO-15W40" }
              as: PlatformAdmin
              captures: { tank1: $.data.id }
            - call: "POST /blend-batches"
              payload: { blend_recipe_id: "${recipe1}", batch_code: "B-0001", planned_volume_l: 2000.0 }
              as: BlendOperator
              captures: { batch1: $.data.id }
          trigger:
            - call: "POST /blend-batches/${batch1}/charge"
              payload: { blend_tank_id: "${tank1}", charge_volume_l: 1990.0, window_start: "2026-08-02T08:00:00Z", window_end: "2026-08-02T12:00:00Z" }
              as: BlendOperator
            - call: "POST /blend-batches/${batch1}/cancel-charge"
              payload: { reason: "OPERATOR_ABORT" }
              as: BlendOperator
          assert:
            - "after the charge, ComponentLot.${lot_b1}.available_kg == 0.000 and status == DEPLETED"
            - "after the charge, ComponentLot.${lot_b2}.available_kg == 462.424"
            - "after the charge, ComponentLot.${lot_v1}.available_kg == 197.316"
            - "after the charge, ComponentLot.${lot_a1}.available_kg == 228.860"
            - "after cancel-charge, ComponentLot.${lot_b1}.available_kg == 400.000 and status == AVAILABLE"
            - "after cancel-charge, ComponentLot.${lot_b2}.available_kg == 1500.000"
            - "after cancel-charge, ComponentLot.${lot_v1}.available_kg == 300.000"
            - "after cancel-charge, ComponentLot.${lot_a1}.available_kg == 400.000"
            - "GET /blend-batches/${batch1}/component-draws returns 4 rows, all with status RETURNED"
            - "GET /component-lots/${lot_b2}/draws returns 1 row with drawn_kg 1037.576 and status RETURNED"
            - "BlendBatch.${batch1}.estimated_component_cost_cents == 0 and component_cost_cents == 0"
            - "BlendTank.${tank1}.status == AVAILABLE, heel_volume_l == 10.0, heel_additive_family == HDEO_API_CK4"

      - name: order_void_conserves_customer_takeback_credit_ledger
        grounds:
          - calculations.customer_takeback_credit_balance
          - state_machines.Order.CONFIRMED_to_VOID
          - state_machines.OrderLine.OPEN_to_CANCELLED
          - entities.Customer.fields.takeback_credit_balance_cents
          - entities.Order.fields.takeback_credit_applied_cents
          - concurrency_rules[takeback-credit-apply-stale-customer]
        distinguishing_aspect: |
          Conserved quantity: MONEY, a different type from the mass invariant. The identity
          sum(CREDITED collection credit_cents) - sum(takeback_credit_applied_cents over orders
          in CONFIRMED, HOLD or INVOICED) == Customer.takeback_credit_balance_cents must survive
          apply-then-void, restoring the balance from 1227410 back to exactly 1357500.
        test_recipe:
          setup:
            - "Logical clock at 2026-08-02T06:00:00Z."
            - "Customer BRAVO is TIER_B with takeback_agreement_status ACTIVE and credit_limit_cents 5000000."
            - "One CREDITED 60000.0 L collection assayed at 6.5 / 3.0 granted 1357500 cents."
            - "A CONFIRMED, takeback_linked PACKAGED order with two OPEN lines has pre_credit_total_cents 867272 and has already drawn 130090 cents of credit."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-02T06:00:00Z" }
              as: PlatformAdmin
            - call: "POST /customers"
              payload: { name: "Bravo Distribution", customer_type: "PRIVATE_LABEL", contract_tier: "TIER_B", credit_limit_cents: 5000000, takeback_agreement_status: "ACTIVE" }
              as: PlatformAdmin
              captures: { cust1: $.data.id }
            - call: "POST /product-specs"
              payload: { product_code: "LUBE-0W20-SP", sae_grade: "0W-20", target_kv100_cst: 7.600, kv100_tolerance_pct: 3.0, min_additive_treat_pct: 8.00, base_stock_group: "GROUP_II", additive_family: "ZDDP_PCMO" }
              as: ProductManager
              captures: { spec1: $.data.id }
            - call: "POST /product-specs/${spec1}/activate"
              payload: {}
              as: ProductManager
            - call: "POST /package-configurations"
              payload: { product_spec_id: "${spec1}", package_type: "PAIL_20L", label_brand: "Bravo Blue", fill_volume_l: 20.0, private_label: true, customer_id: "${cust1}", claim_codes: [] }
              as: ProductManager
              captures: { cfg_pail: $.data.id }
            - call: "POST /package-configurations/${cfg_pail}/activate"
              payload: {}
              as: ProductManager
            - call: "POST /package-configurations"
              payload: { product_spec_id: "${spec1}", package_type: "DRUM_205L", label_brand: "House Drum", fill_volume_l: 205.0, private_label: false, claim_codes: [] }
              as: ProductManager
              captures: { cfg_drum: $.data.id }
            - call: "POST /package-configurations/${cfg_drum}/activate"
              payload: {}
              as: ProductManager
            - call: "POST /takeback-collections"
              payload: { customer_id: "${cust1}", scheduled_volume_l: 60000.0 }
              as: SalesRep
              captures: { tb1: $.data.id }
            - call: "POST /takeback-collections/${tb1}/collect"
              payload: { collected_volume_l: 60000.0 }
              as: SalesRep
            - call: "POST /takeback-collections/${tb1}/assay"
              payload: { water_pct: 6.5, sediment_pct: 3.0 }
              as: QCTechnician
            - call: "POST /takeback-collections/${tb1}/credit"
              payload: {}
              as: SalesRep
            - call: "POST /orders"
              payload: { customer_id: "${cust1}", delivery_mode: "PACKAGED", takeback_linked: true }
              as: SalesRep
              captures: { ord1: $.data.id }
            - call: "POST /orders/${ord1}/lines"
              payload: { package_configuration_id: "${cfg_pail}", quantity_units: 37 }
              as: SalesRep
              captures: { line1: $.data.id }
            - call: "POST /orders/${ord1}/lines"
              payload: { package_configuration_id: "${cfg_drum}", quantity_units: 6 }
              as: SalesRep
              captures: { line2: $.data.id }
            - call: "POST /orders/${ord1}/confirm"
              payload: {}
              as: SalesRep
            - call: "GET /customers/${cust1}"
              payload: {}
              as: SalesRep
              captures: { cust1_v: $.data.version }
            - call: "POST /orders/${ord1}/apply-takeback-credit"
              payload: { expected_customer_version: "${cust1_v}" }
              as: SalesRep
          trigger:
            - call: "POST /orders/${ord1}/void"
              payload: { reason: "CUSTOMER_CANCELLED" }
              as: SalesRep
          assert:
            - "before the void, Customer.${cust1}.takeback_credit_balance_cents == 1227410 and Order.${ord1}.takeback_credit_applied_cents == 130090"
            - "after the void, Order.${ord1}.status == VOID"
            - "after the void, Order.${ord1}.takeback_credit_applied_cents == 0"
            - "after the void, Order.${ord1}.total_cents == 867272 and pre_credit_total_cents == 867272"
            - "after the void, Customer.${cust1}.takeback_credit_balance_cents == 1357500"
            - "TakebackCollection.${tb1}.credit_cents is still 1357500 and status is still CREDITED"
            - "OrderLine.${line1}.status == CANCELLED and OrderLine.${line2}.status == CANCELLED"
