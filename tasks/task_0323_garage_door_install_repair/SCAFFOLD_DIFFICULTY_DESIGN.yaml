  # ===========================================================================
  - rule_id: compensating_invariant
    instances:
      - name: ci_part_inventory_conservation_on_cancel
        grounds:
          - state_machines.Job.dispatch_status.UNSCHEDULED_to_SCHEDULED
          - state_machines.PartReservation.status.HELD_to_RELEASED
          - entities.Part.fields.on_hand_qty
          - entities.Part.fields.reserved_qty
          - entities.Part.fields.available_qty
        distinguishing_aspect: |
          Conserved quantity = part inventory: on_hand_qty == reserved_qty + available_qty.
          Accept reserves 2 (reserved 2, available 8), then job /cancel releases them
          (reserved 0, available 10) leaving on_hand 10 unchanged across forward+compensating.
        test_recipe:
          setup:
            - "A SCHEDULED job with one HELD reservation qty 2 against a part on_hand 10; then the job is cancelled."
          setup_api_calls:
            - call: "POST /customers"
              payload: { full_name: "In Vent", email: "in@x.com", service_address: "17 Q St" }
              as: ServiceManager
              captures: { cust_id: $.data.id }
            - call: "POST /technicians"
              payload: { display_name: "Oki", skill_level: "CERTIFIED", certified_for_install: true }
              as: ServiceManager
              captures: { tech_id: $.data.id }
            - call: "POST /parts"
              payload: { sku: "SPR-3", category: "SPRING", unit_price_cents: 10000, markup_pct: 0.35, on_hand_qty: 10 }
              as: ServiceManager
              captures: { spring_id: $.data.id }
            - call: "POST /quotes"
              payload: { customer_id: "${cust_id}", quote_type: "SERVICE_CALL", service_call_fee_cents: 5000 }
              as: ServiceManager
              captures: { quote_id: $.data.id }
            - call: "POST /quotes/${quote_id}/lines"
              payload: { item_kind: "PART", item_ref_id: "${spring_id}", qty: 2, unit_price_cents: 10000 }
              as: ServiceManager
            - call: "POST /quotes/${quote_id}/send"
              payload: {}
              as: ServiceManager
            - call: "POST /quotes/${quote_id}/accept"
              payload: {}
              as: Customer
              as_user_id: "${cust_id}"
            - call: "GET /jobs"
              payload: { quote_id: "${quote_id}" }
              as: ServiceManager
              captures: { job_id: "$.data[0].id" }
            - call: "POST /jobs/${job_id}/schedule"
              payload: { technician_id: "${tech_id}", scheduled_start: "2026-07-01T17:00:00Z", scheduled_end: "2026-07-01T18:00:00Z" }
              as: Dispatcher
          trigger:
            - call: "POST /jobs/${job_id}/cancel"
              payload: {}
              as: Dispatcher
            - call: "GET /parts/${spring_id}"
              payload: {}
              as: ServiceManager
              captures: { oh: $.data.on_hand_qty, rq: $.data.reserved_qty, aq: $.data.available_qty }
          assert:
            - "Part.${spring_id}.on_hand_qty == 10"
            - "Part.${spring_id}.reserved_qty == 0"
            - "Part.${spring_id}.available_qty == 10"

      - name: ci_technician_booked_minutes_conservation_on_cancel
        grounds:
          - state_machines.Job.dispatch_status.UNSCHEDULED_to_SCHEDULED
          - state_machines.Job.dispatch_status.UNSCHEDULED_to_CANCELLED
          - entities.Technician.fields.booked_minutes
        distinguishing_aspect: |
          Different conserved quantity = technician booked minutes. Scheduling a 60-min window
          adds 60 to booked_minutes; cancelling subtracts the same 60, returning booked_minutes
          to 0 (conserved across forward+compensating).
        test_recipe:
          setup:
            - "A SCHEDULED job over a 60-minute window (booked_minutes 60), then cancelled."
          setup_api_calls:
            - call: "POST /customers"
              payload: { full_name: "Mi Nutes", email: "mi@x.com", service_address: "18 R St" }
              as: ServiceManager
              captures: { cust_id: $.data.id }
            - call: "POST /technicians"
              payload: { display_name: "Pat", skill_level: "CERTIFIED", certified_for_install: true }
              as: ServiceManager
              captures: { tech_id: $.data.id }
            - call: "POST /quotes"
              payload: { customer_id: "${cust_id}", quote_type: "SERVICE_CALL", service_call_fee_cents: 5000 }
              as: ServiceManager
              captures: { quote_id: $.data.id }
            - call: "POST /quotes/${quote_id}/lines"
              payload: { item_kind: "LABOR", qty: 30 }
              as: ServiceManager
            - call: "POST /quotes/${quote_id}/send"
              payload: {}
              as: ServiceManager
            - call: "POST /quotes/${quote_id}/accept"
              payload: {}
              as: Customer
              as_user_id: "${cust_id}"
            - call: "GET /jobs"
              payload: { quote_id: "${quote_id}" }
              as: ServiceManager
              captures: { job_id: "$.data[0].id" }
            - call: "POST /jobs/${job_id}/schedule"
              payload: { technician_id: "${tech_id}", scheduled_start: "2026-07-01T17:00:00Z", scheduled_end: "2026-07-01T18:00:00Z" }
              as: Dispatcher
            - call: "GET /technicians/${tech_id}"
              payload: {}
              as: ServiceManager
              captures: { bm_before: $.data.booked_minutes }
          trigger:
            - call: "POST /jobs/${job_id}/cancel"
              payload: {}
              as: Dispatcher
            - call: "GET /technicians/${tech_id}"
              payload: {}
              as: ServiceManager
              captures: { bm_after: $.data.booked_minutes }
          assert:
            - "Technician.${tech_id}.booked_minutes == 0"
