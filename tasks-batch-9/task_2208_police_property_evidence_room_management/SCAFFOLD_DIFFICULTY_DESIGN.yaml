# =============================================================================
# §1.8 Scaffold Difficulty Design — Test Targeting Index
# Task 2208 — Police Property and Evidence Room Management
#
# 9 rule_ids / 23 instances. Every numeric and temporal literal below was
# computed by executing the corresponding SCAFFOLD.yaml §1.3 formula.
#
# The canonical empty-DB fixture chain is anchored once in the first instance
# (&k_clock … &k_case2) and aliased by every later instance, so all instances
# share one reproducible base state:
#   clock 2026-08-01T00:00:00Z; room CPD "Central Property Unit";
#   statutes TH-3 (365/30/STANDARD) and AB-1 (0/0/STANDARD);
#   locations G-01 GENERAL(2), V-01 HIGH_VALUE_VAULT(3, dual-signature),
#             R-01 / R-02 REFRIGERATED(3, 3.5C), Y-01 OVERSIZED_YARD(2);
#   custodians T-100 / T-101 EVIDENCE_TECH, L-200 LAB_ANALYST,
#              I-300 INVESTIGATOR, A-400 AUDITOR (all certified to 2028-01-01);
#   cases 26-00001 (TH-3) and 26-00002 (AB-1).
# =============================================================================

scaffold_difficulty_design:

  # ===========================================================================
  - rule_id: dual_variant_calc
    instances:

      - name: retention_preliminary_vs_final_diverge_on_same_item
        grounds:
          - "calculations.retention_release_at"
          - "entities.EvidenceItem.fields.retention_release_at"
          - "entities.EvidenceItem.fields.retention_basis"
          - "entities.RetentionDetermination.fields.statute_days_applied"
          - "state_machines.Case.CHARGED_to_ADJUDICATED"
        distinguishing_aspect: |
          The two variants of the RETENTION domain calculation diverge on one unchanged item:
          PRELIMINARY anchors on intake_at with the full 365 statutory days (2027-08-01), FINAL
          anchors on adjudicated_at with appeal_window_days + ceil(365 * 0.5) = 213 days
          (2027-04-16), so the FINAL release is 107 days EARLIER than the PRELIMINARY one.
        test_recipe:
          setup:
            - "Clock at 2026-08-01T00:00:00Z; room CPD with statute TH-3 (365 statutory days, 30 appeal days)."
            - "One GENERAL item logged into case 26-00001 and stored in G-01; its intake determination is PRELIMINARY."
            - "Case charged, then the clock advanced to 2026-09-15T00:00:00Z before adjudication."
          setup_api_calls:
            - &k_clock
              call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-08-01T00:00:00Z" }
              as: PropertyRoomManager
            - &k_room
              call: "POST /property-rooms"
              payload: { name: "Central Property Unit", agency_code: "CPD" }
              as: PropertyRoomManager
              captures: { room_id: $.data.id }
            - &k_stat_th3
              call: "POST /offense-statutes"
              payload: { offense_code: "TH-3", description: "Grand theft third degree", preservation_class: "STANDARD", statutory_retention_days: 365, appeal_window_days: 30, destruction_requires_court_order: false }
              as: PropertyRoomManager
              captures: { th3_id: $.data.id }
            - &k_stat_ab1
              call: "POST /offense-statutes"
              payload: { offense_code: "AB-1", description: "Abandoned property recovery", preservation_class: "STANDARD", statutory_retention_days: 0, appeal_window_days: 0, destruction_requires_court_order: false }
              as: PropertyRoomManager
              captures: { ab1_id: $.data.id }
            - &k_loc_g
              call: "POST /storage-locations"
              payload: { property_room_id: "${room_id}", code: "G-01", category: "GENERAL", capacity_slots: 2 }
              as: PropertyRoomManager
              captures: { loc_g_id: $.data.id, loc_g_v: $.data.version }
            - &k_loc_v
              call: "POST /storage-locations"
              payload: { property_room_id: "${room_id}", code: "V-01", category: "HIGH_VALUE_VAULT", capacity_slots: 3, requires_dual_signature: true }
              as: PropertyRoomManager
              captures: { loc_v_id: $.data.id, loc_v_v: $.data.version }
            - &k_loc_r
              call: "POST /storage-locations"
              payload: { property_room_id: "${room_id}", code: "R-01", category: "REFRIGERATED", capacity_slots: 3, temperature_c: 3.5 }
              as: PropertyRoomManager
              captures: { loc_r_id: $.data.id, loc_r_v: $.data.version }
            - &k_loc_r2
              call: "POST /storage-locations"
              payload: { property_room_id: "${room_id}", code: "R-02", category: "REFRIGERATED", capacity_slots: 3, temperature_c: 3.5 }
              as: PropertyRoomManager
              captures: { loc_r2_id: $.data.id, loc_r2_v: $.data.version }
            - &k_loc_y
              call: "POST /storage-locations"
              payload: { property_room_id: "${room_id}", code: "Y-01", category: "OVERSIZED_YARD", capacity_slots: 2 }
              as: PropertyRoomManager
              captures: { loc_y_id: $.data.id, loc_y_v: $.data.version }
            - &k_tech
              call: "POST /custodians"
              payload: { property_room_id: "${room_id}", badge_number: "T-100", full_name: "Tara Ng", role_type: "EVIDENCE_TECH", certification_expires_at: "2028-01-01T00:00:00Z" }
              as: PropertyRoomManager
              captures: { tech_id: $.data.id }
            - &k_tech2
              call: "POST /custodians"
              payload: { property_room_id: "${room_id}", badge_number: "T-101", full_name: "Tom Reed", role_type: "EVIDENCE_TECH", certification_expires_at: "2028-01-01T00:00:00Z" }
              as: PropertyRoomManager
              captures: { tech2_id: $.data.id }
            - &k_lab
              call: "POST /custodians"
              payload: { property_room_id: "${room_id}", badge_number: "L-200", full_name: "Lena Ruiz", role_type: "LAB_ANALYST", certification_expires_at: "2028-01-01T00:00:00Z" }
              as: PropertyRoomManager
              captures: { lab_id: $.data.id }
            - &k_inv
              call: "POST /custodians"
              payload: { property_room_id: "${room_id}", badge_number: "I-300", full_name: "Ivan Cole", role_type: "INVESTIGATOR", certification_expires_at: "2028-01-01T00:00:00Z" }
              as: PropertyRoomManager
              captures: { inv_id: $.data.id }
            - &k_aud
              call: "POST /custodians"
              payload: { property_room_id: "${room_id}", badge_number: "A-400", full_name: "Ada Vance", role_type: "AUDITOR", certification_expires_at: "2028-01-01T00:00:00Z" }
              as: PropertyRoomManager
              captures: { aud_id: $.data.id }
            - &k_case1
              call: "POST /cases"
              payload: { property_room_id: "${room_id}", case_number: "26-00001", offense_statute_id: "${th3_id}" }
              as: PropertyRoomManager
              captures: { case1_id: $.data.id }
            - &k_case2
              call: "POST /cases"
              payload: { property_room_id: "${room_id}", case_number: "26-00002", offense_statute_id: "${ab1_id}" }
              as: PropertyRoomManager
              captures: { case2_id: $.data.id }
            - call: "POST /evidence-items"
              payload: { case_id: "${case1_id}", item_description: "Pawn ticket folder", category: "GENERAL", packaging_type: "RIGID_BOX", appraised_value_cents: 120000, seized_at: "2026-07-31T12:00:00Z" }
              as: EvidenceTechnician
              as_user_id: "${tech_id}"
              captures: { item_id: $.data.id, prelim_release: $.data.retention_release_at }
            - call: "POST /evidence-items/${item_id}/storage-assignment"
              payload: { storage_location_id: "${loc_g_id}" }
              as: EvidenceTechnician
              as_user_id: "${tech_id}"
            - call: "POST /cases/${case1_id}/charge"
              payload: {}
              as: Investigator
              as_user_id: "${inv_id}"
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-09-15T00:00:00Z" }
              as: PropertyRoomManager
          trigger:
            - call: "POST /cases/${case1_id}/adjudicate"
              payload: {}
              as: CourtClerk
            - call: "GET /evidence-items/${item_id}"
              payload: {}
              as: PropertyRoomManager
              captures: { final_release: $.data.retention_release_at, item_v_after: $.data.version }
          assert:
            - "Before adjudication, EvidenceItem.${item_id}.retention_release_at == '2027-08-01T00:00:00.000Z' and retention_basis == 'PRELIMINARY'"
            - "After adjudication, EvidenceItem.${item_id}.retention_release_at == '2027-04-16T00:00:00.000Z' and retention_basis == 'FINAL'"
            - "The two variants differ: ${prelim_release} == '2027-08-01T00:00:00.000Z' != ${final_release} == '2027-04-16T00:00:00.000Z' (FINAL is 107 days earlier)"
            - "GET /retention-determinations?evidence_item_id=${item_id} returns total_count == 2"
            - "The PRELIMINARY RetentionDetermination has superseded == true, resolved_basis == 'PRELIMINARY', statute_days_applied == 365, anchor_at == '2026-08-01T00:00:00.000Z', computed_release_at == '2027-08-01T00:00:00.000Z'"
            - "The FINAL RetentionDetermination has superseded == false, resolved_basis == 'FINAL', statute_days_applied == 213, anchor_at == '2026-09-15T00:00:00.000Z', computed_release_at == '2027-04-16T00:00:00.000Z'"
            - "EvidenceItem.${item_id}.disposition_state == 'RETAINED' (2027-04-16 is still in the future at 2026-09-15)"

      - name: auction_estimated_vs_settled_proceeds_diverge
        grounds:
          - "calculations.disposition_proceeds"
          - "entities.DispositionOrder.fields.estimated_net_proceeds_cents"
          - "entities.DispositionOrder.fields.settled_net_proceeds_cents"
          - "entities.DispositionOrder.fields.commission_cents"
          - "entities.DispositionOrder.fields.storage_recovery_cents"
          - "state_machines.DispositionOrder.EXECUTED_to_SETTLED"
        distinguishing_aspect: |
          The two variants of the PROCEEDS domain calculation diverge on one unchanged order: ESTIMATED
          uses appraised_value_cents 90000 with the flat 10% estimate rate and no storage recovery
          (81000), while SETTLED uses gross_sale_cents 90000 with the tiered 10% commission minus 273
          days of GENERAL storage at 25 cents/day (74175), so the delta 6825 equals the storage
          recovery the estimate structurally omits.
        test_recipe:
          setup:
            - "A GENERAL item appraised at 90000 cents logged into case 26-00002 (statute AB-1, 0 statutory days) and stored in G-01."
            - "Case adjudicated at 2026-08-01, so the FINAL retention floors at intake + 90 days = 2026-10-30."
            - "Clock advanced to 2026-10-30 and swept so the item becomes DISPOSAL_ELIGIBLE; an AUCTION order with reserve 50000 is created and court-authorized."
            - "Clock advanced to 2027-05-01 before execution, giving 273 storage days from intake."
          setup_api_calls:
            - *k_clock
            - *k_room
            - *k_stat_th3
            - *k_stat_ab1
            - *k_loc_g
            - *k_loc_v
            - *k_loc_r
            - *k_loc_r2
            - *k_loc_y
            - *k_tech
            - *k_tech2
            - *k_lab
            - *k_inv
            - *k_aud
            - *k_case1
            - *k_case2
            - call: "POST /evidence-items"
              payload: { case_id: "${case2_id}", item_description: "Recovered road bicycle", category: "GENERAL", packaging_type: "CHAIN_TAG_ONLY", appraised_value_cents: 90000, seized_at: "2026-07-30T09:00:00Z" }
              as: EvidenceTechnician
              as_user_id: "${tech_id}"
              captures: { item_id: $.data.id }
            - call: "POST /evidence-items/${item_id}/storage-assignment"
              payload: { storage_location_id: "${loc_g_id}" }
              as: EvidenceTechnician
              as_user_id: "${tech_id}"
            - call: "POST /cases/${case2_id}/charge"
              payload: {}
              as: Investigator
              as_user_id: "${inv_id}"
            - call: "POST /cases/${case2_id}/adjudicate"
              payload: {}
              as: CourtClerk
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-10-30T00:00:00Z" }
              as: PropertyRoomManager
            - call: "POST /property-rooms/${room_id}/daily-sweep"
              payload: {}
              as: PropertyRoomManager
            - call: "POST /disposition-orders"
              payload: { evidence_item_id: "${item_id}", type: "AUCTION", requested_by_custodian_id: "${tech_id}", reserve_price_cents: 50000 }
              as: EvidenceTechnician
              as_user_id: "${tech_id}"
              captures: { order_id: $.data.id, estimated: $.data.estimated_net_proceeds_cents }
            - call: "POST /disposition-orders/${order_id}/authorize"
              payload: { court_order_number: "CO-2026-4471" }
              as: CourtClerk
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2027-05-01T00:00:00Z" }
              as: PropertyRoomManager
            - call: "POST /disposition-orders/${order_id}/execute"
              payload: { executed_by_custodian_id: "${tech2_id}", witness_custodian_id: "${inv_id}" }
              as: PropertyRoomManager
          trigger:
            - call: "POST /disposition-orders/${order_id}/settle"
              payload: { gross_sale_cents: 90000 }
              as: PropertyRoomManager
              captures: { settled: $.data.settled_net_proceeds_cents }
          assert:
            - "DispositionOrder.${order_id}.estimated_net_proceeds_cents == 81000 (computed at creation from the appraisal)"
            - "DispositionOrder.${order_id}.commission_cents == 9000"
            - "DispositionOrder.${order_id}.storage_recovery_cents == 6825 (273 days * 25 cents/day for GENERAL, below the 24300 cap)"
            - "DispositionOrder.${order_id}.settled_net_proceeds_cents == 74175"
            - "The two variants differ: ${estimated} == 81000 != ${settled} == 74175, delta 6825 == storage_recovery_cents"
            - "DispositionOrder.${order_id}.settlement_status == 'HELD' and settlement_deadline_at == '2027-05-31T00:00:00.000Z'"
            - "PropertyRoom.${room_id}.escrow_balance_cents == 74175"

  # ===========================================================================
  - rule_id: combinatorial_formula
    instances:

      - name: audit_risk_index_rounds_per_discrepancy_before_summing
        grounds:
          - "calculations.audit_risk_index"
          - "entities.Discrepancy.fields.weight_contribution"
          - "entities.AuditSession.fields.risk_index"
          - "state_machines.AuditSession.IN_PROGRESS_to_RECONCILED"
        distinguishing_aspect: |
          Mode (b) — ROUNDING ORDER: each discrepancy contribution is rounded to 2 dp before the sum,
          so 9.3750 -> 9.38 plus 10.1250 -> 10.13 yields risk_index 19.51, whereas summing the raw
          products (19.5000) and rounding once at the end yields 19.50; the one-cent gap is the only
          observable that separates the two evaluation orders.
        test_recipe:
          setup:
            - "Two BIOLOGICAL items appraised at 250000 and 350000 cents, both stored in R-01 (REFRIGERATED)."
            - "An audit session on R-01 is started and reconciled without scanning either item, so both become MISSING discrepancies."
          setup_api_calls:
            - *k_clock
            - *k_room
            - *k_stat_th3
            - *k_stat_ab1
            - *k_loc_g
            - *k_loc_v
            - *k_loc_r
            - *k_loc_r2
            - *k_loc_y
            - *k_tech
            - *k_tech2
            - *k_lab
            - *k_inv
            - *k_aud
            - *k_case1
            - *k_case2
            - call: "POST /evidence-items"
              payload: { case_id: "${case1_id}", item_description: "Blood swab kit A", category: "BIOLOGICAL", packaging_type: "SHARPS_TUBE", appraised_value_cents: 250000, seized_at: "2026-07-31T08:00:00Z" }
              as: EvidenceTechnician
              as_user_id: "${tech_id}"
              captures: { item_a_id: $.data.id }
            - call: "POST /evidence-items"
              payload: { case_id: "${case1_id}", item_description: "Blood swab kit B", category: "BIOLOGICAL", packaging_type: "SHARPS_TUBE", appraised_value_cents: 350000, seized_at: "2026-07-31T08:30:00Z" }
              as: EvidenceTechnician
              as_user_id: "${tech_id}"
              captures: { item_b_id: $.data.id }
            - call: "POST /evidence-items/${item_a_id}/storage-assignment"
              payload: { storage_location_id: "${loc_r_id}" }
              as: EvidenceTechnician
              as_user_id: "${tech_id}"
            - call: "POST /evidence-items/${item_b_id}/storage-assignment"
              payload: { storage_location_id: "${loc_r_id}" }
              as: EvidenceTechnician
              as_user_id: "${tech_id}"
            - call: "GET /storage-locations/${loc_r_id}"
              payload: {}
              as: InternalAuditor
              as_user_id: "${aud_id}"
              captures: { loc_r_v_now: $.data.version }
            - call: "POST /audit-sessions"
              payload: { storage_location_id: "${loc_r_id}", auditor_id: "${aud_id}", scheduled_start_at: "2026-08-05T09:00:00Z", scheduled_end_at: "2026-08-05T17:00:00Z", expected_storage_location_version: "${loc_r_v_now}" }
              as: InternalAuditor
              as_user_id: "${aud_id}"
              captures: { sess_id: $.data.id }
            - call: "POST /audit-sessions/${sess_id}/start"
              payload: {}
              as: InternalAuditor
              as_user_id: "${aud_id}"
          trigger:
            - call: "POST /audit-sessions/${sess_id}/reconcile"
              payload: {}
              as: InternalAuditor
              as_user_id: "${aud_id}"
              captures: { risk: $.data.risk_index }
          assert:
            - "AuditSession.${sess_id}.expected_item_count == 2 and scanned_item_count == 0 and missing_count == 2"
            - "The Discrepancy for ${item_a_id} has kind == 'MISSING' and weight_contribution == 9.38 (raw 5.0 * 1.25 * 1.5 == 9.3750)"
            - "The Discrepancy for ${item_b_id} has kind == 'MISSING' and weight_contribution == 10.13 (raw 5.0 * 1.35 * 1.5 == 10.1250)"
            - "AuditSession.${sess_id}.risk_index == 19.51, NOT 19.50 (per-discrepancy rounding precedes the sum)"
            - "PropertyRoom.${room_id}.open_discrepancy_count == 2 and missing_high_risk_count == 0 and posture == 'RESTRICTED'"
            - "StorageLocation.${loc_r_id}.occupied_slots == 0 (both items left the STORED occupancy set)"

      - name: settlement_recovery_cap_measured_against_post_commission_subtotal
        grounds:
          - "calculations.disposition_proceeds"
          - "entities.DispositionOrder.fields.storage_recovery_cents"
          - "entities.DispositionOrder.fields.settled_net_proceeds_cents"
          - "calculations.required_storage_category"
        distinguishing_aspect: |
          Mode (c) — EVALUATION ORDER: the 30% storage-recovery cap is computed on the POST-commission
          subtotal (34000 -> cap 10200 -> net 23800), not on the gross sale (which would cap at 12000
          and net 22000); the raw recovery 54600 far exceeds both caps, so the net value alone pins
          which base the cap uses.
        test_recipe:
          setup:
            - "An OVERSIZED item appraised at 40000 cents logged into case 26-00002 (statute AB-1) and stored in Y-01 (OVERSIZED_YARD, 200 cents/day)."
            - "Case adjudicated at 2026-08-01, clock advanced to 2026-10-30 and swept so the item becomes DISPOSAL_ELIGIBLE."
            - "An AUCTION order with reserve 10000 is court-authorized and executed at 2027-05-01 (273 storage days)."
          setup_api_calls:
            - *k_clock
            - *k_room
            - *k_stat_th3
            - *k_stat_ab1
            - *k_loc_g
            - *k_loc_v
            - *k_loc_r
            - *k_loc_r2
            - *k_loc_y
            - *k_tech
            - *k_tech2
            - *k_lab
            - *k_inv
            - *k_aud
            - *k_case1
            - *k_case2
            - call: "POST /evidence-items"
              payload: { case_id: "${case2_id}", item_description: "Abandoned utility trailer", category: "OVERSIZED", packaging_type: "PALLET_WRAP", appraised_value_cents: 40000, seized_at: "2026-07-29T14:00:00Z" }
              as: EvidenceTechnician
              as_user_id: "${tech_id}"
              captures: { item_id: $.data.id }
            - call: "POST /evidence-items/${item_id}/storage-assignment"
              payload: { storage_location_id: "${loc_y_id}" }
              as: EvidenceTechnician
              as_user_id: "${tech_id}"
            - call: "POST /cases/${case2_id}/charge"
              payload: {}
              as: Investigator
              as_user_id: "${inv_id}"
            - call: "POST /cases/${case2_id}/adjudicate"
              payload: {}
              as: CourtClerk
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-10-30T00:00:00Z" }
              as: PropertyRoomManager
            - call: "POST /property-rooms/${room_id}/daily-sweep"
              payload: {}
              as: PropertyRoomManager
            - call: "POST /disposition-orders"
              payload: { evidence_item_id: "${item_id}", type: "AUCTION", requested_by_custodian_id: "${tech_id}", reserve_price_cents: 10000 }
              as: EvidenceTechnician
              as_user_id: "${tech_id}"
              captures: { order_id: $.data.id }
            - call: "POST /disposition-orders/${order_id}/authorize"
              payload: { court_order_number: "CO-2026-5510" }
              as: CourtClerk
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2027-05-01T00:00:00Z" }
              as: PropertyRoomManager
            - call: "POST /disposition-orders/${order_id}/execute"
              payload: { executed_by_custodian_id: "${tech2_id}", witness_custodian_id: "${inv_id}" }
              as: PropertyRoomManager
          trigger:
            - call: "POST /disposition-orders/${order_id}/settle"
              payload: { gross_sale_cents: 40000 }
              as: PropertyRoomManager
              captures: { net: $.data.settled_net_proceeds_cents, recovery: $.data.storage_recovery_cents }
          assert:
            - "DispositionOrder.${order_id}.commission_cents == 6000 (gross 40000 <= 50000 so the 0.15 tier applies)"
            - "DispositionOrder.${order_id}.storage_recovery_cents == 10200 == floor((40000 - 6000) * 0.30), NOT 12000 == floor(40000 * 0.30)"
            - "DispositionOrder.${order_id}.settled_net_proceeds_cents == 23800, NOT 22000"
            - "The raw uncapped recovery would have been 54600 (273 days * 200 cents/day), so the cap is the binding term"
            - "PropertyRoom.${room_id}.escrow_balance_cents == 23800"

      - name: room_posture_branches_on_three_independent_counters
        grounds:
          - "calculations.room_posture"
          - "calculations.audit_risk_index"
          - "entities.PropertyRoom.fields.posture"
          - "entities.PropertyRoom.fields.open_discrepancy_count"
          - "entities.PropertyRoom.fields.missing_high_risk_count"
          - "state_machines.PropertyRoom.RESTRICTED_to_LOCKED_DOWN"
        distinguishing_aspect: |
          Mode (a) — BRANCH SELECTION: LOCKED_DOWN is reached through the unresolved-risk branch alone
          (risk sum 27.00 >= 25.00) while the other two LOCKED_DOWN branches are provably inactive
          (missing_high_risk_count == 0 and open_discrepancy_count == 3 < 5), so an implementation that
          ORs only the two counter branches still reports RESTRICTED.
        test_recipe:
          setup:
            - "Three BIOLOGICAL items appraised at 2000000 cents each (value multiplier capped at 2.0) stored in R-01."
            - "An audit session on the EMPTY location R-02 is started, then all three R-01 items are scanned there, raising three MISPLACED discrepancies."
          setup_api_calls:
            - *k_clock
            - *k_room
            - *k_stat_th3
            - *k_stat_ab1
            - *k_loc_g
            - *k_loc_v
            - *k_loc_r
            - *k_loc_r2
            - *k_loc_y
            - *k_tech
            - *k_tech2
            - *k_lab
            - *k_inv
            - *k_aud
            - *k_case1
            - *k_case2
            - call: "POST /evidence-items"
              payload: { case_id: "${case1_id}", item_description: "Tissue sample vial 1", category: "BIOLOGICAL", packaging_type: "SHARPS_TUBE", appraised_value_cents: 2000000, seized_at: "2026-07-31T08:00:00Z" }
              as: EvidenceTechnician
