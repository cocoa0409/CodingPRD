            - call: "POST /eas/proposals"
              payload: { solicitation_id: "${sol_id}", carrier_id: "${car2_id}", aircraft_type_id: "${ac_b190_id}", service_level: "ENHANCED", weekly_round_trips: 13, seats_per_departure: 19, annual_subsidy_request_usd: 1700000.00, term_months: 24, payment_basis: "COMPLETED_FLIGHT_PRORATION" }
              as: Carrier
              as_user_id: "${car2_id}"
              captures: { pb_id: $.data.id }
            - call: "POST /eas/proposals/${pb_id}/actions"
              payload: { action: "SUBMIT" }
              as: Carrier
              as_user_id: "${car2_id}"
