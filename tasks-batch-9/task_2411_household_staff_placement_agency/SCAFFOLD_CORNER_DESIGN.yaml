    claim_type: optimistic_concurrency
    grounds: concurrency_rules.placement-create-supersedes-offer (write_endpoint POST /placements, occ_field
      expected_requisition_version); errors[ERR_STALE_REQUISITION_VERSION]
    distinguishing_aspect: The version was read before the accommodation negotiation closed, so the writer
      has not seen which candidate now holds the agreed terms; because creating a placement can supersede
      an incumbent offer, the write must be refused rather than merged.
    test_recipe:
      setup_api_calls:
      - call: POST /_clock/set_current_utc
        as: AgencyPrincipal
        payload:
          current_utc: '2026-08-01T00:00:00Z'
      - call: POST /clients
        as: AgencyPrincipal
        payload:
          household_name: Ashworth Mews
          primary_contact_email: ops@ashworth.example
          region_code: NY
        captures:
          client_id: $.data.id
      - call: POST /clients/${client_id}/confidentiality-agreement
        as: Client
