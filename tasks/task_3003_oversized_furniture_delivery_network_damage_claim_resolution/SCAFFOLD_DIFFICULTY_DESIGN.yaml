# =============================================================================
# §1.8 Scaffold Difficulty Design — Test Targeting Index
# Task 3003 — Oversized Furniture Delivery Network & Damage Claim Resolution
#
# Depth probe: 2 instances per §0.5 Difficulty Rule (18 total). Each instance
# grounds in SCAFFOLD.yaml §1.1–§1.7 and carries a directly executable
# test_recipe (setup_api_calls + trigger + assert).
# =============================================================================
scaffold_difficulty_design:

  # ===========================================================================
  - rule_id: dual_variant_calc
    instances:

      - name: chargeback_concealed_vs_visible_liability_split
        grounds:
          - calculations.chargeback_allocation
          - state_machines.DamageClaim.INSPECTION_to_DETERMINATION
          - entities.DamageClaim.fields.concealment
        distinguishing_aspect: |
          Same damage economics (repair 20000c, replacement snapshot 80000c),
          two concealment variants produce different liable parties AND
          different amounts: CONCEALED → SUPPLIER owes 48000c (100% repair +
          35% replacement) and a PENDING Chargeback row appears;
          VISIBLE_AT_DELIVERY → CARRIER, claim records an 8000c clawback
          (40% of repair) and NO Chargeback row is created.
        test_recipe:
          setup:
            - "Logical clock 2026-09-05T00:00:00Z. Supplier SUP-A ACTIVE (drop-ship off). Item item-lg (40x40x20, 30lb, declared 80000c, white_glove true) → cube_score 52.52 → LTL_250."
            - "Hub HUB-A serves ZONE_NE, white_glove_capable, daily_capacity 5. LTL lane to ZONE_NE (base 40000c, per-lb 50c, transit 3). Customer C1 in ZONE_NE."
            - "Order O1 (THRESHOLD) routed OWNED_FINAL_MILE via HUB-A bound to linehaul L1 (arrival 2026-09-10); departed, arrived, appointment booked and completed → Shipment S1 DELIVERED."
          setup_api_calls:
            - &d_clock
              call: "POST /oversize-freight/_clock/set_current_utc"
              payload: { current_utc: "2026-09-05T00:00:00Z" }
              as: NetworkAdmin
            - &d_sup
              call: "POST /oversize-freight/suppliers"
              payload: { supplier_code: "SUP-A", legal_name: "Acme Furniture Co", drop_ship_enabled: false }
              as: NetworkAdmin
              captures: { sup_id: "$.data.id" }
            - &d_hub
              call: "POST /oversize-freight/hubs"
              payload: { hub_code: "HUB-A", name: "Northeast Hub", serves_zones: ["ZONE_NE"], white_glove_capable: true, daily_capacity: 5 }
              as: NetworkAdmin
              captures: { hub_id: "$.data.id" }
            - &d_lane_ltl
              call: "POST /oversize-freight/freight-lanes"
              payload: { leg_mode: "LTL", dest_zone: "ZONE_NE", base_rate_cents: 40000, per_lb_rate_cents: 50, transit_days: 3 }
              as: NetworkAdmin
              captures: { lane_ltl_id: "$.data.id" }
            - &d_item
              call: "POST /oversize-freight/items"
              payload: { supplier_id: "${sup_id}", sku: "SKU-LG-1", dim_length_in: 40, dim_width_in: 40, dim_height_in: 20, weight_lb: 30, declared_value_cents: 80000, white_glove_eligible: true }
              as: NetworkAdmin
              captures: { item_id: "$.data.id" }
            - &d_cust
              call: "POST /oversize-freight/customers"
              payload: { email: "c1@example.com", full_name: "Customer One", destination_zone: "ZONE_NE" }
              as: NetworkAdmin
              captures: { cust_id: "$.data.id" }
            - &d_linehaul
              call: "POST /oversize-freight/linehauls"
              payload: { hub_id: "${hub_id}", planned_arrival_date: "2026-09-10", origin_ship_date: "2026-09-07", capacity: 10 }
              as: NetworkAdmin
              captures: { lh_id: "$.data.id" }
            - &d_order
              call: "POST /oversize-freight/orders"
              payload: { customer_id: "${cust_id}", item_id: "${item_id}", service_level: "THRESHOLD" }
              as: Customer
              as_user_id: "${cust_id}"
              captures: { order_id: "$.data.id" }
            - &d_ship_list
              call: "GET /oversize-freight/shipments"
              payload: { order_id: "${order_id}" }
              as: NetworkAdmin
              captures: { ship_id: "$.data[0].id", ship_v0: "$.data[0].version" }
            - &d_depart
              call: "POST /oversize-freight/shipments/${ship_id}/depart"
              payload: {}
              as: CarrierRep
            - &d_lh_depart
              call: "POST /oversize-freight/linehauls/${lh_id}/depart"
              payload: {}
              as: NetworkAdmin
            - &d_lh_arrive
              call: "POST /oversize-freight/linehauls/${lh_id}/arrive"
              payload: {}
              as: HubOperator
            - &d_appt
              call: "POST /oversize-freight/appointments"
              payload: { shipment_id: "${ship_id}", window_start: "2026-09-12T09:00:00Z", window_end: "2026-09-12T13:00:00Z", crew_id: "CREW-1", expected_shipment_version: "${ship_v0}" }
              as: HubOperator
              captures: { appt_id: "$.data.id" }
            - &d_complete
              call: "POST /oversize-freight/appointments/${appt_id}/complete"
              payload: {}
              as: HubOperator
            - call: "POST /oversize-freight/damage-claims"
              payload: { shipment_id: "${ship_id}", claimant_role: "CUSTOMER", concealment: "CONCEALED" }
              as: Customer
              as_user_id: "${cust_id}"
              captures: { claim_a: "$.data.id" }
            - call: "POST /oversize-freight/damage-claims/${claim_a}/inspect"
              payload: { damage_pct: 20, is_structural: false, repair_cost_cents: 20000 }
              as: HubOperator
            - call: "POST /oversize-freight/damage-claims"
              payload: { shipment_id: "${ship_id}", claimant_role: "HUB_INSPECTOR", concealment: "VISIBLE_AT_DELIVERY" }
              as: HubOperator
              captures: { claim_b: "$.data.id" }
            - call: "POST /oversize-freight/damage-claims/${claim_b}/inspect"
              payload: { damage_pct: 20, is_structural: false, repair_cost_cents: 20000 }
              as: HubOperator
          trigger:
            - call: "POST /oversize-freight/damage-claims/${claim_a}/determine"
              payload: {}
              as: ClaimsAdjuster
            - call: "POST /oversize-freight/damage-claims/${claim_b}/determine"
              payload: {}
              as: ClaimsAdjuster
          assert:
            - "DamageClaim.${claim_a}.liability_party == SUPPLIER and chargeback_amount_cents == 48000"
            - "DamageClaim.${claim_b}.liability_party == CARRIER and chargeback_amount_cents == 8000"
            - "GET /oversize-freight/chargebacks?damage_claim_id=${claim_a} returns exactly 1 row with amount_cents == 48000 and reason_code == CONCEALED_DAMAGE"
            - "GET /oversize-freight/chargebacks?damage_claim_id=${claim_b} returns 0 rows"

      - name: supplier_scorecard_rolling_vs_lifetime_window
        grounds:
          - calculations.supplier_compliance_score
          - endpoints.GET_/oversize-freight/suppliers/{supplierId}/scorecard
          - entities.Supplier.fields.compliance_score
        distinguishing_aspect: |
          Same supplier history scored two ways on a DIFFERENT entity domain
          (Supplier metrics, not DamageClaim money): with 6 closed drop-ship
          shipments (5 on time, 1 late) and 1 settled chargeback, the rolling
          window (5 most recent closes) reads on_time 100.00 → score 60.00,
          while lifetime reads on_time 83.33 → score 50.00.
        test_recipe:
          setup:
            - "Logical clock 2026-09-01T00:00:00Z. Supplier SUP-D drop_ship_enabled=true, lead_time_days 3. Item item-ds (40x40x20, 25lb, declared 50000c, white_glove false) → LTL_250. LTL lane to ZONE_MA (base 30000c, per-lb 20c, transit 4). Customer C2 in ZONE_MA."
            - "Six drop-ship shipments S1..S6 created via six orders. S1 shipped LATE (departed 2026-09-09 vs promised_ship_date 2026-09-04); S2..S6 shipped on time. All six delivered via /shipments/{id}/deliver."
            - "One CONCEALED damage claim on S6 determined SUPPLIER-liable (repair 5000c, replacement 50000c → chargeback 22500c) and its chargeback SETTLED."
          setup_api_calls:
            - *d_clock
            - call: "POST /oversize-freight/suppliers"
              payload: { supplier_code: "SUP-D", legal_name: "DropShip Direct", drop_ship_enabled: true, lead_time_days: 3 }
              as: NetworkAdmin
              captures: { supd_id: "$.data.id" }
            - call: "POST /oversize-freight/freight-lanes"
              payload: { leg_mode: "LTL", dest_zone: "ZONE_MA", base_rate_cents: 30000, per_lb_rate_cents: 20, transit_days: 4 }
              as: NetworkAdmin
            - call: "POST /oversize-freight/items"
              payload: { supplier_id: "${supd_id}", sku: "SKU-DS-1", dim_length_in: 40, dim_width_in: 40, dim_height_in: 20, weight_lb: 25, declared_value_cents: 50000, white_glove_eligible: false }
              as: NetworkAdmin
              captures: { itemd_id: "$.data.id" }
            - call: "POST /oversize-freight/customers"
              payload: { email: "c2@example.com", full_name: "Customer Two", destination_zone: "ZONE_MA" }
              as: NetworkAdmin
              captures: { cust2_id: "$.data.id" }
            # ---- S1: late drop-ship shipment (departs after promised_ship_date) ----
            - call: "POST /oversize-freight/orders"
              payload: { customer_id: "${cust2_id}", item_id: "${itemd_id}", service_level: "THRESHOLD" }
              as: Customer
              as_user_id: "${cust2_id}"
              captures: { o1: "$.data.id" }
            - call: "GET /oversize-freight/shipments"
              payload: { order_id: "${o1}" }
              as: NetworkAdmin
              captures: { s1: "$.data[0].id" }
            - call: "POST /oversize-freight/_clock/set_current_utc"
              payload: { current_utc: "2026-09-09T00:00:00Z" }
              as: NetworkAdmin
            - call: "POST /oversize-freight/shipments/${s1}/depart"
              payload: {}
              as: SupplierRep
              as_user_id: "${supd_id}"
            - call: "POST /oversize-freight/shipments/${s1}/deliver"
              payload: {}
              as: SupplierRep
              as_user_id: "${supd_id}"
            - call: "POST /oversize-freight/_clock/set_current_utc"
              payload: { current_utc: "2026-09-01T00:00:00Z" }
              as: NetworkAdmin
            # ---- S2..S6: on-time drop-ship shipments ----
            - call: "POST /oversize-freight/orders"
              payload: { customer_id: "${cust2_id}", item_id: "${itemd_id}", service_level: "THRESHOLD" }
              as: Customer
              as_user_id: "${cust2_id}"
              captures: { o2: "$.data.id" }
            - call: "GET /oversize-freight/shipments"
              payload: { order_id: "${o2}" }
              as: NetworkAdmin
              captures: { s2: "$.data[0].id" }
            - call: "POST /oversize-freight/shipments/${s2}/depart"
              payload: {}
              as: SupplierRep
              as_user_id: "${supd_id}"
            - call: "POST /oversize-freight/shipments/${s2}/deliver"
              payload: {}
              as: SupplierRep
              as_user_id: "${supd_id}"
            - call: "POST /oversize-freight/orders"
              payload: { customer_id: "${cust2_id}", item_id: "${itemd_id}", service_level: "THRESHOLD" }
              as: Customer
              as_user_id: "${cust2_id}"
              captures: { o3: "$.data.id" }
            - call: "GET /oversize-freight/shipments"
              payload: { order_id: "${o3}" }
              as: NetworkAdmin
              captures: { s3: "$.data[0].id" }
            - call: "POST /oversize-freight/shipments/${s3}/depart"
              payload: {}
              as: SupplierRep
              as_user_id: "${supd_id}"
            - call: "POST /oversize-freight/shipments/${s3}/deliver"
              payload: {}
              as: SupplierRep
              as_user_id: "${supd_id}"
            - call: "POST /oversize-freight/orders"
              payload: { customer_id: "${cust2_id}", item_id: "${itemd_id}", service_level: "THRESHOLD" }
              as: Customer
              as_user_id: "${cust2_id}"
              captures: { o4: "$.data.id" }
            - call: "GET /oversize-freight/shipments"
              payload: { order_id: "${o4}" }
              as: NetworkAdmin
              captures: { s4: "$.data[0].id" }
            - call: "POST /oversize-freight/shipments/${s4}/depart"
              payload: {}
              as: SupplierRep
              as_user_id: "${supd_id}"
            - call: "POST /oversize-freight/shipments/${s4}/deliver"
              payload: {}
              as: SupplierRep
              as_user_id: "${supd_id}"
            - call: "POST /oversize-freight/orders"
              payload: { customer_id: "${cust2_id}", item_id: "${itemd_id}", service_level: "THRESHOLD" }
              as: Customer
              as_user_id: "${cust2_id}"
              captures: { o5: "$.data.id" }
            - call: "GET /oversize-freight/shipments"
              payload: { order_id: "${o5}" }
              as: NetworkAdmin
              captures: { s5: "$.data[0].id" }
            - call: "POST /oversize-freight/shipments/${s5}/depart"
              payload: {}
              as: SupplierRep
              as_user_id: "${supd_id}"
            - call: "POST /oversize-freight/shipments/${s5}/deliver"
              payload: {}
              as: SupplierRep
              as_user_id: "${supd_id}"
            - call: "POST /oversize-freight/orders"
              payload: { customer_id: "${cust2_id}", item_id: "${itemd_id}", service_level: "THRESHOLD" }
              as: Customer
              as_user_id: "${cust2_id}"
              captures: { o6: "$.data.id" }
            - call: "GET /oversize-freight/shipments"
              payload: { order_id: "${o6}" }
              as: NetworkAdmin
              captures: { s6: "$.data[0].id" }
            - call: "POST /oversize-freight/shipments/${s6}/depart"
              payload: {}
              as: SupplierRep
              as_user_id: "${supd_id}"
            - call: "POST /oversize-freight/shipments/${s6}/deliver"
              payload: {}
              as: SupplierRep
              as_user_id: "${supd_id}"
            # ---- damage claim on S6 → supplier-liable chargeback, settled ----
            - call: "POST /oversize-freight/damage-claims"
              payload: { shipment_id: "${s6}", claimant_role: "CUSTOMER", concealment: "CONCEALED" }
              as: Customer
              as_user_id: "${cust2_id}"
              captures: { claim_d: "$.data.id" }
            - call: "POST /oversize-freight/damage-claims/${claim_d}/inspect"
              payload: { damage_pct: 10, is_structural: false, repair_cost_cents: 5000 }
              as: HubOperator
            - call: "POST /oversize-freight/damage-claims/${claim_d}/determine"
              payload: {}
              as: ClaimsAdjuster
            - call: "GET /oversize-freight/chargebacks"
              payload: { damage_claim_id: "${claim_d}" }
              as: NetworkAdmin
              captures: { cb_d: "$.data[0].id" }
            - call: "POST /oversize-freight/chargebacks/${cb_d}/settle"
              payload: {}
              as: NetworkAdmin
          trigger:
            - call: "GET /oversize-freight/suppliers/${supd_id}/scorecard"
              payload: { window: "rolling" }
              as: NetworkAdmin
              captures: { otr_r: "$.data.on_time_ship_rate", score_r: "$.data.compliance_score" }
            - call: "GET /oversize-freight/suppliers/${supd_id}/scorecard"
              payload: { window: "lifetime" }
              as: NetworkAdmin
              captures: { otr_l: "$.data.on_time_ship_rate", score_l: "$.data.compliance_score" }
          assert:
            - "otr_r == 100.00 (rolling window of 5 most recent closes excludes the late S1)"
            - "score_r == 60.00 (0.60*100.00 + 0.40*(100 - 100.00 chargeback_rate 1/1))"
            - "otr_l == 83.33 (5 on-time of 6 lifetime closes)"
            - "score_l == 50.00 (0.60*83.33 + 0.40*0)"
            - "Supplier.${supd_id}.compliance_score == 60.00 (stored field is the rolling variant) and status == PROBATION (60.00 < 70.00)"

  # ===========================================================================
  - rule_id: combinatorial_formula
    instances:

      - name: cube_score_weighted_threshold_classification
        grounds:
          - calculations.item_cube_score
          - calculations.freight_class_assignment
          - entities.Item.fields.cube_score
        distinguishing_aspect: |
          Mode (a) — a 3-input formula with non-linear interaction (max,
          cube-root, sum) feeding a 4-level tiered threshold with inclusive
          lower-class boundaries: score exactly 40.00 is PARCEL_ELIGIBLE
          while 40.08 is LTL_250; 106.29 lands in LTL_125.
        test_recipe:
          setup:
            - "Logical clock 2026-09-01T00:00:00Z. Supplier SUP-A ACTIVE."
          setup_api_calls:
            - *d_clock
            - *d_sup
          trigger:
            - call: "POST /oversize-freight/items"
              payload: { supplier_id: "${sup_id}", sku: "SKU-CB-BOUND", dim_length_in: 30.9, dim_width_in: 24, dim_height_in: 20, weight_lb: 10, declared_value_cents: 10000, white_glove_eligible: false }
              as: NetworkAdmin
              captures: { item_bound: "$.data.id" }
            - call: "POST /oversize-freight/items"
              payload: { supplier_id: "${sup_id}", sku: "SKU-CB-OVER", dim_length_in: 31, dim_width_in: 24, dim_height_in: 20, weight_lb: 10, declared_value_cents: 10000, white_glove_eligible: false }
              as: NetworkAdmin
              captures: { item_over: "$.data.id" }
            - call: "POST /oversize-freight/items"
              payload: { supplier_id: "${sup_id}", sku: "SKU-CB-125", dim_length_in: 100, dim_width_in: 40, dim_height_in: 40, weight_lb: 60, declared_value_cents: 50000, white_glove_eligible: false }
              as: NetworkAdmin
              captures: { item_125: "$.data.id" }
          assert:
            - "Item.${item_bound}.cube_score == 40.00 and freight_class == PARCEL_ELIGIBLE (boundary inclusive on the lower class)"
            - "Item.${item_over}.cube_score == 40.08 and freight_class == LTL_250"
            - "Item.${item_125}.cube_score == 106.29 and freight_class == LTL_125"

      - name: declared_girth_per_line_then_sum_rounding
        grounds:
          - calculations.declared_value_cube_check
          - entities.Item.fields.declared_girth_in
        distinguishing_aspect: |
          Mode (b) — nested rounding with pinned order: fractional dims
          (20.2, 30.4, 10.1) yield per-line-ceil-then-combine girth 105
          inches, whereas sum-then-round yields 102. The scaffold pins
          PER-LINE, so declared_girth_in == 105 and the 165-inch parcel gate
          evaluates on 105. Different mode from the weighted-threshold cube
          score (mode a).
        test_recipe:
          setup:
            - "Logical clock 2026-09-01T00:00:00Z. Supplier SUP-A ACTIVE."
          setup_api_calls:
            - *d_clock
            - *d_sup
          trigger:
            - call: "POST /oversize-freight/items"
              payload: { supplier_id: "${sup_id}", sku: "SKU-FRAC-1", dim_length_in: 20.2, dim_width_in: 30.4, dim_height_in: 10.1, weight_lb: 12, declared_value_cents: 9000, white_glove_eligible: false }
              as: NetworkAdmin
              captures: { item_frac: "$.data.id" }
          assert:
            - "Item.${item_frac}.declared_girth_in == 105 (ceil per dimension: 21 + 2*(31 + 11)), NOT 102"
            - "Item.${item_frac}.parcel_ok == true (105 <= 165)"

  # ===========================================================================
  - rule_id: non_linear_state_machine
    instances:

      - name: order_parallel_dimensions_evolve_independently
        grounds:
          - state_machines.Order
          - entities.Order.fields.order_state
          - entities.Order.fields.fulfillment_state
        distinguishing_aspect: |
          Parallel state dimensions on ONE entity: after appointment booking
          the order reads order_state == OUT_FOR_DELIVERY with
          fulfillment_state == SCHEDULED; after completion both advance
          (DELIVERED / FULFILLED); and a fresh PARCEL-mode order that is
          cancelled shows order_state == CANCELLED with fulfillment_state ==
          NONE — the two axes never move in lockstep.
        test_recipe:
          setup:
            - "Base routed network order O1 for C1/item-lg via HUB-A; shipment AT_HUB after linehaul arrive. A PARCEL lane exists and a small PARCEL_ELIGIBLE item yields fresh order O2 in ROUTED."
          setup_api_calls:
            - *d_clock
            - *d_sup
            - *d_hub
            - *d_lane_ltl
            - *d_item
            - *d_cust
            - *d_linehaul
            - *d_order
            - *d_ship_list
            - *d_depart
            - *d_lh_depart
            - *d_lh_arrive
            - call: "POST /oversize-freight/freight-lanes"
              payload: { leg_mode: "PARCEL", dest_zone: "ZONE_NE", base_rate_cents: 1500, per_lb_rate_cents: 10, transit_days: 2 }
              as: NetworkAdmin
            - call: "POST /oversize-freight/items"
              payload: { supplier_id: "${sup_id}", sku: "SKU-PAR-1", dim_length_in: 20, dim_width_in: 16, dim_height_in: 12, weight_lb: 12, declared_value_cents: 9000, white_glove_eligible: false }
              as: NetworkAdmin
              captures: { item_par: "$.data.id" }
            - call: "POST /oversize-freight/orders"
              payload: { customer_id: "${cust_id}", item_id: "${item_par}", service_level: "THRESHOLD" }
              as: Customer
              as_user_id: "${cust_id}"
              captures: { order_b: "$.data.id" }
          trigger:
            - call: "POST /oversize-freight/appointments"
              payload: { shipment_id: "${ship_id}", window_start: "2026-09-12T09:00:00Z", window_end: "2026-09-12T13:00:00Z", crew_id: "CREW-1", expected_shipment_version: "${ship_v0}" }
              as: HubOperator
              captures: { appt_p: "$.data.id" }
            - call: "GET /oversize-freight/orders/${order_id}"
              payload: {}
              as: NetworkAdmin
              captures: { os_mid: "$.data.order_state", fs_mid: "$.data.fulfillment_state" }
            - call: "POST /oversize-freight/appointments/${appt_p}/complete"
              payload: {}
              as: HubOperator
            - call: "GET /oversize-freight/orders/${order_id}"
              payload: {}
              as: NetworkAdmin
              captures: { os_end: "$.data.order_state", fs_end: "$.data.fulfillment_state" }
            - call: "POST /oversize-freight/orders/${order_b}/cancel"
              payload: {}
              as: Customer
              as_user_id: "${cust_id}"
            - call: "GET /oversize-freight/orders/${order_b}"
              payload: {}
              as: NetworkAdmin
              captures: { os_cancel: "$.data.order_state", fs_cancel: "$.data.fulfillment_state" }
          assert:
            - "os_mid == OUT_FOR_DELIVERY while fs_mid == SCHEDULED (dimensions independent)"
            - "os_end == DELIVERED and fs_end == FULFILLED"
            - "os_cancel == CANCELLED and fs_cancel == NONE (fulfillment axis untouched by commercial cancel)"

      - name: chargeback_dispute_reverse_branch
        grounds:
          - state_machines.Chargeback
          - entities.Chargeback.fields.status
        distinguishing_aspect: |
          Branching machine on a DIFFERENT entity than Order: Chargeback
          forks PENDING → {SETTLED, DISPUTED} and DISPUTED → {REVERSED,
          SETTLED}; only SETTLED feeds supplier metrics — a DISPUTED →
          REVERSED chargeback leaves chargeback_rate at 0.00 and the claim
          can then settle, while a settle attempt from REVERSED fails
          ERR_INVALID_STATE (terminal).
        test_recipe:
          setup:
            - "Delivered order for C1 with a determined CONCEALED damage claim (SUPPLIER liable, Chargeback 48000c PENDING)."
          setup_api_calls:
            - *d_clock
            - *d_sup
            - *d_hub
            - *d_lane_ltl
            - *d_item
            - *d_cust
            - *d_linehaul
            - *d_order
            - *d_ship_list
            - *d_depart
            - *d_lh_depart
            - *d_lh_arrive
            - *d_appt
            - *d_complete
            - call: "POST /oversize-freight/damage-claims"
              payload: { shipment_id: "${ship_id}", claimant_role: "CUSTOMER", concealment: "CONCEALED" }
              as: Customer
              as_user_id: "${cust_id}"
              captures: { claim_r: "$.data.id" }
            - call: "POST /oversize-freight/damage-claims/${claim_r}/inspect"
              payload: { damage_pct: 20, is_structural: false, repair_cost_cents: 20000 }
              as: HubOperator
            - call: "POST /oversize-freight/damage-claims/${claim_r}/determine"
              payload: {}
              as: ClaimsAdjuster
            - call: "GET /oversize-freight/chargebacks"
              payload: { damage_claim_id: "${claim_r}" }
              as: NetworkAdmin
              captures: { cb_x: "$.data[0].id" }
          trigger:
            - call: "POST /oversize-freight/chargebacks/${cb_x}/dispute"
              payload: {}
              as: SupplierRep
              as_user_id: "${sup_id}"
            - call: "POST /oversize-freight/chargebacks/${cb_x}/reverse"
              payload: {}
              as: NetworkAdmin
            - call: "POST /oversize-freight/damage-claims/${claim_r}/settle"
              payload: {}
              as: ClaimsAdjuster
            - call: "POST /oversize-freight/chargebacks/${cb_x}/settle"
              payload: {}
              as: NetworkAdmin
              captures: { err_settle: "$.data.error_id" }
          assert:
            - "Chargeback.${cb_x}.status == REVERSED"
            - "Supplier.${sup_id}.chargeback_rate == 0.00 (REVERSED excluded from the settled numerator)"
            - "DamageClaim.${claim_r}.status == SETTLED (chargeback resolved, so claim may settle)"
            - "the late chargeback settle returns 409 and err_settle == ERR_INVALID_STATE (REVERSED is terminal)"

  # ===========================================================================
  - rule_id: transitive_cascade
    instances:

      - name: linehaul_miss_recascades_promised_dates
        grounds:
          - state_machines.Linehaul.DEPARTED_to_MISSED
          - calculations.promised_date
          - entities.Shipment.fields.linehaul_misses
        distinguishing_aspect: |
          Depth-3 cascade from ONE trigger (mark-missed): Linehaul → MISSED
          causes each bound Shipment to increment linehaul_misses AND rebind
          to the replacement linehaul, and each such mutation recomputes
          promised_date (+2 days per miss) on the Order's derived view.
          Order created 2026-09-05 with transit 3 and dwell 1: base
          2026-09-11; 1 miss → 2026-09-13; 2 misses → 2026-09-15.
        test_recipe:
          setup:
            - "Logical clock 2026-09-05T00:00:00Z. Routed OWNED_FINAL_MILE order whose shipment is bound to linehaul L1 (planned arrival 2026-09-10, transit lane 3 days, promised 2026-09-11). Replacement linehaul L2 (planned arrival 2026-09-12) and L3 (planned arrival 2026-09-14) exist, all PLANNED with free capacity."
          setup_api_calls:
            - *d_clock
            - *d_sup
            - *d_hub
            - *d_lane_ltl
            - *d_item
            - *d_cust
            - *d_linehaul
            - call: "POST /oversize-freight/linehauls"
              payload: { hub_id: "${hub_id}", planned_arrival_date: "2026-09-12", origin_ship_date: "2026-09-09", capacity: 10 }
              as: NetworkAdmin
              captures: { lh2_id: "$.data.id" }
            - call: "POST /oversize-freight/linehauls"
              payload: { hub_id: "${hub_id}", planned_arrival_date: "2026-09-14", origin_ship_date: "2026-09-11", capacity: 10 }
              as: NetworkAdmin
              captures: { lh3_id: "$.data.id" }
            - *d_order
            - *d_ship_list
            - call: "POST /oversize-freight/linehauls/${lh_id}/depart"
              payload: {}
              as: NetworkAdmin
          trigger:
            - call: "POST /oversize-freight/linehauls/${lh_id}/mark-missed"
              payload: {}
              as: HubOperator
            - call: "GET /oversize-freight/shipments/${ship_id}"
              payload: {}
              as: NetworkAdmin
              captures: { ship_prom1: "$.data.promised_date", ship_miss1: "$.data.linehaul_misses", ship_lh1: "$.data.linehaul_id" }
            - call: "POST /oversize-freight/linehauls/${lh2_id}/depart"
              payload: {}
              as: NetworkAdmin
            - call: "POST /oversize-freight/linehauls/${lh2_id}/mark-missed"
              payload: {}
              as: HubOperator
            - call: "GET /oversize-freight/shipments/${ship_id}"
              payload: {}
              as: NetworkAdmin
              captures: { ship_prom2: "$.data.promised_date", ship_miss2: "$.data.linehaul_misses", ship_lh2: "$.data.linehaul_id" }
          assert:
            - "Linehaul.${lh_id}.status == MISSED"
            - "ship_miss1 == 1 and ship_prom1 == \"2026-09-13\" (base 2026-09-11 + 2) and ship_lh1 == ${lh2_id} (rebound)"
            - "ship_miss2 == 2 and ship_prom2 == \"2026-09-15\" and ship_lh2 == ${lh3_id}"
            - "Linehaul.${lh_id}.committed_count == 0 and Linehaul.${lh2_id}.committed_count == 1 after the first miss (slot migrates)"

      - name: chargeback_settle_recascades_supplier_status
        grounds:
          - state_machines.Chargeback.PENDING_to_SETTLED
          - calculations.supplier_compliance_score
          - state_machines.Supplier.ACTIVE_to_PROBATION
        distinguishing_aspect: |
          Depth-3 cascade from a DIFFERENT trigger (chargeback settle, not
          linehaul miss): Chargeback → SETTLED causes Supplier.chargeback_rate
          to recompute (1 settled / 1 non-EXCEPTION shipment = 100.00), which
          recomputes compliance_score (0.60*100.00 on-time + 0.40*0 = 60.00),
          which auto-flips Supplier ACTIVE → PROBATION (60.00 < 70.00).
        test_recipe:
          setup:
            - "Supplier SUP-D2 (drop-ship, lead_time_days 3) with exactly one drop-ship shipment S9 delivered ON TIME and one determined CONCEALED claim whose Chargeback CB9 (amount 22500c) is PENDING."
          setup_api_calls:
            - *d_clock
            - call: "POST /oversize-freight/suppliers"
              payload: { supplier_code: "SUP-D2", legal_name: "Cascade DropShip", drop_ship_enabled: true, lead_time_days: 3 }
              as: NetworkAdmin
              captures: { supd2_id: "$.data.id" }
            - call: "POST /oversize-freight/freight-lanes"
              payload: { leg_mode: "LTL", dest_zone: "ZONE_MA", base_rate_cents: 30000, per_lb_rate_cents: 20, transit_days: 4 }
              as: NetworkAdmin
            - call: "POST /oversize-freight/items"
              payload: { supplier_id: "${supd2_id}", sku: "SKU-DS-9", dim_length_in: 40, dim_width_in: 40, dim_height_in: 20, weight_lb: 25, declared_value_cents: 50000, white_glove_eligible: false }
              as: NetworkAdmin
              captures: { itemd2_id: "$.data.id" }
            - *d_cust
            - call: "POST /oversize-freight/orders"
              payload: { customer_id: "${cust_id}", item_id: "${itemd2_id}", service_level: "THRESHOLD" }
              as: Customer
              as_user_id: "${cust_id}"
              captures: { o_c: "$.data.id" }
            - call: "GET /oversize-freight/shipments"
              payload: { order_id: "${o_c}" }
              as: NetworkAdmin
              captures: { s_c: "$.data[0].id" }
            - call: "POST /oversize-freight/shipments/${s_c}/depart"
              payload: {}
              as: SupplierRep
              as_user_id: "${supd2_id}"
            - call: "POST /oversize-freight/shipments/${s_c}/deliver"
              payload: {}
              as: SupplierRep
              as_user_id: "${supd2_id}"
            - call: "POST /oversize-freight/damage-claims"
              payload: { shipment_id: "${s_c}", claimant_role: "CUSTOMER", concealment: "CONCEALED" }
              as: Customer
              as_user_id: "${cust_id}"
              captures: { claim_c: "$.data.id" }
            - call: "POST /oversize-freight/damage-claims/${claim_c}/inspect"
              payload: { damage_pct: 10, is_structural: false, repair_cost_cents: 5000 }
              as: HubOperator
            - call: "POST /oversize-freight/damage-claims/${claim_c}/determine"
              payload: {}
              as: ClaimsAdjuster
            - call: "GET /oversize-freight/chargebacks"
              payload: { damage_claim_id: "${claim_c}" }
              as: NetworkAdmin
              captures: { cb_c: "$.data[0].id" }
          trigger:
            - call: "POST /oversize-freight/chargebacks/${cb_c}/settle"
              payload: {}
              as: NetworkAdmin
            - call: "GET /oversize-freight/suppliers/${supd2_id}"
              payload: {}
              as: NetworkAdmin
              captures: { sup_status: "$.data.status", sup_score: "$.data.compliance_score", sup_cb_rate: "$.data.chargeback_rate" }
          assert:
            - "Chargeback.${cb_c}.status == SETTLED"
            - "sup_cb_rate == 100.00 (1 settled / 1 non-EXCEPTION shipment)"
            - "sup_score == 60.00 (0.60 * 100.00 + 0.40 * (100 - 100.00))"
            - "sup_status == PROBATION (automatic threshold transition at < 70.00)"

  # ===========================================================================
  - rule_id: priority_pair_validation_conflict
    instances:

      - name: state_beats_fiscal_on_order_cancel
        grounds:
          - validations[priority=5]
          - validations[priority=9]
          - errors.ERR_INVALID_STATE
          - errors.ERR_PRICING_UNAVAILABLE
        distinguishing_aspect: |
          Category pair state (p5) vs business_fiscal (p9): cancelling an
          IN_TRANSIT order violates the cancel state precondition, and the
          zone's LTL lane is INACTIVE so the fiscal pricing recheck would
          also fail — the response must be ERR_INVALID_STATE (409), never
          ERR_PRICING_UNAVAILABLE (402).
        test_recipe:
          setup:
            - "Order routed then departed (order_state IN_TRANSIT); the LTL FreightLane for ZONE_NE is INACTIVE (a second, INACTIVE lane was created for the zone)."
          setup_api_calls:
            - *d_clock
            - *d_sup
            - *d_hub
            - *d_lane_ltl
            - *d_item
            - *d_cust
            - *d_linehaul
            - *d_order
            - *d_ship_list
            - *d_depart
          trigger:
            - call: "POST /oversize-freight/orders/${order_id}/cancel"
              payload: {}
              as: Customer
              as_user_id: "${cust_id}"
              captures: { err_cancel: "$.data.error_id" }
          assert:
            - "the response status is 409 and err_cancel == ERR_INVALID_STATE"
            - "err_cancel != ERR_PRICING_UNAVAILABLE"
            - "Order.${order_id}.order_state remains IN_TRANSIT"

      - name: state_beats_safety_on_linehaul_arrive
        grounds:
          - validations[priority=5]
          - validations[priority=12]
          - errors.ERR_INVALID_STATE
          - errors.ERR_HUB_DAILY_CAPACITY_EXCEEDED
        distinguishing_aspect: |
          Different category pair — state (p5) vs business_safety (p12):
          arriving a linehaul that is still PLANNED (never departed) at a hub
          whose daily_capacity is already exhausted for that date fails BOTH
          checks; the state failure wins — ERR_INVALID_STATE, not
          ERR_HUB_DAILY_CAPACITY_EXCEEDED.
        test_recipe:
          setup:
            - "Hub HUB-C with daily_capacity 1 already has 1 ARRIVED linehaul on 2026-09-05. A second linehaul L3 into HUB-C (same arrival date) is PLANNED, never departed."
          setup_api_calls:
            - *d_clock
            - call: "POST /oversize-freight/hubs"
              payload: { hub_code: "HUB-C", name: "Capacity Hub", serves_zones: ["ZONE_NE"], white_glove_capable: false, daily_capacity: 1 }
              as: NetworkAdmin
              captures: { hubc_id: "$.data.id" }
            - call: "POST /oversize-freight/linehauls"
              payload: { hub_id: "${hubc_id}", planned_arrival_date: "2026-09-05", origin_ship_date: "2026-09-03", capacity: 5 }
              as: NetworkAdmin
              captures: { lh_full: "$.data.id" }
            - call: "POST /oversize-freight/linehauls/${lh_full}/depart"
              payload: {}
              as: NetworkAdmin
            - call: "POST /oversize-freight/linehauls/${lh_full}/arrive"
              payload: {}
              as: HubOperator
            - call: "POST /oversize-freight/linehauls"
              payload: { hub_id: "${hubc_id}", planned_arrival_date: "2026-09-05", origin_ship_date: "2026-09-03", capacity: 5 }
              as: NetworkAdmin
              captures: { lh3_id: "$.data.id" }
          trigger:
            - call: "POST /oversize-freight/linehauls/${lh3_id}/arrive"
              payload: {}
              as: HubOperator
              captures: { err_arrive: "$.data.error_id" }
          assert:
            - "the response status is 409 and err_arrive == ERR_INVALID_STATE (PLANNED → ARRIVED is not a declared transition)"
            - "err_arrive != ERR_HUB_DAILY_CAPACITY_EXCEEDED"
            - "Linehaul.${lh3_id}.status remains PLANNED"

  # ===========================================================================
  - rule_id: boundary_precision_check
    instances:

      - name: freight_class_boundary_score_exactly_40
        grounds:
          - calculations.freight_class_assignment
          - endpoints.POST_/oversize-freight/items
        distinguishing_aspect: |
          Numeric threshold metric via POST /items: cube_score exactly 40.00
          classifies PARCEL_ELIGIBLE (inclusive <=), while the next
          representable score 40.08 flips to LTL_250 — a `<=` vs `<`
          difference changes the class and the downstream routing branch.
        test_recipe:
          setup:
            - "Logical clock 2026-09-01T00:00:00Z. Supplier SUP-A ACTIVE."
          setup_api_calls:
            - *d_clock
            - *d_sup
          trigger:
            - call: "POST /oversize-freight/items"
              payload: { supplier_id: "${sup_id}", sku: "SKU-B40", dim_length_in: 30.9, dim_width_in: 24, dim_height_in: 20, weight_lb: 10, declared_value_cents: 10000, white_glove_eligible: false }
              as: NetworkAdmin
              captures: { i40: "$.data.id" }
            - call: "POST /oversize-freight/items"
              payload: { supplier_id: "${sup_id}", sku: "SKU-B40P", dim_length_in: 31, dim_width_in: 24, dim_height_in: 20, weight_lb: 10, declared_value_cents: 10000, white_glove_eligible: false }
              as: NetworkAdmin
              captures: { i40p: "$.data.id" }
          assert:
            - "Item.${i40}.cube_score == 40.00 and freight_class == PARCEL_ELIGIBLE"
            - "Item.${i40p}.cube_score == 40.08 and freight_class == LTL_250"

      - name: appointment_window_two_hour_duration_boundary
        grounds:
          - validations[priority=10]
          - endpoints.POST_/oversize-freight/appointments
          - errors.ERR_INVALID_APPOINTMENT_WINDOW
        distinguishing_aspect: |
          Different metric (temporal duration, not a numeric score) on a
          different endpoint (POST /appointments): exactly 2h00m is ACCEPTED;
          1h59m is rejected ERR_INVALID_APPOINTMENT_WINDOW; and the
          degenerate empty interval (start == end) is rejected with the same
          error.
        test_recipe:
          setup:
            - "Base routed network order with shipment AT_HUB at HUB-A; the two failed booking attempts leave Shipment.version unchanged so the same expected_shipment_version stays valid."
          setup_api_calls:
            - *d_clock
            - *d_sup
            - *d_hub
            - *d_lane_ltl
            - *d_item
            - *d_cust
            - *d_linehaul
            - *d_order
            - *d_ship_list
            - *d_depart
            - *d_lh_depart
            - *d_lh_arrive
            - call: "GET /oversize-freight/shipments/${ship_id}"
              payload: {}
              as: NetworkAdmin
              captures: { ship_v1: "$.data.version" }
          trigger:
            - call: "POST /oversize-freight/appointments"
              payload: { shipment_id: "${ship_id}", window_start: "2026-09-12T14:00:00Z", window_end: "2026-09-12T15:59:00Z", crew_id: "CREW-2", expected_shipment_version: "${ship_v1}" }
              as: HubOperator
              captures: { err_short: "$.data.error_id" }
            - call: "POST /oversize-freight/appointments"
              payload: { shipment_id: "${ship_id}", window_start: "2026-09-13T09:00:00Z", window_end: "2026-09-13T09:00:00Z", crew_id: "CREW-2", expected_shipment_version: "${ship_v1}" }
              as: HubOperator
              captures: { err_empty: "$.data.error_id" }
            - call: "POST /oversize-freight/appointments"
              payload: { shipment_id: "${ship_id}", window_start: "2026-09-12T09:00:00Z", window_end: "2026-09-12T11:00:00Z", crew_id: "CREW-1", expected_shipment_version: "${ship_v1}" }
              as: HubOperator
              captures: { appt_ok: "$.data.id" }
          assert:
            - "the 1h59m booking is rejected 422 and err_short == ERR_INVALID_APPOINTMENT_WINDOW"
            - "the empty interval (start == end) is rejected 422 and err_empty == ERR_INVALID_APPOINTMENT_WINDOW"
            - "the two failures leave the shipment AT_HUB with version unchanged, so the 2h00m booking then succeeds (201) and DeliveryAppointment.${appt_ok}.status == BOOKED"

  # ===========================================================================
  - rule_id: cross_entity_state_dependency
    instances:

      - name: return_approve_requires_order_delivered
        grounds:
          - state_machines.ReturnAuthorization.REQUESTED_to_APPROVED
          - entities.Order.fields.order_state
          - errors.ERR_ORDER_NOT_DELIVERED
        distinguishing_aspect: |
          Entity pair ReturnAuthorization → Order: approve is legal only when
          the linked Order.order_state == DELIVERED; approving while the
          order is merely ROUTED fails ERR_ORDER_NOT_DELIVERED even though
          the RA itself is validly REQUESTED.
        test_recipe:
          setup:
            - "Routed but undelivered order for C1 (shipment TENDERED, no appointment)."
          setup_api_calls:
            - *d_clock
            - *d_sup
            - *d_hub
            - *d_lane_ltl
            - *d_item
            - *d_cust
            - *d_linehaul
            - *d_order
            - call: "POST /oversize-freight/return-authorizations"
              payload: { order_id: "${order_id}", reason: "BUYERS_REMORSE" }
              as: Customer
              as_user_id: "${cust_id}"
              captures: { ra_early: "$.data.id" }
          trigger:
            - call: "POST /oversize-freight/return-authorizations/${ra_early}/approve"
              payload: {}
              as: NetworkAdmin
              captures: { err_ra: "$.data.error_id" }
          assert:
            - "the response status is 409 and err_ra == ERR_ORDER_NOT_DELIVERED"
            - "ReturnAuthorization.${ra_early}.status remains REQUESTED"

      - name: claim_inspect_requires_shipment_at_hub_or_delivered
        grounds:
          - state_machines.DamageClaim.OPEN_to_INSPECTION
          - entities.Shipment.fields.current_state
          - errors.ERR_CLAIM_REQUIRES_INSPECTABLE_SHIPMENT
        distinguishing_aspect: |
          Different entity pair — DamageClaim → Shipment: inspection is
          blocked while the shipment is IN_TRANSIT and becomes legal once the
          linehaul arrives (AT_HUB); the claim's own state is unchanged and
          the failure is driven purely by the linked shipment's state.
        test_recipe:
          setup:
            - "Routed order departed (Shipment IN_TRANSIT), claim opened by the customer."
          setup_api_calls:
            - *d_clock
            - *d_sup
            - *d_hub
            - *d_lane_ltl
            - *d_item
            - *d_cust
            - *d_linehaul
            - *d_order
            - *d_ship_list
            - *d_depart
            - call: "POST /oversize-freight/damage-claims"
              payload: { shipment_id: "${ship_id}", claimant_role: "CUSTOMER", concealment: "VISIBLE_AT_DELIVERY" }
              as: Customer
              as_user_id: "${cust_id}"
              captures: { claim_x: "$.data.id" }
          trigger:
            - call: "POST /oversize-freight/damage-claims/${claim_x}/inspect"
              payload: { damage_pct: 15, is_structural: false, repair_cost_cents: 9000 }
              as: HubOperator
              captures: { err_insp: "$.data.error_id" }
            - call: "POST /oversize-freight/linehauls/${lh_id}/depart"
              payload: {}
              as: NetworkAdmin
            - call: "POST /oversize-freight/linehauls/${lh_id}/arrive"
              payload: {}
              as: HubOperator
            - call: "POST /oversize-freight/damage-claims/${claim_x}/inspect"
              payload: { damage_pct: 15, is_structural: false, repair_cost_cents: 9000 }
              as: HubOperator
          assert:
            - "first inspect returns 409 and err_insp == ERR_CLAIM_REQUIRES_INSPECTABLE_SHIPMENT"
            - "after linehaul arrive (Shipment AT_HUB), the identical inspect call succeeds and DamageClaim.${claim_x}.status == INSPECTION"

  # ===========================================================================
  - rule_id: resource_temporal_overlap
