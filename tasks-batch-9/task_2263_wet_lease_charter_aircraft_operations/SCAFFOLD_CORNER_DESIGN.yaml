      - name: aog_grounding_suspends_the_lease_and_return_to_service_permits_reactivation
        claim_type: Side Effect Execution
        grounds:
          - state_machines.Aircraft[ASSIGNED -> AOG]
          - state_machines.Aircraft[AOG -> ASSIGNED]
          - state_machines.LeaseAgreement[SUSPENDED -> ACTIVE]
          - endpoints[POST /wetlease/aircraft/{aircraftId}/maintenance-events]
          - validations[priority 48 ERR_AIRCRAFT_UNAVAILABLE]
        distinguishing_aspect: |
          A technical grounding is a four-way cascade launched from the FLEET side of the model: the
          airframe goes AOG, its lease is suspended with suspension_reason AIRFRAME_AOG (not
          INSURANCE_LAPSED), the open leg is CANCELLED_LESSOR with cancel_reason TECHNICAL, and the
          captain's rolling exposure is released. RETURN_TO_SERVICE is the one event that resets
          hours_since_last_check and cycles_since_last_check to zero, and it returns the airframe to
          ASSIGNED rather than AVAILABLE precisely because assigned_lease_id was never cleared - which
          is what lets `activate` be replayed as a REACTIVATION. Reactivation must NOT open a second
          UtilizationPeriod: 2026-09 already exists, so the lease still owns exactly one period.
          
