  # ===========================================================================
  - section: complexity_layers
    instances:
      - name: quote_with_a_stale_booking_version_rejected
        claim_type: optimistic_concurrency
        grounds:
          - concurrency_rules["quote-run-stale-booking"]
          - validations[priority=8]
          - errors.ERR_STALE_BOOKING_VERSION
        distinguishing_aspect: "Replaying the version captured at booking creation after a roster addition has bumped it answers ERR_STALE_BOOKING_VERSION at 412 (priority 8, ahead of every business rule) and leaves the booking DRAFT with quote_index 0."
        test_recipe:
          setup:
            - "Clock at 2026-08-10; one course; a PARTNER client; a DRAFT booking whose version is captured at creation and then advanced by adding one participant."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-08-10T08:00:00Z" }
              as: ProgramDirector
            - call: "POST /challenge-course/courses"
              payload: { course_name: "Pine Ridge Challenge Course", ems_response_minutes: 18, ems_access_note: "Gravel access road; ALS 18 minutes" }
              as: ProgramDirector
              captures: { course_id: $.data.id }
            - call: "POST /challenge-course/group-clients"
              payload: { client_name: "Ridgeview Middle School", org_type: "SCHOOL", tier: "PARTNER" }
              as: ProgramDirector
              captures: { gc_id: $.data.id }
            - call: "POST /challenge-course/bookings"
              payload: { course_id: "${course_id}", group_client_id: "${gc_id}", program_date: "2026-09-15", expected_participant_count: 1 }
              as: ProgramDirector
              captures: { b_id: $.data.id, b_v0: $.data.version }
            - call: "POST /challenge-course/participants"
              payload: { booking_id: "${b_id}", expected_booking_version: "${b_v0}", full_name: "Alex Stone", birth_date: "1990-04-12", weight_kg: 78.0, is_chaperone: false }
              as: GroupCoordinator
              as_user_id: "${gc_id}"
          trigger:
            - call: "POST /challenge-course/bookings/${b_id}/quote"
              payload: { expected_booking_version: "${b_v0}" }
              as: ProgramDirector
              captures: { err: $.data.error_id }
          assert:
            - "http_status == 412"
            - "${err} == ERR_STALE_BOOKING_VERSION"
            - "Booking.${b_id}.status == DRAFT"
            - "Booking.${b_id}.quote_index == 0"
            - "Booking.${b_id}.quoted_total_cents == 0"

      - name: participant_added_with_a_stale_booking_version_rejected
        claim_type: optimistic_concurrency
        grounds:
          - concurrency_rules["participant-add-stale-booking"]
          - validations[priority=8]
          - errors.ERR_STALE_BOOKING_VERSION
        distinguishing_aspect: "A second roster addition that replays the version consumed by the first answers ERR_STALE_BOOKING_VERSION at 412, so the booking still holds exactly one participant."
        test_recipe:
          setup:
            - "Clock at 2026-08-10; one course; a PARTNER client; a DRAFT booking with one participant already added using the creation-time version."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-08-10T08:00:00Z" }
              as: ProgramDirector
            - call: "POST /challenge-course/courses"
              payload: { course_name: "Pine Ridge Challenge Course", ems_response_minutes: 18, ems_access_note: "Gravel access road; ALS 18 minutes" }
              as: ProgramDirector
              captures: { course_id: $.data.id }
            - call: "POST /challenge-course/group-clients"
              payload: { client_name: "Ridgeview Middle School", org_type: "SCHOOL", tier: "PARTNER" }
              as: ProgramDirector
              captures: { gc_id: $.data.id }
            - call: "POST /challenge-course/bookings"
              payload: { course_id: "${course_id}", group_client_id: "${gc_id}", program_date: "2026-09-15", expected_participant_count: 2 }
              as: ProgramDirector
              captures: { b_id: $.data.id, b_v0: $.data.version }
            - call: "POST /challenge-course/participants"
              payload: { booking_id: "${b_id}", expected_booking_version: "${b_v0}", full_name: "Alex Stone", birth_date: "1990-04-12", weight_kg: 78.0, is_chaperone: false }
              as: GroupCoordinator
              as_user_id: "${gc_id}"
              captures: { p1_id: $.data.id }
          trigger:
            - call: "POST /challenge-course/participants"
              payload: { booking_id: "${b_id}", expected_booking_version: "${b_v0}", full_name: "Robin Vale", birth_date: "1988-11-30", weight_kg: 71.0, is_chaperone: true }
              as: GroupCoordinator
              as_user_id: "${gc_id}"
              captures: { err: $.data.error_id }
          assert:
            - "http_status == 412"
            - "${err} == ERR_STALE_BOOKING_VERSION"
            - "Booking.${b_id}.billable_head_count == 0"
            - "Booking.${b_id}.roster_status == BLOCKED"
            - "Participant.${p1_id}.screening_status == BLOCKED"

      - name: four_level_cascade_verified_end_to_end
        claim_type: cascading_side_effects
        grounds:
          - complexity_profile.complexity_layers
        excluded_because:
          difficulty_instance: transitive_cascade / defect_major_log_cascades_four_links_to_course_posture
          rationale: "That instance walks all four links from one write and asserts each intermediate entity, including the untouched sibling."

      - name: both_retirement_variants_produce_expected_results
        claim_type: dual_variant_calculation
        grounds:
          - complexity_profile.complexity_layers
        excluded_because:
          difficulty_instance: dual_variant_calc / element_retirement_forecast_switches_to_usage_basis
          rationale: "That instance asserts the CALENDAR and USAGE answers side by side on two elements built from identical calendar data."

      - name: lightning_hold_expiry_released_by_the_daily_open_checkpoint
        claim_type: rate_threshold_triggers
        grounds:
          - calculations.weather_posture_signals
          - calculations.course_daily_open_checkpoint
          - calculations.course_posture
        distinguishing_aspect: "A 6.0 km strike at 08:00 sets lightning_hold_until 08:30 and closes the course; with the clock at 09:00 the daily-open checkpoint clears the expired hold and posture returns to OPEN / NONE even though latest_lightning_distance_km is still 6.0 — the trigger is time-boxed, not sticky."
        test_recipe:
          setup:
            - "Clock at 2026-08-10T08:00:00Z; one course with two ACTIVE facilitators; a lightning observation at 6.0 km recorded at 08:00; the clock is then moved to 09:00, past the 30-minute hold."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-08-10T08:00:00Z" }
              as: ProgramDirector
            - call: "POST /challenge-course/courses"
              payload: { course_name: "Pine Ridge Challenge Course", ems_response_minutes: 18, ems_access_note: "Gravel access road; ALS 18 minutes" }
              as: ProgramDirector
              captures: { course_id: $.data.id }
            - call: "POST /challenge-course/facilitators"
              payload: { course_id: "${course_id}", full_name: "Dana Reyes", staff_type: "SAFETY_OFFICER", certification_level: "LEVEL_3", cert_expires_on: "2027-06-30", is_operator_employee: true }
              as: ProgramDirector
              captures: { so_id: $.data.id }
            - call: "POST /challenge-course/training-records"
              payload: { facilitator_id: "${so_id}", kind: "RESCUE_DRILL", completed_on: "2026-07-15" }
              as: ProgramDirector
            - call: "POST /challenge-course/training-records"
              payload: { facilitator_id: "${so_id}", kind: "REFRESHER", completed_on: "2026-07-15", hours: 8 }
              as: ProgramDirector
            - call: "POST /challenge-course/facilitators"
              payload: { course_id: "${course_id}", full_name: "Kim Alvarez", staff_type: "STAFF_FACILITATOR", certification_level: "LEVEL_2", cert_expires_on: "2027-06-30", is_operator_employee: true }
              as: ProgramDirector
              captures: { f1_id: $.data.id }
            - call: "POST /challenge-course/training-records"
              payload: { facilitator_id: "${f1_id}", kind: "RESCUE_DRILL", completed_on: "2026-07-15" }
              as: ProgramDirector
            - call: "POST /challenge-course/training-records"
              payload: { facilitator_id: "${f1_id}", kind: "REFRESHER", completed_on: "2026-07-15", hours: 8 }
              as: ProgramDirector
            - call: "POST /challenge-course/weather-observations"
              payload: { course_id: "${course_id}", observed_at: "2026-08-10T08:00:00Z", lightning_distance_km: 6.0, wind_speed_kph: 10.0, air_temp_c: 24.0 }
              as: Facilitator
              as_user_id: "${f1_id}"
              captures: { obs_id: $.data.id, obs_posture: $.data.resulting_posture, obs_hold: $.data.hold_until }
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-08-10T09:00:00Z" }
              as: ProgramDirector
          trigger:
            - call: "POST /challenge-course/courses/${course_id}/daily-open"
              payload: {}
              as: ProgramDirector
              captures: { posture_after: $.data.posture, reason_after: $.data.posture_reason }
          assert:
            - "${obs_posture} == CLOSED"
            - "${obs_hold} == 2026-08-10T08:30:00Z"
            - "WeatherObservation.${obs_id}.resulting_posture_reason == LIGHTNING_STOP"
            - "${posture_after} == OPEN"
            - "${reason_after} == NONE"
            - "Course.${course_id}.lightning_hold_until == null"
            - "Course.${course_id}.latest_lightning_distance_km == 6.0"
            - "Course.${course_id}.daily_open_index == 1"

