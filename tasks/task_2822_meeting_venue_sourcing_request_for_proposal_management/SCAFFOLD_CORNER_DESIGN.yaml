    - name: event_version_increments_once_per_write_and_is_visible_on_read
      claim_type: optimistic_concurrency
      grounds:
      - complexity_profile.complexity_layers
      - entities.MeetingEvent
      - state_machines.MeetingEvent.DRAFT_to_REQUIREMENTS_LOCKED
      - endpoints[POST /sourcing/events/{id}/lock-requirements]
      - endpoints[POST /sourcing/events/{id}/shortlist-entries]
      - endpoints[POST /sourcing/shortlist-entries/{id}/shortlist]
      - endpoints[GET /sourcing/events/{event_id}]
      distinguishing_aspect: 'The OCC token is a per-write counter on the parent, not a per-transition one: a freshly created MeetingEvent reads version 1, and lock-requirements, the shortlist-entry creation and the shortlist promotion each add exactly 1 - reaching 4 - even though the last two writes address a CHILD entity, and every GET returns the same value the write returned.'
      test_recipe:
        setup:
        - Logical clock at 2026-08-05T09:00:00.000Z throughout.
        - RateBenchmark (TIER_1, USER_CONFERENCE) at 260.00 ADR and a PREFERRED TIER_1 Venue 'Harborline Grand' already registered.
