  # Rule 6 — boundary_precision_check (different metrics/endpoints)
  # ---------------------------------------------------------------------------
  - rule_id: boundary_precision_check
    instances:
      - name: graduation_hold_threshold_strict_greater
        grounds:
          - calculations.posture_recompute
          - entities.SchoolYear.fields.graduation_hold_threshold_cents
          - errors[ERR_ACCOUNT_HOLD_BLOCKS_GRADUATION]
        distinguishing_aspect: |
          Boundary on the balance_cents metric via the account read/graduate
          endpoints: owed == threshold (5000) leaves posture CLEAR (strict >
          semantics), while owed == threshold+1 (5001) flips posture to
          GRADUATION_HOLD and blocks graduation.
        test_recipe:
          setup:
            - "OPEN year (graduation_hold_threshold_cents=5000); grade-12 student with account; one ad-hoc assessment of exactly 5000 cents"
          setup_api_calls:
            - call: "POST /school-years"
              payload: { label: "2026-27", start_date: "2026-08-01", end_date: "2027-06-30", refund_full_days: 2, refund_partial_days: 10, partial_refund_pct_bp: 5000, payment_plan_min_cents: 1000, payment_plan_max_installments: 6, writeoff_max_cents: 100000, aging_interval_days: 10, graduation_hold_threshold_cents: 5000 }
              as: Bookkeeper
              captures: { y_id: $.data.id }
            - call: "POST /school-years/${y_id}/departments"
              payload: { code: "SCI", name: "Science" }
              as: Bookkeeper
              captures: { d_id: $.data.id }
            - call: "POST /school-years/${y_id}/open"
              as: Bookkeeper
            - call: "POST /school-years/${y_id}/fee-catalog-items"
              payload: { name: "F1", amount_cents: 5000, department_id: "${d_id}", waiverable: true, refundable: true }
              as: Bookkeeper
              captures: { f1_id: $.data.id }
            - call: "POST /students"
              payload: { external_ref: "S-1", full_name: "Ada", grade_level: 12, family_id: "fam-a" }
              as: Bookkeeper
              captures: { s_id: $.data.id }
            - call: "POST /school-years/${y_id}/student-accounts"
              payload: { student_id: "${s_id}" }
              as: Bookkeeper
              captures: { a_id: $.data.id }
            - call: "POST /student-accounts/${a_id}/fee-assessments"
              payload: { fee_item_id: "${f1_id}", assessed_amount_cents: 5000 }
              as: Bookkeeper
            - call: "GET /student-accounts/${a_id}"
              as: Bookkeeper
              captures: { posture_at_eq: $.data.posture }
          trigger:
            - call: "POST /student-accounts/${a_id}/fee-assessments"
              payload: { fee_item_id: "${f1_id}", assessed_amount_cents: 1 }
              as: Bookkeeper
            - call: "GET /student-accounts/${a_id}"
              as: Bookkeeper
              captures: { posture_at_plus1: $.data.posture }
            - call: "POST /students/${s_id}/graduate"
              as: Bookkeeper
              captures: { err: $.data.error_id }
          assert:
            - "At balance 5000 == threshold: ${posture_at_eq} == CLEAR (strict > boundary)"
            - "At balance 5001 == threshold+1: ${posture_at_plus1} == GRADUATION_HOLD"
            - "Graduate rejected: ${err} == ERR_ACCOUNT_HOLD_BLOCKS_GRADUATION (HTTP 409)"
      - name: aging_bucket_boundary_at_exactly_k_days
        grounds:
          - calculations.collections_aging
          - entities.CollectionsCase.fields.aging_bucket
        distinguishing_aspect: |
          Boundary on the age-in-days metric via the ops-runs endpoint
          (different metric and endpoint from the graduation-threshold
          instance): at exactly age == k days the bucket flips to BUCKET_1
          (>= on the lower edge), while at k-1 days it remains CURRENT.
        test_recipe:
          setup:
            - "OPEN year (aging_interval_days=10); account with a 2000-cent ad-hoc assessment created at clock 2026-08-01; case opened by a sweep at 2026-08-12 (opened_at pinned)"
          setup_api_calls:
            - call: "POST /school-years"
              payload: { label: "2026-27", start_date: "2026-08-01", end_date: "2027-06-30", refund_full_days: 2, refund_partial_days: 10, partial_refund_pct_bp: 5000, payment_plan_min_cents: 1000, payment_plan_max_installments: 6, writeoff_max_cents: 100000, aging_interval_days: 10, graduation_hold_threshold_cents: 5000 }
              as: Bookkeeper
              captures: { y_id: $.data.id }
            - call: "POST /school-years/${y_id}/departments"
              payload: { code: "SCI", name: "Science" }
              as: Bookkeeper
              captures: { d_id: $.data.id }
            - call: "POST /school-years/${y_id}/open"
              as: Bookkeeper
            - call: "POST /school-years/${y_id}/fee-catalog-items"
              payload: { name: "F1", amount_cents: 2000, department_id: "${d_id}", waiverable: true, refundable: true }
              as: Bookkeeper
              captures: { f1_id: $.data.id }
            - call: "POST /students"
              payload: { external_ref: "S-1", full_name: "Ada", grade_level: 10, family_id: "fam-a" }
              as: Bookkeeper
              captures: { s_id: $.data.id }
            - call: "POST /school-years/${y_id}/student-accounts"
              payload: { student_id: "${s_id}" }
              as: Bookkeeper
              captures: { a_id: $.data.id }
            - call: "POST /student-accounts/${a_id}/fee-assessments"
              payload: { fee_item_id: "${f1_id}", assessed_amount_cents: 2000 }
              as: Bookkeeper
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-12T00:00:00Z" }
              as: Bookkeeper
            - call: "POST /school-years/${y_id}/ops-runs"
              as: Bookkeeper
            - call: "GET /student-accounts/${a_id}/collections-cases"
              as: Bookkeeper
              captures: { case_id: "$.data[0].id" }
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-21T00:00:00Z" }
              as: Bookkeeper
            - call: "POST /school-years/${y_id}/ops-runs"
              as: Bookkeeper
            - call: "GET /student-accounts/${a_id}/collections-cases/${case_id}"
              as: Bookkeeper
              captures: { bucket_at_9: $.data.aging_bucket }
          trigger:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-22T00:00:00Z" }
              as: Bookkeeper
            - call: "POST /school-years/${y_id}/ops-runs"
              as: Bookkeeper
            - call: "GET /student-accounts/${a_id}/collections-cases/${case_id}"
              as: Bookkeeper
              captures: { bucket_at_10: $.data.aging_bucket }
          assert:
            - "At age 9 days (k-1): ${bucket_at_9} == CURRENT"
            - "At age exactly 10 days (k): ${bucket_at_10} == BUCKET_1 (>= lower edge, < upper edge)"

  # ---------------------------------------------------------------------------
  # Rule 7 — cross_entity_state_dependency (different entity pairs)
  # ---------------------------------------------------------------------------
  - rule_id: cross_entity_state_dependency
    instances:
      - name: graduation_gated_by_account_posture
        grounds:
          - state_machines.Student.ENROLLED_to_GRADUATED
          - calculations.posture_recompute
          - validations[priority=19]
        distinguishing_aspect: |
          Entity pair Student -> StudentAccount: the Student's GRADUATED
          transition is gated on the posture of a DIFFERENT entity (the
          StudentAccount); clearing the hold via payment settlement unblocks
          the same transition.
        test_recipe:
          setup:
            - "OPEN year (threshold 5000); grade-12 student; account with a 6000-cent assessment (posture GRADUATION_HOLD)"
          setup_api_calls:
            - call: "POST /school-years"
              payload: { label: "2026-27", start_date: "2026-08-01", end_date: "2027-06-30", refund_full_days: 2, refund_partial_days: 10, partial_refund_pct_bp: 5000, payment_plan_min_cents: 1000, payment_plan_max_installments: 6, writeoff_max_cents: 100000, aging_interval_days: 10, graduation_hold_threshold_cents: 5000 }
              as: Bookkeeper
              captures: { y_id: $.data.id }
            - call: "POST /school-years/${y_id}/departments"
              payload: { code: "SCI", name: "Science" }
              as: Bookkeeper
              captures: { d_id: $.data.id }
            - call: "POST /school-years/${y_id}/open"
              as: Bookkeeper
            - call: "POST /school-years/${y_id}/fee-catalog-items"
              payload: { name: "F1", amount_cents: 6000, department_id: "${d_id}", waiverable: true, refundable: true }
              as: Bookkeeper
              captures: { f1_id: $.data.id }
            - call: "POST /students"
              payload: { external_ref: "S-1", full_name: "Ada", grade_level: 12, family_id: "fam-a" }
              as: Bookkeeper
              captures: { s_id: $.data.id }
            - call: "POST /school-years/${y_id}/student-accounts"
              payload: { student_id: "${s_id}" }
              as: Bookkeeper
              captures: { a_id: $.data.id }
            - call: "POST /student-accounts/${a_id}/fee-assessments"
              payload: { fee_item_id: "${f1_id}", assessed_amount_cents: 6000 }
              as: Bookkeeper
          trigger:
            - call: "POST /students/${s_id}/graduate"
              as: Bookkeeper
              captures: { err1: $.data.error_id }
            - call: "POST /student-accounts/${a_id}/payments"
              payload: { amount_cents: 6000, method: "CARD", idempotency_key: "k1" }
              as: FamilyMember
              captures: { pay_id: $.data.id }
            - call: "POST /student-accounts/${a_id}/payments/${pay_id}/settle"
              payload: { outcome: "SUCCEEDED" }
              as: FamilyMember
            - call: "POST /students/${s_id}/graduate"
              as: Bookkeeper
              captures: { s_status: $.data.status }
          assert:
            - "First graduate rejected: ${err1} == ERR_ACCOUNT_HOLD_BLOCKS_GRADUATION"
            - "After a 6000-cent settlement clears the balance, posture recomputes to CLEAR"
            - "Second graduate succeeds: ${s_status} == GRADUATED"
      - name: enrollment_gated_by_offering_state
        grounds:
          - state_machines.Offering.SCHEDULED_to_IN_SESSION
          - validations[priority=10]
          - errors[ERR_ENROLLMENT_WINDOW_CLOSED]
        distinguishing_aspect: |
          Entity pair Enrollment -> Offering (different pair from
          Student -> StudentAccount): enrollment creation is rejected purely
          because the referenced Offering transitioned to IN_SESSION — the
          Enrollment machine has no such gate of its own.
        test_recipe:
          setup:
            - "OPEN year; offering (capacity 30) with start_date 2026-09-01; clock advanced to 2026-09-01 and offering read so it transitions to IN_SESSION; student with account and no enrollments"
          setup_api_calls:
            - call: "POST /school-years"
              payload: { label: "2026-27", start_date: "2026-08-01", end_date: "2027-06-30", refund_full_days: 2, refund_partial_days: 10, partial_refund_pct_bp: 5000, payment_plan_min_cents: 1000, payment_plan_max_installments: 6, writeoff_max_cents: 100000, aging_interval_days: 10, graduation_hold_threshold_cents: 5000 }
              as: Bookkeeper
              captures: { y_id: $.data.id }
            - call: "POST /school-years/${y_id}/departments"
              payload: { code: "SCI", name: "Science" }
              as: Bookkeeper
              captures: { d_id: $.data.id }
            - call: "POST /school-years/${y_id}/open"
              as: Bookkeeper
            - call: "POST /school-years/${y_id}/fee-catalog-items"
              payload: { name: "F1", amount_cents: 1000, department_id: "${d_id}", waiverable: true, refundable: true }
              as: Bookkeeper
              captures: { f1_id: $.data.id }
            - call: "POST /school-years/${y_id}/offerings"
              payload: { kind: "COURSE", title: "Chem", department_id: "${d_id}", fee_item_id: "${f1_id}", start_date: "2026-09-01", end_date: "2026-12-15", capacity: 30 }
              as: Bookkeeper
              captures: { o1_id: $.data.id }
            - call: "POST /students"
              payload: { external_ref: "S-1", full_name: "Ada", grade_level: 10, family_id: "fam-a" }
              as: Bookkeeper
              captures: { s_id: $.data.id }
            - call: "POST /school-years/${y_id}/student-accounts"
              payload: { student_id: "${s_id}" }
              as: Bookkeeper
              captures: { a_id: $.data.id }
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-09-01T00:00:00Z" }
              as: Bookkeeper
            - call: "GET /school-years/${y_id}/offerings/${o1_id}"
              as: Bookkeeper
              captures: { o_status: $.data.status }
          trigger:
            - call: "POST /student-accounts/${a_id}/enrollments"
              payload: { offering_id: "${o1_id}" }
              as: Bookkeeper
              captures: { err: $.data.error_id }
          assert:
            - "Offering observed IN_SESSION (${o_status}) after the clock reached its start_date"
            - "${err} == ERR_ENROLLMENT_WINDOW_CLOSED (HTTP 409) — Enrollment creation gated solely by Offering.status"

  # ---------------------------------------------------------------------------
  # Rule 8 — resource_temporal_overlap (different interval semantics)
  # ---------------------------------------------------------------------------
  - rule_id: resource_temporal_overlap
    instances:
      - name: school_year_closed_interval_shared_endpoint_collides
        grounds:
          - validations[priority=12]
          - errors[ERR_YEAR_OVERLAP]
          - entities.SchoolYear.fields.end_date
        distinguishing_aspect: |
          CLOSED-interval semantics on the SchoolYear resource: a new year
          whose start_date equals an existing non-CLOSED year's end_date
          collides — the shared endpoint date is occupied by both intervals,
          so 2027-06-30 adjacency is rejected.
        test_recipe:
          setup:
            - "Existing school year occupying [2026-08-01, 2027-06-30] (DRAFT or OPEN — non-CLOSED either way)"
          setup_api_calls:
            - call: "POST /school-years"
              payload: { label: "2026-27", start_date: "2026-08-01", end_date: "2027-06-30", refund_full_days: 2, refund_partial_days: 10, partial_refund_pct_bp: 5000, payment_plan_min_cents: 1000, payment_plan_max_installments: 6, writeoff_max_cents: 100000, aging_interval_days: 10, graduation_hold_threshold_cents: 5000 }
              as: Bookkeeper
              captures: { y_id: $.data.id }
          trigger:
            - call: "POST /school-years"
              payload: { label: "2027-28", start_date: "2027-06-30", end_date: "2028-06-15", refund_full_days: 2, refund_partial_days: 10, partial_refund_pct_bp: 5000, payment_plan_min_cents: 1000, payment_plan_max_installments: 6, writeoff_max_cents: 100000, aging_interval_days: 10, graduation_hold_threshold_cents: 5000 }
              as: Bookkeeper
              captures: { err: $.data.error_id }
          assert:
            - "${err} == ERR_YEAR_OVERLAP (HTTP 409): new.start 2027-06-30 == existing.end 2027-06-30 collides under closed-interval semantics"
            - "SchoolYear.${y_id} unchanged (version still 1)"
      - name: enrollment_half_open_interval_adjacency_allowed
        grounds:
          - validations[priority=11]
          - errors[ERR_SCHEDULE_CONFLICT]
          - entities.Offering.fields.end_date
        distinguishing_aspect: |
          HALF-OPEN [start, end) semantics on the Enrollment/Offering resource
          (different semantics AND different resource entity from the
          SchoolYear rule): offering B starting exactly when offering A ends
          is accepted, while offering C overlapping A by one day is rejected.
        test_recipe:
          setup:
            - "OPEN year; three offerings: A [2026-09-01, 2026-12-15], B [2026-12-15, 2027-03-01] (adjacent at 2026-12-15), C [2026-12-14, 2027-02-01] (overlaps A by one day); one student account already enrolled in A"
          setup_api_calls:
            - call: "POST /school-years"
              payload: { label: "2026-27", start_date: "2026-08-01", end_date: "2027-06-30", refund_full_days: 2, refund_partial_days: 10, partial_refund_pct_bp: 5000, payment_plan_min_cents: 1000, payment_plan_max_installments: 6, writeoff_max_cents: 100000, aging_interval_days: 10, graduation_hold_threshold_cents: 5000 }
              as: Bookkeeper
              captures: { y_id: $.data.id }
            - call: "POST /school-years/${y_id}/departments"
              payload: { code: "SCI", name: "Science" }
              as: Bookkeeper
              captures: { d_id: $.data.id }
            - call: "POST /school-years/${y_id}/open"
              as: Bookkeeper
            - call: "POST /school-years/${y_id}/fee-catalog-items"
              payload: { name: "F1", amount_cents: 1000, department_id: "${d_id}", waiverable: true, refundable: true }
              as: Bookkeeper
              captures: { f1_id: $.data.id }
            - call: "POST /school-years/${y_id}/offerings"
              payload: { kind: "COURSE", title: "A", department_id: "${d_id}", fee_item_id: "${f1_id}", start_date: "2026-09-01", end_date: "2026-12-15", capacity: 30 }
              as: Bookkeeper
              captures: { oa_id: $.data.id }
            - call: "POST /school-years/${y_id}/offerings"
              payload: { kind: "COURSE", title: "B", department_id: "${d_id}", fee_item_id: "${f1_id}", start_date: "2026-12-15", end_date: "2027-03-01", capacity: 30 }
              as: Bookkeeper
              captures: { ob_id: $.data.id }
            - call: "POST /school-years/${y_id}/offerings"
              payload: { kind: "COURSE", title: "C", department_id: "${d_id}", fee_item_id: "${f1_id}", start_date: "2026-12-14", end_date: "2027-02-01", capacity: 30 }
              as: Bookkeeper
              captures: { oc_id: $.data.id }
            - call: "POST /students"
              payload: { external_ref: "S-1", full_name: "Ada", grade_level: 10, family_id: "fam-a" }
              as: Bookkeeper
              captures: { s_id: $.data.id }
            - call: "POST /school-years/${y_id}/student-accounts"
              payload: { student_id: "${s_id}" }
              as: Bookkeeper
              captures: { a_id: $.data.id }
            - call: "POST /student-accounts/${a_id}/enrollments"
              payload: { offering_id: "${oa_id}" }
              as: Bookkeeper
          trigger:
            - call: "POST /student-accounts/${a_id}/enrollments"
              payload: { offering_id: "${ob_id}" }
              as: Bookkeeper
              captures: { enr_b_id: $.data.id }
            - call: "POST /student-accounts/${a_id}/enrollments"
              payload: { offering_id: "${oc_id}" }
              as: Bookkeeper
              captures: { err: $.data.error_id }
          assert:
            - "Enrollment into B succeeds (half-open adjacency: B.start == A.end does not collide) — Enrollment.${enr_b_id} created"
            - "Enrollment into C rejected: ${err} == ERR_SCHEDULE_CONFLICT (HTTP 409) — [2026-12-14, 2027-02-01) intersects A's [2026-09-01, 2026-12-15)"

  # ---------------------------------------------------------------------------
  # Rule 9 — compensating_invariant (different conserved quantities)
  # ---------------------------------------------------------------------------
  - rule_id: compensating_invariant
    instances:
      - name: distribution_ledger_conserved_across_payment_and_refund
        grounds:
          - calculations.department_distribution
          - calculations.write_off_reconciliation
          - entities.LedgerEntry.fields.amount_cents
        distinguishing_aspect: |
          Conserved quantity: the department distribution ledger. After a
          10000-cent payment (6000 to D1, 4000 to D2) and a 3000-cent
          executed refund against the D1 assessment, the invariant
          sum(distributed_cents) == sum(allocations) - sum(executed refunds)
          - sum(write-offs) holds exactly: 3000 + 4000 == 10000 - 3000 - 0,
          and a reconciliation run reports drift_detected == false.
        test_recipe:
          setup:
            - "OPEN year (refund_full_days=2, partial_days=10, pct 5000); departments D1 and D2; fees F1=6000 (D1) and F2=4000 (D2) on disjoint-window offerings; one account enrolled in both; single 10000-cent payment settled (allocates 6000 to A1, 4000 to A2 by created_at order)"
            - "Clock at 2026-09-04 (day 3 -> PARTIAL tier) and enrollment on offering 1 withdrawn, spawning a 3000-cent refund (floor(6000 * 5000/10000))"
          setup_api_calls:
            - call: "POST /school-years"
              payload: { label: "2026-27", start_date: "2026-08-01", end_date: "2027-06-30", refund_full_days: 2, refund_partial_days: 10, partial_refund_pct_bp: 5000, payment_plan_min_cents: 1000, payment_plan_max_installments: 6, writeoff_max_cents: 100000, aging_interval_days: 10, graduation_hold_threshold_cents: 5000 }
              as: Bookkeeper
              captures: { y_id: $.data.id }
            - call: "POST /school-years/${y_id}/departments"
              payload: { code: "D1", name: "Science" }
              as: Bookkeeper
              captures: { d1_id: $.data.id }
            - call: "POST /school-years/${y_id}/departments"
              payload: { code: "D2", name: "Athletics" }
              as: Bookkeeper
              captures: { d2_id: $.data.id }
            - call: "POST /school-years/${y_id}/open"
              as: Bookkeeper
            - call: "POST /school-years/${y_id}/fee-catalog-items"
              payload: { name: "F1", amount_cents: 6000, department_id: "${d1_id}", waiverable: true, refundable: true }
              as: Bookkeeper
              captures: { f1_id: $.data.id }
            - call: "POST /school-years/${y_id}/fee-catalog-items"
              payload: { name: "F2", amount_cents: 4000, department_id: "${d2_id}", waiverable: true, refundable: true }
              as: Bookkeeper
              captures: { f2_id: $.data.id }
            - call: "POST /school-years/${y_id}/offerings"
              payload: { kind: "COURSE", title: "Chem", department_id: "${d1_id}", fee_item_id: "${f1_id}", start_date: "2026-09-01", end_date: "2026-12-15", capacity: 30 }
              as: Bookkeeper
              captures: { o1_id: $.data.id }
            - call: "POST /school-years/${y_id}/offerings"
              payload: { kind: "ACTIVITY", title: "Track", department_id: "${d2_id}", fee_item_id: "${f2_id}", start_date: "2027-01-05", end_date: "2027-04-30", capacity: 30 }
              as: Bookkeeper
              captures: { o2_id: $.data.id }
            - call: "POST /students"
              payload: { external_ref: "S-1", full_name: "Ada", grade_level: 10, family_id: "fam-a" }
              as: Bookkeeper
              captures: { s_id: $.data.id }
            - call: "POST /school-years/${y_id}/student-accounts"
              payload: { student_id: "${s_id}" }
              as: Bookkeeper
              captures: { a_id: $.data.id }
            - call: "POST /student-accounts/${a_id}/enrollments"
              payload: { offering_id: "${o1_id}" }
              as: Bookkeeper
              captures: { e1_id: $.data.id }
            - call: "POST /student-accounts/${a_id}/enrollments"
              payload: { offering_id: "${o2_id}" }
              as: Bookkeeper
            - call: "POST /student-accounts/${a_id}/payments"
              payload: { amount_cents: 10000, method: "CARD", idempotency_key: "k1" }
              as: FamilyMember
              captures: { pay_id: $.data.id }
            - call: "POST /student-accounts/${a_id}/payments/${pay_id}/settle"
              payload: { outcome: "SUCCEEDED" }
              as: FamilyMember
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-09-04T00:00:00Z" }
              as: Bookkeeper
            - call: "POST /student-accounts/${a_id}/enrollments/${e1_id}/withdraw"
              as: Bookkeeper
            - call: "GET /student-accounts/${a_id}/refunds"
              as: Bookkeeper
              captures: { r_id: "$.data[0].id" }
          trigger:
            - call: "POST /student-accounts/${a_id}/refunds/${r_id}/execute"
              as: Bookkeeper
            - call: "GET /school-years/${y_id}/departments/${d1_id}"
              as: Bookkeeper
              captures: { d1_dist: $.data.distributed_cents }
            - call: "GET /school-years/${y_id}/departments/${d2_id}"
              as: Bookkeeper
              captures: { d2_dist: $.data.distributed_cents }
            - call: "POST /school-years/${y_id}/reconciliation-runs"
              as: Bookkeeper
              captures: { run_drift: $.data.drift_detected }
          assert:
            - "D1.distributed_cents == 3000 (${d1_dist} = 6000 credit - 3000 reversal)"
            - "D2.distributed_cents == 4000 (${d2_dist}, untouched)"
            - "Invariant: ${d1_dist} + ${d2_dist} == 7000 == 10000 allocations - 3000 refunds - 0 write-offs"
            - "Reconciliation run reports ${run_drift} == false"
      - name: waiver_approve_revoke_roundtrip_conserves_balance
        grounds:
          - calculations.waiver_stacking
          - state_machines.WaiverApplication.APPROVED_to_REVOKED
          - entities.StudentAccount.fields.waived_cents
        distinguishing_aspect: |
          Conserved quantity: the account's assessed/waived/paid decomposition
          (different quantity from the distribution ledger). Approve (waived
          0 -> 4000, balance 8000 -> 4000) followed by revoke restores the
          pre-approve values exactly — zero drift in waived_cents and
          balance_cents across the forward/compensating pair.
        test_recipe:
          setup:
            - "OPEN year; waiverable 8000-cent fee; one account with one enrollment-driven assessment; program P (5000 bp, priority 1, cap 10000000, grades 9-12) with a PENDING application"
          setup_api_calls:
            - call: "POST /school-years"
              payload: { label: "2026-27", start_date: "2026-08-01", end_date: "2027-06-30", refund_full_days: 2, refund_partial_days: 10, partial_refund_pct_bp: 5000, payment_plan_min_cents: 1000, payment_plan_max_installments: 6, writeoff_max_cents: 100000, aging_interval_days: 10, graduation_hold_threshold_cents: 5000 }
              as: Bookkeeper
              captures: { y_id: $.data.id }
            - call: "POST /school-years/${y_id}/departments"
              payload: { code: "SCI", name: "Science" }
              as: Bookkeeper
              captures: { d_id: $.data.id }
            - call: "POST /school-years/${y_id}/open"
              as: Bookkeeper
            - call: "POST /school-years/${y_id}/fee-catalog-items"
              payload: { name: "F1", amount_cents: 8000, department_id: "${d_id}", waiverable: true, refundable: true }
              as: Bookkeeper
              captures: { f1_id: $.data.id }
            - call: "POST /school-years/${y_id}/offerings"
              payload: { kind: "COURSE", title: "Chem", department_id: "${d_id}", fee_item_id: "${f1_id}", start_date: "2026-09-01", end_date: "2026-12-15", capacity: 30 }
              as: Bookkeeper
              captures: { o1_id: $.data.id }
            - call: "POST /students"
              payload: { external_ref: "S-1", full_name: "Ada", grade_level: 10, family_id: "fam-a" }
              as: Bookkeeper
              captures: { s_id: $.data.id }
            - call: "POST /school-years/${y_id}/student-accounts"
              payload: { student_id: "${s_id}" }
              as: Bookkeeper
              captures: { a_id: $.data.id }
            - call: "POST /student-accounts/${a_id}/enrollments"
              payload: { offering_id: "${o1_id}" }
              as: Bookkeeper
            - call: "POST /school-years/${y_id}/waiver-programs"
              payload: { name: "P", waiver_pct_bp: 5000, stacking_priority: 1, max_waived_per_student_cents: 10000000, eligibility_grade_min: 9, eligibility_grade_max: 12 }
              as: Bookkeeper
              captures: { p_id: $.data.id }
            - call: "POST /student-accounts/${a_id}/waiver-applications"
              payload: { waiver_program_id: "${p_id}" }
              as: FamilyMember
              as_user_id: "fam-1"
              captures: { app_id: $.data.id }
            - call: "GET /student-accounts/${a_id}"
              as: Bookkeeper
              captures: { bal_pre: $.data.balance_cents, waiv_pre: $.data.waived_cents, a_v1: $.data.version }
            - call: "POST /student-accounts/${a_id}/waiver-applications/${app_id}/approve"
              payload: { expected_account_version: "${a_v1}" }
              as: Bookkeeper
              as_user_id: "bk-1"
            - call: "GET /student-accounts/${a_id}"
              as: Bookkeeper
              captures: { bal_mid: $.data.balance_cents, waiv_mid: $.data.waived_cents }
          trigger:
            - call: "POST /student-accounts/${a_id}/waiver-applications/${app_id}/revoke"
              as: Bookkeeper
              as_user_id: "bk-1"
            - call: "GET /student-accounts/${a_id}"
              as: Bookkeeper
              captures: { bal_post: $.data.balance_cents, waiv_post: $.data.waived_cents }
          assert:
            - "Pre-approve: balance 8000, waived 0 (${bal_pre} == 8000, ${waiv_pre} == 0)"
            - "Post-approve: balance 4000, waived 4000 (${bal_mid} == 4000, ${waiv_mid} == 4000)"
            - "Post-revote (compensating action): ${bal_post} == 8000 and ${waiv_post} == 0 — exact restoration, zero drift"
            - "FeeAssessment status returns to ASSESSED (100%-waiver WAIVED state rolled back)"
