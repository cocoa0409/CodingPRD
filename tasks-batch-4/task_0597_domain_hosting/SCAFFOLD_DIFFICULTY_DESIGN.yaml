  # =========================================================================
  # Rule 7 — Cross-entity state dependencies across different entity pairs
  # =========================================================================
  - rule_id: cross_entity_state_dependency
    instances:
      - name: ssl_validation_depends_on_txt_dns_record_of_the_domain
        grounds:
          - state_machines.AddOn.PENDING_VALIDATION_to_ACTIVE
          - validations[priority=62]
          - errors[ERR_DNS_VALIDATION_FAILED]
          - entities.AddOn.fields.validation_token
          - entities.DnsRecord.fields.value
        distinguishing_aspect: |
          Entity pair AddOn <-> DnsRecord: the AddOn's PENDING_VALIDATION -> ACTIVE transition is
          legal only when a DnsRecord on the same domain with record_type TXT, name
          '_acme-challenge' and value == AddOn.validation_token exists. With no such record the
          transition is rejected (ERR_DNS_VALIDATION_FAILED); publishing the record makes the very
          same call succeed.
        test_recipe:
          setup:
            - "ACTIVE DELUXE subscription on an ACTIVE example.com domain."
            - "An SSL_CERT add-on in PENDING_VALIDATION with a server-minted validation_token."
            - "No TXT record published on the zone yet."
