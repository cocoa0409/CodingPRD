            - "GET /lot-items?item_id=${it} returns the same single LotItem row (filtered-list reverse reachability)"

  # =========================================================================
  # Section: errors (triggerability for codes not covered elsewhere)
  # =========================================================================
  - section: errors
    instances:
      - name: err_invalid_time_window_rejected
        claim_type: violation_to_error
        grounds: ["errors[ERR_INVALID_TIME_WINDOW]", "validations[priority=21]"]
        distinguishing_aspect: "Event with ends_at equal to starts_at violates strict ordering."
        test_recipe:
          setup: ["TRANSIT program and venue"]
          setup_api_calls:
            - call: "POST /programs"
              payload: { name: "Transit L&F", program_type: "TRANSIT", contact_email: "t@city.gov" }
              as: ProgramAdmin
              captures: { pt: $.data.id }
            - call: "POST /venues"
              payload: { program_id: "${pt}", name: "Depot Hall", address: "1 Depot St", insurance_cap_cents: 100000000 }
              as: ProgramAdmin
              captures: { ven: $.data.id }
          trigger:
            - call: "POST /auction-events"
              payload: { venue_id: "${ven}", program_id: "${pt}", name: "Bad Window", starts_at: "2026-09-01T10:00:00Z", ends_at: "2026-09-01T10:00:00Z" }
              as: AuctionCoordinator
              as_user_id: "coord-1"
              captures: { err: $.data.error_id }
          assert:
            - "err == \"ERR_INVALID_TIME_WINDOW\" and HTTP status 422"
      - name: err_event_still_open_rejected
        claim_type: violation_to_error
        grounds: ["errors[ERR_EVENT_STILL_OPEN]", "validations[priority=23]"]
        distinguishing_aspect: "Settle before ends_at on the logical clock fails even with zero lots (empty lot set is vacuously terminal, so the temporal check is what fires)."
        test_recipe:
          setup: ["TRANSIT program, venue, event ending 2026-08-20T12:00:00Z; clock pinned at 2026-08-20T11:00:00Z"]
          setup_api_calls:
            - call: "POST /programs"
              payload: { name: "Transit L&F", program_type: "TRANSIT", contact_email: "t@city.gov" }
              as: ProgramAdmin
              captures: { pt: $.data.id }
            - call: "POST /venues"
              payload: { program_id: "${pt}", name: "Depot Hall", address: "1 Depot St", insurance_cap_cents: 100000000 }
              as: ProgramAdmin
              captures: { ven: $.data.id }
            - call: "POST /auction-events"
              payload: { venue_id: "${ven}", program_id: "${pt}", name: "Aug Sale", starts_at: "2026-08-20T10:00:00Z", ends_at: "2026-08-20T12:00:00Z" }
              as: AuctionCoordinator
              as_user_id: "coord-1"
              captures: { ev: $.data.id }
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-20T11:00:00Z" }
              as: ProgramAdmin
          trigger:
            - call: "POST /auction-events/${ev}/settle"
              as: AuctionCoordinator
              as_user_id: "coord-1"
              captures: { err: $.data.error_id }
          assert:
            - "err == \"ERR_EVENT_STILL_OPEN\" and AuctionEvent.${ev}.status remains SCHEDULED"
      - name: err_no_retention_policy_rejected
        claim_type: violation_to_error
        grounds: ["errors[ERR_NO_RETENTION_POLICY]", "validations[priority=18]"]
        distinguishing_aspect: "Intake in a category with no matching active policy fails; here KEYS has no policy while ELECTRONICS does."
        test_recipe:
          setup: ["TRANSIT program with only an ELECTRONICS/LOW policy and a location"]
          setup_api_calls:
            - call: "POST /programs"
              payload: { name: "Transit L&F", program_type: "TRANSIT", contact_email: "t@city.gov" }
              as: ProgramAdmin
              captures: { pt: $.data.id, pt_v: $.data.version }
            - call: "POST /retention-policies"
              payload: { program_id: "${pt}", item_category: "ELECTRONICS", value_tier: "LOW", retention_days: 10, disposal_method: "AUCTION", expected_program_version: "${pt_v}" }
              as: ProgramAdmin
            - call: "POST /storage-locations"
              payload: { program_id: "${pt}", name: "Cage T", capacity_slots: 10, supports_high_value: true }
              as: ProgramAdmin
              captures: { loc: $.data.id }
          trigger:
            - call: "POST /items"
              payload: { program_id: "${pt}", storage_location_id: "${loc}", category: "KEYS", declared_value_cents: 500, description: "key ring", found_at: "2026-08-01T09:00:00Z", found_location: "Bus 12" }
              as: IntakeOfficer
              as_user_id: "officer-intake-1"
              captures: { err: $.data.error_id }
          assert:
            - "err == \"ERR_NO_RETENTION_POLICY\" and HTTP status 422"
      - name: err_program_inactive_rejected
        claim_type: violation_to_error
        grounds: ["errors[ERR_PROGRAM_INACTIVE]", "validations[priority=13]"]
        distinguishing_aspect: "Intake under a deactivated program fails with ERR_PROGRAM_INACTIVE."
        test_recipe:
          setup: ["TRANSIT program with LOW policy and location; program then deactivated"]
          setup_api_calls:
            - call: "POST /programs"
              payload: { name: "Transit L&F", program_type: "TRANSIT", contact_email: "t@city.gov" }
              as: ProgramAdmin
              captures: { pt: $.data.id, pt_v: $.data.version }
            - call: "POST /retention-policies"
              payload: { program_id: "${pt}", item_category: "ELECTRONICS", value_tier: "LOW", retention_days: 10, disposal_method: "AUCTION", expected_program_version: "${pt_v}" }
              as: ProgramAdmin
            - call: "POST /storage-locations"
              payload: { program_id: "${pt}", name: "Cage T", capacity_slots: 10, supports_high_value: true }
