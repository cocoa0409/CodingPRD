  # ===========================================================================
  # Section 8 — Cross-cutting complexity layers (§1.0 complexity_layers):
  # optimistic_concurrency, cascading_side_effects, dual_variant_calculation and
  # derived_field_reconciliation. The two §1.2.1 concurrency rules each get their
  # own stale-version instance on their declared write_endpoint.
  # ===========================================================================
  - section: cross_cutting_complexity_layers
    instances:
      - name: stale_expected_request_version_on_fee_estimate_create_returns_412
        claim_type: optimistic_concurrency
        grounds:
          - concurrency_rules.fee-estimate-create-stale-request
          - validations.priority_7
          - errors.ERR_STALE_REQUEST_VERSION
          - calculations.fee_estimate_total
        distinguishing_aspect: |
          The version read at intake is already two bumps stale by the time the record is
          responsive, so the estimate is refused at 412, accepted once re-read, and the
          same re-read value is stale on the very next attempt because the accepted
          estimate itself bumped the version.
        test_recipe:
          setup:
            - "One 30-minute ROUTINE recording of INC-2026-0670 attached to a clerk-filed request and ruled RESPONSIVE, so the labour set is non-empty."
            - "The version returned by the intake call is retained deliberately, and both the clarification and the inclusion ruling have since incremented it."
            - "A DVD estimate is used so the projected media component is 500 cents and the total is never zero: review 30 plus baseline burden 8 is under the 60-minute free allowance, so labour is 0."
          setup_api_calls:
            - { call: "POST /_clock/set_current_utc", payload: { current_utc: "2026-08-01T00:00:00Z" }, as: RecordsSupervisor, as_user_id: "supv-1" }
            - { call: "POST /records/requesters", payload: { full_name: "Pat Public", email: "pat@example.org", requester_type: "GENERAL_PUBLIC" }, as: RecordsClerk, as_user_id: "clerk-1", captures: { requester_id: $.data.id } }
            - { call: "POST /records/video-assets", payload: { incident_number: "INC-2026-0670", device_serial: "AXON-0670", officer_badge: "B-1169", recorded_start_at: "2026-06-25T09:00:00Z", duration_ms: 1800000, classification: "ROUTINE", retention_category: "INVESTIGATIVE_3Y", scheduled_purge_at: "2029-06-25T00:00:00Z" }, as: RecordsClerk, as_user_id: "clerk-1", captures: { asset_id: $.data.id } }
            - { call: "POST /records/requests", payload: { requester_id: "${requester_id}", received_at: "2026-08-01T00:00:00Z", subject_incident_number: "INC-2026-0670", requested_date_from: "2026-06-25T00:00:00Z", requested_date_to: "2026-06-26T00:00:00Z", scope_narrative: "Half an hour of BWC video" }, as: RecordsClerk, as_user_id: "clerk-1", captures: { req_id: $.data.id, req_v1: $.data.version } }
            - { call: "POST /records/requests/${req_id}/scope-clarification", payload: { scope_narrative: "The single half-hour recording", requested_date_from: "2026-06-25T00:00:00Z", requested_date_to: "2026-06-25T23:59:59Z", expected_request_version: "${req_v1}" }, as: RecordsClerk, as_user_id: "clerk-1" }
            - { call: "POST /records/requests/${req_id}/responsive-records", payload: { video_asset_id: "${asset_id}" }, as: RecordsClerk, as_user_id: "clerk-1", captures: { rec_id: $.data.id } }
            - { call: "POST /records/responsive-records/${rec_id}/inclusion", payload: { inclusion_status: "RESPONSIVE" }, as: RecordsClerk, as_user_id: "clerk-1" }
          trigger:
            - { call: "POST /records/requests/${req_id}/fee-estimates", payload: { basis: "PRESUMPTIVE", media_type: "DVD", expected_request_version: "${req_v1}" }, as: RecordsClerk, as_user_id: "clerk-1", captures: { e_stale: $.data.error_id } }
            - { call: "GET /records/requests/${req_id}", as: RecordsClerk, as_user_id: "clerk-1", captures: { v_fresh: $.data.version } }
            - { call: "POST /records/requests/${req_id}/fee-estimates", payload: { basis: "PRESUMPTIVE", media_type: "DVD", expected_request_version: "${v_fresh}" }, as: RecordsClerk, as_user_id: "clerk-1", captures: { est_id: $.data.id } }
            - { call: "POST /records/requests/${req_id}/fee-estimates", payload: { basis: "PRESUMPTIVE", media_type: "DVD", expected_request_version: "${v_fresh}" }, as: RecordsClerk, as_user_id: "clerk-1", captures: { e_stale_again: $.data.error_id } }
          assert:
            - "first response: HTTP 412 and ${e_stale} == ERR_STALE_REQUEST_VERSION"
            - "after the refusal GET /records/requests/${req_id}/fee-estimates returns total_count == 0 and PublicRecordsRequest.${req_id}.version == ${v_fresh} — the refused write bumped nothing"
            - "third response: HTTP 201, FeeEstimate.${est_id}.sequence_number == 1, status == ACTIVE and basis == PRESUMPTIVE"
            - "FeeEstimate.${est_id}: projected_review_minutes == 30, projected_burden_minutes == 8, billable_minutes == 0, estimated_labor_cents == 0, media_production_cents == 500, subtotal_cents == 500, effective_waiver_pct == 0.00, waiver_credit_cents == 0, estimated_total_cents == 500, deposit_required_cents == 0"
            - "PublicRecordsRequest.${req_id}: fee_status == ESTIMATED, estimated_total_cents == 500, deposit_required_cents == 0, deposit_due_at == null, and version is exactly one greater than ${v_fresh}"
            - "fourth response: HTTP 412 and ${e_stale_again} == ERR_STALE_REQUEST_VERSION — the successful estimate consumed that version"
            - "GET /records/requests/${req_id}/fee-estimates still returns total_count == 1"
      - name: stale_expected_request_version_on_scope_clarification_returns_412
        claim_type: optimistic_concurrency
        grounds:
          - concurrency_rules.scope-clarification-stale-request
          - validations.priority_7
          - errors.ERR_STALE_REQUEST_VERSION
          - validations.priority_23
        distinguishing_aspect: |
          A replayed clarification carrying the version it already consumed is refused at
          412 and, crucially, does not spend one of the two permitted clarification slots,
          so a legitimate second clarification still succeeds afterwards.
        test_recipe:
          setup:
            - "One clerk-filed request received at 2026-08-01T00:00:00Z, still in INTAKE with version 1 and scope_clarification_count 0."
            - "No records are attached, so nothing but the clarification path moves the version."
          setup_api_calls:
            - { call: "POST /_clock/set_current_utc", payload: { current_utc: "2026-08-01T00:00:00Z" }, as: RecordsSupervisor, as_user_id: "supv-1" }
            - { call: "POST /records/requesters", payload: { full_name: "Pat Public", email: "pat@example.org", requester_type: "GENERAL_PUBLIC" }, as: RecordsClerk, as_user_id: "clerk-1", captures: { requester_id: $.data.id } }
            - { call: "POST /records/requests", payload: { requester_id: "${requester_id}", received_at: "2026-08-01T00:00:00Z", subject_incident_number: "INC-2026-0671", requested_date_from: "2026-06-24T00:00:00Z", requested_date_to: "2026-06-25T00:00:00Z", scope_narrative: "Everything on the incident" }, as: RecordsClerk, as_user_id: "clerk-1", captures: { req_id: $.data.id, req_v1: $.data.version } }
          trigger:
            - { call: "POST /records/requests/${req_id}/scope-clarification", payload: { scope_narrative: "Narrowed to the arrest", requested_date_from: "2026-06-24T09:00:00Z", requested_date_to: "2026-06-24T12:00:00Z", expected_request_version: "${req_v1}" }, as: RecordsClerk, as_user_id: "clerk-1" }
            - { call: "POST /records/requests/${req_id}/scope-clarification", payload: { scope_narrative: "A replay of the same narrowing", requested_date_from: "2026-06-24T09:00:00Z", requested_date_to: "2026-06-24T12:00:00Z", expected_request_version: "${req_v1}" }, as: RecordsClerk, as_user_id: "clerk-1", captures: { e_replay: $.data.error_id } }
            - { call: "GET /records/requests/${req_id}", as: RecordsClerk, as_user_id: "clerk-1", captures: { v_two: $.data.version } }
            - { call: "POST /records/requests/${req_id}/scope-clarification", payload: { scope_narrative: "Narrowed again, with a five-day extension", requested_date_from: "2026-06-24T09:00:00Z", requested_date_to: "2026-06-24T11:00:00Z", expected_request_version: "${v_two}", extension_days_granted: 5 }, as: RecordsSupervisor, as_user_id: "supv-1" }
          assert:
            - "first response: HTTP 200, processing_status == SCOPING, scope_clarification_count == 1, scope_narrative == \"Narrowed to the arrest\" and statutory_deadline_at == 2026-08-21T00:00:00Z"
            - "second response: HTTP 412 and ${e_replay} == ERR_STALE_REQUEST_VERSION"
            - "after the refusal scope_narrative is still \"Narrowed to the arrest\", scope_clarification_count is still 1 and version == ${v_two} — the replay consumed neither a version nor a clarification slot"
            - "fourth response: HTTP 200, scope_clarification_count == 2, extension_days_granted == 5, requested_date_to == 2026-06-24T11:00:00Z and version is exactly one greater than ${v_two}"
            - "statutory_deadline_at == 2026-08-26T00:00:00Z — received_at plus 20 standard days plus the 5 granted days, with tolled_days still 0"
      - name: retention_locked_reconciles_across_both_of_its_or_branches
        claim_type: derived_field_reconciliation
        grounds:
          - entities.VideoAsset.retention_locked
          - endpoints.POST_/records/requests/{id}/responsive-records
          - endpoints.POST_/records/responsive-records/{id}/inclusion
          - endpoints.POST_/records/litigation-holds
          - endpoints.POST_/records/litigation-holds/{id}/release
          - validations.priority_15
        distinguishing_aspect: |
          retention_locked is a two-branch disjunction, and the same asset walks the
          whole lattice: false on create, true from the open-request branch, still true
          with two referencing requests and one of them excluded, false once the last
          reference is excluded, true again from the hold branch, false after the release,
          and only then purgeable. The purge refusal even changes code between the two
          branches — a record-locked asset is still SCHEDULED so priority 15 answers,
          while a hold-locked asset is SUSPENDED so priority 8 answers first.
        test_recipe:
          setup:
            - "One 30-minute recording of INC-2026-0672 whose scheduled_purge_at (2026-07-15T00:00:00Z) is already in the past at the 2026-08-01 clock, so ERR_PURGE_NOT_DUE never masks the retention checks."
            - "Two clerk-filed requests reference that one asset, and neither is ever clarified: attaching a candidate record carries no processing_status precondition, so both requests sit in INTAKE the whole way through."
            - "Only EXCLUDED rulings are used, which likewise carry no request-state guard, so the asset's reference count drops from two to one to zero without either request leaving INTAKE."
            - "One counsel places and then releases a single LITIGATION hold over the same incident number."
          setup_api_calls:
            - { call: "POST /_clock/set_current_utc", payload: { current_utc: "2026-08-01T00:00:00Z" }, as: RecordsSupervisor, as_user_id: "supv-1" }
            - { call: "POST /records/staff", payload: { full_name: "Dana Counsel", role_type: "COUNSEL", redaction_certification_level: 3 }, as: RecordsSupervisor, as_user_id: "supv-1", captures: { counsel_id: $.data.id } }
            - { call: "POST /records/requesters", payload: { full_name: "Pat Public", email: "pat@example.org", requester_type: "GENERAL_PUBLIC" }, as: RecordsClerk, as_user_id: "clerk-1", captures: { requester_id: $.data.id } }
            - { call: "POST /records/video-assets", payload: { incident_number: "INC-2026-0672", device_serial: "AXON-0672", officer_badge: "B-1170", recorded_start_at: "2026-01-10T09:00:00Z", duration_ms: 1800000, classification: "ROUTINE", retention_category: "NON_EVIDENTIARY_180D", scheduled_purge_at: "2026-07-15T00:00:00Z" }, as: RecordsClerk, as_user_id: "clerk-1", captures: { asset_id: $.data.id, locked_at_create: $.data.retention_locked } }
            - { call: "POST /records/requests", payload: { requester_id: "${requester_id}", received_at: "2026-08-01T00:00:00Z", subject_incident_number: "INC-2026-0672", requested_date_from: "2026-01-10T00:00:00Z", requested_date_to: "2026-01-11T00:00:00Z", scope_narrative: "The traffic stop recording" }, as: RecordsClerk, as_user_id: "clerk-1", captures: { req_one_id: $.data.id } }
            - { call: "POST /records/requests", payload: { requester_id: "${requester_id}", received_at: "2026-08-01T00:00:00Z", subject_incident_number: "INC-2026-0672", requested_date_from: "2026-01-10T00:00:00Z", requested_date_to: "2026-01-11T00:00:00Z", scope_narrative: "A second filing on the same stop" }, as: RecordsClerk, as_user_id: "clerk-1", captures: { req_two_id: $.data.id } }
          trigger:
            - { call: "POST /records/requests/${req_one_id}/responsive-records", payload: { video_asset_id: "${asset_id}" }, as: RecordsClerk, as_user_id: "clerk-1", captures: { rec_one_id: $.data.id } }
            - { call: "POST /records/video-assets/${asset_id}/purge", payload: { destruction_note: "Attempt while a candidate record still points at it" }, as: RecordsSupervisor, as_user_id: "supv-1", captures: { e_record_lock: $.data.error_id } }
            - { call: "POST /records/requests/${req_two_id}/responsive-records", payload: { video_asset_id: "${asset_id}" }, as: RecordsClerk, as_user_id: "clerk-1", captures: { rec_two_id: $.data.id } }
            - { call: "POST /records/responsive-records/${rec_one_id}/inclusion", payload: { inclusion_status: "EXCLUDED" }, as: RecordsClerk, as_user_id: "clerk-1" }
            - { call: "POST /records/responsive-records/${rec_two_id}/inclusion", payload: { inclusion_status: "EXCLUDED" }, as: RecordsClerk, as_user_id: "clerk-1", captures: { locked_after_last_exclusion: $.data.id } }
            - { call: "POST /records/litigation-holds", payload: { matter_number: "LIT-2026-0072", scope_incident_number: "INC-2026-0672", hold_type: "LITIGATION" }, as: LegalCounsel, as_user_id: "${counsel_id}", captures: { hold_id: $.data.id } }
            - { call: "POST /records/video-assets/${asset_id}/purge", payload: { destruction_note: "Attempt while the hold branch is what locks it" }, as: RecordsSupervisor, as_user_id: "supv-1", captures: { e_hold_lock: $.data.error_id } }
            - { call: "POST /records/litigation-holds/${hold_id}/release", payload: { release_note: "Matter closed" }, as: LegalCounsel, as_user_id: "${counsel_id}" }
            - { call: "POST /records/video-assets/${asset_id}/purge", payload: { destruction_note: "Retention schedule executed" }, as: RecordsSupervisor, as_user_id: "supv-1" }
          assert:
            - "${locked_at_create} == false — on create there is neither a hold nor a referencing record, and disposition_state == SCHEDULED with suspended_by_hold_id == null"
            - "after the first attachment VideoAsset.${asset_id}.retention_locked == true while disposition_state is still SCHEDULED — the record branch locks without suspending"
            - "second call: HTTP 409 and ${e_record_lock} == ERR_RETENTION_HOLD_ACTIVE, priority 15, even though the purge date passed two weeks ago"
            - "after the second attachment retention_locked is still true and PublicRecordsRequest.${req_one_id}.responsive_record_count == 1 and PublicRecordsRequest.${req_two_id}.responsive_record_count == 1"
            - "after the first EXCLUDED ruling retention_locked is STILL true — the other request's CANDIDATE record keeps the disjunction satisfied — and ${req_one_id}.responsive_record_count == 0"
            - "after the second EXCLUDED ruling (id ${locked_after_last_exclusion}) retention_locked flips to false, both responsive_record_counts are 0 and disposition_state is still SCHEDULED"
            - "after the hold is placed: retention_locked == true, disposition_state == SUSPENDED, suspended_by_hold_id == ${hold_id}, and LitigationHold.${hold_id}.suspended_asset_count == 1 with status ACTIVE"
            - "seventh call: HTTP 409 and ${e_hold_lock} == ERR_ASSET_STATE_INVALID — a SUSPENDED asset fails the priority 8 state check before priority 15 is ever consulted, so the very same request that answered ERR_RETENTION_HOLD_ACTIVE earlier now answers a different code"
            - "after the release: LitigationHold.${hold_id} status == RELEASED, released_at == 2026-08-01T00:00:00Z, suspended_asset_count == 0; the asset is back to disposition_state SCHEDULED, suspended_by_hold_id == null and retention_locked == false"
            - "final call: HTTP 200, disposition_state == PURGED, retention_locked == false, and GET /records/video-assets?disposition_state=PURGED returns total_count == 1 holding only ${asset_id}"
      - name: withdrawing_a_claim_stales_the_quote_and_the_two_bases_reconverge
        claim_type: dual_variant_calculation
        grounds:
          - calculations.fee_estimate_total.variants
          - calculations.record_redaction_burden.variants
          - state_machines.FeeEstimate
          - entities.PublicRecordsRequest.estimated_total_cents
          - validations.priority_19
        distinguishing_aspect: |
          This is the variant-switch reconciliation rather than the same-data divergence: a
          PRESUMPTIVE quote is issued while one MEDICAL claim is ASSERTED, the claim is
          withdrawn, and the withdrawal drops the request's mirrored estimated_total_cents to
          0 because staleness leaves NO ACTIVE estimate at all while the STALE row keeps its
          own 3150. The re-quote on the ADJUDICATED basis prices 1050, exactly 2100 less (the
          30 withdrawn minutes at the hourly rate), and a third quote on the PRESUMPTIVE
          basis now returns the SAME 1050 — with nothing ASSERTED the two variants coincide,
          so basis alone can never be used to explain a difference.
        test_recipe:
          setup:
            - "One 60-minute ROUTINE recording of INC-2026-0673 on a clerk-filed request, ruled RESPONSIVE: estimated_review_minutes 60, baseline burden 15."
            - "Counsel A asserts one MEDICAL PARTIAL_REDACT claim worth ceil(60 * 0.50) = 30 minutes, so presumptive burden is 45 and adjudicated burden is 15."
            - "Counsel B does the adjudication because priority 10 forbids adjudicating one's own claim."
            - "DIGITAL_DOWNLOAD media keeps the media component at 0 cents throughout, so every delta is pure labour, and the requester's fee_waiver_pct is 0.00 with every subtotal inside the first public-interest tier."
          setup_api_calls:
            - { call: "POST /_clock/set_current_utc", payload: { current_utc: "2026-08-01T00:00:00Z" }, as: RecordsSupervisor, as_user_id: "supv-1" }
            - { call: "POST /records/staff", payload: { full_name: "Counsel A", role_type: "COUNSEL", redaction_certification_level: 3 }, as: RecordsSupervisor, as_user_id: "supv-1", captures: { counsel_a: $.data.id } }
            - { call: "POST /records/staff", payload: { full_name: "Counsel B", role_type: "COUNSEL", redaction_certification_level: 3 }, as: RecordsSupervisor, as_user_id: "supv-1", captures: { counsel_b: $.data.id } }
            - { call: "POST /records/requesters", payload: { full_name: "Pat Public", email: "pat@example.org", requester_type: "GENERAL_PUBLIC" }, as: RecordsClerk, as_user_id: "clerk-1", captures: { requester_id: $.data.id } }
            - { call: "POST /records/video-assets", payload: { incident_number: "INC-2026-0673", device_serial: "AXON-0673", officer_badge: "B-1171", recorded_start_at: "2026-06-26T14:00:00Z", duration_ms: 3600000, classification: "ROUTINE", retention_category: "INVESTIGATIVE_3Y", scheduled_purge_at: "2029-06-26T00:00:00Z" }, as: RecordsClerk, as_user_id: "clerk-1", captures: { asset_id: $.data.id } }
            - { call: "POST /records/requests", payload: { requester_id: "${requester_id}", received_at: "2026-08-01T00:00:00Z", subject_incident_number: "INC-2026-0673", requested_date_from: "2026-06-26T00:00:00Z", requested_date_to: "2026-06-27T00:00:00Z", scope_narrative: "The hour of BWC video" }, as: RecordsClerk, as_user_id: "clerk-1", captures: { req_id: $.data.id, v_intake: $.data.version } }
            - { call: "POST /records/requests/${req_id}/scope-clarification", payload: { scope_narrative: "The single hour", requested_date_from: "2026-06-26T14:00:00Z", requested_date_to: "2026-06-26T15:00:00Z", expected_request_version: "${v_intake}" }, as: RecordsClerk, as_user_id: "clerk-1" }
            - { call: "POST /records/requests/${req_id}/responsive-records", payload: { video_asset_id: "${asset_id}" }, as: RecordsClerk, as_user_id: "clerk-1", captures: { rec_id: $.data.id } }
            - { call: "POST /records/responsive-records/${rec_id}/inclusion", payload: { inclusion_status: "RESPONSIVE" }, as: RecordsClerk, as_user_id: "clerk-1" }
            - { call: "POST /records/responsive-records/${rec_id}/exemption-claims", payload: { exemption_code: "MEDICAL", statutory_citation: "456.057(7)", asserted_scope: "PARTIAL_REDACT" }, as: LegalCounsel, as_user_id: "${counsel_a}", captures: { claim_id: $.data.id } }
            - { call: "GET /records/requests/${req_id}", as: RecordsClerk, as_user_id: "clerk-1", captures: { v_pre: $.data.version } }
          trigger:
            - { call: "POST /records/requests/${req_id}/fee-estimates", payload: { basis: "PRESUMPTIVE", media_type: "DIGITAL_DOWNLOAD", expected_request_version: "${v_pre}" }, as: RecordsClerk, as_user_id: "clerk-1", captures: { est_one: $.data.id } }
            - { call: "POST /records/exemption-claims/${claim_id}/adjudication", payload: { disposition: "WITHDRAWN", adjudication_note: "Medical material is not in frame after all" }, as: LegalCounsel, as_user_id: "${counsel_b}" }
            - { call: "GET /records/requests/${req_id}", as: RecordsClerk, as_user_id: "clerk-1", captures: { v_mid: $.data.version, mirrored_after_stale: $.data.estimated_total_cents } }
            - { call: "POST /records/requests/${req_id}/fee-estimates", payload: { basis: "ADJUDICATED", media_type: "DIGITAL_DOWNLOAD", expected_request_version: "${v_mid}" }, as: RecordsClerk, as_user_id: "clerk-1", captures: { est_two: $.data.id } }
            - { call: "GET /records/requests/${req_id}", as: RecordsClerk, as_user_id: "clerk-1", captures: { v_late: $.data.version } }
            - { call: "POST /records/requests/${req_id}/fee-estimates", payload: { basis: "PRESUMPTIVE", media_type: "DIGITAL_DOWNLOAD", expected_request_version: "${v_late}" }, as: RecordsClerk, as_user_id: "clerk-1", captures: { est_three: $.data.id } }
          assert:
            - "before the first estimate ResponsiveRecord.${rec_id}: estimated_review_minutes == 60, presumptive_burden_minutes == 45, adjudicated_burden_minutes == 15, release_posture == RESTRICTED"
            - "FeeEstimate.${est_one}: sequence_number == 1, status ACTIVE, basis PRESUMPTIVE, projected_review_minutes == 60, projected_burden_minutes == 45, billable_minutes == 45, estimated_labor_cents == 3150, media_production_cents == 0, subtotal_cents == 3150, effective_waiver_pct == 0.00, estimated_total_cents == 3150, deposit_required_cents == 0"
            - "PublicRecordsRequest.${req_id} after the first estimate: fee_status == ESTIMATED, estimated_total_cents == 3150"
            - "after the withdrawal ExemptionClaim.${claim_id}.status == WITHDRAWN with adjudicated_by_staff_id == ${counsel_b}; ResponsiveRecord.${rec_id}.presumptive_burden_minutes == 15 and adjudicated_burden_minutes == 15 and release_posture == OPEN; processing_status == RELEASE_READY"
            - "FeeEstimate.${est_one}.status == STALE and its own estimated_total_cents is STILL 3150 — a stale quote is frozen, not recomputed"
            - "${mirrored_after_stale} == 0 — with no ACTIVE estimate the request's mirrored estimated_total_cents and deposit_required_cents both read 0, while fee_status stays ESTIMATED"
            - "FeeEstimate.${est_two}: sequence_number == 2, status ACTIVE, basis ADJUDICATED, projected_burden_minutes == 15, billable_minutes == 15, estimated_labor_cents == 1050, subtotal_cents == 1050, estimated_total_cents == 1050, deposit_required_cents == 0; FeeEstimate.${est_one}.status is now SUPERSEDED"
            - "the switch delta is exactly 3150 - 1050 == 2100 cents, the 30 withdrawn minutes at HOURLY_RATE_CENTS, and PublicRecordsRequest.${req_id}.estimated_total_cents == 1050 again"
            - "FeeEstimate.${est_three}: sequence_number == 3, status ACTIVE, basis PRESUMPTIVE, projected_burden_minutes == 15 and estimated_total_cents == 1050 — identical to the ADJUDICATED quote because no claim is ASSERTED any more; FeeEstimate.${est_two}.status == SUPERSEDED"
            - "GET /records/requests/${req_id}/fee-estimates returns total_count == 3 ordered by sequence_number 1, 2, 3 with statuses SUPERSEDED, SUPERSEDED, ACTIVE, and ${v_late} is exactly one greater than ${v_mid}"
      - name: sustained_full_withhold_chain_runs_four_levels_in_order
        claim_type: cascading_side_effects
        grounds:
          - state_machines.ResponsiveRecord.RESPONSIVE_to_WITHHELD_IN_FULL
          - state_machines.RedactionTask.to_CANCELLED
          - calculations.record_release_posture
          - entities.PublicRecordsRequest.billable_labor_minutes
        distinguishing_aspect: |
          End-to-end verification of the deepest chain in the scaffold — one adjudication
          drives claim -> record posture -> task cancellation -> request minute total — plus
          the ordering sensitivity that the posture flip must precede the cancellation.
        excluded_because:
          difficulty_instance: sustained_full_withhold_cascade_depth_four
          rationale: |
            §1.8 already walks this exact four-level chain end-to-end with the intermediate
            state asserted at every level and the ordering pinned, and it also covers the
            partial-failure face (a task that is already APPROVED is left untouched). A §1.9
            copy would only re-run the same adjudication against the same task set.
      - name: releasing_one_of_two_holds_repoints_instead_of_freeing
        claim_type: cascading_side_effects
        grounds:
          - state_machines.VideoAsset.SUSPENDED_to_SCHEDULED
          - entities.LitigationHold.suspended_asset_count
          - entities.VideoAsset.suspended_by_hold_id
        distinguishing_aspect: |
          The retention cascade's ordering trap: with two ACTIVE holds over one incident,
          releasing the earlier hold must repoint suspended_by_hold_id at the survivor and
          keep the asset SUSPENDED rather than returning it to SCHEDULED.
        excluded_because:
          difficulty_instance: litigation_hold_suspension_cascade_depth_three
          rationale: |
            §1.8 covers the multi-hold repointing cascade, including the per-hold
            suspended_asset_count bookkeeping on both the released and the surviving hold.
            The §1.9 derived-field instance above deliberately uses a single hold so that it
            tests the retention_locked disjunction rather than re-testing the cascade.

  # ===========================================================================
  # Section 9 — Consistency model (§1.0 consistency_model: immediate). Nothing is
  # denormalised lazily: the response body of the write that caused a change already
  # carries every derived field, and an immediate re-read agrees with it.
  # ===========================================================================
  - section: consistency_model
    instances:
      - name: every_derived_field_is_already_correct_in_the_causing_response
        claim_type: immediate
        grounds:
          - complexity_profile.consistency_model
          - endpoints.POST_/records/requests/{id}/release-packages
          - endpoints.POST_/records/requests/{id}/invoice
          - entities.PublicRecordsRequest.billable_labor_minutes
          - entities.VideoAsset.retention_locked
        distinguishing_aspect: |
          One write touches five entities at once — package, record, request money and
          minutes, asset retention — and the claim is that the POST response body itself
          is already authoritative: a GET issued immediately afterwards, with no other
          write in between, returns byte-identical values for every field the write
          derived. No field is allowed to settle one call later.
        test_recipe:
          setup:
            - "One 60-minute ROUTINE recording of INC-2026-0674 on a clerk-filed request, ruled RESPONSIVE, with one 20-minute FACE redaction task carried through QA to APPROVED so the record is RELEASE_READY."
            - "The technician holds certification level 1 and the reviewer level 2, which satisfies certification_requirement for a FACE target with no linked claim."
            - "No exemption claim and no depicted individual exists, so neither priority 13 nor priority 14 interferes; DIGITAL_DOWNLOAD keeps media at 0 cents."
            - "An ADJUDICATED estimate is issued while the request is RELEASE_READY (review 60 plus baseline burden 15 minus the 60-minute allowance = 15 billable = 1050 cents, deposit 0) purely to move fee_status off NOT_ASSESSED, which the DEPOSIT_PAID -> INVOICED precondition set excludes."
            - "The release and the invoice are each followed immediately by reads of the request, the record and the asset, with no intervening write."
          setup_api_calls:
            - { call: "POST /_clock/set_current_utc", payload: { current_utc: "2026-08-01T00:00:00Z" }, as: RecordsSupervisor, as_user_id: "supv-1" }
            - { call: "POST /records/staff", payload: { full_name: "Tia Tech", role_type: "TECHNICIAN", redaction_certification_level: 1 }, as: RecordsSupervisor, as_user_id: "supv-1", captures: { tech_id: $.data.id } }
            - { call: "POST /records/staff", payload: { full_name: "Ravi Review", role_type: "REVIEWER", redaction_certification_level: 2 }, as: RecordsSupervisor, as_user_id: "supv-1", captures: { reviewer_id: $.data.id } }
            - { call: "POST /records/requesters", payload: { full_name: "Pat Public", email: "pat@example.org", requester_type: "GENERAL_PUBLIC" }, as: RecordsClerk, as_user_id: "clerk-1", captures: { requester_id: $.data.id } }
            - { call: "POST /records/video-assets", payload: { incident_number: "INC-2026-0674", device_serial: "AXON-0674", officer_badge: "B-1172", recorded_start_at: "2026-06-27T08:00:00Z", duration_ms: 3600000, classification: "ROUTINE", retention_category: "INVESTIGATIVE_3Y", scheduled_purge_at: "2029-06-27T00:00:00Z" }, as: RecordsClerk, as_user_id: "clerk-1", captures: { asset_id: $.data.id } }
            - { call: "POST /records/requests", payload: { requester_id: "${requester_id}", received_at: "2026-08-01T00:00:00Z", subject_incident_number: "INC-2026-0674", requested_date_from: "2026-06-27T00:00:00Z", requested_date_to: "2026-06-28T00:00:00Z", scope_narrative: "One hour of BWC video" }, as: RecordsClerk, as_user_id: "clerk-1", captures: { req_id: $.data.id, v_intake: $.data.version } }
            - { call: "POST /records/requests/${req_id}/scope-clarification", payload: { scope_narrative: "The single hour", requested_date_from: "2026-06-27T08:00:00Z", requested_date_to: "2026-06-27T09:00:00Z", expected_request_version: "${v_intake}" }, as: RecordsClerk, as_user_id: "clerk-1" }
            - { call: "POST /records/requests/${req_id}/responsive-records", payload: { video_asset_id: "${asset_id}" }, as: RecordsClerk, as_user_id: "clerk-1", captures: { rec_id: $.data.id } }
            - { call: "POST /records/responsive-records/${rec_id}/inclusion", payload: { inclusion_status: "RESPONSIVE" }, as: RecordsClerk, as_user_id: "clerk-1" }
            - { call: "POST /records/responsive-records/${rec_id}/redaction-tasks", payload: { target_type: "FACE", clip_start_ms: 0, clip_end_ms: 1200000, assigned_technician_id: "${tech_id}" }, as: RedactionTechnician, as_user_id: "${tech_id}", captures: { task_id: $.data.id } }
            - { call: "POST /records/redaction-tasks/${task_id}/submit-qa", payload: { qa_reviewer_id: "${reviewer_id}", qa_window_start_at: "2026-08-03T09:00:00Z", qa_window_end_at: "2026-08-03T09:30:00Z", logged_labor_minutes: 20 }, as: RedactionTechnician, as_user_id: "${tech_id}" }
            - { call: "POST /records/redaction-tasks/${task_id}/qa-outcome", payload: { outcome: "PASS" }, as: QualityReviewer, as_user_id: "${reviewer_id}" }
            - { call: "GET /records/requests/${req_id}", as: RecordsClerk, as_user_id: "clerk-1", captures: { v_pre_est: $.data.version } }
            - { call: "POST /records/requests/${req_id}/fee-estimates", payload: { basis: "ADJUDICATED", media_type: "DIGITAL_DOWNLOAD", expected_request_version: "${v_pre_est}" }, as: RecordsClerk, as_user_id: "clerk-1", captures: { est_id: $.data.id } }
          trigger:
            - { call: "POST /records/requests/${req_id}/release-packages", payload: { media_type: "DIGITAL_DOWNLOAD" }, as: RecordsClerk, as_user_id: "clerk-1", captures: { pkg_id: $.data.id } }
            - { call: "GET /records/requests/${req_id}", as: RecordsClerk, as_user_id: "clerk-1", captures: { v_after_release: $.data.version } }
            - { call: "GET /records/responsive-records/${rec_id}", as: RecordsClerk, as_user_id: "clerk-1" }
            - { call: "GET /records/video-assets/${asset_id}", as: RecordsClerk, as_user_id: "clerk-1" }
            - { call: "POST /records/requests/${req_id}/invoice", payload: {}, as: RecordsSupervisor, as_user_id: "supv-1" }
            - { call: "GET /records/requests/${req_id}", as: RecordsClerk, as_user_id: "clerk-1" }
            - { call: "GET /records/fee-ledger-entries?request_id=${req_id}", as: RecordsClerk, as_user_id: "clerk-1" }
          assert:
            - "the release response body ALREADY carries the derived package figures: ReleasePackage.${pkg_id}.included_record_count == 1, produced_minutes == 60, disc_count == 0, production_cost_cents == 0, package_kind == FINAL (computed, never supplied — the endpoint's only input is media_type)"
            - "the request read immediately after the release shows processing_status == RELEASED and billable_labor_minutes == 20 — the same values the release response reported, not values that appear only on the second read"
            - "the record read immediately after the release shows inclusion_status == RELEASED and release_posture == OPEN"
            - "the asset read immediately after the release shows retention_locked == false: the request left the open set in the very same call that released it, with no lag"
            - "immediately before the invoice FeeEstimate.${est_id}.status == ACTIVE with estimated_total_cents == 1050 and fee_status == ESTIMATED — the estimate is a projection and the invoice below does not reuse it"
            - "the invoice response body ALREADY carries invoiced_total_cents == 1400 (20 minutes at 4200 cents an hour), review_component 0 because 60 released minutes exactly consume the free allowance, media 0, and fee_status == INVOICED"
            - "the request read immediately after the invoice repeats invoiced_total_cents == 1400, fee_recognized_cents == 1400, deposit_balance_cents == -1400 and version exactly one greater than ${v_after_release}"
            - "the ledger read returns total_count == 1: a single LABOR_CHARGE of -1400 with source_kind INVOICE, written by the invoice call itself — no second call is needed to materialise it"
            - "no field anywhere in this recipe differs between the write response and the immediately following read; there is no denormalisation lag to observe"
