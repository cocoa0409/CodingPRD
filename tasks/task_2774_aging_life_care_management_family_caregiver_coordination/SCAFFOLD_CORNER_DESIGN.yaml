# =============================================================================
# 1.9 Scaffold Corner Design (Breadth Index)
# Task 2774 — Aging Life Care Management & Family Caregiver Coordination
# Sections and claim_type values are taken verbatim from the scaffold
# generator's references/claim-extraction-guide.md; no categories invented.
# Corners already asserted by SCAFFOLD_DIFFICULTY_DESIGN.yaml appear as
# excluded_because stubs with no test_recipe.
# The logical clock's startup default is 2026-08-01T00:00:00Z.
# =============================================================================
scaffold_corner_design:

  # ===========================================================================
  - section: entities
    instances:

      - name: create_client_returns_envelope_and_every_declared_field
        claim_type: creation
        grounds:
          - response_envelope.success
          - entities.Client
          - endpoints[POST /care/clients]
        distinguishing_aspect: "POST /care/clients with all six inputs returns 201 inside the fixed meta/response_type/data envelope with status PROSPECT, every computed money and coverage field at 0, and version 1."
        test_recipe:
          setup:
            - "Empty database; logical clock pinned to 2026-08-01T00:00:00Z."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-01T00:00:00Z" }
              as: PracticeAdmin
          trigger:
            - call: "POST /care/clients"
              payload: { full_name: "Alma Whitcombe", residence_setting: "ASSISTED_LIVING", billing_increment_min: 30, travel_billing_pct: 40, retainer_floor_cents: 100000, authorized_concurrent_caregivers: 3 }
              as: PracticeAdmin
              captures: { cli: $.data.id, cli_v: $.data.version }
          assert:
            - "HTTP 201; the body carries meta.api_request_id, meta.api_request_timestamp, response_type == \"object\" and a data object"
            - "data.full_name == \"Alma Whitcombe\", data.residence_setting == \"ASSISTED_LIVING\", data.billing_increment_min == 30, data.travel_billing_pct == 40, data.retainer_floor_cents == 100000, data.authorized_concurrent_caregivers == 3"
            - "data.status == \"PROSPECT\", data.capacity_status == \"PRESUMED_CAPABLE\", data.capacity_basis == null"
            - "data.risk_posture == \"ROUTINE\", data.acuity_score == 0, data.protective_escalation_status == \"NONE\""
            - "data.retainer_deposits_total_cents == 0, data.retainer_balance_cents == 0, data.unbilled_accrual_cents == 0, data.authorized_coverage_hours == 0"
            - "data.id, data.created_at and data.updated_at are non-null and data.version == 1"

      - name: create_client_applies_declared_defaults_when_optionals_omitted
        claim_type: defaults
        grounds:
          - entities.Client.fields.billing_increment_min
          - entities.Client.fields.travel_billing_pct
          - entities.Client.fields.retainer_floor_cents
          - entities.Client.fields.authorized_concurrent_caregivers
        distinguishing_aspect: "Omitting all four optional inputs yields exactly the declared defaults 15 / 50 / 50000 / 2 rather than nulls or zeroes."
        test_recipe:
          setup:
            - "Empty database; logical clock pinned to 2026-08-01T00:00:00Z."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-01T00:00:00Z" }
              as: PracticeAdmin
          trigger:
            - call: "POST /care/clients"
              payload: { full_name: "Bruno Kestrel", residence_setting: "PRIVATE_HOME" }
              as: PracticeAdmin
              captures: { cli: $.data.id }
          assert:
            - "data.billing_increment_min == 15"
            - "data.travel_billing_pct == 50"
            - "data.retainer_floor_cents == 50000"
            - "data.authorized_concurrent_caregivers == 2"
            - "GET /care/clients/${cli} returns the same four values (defaults are persisted, not response-only)"

      - name: get_client_by_id_returns_the_stored_row
        claim_type: retrieval
        grounds:
          - endpoints[GET /care/clients/{clientId}]
          - entities.Client
        distinguishing_aspect: "GET /care/clients/{clientId} returns the row created by POST /care/clients with an identical id and unchanged version."
        test_recipe:
          setup:
            - "One Client created at clock 2026-08-01T00:00:00Z."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-01T00:00:00Z" }
              as: PracticeAdmin
            - call: "POST /care/clients"
              payload: { full_name: "Cordelia Nkemdi", residence_setting: "SKILLED_NURSING" }
              as: PracticeAdmin
              captures: { cli: $.data.id, cli_v: $.data.version }
          trigger:
            - call: "GET /care/clients/${cli}"
              as: CareManager
              captures: { read_id: $.data.id, read_v: $.data.version }
          assert:
            - "HTTP 200 and data.id == ${cli}"
            - "data.version == ${cli_v} — a read never bumps version"
            - "data.full_name == \"Cordelia Nkemdi\" and data.residence_setting == \"SKILLED_NURSING\""

      - name: list_clients_pagination_reports_total_count_and_has_more
        claim_type: listing
        grounds:
          - endpoints[GET /care/clients]
          - response_envelope.pagination_fields
          - response_envelope.pagination_defaults
        distinguishing_aspect: "With three clients stored, limit=2&offset=0 returns 2 rows with total_count 3 and has_more true, and offset=2 returns the last row with has_more false."
        test_recipe:
          setup:
            - "Three Clients created in order: Dorothea, Emeka, Faye."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-01T00:00:00Z" }
              as: PracticeAdmin
            - call: "POST /care/clients"
              payload: { full_name: "Dorothea Pike", residence_setting: "PRIVATE_HOME" }
              as: PracticeAdmin
              captures: { cli_1: $.data.id }
            - call: "POST /care/clients"
              payload: { full_name: "Emeka Balogun", residence_setting: "ASSISTED_LIVING" }
              as: PracticeAdmin
              captures: { cli_2: $.data.id }
            - call: "POST /care/clients"
              payload: { full_name: "Faye Lindqvist", residence_setting: "HOSPITAL" }
              as: PracticeAdmin
              captures: { cli_3: $.data.id }
          trigger:
            - call: "GET /care/clients"
              payload: { limit: 2, offset: 0 }
              as: PracticeAdmin
              captures: { first_id: "$.data[0].id" }
            - call: "GET /care/clients"
              payload: { limit: 2, offset: 2 }
              as: PracticeAdmin
              captures: { last_id: "$.data[0].id" }
          assert:
            - "The first call returns response_type == \"array\" with exactly 2 elements, total_count == 3, has_more == true, limit == 2, offset == 0"
            - "The second call returns exactly 1 element, total_count == 3, has_more == false, offset == 2"
            - "The two pages are disjoint: ${first_id} != ${last_id}"
            - "GET /care/clients with no query parameters returns limit == 10 and offset == 0 (declared pagination defaults) with all 3 rows"

      - name: get_client_with_unknown_id_returns_client_not_found
        claim_type: not_found
        grounds:
          - validations[priority=10]
          - errors[ERR_CLIENT_NOT_FOUND]
        distinguishing_aspect: "Addressing a syntactically valid but unstored clientId yields ERR_CLIENT_NOT_FOUND with HTTP 404, not an empty 200."
        test_recipe:
          setup:
            - "Empty database apart from the logical clock."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-01T00:00:00Z" }
              as: PracticeAdmin
          trigger:
            - call: "GET /care/clients/00000000-0000-4000-8000-000000000000"
              as: PracticeAdmin
              captures: { err: $.data.error_id }
          assert:
            - "HTTP 404 with data.error_id == \"ERR_CLIENT_NOT_FOUND\""
            - "The body still carries the standard envelope with response_type == \"error\" and a non-empty data.message"

      - name: create_assessment_missing_required_domain_scores_returns_invalid_request
        claim_type: required_fields
        grounds:
          - validations[priority=4]
          - errors[ERR_INVALID_REQUEST]
          - endpoints[POST /care/assessments]
        distinguishing_aspect: "Omitting the required domain_scores object from POST /care/assessments returns ERR_INVALID_REQUEST (400) and persists no Assessment."
        test_recipe:
          setup:
            - "One CareManager and one Client."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-01T00:00:00Z" }
              as: PracticeAdmin
            - call: "POST /care/care-managers"
              payload: { full_name: "Dana Reyes", credential: "CMC", hourly_rate_cents: 22500 }
              as: PracticeAdmin
              captures: { cm_dana: $.data.id }
            - call: "POST /care/clients"
              payload: { full_name: "Gustav Ahlberg", residence_setting: "PRIVATE_HOME" }
              as: PracticeAdmin
              captures: { cli: $.data.id }
          trigger:
            - call: "POST /care/assessments"
              payload: { client_id: "${cli}", care_manager_id: "${cm_dana}" }
              as: CareManager
              as_user_id: "${cm_dana}"
              captures: { err: $.data.error_id }
          assert:
            - "HTTP 400 with data.error_id == \"ERR_INVALID_REQUEST\""
            - "GET /care/assessments?client_id=${cli} returns 0 rows"
            - "Client.${cli}.status is still PROSPECT — the rejected creation did not fire the first-assessment auto-transition"

      - name: create_assessment_with_out_of_range_domain_score_returns_invalid_request
        claim_type: type_constraints
        grounds:
          - validations[priority=4]
          - entities.Assessment.fields.domain_scores
          - errors[ERR_INVALID_REQUEST]
        distinguishing_aspect: "A domain score of 6 is outside the declared 0..5 range, so POST /care/assessments returns ERR_INVALID_REQUEST rather than clamping the value."
        test_recipe:
          setup:
            - "One CareManager and one Client."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-01T00:00:00Z" }
              as: PracticeAdmin
            - call: "POST /care/care-managers"
              payload: { full_name: "Dana Reyes", credential: "CMC", hourly_rate_cents: 22500 }
              as: PracticeAdmin
              captures: { cm_dana: $.data.id }
            - call: "POST /care/clients"
              payload: { full_name: "Halina Duszak", residence_setting: "PRIVATE_HOME" }
              as: PracticeAdmin
              captures: { cli: $.data.id }
          trigger:
            - call: "POST /care/assessments"
              payload: { client_id: "${cli}", care_manager_id: "${cm_dana}", domain_scores: { adl: 6, cognition: 2, medical_complexity: 2, social_support: 2, safety: 2, finances: 2 } }
              as: CareManager
              as_user_id: "${cm_dana}"
              captures: { err_range: $.data.error_id }
            - call: "POST /care/assessments"
              payload: { client_id: "${cli}", care_manager_id: "${cm_dana}", domain_scores: { adl: 2, cognition: 2, medical_complexity: 2, safety: 2, finances: 2 } }
              as: CareManager
              as_user_id: "${cm_dana}"
              captures: { err_keys: $.data.error_id }
          assert:
            - "The adl=6 call returns HTTP 400 with data.error_id == \"ERR_INVALID_REQUEST\""
            - "The five-key call returns HTTP 400 with data.error_id == \"ERR_INVALID_REQUEST\" (domain_scores must carry exactly the six declared keys)"
            - "GET /care/assessments?client_id=${cli} returns 0 rows after both rejections"

      - name: create_vendor_with_invalid_vendor_type_enum_returns_invalid_request
        claim_type: type_constraints
        grounds:
          - validations[priority=4]
          - entities.Vendor.fields.vendor_type
          - errors[ERR_INVALID_REQUEST]
        distinguishing_aspect: "vendor_type accepts only HOME_CARE | MEDICAL | LEGAL | HOUSING, so \"DENTAL\" returns ERR_INVALID_REQUEST while HOUSING is accepted with standing defaulting to APPROVED."
        test_recipe:
          setup:
            - "Empty database apart from the logical clock."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-01T00:00:00Z" }
              as: PracticeAdmin
          trigger:
            - call: "POST /care/vendors"
              payload: { name: "Bayside Dental", vendor_type: "DENTAL", has_referral_relationship: false }
              as: PracticeAdmin
              captures: { err: $.data.error_id }
            - call: "POST /care/vendors"
              payload: { name: "Bayside Housing Advisors", vendor_type: "HOUSING", has_referral_relationship: false }
              as: PracticeAdmin
              captures: { vnd: $.data.id }
          assert:
            - "The DENTAL call returns HTTP 400 with data.error_id == \"ERR_INVALID_REQUEST\""
            - "The HOUSING call returns HTTP 201 with data.vendor_type == \"HOUSING\", data.standing == \"APPROVED\" and data.referral_fee_pct == 0 (declared defaults)"
            - "GET /care/vendors?vendor_type=HOUSING returns exactly 1 row, ${vnd}"

      - name: service_authorization_computed_money_fields_input_ignored
        claim_type: computed_fields
        grounds:
          - entities.ServiceAuthorization.fields.coverage_hours
          - entities.ServiceAuthorization.fields.base_cost_cents
          - entities.ServiceAuthorization.fields.coordination_fee_cents
          - calculations.service_authorization_coordination_fee
        distinguishing_aspect: "coverage_hours, base_cost_cents, coordination_fee_cents and total_projected_cost_cents are derived from coverage_start / coverage_end / concurrent_caregivers / hourly_cost_cents, so client-supplied values for them are ignored and the declared formula's literals appear instead."
        test_recipe:
          setup:
            - "CareManager Dana, Client Ines with retainer_floor_cents 0, an ACCEPTED assessment and a DRAFT care plan, vendor Northgate Home Care."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-01T00:00:00Z" }
              as: PracticeAdmin
            - call: "POST /care/care-managers"
              payload: { full_name: "Dana Reyes", credential: "CMC", hourly_rate_cents: 22500 }
              as: PracticeAdmin
              captures: { cm_dana: $.data.id }
            - call: "POST /care/care-managers"
              payload: { full_name: "Iris Vance", credential: "CCM", hourly_rate_cents: 30000, is_supervisor: true }
              as: PracticeAdmin
              captures: { cm_iris: $.data.id }
            - call: "POST /care/clients"
              payload: { full_name: "Ines Carvalho", residence_setting: "PRIVATE_HOME", retainer_floor_cents: 0 }
              as: PracticeAdmin
              captures: { cli: $.data.id }
            - call: "POST /care/vendors"
              payload: { name: "Northgate Home Care", vendor_type: "HOME_CARE", has_referral_relationship: false }
              as: PracticeAdmin
              captures: { vnd: $.data.id }
            - call: "POST /care/assessments"
              payload: { client_id: "${cli}", care_manager_id: "${cm_dana}", domain_scores: { adl: 2, cognition: 2, medical_complexity: 2, social_support: 2, safety: 2, finances: 2 } }
              as: CareManager
              as_user_id: "${cm_dana}"
              captures: { asm: $.data.id }
            - call: "PATCH /care/assessments/${asm}/state"
              payload: { to_state: "SUBMITTED" }
              as: CareManager
              as_user_id: "${cm_dana}"
            - call: "PATCH /care/assessments/${asm}/state"
              payload: { to_state: "ACCEPTED" }
              as: PracticeSupervisor
              as_user_id: "${cm_iris}"
            - call: "GET /care/clients/${cli}"
              as: CareManager
              as_user_id: "${cm_dana}"
              captures: { cli_v: $.data.version }
            - call: "POST /care/care-plans"
              payload: { client_id: "${cli}", source_assessment_id: "${asm}", expected_client_version: "${cli_v}", goals: ["Weekday day coverage"] }
              as: CareManager
              as_user_id: "${cm_dana}"
              captures: { cp: $.data.id, cp_v: $.data.version }
          trigger:
            - call: "POST /care/service-authorizations"
              payload: { care_plan_id: "${cp}", vendor_id: "${vnd}", expected_care_plan_version: "${cp_v}", coverage_start: "2026-09-07T08:00:00Z", coverage_end: "2026-09-07T18:00:00Z", concurrent_caregivers: 1, hourly_cost_cents: 4000 }
              as: CareManager
              as_user_id: "${cm_dana}"
              captures: { auth: $.data.id, hours: $.data.coverage_hours, base: $.data.base_cost_cents, fee: $.data.coordination_fee_cents, total: $.data.total_projected_cost_cents }
          assert:
            - "data.coverage_hours == 10 (10 whole hours x 1 caregiver)"
            - "data.base_cost_cents == 40000 (10 x 4000)"
            - "data.coordination_fee_cents == 3200 — tier 1 at 8% because base_cost_cents 40000 < 200000"
            - "data.total_projected_cost_cents == 43200"
            - "data.auth_status == \"PROPOSED\", data.coi_status == \"NOT_REQUIRED\", data.disclosure_text == null, data.suspension_reason == \"NONE\", data.termination_reason == \"NONE\""
            - "data.client_id == ${cli} — copied from the parent CarePlan, never taken from the request body"

      - name: time_entry_system_fields_generated_and_client_input_ignored
        claim_type: system_fields
        grounds:
          - entities.TimeEntry.fields.service_date
          - entities.TimeEntry.fields.status
          - entities.TimeEntry.fields.approved_by_care_manager_id
          - entities.TimeEntry.fields.invoice_id
        distinguishing_aspect: "id, created_at, updated_at, version, service_date, status, approved_by_care_manager_id and invoice_id are all system- or computed-sourced on POST /care/time-entries, so the response carries the derived values regardless of the request body."
        test_recipe:
          setup:
            - "CareManager Dana (hourly_rate_cents 22500) and Client Jorah with billing_increment_min 15."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-20T00:00:00Z" }
              as: PracticeAdmin
            - call: "POST /care/care-managers"
              payload: { full_name: "Dana Reyes", credential: "CMC", hourly_rate_cents: 22500 }
              as: PracticeAdmin
              captures: { cm_dana: $.data.id }
            - call: "POST /care/clients"
              payload: { full_name: "Jorah Vestergaard", residence_setting: "PRIVATE_HOME", billing_increment_min: 15 }
              as: PracticeAdmin
              captures: { cli: $.data.id }
          trigger:
            - call: "POST /care/time-entries"
              payload: { client_id: "${cli}", care_manager_id: "${cm_dana}", service_type: "CARE_COORDINATION", start_at: "2026-08-20T09:05:00Z", end_at: "2026-08-20T09:52:00Z", service_location_id: "CLIENT_HOME", note: "Pharmacy reconciliation" }
              as: CareManager
              as_user_id: "${cm_dana}"
              captures: { te: $.data.id, sd: $.data.service_date, raw: $.data.raw_minutes, rounded: $.data.rounded_minutes }
          assert:
            - "HTTP 201 with data.status == \"DRAFT\" (the machine's declared initial_state), data.approved_by_care_manager_id == null and data.invoice_id == null"
            - "data.service_date == \"2026-08-20\" — derived from start_at, not supplied"
            - "data.raw_minutes == 47 and data.rounded_minutes == 60 (47 rounded up to the client's 15-minute increment)"
            - "data.rate_multiplier == 1.0, data.after_hours_factor == 1.00 (UTC hour 9 is inside business hours)"
            - "data.billable_amount_cents == 22500"
            - "data.id, data.created_at, data.updated_at are system-generated and data.version == 1"
            - "Client.${cli}.unbilled_accrual_cents == 22500 immediately after the create"

      - name: create_family_contact_for_unknown_client_returns_client_not_found
        claim_type: parent_relationships
        grounds:
          - validations[priority=10]
          - errors[ERR_CLIENT_NOT_FOUND]
          - entities.FamilyContact.fields.client_id
        distinguishing_aspect: "FamilyContact.client_id is an FK to Client.id, so POST /care/family-contacts naming an unstored client returns ERR_CLIENT_NOT_FOUND (404) and stores nothing."
        test_recipe:
          setup:
            - "Empty database apart from the logical clock."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-01T00:00:00Z" }
              as: PracticeAdmin
          trigger:
            - call: "POST /care/family-contacts"
              payload: { client_id: "00000000-0000-4000-8000-0000000000ff", full_name: "Nobody Nowhere", contact_role: "INTERESTED_FAMILY" }
              as: PracticeAdmin
              captures: { err: $.data.error_id }
          assert:
            - "HTTP 404 with data.error_id == \"ERR_CLIENT_NOT_FOUND\""
            - "GET /care/family-contacts returns total_count == 0"

      - name: flat_topology_authorizing_decision_from_another_client_rejected
        claim_type: foreign_key_references_validated
        grounds:
          - validations[priority=62]
          - errors[ERR_ENTITY_RELATIONSHIP_INVALID]
          - entities.ServiceAuthorization.fields.authorizing_decision_id
          - complexity_profile.entity_topology
        distinguishing_aspect: "Under the flat topology every FK is checked for cross-reference integrity, so a RATIFIED ConferenceDecision belonging to a different client is rejected with ERR_ENTITY_RELATIONSHIP_INVALID (422) even though the decision exists and is ratified."
        test_recipe:
          setup:
            - "Two clients: Kira (with an ACTIVE care plan and vendor) and Leon (with a CONVENED conference and one RATIFIED VENDOR_ENGAGEMENT decision)."
            - "Both clients have a surrogate contact; retainer_floor_cents 0 on Kira."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-21T09:00:00Z" }
              as: PracticeAdmin
            - call: "POST /care/care-managers"
              payload: { full_name: "Dana Reyes", credential: "CMC", hourly_rate_cents: 22500 }
              as: PracticeAdmin
              captures: { cm_dana: $.data.id }
            - call: "POST /care/care-managers"
              payload: { full_name: "Iris Vance", credential: "CCM", hourly_rate_cents: 30000, is_supervisor: true }
              as: PracticeAdmin
              captures: { cm_iris: $.data.id }
            - call: "POST /care/clients"
              payload: { full_name: "Kira Amankwah", residence_setting: "PRIVATE_HOME", retainer_floor_cents: 0 }
              as: PracticeAdmin
              captures: { cli_k: $.data.id }
            - call: "POST /care/family-contacts"
              payload: { client_id: "${cli_k}", full_name: "Kwesi Amankwah", contact_role: "POA_HEALTHCARE", is_surrogate_decision_maker: true }
              as: PracticeAdmin
              captures: { fc_k: $.data.id }
            - call: "POST /care/clients"
              payload: { full_name: "Leon Marchetti", residence_setting: "ASSISTED_LIVING", retainer_floor_cents: 0 }
              as: PracticeAdmin
              captures: { cli_l: $.data.id }
            - call: "POST /care/family-contacts"
              payload: { client_id: "${cli_l}", full_name: "Livia Marchetti", contact_role: "POA_HEALTHCARE", is_surrogate_decision_maker: true }
              as: PracticeAdmin
              captures: { fc_l: $.data.id }
            - call: "POST /care/vendors"
              payload: { name: "Northgate Home Care", vendor_type: "HOME_CARE", has_referral_relationship: false }
              as: PracticeAdmin
              captures: { vnd: $.data.id }
            - call: "POST /care/family-conferences"
              payload: { client_id: "${cli_l}", scheduled_start: "2026-08-22T15:00:00Z", scheduled_end: "2026-08-22T16:00:00Z", invited_contact_ids: ["${fc_l}"] }
              as: CareManager
              as_user_id: "${cm_dana}"
              captures: { conf_l: $.data.id }
            - call: "PATCH /care/family-conferences/${conf_l}/state"
              payload: { to_state: "CONVENED", attended_contact_ids: ["${fc_l}"] }
              as: CareManager
              as_user_id: "${cm_dana}"
            - call: "POST /care/conference-decisions"
              payload: { family_conference_id: "${conf_l}", decided_by_contact_id: "${fc_l}", decision_type: "VENDOR_ENGAGEMENT", decision_text: "Engage Northgate for Leon" }
              as: CareManager
              as_user_id: "${cm_dana}"
              captures: { dec_l: $.data.id }
            - call: "PATCH /care/conference-decisions/${dec_l}/state"
              payload: { to_state: "RATIFIED" }
              as: PracticeSupervisor
              as_user_id: "${cm_iris}"
            - call: "POST /care/assessments"
              payload: { client_id: "${cli_k}", care_manager_id: "${cm_dana}", domain_scores: { adl: 2, cognition: 2, medical_complexity: 2, social_support: 2, safety: 2, finances: 2 } }
