      - name: corner_settlement_capped_by_part_aggregate_capacity
        claim_type: Violation → Error
        grounds:
          - validations[priority=75]
          - errors[ERR_AGGREGATE_LIMIT_EXHAUSTED]
          - entities.CoveragePart.aggregate_available_cents
          - endpoints[POST /inland-marine/claims/{id}/settle]
        distinguishing_aspect: |
          A fully adjusted 2900000 repair is refused on a part whose
          aggregate_available_cents is only 2000000, even though the loss is far inside
          the 20000000 per-item limit: the fiscal test is against remaining AGGREGATE
          capacity, and the refusal leaves aggregate_paid_net_cents at 0 with no
          CLAIM_SETTLEMENT ledger row.
        test_recipe:
          setup:
            - "One PUBLISHED RateRule: EXCAVATOR, T2_URBAN, age band 0-5, base_rate_bp 180, theft_hazard_grade A."
            - "One IN_FORCE Policy in T2_URBAN, 2026-08-01 to 2027-08-01, minimum_premium_cents 100000."
            - "One ACTIVE SCHEDULED_EQUIPMENT CoveragePart: valuation_basis ACV, deductible_cents 100000, per_item_limit_cents 20000000, aggregate_limit_cents 2000000."
            - "One ACTIVE EquipmentItem with insured_value_cents 8160000."
            - "One REPAIR_APPROVED Claim with settlement_amount_cents 2900000, declared by adjuster adj-1."
          setup_api_calls:
            - call: "POST /inland-marine/rate-rules"
              payload: { equipment_type: "EXCAVATOR", territory_code: "T2_URBAN", age_band_min_years: 0, age_band_max_years: 5, base_rate_bp: 180, theft_hazard_grade: "A" }
              as: Actuary
              captures: { rr: $.data.id }
            - call: "POST /inland-marine/rate-rules/${rr}/publish"
              payload: {}
              as: Actuary
            - call: "POST /inland-marine/policies"
              payload: { policyholder_name: "Thin Aggregate Excavating", territory_code: "T2_URBAN", effective_date: "2026-08-01", expiration_date: "2027-08-01", minimum_premium_cents: 100000 }
              as: Underwriter
              captures: { pol: $.data.id }
            - call: "POST /inland-marine/policies/${pol}/coverage-parts"
              payload: { part_type: "SCHEDULED_EQUIPMENT", valuation_basis: "ACV", deductible_cents: 100000, per_item_limit_cents: 20000000, aggregate_limit_cents: 2000000 }
              as: Underwriter
              captures: { cp: $.data.id }
            - call: "GET /inland-marine/policies/${pol}"
              payload: {}
              as: Underwriter
              captures: { pol_v1: $.data.version }
            - call: "POST /inland-marine/coverage-parts/${cp}/equipment-items"
              payload: { description: "Excavator", equipment_type: "EXCAVATOR", model_year: 2022, original_cost_cents: 12000000, ownership: "OWNED", expected_policy_version: "${pol_v1}" }
              as: Underwriter
              captures: { itm: $.data.id }
            - call: "POST /inland-marine/policies/${pol}/quote"
              payload: {}
              as: Underwriter
            - call: "POST /inland-marine/policies/${pol}/bind"
              payload: {}
              as: Underwriter
            - call: "POST /inland-marine/policies/${pol}/activate"
              payload: {}
              as: Underwriter
            - call: "POST /inland-marine/equipment-items/${itm}/activate"
              payload: {}
              as: Underwriter
            - call: "POST /inland-marine/policies/${pol}/claims"
              payload: { coverage_part_id: "${cp}", loss_date: "2026-09-10", loss_type: "COLLISION", equipment_item_id: "${itm}" }
              as: Underwriter
              captures: { clm: $.data.id }
            - call: "POST /inland-marine/claims/${clm}/inspect"
              payload: { repair_estimate_cents: 3000000, actual_value_at_loss_cents: 8160000 }
              as: ClaimsAdjuster
              as_user_id: "adj-1"
            - call: "POST /inland-marine/claims/${clm}/adjust"
              payload: { adjustment_basis: "REPAIR" }
              as: ClaimsAdjuster
              as_user_id: "adj-1"
          trigger:
            - call: "POST /inland-marine/claims/${clm}/settle"
              payload: {}
              as: UnderwritingManager
              as_user_id: "mgr-1"
            - call: "GET /inland-marine/claims/${clm}/settlement-worksheet"
              payload: {}
