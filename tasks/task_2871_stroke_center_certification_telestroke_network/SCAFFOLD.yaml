# ============================================================================
# PRD Benchmark Scaffold — Stroke Center Certification & Telestroke Network
# Sections §1.0 – §1.7. Difficulty design lives in SCAFFOLD_DIFFICULTY_DESIGN.yaml
# and corner design in SCAFFOLD_CORNER_DESIGN.yaml.
# ============================================================================

scenario: |
  2871. Stroke Center Certification & Telestroke Network (primary stroke center): last-known-well capture and code stroke activation with door-to-imaging and door-to-needle clocks, telestroke consult routing to on-call neurologists with video session records, thrombolytic eligibility checklist and contraindication documentation, transfer decision for thrombectomy-capable centers with drip-and-ship handoff, quality measure abstraction and certification reporting, spoke hospital agreements, credentialing by proxy and equipment readiness, protocol deviation review and case debriefs, public reporting and emergency medical services routing implications

domain_name: stroke-center-certification-telestroke-network
api_prefix: /stroke-network

complexity_profile:
  primary_archetype: compliance_audit
  secondary_archetype: workflow_orchestration
  complexity_layers:
    - selector_policy
    - optimistic_concurrency
    - dual_variant_calculation
    - cascading_side_effects
    - rate_threshold_triggers

  entity_topology: flat
  # Every entity is a peer addressed at `/stroke-network/<collection>/{id}`; all
  # relationships are explicit FK fields carried in request bodies, never in the
  # URL path. No nesting beyond action sub-paths.

  state_machine_shape: branching
  # CodeStrokeCase forks ELIGIBILITY_DETERMINED -> {THROMBOLYSIS_ADMINISTERED,
  # TRANSFER_INITIATED} and rejoins at CLOSED with divergent side-effect sets.
  # TelestrokeConsult and ProtocolDeviation are cyclic; ThrombolyticChecklist
  # carries two independent state dimensions on one row.

  relationship_patterns:
    - one_to_many          # StrokeCenter -> CodeStrokeCase, CodeStrokeCase -> QualityMeasureAbstraction
    - many_to_many         # SpokeAgreement is the hub<->spoke junction; proxy_credentials is the neurologist<->agreement junction
    - cross_aggregate      # ThrombolyticChecklist.determine mutates CodeStrokeCase; CertificationReport.decide mutates StrokeCenter
    - self_referential     # CertificationReport.superseded_by_report_id -> CertificationReport.id
    - polymorphic: false

  role_model: segregation_of_duties
  # Two named SoD barriers: (1) a CertificationReport's decided_by_user_id MUST
  # differ from its submitted_by_user_id; (2) a QualityMeasureAbstraction's
  # attested_by_user_id MUST differ from its abstracted_by_user_id.

  consistency_model: immediate

  difficulty_level: expert_plus
  # 10 entities, 10 state machines, 13 calculations (3 of them dual-variant).
  # Density target: every case-level write touches at least two other aggregates.

response_envelope:
  success: |
    { "meta": { "api_request_id": "req_xxx", "api_request_timestamp": "ISO8601" },
      "response_type": "object" | "array", "data": {} }
  error: |
    { "meta": { ... }, "response_type": "error",
      "data": { "error_id": "ERR_XXX", "message": "..." } }
  pagination_fields: ["limit", "offset", "total_count", "has_more"]
  pagination_defaults: { limit: 10, min: 1, max: 100, offset: 0 }

# ============================================================================
# §1.1 Entity-Relationship Table
# ============================================================================

entities:

  - name: StrokeCenter
    parent: null
    common_fields: true
    fields:
      - name: name
        type: string
        source: input
        description: facility display name
        constraints: non-empty, max 120 chars
      - name: facility_type
        type: enum
        source: input
        description: role of the facility inside the network
        constraints: "one of {HUB_PRIMARY, SPOKE, THROMBECTOMY_CAPABLE}"
      - name: state_code
        type: string
        source: input
        description: two-letter licensure jurisdiction; matched against Neurologist.licensed_state_codes
        constraints: exactly 2 uppercase letters
      - name: ems_region_code
        type: string
        source: input
        description: EMS routing region the facility publishes its posture into
        constraints: non-empty, max 16 chars
      - name: certification_status
        type: enum
        source: system
        description: certification lifecycle state driven by CertificationReport decisions and manual suspension
        default: PROVISIONAL
        constraints: "one of {PROVISIONAL, CERTIFIED, CONDITIONAL, SUSPENDED, WITHDRAWN}"
      - name: ct_scanner_ready
        type: boolean
        source: system
        description: latest CT_SCANNER readiness attestation result; true until a FAIL attestation is posted
        default: true
      - name: video_cart_ready
        type: boolean
        source: system
        description: latest VIDEO_CART readiness attestation result; true until a FAIL attestation is posted
        default: true
      - name: equipment_readiness_posture
        type: enum
        source: computed
        description: READY when both readiness flags are true, DEGRADED when exactly one is true, OFFLINE when neither is true
        default: READY
        constraints: "one of {READY, DEGRADED, OFFLINE}"
      - name: open_case_count
        type: integer
        source: computed
        description: count of CodeStrokeCase rows with center_id equal to this center and status NOT IN {CLOSED, ABORTED}, plus count of TransferDecision rows with destination_center_id equal to this center and status == ACCEPTED
        default: 0
        constraints: ">= 0"
      - name: ems_routing_posture
        type: enum
        source: computed
        description: derived EMS routing advisory recomputed by calculations.ems_routing_posture on every certification, readiness, case-count or transfer change
        default: ROUTINE
        constraints: "one of {ROUTINE, DIVERT_ADVISORY, BYPASS}"
      - name: public_dtn_compliance_pct
        type: number
        source: computed
        description: publicly reported door-to-needle compliance, recomputed by calculations.public_dtn_rollup on every CertificationReport publication; null until the first publication
        default: null
        constraints: 0.0 <= value <= 100.0, one decimal place
      - name: public_report_published_at
        type: datetime
        source: system
        description: logical-clock instant of the most recent CertificationReport publication for this center
        default: null
      - name: suspension_reason
        type: string
        source: system
        description: reason recorded by the most recent suspension; cleared to null when certification_status leaves SUSPENDED
        default: null
      - name: consecutive_denied_report_count
        type: integer
        source: system
        description: number of consecutive CertificationReport decisions of DENIED since the last decision of CERTIFIED or CONDITIONAL; drives the SUSPENDED to WITHDRAWN transition
        default: 0
        constraints: ">= 0"

  - name: SpokeAgreement
    parent: null
    common_fields: true
    fields:
      - name: hub_center_id
        type: string
        source: input
        description: "FK -> StrokeCenter.id; the HUB_PRIMARY facility that supplies telestroke coverage"
      - name: spoke_center_id
        type: string
        source: input
        description: "FK -> StrokeCenter.id; the SPOKE facility that receives telestroke coverage"
      - name: coverage_tier
        type: enum
        source: input
        description: contractual breadth of coverage; TIER_2_CONSULT_ONLY waives the board-certification requirement in the routing selector
        constraints: "one of {TIER_1_FULL, TIER_2_CONSULT_ONLY}"
      - name: max_concurrent_consults
        type: integer
        source: input
        description: aggregate ceiling on TelestrokeConsult rows on this agreement whose status IN {REQUESTED, ASSIGNED, IN_SESSION}
        constraints: ">= 1, <= 20"
      - name: effective_from
        type: datetime
        source: input
        description: inclusive start of the agreement coverage interval (ISO 8601 UTC)
      - name: effective_until
        type: datetime
        source: input
        description: exclusive end of the agreement coverage interval (ISO 8601 UTC)
      - name: status
        type: enum
        source: system
        description: agreement lifecycle state
        default: DRAFT
        constraints: "one of {DRAFT, ACTIVE, SUSPENDED, TERMINATED}"
      - name: proxy_credentials
        type: array
        source: system
        description: "credentialing-by-proxy grants; each element is an object { neurologist_id, privilege_scope, expires_at, status, granted_at } where privilege_scope IN {CONSULT_ONLY, CONSULT_AND_THROMBOLYSIS} and status IN {GRANTED, EXPIRED}"
        default: []
      - name: active_consult_count
        type: integer
        source: computed
        description: count of TelestrokeConsult rows with agreement_id equal to this agreement and status IN {REQUESTED, ASSIGNED, IN_SESSION}
        default: 0
        constraints: ">= 0"
      - name: suspension_reason
        type: string
        source: system
        description: reason recorded by the most recent suspension; cleared to null on re-activation
        default: null

  - name: Neurologist
    parent: null
    common_fields: true
    fields:
      - name: full_name
        type: string
        source: input
        description: neurologist display name
        constraints: non-empty, max 120 chars
      - name: home_center_id
        type: string
        source: input
        description: "FK -> StrokeCenter.id; the HUB_PRIMARY facility employing this neurologist; the routing selector only considers neurologists whose home_center_id equals the agreement's hub_center_id"
      - name: licensed_state_codes
        type: array
        source: input
        description: array of two-letter jurisdiction codes this neurologist is licensed in
        constraints: non-empty array of exactly-2-uppercase-letter strings
      - name: board_certified
        type: boolean
        source: input
        description: vascular-neurology board certification flag; required by the routing selector on TIER_1_FULL agreements and worth CERT_BOARD_CREDIT in the attested eligibility score
      - name: roster_rank
        type: integer
        source: input
        description: primary on-call roster ordering key; lower values are considered first by the routing selector
        constraints: ">= 1, <= 999"
      - name: concurrent_consult_limit
        type: integer
        source: input
        description: ceiling on this neurologist's TelestrokeConsult rows with status IN {ASSIGNED, IN_SESSION}
        default: 2
        constraints: ">= 1, <= 5"
      - name: on_call_state
        type: enum
        source: system
        description: availability dimension consulted by the routing selector
        default: OFF_DUTY
        constraints: "one of {OFF_DUTY, ON_CALL, IN_CONSULT, UNAVAILABLE}"
      - name: active_consult_count
        type: integer
        source: computed
        description: count of TelestrokeConsult rows with assigned_neurologist_id equal to this neurologist and status IN {ASSIGNED, IN_SESSION}
        default: 0
        constraints: ">= 0"
      - name: last_consult_completed_at
        type: datetime
        source: system
        description: logical-clock instant at which this neurologist's most recent TelestrokeConsult reached COMPLETED; anchors the NEUROLOGIST_COOLDOWN_MIN buffer checked at consult acceptance
        default: null
      - name: completed_consult_count
        type: integer
        source: system
        description: lifetime count of TelestrokeConsult rows this neurologist drove to COMPLETED
        default: 0
        constraints: ">= 0"

  - name: CodeStrokeCase
    parent: null
    common_fields: true
    fields:
      - name: center_id
        type: string
        source: input
        description: "FK -> StrokeCenter.id; the facility where the code stroke was activated"
      - name: patient_ref
        type: string
        source: input
        description: de-identified patient reference string
        constraints: non-empty, max 40 chars
      - name: door_at
        type: datetime
        source: input
        description: ED arrival instant (ISO 8601 UTC); anchors both clocks
      - name: lkw_precision
        type: enum
        source: input
        description: precision of the last-known-well capture
        constraints: "one of {EXACT, ESTIMATED, UNKNOWN_WAKE_UP}"
      - name: last_known_well_at
        type: datetime
        source: input
        description: last-known-well instant (ISO 8601 UTC); required when lkw_precision IN {EXACT, ESTIMATED} and MUST be omitted when lkw_precision == UNKNOWN_WAKE_UP
        default: null
      - name: arrival_mode
        type: enum
        source: input
        description: how the patient reached the door
        constraints: "one of {EMS, WALK_IN, INTERFACILITY_TRANSFER}"
      - name: activation_at
        type: datetime
        source: system
        description: logical-clock instant of code stroke activation
      - name: imaging_at
        type: datetime
        source: system
        description: logical-clock instant the imaging-complete action was recorded
        default: null
      - name: needle_at
        type: datetime
        source: system
        description: logical-clock instant the thrombolytic was administered
        default: null
      - name: door_to_imaging_minutes
        type: integer
        source: computed
        description: whole minutes from door_at to imaging_at per calculations.clock_interval_metrics
        default: null
      - name: door_to_needle_minutes
        type: integer
        source: computed
        description: whole minutes from door_at to needle_at per calculations.clock_interval_metrics
        default: null
      - name: lkw_to_needle_minutes
        type: integer
        source: computed
        description: whole minutes from last_known_well_at to needle_at per calculations.clock_interval_metrics; null when last_known_well_at is null
        default: null
      - name: thrombolytic_window_class
        type: enum
        source: computed
        description: window classification recomputed by calculations.thrombolytic_window_classification at every checklist determination and at thrombolytic administration
        default: null
        constraints: "one of {WITHIN_3H, WITHIN_4_5H, EXTENDED_UNKNOWN, OUT_OF_WINDOW}"
      - name: status
        type: enum
        source: system
        description: case lifecycle state
        default: ACTIVATED
        constraints: "one of {ACTIVATED, IMAGING_COMPLETE, CONSULT_IN_PROGRESS, ELIGIBILITY_DETERMINED, THROMBOLYSIS_ADMINISTERED, TRANSFER_INITIATED, CLOSED, ABORTED}"
      - name: disposition
        type: enum
        source: system
        description: terminal treatment disposition, set by the branch the case took out of ELIGIBILITY_DETERMINED
        default: PENDING
        constraints: "one of {PENDING, TREATED_LOCAL, DRIP_AND_SHIP, TRANSFER_ONLY, NO_TREATMENT}"
      - name: activated_by_user_id
        type: string
        source: system
        description: opaque X-User-ID of the EdPhysician who activated the code stroke
      - name: thrombolytic_agent
        type: enum
        source: system
        description: agent recorded at administration
        default: null
        constraints: "one of {ALTEPLASE, TENECTEPLASE}"
      - name: thrombolytic_dose_mg
        type: number
        source: system
        description: dose recorded at administration, 1 decimal place
        default: null
      - name: abort_reason
        type: string
        source: system
        description: reason recorded when the case was aborted
        default: null
      - name: deviation_count
        type: integer
        source: computed
        description: count of ProtocolDeviation rows with case_id equal to this case and status NOT IN {DISMISSED}
        default: 0
        constraints: ">= 0"

  - name: TelestrokeConsult
    parent: null
    common_fields: true
    fields:
      - name: case_id
        type: string
        source: input
        description: "FK -> CodeStrokeCase.id; the code stroke this consult serves"
      - name: agreement_id
        type: string
        source: input
        description: "FK -> SpokeAgreement.id; the agreement whose hub supplies the neurologist and whose proxy_credentials gate eligibility"
      - name: assigned_neurologist_id
        type: string
        source: system
        description: "FK -> Neurologist.id; winner of calculations.consult_routing_selection; null while status IN {REQUESTED, ESCALATED_UNFILLED}"
        default: null
      - name: requested_privilege_scope
        type: enum
        source: input
        description: privilege scope the requester needs; CONSULT_AND_THROMBOLYSIS can only be satisfied by a proxy credential of the same scope
        constraints: "one of {CONSULT_ONLY, CONSULT_AND_THROMBOLYSIS}"
      - name: status
        type: enum
        source: system
        description: consult lifecycle state
        default: REQUESTED
        constraints: "one of {REQUESTED, ASSIGNED, IN_SESSION, COMPLETED, ESCALATED_UNFILLED, CANCELLED}"
      - name: requested_at
        type: datetime
        source: system
        description: logical-clock instant the consult was requested
      - name: assigned_at
        type: datetime
        source: system
        description: logical-clock instant of the most recent successful routing assignment
        default: null
      - name: accepted_at
        type: datetime
        source: system
        description: logical-clock instant the assigned neurologist accepted; start of the neurologist occupancy interval
        default: null
      - name: completed_at
        type: datetime
        source: system
        description: logical-clock instant the consult completed; end of the neurologist occupancy interval
        default: null
      - name: response_latency_seconds
        type: integer
        source: computed
        description: whole seconds from requested_at to accepted_at per calculations.clock_interval_metrics; null until accepted
        default: null
      - name: decline_count
        type: integer
        source: system
        description: number of declines recorded on this consult; the CONSULT_DECLINE_LIMIT-th decline escalates instead of re-routing
        default: 0
        constraints: ">= 0"
      - name: routing_attempt_count
        type: integer
        source: system
        description: number of times the routing selector has been executed for this consult
        default: 0
        constraints: ">= 0"
      - name: excluded_neurologist_ids
        type: array
        source: system
        description: neurologist ids removed from the candidate pool because they declined this consult; the selector excludes every element on each re-route
        default: []
      - name: video_sessions
        type: array
        source: system
        description: "append-only video session records; each element is an object { started_at, ended_at, video_quality, disconnect_count, duration_seconds, session_valid } where video_quality IN {HD, SD, AUDIO_ONLY} and session_valid is computed by calculations.video_session_validity"
        default: []
      - name: valid_video_session_count
        type: integer
        source: computed
        description: count of elements of video_sessions whose session_valid is true
        default: 0
        constraints: ">= 0"
      - name: recommendation
        type: enum
        source: system
        description: neurologist recommendation recorded at completion
        default: null
        constraints: "one of {THROMBOLYSIS, TRANSFER_THROMBECTOMY, BOTH_DRIP_AND_SHIP, NO_INTERVENTION}"
      - name: nihss_score
        type: integer
        source: system
        description: NIH Stroke Scale score recorded at completion
        default: null
        constraints: ">= 0, <= 42"
      - name: last_decline_reason
        type: string
        source: system
        description: free-text reason from the most recent decline
        default: null
      - name: cancellation_reason
        type: string
        source: system
        description: reason recorded when a cascade cancelled this consult
        default: null

  - name: ThrombolyticChecklist
    parent: null
    common_fields: true
    fields:
      - name: case_id
        type: string
        source: input
        description: "FK -> CodeStrokeCase.id; at most one non-superseded checklist exists per case"
      - name: overridden_by_neurologist_id
        type: string
        source: system
        description: "FK -> Neurologist.id; the neurologist who signed a relative-contraindication override; null unless determination_status == ELIGIBLE_WITH_RELATIVE_OVERRIDE"
        default: null
      - name: documentation_status
        type: enum
        source: system
        description: documentation dimension; evolves independently of determination_status
        default: NOT_STARTED
        constraints: "one of {NOT_STARTED, IN_PROGRESS, DOCUMENTED, AMENDED}"
      - name: determination_status
        type: enum
        source: system
        description: eligibility dimension; evolves independently of documentation_status
        default: PENDING
        constraints: "one of {PENDING, ELIGIBLE, INELIGIBLE, ELIGIBLE_WITH_RELATIVE_OVERRIDE}"
      - name: confirmed_inclusion_item_codes
        type: array
        source: system
        description: distinct inclusion item codes confirmed so far; each element is one of the REQUIRED_INCLUSION_ITEM_CODES constants
        default: []
      - name: confirmed_inclusion_item_count
        type: integer
        source: computed
        description: length of confirmed_inclusion_item_codes
        default: 0
        constraints: ">= 0, <= 4"
      - name: contraindications
        type: array
        source: system
        description: "documented contraindications; each element is an object { code, severity, documented_evidence, recorded_by_user_id, recorded_at } where severity IN {ABSOLUTE, RELATIVE}"
        default: []
      - name: absolute_contraindication_count
        type: integer
        source: computed
        description: count of elements of contraindications whose severity == ABSOLUTE
        default: 0
        constraints: ">= 0"
      - name: relative_contraindication_count
        type: integer
        source: computed
        description: count of elements of contraindications whose severity == RELATIVE
        default: 0
        constraints: ">= 0"
      - name: screening_eligibility_score
        type: number
        source: computed
        description: SCREENING variant of calculations.eligibility_score, recomputed on every inclusion-item and contraindication write, 2 decimal places
        default: 0.00
      - name: attested_eligibility_score
        type: number
        source: computed
        description: ATTESTED variant of calculations.eligibility_score, computed only at determination, 2 decimal places; null until the first determination
        default: null
      - name: override_justification
        type: string
        source: system
        description: justification text supplied with a relative-contraindication override
        default: null
      - name: determined_at
        type: datetime
        source: system
        description: logical-clock instant of the most recent determination
        default: null
      - name: amendment_count
        type: integer
        source: system
        description: number of times the checklist was amended after a determination
        default: 0
        constraints: ">= 0"
      - name: last_amendment_note
        type: string
        source: system
        description: note recorded with the most recent amendment
        default: null

  - name: TransferDecision
    parent: null
    common_fields: true
    fields:
      - name: case_id
        type: string
        source: input
        description: "FK -> CodeStrokeCase.id; the case being transferred"
      - name: origin_center_id
        type: string
        source: system
        description: "FK -> StrokeCenter.id; copied from the case's center_id at proposal time"
      - name: destination_center_id
        type: string
        source: input
        description: "FK -> StrokeCenter.id; MUST be a facility whose facility_type == THROMBECTOMY_CAPABLE"
      - name: mode
        type: enum
        source: input
        description: transfer mode; DRIP_AND_SHIP means the thrombolytic was already administered at the origin
        constraints: "one of {DRIP_AND_SHIP, TRANSFER_ONLY}"
      - name: transport_eta_minutes
        type: integer
        source: input
        description: raw transport estimate supplied by the transfer coordinator, before congestion adjustment
        constraints: ">= 1, <= 600"
      - name: status
        type: enum
        source: system
        description: transfer decision lifecycle state
        default: PROPOSED
        constraints: "one of {PROPOSED, ACCEPTED, DECLINED, HANDOFF_COMPLETE, CANCELLED}"
      - name: destination_posture_at_proposal
        type: enum
        source: computed
        description: destination StrokeCenter.ems_routing_posture read in step 1 of calculations.projected_door_in_door_out, BEFORE this decision is counted in the destination's open_case_count
        constraints: "one of {ROUTINE, DIVERT_ADVISORY}"
      - name: congestion_factor
        type: number
        source: computed
        description: multiplier selected from destination_posture_at_proposal per calculations.projected_door_in_door_out, 2 decimal places
      - name: adjusted_transport_minutes
        type: integer
        source: computed
        description: ceil(transport_eta_minutes * congestion_factor) per calculations.projected_door_in_door_out
      - name: projected_door_in_door_out_minutes
        type: integer
        source: computed
        description: projected door-in-door-out minutes computed at proposal per calculations.projected_door_in_door_out
      - name: door_in_door_out_minutes
        type: integer
        source: computed
        description: realised whole minutes from the case's door_at to handoff_completed_at per calculations.clock_interval_metrics; null until handoff completes
        default: null
      - name: handoff_packet_items
        type: array
        source: system
        description: handoff packet item codes recorded at handoff completion; each element is one of the REQUIRED_HANDOFF_PACKET_ITEMS constants
        default: []
      - name: handoff_packet_complete
        type: boolean
        source: computed
        description: true when handoff_packet_items contains every element of REQUIRED_HANDOFF_PACKET_ITEMS
        default: false
      - name: proposed_at
        type: datetime
        source: system
        description: logical-clock instant of proposal
      - name: accepted_at
        type: datetime
        source: system
        description: logical-clock instant the destination accepted
        default: null
      - name: handoff_completed_at
        type: datetime
        source: system
        description: logical-clock instant the drip-and-ship handoff completed
        default: null
      - name: decline_reason
        type: string
        source: system
        description: reason recorded when the destination declined
        default: null
      - name: cancellation_reason
        type: string
        source: system
        description: reason recorded when a cascade cancelled this decision
        default: null

  - name: ProtocolDeviation
    parent: null
    common_fields: true
    fields:
      - name: case_id
        type: string
        source: input
        description: "FK -> CodeStrokeCase.id; the case the deviation was raised against"
      - name: deviation_type
        type: enum
        source: input
        description: deviation classification
        constraints: "one of {DTI_EXCEEDED, DTN_EXCEEDED, DIDO_EXCEEDED, CONSULT_UNFILLED, MISSING_CONTRAINDICATION_DOC, INVALID_VIDEO_SESSION, LKW_WINDOW_VIOLATION}"
      - name: severity
        type: enum
        source: input
        description: deviation severity; drives the deviation penalty in the composite certification score
        constraints: "one of {MINOR, MAJOR, SENTINEL}"
      - name: narrative
        type: string
        source: input
        description: narrative describing the deviation
        constraints: non-empty, max 500 chars
      - name: source
        type: enum
        source: system
        description: SYSTEM_DETECTED when raised by a cascade, MANUAL when raised through the deviations endpoint
        default: MANUAL
        constraints: "one of {SYSTEM_DETECTED, MANUAL}"
      - name: status
        type: enum
        source: system
        description: deviation review lifecycle state
        default: OPEN
        constraints: "one of {OPEN, UNDER_REVIEW, RETURNED_FOR_INFO, SUBSTANTIATED, DISMISSED}"
      - name: opened_by_user_id
        type: string
        source: system
        description: opaque X-User-ID of the QualityAbstractor who opened the deviation, or the literal string "system" for SYSTEM_DETECTED rows
      - name: reviewed_by_user_id
        type: string
        source: system
        description: opaque X-User-ID of the CertificationReviewer who most recently acted on the review
        default: null
      - name: review_round
        type: integer
        source: system
        description: number of times the deviation entered UNDER_REVIEW; capped by MAX_REVIEW_ROUNDS
        default: 0
        constraints: ">= 0, <= 3"
      - name: info_request
        type: string
        source: system
        description: information request recorded by the most recent return-for-info
        default: null
      - name: additional_info
        type: string
        source: system
        description: additional information supplied by the most recent resubmission
        default: null
      - name: debrief_completed
        type: boolean
        source: system
        description: true once a decision recorded a case debrief summary
        default: false
      - name: debrief_summary
        type: string
        source: system
        description: case debrief summary recorded with the decision
        default: null

  - name: QualityMeasureAbstraction
    parent: null
    common_fields: true
    fields:
      - name: case_id
        type: string
        source: input
        description: "FK -> CodeStrokeCase.id; the abstracted case"
      - name: report_id
        type: string
        source: system
        description: "FK -> CertificationReport.id; set when a CertificationReport submission attaches this abstraction; null while unattached"
        default: null
      - name: measure_code
        type: enum
        source: input
        description: quality measure being abstracted
        constraints: "one of {STK_4_THROMBOLYTIC_THERAPY, STK_DTI_45, STK_DTN_60, STK_TELESTROKE_RESPONSE}"
      - name: variant
        type: enum
        source: computed
        description: which variant of calculations.abstraction_numerator_denominator produced the current numerator_flag and denominator_included values; PROVISIONAL while status == DRAFT, CERTIFIED once status == FINALIZED
        default: PROVISIONAL
        constraints: "one of {PROVISIONAL, CERTIFIED}"
      - name: numerator_flag
        type: boolean
        source: computed
        description: whether the case meets the measure numerator per calculations.abstraction_numerator_denominator
        default: false
      - name: denominator_included
        type: boolean
        source: computed
        description: whether the case counts in the measure denominator per calculations.abstraction_numerator_denominator
        default: false
      - name: exclusion_reason
        type: enum
        source: computed
        description: why the case was excluded from the denominator, or NONE
        default: NONE
        constraints: "one of {NONE, OUT_OF_WINDOW, ABORTED_CASE, DOCUMENTED_ABSOLUTE_CONTRAINDICATION, TRANSFER_ONLY}"
      - name: status
        type: enum
        source: system
        description: abstraction lifecycle state
        default: DRAFT
        constraints: "one of {DRAFT, FINALIZED, RETRACTED}"
      - name: abstracted_by_user_id
        type: string
        source: system
        description: opaque X-User-ID of the QualityAbstractor who created the abstraction
      - name: attested_by_user_id
        type: string
        source: system
        description: opaque X-User-ID of the QualityAbstractor who finalized the abstraction; MUST differ from abstracted_by_user_id
        default: null
      - name: attestation_note
        type: string
        source: system
        description: note recorded at finalization
        default: null
      - name: retraction_reason
        type: string
        source: system
        description: reason recorded at retraction
        default: null

  - name: CertificationReport
    parent: null
    common_fields: true
    fields:
      - name: center_id
        type: string
        source: input
        description: "FK -> StrokeCenter.id; the center whose certification period is being reported"
      - name: period_start
        type: datetime
        source: input
        description: inclusive start of the half-open reporting interval [period_start, period_end)
      - name: period_end
        type: datetime
        source: input
        description: exclusive end of the half-open reporting interval [period_start, period_end)
      - name: status
        type: enum
        source: system
        description: report lifecycle state
        default: DRAFT
        constraints: "one of {DRAFT, SUBMITTED, ACCEPTED, RETURNED, PUBLISHED, SUPERSEDED}"
      - name: submitted_by_user_id
        type: string
        source: system
        description: opaque X-User-ID of the ProgramCoordinator who most recently submitted the report
        default: null
      - name: decided_by_user_id
        type: string
        source: system
        description: opaque X-User-ID of the CertificationReviewer who decided the report; MUST differ from submitted_by_user_id
        default: null
      - name: included_abstraction_count
        type: integer
        source: computed
        description: count of QualityMeasureAbstraction rows with report_id equal to this report and status == FINALIZED
        default: 0
        constraints: ">= 0"
      - name: closed_case_count_in_period
        type: integer
        source: computed
        description: count of CodeStrokeCase rows with center_id equal to this report's center, status == CLOSED and door_at inside [period_start, period_end)
        default: 0
        constraints: ">= 0"
      - name: dtn_60_compliance_pct
        type: number
        source: computed
        description: STK_DTN_60 rate from calculations.measure_compliance_rate, 2 decimal places
        default: 0.00
      - name: dti_45_compliance_pct
        type: number
        source: computed
        description: STK_DTI_45 rate from calculations.measure_compliance_rate, 2 decimal places
        default: 0.00
      - name: telestroke_response_compliance_pct
        type: number
        source: computed
        description: STK_TELESTROKE_RESPONSE rate from calculations.measure_compliance_rate, 2 decimal places
        default: 0.00
      - name: mean_dtn_excess_pct
        type: number
        source: computed
        description: mean per-case door-to-needle excess over target from calculations.dtn_excess_reporting, 2 decimal places; null when the in-period needle population is empty
        default: null
      - name: rate_variant
        type: enum
        source: computed
        description: which variant of calculations.measure_compliance_rate produced the three rate fields; PROVISIONAL while status == DRAFT, CERTIFIED from submission onward
        default: PROVISIONAL
        constraints: "one of {PROVISIONAL, CERTIFIED}"
      - name: substantiated_major_count
        type: integer
        source: computed
        description: count of ProtocolDeviation rows with status == SUBSTANTIATED, severity == MAJOR, on cases counted in closed_case_count_in_period
        default: 0
        constraints: ">= 0"
      - name: substantiated_sentinel_count
        type: integer
        source: computed
        description: count of ProtocolDeviation rows with status == SUBSTANTIATED, severity == SENTINEL, on cases counted in closed_case_count_in_period
        default: 0
        constraints: ">= 0"
      - name: composite_certification_score
        type: number
        source: computed
        description: composite score from calculations.composite_certification_score, 2 decimal places; recomputed at submission
        default: 0.00
      - name: decision
        type: enum
        source: computed
        description: certification decision derived from composite_certification_score at decision time
        default: PENDING
        constraints: "one of {PENDING, CERTIFIED, CONDITIONAL, DENIED}"
      - name: submitted_at
        type: datetime
        source: system
        description: logical-clock instant of the most recent submission
        default: null
      - name: decided_at
        type: datetime
        source: system
        description: logical-clock instant of the decision
        default: null
      - name: published_at
        type: datetime
        source: system
        description: logical-clock instant of publication
        default: null
      - name: superseded_by_report_id
        type: string
        source: system
        description: "FK -> CertificationReport.id; the report that superseded this DRAFT report; null unless status == SUPERSEDED"
        default: null

# ============================================================================
# §1.2 State Machine Table
# ============================================================================

state_machines:

  - entity: StrokeCenter
    initial_state: PROVISIONAL
    terminal_states: [WITHDRAWN]
    note: |
      Cyclic on the CERTIFIED <-> CONDITIONAL pair. All forward transitions are
      driven by CertificationReport decisions; only suspension is manual.
    transitions:
      - from: PROVISIONAL
        to: CERTIFIED
        trigger: "POST /stroke-network/certification-reports/{id}/decide with composite_certification_score >= CERT_SCORE_CERTIFIED_MIN"
        actor: CertificationReviewer
        preconditions:
          - "report.center_id == this center's id"
          - "report.status == SUBMITTED"
        side_effects:
          - "certification_status := CERTIFIED"
          - "suspension_reason := null"
          - "consecutive_denied_report_count := 0"
          - "recompute ems_routing_posture (calculations.ems_routing_posture)"
          - "increments StrokeCenter.version by 1"
      - from: PROVISIONAL
        to: CONDITIONAL
        trigger: "POST /stroke-network/certification-reports/{id}/decide with CERT_SCORE_CONDITIONAL_MIN <= composite_certification_score < CERT_SCORE_CERTIFIED_MIN"
        actor: CertificationReviewer
        preconditions:
          - "report.status == SUBMITTED"
        side_effects:
          - "certification_status := CONDITIONAL"
          - "consecutive_denied_report_count := 0"
          - "recompute ems_routing_posture: CONDITIONAL forces at least DIVERT_ADVISORY"
          - "increments StrokeCenter.version by 1"
      - from: CERTIFIED
        to: CONDITIONAL
        trigger: "POST /stroke-network/certification-reports/{id}/decide with CERT_SCORE_CONDITIONAL_MIN <= composite_certification_score < CERT_SCORE_CERTIFIED_MIN"
        actor: CertificationReviewer
        preconditions:
          - "report.status == SUBMITTED"
        side_effects:
          - "certification_status := CONDITIONAL"
          - "recompute ems_routing_posture -> DIVERT_ADVISORY"
          - "increments StrokeCenter.version by 1"
      - from: CONDITIONAL
        to: CERTIFIED
        trigger: "POST /stroke-network/certification-reports/{id}/decide with composite_certification_score >= CERT_SCORE_CERTIFIED_MIN"
        actor: CertificationReviewer
        preconditions:
          - "report.status == SUBMITTED"
        side_effects:
          - "certification_status := CERTIFIED"
          - "recompute ems_routing_posture -> ROUTINE when equipment_readiness_posture == READY and open_case_count < OPEN_CASE_DIVERT_THRESHOLD"
          - "increments StrokeCenter.version by 1"
      - from: PROVISIONAL
        to: SUSPENDED
        trigger: "POST /stroke-network/stroke-centers/{id}/suspend"
        actor: CertificationReviewer
        preconditions:
          - "certification_status NOT IN {SUSPENDED, WITHDRAWN}"
        side_effects:
          - "certification_status := SUSPENDED; suspension_reason := request.reason"
          - "CASCADE hop 1 -> ems_routing_posture := BYPASS"
          - "CASCADE hop 2 (caused by hop 1 leaving the servable set) -> every SpokeAgreement with hub_center_id == this center and status == ACTIVE transitions ACTIVE -> SUSPENDED with suspension_reason := 'hub certification suspended'"
          - "CASCADE hop 3 (caused by hop 2) -> every TelestrokeConsult with agreement_id in those agreements and status IN {REQUESTED, ASSIGNED, IN_SESSION} transitions to CANCELLED with cancellation_reason := 'agreement suspended'"
          - "CASCADE hop 4 (caused by hop 3) -> for each cancelled consult that had an assigned_neurologist_id, that Neurologist's active_consult_count is recomputed and on_call_state IN_CONSULT -> ON_CALL; and a SYSTEM_DETECTED ProtocolDeviation(deviation_type=CONSULT_UNFILLED, severity=MAJOR, opened_by_user_id='system') is created on the consult's case, raising that case's deviation_count by 1"
          - "increments StrokeCenter.version by 1"
      - from: CERTIFIED
        to: SUSPENDED
        trigger: "POST /stroke-network/stroke-centers/{id}/suspend"
        actor: CertificationReviewer
        preconditions:
          - "certification_status NOT IN {SUSPENDED, WITHDRAWN}"
        side_effects:
          - "identical four-hop cascade as PROVISIONAL -> SUSPENDED"
          - "increments StrokeCenter.version by 1"
      - from: CONDITIONAL
        to: SUSPENDED
        trigger: "POST /stroke-network/stroke-centers/{id}/suspend OR POST /stroke-network/certification-reports/{id}/decide with composite_certification_score < CERT_SCORE_CONDITIONAL_MIN"
        actor: CertificationReviewer
        preconditions:
          - "certification_status NOT IN {SUSPENDED, WITHDRAWN}"
        side_effects:
          - "certification_status := SUSPENDED"
          - "when triggered by a report decision: consecutive_denied_report_count := consecutive_denied_report_count + 1 and suspension_reason := 'certification report denied'"
          - "identical four-hop cascade as PROVISIONAL -> SUSPENDED"
          - "increments StrokeCenter.version by 1"
      - from: SUSPENDED
        to: CONDITIONAL
        trigger: "POST /stroke-network/certification-reports/{id}/decide with composite_certification_score >= CERT_SCORE_CONDITIONAL_MIN"
        actor: CertificationReviewer
        preconditions:
          - "report.status == SUBMITTED"
        side_effects:
          - "certification_status := CONDITIONAL; suspension_reason := null; consecutive_denied_report_count := 0"
          - "recompute ems_routing_posture -> DIVERT_ADVISORY (suspended agreements are NOT auto-reactivated; reactivation is a separate operator action)"
          - "increments StrokeCenter.version by 1"
      - from: SUSPENDED
        to: WITHDRAWN
        trigger: "POST /stroke-network/certification-reports/{id}/decide with composite_certification_score < CERT_SCORE_CONDITIONAL_MIN while consecutive_denied_report_count == 1"
        actor: CertificationReviewer
        preconditions:
          - "certification_status == SUSPENDED"
          - "consecutive_denied_report_count == 1 before this decision"
        side_effects:
          - "certification_status := WITHDRAWN; consecutive_denied_report_count := 2"
          - "ems_routing_posture := BYPASS"
          - "every SpokeAgreement with hub_center_id == this center and status IN {DRAFT, ACTIVE, SUSPENDED} transitions to TERMINATED"
          - "increments StrokeCenter.version by 1"

  - entity: SpokeAgreement
    initial_state: DRAFT
    terminal_states: [TERMINATED]
    note: "Cyclic on ACTIVE <-> SUSPENDED. TERMINATED is reached by hub withdrawal or by the system-detected expiry check that runs on every consult request."
    transitions:
      - from: DRAFT
        to: ACTIVE
        trigger: "POST /stroke-network/spoke-agreements/{id}/activate"
        actor: ProgramCoordinator
        preconditions:
          - "status == DRAFT"
          - "hub center certification_status NOT IN {SUSPENDED, WITHDRAWN}"
          - "spoke center certification_status != WITHDRAWN"
          - "clock_now < effective_until"
        side_effects:
          - "status := ACTIVE"
          - "increments SpokeAgreement.version by 1"
      - from: ACTIVE
        to: SUSPENDED
        trigger: "POST /stroke-network/spoke-agreements/{id}/suspend OR cascade hop 2 of StrokeCenter suspension"
        actor: ProgramCoordinator | CertificationReviewer | system
        preconditions:
          - "status == ACTIVE"
        side_effects:
          - "status := SUSPENDED; suspension_reason := request.reason or the cascade reason"
          - "CASCADE -> every TelestrokeConsult on this agreement with status IN {REQUESTED, ASSIGNED, IN_SESSION} transitions to CANCELLED, which in turn releases each assigned Neurologist and raises a SYSTEM_DETECTED CONSULT_UNFILLED ProtocolDeviation on the affected case"
          - "active_consult_count recomputed to 0"
          - "increments SpokeAgreement.version by 1"
      - from: SUSPENDED
        to: ACTIVE
        trigger: "POST /stroke-network/spoke-agreements/{id}/activate"
        actor: ProgramCoordinator
        preconditions:
          - "status == SUSPENDED"
          - "hub center certification_status NOT IN {SUSPENDED, WITHDRAWN}"
          - "clock_now < effective_until"
        side_effects:
          - "status := ACTIVE; suspension_reason := null"
          - "increments SpokeAgreement.version by 1"
      - from: ACTIVE
        to: TERMINATED
        trigger: "system expiry check executed at the start of POST /stroke-network/consults when clock_now >= effective_until"
        actor: system
        preconditions:
          - "status == ACTIVE"
          - "clock_now >= effective_until"
        side_effects:
          - "status := TERMINATED"
          - "the triggering consult request is then rejected with ERR_AGREEMENT_WINDOW_CLOSED"
          - "increments SpokeAgreement.version by 1"
      - from: SUSPENDED
        to: TERMINATED
        trigger: "cascade from StrokeCenter SUSPENDED -> WITHDRAWN on the hub"
        actor: system
        preconditions:
          - "hub center certification_status transitions to WITHDRAWN"
        side_effects:
          - "status := TERMINATED"
          - "increments SpokeAgreement.version by 1"
      - from: DRAFT
        to: TERMINATED
        trigger: "cascade from StrokeCenter SUSPENDED -> WITHDRAWN on the hub"
        actor: system
        preconditions:
          - "hub center certification_status transitions to WITHDRAWN"
        side_effects:
          - "status := TERMINATED"
          - "increments SpokeAgreement.version by 1"

  - entity: Neurologist
    initial_state: OFF_DUTY
    terminal_states: []
    note: "Availability dimension; cyclic ON_CALL -> IN_CONSULT -> ON_CALL."
    transitions:
      - from: OFF_DUTY
        to: ON_CALL
        trigger: "POST /stroke-network/neurologists/{id}/on-call-state with on_call_state=ON_CALL"
        actor: Neurologist | ProgramCoordinator
        preconditions:
          - "on_call_state == OFF_DUTY"
          - "home center certification_status NOT IN {SUSPENDED, WITHDRAWN}"
        side_effects:
          - "on_call_state := ON_CALL"
          - "increments Neurologist.version by 1"
      - from: ON_CALL
        to: OFF_DUTY
        trigger: "POST /stroke-network/neurologists/{id}/on-call-state with on_call_state=OFF_DUTY"
        actor: Neurologist | ProgramCoordinator
        preconditions:
          - "on_call_state == ON_CALL"
          - "active_consult_count == 0"
        side_effects:
          - "on_call_state := OFF_DUTY"
          - "increments Neurologist.version by 1"
      - from: ON_CALL
        to: UNAVAILABLE
        trigger: "POST /stroke-network/neurologists/{id}/on-call-state with on_call_state=UNAVAILABLE"
        actor: Neurologist | ProgramCoordinator
        preconditions:
          - "on_call_state == ON_CALL"
        side_effects:
          - "on_call_state := UNAVAILABLE"
          - "increments Neurologist.version by 1"
      - from: UNAVAILABLE
        to: ON_CALL
        trigger: "POST /stroke-network/neurologists/{id}/on-call-state with on_call_state=ON_CALL"
        actor: Neurologist | ProgramCoordinator
        preconditions:
          - "on_call_state == UNAVAILABLE"
        side_effects:
          - "on_call_state := ON_CALL"
          - "increments Neurologist.version by 1"
      - from: ON_CALL
        to: IN_CONSULT
        trigger: "POST /stroke-network/consults/{id}/accept"
        actor: Neurologist
        preconditions:
          - "on_call_state == ON_CALL"
          - "consult.assigned_neurologist_id == X-User-ID"
        side_effects:
          - "on_call_state := IN_CONSULT"
          - "active_consult_count recomputed"
          - "increments Neurologist.version by 1"
      - from: IN_CONSULT
        to: ON_CALL
        trigger: "POST /stroke-network/consults/{id}/complete, or cascade hop 4 of a consult cancellation"
        actor: Neurologist | system
        preconditions:
          - "on_call_state == IN_CONSULT"
          - "no other TelestrokeConsult assigned to this neurologist has status == IN_SESSION after this transition"
        side_effects:
          - "on_call_state := ON_CALL"
          - "active_consult_count recomputed"
          - "on completion only: last_consult_completed_at := clock_now and completed_consult_count := completed_consult_count + 1"
          - "increments Neurologist.version by 1"

  - entity: CodeStrokeCase
    initial_state: ACTIVATED
    terminal_states: [CLOSED, ABORTED]
    note: |
      Branching fork-join. ELIGIBILITY_DETERMINED forks into
      THROMBOLYSIS_ADMINISTERED (treat locally) and TRANSFER_INITIATED
      (ship without lysis); the drip-and-ship path traverses BOTH branch nodes
      in sequence. Both branches rejoin at CLOSED with different disposition
      values and different side-effect sets.
    transitions:
      - from: ACTIVATED
        to: IMAGING_COMPLETE
        trigger: "POST /stroke-network/code-strokes/{id}/imaging-complete"
        actor: EdPhysician
        preconditions:
          - "status == ACTIVATED"
          - "center ct_scanner_ready == true"
        side_effects:
          - "imaging_at := clock_now"
          - "door_to_imaging_minutes := calculations.clock_interval_metrics(door_at, imaging_at)"
          - "when door_to_imaging_minutes > DTI_TARGET_MIN: create SYSTEM_DETECTED ProtocolDeviation(deviation_type=DTI_EXCEEDED, severity=MINOR) on this case, which raises deviation_count by 1"
          - "increments CodeStrokeCase.version by 1"
      - from: CONSULT_IN_PROGRESS
        to: CONSULT_IN_PROGRESS
        trigger: "POST /stroke-network/code-strokes/{id}/imaging-complete"
        actor: EdPhysician
        preconditions:
          - "status == CONSULT_IN_PROGRESS"
          - "imaging_at == null"
          - "center ct_scanner_ready == true"
        side_effects:
          - "imaging_at := clock_now; door_to_imaging_minutes recomputed; same DTI_EXCEEDED deviation rule applies"
          - "status is unchanged: the imaging clock and the consult workflow are independent"
          - "increments CodeStrokeCase.version by 1"
      - from: ACTIVATED
        to: CONSULT_IN_PROGRESS
        trigger: "POST /stroke-network/consults (successful routing assignment or escalation)"
        actor: EdPhysician
        preconditions:
          - "status == ACTIVATED"
        side_effects:
          - "status := CONSULT_IN_PROGRESS"
          - "increments CodeStrokeCase.version by 1 (the OCC bump observed by expected_case_version)"
      - from: IMAGING_COMPLETE
        to: CONSULT_IN_PROGRESS
        trigger: "POST /stroke-network/consults (successful routing assignment or escalation)"
        actor: EdPhysician
        preconditions:
          - "status == IMAGING_COMPLETE"
        side_effects:
          - "status := CONSULT_IN_PROGRESS"
          - "increments CodeStrokeCase.version by 1"
      - from: CONSULT_IN_PROGRESS
        to: ELIGIBILITY_DETERMINED
        trigger: "POST /stroke-network/checklists/{id}/determine"
        actor: Neurologist
        preconditions:
          - "status == CONSULT_IN_PROGRESS"
          - "the checklist's case_id == this case's id"
          - "checklist determination_status transitions out of PENDING in the same request"
        side_effects:
          - "status := ELIGIBILITY_DETERMINED"
          - "thrombolytic_window_class := calculations.thrombolytic_window_classification"
          - "when checklist determination_status becomes INELIGIBLE: disposition := NO_TREATMENT"
          - "increments CodeStrokeCase.version by 1"
      - from: ELIGIBILITY_DETERMINED
        to: ELIGIBILITY_DETERMINED
        trigger: "POST /stroke-network/checklists/{id}/determine (re-determination after POST /stroke-network/checklists/{id}/amend)"
        actor: Neurologist
        preconditions:
          - "status == ELIGIBILITY_DETERMINED"
          - "the checklist's documentation_status == AMENDED and determination_status == PENDING"
        side_effects:
          - "status is unchanged; the case does not rewind"
          - "thrombolytic_window_class := calculations.thrombolytic_window_classification, re-evaluated against the clock as it now stands, so a re-determination can flip a previously WITHIN_3H case to OUT_OF_WINDOW"
          - "disposition := NO_TREATMENT when the re-determination lands on INELIGIBLE, and back to PENDING when it lands on ELIGIBLE or ELIGIBLE_WITH_RELATIVE_OVERRIDE"
          - "increments CodeStrokeCase.version by 1"
      - from: ELIGIBILITY_DETERMINED
        to: THROMBOLYSIS_ADMINISTERED
        trigger: "POST /stroke-network/code-strokes/{id}/administer-thrombolytic"
        actor: EdPhysician
        preconditions:
          - "status == ELIGIBILITY_DETERMINED"
          - "the case's checklist determination_status IN {ELIGIBLE, ELIGIBLE_WITH_RELATIVE_OVERRIDE}"
          - "imaging_at != null"
          - "thrombolytic_window_class != OUT_OF_WINDOW recomputed at clock_now"
          - "center equipment_readiness_posture != OFFLINE"
        side_effects:
          - "needle_at := clock_now; thrombolytic_agent and thrombolytic_dose_mg recorded"
          - "status := THROMBOLYSIS_ADMINISTERED; disposition := TREATED_LOCAL"
          - "door_to_needle_minutes and lkw_to_needle_minutes := calculations.clock_interval_metrics"
          - "when door_to_needle_minutes > DTN_TARGET_MIN: create SYSTEM_DETECTED ProtocolDeviation(deviation_type=DTN_EXCEEDED, severity=MAJOR) on this case, raising deviation_count by 1"
          - "increments CodeStrokeCase.version by 1"
      - from: ELIGIBILITY_DETERMINED
        to: TRANSFER_INITIATED
        trigger: "POST /stroke-network/transfer-decisions"
        actor: TransferCoordinator
        preconditions:
          - "status == ELIGIBILITY_DETERMINED"
          - "request mode == TRANSFER_ONLY"
        side_effects:
          - "status := TRANSFER_INITIATED; disposition := TRANSFER_ONLY"
          - "increments CodeStrokeCase.version by 1"
        note: "Branch B: shipped without lysis. Disposition differs from branch A and suppresses the STK_DTN_60 denominator."
      - from: THROMBOLYSIS_ADMINISTERED
        to: TRANSFER_INITIATED
        trigger: "POST /stroke-network/transfer-decisions"
        actor: TransferCoordinator
        preconditions:
          - "status == THROMBOLYSIS_ADMINISTERED"
          - "request mode == DRIP_AND_SHIP"
        side_effects:
          - "status := TRANSFER_INITIATED; disposition := DRIP_AND_SHIP"
          - "increments CodeStrokeCase.version by 1"
        note: "Drip-and-ship traverses branch A then branch B; disposition DRIP_AND_SHIP keeps the case in the STK_DTN_60 denominator whereas TRANSFER_ONLY excludes it."
      - from: THROMBOLYSIS_ADMINISTERED
        to: CLOSED
        trigger: "POST /stroke-network/code-strokes/{id}/close"
        actor: EdPhysician | QualityAbstractor
        preconditions:
          - "status == THROMBOLYSIS_ADMINISTERED"
          - "every TelestrokeConsult on this case has status IN {COMPLETED, ESCALATED_UNFILLED, CANCELLED}"
        side_effects:
          - "status := CLOSED (disposition stays TREATED_LOCAL)"
          - "origin center open_case_count decremented; its ems_routing_posture recomputed"
          - "increments CodeStrokeCase.version by 1"
      - from: ELIGIBILITY_DETERMINED
        to: CLOSED
        trigger: "POST /stroke-network/code-strokes/{id}/close"
        actor: EdPhysician | QualityAbstractor
        preconditions:
          - "status == ELIGIBILITY_DETERMINED"
          - "the case's checklist determination_status == INELIGIBLE"
          - "every TelestrokeConsult on this case has status IN {COMPLETED, ESCALATED_UNFILLED, CANCELLED}"
        side_effects:
          - "status := CLOSED; disposition stays NO_TREATMENT"
          - "origin center open_case_count decremented; ems_routing_posture recomputed"
          - "increments CodeStrokeCase.version by 1"
      - from: TRANSFER_INITIATED
        to: CLOSED
        trigger: "POST /stroke-network/transfer-decisions/{id}/complete-handoff"
        actor: TransferCoordinator
        preconditions:
          - "status == TRANSFER_INITIATED"
          - "the decision's status == ACCEPTED"
        side_effects:
          - "status := CLOSED (disposition retains DRIP_AND_SHIP or TRANSFER_ONLY)"
          - "CASCADE hop 2 of the handoff chain; see TransferDecision ACCEPTED -> HANDOFF_COMPLETE"
          - "increments CodeStrokeCase.version by 1"
      - from: ACTIVATED
        to: ABORTED
        trigger: "POST /stroke-network/code-strokes/{id}/abort"
        actor: EdPhysician
        preconditions:
          - "status NOT IN {CLOSED, ABORTED}"
        side_effects:
          - "status := ABORTED; disposition := NO_TREATMENT; abort_reason recorded"
          - "origin center open_case_count decremented and ems_routing_posture recomputed (compensates the activation increment exactly)"
          - "every TelestrokeConsult on this case with status IN {REQUESTED, ASSIGNED, IN_SESSION} transitions to CANCELLED, which releases each assigned Neurologist (active_consult_count recomputed, IN_CONSULT -> ON_CALL)"
          - "every TransferDecision on this case with status IN {PROPOSED, ACCEPTED} transitions to CANCELLED, which decrements the destination center's open_case_count when the decision was ACCEPTED"
          - "increments CodeStrokeCase.version by 1"
      - from: IMAGING_COMPLETE
        to: ABORTED
        trigger: "POST /stroke-network/code-strokes/{id}/abort"
        actor: EdPhysician
        preconditions:
          - "status NOT IN {CLOSED, ABORTED}"
        side_effects:
          - "identical to ACTIVATED -> ABORTED"
          - "increments CodeStrokeCase.version by 1"
      - from: CONSULT_IN_PROGRESS
        to: ABORTED
        trigger: "POST /stroke-network/code-strokes/{id}/abort"
        actor: EdPhysician
        preconditions:
          - "status NOT IN {CLOSED, ABORTED}"
        side_effects:
          - "identical to ACTIVATED -> ABORTED"
          - "increments CodeStrokeCase.version by 1"
      - from: ELIGIBILITY_DETERMINED
        to: ABORTED
        trigger: "POST /stroke-network/code-strokes/{id}/abort"
        actor: EdPhysician
        preconditions:
          - "status NOT IN {CLOSED, ABORTED}"
        side_effects:
          - "identical to ACTIVATED -> ABORTED"
          - "increments CodeStrokeCase.version by 1"
      - from: TRANSFER_INITIATED
        to: ABORTED
        trigger: "POST /stroke-network/code-strokes/{id}/abort"
        actor: EdPhysician
        preconditions:
          - "status NOT IN {CLOSED, ABORTED}"
        side_effects:
          - "identical to ACTIVATED -> ABORTED, including the TransferDecision cancellation and the destination open_case_count decrement"
          - "increments CodeStrokeCase.version by 1"

  - entity: TelestrokeConsult
    initial_state: REQUESTED
    terminal_states: [COMPLETED, ESCALATED_UNFILLED, CANCELLED]
    note: |
      Cyclic: ASSIGNED -> REQUESTED -> ASSIGNED on every decline, with the
      declining neurologist appended to excluded_neurologist_ids so the next
      routing pass cannot pick them again. The CONSULT_DECLINE_LIMIT-th decline
      exits the loop into ESCALATED_UNFILLED instead of re-routing.
    transitions:
      - from: REQUESTED
        to: ASSIGNED
        trigger: "POST /stroke-network/consults (initial routing pass) or POST /stroke-network/consults/{id}/decline (re-routing pass)"
        actor: EdPhysician | Neurologist | system
        preconditions:
          - "calculations.consult_routing_selection returns a non-empty candidate pool"
        side_effects:
          - "assigned_neurologist_id := selector winner; assigned_at := clock_now; routing_attempt_count += 1"
          - "status := ASSIGNED"
          - "winner Neurologist.active_consult_count recomputed"
          - "agreement active_consult_count recomputed"
          - "increments TelestrokeConsult.version by 1"
      - from: REQUESTED
        to: ESCALATED_UNFILLED
        trigger: "POST /stroke-network/consults (initial routing pass) when the candidate pool is empty"
        actor: EdPhysician | system
        preconditions:
          - "calculations.consult_routing_selection returns an empty candidate pool"
        side_effects:
          - "status := ESCALATED_UNFILLED; assigned_neurologist_id stays null; routing_attempt_count += 1"
          - "create SYSTEM_DETECTED ProtocolDeviation(deviation_type=CONSULT_UNFILLED, severity=MAJOR, opened_by_user_id='system') on the case, raising case deviation_count by 1"
          - "increments TelestrokeConsult.version by 1"
        note: "Empty-pool fallback of the selector policy: the create call still returns 201 with status ESCALATED_UNFILLED; it is not an error."
      - from: ASSIGNED
        to: REQUESTED
        trigger: "POST /stroke-network/consults/{id}/decline while decline_count + 1 < CONSULT_DECLINE_LIMIT"
        actor: Neurologist
        preconditions:
          - "status == ASSIGNED"
          - "assigned_neurologist_id == X-User-ID"
        side_effects:
          - "decline_count += 1; last_decline_reason recorded"
          - "excluded_neurologist_ids := excluded_neurologist_ids + [assigned_neurologist_id]"
          - "the declining Neurologist's active_consult_count recomputed (returns to its pre-assignment value)"
          - "assigned_neurologist_id := null; status := REQUESTED"
          - "the routing selector runs again in the same request: on success the consult re-enters ASSIGNED, on an empty pool it enters ESCALATED_UNFILLED"
          - "increments TelestrokeConsult.version by 1"
      - from: ASSIGNED
        to: ESCALATED_UNFILLED
        trigger: "POST /stroke-network/consults/{id}/decline when decline_count + 1 == CONSULT_DECLINE_LIMIT, or when the re-routing pass finds an empty candidate pool"
        actor: Neurologist
        preconditions:
          - "status == ASSIGNED"
          - "assigned_neurologist_id == X-User-ID"
        side_effects:
          - "decline_count += 1; excluded_neurologist_ids appended; assigned_neurologist_id := null"
          - "status := ESCALATED_UNFILLED"
          - "create SYSTEM_DETECTED ProtocolDeviation(deviation_type=CONSULT_UNFILLED, severity=MAJOR) on the case, raising deviation_count by 1"
          - "increments TelestrokeConsult.version by 1"
      - from: ASSIGNED
        to: IN_SESSION
        trigger: "POST /stroke-network/consults/{id}/accept"
        actor: Neurologist
        preconditions:
          - "status == ASSIGNED"
          - "assigned_neurologist_id == X-User-ID"
          - "no other TelestrokeConsult assigned to this neurologist has status == IN_SESSION"
          - "clock_now >= last_consult_completed_at + NEUROLOGIST_COOLDOWN_MIN when last_consult_completed_at != null"
        side_effects:
          - "accepted_at := clock_now; status := IN_SESSION"
          - "response_latency_seconds := calculations.clock_interval_metrics(requested_at, accepted_at)"
          - "the neurologist transitions ON_CALL -> IN_CONSULT"
          - "increments TelestrokeConsult.version by 1"
      - from: IN_SESSION
        to: COMPLETED
        trigger: "POST /stroke-network/consults/{id}/complete"
        actor: Neurologist
        preconditions:
          - "status == IN_SESSION"
          - "assigned_neurologist_id == X-User-ID"
          - "valid_video_session_count >= 1"
          - "video_sessions contains no element whose ended_at is null"
        side_effects:
          - "completed_at := clock_now; recommendation and nihss_score recorded; status := COMPLETED"
          - "the neurologist transitions IN_CONSULT -> ON_CALL, last_consult_completed_at := clock_now, completed_consult_count += 1, active_consult_count recomputed"
          - "agreement active_consult_count recomputed"
          - "increments TelestrokeConsult.version by 1"
      - from: REQUESTED
        to: CANCELLED
        trigger: "cascade from SpokeAgreement suspension, StrokeCenter suspension, or CodeStrokeCase abort"
        actor: system
        preconditions:
          - "status IN {REQUESTED, ASSIGNED, IN_SESSION}"
        side_effects:
          - "status := CANCELLED; cancellation_reason recorded"
          - "SYSTEM_DETECTED CONSULT_UNFILLED ProtocolDeviation created on the case unless the cascade originated from the case's own abort"
          - "increments TelestrokeConsult.version by 1"
      - from: ASSIGNED
        to: CANCELLED
        trigger: "cascade from SpokeAgreement suspension, StrokeCenter suspension, or CodeStrokeCase abort"
        actor: system
        preconditions:
          - "status IN {REQUESTED, ASSIGNED, IN_SESSION}"
        side_effects:
          - "status := CANCELLED; assigned_neurologist_id retained for audit; the assigned Neurologist's active_consult_count recomputed"
          - "increments TelestrokeConsult.version by 1"
      - from: IN_SESSION
        to: CANCELLED
        trigger: "cascade from SpokeAgreement suspension, StrokeCenter suspension, or CodeStrokeCase abort"
        actor: system
        preconditions:
          - "status IN {REQUESTED, ASSIGNED, IN_SESSION}"
        side_effects:
          - "status := CANCELLED; the assigned Neurologist transitions IN_CONSULT -> ON_CALL WITHOUT setting last_consult_completed_at and WITHOUT incrementing completed_consult_count"
          - "increments TelestrokeConsult.version by 1"

  - entity: ThrombolyticChecklist
    initial_state: "documentation_status=NOT_STARTED x determination_status=PENDING"
    terminal_states: []
    note: |
      PARALLEL STATE DIMENSIONS on one row. documentation_status tracks what has
      been written down; determination_status tracks the clinical verdict. They
      advance on different triggers and can hold any of the 4x4 combinations
      reachable by the transitions below. An amendment moves documentation_status
      forward to AMENDED while moving determination_status BACKWARD to PENDING —
      the two dimensions are not ordered relative to each other.
    transitions:
      - from: "documentation_status=NOT_STARTED"
        to: "documentation_status=IN_PROGRESS"
        trigger: "POST /stroke-network/checklists/{id}/inclusion-items OR POST /stroke-network/checklists/{id}/contraindications"
        actor: EdPhysician
        preconditions:
          - "documentation_status IN {NOT_STARTED, IN_PROGRESS}"
          - "the case's status NOT IN {CLOSED, ABORTED}"
        side_effects:
          - "documentation_status := IN_PROGRESS"
          - "confirmed_inclusion_item_codes or contraindications appended; the matching counts recomputed"
          - "screening_eligibility_score := calculations.eligibility_score variant SCREENING"
          - "determination_status is UNCHANGED by this transition"
          - "increments ThrombolyticChecklist.version by 1"
      - from: "documentation_status=IN_PROGRESS"
        to: "documentation_status=DOCUMENTED, determination_status=ELIGIBLE"
        trigger: "POST /stroke-network/checklists/{id}/determine"
        actor: Neurologist
        preconditions:
          - "documentation_status IN {IN_PROGRESS, AMENDED}"
          - "determination_status == PENDING"
          - "confirmed_inclusion_item_count == REQUIRED_INCLUSION_ITEM_COUNT"
          - "absolute_contraindication_count == 0"
          - "relative_contraindication_count == 0"
          - "attested_eligibility_score >= ELIGIBLE_SCORE_MIN"
          - "a TelestrokeConsult on the same case has assigned_neurologist_id == X-User-ID, status IN {IN_SESSION, COMPLETED} and valid_video_session_count >= 1"
        side_effects:
          - "attested_eligibility_score := calculations.eligibility_score variant ATTESTED; determined_at := clock_now"
          - "documentation_status := DOCUMENTED; determination_status := ELIGIBLE"
          - "CASCADE -> the case transitions CONSULT_IN_PROGRESS -> ELIGIBILITY_DETERMINED and its thrombolytic_window_class is recomputed"
          - "increments ThrombolyticChecklist.version by 1"
      - from: "documentation_status=IN_PROGRESS"
        to: "documentation_status=DOCUMENTED, determination_status=ELIGIBLE_WITH_RELATIVE_OVERRIDE"
        trigger: "POST /stroke-network/checklists/{id}/determine with override_justification"
        actor: Neurologist
        preconditions:
          - "determination_status == PENDING"
          - "confirmed_inclusion_item_count == REQUIRED_INCLUSION_ITEM_COUNT"
          - "absolute_contraindication_count == 0"
          - "relative_contraindication_count >= 1"
          - "override_justification is present and non-empty"
          - "attested_eligibility_score >= OVERRIDE_SCORE_MIN"
        side_effects:
          - "documentation_status := DOCUMENTED; determination_status := ELIGIBLE_WITH_RELATIVE_OVERRIDE"
          - "overridden_by_neurologist_id := X-User-ID; override_justification recorded"
          - "CASCADE -> the case transitions CONSULT_IN_PROGRESS -> ELIGIBILITY_DETERMINED"
          - "increments ThrombolyticChecklist.version by 1"
      - from: "documentation_status=IN_PROGRESS"
        to: "documentation_status=DOCUMENTED, determination_status=INELIGIBLE"
        trigger: "POST /stroke-network/checklists/{id}/determine"
        actor: Neurologist
        preconditions:
          - "determination_status == PENDING"
          - "confirmed_inclusion_item_count == REQUIRED_INCLUSION_ITEM_COUNT"
          - "the ATTESTED outcome ladder of calculations.eligibility_score lands on INELIGIBLE: EITHER absolute_contraindication_count > 0 (which forces INELIGIBLE regardless of the score), OR attested_eligibility_score < ELIGIBLE_SCORE_MIN and (relative_contraindication_count == 0 or attested_eligibility_score < OVERRIDE_SCORE_MIN)"
        side_effects:
          - "documentation_status := DOCUMENTED; determination_status := INELIGIBLE"
          - "CASCADE -> the case transitions CONSULT_IN_PROGRESS -> ELIGIBILITY_DETERMINED with disposition := NO_TREATMENT"
          - "increments ThrombolyticChecklist.version by 1"
      - from: "documentation_status=DOCUMENTED"
        to: "documentation_status=AMENDED, determination_status=PENDING"
        trigger: "POST /stroke-network/checklists/{id}/amend"
        actor: EdPhysician
        preconditions:
          - "documentation_status == DOCUMENTED"
          - "the case's status == ELIGIBILITY_DETERMINED (an amendment after thrombolytic administration is rejected)"
        side_effects:
          - "documentation_status := AMENDED; amendment_count += 1; last_amendment_note recorded"
          - "COMPENSATION: determination_status := PENDING, attested_eligibility_score := null, determined_at := null, overridden_by_neurologist_id := null, override_justification := null"
          - "the case's disposition is reset to PENDING but its status stays ELIGIBILITY_DETERMINED"
          - "increments ThrombolyticChecklist.version by 1"
      - from: "documentation_status=AMENDED"
        to: "documentation_status=DOCUMENTED, determination_status=ELIGIBLE|INELIGIBLE|ELIGIBLE_WITH_RELATIVE_OVERRIDE"
        trigger: "POST /stroke-network/checklists/{id}/determine"
        actor: Neurologist
        preconditions:
          - "documentation_status == AMENDED"
          - "determination_status == PENDING"
          - "the same preconditions as the IN_PROGRESS determination apply"
        side_effects:
          - "same as the IN_PROGRESS determination; the case stays in ELIGIBILITY_DETERMINED and its disposition is recomputed"
          - "increments ThrombolyticChecklist.version by 1"
      - from: "documentation_status=AMENDED"
        to: "documentation_status=AMENDED"
        trigger: "POST /stroke-network/checklists/{id}/contraindications OR POST /stroke-network/checklists/{id}/inclusion-items"
        actor: EdPhysician
        preconditions:
          - "documentation_status == AMENDED"
          - "determination_status == PENDING"
        side_effects:
          - "the appended contraindication or inclusion item is recorded; screening_eligibility_score recomputed"
          - "documentation_status stays AMENDED (it does not fall back to IN_PROGRESS)"
          - "increments ThrombolyticChecklist.version by 1"

  - entity: TransferDecision
    initial_state: PROPOSED
    terminal_states: [HANDOFF_COMPLETE, DECLINED, CANCELLED]
    transitions:
      - from: PROPOSED
        to: ACCEPTED
        trigger: "POST /stroke-network/transfer-decisions/{id}/accept"
        actor: TransferCoordinator
        preconditions:
          - "status == PROPOSED"
          - "destination center ems_routing_posture != BYPASS re-evaluated at clock_now"
          - "destination center certification_status NOT IN {SUSPENDED, WITHDRAWN}"
        side_effects:
          - "status := ACCEPTED; accepted_at := clock_now"
          - "destination center open_case_count += 1 and its ems_routing_posture recomputed"
          - "increments TransferDecision.version by 1"
      - from: PROPOSED
        to: DECLINED
        trigger: "POST /stroke-network/transfer-decisions/{id}/decline"
        actor: TransferCoordinator
        preconditions:
          - "status == PROPOSED"
        side_effects:
          - "status := DECLINED; decline_reason recorded"
          - "the case transitions TRANSFER_INITIATED back to its pre-transfer node: THROMBOLYSIS_ADMINISTERED when mode == DRIP_AND_SHIP, ELIGIBILITY_DETERMINED when mode == TRANSFER_ONLY; disposition is restored to TREATED_LOCAL or PENDING respectively"
          - "destination center open_case_count is unchanged (it was never incremented for a PROPOSED decision)"
          - "increments TransferDecision.version by 1"
      - from: ACCEPTED
        to: HANDOFF_COMPLETE
        trigger: "POST /stroke-network/transfer-decisions/{id}/complete-handoff"
        actor: TransferCoordinator
        preconditions:
          - "status == ACCEPTED"
          - "handoff_packet_items in the request contains every element of the mode-conditional required set: REQUIRED_HANDOFF_PACKET_ITEMS when mode == DRIP_AND_SHIP, that set minus HP_LYTIC_RECORD when mode == TRANSFER_ONLY"
        side_effects:
          - "CASCADE hop 1: status := HANDOFF_COMPLETE; handoff_completed_at := clock_now; handoff_packet_items recorded; handoff_packet_complete := true; door_in_door_out_minutes := calculations.clock_interval_metrics(case.door_at, handoff_completed_at)"
          - "CASCADE hop 2 (caused by hop 1): the case transitions TRANSFER_INITIATED -> CLOSED, retaining disposition DRIP_AND_SHIP or TRANSFER_ONLY"
          - "CASCADE hop 3 (caused by hop 2): the ORIGIN center open_case_count is decremented and its ems_routing_posture recomputed"
          - "CASCADE hop 4 (caused by hop 1's door_in_door_out_minutes): when door_in_door_out_minutes > DIDO_TARGET_MIN a SYSTEM_DETECTED ProtocolDeviation(deviation_type=DIDO_EXCEEDED, severity=MAJOR) is created on the case, raising deviation_count by 1"
          - "increments TransferDecision.version by 1"
      - from: PROPOSED
        to: CANCELLED
        trigger: "cascade from CodeStrokeCase abort"
        actor: system
        preconditions:
          - "the case transitions to ABORTED"
        side_effects:
          - "status := CANCELLED; cancellation_reason := 'case aborted'"
          - "increments TransferDecision.version by 1"
      - from: ACCEPTED
        to: CANCELLED
        trigger: "cascade from CodeStrokeCase abort"
        actor: system
        preconditions:
          - "the case transitions to ABORTED"
        side_effects:
          - "status := CANCELLED; destination center open_case_count decremented and its ems_routing_posture recomputed"
          - "increments TransferDecision.version by 1"

  - entity: ProtocolDeviation
    initial_state: OPEN
    terminal_states: [SUBSTANTIATED, DISMISSED]
    note: "Cyclic: UNDER_REVIEW -> RETURNED_FOR_INFO -> UNDER_REVIEW, bounded by MAX_REVIEW_ROUNDS."
    transitions:
      - from: OPEN
        to: UNDER_REVIEW
        trigger: "POST /stroke-network/deviations/{id}/start-review"
        actor: CertificationReviewer
        preconditions:
          - "status == OPEN"
          - "review_round < MAX_REVIEW_ROUNDS"
        side_effects:
          - "status := UNDER_REVIEW; review_round += 1; reviewed_by_user_id := X-User-ID"
          - "increments ProtocolDeviation.version by 1"
      - from: UNDER_REVIEW
        to: RETURNED_FOR_INFO
        trigger: "POST /stroke-network/deviations/{id}/return-for-info"
        actor: CertificationReviewer
        preconditions:
          - "status == UNDER_REVIEW"
        side_effects:
          - "status := RETURNED_FOR_INFO; info_request recorded; reviewed_by_user_id := X-User-ID"
          - "increments ProtocolDeviation.version by 1"
      - from: RETURNED_FOR_INFO
        to: UNDER_REVIEW
        trigger: "POST /stroke-network/deviations/{id}/resubmit"
        actor: QualityAbstractor
        preconditions:
          - "status == RETURNED_FOR_INFO"
          - "review_round < MAX_REVIEW_ROUNDS"
        side_effects:
          - "status := UNDER_REVIEW; review_round += 1; additional_info recorded"
          - "increments ProtocolDeviation.version by 1"
        note: "Loop edge. The MAX_REVIEW_ROUNDS guard makes the cycle terminate: the fourth entry attempt is rejected with ERR_REVIEW_ROUND_LIMIT."
      - from: UNDER_REVIEW
        to: SUBSTANTIATED
        trigger: "POST /stroke-network/deviations/{id}/decide with outcome=SUBSTANTIATE"
        actor: CertificationReviewer
        preconditions:
          - "status == UNDER_REVIEW"
        side_effects:
          - "status := SUBSTANTIATED; reviewed_by_user_id := X-User-ID (debrief_completed and debrief_summary are written by POST /stroke-network/deviations/{id}/debrief, never here)"
          - "every CertificationReport in status IN {DRAFT, RETURNED} whose center_id == the case's center_id and whose period contains the case's door_at has substantiated_major_count / substantiated_sentinel_count recomputed; composite_certification_score is NOT recomputed here because it is only ever produced at submission"
          - "increments ProtocolDeviation.version by 1"
      - from: UNDER_REVIEW
        to: DISMISSED
        trigger: "POST /stroke-network/deviations/{id}/decide with outcome=DISMISS"
        actor: CertificationReviewer
        preconditions:
          - "status == UNDER_REVIEW"
        side_effects:
          - "status := DISMISSED; reviewed_by_user_id := X-User-ID"
          - "the case's deviation_count is decremented because DISMISSED rows leave the deviation_count filter"
          - "increments ProtocolDeviation.version by 1"

  - entity: QualityMeasureAbstraction
    initial_state: DRAFT
    terminal_states: [RETRACTED]
    transitions:
      - from: DRAFT
        to: FINALIZED
        trigger: "POST /stroke-network/abstractions/{id}/finalize"
        actor: QualityAbstractor
        preconditions:
          - "status == DRAFT"
          - "the case's status IN {CLOSED, ABORTED}"
          - "X-User-ID != abstracted_by_user_id (segregation of duties)"
        side_effects:
          - "status := FINALIZED; variant := CERTIFIED; attested_by_user_id := X-User-ID; attestation_note recorded"
          - "numerator_flag, denominator_included and exclusion_reason recomputed under the CERTIFIED variant of calculations.abstraction_numerator_denominator"
          - "CASCADE: when report_id != null, that report's included_abstraction_count and its three rate fields are recomputed under whichever variant its current rate_variant names"
          - "increments QualityMeasureAbstraction.version by 1"
      - from: FINALIZED
        to: RETRACTED
        trigger: "POST /stroke-network/abstractions/{id}/retract"
        actor: QualityAbstractor
        preconditions:
          - "status == FINALIZED"
          - "when report_id != null, that report's status IN {DRAFT, RETURNED}"
        side_effects:
          - "status := RETRACTED; retraction_reason recorded"
          - "COMPENSATION: when report_id != null, that report's included_abstraction_count, dtn_60_compliance_pct, dti_45_compliance_pct, telestroke_response_compliance_pct and composite_certification_score are recomputed, and report_id := null"
          - "increments QualityMeasureAbstraction.version by 1"
      - from: DRAFT
        to: RETRACTED
        trigger: "POST /stroke-network/abstractions/{id}/retract"
        actor: QualityAbstractor
        preconditions:
          - "status == DRAFT"
        side_effects:
          - "status := RETRACTED; retraction_reason recorded; no report counters change because report_id is null"
          - "increments QualityMeasureAbstraction.version by 1"

  - entity: CertificationReport
    initial_state: DRAFT
    terminal_states: [PUBLISHED, SUPERSEDED]
    note: "Cyclic on SUBMITTED <-> RETURNED: a returned report can be resubmitted through the same submit endpoint."
    transitions:
      - from: DRAFT
        to: SUBMITTED
        trigger: "POST /stroke-network/certification-reports/{id}/submit"
        actor: ProgramCoordinator
        preconditions:
          - "status == DRAFT"
          - "at least one QualityMeasureAbstraction with status == FINALIZED exists on a case counted in closed_case_count_in_period"
        side_effects:
          - "status := SUBMITTED; submitted_at := clock_now; submitted_by_user_id := X-User-ID"
          - "every abstraction still attached to this report whose status is DRAFT is DETACHED (report_id := null); every FINALIZED QualityMeasureAbstraction on an in-period closed case is attached (report_id := this report's id); included_abstraction_count recomputed"
          - "rate_variant := CERTIFIED; the three rate fields recomputed under the CERTIFIED variant of calculations.measure_compliance_rate"
          - "substantiated_major_count and substantiated_sentinel_count recomputed; composite_certification_score := calculations.composite_certification_score"
          - "increments CertificationReport.version by 1"
      - from: RETURNED
        to: SUBMITTED
        trigger: "POST /stroke-network/certification-reports/{id}/submit"
        actor: ProgramCoordinator
        preconditions:
          - "status == RETURNED"
        side_effects:
          - "same as DRAFT -> SUBMITTED; decision is reset to PENDING and decided_by_user_id to null before recomputation"
          - "increments CertificationReport.version by 1"
      - from: SUBMITTED
        to: ACCEPTED
        trigger: "POST /stroke-network/certification-reports/{id}/decide when composite_certification_score >= CERT_SCORE_CONDITIONAL_MIN"
        actor: CertificationReviewer
        preconditions:
          - "status == SUBMITTED"
          - "X-User-ID != submitted_by_user_id (segregation of duties)"
        side_effects:
          - "status := ACCEPTED; decided_at := clock_now; decided_by_user_id := X-User-ID"
          - "decision := CERTIFIED when composite_certification_score >= CERT_SCORE_CERTIFIED_MIN else CONDITIONAL"
          - "CASCADE: the center's certification_status is set from decision, its consecutive_denied_report_count reset to 0, and its ems_routing_posture recomputed"
          - "increments CertificationReport.version by 1"
      - from: SUBMITTED
        to: RETURNED
        trigger: "POST /stroke-network/certification-reports/{id}/decide when composite_certification_score < CERT_SCORE_CONDITIONAL_MIN"
        actor: CertificationReviewer
        preconditions:
          - "status == SUBMITTED"
          - "X-User-ID != submitted_by_user_id (segregation of duties)"
        side_effects:
          - "status := RETURNED; decision := DENIED; decided_at := clock_now; decided_by_user_id := X-User-ID"
          - "CASCADE hop 1: the center's consecutive_denied_report_count += 1 and its certification_status moves to SUSPENDED (or to WITHDRAWN when it was already SUSPENDED with consecutive_denied_report_count == 1)"
          - "CASCADE hop 2 (caused by hop 1): the center's ems_routing_posture := BYPASS"
          - "CASCADE hop 3 (caused by hop 1): every ACTIVE SpokeAgreement hubbed at that center transitions to SUSPENDED, which cancels its live consults and releases the assigned neurologists"
          - "increments CertificationReport.version by 1"
      - from: ACCEPTED
        to: PUBLISHED
        trigger: "POST /stroke-network/certification-reports/{id}/publish"
        actor: ProgramCoordinator
        preconditions:
          - "status == ACCEPTED"
          - "decision IN {CERTIFIED, CONDITIONAL}"
        side_effects:
          - "status := PUBLISHED; published_at := clock_now"
          - "the center's public_dtn_compliance_pct := calculations.public_dtn_rollup and public_report_published_at := clock_now"
          - "increments CertificationReport.version by 1"
      - from: DRAFT
        to: SUPERSEDED
        trigger: "POST /stroke-network/certification-reports (a newer DRAFT report is created for the same center)"
        actor: ProgramCoordinator
        preconditions:
          - "status == DRAFT"
          - "the new report's center_id equals this report's center_id"
        side_effects:
          - "status := SUPERSEDED; superseded_by_report_id := the new report's id"
          - "every QualityMeasureAbstraction whose report_id == this report's id has report_id := null"
          - "increments CertificationReport.version by 1"
        note: "This supersede semantics is what makes the create-with-supersede OCC rule in §1.2.1 a genuine race rather than a state precondition."

# ============================================================================
# §1.2.1 Concurrency Rules — OCC on the parent's `version` only
# ============================================================================

concurrency_rules:
  - rule_id: consult-request-stale-case
    parent_entity: CodeStrokeCase
    write_endpoint: "POST /stroke-network/consults"
    occ_field: "expected_case_version"
    description: |
      Requesting a TelestrokeConsult against a CodeStrokeCase whose version has
      advanced since the requester last observed it is rejected. A new consult
      request legitimately supersedes any prior REQUESTED consult on the same
      case, so a requester holding a stale view of the case would otherwise
      discard a routing assignment another writer has already produced; the
      stale-version check turns that into a deterministic rejection.
    error_id: ERR_STALE_CASE_VERSION
    http_status: 412

  - rule_id: report-create-stale-center
    parent_entity: StrokeCenter
    write_endpoint: "POST /stroke-network/certification-reports"
    occ_field: "expected_center_version"
    description: |
      Creating a CertificationReport for a StrokeCenter whose version has
      advanced since the coordinator last observed it is rejected. Creating a
      report legitimately supersedes the center's prior DRAFT report (moving it
      to SUPERSEDED and detaching its abstractions), so a coordinator working
      from a stale view of the center would silently discard a report period
      another writer has just opened.
    error_id: ERR_STALE_CENTER_VERSION
    http_status: 412

# ============================================================================
# §1.3 Calculation Rules Table
# ============================================================================

calculations:

  - name: clock_interval_metrics
    description: |
      Derives the three stroke clocks on a CodeStrokeCase from logical-clock
      instants. Every interval is expressed in whole minutes obtained by
      integer floor division of the elapsed second count by 60 — never by
      rounding and never by subtracting calendar minute fields.
    algorithm_type: chronological
    formula: |
      elapsed_seconds(a, b) = (b - a) expressed in whole seconds (both are
                              logical-clock UTC instants)

      door_to_imaging_minutes = floor(elapsed_seconds(door_at, imaging_at) / 60)
        computed on POST /stroke-network/code-strokes/{id}/imaging-complete,
        where imaging_at := clock_now. Recomputed on a repeat
        imaging-complete call (the self-loop) so the LAST imaging instant wins.

      door_to_needle_minutes = floor(elapsed_seconds(door_at, needle_at) / 60)
        computed on POST /stroke-network/code-strokes/{id}/administer-thrombolytic,
        where needle_at := clock_now.

      lkw_to_needle_minutes = floor(elapsed_seconds(last_known_well_at, needle_at) / 60)
        computed at the same moment; null when lkw_precision == UNKNOWN_WAKE_UP
        (last_known_well_at is null in that case).

      response_latency_seconds (TelestrokeConsult) =
        elapsed_seconds(requested_at, accepted_at) at whole-second resolution,
        NOT floored to minutes.
    input_set: "the single CodeStrokeCase row (or TelestrokeConsult row) being written"
    constants:
      DTI_TARGET_MIN: 45
      DTN_TARGET_MIN: 60
      TELESTROKE_RESPONSE_TARGET_SEC: 300
    precision: "integer minutes via floor division; response_latency_seconds is an integer second count"
    edge_cases:
      - "elapsed_seconds == 0 (same logical instant) yields 0 minutes, not null"
      - "59 seconds yields 0 minutes; 60 seconds yields 1 minute; 119 seconds yields 1 minute"
      - "imaging-complete called twice overwrites imaging_at and door_to_imaging_minutes with the later values"
      - "lkw_to_needle_minutes stays null for UNKNOWN_WAKE_UP cases even after a needle is recorded"

  - name: thrombolytic_window_classification
    description: |
      Classifies a CodeStrokeCase into a thrombolytic time window. Three
      distinct precision regimes feed one classifier: EXACT uses the raw
      last-known-well elapsed minutes, ESTIMATED inflates them by a fixed
      safety margin before comparison, and UNKNOWN_WAKE_UP abandons the
      last-known-well axis entirely and classifies on door elapsed instead.
      Recomputed at every checklist determination and at thrombolytic
      administration, using the logical clock at that moment.
    algorithm_type: threshold
    formula: |
      evaluation_instant = clock_now at the moment of the triggering write

      if lkw_precision == UNKNOWN_WAKE_UP:
          door_elapsed_min = floor(elapsed_seconds(door_at, evaluation_instant) / 60)
          thrombolytic_window_class =
              EXTENDED_UNKNOWN   if door_elapsed_min <= WAKEUP_DOOR_WINDOW_MIN
              OUT_OF_WINDOW      otherwise
      else:
          raw_elapsed_min = floor(elapsed_seconds(last_known_well_at, evaluation_instant) / 60)
          effective_elapsed_min = raw_elapsed_min                            if lkw_precision == EXACT
                                = raw_elapsed_min + LKW_ESTIMATE_MARGIN_MIN  if lkw_precision == ESTIMATED
          thrombolytic_window_class =
              WITHIN_3H      if effective_elapsed_min <= LKW_WINDOW_STANDARD_MIN
              WITHIN_4_5H    if LKW_WINDOW_STANDARD_MIN < effective_elapsed_min <= LKW_WINDOW_EXTENDED_MIN
              OUT_OF_WINDOW  if effective_elapsed_min > LKW_WINDOW_EXTENDED_MIN
    input_set: "the single CodeStrokeCase row being evaluated"
    constants:
      LKW_WINDOW_STANDARD_MIN: 180
      LKW_WINDOW_EXTENDED_MIN: 270
      LKW_ESTIMATE_MARGIN_MIN: 30
      WAKEUP_DOOR_WINDOW_MIN: 120
    precision: "integer minute comparisons; all boundaries are inclusive on the lower-numbered class (<=)"
    edge_cases:
      - "effective_elapsed_min exactly 180 -> WITHIN_3H (not WITHIN_4_5H)"
      - "effective_elapsed_min exactly 181 -> WITHIN_4_5H"
      - "effective_elapsed_min exactly 270 -> WITHIN_4_5H (not OUT_OF_WINDOW)"
      - "effective_elapsed_min exactly 271 -> OUT_OF_WINDOW"
      - "ESTIMATED with raw_elapsed_min == 150 -> effective 180 -> WITHIN_3H, while raw 151 -> effective 181 -> WITHIN_4_5H; the same raw minutes under EXACT would both be WITHIN_3H"
      - "UNKNOWN_WAKE_UP with door_elapsed_min exactly 120 -> EXTENDED_UNKNOWN; 121 -> OUT_OF_WINDOW"
      - "UNKNOWN_WAKE_UP never yields WITHIN_3H or WITHIN_4_5H regardless of how recent the door instant is"

  - name: eligibility_score
    description: |
      Scores a ThrombolyticChecklist for thrombolytic eligibility. DUAL VARIANT.
      The SCREENING variant is recomputed on every inclusion-item and
      contraindication write and is written to screening_eligibility_score; it
      deliberately ignores the time window and the neurologist's board status
      because neither is knowable while the bedside team is still documenting.
      The ATTESTED variant runs only inside
      POST /stroke-network/checklists/{id}/determine, is written to
      attested_eligibility_score, and adds a window penalty plus a
      board-certification credit. Both variants read the SAME checklist row, so
      for any checklist whose case is not WITHIN_3H or whose attesting
      neurologist is not board certified the two stored scores DIFFER, and the
      determination_status is derived from the ATTESTED score only.
    algorithm_type: weighted_scoring
    variants:
      SCREENING:
        applies_when: "recomputed synchronously on POST /stroke-network/checklists/{id}/inclusion-items and POST /stroke-network/checklists/{id}/contraindications; stored in screening_eligibility_score"
        formula: |
          item_credit      = INCLUSION_ITEM_POINTS * confirmed_inclusion_item_count
          relative_penalty = RELATIVE_CONTRAINDICATION_PENALTY * relative_contraindication_count
          absolute_penalty = ABSOLUTE_CONTRAINDICATION_PENALTY * absolute_contraindication_count
          raw = item_credit - relative_penalty - absolute_penalty
          screening_eligibility_score = round(max(0.0, min(100.0, raw)), 2)
      ATTESTED:
        applies_when: "computed once per POST /stroke-network/checklists/{id}/determine call; stored in attested_eligibility_score"
        formula: |
          item_credit      = INCLUSION_ITEM_POINTS * confirmed_inclusion_item_count
          relative_penalty = RELATIVE_CONTRAINDICATION_PENALTY * relative_contraindication_count
          absolute_penalty = ABSOLUTE_CONTRAINDICATION_PENALTY * absolute_contraindication_count
          window_penalty   = WINDOW_PENALTY_BY_CLASS[case.thrombolytic_window_class]
                             (the class is recomputed by
                              calculations.thrombolytic_window_classification
                              in the same request, BEFORE this variant runs)
          board_credit     = BOARD_CERTIFIED_CREDIT if the acting Neurologist has
                             board_certified == true, else 0.0
          raw = item_credit - relative_penalty - absolute_penalty
                            - window_penalty + board_credit
          attested_eligibility_score = round(max(0.0, min(100.0, raw)), 2)
    formula: |
      Both variants share the item/contraindication core and the clamp; only
      ATTESTED applies window_penalty and board_credit. Neither variant is ever
      recomputed retroactively: screening_eligibility_score keeps its last
      documentation-time value after determination, so the two fields coexist
      with different values on the same row.

      Determination outcome, derived from the ATTESTED score ONLY:
        determination_status =
          INELIGIBLE                        if absolute_contraindication_count > 0
          INELIGIBLE                        if attested_eligibility_score < OVERRIDE_SCORE_MIN
          ELIGIBLE                          if relative_contraindication_count == 0
                                            AND attested_eligibility_score >= ELIGIBLE_SCORE_MIN
          ELIGIBLE_WITH_RELATIVE_OVERRIDE   if relative_contraindication_count > 0
                                            AND attested_eligibility_score >= OVERRIDE_SCORE_MIN
                                            AND override_justification is present
          INELIGIBLE                        otherwise
    input_set: "the single ThrombolyticChecklist row, its CodeStrokeCase (ATTESTED only), and the acting Neurologist (ATTESTED only)"
    constants:
      INCLUSION_ITEM_POINTS: 15.0
      RELATIVE_CONTRAINDICATION_PENALTY: 12.0
      ABSOLUTE_CONTRAINDICATION_PENALTY: 100.0
      BOARD_CERTIFIED_CREDIT: 6.0
      WINDOW_PENALTY_BY_CLASS:
        WITHIN_3H: 0.0
        WITHIN_4_5H: 8.0
        EXTENDED_UNKNOWN: 15.0
        OUT_OF_WINDOW: 100.0
      REQUIRED_INCLUSION_ITEM_COUNT: 4
      REQUIRED_INCLUSION_ITEM_CODES: [INC_ONSET_CONFIRMED, INC_NIHSS_RECORDED, INC_BP_CONTROLLED, INC_ANTICOAG_REVIEWED]
      ELIGIBLE_SCORE_MIN: 55.0
      OVERRIDE_SCORE_MIN: 40.0
    precision: "2 decimal places, round_half_up, applied AFTER the 0..100 clamp"
    edge_cases:
      - "4 confirmed items, no contraindications, WITHIN_3H, board certified: SCREENING 60.00 and ATTESTED 66.00 -> ELIGIBLE"
      - "4 confirmed items, no contraindications, WITHIN_4_5H, NOT board certified: SCREENING 60.00 and ATTESTED 52.00 -> INELIGIBLE (the delta of 8.00 is the whole decision)"
      - "4 confirmed items, 1 relative contraindication, WITHIN_3H, board certified, override_justification supplied: SCREENING 48.00 and ATTESTED 54.00 -> ELIGIBLE_WITH_RELATIVE_OVERRIDE (54.00 < ELIGIBLE_SCORE_MIN but >= OVERRIDE_SCORE_MIN)"
      - "1 absolute contraindication drives raw negative; the clamp yields 0.00 rather than a negative score, and INELIGIBLE is forced by the absolute count regardless of the score"
      - "attested_eligibility_score exactly 55.00 with zero relative contraindications -> ELIGIBLE; exactly 54.99 -> INELIGIBLE"
      - "attested_eligibility_score exactly 40.00 with one relative contraindication and a justification -> ELIGIBLE_WITH_RELATIVE_OVERRIDE; exactly 39.99 -> INELIGIBLE"
      - "screening_eligibility_score is never overwritten by determination, so the stored pair can differ permanently"

  - name: video_session_validity
    description: |
      Grades each appended video session record on a TelestrokeConsult and
      maintains the consult's valid_video_session_count. A consult may not be
      completed without at least one valid session, which is what makes this a
      gate rather than a statistic.
    algorithm_type: threshold
    formula: |
      duration_seconds = floor(elapsed_seconds(started_at, ended_at) / 1)
      session_valid = (duration_seconds >= MIN_VALID_SESSION_SEC)
                      AND (video_quality != AUDIO_ONLY)
                      AND (disconnect_count <= MAX_SESSION_DISCONNECTS)
      valid_video_session_count = count of elements of video_sessions with
                                  session_valid == true
    input_set: "the video_sessions array on the single TelestrokeConsult row"
    constants:
      MIN_VALID_SESSION_SEC: 180
      MAX_SESSION_DISCONNECTS: 2
    precision: "integer second comparison; the duration boundary is inclusive (>=)"
    edge_cases:
      - "duration_seconds exactly 180 with HD quality and 0 disconnects -> valid"
      - "duration_seconds exactly 179 -> invalid regardless of quality"
      - "duration_seconds 600 with video_quality AUDIO_ONLY -> invalid"
      - "duration_seconds 600 with SD quality and disconnect_count 2 -> valid; disconnect_count 3 -> invalid"
      - "an invalid session appended after a valid one does not decrement valid_video_session_count"

  - name: consult_routing_selection
    description: |
      SELECTOR. Chooses which Neurologist a new or re-routed TelestrokeConsult
      is assigned to. Runs inside POST /stroke-network/consults (initial pass)
      and inside POST /stroke-network/consults/{id}/decline (re-routing pass).
      The eligibility filter, the ranking expression, the tie-break and the
      empty-pool fallback are all fully specified; nothing is left to
      implementation choice, and the candidate `id` value is never consulted.
    algorithm_type: constraint_propagation
    formula: |
      STEP 1 — ELIGIBILITY FILTER. A Neurologist n is a candidate if and only if
      ALL of the following hold, evaluated against the consult's SpokeAgreement
      a (= consult.agreement_id) and the consult's CodeStrokeCase c:
        (1) n.home_center_id == a.hub_center_id
        (2) n.on_call_state == ON_CALL
        (3) n.active_consult_count < n.concurrent_consult_limit
        (4) c's center StrokeCenter.state_code is an element of n.licensed_state_codes
        (5) a.proxy_credentials contains an element p with
              p.neurologist_id == n.id
              AND p.status == GRANTED
              AND p.expires_at > clock_now                (strictly greater)
              AND ( p.privilege_scope == consult.requested_privilege_scope
                    OR p.privilege_scope == CONSULT_AND_THROMBOLYSIS )
        (6) n.id is NOT an element of consult.excluded_neurologist_ids
        (7) n.board_certified == true, UNLESS a.coverage_tier == TIER_2_CONSULT_ONLY,
            in which case this clause is waived entirely
        (8) n.last_consult_completed_at is null
            OR floor(elapsed_seconds(n.last_consult_completed_at, clock_now) / 60)
               >= NEUROLOGIST_COOLDOWN_MIN
      STEP 2 — RANKING. Order the candidate set by:
        n.roster_rank ASC,
        then n.active_consult_count ASC,
        then n.completed_consult_count ASC,
        then n.created_at ASC
      and take the first element. `id` is NEVER part of the ordering.
      STEP 3 — EMPTY-POOL FALLBACK. If the candidate set is empty the consult is
      NOT rejected: status := ESCALATED_UNFILLED, assigned_neurologist_id stays
      null, routing_attempt_count is still incremented, and a SYSTEM_DETECTED
      ProtocolDeviation of type CONSULT_UNFILLED with severity MAJOR is opened
      on the case.
    input_set: "all Neurologist rows, filtered by STEP 1 against the consult's SpokeAgreement and CodeStrokeCase"
    constants:
      NEUROLOGIST_COOLDOWN_MIN: 10
      CONSULT_DECLINE_LIMIT: 3
    precision: "integer comparisons only; the cooldown boundary is inclusive (>=)"
    edge_cases:
      - "two candidates with equal roster_rank: the one with the lower active_consult_count wins"
      - "equal roster_rank AND equal active_consult_count AND equal completed_consult_count: created_at ASC decides"
      - "a candidate whose proxy credential expires_at == clock_now exactly is NOT eligible (strict >)"
      - "a CONSULT_ONLY credential cannot satisfy a CONSULT_AND_THROMBOLYSIS request, but a CONSULT_AND_THROMBOLYSIS credential satisfies a CONSULT_ONLY request"
      - "a non-board-certified neurologist is eligible on a TIER_2_CONSULT_ONLY agreement and ineligible on a TIER_1_FULL agreement, all else equal"
      - "last_consult_completed_at exactly NEUROLOGIST_COOLDOWN_MIN minutes ago -> eligible; 9 minutes ago -> not eligible"
      - "the re-routing pass excludes the declining neurologist because decline appends their id to excluded_neurologist_ids BEFORE the selector runs"
      - "empty candidate pool on the initial pass -> ESCALATED_UNFILLED, not a 4xx error"

  - name: ems_routing_posture
    description: |
      Derives a StrokeCenter's published EMS routing advisory. Recomputed at the
      end of every write that can change certification_status, either readiness
      flag, or open_case_count. The clauses are ordered and the FIRST matching
      clause wins, so a suspended center with a low case count is still BYPASS.
    algorithm_type: threshold
    formula: |
      ems_routing_posture =
        BYPASS           if certification_status IN {SUSPENDED, WITHDRAWN}
                         OR equipment_readiness_posture == OFFLINE
        DIVERT_ADVISORY  else if equipment_readiness_posture == DEGRADED
                         OR open_case_count >= OPEN_CASE_DIVERT_THRESHOLD
                         OR certification_status == CONDITIONAL
        ROUTINE          otherwise
    input_set: "the single StrokeCenter row after all other side effects of the triggering write have been applied"
    constants:
      OPEN_CASE_DIVERT_THRESHOLD: 3
    precision: "integer comparison; the threshold boundary is inclusive (>=)"
    edge_cases:
      - "open_case_count exactly 2 on a CERTIFIED READY center -> ROUTINE; exactly 3 -> DIVERT_ADVISORY"
      - "a SUSPENDED center with open_case_count 0 and posture READY -> BYPASS (clause order)"
      - "a CERTIFIED center with exactly one readiness flag false -> DIVERT_ADVISORY; both false -> BYPASS"
      - "a CONDITIONAL center with open_case_count 0 and posture READY -> DIVERT_ADVISORY"
      - "closing the third open case drops open_case_count to 2 and returns the posture to ROUTINE in the same request"

  - name: projected_door_in_door_out
    description: |
      COMBINATORIAL — MODE (c) SEQUENCING. Projects the door-in-door-out minutes
      for a proposed TransferDecision. The same three operations (read the
      destination's congestion posture, apply the congestion multiplier, add the
      fixed handoff overheads) yield different answers in different orders, so
      the order is pinned here and MUST NOT be rearranged.
    algorithm_type: projection
    formula: |
      PINNED STEP ORDER — POST /stroke-network/transfer-decisions:

      STEP 1  Read destination_posture_at_proposal :=
              destination StrokeCenter.ems_routing_posture AS IT STANDS NOW,
              i.e. BEFORE this TransferDecision row exists and therefore before
              any later acceptance of it can raise the destination's
              open_case_count. This snapshot is frozen on the row and is never
              refreshed, not even when the destination's posture later changes.

      STEP 2  congestion_factor := CONGESTION_BY_POSTURE[destination_posture_at_proposal]

      STEP 3  adjusted_transport_minutes := ceil(transport_eta_minutes * congestion_factor)
              The congestion multiplier applies to the TRANSPORT LEG ONLY and the
              ceiling is taken on that product alone.

      STEP 4  projected_door_in_door_out_minutes :=
                adjusted_transport_minutes
                + HANDOFF_PREP_MIN
                + (DRIP_AND_SHIP_EXTRA_MIN if mode == DRIP_AND_SHIP else 0)
              The fixed overheads are added AFTER the multiplication and are
              NEVER multiplied by congestion_factor.

      FORBIDDEN ALTERNATIVE ORDERS — each produces a different integer:
        (i)   ceil((transport_eta_minutes + HANDOFF_PREP_MIN + extra) * congestion_factor)
              — multiplying the overheads as well
        (ii)  ceil(transport_eta_minutes) * congestion_factor rounded at the end
              — deferring the ceiling past the multiplication
        (iii) reading the destination posture after counting this proposal
              — which flips ROUTINE to DIVERT_ADVISORY at the threshold
    input_set: "the destination StrokeCenter row plus the TransferDecision request body"
    constants:
      CONGESTION_BY_POSTURE:
        ROUTINE: 1.00
        DIVERT_ADVISORY: 1.25
      HANDOFF_PREP_MIN: 20
      DRIP_AND_SHIP_EXTRA_MIN: 10
      DIDO_TARGET_MIN: 120
    precision: "congestion_factor 2 decimal places; adjusted_transport_minutes and the projection are integers via ceil on the transport product only"
    edge_cases:
      - "ROUTINE destination, transport_eta_minutes 35, mode DRIP_AND_SHIP: adjusted 35, projection 65"
      - "DIVERT_ADVISORY destination, transport_eta_minutes 35, mode DRIP_AND_SHIP: adjusted ceil(43.75) = 44, projection 74 — the forbidden order (i) would give 82"
      - "DIVERT_ADVISORY destination, transport_eta_minutes 35, mode TRANSFER_ONLY: projection 64"
      - "transport_eta_minutes 40 with congestion 1.25 gives an exact 50.0 product, so ceil is a no-op and the projection is 70 for TRANSFER_ONLY"
      - "a destination whose ems_routing_posture is BYPASS never reaches this calculation; the proposal is rejected by validation first, so destination_posture_at_proposal only ever holds ROUTINE or DIVERT_ADVISORY"

  - name: handoff_settlement_sequence
    description: |
      COMBINATORIAL — MODE (c) SEQUENCING. Settles a drip-and-ship or
      transfer-only handoff. Seven operations must run in exactly this order:
      measuring the realised clock BEFORE the case closes, closing the case and
      the transfer row, releasing BOTH centers' open-case counts, and only THEN
      re-deriving the two EMS postures and raising any deviation. Recomputing a
      posture before the releases, or measuring the clock after the close,
      changes the observable result.
    algorithm_type: chronological
    formula: |
      PINNED STEP ORDER — POST /stroke-network/transfer-decisions/{id}/complete-handoff:

      STEP 1  door_in_door_out_minutes :=
                floor(elapsed_seconds(case.door_at, clock_now) / 60)
              measured while the case is still TRANSFER_INITIATED.
      STEP 2  handoff_packet_complete :=
                every element of required_packet_items(mode) is present in
                handoff_packet_items, where
                  required_packet_items(DRIP_AND_SHIP) = REQUIRED_HANDOFF_PACKET_ITEMS
                  required_packet_items(TRANSFER_ONLY) =
                      REQUIRED_HANDOFF_PACKET_ITEMS minus {HP_LYTIC_RECORD}
      STEP 3  TransferDecision.status := HANDOFF_COMPLETE, handoff_completed_at := clock_now
      STEP 4  case.status := CLOSED and
              case.disposition := DRIP_AND_SHIP if mode == DRIP_AND_SHIP else TRANSFER_ONLY
      STEP 5  origin StrokeCenter.open_case_count is recomputed (the case is no
              longer open) and destination StrokeCenter.open_case_count is
              recomputed (the transfer row is no longer ACCEPTED). BOTH releases
              happen before any posture is re-derived.
      STEP 6  origin.ems_routing_posture := calculations.ems_routing_posture, then
              destination.ems_routing_posture := calculations.ems_routing_posture,
              each evaluated against the counts written in STEP 5.
      STEP 7  if door_in_door_out_minutes > DIDO_TARGET_MIN then a SYSTEM_DETECTED
              ProtocolDeviation of type DIDO_EXCEEDED and severity MAJOR is opened
              on the case and case.deviation_count is incremented — using the
              STEP 1 value, never a value re-measured after STEP 4.

      FORBIDDEN ALTERNATIVE ORDERS:
        (i)  re-deriving either posture between the two releases in STEP 5 — a
             center sitting at exactly OPEN_CASE_DIVERT_THRESHOLD would remain
             DIVERT_ADVISORY instead of returning to ROUTINE
        (ii) evaluating STEP 7 before STEP 1, i.e. against a null clock
        (iii) closing the case (STEP 4) before measuring the clock (STEP 1)
    input_set: "the TransferDecision row, its CodeStrokeCase, and both the origin and destination StrokeCenter rows"
    constants:
      REQUIRED_HANDOFF_PACKET_ITEMS: [HP_IMAGING_DISC, HP_LYTIC_RECORD, HP_NIHSS, HP_CONSENT]
      DIDO_TARGET_MIN: 120
    precision: "integer minutes via floor division; the DIDO deviation threshold is strict (>)"
    edge_cases:
      - "door_in_door_out_minutes exactly 120 raises NO deviation; 121 raises one"
      - "a TRANSFER_ONLY handoff with only HP_IMAGING_DISC, HP_NIHSS and HP_CONSENT is complete; the same three items on a DRIP_AND_SHIP handoff are incomplete"
      - "after STEP 5 both centers can change posture in the same request, and the response must show both new postures"
      - "a destination that was at open_case_count 3 (DIVERT_ADVISORY) returns to ROUTINE in this same request once the transfer row stops counting"

  - name: abstraction_numerator_denominator
    description: |
      Evaluates a QualityMeasureAbstraction against its CodeStrokeCase to set
      numerator_flag, exclusion_reason and denominator_included. DUAL VARIANT:
      a DRAFT abstraction records the exclusion it detected but still counts
      itself in the denominator (PROVISIONAL), while finalising it re-evaluates
      everything and honours the exclusion (CERTIFIED). The exclusion clauses
      are ORDERED and the first match wins.
    algorithm_type: threshold
    variants:
      PROVISIONAL:
        applies_when: "abstraction status == DRAFT, i.e. at POST /stroke-network/abstractions and while the row stays DRAFT"
        formula: |
          numerator_flag    := numerator_for(measure_code)   (see formula below)
          exclusion_reason  := first_matching_exclusion()     (recorded but NOT applied)
          denominator_included := true      UNCONDITIONALLY
          variant := PROVISIONAL
      CERTIFIED:
        applies_when: "abstraction status becomes FINALIZED via POST /stroke-network/abstractions/{id}/finalize; everything is re-evaluated against the case as it stands at finalisation"
        formula: |
          numerator_flag    := numerator_for(measure_code)    (re-evaluated)
          exclusion_reason  := first_matching_exclusion()     (re-evaluated)
          denominator_included := (exclusion_reason == NONE)
          variant := CERTIFIED
    formula: |
      numerator_for(measure_code), against the abstraction's CodeStrokeCase c:
        STK_DTI_45                 -> c.door_to_imaging_minutes != null
                                      AND c.door_to_imaging_minutes <= DTI_TARGET_MIN
        STK_DTN_60                 -> c.door_to_needle_minutes != null
                                      AND c.door_to_needle_minutes <= DTN_TARGET_MIN
        STK_4_THROMBOLYTIC_THERAPY -> c.needle_at != null
        STK_TELESTROKE_RESPONSE    -> there exists a TelestrokeConsult t with
                                        t.case_id == c.id
                                        AND t.status == COMPLETED
                                        AND t.response_latency_seconds != null
                                        AND t.response_latency_seconds <= TELESTROKE_RESPONSE_TARGET_SEC
                                        AND t.valid_video_session_count >= 1

      first_matching_exclusion(), evaluated in THIS order against c and its
      ThrombolyticChecklist k (absolute_contraindication_count is treated as 0
      when no checklist exists for the case):
        1. ABORTED_CASE                         if c.status == ABORTED
        2. DOCUMENTED_ABSOLUTE_CONTRAINDICATION if k.absolute_contraindication_count > 0
        3. OUT_OF_WINDOW                        if c.thrombolytic_window_class == OUT_OF_WINDOW
        4. TRANSFER_ONLY                        if c.disposition == TRANSFER_ONLY
        5. NONE
    input_set: "the single QualityMeasureAbstraction row, its CodeStrokeCase, that case's ThrombolyticChecklist, and that case's TelestrokeConsult rows"
    constants:
      DTI_TARGET_MIN: 45
      DTN_TARGET_MIN: 60
      TELESTROKE_RESPONSE_TARGET_SEC: 300
    precision: "boolean and enum outputs only; the two minute thresholds and the second threshold are inclusive (<=)"
    edge_cases:
      - "door_to_imaging_minutes exactly 45 -> numerator true; exactly 46 -> false"
      - "door_to_needle_minutes exactly 60 -> numerator true; exactly 61 -> false"
      - "response_latency_seconds exactly 300 with one valid video session -> numerator true; 301 -> false"
      - "response_latency_seconds 120 but valid_video_session_count 0 -> numerator false (the session gate is part of the numerator)"
      - "an ABORTED case with an absolute contraindication documented yields ABORTED_CASE, not DOCUMENTED_ABSOLUTE_CONTRAINDICATION (clause order)"
      - "a TRANSFER_ONLY case whose window is OUT_OF_WINDOW yields OUT_OF_WINDOW (clause order)"
      - "a DRAFT abstraction on a TRANSFER_ONLY case reports exclusion_reason TRANSFER_ONLY with denominator_included true; finalising the same row flips denominator_included to false without changing exclusion_reason"

  - name: measure_compliance_rate
    description: |
      Computes the three published measure rates on a CertificationReport. DUAL
      VARIANT. The PROVISIONAL variant runs while the report is DRAFT and pools
      every attached abstraction regardless of whether it has been finalised;
      the CERTIFIED variant runs from submission onward and pools only FINALIZED
      abstractions. Because a DRAFT abstraction always carries
      denominator_included == true (see abstraction_numerator_denominator), the
      two variants disagree on any report that has at least one excluded case.
    algorithm_type: aggregation
    variants:
      PROVISIONAL:
        applies_when: "report status == DRAFT — set at POST /stroke-network/certification-reports and recomputed on every abstraction attach or detach while the report stays DRAFT; report.rate_variant := PROVISIONAL"
        formula: |
          for each measure_code m in {STK_DTN_60, STK_DTI_45, STK_TELESTROKE_RESPONSE}:
            pool  = QualityMeasureAbstraction rows with report_id == report.id
                    AND measure_code == m
                    AND status IN {DRAFT, FINALIZED}
            denom = count of pool where denominator_included == true
            numer = count of pool where denominator_included == true AND numerator_flag == true
            rate  = 0.00 if denom == 0 else round(100.0 * numer / denom, 2)
      CERTIFIED:
        applies_when: "report status != DRAFT — recomputed at POST /stroke-network/certification-reports/{id}/submit and at every later submit; report.rate_variant := CERTIFIED"
        formula: |
          for each measure_code m in {STK_DTN_60, STK_DTI_45, STK_TELESTROKE_RESPONSE}:
            pool  = QualityMeasureAbstraction rows with report_id == report.id
                    AND measure_code == m
                    AND status == FINALIZED
            denom = count of pool where denominator_included == true
            numer = count of pool where denominator_included == true AND numerator_flag == true
            rate  = 0.00 if denom == 0 else round(100.0 * numer / denom, 2)
    formula: |
      dtn_60_compliance_pct                := rate for STK_DTN_60
      dti_45_compliance_pct                := rate for STK_DTI_45
      telestroke_response_compliance_pct   := rate for STK_TELESTROKE_RESPONSE
      STK_4_THROMBOLYTIC_THERAPY abstractions are attached and counted in
      included_abstraction_count but do NOT feed any of the three published
      rates and do NOT feed the composite score.
    input_set: "QualityMeasureAbstraction rows whose report_id equals this report, narrowed by the variant's status filter"
    constants:
      REPORTED_MEASURE_CODES: [STK_DTN_60, STK_DTI_45, STK_TELESTROKE_RESPONSE]
    precision: "2 decimal places, round_half_up; an empty denominator yields 0.00, never null and never 100.00"
    edge_cases:
      - "two DRAFT STK_DTN_60 abstractions, one with numerator true and one with numerator false whose case disposition is TRANSFER_ONLY: PROVISIONAL rate 50.00"
      - "finalising both of those abstractions and submitting the report: CERTIFIED rate 100.00, because the TRANSFER_ONLY row leaves the denominator — the same underlying data, a 50.00 delta"
      - "a measure with no attached abstraction at all -> 0.00 for that measure"
      - "1 of 3 in the numerator -> 33.33 (round_half_up on 33.3333...)"
      - "2 of 3 in the numerator -> 66.67"
      - "retracting the only FINALIZED abstraction for a measure returns that rate to 0.00"

  - name: composite_certification_score
    description: |
      COMBINATORIAL — MODE (a) NON-LINEAR INTERACTION. Produces the single number
      the certification decision is read from. Three weighted measure rates, a
      capped deviation penalty, a stepped volume credit and a facility-type
      multiplier interact multiplicatively, so no term's contribution can be
      reasoned about in isolation: the tier multiplier scales the penalty and the
      credit as well as the base, the penalty cap flattens the marginal cost of
      further deviations, and the 0..100 clamp can absorb an increase entirely.
      Recomputed at POST /stroke-network/certification-reports/{id}/submit, using
      the CERTIFIED variant rates written in the same request.
    algorithm_type: weighted_scoring
    formula: |
      weighted_base = W_DTN  * report.dtn_60_compliance_pct
                    + W_DTI  * report.dti_45_compliance_pct
                    + W_RESP * report.telestroke_response_compliance_pct
        Each rate is consumed AS STORED — already rounded to 2 decimals by
        calculations.measure_compliance_rate. The rates are never re-derived
        from raw numerators here.

      deviation_penalty = min( DEVIATION_PENALTY_CAP,
                               MAJOR_DEVIATION_PENALTY    * report.substantiated_major_count
                             + SENTINEL_DEVIATION_PENALTY * report.substantiated_sentinel_count )

      volume_credit = VOLUME_CREDIT_HIGH if report.included_abstraction_count >= VOLUME_TIER_HIGH
                      VOLUME_CREDIT_MID  else if report.included_abstraction_count >= VOLUME_TIER_MID
                      0.0                otherwise

      tier_multiplier = TIER_MULTIPLIER_BY_FACILITY_TYPE[center.facility_type]

      raw = (weighted_base - deviation_penalty + volume_credit) * tier_multiplier

      composite_certification_score = round(max(0.0, min(100.0, raw)), 2)

      decision, derived from the composite in the same request:
        CERTIFIED    if composite_certification_score >= CERT_SCORE_CERTIFIED_MIN
        CONDITIONAL  if CERT_SCORE_CONDITIONAL_MIN <= composite_certification_score < CERT_SCORE_CERTIFIED_MIN
        DENIED       if composite_certification_score < CERT_SCORE_CONDITIONAL_MIN
      (the decision field is written at POST /stroke-network/certification-reports/{id}/decide,
      which re-reads the composite computed at submission and does not recompute it)
    input_set: "the single CertificationReport row after its CERTIFIED rates and substantiated deviation counts have been written, plus its StrokeCenter for the tier multiplier"
    constants:
      W_DTN: 0.40
      W_DTI: 0.35
      W_RESP: 0.25
      MAJOR_DEVIATION_PENALTY: 8.0
      SENTINEL_DEVIATION_PENALTY: 18.0
      DEVIATION_PENALTY_CAP: 24.0
      VOLUME_TIER_HIGH: 20
      VOLUME_TIER_MID: 10
      VOLUME_CREDIT_HIGH: 5.0
      VOLUME_CREDIT_MID: 2.0
      TIER_MULTIPLIER_BY_FACILITY_TYPE:
        HUB_PRIMARY: 1.00
        SPOKE: 0.95
        THROMBECTOMY_CAPABLE: 1.05
      CERT_SCORE_CERTIFIED_MIN: 85.00
      CERT_SCORE_CONDITIONAL_MIN: 70.00
    precision: "2 decimal places, round_half_up, applied ONCE at the very end after the clamp; the weighted base and the multiplied raw value are kept at full precision in between"
    edge_cases:
      - "SPOKE center, dtn 100.00, dti 50.00, resp 100.00, no substantiated deviations, 4 included abstractions: base 82.50, raw 78.375, composite 78.38 -> CONDITIONAL (truncating instead of round_half_up would give 78.37)"
      - "the same SPOKE report with one substantiated MAJOR and one substantiated SENTINEL: uncapped penalty 26.0 is capped to 24.0, raw (82.50 - 24.0) * 0.95 = 55.575, composite 55.58 -> DENIED"
      - "adding a third substantiated MAJOR to that report leaves the composite at 55.58 — the cap has already bound, so the marginal penalty is zero"
      - "THROMBECTOMY_CAPABLE center with all three rates 100.00 and 4 abstractions: raw 105.0 clamps to 100.00, so the 1.05 multiplier is entirely absorbed; clamping BEFORE the multiplier instead of after would publish 105.00"
      - "included_abstraction_count exactly 10 earns VOLUME_CREDIT_MID; exactly 9 earns 0.0; exactly 20 earns VOLUME_CREDIT_HIGH"
      - "composite exactly 85.00 -> CERTIFIED; exactly 84.99 -> CONDITIONAL; exactly 70.00 -> CONDITIONAL; exactly 69.99 -> DENIED"
      - "the volume credit is multiplied by tier_multiplier, so the same 2.0 credit is worth 1.90 at a SPOKE and 2.10 at a THROMBECTOMY_CAPABLE center"

  - name: dtn_excess_reporting
    description: |
      COMBINATORIAL — MODE (b) ROUNDING ORDER. Publishes the mean per-case
      door-to-needle excess over target on a CertificationReport. Each case's
      excess is rounded to a WHOLE PERCENT first and only the rounded values are
      averaged; averaging the raw ratios and rounding once at the end gives a
      different number. One order is pinned; the other is forbidden.
    algorithm_type: aggregation
    formula: |
      population V (ordered, though order does not affect the result):
        the CodeStrokeCase rows c such that some QualityMeasureAbstraction with
        report_id == report.id AND measure_code == STK_DTN_60 AND status == FINALIZED
        references c, AND c.door_to_needle_minutes != null,
        ordered by c.created_at ASC

      PINNED STEP ORDER:
        STEP 1  for each c in V:
                  e_c := round( 100.0 * max(0, c.door_to_needle_minutes - DTN_TARGET_MIN)
                                / DTN_TARGET_MIN , 0 )
                (round to ZERO decimals, round_half_up — a WHOLE percent per case)
        STEP 2  mean_dtn_excess_pct := round( sum(e_c) / count(V) , 2 )
        STEP 3  if count(V) == 0 then mean_dtn_excess_pct := null (NOT 0.00)

      FORBIDDEN ALTERNATIVE ORDER:
        round( 100.0 * sum(max(0, c.door_to_needle_minutes - DTN_TARGET_MIN))
               / (DTN_TARGET_MIN * count(V)) , 2 )
        — pooling the raw excess minutes and rounding once at the end.
    input_set: "the FINALIZED STK_DTN_60 abstractions attached to this report and the CodeStrokeCase rows they reference"
    constants:
      DTN_TARGET_MIN: 60
    precision: "per-case excess rounded to 0 decimals with round_half_up; the mean rounded to 2 decimals with round_half_up"
    edge_cases:
      - "a single case with door_to_needle_minutes 70: e = round(16.666..., 0) = 17, mean 17.00 — the forbidden pooled order yields 16.67"
      - "two cases with door_to_needle_minutes 70 and 70: mean 17.00, forbidden order 16.67"
      - "a single case with door_to_needle_minutes 50 (inside target): max(0, -10) = 0, e = 0, mean 0.00"
      - "cases with door_to_needle_minutes 70 and 50: pinned mean (17 + 0) / 2 = 8.50, forbidden order 8.33"
      - "door_to_needle_minutes exactly 60: e = 0"
      - "no FINALIZED STK_DTN_60 abstraction with a needle at all -> null, which is distinguishable from 0.00"

  - name: public_dtn_rollup
    description: |
      Refreshes the publicly reported door-to-needle compliance on a StrokeCenter
      when one of its CertificationReports is published. The published value is
      taken from the report being published only — the most recent publication
      wins outright and earlier publications are not averaged in — and it is
      derived from the report's ALREADY-ROUNDED 2-decimal rate, then narrowed to
      one decimal for public consumption.
    algorithm_type: aggregation
    formula: |
      runs inside POST /stroke-network/certification-reports/{id}/publish AFTER
      report.status has been set to PUBLISHED:
        center.public_dtn_compliance_pct := round(report.dtn_60_compliance_pct, 1)
        center.public_report_published_at := clock_now
      report.dtn_60_compliance_pct is consumed as stored; it is never re-derived
      from the underlying abstractions at publication time.
    input_set: "the single CertificationReport row being published and its StrokeCenter"
    constants: {}
    precision: "1 decimal place, round_half_up, applied to the report's stored 2-decimal rate"
    edge_cases:
      - "a report with dtn_60_compliance_pct 100.00 publishes 100.0"
      - "a report with dtn_60_compliance_pct 66.67 publishes 66.7"
      - "a report with dtn_60_compliance_pct 33.33 publishes 33.3"
      - "publishing a second report for the same center overwrites the value outright rather than averaging it with the first"
      - "public_dtn_compliance_pct stays null until the center's first publication, which is distinguishable from a published 0.0"

# ============================================================================
# §1.4 Validation Rules Table (ordered by priority — lowest number wins)
# ============================================================================

validations:

  - priority: 1
    category: auth
    check: "X-User-ID and X-User-Role headers must both be present and non-empty on every request"
    error_id: ERR_UNAUTHENTICATED
    http_status: 401
    applies_to: all endpoints

  - priority: 2
    category: auth
    check: "X-User-Role must be one of the six declared role names in §1.7"
    error_id: ERR_UNAUTHENTICATED
    http_status: 401
    applies_to: all endpoints

  - priority: 5
    category: auth
    check: "The role in X-User-Role must appear in the endpoint's roles list"
    error_id: ERR_FORBIDDEN_ROLE
    http_status: 403
    applies_to: all endpoints

  - priority: 8
    category: auth
    check: "For consult lifecycle actions (accept, decline, complete, video sessions) and for checklist determination, the acting Neurologist identity resolved from X-User-ID must equal the consult's assigned_neurologist_id"
    error_id: ERR_NOT_CONSULT_OWNER
    http_status: 403
    applies_to: "POST /stroke-network/consults/{id}/accept, /decline, /complete, /video-sessions; POST /stroke-network/checklists/{id}/determine"

  - priority: 10
    category: business_constraint
    check: "Request body must contain every required input field of the endpoint with the declared JSON type; unknown fields are rejected; datetime fields must be ISO-8601 UTC instants"
    error_id: ERR_INVALID_REQUEST
    http_status: 422
    applies_to: all endpoints with a request body

  - priority: 11
    category: business_constraint
    check: "limit must be an integer in [1, 100] and offset an integer >= 0 on every list endpoint"
    error_id: ERR_INVALID_PAGINATION
    http_status: 422
    applies_to: all list endpoints

  - priority: 12
    category: business_constraint
    check: "Every enum-typed input field must carry one of that field's declared values"
    error_id: ERR_INVALID_ENUM_VALUE
    http_status: 422
    applies_to: all endpoints with an enum input

  - priority: 15
    category: existence
    check: "Every id in the URL path must reference an existing row of the addressed collection"
    error_id: "ERR_{ENTITY}_NOT_FOUND (per collection: ERR_CENTER_NOT_FOUND, ERR_AGREEMENT_NOT_FOUND, ERR_NEUROLOGIST_NOT_FOUND, ERR_CASE_NOT_FOUND, ERR_CONSULT_NOT_FOUND, ERR_CHECKLIST_NOT_FOUND, ERR_TRANSFER_NOT_FOUND, ERR_DEVIATION_NOT_FOUND, ERR_ABSTRACTION_NOT_FOUND, ERR_REPORT_NOT_FOUND)"
    http_status: 404
    applies_to: all endpoints with a path id

  - priority: 18
    category: existence
    check: "Every FK field in a request body must reference an existing row of the target entity, validated in the field order declared by the endpoint's input list"
    error_id: "ERR_{ENTITY}_NOT_FOUND (by referenced entity)"
    http_status: 404
    applies_to: "POST /stroke-network/spoke-agreements, /neurologists, /code-strokes, /consults, /checklists, /transfer-decisions, /deviations, /abstractions, /certification-reports; POST /stroke-network/spoke-agreements/{id}/proxy-credentials"

  - priority: 22
    category: business_constraint
    check: "expected_case_version must equal the referenced CodeStrokeCase's current version"
    error_id: ERR_STALE_CASE_VERSION
    http_status: 412
    applies_to: "POST /stroke-network/consults"

  - priority: 23
    category: business_constraint
    check: "expected_center_version must equal the referenced StrokeCenter's current version"
    error_id: ERR_STALE_CENTER_VERSION
    http_status: 412
    applies_to: "POST /stroke-network/certification-reports"

  - priority: 30
    category: state
    check: "The addressed row must be in a state from which the requested transition is declared in §1.2; otherwise the per-entity invalid-state error is returned. CodeStrokeCase action endpoints are governed by priority 40 instead of this rule"
    error_id: "ERR_INVALID_CENTER_STATE / ERR_INVALID_AGREEMENT_STATE / ERR_INVALID_ONCALL_TRANSITION / ERR_INVALID_CONSULT_STATE / ERR_INVALID_TRANSFER_STATE / ERR_INVALID_DEVIATION_STATE / ERR_INVALID_ABSTRACTION_STATE / ERR_INVALID_REPORT_STATE"
    http_status: 409
    applies_to: all action endpoints

  - priority: 40
    category: state
    check: "The CodeStrokeCase referenced by a consult request, checklist write, checklist determination, transfer proposal, thrombolytic administration or abstraction must not be CLOSED or ABORTED"
    error_id: ERR_CASE_NOT_ACTIVE
    http_status: 409
    applies_to: "POST /stroke-network/consults; POST /stroke-network/checklists and its sub-actions; POST /stroke-network/transfer-decisions; POST /stroke-network/code-strokes/{id}/administer-thrombolytic; POST /stroke-network/abstractions"

  - priority: 45
    category: business_constraint
    check: "SEGREGATION OF DUTIES — a CertificationReport's deciding X-User-ID must differ from its submitted_by_user_id, and an abstraction's attesting X-User-ID must differ from its abstracted_by_user_id"
    error_id: ERR_SEGREGATION_OF_DUTIES
    http_status: 403
    applies_to: "POST /stroke-network/certification-reports/{id}/decide; POST /stroke-network/abstractions/{id}/finalize"

  - priority: 48
    category: business_safety
    check: "A TelestrokeConsult may not be completed unless valid_video_session_count >= 1 per calculations.video_session_validity — an audio-only or under-180-second session does not satisfy the consult record requirement"
    error_id: ERR_NO_VALID_VIDEO_SESSION
    http_status: 409
    applies_to: "POST /stroke-network/consults/{id}/complete"

  - priority: 50
    category: business_safety
    check: "A thrombolytic may not be administered when the case's ThrombolyticChecklist has absolute_contraindication_count > 0. This is the highest-priority clinical safety rule and it deliberately sits BELOW the case-active rule at priority 40, so a closed case with an absolute contraindication returns ERR_CASE_NOT_ACTIVE"
    error_id: ERR_ABSOLUTE_CONTRAINDICATION
    http_status: 422
    applies_to: "POST /stroke-network/code-strokes/{id}/administer-thrombolytic"

  - priority: 51
    category: business_safety
    check: "A thrombolytic may not be administered unless the case has a ThrombolyticChecklist whose determination_status is ELIGIBLE or ELIGIBLE_WITH_RELATIVE_OVERRIDE and whose documentation_status is DOCUMENTED"
    error_id: ERR_ELIGIBILITY_NOT_DETERMINED
    http_status: 409
    applies_to: "POST /stroke-network/code-strokes/{id}/administer-thrombolytic"

  - priority: 52
    category: business_safety
    check: "CASCADING — a determination may not run until documentation is complete: confirmed_inclusion_item_count must equal REQUIRED_INCLUSION_ITEM_COUNT (4). The eligibility score in calculations.eligibility_score is only meaningful once this passes, so this check runs before the score is computed"
    error_id: ERR_CHECKLIST_INCOMPLETE
    http_status: 422
    applies_to: "POST /stroke-network/checklists/{id}/determine"

  - priority: 53
    category: business_safety
    check: "CONDITIONAL — override_justification is required if and only if relative_contraindication_count > 0; supplying it when there are no relative contraindications is also rejected"
    error_id: ERR_OVERRIDE_JUSTIFICATION_REQUIRED
    http_status: 422
    applies_to: "POST /stroke-network/checklists/{id}/determine"

  - priority: 54
    category: business_safety
    check: "A contraindication with severity ABSOLUTE must carry non-empty documented_evidence; RELATIVE entries may omit it"
    error_id: ERR_CONTRAINDICATION_EVIDENCE_REQUIRED
    http_status: 422
    applies_to: "POST /stroke-network/checklists/{id}/contraindications"

  - priority: 55
    category: business_safety
    check: "CASCADING — calculations.thrombolytic_window_classification is recomputed against the logical clock first, and a thrombolytic may not be administered when the resulting thrombolytic_window_class is OUT_OF_WINDOW, even if the checklist determination earlier said ELIGIBLE"
    error_id: ERR_THROMBOLYTIC_WINDOW_EXPIRED
    http_status: 422
    applies_to: "POST /stroke-network/code-strokes/{id}/administer-thrombolytic"

  - priority: 56
    category: business_safety
    check: "last_known_well_at must be present when lkw_precision is EXACT or ESTIMATED, must be absent when lkw_precision is UNKNOWN_WAKE_UP, and must never be later than door_at"
    error_id: ERR_LKW_REQUIRED
    http_status: 422
    applies_to: "POST /stroke-network/code-strokes"

  - priority: 57
    category: business_safety
    check: "A TransferDecision with mode DRIP_AND_SHIP requires the origin case to have needle_at set; mode TRANSFER_ONLY requires needle_at to be null"
    error_id: ERR_TRANSFER_MODE_MISMATCH
    http_status: 422
    applies_to: "POST /stroke-network/transfer-decisions"

  - priority: 58
    category: business_safety
    check: "EQUIPMENT GATE, evaluated per endpoint against the StrokeCenter named by the case or the consult's case: (a) a code stroke may not be activated at, and a consult may not be requested for, a center whose equipment_readiness_posture is OFFLINE; (b) imaging may not be completed at a center whose ct_scanner_ready is false, even when the posture is only DEGRADED; (c) a thrombolytic may not be administered at a center whose equipment_readiness_posture is OFFLINE. This sits ABOVE the agreement-window rule at priority 65, so an offline center with a not-yet-effective agreement returns ERR_CENTER_EQUIPMENT_OFFLINE, and below the case-active rule at priority 40, so a closed case at an offline center returns ERR_CASE_NOT_ACTIVE"
    error_id: ERR_CENTER_EQUIPMENT_OFFLINE
    http_status: 409
    applies_to: "POST /stroke-network/code-strokes; POST /stroke-network/consults; POST /stroke-network/code-strokes/{id}/imaging-complete; POST /stroke-network/code-strokes/{id}/administer-thrombolytic"

  - priority: 59
    category: business_safety
    check: "The destination StrokeCenter of a TransferDecision must have facility_type THROMBECTOMY_CAPABLE"
    error_id: ERR_DESTINATION_NOT_THROMBECTOMY_CAPABLE
    http_status: 422
    applies_to: "POST /stroke-network/transfer-decisions"

  - priority: 60
    category: business_safety
    check: "CROSS-ENTITY — the destination StrokeCenter's ems_routing_posture must not be BYPASS, checked at proposal time and RE-CHECKED against the live posture at acceptance time (a destination that goes OFFLINE, SUSPENDED or WITHDRAWN between proposal and acceptance blocks the acceptance). This is why destination_posture_at_proposal can only ever hold ROUTINE or DIVERT_ADVISORY, and why the frozen snapshot is never used for the acceptance check"
    error_id: ERR_DESTINATION_BYPASS
    http_status: 409
    applies_to: "POST /stroke-network/transfer-decisions; POST /stroke-network/transfer-decisions/{id}/accept"

  - priority: 61
    category: business_referential
    check: "destination_center_id must differ from the origin case's center_id"
    error_id: ERR_SELF_REFERRAL_TRANSFER
    http_status: 409
    applies_to: "POST /stroke-network/transfer-decisions"

  - priority: 62
    category: business_referential
    check: "hub_center_id must differ from spoke_center_id, and hub_center_id must reference a center with facility_type HUB_PRIMARY"
    error_id: ERR_SPOKE_AGREEMENT_SELF_PAIR
    http_status: 409
    applies_to: "POST /stroke-network/spoke-agreements"

  - priority: 63
    category: business_referential
    check: "CROSS-ENTITY — the SpokeAgreement named on a consult request must have spoke_center_id equal to the case's center_id"
    error_id: ERR_AGREEMENT_CENTER_MISMATCH
    http_status: 409
    applies_to: "POST /stroke-network/consults"

  - priority: 64
    category: business_referential
    check: "A proxy credential may only be granted to a Neurologist whose home_center_id equals the agreement's hub_center_id, and only once per (neurologist_id, privilege_scope) pair while the existing grant is GRANTED"
    error_id: ERR_PROXY_CREDENTIAL_INVALID
    http_status: 422
    applies_to: "POST /stroke-network/spoke-agreements/{id}/proxy-credentials"

  - priority: 65
    category: business_temporal
    check: "TEMPORAL — a consult may not be requested before its SpokeAgreement takes effect: clock_now must be >= effective_from"
    error_id: ERR_AGREEMENT_WINDOW_CLOSED
    http_status: 409
    applies_to: "POST /stroke-network/consults"

  - priority: 66
    category: business_temporal
    check: "The SpokeAgreement named on a consult request must have status ACTIVE, evaluated AFTER the automatic ACTIVE -> TERMINATED expiry check that runs when clock_now >= effective_until"
    error_id: ERR_AGREEMENT_NOT_ACTIVE
    http_status: 409
    applies_to: "POST /stroke-network/consults"

  - priority: 67
    category: business_temporal
    check: "effective_from must be strictly earlier than effective_until on a SpokeAgreement, and period_start strictly earlier than period_end on a CertificationReport"
    error_id: ERR_INVALID_PERIOD_RANGE
    http_status: 422
    applies_to: "POST /stroke-network/spoke-agreements; POST /stroke-network/certification-reports"

  - priority: 68
    category: business_temporal
    check: "RESOURCE TEMPORAL OVERLAP (zero buffer, half-open) — a new CertificationReport's [period_start, period_end) must not intersect the interval of any existing report for the same center whose status is not SUPERSEDED. Adjacency is explicitly ALLOWED: a period starting exactly at an existing period's period_end is accepted"
    error_id: ERR_REPORT_PERIOD_OVERLAP
    http_status: 409
    applies_to: "POST /stroke-network/certification-reports"

  - priority: 69
    category: business_temporal
    check: "RESOURCE TEMPORAL OVERLAP (positive buffer, closed) — a Neurologist may not accept a consult while inside the NEUROLOGIST_COOLDOWN_MIN (10 minute) buffer after last_consult_completed_at. Unlike the report rule, adjacency is REJECTED: accepting exactly 9 minutes after completing another consult fails, and exactly 10 minutes after succeeds"
    error_id: ERR_NEUROLOGIST_COOLDOWN_ACTIVE
    http_status: 409
    applies_to: "POST /stroke-network/consults/{id}/accept"

  - priority: 70
    category: business_constraint
    check: "AGGREGATE — the count of TelestrokeConsult rows on the named SpokeAgreement with status IN {REQUESTED, ASSIGNED, IN_SESSION} must be strictly less than the agreement's max_concurrent_consults before a new consult is created"
    error_id: ERR_AGREEMENT_CONSULT_CAPACITY
    http_status: 409
    applies_to: "POST /stroke-network/consults"

  - priority: 71
    category: business_constraint
    check: "At most one ThrombolyticChecklist may exist per CodeStrokeCase"
    error_id: ERR_DUPLICATE_CHECKLIST
    http_status: 409
    applies_to: "POST /stroke-network/checklists"

  - priority: 72
    category: business_constraint
    check: "At most one non-RETRACTED QualityMeasureAbstraction may exist per (case_id, measure_code) pair; retracting one frees the pair for a fresh abstraction"
    error_id: ERR_DUPLICATE_ABSTRACTION
    http_status: 409
    applies_to: "POST /stroke-network/abstractions"

  - priority: 73
    category: business_constraint
    check: "An inclusion item code must be one of REQUIRED_INCLUSION_ITEM_CODES and must not already be present in confirmed_inclusion_item_codes"
    error_id: ERR_DUPLICATE_INCLUSION_ITEM
    http_status: 409
    applies_to: "POST /stroke-network/checklists/{id}/inclusion-items"

  - priority: 74
    category: business_constraint
    check: "A CertificationReport may not be submitted unless included_abstraction_count >= 1 — a report with nothing FINALIZED attached carries no signal"
    error_id: ERR_NO_FINALIZED_ABSTRACTIONS
    http_status: 422
    applies_to: "POST /stroke-network/certification-reports/{id}/submit"

  - priority: 75
    category: business_constraint
    check: "AGGREGATE — a CertificationReport may not be submitted unless closed_case_count_in_period >= MIN_CLOSED_CASES_PER_PERIOD (2)"
    error_id: ERR_INSUFFICIENT_CASE_VOLUME
    http_status: 422
    applies_to: "POST /stroke-network/certification-reports/{id}/submit"

  - priority: 76
    category: business_constraint
    check: "A ProtocolDeviation may be returned for more information at most MAX_REVIEW_ROUNDS (3) times: return-for-info is rejected once review_round has reached 3"
    error_id: ERR_REVIEW_ROUND_LIMIT
    http_status: 409
    applies_to: "POST /stroke-network/deviations/{id}/return-for-info"

  - priority: 77
    category: business_constraint
    check: "CONDITIONAL — substantiating a ProtocolDeviation whose severity is SENTINEL requires debrief_completed == true on that deviation; MINOR and MAJOR deviations may be substantiated without a debrief"
    error_id: ERR_DEBRIEF_REQUIRED
    http_status: 422
    applies_to: "POST /stroke-network/deviations/{id}/decide"

  - priority: 78
    category: business_constraint
    check: "CONDITIONAL — the handoff packet must contain every element of REQUIRED_HANDOFF_PACKET_ITEMS for a DRIP_AND_SHIP transfer, or that set minus HP_LYTIC_RECORD for a TRANSFER_ONLY transfer"
    error_id: ERR_HANDOFF_PACKET_INCOMPLETE
    http_status: 422
    applies_to: "POST /stroke-network/transfer-decisions/{id}/complete-handoff"

  - priority: 79
    category: business_constraint
    check: "CROSS-ENTITY — a CertificationReport may not be published while its StrokeCenter's certification_status is SUSPENDED or WITHDRAWN"
    error_id: ERR_CENTER_NOT_CERTIFIED
    http_status: 409
    applies_to: "POST /stroke-network/certification-reports/{id}/publish"

  - priority: 80
    category: business_constraint
    check: "A readiness attestation must name a component of {CT_SCANNER, VIDEO_CART} and a result of {PASS, FAIL}; posting FAIL for a component already false is accepted and idempotent in effect"
    error_id: ERR_INVALID_ENUM_VALUE
    http_status: 422
    applies_to: "POST /stroke-network/stroke-centers/{id}/readiness-attestations"

# ============================================================================
# §1.5 API Endpoint Table
# ============================================================================

endpoints:

  # ---------------------------------------------------------------- test-driving
  - method: POST
    path: "/_clock/set_current_utc"
    description: "Sets the server's logical UTC clock, which every datetime side effect and every window/expiry/cooldown comparison in this API reads. MANDATORY STARTUP DEFAULT: before any call to this endpoint the logical clock reads exactly 2026-08-01T00:00:00Z and never falls back to wall-clock time."
    roles: [ProgramCoordinator, CertificationReviewer, EdPhysician, Neurologist, TransferCoordinator, QualityAbstractor]
    code: 200
    input: [current_utc]
    output: null
    side_effects:
      - "the logical clock is set to current_utc; no entity is mutated"

  # ---------------------------------------------------------------- StrokeCenter
  - method: POST
    path: "/stroke-network/stroke-centers"
    description: "Registers a facility in the stroke network."
    roles: [ProgramCoordinator]
    code: 201
    input: [name, facility_type, state_code, ems_region_code]
    output: StrokeCenter
    side_effects:
      - "certification_status := PROVISIONAL; ct_scanner_ready := true; video_cart_ready := true"
      - "equipment_readiness_posture := READY; open_case_count := 0"
      - "ems_routing_posture := calculations.ems_routing_posture (ROUTINE for a PROVISIONAL READY center with no open cases)"

  - method: GET
    path: "/stroke-network/stroke-centers/{id}"
    description: "Reads one facility including its derived readiness and EMS routing posture."
    roles: [ProgramCoordinator, CertificationReviewer, EdPhysician, Neurologist, TransferCoordinator, QualityAbstractor]
    code: 200
    input: []
    output: StrokeCenter
    side_effects: []

  - method: GET
    path: "/stroke-network/stroke-centers"
    description: "Lists facilities with optional filters; paginated."
    roles: [ProgramCoordinator, CertificationReviewer, EdPhysician, Neurologist, TransferCoordinator, QualityAbstractor]
    code: 200
    input: ["facility_type?", "certification_status?", "ems_region_code?", "ems_routing_posture?", "limit?", "offset?"]
    output: StrokeCenter[]
    side_effects: []

  - method: PATCH
    path: "/stroke-network/stroke-centers/{id}"
    description: "Updates a facility's descriptive attributes. Bumps the center's version, which is what makes the expected_center_version check on report creation observable."
    roles: [ProgramCoordinator]
    code: 200
    input: ["name?", "ems_region_code?"]
    output: StrokeCenter
    side_effects:
      - "increments StrokeCenter.version by 1"

  - method: POST
    path: "/stroke-network/stroke-centers/{id}/readiness-attestations"
    description: "Records an equipment readiness attestation for the CT scanner or the video cart and re-derives the facility's readiness and EMS routing postures."
    roles: [ProgramCoordinator]
    code: 200
    input: [component, result, "note?"]
    output: StrokeCenter
    side_effects:
      - "ct_scanner_ready or video_cart_ready := (result == PASS) for the named component"
      - "equipment_readiness_posture re-derived from the two flags"
      - "ems_routing_posture := calculations.ems_routing_posture"
      - "increments StrokeCenter.version by 1"

  - method: POST
    path: "/stroke-network/stroke-centers/{id}/suspend"
    description: "Suspends a facility's certification, which bypasses EMS routing to it and cascades to its hubbed spoke agreements and their live consults."
    roles: [CertificationReviewer]
    code: 200
    input: [suspension_reason]
    output: StrokeCenter
    side_effects:
      - "certification_status := SUSPENDED; suspension_reason recorded"
      - "ems_routing_posture := BYPASS via calculations.ems_routing_posture"
      - "CASCADE hop 1: every ACTIVE SpokeAgreement with hub_center_id == this center transitions to SUSPENDED"
      - "CASCADE hop 2 (caused by hop 1): every TelestrokeConsult on those agreements with status IN {REQUESTED, ASSIGNED, IN_SESSION} transitions to CANCELLED"
      - "CASCADE hop 3 (caused by hop 2): each affected agreement's active_consult_count is recomputed, and each released Neurologist's active_consult_count is decremented and on_call_state returns from IN_CONSULT to ON_CALL"
      - "increments StrokeCenter.version by 1"

  # ---------------------------------------------------------------- SpokeAgreement
  - method: POST
    path: "/stroke-network/spoke-agreements"
    description: "Creates a hub-to-spoke telestroke coverage agreement in DRAFT."
    roles: [ProgramCoordinator]
    code: 201
    input: [hub_center_id, spoke_center_id, coverage_tier, max_concurrent_consults, effective_from, effective_until]
    output: SpokeAgreement
    side_effects:
      - "status := DRAFT; proxy_credentials := []; active_consult_count := 0"

  - method: GET
    path: "/stroke-network/spoke-agreements/{id}"
    description: "Reads one agreement including its embedded proxy_credentials grants."
    roles: [ProgramCoordinator, CertificationReviewer, EdPhysician, Neurologist, TransferCoordinator, QualityAbstractor]
    code: 200
    input: []
    output: SpokeAgreement
    side_effects: []

  - method: GET
    path: "/stroke-network/spoke-agreements"
    description: "Lists agreements filtered by either endpoint of the hub/spoke pair; paginated. This is the reverse-reachability channel for SpokeAgreement.hub_center_id and SpokeAgreement.spoke_center_id."
    roles: [ProgramCoordinator, CertificationReviewer, EdPhysician, Neurologist, TransferCoordinator, QualityAbstractor]
    code: 200
    input: ["hub_center_id?", "spoke_center_id?", "status?", "coverage_tier?", "limit?", "offset?"]
    output: SpokeAgreement[]
    side_effects: []

  - method: POST
    path: "/stroke-network/spoke-agreements/{id}/activate"
    description: "Activates a DRAFT or SUSPENDED agreement so consults can be routed under it."
    roles: [ProgramCoordinator]
    code: 200
    input: []
    output: SpokeAgreement
    side_effects:
      - "status := ACTIVE; suspension_reason := null"
      - "increments SpokeAgreement.version by 1"

  - method: POST
    path: "/stroke-network/spoke-agreements/{id}/suspend"
    description: "Suspends an ACTIVE agreement and cancels its live consults."
    roles: [ProgramCoordinator, CertificationReviewer]
    code: 200
    input: [suspension_reason]
    output: SpokeAgreement
    side_effects:
      - "status := SUSPENDED; suspension_reason recorded"
      - "CASCADE: every TelestrokeConsult on this agreement with status IN {REQUESTED, ASSIGNED, IN_SESSION} transitions to CANCELLED, active_consult_count is recomputed to 0, and each released Neurologist's active_consult_count is decremented with on_call_state returning from IN_CONSULT to ON_CALL"
      - "increments SpokeAgreement.version by 1"

  - method: POST
    path: "/stroke-network/spoke-agreements/{id}/proxy-credentials"
    description: "Grants credentialing by proxy to a hub neurologist under this agreement, appending a grant object to the agreement's proxy_credentials array. Returns the updated agreement because the grant is an embedded object rather than an addressable entity."
    roles: [ProgramCoordinator]
    code: 201
    input: [neurologist_id, privilege_scope, expires_at]
    output: SpokeAgreement
    side_effects:
      - "appends { neurologist_id, privilege_scope, expires_at, status: GRANTED, granted_at: clock_now } to proxy_credentials"
      - "increments SpokeAgreement.version by 1"

  # ---------------------------------------------------------------- Neurologist
  - method: POST
    path: "/stroke-network/neurologists"
    description: "Registers an on-call neurologist attached to a hub facility."
    roles: [ProgramCoordinator]
    code: 201
    input: [full_name, home_center_id, licensed_state_codes, board_certified, roster_rank, concurrent_consult_limit]
    output: Neurologist
    side_effects:
      - "on_call_state := OFF_DUTY; active_consult_count := 0; completed_consult_count := 0; last_consult_completed_at := null"

  - method: GET
    path: "/stroke-network/neurologists/{id}"
    description: "Reads one neurologist including live consult load and cooldown anchor."
    roles: [ProgramCoordinator, CertificationReviewer, EdPhysician, Neurologist, TransferCoordinator, QualityAbstractor]
    code: 200
    input: []
    output: Neurologist
    side_effects: []

  - method: GET
    path: "/stroke-network/neurologists"
    description: "Lists neurologists; the home_center_id filter is the reverse-reachability channel for Neurologist.home_center_id."
    roles: [ProgramCoordinator, CertificationReviewer, EdPhysician, Neurologist, TransferCoordinator, QualityAbstractor]
    code: 200
    input: ["home_center_id?", "on_call_state?", "board_certified?", "limit?", "offset?"]
    output: Neurologist[]
    side_effects: []

  - method: POST
    path: "/stroke-network/neurologists/{id}/on-call-state"
    description: "Moves a neurologist along the availability dimension the routing selector reads. IN_CONSULT is reachable only through consult acceptance and is rejected here."
    roles: [Neurologist, ProgramCoordinator]
    code: 200
    input: [on_call_state]
    output: Neurologist
    side_effects:
      - "on_call_state := the requested value"
      - "increments Neurologist.version by 1"

  # ---------------------------------------------------------------- CodeStrokeCase
  - method: POST
    path: "/stroke-network/code-strokes"
    description: "Activates a code stroke and captures last-known-well. The door and last-known-well instants are supplied by the caller; activation_at is the logical clock."
    roles: [EdPhysician]
    code: 201
    input: [center_id, patient_ref, door_at, lkw_precision, "last_known_well_at?", arrival_mode]
    output: CodeStrokeCase
    side_effects:
      - "status := ACTIVATED; activation_at := clock_now; activated_by_user_id := X-User-ID; disposition := PENDING; deviation_count := 0"
      - "thrombolytic_window_class := calculations.thrombolytic_window_classification"
      - "CASCADE: the center's open_case_count += 1 and its ems_routing_posture := calculations.ems_routing_posture"

  - method: GET
    path: "/stroke-network/code-strokes/{id}"
    description: "Reads one code stroke case with all three derived clocks and its window class."
    roles: [ProgramCoordinator, CertificationReviewer, EdPhysician, Neurologist, TransferCoordinator, QualityAbstractor]
    code: 200
    input: []
    output: CodeStrokeCase
    side_effects: []

  - method: GET
    path: "/stroke-network/code-strokes"
    description: "Lists code stroke cases; the center_id filter is the reverse-reachability channel for CodeStrokeCase.center_id."
    roles: [ProgramCoordinator, CertificationReviewer, EdPhysician, Neurologist, TransferCoordinator, QualityAbstractor]
    code: 200
    input: ["center_id?", "status?", "disposition?", "thrombolytic_window_class?", "limit?", "offset?"]
    output: CodeStrokeCase[]
    side_effects: []

  - method: POST
    path: "/stroke-network/code-strokes/{id}/imaging-complete"
    description: "Stops the door-to-imaging clock. Callable a second time from CONSULT_IN_PROGRESS as a self-loop, in which case the later instant replaces the earlier one."
    roles: [EdPhysician]
    code: 200
    input: [imaging_modality]
    output: CodeStrokeCase
    side_effects:
      - "imaging_at := clock_now; door_to_imaging_minutes := calculations.clock_interval_metrics"
      - "status := IMAGING_COMPLETE when the case was ACTIVATED; unchanged when it was CONSULT_IN_PROGRESS"
      - "when door_to_imaging_minutes > DTI_TARGET_MIN a SYSTEM_DETECTED ProtocolDeviation of type DTI_EXCEEDED and severity MINOR is opened on the case and deviation_count += 1"
      - "increments CodeStrokeCase.version by 1"

  - method: POST
    path: "/stroke-network/code-strokes/{id}/administer-thrombolytic"
    description: "Records thrombolytic administration, stopping the door-to-needle and last-known-well-to-needle clocks. Guarded by the ordered safety ladder at priorities 50-55."
    roles: [EdPhysician]
    code: 200
    input: [thrombolytic_agent, thrombolytic_dose_mg]
    output: CodeStrokeCase
    side_effects:
      - "thrombolytic_window_class := calculations.thrombolytic_window_classification, evaluated BEFORE the window guard at priority 55"
      - "needle_at := clock_now; door_to_needle_minutes and lkw_to_needle_minutes := calculations.clock_interval_metrics"
      - "status := THROMBOLYSIS_ADMINISTERED; thrombolytic_agent and thrombolytic_dose_mg recorded"
      - "when door_to_needle_minutes > DTN_TARGET_MIN a SYSTEM_DETECTED ProtocolDeviation of type DTN_EXCEEDED and severity MAJOR is opened on the case and deviation_count += 1"
      - "increments CodeStrokeCase.version by 1"

  - method: POST
    path: "/stroke-network/code-strokes/{id}/close"
    description: "Closes a case that was treated locally or received no intervention. Transfer-bound cases close through the transfer handoff instead."
    roles: [EdPhysician, QualityAbstractor]
    code: 200
    input: []
    output: CodeStrokeCase
    side_effects:
      - "status := CLOSED; disposition := TREATED_LOCAL when needle_at != null else NO_TREATMENT"
      - "CASCADE hop 1: the center's open_case_count -= 1"
      - "CASCADE hop 2 (caused by hop 1): the center's ems_routing_posture := calculations.ems_routing_posture"
      - "increments CodeStrokeCase.version by 1"

  - method: POST
    path: "/stroke-network/code-strokes/{id}/abort"
    description: "Aborts a code stroke, cancelling everything downstream of it."
    roles: [EdPhysician]
    code: 200
    input: [abort_reason]
    output: CodeStrokeCase
    side_effects:
      - "status := ABORTED; disposition := NO_TREATMENT; abort_reason recorded"
      - "CASCADE hop 1: every TelestrokeConsult on this case with status IN {REQUESTED, ASSIGNED, IN_SESSION} transitions to CANCELLED and every TransferDecision with status IN {PROPOSED, ACCEPTED} transitions to CANCELLED"
      - "CASCADE hop 2 (caused by hop 1): each released Neurologist's active_consult_count is decremented and on_call_state returns from IN_CONSULT to ON_CALL; each affected agreement's active_consult_count is recomputed"
      - "CASCADE hop 3: the origin center's open_case_count -= 1 and, for each cancelled ACCEPTED transfer, the destination center's open_case_count -= 1"
      - "CASCADE hop 4 (caused by hop 3): ems_routing_posture recomputed on the origin center and on every affected destination center"
      - "increments CodeStrokeCase.version by 1"

  # ---------------------------------------------------------------- TelestrokeConsult
  - method: POST
    path: "/stroke-network/consults"
    description: "Requests a telestroke consult and runs calculations.consult_routing_selection immediately. OCC: expected_case_version must match the case's current version (rule consult-request-stale-case)."
    roles: [EdPhysician]
    code: 201
    input: [case_id, agreement_id, requested_privilege_scope, expected_case_version]
    output: TelestrokeConsult
    side_effects:
      - "the named agreement's ACTIVE -> TERMINATED expiry check runs first when clock_now >= effective_until"
      - "status := REQUESTED; requested_at := clock_now; decline_count := 0; routing_attempt_count := 1; excluded_neurologist_ids := []; video_sessions := []; valid_video_session_count := 0"
      - "calculations.consult_routing_selection runs: on a non-empty pool status := ASSIGNED, assigned_neurologist_id := the winner, assigned_at := clock_now, and that neurologist's active_consult_count += 1"
      - "on an empty pool status := ESCALATED_UNFILLED and a SYSTEM_DETECTED ProtocolDeviation of type CONSULT_UNFILLED and severity MAJOR is opened on the case, with deviation_count += 1"
      - "the agreement's active_consult_count is recomputed"
      - "CASCADE: the case's status := CONSULT_IN_PROGRESS (from ACTIVATED or IMAGING_COMPLETE) and its version increments"

  - method: GET
    path: "/stroke-network/consults/{id}"
    description: "Reads one consult including its embedded video_sessions records and derived valid_video_session_count."
    roles: [ProgramCoordinator, CertificationReviewer, EdPhysician, Neurologist, TransferCoordinator, QualityAbstractor]
    code: 200
    input: []
    output: TelestrokeConsult
    side_effects: []

  - method: GET
    path: "/stroke-network/consults"
    description: "Lists consults; the case_id, agreement_id and assigned_neurologist_id filters are the reverse-reachability channels for those three FKs."
    roles: [ProgramCoordinator, CertificationReviewer, EdPhysician, Neurologist, TransferCoordinator, QualityAbstractor]
    code: 200
    input: ["case_id?", "agreement_id?", "assigned_neurologist_id?", "status?", "requested_privilege_scope?", "limit?", "offset?"]
    output: TelestrokeConsult[]
    side_effects: []

  - method: POST
    path: "/stroke-network/consults/{id}/accept"
    description: "The assigned neurologist accepts and opens the session. Guarded by the cooldown buffer at priority 69."
    roles: [Neurologist]
    code: 200
    input: []
    output: TelestrokeConsult
    side_effects:
      - "status := IN_SESSION; accepted_at := clock_now; response_latency_seconds := calculations.clock_interval_metrics"
      - "CASCADE: the accepting Neurologist's on_call_state := IN_CONSULT"
      - "when response_latency_seconds > TELESTROKE_RESPONSE_TARGET_SEC no deviation is raised here; the miss surfaces through the STK_TELESTROKE_RESPONSE measure instead"
      - "increments TelestrokeConsult.version by 1"

  - method: POST
    path: "/stroke-network/consults/{id}/decline"
    description: "The assigned neurologist declines. The decliner is excluded and calculations.consult_routing_selection is re-run, unless the decline limit has been reached."
    roles: [Neurologist]
    code: 200
    input: [last_decline_reason]
    output: TelestrokeConsult
    side_effects:
      - "decline_count += 1; last_decline_reason recorded; the declining neurologist's id is APPENDED to excluded_neurologist_ids BEFORE re-routing; that neurologist's active_consult_count -= 1"
      - "when decline_count == CONSULT_DECLINE_LIMIT: status := ESCALATED_UNFILLED, assigned_neurologist_id := null, and a SYSTEM_DETECTED ProtocolDeviation of type CONSULT_UNFILLED and severity MAJOR is opened on the case with deviation_count += 1"
      - "otherwise: routing_attempt_count += 1 and calculations.consult_routing_selection re-runs — on a non-empty pool status := ASSIGNED with a new assigned_neurologist_id, assigned_at := clock_now and that neurologist's active_consult_count += 1; on an empty pool status := ESCALATED_UNFILLED with the same deviation as above"
      - "the agreement's active_consult_count is recomputed"
      - "increments TelestrokeConsult.version by 1"

  - method: POST
    path: "/stroke-network/consults/{id}/video-sessions"
    description: "Appends a video session record to an IN_SESSION consult and re-derives valid_video_session_count via calculations.video_session_validity. Returns the updated consult because a session is an embedded object, not an addressable entity."
    roles: [Neurologist]
    code: 201
    input: [started_at, ended_at, video_quality, disconnect_count]
    output: TelestrokeConsult
    side_effects:
      - "appends { started_at, ended_at, video_quality, disconnect_count, duration_seconds, session_valid } to video_sessions"
      - "valid_video_session_count := calculations.video_session_validity"
      - "when session_valid is false a SYSTEM_DETECTED ProtocolDeviation of type INVALID_VIDEO_SESSION and severity MINOR is opened on the case and deviation_count += 1"
      - "increments TelestrokeConsult.version by 1"

  - method: POST
    path: "/stroke-network/consults/{id}/complete"
    description: "Completes the consult with a recommendation and NIHSS score. Requires at least one valid video session (priority 48)."
    roles: [Neurologist]
    code: 200
    input: [recommendation, nihss_score]
    output: TelestrokeConsult
    side_effects:
      - "status := COMPLETED; completed_at := clock_now; recommendation and nihss_score recorded"
      - "CASCADE: the Neurologist's active_consult_count -= 1, completed_consult_count += 1, last_consult_completed_at := clock_now, and on_call_state returns from IN_CONSULT to ON_CALL — which starts the NEUROLOGIST_COOLDOWN_MIN buffer"
      - "the agreement's active_consult_count is recomputed"
      - "increments TelestrokeConsult.version by 1"

  # ---------------------------------------------------------------- ThrombolyticChecklist
  - method: POST
    path: "/stroke-network/checklists"
    description: "Opens the thrombolytic eligibility checklist for a case. At most one per case (priority 71)."
    roles: [EdPhysician]
    code: 201
    input: [case_id]
    output: ThrombolyticChecklist
    side_effects:
      - "documentation_status := NOT_STARTED; determination_status := PENDING"
      - "confirmed_inclusion_item_codes := []; confirmed_inclusion_item_count := 0; contraindications := []; absolute_contraindication_count := 0; relative_contraindication_count := 0; amendment_count := 0"
      - "screening_eligibility_score := calculations.eligibility_score SCREENING variant (0.00 with nothing documented); attested_eligibility_score := null"

  - method: GET
    path: "/stroke-network/checklists/{id}"
    description: "Reads one checklist with both state dimensions, both eligibility scores and its embedded contraindications array."
    roles: [ProgramCoordinator, CertificationReviewer, EdPhysician, Neurologist, TransferCoordinator, QualityAbstractor]
    code: 200
    input: []
    output: ThrombolyticChecklist
    side_effects: []

  - method: GET
    path: "/stroke-network/checklists"
    description: "Lists checklists; the case_id and overridden_by_neurologist_id filters are the reverse-reachability channels for those FKs."
    roles: [ProgramCoordinator, CertificationReviewer, EdPhysician, Neurologist, TransferCoordinator, QualityAbstractor]
    code: 200
    input: ["case_id?", "overridden_by_neurologist_id?", "documentation_status?", "determination_status?", "limit?", "offset?"]
    output: ThrombolyticChecklist[]
    side_effects: []

  - method: POST
    path: "/stroke-network/checklists/{id}/inclusion-items"
    description: "Confirms one inclusion item code. Duplicates are rejected (priority 73)."
    roles: [EdPhysician]
    code: 200
    input: [item_code]
    output: ThrombolyticChecklist
    side_effects:
      - "item_code appended to confirmed_inclusion_item_codes; confirmed_inclusion_item_count recomputed as the array length"
      - "documentation_status := IN_PROGRESS when it was NOT_STARTED; unchanged when AMENDED"
      - "screening_eligibility_score := calculations.eligibility_score SCREENING variant"
      - "increments ThrombolyticChecklist.version by 1"

  - method: POST
    path: "/stroke-network/checklists/{id}/contraindications"
    description: "Documents one contraindication. ABSOLUTE entries require documented_evidence (priority 54)."
    roles: [EdPhysician]
    code: 201
    input: [code, severity, "documented_evidence?"]
    output: ThrombolyticChecklist
    side_effects:
      - "appends { code, severity, documented_evidence, recorded_by_user_id: X-User-ID, recorded_at: clock_now } to contraindications"
      - "absolute_contraindication_count and relative_contraindication_count recomputed from the array"
      - "documentation_status := IN_PROGRESS when it was NOT_STARTED; unchanged when AMENDED"
      - "screening_eligibility_score := calculations.eligibility_score SCREENING variant"
      - "when severity == ABSOLUTE and documented_evidence is absent the request is rejected before any mutation, and a MISSING_CONTRAINDICATION_DOC deviation is NOT created"
      - "increments ThrombolyticChecklist.version by 1"

  - method: POST
    path: "/stroke-network/checklists/{id}/determine"
    description: "The assigned neurologist attests the checklist. Runs the ATTESTED variant of calculations.eligibility_score and moves the case to ELIGIBILITY_DETERMINED."
    roles: [Neurologist]
    code: 200
    input: ["override_justification?"]
    output: ThrombolyticChecklist
    side_effects:
      - "the case's thrombolytic_window_class := calculations.thrombolytic_window_classification FIRST"
      - "attested_eligibility_score := calculations.eligibility_score ATTESTED variant; screening_eligibility_score is left untouched"
      - "determination_status := ELIGIBLE, ELIGIBLE_WITH_RELATIVE_OVERRIDE or INELIGIBLE per the ATTESTED outcome ladder; documentation_status := DOCUMENTED"
      - "overridden_by_neurologist_id := the acting neurologist and override_justification recorded when the outcome is ELIGIBLE_WITH_RELATIVE_OVERRIDE, otherwise both stay null"
      - "determined_at := clock_now"
      - "CASCADE: the case's status := ELIGIBILITY_DETERMINED and its version increments"
      - "increments ThrombolyticChecklist.version by 1"

  - method: POST
    path: "/stroke-network/checklists/{id}/amend"
    description: "Reopens a DOCUMENTED checklist for amendment, which resets the determination dimension without touching the documentation already captured."
    roles: [EdPhysician]
    code: 200
    input: [last_amendment_note]
    output: ThrombolyticChecklist
    side_effects:
      - "documentation_status := AMENDED; determination_status := PENDING; amendment_count += 1; last_amendment_note recorded"
      - "attested_eligibility_score := null; determined_at := null; overridden_by_neurologist_id := null; override_justification := null"
      - "the case's status is NOT rewound; it stays at whatever the case reached, so a re-determination is required before another thrombolytic can be administered"
      - "increments ThrombolyticChecklist.version by 1"

  # ---------------------------------------------------------------- TransferDecision
  - method: POST
    path: "/stroke-network/transfer-decisions"
    description: "Proposes a transfer to a thrombectomy-capable center and runs calculations.projected_door_in_door_out in its pinned step order."
    roles: [TransferCoordinator]
    code: 201
    input: [case_id, destination_center_id, mode, transport_eta_minutes]
    output: TransferDecision
    side_effects:
      - "origin_center_id := the case's center_id; status := PROPOSED; proposed_at := clock_now; handoff_packet_items := []; handoff_packet_complete := false"
      - "destination_posture_at_proposal, congestion_factor, adjusted_transport_minutes and projected_door_in_door_out_minutes := calculations.projected_door_in_door_out, with the destination posture read BEFORE this proposal exists"
      - "CASCADE: the case's status := TRANSFER_INITIATED (from ELIGIBILITY_DETERMINED or THROMBOLYSIS_ADMINISTERED) and its version increments"
      - "no open_case_count changes at proposal time; the destination is only counted once the proposal is ACCEPTED"

  - method: GET
    path: "/stroke-network/transfer-decisions/{id}"
    description: "Reads one transfer decision with its frozen destination posture snapshot and both the projected and realised door-in-door-out values."
    roles: [ProgramCoordinator, CertificationReviewer, EdPhysician, Neurologist, TransferCoordinator, QualityAbstractor]
    code: 200
    input: []
    output: TransferDecision
    side_effects: []

  - method: GET
    path: "/stroke-network/transfer-decisions"
    description: "Lists transfer decisions; the case_id, origin_center_id and destination_center_id filters are the reverse-reachability channels for those three FKs."
    roles: [ProgramCoordinator, CertificationReviewer, EdPhysician, Neurologist, TransferCoordinator, QualityAbstractor]
    code: 200
    input: ["case_id?", "origin_center_id?", "destination_center_id?", "status?", "mode?", "limit?", "offset?"]
    output: TransferDecision[]
    side_effects: []

  - method: POST
    path: "/stroke-network/transfer-decisions/{id}/accept"
    description: "The receiving center accepts the transfer, which is the moment the destination starts carrying the case in its open-case count."
    roles: [TransferCoordinator]
    code: 200
    input: []
    output: TransferDecision
    side_effects:
      - "status := ACCEPTED; accepted_at := clock_now"
      - "CASCADE hop 1: the destination center's open_case_count += 1"
      - "CASCADE hop 2 (caused by hop 1): the destination center's ems_routing_posture := calculations.ems_routing_posture, which can flip it to DIVERT_ADVISORY at the threshold"
      - "destination_posture_at_proposal is NOT refreshed; it keeps the value frozen at proposal time"
      - "increments TransferDecision.version by 1"

  - method: POST
    path: "/stroke-network/transfer-decisions/{id}/decline"
    description: "The receiving center declines. The origin case stays TRANSFER_INITIATED and a fresh proposal to another destination is required."
    roles: [TransferCoordinator]
    code: 200
    input: [decline_reason]
    output: TransferDecision
    side_effects:
      - "status := DECLINED; decline_reason recorded"
      - "no open_case_count changes, because a PROPOSED transfer was never counted"
      - "increments TransferDecision.version by 1"

  - method: POST
    path: "/stroke-network/transfer-decisions/{id}/complete-handoff"
    description: "Completes the drip-and-ship or transfer-only handoff, closing the case. Executes calculations.handoff_settlement_sequence in its pinned seven-step order."
    roles: [TransferCoordinator]
    code: 200
    input: [handoff_packet_items]
    output: TransferDecision
    side_effects:
      - "STEP 1: door_in_door_out_minutes := calculations.handoff_settlement_sequence, measured while the case is still TRANSFER_INITIATED"
      - "STEP 2: handoff_packet_items recorded and handoff_packet_complete derived per the mode-conditional required set"
      - "STEP 3: status := HANDOFF_COMPLETE; handoff_completed_at := clock_now"
      - "STEP 4: CASCADE — the case's status := CLOSED and disposition := DRIP_AND_SHIP or TRANSFER_ONLY per mode; its version increments"
      - "STEP 5: CASCADE — the origin center's open_case_count -= 1 AND the destination center's open_case_count -= 1, both before any posture is re-derived"
      - "STEP 6: CASCADE — ems_routing_posture recomputed on the origin center and then on the destination center"
      - "STEP 7: when door_in_door_out_minutes > DIDO_TARGET_MIN a SYSTEM_DETECTED ProtocolDeviation of type DIDO_EXCEEDED and severity MAJOR is opened on the case and deviation_count += 1"
      - "increments TransferDecision.version by 1"

  # ---------------------------------------------------------------- ProtocolDeviation
  - method: POST
    path: "/stroke-network/deviations"
    description: "Raises a protocol deviation manually. System-detected deviations are created by cascades and are only discoverable through the list endpoint below."
    roles: [QualityAbstractor, EdPhysician]
    code: 201
    input: [case_id, deviation_type, severity, narrative]
    output: ProtocolDeviation
    side_effects:
      - "status := OPEN; source := MANUAL; opened_by_user_id := X-User-ID; review_round := 0; debrief_completed := false"
      - "CASCADE: the case's deviation_count += 1 and its version increments"

  - method: GET
    path: "/stroke-network/deviations/{id}"
    description: "Reads one deviation, including the SYSTEM_DETECTED ones synthesized by cascades."
    roles: [ProgramCoordinator, CertificationReviewer, EdPhysician, Neurologist, TransferCoordinator, QualityAbstractor]
    code: 200
    input: []
    output: ProtocolDeviation
    side_effects: []

  - method: GET
    path: "/stroke-network/deviations"
    description: "Lists deviations; the case_id filter is the reverse-reachability channel for ProtocolDeviation.case_id and the ONLY discovery channel for cascade-created SYSTEM_DETECTED rows."
    roles: [ProgramCoordinator, CertificationReviewer, EdPhysician, Neurologist, TransferCoordinator, QualityAbstractor]
    code: 200
    input: ["case_id?", "status?", "severity?", "deviation_type?", "source?", "limit?", "offset?"]
    output: ProtocolDeviation[]
    side_effects: []

  - method: POST
    path: "/stroke-network/deviations/{id}/start-review"
    description: "A certification reviewer opens the review of an OPEN deviation."
    roles: [CertificationReviewer]
    code: 200
    input: []
    output: ProtocolDeviation
    side_effects:
      - "status := UNDER_REVIEW; reviewed_by_user_id := X-User-ID; review_round := 1"
      - "increments ProtocolDeviation.version by 1"

  - method: POST
    path: "/stroke-network/deviations/{id}/return-for-info"
    description: "Returns the deviation to the abstractor for more information. Capped at MAX_REVIEW_ROUNDS rounds (priority 76)."
    roles: [CertificationReviewer]
    code: 200
    input: [info_request]
    output: ProtocolDeviation
    side_effects:
      - "status := RETURNED_FOR_INFO; info_request recorded"
      - "increments ProtocolDeviation.version by 1"

  - method: POST
    path: "/stroke-network/deviations/{id}/resubmit"
    description: "The abstractor supplies the requested information and pushes the deviation back into review, incrementing the review round."
    roles: [QualityAbstractor]
    code: 200
    input: [additional_info]
    output: ProtocolDeviation
    side_effects:
      - "status := UNDER_REVIEW; additional_info recorded; review_round += 1"
      - "increments ProtocolDeviation.version by 1"

  - method: POST
    path: "/stroke-network/deviations/{id}/debrief"
    description: "Records the case debrief on a deviation. Mandatory before a SENTINEL deviation can be substantiated (priority 77)."
    roles: [QualityAbstractor, EdPhysician]
    code: 200
    input: [debrief_summary]
    output: ProtocolDeviation
    side_effects:
      - "debrief_completed := true; debrief_summary recorded"
      - "increments ProtocolDeviation.version by 1"

  - method: POST
    path: "/stroke-network/deviations/{id}/decide"
    description: "Substantiates or dismisses the deviation. Only SUBSTANTIATED deviations feed the deviation penalty in the composite certification score."
    roles: [CertificationReviewer]
    code: 200
    input: [outcome]
    output: ProtocolDeviation
    side_effects:
      - "status := SUBSTANTIATED when outcome == SUBSTANTIATE, DISMISSED when outcome == DISMISS; reviewed_by_user_id := X-User-ID"
      - "CASCADE: every CertificationReport with status IN {DRAFT, RETURNED} whose period covers the deviation's case recomputes substantiated_major_count and substantiated_sentinel_count; composite_certification_score is NOT recomputed here because it is only ever produced at submission"
      - "increments ProtocolDeviation.version by 1"

  # ---------------------------------------------------------------- QualityMeasureAbstraction
  - method: POST
    path: "/stroke-network/abstractions"
    description: "Abstracts one quality measure from a case that is still open. Runs the PROVISIONAL variant of calculations.abstraction_numerator_denominator. The DRAFT row is created while the case is live (priority 40 rejects a CLOSED or ABORTED case here) and is attested only after the case reaches CLOSED or ABORTED, which is what POST /stroke-network/abstractions/{id}/finalize requires."
    roles: [QualityAbstractor]
    code: 201
    input: [case_id, measure_code]
    output: QualityMeasureAbstraction
    side_effects:
      - "status := DRAFT; variant := PROVISIONAL; abstracted_by_user_id := X-User-ID; attested_by_user_id := null"
      - "numerator_flag, exclusion_reason and denominator_included := calculations.abstraction_numerator_denominator PROVISIONAL variant, so denominator_included is true even when an exclusion was detected"
      - "report_id := the id of the DRAFT CertificationReport for this case's center whose [period_start, period_end) contains the case's door_at, when exactly one such report exists; otherwise null"
      - "when report_id was set, that report's included_abstraction_count, its three rate fields (under its PROVISIONAL variant) and its mean_dtn_excess_pct are recomputed"

  - method: GET
    path: "/stroke-network/abstractions/{id}"
    description: "Reads one abstraction with its variant, numerator, denominator inclusion and exclusion reason."
    roles: [ProgramCoordinator, CertificationReviewer, EdPhysician, Neurologist, TransferCoordinator, QualityAbstractor]
    code: 200
    input: []
    output: QualityMeasureAbstraction
    side_effects: []

  - method: GET
    path: "/stroke-network/abstractions"
    description: "Lists abstractions; the case_id and report_id filters are the reverse-reachability channels for those two FKs."
    roles: [ProgramCoordinator, CertificationReviewer, EdPhysician, Neurologist, TransferCoordinator, QualityAbstractor]
    code: 200
    input: ["case_id?", "report_id?", "measure_code?", "status?", "variant?", "denominator_included?", "limit?", "offset?"]
    output: QualityMeasureAbstraction[]
    side_effects: []

  - method: POST
    path: "/stroke-network/abstractions/{id}/finalize"
    description: "Attests and finalizes the abstraction, switching it to the CERTIFIED variant. Segregation of duties: the attesting user must differ from the abstracting user (priority 45)."
    roles: [QualityAbstractor]
    code: 200
    input: [attestation_note]
    output: QualityMeasureAbstraction
    side_effects:
      - "status := FINALIZED; variant := CERTIFIED; attested_by_user_id := X-User-ID; attestation_note recorded"
      - "numerator_flag, exclusion_reason and denominator_included recomputed under the CERTIFIED variant, so denominator_included flips to false whenever exclusion_reason != NONE"
      - "CASCADE: when report_id != null, that report's included_abstraction_count and three rate fields are recomputed under its current rate_variant"
      - "increments QualityMeasureAbstraction.version by 1"

  - method: POST
    path: "/stroke-network/abstractions/{id}/retract"
    description: "Retracts an abstraction. COMPENSATING: every counter and rate the abstraction contributed to is restored to the value it would have had if the abstraction had never existed."
    roles: [QualityAbstractor]
    code: 200
    input: [retraction_reason]
    output: QualityMeasureAbstraction
    side_effects:
      - "status := RETRACTED; retraction_reason recorded"
      - "COMPENSATION: when report_id != null, report_id := null and that report's included_abstraction_count, dtn_60_compliance_pct, dti_45_compliance_pct, telestroke_response_compliance_pct and mean_dtn_excess_pct are recomputed from the remaining attached abstractions"
      - "the (case_id, measure_code) pair is freed, so a fresh abstraction for the same measure may be created"
      - "increments QualityMeasureAbstraction.version by 1"

  # ---------------------------------------------------------------- CertificationReport
  - method: POST
    path: "/stroke-network/certification-reports"
    description: "Opens a certification reporting period for a facility and attaches every in-period abstraction. OCC: expected_center_version must match the center's current version (rule report-create-stale-center)."
    roles: [ProgramCoordinator]
    code: 201
    input: [center_id, period_start, period_end, expected_center_version]
    output: CertificationReport
    side_effects:
      - "status := DRAFT; rate_variant := PROVISIONAL; decision := PENDING; submitted_by_user_id := null; decided_by_user_id := null; superseded_by_report_id := null"
      - "SUPERSEDE: any existing DRAFT report for the same center transitions to SUPERSEDED with superseded_by_report_id := this new report's id, and every abstraction attached to it is detached (report_id := null)"
      - "every QualityMeasureAbstraction with status IN {DRAFT, FINALIZED} on a CodeStrokeCase with center_id == this center, status == CLOSED and door_at inside [period_start, period_end) is attached (report_id := this report's id)"
      - "closed_case_count_in_period and included_abstraction_count computed"
      - "the three rate fields := calculations.measure_compliance_rate PROVISIONAL variant; mean_dtn_excess_pct := calculations.dtn_excess_reporting"
      - "substantiated_major_count and substantiated_sentinel_count computed; composite_certification_score stays 0.00 until submission"
      - "increments StrokeCenter.version by 1 (the OCC bump that makes a second stale create fail)"

  - method: GET
    path: "/stroke-network/certification-reports/{id}"
    description: "Reads one certification report with its variant-tagged rates, composite score and decision."
    roles: [ProgramCoordinator, CertificationReviewer, EdPhysician, Neurologist, TransferCoordinator, QualityAbstractor]
    code: 200
    input: []
    output: CertificationReport
    side_effects: []

  - method: GET
    path: "/stroke-network/certification-reports"
    description: "Lists certification reports; the center_id filter is the reverse-reachability channel for CertificationReport.center_id and the superseded_by_report_id filter for the self-referential supersede link."
    roles: [ProgramCoordinator, CertificationReviewer, EdPhysician, Neurologist, TransferCoordinator, QualityAbstractor]
    code: 200
    input: ["center_id?", "status?", "decision?", "superseded_by_report_id?", "rate_variant?", "limit?", "offset?"]
    output: CertificationReport[]
    side_effects: []

  - method: POST
    path: "/stroke-network/certification-reports/{id}/submit"
    description: "Submits the report for certification review, switching every rate to the CERTIFIED variant and producing the composite score."
    roles: [ProgramCoordinator]
    code: 200
    input: []
    output: CertificationReport
    side_effects:
      - "status := SUBMITTED; submitted_at := clock_now; submitted_by_user_id := X-User-ID"
      - "every attached abstraction still in DRAFT is DETACHED (report_id := null); every FINALIZED abstraction on an in-period closed case is attached; included_abstraction_count recomputed"
      - "rate_variant := CERTIFIED and the three rate fields recomputed under the CERTIFIED variant of calculations.measure_compliance_rate"
      - "mean_dtn_excess_pct := calculations.dtn_excess_reporting; substantiated_major_count and substantiated_sentinel_count recomputed"
      - "composite_certification_score := calculations.composite_certification_score"
      - "on a resubmission from RETURNED, decision is reset to PENDING and decided_by_user_id to null before recomputation"
      - "increments CertificationReport.version by 1"

  - method: POST
    path: "/stroke-network/certification-reports/{id}/decide"
    description: "The certification reviewer accepts or returns the report, driving the facility's certification status. Segregation of duties: the deciding user must differ from the submitting user (priority 45)."
    roles: [CertificationReviewer]
    code: 200
    input: ["reviewer_note?"]
    output: CertificationReport
    side_effects:
      - "decision derived from the composite_certification_score computed at submission; the score is NOT recomputed here"
      - "status := ACCEPTED when decision IN {CERTIFIED, CONDITIONAL}, RETURNED when decision == DENIED; decided_at := clock_now; decided_by_user_id := X-User-ID"
      - "CASCADE on acceptance: the center's certification_status := decision, consecutive_denied_report_count := 0, suspension_reason := null, and ems_routing_posture recomputed"
      - "CASCADE hop 1 on denial: the center's consecutive_denied_report_count += 1 and certification_status := SUSPENDED, or WITHDRAWN when it was already SUSPENDED with consecutive_denied_report_count == 1"
      - "CASCADE hop 2 on denial (caused by hop 1): the center's ems_routing_posture := BYPASS"
      - "CASCADE hop 3 on denial (caused by hop 1): every ACTIVE SpokeAgreement hubbed at the center transitions to SUSPENDED, cancelling its live consults and releasing their neurologists"
      - "increments CertificationReport.version by 1"

  - method: POST
    path: "/stroke-network/certification-reports/{id}/publish"
    description: "Publishes the accepted report, refreshing the facility's public door-to-needle figure via calculations.public_dtn_rollup."
    roles: [ProgramCoordinator]
    code: 200
    input: []
    output: CertificationReport
    side_effects:
      - "status := PUBLISHED; published_at := clock_now"
      - "CASCADE: the center's public_dtn_compliance_pct := calculations.public_dtn_rollup and public_report_published_at := clock_now"
      - "increments CertificationReport.version by 1"

# ============================================================================
# §1.6 Error Code Catalog
# ============================================================================

errors:

  # --- authentication / authorization / identity
  - id: ERR_UNAUTHENTICATED
    http: 401
    condition: "X-User-ID or X-User-Role header missing, empty, or naming a role outside the six declared in §1.7"
  - id: ERR_FORBIDDEN_ROLE
    http: 403
    condition: "the caller's role is not listed in the endpoint's roles"
  - id: ERR_NOT_CONSULT_OWNER
    http: 403
    condition: "a consult lifecycle action or a checklist determination is attempted by a Neurologist who is not the consult's assigned_neurologist_id"
  - id: ERR_SEGREGATION_OF_DUTIES
    http: 403
    condition: "a CertificationReport is decided by its submitter, or an abstraction is attested by the same user who abstracted it"

  # --- request shape
  - id: ERR_INVALID_REQUEST
    http: 422
    condition: "a required input field is missing, an unknown field is supplied, or a field carries the wrong JSON type or a malformed ISO-8601 instant"
  - id: ERR_INVALID_ENUM_VALUE
    http: 422
    condition: "an enum-typed input field carries a value outside its declared set, including a readiness component or result outside {CT_SCANNER, VIDEO_CART} / {PASS, FAIL}"
  - id: ERR_INVALID_PAGINATION
    http: 422
    condition: "limit outside [1, 100] or offset below 0 on a list endpoint"

  # --- existence
  - id: ERR_CENTER_NOT_FOUND
    http: 404
    condition: "a StrokeCenter id in the path or in center_id / hub_center_id / spoke_center_id / home_center_id / destination_center_id does not exist"
  - id: ERR_AGREEMENT_NOT_FOUND
    http: 404
    condition: "a SpokeAgreement id in the path or in agreement_id does not exist"
  - id: ERR_NEUROLOGIST_NOT_FOUND
    http: 404
    condition: "a Neurologist id in the path or in neurologist_id does not exist"
  - id: ERR_CASE_NOT_FOUND
    http: 404
    condition: "a CodeStrokeCase id in the path or in case_id does not exist"
  - id: ERR_CONSULT_NOT_FOUND
    http: 404
    condition: "a TelestrokeConsult id in the path does not exist"
  - id: ERR_CHECKLIST_NOT_FOUND
    http: 404
    condition: "a ThrombolyticChecklist id in the path does not exist"
  - id: ERR_TRANSFER_NOT_FOUND
    http: 404
    condition: "a TransferDecision id in the path does not exist"
  - id: ERR_DEVIATION_NOT_FOUND
    http: 404
    condition: "a ProtocolDeviation id in the path does not exist"
  - id: ERR_ABSTRACTION_NOT_FOUND
    http: 404
    condition: "a QualityMeasureAbstraction id in the path does not exist"
  - id: ERR_REPORT_NOT_FOUND
    http: 404
    condition: "a CertificationReport id in the path or in report_id does not exist"

  # --- optimistic concurrency (§1.2.1)
  - id: ERR_STALE_CASE_VERSION
    http: 412
    condition: "expected_case_version on POST /stroke-network/consults does not equal the CodeStrokeCase's current version"
  - id: ERR_STALE_CENTER_VERSION
    http: 412
    condition: "expected_center_version on POST /stroke-network/certification-reports does not equal the StrokeCenter's current version"

  # --- state preconditions
  - id: ERR_INVALID_CENTER_STATE
    http: 409
    condition: "a StrokeCenter action is attempted from a certification_status with no declared transition, e.g. suspending an already WITHDRAWN center"
  - id: ERR_INVALID_AGREEMENT_STATE
    http: 409
    condition: "a SpokeAgreement action is attempted from a status with no declared transition, e.g. activating a TERMINATED agreement or suspending a DRAFT one"
  - id: ERR_INVALID_ONCALL_TRANSITION
    http: 409
    condition: "an on-call state change is attempted that is not a declared Neurologist transition, e.g. requesting IN_CONSULT directly or moving OFF_DUTY to UNAVAILABLE"
  - id: ERR_INVALID_CONSULT_STATE
    http: 409
    condition: "a consult action is attempted from a status with no declared transition, e.g. accepting a COMPLETED consult, appending a video session to a REQUESTED consult, or declining an ESCALATED_UNFILLED one"
  - id: ERR_INVALID_TRANSFER_STATE
    http: 409
    condition: "a transfer action is attempted from a status with no declared transition, e.g. completing the handoff of a PROPOSED or DECLINED transfer"
  - id: ERR_INVALID_DEVIATION_STATE
    http: 409
    condition: "a deviation review action is attempted from a status with no declared transition, e.g. deciding an OPEN deviation or resubmitting one that is UNDER_REVIEW"
  - id: ERR_INVALID_ABSTRACTION_STATE
    http: 409
    condition: "an abstraction action is attempted from a status with no declared transition, e.g. finalizing a FINALIZED row, retracting a RETRACTED row, or retracting a row whose report has moved past RETURNED"
  - id: ERR_INVALID_REPORT_STATE
    http: 409
    condition: "a report action is attempted from a status with no declared transition, e.g. deciding a DRAFT report, publishing a SUBMITTED one, or submitting a SUPERSEDED one"
  - id: ERR_CASE_NOT_ACTIVE
    http: 409
    condition: "a consult request, checklist write, checklist determination, transfer proposal, thrombolytic administration or abstraction-time case action targets a CodeStrokeCase that is CLOSED or ABORTED, or targets a case whose current status has no declared transition for that action"

  # --- clinical safety (ordered block, priorities 48-60)
  - id: ERR_NO_VALID_VIDEO_SESSION
    http: 409
    condition: "a consult is completed with valid_video_session_count == 0"
  - id: ERR_ABSOLUTE_CONTRAINDICATION
    http: 422
    condition: "a thrombolytic is administered while the case's checklist records at least one ABSOLUTE contraindication"
  - id: ERR_ELIGIBILITY_NOT_DETERMINED
    http: 409
    condition: "a thrombolytic is administered before the checklist reaches documentation_status DOCUMENTED with determination_status ELIGIBLE or ELIGIBLE_WITH_RELATIVE_OVERRIDE"
  - id: ERR_CHECKLIST_INCOMPLETE
    http: 422
    condition: "a determination is attempted with confirmed_inclusion_item_count below REQUIRED_INCLUSION_ITEM_COUNT (4)"
  - id: ERR_OVERRIDE_JUSTIFICATION_REQUIRED
    http: 422
    condition: "a determination omits override_justification while relative_contraindication_count > 0, or supplies it while relative_contraindication_count == 0"
  - id: ERR_CONTRAINDICATION_EVIDENCE_REQUIRED
    http: 422
    condition: "an ABSOLUTE contraindication is documented without documented_evidence"
  - id: ERR_THROMBOLYTIC_WINDOW_EXPIRED
    http: 422
    condition: "the recomputed thrombolytic_window_class is OUT_OF_WINDOW at the moment of administration"
  - id: ERR_LKW_REQUIRED
    http: 422
    condition: "last_known_well_at is absent for an EXACT or ESTIMATED capture, present for an UNKNOWN_WAKE_UP capture, or later than door_at"
  - id: ERR_TRANSFER_MODE_MISMATCH
    http: 422
    condition: "mode DRIP_AND_SHIP is proposed for a case with no needle_at, or mode TRANSFER_ONLY for a case that already has one"
  - id: ERR_CENTER_EQUIPMENT_OFFLINE
    http: 409
    condition: "a code stroke activation or a consult request targets a StrokeCenter whose equipment_readiness_posture is OFFLINE, or an imaging completion targets a center whose ct_scanner_ready is false, or a thrombolytic administration targets a center whose equipment_readiness_posture is OFFLINE"
  - id: ERR_DESTINATION_NOT_THROMBECTOMY_CAPABLE
    http: 422
    condition: "the destination of a transfer has facility_type other than THROMBECTOMY_CAPABLE"
  - id: ERR_DESTINATION_BYPASS
    http: 409
    condition: "the destination of a transfer has ems_routing_posture BYPASS at proposal time, or has fallen to BYPASS by the time the transfer is accepted"

  # --- referential integrity
  - id: ERR_SELF_REFERRAL_TRANSFER
    http: 409
    condition: "destination_center_id equals the origin case's center_id"
  - id: ERR_SPOKE_AGREEMENT_SELF_PAIR
    http: 409
    condition: "hub_center_id equals spoke_center_id, or hub_center_id names a center whose facility_type is not HUB_PRIMARY"
  - id: ERR_AGREEMENT_CENTER_MISMATCH
    http: 409
    condition: "the agreement named on a consult request has spoke_center_id different from the case's center_id"
  - id: ERR_PROXY_CREDENTIAL_INVALID
    http: 422
    condition: "a proxy credential is granted to a neurologist whose home_center_id is not the agreement's hub_center_id, or duplicates an existing GRANTED grant for the same (neurologist_id, privilege_scope) pair"

  # --- temporal
  - id: ERR_AGREEMENT_WINDOW_CLOSED
    http: 409
    condition: "a consult is requested before the agreement's effective_from"
  - id: ERR_AGREEMENT_NOT_ACTIVE
    http: 409
    condition: "the agreement named on a consult request is not ACTIVE, including immediately after the automatic expiry termination at effective_until"
  - id: ERR_INVALID_PERIOD_RANGE
    http: 422
    condition: "effective_from is not strictly before effective_until, or period_start is not strictly before period_end"
  - id: ERR_REPORT_PERIOD_OVERLAP
    http: 409
    condition: "a new report's half-open [period_start, period_end) intersects a non-SUPERSEDED report's interval for the same center; exact adjacency does NOT trigger this"
  - id: ERR_NEUROLOGIST_COOLDOWN_ACTIVE
    http: 409
    condition: "a neurologist accepts a consult fewer than NEUROLOGIST_COOLDOWN_MIN (10) whole minutes after last_consult_completed_at"

  # --- capacity, uniqueness and gating
  - id: ERR_AGREEMENT_CONSULT_CAPACITY
    http: 409
    condition: "the agreement already carries max_concurrent_consults consults in status REQUESTED, ASSIGNED or IN_SESSION"
  - id: ERR_DUPLICATE_CHECKLIST
    http: 409
    condition: "a second ThrombolyticChecklist is created for a case that already has one"
  - id: ERR_DUPLICATE_ABSTRACTION
    http: 409
    condition: "a second non-RETRACTED abstraction is created for the same (case_id, measure_code) pair"
  - id: ERR_DUPLICATE_INCLUSION_ITEM
    http: 409
    condition: "an inclusion item code is confirmed twice, or is not one of REQUIRED_INCLUSION_ITEM_CODES"
  - id: ERR_NO_FINALIZED_ABSTRACTIONS
    http: 422
    condition: "a report is submitted with included_abstraction_count == 0"
  - id: ERR_INSUFFICIENT_CASE_VOLUME
    http: 422
    condition: "a report is submitted with closed_case_count_in_period below MIN_CLOSED_CASES_PER_PERIOD (2)"
  - id: ERR_REVIEW_ROUND_LIMIT
    http: 409
    condition: "a deviation is returned for information when review_round has already reached MAX_REVIEW_ROUNDS (3)"
  - id: ERR_DEBRIEF_REQUIRED
    http: 422
    condition: "a SENTINEL deviation is substantiated while debrief_completed is false"
  - id: ERR_HANDOFF_PACKET_INCOMPLETE
    http: 422
    condition: "the handoff packet omits an item required for the transfer's mode"
  - id: ERR_CENTER_NOT_CERTIFIED
    http: 409
    condition: "a report is published while its center's certification_status is SUSPENDED or WITHDRAWN"

# ============================================================================
# §1.7 RBAC Matrix
# ============================================================================

roles:

  - name: EdPhysician
    description: "Emergency department physician at a spoke or hub facility. Owns code stroke activation, the imaging clock, checklist documentation, thrombolytic administration, local closure and abort."
    identity: opaque
    exclusive_operations:
      - "POST /stroke-network/code-strokes"
      - "POST /stroke-network/code-strokes/{id}/imaging-complete"
      - "POST /stroke-network/code-strokes/{id}/administer-thrombolytic"
      - "POST /stroke-network/code-strokes/{id}/abort"
      - "POST /stroke-network/consults"
      - "POST /stroke-network/checklists"
      - "POST /stroke-network/checklists/{id}/inclusion-items"
      - "POST /stroke-network/checklists/{id}/contraindications"
      - "POST /stroke-network/checklists/{id}/amend"
    shared_operations:
      - "POST /stroke-network/code-strokes/{id}/close (with QualityAbstractor)"
      - "POST /stroke-network/deviations (with QualityAbstractor)"
      - "POST /stroke-network/deviations/{id}/debrief (with QualityAbstractor)"
      - "POST /_clock/set_current_utc (with all roles)"
      - "every GET endpoint"

  - name: Neurologist
    description: "On-call teleneurologist credentialed by proxy under a spoke agreement. Owns the consult session and the eligibility attestation. This is the only entity-backed role: X-User-ID resolves to a Neurologist row."
    identity: "entity_backed:Neurologist"
    exclusive_operations:
      - "POST /stroke-network/consults/{id}/accept"
      - "POST /stroke-network/consults/{id}/decline"
      - "POST /stroke-network/consults/{id}/video-sessions"
      - "POST /stroke-network/consults/{id}/complete"
      - "POST /stroke-network/checklists/{id}/determine"
    shared_operations:
      - "POST /stroke-network/neurologists/{id}/on-call-state (with ProgramCoordinator)"
      - "POST /_clock/set_current_utc (with all roles)"
      - "every GET endpoint"
    identity_rules:
      - "the Neurologist resolved from X-User-ID must equal the consult's assigned_neurologist_id for every consult action and for the determination of that case's checklist (ERR_NOT_CONSULT_OWNER, priority 8)"

  - name: TransferCoordinator
    description: "Transfer centre coordinator who proposes, accepts, declines and settles transfers to thrombectomy-capable centers."
    identity: opaque
    exclusive_operations:
      - "POST /stroke-network/transfer-decisions"
      - "POST /stroke-network/transfer-decisions/{id}/accept"
      - "POST /stroke-network/transfer-decisions/{id}/decline"
      - "POST /stroke-network/transfer-decisions/{id}/complete-handoff"
    shared_operations:
      - "POST /_clock/set_current_utc (with all roles)"
      - "every GET endpoint"

  - name: QualityAbstractor
    description: "Quality department abstractor who abstracts measures, attests them and supplies deviation review information."
    identity: opaque
    exclusive_operations:
      - "POST /stroke-network/abstractions"
      - "POST /stroke-network/abstractions/{id}/finalize"
      - "POST /stroke-network/abstractions/{id}/retract"
      - "POST /stroke-network/deviations/{id}/resubmit"
    shared_operations:
      - "POST /stroke-network/code-strokes/{id}/close (with EdPhysician)"
      - "POST /stroke-network/deviations (with EdPhysician)"
      - "POST /stroke-network/deviations/{id}/debrief (with EdPhysician)"
      - "POST /_clock/set_current_utc (with all roles)"
      - "every GET endpoint"
    identity_rules:
      - "the attesting X-User-ID on POST /stroke-network/abstractions/{id}/finalize must differ from the row's abstracted_by_user_id (ERR_SEGREGATION_OF_DUTIES, priority 45)"

  - name: ProgramCoordinator
    description: "Stroke programme coordinator who maintains the network registry, agreements, proxy credentials, equipment attestations, reporting periods and publication."
    identity: opaque
    exclusive_operations:
      - "POST /stroke-network/stroke-centers"
      - "PATCH /stroke-network/stroke-centers/{id}"
      - "POST /stroke-network/stroke-centers/{id}/readiness-attestations"
      - "POST /stroke-network/spoke-agreements"
      - "POST /stroke-network/spoke-agreements/{id}/activate"
      - "POST /stroke-network/spoke-agreements/{id}/proxy-credentials"
      - "POST /stroke-network/neurologists"
      - "POST /stroke-network/certification-reports"
      - "POST /stroke-network/certification-reports/{id}/submit"
      - "POST /stroke-network/certification-reports/{id}/publish"
    shared_operations:
      - "POST /stroke-network/spoke-agreements/{id}/suspend (with CertificationReviewer)"
      - "POST /stroke-network/neurologists/{id}/on-call-state (with Neurologist)"
      - "POST /_clock/set_current_utc (with all roles)"
      - "every GET endpoint"

  - name: CertificationReviewer
    description: "External certification body reviewer who suspends facilities, reviews protocol deviations and decides certification reports. Never submits the reports it decides."
    identity: opaque
    exclusive_operations:
      - "POST /stroke-network/stroke-centers/{id}/suspend"
      - "POST /stroke-network/certification-reports/{id}/decide"
      - "POST /stroke-network/deviations/{id}/start-review"
      - "POST /stroke-network/deviations/{id}/return-for-info"
      - "POST /stroke-network/deviations/{id}/decide"
    shared_operations:
      - "POST /stroke-network/spoke-agreements/{id}/suspend (with ProgramCoordinator)"
      - "POST /_clock/set_current_utc (with all roles)"
      - "every GET endpoint"
    identity_rules:
      - "the deciding X-User-ID on POST /stroke-network/certification-reports/{id}/decide must differ from the report's submitted_by_user_id (ERR_SEGREGATION_OF_DUTIES, priority 45)"
