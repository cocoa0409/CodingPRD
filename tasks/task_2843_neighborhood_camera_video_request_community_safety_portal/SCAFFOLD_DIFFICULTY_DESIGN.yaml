  # ===========================================================================
  - rule_id: non_linear_state_machine
    instances:
      - name: resident_post_two_full_revision_laps_then_cycle_termination
        grounds:
          - state_machines.ResidentPost.state
          - state_machines.ResidentPost.state.REVISION_REQUESTED_to_FLAGGED
          - state_machines.ResidentPost.state.REVISION_REQUESTED_to_PUBLISHED
          - state_machines.ResidentPost.state.UNDER_REVIEW_to_REMOVED
          - state_machines.ModerationCase.state.OPEN_to_SUPERSEDED
          - entities.ResidentPost.fields.revision_count
          - validations[priority=25]
          - errors.ERR_POST_NOT_REVISABLE
        distinguishing_aspect: |
          The ResidentPost machine is genuinely cyclic: PUBLISHED -> FLAGGED -> UNDER_REVIEW
          -> REVISION_REQUESTED can close back into EITHER FLAGGED or PUBLISHED depending on
          the re-scored discrimination signals, so the same row visits FLAGGED and UNDER_REVIEW
          twice and PUBLISHED twice while flag_count never resets. The loop is bounded by a
          counter rather than by topology: the third REQUEST_REVISION decision does NOT take
          the REVISION_REQUESTED edge at all, it takes the REMOVED edge, because
          revision_count has reached MAX_REVISION_CYCLES — a monotone counter changes the
          destination of an otherwise identical trigger.
        test_recipe:
          setup:
            - "Clock at 2026-08-12T00:00:00Z."
            - "Author RA at (0,0) with alert_radius_m 0; three other residents RB, RC, RD with alert_radius_m 0 so no post ever fans out."
            - "RA publishes post P with all four classifier signals 0, so discrimination_score is 0.00 and state is PUBLISHED."
            - "RB then RC flag P, pushing flag_count to RESIDENT_FLAG_THRESHOLD 2 and moving P to FLAGGED."
            - "Moderator mod-1 opens ModerationCase C1 against the post's current version, moving P to UNDER_REVIEW."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-12T00:00:00Z" }
              as: PlatformAdmin
              as_user_id: "admin-1"
            - call: "POST /neighborhood-safety/residents"
              payload: { display_name: "RA", email: "ra@example.test", home_x_m: 0, home_y_m: 0, alert_radius_m: 0, notification_budget_per_day: 6 }
              as: Anonymous
              captures: { ra_id: "$.data.id" }
            - call: "POST /neighborhood-safety/residents"
              payload: { display_name: "RB", email: "rb@example.test", home_x_m: 100, home_y_m: 0, alert_radius_m: 0, notification_budget_per_day: 6 }
              as: Anonymous
              captures: { rb_id: "$.data.id" }
            - call: "POST /neighborhood-safety/residents"
              payload: { display_name: "RC", email: "rc@example.test", home_x_m: 200, home_y_m: 0, alert_radius_m: 0, notification_budget_per_day: 6 }
              as: Anonymous
              captures: { rc_id: "$.data.id" }
            - call: "POST /neighborhood-safety/residents"
