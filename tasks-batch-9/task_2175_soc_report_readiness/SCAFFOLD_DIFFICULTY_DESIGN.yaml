  - rule_id: priority_pair_validation_conflict
    instances:
      - name: frozen_posture_state_beats_control_out_of_scope_referential
        grounds:
          - validations[priority=120]
          - validations[priority=190]
          - errors[ERR_ENGAGEMENT_FROZEN]
          - errors[ERR_CONTROL_OUT_OF_SCOPE]
          - calculations.engagement_gap_posture
        distinguishing_aspect: |
          Pair (state, business_referential): one POST /soc/criteria-mappings violates both the
          FROZEN posture gate at priority 120 and the in-scope-control rule at priority 190; the
          response must be ERR_ENGAGEMENT_FROZEN (409), never ERR_CONTROL_OUT_OF_SCOPE.
        test_recipe:
          setup:
            - "Engagement 'Litware' is in status SCOPING with one OPEN Gap of severity CRITICAL, so gap_posture is FROZEN."
            - "SubserviceOrganization 'HostCo' has method CARVE_OUT."
            - "Control P-01 carries subservice_organization_id HostCo and therefore has in_scope false."
            - "Criterion CC1.1 is in scope for the engagement."
          setup_api_calls:
            - call: "POST /soc/trust-criteria"
              payload: { criterion_code: "CC1.1", category: "SECURITY", title: "Control environment", min_primary_controls: 1, applies_to_report_types: ["SOC_2_TYPE_2"] }
              as: PlatformAdmin
              captures: { cc11: $.data.id }
            - call: "POST /soc/engagements"
              payload: { client_name: "Litware", report_type: "SOC_2_TYPE_2", observation_period_start: "2026-09-01T00:00:00.000Z", observation_period_end: "2026-11-30T00:00:00.000Z", required_criteria_categories: ["SECURITY"], max_distribution_recipients: 5 }
              as: ComplianceLead
              as_user_id: "cl-1"
              captures: { eng: $.data.id }
            - call: "POST /soc/subservice-organizations"
              payload: { engagement_id: "${eng}", name: "HostCo", services_provided: "Colocation", coverage_start: "2026-09-01T00:00:00.000Z", coverage_end: "2026-11-30T00:00:00.000Z" }
              as: ComplianceLead
              as_user_id: "cl-1"
              captures: { sso: $.data.id }
            - call: "POST /soc/controls"
              payload: { engagement_id: "${eng}", control_ref: "P-01", title: "Colocation access log review", frequency: "MONTHLY", automation: "MANUAL", risk_rating: "MODERATE", population_size: 10, subservice_organization_id: "${sso}" }
              as: ComplianceLead
              as_user_id: "cl-1"
              captures: { p01: $.data.id }
            - call: "POST /soc/gaps"
              payload: { engagement_id: "${eng}", severity: "CRITICAL", description: "No incident response capability" }
              as: ComplianceLead
              as_user_id: "cl-1"
              captures: { g_crit: $.data.id }
          trigger:
            - call: "POST /soc/criteria-mappings"
              payload: { control_id: "${p01}", trust_criterion_id: "${cc11}", mapping_type: "PRIMARY" }
              as: ComplianceLead
              as_user_id: "cl-1"
              captures: { err: $.data.error_id }
          assert:
            - "HTTP status == 409"
            - "${err} == ERR_ENGAGEMENT_FROZEN"
            - "Engagement.${eng}.gap_posture == FROZEN"
            - "Engagement.${eng}.base_debt_points == 20"
            - "Engagement.${eng}.gap_debt_points == 23.00"
            - "Control.${p01}.in_scope == false"
            - "Control.${p01}.active_mapping_count == 0"
            - "GET /soc/criteria-mappings?control_id=${p01} returns total_count == 0"

      - name: control_ownership_safety_beats_evidence_window_temporal
        grounds:
          - validations[priority=155]
          - validations[priority=260]
          - errors[ERR_NOT_CONTROL_OWNER]
          - errors[ERR_EVIDENCE_WINDOW_CLOSED]
          - state_machines.EvidenceRequest.SCHEDULED_to_SUBMITTED
        distinguishing_aspect: |
          Pair (business_safety, business_temporal): one POST /soc/evidence-requests/{id}/submit is
          made by a non-owner AND after the due date, violating priority 155 and priority 260 at once;
          the response must be ERR_NOT_CONTROL_OWNER (403), never ERR_EVIDENCE_WINDOW_CLOSED.
        test_recipe:
          setup:
            - "Engagement 'Adventure' (SOC_2_TYPE_2, categories [SECURITY]) is in status OBSERVATION with gap_posture OPEN."
            - "Control S-01 is DESIGN_APPROVED, IN_OBSERVATION, and owned by operator id own-1."
            - "Its EvidenceRequest for period 2026-09-01 to 2026-10-01 is SCHEDULED with due_date 2026-10-06."
            - "The logical clock reads 2026-10-20, strictly after that due date."
          setup_api_calls:
            - call: "POST /soc/trust-criteria"
              payload: { criterion_code: "CC1.1", category: "SECURITY", title: "Control environment", min_primary_controls: 1, applies_to_report_types: ["SOC_2_TYPE_2"] }
              as: PlatformAdmin
              captures: { cc11: $.data.id }
            - call: "POST /soc/engagements"
              payload: { client_name: "Adventure", report_type: "SOC_2_TYPE_2", observation_period_start: "2026-09-01T00:00:00.000Z", observation_period_end: "2026-11-30T00:00:00.000Z", required_criteria_categories: ["SECURITY"], max_distribution_recipients: 5 }
              as: ComplianceLead
              as_user_id: "cl-1"
              captures: { eng: $.data.id, eng_v: $.data.version }
            - call: "POST /soc/system-descriptions"
              payload: { engagement_id: "${eng}", version_label: "v1", boundary_narrative: "Adventure platform boundary.", expected_engagement_version: "${eng_v}" }
              as: ComplianceLead
              as_user_id: "cl-1"
              captures: { sd: $.data.id }
            - call: "POST /soc/boundary-components"
              payload: { system_description_id: "${sd}", component_type: "SOFTWARE", name: "Core API" }
              as: ComplianceLead
              as_user_id: "cl-1"
            - call: "POST /soc/system-descriptions/${sd}/transitions"
              payload: { action: "SUBMIT_REVIEW" }
              as: ComplianceLead
              as_user_id: "cl-1"
            - call: "POST /soc/system-descriptions/${sd}/transitions"
              payload: { action: "APPROVE" }
              as: Auditor
              as_user_id: "aud-1"
            - call: "POST /soc/system-descriptions/${sd}/lock-boundary"
              payload: {}
              as: ComplianceLead
              as_user_id: "cl-1"
            - call: "POST /soc/controls"
              payload: { engagement_id: "${eng}", control_ref: "S-01", title: "Change approvals", frequency: "QUARTERLY", automation: "MANUAL", risk_rating: "MODERATE", population_size: 20 }
              as: ComplianceLead
              as_user_id: "cl-1"
              captures: { s01: $.data.id }
            - call: "POST /soc/criteria-mappings"
              payload: { control_id: "${s01}", trust_criterion_id: "${cc11}", mapping_type: "PRIMARY" }
              as: ComplianceLead
              as_user_id: "cl-1"
            - call: "POST /soc/controls/${s01}/assign-owner"
              payload: { owner_user_id: "own-1" }
              as: ComplianceLead
              as_user_id: "cl-1"
            - call: "POST /soc/evidence-requests"
              payload: { control_id: "${s01}", period_index: 0, period_start: "2026-09-01T00:00:00.000Z", period_end: "2026-10-01T00:00:00.000Z" }
              as: ComplianceLead
              as_user_id: "cl-1"
              captures: { er0: $.data.id }
            - call: "POST /soc/engagements/${eng}/transitions"
              payload: { action: "START_READINESS" }
              as: ComplianceLead
              as_user_id: "cl-1"
            - call: "POST /soc/controls/${s01}/transitions"
              payload: { action: "APPROVE_DESIGN" }
              as: Auditor
              as_user_id: "aud-1"
            - call: "POST /soc/engagements/${eng}/readiness-assessment"
              payload: {}
              as: ComplianceLead
              as_user_id: "cl-1"
            - call: "POST /soc/engagements/${eng}/transitions"
              payload: { action: "START_OBSERVATION" }
              as: ComplianceLead
              as_user_id: "cl-1"
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-10-20T00:00:00.000Z" }
              as: PlatformAdmin
          trigger:
            - call: "POST /soc/evidence-requests/${er0}/submit"
              payload: { artifact_ref: "art-late" }
              as: ControlOwner
              as_user_id: "own-9"
              captures: { err: $.data.error_id }
          assert:
            - "HTTP status == 403"
            - "${err} == ERR_NOT_CONTROL_OWNER"
            - "EvidenceRequest.${er0}.status == SCHEDULED"
            - "EvidenceRequest.${er0}.submitted_by_user_id == null"
            - "EvidenceRequest.${er0}.due_date == 2026-10-06T00:00:00.000Z"
            - "Control.${s01}.evidence_scheduled_count == 1"

      - name: role_auth_beats_control_existence_lookup
        grounds:
          - validations[priority=30]
          - validations[priority=50]
          - errors[ERR_ROLE_NOT_PERMITTED]
          - errors[ERR_CONTROL_NOT_FOUND]
          - roles.ComplianceLead
        distinguishing_aspect: |
          Pair (auth, existence): an Auditor calls POST /soc/controls/{id}/assign-owner — a
          ComplianceLead-only endpoint — with a well-formed but non-existent control id; priority 30
          fires before the priority 50 lookup, so the response is ERR_ROLE_NOT_PERMITTED (403), not
          ERR_CONTROL_NOT_FOUND (404).
        test_recipe:
          setup:
            - "Engagement 'Fourth Coffee' exists in status SCOPING with one real control R-01."
            - "The id 00000000-0000-4000-8000-000000000000 belongs to no Control row."
          setup_api_calls:
            - call: "POST /soc/engagements"
              payload: { client_name: "Fourth Coffee", report_type: "SOC_2_TYPE_2", observation_period_start: "2026-09-01T00:00:00.000Z", observation_period_end: "2026-11-30T00:00:00.000Z", required_criteria_categories: ["SECURITY"], max_distribution_recipients: 5 }
              as: ComplianceLead
