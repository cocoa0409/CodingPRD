# =============================================================================
# Task 1169: Affordable Housing Waitlist & Lottery Administration
# Scaffold seed tables (§1.0–§1.7). Difficulty: beyond-Expert (dense coupling,
# 14 entities, 53 endpoints, dual-variant calcs on two domains, 3 combinatorial
# modes, cyclic state machines, segregation of duties, OCC on campaign).
# =============================================================================

scenario: |
  1169. Affordable Housing Waitlist & Lottery Administration (affordable housing developer): application period announcement & marketing plan, preference categories (local/veteran/accessibility) & verification, lottery run & ranked list generation, income certification & documentation review, unit-size matching per occupancy standards, offer/refusal rules & removal from list, waitlist purge & reopening, compliance reporting to funding agency

domain_name: affordable-housing-waitlist
api_prefix: ""

complexity_profile:
  primary_archetype: quota_allocation        # finite unit pool, preference-tier preemption, selector fallback
  secondary_archetype: compliance_audit      # funding-agency reporting, segregation of duties, audit trail
  complexity_layers:
    - optimistic_concurrency                 # OCC on ApplicationCampaign.version for lottery/purge creation
    - cascading_side_effects                 # offer decline -> refusal count -> removal -> unit release -> counters
    - selector_policy                        # offer generation: eligibility filter, ranking, tie-break, empty-pool fallback
    - scheduled_actions                      # logical clock drives windows, offer deadlines, purge deadlines, cert expiry
  entity_topology: flat                      # peer entities joined by FK references, no nested URL paths
  state_machine_shape: cyclic                # review cycle, offer/refusal cycle, report return cycle, purge/reopen cycle
  relationship_patterns:
    - one_to_many
    - cross_aggregate
  role_model: segregation_of_duties          # lottery operator may not certify income on the same campaign
  consistency_model: immediate

# =============================================================================
# §1.0 Response Envelope (FIXED — verbatim)
# =============================================================================
response_envelope:
  success: |
    { "meta": { "api_request_id": "req_xxx", "api_request_timestamp": "ISO8601" },
      "response_type": "object" | "array", "data": {} }
  error: |
    { "meta": { ... }, "response_type": "error",
      "data": { "error_id": "ERR_XXX", "message": "..." } }
  pagination_fields: ["limit", "offset", "total_count", "has_more"]
  pagination_defaults: { limit: 10, min: 1, max: 100, offset: 0 }

# =============================================================================
# §1.1 Entity-Relationship Table
# =============================================================================
entities:
  - name: Property
    parent: null
    common_fields: true
    fields:
      - { name: name, type: string, source: input, description: "Development name" }
      - { name: address_line, type: string, source: input, description: "Street address" }
      - { name: city, type: string, source: input, description: "City" }
      - { name: state_code, type: string, source: input, description: "Two-letter state code" }
      - { name: units_total, type: integer, source: computed, description: "Count of Unit rows for this property" }
      - { name: units_available_count, type: integer, source: computed, description: "Units with status AVAILABLE" }
      - { name: units_reserved_count, type: integer, source: computed, description: "Units with status RESERVED" }
      - { name: units_leased_count, type: integer, source: computed, description: "Units with status LEASED" }
      - { name: units_out_of_service_count, type: integer, source: computed, description: "Units with status OUT_OF_SERVICE" }

  - name: Unit
    parent: null
    common_fields: true
    fields:
      - { name: property_id, type: string, source: input, description: "FK -> Property.id; owning development" }
      - { name: unit_number, type: string, source: input, description: "Unit label; unique within property" }
      - { name: bedroom_count, type: enum, source: input, description: "STUDIO | ONE_BR | TWO_BR | THREE_BR" }
      - { name: ami_tier, type: enum, source: input, description: "AMI_30 | AMI_50 | AMI_60 | AMI_80 — rent-restriction tier of this unit" }
      - { name: accessibility_feature, type: enum, source: input, default: "NONE", description: "NONE | MOBILITY | HEARING_VISION" }
      - { name: status, type: enum, source: system, description: "AVAILABLE | RESERVED | LEASED | OUT_OF_SERVICE; initial AVAILABLE" }

  - name: OccupancyStandard
    parent: null
    common_fields: true
    fields:
      - { name: property_id, type: string, source: input, description: "FK -> Property.id" }
      - { name: bedroom_count, type: enum, source: input, description: "STUDIO | ONE_BR | TWO_BR | THREE_BR" }
      - { name: min_occupants, type: integer, source: input, description: "Minimum household size (inclusive), >= 1" }
      - { name: max_occupants, type: integer, source: input, description: "Maximum household size (inclusive), >= min_occupants" }
      - { name: uniqueness_scope, type: string, source: system, description: "One row per (property_id, bedroom_count); duplicates rejected with ERR_CONFIG_CONFLICT" }

  - name: AmiLimit
    parent: null
    common_fields: true
    fields:
      - { name: property_id, type: string, source: input, description: "FK -> Property.id" }
      - { name: household_size, type: integer, source: input, description: "Household size this row prices, 1..12" }
      - { name: ami_tier, type: enum, source: input, description: "AMI_30 | AMI_50 | AMI_60 | AMI_80" }
      - { name: annual_limit_cents, type: integer, source: input, description: "Maximum annual household income for this tier, integer cents > 0" }
      - { name: uniqueness_scope, type: string, source: system, description: "One row per (property_id, household_size, ami_tier); duplicates rejected with ERR_CONFIG_CONFLICT" }

  - name: ApplicationCampaign
    parent: null
    common_fields: true
    fields:
      - { name: property_id, type: string, source: input, description: "FK -> Property.id" }
      - { name: name, type: string, source: input, description: "Campaign name" }
      - { name: application_open_at, type: datetime, source: input, description: "Application window open instant (UTC)" }
      - { name: application_close_at, type: datetime, source: input, description: "Application window close instant (UTC); window is half-open [open_at, close_at)" }
      - { name: marketing_channels, type: array, source: input, description: "Array of COMMUNITY_MEETING | LOCAL_NEWSPAPER | SOCIAL_MEDIA | HOUSING_AUTHORITY_WEBSITE | MAILERS; announcement requires >= 2 channels" }
      - { name: marketing_plan_summary, type: string, source: input, description: "Free-text outreach plan narrative" }
      - { name: target_ami_tier, type: enum, source: input, default: "AMI_60", description: "AMI tier this campaign certifies against" }
      - { name: status, type: enum, source: system, description: "DRAFT | ANNOUNCED | OPEN | CLOSED | LOTTERY_COMPLETED | LEASING | PURGE_SCHEDULED | PURGED" }
      - { name: applications_received_count, type: integer, source: computed, description: "Applications with status IN {SUBMITTED, UNDER_REVIEW, NEEDS_INFO, VERIFIED}" }
      - { name: waitlist_active_count, type: integer, source: computed, description: "WaitlistEntries with status IN {RANKED, OFFERED} for this campaign" }
      - { name: entries_leased_count, type: integer, source: computed, description: "WaitlistEntries with status LEASED for this campaign" }
      - { name: reopen_count, type: integer, source: computed, description: "Number of PURGED -> OPEN reopen transitions" }

  - name: Applicant
    parent: null
    common_fields: true
    fields:
      - { name: full_name, type: string, source: input, description: "Head of household name" }
      - { name: email, type: string, source: input, description: "Contact email" }

  - name: Application
    parent: null
    common_fields: true
    fields:
      - { name: applicant_id, type: string, source: input, description: "FK -> Applicant.id; must equal X-User-ID when role is Applicant" }
      - { name: campaign_id, type: string, source: input, description: "FK -> ApplicationCampaign.id" }
      - { name: household_size, type: integer, source: input, description: "Persons in household, 1..12 (ERR_HOUSEHOLD_SIZE_INVALID outside)" }
      - { name: self_reported_annual_income_cents, type: integer, source: input, description: "Applicant-declared gross annual income, integer cents >= 0" }
      - { name: confirmation_code, type: string, source: system, description: "Server-minted lottery ticket code returned at submit; input to the seeded lottery hash" }
      - { name: provisional_determination, type: enum, source: computed, description: "PROVISIONALLY_ELIGIBLE | PROVISIONALLY_OVER_INCOME | UNASSESSED — from self-reported income vs target-tier AmiLimit at submit" }
      - { name: verified_preference_categories, type: array, source: computed, description: "Categories of this application's VERIFIED PreferenceClaims" }
      - { name: status, type: enum, source: system, description: "SUBMITTED | UNDER_REVIEW | NEEDS_INFO | VERIFIED | REJECTED | WITHDRAWN" }
      - { name: verified_at, type: datetime, source: system, description: "Set on transition to VERIFIED; null otherwise" }
      - { name: rejection_reason, type: string, source: system, description: "Set on REJECT; null otherwise" }

  - name: PreferenceClaim
    parent: null
    common_fields: true
    fields:
      - { name: application_id, type: string, source: input, description: "FK -> Application.id" }
      - { name: category, type: enum, source: input, description: "LOCAL_RESIDENT | VETERAN | ACCESSIBILITY; one claim per category per application" }
      - { name: evidence_ref, type: string, source: input, description: "Document reference; empty rejected with ERR_PREFERENCE_EVIDENCE_REQUIRED" }
      - { name: status, type: enum, source: system, description: "PENDING | VERIFIED | DENIED; DENIED may be appealed back to PENDING" }
      - { name: denial_reason, type: string, source: system, description: "Required on DENY; null otherwise" }
      - { name: decided_at, type: datetime, source: system, description: "Timestamp of latest VERIFY/DENY decision; null while PENDING before first decision" }
      - { name: decided_by, type: string, source: system, description: "X-User-ID of the deciding clerk" }

  - name: IncomeCertification
    parent: null
    common_fields: true
    fields:
      - { name: application_id, type: string, source: input, description: "FK -> Application.id; application must be VERIFIED (ERR_APPLICATION_NOT_VERIFIED)" }
      - { name: status, type: enum, source: system, description: "INITIATED | DOCS_REQUESTED | DOCS_RECEIVED | CERTIFIED | DENIED" }
      - { name: required_docs, type: array, source: system, description: "List of required income source_type strings set by REQUEST_DOCS" }
      - { name: income_sources, type: array, source: system, description: "Submitted by applicant: [{source_type, amount_per_period_cents (number), periods_per_year (integer)}]" }
      - { name: certified_annual_income_cents, type: integer, source: computed, description: "Sum over sources of per-source annualization rounded to whole dollars (round_half_up), restated in cents; null until CERTIFY" }
      - { name: ami_percentage_bp, type: integer, source: computed, description: "round_half_up(certified_annual_income_cents / target-tier limit x 10000); null until CERTIFY" }
      - { name: determination, type: enum, source: computed, description: "ELIGIBLE on successful CERTIFY; null otherwise (over-income CERTIFY is rejected with ERR_OVER_INCOME)" }
      - { name: certified_at, type: datetime, source: system, description: "Set on CERTIFY" }
      - { name: certified_by, type: string, source: system, description: "X-User-ID of certifying ComplianceOfficer (segregation-of-duties input)" }
      - { name: valid_until, type: datetime, source: computed, description: "certified_at + CERTIFICATION_VALID_DAYS (180); null until CERTIFY" }
      - { name: denial_reason, type: string, source: system, description: "Set on DENY" }

  - name: LotteryRun
    parent: null
    common_fields: true
    fields:
      - { name: campaign_id, type: string, source: input, description: "FK -> ApplicationCampaign.id; campaign must be CLOSED" }
      - { name: seed, type: string, source: input, description: "Operator-supplied lottery seed string; makes the draw deterministic" }
      - { name: status, type: enum, source: system, description: "DRAFT | SEALED | EXECUTED | PUBLISHED | VOIDED" }
      - { name: eligible_application_count, type: integer, source: computed, description: "Snapshot count of campaign Applications with status VERIFIED, frozen at SEAL" }
      - { name: entries_generated, type: integer, source: computed, description: "WaitlistEntry rows created at EXECUTE" }
      - { name: sealed_by, type: string, source: system, description: "X-User-ID at SEAL" }
      - { name: executed_by, type: string, source: system, description: "X-User-ID at EXECUTE" }
      - { name: published_by, type: string, source: system, description: "X-User-ID at PUBLISH" }
      - { name: sealed_at, type: datetime, source: system, description: "Set at SEAL" }
      - { name: executed_at, type: datetime, source: system, description: "Set at EXECUTE" }
      - { name: published_at, type: datetime, source: system, description: "Set at PUBLISH" }
      - { name: void_reason, type: string, source: system, description: "Required on VOID" }

  - name: WaitlistEntry
    parent: null
    common_fields: true
    fields:
      - { name: lottery_run_id, type: string, source: system, description: "FK -> LotteryRun.id; set at EXECUTE" }
      - { name: campaign_id, type: string, source: system, description: "FK -> ApplicationCampaign.id" }
      - { name: application_id, type: string, source: system, description: "FK -> Application.id" }
      - { name: base_rank, type: integer, source: computed, description: "1..N position from ascending sha256_hex(seed + ':' + confirmation_code) ordering" }
      - { name: preference_tier, type: integer, source: computed, description: "1 if any VERIFIED LOCAL_RESIDENT claim; else 2 if VETERAN; else 3 if ACCESSIBILITY; else 4" }
      - { name: effective_rank, type: integer, source: computed, description: "1..N position from sort (preference_tier ASC, base_rank ASC, application.created_at ASC)" }
      - { name: refusal_count, type: integer, source: computed, description: "Incremented on DECLINE and on EXPIRE of a PENDING offer; not on VOID" }
      - { name: last_confirmed_at, type: datetime, source: system, description: "Set by confirm-interest during an active purge notice window" }
      - { name: removal_reason, type: enum, source: system, description: "MAX_REFUSALS | PURGED | LOTTERY_VOIDED | ADMIN_REMOVED; null while not REMOVED" }
      - { name: removed_at, type: datetime, source: system, description: "Set on transition to REMOVED" }
      - { name: status, type: enum, source: system, description: "RANKED | OFFERED | LEASED | REMOVED" }

  - name: UnitOffer
    parent: null
    common_fields: true
    fields:
      - { name: campaign_id, type: string, source: system, description: "FK -> ApplicationCampaign.id" }
      - { name: entry_id, type: string, source: system, description: "FK -> WaitlistEntry.id" }
      - { name: unit_id, type: string, source: system, description: "FK -> Unit.id" }
      - { name: offered_at, type: datetime, source: system, description: "Creation timestamp" }
      - { name: response_deadline, type: datetime, source: computed, description: "offered_at + OFFER_RESPONSE_DAYS (10)" }
      - { name: responded_at, type: datetime, source: system, description: "Set on ACCEPT/DECLINE" }
      - { name: status, type: enum, source: system, description: "PENDING | ACCEPTED | DECLINED | EXPIRED | VOIDED" }

  - name: PurgeRun
    parent: null
    common_fields: true
    fields:
      - { name: campaign_id, type: string, source: input, description: "FK -> ApplicationCampaign.id; campaign must be LEASING" }
      - { name: notice_response_days, type: integer, source: input, default: 30, description: "Days entrants have to confirm continued interest" }
      - { name: status, type: enum, source: system, description: "SCHEDULED | NOTICES_SENT | EXECUTED | CANCELLED" }
      - { name: notice_sent_at, type: datetime, source: system, description: "Set at SEND_NOTICES" }
      - { name: response_deadline, type: datetime, source: computed, description: "notice_sent_at + notice_response_days; null until SEND_NOTICES" }
      - { name: executed_at, type: datetime, source: system, description: "Set at EXECUTE" }
      - { name: entries_removed_count, type: integer, source: computed, description: "Entries REMOVED by this purge" }

  - name: ComplianceReport
    parent: null
    common_fields: true
    fields:
      - { name: campaign_id, type: string, source: input, description: "FK -> ApplicationCampaign.id" }
      - { name: period_start, type: datetime, source: input, description: "Declared reporting period start (used for overlap checks)" }
      - { name: period_end, type: datetime, source: input, description: "Declared reporting period end (inclusive boundary for overlap checks)" }
      - { name: period_mode, type: enum, source: input, description: "CALENDAR_QUARTER | ROLLING_90_DAY — selects the effective aggregation window variant" }
      - { name: applications_received_count, type: integer, source: computed, description: "Applications with created_at inside the effective window" }
      - { name: applications_verified_count, type: integer, source: computed, description: "Applications with verified_at inside the effective window" }
      - { name: preference_claims_decided_count, type: integer, source: computed, description: "Claims with decided_at inside the effective window" }
      - { name: preference_claims_verified_count, type: integer, source: computed, description: "Claims VERIFIED with decided_at inside the effective window" }
      - { name: preference_verification_rate_bp, type: integer, source: computed, description: "round_half_up(verified / decided x 10000); 0 when decided == 0" }
      - { name: lottery_runs_executed_count, type: integer, source: computed, description: "LotteryRuns with executed_at inside the effective window" }
      - { name: offers_made_count, type: integer, source: computed, description: "UnitOffers with created_at inside the effective window" }
      - { name: offers_accepted_count, type: integer, source: computed, description: "UnitOffers ACCEPTED with responded_at inside the effective window" }
      - { name: entries_removed_count, type: integer, source: computed, description: "WaitlistEntries with removed_at inside the effective window" }
      - { name: lease_up_rate_bp, type: integer, source: computed, description: "round_half_up(offers_accepted / offers_made x 10000); 0 when offers_made == 0" }
      - { name: status, type: enum, source: system, description: "DRAFT | SUBMITTED | ACKNOWLEDGED | RETURNED; RETURNED may be re-SUBMITTED (aggregates recomputed)" }
      - { name: submitted_by, type: string, source: system, description: "X-User-ID at latest SUBMIT" }
      - { name: submitted_at, type: datetime, source: system, description: "Set at latest SUBMIT" }
      - { name: return_reason, type: string, source: system, description: "Required on RETURN" }

# =============================================================================
# §1.2 State Machine Table
# =============================================================================
state_machines:
  - entity: ApplicationCampaign
    initial_state: DRAFT
    terminal_states: []
    transitions:
      - from: DRAFT
        to: ANNOUNCED
        trigger: "POST /campaigns/{id}/transition action=ANNOUNCE"
        actor: MarketingCoordinator
        preconditions:
          - "marketing_channels has >= 2 elements (ERR_MARKETING_PLAN_INSUFFICIENT)"
        side_effects: ["increments ApplicationCampaign.version by 1"]
      - from: ANNOUNCED
        to: OPEN
        trigger: "POST /campaigns/{id}/transition action=OPEN"
        actor: HousingDeveloper
        preconditions:
          - "logical clock >= application_open_at (ERR_APPLICATION_WINDOW_NOT_OPEN)"
        side_effects: ["increments ApplicationCampaign.version by 1"]
      - from: OPEN
        to: CLOSED
        trigger: "POST /campaigns/{id}/transition action=CLOSE"
        actor: HousingDeveloper
        preconditions:
          - "logical clock >= application_close_at (ERR_INVALID_STATE)"
        side_effects: ["increments ApplicationCampaign.version by 1"]
      - from: CLOSED
        to: LOTTERY_COMPLETED
        trigger: "system (automatic on linked LotteryRun PUBLISH)"
        actor: system
        preconditions: []
        side_effects: ["increments ApplicationCampaign.version by 1"]
      - from: LOTTERY_COMPLETED
        to: CLOSED
        trigger: "system (automatic on PUBLISHED LotteryRun VOID)"
        actor: system
        preconditions: []
        side_effects: ["increments ApplicationCampaign.version by 1"]
      - from: LEASING
        to: CLOSED
        trigger: "system (automatic on PUBLISHED LotteryRun VOID)"
        actor: system
        preconditions: []
        side_effects: ["increments ApplicationCampaign.version by 1"]
      - from: LOTTERY_COMPLETED
        to: LEASING
        trigger: "system (automatic on first UnitOffer created by POST /offers/generate)"
        actor: system
        preconditions: []
        side_effects: ["increments ApplicationCampaign.version by 1"]
      - from: LEASING
        to: PURGE_SCHEDULED
        trigger: "system (automatic on PurgeRun create)"
        actor: system
        preconditions: []
        side_effects: ["increments ApplicationCampaign.version by 1"]
      - from: PURGE_SCHEDULED
        to: LEASING
        trigger: "system (on PurgeRun CANCEL, or on PurgeRun EXECUTE when post-purge waitlist_active_count > 0)"
        actor: system
        preconditions: []
        side_effects: ["increments ApplicationCampaign.version by 1"]
      - from: PURGE_SCHEDULED
        to: PURGED
        trigger: "system (on PurgeRun EXECUTE when post-purge waitlist_active_count == 0)"
        actor: system
        preconditions: []
        side_effects: ["increments ApplicationCampaign.version by 1"]
      - from: PURGED
        to: OPEN
        trigger: "POST /campaigns/{id}/transition action=REOPEN"
        actor: HousingDeveloper
        preconditions:
          - "payload carries new_application_open_at and new_application_close_at with close > open (ERR_INVALID_REQUEST)"
          - "new window does not overlap any sibling campaign window per campaign_window_overlap rule (ERR_CAMPAIGN_WINDOW_OVERLAP)"
        side_effects:
          - "application_open_at/application_close_at replaced by the new window"
          - "reopen_count += 1"
          - "increments ApplicationCampaign.version by 1"

  - entity: Unit
    initial_state: AVAILABLE
    terminal_states: []
    transitions:
      - from: AVAILABLE
        to: RESERVED
        trigger: "system (UnitOffer created for this unit by POST /offers/generate)"
        actor: system
        preconditions: []
        side_effects: ["Property counters recomputed: units_available_count -= 1, units_reserved_count += 1", "increments Unit.version by 1"]
      - from: RESERVED
        to: AVAILABLE
        trigger: "system (PENDING UnitOffer for this unit -> DECLINED, EXPIRED, or VOIDED)"
        actor: system
        preconditions: []
        side_effects: ["Property counters recomputed: units_reserved_count -= 1, units_available_count += 1", "increments Unit.version by 1"]
      - from: RESERVED
        to: LEASED
        trigger: "system (PENDING UnitOffer for this unit -> ACCEPTED)"
        actor: system
        preconditions: []
        side_effects: ["Property counters recomputed: units_reserved_count -= 1, units_leased_count += 1", "increments Unit.version by 1"]
      - from: AVAILABLE
        to: OUT_OF_SERVICE
        trigger: "POST /units/{id}/service action=PLACE_OUT_OF_SERVICE"
        actor: HousingDeveloper
        preconditions:
          - "no PENDING UnitOffer references this unit (ERR_INVALID_STATE)"
        side_effects: ["Property counters recomputed: units_available_count -= 1, units_out_of_service_count += 1", "increments Unit.version by 1"]
      - from: OUT_OF_SERVICE
        to: AVAILABLE
        trigger: "POST /units/{id}/service action=RETURN_TO_SERVICE"
        actor: HousingDeveloper
        preconditions: []
        side_effects: ["Property counters recomputed: units_out_of_service_count -= 1, units_available_count += 1", "increments Unit.version by 1"]

  - entity: Application
    initial_state: SUBMITTED
    terminal_states: [REJECTED, WITHDRAWN]
    transitions:
      - from: SUBMITTED
        to: UNDER_REVIEW
        trigger: "POST /applications/{id}/review action=BEGIN_REVIEW"
        actor: ApplicationClerk
        preconditions: []
        side_effects: ["increments Application.version by 1"]
      - from: UNDER_REVIEW
        to: NEEDS_INFO
        trigger: "POST /applications/{id}/review action=REQUEST_INFO"
        actor: ApplicationClerk
        preconditions: []
        side_effects: ["increments Application.version by 1"]
      - from: NEEDS_INFO
        to: UNDER_REVIEW
        trigger: "POST /applications/{id}/review action=SUBMIT_INFO"
        actor: Applicant
        preconditions:
          - "X-User-ID == application.applicant_id (ERR_UNAUTHORIZED_ROLE)"
        side_effects: ["increments Application.version by 1"]
      - from: UNDER_REVIEW
        to: VERIFIED
        trigger: "POST /applications/{id}/review action=COMPLETE_VERIFICATION"
        actor: ApplicationClerk
        preconditions:
          - "no PreferenceClaim of this application has status PENDING (ERR_PREFERENCE_CLAIMS_PENDING)"
        side_effects:
          - "verified_at = now; verified_preference_categories recomputed from VERIFIED claims"
          - "increments Application.version by 1"
      - from: UNDER_REVIEW
        to: REJECTED
        trigger: "POST /applications/{id}/review action=REJECT"
        actor: ApplicationClerk
        preconditions: []
        side_effects: ["rejection_reason set from payload", "ApplicationCampaign.applications_received_count recomputed", "increments Application.version by 1"]
      - from: SUBMITTED
        to: WITHDRAWN
        trigger: "POST /applications/{id}/withdraw"
        actor: Applicant
        preconditions:
          - "X-User-ID == application.applicant_id (ERR_UNAUTHORIZED_ROLE)"
        side_effects: ["ApplicationCampaign.applications_received_count recomputed", "increments Application.version by 1"]
      - from: UNDER_REVIEW
        to: WITHDRAWN
        trigger: "POST /applications/{id}/withdraw"
        actor: Applicant
        preconditions:
          - "X-User-ID == application.applicant_id (ERR_UNAUTHORIZED_ROLE)"
        side_effects: ["ApplicationCampaign.applications_received_count recomputed", "increments Application.version by 1"]
      - from: NEEDS_INFO
        to: WITHDRAWN
        trigger: "POST /applications/{id}/withdraw"
        actor: Applicant
        preconditions:
          - "X-User-ID == application.applicant_id (ERR_UNAUTHORIZED_ROLE)"
        side_effects: ["ApplicationCampaign.applications_received_count recomputed", "increments Application.version by 1"]

  - entity: PreferenceClaim
    initial_state: PENDING
    terminal_states: []
    transitions:
      - from: PENDING
        to: VERIFIED
        trigger: "POST /preference-claims/{id}/transition action=VERIFY"
        actor: ApplicationClerk
        preconditions:
          - "parent Application.status IN {SUBMITTED, UNDER_REVIEW, NEEDS_INFO} (ERR_INVALID_STATE)"
        side_effects:
          - "decided_at = now; decided_by = X-User-ID"
          - "parent Application.verified_preference_categories recomputed"
          - "increments PreferenceClaim.version by 1"
      - from: PENDING
        to: DENIED
        trigger: "POST /preference-claims/{id}/transition action=DENY"
        actor: ApplicationClerk
        preconditions:
          - "parent Application.status IN {SUBMITTED, UNDER_REVIEW, NEEDS_INFO} (ERR_INVALID_STATE)"
          - "payload denial_reason present (ERR_INVALID_REQUEST)"
        side_effects:
          - "decided_at = now; decided_by = X-User-ID; denial_reason set"
          - "increments PreferenceClaim.version by 1"
      - from: DENIED
        to: PENDING
        trigger: "POST /preference-claims/{id}/transition action=APPEAL"
        actor: Applicant
        preconditions:
          - "X-User-ID == parent application.applicant_id (ERR_UNAUTHORIZED_ROLE)"
          - "payload new_evidence_ref present (ERR_INVALID_REQUEST)"
          - "parent Application.status IN {SUBMITTED, UNDER_REVIEW, NEEDS_INFO} (ERR_INVALID_STATE)"
        side_effects:
          - "evidence_ref replaced by new_evidence_ref; denial_reason cleared"
          - "increments PreferenceClaim.version by 1"

  - entity: IncomeCertification
    initial_state: INITIATED
    terminal_states: [DENIED]
    transitions:
      - from: INITIATED
        to: DOCS_REQUESTED
        trigger: "POST /income-certifications/{id}/advance action=REQUEST_DOCS"
        actor: ComplianceOfficer
        preconditions:
          - "payload required_docs present and non-empty (ERR_INVALID_REQUEST)"
        side_effects: ["required_docs set from payload", "increments IncomeCertification.version by 1"]
      - from: DOCS_RECEIVED
        to: DOCS_REQUESTED
        trigger: "POST /income-certifications/{id}/advance action=REQUEST_DOCS"
        actor: ComplianceOfficer
        preconditions:
          - "payload required_docs present and non-empty (ERR_INVALID_REQUEST)"
        side_effects: ["required_docs replaced from payload (documentation review cycle)", "increments IncomeCertification.version by 1"]
      - from: DOCS_REQUESTED
        to: DOCS_RECEIVED
        trigger: "POST /income-certifications/{id}/advance action=SUBMIT_DOCS"
        actor: Applicant
        preconditions:
          - "X-User-ID == parent application.applicant_id (ERR_UNAUTHORIZED_ROLE)"
          - "payload income_sources present and non-empty (ERR_INVALID_REQUEST)"
        side_effects: ["income_sources appended to the certification record", "increments IncomeCertification.version by 1"]
      - from: DOCS_RECEIVED
        to: CERTIFIED
        trigger: "POST /income-certifications/{id}/advance action=CERTIFY"
        actor: ComplianceOfficer
        preconditions:
          - "segregation: X-User-ID is not sealed_by/executed_by/published_by of any LotteryRun for this campaign (ERR_SEGREGATION_OF_DUTIES)"
          - "every required_docs source_type is covered by >= 1 submitted income_sources entry (ERR_CERT_DOCS_INCOMPLETE)"
          - "AmiLimit row exists for (property, application.household_size, campaign.target_ami_tier) (ERR_AMI_LIMIT_NOT_DEFINED)"
          - "certified_income_annualization result <= that limit, inclusive (ERR_OVER_INCOME)"
        side_effects:
          - "certified_annual_income_cents and ami_percentage_bp computed and frozen"
          - "determination = ELIGIBLE; certified_at = now; certified_by = X-User-ID; valid_until = now + 180 days"
          - "increments IncomeCertification.version by 1"
      - from: DOCS_RECEIVED
        to: DENIED
        trigger: "POST /income-certifications/{id}/advance action=DENY"
        actor: ComplianceOfficer
        preconditions:
          - "payload denial_reason present (ERR_INVALID_REQUEST)"
        side_effects: ["denial_reason set", "increments IncomeCertification.version by 1"]

  - entity: LotteryRun
    initial_state: DRAFT
    terminal_states: [VOIDED]
    transitions:
      - from: DRAFT
        to: SEALED
        trigger: "POST /lottery-runs/{id}/transition action=SEAL"
        actor: LotteryAdministrator
        preconditions:
          - "segregation: X-User-ID is not certified_by of any IncomeCertification in this campaign (ERR_SEGREGATION_OF_DUTIES)"
        side_effects:
          - "snapshot: eligible_application_count = count of campaign Applications with status == VERIFIED at this instant"
          - "sealed_by = X-User-ID; sealed_at = now"
          - "increments LotteryRun.version by 1"
      - from: SEALED
        to: EXECUTED
        trigger: "POST /lottery-runs/{id}/transition action=EXECUTE"
        actor: LotteryAdministrator
        preconditions:
          - "segregation: X-User-ID is not certified_by of any IncomeCertification in this campaign (ERR_SEGREGATION_OF_DUTIES)"
        side_effects:
          - "runs lottery_sequence_assignment, preference_tier_assignment, effective_rank_assignment over the SEAL snapshot"
          - "creates one WaitlistEntry per snapshotted application (status RANKED)"
          - "entries_generated = snapshot size; executed_by = X-User-ID; executed_at = now"
          - "increments LotteryRun.version by 1"
      - from: EXECUTED
        to: PUBLISHED
        trigger: "POST /lottery-runs/{id}/transition action=PUBLISH"
        actor: LotteryAdministrator
        preconditions:
          - "segregation: X-User-ID is not certified_by of any IncomeCertification in this campaign (ERR_SEGREGATION_OF_DUTIES)"
        side_effects:
          - "ApplicationCampaign CLOSED -> LOTTERY_COMPLETED"
          - "published_by = X-User-ID; published_at = now"
          - "increments LotteryRun.version by 1"
      - from: DRAFT
        to: VOIDED
        trigger: "POST /lottery-runs/{id}/transition action=VOID"
        actor: LotteryAdministrator
        preconditions:
          - "payload void_reason present (ERR_INVALID_REQUEST)"
        side_effects: ["increments LotteryRun.version by 1"]
      - from: SEALED
        to: VOIDED
        trigger: "POST /lottery-runs/{id}/transition action=VOID"
        actor: LotteryAdministrator
        preconditions:
          - "payload void_reason present (ERR_INVALID_REQUEST)"
        side_effects: ["increments LotteryRun.version by 1"]
      - from: EXECUTED
        to: VOIDED
        trigger: "POST /lottery-runs/{id}/transition action=VOID"
        actor: LotteryAdministrator
        preconditions:
          - "payload void_reason present (ERR_INVALID_REQUEST)"
        side_effects:
          - "all entries of this run with status IN {RANKED, OFFERED} -> REMOVED with removal_reason LOTTERY_VOIDED; PENDING offers of those entries -> VOIDED (no refusal_count increment); their units RESERVED -> AVAILABLE"
          - "LEASED entries remain LEASED (conditional cascade)"
          - "campaign counters recomputed"
          - "increments LotteryRun.version by 1"
      - from: PUBLISHED
        to: VOIDED
        trigger: "POST /lottery-runs/{id}/transition action=VOID"
        actor: LotteryAdministrator
        preconditions:
          - "payload void_reason present (ERR_INVALID_REQUEST)"
        side_effects:
          - "same entry/offer/unit cascade as EXECUTED -> VOIDED"
          - "ApplicationCampaign LOTTERY_COMPLETED or LEASING -> CLOSED"
          - "increments LotteryRun.version by 1"

  - entity: WaitlistEntry
    initial_state: RANKED
    terminal_states: [LEASED, REMOVED]
    transitions:
      - from: RANKED
        to: OFFERED
        trigger: "system (UnitOffer created for this entry by POST /offers/generate)"
        actor: system
        preconditions: []
        side_effects: ["increments WaitlistEntry.version by 1"]
      - from: OFFERED
        to: RANKED
        trigger: "system (its PENDING UnitOffer -> DECLINED or EXPIRED and refusal_count after increment < MAX_REFUSALS (2))"
        actor: system
        preconditions: []
        side_effects: ["refusal_count += 1 (offer/refusal cycle)", "increments WaitlistEntry.version by 1"]
      - from: OFFERED
        to: REMOVED
        trigger: "system (its PENDING UnitOffer -> DECLINED or EXPIRED and refusal_count after increment >= MAX_REFUSALS (2))"
        actor: system
        preconditions: []
        side_effects:
          - "refusal_count += 1; removal_reason = MAX_REFUSALS; removed_at = now"
          - "ApplicationCampaign.waitlist_active_count recomputed (this removal triggers the decrement)"
          - "increments WaitlistEntry.version by 1"
      - from: OFFERED
        to: LEASED
        trigger: "system (its PENDING UnitOffer -> ACCEPTED)"
        actor: system
        preconditions: []
        side_effects:
          - "ApplicationCampaign.entries_leased_count += 1 and waitlist_active_count recomputed"
          - "increments WaitlistEntry.version by 1"
      - from: RANKED
        to: REMOVED
        trigger: "system (PurgeRun EXECUTE with entry unconfirmed) or POST /waitlist-entries/{id}/remove or system (LotteryRun VOID)"
        actor: system
        preconditions: []
        side_effects:
          - "removal_reason = PURGED | ADMIN_REMOVED | LOTTERY_VOIDED; removed_at = now"
          - "ApplicationCampaign.waitlist_active_count recomputed"
          - "increments WaitlistEntry.version by 1"
      - from: OFFERED
        to: REMOVED
        trigger: "system (LotteryRun VOID cascade only)"
        actor: system
        preconditions: []
        side_effects:
          - "removal_reason = LOTTERY_VOIDED; removed_at = now"
          - "ApplicationCampaign.waitlist_active_count recomputed"
          - "increments WaitlistEntry.version by 1"
      - from: RANKED
        to: RANKED
        trigger: "POST /waitlist-entries/{id}/confirm-interest"
        actor: Applicant
        preconditions:
          - "X-User-ID == entry.application.applicant_id (ERR_UNAUTHORIZED_ROLE)"
          - "a PurgeRun for entry.campaign_id has status NOTICES_SENT (ERR_INVALID_STATE)"
        side_effects: ["last_confirmed_at = now", "increments WaitlistEntry.version by 1"]

  - entity: UnitOffer
    initial_state: PENDING
    terminal_states: [ACCEPTED, DECLINED, EXPIRED, VOIDED]
    transitions:
      - from: PENDING
        to: ACCEPTED
        trigger: "POST /offers/{id}/respond action=ACCEPT"
        actor: Applicant
        preconditions:
          - "X-User-ID == offer.entry.application.applicant_id (ERR_UNAUTHORIZED_ROLE)"
          - "logical clock <= response_deadline (ERR_OFFER_EXPIRED)"
          - "entry application's IncomeCertification status == CERTIFIED and valid_until >= now (ERR_CERTIFICATION_EXPIRED)"
        side_effects:
          - "responded_at = now"
          - "WaitlistEntry OFFERED -> LEASED (which bumps campaign.entries_leased_count)"
          - "Unit RESERVED -> LEASED (which recomputes Property counters)"
          - "increments UnitOffer.version by 1"
      - from: PENDING
        to: DECLINED
        trigger: "POST /offers/{id}/respond action=DECLINE"
        actor: Applicant
        preconditions:
          - "X-User-ID == offer.entry.application.applicant_id (ERR_UNAUTHORIZED_ROLE)"
          - "logical clock <= response_deadline (ERR_OFFER_EXPIRED)"
        side_effects:
          - "responded_at = now"
          - "WaitlistEntry.refusal_count += 1; if the incremented count >= MAX_REFUSALS (2) the entry -> REMOVED (MAX_REFUSALS, which recomputes campaign.waitlist_active_count), else entry -> RANKED"
          - "Unit RESERVED -> AVAILABLE (which recomputes Property counters)"
          - "increments UnitOffer.version by 1"
      - from: PENDING
        to: EXPIRED
        trigger: "POST /offers/expire-due (system sweep over PENDING offers with response_deadline < now, processed offered_at ASC)"
        actor: HousingDeveloper
        preconditions: []
        side_effects:
          - "same refusal/cascade side effects as DECLINED (refusal_count += 1, possible REMOVED, unit release, counter recompute)"
          - "increments UnitOffer.version by 1"
      - from: PENDING
        to: VOIDED
        trigger: "system (LotteryRun VOID cascade)"
        actor: system
        preconditions: []
        side_effects:
          - "no refusal_count increment (void is not a refusal)"
          - "Unit RESERVED -> AVAILABLE"
          - "increments UnitOffer.version by 1"

  - entity: PurgeRun
    initial_state: SCHEDULED
    terminal_states: [EXECUTED, CANCELLED]
    transitions:
      - from: SCHEDULED
        to: NOTICES_SENT
        trigger: "POST /purge-runs/{id}/advance action=SEND_NOTICES"
        actor: HousingDeveloper
        preconditions: []
        side_effects: ["notice_sent_at = now; response_deadline = now + notice_response_days", "increments PurgeRun.version by 1"]
      - from: NOTICES_SENT
        to: EXECUTED
        trigger: "POST /purge-runs/{id}/advance action=EXECUTE"
        actor: HousingDeveloper
        preconditions:
          - "logical clock >= response_deadline (ERR_PURGE_NOT_EXECUTABLE)"
        side_effects:
          - "purge_selection: every WaitlistEntry of this campaign with status RANKED and (last_confirmed_at IS NULL OR last_confirmed_at < notice_sent_at) -> REMOVED with removal_reason PURGED"
          - "entries_removed_count set; executed_at = now"
          - "campaign waitlist_active_count recomputed; if 0 then campaign PURGE_SCHEDULED -> PURGED else PURGE_SCHEDULED -> LEASING"
          - "increments PurgeRun.version by 1"
      - from: SCHEDULED
        to: CANCELLED
        trigger: "POST /purge-runs/{id}/advance action=CANCEL"
        actor: HousingDeveloper
        preconditions: []
        side_effects: ["ApplicationCampaign PURGE_SCHEDULED -> LEASING", "increments PurgeRun.version by 1"]
      - from: NOTICES_SENT
        to: CANCELLED
        trigger: "POST /purge-runs/{id}/advance action=CANCEL"
        actor: HousingDeveloper
        preconditions: []
        side_effects: ["ApplicationCampaign PURGE_SCHEDULED -> LEASING", "increments PurgeRun.version by 1"]

  - entity: ComplianceReport
    initial_state: DRAFT
    terminal_states: [ACKNOWLEDGED]
    transitions:
      - from: DRAFT
        to: SUBMITTED
        trigger: "POST /compliance-reports/{id}/transition action=SUBMIT"
        actor: ComplianceOfficer
        preconditions:
          - "campaign has at least one LotteryRun with status PUBLISHED (ERR_REPORT_INCOMPLETE_DATA)"
          - "campaign.status IN {LOTTERY_COMPLETED, LEASING, PURGE_SCHEDULED, PURGED} (ERR_REPORT_INCOMPLETE_DATA)"
        side_effects: ["submitted_by = X-User-ID; submitted_at = now", "increments ComplianceReport.version by 1"]
      - from: RETURNED
        to: SUBMITTED
        trigger: "POST /compliance-reports/{id}/transition action=SUBMIT"
        actor: ComplianceOfficer
        preconditions:
          - "same as DRAFT -> SUBMITTED"
        side_effects:
          - "all aggregate fields recomputed against the effective window at resubmission time"
          - "submitted_by/submitted_at refreshed; return_reason cleared"
          - "increments ComplianceReport.version by 1"
      - from: SUBMITTED
        to: ACKNOWLEDGED
        trigger: "POST /compliance-reports/{id}/transition action=ACKNOWLEDGE"
        actor: FundingAgencyAuditor
        preconditions: []
        side_effects: ["increments ComplianceReport.version by 1"]
      - from: SUBMITTED
        to: RETURNED
        trigger: "POST /compliance-reports/{id}/transition action=RETURN"
        actor: FundingAgencyAuditor
        preconditions:
          - "payload return_reason present (ERR_INVALID_REQUEST)"
        side_effects: ["return_reason set (report correction cycle)", "increments ComplianceReport.version by 1"]

# =============================================================================
# §1.2.1 Concurrency Rules (OCC only; everything else is a state precondition)
# =============================================================================
concurrency_rules:
  - rule_id: lottery-run-create-stale-campaign
    parent_entity: ApplicationCampaign
    write_endpoint: "POST /lottery-runs"
    occ_field: "expected_campaign_version"
    description: |
      Creating a LotteryRun against an ApplicationCampaign whose version has
      advanced since the client last observed it is rejected. A prior successful
      lottery-run creation already bumped campaign.version, so a second create
      carrying the older version is stale even though the product semantics
      would otherwise let a new run supersede a DRAFT run.
    error_id: ERR_STALE_VERSION
    http_status: 412
  - rule_id: purge-run-create-stale-campaign
    parent_entity: ApplicationCampaign
    write_endpoint: "POST /purge-runs"
    occ_field: "expected_campaign_version"
    description: |
      Creating a PurgeRun against an ApplicationCampaign whose version has
      advanced since the client last observed it is rejected; the client is
      scheduling a purge from a stale view of the waitlist it intends to purge.
    error_id: ERR_STALE_VERSION
    http_status: 412

# =============================================================================
# §1.3 Calculation Rules Table
# =============================================================================
calculations:
  - name: provisional_eligibility_screen
    trigger: "POST /applications (at submit)"
    algorithm: threshold
    formula: |
      row = AmiLimit(property = campaign.property_id, household_size = application.household_size,
                     ami_tier = campaign.target_ami_tier)
      if row is missing: provisional_determination = UNASSESSED
      elif self_reported_annual_income_cents <= row.annual_limit_cents: PROVISIONALLY_ELIGIBLE   # inclusive boundary
      else: PROVISIONALLY_OVER_INCOME
    input_set: "The submitting application only; evaluated once at creation"
    constants:
      BOUNDARY: "income == limit is ELIGIBLE (<=)"
    precision: "integer cents; no rounding"
    variants:
      - name: provisional
        when: "at application submit; uses self-reported income"
        difference: "single declared figure, no documentation, no per-source annualization"

  - name: certified_income_annualization
    trigger: "POST /income-certifications/{id}/advance action=CERTIFY"
    algorithm: aggregation
    formula: |
      # PINNED ROUNDING ORDER: annualize and round EACH source to whole dollars first, then sum.
      certified_annual_income_cents =
        SUM over income_sources s of ( round_half_up(s.amount_per_period_cents * s.periods_per_year / 100) * 100 )
      # Worked example pinned for tests: sources {100020 cents x 12} and {50020 cents x 12}
      #   -> round_half_up(12002.40) = 12002 dollars; round_half_up(6002.40) = 6002 dollars
      #   -> total 18004 dollars = 1800400 cents.
      # The alternative order (sum exact amounts 18004.80 dollars, then round) yields 18005 dollars
      # = 1800500 cents and is NOT the specified behavior.
    input_set: "income_sources submitted via SUBMIT_DOCS on this certification, all statuses of docs"
    constants:
      ROUNDING: "round_half_up to whole dollars PER SOURCE, then sum"
    precision: "whole dollars per source; final value stored as integer cents"
    variants:
      - name: certified
        when: "at CERTIFY; uses documented income sources"
        difference: "per-source annualization with whole-dollar rounding; can diverge from provisional self-reported figure for the same household"

  - name: ami_percentage_and_threshold
    trigger: "POST /income-certifications/{id}/advance action=CERTIFY (after certified_income_annualization)"
    algorithm: threshold
    formula: |
      limit = AmiLimit(property, household_size, campaign.target_ami_tier).annual_limit_cents   # missing row -> ERR_AMI_LIMIT_NOT_DEFINED
      ami_percentage_bp = round_half_up(certified_annual_income_cents * 10000 / limit)
      if certified_annual_income_cents > limit: reject CERTIFY with ERR_OVER_INCOME
      else: determination = ELIGIBLE
    input_set: "This certification + the single AmiLimit row for (property, household_size, target_ami_tier)"
    constants:
      BOUNDARY: "income == limit passes (<= is inclusive)"
    precision: "ami_percentage_bp integer basis points, round_half_up"

  - name: preference_tier_assignment
    trigger: "LotteryRun EXECUTE (per snapshotted application)"
    algorithm: weighted_scoring
    formula: |
      # Combinatorial branch over three independent verification inputs (mode a).
      v = set of categories among the application's PreferenceClaims with status == VERIFIED
      if LOCAL_RESIDENT in v: preference_tier = 1
      elif VETERAN in v:      preference_tier = 2
      elif ACCESSIBILITY in v: preference_tier = 3
      else:                   preference_tier = 4
      # Denied-then-appealed claims count only if currently VERIFIED at EXECUTE time.
    input_set: "PreferenceClaims of each snapshotted application; only VERIFIED claims contribute"
    constants:
      TIER_LOCAL: 1
      TIER_VETERAN: 2
      TIER_ACCESSIBILITY: 3
      TIER_NONE: 4
    precision: "integer tier 1..4"

  - name: lottery_sequence_assignment
    trigger: "LotteryRun EXECUTE (per snapshotted application)"
    algorithm: chronological
    formula: |
      # Deterministic seeded draw; no wall-clock randomness, no id participation.
      for each snapshotted application a:
        key(a) = sha256_hex(seed + ":" + a.confirmation_code)
      sort applications by (key ASC, a.created_at ASC)   # created_at breaks theoretical hash ties
      base_rank = 1-based position in that order
    input_set: "Applications frozen in the SEAL snapshot (status VERIFIED at SEAL time)"
    constants:
      HASH: "sha256 over the UTF-8 string '<seed>:<confirmation_code>', hex digest compared lexicographically"
    precision: "integer ranks 1..N, dense"

  - name: effective_rank_assignment
    trigger: "LotteryRun EXECUTE (after lottery_sequence_assignment and preference_tier_assignment)"
    algorithm: aggregation
    formula: |
      sort snapshotted applications by (preference_tier ASC, base_rank ASC, application.created_at ASC)
      effective_rank = 1-based position in that order
    input_set: "The SEAL snapshot with base_rank and preference_tier already assigned"
    precision: "integer ranks 1..N, dense"

  - name: offer_unit_selection
    trigger: "POST /offers/generate"
    algorithm: constraint_propagation
    formula: |
      # PINNED EVALUATION ORDER (mode c): income/occupancy eligibility BEFORE accessibility boost,
      # boost BEFORE ranking, ranking per unit in fixed unit order.
      candidates_units = Units of campaign.property with status AVAILABLE,
                         ordered by (created_at ASC, unit_number ASC)
      eligible_entries   = WaitlistEntries of the campaign's PUBLISHED LotteryRun with status RANKED
      for each unit in candidates_units order:
        pool = eligible_entries still RANKED where:
          (1) occupancy: OccupancyStandard(unit.property_id, unit.bedroom_count) row exists AND
              min_occupants <= application.household_size <= max_occupants          # inclusive both ends
              (missing OccupancyStandard row -> unit is skipped entirely, no offer)
          (2) income: AmiLimit(unit.property_id, household_size, unit.ami_tier) row exists AND
              certified_annual_income_cents <= annual_limit_cents                   # inclusive
              (missing AmiLimit row -> unit is skipped for that entry)
          (3) certification: application has an IncomeCertification with status CERTIFIED and valid_until >= now
          (4) exclusion-on-retry: entry has no prior DECLINED or EXPIRED UnitOffer for THIS unit
        if pool empty: no offer for this unit; unit stays AVAILABLE                 # empty-pool fallback
        else:
          boost(e) = 1 if unit.accessibility_feature != NONE and ACCESSIBILITY in e.application.verified_preference_categories else 0
          pick e* = min by (boost DESC, effective_rank ASC, entry.created_at ASC)
          create UnitOffer(entry=e*, unit=unit, offered_at=now, response_deadline=now+10 days)
          e* RANKED -> OFFERED; unit AVAILABLE -> RESERVED
    input_set: "RANKED entries of the campaign's PUBLISHED run; AVAILABLE units of the property"
    constants:
      OFFER_RESPONSE_DAYS: 10
    precision: "ranks integer; deadlines exact datetimes"

  - name: purge_selection
    trigger: "PurgeRun EXECUTE"
    algorithm: threshold
    formula: |
      for each WaitlistEntry of campaign with status == RANKED:
        if last_confirmed_at IS NULL or last_confirmed_at < purge.notice_sent_at:
          entry -> REMOVED with removal_reason PURGED
        else:
          entry stays RANKED (confirmation inside the notice window preserves the slot)
      entries_removed_count = number removed
      # Boundary: last_confirmed_at == notice_sent_at exactly -> NOT removed (< is strict).
      # OFFERED and LEASED entries are never purge-selected.
    input_set: "WaitlistEntries of the campaign with status RANKED at EXECUTE time"
    constants:
      BOUNDARY: "confirmation exactly at notice_sent_at preserves the entry (strict <)"
    precision: "datetime comparison to the second"

  - name: compliance_aggregation
    trigger: "ComplianceReport create, and re-SUBMIT from RETURNED (recompute)"
    algorithm: aggregation
    formula: |
      # Effective event window depends on period_mode (dual variant):
      #   CALENDAR_QUARTER: window = [quarter_start, quarter_start + 3 months)  — start INCLUSIVE, end EXCLUSIVE.
      #     period_start must be the first day of a calendar quarter at 00:00:00Z and period_end the last day
      #     of that same quarter, else ERR_INVALID_REQUEST.
      #   ROLLING_90_DAY: window = [period_end - 90 days at 00:00:00Z, period_end at 23:59:59.999Z] — BOTH inclusive.
      # Counts by event timestamp inside the effective window:
      #   applications_received_count     : Application.created_at
      #   applications_verified_count     : Application.verified_at
      #   preference_claims_decided_count : PreferenceClaim.decided_at
      #   preference_claims_verified_count: PreferenceClaim.decided_at where status == VERIFIED
      #   lottery_runs_executed_count     : LotteryRun.executed_at
      #   offers_made_count               : UnitOffer.created_at
      #   offers_accepted_count           : UnitOffer.responded_at where status == ACCEPTED
      #   entries_removed_count           : WaitlistEntry.removed_at
      #   preference_verification_rate_bp = round_half_up(verified / decided * 10000), 0 when decided == 0
      #   lease_up_rate_bp                = round_half_up(accepted / made * 10000),    0 when made == 0
    input_set: "All events of the campaign whose governing timestamp falls inside the effective window"
    constants:
      ROLLING_WINDOW_DAYS: 90
      ZERO_DENOMINATOR: "rate fields are 0 when their denominator count is 0"
    precision: "counts integer; rates integer basis points, round_half_up"
    variants:
      - name: calendar_quarter
        when: "period_mode = CALENDAR_QUARTER"
        difference: "fixed quarter window, half-open at the end"
      - name: rolling_90_day
        when: "period_mode = ROLLING_90_DAY"
        difference: "sliding 90-day window anchored at period_end, both ends inclusive — same events can yield different counts"

# =============================================================================
# §1.4 Validation Rules Table (ordered by priority)
# =============================================================================
validations:
  - { priority: 1, category: auth, check: "X-User-Role header present and names a declared role; X-User-ID required for entity_backed roles (Applicant), optional for opaque roles (recorded on audit fields when present)", error_id: ERR_UNAUTHENTICATED, http_status: 401, applies_to: "all" }
  - { priority: 2, category: auth, check: "Role is in the endpoint's roles list AND action-level role mapping holds (campaign ANNOUNCE only MarketingCoordinator; OPEN/CLOSE/REOPEN only HousingDeveloper; claim VERIFY/DENY only ApplicationClerk, APPEAL only Applicant; cert REQUEST_DOCS/CERTIFY/DENY only ComplianceOfficer, SUBMIT_DOCS only Applicant; report SUBMIT only ComplianceOfficer, ACKNOWLEDGE/RETURN only FundingAgencyAuditor). For role Applicant, X-User-ID must equal the owning applicant id of the addressed resource", error_id: ERR_UNAUTHORIZED_ROLE, http_status: 403, applies_to: "all" }
  - { priority: 3, category: existence, check: "Request body is well-formed: required fields present, enums valid, datetimes ISO8601, integers integral (ERR_INVALID_REQUEST)", error_id: ERR_INVALID_REQUEST, http_status: 400, applies_to: "all" }
  - { priority: 4, category: existence, check: "Every id in path and body resolves to an existing entity, validated left-to-right", error_id: ERR_NOT_FOUND, http_status: 404, applies_to: "all endpoints with ids" }
  - { priority: 5, category: state, check: "OCC: expected_campaign_version equals the campaign's current version (only on POST /lottery-runs and POST /purge-runs)", error_id: ERR_STALE_VERSION, http_status: 412, applies_to: "POST /lottery-runs, POST /purge-runs" }
  - { priority: 6, category: state, check: "State-machine preconditions: transition listed for the entity's current state; campaign OPEN for application submit (ERR_CAMPAIGN_NOT_OPEN); no non-VOIDED LotteryRun exists for the campaign on lottery create (ERR_ACTIVE_LOTTERY_EXISTS); application VERIFIED for income-certification create (ERR_APPLICATION_NOT_VERIFIED); otherwise generic ERR_INVALID_STATE", error_id: ERR_INVALID_STATE, http_status: 409, applies_to: "all transition/action endpoints" }
  - { priority: 7, category: business_safety, check: "Segregation of duties: on CERTIFY, X-User-ID not in {sealed_by, executed_by, published_by} of any LotteryRun of the campaign; on SEAL/EXECUTE/PUBLISH, X-User-ID not certified_by of any IncomeCertification in the campaign", error_id: ERR_SEGREGATION_OF_DUTIES, http_status: 403, applies_to: "POST /income-certifications/{id}/advance, POST /lottery-runs/{id}/transition" }
  - { priority: 8, category: business_temporal, check: "Clock rules: application submit requires now < application_close_at (ERR_APPLICATION_WINDOW_CLOSED); campaign OPEN requires now >= application_open_at (ERR_APPLICATION_WINDOW_NOT_OPEN); campaign CLOSE requires now >= application_close_at (ERR_INVALID_STATE); offer respond requires now <= response_deadline (ERR_OFFER_EXPIRED); offer accept/generate eligibility requires certification valid_until >= now (ERR_CERTIFICATION_EXPIRED); purge EXECUTE requires now >= response_deadline (ERR_PURGE_NOT_EXECUTABLE)", error_id: ERR_APPLICATION_WINDOW_CLOSED, http_status: 422, applies_to: "temporal-gated endpoints" }
  - { priority: 9, category: business_constraint, check: "Uniqueness/shape business rules: one non-terminal Application per (applicant_id, campaign_id) (ERR_DUPLICATE_APPLICATION); one claim per category per application (ERR_DUPLICATE_CLAIM); one OccupancyStandard per (property, bedroom_count) and one AmiLimit per (property, household_size, ami_tier) (ERR_CONFIG_CONFLICT); household_size 1..12 (ERR_HOUSEHOLD_SIZE_INVALID); non-empty evidence_ref (ERR_PREFERENCE_EVIDENCE_REQUIRED); COMPLETE_VERIFICATION requires zero PENDING claims (ERR_PREFERENCE_CLAIMS_PENDING); ANNOUNCE requires >= 2 marketing channels (ERR_MARKETING_PLAN_INSUFFICIENT); CERTIFY doc coverage (ERR_CERT_DOCS_INCOMPLETE)", error_id: ERR_DUPLICATE_APPLICATION, http_status: 409, applies_to: "create/action endpoints" }
  - { priority: 10, category: business_referential, check: "Referenced configuration must exist: AmiLimit row for (property, household_size, target tier) at CERTIFY (ERR_AMI_LIMIT_NOT_DEFINED); at least one PUBLISHED LotteryRun and campaign in a post-lottery state for report SUBMIT (ERR_REPORT_INCOMPLETE_DATA)", error_id: ERR_AMI_LIMIT_NOT_DEFINED, http_status: 422, applies_to: "CERTIFY, report SUBMIT" }
  - { priority: 11, category: business_fiscal, check: "Income ceiling: certified income must be <= the target-tier AmiLimit (inclusive) at CERTIFY", error_id: ERR_OVER_INCOME, http_status: 422, applies_to: "POST /income-certifications/{id}/advance action=CERTIFY" }
  - { priority: 12, category: business_temporal, check: "Interval overlap rules: campaign windows on the same Property are half-open [open_at, close_at) — overlap iff open < other.close AND other.open < close, checked against sibling campaigns with status IN {DRAFT, ANNOUNCED, OPEN, CLOSED, LOTTERY_COMPLETED, LEASING, PURGE_SCHEDULED} (ERR_CAMPAIGN_WINDOW_OVERLAP); report declared periods on the same campaign are CLOSED intervals — overlap iff start <= other.end AND other.start <= end, checked against reports with status IN {SUBMITTED, ACKNOWLEDGED} (ERR_REPORT_PERIOD_OVERLAP)", error_id: ERR_CAMPAIGN_WINDOW_OVERLAP, http_status: 409, applies_to: "POST /campaigns, POST /campaigns/{id}/transition (REOPEN), POST /compliance-reports" }

# =============================================================================
# §1.5 API Endpoint Table
# =============================================================================
endpoints:
  # --- Property ---
  - { method: POST, path: "/properties", description: "Create a property", roles: [HousingDeveloper], code: 201, input: [name, address_line, city, state_code], output: Property, side_effects: ["counters initialized to 0"] }
  - { method: GET, path: "/properties/{id}", description: "Get a property with derived unit counters", roles: [HousingDeveloper, MarketingCoordinator, ApplicationClerk, ComplianceOfficer, LotteryAdministrator, FundingAgencyAuditor], code: 200, input: [], output: Property, side_effects: [] }

  # --- Unit ---
  - { method: POST, path: "/units", description: "Create a unit", roles: [HousingDeveloper], code: 201, input: [property_id, unit_number, bedroom_count, ami_tier, "accessibility_feature?"], output: Unit, side_effects: ["status AVAILABLE; Property units_total/units_available_count recomputed"] }
  - { method: GET, path: "/units", description: "List units (FK reverse-reachability for Unit.property_id)", roles: [HousingDeveloper, MarketingCoordinator, ApplicationClerk, ComplianceOfficer, LotteryAdministrator, FundingAgencyAuditor], code: 200, input: ["property_id?", "status?", "bedroom_count?", "limit?", "offset?"], output: "Unit[]", side_effects: [] }
  - { method: GET, path: "/units/{id}", description: "Get a unit", roles: [HousingDeveloper, MarketingCoordinator, ApplicationClerk, ComplianceOfficer, LotteryAdministrator, FundingAgencyAuditor], code: 200, input: [], output: Unit, side_effects: [] }
  - { method: POST, path: "/units/{id}/service", description: "action=PLACE_OUT_OF_SERVICE (AVAILABLE only) | RETURN_TO_SERVICE (OUT_OF_SERVICE only)", roles: [HousingDeveloper], code: 200, input: [action], output: Unit, side_effects: ["Unit status transition + Property counter recompute", "increments Unit.version by 1"] }

  # --- OccupancyStandard ---
  - { method: POST, path: "/occupancy-standards", description: "Define occupancy range for a bedroom count at a property (one per pair)", roles: [HousingDeveloper], code: 201, input: [property_id, bedroom_count, min_occupants, max_occupants], output: OccupancyStandard, side_effects: [] }
  - { method: GET, path: "/occupancy-standards", description: "List occupancy standards", roles: [HousingDeveloper, MarketingCoordinator, ApplicationClerk, ComplianceOfficer, LotteryAdministrator, FundingAgencyAuditor], code: 200, input: ["property_id?", "limit?", "offset?"], output: "OccupancyStandard[]", side_effects: [] }
  - { method: GET, path: "/occupancy-standards/{id}", description: "Get one occupancy standard", roles: [HousingDeveloper, MarketingCoordinator, ApplicationClerk, ComplianceOfficer, LotteryAdministrator, FundingAgencyAuditor], code: 200, input: [], output: OccupancyStandard, side_effects: [] }

  # --- AmiLimit ---
  - { method: POST, path: "/ami-limits", description: "Define an AMI income limit row (one per property+household_size+tier)", roles: [HousingDeveloper], code: 201, input: [property_id, household_size, ami_tier, annual_limit_cents], output: AmiLimit, side_effects: [] }
  - { method: GET, path: "/ami-limits", description: "List AMI limit rows", roles: [HousingDeveloper, MarketingCoordinator, ApplicationClerk, ComplianceOfficer, LotteryAdministrator, FundingAgencyAuditor], code: 200, input: ["property_id?", "household_size?", "ami_tier?", "limit?", "offset?"], output: "AmiLimit[]", side_effects: [] }
  - { method: GET, path: "/ami-limits/{id}", description: "Get one AMI limit row", roles: [HousingDeveloper, MarketingCoordinator, ApplicationClerk, ComplianceOfficer, LotteryAdministrator, FundingAgencyAuditor], code: 200, input: [], output: AmiLimit, side_effects: [] }

  # --- ApplicationCampaign ---
  - { method: POST, path: "/campaigns", description: "Create a campaign (window overlap with sibling campaigns rejected, half-open semantics)", roles: [HousingDeveloper], code: 201, input: [property_id, name, application_open_at, application_close_at, marketing_channels, marketing_plan_summary, "target_ami_tier?"], output: ApplicationCampaign, side_effects: ["status DRAFT"] }
  - { method: GET, path: "/campaigns", description: "List campaigns", roles: [HousingDeveloper, MarketingCoordinator, ApplicationClerk, ComplianceOfficer, LotteryAdministrator, FundingAgencyAuditor], code: 200, input: ["property_id?", "status?", "limit?", "offset?"], output: "ApplicationCampaign[]", side_effects: [] }
  - { method: GET, path: "/campaigns/{id}", description: "Get a campaign with derived counters", roles: [HousingDeveloper, MarketingCoordinator, ApplicationClerk, ComplianceOfficer, LotteryAdministrator, FundingAgencyAuditor], code: 200, input: [], output: ApplicationCampaign, side_effects: [] }
  - { method: POST, path: "/campaigns/{id}/transition", description: "action=ANNOUNCE (MarketingCoordinator) | OPEN | CLOSE | REOPEN (HousingDeveloper; REOPEN requires new window fields)", roles: [HousingDeveloper, MarketingCoordinator], code: 200, input: [action, "new_application_open_at?", "new_application_close_at?"], output: ApplicationCampaign, side_effects: ["campaign state machine transition", "increments ApplicationCampaign.version by 1"] }

  # --- Applicant ---
  - { method: POST, path: "/applicants", description: "Register an applicant (head of household)", roles: [Anonymous], code: 201, input: [full_name, email], output: Applicant, side_effects: [] }
  - { method: GET, path: "/applicants/{id}", description: "Get an applicant (staff any; Applicant self only)", roles: [HousingDeveloper, MarketingCoordinator, ApplicationClerk, ComplianceOfficer, LotteryAdministrator, FundingAgencyAuditor, Applicant], code: 200, input: [], output: Applicant, side_effects: [] }

  # --- Application ---
  - { method: POST, path: "/applications", description: "Submit an application to an OPEN campaign; mints confirmation_code; computes provisional_determination", roles: [Applicant], code: 201, input: [applicant_id, campaign_id, household_size, self_reported_annual_income_cents], output: Application, side_effects: ["status SUBMITTED; confirmation_code minted; provisional_eligibility_screen run; campaign.applications_received_count recomputed"] }
  - { method: GET, path: "/applications", description: "List applications (Applicant sees own only)", roles: [HousingDeveloper, MarketingCoordinator, ApplicationClerk, ComplianceOfficer, LotteryAdministrator, FundingAgencyAuditor, Applicant], code: 200, input: ["campaign_id?", "applicant_id?", "status?", "limit?", "offset?"], output: "Application[]", side_effects: [] }
  - { method: GET, path: "/applications/{id}", description: "Get an application", roles: [HousingDeveloper, MarketingCoordinator, ApplicationClerk, ComplianceOfficer, LotteryAdministrator, FundingAgencyAuditor, Applicant], code: 200, input: [], output: Application, side_effects: [] }
  - { method: POST, path: "/applications/{id}/withdraw", description: "Applicant withdraws a non-terminal application", roles: [Applicant], code: 200, input: [], output: Application, side_effects: ["status WITHDRAWN; campaign counter recompute", "increments Application.version by 1"] }
  - { method: POST, path: "/applications/{id}/review", description: "action=BEGIN_REVIEW | REQUEST_INFO | REJECT (ApplicationClerk) | SUBMIT_INFO (Applicant owner) | COMPLETE_VERIFICATION (ApplicationClerk)", roles: [ApplicationClerk, Applicant], code: 200, input: [action, "note?", "rejection_reason?"], output: Application, side_effects: ["application review state machine transition", "increments Application.version by 1"] }

  # --- PreferenceClaim ---
  - { method: POST, path: "/preference-claims", description: "Applicant files a preference claim with evidence on own non-terminal application", roles: [Applicant], code: 201, input: [application_id, category, evidence_ref], output: PreferenceClaim, side_effects: ["status PENDING"] }
  - { method: GET, path: "/preference-claims", description: "List preference claims", roles: [HousingDeveloper, MarketingCoordinator, ApplicationClerk, ComplianceOfficer, LotteryAdministrator, FundingAgencyAuditor, Applicant], code: 200, input: ["application_id?", "status?", "category?", "limit?", "offset?"], output: "PreferenceClaim[]", side_effects: [] }
  - { method: GET, path: "/preference-claims/{id}", description: "Get a preference claim", roles: [HousingDeveloper, MarketingCoordinator, ApplicationClerk, ComplianceOfficer, LotteryAdministrator, FundingAgencyAuditor, Applicant], code: 200, input: [], output: PreferenceClaim, side_effects: [] }
  - { method: POST, path: "/preference-claims/{id}/transition", description: "action=VERIFY | DENY (ApplicationClerk) | APPEAL (Applicant owner, from DENIED, requires new_evidence_ref)", roles: [ApplicationClerk, Applicant], code: 200, input: [action, "denial_reason?", "new_evidence_ref?"], output: PreferenceClaim, side_effects: ["claim state machine transition; parent verified_preference_categories recompute on VERIFY", "increments PreferenceClaim.version by 1"] }

  # --- IncomeCertification ---
  - { method: POST, path: "/income-certifications", description: "Open an income certification for a VERIFIED application (one non-DENIED cert per application)", roles: [ComplianceOfficer], code: 201, input: [application_id], output: IncomeCertification, side_effects: ["status INITIATED"] }
  - { method: GET, path: "/income-certifications", description: "List income certifications", roles: [HousingDeveloper, MarketingCoordinator, ApplicationClerk, ComplianceOfficer, LotteryAdministrator, FundingAgencyAuditor, Applicant], code: 200, input: ["application_id?", "status?", "limit?", "offset?"], output: "IncomeCertification[]", side_effects: [] }
  - { method: GET, path: "/income-certifications/{id}", description: "Get an income certification", roles: [HousingDeveloper, MarketingCoordinator, ApplicationClerk, ComplianceOfficer, LotteryAdministrator, FundingAgencyAuditor, Applicant], code: 200, input: [], output: IncomeCertification, side_effects: [] }
  - { method: POST, path: "/income-certifications/{id}/advance", description: "action=REQUEST_DOCS | CERTIFY | DENY (ComplianceOfficer) | SUBMIT_DOCS (Applicant owner)", roles: [ComplianceOfficer, Applicant], code: 200, input: [action, "required_docs?", "income_sources?", "denial_reason?"], output: IncomeCertification, side_effects: ["certification state machine transition; CERTIFY runs certified_income_annualization + ami_percentage_and_threshold", "increments IncomeCertification.version by 1"] }

  # --- LotteryRun ---
  - { method: POST, path: "/lottery-runs", description: "Create a lottery run for a CLOSED campaign (OCC on campaign version)", roles: [LotteryAdministrator], code: 201, input: [campaign_id, seed, expected_campaign_version], output: LotteryRun, side_effects: ["status DRAFT", "increments ApplicationCampaign.version by 1"] }
  - { method: GET, path: "/lottery-runs", description: "List lottery runs", roles: [HousingDeveloper, MarketingCoordinator, ApplicationClerk, ComplianceOfficer, LotteryAdministrator, FundingAgencyAuditor], code: 200, input: ["campaign_id?", "status?", "limit?", "offset?"], output: "LotteryRun[]", side_effects: [] }
  - { method: GET, path: "/lottery-runs/{id}", description: "Get a lottery run", roles: [HousingDeveloper, MarketingCoordinator, ApplicationClerk, ComplianceOfficer, LotteryAdministrator, FundingAgencyAuditor], code: 200, input: [], output: LotteryRun, side_effects: [] }
  - { method: POST, path: "/lottery-runs/{id}/transition", description: "action=SEAL | EXECUTE | PUBLISH | VOID (VOID requires void_reason)", roles: [LotteryAdministrator], code: 200, input: [action, "void_reason?"], output: LotteryRun, side_effects: ["lottery state machine transition; EXECUTE generates WaitlistEntries; PUBLISH flips campaign; VOID cascades entry removals", "increments LotteryRun.version by 1"] }

  # --- WaitlistEntry ---
  - { method: GET, path: "/waitlist-entries", description: "List waitlist entries (only discovery channel for lottery-generated entries)", roles: [HousingDeveloper, MarketingCoordinator, ApplicationClerk, ComplianceOfficer, LotteryAdministrator, FundingAgencyAuditor, Applicant], code: 200, input: ["campaign_id?", "lottery_run_id?", "application_id?", "status?", "limit?", "offset?"], output: "WaitlistEntry[]", side_effects: [] }
  - { method: GET, path: "/waitlist-entries/{id}", description: "Get a waitlist entry", roles: [HousingDeveloper, MarketingCoordinator, ApplicationClerk, ComplianceOfficer, LotteryAdministrator, FundingAgencyAuditor, Applicant], code: 200, input: [], output: WaitlistEntry, side_effects: [] }
  - { method: POST, path: "/waitlist-entries/{id}/confirm-interest", description: "Applicant confirms continued interest during an active purge notice window", roles: [Applicant], code: 200, input: [], output: WaitlistEntry, side_effects: ["last_confirmed_at = now", "increments WaitlistEntry.version by 1"] }
  - { method: POST, path: "/waitlist-entries/{id}/remove", description: "Administrative removal of a RANKED entry", roles: [HousingDeveloper], code: 200, input: [removal_reason], output: WaitlistEntry, side_effects: ["status REMOVED with removal_reason; campaign.waitlist_active_count recomputed", "increments WaitlistEntry.version by 1"] }

  # --- UnitOffer ---
  - { method: POST, path: "/offers/generate", description: "Batch offer generation for a campaign: runs offer_unit_selection over AVAILABLE units", roles: [LotteryAdministrator], code: 200, input: [campaign_id], output: "{ generated_count: integer, generated_offer_ids: string[], units_considered: integer }", side_effects: ["creates UnitOffers; entries RANKED -> OFFERED; units AVAILABLE -> RESERVED; first generation flips campaign LOTTERY_COMPLETED -> LEASING"] }
  - { method: GET, path: "/offers", description: "List offers", roles: [HousingDeveloper, MarketingCoordinator, ApplicationClerk, ComplianceOfficer, LotteryAdministrator, FundingAgencyAuditor, Applicant], code: 200, input: ["campaign_id?", "unit_id?", "entry_id?", "status?", "limit?", "offset?"], output: "UnitOffer[]", side_effects: [] }
  - { method: GET, path: "/offers/{id}", description: "Get an offer", roles: [HousingDeveloper, MarketingCoordinator, ApplicationClerk, ComplianceOfficer, LotteryAdministrator, FundingAgencyAuditor, Applicant], code: 200, input: [], output: UnitOffer, side_effects: [] }
  - { method: POST, path: "/offers/{id}/respond", description: "action=ACCEPT | DECLINE by the entry's applicant", roles: [Applicant], code: 200, input: [action], output: UnitOffer, side_effects: ["offer state machine transition + entry/unit/counter cascades per §1.2", "increments UnitOffer.version by 1"] }
  - { method: POST, path: "/offers/expire-due", description: "System sweep: every PENDING offer with response_deadline < now -> EXPIRED with refusal cascade, processed offered_at ASC", roles: [HousingDeveloper], code: 200, input: [], output: "{ expired_count: integer }", side_effects: ["per-offer EXPIRED cascades (refusal_count, possible REMOVED, unit release, counter recompute)"] }

  # --- PurgeRun ---
  - { method: POST, path: "/purge-runs", description: "Schedule a waitlist purge for a LEASING campaign (OCC on campaign version)", roles: [HousingDeveloper], code: 201, input: [campaign_id, "notice_response_days?", expected_campaign_version], output: PurgeRun, side_effects: ["status SCHEDULED; campaign LEASING -> PURGE_SCHEDULED", "increments ApplicationCampaign.version by 1"] }
  - { method: GET, path: "/purge-runs", description: "List purge runs", roles: [HousingDeveloper, MarketingCoordinator, ApplicationClerk, ComplianceOfficer, LotteryAdministrator, FundingAgencyAuditor], code: 200, input: ["campaign_id?", "status?", "limit?", "offset?"], output: "PurgeRun[]", side_effects: [] }
  - { method: GET, path: "/purge-runs/{id}", description: "Get a purge run", roles: [HousingDeveloper, MarketingCoordinator, ApplicationClerk, ComplianceOfficer, LotteryAdministrator, FundingAgencyAuditor], code: 200, input: [], output: PurgeRun, side_effects: [] }
  - { method: POST, path: "/purge-runs/{id}/advance", description: "action=SEND_NOTICES | EXECUTE | CANCEL", roles: [HousingDeveloper], code: 200, input: [action], output: PurgeRun, side_effects: ["purge state machine transition; EXECUTE runs purge_selection cascade", "increments PurgeRun.version by 1"] }

  # --- ComplianceReport ---
  - { method: POST, path: "/compliance-reports", description: "Create a compliance report (aggregates computed per period_mode; closed-interval overlap against SUBMITTED/ACKNOWLEDGED reports rejected)", roles: [ComplianceOfficer], code: 201, input: [campaign_id, period_start, period_end, period_mode], output: ComplianceReport, side_effects: ["status DRAFT; compliance_aggregation run"] }
  - { method: GET, path: "/compliance-reports", description: "List compliance reports", roles: [HousingDeveloper, MarketingCoordinator, ApplicationClerk, ComplianceOfficer, LotteryAdministrator, FundingAgencyAuditor], code: 200, input: ["campaign_id?", "status?", "limit?", "offset?"], output: "ComplianceReport[]", side_effects: [] }
  - { method: GET, path: "/compliance-reports/{id}", description: "Get a compliance report", roles: [HousingDeveloper, MarketingCoordinator, ApplicationClerk, ComplianceOfficer, LotteryAdministrator, FundingAgencyAuditor], code: 200, input: [], output: ComplianceReport, side_effects: [] }
  - { method: POST, path: "/compliance-reports/{id}/transition", description: "action=SUBMIT (ComplianceOfficer) | ACKNOWLEDGE | RETURN (FundingAgencyAuditor; RETURN requires return_reason)", roles: [ComplianceOfficer, FundingAgencyAuditor], code: 200, input: [action, "return_reason?"], output: ComplianceReport, side_effects: ["report state machine transition; SUBMIT from RETURNED recomputes aggregates", "increments ComplianceReport.version by 1"] }

  # --- Logical clock (test-driving endpoint) ---
  - { method: POST, path: "/_clock/set_current_utc", description: "Set the logical clock. Server startup default is exactly 2026-05-01T00:00:00Z; before any call the clock reads this default and never falls back to wall-clock time.", roles: [HousingDeveloper], code: 200, input: [to_iso8601], output: "{ current_utc: string }", side_effects: ["logical clock advanced; no automatic transitions fire as a result (sweeps are explicit endpoints)"] }

# =============================================================================
# §1.6 Error Code Catalog
# =============================================================================
errors:
  - { id: ERR_UNAUTHENTICATED, http: 401, condition: "Missing/unrecognized X-User-Role, or missing X-User-ID for a non-Anonymous role" }
  - { id: ERR_UNAUTHORIZED_ROLE, http: 403, condition: "Role not in endpoint roles; action-level role mapping violated; or Applicant X-User-ID does not own the addressed resource" }
  - { id: ERR_INVALID_REQUEST, http: 400, condition: "Missing required field, invalid enum/datetime/integer shape, REOPEN without new window fields, VOID without void_reason, RETURN without return_reason, DENY without denial_reason, CALENDAR_QUARTER period not quarter-aligned" }
  - { id: ERR_NOT_FOUND, http: 404, condition: "Any path or body id does not resolve" }
  - { id: ERR_STALE_VERSION, http: 412, condition: "expected_campaign_version does not equal the campaign's current version (POST /lottery-runs, POST /purge-runs)" }
  - { id: ERR_INVALID_STATE, http: 409, condition: "Generic state-machine rejection: transition not listed for current state, CLOSE before application_close_at, remove of non-RANKED entry, confirm-interest without NOTICES_SENT purge, offer generation without a PUBLISHED run, out-of-service on non-AVAILABLE unit" }
  - { id: ERR_CAMPAIGN_NOT_OPEN, http: 409, condition: "POST /applications while campaign.status != OPEN" }
  - { id: ERR_ACTIVE_LOTTERY_EXISTS, http: 409, condition: "POST /lottery-runs while another run for the campaign has status IN {DRAFT, SEALED, EXECUTED, PUBLISHED}" }
  - { id: ERR_APPLICATION_NOT_VERIFIED, http: 409, condition: "POST /income-certifications for an application whose status != VERIFIED" }
  - { id: ERR_SEGREGATION_OF_DUTIES, http: 403, condition: "Same X-User-ID performs lottery operations (SEAL/EXECUTE/PUBLISH) and income CERTIFY on the same campaign" }
  - { id: ERR_APPLICATION_WINDOW_NOT_OPEN, http: 422, condition: "Campaign OPEN transition before application_open_at" }
  - { id: ERR_APPLICATION_WINDOW_CLOSED, http: 422, condition: "Application submit while campaign still OPEN but logical clock >= application_close_at" }
  - { id: ERR_OFFER_EXPIRED, http: 409, condition: "Offer respond when logical clock > response_deadline" }
  - { id: ERR_CERTIFICATION_EXPIRED, http: 409, condition: "Offer accept when the application's certification valid_until < now" }
  - { id: ERR_PURGE_NOT_EXECUTABLE, http: 409, condition: "PurgeRun EXECUTE before response_deadline" }
  - { id: ERR_DUPLICATE_APPLICATION, http: 409, condition: "Same applicant already has an application with status IN {SUBMITTED, UNDER_REVIEW, NEEDS_INFO, VERIFIED} in this campaign" }
  - { id: ERR_DUPLICATE_CLAIM, http: 409, condition: "A PreferenceClaim of the same category already exists for this application" }
  - { id: ERR_CONFIG_CONFLICT, http: 409, condition: "Duplicate OccupancyStandard (property, bedroom_count) or AmiLimit (property, household_size, ami_tier)" }
  - { id: ERR_CAMPAIGN_WINDOW_OVERLAP, http: 409, condition: "Half-open window overlap with a sibling non-PURGED campaign on the same property" }
  - { id: ERR_REPORT_PERIOD_OVERLAP, http: 409, condition: "Closed-interval declared-period overlap with a SUBMITTED or ACKNOWLEDGED report on the same campaign" }
  - { id: ERR_HOUSEHOLD_SIZE_INVALID, http: 422, condition: "household_size < 1 or > 12" }
  - { id: ERR_PREFERENCE_EVIDENCE_REQUIRED, http: 422, condition: "PreferenceClaim created with empty/missing evidence_ref" }
  - { id: ERR_PREFERENCE_CLAIMS_PENDING, http: 409, condition: "COMPLETE_VERIFICATION while any claim of the application is PENDING" }
  - { id: ERR_MARKETING_PLAN_INSUFFICIENT, http: 422, condition: "ANNOUNCE with fewer than 2 marketing_channels" }
  - { id: ERR_CERT_DOCS_INCOMPLETE, http: 422, condition: "CERTIFY when a required_docs source_type has no matching submitted income_sources entry" }
  - { id: ERR_AMI_LIMIT_NOT_DEFINED, http: 422, condition: "CERTIFY (or offer eligibility evaluation) needs an AmiLimit row that does not exist for (property, household_size, tier)" }
  - { id: ERR_OVER_INCOME, http: 422, condition: "CERTIFY computes certified income strictly greater than the target-tier limit" }
  - { id: ERR_REPORT_INCOMPLETE_DATA, http: 422, condition: "Report SUBMIT while the campaign has no PUBLISHED LotteryRun or is not in a post-lottery state" }

# =============================================================================
# §1.7 RBAC Matrix
# =============================================================================
roles:
  - name: HousingDeveloper
    description: "Developer operator: property/unit/config setup, campaign lifecycle (except ANNOUNCE), purges, expiry sweeps, administrative entry removal, clock control"
    identity: opaque
    exclusive_operations: ["POST /properties", "POST /units", "POST /units/{id}/service", "POST /occupancy-standards", "POST /ami-limits", "POST /campaigns", "campaign OPEN/CLOSE/REOPEN transitions", "POST /offers/expire-due", "POST /purge-runs", "POST /purge-runs/{id}/advance", "POST /waitlist-entries/{id}/remove", "POST /_clock/set_current_utc"]
    shared_operations: [all GET endpoints]
  - name: MarketingCoordinator
    description: "Owns the application-period announcement & marketing plan"
    identity: opaque
    exclusive_operations: [campaign ANNOUNCE transition]
    shared_operations: [all GET endpoints]
  - name: ApplicationClerk
    description: "Reviews applications and decides preference claims"
    identity: opaque
    exclusive_operations: [application BEGIN_REVIEW/REQUEST_INFO/COMPLETE_VERIFICATION/REJECT, preference-claim VERIFY/DENY]
    shared_operations: [all GET endpoints]
  - name: ComplianceOfficer
    description: "Certifies income and files compliance reports; segregated from lottery operations on the same campaign"
    identity: opaque
    exclusive_operations: ["POST /income-certifications", "cert REQUEST_DOCS/CERTIFY/DENY", "POST /compliance-reports", "report SUBMIT"]
    shared_operations: [all GET endpoints]
  - name: LotteryAdministrator
    description: "Runs lotteries and generates offers; segregated from income certification on the same campaign"
    identity: opaque
    exclusive_operations: ["POST /lottery-runs", "POST /lottery-runs/{id}/transition", "POST /offers/generate"]
    shared_operations: [all GET endpoints]
  - name: FundingAgencyAuditor
    description: "Funding-agency reviewer: acknowledges or returns submitted compliance reports"
    identity: opaque
    exclusive_operations: [report ACKNOWLEDGE/RETURN]
    shared_operations: [all GET endpoints]
  - name: Applicant
    description: "Head of household; X-User-ID must equal the owning Applicant id for all own-resource operations"
    identity: "entity_backed:Applicant"
    exclusive_operations: ["POST /applications", "POST /applications/{id}/withdraw", "application SUBMIT_INFO", "POST /preference-claims", "preference-claim APPEAL", "cert SUBMIT_DOCS", "POST /waitlist-entries/{id}/confirm-interest", "POST /offers/{id}/respond"]
    shared_operations: ["GET on own applications, claims, certifications, entries, offers", "GET /applicants/{id} for self"]
  - name: Anonymous
    description: "Unauthenticated public caller; may only register an applicant"
    identity: opaque
    exclusive_operations: ["POST /applicants"]
    shared_operations: []
