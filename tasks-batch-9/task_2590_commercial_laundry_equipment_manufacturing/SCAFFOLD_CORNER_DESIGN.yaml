              as_user_id: "u-rev-w"
          trigger:
            - call: "POST /clm/machine-models/${m1}/lifecycle-actions"
              payload: { action: "SUSPEND", reason: "MANUAL" }
              as: ProductEngineer
              as_user_id: "u-pe-01"
              captures: { err: $.data.error_id }
          assert:
            - "the trigger returns HTTP 409"
            - "${err} == ERR_MODEL_STATE_INVALID"
            - "MachineModel.${m1}.certification_state == CERTIFIED"
            - "MachineModel.${m1}.suspended_reason == NONE"

      - name: station_log_fail_from_bearings_done_jumps_to_rework
        claim_type: guarded_transitions
        grounds:
          - state_machines.BuildOrder
          - endpoints[POST /clm/build-orders/{id}/station-logs]
          - entities.BuildOrder.fields.station_pass_count
        distinguishing_aspect: "The FAIL edge is guarded only by ANY_OF[ON_FLOOR, DRUM_DONE, BEARINGS_DONE], so a failing CONTROL_INTEGRATION log sends a BEARINGS_DONE unit straight to REWORK instead of QA_HOLD, and the failed log is still stored and still billed in labor_minutes_total while station_pass_count stops at 2."
