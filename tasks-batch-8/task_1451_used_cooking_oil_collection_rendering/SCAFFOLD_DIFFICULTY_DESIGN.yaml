            - { call: "POST /api/market-index-quotes/${q1}/publish", payload: {}, as: BillingAnalyst }
            - { call: "POST /api/_clock/set_current_utc", payload: { to_iso8601: "2026-08-15T00:00:00Z" }, as: SystemAdmin }
            - call: "POST /api/settlements/generate"
              payload: { customer_id: "${cust}", period_start: "2026-08-01", period_end: "2026-08-15" }
              as: BillingAnalyst
              captures: { stl: $.data.id, stl_v0: $.data.version }
          trigger:
            - call: "POST /api/market-index-quotes"
              payload: { index_code: YG_CBI, week_start: "2026-08-04", price_cents_per_gal: 200 }
              as: BillingAnalyst
