      - name: accept_then_kill_conserves_available_sf
        grounds:
          - state_machines.Space.AVAILABLE_to_UNDER_LOI
          - state_machines.Space.UNDER_LOI_to_AVAILABLE
          - state_machines.Deal.LOI_ACCEPTED_to_DEAD
          - entities.Property.fields.available_sf
        distinguishing_aspect: |
          Conserved quantity #2 = SQUARE FEET (Property.available_sf), a different type of
          conserved quantity than dollars. Forward action accept (AVAILABLE->UNDER_LOI)
          decrements available_sf by 5000; the compensating kill (UNDER_LOI->AVAILABLE)
          restores it to exactly 5000 — net zero, no drift.
        test_recipe:
          setup:
            - "Property with one AVAILABLE 5000-sf space (available_sf=5000); a Deal accepted so the space is UNDER_LOI (available_sf temporarily 0)."
          setup_api_calls:
            - call: "POST /brokerages"
              payload: { name: "CI2 List", side: "LISTING" }
              as: BrokerageAdmin
              captures: { bkrg_a_id: $.data.id }
            - call: "POST /brokerages"
              payload: { name: "CI2 Rep", side: "TENANT_REP" }
              as: BrokerageAdmin
              captures: { bkrg_b_id: $.data.id }
            - call: "POST /brokers"
