            - call: "POST /tooling/grinding-runs/${run1_id}/complete"
              payload: { produced_units: 43, scrap_units: 0, measured_diameter_dev_um: 4.0 }
              as: ProductionPlanner
            - call: "POST /tooling/grinding-wheels/${wheel_id}/dress"
              payload: { dress_note: "Dress cycle 1" }
              as: ProductionPlanner
            - call: "POST /tooling/grinding-runs"
              payload: { wheel_id: "${wheel_id}", product_id: "${product_id}", cell_id: "CELL_A", window_start: "2026-08-12T09:00:00Z", window_end: "2026-08-12T11:00:00Z", planned_units: 43 }
              as: ProductionPlanner
              captures: { run2_id: $.data.id }
            - call: "POST /tooling/_clock/set_current_utc"
              payload: { current_utc: "2026-08-12T11:00:00Z" }
              as: ProductionPlanner
            - call: "POST /tooling/grinding-runs/${run2_id}/complete"
              payload: { produced_units: 43, scrap_units: 0, measured_diameter_dev_um: 4.0 }
              as: ProductionPlanner
            - call: "POST /tooling/grinding-wheels/${wheel_id}/dress"
