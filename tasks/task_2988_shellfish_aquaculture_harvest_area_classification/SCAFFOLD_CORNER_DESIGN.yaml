      - name: blank_user_id_header_returns_unauthenticated
        claim_type: authentication
        grounds:
          - errors[ERR_UNAUTHENTICATED]
          - roles[ShellfishControlAuthority]
        distinguishing_aspect: |
          Authentication is checked before authorization and before resource lookup: an empty-string
          X-User-ID on an otherwise valid read for a valid role returns 401 ERR_UNAUTHENTICATED, not
          403 and not a 404 for the area it names.
        test_recipe:
          setup:
            - "One GrowingArea GA-114 exists."
          setup_api_calls:
            - call: "POST /shellfish/_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-01T00:00:00Z" }
              as: ShellfishControlAuthority
            - call: "POST /shellfish/growing-areas"
              payload: { code: "GA-114", water_body: "Pamlico Sound", rainfall_closure_threshold_in: 1.0, rainfall_closure_hours: 96, reopen_sample_count_required: 3, clean_sample_mpn_limit: 14.0, conditional_management_plan_on_file: false }
              as: ShellfishControlAuthority
              captures: { area: $.data.id }
          trigger:
            - call: "GET /shellfish/growing-areas/${area}"
              payload: {}
              as: ShellfishControlAuthority
              as_user_id: ""
            - call: "GET /shellfish/growing-areas/00000000-0000-0000-0000-000000000000"
              payload: {}
              as: ShellfishControlAuthority
              as_user_id: ""
          assert:
            - "First call: HTTP 401 with data.error_id == ERR_UNAUTHENTICATED (the header is sent as an empty string, not omitted whitespace)"
            - "Second call: HTTP 401 with data.error_id == ERR_UNAUTHENTICATED, not ERR_GROWING_AREA_NOT_FOUND — authentication precedes lookup"
            - "Both responses carry meta.api_request_id and a non-empty data.message"

