# =============================================================================
# §1.8 Scaffold Difficulty Design (Test Targeting Index)
# Task 2736 — Real Estate Wholesaling & Contract Assignment
#
# Nine §0.5 rule_ids x 2 instances = 18 instances.
# Every grounds ref resolves into SCAFFOLD.yaml §1.1-§1.6; every call resolves
# to a §1.5 endpoint; every formula-derived assert literal was computed by
# executing the §1.3 formula with its declared constants.
#
# Server clock default: 2026-08-01T00:00:00Z (POST /_clock/set_current_utc).
# =============================================================================
scaffold_difficulty_design:

  # ===========================================================================
  - rule_id: dual_variant_calc
    instances:

      - name: mao_diverges_between_conservative_and_aggressive_valuation
        grounds:
          - calculations.arv_and_mao
          - entities.DealAnalysis.fields.arv_cents
          - entities.DealAnalysis.fields.repair_estimate_cents
          - entities.DealAnalysis.fields.max_allowable_offer_cents
          - entities.DealAnalysis.fields.qualifying_comp_count
          - state_machines.DealAnalysis.DRAFT_to_FINALIZED
        distinguishing_aspect: |
          This dual-variant pair lives on the DealAnalysis valuation domain: from one
          identical comparable set and one identical repair scope, CONSERVATIVE (median ARV,
          high-side repairs grossed up by the 1.10 contingency, 0.70 ARV multiplier) yields
          max_allowable_offer_cents 14339500 while AGGRESSIVE (recency-weighted mean ARV,
          low-side repairs, 0.75 multiplier) yields 18235598 — a 3896098-cent divergence in
          the price ceiling, with all three intermediate outputs differing too.
        test_recipe:
          setup:
            - "Logical clock parked at 2026-08-10T00:00:00Z."
            - "One unlicensed wholesaler in TX with disclosure template DISC-2026.1."
            - "Two distinct STANDARD-tier seller leads on two different properties, both STATUTORY-screened."
            - "Two DRAFT DealAnalysis rows, one per lead, carrying byte-identical comparables and repair_scope_items: five comparables of which exactly four qualify (the fifth is 0.75 miles away, outside the 0.50-mile band) and four repair line items."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-10T00:00:00Z" }
              as: PlatformAdmin
            - call: "POST /wholesalers"
              payload: { legal_name: "Keystone Property Partners LLC", state_code: "TX", disclosure_template_version: "DISC-2026.1" }
              as: PlatformAdmin
              captures: { w_id: $.data.id }
            - call: "POST /seller-leads"
              payload: { wholesaler_id: "${w_id}", owner_name: "Dana Ruiz", property_address: "118 Cedar St, Austin TX", state_code: "TX", estimated_market_value_cents: 30000000, recorded_senior_lien_cents: 10000000 }
              as: Wholesaler
              as_user_id: "${w_id}"
              captures: { sl1_id: $.data.id }
            - call: "POST /seller-leads/${sl1_id}/protection-screen"
              payload: { screening_variant: "STATUTORY" }
              as: Wholesaler
              as_user_id: "${w_id}"
              captures: { sl1_v2: $.data.version }
            - call: "POST /deal-analyses"
              payload:
                seller_lead_id: "${sl1_id}"
                subject_gla_sqft: 1800
                comparables:
                  - { sale_price_cents: 30000000, distance_miles: 0.25, closed_days_ago: 30, gla_sqft: 1850, adjustment_cents: -500000 }
                  - { sale_price_cents: 31000000, distance_miles: 0.40, closed_days_ago: 90, gla_sqft: 1750, adjustment_cents: 0 }
                  - { sale_price_cents: 28500000, distance_miles: 0.50, closed_days_ago: 180, gla_sqft: 2100, adjustment_cents: 250000 }
                  - { sale_price_cents: 32000000, distance_miles: 0.10, closed_days_ago: 10, gla_sqft: 1900, adjustment_cents: -1000000 }
                  - { sale_price_cents: 40000000, distance_miles: 0.75, closed_days_ago: 20, gla_sqft: 1900, adjustment_cents: 0 }
                repair_scope_items:
                  - { code: "ROOF", low_cents: 1200000, high_cents: 1800000 }
                  - { code: "HVAC", low_cents: 600000, high_cents: 950000 }
                  - { code: "KITCHEN", low_cents: 1500000, high_cents: 2100000 }
                  - { code: "PLUMBING", low_cents: 300000, high_cents: 455000 }
                expected_seller_lead_version: "${sl1_v2}"
              as: Wholesaler
              as_user_id: "${w_id}"
              captures: { da1_id: $.data.id }
            - call: "POST /seller-leads"
              payload: { wholesaler_id: "${w_id}", owner_name: "Omar Beck", property_address: "220 Birch Ln, Austin TX", state_code: "TX", estimated_market_value_cents: 30000000, recorded_senior_lien_cents: 10000000 }
              as: Wholesaler
              as_user_id: "${w_id}"
              captures: { sl2_id: $.data.id }
            - call: "POST /seller-leads/${sl2_id}/protection-screen"
              payload: { screening_variant: "STATUTORY" }
              as: Wholesaler
              as_user_id: "${w_id}"
              captures: { sl2_v2: $.data.version }
            - call: "POST /deal-analyses"
              payload:
                seller_lead_id: "${sl2_id}"
                subject_gla_sqft: 1800
                comparables:
                  - { sale_price_cents: 30000000, distance_miles: 0.25, closed_days_ago: 30, gla_sqft: 1850, adjustment_cents: -500000 }
                  - { sale_price_cents: 31000000, distance_miles: 0.40, closed_days_ago: 90, gla_sqft: 1750, adjustment_cents: 0 }
                  - { sale_price_cents: 28500000, distance_miles: 0.50, closed_days_ago: 180, gla_sqft: 2100, adjustment_cents: 250000 }
                  - { sale_price_cents: 32000000, distance_miles: 0.10, closed_days_ago: 10, gla_sqft: 1900, adjustment_cents: -1000000 }
                  - { sale_price_cents: 40000000, distance_miles: 0.75, closed_days_ago: 20, gla_sqft: 1900, adjustment_cents: 0 }
                repair_scope_items:
                  - { code: "ROOF", low_cents: 1200000, high_cents: 1800000 }
                  - { code: "HVAC", low_cents: 600000, high_cents: 950000 }
                  - { code: "KITCHEN", low_cents: 1500000, high_cents: 2100000 }
                  - { code: "PLUMBING", low_cents: 300000, high_cents: 455000 }
                expected_seller_lead_version: "${sl2_v2}"
              as: Wholesaler
              as_user_id: "${w_id}"
              captures: { da2_id: $.data.id }
          trigger:
            - call: "POST /deal-analyses/${da1_id}/finalize"
              payload: { valuation_variant: "CONSERVATIVE" }
              as: Wholesaler
              as_user_id: "${w_id}"
            - call: "POST /deal-analyses/${da2_id}/finalize"
              payload: { valuation_variant: "AGGRESSIVE" }
              as: Wholesaler
              as_user_id: "${w_id}"
          assert:
            - "DealAnalysis.${da1_id}.qualifying_comp_count == 4 and DealAnalysis.${da2_id}.qualifying_comp_count == 4 (the 0.75-mile comparable is filtered out under both variants)"
            - "DealAnalysis.${da1_id}.valuation_variant == CONSERVATIVE and DealAnalysis.${da1_id}.status == FINALIZED"
            - "DealAnalysis.${da1_id}.arv_cents == 30250000 (median of 28750000, 29500000, 31000000, 31000000)"
            - "DealAnalysis.${da1_id}.repair_estimate_cents == 5835500 (5305000 high-side sum x 1.10, rounded once)"
            - "DealAnalysis.${da1_id}.max_allowable_offer_cents == 14339500 (21175000 - 5835500 - 1000000)"
            - "DealAnalysis.${da2_id}.valuation_variant == AGGRESSIVE and DealAnalysis.${da2_id}.status == FINALIZED"
            - "DealAnalysis.${da2_id}.arv_cents == 30447464 (12605250000 / 414 recency-weighted, rounded once)"
            - "DealAnalysis.${da2_id}.repair_estimate_cents == 3600000 (low-side sum, no contingency)"
            - "DealAnalysis.${da2_id}.max_allowable_offer_cents == 18235598 (22835598 - 3600000 - 1000000)"
            - "DealAnalysis.${da2_id}.max_allowable_offer_cents - DealAnalysis.${da1_id}.max_allowable_offer_cents == 3896098"

      - name: protection_tier_diverges_between_statutory_and_effective_screening
        grounds:
          - calculations.seller_equity_exposure
          - entities.SellerLead.fields.net_equity_cents
          - entities.SellerLead.fields.equity_pct
          - entities.SellerLead.fields.protection_tier
          - entities.SellerLead.fields.screening_variant
          - state_machines.SellerLead.SCREENED_to_SCREENED
        distinguishing_aspect: |
          This dual-variant pair lives on the SellerLead distressed-seller-protection domain —
          a different entity domain from the DealAnalysis valuation pair: the same lead row
          screens to protection_tier PROTECTED with net_equity_cents 12000000 under STATUTORY
          and drops a whole tier to ELEVATED with net_equity_cents 7700000 under EFFECTIVE,
          because EFFECTIVE additionally deducts junior liens, delinquent taxes and the 8%
          seller closing-cost allowance.
        test_recipe:
          setup:
            - "Logical clock parked at 2026-08-10T00:00:00Z."
            - "One unlicensed wholesaler in TX."
            - "One never-screened PROSPECT seller lead with estimated_market_value_cents 30000000, recorded_senior_lien_cents 18000000, junior_lien_cents 1500000, delinquent_property_tax_cents 400000 and two distress flags."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-10T00:00:00Z" }
              as: PlatformAdmin
            - call: "POST /wholesalers"
              payload: { legal_name: "Keystone Property Partners LLC", state_code: "TX", disclosure_template_version: "DISC-2026.1" }
              as: PlatformAdmin
              captures: { w_id: $.data.id }
            - call: "POST /seller-leads"
              payload:
                wholesaler_id: "${w_id}"
                owner_name: "Priya Nandan"
                property_address: "77 Willow Ct, Austin TX"
                state_code: "TX"
                estimated_market_value_cents: 30000000
                recorded_senior_lien_cents: 18000000
                junior_lien_cents: 1500000
                delinquent_property_tax_cents: 400000
                distress_flags: ["FORECLOSURE_NOTICE", "PROBATE"]
              as: Wholesaler
              as_user_id: "${w_id}"
              captures: { sl_id: $.data.id }
          trigger:
            - call: "POST /seller-leads/${sl_id}/protection-screen"
              payload: { screening_variant: "STATUTORY" }
              as: Wholesaler
              as_user_id: "${w_id}"
            - call: "POST /seller-leads/${sl_id}/protection-screen"
              payload: { screening_variant: "EFFECTIVE" }
              as: Wholesaler
              as_user_id: "${w_id}"
          assert:
            - "After the STATUTORY screen: SellerLead.${sl_id}.net_equity_cents == 12000000, equity_pct == 0.4000, protection_tier == PROTECTED, screening_variant == STATUTORY, status == SCREENED"
            - "After the EFFECTIVE re-screen: SellerLead.${sl_id}.net_equity_cents == 7700000 (30000000 - 18000000 - 1500000 - 400000 - 2400000)"
            - "After the EFFECTIVE re-screen: SellerLead.${sl_id}.equity_pct == 0.2567 and protection_tier == ELEVATED and screening_variant == EFFECTIVE"
            - "SellerLead.${sl_id}.status == SCREENED after both screens (the SCREENED -> SCREENED self-loop is legal, not ERR_INVALID_STATE)"
            - "SellerLead.${sl_id}.screened_at == 2026-08-10T00:00:00Z after both screens"
            - "SellerLead.${sl_id}.version strictly increased across each screen (the OCC parent write for POST /deal-analyses)"

  # ===========================================================================
  - rule_id: combinatorial_formula
    instances:

      - name: assignment_fee_settlement_rounds_per_component_then_sums
        grounds:
          - calculations.assignment_fee_settlement
          - entities.AssignmentAgreement.fields.title_holdback_cents
          - entities.AssignmentAgreement.fields.state_transfer_surcharge_cents
          - entities.AssignmentAgreement.fields.marketing_cost_recovery_cents
          - entities.AssignmentAgreement.fields.wholesaler_net_cents
          - state_machines.AssignmentAgreement.PENDING_SETTLEMENT_to_SETTLED
        distinguishing_aspect: |
          This is §0.5 Rule 2 mode (b) — nested rounding where the order matters. On an
          assignment fee of 1500010 cents the pinned order (round each of the three
          components to a whole cent first, then subtract) gives deductions 48750 + 11250 +
          23250 = 83250 and wholesaler_net_cents 1416760, whereas summing the rates first
          and rounding once (1500010 x 0.0555) gives 83251 and 1416759 — a one-cent
          divergence the scaffold resolves in favour of round-per-component.
        test_recipe:
          setup:
            - "Logical clock parked at 2026-08-10T00:00:00Z."
            - "One unlicensed wholesaler, one STANDARD-tier STATUTORY-screened lead, one FINALIZED AGGRESSIVE analysis with max_allowable_offer_cents 20500000."
            - "One SIGNED purchase contract at purchase_price_cents 18000000 with structure_election ASSIGNMENT_ELECTED."
            - "One cash buyer with a VERIFIED proof of funds worth 25500000 cents."
            - "One ACCEPTED assignment offer at buyer_price_cents 19500010, giving assignment_fee_cents 1500010, and a PENDING_SETTLEMENT assignment agreement papering it."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-10T00:00:00Z" }
              as: PlatformAdmin
            - call: "POST /wholesalers"
              payload: { legal_name: "Keystone Property Partners LLC", state_code: "TX", disclosure_template_version: "DISC-2026.1" }
              as: PlatformAdmin
              captures: { w_id: $.data.id }
            - call: "POST /seller-leads"
              payload: { wholesaler_id: "${w_id}", owner_name: "Dana Ruiz", property_address: "118 Cedar St, Austin TX", state_code: "TX", estimated_market_value_cents: 30000000, recorded_senior_lien_cents: 10000000 }
              as: Wholesaler
              as_user_id: "${w_id}"
              captures: { sl_id: $.data.id }
            - call: "POST /seller-leads/${sl_id}/protection-screen"
              payload: { screening_variant: "STATUTORY" }
              as: Wholesaler
              as_user_id: "${w_id}"
              captures: { sl_v2: $.data.version }
            - call: "POST /deal-analyses"
              payload:
                seller_lead_id: "${sl_id}"
                subject_gla_sqft: 1800
                comparables:
                  - { sale_price_cents: 30000000, distance_miles: 0.10, closed_days_ago: 10, gla_sqft: 1800, adjustment_cents: 0 }
                  - { sale_price_cents: 30000000, distance_miles: 0.20, closed_days_ago: 10, gla_sqft: 1800, adjustment_cents: 0 }
                  - { sale_price_cents: 30000000, distance_miles: 0.30, closed_days_ago: 10, gla_sqft: 1800, adjustment_cents: 0 }
                repair_scope_items:
                  - { code: "ROOF", low_cents: 1000000, high_cents: 1200000 }
                expected_seller_lead_version: "${sl_v2}"
              as: Wholesaler
              as_user_id: "${w_id}"
              captures: { da_id: $.data.id }
            - call: "POST /deal-analyses/${da_id}/finalize"
              payload: { valuation_variant: "AGGRESSIVE" }
              as: Wholesaler
              as_user_id: "${w_id}"
            - call: "POST /purchase-contracts"
              payload:
                seller_lead_id: "${sl_id}"
                deal_analysis_id: "${da_id}"
                purchase_price_cents: 18000000
                earnest_money_cents: 500000
                inspection_period_days: 7
                option_start_at: "2026-08-10T00:00:00Z"
                closing_window_start_at: "2026-09-15T00:00:00Z"
                closing_window_end_at: "2026-09-30T00:00:00Z"
              as: Wholesaler
              as_user_id: "${w_id}"
              captures: { pc_id: $.data.id }
            - call: "POST /disclosure-acknowledgements"
              payload: { purchase_contract_id: "${pc_id}", disclosure_template_version: "DISC-2026.1", acknowledged_intent_to_assign: true, acknowledged_unlicensed_status: true, signature_ref: "esig-dana-001" }
              as: Seller
              as_user_id: "${sl_id}"
            - call: "POST /purchase-contracts/${pc_id}/sign"
              payload: {}
              as: Seller
              as_user_id: "${sl_id}"
            - call: "POST /purchase-contracts/${pc_id}/elect-structure"
              payload: { structure_election: "ASSIGNMENT_ELECTED" }
              as: Wholesaler
              as_user_id: "${w_id}"
              captures: { pc_v: $.data.version }
            - call: "POST /cash-buyers"
              payload: { wholesaler_id: "${w_id}", legal_name: "Ridgeline Capital LLC", contact_email: "bids@ridgeline.example" }
              as: Wholesaler
              as_user_id: "${w_id}"
              captures: { cb_id: $.data.id }
            - call: "POST /proof-of-funds"
              payload: { cash_buyer_id: "${cb_id}", stated_funds_cents: 25500000, document_ref: "pof-ridgeline-001", expires_at: "2026-12-01T00:00:00Z" }
              as: CashBuyer
              as_user_id: "${cb_id}"
              captures: { pof_id: $.data.id }
            - call: "POST /proof-of-funds/${pof_id}/verify"
              payload: { verification_decision: "VERIFIED", verified_funds_cents: 25500000 }
              as: Wholesaler
              as_user_id: "${w_id}"
            - call: "POST /assignment-offers"
              payload: { purchase_contract_id: "${pc_id}", cash_buyer_id: "${cb_id}", buyer_price_cents: 19500010, buyer_deposit_cents: 1000000, expected_purchase_contract_version: "${pc_v}" }
              as: CashBuyer
              as_user_id: "${cb_id}"
              captures: { ao_id: $.data.id }
            - call: "POST /assignment-offers/${ao_id}/accept"
              payload: {}
              as: Wholesaler
              as_user_id: "${w_id}"
            - call: "POST /assignment-agreements"
              payload: { assignment_offer_id: "${ao_id}", structure: "ASSIGNMENT" }
              as: Wholesaler
              as_user_id: "${w_id}"
              captures: { aa_id: $.data.id }
          trigger:
            - call: "POST /assignment-agreements/${aa_id}/settle"
              payload: { settlement_reference: "STL-2026-000117" }
              as: TitleAgent
              as_user_id: "ta-1"
          assert:
            - "AssignmentAgreement.${aa_id}.assignment_fee_cents == 1500010"
            - "AssignmentAgreement.${aa_id}.title_holdback_cents == 48750"
            - "AssignmentAgreement.${aa_id}.state_transfer_surcharge_cents == 11250"
            - "AssignmentAgreement.${aa_id}.marketing_cost_recovery_cents == 23250"
            - "title_holdback_cents + state_transfer_surcharge_cents + marketing_cost_recovery_cents == 83250, NOT the 83251 produced by rounding 1500010 x 0.0555 once"
            - "AssignmentAgreement.${aa_id}.wholesaler_net_cents == 1416760 and != 1416759"
            - "AssignmentAgreement.${aa_id}.settlement_status == SETTLED and settlement_reference == STL-2026-000117"
            - "AssignmentOffer.${ao_id}.status == CONSUMED and PurchaseContract.${pc_id}.assignment_status == ASSIGNED"

      - name: double_close_lender_fee_tier_keyed_on_funding_base_not_purchase_price
        grounds:
          - calculations.double_close_funding_schedule
          - entities.PurchaseContract.fields.funding_base_cents
          - entities.PurchaseContract.fields.transactional_lender_fee_cents
          - entities.PurchaseContract.fields.total_funding_required_cents
          - state_machines.PurchaseContract.UNDECIDED_to_DOUBLE_CLOSE_ELECTED
        distinguishing_aspect: |
          This is §0.5 Rule 2 mode (a) — a non-linear tiered-rate selection with a
          minimum-fee floor over three inputs — a different mode from the round-per-component
          instance: purchase_price_cents 14800000 sits below TIER_1_CEILING_CENTS, but the
          2.1% gross-up pushes funding_base_cents to 15110800 which lands in tier 2, so
          transactional_lender_fee_cents is 339993 at the 0.0225 rate and NOT the 453324 the
          tier-1 0.0300 rate would give.
        test_recipe:
          setup:
            - "Logical clock parked at 2026-08-10T00:00:00Z."
            - "One unlicensed wholesaler, one STANDARD-tier lead, one FINALIZED AGGRESSIVE analysis with max_allowable_offer_cents 20500000."
            - "One SIGNED purchase contract at purchase_price_cents 14800000 whose structure_election is still UNDECIDED, so funding_base_cents, transactional_lender_fee_cents and total_funding_required_cents are all null."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-10T00:00:00Z" }
              as: PlatformAdmin
            - call: "POST /wholesalers"
              payload: { legal_name: "Keystone Property Partners LLC", state_code: "TX", disclosure_template_version: "DISC-2026.1" }
              as: PlatformAdmin
              captures: { w_id: $.data.id }
            - call: "POST /seller-leads"
              payload: { wholesaler_id: "${w_id}", owner_name: "Dana Ruiz", property_address: "118 Cedar St, Austin TX", state_code: "TX", estimated_market_value_cents: 30000000, recorded_senior_lien_cents: 10000000 }
              as: Wholesaler
              as_user_id: "${w_id}"
              captures: { sl_id: $.data.id }
            - call: "POST /seller-leads/${sl_id}/protection-screen"
              payload: { screening_variant: "STATUTORY" }
              as: Wholesaler
              as_user_id: "${w_id}"
              captures: { sl_v2: $.data.version }
            - call: "POST /deal-analyses"
              payload:
                seller_lead_id: "${sl_id}"
                subject_gla_sqft: 1800
                comparables:
                  - { sale_price_cents: 30000000, distance_miles: 0.10, closed_days_ago: 10, gla_sqft: 1800, adjustment_cents: 0 }
                  - { sale_price_cents: 30000000, distance_miles: 0.20, closed_days_ago: 10, gla_sqft: 1800, adjustment_cents: 0 }
                  - { sale_price_cents: 30000000, distance_miles: 0.30, closed_days_ago: 10, gla_sqft: 1800, adjustment_cents: 0 }
                repair_scope_items:
                  - { code: "ROOF", low_cents: 1000000, high_cents: 1200000 }
                expected_seller_lead_version: "${sl_v2}"
              as: Wholesaler
              as_user_id: "${w_id}"
              captures: { da_id: $.data.id }
            - call: "POST /deal-analyses/${da_id}/finalize"
              payload: { valuation_variant: "AGGRESSIVE" }
              as: Wholesaler
              as_user_id: "${w_id}"
            - call: "POST /purchase-contracts"
              payload:
                seller_lead_id: "${sl_id}"
                deal_analysis_id: "${da_id}"
                purchase_price_cents: 14800000
                earnest_money_cents: 500000
                inspection_period_days: 7
                option_start_at: "2026-08-10T00:00:00Z"
                closing_window_start_at: "2026-09-15T00:00:00Z"
                closing_window_end_at: "2026-09-30T00:00:00Z"
              as: Wholesaler
              as_user_id: "${w_id}"
              captures: { pc_id: $.data.id }
            - call: "POST /disclosure-acknowledgements"
              payload: { purchase_contract_id: "${pc_id}", disclosure_template_version: "DISC-2026.1", acknowledged_intent_to_assign: true, acknowledged_unlicensed_status: true, signature_ref: "esig-dana-001" }
              as: Seller
              as_user_id: "${sl_id}"
            - call: "POST /purchase-contracts/${pc_id}/sign"
              payload: {}
              as: Seller
              as_user_id: "${sl_id}"
          trigger:
            - call: "POST /purchase-contracts/${pc_id}/elect-structure"
              payload: { structure_election: "DOUBLE_CLOSE_ELECTED" }
              as: Wholesaler
              as_user_id: "${w_id}"
          assert:
            - "PurchaseContract.${pc_id}.structure_election == DOUBLE_CLOSE_ELECTED"
            - "PurchaseContract.${pc_id}.funding_base_cents == 15110800 (14800000 + 310800)"
            - "PurchaseContract.${pc_id}.transactional_lender_fee_cents == 339993 (tier 2 rate 0.0225 on 15110800), and != 453324 (the tier-1 0.0300 rate)"
            - "PurchaseContract.${pc_id}.total_funding_required_cents == 15450793 and != 15564124"
            - "PurchaseContract.${pc_id}.transactional_lender_fee_cents > TIER_2_MIN_FEE_CENTS 45000, so the floor did not bind"
            - "PurchaseContract.${pc_id}.double_close_spread_cents is null (no ACCEPTED offer on the contract yet)"
            - "PurchaseContract.${pc_id}.contract_status == SIGNED and assignment_status == NOT_MARKETED (the election touches only the structure dimension)"

  # ===========================================================================
  - rule_id: non_linear_state_machine
    instances:

      - name: assignment_offer_counter_revise_cycle_returns_to_countered
        grounds:
          - state_machines.AssignmentOffer.SUBMITTED_to_COUNTERED_BY_WHOLESALER
