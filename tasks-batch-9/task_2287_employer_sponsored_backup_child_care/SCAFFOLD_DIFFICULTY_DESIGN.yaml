          - state_machines.Reservation.OFFERED_to_MATCHING
          - state_machines.Reservation.MATCHING_to_OFFERED
          - state_machines.Reservation.MATCHING_to_UNFULFILLED
          - calculations.match_rank_score
          - entities.Reservation.fields.excluded_provider_ids
          - entities.MatchOffer.fields.offer_status
