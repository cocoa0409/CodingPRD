# =============================================================================
# SCAFFOLD.yaml — Property & Casualty Third-Party Claims Administration (TPA)
# Difficulty: Expert
# Contains §1.0–§1.7 only. §1.8 lives in SCAFFOLD_DIFFICULTY_DESIGN.yaml,
# §1.9 lives in SCAFFOLD_CORNER_DESIGN.yaml.
# =============================================================================

scenario: |
  Property & Casualty Third-Party Claims Administration (TPA): claim intake &
  assignment, reserve & adjuster/vendor, litigation & subrogation, payment &
  recovery, client-account & SLA, bordereaux/reporting, fraud/SIU referral,
  closure

domain_name: pc-claims-tpa
api_prefix: "/"

complexity_profile:
  primary_archetype: ledger_reconciliation
  secondary_archetype: compliance_audit
  complexity_layers:
    - dual_variant_calculation
    - cascading_side_effects
    - optimistic_concurrency
    - derived_field_reconciliation
  entity_topology: flat            # peer entities linked by FK fields in body; no nested URL ownership
  state_machine_shape: cyclic       # Claim reopen cycle + Payment approve/reject branching
  relationship_patterns:
    - one_to_many
    - cross_aggregate
  role_model: segregation_of_duties # adjuster requests, manager approves, finance issues
  consistency_model: immediate

# =============================================================================
# §1.0 Response Envelope (FIXED)
# =============================================================================
response_envelope:
  success: |
    { "meta": { "api_request_id": "req_xxx", "api_request_timestamp": "ISO8601" },
      "response_type": "object" | "array", "data": {} }
  error: |
    { "meta": { ... }, "response_type": "error",
      "data": { "error_id": "ERR_XXX", "message": "..." } }
  pagination_fields: ["limit", "offset", "total_count", "has_more"]
  pagination_defaults: { limit: 10, min: 1, max: 100, offset: 0 }

# =============================================================================
# §1.1 Entity-Relationship Table
# =============================================================================
entities:
  - name: ClientAccount
    parent: null
    common_fields: true
    fields:
      - { name: name, type: string, source: input, description: "Carrier/client legal name" }
      - { name: account_code, type: string, source: input, description: "Unique client code" }
      - { name: sla_ack_hours, type: integer, source: input, default: 24, description: "Hours from reported_date within which a claim must be acknowledged (first adjuster assignment)" }
      - { name: sla_contact_hours, type: integer, source: input, default: 72, description: "Hours within which claimant contact must occur (reporting only)" }
      - { name: reserve_authority_default_cents, type: integer, source: input, description: "Default single-payment auto-approval authority applied to adjusters lacking an explicit limit" }
      - { name: open_case_reserve_total_cents, type: integer, source: computed, description: "Sum of (indemnity_reserve_cents + expense_reserve_cents) over this account's claims whose status IN {INTAKE, ASSIGNED, INVESTIGATING, EVALUATED, REOPENED}" }
      - { name: gross_incurred_total_cents, type: integer, source: computed, description: "Sum of gross_incurred_cents over this account's claims whose status != CANCELLED" }
      - { name: recovered_total_cents, type: integer, source: computed, description: "Sum of recovered_cents over this account's claims whose status != CANCELLED" }

  - name: Policy
    parent: null
    common_fields: true
    fields:
      - { name: client_account_id, type: string, source: input, description: "FK -> ClientAccount.id" }
      - { name: policy_number, type: string, source: input, description: "Carrier policy number" }
      - { name: coverage_limit_cents, type: integer, source: input, description: "Per-claim indemnity coverage limit" }
      - { name: deductible_cents, type: integer, source: input, default: 0, description: "Per-claim deductible" }
      - { name: per_claim_expense_limit_cents, type: integer, source: input, description: "Per-claim expense (ALAE) cap used for vendor expense authority" }
      - { name: effective_date, type: datetime, source: input, description: "Policy inception (ISO8601 UTC)" }
      - { name: expiration_date, type: datetime, source: input, description: "Policy expiry (ISO8601 UTC)" }
      - { name: status, type: enum, source: computed, description: "Derived from the logical clock: ACTIVE while current_clock < expiration_date, else EXPIRED", constraints: "ACTIVE | EXPIRED" }

  - name: Adjuster
    parent: null
    common_fields: true
    fields:
      - { name: name, type: string, source: input, description: "Adjuster full name" }
      - { name: email, type: string, source: input, description: "Adjuster email" }
      - { name: authority_limit_cents, type: integer, source: input, description: "Max single indemnity payment this adjuster may auto-approve (inclusive)" }
      - { name: max_open_claims, type: integer, source: input, default: 50, description: "Max concurrently assigned open claims" }
      - { name: open_claim_count, type: integer, source: computed, description: "Count of claims whose assigned_adjuster_id == this.id and status IN {ASSIGNED, INVESTIGATING, EVALUATED, REOPENED}" }

  - name: Vendor
    parent: null
    common_fields: true
    fields:
      - { name: name, type: string, source: input, description: "Vendor legal name" }
      - { name: vendor_type, type: enum, source: input, description: "Service category", constraints: "INDEPENDENT_ADJUSTER | APPRAISER | CONTRACTOR | DEFENSE_ATTORNEY" }
      - { name: credentialed_coverages, type: array, source: input, description: "List of coverage_type values (PROPERTY|AUTO|LIABILITY|WORKERS_COMP) the vendor may service" }

  - name: Claim
    parent: null
    common_fields: true
    fields:
      - { name: policy_id, type: string, source: input, description: "FK -> Policy.id" }
      - { name: client_account_id, type: string, source: system, description: "FK -> ClientAccount.id; copied from the policy at intake" }
      - { name: coverage_type, type: enum, source: input, description: "Peril", constraints: "PROPERTY | AUTO | LIABILITY | WORKERS_COMP" }
      - { name: loss_date, type: datetime, source: input, description: "Date of loss (ISO8601 UTC)" }
      - { name: reported_date, type: datetime, source: input, description: "Date loss reported to TPA (ISO8601 UTC)" }
      - { name: claimant_name, type: string, source: input, description: "First-party claimant name" }
      - { name: description, type: string, source: input, description: "Loss description" }
      - { name: status, type: enum, source: system, default: INTAKE, description: "Lifecycle", constraints: "INTAKE | ASSIGNED | INVESTIGATING | EVALUATED | CLOSED | REOPENED | CANCELLED" }
      - { name: siu_status, type: enum, source: system, default: NONE, description: "Fraud posture", constraints: "NONE | HELD | CLEARED | CONFIRMED" }
      - { name: assigned_adjuster_id, type: string, source: system, description: "FK -> Adjuster.id; set from the first ADJUSTER assignment created, null until then" }
      - { name: indemnity_reserve_cents, type: integer, source: system, default: 0, description: "Outstanding indemnity (loss) case reserve" }
      - { name: expense_reserve_cents, type: integer, source: system, default: 0, description: "Outstanding expense (ALAE) case reserve" }
      - { name: paid_indemnity_cents, type: integer, source: system, default: 0, description: "Cumulative issued indemnity payments" }
      - { name: paid_expense_cents, type: integer, source: system, default: 0, description: "Cumulative paid vendor/expense invoices" }
      - { name: recovered_cents, type: integer, source: system, default: 0, description: "Cumulative subrogation/salvage recovery posted" }
      - { name: recovered_indemnity_cents, type: integer, source: system, default: 0, description: "Portion of recovered_cents allocated to indemnity" }
      - { name: recovered_expense_cents, type: integer, source: system, default: 0, description: "Portion of recovered_cents allocated to expense" }
      - { name: gross_incurred_cents, type: integer, source: computed, description: "paid_indemnity_cents + paid_expense_cents + indemnity_reserve_cents + expense_reserve_cents" }
      - { name: net_incurred_cents, type: integer, source: computed, description: "gross_incurred_cents - recovered_cents" }
      - { name: ack_at, type: datetime, source: system, description: "Timestamp the claim moved INTAKE->ASSIGNED (acknowledgement), null until assigned" }
      - { name: sla_ack_due, type: datetime, source: computed, description: "reported_date + client_account.sla_ack_hours" }
      - { name: sla_ack_met, type: boolean, source: computed, description: "true iff ack_at is set AND ack_at <= sla_ack_due; null while ack_at is null" }

  - name: Assignment
    parent: null
    common_fields: true
    fields:
      - { name: claim_id, type: string, source: input, description: "FK -> Claim.id" }
      - { name: assignee_type, type: enum, source: input, description: "Who is assigned", constraints: "ADJUSTER | VENDOR" }
      - { name: adjuster_id, type: string, source: input, description: "FK -> Adjuster.id; required when assignee_type=ADJUSTER, else null" }
      - { name: vendor_id, type: string, source: input, description: "FK -> Vendor.id; required when assignee_type=VENDOR, else null" }
      - { name: scope, type: string, source: input, description: "Work scope (e.g., FIELD_INSPECTION, DESK_REVIEW)" }
      - { name: inspection_start, type: datetime, source: input, description: "Scheduled on-site window start (ISO8601 UTC)" }
      - { name: inspection_end, type: datetime, source: input, description: "Scheduled on-site window end (ISO8601 UTC)" }
      - { name: status, type: enum, source: system, default: ACTIVE, description: "Lifecycle", constraints: "ACTIVE | COMPLETED | CANCELLED" }

  - name: ReserveChange
    parent: null
    common_fields: false      # append-only event: carries id + created_at only
    fields:
      - { name: claim_id, type: string, source: input, description: "FK -> Claim.id" }
      - { name: reserve_type, type: enum, source: input, description: "Which reserve bucket", constraints: "INDEMNITY | EXPENSE" }
      - { name: delta_cents, type: integer, source: input, description: "Signed change applied to the reserve bucket (may be negative)" }
      - { name: reason, type: string, source: input, description: "Adjuster rationale" }
      - { name: resulting_indemnity_reserve_cents, type: integer, source: system, description: "Claim.indemnity_reserve_cents after applying this change" }
      - { name: resulting_expense_reserve_cents, type: integer, source: system, description: "Claim.expense_reserve_cents after applying this change" }
      - { name: actor_role, type: string, source: system, description: "Role that posted the change" }

  - name: Payment
    parent: null
    common_fields: true
    fields:
      - { name: claim_id, type: string, source: input, description: "FK -> Claim.id" }
      - { name: payment_type, type: enum, source: input, description: "Loss bucket", constraints: "INDEMNITY" }
      - { name: payee_type, type: enum, source: input, description: "Recipient class", constraints: "CLAIMANT" }
      - { name: payee_name, type: string, source: input, description: "Payee display name" }
      - { name: amount_cents, type: integer, source: input, description: "Payment amount (> 0)" }
      - { name: status, type: enum, source: system, default: PENDING_APPROVAL, description: "Lifecycle", constraints: "PENDING_APPROVAL | APPROVED | REJECTED | ISSUED | VOID" }
      - { name: requires_manager_approval, type: boolean, source: computed, description: "true iff amount_cents > the acting adjuster's authority_limit_cents at creation" }
      - { name: approved_by_role, type: string, source: system, description: "Role that approved, null until APPROVED" }
      - { name: issued_at, type: datetime, source: system, description: "Timestamp of ISSUED, null until issued" }

  - name: VendorInvoice
    parent: null
    common_fields: true
    fields:
      - { name: claim_id, type: string, source: input, description: "FK -> Claim.id" }
      - { name: assignment_id, type: string, source: input, description: "FK -> Assignment.id" }
      - { name: vendor_id, type: string, source: system, description: "FK -> Vendor.id; copied from the assignment" }
      - { name: hours, type: number, source: input, description: "Billable hours" }
      - { name: miles, type: number, source: input, default: 0, description: "Reimbursable mileage" }
      - { name: materials_cents, type: integer, source: input, default: 0, description: "Pass-through materials cost" }
      - { name: amount_cents, type: integer, source: computed, description: "Computed expense amount (see calculations.vendor_invoice_amount)" }
      - { name: status, type: enum, source: system, default: SUBMITTED, description: "Lifecycle", constraints: "SUBMITTED | APPROVED | REJECTED | PAID | VOID" }
      - { name: approved_by_role, type: string, source: system, description: "Role that approved, null until APPROVED" }

  - name: LitigationCase
    parent: null
    common_fields: true
    fields:
      - { name: claim_id, type: string, source: input, description: "FK -> Claim.id" }
      - { name: defense_vendor_id, type: string, source: input, description: "FK -> Vendor.id; assigned defense counsel, null if none" }
      - { name: venue, type: string, source: input, description: "Court/venue" }
      - { name: status, type: enum, source: system, default: OPEN, description: "Lifecycle", constraints: "OPEN | IN_SUIT | SETTLED | DISMISSED | JUDGMENT" }

  - name: SubrogationCase
    parent: null
    common_fields: true
    fields:
      - { name: claim_id, type: string, source: input, description: "FK -> Claim.id" }
      - { name: at_fault_party, type: string, source: input, description: "Adverse/at-fault party name" }
      - { name: demand_cents, type: integer, source: input, description: "Subrogation demand amount" }
      - { name: recovered_cents, type: integer, source: system, default: 0, description: "Gross amount recovered (set on RECOVERED)" }
      - { name: allocation_method, type: enum, source: system, description: "How recovery was split across buckets; null until RECOVERED", constraints: "PRO_RATA | INDEMNITY_FIRST" }
      - { name: status, type: enum, source: system, default: OPEN, description: "Lifecycle", constraints: "OPEN | DEMAND_SENT | NEGOTIATING | RECOVERED | CLOSED_NO_RECOVERY" }

  - name: SiuReferral
    parent: null
    common_fields: true
    fields:
      - { name: claim_id, type: string, source: input, description: "FK -> Claim.id" }
      - { name: reason, type: string, source: input, description: "Fraud indicator narrative" }
      - { name: place_hold, type: boolean, source: input, default: true, description: "If true, referral acceptance sets Claim.siu_status=HELD" }
      - { name: status, type: enum, source: system, default: OPEN, description: "Lifecycle", constraints: "OPEN | CLEARED | CONFIRMED" }

  - name: BordereauReport
    parent: null
    common_fields: true
    fields:
      - { name: client_account_id, type: string, source: input, description: "FK -> ClientAccount.id" }
      - { name: period_start, type: datetime, source: input, description: "Inclusive lower bound on Claim.reported_date (ISO8601 UTC)" }
      - { name: period_end, type: datetime, source: input, description: "Exclusive upper bound on Claim.reported_date (ISO8601 UTC)" }
      - { name: basis, type: enum, source: input, description: "Incurred basis for the run", constraints: "PROVISIONAL | DEVELOPED" }
      - { name: total_claim_count, type: integer, source: computed, description: "Number of in-scope claims (status != CANCELLED, reported_date in [period_start, period_end))" }
      - { name: total_incurred_dollars, type: integer, source: computed, description: "Sum over in-scope claims of round_half_up(incurred_cents/100), incurred per basis (see calculations.bordereau_totals)" }
      - { name: total_paid_dollars, type: integer, source: computed, description: "Sum over in-scope claims of round_half_up((paid_indemnity_cents+paid_expense_cents)/100)" }
      - { name: total_recovered_dollars, type: integer, source: computed, description: "Sum over in-scope claims of round_half_up(recovered_cents/100)" }

# =============================================================================
# §1.2 State Machine Table
# =============================================================================
state_machines:
  - entity: Claim
    initial_state: INTAKE
    terminal_states: [CANCELLED]     # CLOSED is reopenable, not terminal
    transitions:
      - from: INTAKE
        to: ASSIGNED
        trigger: "system: first ACTIVE ADJUSTER Assignment created via POST /assignments"
        actor: system
        preconditions:
          - "Policy.status == ACTIVE (ERR_POLICY_INACTIVE)"
        side_effects:
          - "Set Claim.assigned_adjuster_id = the new Assignment.adjuster_id"
          - "Set Claim.ack_at = current clock time"
          - "Recompute Claim.sla_ack_due and Claim.sla_ack_met (calculations.sla_ack_compliance)"
          - "Increment Adjuster.open_claim_count for the assigned adjuster"
      - from: INTAKE
        to: CANCELLED
        trigger: "POST /claims/{id}/transition {to_status: CANCELLED}"
        actor: ClaimsManager
        preconditions:
          - "No Assignment exists for this claim (ERR_INVALID_STATE)"
          - "No Payment exists for this claim (ERR_INVALID_STATE)"
        side_effects:
          - "Recompute ClientAccount rollup (calculations.account_financial_rollup)"
      - from: ASSIGNED
        to: INVESTIGATING
        trigger: "POST /claims/{id}/transition {to_status: INVESTIGATING}"
        actor: Adjuster
        preconditions: []
        side_effects: []
      - from: INVESTIGATING
        to: EVALUATED
        trigger: "POST /claims/{id}/transition {to_status: EVALUATED}"
        actor: Adjuster
        preconditions: []
        side_effects: []
      - from: EVALUATED
        to: CLOSED
        trigger: "POST /claims/{id}/transition {to_status: CLOSED}"
        actor: Adjuster
        preconditions:
          - "Every LitigationCase for this claim has status IN {SETTLED, DISMISSED, JUDGMENT} (ERR_LITIGATION_OPEN)"
          - "No SubrogationCase for this claim has status IN {OPEN, DEMAND_SENT, NEGOTIATING} (ERR_SUBROGATION_OPEN)"
          - "No Payment for this claim has status IN {PENDING_APPROVAL, APPROVED} (ERR_PAYMENT_PENDING)"
          - "Claim.siu_status != HELD (ERR_SIU_HOLD_ACTIVE)"
        side_effects:
          - "CASCADE link1: every ACTIVE Assignment on this claim -> CANCELLED (each of which fires the Assignment CANCELLED cascade)"
          - "Release reserves: set Claim.indemnity_reserve_cents = 0 and Claim.expense_reserve_cents = 0"
          - "Recompute Claim.gross_incurred_cents and Claim.net_incurred_cents (calculations.claim_incurred)"
          - "Decrement Adjuster.open_claim_count for assigned_adjuster_id"
          - "Recompute ClientAccount rollup (calculations.account_financial_rollup)"
      - from: CLOSED
        to: REOPENED
        trigger: "POST /claims/{id}/transition {to_status: REOPENED}"
        actor: ClaimsManager
        preconditions: []
        side_effects:
          - "Increment Adjuster.open_claim_count for assigned_adjuster_id (claim re-enters the open population)"
          - "Recompute ClientAccount rollup (calculations.account_financial_rollup)"
      - from: REOPENED
        to: EVALUATED
        trigger: "POST /claims/{id}/transition {to_status: EVALUATED}"
        actor: Adjuster
        preconditions: []
        side_effects: []
      - from: REOPENED
        to: CLOSED
        trigger: "POST /claims/{id}/transition {to_status: CLOSED}"
        actor: Adjuster
        preconditions:
          - "Every LitigationCase for this claim has status IN {SETTLED, DISMISSED, JUDGMENT} (ERR_LITIGATION_OPEN)"
          - "No SubrogationCase for this claim has status IN {OPEN, DEMAND_SENT, NEGOTIATING} (ERR_SUBROGATION_OPEN)"
          - "No Payment for this claim has status IN {PENDING_APPROVAL, APPROVED} (ERR_PAYMENT_PENDING)"
          - "Claim.siu_status != HELD (ERR_SIU_HOLD_ACTIVE)"
        side_effects:
          - "Same cascade + reserve release + rollup as EVALUATED -> CLOSED"

  - entity: Payment
    initial_state: PENDING_APPROVAL
    terminal_states: [REJECTED, VOID]
    transitions:
      - from: PENDING_APPROVAL
        to: APPROVED
        trigger: "POST /payments/{id}/transition {to_status: APPROVED}"
        actor: ClaimsManager
        note: "If Payment.requires_manager_approval == false, an Adjuster may also approve; if true, only ClaimsManager may (ERR_APPROVAL_AUTHORITY_REQUIRED)."
        preconditions:
          - "Claim.status IN {ASSIGNED, INVESTIGATING, EVALUATED, REOPENED} (ERR_CLAIM_NOT_OPEN)"
        side_effects:
          - "Set Payment.approved_by_role = acting role"
      - from: PENDING_APPROVAL
        to: REJECTED
        trigger: "POST /payments/{id}/transition {to_status: REJECTED}"
        actor: ClaimsManager
        preconditions: []
        side_effects: []
      - from: APPROVED
        to: ISSUED
        trigger: "POST /payments/{id}/transition {to_status: ISSUED}"
        actor: FinanceOfficer
        preconditions:
          - "Claim.status IN {ASSIGNED, INVESTIGATING, EVALUATED, REOPENED} (ERR_CLAIM_NOT_OPEN) [cross-entity: Payment depends on Claim.status]"
          - "Claim.siu_status != HELD (ERR_SIU_HOLD_ACTIVE)"
          - "Payment.amount_cents + Claim.paid_indemnity_cents - Policy.deductible_cents <= Policy.coverage_limit_cents (ERR_COVERAGE_LIMIT_EXCEEDED)"
        side_effects:
          - "Claim.paid_indemnity_cents += amount_cents"
          - "Claim.indemnity_reserve_cents = max(0, Claim.indemnity_reserve_cents - amount_cents)"
          - "Set Payment.issued_at = current clock time"
          - "Recompute Claim.gross_incurred_cents and Claim.net_incurred_cents (calculations.claim_incurred)"
          - "Recompute ClientAccount rollup (calculations.account_financial_rollup)"
      - from: APPROVED
        to: VOID
        trigger: "POST /payments/{id}/transition {to_status: VOID}"
        actor: FinanceOfficer
        preconditions: []
        side_effects: []
      - from: ISSUED
        to: VOID
        trigger: "POST /payments/{id}/transition {to_status: VOID}"
        actor: FinanceOfficer
        preconditions: []
        side_effects:
          - "COMPENSATION: Claim.paid_indemnity_cents -= amount_cents"
          - "Claim.indemnity_reserve_cents += amount_cents (restore the reserve released at ISSUED)"
          - "Recompute Claim.gross_incurred_cents and Claim.net_incurred_cents (calculations.claim_incurred)"
          - "Recompute ClientAccount rollup (calculations.account_financial_rollup)"

  - entity: Assignment
    initial_state: ACTIVE
    terminal_states: [COMPLETED, CANCELLED]
    transitions:
      - from: ACTIVE
        to: COMPLETED
        trigger: "POST /assignments/{id}/transition {to_status: COMPLETED}"
        actor: Adjuster
        preconditions: []
        side_effects: []
      - from: ACTIVE
        to: CANCELLED
        trigger: "POST /assignments/{id}/transition {to_status: CANCELLED} OR system (Claim close cascade link1)"
        actor: Adjuster
        preconditions: []
        side_effects:
          - "CASCADE link2: every VendorInvoice for this assignment with status IN {SUBMITTED, APPROVED} -> VOID (each firing the VendorInvoice VOID cascade)"
          - "If this was the assigned adjuster's assignment and claim still open, Adjuster.open_claim_count unaffected (claim stays assigned)"

  - entity: VendorInvoice
    initial_state: SUBMITTED
    terminal_states: [REJECTED, PAID, VOID]
    transitions:
      - from: SUBMITTED
        to: APPROVED
        trigger: "POST /vendor-invoices/{id}/transition {to_status: APPROVED}"
        actor: ClaimsManager
        preconditions:
          - "amount_cents + Claim.paid_expense_cents + Claim.expense_reserve_cents <= Policy.per_claim_expense_limit_cents (ERR_EXPENSE_LIMIT_EXCEEDED)"
        side_effects:
          - "Claim.expense_reserve_cents += amount_cents (earmark)"
          - "Set VendorInvoice.approved_by_role = acting role"
          - "Recompute ClientAccount rollup (calculations.account_financial_rollup)"
      - from: SUBMITTED
        to: REJECTED
        trigger: "POST /vendor-invoices/{id}/transition {to_status: REJECTED}"
        actor: ClaimsManager
        preconditions: []
        side_effects: []
      - from: SUBMITTED
        to: VOID
        trigger: "system (Assignment CANCELLED cascade link2)"
        actor: system
        preconditions: []
        side_effects: []
      - from: APPROVED
        to: PAID
        trigger: "POST /vendor-invoices/{id}/transition {to_status: PAID}"
        actor: FinanceOfficer
        preconditions:
          - "Claim.status IN {ASSIGNED, INVESTIGATING, EVALUATED, REOPENED} (ERR_CLAIM_NOT_OPEN)"
        side_effects:
          - "Claim.paid_expense_cents += amount_cents"
          - "Claim.expense_reserve_cents = max(0, Claim.expense_reserve_cents - amount_cents)"
          - "Recompute Claim.gross_incurred_cents and Claim.net_incurred_cents (calculations.claim_incurred)"
          - "Recompute ClientAccount rollup (calculations.account_financial_rollup)"
      - from: APPROVED
        to: VOID
        trigger: "POST /vendor-invoices/{id}/transition {to_status: VOID} OR system (Assignment CANCELLED cascade link2)"
        actor: FinanceOfficer
        preconditions: []
        side_effects:
          - "CASCADE link3: Claim.expense_reserve_cents -= amount_cents (release the earmark)"
          - "Recompute Claim.gross_incurred_cents (calculations.claim_incurred)"
          - "Recompute ClientAccount rollup (calculations.account_financial_rollup)"

  - entity: LitigationCase
    initial_state: OPEN
    terminal_states: [SETTLED, DISMISSED, JUDGMENT]
    transitions:
      - from: OPEN
        to: IN_SUIT
        trigger: "POST /litigation-cases/{id}/transition {to_status: IN_SUIT}"
        actor: ClaimsManager
        preconditions: []
        side_effects: []
      - from: OPEN
        to: DISMISSED
        trigger: "POST /litigation-cases/{id}/transition {to_status: DISMISSED}"
        actor: ClaimsManager
        preconditions: []
        side_effects: []
      - from: IN_SUIT
        to: SETTLED
        trigger: "POST /litigation-cases/{id}/transition {to_status: SETTLED}"
        actor: ClaimsManager
        preconditions: []
        side_effects: []
      - from: IN_SUIT
        to: DISMISSED
        trigger: "POST /litigation-cases/{id}/transition {to_status: DISMISSED}"
        actor: ClaimsManager
        preconditions: []
        side_effects: []
      - from: IN_SUIT
        to: JUDGMENT
        trigger: "POST /litigation-cases/{id}/transition {to_status: JUDGMENT}"
        actor: ClaimsManager
        preconditions: []
        side_effects: []

  - entity: SubrogationCase
    initial_state: OPEN
    terminal_states: [RECOVERED, CLOSED_NO_RECOVERY]
    transitions:
      - from: OPEN
        to: DEMAND_SENT
        trigger: "POST /subrogation-cases/{id}/transition {to_status: DEMAND_SENT}"
        actor: Adjuster
        preconditions: []
        side_effects: []
      - from: DEMAND_SENT
        to: NEGOTIATING
        trigger: "POST /subrogation-cases/{id}/transition {to_status: NEGOTIATING}"
        actor: Adjuster
        preconditions: []
        side_effects: []
      - from: NEGOTIATING
        to: RECOVERED
        trigger: "POST /subrogation-cases/{id}/transition {to_status: RECOVERED, recovered_cents, allocation_method, expected_claim_version}"
        actor: FinanceOfficer
        preconditions:
          - "recovered_cents > 0 (ERR_INVALID_REQUEST)"
          - "allocation_method IN {PRO_RATA, INDEMNITY_FIRST} (ERR_INVALID_REQUEST)"
        side_effects:
          - "Set SubrogationCase.recovered_cents and allocation_method"
          - "CASCADE link1: Claim.recovered_cents += recovered_cents; allocate to Claim.recovered_indemnity_cents / recovered_expense_cents per calculations.subrogation_recovery_allocation"
          - "Recompute Claim.net_incurred_cents (calculations.claim_incurred)"
          - "CASCADE link2: Recompute ClientAccount rollup (calculations.account_financial_rollup)"
      - from: OPEN
        to: CLOSED_NO_RECOVERY
        trigger: "POST /subrogation-cases/{id}/transition {to_status: CLOSED_NO_RECOVERY}"
        actor: Adjuster
        preconditions: []
        side_effects: []
      - from: DEMAND_SENT
        to: CLOSED_NO_RECOVERY
        trigger: "POST /subrogation-cases/{id}/transition {to_status: CLOSED_NO_RECOVERY}"
        actor: Adjuster
        preconditions: []
        side_effects: []
      - from: NEGOTIATING
        to: CLOSED_NO_RECOVERY
        trigger: "POST /subrogation-cases/{id}/transition {to_status: CLOSED_NO_RECOVERY}"
        actor: Adjuster
        preconditions: []
        side_effects: []

  - entity: SiuReferral
    initial_state: OPEN
    terminal_states: [CLEARED, CONFIRMED]
    transitions:
      - from: OPEN
        to: CLEARED
        trigger: "POST /siu-referrals/{id}/transition {to_status: CLEARED}"
        actor: SiuInvestigator
        preconditions: []
        side_effects:
          - "If Claim.siu_status == HELD, set Claim.siu_status = CLEARED (removes payment hold)"
      - from: OPEN
        to: CONFIRMED
        trigger: "POST /siu-referrals/{id}/transition {to_status: CONFIRMED}"
        actor: SiuInvestigator
        preconditions: []
        side_effects:
          - "Set Claim.siu_status = CONFIRMED (hold remains in force)"

# =============================================================================
# §1.2.1 Concurrency Rules (OCC on Claim.version)
# =============================================================================
concurrency_rules:
  - rule_id: payment-create-stale-claim
    parent_entity: Claim
    write_endpoint: "POST /payments"
    occ_field: "expected_claim_version"
    description: |
      Creating a Payment against a Claim whose version has advanced since the
      client last observed it is rejected. A new indemnity payment legitimately
      succeeds against a Claim in an open state, so a second creation carrying a
      stale expected_claim_version (because a reserve change or another payment
      creation has since bumped the claim) is a stale-version conflict, not a
      state precondition.
    error_id: ERR_STALE_VERSION
    http_status: 412
  - rule_id: reserve-change-stale-claim
    parent_entity: Claim
    write_endpoint: "POST /reserve-changes"
    occ_field: "expected_claim_version"
    description: |
      Posting a ReserveChange against a Claim whose version has advanced since
      the client last observed it is rejected. Reserve changes legitimately
      succeed from any open state, so a stale expected_claim_version (another
      reserve change or payment creation has since bumped the claim) is a
      stale-version conflict.
    error_id: ERR_STALE_VERSION
    http_status: 412

# =============================================================================
# §1.3 Calculation Rules Table
# =============================================================================
calculations:
  - name: claim_incurred
    trigger: "any ReserveChange applied, Payment ISSUED/VOID, VendorInvoice PAID/VOID, SubrogationCase RECOVERED, or Claim CLOSED"
    algorithm: aggregation
    formula: |
      paid_total       = paid_indemnity_cents + paid_expense_cents
      outstanding_prov = indemnity_reserve_cents + expense_reserve_cents
      gross_incurred_cents = paid_total + outstanding_prov          # provisional basis (stored on Claim)
      net_incurred_cents   = gross_incurred_cents - recovered_cents
      # developed basis (surfaced only in GET /claims/{id}/financials and DEVELOPED bordereaux):
      developed_outstanding    = max(outstanding_prov, round_half_up(paid_total * IBNR_TAIL_PCT))
      gross_incurred_developed = paid_total + developed_outstanding
    input_set: "single Claim's own reserve/paid/recovered fields"
    constants:
      IBNR_TAIL_PCT: 0.15
    precision: "integer cents; round_half_up on the IBNR product"
    variants:
      - name: provisional
        when: "Claim.gross_incurred_cents field and PROVISIONAL bordereaux"
        difference: "outstanding taken as the case reserves exactly as set"
      - name: developed
        when: "GET /claims/{id}/financials and DEVELOPED bordereaux"
        difference: "outstanding floored at round_half_up(paid_total * IBNR_TAIL_PCT); diverges from provisional whenever that floor exceeds the set case reserves"

  - name: subrogation_recovery_allocation
    trigger: "SubrogationCase NEGOTIATING -> RECOVERED"
    algorithm: waterfall_allocation
    formula: |
      R = recovered_cents (from the transition request)
      paid_i = Claim.paid_indemnity_cents ; paid_e = Claim.paid_expense_cents ; base = paid_i + paid_e
      if allocation_method == PRO_RATA:
        if base == 0: recovered_indemnity = R ; recovered_expense = 0
        else:
          recovered_indemnity = round_half_up(R * paid_i / base)
          recovered_expense   = R - recovered_indemnity
      elif allocation_method == INDEMNITY_FIRST:
        recovered_indemnity = min(R, paid_i)
        recovered_expense   = R - recovered_indemnity
      # then: Claim.recovered_indemnity_cents += recovered_indemnity
      #       Claim.recovered_expense_cents   += recovered_expense
      #       Claim.recovered_cents           += R
    input_set: "single Claim's paid buckets + the transition's R and allocation_method"
    constants: {}
    precision: "integer cents; round_half_up on the pro-rata indemnity share, expense share is the remainder"
    variants:
      - name: pro_rata
        when: "allocation_method == PRO_RATA"
        difference: "recovery split proportional to paid_indemnity : paid_expense"
      - name: indemnity_first
        when: "allocation_method == INDEMNITY_FIRST"
        difference: "recovery applied to indemnity paid first, remainder to expense; diverges from pro_rata whenever both paid buckets are non-zero"

  - name: vendor_invoice_amount
    trigger: "POST /vendor-invoices (on submission)"
    algorithm: tiered_pricing
    formula: |
      rate = { INDEPENDENT_ADJUSTER: 12000, APPRAISER: 15000, CONTRACTOR: 0, DEFENSE_ATTORNEY: 35000 }[Vendor.vendor_type]  # cents/hour
      base     = round_half_up(hours * rate)
      mileage  = round_half_up(miles * MILEAGE_RATE_CENTS)
      subtotal = base + mileage + materials_cents
      amount_cents = max(MIN_INVOICE_CENTS, min(subtotal, VENDOR_INVOICE_CAP_CENTS))
    input_set: "one VendorInvoice's hours/miles/materials + the assignment's Vendor.vendor_type"
    constants:
      MILEAGE_RATE_CENTS: 55
      MIN_INVOICE_CENTS: 5000
      VENDOR_INVOICE_CAP_CENTS: 2000000
    precision: "integer cents; round_half_up on hours*rate and miles*rate independently, then sum (round-then-sum order pinned)"

  - name: bordereau_totals
    trigger: "POST /bordereau-reports"
    algorithm: aggregation
    formula: |
      in_scope = claims where client_account_id == report.client_account_id
                 AND status != CANCELLED
                 AND period_start <= reported_date < period_end
      for each claim in in_scope:
        incurred_cents = (basis == DEVELOPED) ? gross_incurred_developed : gross_incurred_cents
        claim_incurred_dollars = round_half_up(incurred_cents / 100)     # ROUND PER CLAIM FIRST
        claim_paid_dollars      = round_half_up((paid_indemnity_cents + paid_expense_cents) / 100)
        claim_recovered_dollars = round_half_up(recovered_cents / 100)
      total_claim_count      = count(in_scope)
      total_incurred_dollars  = sum(claim_incurred_dollars)              # ...THEN SUM (never round(sum(cents)/100))
      total_paid_dollars      = sum(claim_paid_dollars)
      total_recovered_dollars = sum(claim_recovered_dollars)
    input_set: "all non-cancelled claims of the account whose reported_date is in [period_start, period_end)"
    constants: {}
    precision: "whole dollars; round_half_up applied per claim BEFORE summation — the pinned order"

  - name: sla_ack_compliance
    trigger: "Claim INTAKE -> ASSIGNED (ack_at set)"
    algorithm: threshold
    formula: |
      sla_ack_due = reported_date + (ClientAccount.sla_ack_hours hours)
      sla_ack_met = (ack_at != null) AND (ack_at <= sla_ack_due)   # inclusive: ack exactly at the deadline is MET
    input_set: "one Claim + its account's sla_ack_hours"
    constants: {}
    precision: "datetime comparison, inclusive upper bound"

  - name: account_financial_rollup
    trigger: "any Claim reserve/paid/recovered mutation, Claim status change, or claim cancellation"
    algorithm: aggregation
    formula: |
      open_case_reserve_total_cents = sum(indemnity_reserve_cents + expense_reserve_cents
          for claims of this account with status IN {INTAKE, ASSIGNED, INVESTIGATING, EVALUATED, REOPENED})
      gross_incurred_total_cents = sum(gross_incurred_cents for claims of this account with status != CANCELLED)
      recovered_total_cents      = sum(recovered_cents      for claims of this account with status != CANCELLED)
    input_set: "all non-cancelled claims of one ClientAccount, with the open-status filter for the reserve pool"
    constants: {}
    precision: "integer cents"

  - name: payment_authority_routing
    trigger: "POST /payments (on creation)"
    algorithm: threshold
    formula: |
      requires_manager_approval = (amount_cents > acting_adjuster.authority_limit_cents)   # strict >; equal is within authority
    input_set: "one Payment amount vs the creating adjuster's authority_limit_cents"
    constants: {}
    precision: "integer cents; boundary is strict greater-than"

# =============================================================================
# §1.4 Validation Rules Table (ordered by priority; lower number = checked first)
# =============================================================================
validations:
  - priority: 1
    category: auth
    check: "X-User-Role and X-User-ID headers present and the role is one of the declared roles"
    error_id: ERR_UNAUTHENTICATED
    http_status: 401
    applies_to: "all"
  - priority: 2
    category: auth
    check: "Acting role is permitted for the operation per §1.7; for Vendor invoice submission the X-User-ID must equal the assignment's vendor_id; SIU transitions require SiuInvestigator"
    error_id: ERR_UNAUTHORIZED
    http_status: 403
    applies_to: "all"
  - priority: 3
    category: existence
    check: "Every id in the path and every FK in the body resolves to an existing resource (validated left-to-right)"
    error_id: ERR_NOT_FOUND
    http_status: 404
    applies_to: "all endpoints that reference a resource"
  - priority: 4
    category: business_constraint
    check: "Required fields present; enum values legal; amount_cents > 0; demand_cents > 0; delta_cents non-zero; inspection_end > inspection_start; period_end > period_start (assignee_type/id shape is validated separately at priority 7 as ERR_ASSIGNEE_MISMATCH)"
    error_id: ERR_INVALID_REQUEST
    http_status: 422
    applies_to: "all mutating endpoints"
  - priority: 5
    category: state
    check: "Target resource is in a legal from-state for the requested transition; claim must be open (status IN {ASSIGNED, INVESTIGATING, EVALUATED, REOPENED}) for reserve-change/payment-create/payment-issue/invoice-pay; claim close blocked by pending payments (ERR_PAYMENT_PENDING), open litigation (ERR_LITIGATION_OPEN), or open subrogation (ERR_SUBROGATION_OPEN)"
    error_id: "ERR_INVALID_STATE | ERR_CLAIM_NOT_OPEN | ERR_PAYMENT_PENDING | ERR_LITIGATION_OPEN | ERR_SUBROGATION_OPEN"
    http_status: 409
    applies_to: "all state-transition endpoints, POST /reserve-changes, POST /payments"
  - priority: 6
    category: state
    check: "expected_claim_version equals the Claim's current version (OCC)"
    error_id: ERR_STALE_VERSION
    http_status: 412
    applies_to: "POST /payments, POST /reserve-changes, POST /subrogation-cases/{id}/transition (RECOVERED)"
  - priority: 7
    category: business_referential
    check: "Policy.status == ACTIVE for claim creation and payment issue (ERR_POLICY_INACTIVE); assigned Vendor is credentialed for Claim.coverage_type (ERR_VENDOR_NOT_CREDENTIALED); assignee id type matches assignee_type (ERR_ASSIGNEE_MISMATCH)"
    error_id: "ERR_POLICY_INACTIVE | ERR_VENDOR_NOT_CREDENTIALED | ERR_ASSIGNEE_MISMATCH"
    http_status: 409
    applies_to: "POST /claims, POST /assignments, POST /payments/{id}/transition (ISSUED)"
  - priority: 8
    category: business_safety
    check: "Claim.siu_status != HELD when issuing a payment or paying a vendor invoice"
    error_id: ERR_SIU_HOLD_ACTIVE
    http_status: 403
    applies_to: "POST /payments/{id}/transition (ISSUED), POST /vendor-invoices/{id}/transition (PAID)"
  - priority: 9
    category: business_temporal
    check: "New Assignment inspection window must not conflict with another ACTIVE assignment on the same resource: ADJUSTER windows conflict when they are within ADJUSTER_TRAVEL_BUFFER_MINUTES of each other; VENDOR windows conflict only on strict half-open [start,end) overlap (touching endpoints allowed, no buffer)"
    error_id: ERR_ASSIGNMENT_WINDOW_CONFLICT
    http_status: 409
    applies_to: "POST /assignments"
  - priority: 10
    category: business_constraint
    check: "Assigned adjuster is under max_open_claims (ERR_ADJUSTER_CAPACITY); approving a payment with requires_manager_approval=true requires ClaimsManager (ERR_APPROVAL_AUTHORITY_REQUIRED)"
    error_id: "ERR_ADJUSTER_CAPACITY | ERR_APPROVAL_AUTHORITY_REQUIRED"
    http_status: 409
    applies_to: "POST /assignments, POST /payments/{id}/transition (APPROVED)"
  - priority: 11
    category: business_fiscal
    check: "Payment issue: amount_cents + Claim.paid_indemnity_cents - Policy.deductible_cents <= Policy.coverage_limit_cents (ERR_COVERAGE_LIMIT_EXCEEDED); vendor invoice approve: amount_cents + paid_expense + expense_reserve <= per_claim_expense_limit_cents (ERR_EXPENSE_LIMIT_EXCEEDED); reserve change by an Adjuster: resulting (indemnity_reserve + expense_reserve) <= acting adjuster authority_limit_cents (ERR_RESERVE_AUTHORITY_EXCEEDED); ClaimsManager reserve changes are unlimited"
    error_id: "ERR_COVERAGE_LIMIT_EXCEEDED | ERR_EXPENSE_LIMIT_EXCEEDED | ERR_RESERVE_AUTHORITY_EXCEEDED"
    http_status: 422
    applies_to: "POST /payments/{id}/transition (ISSUED), POST /vendor-invoices/{id}/transition (APPROVED), POST /reserve-changes"

constants_global:
  ADJUSTER_TRAVEL_BUFFER_MINUTES: 60   # buffer (adjacency) applied to ADJUSTER inspection windows in the overlap rule

# =============================================================================
# §1.5 API Endpoint Table
# =============================================================================
endpoints:
  # ---- logical clock (test-driving) ----
  - method: POST
    path: "/_clock/set_current_utc"
    description: "Set the server logical clock (used for ack_at stamping and SLA compliance). Before any call the clock defaults to 2026-07-01T00:00:00Z; it never falls back to wall-clock time."
    roles: [Adjuster, ClaimsManager, FinanceOfficer, SiuInvestigator, Vendor]
    code: 200
    input: [to_iso8601]
    output: null
    side_effects: ["Sets the logical clock to to_iso8601"]

  # ---- ClientAccount ----
  - method: POST
    path: "/client-accounts"
    description: "Create a client (carrier) account"
    roles: [ClaimsManager]
    code: 201
    input: [name, account_code, "sla_ack_hours?", "sla_contact_hours?", reserve_authority_default_cents]
    output: ClientAccount
    side_effects: ["status=ACTIVE", "rollup totals initialized to 0"]
  - method: GET
    path: "/client-accounts/{id}"
    description: "Fetch a client account"
    roles: [Adjuster, ClaimsManager, FinanceOfficer, SiuInvestigator, Vendor]
    code: 200
    input: []
    output: ClientAccount
    side_effects: []
  - method: GET
    path: "/client-accounts"
    description: "List client accounts"
    roles: [Adjuster, ClaimsManager, FinanceOfficer, SiuInvestigator, Vendor]
    code: 200
    input: ["limit?", "offset?"]
    output: ClientAccount[]
    side_effects: []

  # ---- Policy ----
  - method: POST
    path: "/policies"
    description: "Create a policy under an account"
    roles: [ClaimsManager]
    code: 201
    input: [client_account_id, policy_number, coverage_limit_cents, "deductible_cents?", per_claim_expense_limit_cents, effective_date, expiration_date]
    output: Policy
    side_effects: ["status=ACTIVE"]
  - method: GET
    path: "/policies/{id}"
    description: "Fetch a policy"
    roles: [Adjuster, ClaimsManager, FinanceOfficer, SiuInvestigator, Vendor]
    code: 200
    input: []
    output: Policy
    side_effects: []
  - method: GET
    path: "/policies"
    description: "List policies (reverse lookup by account)"
    roles: [Adjuster, ClaimsManager, FinanceOfficer, SiuInvestigator, Vendor]
    code: 200
    input: ["client_account_id?", "status?", "limit?", "offset?"]
    output: Policy[]
    side_effects: []

  # ---- Adjuster ----
  - method: POST
    path: "/adjusters"
    description: "Create an adjuster"
    roles: [ClaimsManager]
    code: 201
    input: [name, email, authority_limit_cents, "max_open_claims?"]
    output: Adjuster
    side_effects: ["status=ACTIVE", "open_claim_count=0"]
  - method: GET
    path: "/adjusters/{id}"
    description: "Fetch an adjuster"
    roles: [Adjuster, ClaimsManager, FinanceOfficer, SiuInvestigator, Vendor]
    code: 200
    input: []
    output: Adjuster
    side_effects: []
  - method: GET
    path: "/adjusters"
    description: "List adjusters"
    roles: [Adjuster, ClaimsManager, FinanceOfficer, SiuInvestigator, Vendor]
    code: 200
    input: ["limit?", "offset?"]
    output: Adjuster[]
    side_effects: []

  # ---- Vendor ----
  - method: POST
    path: "/vendors"
    description: "Create a vendor"
    roles: [ClaimsManager]
    code: 201
    input: [name, vendor_type, credentialed_coverages]
    output: Vendor
    side_effects: ["status=ACTIVE"]
  - method: GET
    path: "/vendors/{id}"
    description: "Fetch a vendor"
    roles: [Adjuster, ClaimsManager, FinanceOfficer, SiuInvestigator, Vendor]
    code: 200
    input: []
    output: Vendor
    side_effects: []
  - method: GET
    path: "/vendors"
    description: "List vendors"
    roles: [Adjuster, ClaimsManager, FinanceOfficer, SiuInvestigator, Vendor]
    code: 200
    input: ["vendor_type?", "limit?", "offset?"]
    output: Vendor[]
    side_effects: []

  # ---- Claim ----
  - method: POST
    path: "/claims"
    description: "Open a claim (intake)"
    roles: [Adjuster, ClaimsManager]
    code: 201
    input: [policy_id, coverage_type, loss_date, reported_date, claimant_name, description]
    output: Claim
    side_effects: ["status=INTAKE", "client_account_id copied from policy", "compute sla_ack_due", "reserves/paid/recovered = 0"]
  - method: GET
    path: "/claims/{id}"
    description: "Fetch a claim"
    roles: [Adjuster, ClaimsManager, FinanceOfficer, SiuInvestigator, Vendor]
    code: 200
    input: []
    output: Claim
    side_effects: []
  - method: GET
    path: "/claims"
    description: "List/filter claims (reverse lookup by policy, account, adjuster)"
    roles: [Adjuster, ClaimsManager, FinanceOfficer, SiuInvestigator, Vendor]
    code: 200
    input: ["policy_id?", "client_account_id?", "assigned_adjuster_id?", "status?", "coverage_type?", "limit?", "offset?"]
    output: Claim[]
    side_effects: []
  - method: POST
    path: "/claims/{id}/transition"
    description: "Advance claim lifecycle (INVESTIGATING/EVALUATED/CLOSED/REOPENED/CANCELLED)"
    roles: [Adjuster, ClaimsManager]
    code: 200
    input: [to_status]
    output: Claim
    side_effects: ["Claim state machine per §1.2, including close cascades and reserve release"]
  - method: GET
    path: "/claims/{id}/financials"
    description: "Computed financial snapshot (provisional and developed incurred)"
    roles: [Adjuster, ClaimsManager, FinanceOfficer, SiuInvestigator, Vendor]
    code: 200
    input: []
    output: "{ paid_total_cents: integer, outstanding_reserve_cents: integer, gross_incurred_provisional_cents: integer, gross_incurred_developed_cents: integer, net_incurred_cents: integer }"
    side_effects: []

  # ---- Assignment ----
  - method: POST
    path: "/assignments"
    description: "Assign an adjuster or vendor with an inspection window"
    roles: [Adjuster, ClaimsManager]
    code: 201
    input: [claim_id, assignee_type, "adjuster_id?", "vendor_id?", scope, inspection_start, inspection_end]
    output: Assignment
    side_effects: ["credential/overlap/capacity checks", "first ADJUSTER assignment triggers Claim INTAKE->ASSIGNED (sets assigned_adjuster_id, ack_at, sla_ack_met)"]
  - method: GET
    path: "/assignments/{id}"
    description: "Fetch an assignment"
    roles: [Adjuster, ClaimsManager, FinanceOfficer, SiuInvestigator, Vendor]
    code: 200
    input: []
    output: Assignment
    side_effects: []
  - method: GET
    path: "/assignments"
    description: "List/filter assignments (reverse lookup by claim, adjuster, vendor)"
    roles: [Adjuster, ClaimsManager, FinanceOfficer, SiuInvestigator, Vendor]
    code: 200
    input: ["claim_id?", "adjuster_id?", "vendor_id?", "status?", "limit?", "offset?"]
    output: Assignment[]
    side_effects: []
  - method: POST
    path: "/assignments/{id}/transition"
    description: "Complete or cancel an assignment"
    roles: [Adjuster, ClaimsManager]
    code: 200
    input: [to_status]
    output: Assignment
    side_effects: ["Assignment state machine per §1.2, including VendorInvoice VOID cascade on CANCELLED"]

  # ---- ReserveChange ----
  - method: POST
    path: "/reserve-changes"
    description: "Post a case reserve adjustment (OCC on the claim)"
    roles: [Adjuster, ClaimsManager]
    code: 201
    input: [claim_id, reserve_type, delta_cents, reason, expected_claim_version]
    output: ReserveChange
    side_effects: ["apply signed delta to the reserve bucket (floored at 0)", "set resulting_*_reserve_cents", "increments Claim.version by 1", "recompute Claim.gross_incurred_cents", "recompute ClientAccount rollup"]
  - method: GET
    path: "/reserve-changes/{id}"
    description: "Fetch a reserve change"
    roles: [Adjuster, ClaimsManager, FinanceOfficer, SiuInvestigator, Vendor]
    code: 200
    input: []
    output: ReserveChange
    side_effects: []
  - method: GET
    path: "/reserve-changes"
    description: "List reserve changes (reverse lookup by claim)"
    roles: [Adjuster, ClaimsManager, FinanceOfficer, SiuInvestigator, Vendor]
    code: 200
    input: ["claim_id?", "reserve_type?", "limit?", "offset?"]
    output: ReserveChange[]
    side_effects: []

  # ---- Payment ----
  - method: POST
    path: "/payments"
    description: "Request an indemnity payment (OCC on the claim)"
    roles: [Adjuster, ClaimsManager]
    code: 201
    input: [claim_id, payment_type, payee_type, payee_name, amount_cents, expected_claim_version]
    output: Payment
    side_effects: ["status=PENDING_APPROVAL", "compute requires_manager_approval vs acting adjuster authority", "increments Claim.version by 1"]
  - method: GET
    path: "/payments/{id}"
    description: "Fetch a payment"
    roles: [Adjuster, ClaimsManager, FinanceOfficer, SiuInvestigator, Vendor]
    code: 200
    input: []
    output: Payment
    side_effects: []
  - method: GET
    path: "/payments"
    description: "List payments (reverse lookup by claim)"
    roles: [Adjuster, ClaimsManager, FinanceOfficer, SiuInvestigator, Vendor]
    code: 200
    input: ["claim_id?", "status?", "limit?", "offset?"]
    output: Payment[]
    side_effects: []
  - method: POST
    path: "/payments/{id}/transition"
    description: "Approve/reject/issue/void a payment"
    roles: [Adjuster, ClaimsManager, FinanceOfficer]
    code: 200
    input: [to_status]
    output: Payment
    side_effects: ["Payment state machine per §1.2; ISSUED draws reserve->paid; VOID compensates"]

  # ---- VendorInvoice ----
  - method: POST
    path: "/vendor-invoices"
    description: "Vendor submits an expense invoice against an assignment"
    roles: [Vendor]
    code: 201
    input: [claim_id, assignment_id, hours, "miles?", "materials_cents?"]
    output: VendorInvoice
    side_effects: ["vendor_id copied from assignment", "amount_cents computed via calculations.vendor_invoice_amount", "status=SUBMITTED"]
  - method: GET
    path: "/vendor-invoices/{id}"
    description: "Fetch a vendor invoice"
    roles: [Adjuster, ClaimsManager, FinanceOfficer, SiuInvestigator, Vendor]
    code: 200
    input: []
    output: VendorInvoice
    side_effects: []
  - method: GET
    path: "/vendor-invoices"
    description: "List vendor invoices (reverse lookup by claim, vendor, assignment)"
    roles: [Adjuster, ClaimsManager, FinanceOfficer, SiuInvestigator, Vendor]
    code: 200
    input: ["claim_id?", "vendor_id?", "assignment_id?", "status?", "limit?", "offset?"]
    output: VendorInvoice[]
    side_effects: []
  - method: POST
    path: "/vendor-invoices/{id}/transition"
    description: "Approve/reject/pay a vendor invoice"
    roles: [ClaimsManager, FinanceOfficer]
    code: 200
    input: [to_status]
    output: VendorInvoice
    side_effects: ["VendorInvoice state machine per §1.2; APPROVED earmarks expense reserve, PAID draws it, VOID releases it"]

  # ---- LitigationCase ----
  - method: POST
    path: "/litigation-cases"
    description: "Open a litigation record for a claim"
    roles: [ClaimsManager]
    code: 201
    input: [claim_id, "defense_vendor_id?", venue]
    output: LitigationCase
    side_effects: ["status=OPEN"]
  - method: GET
    path: "/litigation-cases/{id}"
    description: "Fetch a litigation case"
    roles: [Adjuster, ClaimsManager, FinanceOfficer, SiuInvestigator, Vendor]
    code: 200
    input: []
    output: LitigationCase
    side_effects: []
  - method: GET
    path: "/litigation-cases"
    description: "List litigation cases (reverse lookup by claim, defense vendor)"
    roles: [Adjuster, ClaimsManager, FinanceOfficer, SiuInvestigator, Vendor]
    code: 200
    input: ["claim_id?", "defense_vendor_id?", "status?", "limit?", "offset?"]
    output: LitigationCase[]
    side_effects: []
  - method: POST
    path: "/litigation-cases/{id}/transition"
    description: "Advance litigation status"
    roles: [ClaimsManager]
    code: 200
    input: [to_status]
    output: LitigationCase
    side_effects: ["LitigationCase state machine per §1.2"]

  # ---- SubrogationCase ----
  - method: POST
    path: "/subrogation-cases"
    description: "Open a subrogation pursuit for a claim"
    roles: [Adjuster, ClaimsManager]
    code: 201
    input: [claim_id, at_fault_party, demand_cents]
    output: SubrogationCase
    side_effects: ["status=OPEN"]
  - method: GET
    path: "/subrogation-cases/{id}"
    description: "Fetch a subrogation case"
    roles: [Adjuster, ClaimsManager, FinanceOfficer, SiuInvestigator, Vendor]
    code: 200
    input: []
    output: SubrogationCase
    side_effects: []
  - method: GET
    path: "/subrogation-cases"
    description: "List subrogation cases (reverse lookup by claim)"
    roles: [Adjuster, ClaimsManager, FinanceOfficer, SiuInvestigator, Vendor]
    code: 200
    input: ["claim_id?", "status?", "limit?", "offset?"]
    output: SubrogationCase[]
    side_effects: []
  - method: POST
    path: "/subrogation-cases/{id}/transition"
    description: "Advance subrogation; RECOVERED posts recovery to the claim (OCC on the claim)"
    roles: [Adjuster, ClaimsManager, FinanceOfficer]
    code: 200
    input: [to_status, "recovered_cents?", "allocation_method?", "expected_claim_version?"]
    output: SubrogationCase
    side_effects: ["SubrogationCase state machine per §1.2; RECOVERED allocates recovery and recomputes claim + account"]

  # ---- SiuReferral ----
  - method: POST
    path: "/siu-referrals"
    description: "Refer a claim to SIU (fraud)"
    roles: [Adjuster, ClaimsManager, SiuInvestigator]
    code: 201
    input: [claim_id, reason, "place_hold?"]
    output: SiuReferral
    side_effects: ["status=OPEN", "if place_hold: Claim.siu_status=HELD"]
  - method: GET
    path: "/siu-referrals/{id}"
    description: "Fetch an SIU referral"
    roles: [Adjuster, ClaimsManager, FinanceOfficer, SiuInvestigator, Vendor]
    code: 200
    input: []
    output: SiuReferral
    side_effects: []
  - method: GET
    path: "/siu-referrals"
    description: "List SIU referrals (reverse lookup by claim)"
    roles: [Adjuster, ClaimsManager, FinanceOfficer, SiuInvestigator, Vendor]
    code: 200
    input: ["claim_id?", "status?", "limit?", "offset?"]
    output: SiuReferral[]
    side_effects: []
  - method: POST
    path: "/siu-referrals/{id}/transition"
    description: "Clear or confirm an SIU referral"
    roles: [SiuInvestigator]
    code: 200
    input: [to_status]
    output: SiuReferral
    side_effects: ["CLEARED lifts the claim hold, CONFIRMED sets Claim.siu_status=CONFIRMED"]

  # ---- BordereauReport ----
  - method: POST
    path: "/bordereau-reports"
    description: "Generate a period bordereau for an account (PROVISIONAL or DEVELOPED basis)"
    roles: [ClaimsManager, FinanceOfficer]
    code: 201
    input: [client_account_id, period_start, period_end, basis]
    output: BordereauReport
    side_effects: ["compute totals via calculations.bordereau_totals"]
  - method: GET
    path: "/bordereau-reports/{id}"
    description: "Fetch a bordereau report"
    roles: [Adjuster, ClaimsManager, FinanceOfficer, SiuInvestigator, Vendor]
    code: 200
    input: []
    output: BordereauReport
    side_effects: []
  - method: GET
    path: "/bordereau-reports"
    description: "List bordereau reports (reverse lookup by account)"
    roles: [Adjuster, ClaimsManager, FinanceOfficer, SiuInvestigator, Vendor]
    code: 200
    input: ["client_account_id?", "basis?", "limit?", "offset?"]
    output: BordereauReport[]
    side_effects: []

# =============================================================================
# §1.6 Error Code Catalog
# =============================================================================
errors:
  - { id: ERR_UNAUTHENTICATED, http: 401, condition: "X-User-Role/X-User-ID header missing or role not recognized" }
  - { id: ERR_UNAUTHORIZED, http: 403, condition: "Acting role not permitted for the operation, or Vendor acting on an invoice for an assignment it does not own" }
  - { id: ERR_INVALID_REQUEST, http: 422, condition: "Malformed body: missing required field, illegal enum, non-positive amount/demand, zero delta, inverted time window, or assignee_type/id shape mismatch" }
  - { id: ERR_NOT_FOUND, http: 404, condition: "A referenced resource (path id or body FK) does not exist" }
  - { id: ERR_INVALID_STATE, http: 409, condition: "Requested transition is not legal from the resource's current state (or claim not in a legal state for cancel)" }
  - { id: ERR_CLAIM_NOT_OPEN, http: 409, condition: "Operation requires the claim to be open (status IN {ASSIGNED, INVESTIGATING, EVALUATED, REOPENED})" }
  - { id: ERR_PAYMENT_PENDING, http: 409, condition: "Claim cannot close while a Payment is PENDING_APPROVAL or APPROVED" }
  - { id: ERR_LITIGATION_OPEN, http: 409, condition: "Claim cannot close while a LitigationCase is non-terminal (OPEN or IN_SUIT)" }
  - { id: ERR_SUBROGATION_OPEN, http: 409, condition: "Claim cannot close while a SubrogationCase is OPEN/DEMAND_SENT/NEGOTIATING" }
  - { id: ERR_STALE_VERSION, http: 412, condition: "expected_claim_version does not match the claim's current version (OCC)" }
  - { id: ERR_POLICY_INACTIVE, http: 409, condition: "Policy.status != ACTIVE at claim intake or payment issue" }
  - { id: ERR_VENDOR_NOT_CREDENTIALED, http: 409, condition: "Assigned vendor is not credentialed for the claim's coverage_type" }
  - { id: ERR_ASSIGNEE_MISMATCH, http: 422, condition: "assignee_type is ADJUSTER but adjuster_id missing/vendor_id present (or the VENDOR mirror)" }
  - { id: ERR_SIU_HOLD_ACTIVE, http: 403, condition: "Claim.siu_status == HELD blocks payment issue and vendor-invoice payment" }
  - { id: ERR_ASSIGNMENT_WINDOW_CONFLICT, http: 409, condition: "Inspection window conflicts with an ACTIVE assignment on the same adjuster (within buffer) or vendor (strict overlap)" }
  - { id: ERR_ADJUSTER_CAPACITY, http: 409, condition: "Adjuster already at max_open_claims" }
  - { id: ERR_APPROVAL_AUTHORITY_REQUIRED, http: 403, condition: "Payment with requires_manager_approval=true approved by a non-ClaimsManager role" }
  - { id: ERR_COVERAGE_LIMIT_EXCEEDED, http: 422, condition: "Issuing the payment would exceed the policy coverage limit net of deductible" }
  - { id: ERR_EXPENSE_LIMIT_EXCEEDED, http: 422, condition: "Approving the invoice would exceed the policy per-claim expense limit" }
  - { id: ERR_RESERVE_AUTHORITY_EXCEEDED, http: 422, condition: "Adjuster-posted reserve change pushes total case reserve beyond the adjuster's authority_limit_cents" }

# =============================================================================
# §1.7 RBAC Matrix
# =============================================================================
roles:
  - name: Adjuster
    description: "Front-line claims adjuster; owns intake, investigation, reserves within authority, payment requests, and subrogation."
    identity: "entity_backed:Adjuster"
    exclusive_operations:
      - "POST /claims (intake)"
      - "POST /reserve-changes"
      - "POST /payments (request)"
      - "POST /assignments/{id}/transition (COMPLETED)"
    shared_operations:
      - "POST /assignments (with ClaimsManager)"
      - "POST /claims/{id}/transition (INVESTIGATING/EVALUATED/CLOSED with ClaimsManager)"
      - "POST /payments/{id}/transition (APPROVED only when requires_manager_approval=false)"
      - "POST /subrogation-cases and its non-RECOVERED transitions (with ClaimsManager)"
      - "POST /siu-referrals (with ClaimsManager, SiuInvestigator)"
      - "GET reads"
  - name: ClaimsManager
    description: "Supervisory role; configures accounts/policies/adjusters/vendors, approves over-authority payments, manages litigation, reopens/cancels claims, runs bordereaux."
    identity: "opaque"
    exclusive_operations:
      - "POST /client-accounts, POST /policies, POST /adjusters, POST /vendors"
      - "POST /litigation-cases and its transitions"
      - "POST /claims/{id}/transition (REOPENED, CANCELLED)"
      - "POST /vendor-invoices/{id}/transition (APPROVED, REJECTED)"
      - "POST /payments/{id}/transition (APPROVED when requires_manager_approval=true)"
    shared_operations:
      - "POST /assignments, POST /claims, POST /reserve-changes, POST /payments"
      - "POST /subrogation-cases, POST /siu-referrals"
      - "POST /bordereau-reports (with FinanceOfficer)"
      - "GET reads"
  - name: FinanceOfficer
    description: "Disbursement/recovery role (segregation of duties): issues approved payments, pays approved vendor invoices, posts subrogation recoveries, voids issued payments."
    identity: "opaque"
    exclusive_operations:
      - "POST /payments/{id}/transition (ISSUED, VOID)"
      - "POST /vendor-invoices/{id}/transition (PAID)"
      - "POST /subrogation-cases/{id}/transition (RECOVERED)"
    shared_operations:
      - "POST /bordereau-reports (with ClaimsManager)"
      - "GET reads"
  - name: SiuInvestigator
    description: "Special Investigations Unit; owns SIU referral disposition and holds."
    identity: "opaque"
    exclusive_operations:
      - "POST /siu-referrals/{id}/transition (CLEARED, CONFIRMED)"
    shared_operations:
      - "POST /siu-referrals (with Adjuster, ClaimsManager)"
      - "GET reads"
  - name: Vendor
    description: "External service provider (IA/appraiser/contractor/defense counsel); submits expense invoices against its own assignments."
    identity: "entity_backed:Vendor"
    exclusive_operations:
      - "POST /vendor-invoices (X-User-ID must equal the assignment's vendor_id)"
    shared_operations:
      - "GET reads"
