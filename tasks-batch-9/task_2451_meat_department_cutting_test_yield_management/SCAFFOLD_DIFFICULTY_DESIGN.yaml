  # ===========================================================================
  - rule_id: boundary_precision_check
    instances:

      - name: temperature_out_of_spec_strict_greater_boundary_and_consecutive_threshold
        grounds:
          - calculations.case_posture_derivation
          - entities.Department.fields.max_safe_case_temp_c
          - entities.Department.fields.consecutive_out_of_spec_readings
          - entities.TemperatureLog.fields.out_of_spec
          - entities.TemperatureLog.fields.consecutive_index
          - entities.Department.fields.case_posture
        distinguishing_aspect: |
          The metric is temperature on POST /meat-ops/temperature-logs: 4.4 C (exactly
          max_safe_case_temp_c) is IN spec because the comparison is strictly `>`, 4.5 C is out
          of spec, an in-spec 4.4 C resets the run to 0, and the failure only opens on the
          SECOND consecutive out-of-spec reading (consecutive_index == 2 ==
          CONSECUTIVE_FAILURE_THRESHOLD) — not the first. The sibling boundary instance measures
          pounds against FILL_OVERAGE_CAP on a different endpoint.
        test_recipe:
          setup:
            - "Department 'Meat 41' at default config (max_safe_case_temp_c 4.4, critical_case_temp_c 7.0, CONSECUTIVE_FAILURE_THRESHOLD 2); clock at 2026-08-05T08:00:00Z."
            - "No temperature readings and no case failures exist yet; case_posture is SALES_OPEN."
          setup_api_calls:
            - call: "POST /meat-ops/departments"
              payload: { name: "Meat 41", store_code: "S041" }
              as: StoreAdmin
              as_user_id: "admin-01"
              captures: { dept_id: $.data.id }
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-08-05T08:00:00Z" }
              as: StoreAdmin
              as_user_id: "admin-01"
          trigger:
            - call: "POST /meat-ops/temperature-logs"
              payload: { department_id: "${dept_id}", case_code: "CASE-A", reading_c: 4.4 }
              as: MeatCutter
              as_user_id: "cutter-01"
              captures: { tlog_a: $.data.id }
            - call: "POST /meat-ops/temperature-logs"
              payload: { department_id: "${dept_id}", case_code: "CASE-A", reading_c: 4.5 }
              as: MeatCutter
              as_user_id: "cutter-01"
              captures: { tlog_b: $.data.id }
            - call: "POST /meat-ops/temperature-logs"
              payload: { department_id: "${dept_id}", case_code: "CASE-A", reading_c: 4.4 }
              as: MeatCutter
              as_user_id: "cutter-01"
              captures: { tlog_c: $.data.id }
            - call: "POST /meat-ops/temperature-logs"
              payload: { department_id: "${dept_id}", case_code: "CASE-A", reading_c: 4.5 }
              as: MeatCutter
              as_user_id: "cutter-01"
              captures: { tlog_d: $.data.id }
            - call: "POST /meat-ops/temperature-logs"
              payload: { department_id: "${dept_id}", case_code: "CASE-A", reading_c: 4.6 }
              as: MeatCutter
              as_user_id: "cutter-01"
              captures: { tlog_e: $.data.id }
            - call: "GET /meat-ops/case-failures"
              payload: { department_id: "${dept_id}", case_code: "CASE-A" }
              as: MeatManager
              as_user_id: "mgr-01"
              captures: { cf1_id: "$.data[0].id" }
          assert:
            - "TemperatureLog.${tlog_a}.out_of_spec == false and consecutive_index == 0 (4.4 == max_safe_case_temp_c is in spec)"
            - "After ${tlog_a}: Department.${dept_id}.case_posture == SALES_OPEN"
            - "TemperatureLog.${tlog_b}.out_of_spec == true and consecutive_index == 1"
            - "After ${tlog_b}: Department.${dept_id}.case_posture == SALES_RESTRICTED and open_case_failure_count == 0 (one reading is not a failure)"
            - "TemperatureLog.${tlog_c}.out_of_spec == false and consecutive_index == 0 (an in-spec reading resets the run)"
            - "After ${tlog_c}: Department.${dept_id}.case_posture == SALES_OPEN"
            - "TemperatureLog.${tlog_d}.out_of_spec == true and consecutive_index == 1"
            - "TemperatureLog.${tlog_e}.out_of_spec == true and consecutive_index == 2"
            - "CaseFailure.${cf1_id}.status == OPEN with trigger_temperature_log_id == ${tlog_e} and peak_reading_c == 4.6"
            - "After ${tlog_e}: Department.${dept_id}.case_posture == SALES_HALTED, open_case_failure_count == 1, consecutive_out_of_spec_readings == 2"

      - name: fill_overage_cap_boundary_on_case_plan_line
        grounds:
          - validations[priority=38]
          - errors[ERR_FILL_EXCEEDS_REQUIRED]
          - calculations.required_fill_derivation
          - entities.CasePlanLine.fields.actual_fill_lb
          - entities.CasePlan.fields.fill_status
          - state_machines.CasePlanLine.FILLED_to_FILLED
        distinguishing_aspect: |
          The metric is pounds against required_fill_lb * FILL_OVERAGE_CAP on
          POST /meat-ops/case-plan-lines/{id}/fills: with required_fill_lb 24.00 the cap is
          exactly 30.00, a cumulative fill landing exactly on 30.00 is ACCEPTED (the check is
          `<=`) and the next 0.01 lb is refused with ERR_FILL_EXCEEDS_REQUIRED. The sibling
          boundary instance measures temperature on the temperature-log endpoint.
        test_recipe:
          setup:
            - "Department 'Meat 41' at default config; clock at 2026-08-05T08:00:00Z; posture SALES_OPEN."
            - "GRD80 (GROUND, shelf_life_days 2) is PROPOSED."
            - "CasePlan CP1 (service_date 2026-08-05) is PUBLISHED with line 1 on GRD80 (5 facings, expected_movement_lb 40.00) whose required_fill_lb is 24.00, so the overage cap is 30.00."
          setup_api_calls:
            - call: "POST /meat-ops/departments"
              payload: { name: "Meat 41", store_code: "S041" }
              as: StoreAdmin
              as_user_id: "admin-01"
              captures: { dept_id: $.data.id }
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-08-05T08:00:00Z" }
              as: StoreAdmin
              as_user_id: "admin-01"
            - call: "POST /meat-ops/retail-items"
              payload: { department_id: "${dept_id}", item_code: "GRD80", subprimal_code: "GROUND_CHUCK_80", product_class: "GROUND" }
              as: MeatManager
              as_user_id: "mgr-01"
              captures: { ri2_id: $.data.id }
            - call: "POST /meat-ops/primal-purchases"
              payload: { department_id: "${dept_id}", primal_code: "BEEF_CHUCK_ROLL", product_class: "WHOLE_MUSCLE", country_of_origin: "USA", vendor_name: "Prairie Packing", gross_weight_lb: 80.0, invoice_cost_cents: 40000, freight_cost_cents: 0, vendor_allowance_cents: 0, receiving_shrink_lb: 0, received_at: "2026-08-05T06:00:00Z" }
              as: MeatCutter
              as_user_id: "cutter-01"
              captures: { p3_id: $.data.id }
            - call: "POST /meat-ops/retail-items/${ri2_id}/price-proposals"
              payload: { primal_purchase_id: "${p3_id}" }
              as: PricingAnalyst
              as_user_id: "analyst-01"
            - call: "POST /meat-ops/case-plans"
              payload: { department_id: "${dept_id}", service_date: "2026-08-05" }
              as: MeatManager
              as_user_id: "mgr-01"
              captures: { cp1_id: $.data.id }
            - call: "POST /meat-ops/case-plans/${cp1_id}/lines"
              payload: { retail_item_id: "${ri2_id}", line_seq: 1, facings: 5, expected_movement_lb: 40.0 }
              as: MeatManager
              as_user_id: "mgr-01"
              captures: { cpl1_id: $.data.id }
            - call: "POST /meat-ops/case-plans/${cp1_id}/transitions"
              payload: { action: "PUBLISH" }
              as: MeatManager
              as_user_id: "mgr-01"
          trigger:
            - call: "POST /meat-ops/case-plan-lines/${cpl1_id}/fills"
              payload: { filled_lb: 24.0 }
              as: MeatCutter
              as_user_id: "cutter-01"
            - call: "POST /meat-ops/case-plan-lines/${cpl1_id}/fills"
              payload: { filled_lb: 6.0 }
              as: MeatCutter
              as_user_id: "cutter-01"
            - call: "POST /meat-ops/case-plan-lines/${cpl1_id}/fills"
              payload: { filled_lb: 0.01 }
              as: MeatCutter
              as_user_id: "cutter-01"
              captures: { err_cap: $.data.error_id }
          assert:
            - "CasePlanLine.${cpl1_id}.required_fill_lb == 24.00"
            - "After the first fill: CasePlanLine.${cpl1_id}.actual_fill_lb == 24.00 and line_status == FILLED"
            - "After the second fill: CasePlanLine.${cpl1_id}.actual_fill_lb == 30.00 (exactly 24.00 * 1.25, accepted) and line_status == FILLED"
            - "${err_cap} == ERR_FILL_EXCEEDS_REQUIRED with HTTP 422 for the 0.01 lb that would make 30.01"
            - "CasePlanLine.${cpl1_id}.actual_fill_lb == 30.00 (unchanged by the refused fill)"
            - "CasePlan.${cp1_id}.total_actual_fill_lb == 30.00 and CasePlan.${cp1_id}.fill_status == FILLED"
            - "CasePlanLine.${cpl1_id}.pack_date == 2026-08-05 and sell_by_date == 2026-08-07"

  # ===========================================================================
  - rule_id: cross_entity_state_dependency
    instances:

      - name: price_activation_gated_on_source_cutting_test_status
        grounds:
          - validations[priority=9]
          - errors[ERR_SOURCE_TEST_NOT_APPROVED]
          - state_machines.RetailItem.PROPOSED_to_PRICED
          - state_machines.CuttingTest.SUBMITTED_to_APPROVED
          - calculations.retail_price_per_lb.variants.final_price
        distinguishing_aspect: |
          The gating pair is RetailItem <- CuttingTest: an identical
          POST /meat-ops/retail-items/{id}/price-activations is refused with
          ERR_SOURCE_TEST_NOT_APPROVED (409) while the cited CuttingTest sits in SUBMITTED and
          succeeds once that other entity reaches APPROVED, with nothing about the RetailItem
          itself changing between the two attempts (the same non-stale version is presented, so
          the 412 rule at priority 7 is not what fires). The sibling instance gates a PreOrder on
          a CasePlanLine, a different entity pair and a different error.
        test_recipe:
          setup:
