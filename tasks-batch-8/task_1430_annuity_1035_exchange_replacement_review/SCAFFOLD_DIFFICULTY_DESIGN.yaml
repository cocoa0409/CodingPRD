            - { call: "POST /cases", payload: { producer_id: "${p_id}", client_id: "${c_id}", existing_contract_id: "${k_id}", exchange_type: "FULL", new_product_code: "NP-7", new_product_surrender_years: 7, new_product_bonus_bps: 100, new_product_annual_fee_bps: 115 }, as: Producer, as_user_id: "${p_id}", captures: { case_id: $.data.id } }
            - { call: "POST /cases/${case_id}/submit", payload: {}, as: Producer, as_user_id: "${p_id}" }
            - { call: "POST /cases/${case_id}/documents", payload: { doc_type: "REPLACEMENT_DISCLOSURE" }, as: Producer, as_user_id: "${p_id}", captures: { d_1: $.data.id } }
          trigger:
            - { call: "POST /documents/${d_1}/verify", payload: {}, as: SuitabilityReviewer, as_user_id: "rev-1", captures: { err: $.data.error_id } }
            - { call: "POST /cases/${case_id}/start_review", payload: {}, as: SuitabilityReviewer, as_user_id: "rev-1" }
            - { call: "POST /documents/${d_1}/verify", payload: {}, as: SuitabilityReviewer, as_user_id: "rev-1" }
          assert:
            - "First verify (case SUBMITTED): HTTP 409 with error_id == ERR_INVALID_STATE_TRANSITION"
            - "Document remains SUBMITTED after the failed verify"
            - "Second verify (case SUITABILITY_REVIEW): HTTP 200, document status == VERIFIED"

  # ---------------------------------------------------------------------------
  - rule_id: resource_temporal_overlap
    instances:
      - name: contract_occupation_overlap
        grounds:
          - validations[priority=14]
          - errors[ERR_CONTRACT_EXCHANGE_IN_PROGRESS]
        distinguishing_aspect: |
          Interval semantics = half-open occupation: a contract is occupied by
          a case over [submitted_at, terminal_transition); a second case on the
          same contract collides while the first is non-terminal, and succeeds
          once the first reaches a terminal state (WITHDRAWN).
        test_recipe:
          setup:
            - "Producer, client, K_STD contract; case A SUBMITTED at default clock (occupying the contract); case B DRAFT on the same contract"
          setup_api_calls:
            - { call: "POST /producers", payload: { license_number: "LIC-001", full_name: "Pat Producer", home_state_code: "CA" }, as: CarrierAdmin, captures: { p_id: $.data.id } }
            - { call: "POST /clients", payload: { full_name: "Sue Senior", date_of_birth: "1960-01-01", state_code: "CA" }, as: Producer, as_user_id: "${p_id}", captures: { c_id: $.data.id } }
            - { call: "POST /contracts", payload: { client_id: "${c_id}", carrier_name: "OldLine", contract_number: "CN-A", issue_date: "2021-09-01", account_value_cents: 10000000, tax_basis_cents: 8000000, surrender_schedule: [ { contract_year: 1, pct_bps: 700 }, { contract_year: 2, pct_bps: 600 }, { contract_year: 3, pct_bps: 500 }, { contract_year: 4, pct_bps: 400 }, { contract_year: 5, pct_bps: 300 }, { contract_year: 6, pct_bps: 200 }, { contract_year: 7, pct_bps: 100 } ], living_benefit_rider: true, rider_benefit_base_cents: 12000000, rider_annual_fee_bps: 95 }, as: Producer, as_user_id: "${p_id}", captures: { k_id: $.data.id } }
            - { call: "POST /cases", payload: { producer_id: "${p_id}", client_id: "${c_id}", existing_contract_id: "${k_id}", exchange_type: "FULL", new_product_code: "NP-7", new_product_surrender_years: 7, new_product_bonus_bps: 100, new_product_annual_fee_bps: 115 }, as: Producer, as_user_id: "${p_id}", captures: { case_a: $.data.id } }
            - { call: "POST /cases/${case_a}/submit", payload: {}, as: Producer, as_user_id: "${p_id}" }
            - { call: "POST /cases", payload: { producer_id: "${p_id}", client_id: "${c_id}", existing_contract_id: "${k_id}", exchange_type: "FULL", new_product_code: "NP-7", new_product_surrender_years: 7, new_product_bonus_bps: 100, new_product_annual_fee_bps: 115 }, as: Producer, as_user_id: "${p_id}", captures: { case_b: $.data.id } }
          trigger:
            - { call: "POST /cases/${case_b}/submit", payload: {}, as: Producer, as_user_id: "${p_id}", captures: { err: $.data.error_id } }
            - { call: "POST /cases/${case_a}/withdraw", payload: {}, as: Producer, as_user_id: "${p_id}" }
            - { call: "POST /cases/${case_b}/submit", payload: {}, as: Producer, as_user_id: "${p_id}" }
          assert:
            - "First submit of case B: HTTP 409 with error_id == ERR_CONTRACT_EXCHANGE_IN_PROGRESS"
            - "Case B remains DRAFT after the collision"
            - "After case A is WITHDRAWN (terminal): case B submit succeeds with status == SUBMITTED (occupation interval closed at A's terminal transition)"

      - name: client_rescission_cooling_off_gap
        grounds:
          - validations[priority=12]
          - entities.Client.fields.last_rescinded_at
          - errors[ERR_COOLING_OFF_ACTIVE]
        distinguishing_aspect: |
          DIFFERENT interval semantics and resource: a minimum-GAP rule on the
          Client (not an occupation collision on the contract) — a new case for
          the same client must start >= 30 days after the client's last
          rescission instant; day 29 fails, day 30 succeeds.
        test_recipe:
          setup:
            - "Junior client; K_STD contracts CN-A and CN-B; case A delivered 2026-08-02 and RESCINDED at 2026-08-22 (deadline day); client.last_rescinded_at == 2026-08-22T00:00:00Z"
            - "Case B (DRAFT, contract CN-B) created before the rescission so only the cooling-off gate is exercised at submit time"
