        distinguishing_aspect: "72h after queue entry hours_remaining is -24, giving a raw pressure of 1.5 that the clamp pins to 1.0, so the score is exactly 50 + 30 == 80.00 rather than 95.00, and it cannot rise further no matter how late the review runs."
