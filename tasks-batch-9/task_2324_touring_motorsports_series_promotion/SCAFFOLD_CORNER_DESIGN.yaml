          - roles.FinanceController.exclusive_operations
        distinguishing_aspect: "The negative half of the role matrix, taken in both directions so no role is merely a superset of another: the promoter who owns the show cannot price it, the box office cannot read the safety plan, the safety authority cannot sell a ticket, and finance cannot edit provisioning. Every refusal is a 403 with ERR_UNAUTHORIZED and no state moves; a missing X-User-ID is the different code ERR_UNAUTHENTICATED and outranks the role check."
