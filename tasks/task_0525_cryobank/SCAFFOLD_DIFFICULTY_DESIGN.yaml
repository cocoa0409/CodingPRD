            - { call: "POST /specimens/${spec_id}/begin-quarantine", payload: { dewar_code: "T-17" }, as: LabTech }
            - { call: "POST /_clock/set_current_utc", payload: { to_iso8601: "2026-06-01T00:00:00Z" }, as: ComplianceOfficer }
            - { call: "POST /specimens/${spec_id}/release-quarantine", payload: {}, as: ComplianceOfficer }
            - { call: "GET /donor-inventories?specimen_id=${spec_id}", payload: {}, as: CatalogManager, captures: { inv_id: "$.data[0].id", inv_v: "$.data[0].version" } }
            - { call: "POST /recipients", payload: { family_name: "Fam 17", contact_email: "17@x.com" }, as: CatalogManager, captures: { rcp_id: "$.data.id" } }
            - { call: "POST /recipient-consents", payload: { recipient_id: "${rcp_id}", donor_id: "${donor_id}", acknowledges_open_id: true }, as: Recipient, as_user_id: "${rcp_id}", captures: { con_id: "$.data.id" } }
            - { call: "POST /recipient-consents/${con_id}/sign", payload: {}, as: Recipient, as_user_id: "${rcp_id}" }
            - { call: "POST /vial-reservations", payload: { recipient_id: "${rcp_id}", inventory_id: "${inv_id}", vial_count: 2, expected_inventory_version: "${inv_v}" }, as: Recipient, as_user_id: "${rcp_id}", captures: { res_id: "$.data.id" } }
            - { call: "POST /vial-reservations/${res_id}/confirm", payload: {}, as: CatalogManager }
            - { call: "POST /shipments", payload: { reservation_id: "${res_id}", clinic_address: "17 Clinic", ln2_dewar_serial: "DS-17" }, as: LabTech, captures: { ship_id: "$.data.id" } }
            - { call: "POST /shipments/${ship_id}/dispatch", payload: {}, as: LabTech }
            - { call: "GET /storage-accounts?reservation_id=${res_id}", payload: {}, as: BillingClerk, captures: { acct_id: "$.data[0].id" } }
            - { call: "POST /_clock/set_current_utc", payload: { to_iso8601: "2027-07-01T00:00:00Z" }, as: BillingClerk }
            - { call: "POST /storage-accounts/${acct_id}/assess-lapse", payload: {}, as: BillingClerk }
            - { call: "GET /storage-invoices?storage_account_id=${acct_id}&billing_mode=LAPSE", payload: {}, as: BillingClerk, captures: { lapse_inv: "$.data[0].id" } }
          trigger:
            - { call: "POST /storage-invoices/${lapse_inv}/pay", payload: {}, as: BillingClerk }
          assert:
            - "StorageAccount.${acct_id}.status == ACTIVE"
            - "StorageAccount.${acct_id}.paid_through == 2028-06-01T00:00:00Z (advanced by exactly one 365-day period from 2027-06-01)"
