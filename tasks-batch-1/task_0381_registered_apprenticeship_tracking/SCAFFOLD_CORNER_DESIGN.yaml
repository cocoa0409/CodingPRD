# =============================================================================
# §1.9 Scaffold Corner Design (Coverage Index for Non-Difficulty Tests)
# Registered Apprenticeship Tracking (DOL) — Expert
#
# Breadth probe across the claim-extraction-guide's nine sections. Every active
# instance's setup_api_calls/trigger resolve to §1.5 endpoints; excluded_because
# stubs cite a §1.8 instance by name and carry no test_recipe.
#
# Wage ladder reused (base 4000c): step1 thr0 0.50, step2 thr8 0.65,
# step3 thr16 0.80, step4 thr24 0.95.
# =============================================================================

scaffold_corner_design:

  # ---------------------------------------------------------------------------
  - section: entities
    instances:
      - name: create_sponsor_returns_201_with_system_fields
        claim_type: Creation
        grounds:
          - "entities.Sponsor.fields.legal_name"
          - "entities.Sponsor.fields.ein"
        distinguishing_aspect: "POST /apprenticeship/sponsors with all required fields returns 201 with server-minted id, created_at, version==1."
        test_recipe:
          setup: ["Empty DB."]
          setup_api_calls: []
          trigger:
            - call: "POST /apprenticeship/sponsors"
              payload: { legal_name: "Acme", ein: "12-3456789", contact_email: "a@x.test" }
              as: Sponsor
              captures: { s_id: $.data.id, ver: $.data.version }
          assert:
            - "HTTP status == 201"
            - "response.data.legal_name == 'Acme'"
            - "response.data.version == 1"
            - "response.data.id is a non-empty UUID with no type prefix"

      - name: create_program_missing_required_field_rejected
        claim_type: Required Fields
        grounds:
          - "entities.ApprenticeshipProgram.fields.occupation_code"
          - "errors[ERR_INVALID_REQUEST]"
        distinguishing_aspect: "POST /apprenticeship/programs omitting occupation_code returns ERR_INVALID_REQUEST (400)."
        test_recipe:
          setup: ["Sponsor S exists."]
          setup_api_calls:
            - call: "POST /apprenticeship/sponsors"
              payload: { legal_name: "Acme", ein: "12-3456789", contact_email: "a@x.test" }
              as: Sponsor
              captures: { s_id: $.data.id }
          trigger:
            - call: "POST /apprenticeship/programs"
              payload: { sponsor_id: "${s_id}", occupation_title: "Electrician", completion_type: "HOURS_BASED", ojt_hours_required: 16, rti_hours_required: 8, base_journeyworker_wage_cents: 4000, journeyman_ratio: 4 }
              as: Sponsor
              as_user_id: "${s_id}"
              captures: { err: $.data.error_id }
          assert:
            - "HTTP status == 400"
            - "response.data.error_id == ERR_INVALID_REQUEST"

      - name: create_program_invalid_completion_type_enum_rejected
        claim_type: Type Constraints
        grounds:
          - "entities.ApprenticeshipProgram.fields.completion_type"
          - "errors[ERR_INVALID_REQUEST]"
        distinguishing_aspect: "completion_type outside {HOURS_BASED,COMPETENCY_BASED,HYBRID} returns ERR_INVALID_REQUEST (400)."
        test_recipe:
          setup: ["Sponsor S exists."]
          setup_api_calls:
            - call: "POST /apprenticeship/sponsors"
              payload: { legal_name: "Acme", ein: "12-3456789", contact_email: "a@x.test" }
              as: Sponsor
              captures: { s_id: $.data.id }
          trigger:
            - call: "POST /apprenticeship/programs"
              payload: { sponsor_id: "${s_id}", occupation_code: "47-2111.00", occupation_title: "Electrician", completion_type: "TIME_TRAVEL", ojt_hours_required: 16, rti_hours_required: 8, base_journeyworker_wage_cents: 4000, journeyman_ratio: 4 }
              as: Sponsor
              as_user_id: "${s_id}"
              captures: { err: $.data.error_id }
          assert:
            - "HTTP status == 400"
            - "response.data.error_id == ERR_INVALID_REQUEST"

      - name: get_agreement_nonexistent_returns_not_found
        claim_type: Not Found
        grounds:
          - "entities.ApprenticeAgreement"
          - "errors[ERR_AGREEMENT_NOT_FOUND]"
        distinguishing_aspect: "GET /apprenticeship/agreements/{unknown-uuid} returns ERR_AGREEMENT_NOT_FOUND (404)."
        test_recipe:
          setup: ["Empty DB."]
          setup_api_calls: []
          trigger:
            - call: "GET /apprenticeship/agreements/00000000-0000-4000-8000-000000000000"
              payload: {}
              as: Sponsor
              as_user_id: "00000000-0000-4000-8000-000000000001"
              captures: { err: $.data.error_id }
          assert:
            - "HTTP status == 404"
            - "response.data.error_id == ERR_AGREEMENT_NOT_FOUND"

      - name: apprentice_default_flags_applied
        claim_type: Defaults
        grounds:
          - "entities.Apprentice.fields.is_veteran"
          - "entities.Apprentice.fields.has_disability"
        distinguishing_aspect: "Omitting is_veteran/has_disability defaults both to false on the created Apprentice."
        test_recipe:
          setup: ["Sponsor S exists."]
          setup_api_calls:
            - call: "POST /apprenticeship/sponsors"
              payload: { legal_name: "Acme", ein: "12-3456789", contact_email: "a@x.test" }
              as: Sponsor
              captures: { s_id: $.data.id }
          trigger:
            - call: "POST /apprenticeship/apprentices"
              payload: { sponsor_id: "${s_id}", full_name: "AP1", gender: "MALE", race_ethnicity: "WHITE" }
              as: Sponsor
              as_user_id: "${s_id}"
              captures: { ap_id: $.data.id }
          assert:
            - "HTTP status == 201"
            - "response.data.is_veteran == false"
            - "response.data.has_disability == false"

      - name: agreement_computed_fields_input_ignored
        claim_type: Computed Fields
        grounds:
          - "entities.ApprenticeAgreement.fields.ojt_hours_completed"
          - "entities.ApprenticeAgreement.fields.current_wage_step"
        distinguishing_aspect: "On agreement create the server sets ojt_hours_completed=0 and current_wage_step=1 regardless of any client-supplied value; only declared inputs are honored."
        test_recipe:
          setup: ["ACTIVE program PROG (HOURS_BASED), QUALIFIED journeyworker, an apprentice."]
          setup_api_calls:
            - call: "POST /apprenticeship/sponsors"
              payload: { legal_name: "Acme", ein: "12-3456789", contact_email: "a@x.test" }
              as: Sponsor
              captures: { s_id: $.data.id }
            - call: "POST /apprenticeship/journeyworkers"
              payload: { sponsor_id: "${s_id}", full_name: "JW1" }
              as: Sponsor
              as_user_id: "${s_id}"
              captures: { jw_id: $.data.id }
            - call: "POST /apprenticeship/journeyworkers/${jw_id}/qualify"
              payload: {}
              as: Sponsor
              as_user_id: "${s_id}"
            - call: "POST /apprenticeship/apprentices"
              payload: { sponsor_id: "${s_id}", full_name: "AP1", gender: "MALE", race_ethnicity: "WHITE" }
              as: Sponsor
              as_user_id: "${s_id}"
              captures: { ap_id: $.data.id }
            - call: "POST /apprenticeship/programs"
              payload: { sponsor_id: "${s_id}", occupation_code: "47-2111.00", occupation_title: "Electrician", completion_type: "HOURS_BASED", ojt_hours_required: 16, rti_hours_required: 8, base_journeyworker_wage_cents: 4000, journeyman_ratio: 4 }
              as: Sponsor
              as_user_id: "${s_id}"
              captures: { prog_id: $.data.id }
          trigger:
            - call: "POST /apprenticeship/agreements"
              payload: { program_id: "${prog_id}", apprentice_id: "${ap_id}", journeyworker_id: "${jw_id}", start_date: "2026-01-01" }
              as: Sponsor
              as_user_id: "${s_id}"
              captures: { agr_id: $.data.id }
          assert:
            - "HTTP status == 201"
            - "response.data.ojt_hours_completed == 0"
            - "response.data.current_wage_step == 1"
            - "response.data.status == DRAFT"

      - name: certificate_immutable_no_version_field
        claim_type: Immutability
        grounds:
          - "entities.CompletionCertificate"
        distinguishing_aspect: "CompletionCertificate has common_fields:false — it carries id+created_at but no version field and no update endpoint exists in §1.5."
        test_recipe:
          setup: ["A completed agreement with a cascade-created certificate (reuse the completion flow)."]
          setup_api_calls:
            - call: "POST /apprenticeship/sponsors"
              payload: { legal_name: "Cert Co", ein: "21-2121212", contact_email: "cx@x.test" }
              as: Sponsor
              captures: { s_id: $.data.id }
            - call: "POST /apprenticeship/journeyworkers"
              payload: { sponsor_id: "${s_id}", full_name: "JW1" }
              as: Sponsor
              as_user_id: "${s_id}"
              captures: { jw_id: $.data.id }
            - call: "POST /apprenticeship/journeyworkers/${jw_id}/qualify"
              payload: {}
              as: Sponsor
              as_user_id: "${s_id}"
            - call: "POST /apprenticeship/apprentices"
              payload: { sponsor_id: "${s_id}", full_name: "AP1", gender: "MALE", race_ethnicity: "WHITE" }
              as: Sponsor
              as_user_id: "${s_id}"
              captures: { ap_id: $.data.id }
            - call: "POST /apprenticeship/programs"
              payload: { sponsor_id: "${s_id}", occupation_code: "47-2111.00", occupation_title: "Electrician", completion_type: "HOURS_BASED", ojt_hours_required: 16, rti_hours_required: 8, base_journeyworker_wage_cents: 4000, journeyman_ratio: 4 }
              as: Sponsor
              as_user_id: "${s_id}"
              captures: { prog_id: $.data.id }
            - call: "POST /apprenticeship/wage-steps"
              payload: { program_id: "${prog_id}", step_number: 1, ojt_hours_threshold: 0, wage_pct: 0.50 }
              as: Sponsor
              as_user_id: "${s_id}"
            - call: "POST /apprenticeship/programs/${prog_id}/activate"
              payload: {}
              as: RegistrationAgency
              captures: { pv0: $.data.version }
            - call: "POST /apprenticeship/agreements"
              payload: { program_id: "${prog_id}", apprentice_id: "${ap_id}", journeyworker_id: "${jw_id}", start_date: "2026-01-01" }
              as: Sponsor
              as_user_id: "${s_id}"
              captures: { agr_id: $.data.id }
            - call: "POST /apprenticeship/agreements/${agr_id}/register"
              payload: { expected_program_version: "${pv0}" }
              as: Sponsor
              as_user_id: "${s_id}"
            - call: "POST /apprenticeship/agreements/${agr_id}/activate"
              payload: {}
              as: Sponsor
              as_user_id: "${s_id}"
            - call: "POST /apprenticeship/ojt-entries"
              payload: { agreement_id: "${agr_id}", work_date: "2026-02-01", start_time: 0, end_time: 600, credited_hours: 16 }
              as: Sponsor
              as_user_id: "${s_id}"
              captures: { o_id: $.data.id }
            - call: "POST /apprenticeship/ojt-entries/${o_id}/approve"
              payload: {}
              as: TrainingCoordinator
            - call: "POST /apprenticeship/rti-records"
              payload: { agreement_id: "${agr_id}", course_code: "RTI-101", session_date: "2026-02-02", instruction_hours: 8 }
              as: TrainingCoordinator
            - call: "POST /apprenticeship/agreements/${agr_id}/complete"
              payload: {}
              as: RegistrationAgency
            - call: "GET /apprenticeship/certificates?agreement_id=${agr_id}"
              payload: {}
              as: Sponsor
              as_user_id: "${s_id}"
              captures: { cert_id: "$.data[0].id" }
          trigger:
            - call: "GET /apprenticeship/certificates/${cert_id}"
              payload: {}
              as: Sponsor
              as_user_id: "${s_id}"
          assert:
            - "HTTP status == 200"
            - "response.data has no 'version' field"
            - "response.data.occupation_code == '47-2111.00'"
            - "response.data.certified_ojt_hours == 16"

  # ---------------------------------------------------------------------------
  - section: state_machines
    instances:
      - name: agreement_initial_state_is_draft
        claim_type: Initial State
        grounds:
          - "state_machines.ApprenticeAgreement"
          - "entities.ApprenticeAgreement.fields.status"
        distinguishing_aspect: "A newly created agreement starts in DRAFT (the declared initial_state)."
        test_recipe:
          setup: ["Sponsor, QUALIFIED journeyworker, apprentice, program (DRAFT) all exist."]
          setup_api_calls:
            - call: "POST /apprenticeship/sponsors"
              payload: { legal_name: "Init Co", ein: "23-2323232", contact_email: "in@x.test" }
              as: Sponsor
              captures: { s_id: $.data.id }
            - call: "POST /apprenticeship/journeyworkers"
              payload: { sponsor_id: "${s_id}", full_name: "JW1" }
              as: Sponsor
              as_user_id: "${s_id}"
              captures: { jw_id: $.data.id }
            - call: "POST /apprenticeship/apprentices"
              payload: { sponsor_id: "${s_id}", full_name: "AP1", gender: "MALE", race_ethnicity: "WHITE" }
              as: Sponsor
              as_user_id: "${s_id}"
              captures: { ap_id: $.data.id }
            - call: "POST /apprenticeship/programs"
              payload: { sponsor_id: "${s_id}", occupation_code: "47-2111.00", occupation_title: "Electrician", completion_type: "HOURS_BASED", ojt_hours_required: 16, rti_hours_required: 8, base_journeyworker_wage_cents: 4000, journeyman_ratio: 4 }
              as: Sponsor
              as_user_id: "${s_id}"
              captures: { prog_id: $.data.id }
          trigger:
            - call: "POST /apprenticeship/agreements"
              payload: { program_id: "${prog_id}", apprentice_id: "${ap_id}", journeyworker_id: "${jw_id}", start_date: "2026-01-01" }
              as: Sponsor
              as_user_id: "${s_id}"
              captures: { agr_id: $.data.id }
          assert:
            - "response.data.status == DRAFT"

      - name: activate_agreement_from_draft_invalid_returns_not_registered
        claim_type: Invalid Transitions
        grounds:
          - "state_machines.ApprenticeAgreement.REGISTERED_to_ACTIVE"
          - "errors[ERR_AGREEMENT_NOT_REGISTERED]"
        distinguishing_aspect: "Calling activate on a DRAFT (not REGISTERED) agreement is an invalid transition -> ERR_AGREEMENT_NOT_REGISTERED (409)."
        test_recipe:
          setup: ["A DRAFT agreement AGR (never registered)."]
          setup_api_calls:
            - call: "POST /apprenticeship/sponsors"
              payload: { legal_name: "Inv Co", ein: "24-2424242", contact_email: "iv@x.test" }
              as: Sponsor
              captures: { s_id: $.data.id }
            - call: "POST /apprenticeship/journeyworkers"
              payload: { sponsor_id: "${s_id}", full_name: "JW1" }
              as: Sponsor
              as_user_id: "${s_id}"
              captures: { jw_id: $.data.id }
            - call: "POST /apprenticeship/apprentices"
              payload: { sponsor_id: "${s_id}", full_name: "AP1", gender: "MALE", race_ethnicity: "WHITE" }
              as: Sponsor
              as_user_id: "${s_id}"
              captures: { ap_id: $.data.id }
            - call: "POST /apprenticeship/programs"
              payload: { sponsor_id: "${s_id}", occupation_code: "47-2111.00", occupation_title: "Electrician", completion_type: "HOURS_BASED", ojt_hours_required: 16, rti_hours_required: 8, base_journeyworker_wage_cents: 4000, journeyman_ratio: 4 }
              as: Sponsor
              as_user_id: "${s_id}"
              captures: { prog_id: $.data.id }
            - call: "POST /apprenticeship/agreements"
              payload: { program_id: "${prog_id}", apprentice_id: "${ap_id}", journeyworker_id: "${jw_id}", start_date: "2026-01-01" }
              as: Sponsor
              as_user_id: "${s_id}"
              captures: { agr_id: $.data.id }
          trigger:
            - call: "POST /apprenticeship/agreements/${agr_id}/activate"
              payload: {}
              as: Sponsor
              as_user_id: "${s_id}"
              captures: { err: $.data.error_id }
          assert:
            - "HTTP status == 409"
            - "response.data.error_id == ERR_AGREEMENT_NOT_REGISTERED"

      - name: archive_program_with_open_agreements_rejected
        claim_type: Precondition Enforcement
        grounds:
          - "state_machines.ApprenticeshipProgram.ACTIVE_to_ARCHIVED"
          - "errors[ERR_PROGRAM_HAS_OPEN_AGREEMENTS]"
        distinguishing_aspect: "Archiving an ACTIVE program that still has a REGISTERED/ACTIVE/SUSPENDED agreement is rejected with ERR_PROGRAM_HAS_OPEN_AGREEMENTS (409)."
        test_recipe:
          setup: ["ACTIVE program PROG with one ACTIVE agreement."]
          setup_api_calls:
            - call: "POST /apprenticeship/sponsors"
              payload: { legal_name: "Arch Co", ein: "25-2525252", contact_email: "ar@x.test" }
              as: Sponsor
              captures: { s_id: $.data.id }
            - call: "POST /apprenticeship/journeyworkers"
              payload: { sponsor_id: "${s_id}", full_name: "JW1" }
              as: Sponsor
              as_user_id: "${s_id}"
              captures: { jw_id: $.data.id }
            - call: "POST /apprenticeship/journeyworkers/${jw_id}/qualify"
              payload: {}
              as: Sponsor
              as_user_id: "${s_id}"
            - call: "POST /apprenticeship/apprentices"
              payload: { sponsor_id: "${s_id}", full_name: "AP1", gender: "MALE", race_ethnicity: "WHITE" }
              as: Sponsor
              as_user_id: "${s_id}"
              captures: { ap_id: $.data.id }
            - call: "POST /apprenticeship/programs"
              payload: { sponsor_id: "${s_id}", occupation_code: "47-2111.00", occupation_title: "Electrician", completion_type: "HOURS_BASED", ojt_hours_required: 16, rti_hours_required: 8, base_journeyworker_wage_cents: 4000, journeyman_ratio: 4 }
              as: Sponsor
              as_user_id: "${s_id}"
              captures: { prog_id: $.data.id }
            - call: "POST /apprenticeship/wage-steps"
              payload: { program_id: "${prog_id}", step_number: 1, ojt_hours_threshold: 0, wage_pct: 0.50 }
              as: Sponsor
              as_user_id: "${s_id}"
            - call: "POST /apprenticeship/programs/${prog_id}/activate"
              payload: {}
              as: RegistrationAgency
              captures: { pv0: $.data.version }
            - call: "POST /apprenticeship/agreements"
              payload: { program_id: "${prog_id}", apprentice_id: "${ap_id}", journeyworker_id: "${jw_id}", start_date: "2026-01-01" }
              as: Sponsor
              as_user_id: "${s_id}"
              captures: { agr_id: $.data.id }
            - call: "POST /apprenticeship/agreements/${agr_id}/register"
              payload: { expected_program_version: "${pv0}" }
              as: Sponsor
              as_user_id: "${s_id}"
            - call: "POST /apprenticeship/agreements/${agr_id}/activate"
              payload: {}
              as: Sponsor
              as_user_id: "${s_id}"
          trigger:
            - call: "POST /apprenticeship/programs/${prog_id}/archive"
              payload: {}
              as: RegistrationAgency
              captures: { err: $.data.error_id }
          assert:
            - "HTTP status == 409"
            - "response.data.error_id == ERR_PROGRAM_HAS_OPEN_AGREEMENTS"

      - name: program_activate_without_base_wage_step_rejected
        claim_type: Precondition Enforcement
        grounds:
          - "state_machines.ApprenticeshipProgram.DRAFT_to_ACTIVE"
          - "errors[ERR_NO_BASE_WAGE_STEP]"
        distinguishing_aspect: "Activating a program whose only wage step has ojt_hours_threshold > 0 (no threshold-0 base step) is rejected with ERR_NO_BASE_WAGE_STEP (409)."
        test_recipe:
          setup: ["DRAFT program PROG with a single wage step at threshold 8 (no base step at 0)."]
          setup_api_calls:
            - call: "POST /apprenticeship/sponsors"
              payload: { legal_name: "NoBase Co", ein: "26-2626262", contact_email: "nb@x.test" }
              as: Sponsor
              captures: { s_id: $.data.id }
            - call: "POST /apprenticeship/programs"
              payload: { sponsor_id: "${s_id}", occupation_code: "47-2111.00", occupation_title: "Electrician", completion_type: "HOURS_BASED", ojt_hours_required: 16, rti_hours_required: 8, base_journeyworker_wage_cents: 4000, journeyman_ratio: 4 }
              as: Sponsor
              as_user_id: "${s_id}"
              captures: { prog_id: $.data.id }
            - call: "POST /apprenticeship/wage-steps"
              payload: { program_id: "${prog_id}", step_number: 2, ojt_hours_threshold: 8, wage_pct: 0.65 }
              as: Sponsor
              as_user_id: "${s_id}"
          trigger:
            - call: "POST /apprenticeship/programs/${prog_id}/activate"
              payload: {}
              as: RegistrationAgency
              captures: { err: $.data.error_id }
          assert:
            - "HTTP status == 409"
            - "response.data.error_id == ERR_NO_BASE_WAGE_STEP"

      - name: deactivate_journeyworker_with_apprentices_rejected
        claim_type: Precondition Enforcement
        grounds:
          - "state_machines.Journeyworker.QUALIFIED_to_INACTIVE"
          - "errors[ERR_JOURNEYWORKER_HAS_APPRENTICES]"
        distinguishing_aspect: "Deactivating a QUALIFIED journeyworker whose active_apprentice_count > 0 is rejected with ERR_JOURNEYWORKER_HAS_APPRENTICES (409)."
        test_recipe:
          setup: ["QUALIFIED journeyworker supervising one REGISTERED agreement."]
          setup_api_calls:
            - call: "POST /apprenticeship/sponsors"
              payload: { legal_name: "Deact Co", ein: "27-2727272", contact_email: "de@x.test" }
              as: Sponsor
              captures: { s_id: $.data.id }
            - call: "POST /apprenticeship/journeyworkers"
              payload: { sponsor_id: "${s_id}", full_name: "JW1" }
              as: Sponsor
              as_user_id: "${s_id}"
              captures: { jw_id: $.data.id }
            - call: "POST /apprenticeship/journeyworkers/${jw_id}/qualify"
              payload: {}
              as: Sponsor
              as_user_id: "${s_id}"
            - call: "POST /apprenticeship/apprentices"
              payload: { sponsor_id: "${s_id}", full_name: "AP1", gender: "MALE", race_ethnicity: "WHITE" }
              as: Sponsor
              as_user_id: "${s_id}"
              captures: { ap_id: $.data.id }
            - call: "POST /apprenticeship/programs"
              payload: { sponsor_id: "${s_id}", occupation_code: "47-2111.00", occupation_title: "Electrician", completion_type: "HOURS_BASED", ojt_hours_required: 16, rti_hours_required: 8, base_journeyworker_wage_cents: 4000, journeyman_ratio: 4 }
              as: Sponsor
              as_user_id: "${s_id}"
              captures: { prog_id: $.data.id }
            - call: "POST /apprenticeship/wage-steps"
              payload: { program_id: "${prog_id}", step_number: 1, ojt_hours_threshold: 0, wage_pct: 0.50 }
              as: Sponsor
              as_user_id: "${s_id}"
            - call: "POST /apprenticeship/programs/${prog_id}/activate"
              payload: {}
              as: RegistrationAgency
              captures: { pv0: $.data.version }
            - call: "POST /apprenticeship/agreements"
              payload: { program_id: "${prog_id}", apprentice_id: "${ap_id}", journeyworker_id: "${jw_id}", start_date: "2026-01-01" }
              as: Sponsor
              as_user_id: "${s_id}"
              captures: { agr_id: $.data.id }
            - call: "POST /apprenticeship/agreements/${agr_id}/register"
              payload: { expected_program_version: "${pv0}" }
              as: Sponsor
              as_user_id: "${s_id}"
          trigger:
            - call: "POST /apprenticeship/journeyworkers/${jw_id}/deactivate"
              payload: {}
              as: Sponsor
              as_user_id: "${s_id}"
              captures: { err: $.data.error_id }
          assert:
            - "HTTP status == 409"
            - "response.data.error_id == ERR_JOURNEYWORKER_HAS_APPRENTICES"

