  - rule_id: priority_pair_validation_conflict
    instances:
      - name: bidding_closed_temporal_outranks_bid_below_minimum_fiscal
        grounds:
          - validations[priority=27]
          - validations[priority=69]
          - calculations.offering_window_placement
          - calculations.minimum_price_determination
          - errors[ERR_BIDDING_CLOSED]
        distinguishing_aspect: |
          The colliding pair is business_temporal (priority 27,
          ERR_BIDDING_CLOSED, 409) against business_fiscal (priority 69,
          ERR_BID_BELOW_MINIMUM, 422): a single request violates both because
          the clock sits exactly on bid_close_at 2026-12-31T00:00:00Z (the
          half-open window has already closed) AND amount_cents 50000000 is far
          below minimum_price_cents 99750000, and the response MUST be
          ERR_BIDDING_CLOSED with HTTP 409.
        test_recipe:
          setup:
            - "One custodian Agency and one TRANSIT Agency that DECLINES its notice."
            - "One Parcel with book_value_cents 70000000, one CURED TitleCurativeItem at 250000 and an ACCEPTED Appraisal at 100000000."
            - "A published COMPETITIVE_SALE offering over [2026-08-01T00:00:00Z, 2026-12-31T00:00:00Z) with minimum_price_cents 99750000 and required_deposit_cents 4987500."
            - "One CLEAR Bidder funded 10000000 who has never bid, so no Bid row exists on the offering."
            - "The logical clock advanced to exactly 2026-12-31T00:00:00Z."
          setup_api_calls:
            - call: "POST /agencies"
              payload: { name: "City of Riverbend", agency_type: "MUNICIPAL", contact_email: "realproperty@riverbend.gov" }
              as: SystemAdministrator
              captures: { cust_agency_id: "$.data.id" }
            - call: "POST /agencies"
              payload: { name: "Riverbend Transit District", agency_type: "TRANSIT", contact_email: "clerk@rtd.gov" }
              as: SystemAdministrator
