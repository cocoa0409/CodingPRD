scaffold_corner_design:
  # =====================================================================
  # Section: entities
  # =====================================================================
  - section: entities
    instances:
      - name: venue_creation_required_fields
        claim_type: creation
        grounds: [entities.Venue.fields.name, entities.Venue.fields.market_zip, entities.Venue.fields.capacity_seats, entities.Venue.fields.wing_cost_cents_per_lb]
        distinguishing_aspect: "POST /api/venues with all required fields returns 201 and a Venue object with id, created_at, updated_at, version, and computed volatility_score."
        test_recipe:
          setup: []
          setup_api_calls: []
          trigger:
            - call: "POST /api/venues"
              payload: { name: "Downtown", market_zip: "14201", capacity_seats: 200, wing_cost_cents_per_lb: 180 }
              as: PlatformAdmin
              captures: { venue: $.data }
          assert:
            - "venue.name == 'Downtown'"
            - "venue.volatility_score == 0"
            - "venue.version == 1"

      - name: event_creation_defaults
        claim_type: defaults
        grounds: [entities.Event.fields.lift_pct, entities.Event.fields.status]
        distinguishing_aspect: "Omitting lift_pct on a BASE event defaults it to null; status is set to INGESTED."
        test_recipe:
          setup: []
          setup_api_calls: []
          trigger:
            - call: "POST /api/events"
              payload: { kind: "BASE", league: "FF_NFL", title: "Game", home_market_zip: "14201", expected_attendance: 5000, scheduled_start: "2026-09-13T19:00:00Z", scheduled_end: "2026-09-13T22:00:00Z" }
              as: Scheduler
              captures: { event: $.data }
          assert:
            - "event.lift_pct == null"
            - "event.status == INGESTED"

      - name: check_computed_fields_input_ignored
        claim_type: computed_fields
        grounds: [entities.Check.fields.subtotal_cents, entities.Check.fields.tax_cents, entities.Check.fields.total_cents]
        distinguishing_aspect: "Check subtotal_cents, tax_cents, and total_cents are computed; any input value for them is ignored and the response shows the computed values."
        test_recipe:
          setup:
            - "Venue exists"
            - "Guest exists"
          setup_api_calls:
            - call: "POST /api/venues"
              payload: { name: "Downtown", market_zip: "14201", capacity_seats: 200, wing_cost_cents_per_lb: 180 }
              as: PlatformAdmin
              captures: { venue_id: $.data.id }
            - call: "POST /api/guests"
              payload: { venue_id: "${venue_id}", name: "Alex", phone: "555-0100" }
              as: Host
              captures: { guest_id: $.data.id }
          trigger:
            - call: "POST /api/checks"
              payload: { venue_id: "${venue_id}", guest_id: "${guest_id}", party_size: 2, kind: "REGULAR", subtotal_cents: 9999, tax_cents: 9999, total_cents: 9999 }
              as: Server
              captures: { check: $.data }
          assert:
            - "check.subtotal_cents == 0"
            - "check.tax_cents == 0"
            - "check.total_cents == 0"

      - name: screen_assignment_immutable_no_update
        claim_type: immutability
        grounds: [entities.ScreenAssignment.common_fields]
        distinguishing_aspect: "ScreenAssignment has common_fields: false and no update endpoint; it can only be created and deleted."
        test_recipe:
          setup:
            - "Venue exists"
            - "Zone exists"
            - "Event exists"
            - "ScreenAssignment exists"
          setup_api_calls:
            - call: "POST /api/venues"
              payload: { name: "Downtown", market_zip: "14201", capacity_seats: 200, wing_cost_cents_per_lb: 180 }
              as: PlatformAdmin
              captures: { venue_id: $.data.id }
            - call: "POST /api/venues/${venue_id}/zones"
              payload: { name: "Main Bar", screen_ids: ["S1"] }
              as: VenueManager
              captures: { zone_id: $.data.id }
            - call: "POST /api/events"
              payload: { kind: "BASE", league: "FF_NFL", title: "Game", home_market_zip: "14201", expected_attendance: 5000, scheduled_start: "2026-09-13T19:00:00Z", scheduled_end: "2026-09-13T22:00:00Z" }
              as: Scheduler
              captures: { event_id: $.data.id }
            - call: "POST /api/zones/${zone_id}/screen-assignments"
              payload: { event_id: "${event_id}", screen_id: "S1", audio_enabled: true }
              as: VenueManager
              captures: { assignment_id: $.data.id }
          trigger:
            - call: "GET /api/screen-assignments/${assignment_id}"
              payload: {}
              as: VenueManager
              captures: { assignment: $.data }
          assert:
            - "assignment.event_id == ${event_id}"
            - "assignment.screen_id == 'S1'"

  # =====================================================================
  # Section: state_machines
  # =====================================================================
  - section: state_machines
    instances:
      - name: license_terminate_from_pending
        claim_type: invalid_transition
        grounds: [state_machines.BroadcastLicense.PENDING_to_TERMINATED]
        distinguishing_aspect: "BroadcastLicense can transition from PENDING directly to TERMINATED without passing through ACTIVE."
        test_recipe:
          setup:
            - "Venue exists"
            - "License in PENDING"
          setup_api_calls:
            - call: "POST /api/venues"
              payload: { name: "Downtown", market_zip: "14201", capacity_seats: 200, wing_cost_cents_per_lb: 180 }
              as: PlatformAdmin
              captures: { venue_id: $.data.id }
            - call: "POST /api/venues/${venue_id}/licenses"
              payload: { league: "NCAA", blackout_radius_miles: 75, fee_per_head_cents: 100 }
              as: VenueManager
              captures: { license_id: $.data.id }
          trigger:
            - call: "POST /api/licenses/${license_id}/terminate"
              payload: {}
              as: VenueManager
              captures: { license: $.data }
          assert:
            - "license.status == TERMINATED"

      - name: waitlist_call_skip_guard
        claim_type: precondition_enforcement
        grounds: [state_machines.WaitlistEntry.WAITING_to_CALLED]
        distinguishing_aspect: "Only the first WAITING entry by created_at ASC can be called; calling a later entry returns ERR_INVALID_STATE."
        test_recipe:
          setup:
            - "Venue exists"
            - "Two guests on waitlist, E1 created before E2"
          setup_api_calls:
            - call: "POST /api/venues"
              payload: { name: "Downtown", market_zip: "14201", capacity_seats: 200, wing_cost_cents_per_lb: 180 }
              as: PlatformAdmin
              captures: { venue_id: $.data.id }
            - call: "POST /api/guests"
              payload: { venue_id: "${venue_id}", name: "Alex", phone: "555-0100" }
              as: Host
              captures: { guest_a: $.data.id }
            - call: "POST /api/guests"
              payload: { venue_id: "${venue_id}", name: "Blair", phone: "555-0101" }
              as: Host
              captures: { guest_b: $.data.id }
            - call: "POST /api/waitlist"
              payload: { venue_id: "${venue_id}", guest_id: "${guest_a}", party_size: 4 }
              as: Host
              captures: { entry_a: $.data.id }
            - call: "POST /api/waitlist"
              payload: { venue_id: "${venue_id}", guest_id: "${guest_b}", party_size: 2 }
              as: Host
              captures: { entry_b: $.data.id }
          trigger:
            - call: "POST /api/waitlist/${entry_b}/call"
              payload: {}
              as: Host
              captures: { err: $.data }
          assert:
            - "err.error_id == ERR_INVALID_STATE"

      - name: staffing_plan_publish_requires_shifts
        claim_type: precondition_enforcement
        grounds: [state_machines.StaffingPlan.DRAFT_to_PUBLISHED]
        distinguishing_aspect: "Publishing a StaffingPlan with zero shifts is rejected."
        test_recipe:
          setup:
            - "Venue exists"
            - "StaffingPlan in DRAFT with no shifts"
          setup_api_calls:
            - call: "POST /api/venues"
              payload: { name: "Downtown", market_zip: "14201", capacity_seats: 200, wing_cost_cents_per_lb: 180 }
              as: PlatformAdmin
              captures: { venue_id: $.data.id }
            - call: "POST /api/venues/${venue_id}/staffing-plans"
              payload: { name: "Empty Plan" }
              as: VenueManager
              captures: { plan_id: $.data.id }
          trigger:
            - call: "POST /api/staffing-plans/${plan_id}/publish"
              payload: {}
              as: VenueManager
              captures: { err: $.data }
          assert:
            - "err.error_id == ERR_INVALID_STATE"

      - name: trivia_settle_from_closed
        claim_type: valid_transition
        grounds: [state_machines.TriviaSession.CLOSED_to_SETTLED]
        distinguishing_aspect: "TriviaSession can settle only from CLOSED; settling from OPEN is rejected."
        test_recipe:
          setup:
            - "Venue exists"
            - "TriviaSession OPEN"
          setup_api_calls:
            - call: "POST /api/venues"
              payload: { name: "Downtown", market_zip: "14201", capacity_seats: 200, wing_cost_cents_per_lb: 180 }
              as: PlatformAdmin
              captures: { venue_id: $.data.id }
            - call: "POST /api/venues/${venue_id}/trivia-sessions"
              payload: { title: "Trivia" }
              as: Host
              captures: { session_id: $.data.id }
          trigger:
            - call: "POST /api/trivia-sessions/${session_id}/settle"
              payload: {}
              as: VenueManager
              captures: { err: $.data }
          assert:
            - "err.error_id == ERR_INVALID_STATE"

  # =====================================================================
  # Section: calculations
  # =====================================================================
  - section: calculations
    instances:
      - name: wing_prep_excludes_cancelled_events
        claim_type: input_set_filtering
        grounds: [calculations.wing_prep_forecast, entities.Event.fields.status]
        distinguishing_aspect: "CANCELLED events are excluded from the wing-prep forecast base attendance."
        test_recipe:
          setup:
            - "Venue exists"
            - "Two BASE events in window: one INGESTED (exp 9000), one CANCELLED (exp 12000)"
          setup_api_calls:
            - call: "POST /api/venues"
              payload: { name: "Downtown", market_zip: "14201", capacity_seats: 200, wing_cost_cents_per_lb: 180 }
              as: PlatformAdmin
              captures: { venue_id: $.data.id }
            - call: "POST /api/events"
              payload: { kind: "BASE", league: "FF_NFL", title: "Live Game", home_market_zip: "14201", expected_attendance: 9000, scheduled_start: "2026-09-13T19:00:00Z", scheduled_end: "2026-09-13T22:00:00Z" }
              as: Scheduler
              captures: { event_live: $.data.id }
            - call: "POST /api/events"
              payload: { kind: "BASE", league: "FF_NFL", title: "Dead Game", home_market_zip: "14201", expected_attendance: 12000, scheduled_start: "2026-09-14T01:00:00Z", scheduled_end: "2026-09-14T04:00:00Z" }
              as: Scheduler
              captures: { event_dead: $.data.id }
            - call: "POST /api/events/${event_dead}/cancel"
              payload: {}
              as: Scheduler
          trigger:
            - call: "GET /api/venues/${venue_id}/forecasts/wing-prep"
              payload: { date: "2026-09-13" }
              as: VenueManager
              captures: { forecast: $.data }
          assert:
            - "forecast.base_attendance == 9000"
            - "forecast.required_pieces == 60750"

      - name: staffing_ceil_precision
        claim_type: constants_applied
        grounds: [calculations.staffing_requirement]
        distinguishing_aspect: "FOH uses ceil(covers * 0.4 / 60); 3600 covers yields exactly 60 FOH, and 3601 covers yields 61."
        test_recipe:
          setup:
            - "Venue exists"
            - "StaffingPlan in DRAFT"
          setup_api_calls:
            - call: "POST /api/venues"
              payload: { name: "Downtown", market_zip: "14201", capacity_seats: 200, wing_cost_cents_per_lb: 180 }
              as: PlatformAdmin
              captures: { venue_id: $.data.id }
            - call: "POST /api/venues/${venue_id}/staffing-plans"
              payload: { name: "Plan" }
              as: VenueManager
              captures: { plan_id: $.data.id }
          trigger:
            - call: "POST /api/staffing-plans/${plan_id}/shifts"
              payload: { role: "FOH", start_time: "2026-09-14T16:00:00Z", end_time: "2026-09-15T00:00:00Z", headcount: 10, expected_covers: 3600 }
              as: VenueManager
              captures: { shift1: $.data }
            - call: "GET /api/staffing-plans/${plan_id}"
              payload: {}
              as: VenueManager
              captures: { plan1: $.data }
            - call: "POST /api/staffing-plans/${plan_id}/shifts"
              payload: { role: "FOH", start_time: "2026-09-14T16:00:00Z", end_time: "2026-09-15T00:00:00Z", headcount: 10, expected_covers: 3601 }
              as: VenueManager
              captures: { shift2: $.data }
            - call: "GET /api/staffing-plans/${plan_id}"
              payload: {}
              as: VenueManager
              captures: { plan2: $.data }
          assert:
            - "plan1.foh_required == 60"
            - "plan2.foh_required == 121"

  # =====================================================================
  # Section: validations
  # =====================================================================
  - section: validations
    instances:
      - name: missing_auth_header_returns_unauthenticated
        claim_type: violation_to_error
        grounds:
          - validations[priority=1]
          - errors[ERR_UNAUTHENTICATED]
        distinguishing_aspect: "Any request without X-User-Role header returns ERR_UNAUTHENTICATED with 401."
        test_recipe:
          setup: []
          setup_api_calls: []
          trigger:
            - call: "GET /api/events"
              payload: {}
              as: ""
              captures: { err: $.data }
          assert:
            - "err.error_id == ERR_UNAUTHENTICATED"

      - name: wrong_role_returns_forbidden
        claim_type: violation_to_error
        grounds:
          - validations[priority=2]
          - errors[ERR_FORBIDDEN]
        distinguishing_aspect: "Host attempting to create a venue returns ERR_FORBIDDEN with 403."
        test_recipe:
          setup: []
          setup_api_calls: []
          trigger:
            - call: "POST /api/venues"
              payload: { name: "Downtown", market_zip: "14201", capacity_seats: 200, wing_cost_cents_per_lb: 180 }
              as: Host
              captures: { err: $.data }
          assert:
            - "err.error_id == ERR_FORBIDDEN"

      - name: not_found_returns_404
        claim_type: violation_to_error
        grounds:
          - validations[priority=3]
          - errors[ERR_NOT_FOUND]
        distinguishing_aspect: "GET with a non-existent UUID returns ERR_NOT_FOUND with 404."
        test_recipe:
          setup: []
          setup_api_calls: []
          trigger:
            - call: "GET /api/venues/00000000-0000-0000-0000-000000000000"
              payload: {}
              as: PlatformAdmin
              captures: { err: $.data }
          assert:
            - "err.error_id == ERR_NOT_FOUND"

      - name: ppv_check_requires_ppv_event
        claim_type: cross_entity_validation
        grounds:
          - validations[priority=8]
          - errors[ERR_PPV_REQUIRES_EVENT]
        distinguishing_aspect: "Creating a PPV check referencing a non-PPV event returns ERR_PPV_REQUIRES_EVENT."
        test_recipe:
          setup:
            - "Venue exists"
            - "Guest exists"
            - "Event exists with kind=BASE"
          setup_api_calls:
            - call: "POST /api/venues"
              payload: { name: "Downtown", market_zip: "14201", capacity_seats: 200, wing_cost_cents_per_lb: 180 }
              as: PlatformAdmin
              captures: { venue_id: $.data.id }
            - call: "POST /api/guests"
              payload: { venue_id: "${venue_id}", name: "Alex", phone: "555-0100" }
              as: Host
              captures: { guest_id: $.data.id }
            - call: "POST /api/events"
              payload: { kind: "BASE", league: "FF_NFL", title: "Game", home_market_zip: "14201", expected_attendance: 5000, scheduled_start: "2026-09-13T19:00:00Z", scheduled_end: "2026-09-13T22:00:00Z" }
              as: Scheduler
              captures: { event_id: $.data.id }
          trigger:
            - call: "POST /api/checks"
              payload: { venue_id: "${venue_id}", guest_id: "${guest_id}", party_size: 2, kind: "PPV", event_id: "${event_id}" }
              as: Server
              captures: { err: $.data }
          assert:
            - "err.error_id == ERR_PPV_REQUIRES_EVENT"

  # =====================================================================
  # Section: endpoints
  # =====================================================================
  - section: endpoints
    instances:
      - name: wing_cost_patch_recomputes_volatility
        claim_type: side_effect_execution
        grounds:
          - entities.Venue.fields.volatility_score
          - endpoints[PATCH /api/venues/{venue_id}/wing-cost]
        distinguishing_aspect: "Updating wing_cost_cents_per_lb recomputes volatility_score and increments venue.version."
        test_recipe:
          setup:
            - "Venue exists with wing_cost_cents_per_lb=180"
          setup_api_calls:
            - call: "POST /api/venues"
              payload: { name: "Downtown", market_zip: "14201", capacity_seats: 200, wing_cost_cents_per_lb: 180 }
              as: PlatformAdmin
              captures: { venue_id: $.data.id }
          trigger:
            - call: "PATCH /api/venues/${venue_id}/wing-cost"
              payload: { wing_cost_cents_per_lb: 230 }
              as: VenueManager
              captures: { venue: $.data }
          assert:
            - "venue.volatility_score == 0.2777777777777778"
            - "venue.version == 2"

      - name: event_cancel_removes_screen_assignments
        claim_type: side_effect_execution
        grounds:
          - endpoints[POST /api/events/{event_id}/cancel]
          - state_machines.Event.INGESTED_to_CANCELLED
        distinguishing_aspect: "Cancelling an event removes its screen assignments and recomputes zone posture."
        test_recipe:
          setup:
            - "Venue exists"
            - "Zone with assignment to event"
          setup_api_calls:
            - call: "POST /api/venues"
              payload: { name: "Downtown", market_zip: "14201", capacity_seats: 200, wing_cost_cents_per_lb: 180 }
              as: PlatformAdmin
              captures: { venue_id: $.data.id }
            - call: "POST /api/venues/${venue_id}/zones"
              payload: { name: "Main Bar", screen_ids: ["S1"] }
              as: VenueManager
              captures: { zone_id: $.data.id }
            - call: "POST /api/events"
              payload: { kind: "BASE", league: "FF_NFL", title: "Game", home_market_zip: "14201", expected_attendance: 5000, scheduled_start: "2026-09-13T19:00:00Z", scheduled_end: "2026-09-13T22:00:00Z" }
              as: Scheduler
              captures: { event_id: $.data.id }
            - call: "POST /api/zones/${zone_id}/screen-assignments"
              payload: { event_id: "${event_id}", screen_id: "S1", audio_enabled: true }
              as: VenueManager
              captures: { assignment_id: $.data.id }
          trigger:
            - call: "POST /api/events/${event_id}/cancel"
              payload: {}
              as: Scheduler
            - call: "GET /api/zones/${zone_id}"
              payload: {}
              as: VenueManager
              captures: { zone: $.data }
          assert:
            - "zone.primary_event_id == null"
            - "zone.posture == OPEN"

  # =====================================================================
  # Section: errors
  # =====================================================================
  - section: errors
    instances:
      - name: every_error_triggerable
        claim_type: violation_to_error
        grounds: [errors]
        distinguishing_aspect: "Every error in the catalog is triggerable by at least one endpoint; no dead error codes."
        test_recipe:
          setup: []
          setup_api_calls: []
          trigger: []
          assert:
            - "ERR_UNAUTHENTICATED triggerable by missing headers on any endpoint"
            - "ERR_FORBIDDEN triggerable by wrong role"
            - "ERR_NOT_FOUND triggerable by missing resource"
            - "ERR_INVALID_REQUEST triggerable by malformed payload"
            - "ERR_INVALID_STATE triggerable by illegal transition"
            - "ERR_STALE_VERSION triggerable by OCC mismatch"
            - "ERR_EVENT_WINDOW_CONFLICT triggerable by invalid event window"
            - "ERR_SCREEN_ALREADY_ASSIGNED triggerable by double assignment"
            - "ERR_BLACKOUT_WINDOW_ACTIVE triggerable by blackout assignment"
            - "ERR_LICENSE_NOT_ACTIVE triggerable by non-ACTIVE license"
            - "ERR_WAITLIST_FULL triggerable by all zones FULL"
            - "ERR_TABLE_HOLD_EXPIRED triggerable by late seat"
            - "ERR_TOO_MANY_NO_SHOWS triggerable by 3 no-shows"
            - "ERR_PPV_REQUIRES_EVENT triggerable by PPV check with non-PPV event"
            - "ERR_CONTEST_NOT_OPEN triggerable by entry on DRAFT contest"
            - "ERR_PROMO_WINDOW_INVALID triggerable by end_date < start_date"
            - "ERR_SHIFT_WINDOW_INVALID triggerable by shift end <= start"
            - "ERR_QUANTITY_INVALID triggerable by zero pieces"
            - "ERR_PRIZE_STRUCTURE_INVALID triggerable by invalid prize_structure"
            - "ERR_CAPACITY_EXCEEDED triggerable by capacity breach"
            - "ERR_GUEST_NOT_FOUND triggerable by missing guest reference"
            - "ERR_EVENT_NOT_FOUND triggerable by missing event reference"

  # =====================================================================
  # Section: roles
  # =====================================================================
  - section: roles
    instances:
      - name: scheduler_cannot_manage_venue
        claim_type: role_isolation
        grounds: [roles.Scheduler, roles.VenueManager]
        distinguishing_aspect: "Scheduler can only ingest/cancel events and read; it cannot create venues, zones, or licenses."
        test_recipe:
          setup: []
          setup_api_calls: []
          trigger:
            - call: "POST /api/venues"
              payload: { name: "Downtown", market_zip: "14201", capacity_seats: 200, wing_cost_cents_per_lb: 180 }
              as: Scheduler
              captures: { err: $.data }
          assert:
            - "err.error_id == ERR_FORBIDDEN"

      - name: server_cannot_manage_staffing
        claim_type: role_isolation
        grounds: [roles.Server, roles.VenueManager]
        distinguishing_aspect: "Server can manage checks and order lines but cannot create or publish staffing plans."
        test_recipe:
          setup:
            - "Venue exists"
          setup_api_calls:
            - call: "POST /api/venues"
              payload: { name: "Downtown", market_zip: "14201", capacity_seats: 200, wing_cost_cents_per_lb: 180 }
              as: PlatformAdmin
              captures: { venue_id: $.data.id }
          trigger:
            - call: "POST /api/venues/${venue_id}/staffing-plans"
              payload: { name: "Plan" }
              as: Server
              captures: { err: $.data }
          assert:
            - "err.error_id == ERR_FORBIDDEN"

  # =====================================================================
  # Section: cross_cutting_complexity_layers
  # =====================================================================
  - section: cross_cutting_complexity_layers
    instances:
      - name: occ_stale_version_on_fantasy_settle
        claim_type: optimistic_concurrency
        grounds: [concurrency_rules.fantasy-settle-stale-contest]
        distinguishing_aspect: "Settling a FantasyContest with a stale expected_fantasy_contest_version returns ERR_STALE_VERSION (412)."
        test_recipe:
          setup:
            - "Venue exists"
            - "FantasyContest in LOCKED state with version=2"
          setup_api_calls:
            - call: "POST /api/venues"
              payload: { name: "Downtown", market_zip: "14201", capacity_seats: 200, wing_cost_cents_per_lb: 180 }
              as: PlatformAdmin
              captures: { venue_id: $.data.id }
            - call: "POST /api/venues/${venue_id}/fantasy-contests"
              payload: { entry_fee_cents: 2500, rake_pct: 0.10, prize_structure: [0.5, 0.3, 0.2] }
              as: VenueManager
              captures: { contest_id: $.data.id }
            - call: "POST /api/fantasy-contests/${contest_id}/open"
              payload: {}
              as: VenueManager
            - call: "POST /api/guests"
              payload: { venue_id: "${venue_id}", name: "Alex", phone: "555-0100" }
              as: Host
              captures: { guest_id: $.data.id }
            - call: "POST /api/fantasy-contests/${contest_id}/entries"
              payload: { guest_id: "${guest_id}", lineup: { qb: "Allen" } }
              as: Host
            - call: "POST /api/fantasy-contests/${contest_id}/lock"
              payload: {}
              as: VenueManager
              captures: { contest_locked: $.data, contest_v: $.data.version }
          trigger:
