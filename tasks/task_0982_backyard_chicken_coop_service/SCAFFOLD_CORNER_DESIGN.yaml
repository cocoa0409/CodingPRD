              payload: { household_id: "${hh1}", coop_site_id: "${coop1}", start_date: "2026-08-01T00:00:00Z", end_date: "2026-08-02T00:00:00Z", daily_window_start: "08:00" }
              as: Customer
              as_user_id: "${hh1}"
              captures: { eng1: $.data.id }
            - call: "POST /coopcare/sitting-engagements/${eng1}/quote"
              as: Dispatcher
            - call: "POST /coopcare/sitting-engagements/${eng1}/confirm"
              as: Customer
              as_user_id: "${hh1}"
            - call: "GET /coopcare/route-stops"
              payload: { engagement_id: "${eng1}" }
              as: Dispatcher
              captures: { eng1_stop_route: "$.data[0].route_id" }
            - call: "GET /coopcare/sitting-routes/${r_early}"
              as: Dispatcher
              captures: { r_early_v: $.data.version }
            - call: "POST /coopcare/sitting-routes/${r_early}/stops"
              payload: { engagement_id: "${eng1}", planned_start: "2026-08-01T12:00:00Z", planned_end: "2026-08-01T13:00:00Z", expected_route_version: "${r_early_v}" }
              as: Dispatcher
            - call: "POST /coopcare/sitting-engagements"
              payload: { household_id: "${hh2}", coop_site_id: "${coop2}", start_date: "2026-08-01T00:00:00Z", end_date: "2026-08-02T00:00:00Z", daily_window_start: "08:00" }
              as: Customer
              as_user_id: "${hh2}"
              captures: { eng2: $.data.id }
            - call: "POST /coopcare/sitting-engagements/${eng2}/quote"
              as: Dispatcher
          trigger:
            - call: "POST /coopcare/sitting-engagements/${eng2}/confirm"
              as: Customer
              as_user_id: "${hh2}"
            - call: "GET /coopcare/route-stops"
              payload: { engagement_id: "${eng2}" }
              as: Dispatcher
              captures: { eng2_stop_route: "$.data[0].route_id" }
          assert:
            - "H1's stop.route_id == ${r_early} (committed tie 0 == 0 broken by created_at ASC)"
            - "H2's stop.route_id == ${r_late} (committed_stops ASC: R_late 0 < R_early 2)"
            - "SittingRoute.${r_late}.committed_stops == 1 after H2's confirm"

      - name: subscription_renew_applies_pending_plan
        claim_type: correct_result
        grounds: [calculations.subscription_coverage_resolution, state_machines.Subscription.ACTIVE_to_ACTIVE, entities.Subscription.fields.pending_plan_id]
        distinguishing_aspect: "renew-period is the only place a pending plan change lands: after the clock passes period end, renew switches plan_id to the pending plan, resets used_cleanings to 0, and advances the period to [2026-06-01, 2026-07-01)."
        test_recipe:
          setup:
            - "URBAN household; plan A (included_cleanings 1, fee 2900) ACTIVE since 2026-05-01; plan B (fee 4900) exists"
            - "Coop INSTALLED; one covered COOP_CLEANING created (used_cleanings == 1)"
            - "Pending plan change to B registered via plan-changes (OCC version read after the covered visit bumped it)"
            - "Logical clock advanced to 2026-06-01T00:00:00Z (>= period end)"
          setup_api_calls:
            - call: "POST /coopcare/subscription-plans"
              payload: { plan_code: "RENA", monthly_fee_cents: 2900, included_cleanings_per_period: 1, included_health_checks_per_period: 0, supply_discount_pct: 0, sitting_discount_pct: 0 }
              as: PlatformAdmin
              captures: { plan_a: $.data.id }
            - call: "POST /coopcare/subscription-plans"
              payload: { plan_code: "RENB", monthly_fee_cents: 4900, included_cleanings_per_period: 4, included_health_checks_per_period: 2, supply_discount_pct: 0.10, sitting_discount_pct: 0 }
              as: PlatformAdmin
              captures: { plan_b: $.data.id }
            - call: "POST /coopcare/households"
              payload: { name: "H Ren", email: "hren@x.com", address: "38 Hen Ln", zone_code: "URBAN" }
              as: PlatformAdmin
              captures: { hh_id: $.data.id }
            - call: "POST /coopcare/subscriptions"
              payload: { household_id: "${hh_id}", plan_id: "${plan_a}", current_period_start: "2026-05-01T00:00:00Z" }
              as: Customer
              as_user_id: "${hh_id}"
              captures: { sub_id: $.data.id }
            - call: "POST /coopcare/coop-sites"
              payload: { household_id: "${hh_id}", site_label: "coop", coop_capacity_hens: 4 }
              as: Customer
              as_user_id: "${hh_id}"
              captures: { coop_id: $.data.id }
            - call: "POST /coopcare/service-visits"
              payload: { household_id: "${hh_id}", coop_site_id: "${coop_id}", visit_type: "SETUP_INSTALL", scheduled_start: "2026-05-02T09:00:00Z", scheduled_end: "2026-05-02T12:00:00Z" }
              as: Customer
              as_user_id: "${hh_id}"
              captures: { v_i: $.data.id }
            - call: "POST /coopcare/service-visits/${v_i}/assign"
              payload: { technician_id: "tech-1" }
              as: Dispatcher
            - call: "POST /coopcare/service-visits/${v_i}/check-in"
              as: ServiceTech
              as_user_id: "tech-1"
            - call: "POST /coopcare/service-visits/${v_i}/complete"
              payload: { observed_flock_size: 4, actual_duration_minutes: 180 }
              as: ServiceTech
              as_user_id: "tech-1"
            - call: "POST /coopcare/service-visits"
              payload: { household_id: "${hh_id}", coop_site_id: "${coop_id}", visit_type: "COOP_CLEANING", scheduled_start: "2026-05-10T09:00:00Z", scheduled_end: "2026-05-10T10:00:00Z" }
              as: Customer
              as_user_id: "${hh_id}"
              captures: { v_c: $.data.id, cov: $.data.coverage }
            - call: "GET /coopcare/subscriptions/${sub_id}"
              as: BillingAdmin
              captures: { sub_v: $.data.version }
            - call: "POST /coopcare/subscriptions/${sub_id}/plan-changes"
              payload: { new_plan_id: "${plan_b}", expected_subscription_version: "${sub_v}" }
              as: Customer
              as_user_id: "${hh_id}"
            - call: "POST /coopcare/_clock/set_current_utc"
              payload: { to_iso8601: "2026-06-01T00:00:00Z" }
              as: PlatformAdmin
          trigger:
            - call: "POST /coopcare/subscriptions/${sub_id}/renew-period"
              as: BillingAdmin
              captures: { plan_now: $.data.plan_id, used_now: $.data.used_cleanings, ps: $.data.current_period_start, pe: $.data.current_period_end, pend: $.data.pending_plan_id }
          assert:
            - "ServiceVisit.${v_c}.coverage == SUBSCRIPTION_COVERED and Subscription.used_cleanings was 1 before renew"
            - "Subscription.${sub_id}.plan_id == ${plan_b} after renew (pending change landed)"
            - "Subscription.${sub_id}.pending_plan_id == null"
            - "Subscription.${sub_id}.used_cleanings == 0 (counter reset)"
            - "Subscription.${sub_id}.current_period_start == 2026-06-01T00:00:00Z and current_period_end == 2026-07-01T00:00:00Z"

  # ===========================================================================
  # Section: validations
  # ===========================================================================
  - section: validations
    instances:
      - name: renew_period_before_end_rejected
        claim_type: violation_to_error
        grounds: ["validations[priority=6]", "errors[ERR_PERIOD_NOT_ENDED]"]
        distinguishing_aspect: "renew-period before the logical clock reaches current_period_end returns ERR_PERIOD_NOT_ENDED; at default clock 2026-05-01 the period [05-01, 06-01) has not ended."
        test_recipe:
          setup: ["plan; URBAN household; subscription ACTIVE with period 2026-05-01 -> 2026-06-01; clock at default"]
          setup_api_calls:
            - call: "POST /coopcare/subscription-plans"
              payload: { plan_code: "RE1", monthly_fee_cents: 1000, included_cleanings_per_period: 1, included_health_checks_per_period: 0, supply_discount_pct: 0, sitting_discount_pct: 0 }
              as: PlatformAdmin
              captures: { plan_id: $.data.id }
            - call: "POST /coopcare/households"
              payload: { name: "H RE", email: "hre@x.com", address: "39 Hen Ln", zone_code: "URBAN" }
              as: PlatformAdmin
              captures: { hh_id: $.data.id }
            - call: "POST /coopcare/subscriptions"
              payload: { household_id: "${hh_id}", plan_id: "${plan_id}", current_period_start: "2026-05-01T00:00:00Z" }
              as: Customer
              as_user_id: "${hh_id}"
              captures: { sub_id: $.data.id }
          trigger:
            - call: "POST /coopcare/subscriptions/${sub_id}/renew-period"
              as: BillingAdmin
              captures: { err: $.data.error_id }
          assert:
            - "error_id == ERR_PERIOD_NOT_ENDED"
            - "Subscription.${sub_id}.current_period_start stays 2026-05-01T00:00:00Z"

      - name: confirm_without_any_route_rejected_atomically
        claim_type: violation_to_error
        grounds: [calculations.route_assignment_selector, "errors[ERR_NO_ROUTE_AVAILABLE]", "validations[priority=11]"]
        distinguishing_aspect: "Selector empty-pool fallback: a 2-night engagement has an eligible route on night 1 but none on night 2; confirm fails atomically with ERR_NO_ROUTE_AVAILABLE and the night-1 route holds zero stops."
        test_recipe:
          setup:
            - "URBAN household with INSTALLED grade-B coop"
            - "PUBLISHED URBAN route only on 2026-09-10; engagement 2026-09-10 -> 2026-09-12 QUOTED"
          setup_api_calls:
            - call: "POST /coopcare/households"
              payload: { name: "H NR", email: "hnr@x.com", address: "40 Hen Ln", zone_code: "URBAN" }
              as: PlatformAdmin
              captures: { hh_id: $.data.id }
            - call: "POST /coopcare/coop-sites"
              payload: { household_id: "${hh_id}", site_label: "coop", coop_capacity_hens: 6 }
              as: Customer
              as_user_id: "${hh_id}"
              captures: { coop_id: $.data.id }
            - call: "POST /coopcare/service-visits"
              payload: { household_id: "${hh_id}", coop_site_id: "${coop_id}", visit_type: "SETUP_INSTALL", scheduled_start: "2026-06-01T09:00:00Z", scheduled_end: "2026-06-01T12:00:00Z" }
              as: Customer
              as_user_id: "${hh_id}"
              captures: { v_i: $.data.id }
            - call: "POST /coopcare/service-visits/${v_i}/assign"
              payload: { technician_id: "tech-1" }
              as: Dispatcher
            - call: "POST /coopcare/service-visits/${v_i}/check-in"
              as: ServiceTech
              as_user_id: "tech-1"
            - call: "POST /coopcare/service-visits/${v_i}/complete"
              payload: { observed_flock_size: 6, actual_duration_minutes: 180 }
              as: ServiceTech
              as_user_id: "tech-1"
            - call: "POST /coopcare/service-visits"
              payload: { household_id: "${hh_id}", coop_site_id: "${coop_id}", visit_type: "PREDATOR_PROOFING", scheduled_start: "2026-06-02T09:00:00Z", scheduled_end: "2026-06-02T11:00:00Z" }
              as: Customer
              as_user_id: "${hh_id}"
              captures: { v_p: $.data.id }
            - call: "POST /coopcare/service-visits/${v_p}/assign"
              payload: { technician_id: "tech-1" }
              as: Dispatcher
            - call: "POST /coopcare/service-visits/${v_p}/check-in"
              as: ServiceTech
              as_user_id: "tech-1"
            - call: "POST /coopcare/service-visits/${v_p}/complete"
              payload: { observed_flock_size: 6, actual_duration_minutes: 90 }
              as: ServiceTech
              as_user_id: "tech-1"
            - call: "POST /coopcare/sitting-routes"
              payload: { technician_id: "tech-9", route_date: "2026-09-10T00:00:00Z", zone_code: "URBAN", max_stops: 4 }
              as: Dispatcher
              captures: { route_id: $.data.id }
            - call: "POST /coopcare/sitting-routes/${route_id}/publish"
              as: Dispatcher
            - call: "POST /coopcare/sitting-engagements"
              payload: { household_id: "${hh_id}", coop_site_id: "${coop_id}", start_date: "2026-09-10T00:00:00Z", end_date: "2026-09-12T00:00:00Z", daily_window_start: "08:00" }
              as: Customer
              as_user_id: "${hh_id}"
              captures: { eng_id: $.data.id }
            - call: "POST /coopcare/sitting-engagements/${eng_id}/quote"
              as: Dispatcher
          trigger:
            - call: "POST /coopcare/sitting-engagements/${eng_id}/confirm"
              as: Customer
              as_user_id: "${hh_id}"
              captures: { err: $.data.error_id }
          assert:
            - "error_id == ERR_NO_ROUTE_AVAILABLE (no PUBLISHED URBAN route on 2026-09-11)"
            - "SittingEngagement.${eng_id}.status stays QUOTED"
            - "SittingRoute.${route_id}.committed_stops == 0 (atomic: the night-1 stop was not created either)"

      - name: visit_cancel_nonexistent_returns_not_found
        claim_type: priority_ordering
        grounds: ["validations[priority=4]", "errors[ERR_VISIT_NOT_FOUND]"]
        distinguishing_aspect: "Existence (priority 4) is evaluated before any state or business rule: cancelling a visit id that does not exist returns 404 ERR_VISIT_NOT_FOUND, never a state error."
