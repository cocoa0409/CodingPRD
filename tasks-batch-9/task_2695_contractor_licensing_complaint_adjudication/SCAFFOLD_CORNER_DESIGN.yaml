      - name: corner_renewal_one_day_past_the_grace_window_is_rejected
        claim_type: Temporal validation
        grounds:
          - validations[priority=68]
          - errors[ERR_RENEWAL_WINDOW_CLOSED]
          - constants[DELINQUENT_GRACE_DAYS]
        excluded_because:
          difficulty_instance: renewal_on_grace_day_ninety_succeeds_and_day_ninety_one_is_refused
          rationale: "That §1.8 boundary instance already renews on grace day 90 and then replays the identical call on day 91 expecting ERR_RENEWAL_WINDOW_CLOSED, so it covers both sides of the DELINQUENT_GRACE_DAYS edge; a standalone corner test would repeat the same setup and the same assertion."

      - name: corner_overlapping_verified_bond_period_is_rejected
        claim_type: Temporal validation
        grounds:
          - validations[priority=63]
          - errors[ERR_COVERAGE_PERIOD_OVERLAP]
          - calculations[bond_continuity_gap_days]
        excluded_because:
          difficulty_instance: bond_coverage_intervals_are_half_open_so_adjacent_periods_stack
          rationale: "The §1.8 overlap instance verifies both halves of the half-open rule on one licence — a record starting exactly on the incumbent's expiration_date verifies, and one starting a day earlier returns ERR_COVERAGE_PERIOD_OVERLAP — which subsumes any single-sided corner probe of the same validation."

      - name: corner_straddling_hearing_slot_is_rejected
        claim_type: Temporal validation
        grounds:
          - validations[priority=64]
          - errors[ERR_HEARING_SLOT_CONFLICT]
          - endpoints[POST /licensing/disciplinary-hearings]
        excluded_because:
          difficulty_instance: hearing_officer_calendar_rejects_a_straddling_slot_but_accepts_a_touching_one
          rationale: "That §1.8 instance books an incumbent hearing and then submits both a straddling slot (expecting ERR_HEARING_SLOT_CONFLICT) and a back-to-back slot (expecting 201) for the same officer, so the calendar rule is already pinned from both directions."

      - name: corner_third_concurrent_designation_is_rejected
        claim_type: Aggregate validation
        grounds:
          - validations[priority=52]
          - errors[ERR_QUALIFIER_CAPACITY_EXCEEDED]
          - constants[MAX_CONCURRENT_QUALIFICATIONS]
        excluded_because:
          difficulty_instance: qualifier_capacity_error_outranks_effective_date_error
          rationale: "The §1.8 priority-pair instance loads a qualifier to the 2-designation ceiling and then submits a third designation that also carries an out-of-term effective_from, asserting ERR_QUALIFIER_CAPACITY_EXCEEDED; that both establishes the aggregate bound and fixes its rank against priority 62."

      - name: corner_reinstatement_without_a_live_bond_is_rejected
        claim_type: Cascading validation
        grounds:
          - validations[priority=42]
          - validations[priority=46]
          - validations[priority=70]
        excluded_because:
          difficulty_instance: reinstatement_gated_on_bond_then_penalty_then_ce_states_in_priority_order
          rationale: "That §1.8 cross-entity instance walks reinstatement through ERR_BOND_COVERAGE_MISSING, then ERR_OUTSTANDING_OBLIGATIONS, then ERR_CE_HOURS_INSUFFICIENT on one suspended licence by clearing one blocker at a time, so each gate — including the bond gate this corner would test alone — is already exercised in its correct order."

      - name: corner_citation_on_an_unsubstantiated_investigation_is_rejected
        claim_type: Cross-entity validation
        grounds:
          - validations[priority=22]
          - errors[ERR_INVESTIGATION_NOT_SUBSTANTIATED]
          - endpoints[POST /licensing/citations]
        excluded_because:
          difficulty_instance: citation_issuance_blocked_until_its_investigation_is_substantiated
          rationale: "The §1.8 instance attempts the citation while the investigation is OPEN, expects ERR_INVESTIGATION_NOT_SUBSTANTIATED, then closes the case SUBSTANTIATED and reissues successfully — the same before/after pair a corner test would assert."

      - name: corner_claim_approval_before_the_basis_exists_is_rejected
        claim_type: Cross-entity validation
        grounds:
          - validations[priority=23]
          - errors[ERR_CLAIM_BASIS_NOT_ESTABLISHED]
          - endpoints[POST /licensing/recovery-fund-claims/{id}/adjudicate]
        excluded_because:
          difficulty_instance: recovery_claim_approval_blocked_until_its_complaint_is_closed_sanctioned
          rationale: "That §1.8 instance adjudicates a FINAL_CITATION claim while its complaint is still in CITATION_ISSUED (expecting ERR_CLAIM_BASIS_NOT_ESTABLISHED) and then again after the citation goes FINAL and the complaint closes sanctioned, covering both branches of the basis rule."

      - name: corner_renewal_with_a_coverage_gap_is_rejected
        claim_type: Priority Ordering
        grounds:
          - validations[priority=41]
          - errors[ERR_COVERAGE_CONTINUITY_GAP]
          - calculations[bond_continuity_gap_days]
        excluded_because:
          difficulty_instance: renewal_bond_continuity_error_outranks_ce_shortfall_error
          rationale: "The §1.8 priority-pair instance renews a licence that has both a mid-term bond gap and a CE shortfall and asserts ERR_COVERAGE_CONTINUITY_GAP, which establishes the gap rejection and its precedence over priority 70 in one pass."

      - name: corner_exam_below_the_pass_mark_blocks_submission
        claim_type: Cross-entity validation
        grounds:
          - validations[priority=51]
          - errors[ERR_EXAM_REQUIREMENT_UNMET]
          - endpoints[POST /licensing/license-applications/{id}/submit]
        excluded_because:
          difficulty_instance: exam_score_exactly_at_pass_mark_versus_one_point_below
          rationale: "That §1.8 boundary instance submits with a trade exam scored one point under the pass mark (expecting ERR_EXAM_REQUIREMENT_UNMET) and then with the score exactly at the mark (expecting success), so the pass/fail edge and the referential rule are both already covered."

  - section: endpoints
    instances:

      - name: corner_compliance_sweep_returns_its_inline_counter_payload
        claim_type: Computed read
        grounds:
          - endpoints[POST /licensing/compliance-sweeps]
          - "endpoints[POST /licensing/compliance-sweeps].output"
        distinguishing_aspect: "The sweep is the one endpoint whose output is an inline counter object rather than an entity: with nothing due it must still answer 200 with all three counters at 0 and swept_on equal to the clock date, so an implementation that returns a bare 204 or omits swept_on fails."
        test_recipe:
          setup:
            - "clock at 2026-08-01 with no licences, coverage records or claims on file"
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-08-01T00:00:00Z" }
              as: BoardAdmin
          trigger:
            - call: "POST /licensing/compliance-sweeps"
              payload: {}
              as: BoardAdmin
              captures: { swept: $.data.swept_on }
          assert:
            - "response http status == 200"
            - "response data.lapsed_coverage_count == 0"
            - "response data.expired_license_count == 0"
            - "response data.suspended_license_count == 0"
            - "${swept} == 2026-08-01"

