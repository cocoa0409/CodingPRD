      - name: duplicate_code_on_create_rejected
        claim_type: violation_to_error
        grounds:
          - validations.priority_39
          - errors.ERR_CODE_NOT_UNIQUE
          - entities.Furnace.fields.code
        distinguishing_aspect: |
          Uniqueness is enforced per collection on both code and account_code: a second furnace with code
          FUR-V9 is a 409 while the same code on a different collection is legal, and a duplicate customer
          account_code is the same error from a different entity.
        test_recipe:
          setup:
            - "Furnace FUR-V9 and Customer with account_code CUST-V9 already exist"
          setup_api_calls:
            - call: "POST /glass-plant/furnaces"
              payload: { code: "FUR-V9", design_pull_tpd: 300.00, refractory_life_total_units: 100000.00 }
              as: PlantManager
              captures: { f: "$.data.id" }
            - call: "POST /glass-plant/customers"
              payload: { name: "Xi Filling", account_code: "CUST-V9", palletization_standard: "EURO_1200x800", complaint_ppm_threshold: 5000.00 }
              as: PlantManager
              captures: { c: "$.data.id" }
          trigger:
            - call: "POST /glass-plant/furnaces"
              payload: { code: "FUR-V9", design_pull_tpd: 450.00, refractory_life_total_units: 200000.00 }
              as: PlantManager
          assert:
            - "HTTP 409 and data.error_id == ERR_CODE_NOT_UNIQUE"
            - "GET /glass-plant/furnaces returns total_count 1 and Furnace.${f}.design_pull_tpd is still 300.00"
            - "a second customer with account_code CUST-V9 also returns 409 ERR_CODE_NOT_UNIQUE"
            - "a forming machine on ${f} with code FUR-V9 returns 201 (uniqueness is per collection)"

      - name: pallet_standard_change_blocks_ship_until_reverted
        claim_type: conditional_validation
        grounds:
          - validations.priority_45
          - errors.ERR_PALLET_STANDARD_MISMATCH
          - endpoints.PATCH_/glass-plant/customers/{customer_id}/palletization-standard
        distinguishing_aspect: |
          The lot carries a palletization_standard snapshot taken at pack time, so switching the customer to
          GMA_1200x1000 after palletization blocks the ship with 409 while pallet_count stays 1667; reverting
          the customer to EURO_1200x800 lets the same ship succeed.
        test_recipe:
          setup:
