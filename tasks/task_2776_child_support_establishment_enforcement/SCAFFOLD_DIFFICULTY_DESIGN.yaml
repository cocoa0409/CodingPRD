            - call: "POST /child-support/participants"
              payload: { role_type: "NONCUSTODIAL_PARTY", full_name: "Vic Vance", ssn_last4: "3535", residence_state_code: "MN", monthly_gross_income_cents: 330000, income_verification_source: "VERIFIED_WAGE_RECORD", supports_second_family: false, has_valid_drivers_license: true }
              as: CaseWorker
              captures: { ncp_id: $.data.id }
            - call: "POST /child-support/participants/${ncp_id}/locate-results"
