      - name: reconcile_returns_surface_to_available_only_at_buffer_end
        claim_type: Conditional cascade
        grounds:
          - state_machines.SupportSurface.CLEANING_to_AVAILABLE
          - entities.SupportSurface.fields.available_from
          - global_constants.RECLEAN_BUFFER_HOURS
          - endpoints[POST /_clock/set_current_utc]
        distinguishing_aspect: "The reclean release is guarded on `logical clock >= surface.available_from`, so two identical reconciles on two identical assets diverge purely on the clock: at 2026-08-04T00:00:00Z the asset stays CLEANING, and at exactly 2026-08-04T12:00:00Z (the inclusive bound) it returns to AVAILABLE. The billing dimension reaches RECONCILED either way."
        test_recipe:
          setup:
            - "Unit 3E exists with cap 500000 and ADMITTED patient MRN-H6."
            - "SupportSurfaces BED-090 and BED-091 are both AVAILABLE at daily_rate_cents 10000."
            - "Orders O1 (on BED-090) and O2 (on BED-091) both cover 2026-08-01T00:00:00Z..2026-08-04T00:00:00Z with authorized_days 3; both were approved, delivered and returned at 2026-08-04T00:00:00Z, so both assets are CLEANING with available_from 2026-08-04T12:00:00Z."
            - "The logical clock is at 2026-08-04T00:00:00Z when the returns are recorded."
          setup_api_calls:
            - call: "POST /units"
              payload: { unit_code: "3E", name: "Three East", bed_count: 18, rental_budget_cap_cents: 500000 }
              as: WocProgramDirector
