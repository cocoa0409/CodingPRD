  - rule_id: transitive_cascade
    instances:
      - name: keyset_compromise_cascades_five_links_to_patch_release
        grounds:
          - state_machines.Keyset.ACTIVE_to_COMPROMISED
          - state_machines.SubscriberUnit.KEYED_to_KEY_STALE
          - state_machines.Talkgroup.ACTIVE_to_LOCKED
          - state_machines.InteropPatch.ACTIVE_to_RELEASED
          - calculations.patch_duration
          - entities.Talkgroup.fields.active_patch_count
          - entities.MemberAgency.fields.active_patch_request_count
        distinguishing_aspect: |
          Depth-5 cascade whose trigger is Keyset ACTIVE -> COMPROMISED: the
          keyset going COMPROMISED is what staled the units, the units going
          KEY_STALE is what left the agency with zero keyed radios and locked its
          ENCRYPTED talkgroups, the talkgroups locking is what released the ACTIVE
          patch, and the release is what forced the two counters to zero. No link
          is a direct fan-out from the compromise call.
        test_recipe:
          setup:
            - "Logical clock at 2026-08-01T00:00:00Z throughout."
            - "Site MC-1 surveyed at 985/1000 with GENERATOR backup, so coverage_reliability_pct is 98.0 and coverage_class is MISSION_CRITICAL."
            - "MemberAgency G: agency_type LAW, interop_privilege PATCH_AUTHORITY, recorder_retention_days 180, billing_status CURRENT."
            - "Two Talkgroups owned by G, both encryption_mode ENCRYPTED and homed on MC-1: TAC1 (tg_decimal_id 101) and TAC2 (tg_decimal_id 102)."
            - "Exactly one SubscriberUnit of G is ASSIGNED and has been rekeyed to key_status KEYED on ACTIVE keyset KS-CMP-1, so Keyset.loaded_unit_count is 1 and G has exactly one keyed radio."
            - "One InteropPatch TAC1 -> TAC2 requested by G is in status ACTIVE with activated_at 2026-08-01T00:00:00Z."
