scenario: "2319. Hydroelectric Project Relicensing (hydroelectric licensee): license expiration timeline with pre-application document filing and study plan development, resource studies across fish passage, water quality, recreation and cultural resources with agency consultation, stakeholder settlement negotiation with agencies, tribes and nongovernmental organizations, water quality certification from the state with conditions incorporated into the license, protection, mitigation and enhancement measures with cost estimation and generation impact, license application filing, environmental review and order issuance with compliance conditions, dam safety, public safety and emergency action plan obligations, annual compliance reporting and license amendment procedures"

domain_name: hydroelectric-project-relicensing
api_prefix: /relicensing

complexity_profile:
  primary_archetype: multi_party_negotiation
  secondary_archetype: compliance_audit
  complexity_layers:
    - cascading_side_effects
    - dual_variant_calculation
    - version_pinning_on_approval
    - optimistic_concurrency
    - ops_run_checkpoint
    - derived_field_reconciliation

  entity_topology: flat
  # Peer collections under a single /relicensing namespace; every cross-entity link is an
  # explicit FK field in the request body, never a nested URL ownership chain.

  state_machine_shape: cyclic
  # Ten machines. StudyPlan (review -> revision -> review), Settlement (negotiation rounds),
  # ResourceStudy (two independent dimensions that feed each other), LicenseApplication
  # (deficiency loop + parallel EA dimension), LicenseOrder (flag -> cure -> flag),
  # ComplianceObligation (overdue -> reschedule) and ConsultationComment (resolve -> reopen)
  # are all non-linear; RelicensingProject additionally carries a derived posture that gates
  # child operations.

  relationship_patterns:
    - one_to_many          # RelicensingProject -> StudyPlan / StudySite / Dam / SettlementParty / PmeMeasure
    - many_to_many         # Settlement <-> SettlementParty via SettlementSignature
    - self_referential     # PmeMeasure.prerequisite_measure_id -> PmeMeasure.id (acyclic DAG, enforced)
    - cross_aggregate      # ComplianceObligation -> PmeMeasure and -> Dam across aggregate roots
    - polymorphic          # ComplianceObligation targets either a PmeMeasure or a Dam by obligation_type

  role_model: segregation_of_duties
  # The Licensee user who created a PmeMeasure may not be the Licensee user who signs off its
  # DEFINITIVE cost estimate; AgencyReviewer / Stakeholder are both backed by SettlementParty
  # but are separated by party_type; StateCertifier owns the water-quality decision alone.

  consistency_model: immediate

response_envelope:
  success: |
    { "meta": { "api_request_id": "req_xxx", "api_request_timestamp": "ISO8601" },
      "response_type": "object" | "array", "data": {} }
  error: |
    { "meta": { ... }, "response_type": "error",
      "data": { "error_id": "ERR_XXX", "message": "..." } }
  pagination_fields: ["limit", "offset", "total_count", "has_more"]
  pagination_defaults: { limit: 10, min: 1, max: 100, offset: 0 }

# =============================================================================
# §1.1 Entity-Relationship Table
# =============================================================================
entities:
  - name: RelicensingProject
    parent: null
    common_fields: true
    fields:
      - name: license_number
        type: string
        source: input
        description: "Existing license identifier being relicensed"
        constraints: "non-empty; globally unique across RelicensingProject"
      - name: project_name
        type: string
        source: input
        description: "Human-readable project name"
      - name: installed_capacity_mw
        type: number
        source: input
        description: "Nameplate capacity in MW"
        constraints: "> 0"
      - name: base_annual_generation_mwh
        type: number
        source: input
        description: "Average annual generation before any mitigation measure, in MWh; denominator of burden_ratio_pct"
        constraints: "> 0"
      - name: license_expiration_date
        type: string
        source: input
        description: "Expiration date of the existing license; anchors every statutory deadline"
        constraints: "ISO 8601 date (YYYY-MM-DD); must be strictly after the logical clock date at creation"
      - name: infeasibility_waiver_granted
        type: boolean
        source: input
        default: false
        description: "Conditional flag carried over from the prior license order; when true the burden-ratio ceiling is not enforced at application filing"
      - name: stage
        type: enum
        source: system
        default: PRE_FILING
        description: "Relicensing lifecycle stage"
        constraints: "PRE_FILING | PAD_FILED | STUDY_PHASE | APPLICATION_FILED | UNDER_ENVIRONMENTAL_REVIEW | LICENSED"
      - name: pad_filed_at
        type: datetime
        source: system
        default: null
        description: "Logical-clock instant the pre-application document was filed"
      - name: pad_year
        type: integer
        source: system
        default: null
        description: "Calendar year of pad_filed_at; base year for PME cost escalation"
      - name: application_filed_at
        type: datetime
        source: system
        default: null
        description: "Logical-clock instant the ORIGINAL_RELICENSE application was filed"
      - name: timeline_posture
        type: enum
        source: computed
        default: ON_TRACK
        description: "Persisted deadline posture from calculations.relicensing_timeline_posture; refreshed only by PAD filing, application filing and run-compliance-sweep"
        constraints: "ON_TRACK | AT_RISK | DELINQUENT"
      - name: regulatory_posture
        type: enum
        source: computed
        default: OPEN
        description: "Derived gate from calculations.project_regulatory_posture; recomputed at the end of every request that mutates this project or any of its children"
        constraints: "OPEN | RESTRICTED | FROZEN"
      - name: total_pme_annual_cost_usd
        type: number
        source: computed
        default: 0
        description: "Sum of PmeMeasure.annual_cost_usd over measures of this project with status IN {INCLUDED, IMPLEMENTED}"
      - name: total_generation_loss_mwh
        type: number
        source: computed
        default: 0
        description: "Sum of PmeMeasure.annual_generation_loss_mwh over the same INCLUDED/IMPLEMENTED set"
      - name: administrative_annual_charge_usd
        type: number
        source: computed
        default: 0
        description: "Tiered administrative charge from calculations.project_burden_ledger; tier is keyed on the pre-charge total_pme_annual_cost_usd"
      - name: total_annual_burden_usd
        type: number
        source: computed
        default: 0
        description: "total_pme_annual_cost_usd + administrative_annual_charge_usd + energy value of total_generation_loss_mwh"
      - name: burden_ratio_pct
        type: number
        source: computed
        default: 0
        description: "total_annual_burden_usd as a percentage of base_annual_generation_mwh * ENERGY_PRICE_USD_PER_MWH"
      - name: economically_infeasible
        type: boolean
        source: computed
        default: false
        description: "True iff burden_ratio_pct >= BURDEN_RATIO_LIMIT_PCT (15.00)"
      - name: wqc_status
        type: enum
        source: computed
        default: NONE
        description: "Mirror of the status of the most recently created WaterQualityCertification of this project (by created_at DESC)"
        constraints: "NONE | REQUESTED | CERTIFIED_WITH_CONDITIONS | DENIED | WAIVED"
      - name: unresolved_mandatory_comment_count
        type: integer
        source: computed
        default: 0
        description: "Count of ConsultationComment rows with is_mandatory_condition == true and resolution_status == OPEN whose StudyPlan belongs to this project and has status != SUPERSEDED"
      - name: open_deficiency_count
        type: integer
        source: computed
        default: 0
        description: "Count of LicenseApplication rows of this project with filing_status == DEFICIENT"
      - name: compliance_flag_count
        type: integer
        source: computed
        default: 0
        description: "Count of LicenseOrder rows of this project with compliance_state == COMPLIANCE_FLAGGED"
      - name: last_sweep_at
        type: datetime
        source: system
        default: null
        description: "Logical-clock instant of the last run-compliance-sweep on this project"

  - name: Dam
    parent: null
    common_fields: true
    fields:
      - name: project_id
        type: string
        source: input
        description: "FK -> RelicensingProject.id; owning project"
      - name: dam_code
        type: string
        source: input
        description: "Structure identifier"
        constraints: "unique per project_id"
      - name: hazard_class
        type: enum
        source: input
        description: "Dam-safety hazard potential classification"
        constraints: "HIGH | SIGNIFICANT | LOW"
      - name: inspection_interval_months
        type: integer
        source: input
        description: "Months from license effective_date to the first dam-safety inspection due date"
        constraints: "6 <= value <= 60"
      - name: eap_exercise_required
        type: boolean
        source: input
        default: true
        description: "When true, order issuance creates an EAP_EXERCISE obligation for this dam"
      - name: max_concurrent_field_activities
        type: integer
        source: input
        default: 1
        description: "Aggregate capacity: maximum number of SCHEDULED/OVERDUE obligations whose closed activity windows may intersect any single instant at this dam"
        constraints: ">= 1"

  - name: StudySite
    parent: null
    common_fields: true
    fields:
      - name: project_id
        type: string
        source: input
        description: "FK -> RelicensingProject.id; owning project"
      - name: site_code
        type: string
        source: input
        description: "Field site identifier"
        constraints: "unique per project_id"
      - name: river_mile
        type: number
        source: input
        description: "River mile of the site, for reporting only"
      - name: min_rest_buffer_days
        type: integer
        source: input
        default: 0
        description: "Mandatory quiet period in days that must elapse after an occupying fieldwork window ends before the next window may start at this site"
        constraints: ">= 0"
      - name: cultural_sensitivity
        type: enum
        source: input
        default: NONE
        description: "Tribal cultural-resource sensitivity of the site"
        constraints: "NONE | MODERATE | HIGH"

  - name: StudyPlan
    parent: null
    common_fields: true
    fields:
      - name: project_id
        type: string
        source: input
        description: "FK -> RelicensingProject.id; owning project"
      - name: plan_title
        type: string
        source: input
        description: "Title of the study plan filed for agency review"
      - name: status
        type: enum
        source: system
        default: DRAFT
        description: "Study-plan review state"
        constraints: "DRAFT | UNDER_AGENCY_REVIEW | REVISION_REQUIRED | APPROVED | SUPERSEDED"
      - name: revision_round
        type: integer
        source: system
        default: 0
        description: "Incremented by each REQUIRE_REVISION determination"
      - name: submitted_at
        type: datetime
        source: system
        default: null
        description: "Logical-clock instant of the most recent submit"
      - name: approved_at
        type: datetime
        source: system
        default: null
        description: "Logical-clock instant of the APPROVE determination"
      - name: open_comment_count
        type: integer
        source: computed
        default: 0
        description: "Count of ConsultationComment rows of this plan with resolution_status == OPEN"
      - name: unresolved_mandatory_comment_count
        type: integer
        source: computed
        default: 0
        description: "Count of ConsultationComment rows of this plan with is_mandatory_condition == true and resolution_status == OPEN"
      - name: attached_study_count
        type: integer
        source: computed
        default: 0
        description: "Count of ResourceStudy rows whose study_plan_id is this plan"

  - name: ResourceStudy
    parent: null
    common_fields: true
    fields:
      - name: study_plan_id
        type: string
        source: input
        description: "FK -> StudyPlan.id; plan this study belongs to"
      - name: site_id
        type: string
        source: input
        description: "FK -> StudySite.id; field site whose fieldwork calendar this study occupies"
      - name: resource_category
        type: enum
        source: input
        description: "Resource discipline of the study"
        constraints: "FISH_PASSAGE | WATER_QUALITY | RECREATION | CULTURAL"
      - name: study_title
        type: string
        source: input
        description: "Title of the resource study"
      - name: fieldwork_window_start
        type: string
        source: input
        description: "Half-open fieldwork window start (inclusive), ISO 8601 date"
      - name: fieldwork_window_end
        type: string
        source: input
        description: "Half-open fieldwork window end (exclusive), ISO 8601 date"
        constraints: "must be strictly after fieldwork_window_start"
      - name: cultural_clearance_reference
        type: string
        source: input
        default: null
        description: "Tribal or state historic-preservation clearance reference; required only when the site's cultural_sensitivity == HIGH, stored verbatim otherwise"
      - name: fieldwork_status
        type: enum
        source: system
        default: PLANNED
        description: "First independent dimension: physical field effort"
        constraints: "PLANNED | IN_PROGRESS | SUSPENDED | COMPLETED"
      - name: review_status
        type: enum
        source: system
        default: NOT_SUBMITTED
        description: "Second independent dimension: agency review of the study report"
        constraints: "NOT_SUBMITTED | UNDER_REVIEW | ACCEPTED | ADDITIONAL_REQUIRED"
      - name: additional_round_count
        type: integer
        source: system
        default: 0
        description: "Number of ADDITIONAL_REQUIRED review decisions received; capped at MAX_ADDITIONAL_STUDY_ROUNDS"
      - name: report_submitted_at
        type: datetime
        source: system
        default: null
        description: "Logical-clock instant of the most recent report submission"
      - name: report_submitted_by_user_id
        type: string
        source: system
        default: null
        description: "X-User-ID of the Licensee user who submitted the most recent report"

  - name: ConsultationComment
    parent: null
    common_fields: false
    fields:
      - name: study_plan_id
        type: string
        source: input
        description: "FK -> StudyPlan.id; plan the comment was filed against"
      - name: party_id
        type: string
        source: input
        description: "FK -> SettlementParty.id; authoring consulted party, must equal the acting X-User-ID"
      - name: resource_category
        type: enum
        source: input
        description: "Resource discipline the comment concerns"
        constraints: "FISH_PASSAGE | WATER_QUALITY | RECREATION | CULTURAL"
      - name: comment_text
        type: string
        source: input
        description: "Comment body"
        constraints: "non-empty"
      - name: is_mandatory_condition
        type: boolean
        source: computed
        description: "True iff the authoring SettlementParty.has_conditioning_authority == true at filing time"
      - name: resolution_status
        type: enum
        source: system
        default: OPEN
        description: "Licensee disposition state of the comment"
        constraints: "OPEN | RESOLVED"
      - name: disposition
        type: enum
        source: system
        default: null
        description: "Recorded disposition when resolution_status == RESOLVED"
        constraints: "ADOPTED | DEFERRED | REJECTED"
      - name: resolved_at
        type: datetime
        source: system
        default: null
        description: "Logical-clock instant of the most recent resolve"
      - name: reopen_count
        type: integer
        source: system
        default: 0
        description: "Times this comment was reopened by a REQUIRE_REVISION determination"

  - name: SettlementParty
    parent: null
    common_fields: true
    fields:
      - name: project_id
        type: string
        source: input
        description: "FK -> RelicensingProject.id; project the party is consulted on"
      - name: party_name
        type: string
        source: input
        description: "Name of the agency, tribe or nongovernmental organization"
      - name: party_type
        type: enum
        source: input
        description: "Stakeholder class; AGENCY acts as AgencyReviewer, TRIBE and NGO act as Stakeholder"
        constraints: "AGENCY | TRIBE | NGO"
      - name: has_conditioning_authority
        type: boolean
        source: input
        default: false
        description: "Mandatory conditioning authority: comments are mandatory conditions and an OPPOSE position vetoes settlement execution"
        constraints: "may be true only when party_type == AGENCY"
      - name: vote_weight
        type: integer
        source: input
        description: "Weight of this party in settlement support tallies"
        constraints: ">= 1"

  - name: Settlement
    parent: null
    common_fields: true
    fields:
      - name: project_id
        type: string
        source: input
        description: "FK -> RelicensingProject.id; project under negotiation"
      - name: title
        type: string
        source: input
        description: "Title of the settlement agreement"
      - name: status
        type: enum
        source: system
        default: NEGOTIATING
        description: "Negotiation state; rounds cycle CIRCULATED -> NEGOTIATING"
        constraints: "NEGOTIATING | CIRCULATED | EXECUTED | FAILED | WITHDRAWN | SUPERSEDED"
      - name: round_number
        type: integer
        source: system
        default: 1
        description: "Current negotiation round; incremented by a CLOSE_ROUND tally"
        constraints: "1 <= value <= MAX_NEGOTIATION_ROUNDS (3)"
      - name: circulated_at
        type: datetime
        source: system
        default: null
        description: "Logical-clock instant the current round was circulated for signature"
      - name: executed_at
        type: datetime
        source: system
        default: null
        description: "Logical-clock instant of execution"
      - name: withdrawn_at
        type: datetime
        source: system
        default: null
        description: "Logical-clock instant of withdrawal"
      - name: support_pct
        type: number
        source: computed
        default: 0
        description: "Support percentage from calculations.settlement_support_tally for the most recently tallied round"
      - name: total_vote_weight
        type: integer
        source: computed
        default: 0
        description: "Sum of vote_weight over all SettlementParty rows of the project at tally time"
      - name: included_measure_count
        type: integer
        source: computed
        default: 0
        description: "Count of PmeMeasure rows with settlement_id == this settlement and status == INCLUDED"

  - name: SettlementSignature
    parent: null
    common_fields: false
    fields:
      - name: settlement_id
        type: string
        source: input
        description: "FK -> Settlement.id; settlement being signed"
      - name: party_id
        type: string
        source: input
        description: "FK -> SettlementParty.id; signing party, must equal the acting X-User-ID"
      - name: round_number
        type: integer
        source: system
        description: "Copied from Settlement.round_number at signing; one signature per (settlement_id, party_id, round_number)"
      - name: position
        type: enum
        source: input
        description: "Recorded position of the party for this round"
        constraints: "SUPPORT | OPPOSE | ABSTAIN"
      - name: share_pct
        type: number
        source: computed
        description: "round(party.vote_weight / project total_vote_weight * 100, 2) at signing time; summed by the tally for SUPPORT signatures only"
      - name: signed_at
        type: datetime
        source: system
        description: "Logical-clock instant of signing"

  - name: WaterQualityCertification
    parent: null
    common_fields: true
    fields:
      - name: project_id
        type: string
        source: input
        description: "FK -> RelicensingProject.id; project seeking certification"
      - name: certifying_agency_name
        type: string
        source: input
        description: "State water-quality agency name"
      - name: status
        type: enum
        source: system
        default: REQUESTED
        description: "Certification state; WAIVED is produced only by the statutory clock in run-compliance-sweep"
        constraints: "REQUESTED | CERTIFIED_WITH_CONDITIONS | DENIED | WAIVED"
      - name: requested_at
        type: datetime
        source: system
        description: "Logical-clock instant of the request"
      - name: statutory_waiver_date
        type: string
        source: computed
        description: "requested_at date + WQC_WAIVER_MONTHS (12), day-of-month clamped to month end; ISO 8601 date"
      - name: decided_at
        type: datetime
        source: system
        default: null
        description: "Logical-clock instant of the certifier decision or of the waiver sweep"
      - name: condition_count
        type: integer
        source: computed
        default: 0
        description: "Count of PmeMeasure rows created by this certification (source == WQC_CONDITION)"
      - name: denial_reason
        type: string
        source: system
        default: null
        description: "Reason text recorded on a DENY decision"

  - name: PmeMeasure
    parent: null
    common_fields: true
    fields:
      - name: project_id
        type: string
        source: input
        description: "FK -> RelicensingProject.id; project the measure applies to"
      - name: settlement_id
        type: string
        source: input
        default: null
        description: "FK -> Settlement.id; set only when source == SETTLEMENT, the settlement whose execution includes this measure"
      - name: prerequisite_measure_id
        type: string
        source: input
        default: null
        description: "FK -> PmeMeasure.id; measure that must be implemented first; the prerequisite graph must stay acyclic"
      - name: measure_name
        type: string
        source: input
        description: "Name of the protection, mitigation or enhancement measure"
      - name: resource_category
        type: enum
        source: input
        description: "Resource discipline; selects AMORTIZATION_YEARS_BY_CATEGORY"
        constraints: "FISH_PASSAGE | WATER_QUALITY | RECREATION | CULTURAL"
      - name: source
        type: enum
        source: input
        description: "Origin of the measure; WQC_CONDITION is producible only by the water-quality certification cascade and is rejected as request input"
        constraints: "SETTLEMENT | WQC_CONDITION | AGENCY_PRESCRIPTION | LICENSEE_PROPOSED"
      - name: status
        type: enum
        source: system
        default: PROPOSED
        description: "Measure lifecycle state"
        constraints: "PROPOSED | INCLUDED | IMPLEMENTED | WITHDRAWN | SUPERSEDED"
      - name: capital_cost_usd
        type: number
        source: input
        description: "Unescalated capital cost estimate in USD"
        constraints: ">= 0"
      - name: annual_om_cost_usd
        type: number
        source: input
        description: "Annual operation and maintenance cost in USD"
        constraints: ">= 0"
      - name: construction_start_year
        type: integer
        source: input
        description: "Calendar year construction begins; escalation exponent is max(0, this - project.pad_year)"
      - name: implementation_months
        type: integer
        source: input
        description: "Months from license effective_date to the implementation due date of this measure"
        constraints: ">= 0"
      - name: flow_release_cfs
        type: number
        source: input
        default: 0
        description: "Instream flow release required by the measure, in cubic feet per second"
        constraints: ">= 0"
      - name: gross_head_ft
        type: number
        source: input
        default: 0
        description: "Gross head bypassed by the release, in feet; used only by the DEFINITIVE generation variant"
        constraints: ">= 0"
      - name: release_days
        type: integer
        source: input
        default: 0
        description: "Days per year the release applies"
        constraints: ">= 0"
      - name: cost_estimate_variant
        type: enum
        source: computed
        default: PRELIMINARY
        description: "Which variant of calculations.pme_cost_and_generation_impact produced the persisted numbers"
        constraints: "PRELIMINARY | DEFINITIVE"
      - name: escalated_capital_usd
        type: number
        source: computed
        default: 0
        description: "Capital cost after contingency and escalation, per the active variant"
      - name: annualized_capital_usd
        type: number
        source: computed
        default: 0
        description: "escalated_capital_usd divided by AMORTIZATION_YEARS_BY_CATEGORY[resource_category]"
      - name: annual_cost_usd
        type: number
        source: computed
        default: 0
        description: "annualized_capital_usd + annual_om_cost_usd"
      - name: annual_generation_loss_mwh
        type: number
        source: computed
        default: 0
        description: "Annual generation forgone by the measure, per the active variant"
      - name: annual_generation_value_usd
        type: number
        source: computed
        default: 0
        description: "annual_generation_loss_mwh * ENERGY_PRICE_USD_PER_MWH"
      - name: annual_burden_usd
        type: number
        source: computed
        default: 0
        description: "annual_cost_usd + annual_generation_value_usd"
      - name: created_by_user_id
        type: string
        source: system
        description: "X-User-ID of the Licensee user who created the measure"
      - name: definitive_estimate_by_user_id
        type: string
        source: system
        default: null
        description: "X-User-ID of the Licensee user who recorded the DEFINITIVE estimate; must differ from created_by_user_id"

  - name: LicenseApplication
    parent: null
    common_fields: true
    fields:
      - name: project_id
        type: string
        source: input
        description: "FK -> RelicensingProject.id; project the application belongs to"
      - name: amends_order_id
        type: string
        source: input
        default: null
        description: "FK -> LicenseOrder.id; required when application_type == AMENDMENT, forbidden otherwise"
      - name: application_type
        type: enum
        source: input
        description: "Filing type"
        constraints: "ORIGINAL_RELICENSE | AMENDMENT"
      - name: filing_status
        type: enum
        source: system
        default: FILED
        description: "First independent dimension: administrative processing state"
        constraints: "FILED | UNDER_REVIEW | DEFICIENT | SUSPENDED | LICENSED | SUPERSEDED"
      - name: ea_stage
        type: enum
        source: system
        default: NOT_STARTED
        description: "Second independent dimension: environmental review stage"
        constraints: "NOT_STARTED | SCOPING | DRAFT_EA | FINAL_EA"
      - name: filed_at
        type: datetime
        source: system
        description: "Logical-clock instant of filing"
      - name: pinned_study_plan_id
        type: string
        source: system
        description: "Snapshot reference to the StudyPlan.id (project's plan with status == APPROVED) pinned at filing; not a navigational FK"
      - name: pinned_study_plan_version
        type: integer
        source: system
        description: "StudyPlan.version observed at filing; a later plan mutation makes the pin stale"
      - name: pinned_settlement_id
        type: string
        source: system
        default: null
        description: "Snapshot reference to the Settlement.id with status == EXECUTED pinned at filing, null when the project filed without a settlement; not a navigational FK"
      - name: pinned_settlement_version
        type: integer
        source: system
        default: null
        description: "Settlement.version observed at filing"
      - name: pinned_measure_ids
        type: array
        source: system
        description: "Ids of PmeMeasure rows with status IN {INCLUDED, IMPLEMENTED} at filing, ordered by created_at ASC"
      - name: pinned_total_annual_burden_usd
        type: number
        source: system
        description: "project.total_annual_burden_usd observed at filing"
      - name: deficiency_count
        type: integer
        source: system
        default: 0
        description: "Number of deficiency notices issued against this application"
      - name: last_deficiency_note
        type: string
        source: system
        default: null
        description: "Text of the most recent deficiency notice"

  - name: LicenseOrder
    parent: null
    common_fields: true
    fields:
      - name: application_id
        type: string
        source: input
        description: "FK -> LicenseApplication.id; application the order was issued on"
      - name: order_number
        type: string
        source: input
        description: "Order identifier assigned by the regulator"
        constraints: "non-empty; globally unique"
      - name: effective_date
        type: string
        source: system
        description: "Logical-clock date at issuance; anchor for every obligation due date and for the LICENSE_ANNIVERSARY reporting basis"
      - name: compliance_state
        type: enum
        source: system
        default: EFFECTIVE
        description: "Compliance posture of the order; cycles EFFECTIVE -> COMPLIANCE_FLAGGED -> EFFECTIVE"
        constraints: "EFFECTIVE | COMPLIANCE_FLAGGED | SUPERSEDED"
      - name: amendment_pending
        type: boolean
        source: system
        default: false
        description: "True while an AMENDMENT application referencing this order is in filing_status IN {FILED, UNDER_REVIEW, DEFICIENT}"
      - name: article_count
        type: integer
        source: computed
        default: 0
        description: "Count of ComplianceObligation rows created for this order"
      - name: open_violation_count
        type: integer
        source: computed
        default: 0
        description: "Count of ComplianceObligation rows of this order with status == OVERDUE"
      - name: last_report_basis
        type: enum
        source: system
        default: null
        description: "Reporting-period basis used by the most recent annual compliance report"
        constraints: "CALENDAR | LICENSE_ANNIVERSARY"
      - name: last_report_period_year
        type: integer
        source: system
        default: null
        description: "period_year of the most recent annual compliance report"
      - name: assessed_obligation_count
        type: integer
        source: computed
        default: 0
        description: "Obligations whose due_date fell inside the most recent report's window"
      - name: noncompliant_obligation_count
        type: integer
        source: computed
        default: 0
        description: "Assessed obligations that were not CERTIFIED and whose due_date was already past at report time"
      - name: compliance_score
        type: number
        source: computed
        default: 100
        description: "round(100 * (assessed_obligation_count - noncompliant_obligation_count) / assessed_obligation_count, 2); defined as 100.00 when assessed_obligation_count == 0"
      - name: last_report_filed_at
        type: datetime
        source: system
        default: null
        description: "Logical-clock instant the most recent annual compliance report was filed"

  - name: ComplianceObligation
    parent: null
    common_fields: true
    fields:
      - name: order_id
        type: string
        source: input
        description: "FK -> LicenseOrder.id; order that imposes the obligation"
      - name: pme_measure_id
        type: string
        source: input
        default: null
        description: "FK -> PmeMeasure.id; set only for obligation_type == PME_IMPLEMENTATION"
      - name: dam_id
        type: string
        source: input
        default: null
        description: "FK -> Dam.id; set for DAM_SAFETY_INSPECTION, PUBLIC_SAFETY_SIGNAGE and EAP_EXERCISE obligations"
      - name: obligation_type
        type: enum
        source: system
        description: "Kind of compliance condition"
        constraints: "PME_IMPLEMENTATION | DAM_SAFETY_INSPECTION | PUBLIC_SAFETY_SIGNAGE | EAP_EXERCISE"
      - name: due_date
        type: string
        source: system
        description: "ISO 8601 date the obligation must be certified by; from calculations.obligation_schedule_generation"
      - name: status
        type: enum
        source: system
        default: PENDING
        description: "Obligation lifecycle state"
        constraints: "PENDING | SCHEDULED | OVERDUE | CERTIFIED | WAIVED"
      - name: activity_window_start
        type: string
        source: system
        default: null
        description: "Closed activity window start (inclusive) at the dam or measure site, ISO 8601 date"
      - name: activity_window_end
        type: string
        source: system
        default: null
        description: "Closed activity window end (inclusive), ISO 8601 date"
      - name: certified_at
        type: datetime
        source: system
        default: null
        description: "Logical-clock instant of certification"
      - name: certified_by_user_id
        type: string
        source: system
        default: null
        description: "X-User-ID of the Licensee user who certified completion"
      - name: overdue_marked_at
        type: datetime
        source: system
        default: null
        description: "Logical-clock instant the sweep marked this obligation OVERDUE"

# =============================================================================
# §1.2 State Machine Table
# =============================================================================
state_machines:
  - entity: RelicensingProject
    initial_state: PRE_FILING
    terminal_states: [LICENSED]
    transitions:
      - from: PRE_FILING
        to: PAD_FILED
        trigger: "POST /relicensing/projects/{project_id}/pre-application-document"
        actor: Licensee
        preconditions:
          - "stage == PRE_FILING"
          - "logical clock date <= pad_due_date (license_expiration_date minus PAD_LEAD_MONTHS = 66 months), else ERR_FILING_DEADLINE_PASSED"
        side_effects:
          - "set pad_filed_at = logical clock, pad_year = calendar year of pad_filed_at"
          - "recompute timeline_posture per calculations.relicensing_timeline_posture (next unmet milestone becomes application_due_date)"
          - "recompute regulatory_posture per calculations.project_regulatory_posture"
          - "increment RelicensingProject.version by 1"
      - from: PAD_FILED
        to: STUDY_PHASE
        trigger: "POST /relicensing/study-plans (first StudyPlan created for this project)"
        actor: Licensee
        preconditions: ["stage == PAD_FILED"]
        side_effects:
          - "stage = STUDY_PHASE"
          - "increment RelicensingProject.version by 1"
        note: "Automatic bubble-up: creating the first plan advances the project; later plans leave stage unchanged."
      - from: STUDY_PHASE
        to: APPLICATION_FILED
        trigger: "POST /relicensing/applications with application_type == ORIGINAL_RELICENSE"
        actor: Licensee
        preconditions:
          - "stage == STUDY_PHASE"
          - "regulatory_posture != FROZEN"
          - "the project has exactly one StudyPlan with status == APPROVED"
          - "every ResourceStudy of that plan has review_status == ACCEPTED"
          - "wqc_status IN {REQUESTED, CERTIFIED_WITH_CONDITIONS, WAIVED}"
          - "economically_infeasible == false OR infeasibility_waiver_granted == true"
          - "logical clock date <= application_due_date (license_expiration_date minus APPLICATION_LEAD_MONTHS = 24 months)"
        side_effects:
          - "set application_filed_at = logical clock"
          - "recompute timeline_posture (no unmet milestone remains -> ON_TRACK)"
          - "recompute regulatory_posture"
          - "increment RelicensingProject.version by 1"
      - from: APPLICATION_FILED
        to: UNDER_ENVIRONMENTAL_REVIEW
        trigger: "POST /relicensing/applications/{application_id}/environmental-review with target_stage == SCOPING"
        actor: Regulator
        preconditions: ["stage == APPLICATION_FILED"]
        side_effects:
          - "increment RelicensingProject.version by 1"
      - from: UNDER_ENVIRONMENTAL_REVIEW
        to: LICENSED
        trigger: "POST /relicensing/applications/{application_id}/order"
        actor: Regulator
        preconditions: ["stage == UNDER_ENVIRONMENTAL_REVIEW", "the application's ea_stage == FINAL_EA"]
        side_effects:
          - "recompute regulatory_posture"
          - "increment RelicensingProject.version by 1"
        note: "AMENDMENT applications are filed while stage == LICENSED and never change stage."

  - entity: StudyPlan
    initial_state: DRAFT
    terminal_states: [APPROVED, SUPERSEDED]
    transitions:
      - from: DRAFT
        to: UNDER_AGENCY_REVIEW
        trigger: "POST /relicensing/study-plans/{study_plan_id}/submit"
        actor: Licensee
        preconditions:
          - "status == DRAFT"
          - "attached_study_count >= 1, else ERR_INVALID_REQUEST (empty-plan boundary)"
          - "project.regulatory_posture != FROZEN"
        side_effects:
          - "set submitted_at = logical clock"
          - "increment StudyPlan.version by 1"
      - from: REVISION_REQUIRED
        to: UNDER_AGENCY_REVIEW
        trigger: "POST /relicensing/study-plans/{study_plan_id}/submit"
        actor: Licensee
        preconditions:
          - "status == REVISION_REQUIRED"
          - "attached_study_count >= 1"
          - "project.regulatory_posture != FROZEN"
        side_effects:
          - "set submitted_at = logical clock"
          - "increment StudyPlan.version by 1"
        note: "Revision cycle: REVISION_REQUIRED -> UNDER_AGENCY_REVIEW -> REVISION_REQUIRED may repeat without bound."
      - from: UNDER_AGENCY_REVIEW
        to: APPROVED
        trigger: "POST /relicensing/study-plans/{study_plan_id}/determination with determination == APPROVE"
        actor: AgencyReviewer
        preconditions:
          - "status == UNDER_AGENCY_REVIEW"
          - "acting SettlementParty.has_conditioning_authority == true, else ERR_ROLE_NOT_PERMITTED"
          - "unresolved_mandatory_comment_count == 0, else ERR_UNRESOLVED_MANDATORY_COMMENTS"
        side_effects:
          - "set approved_at = logical clock"
          - "recompute project.unresolved_mandatory_comment_count, then project.regulatory_posture"
          - "increment StudyPlan.version by 1"
      - from: UNDER_AGENCY_REVIEW
        to: REVISION_REQUIRED
        trigger: "POST /relicensing/study-plans/{study_plan_id}/determination with determination == REQUIRE_REVISION"
        actor: AgencyReviewer
        preconditions:
          - "status == UNDER_AGENCY_REVIEW"
          - "acting SettlementParty.has_conditioning_authority == true"
        side_effects:
          - "increment revision_round by 1"
          - "when reopen_deferred_comments == true: every ConsultationComment of this plan with resolution_status == RESOLVED and disposition == DEFERRED goes RESOLVED -> OPEN, disposition = null, reopen_count += 1"
          - "that comment reopening recomputes StudyPlan.open_comment_count and StudyPlan.unresolved_mandatory_comment_count"
          - "the recomputed plan counters recompute project.unresolved_mandatory_comment_count, which recomputes project.regulatory_posture (OPEN -> RESTRICTED when the restored count is > 0)"
          - "increment StudyPlan.version by 1"
        note: "Branching fork: the same endpoint reaches APPROVED or REVISION_REQUIRED with disjoint side-effect sets."
      - from: DRAFT
        to: SUPERSEDED
        trigger: "POST /relicensing/study-plans (a newer plan is created for the same project)"
        actor: Licensee
        preconditions: ["an existing plan of the project has status IN {DRAFT, UNDER_AGENCY_REVIEW, REVISION_REQUIRED}"]
        side_effects:
          - "the prior plan status = SUPERSEDED; its comments keep their resolution_status but stop counting toward project.unresolved_mandatory_comment_count"
          - "recompute project.unresolved_mandatory_comment_count, then project.regulatory_posture"
          - "increment the superseded StudyPlan.version by 1"
      - from: UNDER_AGENCY_REVIEW
        to: SUPERSEDED
        trigger: "POST /relicensing/study-plans (a newer plan is created for the same project)"
        actor: Licensee
        preconditions: ["status == UNDER_AGENCY_REVIEW"]
        side_effects:
          - "status = SUPERSEDED; recompute project.unresolved_mandatory_comment_count, then project.regulatory_posture"
          - "increment StudyPlan.version by 1"
      - from: REVISION_REQUIRED
        to: SUPERSEDED
        trigger: "POST /relicensing/study-plans (a newer plan is created for the same project)"
        actor: Licensee
        preconditions: ["status == REVISION_REQUIRED"]
        side_effects:
          - "status = SUPERSEDED; recompute project.unresolved_mandatory_comment_count, then project.regulatory_posture"
          - "increment StudyPlan.version by 1"
        note: "An APPROVED plan is never superseded; a second APPROVED plan cannot exist because submit is impossible from APPROVED."

  - entity: ConsultationComment
    initial_state: OPEN
    terminal_states: []
    transitions:
      - from: OPEN
        to: RESOLVED
        trigger: "POST /relicensing/comments/{comment_id}/resolve"
        actor: Licensee
        preconditions:
          - "resolution_status == OPEN, else ERR_COMMENT_ALREADY_RESOLVED"
          - "the parent StudyPlan.status IN {UNDER_AGENCY_REVIEW, REVISION_REQUIRED, DRAFT}"
        side_effects:
          - "set disposition = request disposition, resolved_at = logical clock"
          - "decrement StudyPlan.open_comment_count; when is_mandatory_condition == true also decrement StudyPlan.unresolved_mandatory_comment_count"
          - "that plan-counter change recomputes project.unresolved_mandatory_comment_count, which recomputes project.regulatory_posture (RESTRICTED -> OPEN when it reaches 0 and nothing else restricts)"
      - from: RESOLVED
        to: OPEN
        trigger: "POST /relicensing/study-plans/{study_plan_id}/determination with determination == REQUIRE_REVISION and reopen_deferred_comments == true"
        actor: AgencyReviewer
        preconditions: ["resolution_status == RESOLVED", "disposition == DEFERRED"]
        side_effects:
          - "disposition = null, reopen_count += 1"
          - "increment StudyPlan.open_comment_count and, for mandatory comments, StudyPlan.unresolved_mandatory_comment_count"
        note: "Compensating action for resolve; comments with disposition ADOPTED or REJECTED are never reopened."

  - entity: ResourceStudy
    initial_state: "PLANNED x NOT_SUBMITTED"
    terminal_states: ["COMPLETED x ACCEPTED"]
    transitions:
      - from: "fieldwork_status == PLANNED"
        to: "fieldwork_status == IN_PROGRESS"
        trigger: "POST /relicensing/studies/{study_id}/fieldwork with action == START"
        actor: Licensee
        preconditions:
          - "fieldwork_status == PLANNED, else ERR_STUDY_STATE_INVALID"
          - "the parent StudyPlan.status IN {UNDER_AGENCY_REVIEW, REVISION_REQUIRED, APPROVED}"
          - "project.regulatory_posture != FROZEN"
        side_effects: ["increment ResourceStudy.version by 1"]
      - from: "fieldwork_status == IN_PROGRESS"
        to: "fieldwork_status == SUSPENDED"
        trigger: "POST /relicensing/studies/{study_id}/fieldwork with action == SUSPEND"
        actor: Licensee
        preconditions: ["fieldwork_status == IN_PROGRESS"]
        side_effects: ["increment ResourceStudy.version by 1"]
        note: "A SUSPENDED study still occupies its site window."
      - from: "fieldwork_status == SUSPENDED"
        to: "fieldwork_status == IN_PROGRESS"
        trigger: "POST /relicensing/studies/{study_id}/fieldwork with action == RESUME"
        actor: Licensee
        preconditions: ["fieldwork_status == SUSPENDED"]
        side_effects: ["increment ResourceStudy.version by 1"]
      - from: "fieldwork_status == IN_PROGRESS"
        to: "fieldwork_status == COMPLETED"
        trigger: "POST /relicensing/studies/{study_id}/fieldwork with action == COMPLETE"
        actor: Licensee
        preconditions: ["fieldwork_status == IN_PROGRESS"]
        side_effects: ["increment ResourceStudy.version by 1"]
      - from: "review_status == NOT_SUBMITTED"
        to: "review_status == UNDER_REVIEW"
        trigger: "POST /relicensing/studies/{study_id}/report"
        actor: Licensee
        preconditions:
          - "review_status IN {NOT_SUBMITTED, ADDITIONAL_REQUIRED}"
          - "fieldwork_status == COMPLETED, else ERR_STUDY_STATE_INVALID (cross-dimension guard)"
        side_effects:
          - "set report_submitted_at = logical clock, report_submitted_by_user_id = acting X-User-ID"
          - "increment ResourceStudy.version by 1"
      - from: "review_status == ADDITIONAL_REQUIRED"
        to: "review_status == UNDER_REVIEW"
        trigger: "POST /relicensing/studies/{study_id}/report"
        actor: Licensee
        preconditions: ["review_status == ADDITIONAL_REQUIRED", "fieldwork_status == COMPLETED"]
        side_effects:
          - "set report_submitted_at = logical clock, report_submitted_by_user_id = acting X-User-ID"
          - "increment ResourceStudy.version by 1"
        note: "Review cycle: UNDER_REVIEW -> ADDITIONAL_REQUIRED -> UNDER_REVIEW."
      - from: "review_status == UNDER_REVIEW"
        to: "review_status == ACCEPTED"
        trigger: "POST /relicensing/studies/{study_id}/review-decision with decision == ACCEPT"
        actor: AgencyReviewer
        preconditions: ["review_status == UNDER_REVIEW"]
        side_effects: ["increment ResourceStudy.version by 1"]
      - from: "review_status == UNDER_REVIEW"
        to: "review_status == ADDITIONAL_REQUIRED"
        trigger: "POST /relicensing/studies/{study_id}/review-decision with decision == REQUIRE_ADDITIONAL"
        actor: AgencyReviewer
        preconditions:
          - "review_status == UNDER_REVIEW"
          - "additional_round_count < MAX_ADDITIONAL_STUDY_ROUNDS (2), else ERR_STUDY_STATE_INVALID"
        side_effects:
          - "additional_round_count += 1"
          - "cross-dimension side effect: fieldwork_status COMPLETED -> IN_PROGRESS on the same row"
          - "increment ResourceStudy.version by 1"
        note: "Parallel dimensions are independent on the forward path but this decision writes both."

  - entity: SettlementParty
    initial_state: REGISTERED
    terminal_states: [REGISTERED]
    transitions:
      - from: "(none)"
        to: REGISTERED
        trigger: "POST /relicensing/parties"
        actor: Regulator
        preconditions:
          - "project exists"
          - "has_conditioning_authority == true only when party_type == AGENCY, else ERR_INVALID_REQUEST"
        side_effects:
          - "recompute Settlement.total_vote_weight for every non-terminal Settlement of the project at the next tally"
        note: "SettlementParty has no lifecycle beyond registration; it is configuration data."

  - entity: Settlement
    initial_state: NEGOTIATING
    terminal_states: [EXECUTED, FAILED, WITHDRAWN, SUPERSEDED]
    transitions:
      - from: NEGOTIATING
        to: CIRCULATED
        trigger: "POST /relicensing/settlements/{settlement_id}/circulate"
        actor: Licensee
        preconditions:
          - "status == NEGOTIATING, else ERR_SETTLEMENT_STATE_INVALID"
          - "project.regulatory_posture != FROZEN"
          - "the project has >= 2 SettlementParty rows"
        side_effects:
          - "set circulated_at = logical clock; total_vote_weight = sum of vote_weight over the project's parties"
          - "increment Settlement.version by 1"
      - from: CIRCULATED
        to: EXECUTED
        trigger: "POST /relicensing/settlements/{settlement_id}/tally with intended_outcome == EXECUTE"
        actor: Licensee
        preconditions:
          - "status == CIRCULATED"
          - "the project's StudyPlan with status == APPROVED exists, else ERR_STUDY_PLAN_NOT_APPROVED (cross-entity guard)"
          - "no SettlementParty with has_conditioning_authority == true has a current-round signature with position == OPPOSE, else ERR_CONDITIONING_PARTY_VETO"
          - "support_pct from calculations.settlement_support_tally >= SUPPORT_THRESHOLD_PCT (66.67), else ERR_SUPPORT_THRESHOLD_NOT_MET"
        side_effects:
          - "persist support_pct and total_vote_weight; set executed_at = logical clock"
          - "every PmeMeasure with settlement_id == this settlement and status == PROPOSED goes PROPOSED -> INCLUDED"
          - "that status change recomputes project.total_pme_annual_cost_usd, total_generation_loss_mwh, administrative_annual_charge_usd, total_annual_burden_usd, burden_ratio_pct and economically_infeasible"
          - "the recomputed economically_infeasible recomputes project.regulatory_posture"
          - "included_measure_count = count of those measures; increment Settlement.version by 1"
      - from: CIRCULATED
        to: NEGOTIATING
        trigger: "POST /relicensing/settlements/{settlement_id}/tally with intended_outcome == CLOSE_ROUND"
        actor: Licensee
        preconditions: ["status == CIRCULATED", "round_number < MAX_NEGOTIATION_ROUNDS (3)"]
        side_effects:
          - "persist support_pct for the closed round; round_number += 1; circulated_at = null"
          - "prior-round SettlementSignature rows are retained unchanged (append-only ledger)"
          - "increment Settlement.version by 1"
        note: "Negotiation cycle: NEGOTIATING -> CIRCULATED -> NEGOTIATING for at most 3 rounds."
      - from: CIRCULATED
        to: FAILED
        trigger: "POST /relicensing/settlements/{settlement_id}/tally with intended_outcome == CLOSE_ROUND"
        actor: Licensee
        preconditions: ["status == CIRCULATED", "round_number == MAX_NEGOTIATION_ROUNDS (3), else the CLOSE_ROUND path applies"]
        side_effects:
          - "status = FAILED; persist support_pct"
          - "every PmeMeasure with settlement_id == this settlement and status == PROPOSED goes PROPOSED -> SUPERSEDED"
          - "increment Settlement.version by 1"
      - from: EXECUTED
        to: WITHDRAWN
        trigger: "POST /relicensing/settlements/{settlement_id}/withdraw"
        actor: Licensee
        preconditions:
          - "status == EXECUTED"
          - "no LicenseOrder of this project has compliance_state IN {EFFECTIVE, COMPLIANCE_FLAGGED}, else ERR_ORDER_STATE_INVALID"
        side_effects:
          - "set withdrawn_at = logical clock; included_measure_count = 0"
          - "every PmeMeasure with settlement_id == this settlement and status == INCLUDED goes INCLUDED -> WITHDRAWN"
          - "that status change recomputes the project burden ledger fields, restoring them to their pre-execution values (compensating invariant)"
          - "the recomputed ledger recomputes project.regulatory_posture"
          - "increment Settlement.version by 1"
      - from: NEGOTIATING
        to: SUPERSEDED
        trigger: "POST /relicensing/settlements (a newer settlement is created for the same project)"
        actor: Licensee
        preconditions: ["status == NEGOTIATING"]
        side_effects:
          - "status = SUPERSEDED"
          - "every PmeMeasure with settlement_id == this settlement and status == PROPOSED goes PROPOSED -> SUPERSEDED"
          - "increment Settlement.version by 1"
      - from: CIRCULATED
        to: SUPERSEDED
        trigger: "POST /relicensing/settlements (a newer settlement is created for the same project)"
        actor: Licensee
        preconditions: ["status == CIRCULATED"]
        side_effects:
          - "status = SUPERSEDED; its PROPOSED measures go PROPOSED -> SUPERSEDED"
          - "increment Settlement.version by 1"
        note: "An EXECUTED settlement blocks creation of a new one (ERR_SETTLEMENT_STATE_INVALID); only NEGOTIATING/CIRCULATED settlements are superseded."

  - entity: WaterQualityCertification
    initial_state: REQUESTED
    terminal_states: [CERTIFIED_WITH_CONDITIONS, DENIED, WAIVED]
    transitions:
      - from: "(none)"
        to: REQUESTED
        trigger: "POST /relicensing/water-quality-certifications"
        actor: Licensee
        preconditions:
          - "project.stage IN {STUDY_PHASE, APPLICATION_FILED, UNDER_ENVIRONMENTAL_REVIEW}"
          - "the project has no WaterQualityCertification with status == REQUESTED, else ERR_WQC_STATE_INVALID"
        side_effects:
          - "requested_at = logical clock; statutory_waiver_date = requested_at date + WQC_WAIVER_MONTHS (12)"
          - "project.wqc_status = REQUESTED; recompute project.regulatory_posture; increment RelicensingProject.version by 1"
      - from: REQUESTED
        to: CERTIFIED_WITH_CONDITIONS
        trigger: "POST /relicensing/water-quality-certifications/{wqc_id}/decision with decision == ISSUE_WITH_CONDITIONS"
        actor: StateCertifier
        preconditions:
          - "status == REQUESTED, else ERR_WQC_STATE_INVALID"
          - "conditions array is non-empty, else ERR_INVALID_REQUEST"
        side_effects:
          - "decided_at = logical clock; condition_count = length of conditions"
          - "for each condition, create a PmeMeasure with source = WQC_CONDITION, status = INCLUDED, cost_estimate_variant = PRELIMINARY and PRELIMINARY cost/generation numbers from calculations.pme_cost_and_generation_impact"
          - "each measure insertion recomputes project.total_pme_annual_cost_usd, total_generation_loss_mwh, administrative_annual_charge_usd, total_annual_burden_usd and burden_ratio_pct"
          - "the recomputed burden_ratio_pct sets project.economically_infeasible, which recomputes project.regulatory_posture (OPEN -> RESTRICTED when the ratio reaches 15.00)"
          - "project.wqc_status = CERTIFIED_WITH_CONDITIONS; increment RelicensingProject.version by 1"
      - from: REQUESTED
        to: DENIED
        trigger: "POST /relicensing/water-quality-certifications/{wqc_id}/decision with decision == DENY"
        actor: StateCertifier
        preconditions: ["status == REQUESTED", "denial_reason is non-empty, else ERR_INVALID_REQUEST"]
        side_effects:
          - "decided_at = logical clock; denial_reason stored"
          - "project.wqc_status = DENIED, which recomputes project.regulatory_posture to FROZEN"
          - "the FROZEN posture moves every LicenseApplication of the project with filing_status IN {FILED, UNDER_REVIEW, DEFICIENT} to SUSPENDED"
          - "increment RelicensingProject.version by 1"
      - from: REQUESTED
        to: WAIVED
        trigger: "POST /relicensing/projects/{project_id}/run-compliance-sweep (system: statutory clock)"
        actor: system
        preconditions: ["status == REQUESTED", "logical clock date >= statutory_waiver_date"]
        side_effects:
          - "decided_at = logical clock; project.wqc_status = WAIVED"
          - "recompute project.regulatory_posture; increment RelicensingProject.version by 1"

  - entity: PmeMeasure
    initial_state: PROPOSED
    terminal_states: [IMPLEMENTED, WITHDRAWN, SUPERSEDED]
    transitions:
      - from: "(none)"
        to: INCLUDED
        trigger: "POST /relicensing/pme-measures with source IN {AGENCY_PRESCRIPTION, LICENSEE_PROPOSED}, or the WQC ISSUE_WITH_CONDITIONS cascade"
        actor: Licensee
        preconditions:
          - "project.regulatory_posture != FROZEN"
          - "prerequisite_measure_id, when present, belongs to the same project and introduces no cycle, else ERR_PREREQUISITE_CYCLE"
        side_effects:
          - "compute PRELIMINARY cost and generation fields; recompute the project burden ledger and regulatory_posture"
          - "increment RelicensingProject.version by 1"
        note: "Initial state depends on source: SETTLEMENT measures start PROPOSED, all other sources start INCLUDED."
      - from: PROPOSED
        to: INCLUDED
        trigger: "POST /relicensing/settlements/{settlement_id}/tally with intended_outcome == EXECUTE (cascade)"
        actor: system
        preconditions: ["status == PROPOSED", "settlement_id == the executing settlement"]
        side_effects: ["project burden ledger recomputed; project.regulatory_posture recomputed"]
      - from: INCLUDED
        to: WITHDRAWN
        trigger: "POST /relicensing/settlements/{settlement_id}/withdraw (cascade)"
        actor: system
        preconditions: ["status == INCLUDED", "source == SETTLEMENT", "settlement_id == the withdrawing settlement"]
        side_effects:
          - "project burden ledger recomputed back to its pre-execution values"
          - "every ComplianceObligation with pme_measure_id == this measure and status IN {PENDING, SCHEDULED, OVERDUE} goes to WAIVED"
      - from: PROPOSED
        to: SUPERSEDED
        trigger: "POST /relicensing/settlements (supersede cascade) or a FAILED tally"
        actor: system
        preconditions: ["status == PROPOSED"]
        side_effects: ["no ledger change: PROPOSED measures were never in the ledger"]
      - from: INCLUDED
        to: IMPLEMENTED
        trigger: "POST /relicensing/obligations/{obligation_id}/certify on its PME_IMPLEMENTATION obligation (bubble-up)"
        actor: system
        preconditions: ["status == INCLUDED", "the certifying obligation has obligation_type == PME_IMPLEMENTATION and pme_measure_id == this measure"]
        side_effects: ["measure stays in the ledger (IMPLEMENTED is an included state); recompute project burden ledger"]

  - entity: LicenseApplication
    initial_state: "FILED x NOT_STARTED"
    terminal_states: ["LICENSED", "SUPERSEDED"]
    transitions:
      - from: "filing_status == FILED"
        to: "filing_status == UNDER_REVIEW, ea_stage == SCOPING"
        trigger: "POST /relicensing/applications/{application_id}/environmental-review with target_stage == SCOPING"
        actor: Regulator
        preconditions: ["filing_status == FILED, else ERR_APPLICATION_STATE_INVALID", "ea_stage == NOT_STARTED"]
        side_effects:
          - "project.stage APPLICATION_FILED -> UNDER_ENVIRONMENTAL_REVIEW for ORIGINAL_RELICENSE applications"
          - "increment LicenseApplication.version by 1"
      - from: "ea_stage == SCOPING"
        to: "ea_stage == DRAFT_EA"
        trigger: "POST /relicensing/applications/{application_id}/environmental-review with target_stage == DRAFT_EA"
        actor: Regulator
        preconditions: ["filing_status == UNDER_REVIEW", "ea_stage == SCOPING"]
        side_effects: ["increment LicenseApplication.version by 1"]
      - from: "ea_stage == DRAFT_EA"
        to: "ea_stage == FINAL_EA"
        trigger: "POST /relicensing/applications/{application_id}/environmental-review with target_stage == FINAL_EA"
        actor: Regulator
        preconditions:
          - "filing_status == UNDER_REVIEW"
          - "ea_stage == DRAFT_EA"
          - "every PmeMeasure of the project with source == WQC_CONDITION has cost_estimate_variant == DEFINITIVE, else ERR_DEFINITIVE_ESTIMATE_REQUIRED (cross-entity guard)"
        side_effects: ["increment LicenseApplication.version by 1"]
      - from: "filing_status == UNDER_REVIEW"
        to: "filing_status == DEFICIENT"
        trigger: "POST /relicensing/applications/{application_id}/deficiency"
        actor: Regulator
        preconditions: ["filing_status == UNDER_REVIEW"]
        side_effects:
          - "deficiency_count += 1; last_deficiency_note stored"
          - "project.open_deficiency_count recomputed, which recomputes project.regulatory_posture (OPEN -> RESTRICTED)"
          - "increment LicenseApplication.version by 1"
      - from: "filing_status == DEFICIENT"
        to: "filing_status == UNDER_REVIEW"
        trigger: "POST /relicensing/applications/{application_id}/cure"
        actor: Licensee
        preconditions:
          - "filing_status IN {DEFICIENT, SUSPENDED}"
          - "project.regulatory_posture != FROZEN, else ERR_PROJECT_POSTURE_FROZEN"
        side_effects:
          - "re-pin pinned_study_plan_version, pinned_settlement_version, pinned_measure_ids and pinned_total_annual_burden_usd from current state"
          - "project.open_deficiency_count recomputed, which recomputes project.regulatory_posture"
          - "increment LicenseApplication.version by 1"
        note: "Deficiency cycle: UNDER_REVIEW -> DEFICIENT -> UNDER_REVIEW, unbounded."
      - from: "filing_status == SUSPENDED"
        to: "filing_status == UNDER_REVIEW"
        trigger: "POST /relicensing/applications/{application_id}/cure"
        actor: Licensee
        preconditions: ["filing_status == SUSPENDED", "project.regulatory_posture != FROZEN"]
        side_effects:
          - "re-pin the version pins; recompute project.regulatory_posture"
          - "increment LicenseApplication.version by 1"
      - from: "filing_status IN {FILED, UNDER_REVIEW, DEFICIENT}"
        to: "filing_status == SUSPENDED"
        trigger: "WQC DENY decision cascade, or POST /relicensing/projects/{project_id}/run-compliance-sweep when regulatory_posture becomes FROZEN"
        actor: system
        preconditions: ["project.regulatory_posture transitions to FROZEN in this request"]
        side_effects: ["increment LicenseApplication.version by 1"]
      - from: "filing_status == UNDER_REVIEW"
        to: "filing_status == LICENSED"
        trigger: "POST /relicensing/applications/{application_id}/order"
        actor: Regulator
        preconditions:
          - "filing_status == UNDER_REVIEW"
          - "ea_stage == FINAL_EA, else ERR_APPLICATION_STATE_INVALID"
          - "project.regulatory_posture != FROZEN"
          - "project.wqc_status IN {CERTIFIED_WITH_CONDITIONS, WAIVED}, else ERR_WQC_CONDITION_NOT_INCORPORATED"
        side_effects:
          - "create one LicenseOrder with compliance_state = EFFECTIVE, effective_date = logical clock date"
          - "the new order creates ComplianceObligation rows per calculations.obligation_schedule_generation"
          - "for AMENDMENT applications the amended LicenseOrder goes EFFECTIVE -> SUPERSEDED and its amendment_pending = false"
          - "project.stage -> LICENSED; increment LicenseApplication.version by 1"
      - from: "filing_status IN {FILED, UNDER_REVIEW, DEFICIENT}"
        to: "filing_status == SUPERSEDED"
        trigger: "POST /relicensing/applications with application_type == AMENDMENT (a newer amendment supersedes the pending one)"
        actor: Licensee
        preconditions: ["application_type == AMENDMENT", "the newer application has the same amends_order_id"]
        side_effects:
          - "the prior amendment application filing_status = SUPERSEDED"
          - "project.open_deficiency_count recomputed, then project.regulatory_posture"
          - "increment the superseded LicenseApplication.version by 1"

  - entity: LicenseOrder
    initial_state: EFFECTIVE
    terminal_states: [SUPERSEDED]
    transitions:
      - from: EFFECTIVE
        to: COMPLIANCE_FLAGGED
        trigger: "POST /relicensing/projects/{project_id}/run-compliance-sweep (overdue cascade), or POST /relicensing/orders/{order_id}/annual-report with noncompliant_obligation_count > 0"
        actor: system
        preconditions: ["compliance_state == EFFECTIVE", "open_violation_count > 0 after the sweep, or the filed report found at least one noncompliant obligation"]
        side_effects:
          - "project.compliance_flag_count recomputed, which recomputes project.regulatory_posture to FROZEN"
          - "the FROZEN posture moves every LicenseApplication of the project with filing_status IN {FILED, UNDER_REVIEW, DEFICIENT} to SUSPENDED"
          - "increment LicenseOrder.version by 1"
      - from: COMPLIANCE_FLAGGED
        to: EFFECTIVE
        trigger: "POST /relicensing/obligations/{obligation_id}/certify (bubble-up when the last OVERDUE obligation clears)"
        actor: system
        preconditions: ["compliance_state == COMPLIANCE_FLAGGED", "open_violation_count reaches 0"]
        side_effects:
          - "project.compliance_flag_count recomputed, which recomputes project.regulatory_posture out of FROZEN"
          - "increment LicenseOrder.version by 1"
        note: "Compliance cycle: EFFECTIVE -> COMPLIANCE_FLAGGED -> EFFECTIVE, unbounded."
      - from: EFFECTIVE
        to: SUPERSEDED
        trigger: "POST /relicensing/applications/{application_id}/order on an AMENDMENT application whose amends_order_id is this order"
        actor: Regulator
        preconditions: ["compliance_state == EFFECTIVE", "amendment_pending == true"]
        side_effects:
          - "amendment_pending = false; obligations of this order with status IN {PENDING, SCHEDULED} are carried to the new order by re-creation, this order's remaining obligations go to WAIVED"
          - "increment LicenseOrder.version by 1"

  - entity: ComplianceObligation
    initial_state: PENDING
    terminal_states: [CERTIFIED, WAIVED]
    transitions:
      - from: PENDING
        to: SCHEDULED
        trigger: "POST /relicensing/obligations/{obligation_id}/schedule"
        actor: Licensee
        preconditions:
          - "status IN {PENDING, OVERDUE}, else ERR_OBLIGATION_STATE_INVALID"
          - "for dam-bound obligations, the closed activity window satisfies the dam capacity rule, else ERR_DAM_ACTIVITY_CAPACITY_EXCEEDED"
          - "for PME_IMPLEMENTATION obligations, the prerequisite measure of pme_measure_id, when present, has status == IMPLEMENTED, else ERR_PREREQUISITE_NOT_IMPLEMENTED"
        side_effects:
          - "store activity_window_start and activity_window_end (closed interval)"
          - "increment ComplianceObligation.version by 1"
      - from: OVERDUE
        to: SCHEDULED
        trigger: "POST /relicensing/obligations/{obligation_id}/schedule"
        actor: Licensee
        preconditions: ["status == OVERDUE", "the same window and prerequisite checks as from PENDING"]
        side_effects:
          - "store the new activity window; overdue_marked_at is retained as evidence"
          - "LicenseOrder.open_violation_count is NOT changed by rescheduling (only certification clears a violation)"
          - "increment ComplianceObligation.version by 1"
        note: "Overdue cycle: SCHEDULED -> OVERDUE -> SCHEDULED."
      - from: SCHEDULED
        to: CERTIFIED
        trigger: "POST /relicensing/obligations/{obligation_id}/certify"
        actor: Licensee
        preconditions:
          - "status == SCHEDULED"
          - "logical clock date >= activity_window_start"
        side_effects:
          - "certified_at = logical clock; certified_by_user_id = acting X-User-ID"
          - "when obligation_type == PME_IMPLEMENTATION, the linked PmeMeasure goes INCLUDED -> IMPLEMENTED"
          - "LicenseOrder.open_violation_count recomputed; when it reaches 0 the order goes COMPLIANCE_FLAGGED -> EFFECTIVE, which recomputes project.compliance_flag_count and then project.regulatory_posture"
          - "increment ComplianceObligation.version by 1"
      - from: PENDING
        to: OVERDUE
        trigger: "POST /relicensing/projects/{project_id}/run-compliance-sweep"
        actor: system
        preconditions: ["status IN {PENDING, SCHEDULED}", "logical clock date > due_date"]
        side_effects:
          - "overdue_marked_at = logical clock"
          - "LicenseOrder.open_violation_count recomputed, which moves the order EFFECTIVE -> COMPLIANCE_FLAGGED"
          - "increment ComplianceObligation.version by 1"
      - from: SCHEDULED
        to: OVERDUE
        trigger: "POST /relicensing/projects/{project_id}/run-compliance-sweep"
        actor: system
        preconditions: ["status == SCHEDULED", "logical clock date > due_date"]
        side_effects:
          - "overdue_marked_at = logical clock; LicenseOrder.open_violation_count recomputed -> order COMPLIANCE_FLAGGED"
          - "increment ComplianceObligation.version by 1"
      - from: PENDING
        to: WAIVED
        trigger: "POST /relicensing/settlements/{settlement_id}/withdraw cascade, or amendment order supersede cascade"
        actor: system
        preconditions: ["status IN {PENDING, SCHEDULED, OVERDUE}", "the linked PmeMeasure went to WITHDRAWN, or the parent order went to SUPERSEDED"]
        side_effects:
          - "LicenseOrder.open_violation_count recomputed when the waived obligation was OVERDUE"
          - "increment ComplianceObligation.version by 1"

# =============================================================================
# §1.2.1 Concurrency Rules
# =============================================================================
concurrency_rules:
  - rule_id: settlement-open-stale-project
    parent_entity: RelicensingProject
    write_endpoint: "POST /relicensing/settlements"
    occ_field: "expected_project_version"
    description: |
      Opening a Settlement against a RelicensingProject whose version has advanced
      since the client last read it is rejected. A new settlement legitimately
      supersedes a prior NEGOTIATING or CIRCULATED settlement (and cascades its
      PROPOSED measures to SUPERSEDED), so the write is not blocked by any state
      precondition; the stale-version check is what stops a writer whose view of
      the project predates that supersede from discarding work it never saw.
    error_id: ERR_STALE_PROJECT_VERSION
    http_status: 412

  - rule_id: application-file-stale-project
    parent_entity: RelicensingProject
    write_endpoint: "POST /relicensing/applications"
    occ_field: "expected_project_version"
    description: |
      Filing a LicenseApplication against a RelicensingProject whose version has
      advanced since the client last read it is rejected. An AMENDMENT filing
      legitimately supersedes a prior pending amendment on the same order, and the
      filing pins study-plan, settlement and measure versions, so a stale view
      would pin a snapshot the client never observed.
    error_id: ERR_STALE_PROJECT_VERSION
    http_status: 412

# =============================================================================
# §1.3 Calculation & Derivation Table
# =============================================================================
calculations:
  - name: pme_cost_and_generation_impact
    trigger: "PmeMeasure creation (POST /relicensing/pme-measures and the WQC ISSUE_WITH_CONDITIONS cascade) and POST /relicensing/pme-measures/{measure_id}/cost-estimate"
    algorithm_type: dual_variant_engineering_estimate
    inputs:
      - "PmeMeasure.capital_cost_usd, annual_om_cost_usd, resource_category, construction_start_year"
      - "PmeMeasure.flow_release_cfs, gross_head_ft, release_days"
      - "RelicensingProject.pad_year (escalation base year)"
    constants:
      CONTINGENCY_PCT_PRELIMINARY: 0.25
      CONTINGENCY_PCT_DEFINITIVE: 0.10
      ESCALATION_PCT_PER_YEAR: 0.03
      AMORTIZATION_YEARS_BY_CATEGORY: { FISH_PASSAGE: 30, WATER_QUALITY: 20, RECREATION: 15, CULTURAL: 10 }
      PROXY_MWH_PER_CFS_DAY: 0.048
      PLANT_EFFICIENCY: 0.85
      HYDRO_KW_DIVISOR: 11.8
      ENERGY_PRICE_USD_PER_MWH: 42.00
    variants:
      - variant: PRELIMINARY
        applies_when: "cost_estimate_variant == PRELIMINARY (the value at creation for every measure, including WQC-condition measures)"
        formula: |
          contingency        = CONTINGENCY_PCT_PRELIMINARY (0.25)
          escalation_years   = max(0, construction_start_year - project.pad_year)
          escalated_capital  = round(capital_cost_usd * (1 + contingency)
                                     * (1 + ESCALATION_PCT_PER_YEAR) ** escalation_years, 2)
          amort_years        = AMORTIZATION_YEARS_BY_CATEGORY[resource_category]
          annualized_capital = round(escalated_capital / amort_years, 2)
          annual_cost_usd    = annualized_capital + annual_om_cost_usd          # 2 dp, no re-round needed
          annual_generation_loss_mwh  = round(flow_release_cfs * release_days
                                              * PROXY_MWH_PER_CFS_DAY, 1)        # flow-duration proxy, head ignored
          annual_generation_value_usd = round(annual_generation_loss_mwh * ENERGY_PRICE_USD_PER_MWH, 2)
          annual_burden_usd  = annual_cost_usd + annual_generation_value_usd
      - variant: DEFINITIVE
        applies_when: "cost_estimate_variant == DEFINITIVE, set only by POST /relicensing/pme-measures/{measure_id}/cost-estimate"
        formula: |
          contingency        = CONTINGENCY_PCT_DEFINITIVE (0.10)
          escalation_years   = max(0, construction_start_year - project.pad_year)
          escalated_capital  = round(capital_cost_usd * (1 + contingency)
                                     * (1 + ESCALATION_PCT_PER_YEAR) ** escalation_years, 2)
          amort_years        = AMORTIZATION_YEARS_BY_CATEGORY[resource_category]
          annualized_capital = round(escalated_capital / amort_years, 2)
          annual_cost_usd    = annualized_capital + annual_om_cost_usd
          annual_generation_loss_mwh  = round((flow_release_cfs * gross_head_ft * PLANT_EFFICIENCY
                                               / HYDRO_KW_DIVISOR) * 24 * release_days / 1000, 1)
          annual_generation_value_usd = round(annual_generation_loss_mwh * ENERGY_PRICE_USD_PER_MWH, 2)
          annual_burden_usd  = annual_cost_usd + annual_generation_value_usd
    output_fields:
      - "PmeMeasure.escalated_capital_usd"
      - "PmeMeasure.annualized_capital_usd"
      - "PmeMeasure.annual_cost_usd"
      - "PmeMeasure.annual_generation_loss_mwh"
      - "PmeMeasure.annual_generation_value_usd"
      - "PmeMeasure.annual_burden_usd"
    precision: "USD fields 2 decimals, ROUND_HALF_UP; MWh fields 1 decimal, ROUND_HALF_UP. Round at every step shown, never once at the end."
    reconciliation: |
      Switching a measure from PRELIMINARY to DEFINITIVE while the measure is INCLUDED or
      IMPLEMENTED rewrites all six output fields and then re-runs project_burden_ledger, so the
      project's ledger reflects the delta of both the cost path (lower contingency) and the
      generation path (physical head-based loss instead of the flow proxy) in the same request.
    example: |
      capital 1,200,000.00, om 45,000.00, FISH_PASSAGE, pad_year 2026, construction_start_year 2029,
      flow 120, head 85, days 180:
        PRELIMINARY -> escalated 1,639,090.50, annualized 54,636.35, annual_cost 99,636.35,
                       gen_loss 1036.8, gen_value 43,545.60, burden 143,181.95
        DEFINITIVE  -> escalated 1,442,399.64, annualized 48,079.99, annual_cost 93,079.99,
                       gen_loss 3174.1, gen_value 133,312.20, burden 226,392.19
      The two variants move the two components in opposite directions, so no single scaling
      factor reproduces the switch.

  - name: settlement_support_tally
    trigger: "POST /relicensing/settlements/{settlement_id}/tally"
    algorithm_type: weighted_scoring
    inputs:
      - "SettlementSignature rows with settlement_id == the settlement and round_number == Settlement.round_number"
      - "SettlementParty.vote_weight for every party of the settlement's project"
    constants:
      SUPPORT_THRESHOLD_PCT: 66.67
      MAX_NEGOTIATION_ROUNDS: 3
    formula: |
      total_vote_weight = sum(vote_weight) over ALL SettlementParty rows of the project,
                          including parties that never signed
      # Pinned evaluation order: round each supporting party's share to 2 dp FIRST,
      # then sum the rounded shares, then round the sum to 2 dp.
      for each signature s of the current round with position == SUPPORT:
          share_pct(s) = round(100 * party(s).vote_weight / total_vote_weight, 2)
          persist share_pct on the SettlementSignature row
      support_pct = round(sum(share_pct(s) for supporting s of the current round), 2)
      executable  = support_pct >= SUPPORT_THRESHOLD_PCT
    output_fields:
      - "SettlementSignature.share_pct (per row, current round only)"
      - "Settlement.support_pct"
      - "Settlement.total_vote_weight"
    precision: "2 decimals, ROUND_HALF_UP, applied per party share and again to the sum."
    example: |
      Three parties with vote_weight 1/1/1, two SUPPORT signatures:
        per-party share 33.33 each -> sum 66.66 -> support_pct 66.66 -> below 66.67, EXECUTE rejected.
        (Summing unrounded 2/3 first would give 66.67 and wrongly execute.)
      Parties with vote_weight 1/3/2 (total 6), SUPPORT from the weight-1 and weight-3 parties:
        16.67 + 50.00 = 66.67 -> support_pct 66.67 -> exactly at threshold, EXECUTE allowed.
      Four parties with vote_weight 1 each, three SUPPORT: 25.00 * 3 = 75.00 -> allowed.
    note: "Non-signing parties dilute support because they stay in the denominator."

  - name: project_burden_ledger
    trigger: "any request that changes the INCLUDED/IMPLEMENTED PmeMeasure set of a project or the cost fields of such a measure (measure creation, WQC issuance cascade, settlement execution, settlement withdrawal, cost-estimate switch, obligation certification)"
    algorithm_type: aggregation_with_tiered_pricing
    inputs:
      - "PmeMeasure rows of the project with status IN {INCLUDED, IMPLEMENTED} (PROPOSED, WITHDRAWN and SUPERSEDED are excluded)"
      - "RelicensingProject.base_annual_generation_mwh, infeasibility_waiver_granted"
    constants:
      ENERGY_PRICE_USD_PER_MWH: 42.00
      ADMIN_CHARGE_TIERS: "pme_cost <= 500000.00 -> 0.02 | pme_cost <= 2000000.00 -> 0.035 | pme_cost > 2000000.00 -> 0.05"
      BURDEN_RATIO_LIMIT_PCT: 15.00
    formula: |
      # Pinned evaluation order (steps must run in this sequence):
      1. total_pme_annual_cost_usd  = round(sum(annual_cost_usd of the INCLUDED/IMPLEMENTED set), 2)
      2. total_generation_loss_mwh  = round(sum(annual_generation_loss_mwh of the same set), 1)
      3. tier_rate = tier selected by comparing total_pme_annual_cost_usd from step 1 ONLY
                     (the administrative charge never re-enters its own tier lookup)
         administrative_annual_charge_usd = round(total_pme_annual_cost_usd * tier_rate, 2)
      4. generation_value_usd = round(total_generation_loss_mwh * ENERGY_PRICE_USD_PER_MWH, 2)
         total_annual_burden_usd = total_pme_annual_cost_usd
                                 + administrative_annual_charge_usd
                                 + generation_value_usd
      5. gross_revenue_usd = round(base_annual_generation_mwh * ENERGY_PRICE_USD_PER_MWH, 2)
         burden_ratio_pct  = round(100 * total_annual_burden_usd / gross_revenue_usd, 2)
      6. economically_infeasible = burden_ratio_pct >= BURDEN_RATIO_LIMIT_PCT (15.00)
    output_fields:
      - "RelicensingProject.total_pme_annual_cost_usd"
      - "RelicensingProject.total_generation_loss_mwh"
      - "RelicensingProject.administrative_annual_charge_usd"
      - "RelicensingProject.total_annual_burden_usd"
      - "RelicensingProject.burden_ratio_pct"
      - "RelicensingProject.economically_infeasible"
    precision: "USD 2 decimals, MWh 1 decimal, percentages 2 decimals, all ROUND_HALF_UP."
    example: |
      Single DEFINITIVE WATER_QUALITY measure: capital 1,000,000.00 with pad_year == construction_start_year,
      om 155,102.94, flow 250, head 100, days 229:
        escalated 1,100,000.00, annualized 55,000.00, annual_cost 210,102.94,
        gen_loss 9897.5, gen_value 415,695.00
        step 3 tier: 210,102.94 <= 500,000.00 -> 0.02 -> admin 4,202.06
        step 4 burden 210,102.94 + 4,202.06 + 415,695.00 = 630,000.00
        base_annual_generation_mwh 100,000 -> gross 4,200,000.00 -> ratio exactly 15.00 -> infeasible true
        base_annual_generation_mwh 120,000 -> gross 5,040,000.00 -> ratio 12.50 -> infeasible false
    note: |
      The ledger is fully recomputed from the current measure set on every trigger, never
      incrementally adjusted, so withdrawal restores the exact prior values.

  - name: relicensing_timeline_posture
    trigger: "POST /relicensing/projects/{project_id}/pre-application-document, POST /relicensing/applications, POST /relicensing/projects/{project_id}/run-compliance-sweep"
    algorithm_type: threshold
    inputs:
      - "RelicensingProject.license_expiration_date, stage, pad_filed_at, application_filed_at"
      - "the logical clock instant"
    constants:
      PAD_LEAD_MONTHS: 66
      APPLICATION_LEAD_MONTHS: 24
      TIMELINE_AT_RISK_DAYS: 180
    formula: |
      pad_due_date         = add_months(license_expiration_date, -PAD_LEAD_MONTHS)
      application_due_date = add_months(license_expiration_date, -APPLICATION_LEAD_MONTHS)
      # add_months clamps the day-of-month to the last day of the target month.
      next_milestone_due = pad_due_date          when pad_filed_at is null
                         = application_due_date  when pad_filed_at is set and application_filed_at is null
                         = null                  when both are set
      when next_milestone_due is null:            timeline_posture = ON_TRACK
      slack_days = (next_milestone_due - date(logical clock)) in whole days
      when slack_days <  0:                       timeline_posture = DELINQUENT
      when slack_days <= TIMELINE_AT_RISK_DAYS:   timeline_posture = AT_RISK
      otherwise:                                  timeline_posture = ON_TRACK
    output_fields: ["RelicensingProject.timeline_posture"]
    precision: "Whole days; the milestone date itself counts as slack_days == 0 -> AT_RISK, not DELINQUENT."
    example: |
      license_expiration_date 2033-12-31 -> pad_due_date 2028-06-30, application_due_date 2031-12-31.
      Clock 2026-08-01, PAD unfiled: slack 699 days -> ON_TRACK.
      Clock 2028-01-02, PAD unfiled: slack exactly 180 days -> AT_RISK.
      Clock 2028-01-03, PAD unfiled: slack 179 days -> AT_RISK.
      Clock 2028-07-01, PAD unfiled: slack -1 -> DELINQUENT.

  - name: project_regulatory_posture
    trigger: "the end of every request that mutates a RelicensingProject or any of its children"
    algorithm_type: constraint_propagation
    inputs:
      - "RelicensingProject.wqc_status, economically_infeasible, infeasibility_waiver_granted"
      - "RelicensingProject.compliance_flag_count (count of LicenseOrder rows with compliance_state == COMPLIANCE_FLAGGED)"
      - "RelicensingProject.unresolved_mandatory_comment_count (over StudyPlan rows with status IN {DRAFT, UNDER_AGENCY_REVIEW, REVISION_REQUIRED})"
      - "RelicensingProject.open_deficiency_count (count of LicenseApplication rows with filing_status == DEFICIENT)"
      - "RelicensingProject.timeline_posture"
    constants:
      FROZEN_CONDITIONS: "wqc_status == DENIED OR compliance_flag_count > 0 OR timeline_posture == DELINQUENT"
      RESTRICTED_CONDITIONS: "unresolved_mandatory_comment_count > 0 OR open_deficiency_count > 0 OR (economically_infeasible == true AND infeasibility_waiver_granted == false) OR timeline_posture == AT_RISK"
    formula: |
      # Evaluated in this order; the first matching tier wins.
      when any FROZEN_CONDITIONS holds:      regulatory_posture = FROZEN
      else when any RESTRICTED_CONDITIONS:   regulatory_posture = RESTRICTED
      else:                                  regulatory_posture = OPEN
      # Gate semantics used by the validations table:
      #   FROZEN     -> every licensee-initiated mutation on the project or its children is rejected
      #                 with ERR_PROJECT_POSTURE_FROZEN, except POST .../cure, obligation schedule,
      #                 obligation certify, annual report and run-compliance-sweep (the cure paths).
      #   RESTRICTED -> study, settlement and application-filing work all continue (filing has its
      #                 own explicit burden-ratio check), but order issuance is rejected with
      #                 ERR_PROJECT_POSTURE_RESTRICTED.
      #   OPEN       -> no posture gate.
    output_fields: ["RelicensingProject.regulatory_posture"]
    precision: "Exact boolean evaluation; recomputed from stored counters, never incrementally toggled."
    note: |
      Because the posture is recomputed from counters that are themselves recomputed by child
      transitions, a single child write can move the posture two tiers in one request (for
      example the last OVERDUE obligation being certified takes FROZEN straight to OPEN).

  - name: obligation_schedule_generation
    trigger: "POST /relicensing/applications/{application_id}/order"
    algorithm_type: topological
    inputs:
      - "PmeMeasure rows of the project with status IN {INCLUDED, IMPLEMENTED}, with prerequisite_measure_id edges"
      - "Dam rows of the project (hazard_class, inspection_interval_months, eap_exercise_required)"
      - "LicenseOrder.effective_date"
    constants:
      PREREQ_LAG_MONTHS: 6
      PUBLIC_SAFETY_SIGNAGE_MONTHS: 12
      EAP_EXERCISE_MONTHS: 24
    formula: |
      # PME obligations: one PME_IMPLEMENTATION obligation per INCLUDED/IMPLEMENTED measure.
      Process measures in topological order of prerequisite_measure_id (roots first).
      depth(m)    = 0 when prerequisite_measure_id is null, else depth(prerequisite) + 1
      due_date(m) = add_months(order.effective_date, m.implementation_months)                when depth == 0
                  = add_months(max(add_months(order.effective_date, m.implementation_months),
                                   add_months(due_date(prerequisite), PREREQ_LAG_MONTHS)), 0) otherwise
      # i.e. a dependent measure is never due before its prerequisite due date plus the lag.
      # Dam obligations, per Dam of the project:
      DAM_SAFETY_INSPECTION  due add_months(order.effective_date, dam.inspection_interval_months)
      PUBLIC_SAFETY_SIGNAGE  due add_months(order.effective_date, PUBLIC_SAFETY_SIGNAGE_MONTHS)
      EAP_EXERCISE           due add_months(order.effective_date, EAP_EXERCISE_MONTHS), created only
                             when dam.eap_exercise_required == true
      Every generated obligation starts with status == PENDING.
      LicenseOrder.article_count = number of obligations generated.
    output_fields:
      - "ComplianceObligation.due_date"
      - "ComplianceObligation.obligation_type"
      - "ComplianceObligation.status"
      - "LicenseOrder.article_count"
    precision: "Whole months via add_months with day-of-month clamping; no partial months."
    example: |
      effective_date 2027-03-15. Measure A (root, implementation_months 6) -> due 2027-09-15.
      Measure B (prerequisite A, implementation_months 9) -> max(2027-12-15, 2028-03-15) = 2028-03-15.
      Measure C (prerequisite B, implementation_months 11) -> max(2028-02-15, 2028-09-15) = 2028-09-15.
      A HIGH-hazard dam with inspection_interval_months 12 and eap_exercise_required true adds
      obligations due 2028-03-15, 2028-03-15 (signage) and 2029-03-15 (EAP).
    note: "A prerequisite chain therefore pushes dependents strictly later, even when the dependent's own implementation_months is short."

  - name: compliance_year_assessment
    trigger: "POST /relicensing/orders/{order_id}/annual-report"
    algorithm_type: dual_variant_periodic_assessment
    inputs:
      - "LicenseOrder.effective_date, compliance_state"
      - "ComplianceObligation rows of the order (due_date, status, certified_at)"
      - "the requested report_basis and period_year"
    constants:
      CALENDAR_PERIOD: "January 1 through December 31 of period_year, inclusive"
      ANNIVERSARY_PERIOD: "the license anniversary window starting on the effective_date month/day of period_year, running to the day before the next anniversary"
    variants:
      - variant: CALENDAR
        applies_when: "report_basis == CALENDAR"
        formula: |
          period_start = date(period_year, 1, 1)
          period_end   = date(period_year, 12, 31)
      - variant: LICENSE_ANNIVERSARY
        applies_when: "report_basis == LICENSE_ANNIVERSARY"
        formula: |
          period_start = date(period_year, month(effective_date), day(effective_date))
          period_end   = add_months(period_start, 12) minus 1 day
    formula: |
      # Shared assessment, run after the variant fixes the window (both bounds inclusive):
      assessed = obligations with period_start <= due_date <= period_end
                 and status != WAIVED
      noncompliant = assessed rows where status != CERTIFIED,
                     or status == CERTIFIED with date(certified_at) > due_date
      assessed_obligation_count     = count(assessed)
      noncompliant_obligation_count = count(noncompliant)
      compliance_score = 100.00 when assessed_obligation_count == 0
                       = round(100 * (assessed_obligation_count - noncompliant_obligation_count)
                               / assessed_obligation_count, 2)
      last_report_basis       = report_basis
      last_report_period_year = period_year
      last_report_filed_at    = logical clock
    output_fields:
      - "LicenseOrder.assessed_obligation_count"
      - "LicenseOrder.noncompliant_obligation_count"
      - "LicenseOrder.compliance_score"
      - "LicenseOrder.last_report_basis"
      - "LicenseOrder.last_report_period_year"
      - "LicenseOrder.last_report_filed_at"
    precision: "Score 2 decimals, ROUND_HALF_UP. An empty period yields exactly 100.00, not 0.00."
    reconciliation: |
      The same order and the same obligations produce different assessed sets under the two
      bases whenever an obligation's due_date falls between January 1 and the anniversary day:
      for effective_date 2027-03-15, an obligation due 2028-02-15 is inside CALENDAR 2028 but
      inside ANNIVERSARY 2027 (2027-03-15 .. 2028-03-14), never both.
    note: "Filing a report with noncompliant_obligation_count > 0 moves the order EFFECTIVE -> COMPLIANCE_FLAGGED."

# =============================================================================
# §1.4 Validation Rules Table  (evaluated in ascending priority; first violation wins)
# =============================================================================
validations:
  - priority: 10
    rule: "The request carries an X-User-ID header naming a known user."
    category: auth
    error_id: ERR_UNAUTHORIZED
    http_status: 401
    applies_to: "every endpoint except POST /_clock/set_current_utc and GET /_clock"
  - priority: 11
    rule: "The acting user's role appears in the endpoint's allowed roles (§1.7)."
    category: auth
    error_id: ERR_ROLE_NOT_PERMITTED
    http_status: 403
    applies_to: "every endpoint with a non-empty roles list"
  - priority: 12
    rule: "For AgencyReviewer and Stakeholder the acting user resolves to a SettlementParty of the project the target entity belongs to; a party of another project is treated as not permitted."
    category: auth
    error_id: ERR_ROLE_NOT_PERMITTED
    http_status: 403
    applies_to: "every endpoint whose roles include AgencyReviewer or Stakeholder"
  - priority: 20
    rule: "Every path id resolves to an existing row of the expected entity."
    category: existence
    error_id: "ERR_PROJECT_NOT_FOUND | ERR_DAM_NOT_FOUND | ERR_SITE_NOT_FOUND | ERR_STUDY_PLAN_NOT_FOUND | ERR_STUDY_NOT_FOUND | ERR_COMMENT_NOT_FOUND | ERR_PARTY_NOT_FOUND | ERR_SETTLEMENT_NOT_FOUND | ERR_WQC_NOT_FOUND | ERR_MEASURE_NOT_FOUND | ERR_APPLICATION_NOT_FOUND | ERR_ORDER_NOT_FOUND | ERR_OBLIGATION_NOT_FOUND"
    http_status: 404
    applies_to: "every endpoint with a path parameter"
  - priority: 21
    rule: "Every FK supplied in a request body resolves to an existing row of the referenced entity."
    category: existence
    error_id: "the NOT_FOUND code of the referenced entity"
    http_status: 404
    applies_to: "POST /relicensing/dams, /sites, /study-plans, /studies, /comments, /parties, /settlements, /signatures, /water-quality-certifications, /pme-measures, /applications"
  - priority: 22
    rule: "Every FK supplied in a request body belongs to the same RelicensingProject as the other references in that request (cross-project mixing is rejected as a bad reference, not as a state error)."
    category: existence
    error_id: ERR_CROSS_PROJECT_REFERENCE
    http_status: 422
    applies_to: "POST /relicensing/studies (plan and site), /comments (plan and party), /signatures (settlement and party), /pme-measures (settlement and prerequisite), /applications (amends_order_id)"
  - priority: 30
    rule: "Required body fields are present and non-null."
    category: schema
    error_id: ERR_INVALID_REQUEST
    http_status: 400
    applies_to: "every POST and PATCH"
  - priority: 31
    rule: "Field types, enum membership and numeric domains hold (monetary and MWh values >= 0, capacity and generation > 0, vote_weight >= 1, implementation_months >= 0, release_days between 0 and 365, ISO 8601 dates)."
    category: schema
    error_id: ERR_INVALID_REQUEST
    http_status: 400
    applies_to: "every POST and PATCH"
  - priority: 32
    rule: "Interval payloads are ordered: fieldwork_window_start < fieldwork_window_end (half-open), and activity_window_start <= activity_window_end (closed)."
    category: schema
    error_id: ERR_INVALID_REQUEST
    http_status: 400
    applies_to: "POST /relicensing/studies, POST /relicensing/obligations/{obligation_id}/schedule"
  - priority: 33
    rule: "Pagination parameters are within range: limit between 1 and 100, offset >= 0."
    category: schema
    error_id: ERR_VALIDATION
    http_status: 400
    applies_to: "every list endpoint"
  - priority: 34
    rule: "has_conditioning_authority may be true only when party_type == AGENCY."
    category: schema
    error_id: ERR_INVALID_REQUEST
    http_status: 400
    applies_to: "POST /relicensing/parties"
  - priority: 35
    rule: "expected_project_version equals the target RelicensingProject.version."
    category: concurrency
    error_id: ERR_STALE_PROJECT_VERSION
    http_status: 412
    applies_to: "POST /relicensing/settlements, POST /relicensing/applications"
  - priority: 40
    rule: "license_number is unique across RelicensingProject; dam_code is unique per project; site_code is unique per project; order_number is unique globally."
    category: uniqueness
    error_id: ERR_DUPLICATE_KEY
    http_status: 409
    applies_to: "POST /relicensing/projects, /dams, /sites, and order issuance"
  - priority: 41
    rule: "A project may hold at most one WaterQualityCertification with status == REQUESTED, and a WQC may be requested only while stage IN {STUDY_PHASE, APPLICATION_FILED, UNDER_ENVIRONMENTAL_REVIEW}."
    category: state
    error_id: ERR_WQC_STATE_INVALID
    http_status: 409
    applies_to: "POST /relicensing/water-quality-certifications"
  - priority: 42
    rule: "The project's regulatory_posture is not FROZEN."
    category: state
    error_id: ERR_PROJECT_POSTURE_FROZEN
    http_status: 409
    applies_to: "every licensee-initiated or agency-initiated mutation of a project or its children, except the cure paths: POST /relicensing/applications/{application_id}/cure, POST /relicensing/obligations/{obligation_id}/schedule, POST /relicensing/obligations/{obligation_id}/certify, POST /relicensing/orders/{order_id}/annual-report and POST /relicensing/projects/{project_id}/run-compliance-sweep"
  - priority: 43
    rule: "The project's stage permits the requested operation (PAD filing only from PRE_FILING, study plans only from PAD_FILED onward, application filing only from STUDY_PHASE for ORIGINAL_RELICENSE and only from LICENSED for AMENDMENT)."
    category: state
    error_id: ERR_PROJECT_STAGE_INVALID
    http_status: 409
    applies_to: "POST /relicensing/projects/{project_id}/pre-application-document, /study-plans, /applications"
  - priority: 44
    rule: "The target entity's own status permits the transition (plan submit only from DRAFT or REVISION_REQUIRED, determination only from UNDER_AGENCY_REVIEW, circulate only from NEGOTIATING, tally only from CIRCULATED, withdraw only from EXECUTED, WQC decision only from REQUESTED, EA advance only in stage order, deficiency only from UNDER_REVIEW, cure only from DEFICIENT or SUSPENDED, order only from UNDER_REVIEW, obligation schedule only from PENDING or OVERDUE, certify only from SCHEDULED)."
    category: state
    error_id: "ERR_STUDY_PLAN_STATE_INVALID | ERR_STUDY_STATE_INVALID | ERR_SETTLEMENT_STATE_INVALID | ERR_WQC_STATE_INVALID | ERR_APPLICATION_STATE_INVALID | ERR_ORDER_STATE_INVALID | ERR_OBLIGATION_STATE_INVALID"
    http_status: 409
    applies_to: "every action endpoint"
  - priority: 45
    rule: "A comment may be resolved only while it is OPEN."
    category: state
    error_id: ERR_COMMENT_ALREADY_RESOLVED
    http_status: 409
    applies_to: "POST /relicensing/comments/{comment_id}/resolve"
  - priority: 46
    rule: "A new Settlement may not be opened while the project already has a Settlement with status == EXECUTED."
    category: state
    error_id: ERR_SETTLEMENT_STATE_INVALID
    http_status: 409
    applies_to: "POST /relicensing/settlements"
  - priority: 47
    rule: "A settlement may not be withdrawn once a LicenseOrder of the project is EFFECTIVE or COMPLIANCE_FLAGGED."
    category: state
    error_id: ERR_ORDER_STATE_INVALID
    http_status: 409
    applies_to: "POST /relicensing/settlements/{settlement_id}/withdraw"
  - priority: 48
    rule: "A signature may be recorded only while the settlement is CIRCULATED, and its round_number is always the settlement's current round_number; one signature per party per round."
    category: state
    error_id: ERR_SIGNATURE_ROUND_CLOSED
    http_status: 409
    applies_to: "POST /relicensing/signatures"
  - priority: 49
    rule: "A duplicate signature by the same party in the same round is rejected."
    category: uniqueness
    error_id: ERR_DUPLICATE_SIGNATURE
    http_status: 409
    applies_to: "POST /relicensing/signatures"
  - priority: 50
    rule: "Study-plan approval requires unresolved_mandatory_comment_count == 0 on that plan."
    category: cross_entity
    error_id: ERR_UNRESOLVED_MANDATORY_COMMENTS
    http_status: 409
    applies_to: "POST /relicensing/study-plans/{study_plan_id}/determination with determination == APPROVE"
  - priority: 51
    rule: "Settlement execution requires the project to have a StudyPlan with status == APPROVED."
    category: cross_entity
    error_id: ERR_STUDY_PLAN_NOT_APPROVED
    http_status: 409
    applies_to: "POST /relicensing/settlements/{settlement_id}/tally with intended_outcome == EXECUTE"
  - priority: 52
    rule: "Application filing requires the project to have exactly one StudyPlan with status == APPROVED."
    category: cross_entity
    error_id: ERR_STUDY_PLAN_NOT_APPROVED
    http_status: 409
    applies_to: "POST /relicensing/applications with application_type == ORIGINAL_RELICENSE"
  - priority: 53
    rule: "Application filing requires every ResourceStudy of the approved plan to have review_status == ACCEPTED."
    category: cross_entity
    error_id: ERR_STUDY_NOT_ACCEPTED
    http_status: 409
    applies_to: "POST /relicensing/applications with application_type == ORIGINAL_RELICENSE"
  - priority: 54
    rule: "Application filing requires an existing WaterQualityCertification for the project (wqc_status != NONE)."
    category: cross_entity
    error_id: ERR_WQC_STATE_INVALID
    http_status: 409
    applies_to: "POST /relicensing/applications with application_type == ORIGINAL_RELICENSE"
  - priority: 55
    rule: "Advancing an application to FINAL_EA requires every PmeMeasure of the project with source == WQC_CONDITION to have cost_estimate_variant == DEFINITIVE."
    category: cross_entity
    error_id: ERR_DEFINITIVE_ESTIMATE_REQUIRED
    http_status: 409
    applies_to: "POST /relicensing/applications/{application_id}/environmental-review with target_stage == FINAL_EA"
  - priority: 56
    rule: "Order issuance requires project.wqc_status IN {CERTIFIED_WITH_CONDITIONS, WAIVED} so that certification conditions are reflected in the license."
    category: cross_entity
    error_id: ERR_WQC_CONDITION_NOT_INCORPORATED
    http_status: 422
    applies_to: "POST /relicensing/applications/{application_id}/order"
  - priority: 57
    rule: "Scheduling a PME_IMPLEMENTATION obligation whose measure has a prerequisite_measure_id requires that prerequisite measure to have status == IMPLEMENTED."
    category: cross_entity
    error_id: ERR_PREREQUISITE_NOT_IMPLEMENTED
    http_status: 409
    applies_to: "POST /relicensing/obligations/{obligation_id}/schedule"
  - priority: 58
    rule: "prerequisite_measure_id must belong to the same project and must not close a cycle in the prerequisite graph."
    category: cross_entity
    error_id: ERR_PREREQUISITE_CYCLE
    http_status: 422
    applies_to: "POST /relicensing/pme-measures, PATCH /relicensing/pme-measures/{measure_id}"
  - priority: 60
    rule: "A ResourceStudy's half-open fieldwork window [start, end), extended by the site's min_rest_buffer_days at its end, must not overlap the buffered window of any other study at that site whose fieldwork_status is not COMPLETED. Two windows touching exactly at the buffered boundary do not overlap."
    category: business_temporal
    error_id: ERR_SITE_WINDOW_CONFLICT
    http_status: 409
    applies_to: "POST /relicensing/studies"
  - priority: 61
    rule: "The requested reporting period of an annual report must have started (period_start <= logical clock date), and the same basis and period_year may not be filed twice for one order."
    category: business_temporal
    error_id: ERR_REPORT_PERIOD_INVALID
    http_status: 409
    applies_to: "POST /relicensing/orders/{order_id}/annual-report"
  - priority: 62
    rule: "An obligation may be certified only on or after its activity_window_start."
    category: business_temporal
    error_id: ERR_CERTIFICATION_TOO_EARLY
    http_status: 409
    applies_to: "POST /relicensing/obligations/{obligation_id}/certify"
  - priority: 63
    rule: "A PAD may not be filed after pad_due_date and an ORIGINAL_RELICENSE application may not be filed after application_due_date."
    category: business_temporal
    error_id: ERR_FILING_DEADLINE_PASSED
    http_status: 409
    applies_to: "POST /relicensing/projects/{project_id}/pre-application-document, POST /relicensing/applications"
  - priority: 65
    rule: "A ResourceStudy at a StudySite with cultural_sensitivity == HIGH requires a non-empty cultural_clearance_reference in the request body, whatever the resource_category."
    category: business_constraint
    error_id: ERR_CULTURAL_CLEARANCE_MISSING
    http_status: 422
    applies_to: "POST /relicensing/studies"
  - priority: 66
    rule: "The count of dam-bound obligations with status == SCHEDULED whose closed activity windows overlap the requested closed window, plus the one being scheduled, must not exceed Dam.max_concurrent_field_activities."
    category: business_constraint
    error_id: ERR_DAM_ACTIVITY_CAPACITY_EXCEEDED
    http_status: 409
    applies_to: "POST /relicensing/obligations/{obligation_id}/schedule"
  - priority: 67
    rule: "The Licensee user who created a PmeMeasure may not be the user who records its DEFINITIVE cost estimate."
    category: business_constraint
    error_id: ERR_SEGREGATION_OF_DUTIES
    http_status: 409
    applies_to: "POST /relicensing/pme-measures/{measure_id}/cost-estimate"
  - priority: 68
    rule: "The Licensee user who submitted a ResourceStudy report may not be the user who certifies an obligation for the same PmeMeasure resource_category on the same project."
    category: business_constraint
    error_id: ERR_SEGREGATION_OF_DUTIES
    http_status: 409
    applies_to: "POST /relicensing/obligations/{obligation_id}/certify"
  - priority: 70
    rule: "Settlement execution requires support_pct >= SUPPORT_THRESHOLD_PCT (66.67)."
    category: business_fiscal
    error_id: ERR_SUPPORT_THRESHOLD_NOT_MET
    http_status: 422
    applies_to: "POST /relicensing/settlements/{settlement_id}/tally with intended_outcome == EXECUTE"
  - priority: 71
    rule: "Settlement execution is rejected when a SettlementParty with has_conditioning_authority == true recorded position == OPPOSE in the current round."
    category: business_fiscal
    error_id: ERR_CONDITIONING_PARTY_VETO
    http_status: 422
    applies_to: "POST /relicensing/settlements/{settlement_id}/tally with intended_outcome == EXECUTE"
  - priority: 72
    rule: "Application filing is rejected when burden_ratio_pct >= BURDEN_RATIO_LIMIT_PCT (15.00) and infeasibility_waiver_granted == false."
    category: business_fiscal
    error_id: ERR_BURDEN_RATIO_EXCEEDED
    http_status: 422
    applies_to: "POST /relicensing/applications"
  - priority: 73
    rule: "Order issuance is rejected when the project's regulatory_posture is RESTRICTED."
    category: business_fiscal
    error_id: ERR_PROJECT_POSTURE_RESTRICTED
    http_status: 409
    applies_to: "POST /relicensing/applications/{application_id}/order"

# =============================================================================
# §1.5 API Endpoint Table
# =============================================================================
# Testability completeness: every state, calculation branch and error in this
# scaffold is reachable by composing business endpoints, except the passage of
# time. Time is therefore exposed through a single test-driving logical-clock
# endpoint pair (`POST /_clock/set_current_utc`, `GET /_clock`); no other
# `/_`-prefixed endpoint exists. Deadline postures, statutory WQC waiver,
# obligation overdue marking and certification windows are all driven by moving
# that clock and then calling the business sweep endpoint.
endpoints:
  # ---- logical clock (test-driving) ----------------------------------------
  - method: POST
    path: /_clock/set_current_utc
    roles: [Regulator]
    input: [to_iso8601]
    output: { current_utc: string }
    side_effects:
      - "Sets the server logical clock used for every created_at, updated_at, *_at field, date comparison and deadline evaluation."
      - "Default when never set: 2026-08-01T00:00:00Z."
  - method: GET
    path: /_clock
    roles: [Licensee, AgencyReviewer, Stakeholder, StateCertifier, Regulator]
    input: []
    output: { current_utc: string }
    side_effects: []

  # ---- RelicensingProject --------------------------------------------------
  - method: POST
    path: /relicensing/projects
    roles: [Regulator]
    input: [license_number, project_name, installed_capacity_mw, base_annual_generation_mwh, license_expiration_date, "infeasibility_waiver_granted?"]
    output: RelicensingProject
    side_effects:
      - "Creates the project with stage PRE_FILING, wqc_status NONE, version 1, an all-zero burden ledger."
      - "Computes timeline_posture from the PAD milestone via calculations.relicensing_timeline_posture, then regulatory_posture."
  - method: GET
    path: /relicensing/projects
    roles: [Licensee, AgencyReviewer, Stakeholder, StateCertifier, Regulator]
    input: ["stage?", "regulatory_posture?", "timeline_posture?", "limit?", "offset?"]
    output: RelicensingProject[]
    side_effects: []
  - method: GET
    path: /relicensing/projects/{project_id}
    roles: [Licensee, AgencyReviewer, Stakeholder, StateCertifier, Regulator]
    input: []
    output: RelicensingProject
    side_effects: []
  - method: PATCH
    path: /relicensing/projects/{project_id}
    roles: [Regulator]
    input: ["project_name?", "base_annual_generation_mwh?", "infeasibility_waiver_granted?"]
    output: RelicensingProject
    side_effects:
      - "Changing base_annual_generation_mwh or infeasibility_waiver_granted re-runs calculations.project_burden_ledger and then project_regulatory_posture."
      - "Increments version by 1."
  - method: POST
    path: /relicensing/projects/{project_id}/pre-application-document
    roles: [Licensee]
    input: ["filing_note?"]
    output: RelicensingProject
    side_effects:
      - "stage PRE_FILING -> PAD_FILED; sets pad_filed_at and pad_year from the logical clock."
      - "Recomputes timeline_posture against application_due_date, then regulatory_posture; increments version."
  - method: POST
    path: /relicensing/projects/{project_id}/run-compliance-sweep
    roles: [Regulator]
    input: []
    output: RelicensingProject
    side_effects:
      - "Ops-run checkpoint. Idempotent for a fixed clock value: re-running at the same clock changes nothing."
      - "Marks every ComplianceObligation of the project's non-superseded orders with status IN {PENDING, SCHEDULED} and due_date before the clock date as OVERDUE, stamping overdue_marked_at."
      - "Recomputes LicenseOrder.open_violation_count, moving orders EFFECTIVE -> COMPLIANCE_FLAGGED."
      - "Moves a WaterQualityCertification with status REQUESTED past its statutory_waiver_date to WAIVED and sets project.wqc_status = WAIVED."
      - "Recomputes timeline_posture, compliance_flag_count, then regulatory_posture; a resulting FROZEN posture moves LicenseApplication rows with filing_status IN {FILED, UNDER_REVIEW, DEFICIENT} to SUSPENDED."
      - "Sets last_sweep_at; increments version."

  # ---- Dam -----------------------------------------------------------------
  - method: POST
    path: /relicensing/dams
    roles: [Licensee]
    input: [project_id, dam_code, hazard_class, inspection_interval_months, "eap_exercise_required?", "max_concurrent_field_activities?"]
    output: Dam
    side_effects: ["Creates the dam; dam_code is unique per project."]
  - method: GET
    path: /relicensing/dams
    roles: [Licensee, AgencyReviewer, Stakeholder, StateCertifier, Regulator]
    input: ["project_id?", "hazard_class?", "limit?", "offset?"]
    output: Dam[]
    side_effects: []
  - method: GET
    path: /relicensing/dams/{dam_id}
    roles: [Licensee, AgencyReviewer, Stakeholder, StateCertifier, Regulator]
    input: []
    output: Dam
    side_effects: []

  # ---- StudySite -----------------------------------------------------------
  - method: POST
    path: /relicensing/sites
    roles: [Licensee]
    input: [project_id, site_code, river_mile, "min_rest_buffer_days?", "cultural_sensitivity?"]
    output: StudySite
    side_effects: ["Creates the site; site_code is unique per project."]
  - method: GET
    path: /relicensing/sites
    roles: [Licensee, AgencyReviewer, Stakeholder, StateCertifier, Regulator]
    input: ["project_id?", "cultural_sensitivity?", "limit?", "offset?"]
    output: StudySite[]
    side_effects: []
  - method: GET
    path: /relicensing/sites/{site_id}
    roles: [Licensee, AgencyReviewer, Stakeholder, StateCertifier, Regulator]
    input: []
    output: StudySite
    side_effects: []

  # ---- StudyPlan -----------------------------------------------------------
  - method: POST
    path: /relicensing/study-plans
    roles: [Licensee]
    input: [project_id, plan_title]
    output: StudyPlan
    side_effects:
      - "Creates the plan in DRAFT with revision_round 0 and zero counters."
      - "Supersedes any existing plan of the project in DRAFT, UNDER_AGENCY_REVIEW or REVISION_REQUIRED, then recomputes project.unresolved_mandatory_comment_count and regulatory_posture."
      - "Advances project.stage PAD_FILED -> STUDY_PHASE on the first plan."
  - method: GET
    path: /relicensing/study-plans
    roles: [Licensee, AgencyReviewer, Stakeholder, StateCertifier, Regulator]
    input: ["project_id?", "status?", "limit?", "offset?"]
    output: StudyPlan[]
    side_effects: []
  - method: GET
    path: /relicensing/study-plans/{study_plan_id}
    roles: [Licensee, AgencyReviewer, Stakeholder, StateCertifier, Regulator]
    input: []
    output: StudyPlan
    side_effects: []
  - method: POST
    path: /relicensing/study-plans/{study_plan_id}/submit
    roles: [Licensee]
    input: ["submission_note?"]
    output: StudyPlan
    side_effects:
      - "status DRAFT or REVISION_REQUIRED -> UNDER_AGENCY_REVIEW; sets submitted_at; increments version."
  - method: POST
    path: /relicensing/study-plans/{study_plan_id}/determination
    roles: [AgencyReviewer]
    input: [determination, "reopen_deferred_comments?", "determination_note?"]
    output: StudyPlan
    side_effects:
      - "APPROVE: status -> APPROVED, sets approved_at; requires unresolved_mandatory_comment_count == 0."
      - "REQUIRE_REVISION: status -> REVISION_REQUIRED, revision_round += 1; with reopen_deferred_comments true every RESOLVED comment with disposition DEFERRED returns to OPEN, reopen_count += 1, and both plan counters are restored."
      - "Recomputes project.unresolved_mandatory_comment_count and regulatory_posture; increments version."

  # ---- ResourceStudy -------------------------------------------------------
  - method: POST
    path: /relicensing/studies
    roles: [Licensee]
    input: [study_plan_id, site_id, resource_category, study_title, fieldwork_window_start, fieldwork_window_end, "cultural_clearance_reference?"]
    output: ResourceStudy
    side_effects:
      - "Creates the study with fieldwork_status PLANNED and review_status NOT_SUBMITTED."
      - "Increments StudyPlan.attached_study_count and StudyPlan.version."
  - method: GET
    path: /relicensing/studies
    roles: [Licensee, AgencyReviewer, Stakeholder, StateCertifier, Regulator]
    input: ["study_plan_id?", "site_id?", "resource_category?", "fieldwork_status?", "review_status?", "limit?", "offset?"]
    output: ResourceStudy[]
    side_effects: []
  - method: GET
    path: /relicensing/studies/{study_id}
    roles: [Licensee, AgencyReviewer, Stakeholder, StateCertifier, Regulator]
    input: []
    output: ResourceStudy
    side_effects: []
  - method: POST
    path: /relicensing/studies/{study_id}/fieldwork
    roles: [Licensee]
    input: [action, "fieldwork_note?"]
    output: ResourceStudy
    side_effects:
      - "action START | SUSPEND | RESUME | COMPLETE moves fieldwork_status along its own dimension only; review_status is untouched."
      - "Increments version."
  - method: POST
    path: /relicensing/studies/{study_id}/report
    roles: [Licensee]
    input: ["report_note?"]
    output: ResourceStudy
    side_effects:
      - "review_status NOT_SUBMITTED or ADDITIONAL_REQUIRED -> UNDER_REVIEW; requires fieldwork_status == COMPLETED."
      - "Sets report_submitted_at and report_submitted_by_user_id from the acting X-User-ID; increments version."
  - method: POST
    path: /relicensing/studies/{study_id}/review-decision
    roles: [AgencyReviewer]
    input: [decision, "review_note?"]
    output: ResourceStudy
    side_effects:
      - "ACCEPT: review_status -> ACCEPTED."
      - "REQUIRE_ADDITIONAL: review_status -> ADDITIONAL_REQUIRED, additional_round_count += 1, and fieldwork_status COMPLETED -> IN_PROGRESS on the same row; rejected once additional_round_count has reached 2."
      - "Increments version."

  # ---- ConsultationComment -------------------------------------------------
  - method: POST
    path: /relicensing/comments
    roles: [AgencyReviewer, Stakeholder]
    input: [study_plan_id, party_id, resource_category, comment_text, "is_mandatory_condition?"]
    output: ConsultationComment
    side_effects:
      - "Creates the comment with resolution_status OPEN, disposition null, reopen_count 0."
      - "Increments StudyPlan.open_comment_count and, for mandatory comments, StudyPlan.unresolved_mandatory_comment_count and StudyPlan.version."
      - "Recomputes project.unresolved_mandatory_comment_count, then regulatory_posture (OPEN -> RESTRICTED on the first mandatory comment)."
  - method: GET
    path: /relicensing/comments
    roles: [Licensee, AgencyReviewer, Stakeholder, StateCertifier, Regulator]
    input: ["study_plan_id?", "party_id?", "resolution_status?", "is_mandatory_condition?", "limit?", "offset?"]
    output: ConsultationComment[]
    side_effects: []
  - method: GET
    path: /relicensing/comments/{comment_id}
    roles: [Licensee, AgencyReviewer, Stakeholder, StateCertifier, Regulator]
    input: []
    output: ConsultationComment
    side_effects: []
  - method: POST
    path: /relicensing/comments/{comment_id}/resolve
    roles: [Licensee]
    input: [disposition, "resolution_note?"]
    output: ConsultationComment
    side_effects:
      - "resolution_status OPEN -> RESOLVED; stores disposition and resolved_at."
      - "Decrements StudyPlan.open_comment_count and, for mandatory comments, StudyPlan.unresolved_mandatory_comment_count; increments StudyPlan.version."
      - "Recomputes project.unresolved_mandatory_comment_count, then regulatory_posture."

  # ---- SettlementParty -----------------------------------------------------
  - method: POST
    path: /relicensing/parties
    roles: [Regulator]
    input: [project_id, party_name, party_type, "has_conditioning_authority?", "vote_weight?", "contact_user_id?"]
    output: SettlementParty
    side_effects:
      - "Registers the party; contact_user_id binds the AgencyReviewer or Stakeholder user identity to this party."
      - "Changes the denominator used by calculations.settlement_support_tally at the next tally."
  - method: GET
    path: /relicensing/parties
    roles: [Licensee, AgencyReviewer, Stakeholder, StateCertifier, Regulator]
    input: ["project_id?", "party_type?", "has_conditioning_authority?", "limit?", "offset?"]
    output: SettlementParty[]
    side_effects: []
  - method: GET
    path: /relicensing/parties/{party_id}
    roles: [Licensee, AgencyReviewer, Stakeholder, StateCertifier, Regulator]
    input: []
    output: SettlementParty
    side_effects: []

  # ---- Settlement ----------------------------------------------------------
  - method: POST
    path: /relicensing/settlements
    roles: [Licensee]
    input: [project_id, title, expected_project_version]
    output: Settlement
    side_effects:
      - "Rejects with ERR_STALE_PROJECT_VERSION (412) when expected_project_version does not equal RelicensingProject.version."
      - "Creates the settlement in NEGOTIATING with round_number 1."
      - "Supersedes an existing NEGOTIATING or CIRCULATED settlement of the project and cascades its PROPOSED measures to SUPERSEDED."
      - "Increments RelicensingProject.version."
  - method: GET
    path: /relicensing/settlements
    roles: [Licensee, AgencyReviewer, Stakeholder, StateCertifier, Regulator]
    input: ["project_id?", "status?", "limit?", "offset?"]
    output: Settlement[]
    side_effects: []
  - method: GET
    path: /relicensing/settlements/{settlement_id}
    roles: [Licensee, AgencyReviewer, Stakeholder, StateCertifier, Regulator]
    input: []
    output: Settlement
    side_effects: []
  - method: POST
    path: /relicensing/settlements/{settlement_id}/circulate
    roles: [Licensee]
    input: ["circulation_note?"]
    output: Settlement
    side_effects:
      - "status NEGOTIATING -> CIRCULATED; sets circulated_at and total_vote_weight; increments version."
  - method: POST
    path: /relicensing/settlements/{settlement_id}/tally
    roles: [Licensee]
    input: [intended_outcome, "tally_note?"]
    output: Settlement
    side_effects:
      - "Runs calculations.settlement_support_tally over the current round's signatures and persists share_pct per signature plus support_pct and total_vote_weight."
      - "EXECUTE: requires an APPROVED study plan, no conditioning-party OPPOSE and support_pct >= 66.67; status -> EXECUTED, PROPOSED measures of the settlement -> INCLUDED, then the project burden ledger and regulatory_posture are recomputed."
      - "CLOSE_ROUND below round 3: status -> NEGOTIATING, round_number += 1, prior signatures retained."
      - "CLOSE_ROUND at round 3: status -> FAILED and PROPOSED measures -> SUPERSEDED."
      - "Increments version."
  - method: POST
    path: /relicensing/settlements/{settlement_id}/withdraw
    roles: [Licensee]
    input: [withdrawal_reason]
    output: Settlement
    side_effects:
      - "status EXECUTED -> WITHDRAWN; sets withdrawn_at, included_measure_count = 0."
      - "INCLUDED measures of the settlement -> WITHDRAWN; their PENDING, SCHEDULED or OVERDUE obligations -> WAIVED."
      - "Recomputes the project burden ledger back to its pre-execution values and then regulatory_posture; increments version."

  # ---- SettlementSignature -------------------------------------------------
  - method: POST
    path: /relicensing/signatures
    roles: [AgencyReviewer, Stakeholder]
    input: [settlement_id, party_id, position]
    output: SettlementSignature
    side_effects:
      - "Records an immutable signature stamped with the settlement's current round_number; one per party per round."
      - "share_pct stays null until the round is tallied."
  - method: GET
    path: /relicensing/signatures
    roles: [Licensee, AgencyReviewer, Stakeholder, StateCertifier, Regulator]
    input: ["settlement_id?", "party_id?", "round_number?", "position?", "limit?", "offset?"]
    output: SettlementSignature[]
    side_effects: []
  - method: GET
    path: /relicensing/signatures/{signature_id}
    roles: [Licensee, AgencyReviewer, Stakeholder, StateCertifier, Regulator]
    input: []
    output: SettlementSignature
    side_effects: []

  # ---- WaterQualityCertification ------------------------------------------
  - method: POST
    path: /relicensing/water-quality-certifications
    roles: [Licensee]
    input: [project_id, certifying_agency_name]
    output: WaterQualityCertification
    side_effects:
      - "Creates the request in REQUESTED; statutory_waiver_date = requested_at date plus 12 months."
      - "Sets project.wqc_status = REQUESTED, recomputes regulatory_posture, increments RelicensingProject.version."
  - method: GET
    path: /relicensing/water-quality-certifications
    roles: [Licensee, AgencyReviewer, Stakeholder, StateCertifier, Regulator]
    input: ["project_id?", "status?", "limit?", "offset?"]
    output: WaterQualityCertification[]
    side_effects: []
  - method: GET
    path: /relicensing/water-quality-certifications/{wqc_id}
    roles: [Licensee, AgencyReviewer, Stakeholder, StateCertifier, Regulator]
    input: []
    output: WaterQualityCertification
    side_effects: []
  - method: POST
    path: /relicensing/water-quality-certifications/{wqc_id}/decision
    roles: [StateCertifier]
    input: [decision, "conditions?", "denial_reason?"]
    output: WaterQualityCertification
    side_effects:
      - "ISSUE_WITH_CONDITIONS: status -> CERTIFIED_WITH_CONDITIONS, condition_count = length(conditions); one PmeMeasure per condition is created with source WQC_CONDITION, status INCLUDED and PRELIMINARY estimates, then the project burden ledger and regulatory_posture are recomputed."
      - "DENY: status -> DENIED, project.wqc_status = DENIED, regulatory_posture -> FROZEN, and every LicenseApplication with filing_status IN {FILED, UNDER_REVIEW, DEFICIENT} -> SUSPENDED."
      - "Sets decided_at; increments RelicensingProject.version."
      - "Each element of conditions carries measure_name, resource_category, capital_cost_usd, annual_om_cost_usd, construction_start_year, implementation_months, flow_release_cfs, gross_head_ft and release_days."

  # ---- PmeMeasure ----------------------------------------------------------
  - method: POST
    path: /relicensing/pme-measures
    roles: [Licensee]
    input: [project_id, measure_name, resource_category, source, capital_cost_usd, annual_om_cost_usd, construction_start_year, implementation_months, flow_release_cfs, gross_head_ft, release_days, "settlement_id?", "prerequisite_measure_id?"]
    output: PmeMeasure
    side_effects:
      - "Creates the measure with cost_estimate_variant PRELIMINARY and created_by_user_id from the acting X-User-ID."
      - "status starts PROPOSED when source == SETTLEMENT (settlement_id required) and INCLUDED otherwise."
      - "Runs calculations.pme_cost_and_generation_impact, then, for INCLUDED measures, the project burden ledger and regulatory_posture."
  - method: GET
    path: /relicensing/pme-measures
    roles: [Licensee, AgencyReviewer, Stakeholder, StateCertifier, Regulator]
    input: ["project_id?", "settlement_id?", "prerequisite_measure_id?", "status?", "source?", "resource_category?", "cost_estimate_variant?", "limit?", "offset?"]
    output: PmeMeasure[]
    side_effects: []
  - method: GET
    path: /relicensing/pme-measures/{measure_id}
    roles: [Licensee, AgencyReviewer, Stakeholder, StateCertifier, Regulator]
    input: []
    output: PmeMeasure
    side_effects: []
  - method: PATCH
    path: /relicensing/pme-measures/{measure_id}
    roles: [Licensee]
    input: ["measure_name?", "capital_cost_usd?", "annual_om_cost_usd?", "construction_start_year?", "implementation_months?", "flow_release_cfs?", "gross_head_ft?", "release_days?", "prerequisite_measure_id?"]
    output: PmeMeasure
    side_effects:
      - "Allowed only while status IN {PROPOSED, INCLUDED}; re-runs the measure calculation under the measure's current cost_estimate_variant."
      - "Rejects a prerequisite_measure_id that closes a cycle; recomputes the project burden ledger and regulatory_posture for INCLUDED measures; increments version."
  - method: POST
    path: /relicensing/pme-measures/{measure_id}/cost-estimate
    roles: [Licensee]
    input: ["capital_cost_usd?", "annual_om_cost_usd?", "gross_head_ft?", "estimate_note?"]
    output: PmeMeasure
    side_effects:
      - "Switches cost_estimate_variant PRELIMINARY -> DEFINITIVE, stores definitive_estimate_by_user_id and re-runs the measure calculation under the DEFINITIVE variant."
      - "Rejected with ERR_SEGREGATION_OF_DUTIES when the acting user equals created_by_user_id."
      - "Recomputes the project burden ledger and regulatory_posture; increments version."

  # ---- LicenseApplication --------------------------------------------------
  - method: POST
    path: /relicensing/applications
    roles: [Licensee]
    input: [project_id, application_type, expected_project_version, "amends_order_id?", "filing_note?"]
    output: LicenseApplication
    side_effects:
      - "Rejects with ERR_STALE_PROJECT_VERSION (412) when expected_project_version does not equal RelicensingProject.version."
      - "Creates the application with filing_status FILED and ea_stage NOT_STARTED, pinning pinned_study_plan_id/version, pinned_settlement_id/version, pinned_measure_ids and pinned_total_annual_burden_usd from current state."
      - "ORIGINAL_RELICENSE: project.stage STUDY_PHASE -> APPLICATION_FILED and application_filed_at is stamped; timeline_posture recomputed."
      - "AMENDMENT: requires amends_order_id on an EFFECTIVE order, sets that order's amendment_pending = true and supersedes any prior pending amendment on the same order."
      - "Increments RelicensingProject.version."
  - method: GET
    path: /relicensing/applications
    roles: [Licensee, AgencyReviewer, Stakeholder, StateCertifier, Regulator]
    input: ["project_id?", "amends_order_id?", "application_type?", "filing_status?", "ea_stage?", "limit?", "offset?"]
    output: LicenseApplication[]
    side_effects: []
  - method: GET
    path: /relicensing/applications/{application_id}
    roles: [Licensee, AgencyReviewer, Stakeholder, StateCertifier, Regulator]
    input: []
    output: LicenseApplication
    side_effects: []
  - method: POST
    path: /relicensing/applications/{application_id}/environmental-review
    roles: [Regulator]
    input: [target_stage, "review_note?"]
    output: LicenseApplication
    side_effects:
      - "Advances ea_stage NOT_STARTED -> SCOPING -> DRAFT_EA -> FINAL_EA one step at a time."
      - "The SCOPING advance also moves filing_status FILED -> UNDER_REVIEW and project.stage APPLICATION_FILED -> UNDER_ENVIRONMENTAL_REVIEW."
      - "The FINAL_EA advance requires every WQC_CONDITION measure to carry a DEFINITIVE estimate."
      - "Increments version."
  - method: POST
    path: /relicensing/applications/{application_id}/deficiency
    roles: [Regulator]
    input: [deficiency_note]
    output: LicenseApplication
    side_effects:
      - "filing_status UNDER_REVIEW -> DEFICIENT; deficiency_count += 1; stores last_deficiency_note."
      - "Recomputes project.open_deficiency_count, then regulatory_posture; increments version."
  - method: POST
    path: /relicensing/applications/{application_id}/cure
    roles: [Licensee]
    input: ["cure_note?"]
    output: LicenseApplication
    side_effects:
      - "filing_status DEFICIENT or SUSPENDED -> UNDER_REVIEW; re-pins every pinned_* field from current state."
      - "Recomputes project.open_deficiency_count, then regulatory_posture; increments version."
  - method: POST
    path: /relicensing/applications/{application_id}/order
    roles: [Regulator]
    input: [order_number, "order_note?"]
    output: LicenseOrder
    side_effects:
      - "filing_status UNDER_REVIEW -> LICENSED (requires ea_stage FINAL_EA, wqc_status IN {CERTIFIED_WITH_CONDITIONS, WAIVED} and a non-RESTRICTED, non-FROZEN posture)."
      - "Creates a LicenseOrder in EFFECTIVE with effective_date = the logical clock date and generates its ComplianceObligation set per calculations.obligation_schedule_generation."
      - "For AMENDMENT applications the amended order goes EFFECTIVE -> SUPERSEDED, its amendment_pending clears and its PENDING or SCHEDULED obligations are re-created against the new order while the originals go WAIVED."
      - "project.stage -> LICENSED; recomputes regulatory_posture; increments RelicensingProject.version."

  # ---- LicenseOrder --------------------------------------------------------
  - method: GET
    path: /relicensing/orders
    roles: [Licensee, AgencyReviewer, Stakeholder, StateCertifier, Regulator]
    input: ["application_id?", "compliance_state?", "amendment_pending?", "limit?", "offset?"]
    output: LicenseOrder[]
    side_effects: []
  - method: GET
    path: /relicensing/orders/{order_id}
    roles: [Licensee, AgencyReviewer, Stakeholder, StateCertifier, Regulator]
    input: []
    output: LicenseOrder
    side_effects: []
  - method: POST
    path: /relicensing/orders/{order_id}/annual-report
    roles: [Licensee]
    input: [report_basis, period_year, "report_note?"]
    output: LicenseOrder
    side_effects:
      - "Runs calculations.compliance_year_assessment under the requested basis and stores assessed_obligation_count, noncompliant_obligation_count, compliance_score, last_report_basis, last_report_period_year and last_report_filed_at."
      - "A report with noncompliant_obligation_count > 0 moves compliance_state EFFECTIVE -> COMPLIANCE_FLAGGED, which recomputes project.compliance_flag_count and regulatory_posture."
      - "Permitted while the project is FROZEN: statutory compliance reporting is a cure path and never clears COMPLIANCE_FLAGGED by itself."
      - "Increments version."

  # ---- ComplianceObligation -----------------------------------------------
  - method: GET
    path: /relicensing/obligations
    roles: [Licensee, AgencyReviewer, Stakeholder, StateCertifier, Regulator]
    input: ["order_id?", "pme_measure_id?", "dam_id?", "obligation_type?", "status?", "limit?", "offset?"]
    output: ComplianceObligation[]
    side_effects: []
  - method: GET
    path: /relicensing/obligations/{obligation_id}
    roles: [Licensee, AgencyReviewer, Stakeholder, StateCertifier, Regulator]
    input: []
    output: ComplianceObligation
    side_effects: []
  - method: POST
    path: /relicensing/obligations/{obligation_id}/schedule
    roles: [Licensee]
    input: [activity_window_start, activity_window_end, "schedule_note?"]
    output: ComplianceObligation
    side_effects:
      - "status PENDING or OVERDUE -> SCHEDULED; stores the closed activity window."
      - "Enforces Dam.max_concurrent_field_activities across overlapping closed windows for dam-bound obligations and the prerequisite-implemented rule for PME obligations."
      - "Allowed while the project is FROZEN because it is a cure path; increments version."
  - method: POST
    path: /relicensing/obligations/{obligation_id}/certify
    roles: [Licensee]
    input: ["certification_note?"]
    output: ComplianceObligation
    side_effects:
      - "status SCHEDULED -> CERTIFIED; stores certified_at and certified_by_user_id; requires the clock to have reached activity_window_start."
      - "PME_IMPLEMENTATION obligations move their measure INCLUDED -> IMPLEMENTED and re-run the project burden ledger."
      - "Recomputes LicenseOrder.open_violation_count; reaching 0 moves the order COMPLIANCE_FLAGGED -> EFFECTIVE, which recomputes project.compliance_flag_count and regulatory_posture."
      - "Allowed while the project is FROZEN because it is a cure path; increments version."

# =============================================================================
# §1.6 Error Catalog
# =============================================================================
errors:
  - error_id: ERR_UNAUTHORIZED
    http_status: 401
    when: "X-User-ID header is missing or names no known user."
  - error_id: ERR_ROLE_NOT_PERMITTED
    http_status: 403
    when: "The acting user's role is not listed for the endpoint, or an AgencyReviewer/Stakeholder acts on a project it is not a registered party of."
  - error_id: ERR_VALIDATION
    http_status: 400
    when: "Pagination parameters are out of range (limit outside 1..100, negative offset)."
  - error_id: ERR_INVALID_REQUEST
    http_status: 400
    when: "A required body field is missing, a value fails its type/enum/range constraint, an interval payload is mis-ordered, has_conditioning_authority is true for a non-agency party, an ISSUE_WITH_CONDITIONS decision carries no conditions, a DENY decision carries no denial_reason, or a plan with no attached studies is submitted."
  - error_id: ERR_DUPLICATE_KEY
    http_status: 409
    when: "license_number, order_number, per-project dam_code or per-project site_code is already taken."
  - error_id: ERR_CROSS_PROJECT_REFERENCE
    http_status: 422
    when: "Two references in one request body belong to different RelicensingProject rows."
  - error_id: ERR_STALE_PROJECT_VERSION
    http_status: 412
    when: "expected_project_version does not equal the target RelicensingProject.version on POST /relicensing/settlements or POST /relicensing/applications."
  - error_id: ERR_PROJECT_NOT_FOUND
    http_status: 404
    when: "project_id in the path or body names no RelicensingProject."
  - error_id: ERR_DAM_NOT_FOUND
    http_status: 404
    when: "dam_id names no Dam."
  - error_id: ERR_SITE_NOT_FOUND
    http_status: 404
    when: "site_id names no StudySite."
  - error_id: ERR_STUDY_PLAN_NOT_FOUND
    http_status: 404
    when: "study_plan_id names no StudyPlan."
  - error_id: ERR_STUDY_NOT_FOUND
    http_status: 404
    when: "study_id names no ResourceStudy."
  - error_id: ERR_COMMENT_NOT_FOUND
    http_status: 404
    when: "comment_id names no ConsultationComment."
  - error_id: ERR_PARTY_NOT_FOUND
    http_status: 404
    when: "party_id names no SettlementParty."
  - error_id: ERR_SETTLEMENT_NOT_FOUND
    http_status: 404
    when: "settlement_id names no Settlement."
  - error_id: ERR_WQC_NOT_FOUND
    http_status: 404
    when: "wqc_id names no WaterQualityCertification."
  - error_id: ERR_MEASURE_NOT_FOUND
    http_status: 404
    when: "measure_id or prerequisite_measure_id names no PmeMeasure."
  - error_id: ERR_APPLICATION_NOT_FOUND
    http_status: 404
    when: "application_id names no LicenseApplication."
  - error_id: ERR_ORDER_NOT_FOUND
    http_status: 404
    when: "order_id or amends_order_id names no LicenseOrder."
  - error_id: ERR_OBLIGATION_NOT_FOUND
    http_status: 404
    when: "obligation_id names no ComplianceObligation."
  - error_id: ERR_PROJECT_POSTURE_FROZEN
    http_status: 409
    when: "The project's regulatory_posture is FROZEN and the request is not one of the cure paths (application cure, obligation schedule, obligation certify, annual report, run-compliance-sweep)."
  - error_id: ERR_PROJECT_POSTURE_RESTRICTED
    http_status: 409
    when: "Order issuance is attempted while the project's regulatory_posture is RESTRICTED."
  - error_id: ERR_PROJECT_STAGE_INVALID
    http_status: 409
    when: "The project's stage does not permit the operation (PAD filed twice, study plan created before the PAD, ORIGINAL_RELICENSE filed outside STUDY_PHASE, AMENDMENT filed before the project is LICENSED)."
  - error_id: ERR_STUDY_PLAN_STATE_INVALID
    http_status: 409
    when: "A plan is submitted from UNDER_AGENCY_REVIEW, APPROVED or SUPERSEDED, or a determination is made on a plan that is not UNDER_AGENCY_REVIEW."
  - error_id: ERR_STUDY_STATE_INVALID
    http_status: 409
    when: "A fieldwork action does not match the current fieldwork_status, a report is submitted while fieldwork_status is not COMPLETED or review_status is UNDER_REVIEW/ACCEPTED, a review decision is made outside UNDER_REVIEW, or REQUIRE_ADDITIONAL is used after two additional rounds."
  - error_id: ERR_SETTLEMENT_STATE_INVALID
    http_status: 409
    when: "Circulate outside NEGOTIATING, tally outside CIRCULATED, withdraw outside EXECUTED, or a new settlement opened while an EXECUTED settlement exists."
  - error_id: ERR_WQC_STATE_INVALID
    http_status: 409
    when: "A second REQUESTED certification is created, a decision is made on a decided certification, a certification is requested outside stages STUDY_PHASE/APPLICATION_FILED/UNDER_ENVIRONMENTAL_REVIEW, or an ORIGINAL_RELICENSE application is filed while wqc_status is NONE."
  - error_id: ERR_APPLICATION_STATE_INVALID
    http_status: 409
    when: "An EA stage is skipped or repeated, a deficiency is raised outside UNDER_REVIEW, a cure is attempted outside DEFICIENT/SUSPENDED, or an order is issued from a filing_status other than UNDER_REVIEW or with ea_stage != FINAL_EA."
  - error_id: ERR_ORDER_STATE_INVALID
    http_status: 409
    when: "An amendment targets an order that is not EFFECTIVE, or a settlement withdrawal is attempted while an order of the project is EFFECTIVE or COMPLIANCE_FLAGGED."
  - error_id: ERR_OBLIGATION_STATE_INVALID
    http_status: 409
    when: "An obligation is scheduled from a status other than PENDING or OVERDUE, or certified from a status other than SCHEDULED."
  - error_id: ERR_COMMENT_ALREADY_RESOLVED
    http_status: 409
    when: "A comment that is already RESOLVED is resolved again."
  - error_id: ERR_SIGNATURE_ROUND_CLOSED
    http_status: 409
    when: "A signature is recorded while the settlement is not CIRCULATED."
  - error_id: ERR_DUPLICATE_SIGNATURE
    http_status: 409
    when: "The same party signs twice within one round."
  - error_id: ERR_UNRESOLVED_MANDATORY_COMMENTS
    http_status: 409
    when: "A study plan with unresolved mandatory comments is approved."
  - error_id: ERR_STUDY_PLAN_NOT_APPROVED
    http_status: 409
    when: "A settlement is executed or an ORIGINAL_RELICENSE application is filed before the project has an APPROVED study plan."
  - error_id: ERR_STUDY_NOT_ACCEPTED
    http_status: 409
    when: "An ORIGINAL_RELICENSE application is filed while a study of the approved plan has review_status != ACCEPTED."
  - error_id: ERR_DEFINITIVE_ESTIMATE_REQUIRED
    http_status: 409
    when: "An application is advanced to FINAL_EA while a WQC_CONDITION measure still carries a PRELIMINARY estimate."
  - error_id: ERR_WQC_CONDITION_NOT_INCORPORATED
    http_status: 422
    when: "An order is issued while project.wqc_status is still REQUESTED, so the state's conditions cannot be reflected in the license."
  - error_id: ERR_PREREQUISITE_NOT_IMPLEMENTED
    http_status: 409
    when: "A PME obligation is scheduled while its measure's prerequisite measure is not IMPLEMENTED."
  - error_id: ERR_PREREQUISITE_CYCLE
    http_status: 422
    when: "prerequisite_measure_id would close a cycle in the measure prerequisite graph or points at the measure itself."
  - error_id: ERR_SITE_WINDOW_CONFLICT
    http_status: 409
    when: "A study's buffered half-open fieldwork window overlaps another active study's buffered window at the same site."
  - error_id: ERR_REPORT_PERIOD_INVALID
    http_status: 409
    when: "An annual report is filed for a period that has not started, or the same basis and period_year is filed twice for one order."
  - error_id: ERR_CERTIFICATION_TOO_EARLY
    http_status: 409
    when: "An obligation is certified before its activity_window_start."
  - error_id: ERR_FILING_DEADLINE_PASSED
    http_status: 409
    when: "The PAD is filed after pad_due_date or an ORIGINAL_RELICENSE application after application_due_date."
  - error_id: ERR_CULTURAL_CLEARANCE_MISSING
    http_status: 422
    when: "A study is created at a site with cultural_sensitivity HIGH without a cultural_clearance_reference."
  - error_id: ERR_DAM_ACTIVITY_CAPACITY_EXCEEDED
    http_status: 409
    when: "Scheduling a dam-bound obligation would exceed Dam.max_concurrent_field_activities over overlapping closed windows."
  - error_id: ERR_SEGREGATION_OF_DUTIES
    http_status: 409
    when: "The same user records a DEFINITIVE estimate for a measure it created, or certifies an obligation in a resource category whose study report it submitted."
  - error_id: ERR_SUPPORT_THRESHOLD_NOT_MET
    http_status: 422
    when: "An EXECUTE tally yields support_pct below 66.67."
  - error_id: ERR_CONDITIONING_PARTY_VETO
    http_status: 422
    when: "An EXECUTE tally runs while a conditioning-authority party recorded OPPOSE in the current round."
  - error_id: ERR_BURDEN_RATIO_EXCEEDED
    http_status: 422
    when: "An application is filed while burden_ratio_pct >= 15.00 and infeasibility_waiver_granted is false."

# =============================================================================
# §1.7 RBAC / Permission Table
# =============================================================================
roles:
  - role: Licensee
    identity: opaque
    description: |
      The hydroelectric licensee's staff. Identified only by the X-User-ID header
      value; no entity backs the identity, but individual user ids are tracked on
      PmeMeasure.created_by_user_id, PmeMeasure.definitive_estimate_by_user_id,
      ResourceStudy.report_submitted_by_user_id and
      ComplianceObligation.certified_by_user_id to enforce segregation of duties.
    exclusive_operations:
      - "POST /relicensing/dams"
      - "POST /relicensing/sites"
      - "POST /relicensing/projects/{project_id}/pre-application-document"
      - "POST /relicensing/study-plans"
      - "POST /relicensing/study-plans/{study_plan_id}/submit"
      - "POST /relicensing/studies"
      - "POST /relicensing/studies/{study_id}/fieldwork"
      - "POST /relicensing/studies/{study_id}/report"
      - "POST /relicensing/comments/{comment_id}/resolve"
      - "POST /relicensing/settlements"
      - "POST /relicensing/settlements/{settlement_id}/circulate"
      - "POST /relicensing/settlements/{settlement_id}/tally"
      - "POST /relicensing/settlements/{settlement_id}/withdraw"
      - "POST /relicensing/water-quality-certifications"
      - "POST /relicensing/pme-measures"
      - "PATCH /relicensing/pme-measures/{measure_id}"
      - "POST /relicensing/pme-measures/{measure_id}/cost-estimate"
      - "POST /relicensing/applications"
      - "POST /relicensing/applications/{application_id}/cure"
      - "POST /relicensing/orders/{order_id}/annual-report"
      - "POST /relicensing/obligations/{obligation_id}/schedule"
      - "POST /relicensing/obligations/{obligation_id}/certify"
    shared_operations:
      - "every GET under /relicensing"
    restrictions:
      - "Cannot make agency determinations, sign settlements, decide water-quality certifications, register projects or parties, advance environmental review, raise deficiencies, issue orders or run the compliance sweep."
      - "Cannot record a DEFINITIVE estimate on a measure it created (ERR_SEGREGATION_OF_DUTIES)."
      - "Cannot certify an obligation in a resource category whose study report it submitted (ERR_SEGREGATION_OF_DUTIES)."

  - role: AgencyReviewer
    identity: "entity_backed:SettlementParty"
    description: |
      A resource-agency reviewer. The X-User-ID resolves to a SettlementParty row
      with party_type == AGENCY through SettlementParty.contact_user_id; requests
      touching a project the party is not registered on are not permitted.
      has_conditioning_authority == true additionally grants study-plan
      determination authority and a conditioning veto at settlement execution.
    exclusive_operations:
      - "POST /relicensing/study-plans/{study_plan_id}/determination"
      - "POST /relicensing/studies/{study_id}/review-decision"
    shared_operations:
      - "POST /relicensing/comments"
      - "POST /relicensing/signatures"
      - "every GET under /relicensing"
    restrictions:
      - "Study-plan determination requires has_conditioning_authority == true (ERR_ROLE_NOT_PERMITTED)."
      - "Cannot act on a project where its backing SettlementParty is not registered (ERR_ROLE_NOT_PERMITTED)."
      - "Cannot perform any licensee, state-certifier or regulator operation."

  - role: Stakeholder
    identity: "entity_backed:SettlementParty"
    description: |
      A tribe or nongovernmental organization participant. The X-User-ID resolves
      to a SettlementParty row with party_type IN {TRIBE, NGO} through
      SettlementParty.contact_user_id. Stakeholders comment and sign but never
      make determinations.
    exclusive_operations: []
    shared_operations:
      - "POST /relicensing/comments"
      - "POST /relicensing/signatures"
      - "every GET under /relicensing"
    restrictions:
      - "Cannot make study-plan determinations or study review decisions even with a mandatory comment on file (ERR_ROLE_NOT_PERMITTED)."
      - "Cannot act on a project where its backing SettlementParty is not registered."

  - role: StateCertifier
    identity: opaque
    description: |
      The state water-quality certifying authority. Identified by the X-User-ID
      header only; it holds a single decision authority whose conditions become
      PME measures in the license.
    exclusive_operations:
      - "POST /relicensing/water-quality-certifications/{wqc_id}/decision"
    shared_operations:
      - "every GET under /relicensing"
    restrictions:
      - "Cannot request a certification (that is the licensee's filing), create measures, or touch applications, orders or obligations."

  - role: Regulator
    identity: opaque
    description: |
      The federal licensing authority. Identified by the X-User-ID header only.
      Owns the license registry, party registry, environmental review, deficiency
      notices, order issuance and the compliance sweep.
    exclusive_operations:
      - "POST /relicensing/projects"
      - "PATCH /relicensing/projects/{project_id}"
      - "POST /relicensing/projects/{project_id}/run-compliance-sweep"
      - "POST /relicensing/parties"
      - "POST /relicensing/applications/{application_id}/environmental-review"
      - "POST /relicensing/applications/{application_id}/deficiency"
      - "POST /relicensing/applications/{application_id}/order"
    shared_operations:
      - "every GET under /relicensing"
    restrictions:
      - "Cannot file on the licensee's behalf (PAD, study plans, studies, settlements, certifications, measures, applications, cures, annual reports, obligation scheduling or certification)."
      - "Cannot make agency study determinations or sign settlements."
