            - { call: "POST /transparency/shoppable-service-lists", payload: { facility_id: "${fac}", title: "L", entries: [ { service_item_id: "${si}", display_name: "MRI", bundled_ancillary_item_ids: [], include_conditional_ancillaries: false, display_order: 1 } ] }, as: TransparencyOfficer, captures: { lst: $.data.id } }
            - { call: "POST /transparency/shoppable-service-lists/${lst}/certify", as: TransparencyOfficer }
            - { call: "POST /transparency/shoppable-service-lists/${lst}/publish", as: TransparencyOfficer }
          trigger:
            - { call: "GET /transparency/shoppable-service-lists/${lst}/display", as: Consumer, captures: { err: $.data.error_id } }
          assert: ["error_id == ERR_DISPLAY_DISABLED (http 422) despite the list being PUBLISHED"]

      - name: cascade_end_to_end_covered
        claim_type: cascading_side_effects
        grounds: ["complexity_profile.complexity_layers[1]"]
        excluded_because:
          difficulty_instance: gross_patch_cascades_to_cycle_rollup
          rationale: "Depth-3 item->rate->record->cycle cascade asserted end-to-end there; contract-terminate cascade in contract_terminate_cascades_to_record_extrema."

      - name: derived_rollup_reconciliation_covered
        claim_type: derived_field_reconciliation
        grounds: ["entities.PublicationCycle.fields.derived_rollup_cents"]
        excluded_because:
          difficulty_instance: gross_patch_cascades_to_cycle_rollup
          rationale: "Rollup recompute (40000 -> 80000) after the source-field mutation is asserted there."

  # ---------------------------------------------------------------------------
  - section: consistency_model
    instances:
      - name: immediate_consistency_read_after_write
        claim_type: immediate
        grounds: ["complexity_profile.consistency_model"]
        distinguishing_aspect: "Immediate consistency: a creation and a subsequent activation are visible in the very next read — the payer sub-resource reflects the new DRAFT contract, then its ACTIVE state after activate, with no delay or reconciliation window."
        test_recipe:
          setup: ["Facility F; payer PA"]
          setup_api_calls:
            - { call: "POST /transparency/facilities", payload: { name: "F", cms_certification_number: "CCN-CM1", bed_count: 50 }, as: PlatformAdmin, captures: { fac: $.data.id } }
            - { call: "POST /transparency/payers", payload: { name: "PA", payer_type: "COMMERCIAL" }, as: ContractManager, captures: { pa: $.data.id } }
          trigger:
            - { call: "POST /transparency/payer-contracts", payload: { facility_id: "${fac}", payer_id: "${pa}", confidentiality_clause: "DISCLOSE_ALLOWED", annual_volume: 100, effective_start: "2026-01-01T00:00:00Z", effective_end: "2026-12-31T00:00:00Z" }, as: ContractManager, captures: { ca: $.data.id } }
            - { call: "GET /transparency/payers/${pa}/payer-contracts", as: Consumer, captures: { st1: "$.data[0].status" } }
            - { call: "POST /transparency/payer-contracts/${ca}/activate", as: ContractManager }
            - { call: "GET /transparency/payers/${pa}/payer-contracts", as: Consumer, captures: { st2: "$.data[0].status" } }
          assert:
            - "read immediately after create: status == DRAFT"
            - "read immediately after activate: status == ACTIVE"
