  - rule_id: resource_temporal_overlap
    instances:

      - name: build_slot_half_open_windows_and_propulsion_changeover_buffer
        grounds:
          - validations[priority=47]
          - validations[priority=48]
          - errors[ERR_SLOT_WINDOW_OVERLAP]
          - errors[ERR_CHANGEOVER_BUFFER_VIOLATION]
          - entities.BuildSlot.fields.slot_days
          - concurrency_rules[slot-create-stale-line]
        distinguishing_aspect: |
          Line-calendar occupancy is half-open [start_date, end_date), so a slot ending 2026-09-14 and one
          starting 2026-09-14 are legal neighbours, while a slot starting 2026-09-20 collides with the
          [2026-09-14, 2026-09-21) neighbour. Layered on top is a propulsion-changeover rule: the same
          zero-day adjacency that is legal DIESEL-to-DIESEL is refused DIESEL-to-ELECTRIC until three
          clear days separate the windows.
        test_recipe:
          setup:
            - "NV 2026-2027 PUBLISHED (FLAT, required_route_range_mi 75.0) so both a DIESEL and an ELECTRIC bid conform"
            - "A 3-unit DIESEL order (units d1, d2, d3) and a 1-unit ELECTRIC order (unit e1), both promised 2026-12-01"
            - "ProductionLine L-C1: TYPE_C, horizon_slot_day_capacity 60, changeover_buffer_days 3"
            - "One PLANNED slot for d1 over [2026-09-07, 2026-09-14), created against the line's version 0"
