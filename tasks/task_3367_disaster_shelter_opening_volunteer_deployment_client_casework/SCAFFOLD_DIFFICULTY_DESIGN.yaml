  - rule_id: resource_temporal_overlap
    instances:
      - name: shift_half_open_interval_adjacency_allowed
        grounds:
          - validations[priority=6]
          - errors[ERR_SHIFT_OVERLAP]
          - entities.ShiftAssignment.fields.shift_start_at
          - entities.ShiftAssignment.fields.shift_end_at
        distinguishing_aspect: |
          Half-open interval semantics on the ShiftAssignment resource: a shift that starts exactly
          when another ends (16:00Z after 08:00Z-16:00Z) is accepted, while a one-minute intrusion
          (15:59Z) is rejected — adjacency is legal because the end instant is exclusive.
        test_recipe:
          setup:
            - "region GL, operation DR-9101, APPROVED shelter site, shelter OPEN, one ARRIVED volunteer with an APPROVED deployment"
            - "shift 1 already scheduled for 2026-09-03T08:00Z to 2026-09-03T16:00Z"
