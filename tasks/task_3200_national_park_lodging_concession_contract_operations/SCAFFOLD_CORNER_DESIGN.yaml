        claim_type: Valid Transition
        grounds:
          - state_machines.RateFiling.REJECTED_to_SUBMITTED
        distinguishing_aspect: "The revision cycle is repeatable: after F1 REJECTED -> F2 REJECTED, a third revision F3 still enters SUBMITTED — the loop has no counter limit in the contract."
        test_recipe:
          setup:
            - "ACTIVE contract; season; room class; study. F1 rejected, F2 (revision of F1) rejected."
          setup_api_calls:
            - *en_clock
            - *df_contract
            - *df_l1
            - *df_l2
            - *df_l3
            - *df_l4
