          - errors[ERR_BALANCE_OUTSTANDING]
        distinguishing_aspect: |
          Calling settle on a HOLD booking with an outstanding balance violates both
          state (priority 8) and business_fiscal (priority 19); the state error wins,
          so ERR_INVALID_STATE is returned, not ERR_BALANCE_OUTSTANDING.
        test_recipe:
          setup:
