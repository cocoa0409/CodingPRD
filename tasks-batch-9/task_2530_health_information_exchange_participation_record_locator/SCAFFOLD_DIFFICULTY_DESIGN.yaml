            - "GET /hie/break-glass-accesses filtered by cluster_id ${clusterT_id} returns exactly 3 rows"
  - rule_id: compensating_invariant
    instances:
      - name: unlink_restores_cluster_membership_conservation_after_a_confirmed_merge
        grounds:
          - calculations.cluster_membership_recount
          - state_machines.MatchLink.LINKED_to_UNLINKED
          - state_machines.IdentityCluster.MERGED_AWAY_to_ACTIVE
          - entities.PatientRecord.fields.prior_cluster_id
          - endpoints.POST_hie_match_links_id_unlink
        distinguishing_aspect: |
          Conserved quantity: identity membership - SUM(IdentityCluster.member_record_count WHERE status
          == ACTIVE) must always equal COUNT(PatientRecord WHERE match_state == CLUSTERED), which is 2
          before the merge, 2 while the two records sit in one cluster, and 2 again after the compensating
          unlink. The compensation must restore the absorbed cluster to ACTIVE, clear
          merged_into_cluster_id, re-point the record via prior_cluster_id and then null prior_cluster_id,
          leaving no orphaned membership count on the winner.
        test_recipe:
          setup:
            - "A PROBABILISTIC_ONLY threshold generation tuned by privacy-tuner-1 is ACTIVE with auto_link_threshold 0.9200 and review_lower_bound 0.7500."
            - "Two participants at CONFORMANCE_TESTING contribute one record each; the pair scores 0.7700 and waits in PENDING_REVIEW, so each record still owns its own single-member ACTIVE cluster."
            - "Steward privacy-steward-1 (not the tuner, so the priority-18 duty rule is satisfied) confirms the link, merging the later cluster into the earlier one."
          setup_api_calls:
            - call: "POST /hie/match-threshold-configs"
              payload: { config_label: "REF-PROB-U", auto_link_threshold: 0.9200, review_lower_bound: 0.7500, score_variant_mode: "PROBABILISTIC_ONLY", weight_family_name: 0.20, weight_given_name: 0.12, weight_birth_date: 0.25, weight_ssn_last4: 0.28, weight_postal_code: 0.08, weight_phone_digits: 0.07, partial_credit_factor: 0.50 }
              as: PrivacyOfficer
              as_user_id: "privacy-tuner-1"
              captures: { cfgU_id: $.data.id }
            - call: "POST /hie/match-threshold-configs/${cfgU_id}/activation"
              payload: {}
              as: PrivacyOfficer
              as_user_id: "privacy-tuner-1"
            - call: "POST /hie/participants"
              payload: { legal_name: "Union Heights Hospital", org_type: "HOSPITAL", declared_annual_patient_volume: 84000, primary_contact_email: "hie@unionheights.example" }
              as: HieAdmin
              captures: { pU1_id: $.data.id }
            - call: "POST /hie/participants/${pU1_id}/onboarding-transitions"
              payload: { action: "SUBMIT_FOR_LEGAL_REVIEW" }
              as: ParticipantAdmin
              as_user_id: "${pU1_id}"
            - call: "POST /hie/participants/${pU1_id}/onboarding-transitions"
              payload: { action: "EXECUTE_AGREEMENT", agreement_version: "DURSA-2026.1", signed_at: "2026-08-01T00:00:00Z" }
              as: HieAdmin
              as_user_id: "admin-legal-1"
            - call: "POST /hie/participants"
              payload: { legal_name: "Underwood Street Clinic", org_type: "CLINIC", declared_annual_patient_volume: 24000, primary_contact_email: "hie@underwood.example" }
              as: HieAdmin
              captures: { pU2_id: $.data.id }
            - call: "POST /hie/participants/${pU2_id}/onboarding-transitions"
              payload: { action: "SUBMIT_FOR_LEGAL_REVIEW" }
              as: ParticipantAdmin
              as_user_id: "${pU2_id}"
            - call: "POST /hie/participants/${pU2_id}/onboarding-transitions"
              payload: { action: "EXECUTE_AGREEMENT", agreement_version: "DURSA-2026.1", signed_at: "2026-08-01T00:00:00Z" }
              as: HieAdmin
              as_user_id: "admin-legal-1"
            - call: "POST /hie/participants/${pU1_id}/patient-records"
              payload: { source_mrn: "U1-0001", given_name: "Maria", family_name: "Gonzalez", birth_date: "1991-07-22", sex: "F", ssn_last4: "3321", postal_code: "78701", phone_digits: "5125550143" }
              as: HieAdmin
              captures: { recU_l: $.data.id, clusterU_win: $.data.cluster_id }
            - call: "POST /hie/participants/${pU2_id}/patient-records"
              payload: { source_mrn: "U2-0001", given_name: "Mari", family_name: "Gonzales", birth_date: "1991-07-22", sex: "F", ssn_last4: "3321", postal_code: "78701", phone_digits: "2125550143" }
              as: HieAdmin
              captures: { recU_r: $.data.id, clusterU_lose: $.data.cluster_id }
            - call: "GET /hie/identity-clusters/${clusterU_win}"
              payload: {}
              as: PrivacyOfficer
              captures: { clusterU_win_count_before: $.data.member_record_count, clusterU_win_v1: $.data.version }
            - call: "GET /hie/identity-clusters/${clusterU_lose}"
              payload: {}
              as: PrivacyOfficer
              captures: { clusterU_lose_count_before: $.data.member_record_count }
            - call: "GET /hie/match-links"
              payload: { left_record_id: "${recU_l}", right_record_id: "${recU_r}" }
              as: PrivacyOfficer
              captures: { linkU_id: "$.data[0].id", linkU_score: "$.data[0].match_score" }
            - call: "POST /hie/match-links/${linkU_id}/steward-decision"
              payload: { decision: "CONFIRM", expected_cluster_version: "${clusterU_win_v1}", review_note: "Same patient; confirmed against the state immunization registry." }
              as: PrivacyOfficer
              as_user_id: "privacy-steward-1"
              captures: { linkU_status_merged: $.data.status }
            - call: "GET /hie/identity-clusters/${clusterU_win}"
              payload: {}
              as: PrivacyOfficer
              captures: { clusterU_win_count_merged: $.data.member_record_count, clusterU_win_v2: $.data.version }
          trigger:
            - call: "POST /hie/match-links/${linkU_id}/unlink"
              payload: { expected_cluster_version: "${clusterU_win_v2}", unlink_reason: "Registry review found two distinct patients born the same day at the same address; merge reversed." }
              as: PrivacyOfficer
              as_user_id: "privacy-steward-1"
              captures: { linkU_status_after: $.data.status, linkU_cluster_after: $.data.cluster_id, linkU_merged_after: $.data.merged_away_cluster_id, linkU_reason: $.data.unlink_reason }
            - call: "GET /hie/identity-clusters/${clusterU_win}"
              payload: {}
              as: PrivacyOfficer
              captures: { clusterU_win_status_after: $.data.status, clusterU_win_count_after: $.data.member_record_count, clusterU_win_participants_after: $.data.participant_count }
            - call: "GET /hie/identity-clusters/${clusterU_lose}"
              payload: {}
              as: PrivacyOfficer
              captures: { clusterU_lose_status_after: $.data.status, clusterU_lose_count_after: $.data.member_record_count, clusterU_lose_merged_into_after: $.data.merged_into_cluster_id }
            - call: "GET /hie/patient-records/${recU_r}"
              payload: {}
              as: PrivacyOfficer
              captures: { recU_r_cluster_after: $.data.cluster_id, recU_r_prior_after: $.data.prior_cluster_id, recU_r_state_after: $.data.match_state }
          assert:
            - "${clusterU_win_count_before} == 1"
            - "${clusterU_lose_count_before} == 1"
            - "${linkU_score} == 0.7700"
            - "${linkU_status_merged} == LINKED"
            - "${clusterU_win_count_merged} == 2 (conserved total is still 2: one ACTIVE cluster holding both CLUSTERED records)"
            - "${linkU_status_after} == UNLINKED"
            - "${linkU_cluster_after} == null"
            - "${linkU_merged_after} == null"
            - "${linkU_reason} == Registry review found two distinct patients born the same day at the same address; merge reversed."
            - "${clusterU_win_status_after} == ACTIVE"
            - "${clusterU_win_count_after} == 1"
            - "${clusterU_win_participants_after} == 1"
            - "${clusterU_lose_status_after} == ACTIVE"
            - "${clusterU_lose_count_after} == 1"
            - "${clusterU_lose_merged_into_after} == null"
            - "${recU_r_cluster_after} == ${clusterU_lose}"
            - "${recU_r_prior_after} == null"
            - "${recU_r_state_after} == CLUSTERED"
            - "1 + 1 == 2 == COUNT(PatientRecord WHERE match_state == CLUSTERED): the conserved quantity is identical before the merge, during the merge and after the compensating unlink"
      - name: voiding_an_invoice_restores_the_outstanding_balance_identity_exactly
        grounds:
          - state_machines.ParticipationInvoice.ISSUED_to_VOID
          - state_machines.ParticipationInvoice.ISSUED_to_DELINQUENT
          - entities.Participant.fields.outstanding_balance_cents
          - calculations.participation_fee
          - endpoints.POST_hie_participation_invoices_id_administrative_transitions
        distinguishing_aspect: |
          A different conserved quantity in different units: money.
          Participant.outstanding_balance_cents must equal SUM(ParticipationInvoice.total_cents WHERE
          status IN {ISSUED, DELINQUENT}) at every point. DECLARE_DELINQUENT must leave the sum untouched
          (a delinquent invoice is still owed), while VOID is the compensating action that must subtract
          exactly total_cents and return the balance to its pre-issue value with no rounding drift -
          535000 -> 535000 -> 267500, not 267499 or 267501.
        test_recipe:
          setup:
            - "One participant with declared_annual_patient_volume 120000 reaches CONFORMANCE_TESTING, so invoices may be issued, and it has no data feeds, so quality_grade is UNGRADED and the quality multiplier is exactly 1.00."
            - "Invoice 1 covers the fully elapsed period [2026-06-01, 2026-07-01) on the PROVISIONAL basis: monthly volume ceil(120000 / 12) = 10000 units sits entirely inside TIER_1 (cap 24750) at 1.75 cents, so volume_fee_cents is 17500; adding BASE_PLATFORM_FEE_CENTS 250000 and applying the UNGRADED multiplier 1.00 gives total_cents 267500."
            - "Invoice 2 covers [2026-05-01, 2026-06-01) on the same basis for the same 267500 cents, so the balance reaches 535000."
          setup_api_calls:
            - call: "POST /hie/participants"
              payload: { legal_name: "Vantage Ridge Health Alliance", org_type: "HEALTH_PLAN", declared_annual_patient_volume: 120000, primary_contact_email: "hie@vantageridge.example" }
              as: HieAdmin
              captures: { pV_id: $.data.id, pV_balance_0: $.data.outstanding_balance_cents, pV_provisional_fee: $.data.provisional_monthly_fee_cents, pV_tier: $.data.fee_tier, pV_grade_0: $.data.quality_grade }
            - call: "POST /hie/participants/${pV_id}/onboarding-transitions"
              payload: { action: "SUBMIT_FOR_LEGAL_REVIEW" }
              as: ParticipantAdmin
              as_user_id: "${pV_id}"
            - call: "POST /hie/participants/${pV_id}/onboarding-transitions"
              payload: { action: "EXECUTE_AGREEMENT", agreement_version: "DURSA-2026.1", signed_at: "2026-08-01T00:00:00Z" }
              as: HieAdmin
              as_user_id: "admin-legal-1"
            - call: "POST /hie/participants/${pV_id}/participation-invoices"
              payload: { billing_period_start: "2026-06-01T00:00:00Z", billing_period_end: "2026-07-01T00:00:00Z", basis_variant: "PROVISIONAL", due_date: "2026-07-15T00:00:00Z" }
              as: HieAdmin
              captures: { invV1_id: $.data.id, invV1_total: $.data.total_cents, invV1_volume: $.data.volume_fee_cents, invV1_units: $.data.billable_volume_units, invV1_mult: $.data.quality_multiplier, invV1_grade: $.data.quality_grade_snapshot }
            - call: "POST /hie/participants/${pV_id}/participation-invoices"
              payload: { billing_period_start: "2026-05-01T00:00:00Z", billing_period_end: "2026-06-01T00:00:00Z", basis_variant: "PROVISIONAL", due_date: "2026-06-15T00:00:00Z" }
              as: HieAdmin
              captures: { invV2_id: $.data.id, invV2_total: $.data.total_cents }
            - call: "GET /hie/participants/${pV_id}"
              payload: {}
              as: HieAdmin
              captures: { pV_balance_2: $.data.outstanding_balance_cents }
          trigger:
            - call: "POST /hie/participation-invoices/${invV1_id}/administrative-transitions"
              payload: { action: "DECLARE_DELINQUENT", reason: "Unpaid past the 2026-07-15 due date" }
              as: HieAdmin
              captures: { invV1_status_delinquent: $.data.status }
            - call: "GET /hie/participants/${pV_id}"
              payload: {}
              as: HieAdmin
              captures: { pV_balance_3: $.data.outstanding_balance_cents }
            - call: "POST /hie/participation-invoices/${invV2_id}/administrative-transitions"
              payload: { action: "VOID", reason: "Period billed in error; the participant was not yet contributing data in May." }
              as: HieAdmin
              captures: { invV2_status_void: $.data.status, invV2_reason: $.data.status_reason }
            - call: "GET /hie/participants/${pV_id}"
              payload: {}
              as: HieAdmin
              captures: { pV_balance_4: $.data.outstanding_balance_cents }
            - call: "GET /hie/participants/${pV_id}/participation-invoices"
              payload: {}
              as: HieAdmin
              captures: { invV_list_first_status: "$.data[0].status" }
          assert:
            - "${pV_balance_0} == 0"
            - "${pV_grade_0} == UNGRADED"
            - "${pV_provisional_fee} == 267500"
            - "${pV_tier} == TIER_1"
            - "${invV1_units} == 10000"
            - "${invV1_volume} == 17500"
            - "${invV1_mult} == 1.00"
            - "${invV1_grade} == UNGRADED"
            - "${invV1_total} == 267500"
            - "${invV2_total} == 267500"
            - "${pV_balance_2} == 535000"
            - "${invV1_status_delinquent} == DELINQUENT"
            - "${pV_balance_3} == 535000"
            - "${invV2_status_void} == VOID"
            - "${pV_balance_4} == 267500"
            - "267500 == SUM(total_cents WHERE status IN {ISSUED, DELINQUENT}): the VOID invoice leaves the identity exactly restored, with no off-by-one cent"
            - "ParticipationInvoice.${invV2_id}.amount_paid_cents == 0"
