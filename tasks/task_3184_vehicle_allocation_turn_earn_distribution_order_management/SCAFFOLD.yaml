scenario: |
  Vehicle Allocation, Turn-and-Earn Distribution & Order Management (Ford Motor Company): production capacity allocation across regions and dealers using sales rate and inventory turn formulas, dealer order entry within allocation with configuration constraints and constrained-feature rationing, retail order prioritization versus stock units with customer order visibility and scheduling commitments, commodity shortage handling where units are built without a feature and retrofitted later, allocation appeals and adjustments for new points and market representation gaps, dealer trade between stores and its effect on future allocation, incentive and floor plan interaction with aged inventory, delivery scheduling and transportation carrier assignment

domain_name: "vehicle-allocation-turn-earn"
api_prefix: "/wholesale"

complexity_profile:
  primary_archetype: quota_allocation
  secondary_archetype: ledger_reconciliation
  complexity_layers:
    - optimistic_concurrency
    - cascading_side_effects
    - dual_variant_calculation
    - ops_run_checkpoint
  entity_topology: flat
  state_machine_shape: branching
  relationship_patterns:
    - one_to_many
    - cross_aggregate
    - self_referential
  role_model: hierarchical_override
  consistency_model: immediate
  difficulty_note: |
    Deliberately beyond the Expert band: 14 tightly-coupled entities, 66
    endpoints, 26 error codes, 9 state machines (branching, cyclic counter
    loop, parallel-dimension build_state, compound run-over-children gate),
    8 calculations with dual variants and combinatorial modes, and 9
    difficulty rules exercised twice each.
    Difficulty comes from the closed-loop coupling: order entry mutates earned
    credits; earned credits drive the next allocation run; allocation runs
    mint the capacity that gates order entry.

# =============================================================================
# 1.0 Response Envelope (FIXED — VERBATIM)
# =============================================================================
response_envelope:
  success: |
    { "meta": { "api_request_id": "req_xxx", "api_request_timestamp": "ISO8601" },
      "response_type": "object" | "array", "data": {} }
  error: |
    { "meta": { ... }, "response_type": "error",
      "data": { "error_id": "ERR_XXX", "message": "..." } }
  pagination_fields: ["limit", "offset", "total_count", "has_more"]
  pagination_defaults: { limit: 10, min: 1, max: 100, offset: 0 }

# =============================================================================
# 1.1 Entity-Relationship Table
# =============================================================================
entities:
  - name: Region
    parent: null
    common_fields: true
    fields:
      - name: code
        type: string
        source: input
        description: "Short unique region code, e.g. 'NA-EAST'. Immutable after creation."
        constraints: "unique; 2-20 chars uppercase alnum + dash"
      - name: name
        type: string
        source: input
        description: "Human-readable region name."
      - name: status
        type: enum
        source: system
        description: "Lifecycle state."
        default: ACTIVE
        constraints: "ACTIVE | CLOSED"

  - name: Dealer
    parent: null
    common_fields: true
    fields:
      - name: region_id
        type: string
        source: input
        description: "FK -> Region.id; home region the dealer draws allocation from."
      - name: dealer_code
        type: string
        source: input
        description: "OEM-facing dealer code, e.g. 'F12345'. Immutable."
        constraints: "unique"
      - name: name
        type: string
        source: input
        description: "Dealership name."
      - name: opened_on
        type: datetime
        source: input
        description: "Date the point opened; drives the new-point grace window (NEW_POINT_MONTHS)."
      - name: status
        type: enum
        source: system
        description: "Dealer lifecycle."
        default: ACTIVE
        constraints: "ACTIVE | SUSPENDED | CLOSED"
      - name: carryover_credit_units
        type: number
        source: computed
        description: "Per DealerModelLine earned credit carried into the next allocation run; maintained on DealerModelLine, aggregated here for reads only (sum over the dealer's lines with the latest closed run as reference)."

  - name: ModelLine
    parent: null
    common_fields: true
    fields:
      - name: model_code
        type: string
        source: input
        description: "Vehicle line code, e.g. 'F150'. Immutable."
        constraints: "unique"
      - name: name
        type: string
        source: input
        description: "Display name."
      - name: status
        type: enum
        source: system
        description: "Line lifecycle."
        default: ACTIVE
        constraints: "ACTIVE | DISCONTINUED"

  - name: Commodity
    parent: null
    common_fields: true
    fields:
      - name: code
        type: string
        source: input
        description: "Constrained-feature code, e.g. 'MOONROOF'. Immutable."
        constraints: "unique"
      - name: name
        type: string
        source: input
        description: "Feature name."
      - name: status
        type: enum
        source: system
        description: "CONSTRAINED while supply is rationed; RESOLVED once unconstrained again."
        default: CONSTRAINED
        constraints: "CONSTRAINED | RESOLVED"

  - name: CommodityRestriction
    parent: null
    common_fields: true
    fields:
      - name: commodity_id
        type: string
        source: input
        description: "FK -> Commodity.id; the constrained feature."
      - name: model_line_id
        type: string
        source: input
        description: "FK -> ModelLine.id; the line the restriction applies to."
      - name: effective_from
        type: datetime
        source: input
        description: "Start of the rationing window (closed start)."
      - name: effective_to
        type: datetime
        source: input
        description: "End of the rationing window; null means open-ended."
        constraints: "must be > effective_from when present"
      - name: install_rate_pct
        type: integer
        source: input
        description: "Percentage 0-100 of a dealer's accepted orders for this line that may carry the feature. Rate 100 lifts the cap (equivalent to unconstrained) but the restriction still gates retrofits until RESOLVED."
        constraints: "0 <= install_rate_pct <= 100"
      - name: allow_partial_build
        type: boolean
        source: input
        description: "When true, dealers may choose build-without-feature (surge mode) for overflow units."
        default: false
      - name: status
        type: enum
        source: system
        description: "ACTIVE while now within [effective_from, effective_to) and commodity CONSTRAINED; SUPERSEDED when a newer restriction for the same (commodity_id, model_line_id) pair is created; EXPIRED when now >= effective_to."
        default: ACTIVE
        constraints: "ACTIVE | SUPERSEDED | EXPIRED"

  - name: AllocationRun
    parent: null
    common_fields: true
    fields:
      - name: period
        type: string
        source: input
        description: "Allocation period label, e.g. '2026-10'. Immutable."
        constraints: "unique per model_line_id"
      - name: model_line_id
        type: string
        source: input
        description: "FK -> ModelLine.id; the line being allocated."
      - name: base_units
        type: integer
        source: input
        description: "Total production pool distributed by this run."
        constraints: ">= 0"
      - name: status
        type: enum
        source: system
        description: "Run lifecycle (compound over child DealerAllocation states)."
        default: DRAFT
        constraints: "DRAFT | PUBLISHED | LOCKED | SUPERSEDED"
      - name: published_at
        type: datetime
        source: system
        description: "Timestamp of publish; null until PUBLISHED."
        default: null
      - name: lookback_start
        type: datetime
        source: input
        description: "Start (inclusive) of the sales-lookback window feeding turn-and-earn."
      - name: lookback_end
        type: datetime
        source: input
        description: "End (exclusive) of the sales-lookback window."
        constraints: "must be > lookback_start"
      - name: retail_priority_pct
        type: integer
        source: input
        description: "Percent 0-100 of each dealer allocation reserved for retail (customer) orders. 0 means stock-only; 100 means retail-only."
        constraints: "0 <= retail_priority_pct <= 100"

  - name: DealerAllocation
    parent: AllocationRun
    common_fields: true
    fields:
      - name: run_id
        type: string
        source: system
        description: "FK -> AllocationRun.id; parent run (from path)."
      - name: dealer_id
        type: string
        source: input
        description: "FK -> Dealer.id; recipient dealer."
      - name: base_units
        type: integer
        source: computed
        description: "Turn-and-earn base share from the allocation_share calculation (whole units)."
      - name: adjustment_units
        type: integer
        source: computed
        description: "Signed net of granted appeal adjustments; starts at 0."
        default: 0
      - name: final_units
        type: integer
        source: computed
        description: "base_units + adjustment_units + new_point_floor_applied; the spendable pool for this dealer in this run."
      - name: consumed_units
        type: integer
        source: computed
        description: "Count of child VehicleOrders in terminal-or-accepted states that consumed pool (ACCEPTED, SCHEDULED, BUILT, DELIVERED)."
        default: 0
      - name: retail_reserved_units
        type: integer
        source: computed
        description: "Retail reserved pool: round_half_up(final_units * run.retail_priority_pct / 100)."
      - name: retail_consumed_units
        type: integer
        source: computed
        description: "Count of consumed child orders with order_kind=RETAIL."
        default: 0
      - name: status
        type: enum
        source: system
        description: "Child lifecycle; run can only LOCK when every child is LOCKED."
        default: OPEN
        constraints: "OPEN | LOCKED"

  - name: DealerModelLine
    parent: null
    common_fields: true
    fields:
      - name: dealer_id
        type: string
        source: input
        description: "FK -> Dealer.id."
      - name: model_line_id
        type: string
        source: input
        description: "FK -> ModelLine.id."
      - name: reported_sales_units
        type: integer
        source: computed
        description: "Count of the dealer's DELIVERED orders for this line whose delivered_at falls in the referencing run's lookback window; recomputed per run."
        default: 0
      - name: avg_inventory_units
        type: number
        source: computed
        description: "Current unsold stock for the line: orders in SCHEDULED or BUILT state for this dealer+line, counted now (point-in-time; see inventory_turn caveat)."
        default: 0
      - name: days_supply
        type: number
        source: computed
        description: "avg_inventory_units / (reported_sales_units / lookback_days); infinite when reported_sales_units == 0 and avg_inventory_units > 0; zero when both are zero."
      - name: earned_credit_units
        type: number
        source: computed
        description: "Carryover credit from the last LOCKED run: surplus-earned portion that exceeded available pool (see allocation_share variant note). Rolls into the next run's earned term."
        default: 0

  - name: VehicleOrder
    parent: null
    common_fields: true
    fields:
      - name: dealer_id
        type: string
        source: input
        description: "FK -> Dealer.id; ordering dealer (must match acting Dealer role)."
      - name: model_line_id
        type: string
        source: input
        description: "FK -> ModelLine.id."
      - name: run_id
        type: string
        source: input
        description: "FK -> AllocationRun.id; the run whose DealerAllocation this order consumes. Must be PUBLISHED at entry time."
      - name: order_kind
        type: enum
        source: input
        description: "RETAIL (customer-named, prioritized against the retail-reserved pool) or STOCK (dealer inventory)."
        constraints: "RETAIL | STOCK"
      - name: customer_ref
        type: string
        source: input
        description: "Customer reference for retail orders; required iff order_kind=RETAIL, forbidden when STOCK."
        default: null
      - name: configuration
        type: object
        source: input
        description: "Build config: { trim: string, commodity_codes: string[] }. Each commodity code must exist and belong to the order's line restrictions."
      - name: state
        type: enum
        source: system
        description: "Primary lifecycle."
        default: DRAFT
        constraints: "DRAFT | SUBMITTED | ACCEPTED | REJECTED | SCHEDULED | BUILT | DELIVERED | CANCELLED"
      - name: build_state
        type: enum
        source: system
        description: "Parallel dimension: whether a constrained feature was omitted at build and awaits retrofit."
        default: NOT_APPLICABLE
        constraints: "NOT_APPLICABLE | PENDING_RETROFIT | RETROFITTED"
      - name: retrofit_of_order_id
        type: string
        source: input
        description: "FK -> VehicleOrder.id; self-reference set on the retrofit work order created when a PENDING_RETROFIT unit is completed. Null on original orders."
        default: null
      - name: consumed_units
        type: integer
        source: computed
        description: "1 while the order occupies allocation pool (ACCEPTED, SCHEDULED, BUILT, DELIVERED); 0 otherwise."
        default: 0
      - name: scheduled_week
        type: string
        source: system
        description: "Build week assigned at scheduling, ISO 'YYYY-Www'."
        default: null
      - name: scheduled_at
        type: datetime
        source: system
        description: "Timestamp of scheduling; used for customer visibility and age math."
        default: null
      - name: built_at
        type: datetime
        source: system
        description: "Timestamp of build completion."
        default: null
      - name: delivered_at
        type: datetime
        source: system
        description: "Timestamp of retail delivery; drives turn-and-earn sales credit."
        default: null
      - name: cancel_reason
        type: string
        source: input
        description: "Optional reason recorded on cancel."
        default: null

  - name: DealerTrade
    parent: null
    common_fields: true
    fields:
      - name: from_dealer_id
        type: string
        source: input
        description: "FK -> Dealer.id; proposing dealer. Must match acting Dealer role."
      - name: to_dealer_id
        type: string
        source: input
        description: "FK -> Dealer.id; counterpart. Must differ from from_dealer_id and share the from-dealer's region."
      - name: run_id
        type: string
        source: input
        description: "FK -> AllocationRun.id; run whose allocation is being traded. Must be PUBLISHED."
      - name: units
        type: integer
        source: input
        description: "Whole units moved from the proposer's allocation to the counterpart's."
        constraints: ">= 1"
      - name: state
        type: enum
        source: system
        description: "Trade negotiation lifecycle (branching with counter loop)."
        default: PROPOSED
        constraints: "PROPOSED | COUNTERED | ACCEPTED | DECLINED | EXPIRED | CANCELLED | EXECUTED"
      - name: counter_units
        type: integer
        source: input
        description: "Amended units proposed on counter; set only by the counter transition."
        default: null
      - name: expires_at
        type: datetime
        source: system
        description: "Proposal expiry: created_at + TRADE_TTL_DAYS days; after this the run sweeps to EXPIRED."
      - name: executed_at
        type: datetime
        source: system
        description: "Timestamp of execution (allocation move)."
        default: null

  - name: Appeal
    parent: null
    common_fields: true
    fields:
      - name: dealer_id
        type: string
        source: input
        description: "FK -> Dealer.id; appealing dealer (must match acting Dealer role)."
      - name: run_id
        type: string
        source: input
        description: "FK -> AllocationRun.id; the run whose allocation is appealed. Must be PUBLISHED."
      - name: appeal_type
        type: enum
        source: input
        description: "NEW_POINT (dealer within grace window) or MARKET_GAP (under-representation claim)."
        constraints: "NEW_POINT | MARKET_GAP"
      - name: requested_units
        type: integer
        source: input
        description: "Units requested."
        constraints: ">= 1"
      - name: granted_units
        type: integer
        source: input
        description: "Units granted at decision; set on GRANT (may be 0 = denied-in-effect) and required then."
        default: null
      - name: state
        type: enum
        source: system
        description: "Appeal lifecycle."
        default: FILED
        constraints: "FILED | UNDER_REVIEW | GRANTED | DENIED | WITHDRAWN"
      - name: filed_at
        type: datetime
        source: system
        description: "Filing timestamp; FILING_WINDOW_DAYS deadline measured from run.published_at."

  - name: IncentiveProgram
    parent: null
    common_fields: true
    fields:
      - name: code
        type: string
        source: input
        description: "Program code, unique."
        constraints: "unique"
      - name: model_line_id
        type: string
        source: input
        description: "FK -> ModelLine.id; line the program applies to."
      - name: kind
        type: enum
        source: input
        description: "AGED_INVENTORY_CREDIT (per-unit credit for units aged beyond threshold) or VOLUME_BONUS (bonus per unit once period sales cross a tier)."
        constraints: "AGED_INVENTORY_CREDIT | VOLUME_BONUS"
      - name: params
        type: object
        source: input
        description: "Kind-specific parameters. AGED_INVENTORY_CREDIT: { age_threshold_days: int, credit_per_unit_cents: int, tier2_age_days: int, tier2_credit_per_unit_cents: int }. VOLUME_BONUS: { tier1_threshold: int, tier1_bonus_cents: int, tier2_threshold: int, tier2_bonus_cents: int } (marginal tiers)."
      - name: window_start
        type: datetime
        source: input
        description: "Program effective start (inclusive)."
      - name: window_end
        type: datetime
        source: input
        description: "Program effective end (exclusive); must be > window_start."
      - name: status
        type: enum
        source: system
        description: "ACTIVE while now within the window; CLOSED otherwise."
        default: ACTIVE
        constraints: "ACTIVE | CLOSED"

  - name: Carrier
    parent: null
    common_fields: true
    fields:
      - name: code
        type: string
        source: input
        description: "Carrier code, unique."
        constraints: "unique"
      - name: name
        type: string
        source: input
        description: "Carrier name."
      - name: weekly_capacity
        type: integer
        source: input
        description: "Max BUILT units the carrier can pick up per ISO week, across all assignments."
        constraints: ">= 1"
      - name: status
        type: enum
        source: system
        description: "ACTIVE carriers may receive assignments."
        default: ACTIVE
        constraints: "ACTIVE | SUSPENDED"

  - name: Shipment
    parent: null
    common_fields: true
    fields:
      - name: order_id
        type: string
        source: input
        description: "FK -> VehicleOrder.id; the BUILT unit being shipped. At most one non-CANCELLED shipment per order."
      - name: carrier_id
        type: string
        source: input
        description: "FK -> Carrier.id; assigned carrier (must be ACTIVE)."
      - name: pickup_week
        type: string
        source: input
        description: "ISO 'YYYY-Www' pickup week; must be >= the order's scheduled_week and not before the current week."
      - name: state
        type: enum
        source: system
        description: "Shipment lifecycle."
        default: PLANNED
        constraints: "PLANNED | PICKED_UP | DELIVERED | CANCELLED"
      - name: picked_up_at
        type: datetime
        source: system
        description: "Pickup timestamp."
        default: null
      - name: delivered_at
        type: datetime
        source: system
        description: "Delivery timestamp; cascades order to DELIVERED."
        default: null

# =============================================================================
# 1.2 State Machine Table
# =============================================================================
state_machines:
  - entity: AllocationRun
    initial_state: DRAFT
    terminal_states: [SUPERSEDED]
    transitions:
      - from: DRAFT
        to: PUBLISHED
        trigger: "POST /wholesale/allocation-runs/{id}/publish"
        actor: RegionalAllocator
        preconditions:
          - "run.status == DRAFT"
          - "run has at least one DealerAllocation child (auto-computed at creation)"
          - "no other run for the same model_line_id is in PUBLISHED"
        side_effects:
          - "published_at := now"
          - "recompute each DealerAllocation.base_units via allocation_share (provisional variant)"
          - "recompute each DealerAllocation.final_units := base_units + adjustment_units (floor per new_point_floor)"
          - "recompute each DealerAllocation.retail_reserved_units := round_half_up(final_units * retail_priority_pct / 100)"
      - from: PUBLISHED
        to: LOCKED
        trigger: "POST /wholesale/allocation-runs/{id}/lock"
        actor: RegionalAllocator
        preconditions:
          - "run.status == PUBLISHED"
          - "every child DealerAllocation.status == LOCKED (compound gate)"
          - "no Appeal on this run in FILED or UNDER_REVIEW"
        side_effects:
          - "run.status := LOCKED"
          - "recompute allocation_share (final variant) for each child; write surplus into DealerModelLine.earned_credit_units for the next run"
      - from: PUBLISHED
        to: SUPERSEDED
        trigger: "POST /wholesale/allocation-runs (creating a new run for the same model_line_id while one is PUBLISHED)"
        actor: RegionalAllocator
        preconditions:
          - "existing run.status == PUBLISHED"
        side_effects:
          - "existing run.status := SUPERSEDED"
          - "each child DealerAllocation.status := LOCKED (frozen as-of supersede)"
          - "unconsumed pool is NOT carried over automatically; only DealerModelLine.earned_credit_units persists"
    note: "LOCKED is absorbing except supersede is only from PUBLISHED; SUPERSEDED is terminal."

  - entity: DealerAllocation
    initial_state: OPEN
    terminal_states: [LOCKED]
    transitions:
      - from: OPEN
        to: LOCKED
        trigger: "POST /wholesale/allocation-runs/{id}/dealer-allocations/{da_id}/lock"
        actor: RegionalAllocator
        preconditions:
          - "parent run.status in {PUBLISHED}"
          - "dealer_allocation.status == OPEN"
        side_effects:
          - "dealer_allocation.status := LOCKED"
          - "freeze consumed_units/retail_consumed_units snapshot"
    note: "LOCKED children still show trades/appeals that executed before lock; no further order entry consumes pool."

  - entity: VehicleOrder
    initial_state: DRAFT
    terminal_states: [DELIVERED, CANCELLED]
    transitions:
      - from: DRAFT
        to: SUBMITTED
        trigger: "POST /wholesale/orders (creates directly in SUBMITTED) or POST /wholesale/orders/{id}/submit"
        actor: Dealer
        preconditions:
          - "order.state == DRAFT (for submit) or create-path"
          - "dealer.status == ACTIVE"
          - "run.status == PUBLISHED"
        side_effects:
          - "state := SUBMITTED"
      - from: SUBMITTED
        to: ACCEPTED
        trigger: "system accept on submit when allocation & commodity checks pass"
        actor: system
        preconditions:
          - "DealerAllocation for (run_id, dealer_id) has remaining pool >= 1 (total), and if order_kind=RETAIL then remaining retail pool >= 1"
          - "for each configuration.commodity_codes entry with an ACTIVE CommodityRestriction: the dealer's feature count for this line within the run stays <= floor(accepted_count * install_rate_pct / 100) after this order"
        side_effects:
          - "state := ACCEPTED; consumed_units := 1"
          - "DealerAllocation.consumed_units += 1; if order_kind=RETAIL: retail_consumed_units += 1"
          - "DealerModelLine.avg_inventory_units recomputed (aggregation)"
      - from: SUBMITTED
        to: REJECTED
        trigger: "system reject on submit when checks fail"
        actor: system
        preconditions:
          - "any accept precondition fails"
        side_effects:
          - "state := REJECTED (terminal for ordering; dealer must create a new order)"
      - from: ACCEPTED
        to: SCHEDULED
        trigger: "POST /wholesale/orders/{id}/schedule"
        actor: ProductionScheduler
        preconditions:
          - "order.state == ACCEPTED"
          - "payload build_week is an ISO week >= current week"
        side_effects:
          - "state := SCHEDULED; scheduled_week := payload.build_week; scheduled_at := now"
          - "scheduling_commitment visible to the ordering Dealer (customer order visibility)"
      - from: SCHEDULED
        to: BUILT
        trigger: "POST /wholesale/orders/{id}/build"
        actor: ProductionScheduler
        preconditions:
          - "order.state == SCHEDULED"
          - "current week >= order.scheduled_week"
          - "if order carries an ACTIVE constrained commodity and build_mode=WITHOUT_FEATURE requested: restriction.allow_partial_build must be true"
        side_effects:
          - "state := BUILT; built_at := now"
          - "if build_mode=WITHOUT_FEATURE: build_state := PENDING_RETROFIT and the commodity code is dropped from the built configuration"
      - from: BUILT
        to: DELIVERED
        trigger: "POST /wholesale/shipments/{id}/deliver (cascade from Shipment)"
        actor: LogisticsCoordinator
        preconditions:
          - "order.state == BUILT"
          - "linked Shipment.state == PICKED_UP"
        side_effects:
          - "order.state := DELIVERED; delivered_at := shipment.delivered_at"
          - "DealerModelLine.reported_sales_units recomputed (chronological inclusion by delivered_at)"
          - "incentive_accrual for the dealer's line recomputed (final at month close; provisional here)"
      - from: DRAFT
        to: CANCELLED
        trigger: "POST /wholesale/orders/{id}/cancel"
        actor: Dealer
        preconditions: ["order.state == DRAFT", "acting dealer owns the order"]
        side_effects: ["state := CANCELLED"]
      - from: SUBMITTED
        to: CANCELLED
        trigger: "POST /wholesale/orders/{id}/cancel"
        actor: Dealer
        preconditions: ["order.state == SUBMITTED", "acting dealer owns the order"]
        side_effects: ["state := CANCELLED"]
      - from: ACCEPTED
        to: CANCELLED
        trigger: "POST /wholesale/orders/{id}/cancel"
        actor: Dealer
        preconditions: ["order.state == ACCEPTED", "acting dealer owns the order"]
        side_effects:
          - "state := CANCELLED; consumed_units := 0"
          - "DealerAllocation.consumed_units -= 1; if order_kind=RETAIL: retail_consumed_units -= 1 (compensating invariant: consumed == count of pool-holding children)"
          - "DealerModelLine.avg_inventory_units recomputed"
    note: "Parallel dimension build_state evolves independently on BUILT units: NOT_APPLICABLE -> PENDING_RETROFIT (on build WITHOUT_FEATURE) -> RETROFITTED (on retrofit completion). See retrofit machine below."

  - entity: VehicleOrderBuildRetrofit
    initial_state: PENDING_RETROFIT
    terminal_states: [RETROFITTED]
    transitions:
      - from: PENDING_RETROFIT
        to: RETROFITTED
        trigger: "POST /wholesale/orders/{id}/retrofit"
        actor: ProductionScheduler
        preconditions:
          - "order.build_state == PENDING_RETROFIT"
          - "order.state in {BUILT, DELIVERED}"
          - "the ACTIVE CommodityRestriction for the omitted commodity on this line is RESOLVED or now outside its effective window"
        side_effects:
          - "order.build_state := RETROFITTED"
          - "a child retrofit VehicleOrder row (retrofit_of_order_id := original) is created and immediately moved ACCEPTED without consuming allocation pool (consumed_units := 0)"
    note: "Machine over VehicleOrder.build_state; separate entry for clarity."

  - entity: DealerTrade
    initial_state: PROPOSED
    terminal_states: [DECLINED, EXPIRED, CANCELLED, EXECUTED]
    transitions:
      - from: PROPOSED
        to: COUNTERED
        trigger: "POST /wholesale/dealer-trades/{id}/counter"
        actor: Dealer
        preconditions:
          - "trade.state == PROPOSED"
          - "acting dealer is to_dealer_id"
          - "now < expires_at"
        side_effects: ["state := COUNTERED; counter_units := payload.counter_units (>= 1)"]
      - from: COUNTERED
        to: PROPOSED
        trigger: "POST /wholesale/dealer-trades/{id}/counter (from-dealer re-counters)"
        actor: Dealer
        preconditions:
          - "trade.state == COUNTERED"
          - "acting dealer is from_dealer_id"
          - "now < expires_at"
        side_effects: ["state := PROPOSED; units := payload.counter_units"]
      - from: PROPOSED
        to: ACCEPTED
        trigger: "POST /wholesale/dealer-trades/{id}/accept"
        actor: Dealer
        preconditions:
          - "trade.state == PROPOSED"
          - "acting dealer is to_dealer_id"
          - "now < expires_at"
        side_effects: ["state := ACCEPTED"]
      - from: ACCEPTED
        to: EXECUTED
        trigger: "POST /wholesale/dealer-trades/{id}/execute"
        actor: RegionalAllocator
        preconditions:
          - "trade.state == ACCEPTED"
          - "run.status == PUBLISHED"
          - "from-dealer DealerAllocation remaining pool (final_units - consumed_units) >= units"
        side_effects:
          - "state := EXECUTED; executed_at := now"
          - "from-dealer DealerAllocation.final_units -= units; to-dealer DealerAllocation.final_units += units"
          - "DealerModelLine.earned_credit_units of from-dealer reduced by trade_earn_penalty (transitive: trade -> allocation -> earned credit)"
      - from: PROPOSED
        to: DECLINED
        trigger: "POST /wholesale/dealer-trades/{id}/decline"
        actor: Dealer
        preconditions: ["trade.state in {PROPOSED, COUNTERED}", "acting dealer is to_dealer_id or from_dealer_id"]
        side_effects: ["state := DECLINED"]
      - from: COUNTERED
        to: DECLINED
        trigger: "POST /wholesale/dealer-trades/{id}/decline"
        actor: Dealer
        preconditions: ["acting dealer is to_dealer_id or from_dealer_id"]
        side_effects: ["state := DECLINED"]
      - from: PROPOSED
        to: CANCELLED
        trigger: "POST /wholesale/dealer-trades/{id}/cancel"
        actor: Dealer
        preconditions: ["trade.state in {PROPOSED, COUNTERED}", "acting dealer is from_dealer_id"]
        side_effects: ["state := CANCELLED"]
      - from: COUNTERED
        to: CANCELLED
        trigger: "POST /wholesale/dealer-trades/{id}/cancel"
        actor: Dealer
        preconditions: ["acting dealer is from_dealer_id"]
        side_effects: ["state := CANCELLED"]
      - from: PROPOSED
        to: EXPIRED
        trigger: "system sweep when now >= expires_at"
        actor: system
        preconditions: ["trade.state in {PROPOSED, COUNTERED, ACCEPTED}", "now >= expires_at"]
        side_effects: ["state := EXPIRED"]
    note: "Branching with counter loop (PROPOSED <-> COUNTERED) and three negative terminal branches."

  - entity: Appeal
    initial_state: FILED
    terminal_states: [GRANTED, DENIED, WITHDRAWN]
    transitions:
      - from: FILED
        to: UNDER_REVIEW
        trigger: "POST /wholesale/appeals/{id}/review"
        actor: RegionalAllocator
        preconditions: ["appeal.state == FILED"]
        side_effects: ["state := UNDER_REVIEW"]
      - from: UNDER_REVIEW
        to: GRANTED
        trigger: "POST /wholesale/appeals/{id}/grant"
        actor: RegionalAllocator
        preconditions:
          - "appeal.state == UNDER_REVIEW"
          - "payload.granted_units >= 0"
          - "run.status == PUBLISHED"
          - "if appeal_type == NEW_POINT: dealer.opened_on within NEW_POINT_MONTHS of run.published_at"
        side_effects:
          - "state := GRANTED; granted_units := payload.granted_units"
          - "DealerAllocation.adjustment_units += granted_units; final_units recomputed"
          - "DealerModelLine.earned_credit_units unchanged (appeals do not earn)"
      - from: UNDER_REVIEW
        to: DENIED
        trigger: "POST /wholesale/appeals/{id}/deny"
        actor: RegionalAllocator
        preconditions: ["appeal.state == UNDER_REVIEW"]
        side_effects: ["state := DENIED"]
      - from: FILED
        to: WITHDRAWN
        trigger: "POST /wholesale/appeals/{id}/withdraw"
        actor: Dealer
        preconditions: ["appeal.state == FILED", "acting dealer owns the appeal"]
        side_effects: ["state := WITHDRAWN"]

  - entity: Shipment
    initial_state: PLANNED
    terminal_states: [DELIVERED, CANCELLED]
    transitions:
      - from: PLANNED
        to: PICKED_UP
        trigger: "POST /wholesale/shipments/{id}/pickup"
        actor: LogisticsCoordinator
        preconditions:
          - "shipment.state == PLANNED"
          - "current ISO week >= pickup_week"
        side_effects: ["state := PICKED_UP; picked_up_at := now"]
      - from: PICKED_UP
        to: DELIVERED
        trigger: "POST /wholesale/shipments/{id}/deliver"
        actor: LogisticsCoordinator
        preconditions: ["shipment.state == PICKED_UP"]
        side_effects:
          - "state := DELIVERED; delivered_at := now"
          - "cascade: linked VehicleOrder transitions BUILT -> DELIVERED (see VehicleOrder)"
      - from: PLANNED
        to: CANCELLED
        trigger: "POST /wholesale/shipments/{id}/cancel"
        actor: LogisticsCoordinator
        preconditions: ["shipment.state == PLANNED"]
        side_effects: ["state := CANCELLED"]

  - entity: CommodityRestriction
    initial_state: ACTIVE
    terminal_states: [SUPERSEDED, EXPIRED]
    transitions:
      - from: ACTIVE
        to: SUPERSEDED
        trigger: "POST /wholesale/commodity-restrictions (new row for same (commodity_id, model_line_id))"
        actor: CommodityManager
        preconditions: ["existing restriction.status == ACTIVE"]
        side_effects: ["existing.status := SUPERSEDED"]
      - from: ACTIVE
        to: EXPIRED
        trigger: "system when now >= effective_to"
        actor: system
        preconditions: ["restriction.effective_to != null", "now >= effective_to"]
        side_effects: ["status := EXPIRED"]

  - entity: Commodity
    initial_state: CONSTRAINED
    terminal_states: []
    transitions:
      - from: CONSTRAINED
        to: RESOLVED
        trigger: "POST /wholesale/commodities/{id}/resolve"
        actor: CommodityManager
        preconditions: ["commodity.status == CONSTRAINED"]
        side_effects:
          - "status := RESOLVED"
          - "ACTIVE restrictions on this commodity become EXPIRED (cascade)"
      - from: RESOLVED
        to: CONSTRAINED
        trigger: "POST /wholesale/commodities/{id}/constrain"
        actor: CommodityManager
        preconditions: ["commodity.status == RESOLVED"]
        side_effects: ["status := CONSTRAINED (new restrictions may then be created)"]

# =============================================================================
# 1.2.1 Concurrency Rules (true races only, resolved by OCC on parent version)
# =============================================================================
concurrency_rules:
  - rule_id: order-entry-stale-allocation
    parent_entity: DealerAllocation
    write_endpoint: "POST /wholesale/orders"
    occ_field: "expected_dealer_allocation_version"
    description: |
      Creating a VehicleOrder against a DealerAllocation whose version has
      advanced since the client last observed it is rejected. This captures
      the case where another order entry, trade execution, or appeal grant
      has legitimately changed the pool the client priced its order against,
      so the client's view of the allocation is stale.
    error_id: ERR_STALE_ALLOCATION_VERSION
    http_status: 412
  - rule_id: trade-execute-stale-run
    parent_entity: AllocationRun
    write_endpoint: "POST /wholesale/dealer-trades/{id}/execute"
    occ_field: "expected_run_version"
    description: |
      Executing an accepted DealerTrade against an AllocationRun whose version
      has advanced since the executor last observed it is rejected. A lock or
      appeal grant may have changed the pool; the executor's run view is stale.
    error_id: ERR_STALE_RUN_VERSION
    http_status: 412
  - rule_id: appeal-grant-stale-run
    parent_entity: AllocationRun
    write_endpoint: "POST /wholesale/appeals/{id}/grant"
    occ_field: "expected_run_version"
    description: |
      Granting an Appeal against an AllocationRun whose version has advanced
      since the allocator last observed it is rejected; another grant or a
      trade execution may have changed dealer pools, so the grant decision
      would be made on a stale view.
    error_id: ERR_STALE_RUN_VERSION
    http_status: 412

# =============================================================================
# 1.3 Calculation Rules Table
# =============================================================================
calculations:
  - name: allocation_share
    trigger: "on AllocationRun publish (provisional) and on lock (final); recomputed per DealerAllocation"
    algorithm: waterfall_allocation
    formula: |
      # Turn-and-earn base share for dealer d in run r (line L), pool P = r.base_units.
      # Step 1 — raw score per dealer (only dealers in regions with status ACTIVE,
      # dealer.status == ACTIVE):
      #   sales[d]  = count of d's DELIVERED orders for line L with delivered_at in
      #               [r.lookback_start, r.lookback_end)   (inclusive start, exclusive end)
      #   inv[d]    = DealerModelLine.avg_inventory_units for (d, L), point-in-time now
      #   turn[d]   = sales[d] / max(inv[d], 1)            # turn rate; inv=0 floors to 1
      #   raw[d]    = 0.6 * (sales[d] / sum_sales) + 0.4 * (turn[d] / sum_turn)
      #               where sum_sales = sum of sales over eligible dealers (0 -> raw sales term 0),
      #               sum_turn likewise; if both sums are 0 every raw[d] = 1/eligible_count.
      # Step 2 — provisional allocation (waterfall, deterministic order):
      #   want[d]   = floor(raw[d] * P) + earned_credit_units[d]   (earned from prior LOCKED run)
      #   Process dealers ordered by raw[d] DESC, tie-break dealer.opened_on ASC (older first),
      #   then dealer.created_at ASC; each dealer takes min(want[d], remaining_pool).
      #   Surplus = want[d] - taken[d] accrues to DealerModelLine.earned_credit_units.
      # Rounding: floor per dealer at want computation, THEN waterfall — no re-rounding after.
    input_set: "Dealers with status ACTIVE in regions with status ACTIVE; sales counted from VehicleOrder in DELIVERED state with delivered_at inside the lookback window (start inclusive, end exclusive)"
    constants:
      SALES_WEIGHT: 0.6
      TURN_WEIGHT: 0.4
      NEW_POINT_MONTHS: 6
      NEW_POINT_FLOOR_UNITS: 2
    precision: "units are integers; raw scores at 6 decimal places round_half_up before waterfall"
    variants:
      - name: provisional
        when: "at run publish"
        difference: "earned_credit term included from prior LOCKED run; result written to base_units"
      - name: final
        when: "at run lock"
        difference: "recomputes surplus = want - consumed; writes surplus into DealerModelLine.earned_credit_units for the next run; does NOT change base_units"

  - name: new_point_floor
    trigger: "during DealerAllocation.final_units computation at publish and after each appeal grant"
    algorithm: threshold
    formula: |
      # New-point floor: dealers whose opened_on is within NEW_POINT_MONTHS of
      # run.published_at receive at least NEW_POINT_FLOOR_UNITS final units.
      # final_units = max(base_units + adjustment_units, NEW_POINT_FLOOR_UNITS)
      #   if (published_at - opened_on) < NEW_POINT_MONTHS months
      # else final_units = base_units + adjustment_units.
      # Boundary: exactly NEW_POINT_MONTHS months elapsed -> NOT eligible (<, strict).
    input_set: "DealerAllocation rows of the run being published or adjusted"
    constants:
      NEW_POINT_MONTHS: 6
      NEW_POINT_FLOOR_UNITS: 2
    precision: "integer units"
    variants:
      - name: eligible
        when: "dealer age at publish strictly less than NEW_POINT_MONTHS"
        difference: "floor applied via max()"
      - name: ineligible
        when: "dealer age >= NEW_POINT_MONTHS"
        difference: "no floor; straight sum"

  - name: inventory_turn
    trigger: "on any VehicleOrder transition into or out of {SCHEDULED, BUILT} for the dealer+line, and at run publish"
    algorithm: aggregation
    formula: |
      # avg_inventory_units = count of the dealer's orders for the line whose
      # state is in {SCHEDULED, BUILT} at evaluation time (point-in-time).
      # days_supply = avg_inventory_units / (reported_sales_units / lookback_days)
      #   where lookback_days = (run.lookback_end - run.lookback_start) in days.
      # Edge: reported_sales_units == 0 and avg_inventory_units > 0 -> days_supply = +Infinity
      #       (encoded as -1 sentinel in API); both zero -> days_supply = 0.
    input_set: "VehicleOrder rows for (dealer, line) in state SCHEDULED or BUILT"
    constants:
      ZERO_SALES_SENTINEL: -1
    precision: "avg_inventory_units integer; days_supply 2 decimals round_half_up"
    variants:
      - name: point_in_time
        when: "default"
        difference: "uses current states only"
      - name: lookback_average
        when: "referenced by allocation_share's turn term"
        difference: "uses the same point-in-time count; the variant exists because a time-weighted average over the lookback window would give different numbers — the scaffold pins point-in-time as canonical and the alternative is the documented mis-implementation"

  - name: commodity_cap
    trigger: "on VehicleOrder accept when configuration.commodity_codes intersects an ACTIVE restriction for the line"
    algorithm: constraint_propagation
    formula: |
      # Per (dealer, line, run, commodity): let A = count of the dealer's orders
      # for the line in the run in {ACCEPTED, SCHEDULED, BUILT, DELIVERED},
      # F = those among A whose configuration includes the commodity code.
      # An order carrying the commodity may be accepted iff
      #   F + 1 <= floor((A + 1) * install_rate_pct / 100)
      # Evaluation order: A and F are taken BEFORE this order (circular-looking
      # dependency resolved by evaluating the cap on post-accept counts but with
      # pre-accept inputs for A and F — i.e., the cap is checked as
      #   floor((A+1)*rate/100) >= F+1  using pre-accept A, F).
      # rate == 100 -> cap never binds; rate == 0 -> no order may carry the feature.
    input_set: "VehicleOrder rows for (dealer, line, run) in pool-holding states {ACCEPTED, SCHEDULED, BUILT, DELIVERED}"
    constants: {}
    precision: "integer floors, no rounding mode ambiguity"
    variants:
      - name: pre_accept
        when: "canonical"
        difference: "cap evaluated with pre-accept A, F as pinned above"
      - name: naive_post_accept
        when: "documented mis-implementation"
        difference: "evaluating F <= floor(A * rate / 100) after incrementing A first rejects legitimate first-feature orders when A=0 and rate<100"

  - name: retail_reserve_split
    trigger: "on DealerAllocation publish/grant/trade recompute and on every order accept"
    algorithm: waterfall_allocation
    formula: |
      # retail_reserved_units = round_half_up(final_units * retail_priority_pct / 100)
      # Retail pool = retail_reserved_units - retail_consumed_units (must be >= 1 for a RETAIL accept)
      # Stock pool  = (final_units - retail_reserved_units) - (consumed_units - retail_consumed_units)
      # A STOCK order may only consume stock pool; a RETAIL order consumes retail pool first,
      # and when retail pool is exhausted may spill into stock pool ONLY IF
      # retail_priority_pct < 100 and stock pool remaining >= 1 (retail spillover).
      # Spillover consumes stock pool but the order is still counted in retail_consumed_units.
      # Rounding pinned: round the reserved figure once per final_units change; never re-round pools.
    input_set: "DealerAllocation row plus its run's retail_priority_pct"
    constants: {}
    precision: "integer units, round_half_up on the reserved figure only"
    variants:
      - name: hard_split
        when: "retail_priority_pct == 100 or 0"
        difference: "no spillover possible; pools are exclusive"
      - name: spillover
        when: "0 < retail_priority_pct < 100"
        difference: "RETAIL may consume stock pool when retail pool is exhausted; STOCK never consumes retail pool"

  - name: trade_earn_penalty
    trigger: "on DealerTrade execute"
    algorithm: decay_function
    formula: |
      # Traded-away units reduce the from-dealer's earned credit for the NEXT run:
      #   earned_credit_units[from] = max(0, earned_credit_units[from] - units * PENALTY_PER_UNIT)
      # The to-dealer receives NO earned credit for traded-in units (trades do not earn).
      # Penalty is linear (no compounding); floor at 0.
    input_set: "executed DealerTrade plus from-dealer's DealerModelLine for the run's line"
    constants:
      PENALTY_PER_UNIT: 0.5
    precision: "earned credits at 2 decimals round_half_up"
    variants:
      - name: standard
        when: "default"
        difference: "linear penalty with floor 0"
      - name: waived
        when: "trade executed while from-dealer is within NEW_POINT_MONTHS of opened_on"
        difference: "penalty skipped entirely for new points (encourages stocking)"

  - name: incentive_accrual
    trigger: "provisional: on each order DELIVERED; final: on month close (POST /wholesale/incentive-programs/{id}/close)"
    algorithm: tiered_pricing
    formula: |
      # AGED_INVENTORY_CREDIT (marginal age tiers, per unit, cents):
      #   For each DELIVERED order of the dealer for the program line with
      #   delivered_at in [window_start, window_end):
      #     age_days = delivered_at - scheduled_at (in whole days, floor)
      #     credit_cents += tier2_credit_per_unit_cents if age_days >= tier2_age_days
      #                else credit_per_unit_cents if age_days >= age_threshold_days
      #                else 0
      # VOLUME_BONUS (marginal volume tiers over period sales S = count of
      # DELIVERED orders in window):
      #   bonus_cents = min(S, tier1_threshold) * 0            # first tier pays nothing below threshold
      #   if S > tier1_threshold: bonus_cents += (min(S, tier2_threshold) - tier1_threshold) * tier1_bonus_cents
      #   if S > tier2_threshold: bonus_cents += (S - tier2_threshold) * tier2_bonus_cents
      # Boundary: S == tier1_threshold pays 0 (strict >); age_days == age_threshold_days pays tier1 (inclusive >=).
    input_set: "VehicleOrder DELIVERED rows for the dealer on the program line, delivered_at in [window_start, window_end) (start inclusive, end exclusive)"
    constants: {}
    precision: "integer cents; age in whole days (floor of hour remainder)"
    variants:
      - name: provisional
        when: "per-delivery"
        difference: "running accrual readable via GET; may shift as more deliveries land (volume tier straddle)"
      - name: final
        when: "at program close"
        difference: "frozen ledger figure; provisional deltas reconciled into a single final amount_cents"

  - name: carrier_capacity
    trigger: "on Shipment create"
    algorithm: interval_merge
    formula: |
      # Carrier week capacity: a shipment may be assigned to carrier c for
      # pickup_week W iff count of c's shipments in state {PLANNED, PICKED_UP}
      # with pickup_week == W is STRICTLY LESS THAN c.weekly_capacity.
      # ISO weeks compare lexicographically after zero-padding (YYYY-Www);
      # a pickup_week equal to the order's scheduled_week is allowed (adjacent, gap 0).
      # pickup_week < scheduled_week is rejected (ERR_PICKUP_BEFORE_BUILD_WEEK).
    input_set: "Shipment rows for the carrier with state in {PLANNED, PICKED_UP}"
    constants: {}
    precision: "integer counts"
    variants:
      - name: strict
        when: "canonical"
        difference: "strict < comparison; at-capacity week rejects"
      - name: relaxed
        when: "documented alternative (rejected)"
        difference: "<= comparison would allow weekly_capacity+1 units; scaffold pins strict <"

# =============================================================================
# 1.4 Validation Rules Table (ordered by priority)
# =============================================================================
validations:
  - priority: 1
    category: auth
    check: "X-User-Role and X-User-ID headers present; role is a declared role"
    error_id: ERR_UNAUTHENTICATED
    http_status: 401
    applies_to: "all"
  - priority: 2
    category: auth
    check: "Role permitted for this endpoint per §1.5 roles"
    error_id: ERR_FORBIDDEN
    http_status: 403
    applies_to: "all"
  - priority: 3
    category: auth
    check: "Entity-backed role identity: X-User-ID matches the owning entity (Dealer role may only act on its own dealer_id resources)"
    error_id: ERR_FORBIDDEN
    http_status: 403
    applies_to: "all dealer-scoped endpoints"
  - priority: 4
    category: existence
    check: "Referenced resources exist, validated left-to-right along the path, then body FKs in declared field order"
    error_id: ERR_NOT_FOUND
    http_status: 404
    applies_to: "all"
  - priority: 5
    category: state
    check: "Target resource is in a state from which the requested transition exists"
    error_id: ERR_INVALID_STATE
    http_status: 409
    applies_to: "all action endpoints"
  - priority: 6
    category: state
    check: "Parent lifecycle gate: run is PUBLISHED for order entry / appeal grant / trade execute; dealer is ACTIVE for order entry; carrier is ACTIVE for shipment create"
    error_id: ERR_PARENT_NOT_ACTIVE
    http_status: 409
    applies_to: "POST /wholesale/orders, POST /wholesale/appeals/{id}/grant, POST /wholesale/dealer-trades/{id}/execute, POST /wholesale/shipments"
  - priority: 7
    category: business_constraint
    check: "Configuration constraint: every configuration.commodity_codes entry is a declared Commodity; customer_ref present iff order_kind=RETAIL"
    error_id: ERR_INVALID_CONFIGURATION
    http_status: 422
    applies_to: "POST /wholesale/orders"
  - priority: 8
    category: business_constraint
    check: "Commodity cap: commodity_cap formula admits this order (pre-accept evaluation)"
    error_id: ERR_COMMODITY_CAP_EXCEEDED
    http_status: 422
    applies_to: "POST /wholesale/orders"
  - priority: 9
    category: business_fiscal
    check: "Allocation pool: remaining pool (and retail pool for RETAIL) >= 1 on the DealerAllocation"
    error_id: ERR_ALLOCATION_EXHAUSTED
    http_status: 422
    applies_to: "POST /wholesale/orders"
  - priority: 10
    category: business_fiscal
    check: "Trade execute: from-dealer remaining pool >= units"
    error_id: ERR_TRADE_EXCEEDS_POOL
    http_status: 422
    applies_to: "POST /wholesale/dealer-trades/{id}/execute"
  - priority: 11
    category: business_temporal
    check: "Appeal filed within FILING_WINDOW_DAYS of run.published_at; trade acted on before expires_at; pickup_week >= order.scheduled_week and >= current week; build not before scheduled_week"
    error_id: ERR_WINDOW_CLOSED
    http_status: 422
    applies_to: "POST /wholesale/appeals, POST /wholesale/dealer-trades/{id}/accept, POST /wholesale/dealer-trades/{id}/counter, POST /wholesale/shipments, POST /wholesale/orders/{id}/build"
  - priority: 12
    category: business_temporal
    check: "Restriction supersede: new restriction's effective window must not be contained within an ACTIVE restriction's window for the same pair (overlap merge rule: new window must start at or after existing effective_to, or replace it entirely via supersede semantics)"
    error_id: ERR_RESTRICTION_OVERLAP
    http_status: 422
    applies_to: "POST /wholesale/commodity-restrictions"
  - priority: 13
    category: business_referential
    check: "Trade counterpart in the same region as proposer; from != to; units >= 1"
    error_id: ERR_TRADE_INVALID
    http_status: 422
    applies_to: "POST /wholesale/dealer-trades"
  - priority: 14
    category: business_referential
    check: "Retrofit allowed only when the omitting restriction is no longer ACTIVE"
    error_id: ERR_RETROFIT_BLOCKED
    http_status: 409
    applies_to: "POST /wholesale/orders/{id}/retrofit"
  - priority: 15
    category: business_constraint
    check: "Appeal eligibility: NEW_POINT requires dealer opened within NEW_POINT_MONTHS of run.published_at; MARKET_GAP requires the dealer's region share of the line below region average"
    error_id: ERR_APPEAL_INELIGIBLE
    http_status: 422
    applies_to: "POST /wholesale/appeals"
  - priority: 16
    category: business_constraint
    check: "Uniqueness: (dealer_id, model_line_id) DealerModelLine pair unique; region/dealer/model/commodity/carrier codes unique; at most one non-CANCELLED Shipment per order"
    error_id: ERR_DUPLICATE
    http_status: 409
    applies_to: "POST create endpoints"
  - priority: 17
    category: business_constraint
    check: "Request shape: required fields present, enums valid, integer ranges respected"
    error_id: ERR_VALIDATION
    http_status: 400
    applies_to: "all"

# =============================================================================
# 1.5 API Endpoint Table
# =============================================================================
endpoints:
  # --- test-driving clock ---
  - method: POST
    path: "/wholesale/_clock/set_current_utc"
    description: "Set the logical clock. Startup default is exactly 2026-09-01T00:00:00Z; before any call the clock reads this default and never falls back to wall-clock."
    roles: [RegionalAllocator]
    code: 200
    input: [to_iso8601]
    output: { current_utc: string }
    side_effects: ["advance logical clock; EXPIRED sweeps for trades/restrictions run on read"]
  - method: POST
    path: "/wholesale/_seed/order-at-week"
    description: "Test-driving endpoint: create an already-BUILT order for a dealer with scheduled_week/built_at pinned to an arbitrary past ISO week (bypasses the current-week gates on schedule/build). Used to construct aged-inventory and lookback fixtures deterministically."
    roles: [RegionalAllocator]
    code: 201
    input: [dealer_id, model_line_id, run_id, order_kind, scheduled_week, "customer_ref?"]
    output: VehicleOrder
    side_effects: ["creates order in BUILT with scheduled_week/built_at derived from the pinned week; consumes 1 pool unit like a normal accept"]

  # --- catalog ---
  - method: POST
    path: "/wholesale/regions"
    description: "Create a region."
    roles: [RegionalAllocator]
    code: 201
    input: [code, name]
    output: Region
    side_effects: []
  - method: GET
    path: "/wholesale/regions"
    description: "List regions."
    roles: [RegionalAllocator, Dealer, ProductionScheduler, LogisticsCoordinator, CommodityManager]
    code: 200
    input: ["limit?", "offset?", "status?"]
    output: Region[]
    side_effects: []
  - method: GET
    path: "/wholesale/regions/{id}"
    description: "Get one region."
    roles: [RegionalAllocator, Dealer, ProductionScheduler, LogisticsCoordinator, CommodityManager]
    code: 200
    input: []
    output: Region
    side_effects: []
  - method: POST
    path: "/wholesale/dealers"
    description: "Create a dealer (also auto-creates DealerModelLine rows on first order/run)."
    roles: [RegionalAllocator]
    code: 201
    input: [region_id, dealer_code, name, opened_on]
    output: Dealer
    side_effects: []
  - method: GET
    path: "/wholesale/dealers"
    description: "List dealers."
    roles: [RegionalAllocator, Dealer, ProductionScheduler, LogisticsCoordinator, CommodityManager]
    code: 200
    input: ["limit?", "offset?", "region_id?", "status?"]
    output: Dealer[]
    side_effects: []
  - method: GET
    path: "/wholesale/dealers/{id}"
    description: "Get one dealer."
    roles: [RegionalAllocator, Dealer, ProductionScheduler, LogisticsCoordinator, CommodityManager]
    code: 200
    input: []
    output: Dealer
    side_effects: []
  - method: POST
    path: "/wholesale/model-lines"
    description: "Create a model line."
    roles: [RegionalAllocator]
    code: 201
    input: [model_code, name]
    output: ModelLine
    side_effects: []
  - method: GET
    path: "/wholesale/model-lines"
    description: "List model lines."
    roles: [RegionalAllocator, Dealer, ProductionScheduler, LogisticsCoordinator, CommodityManager]
    code: 200
    input: ["limit?", "offset?"]
    output: ModelLine[]
    side_effects: []
  - method: GET
    path: "/wholesale/model-lines/{id}"
    description: "Get one model line."
    roles: [RegionalAllocator, Dealer, ProductionScheduler, LogisticsCoordinator, CommodityManager]
    code: 200
    input: []
    output: ModelLine
    side_effects: []
  - method: POST
    path: "/wholesale/commodities"
    description: "Create a commodity (starts CONSTRAINED)."
    roles: [CommodityManager]
    code: 201
    input: [code, name]
    output: Commodity
    side_effects: []
  - method: GET
    path: "/wholesale/commodities"
    description: "List commodities."
    roles: [RegionalAllocator, Dealer, ProductionScheduler, LogisticsCoordinator, CommodityManager]
    code: 200
    input: ["limit?", "offset?", "status?"]
    output: Commodity[]
    side_effects: []
  - method: POST
    path: "/wholesale/commodities/{id}/resolve"
    description: "Mark a commodity RESOLVED; cascades ACTIVE restrictions to EXPIRED."
    roles: [CommodityManager]
    code: 200
    input: []
    output: Commodity
    side_effects: ["Commodity.status := RESOLVED; restrictions cascade to EXPIRED"]
  - method: POST
    path: "/wholesale/commodities/{id}/constrain"
    description: "Return a RESOLVED commodity to CONSTRAINED."
    roles: [CommodityManager]
    code: 200
    input: []
    output: Commodity
    side_effects: ["Commodity.status := CONSTRAINED"]

  # --- commodity restrictions ---
  - method: POST
    path: "/wholesale/commodity-restrictions"
    description: "Create a restriction; supersedes the ACTIVE restriction for the same (commodity_id, model_line_id)."
    roles: [CommodityManager]
    code: 201
    input: [commodity_id, model_line_id, effective_from, effective_to, install_rate_pct, allow_partial_build]
    output: CommodityRestriction
    side_effects: ["prior ACTIVE restriction for the pair -> SUPERSEDED"]
  - method: GET
    path: "/wholesale/commodity-restrictions"
    description: "List restrictions (filtered list form for FK reverse-reachability)."
    roles: [RegionalAllocator, Dealer, ProductionScheduler, CommodityManager]
    code: 200
    input: ["limit?", "offset?", "commodity_id?", "model_line_id?", "status?"]
    output: CommodityRestriction[]
    side_effects: []
  - method: GET
    path: "/wholesale/commodity-restrictions/{id}"
    description: "Get one restriction."
    roles: [RegionalAllocator, Dealer, ProductionScheduler, CommodityManager]
    code: 200
    input: []
    output: CommodityRestriction
    side_effects: []

  # --- dealer-model-line computed reads ---
  - method: GET
    path: "/wholesale/dealer-model-lines"
    description: "List DealerModelLine aggregates (filtered list)."
    roles: [RegionalAllocator, Dealer, ProductionScheduler]
    code: 200
    input: ["limit?", "offset?", "dealer_id?", "model_line_id?"]
    output: DealerModelLine[]
    side_effects: []
  - method: GET
    path: "/wholesale/dealer-model-lines/{id}"
    description: "Get one DealerModelLine."
    roles: [RegionalAllocator, Dealer, ProductionScheduler]
    code: 200
    input: []
    output: DealerModelLine
    side_effects: []
  - method: GET
    path: "/wholesale/dealers/{id}/model-lines"
    description: "Sub-resource listing of a dealer's DealerModelLine rows."
    roles: [RegionalAllocator, Dealer, ProductionScheduler]
    code: 200
    input: ["limit?", "offset?"]
    output: DealerModelLine[]
    side_effects: []

  # --- allocation runs ---
  - method: POST
    path: "/wholesale/allocation-runs"
    description: "Create a run in DRAFT; auto-creates one DealerAllocation child per ACTIVE dealer in ACTIVE regions. Creating while another run for the same line is PUBLISHED supersedes that run."
    roles: [RegionalAllocator]
    code: 201
    input: [period, model_line_id, base_units, lookback_start, lookback_end, retail_priority_pct]
    output: AllocationRun
    side_effects: ["DealerAllocation children auto-created (OPEN); supersedes existing PUBLISHED run for the line"]
  - method: GET
    path: "/wholesale/allocation-runs"
    description: "List runs."
    roles: [RegionalAllocator, Dealer, ProductionScheduler]
    code: 200
    input: ["limit?", "offset?", "model_line_id?", "status?"]
    output: AllocationRun[]
    side_effects: []
  - method: GET
    path: "/wholesale/allocation-runs/{id}"
    description: "Get one run."
    roles: [RegionalAllocator, Dealer, ProductionScheduler]
    code: 200
    input: []
    output: AllocationRun
    side_effects: []
  - method: POST
    path: "/wholesale/allocation-runs/{id}/publish"
    description: "Publish: compute provisional allocation_share per child."
    roles: [RegionalAllocator]
    code: 200
    input: []
    output: AllocationRun
    side_effects: ["allocation_share provisional per child; new_point_floor; retail_reserve_split; published_at stamped; increments AllocationRun.version by 1"]
  - method: POST
    path: "/wholesale/allocation-runs/{id}/lock"
    description: "Lock: requires all children LOCKED and no open appeals; writes final earned credits."
    roles: [RegionalAllocator]
    code: 200
    input: []
    output: AllocationRun
    side_effects: ["allocation_share final; DealerModelLine.earned_credit_units written; increments AllocationRun.version by 1"]
  - method: GET
    path: "/wholesale/allocation-runs/{id}/dealer-allocations"
    description: "Sub-resource listing of a run's DealerAllocation children."
    roles: [RegionalAllocator, Dealer, ProductionScheduler]
    code: 200
    input: ["limit?", "offset?", "dealer_id?"]
    output: DealerAllocation[]
    side_effects: []
  - method: GET
    path: "/wholesale/dealer-allocations"
    description: "List dealer allocations (filtered list; FK reverse-reachability for DealerAllocation.dealer_id)."
    roles: [RegionalAllocator, Dealer, ProductionScheduler]
    code: 200
    input: ["limit?", "offset?", "dealer_id?", "run_id?"]
    output: DealerAllocation[]
    side_effects: []
  - method: GET
    path: "/wholesale/dealer-allocations/{id}"
    description: "Get one DealerAllocation."
    roles: [RegionalAllocator, Dealer, ProductionScheduler]
    code: 200
    input: []
    output: DealerAllocation
    side_effects: []
  - method: POST
    path: "/wholesale/allocation-runs/{id}/dealer-allocations/{da_id}/lock"
    description: "Lock a single dealer allocation."
    roles: [RegionalAllocator]
    code: 200
    input: []
    output: DealerAllocation
    side_effects: ["DealerAllocation.status := LOCKED; increments DealerAllocation.version by 1"]

  # --- orders ---
  - method: POST
    path: "/wholesale/orders"
    description: "Dealer order entry; system accept-or-reject immediately. Creates directly in SUBMITTED then ACCEPTED/REJECTED."
    roles: [Dealer]
    code: 201
    input: [dealer_id, model_line_id, run_id, order_kind, expected_dealer_allocation_version, "customer_ref?", configuration]
    output: VehicleOrder
    side_effects: ["accept: DealerAllocation.consumed_units += 1 (and retail_consumed_units for RETAIL); commodity_cap check; retail_reserve_split; increments DealerAllocation.version by 1; inventory_turn recompute"]
  - method: GET
    path: "/wholesale/orders"
    description: "List orders (customer visibility: dealer sees own orders with scheduling commitments)."
    roles: [RegionalAllocator, Dealer, ProductionScheduler, LogisticsCoordinator]
    code: 200
    input: ["limit?", "offset?", "dealer_id?", "run_id?", "model_line_id?", "state?", "order_kind?", "retrofit_of_order_id?"]
    output: VehicleOrder[]
    side_effects: []
  - method: GET
    path: "/wholesale/orders/{id}"
    description: "Get one order."
    roles: [RegionalAllocator, Dealer, ProductionScheduler, LogisticsCoordinator]
    code: 200
    input: []
    output: VehicleOrder
    side_effects: []
  - method: POST
    path: "/wholesale/orders/{id}/cancel"
    description: "Cancel from DRAFT/SUBMITTED/ACCEPTED; ACCEPTED cancel releases pool (compensation)."
    roles: [Dealer]
    code: 200
    input: ["cancel_reason?"]
    output: VehicleOrder
    side_effects: ["pool release if ACCEPTED; increments DealerAllocation.version by 1 when pool released"]
  - method: POST
    path: "/wholesale/orders/{id}/schedule"
    description: "Assign a build week (scheduling commitment)."
    roles: [ProductionScheduler]
    code: 200
    input: [build_week]
    output: VehicleOrder
    side_effects: ["state := SCHEDULED; scheduled_week/scheduled_at stamped; inventory_turn recompute"]
  - method: POST
    path: "/wholesale/orders/{id}/build"
    description: "Build the unit; optionally WITHOUT_FEATURE when partial build allowed."
    roles: [ProductionScheduler]
    code: 200
    input: ["build_mode?"]
    output: VehicleOrder
    side_effects: ["state := BUILT; build_state := PENDING_RETROFIT when build_mode=WITHOUT_FEATURE"]
  - method: POST
    path: "/wholesale/orders/{id}/retrofit"
    description: "Complete a pending retrofit once the restriction is no longer ACTIVE; spawns a retrofit child order row."
    roles: [ProductionScheduler]
    code: 200
    input: []
    output: VehicleOrder
    side_effects: ["build_state := RETROFITTED; child retrofit order created with retrofit_of_order_id"]

  # --- dealer trades ---
  - method: POST
    path: "/wholesale/dealer-trades"
    description: "Propose a dealer-to-dealer allocation trade within a region."
    roles: [Dealer]
    code: 201
    input: [from_dealer_id, to_dealer_id, run_id, units]
    output: DealerTrade
    side_effects: ["expires_at := created_at + TRADE_TTL_DAYS"]
  - method: GET
    path: "/wholesale/dealer-trades"
    description: "List trades."
    roles: [RegionalAllocator, Dealer]
    code: 200
    input: ["limit?", "offset?", "from_dealer_id?", "to_dealer_id?", "run_id?", "state?"]
    output: DealerTrade[]
    side_effects: []
  - method: GET
    path: "/wholesale/dealer-trades/{id}"
    description: "Get one trade."
    roles: [RegionalAllocator, Dealer]
    code: 200
    input: []
    output: DealerTrade
    side_effects: []
  - method: POST
    path: "/wholesale/dealer-trades/{id}/counter"
    description: "Counter-propose (to-dealer counters, then from-dealer may re-counter; loops PROPOSED<->COUNTERED)."
    roles: [Dealer]
    code: 200
    input: [counter_units]
    output: DealerTrade
    side_effects: ["state toggles per countering party"]
  - method: POST
    path: "/wholesale/dealer-trades/{id}/accept"
    description: "Counterpart accepts a PROPOSED trade."
    roles: [Dealer]
    code: 200
    input: []
    output: DealerTrade
    side_effects: ["state := ACCEPTED"]
  - method: POST
    path: "/wholesale/dealer-trades/{id}/decline"
    description: "Either party declines from PROPOSED/COUNTERED."
    roles: [Dealer]
    code: 200
    input: []
    output: DealerTrade
    side_effects: ["state := DECLINED"]
  - method: POST
    path: "/wholesale/dealer-trades/{id}/cancel"
    description: "Proposer cancels from PROPOSED/COUNTERED."
    roles: [Dealer]
    code: 200
    input: []
    output: DealerTrade
    side_effects: ["state := CANCELLED"]
  - method: POST
    path: "/wholesale/dealer-trades/{id}/execute"
    description: "Allocator executes an ACCEPTED trade; moves units, applies earn penalty."
    roles: [RegionalAllocator]
    code: 200
    input: [expected_run_version]
    output: DealerTrade
    side_effects: ["final_units move; trade_earn_penalty; increments AllocationRun.version by 1 and both DealerAllocation versions by 1"]

  # --- appeals ---
  - method: POST
    path: "/wholesale/appeals"
    description: "File an allocation appeal within the filing window."
    roles: [Dealer]
    code: 201
    input: [dealer_id, run_id, appeal_type, requested_units]
    output: Appeal
    side_effects: ["filed_at stamped"]
  - method: GET
    path: "/wholesale/appeals"
    description: "List appeals."
    roles: [RegionalAllocator, Dealer]
    code: 200
    input: ["limit?", "offset?", "dealer_id?", "run_id?", "state?"]
    output: Appeal[]
    side_effects: []
  - method: GET
    path: "/wholesale/appeals/{id}"
    description: "Get one appeal."
    roles: [RegionalAllocator, Dealer]
    code: 200
    input: []
    output: Appeal
    side_effects: []
  - method: POST
    path: "/wholesale/appeals/{id}/review"
    description: "Move appeal FILED -> UNDER_REVIEW."
    roles: [RegionalAllocator]
    code: 200
    input: []
    output: Appeal
    side_effects: []
  - method: POST
    path: "/wholesale/appeals/{id}/grant"
    description: "Grant units; adjusts DealerAllocation. NEW_POINT eligibility rechecked."
    roles: [RegionalAllocator]
    code: 200
    input: [granted_units, expected_run_version]
    output: Appeal
    side_effects: ["DealerAllocation.adjustment_units += granted_units; final_units recompute; increments AllocationRun.version by 1 and DealerAllocation.version by 1"]
  - method: POST
    path: "/wholesale/appeals/{id}/deny"
    description: "Deny an appeal under review."
    roles: [RegionalAllocator]
    code: 200
    input: []
    output: Appeal
    side_effects: []
  - method: POST
    path: "/wholesale/appeals/{id}/withdraw"
    description: "Filing dealer withdraws a FILED appeal."
    roles: [Dealer]
    code: 200
    input: []
    output: Appeal
    side_effects: []

  # --- incentives ---
  - method: POST
    path: "/wholesale/incentive-programs"
    description: "Create an incentive program."
    roles: [RegionalAllocator]
    code: 201
    input: [code, model_line_id, kind, params, window_start, window_end]
    output: IncentiveProgram
    side_effects: []
  - method: GET
    path: "/wholesale/incentive-programs"
    description: "List programs."
    roles: [RegionalAllocator, Dealer, ProductionScheduler]
    code: 200
    input: ["limit?", "offset?", "model_line_id?", "status?"]
    output: IncentiveProgram[]
    side_effects: []
  - method: GET
    path: "/wholesale/incentive-programs/{id}"
    description: "Get one program."
    roles: [RegionalAllocator, Dealer, ProductionScheduler]
    code: 200
    input: []
    output: IncentiveProgram
    side_effects: []
  - method: POST
    path: "/wholesale/incentive-programs/{id}/close"
    description: "Close a program: final incentive_accrual per dealer, frozen."
    roles: [RegionalAllocator]
    code: 200
    input: []
    output: IncentiveProgram
    side_effects: ["status := CLOSED; final accruals frozen"]
  - method: GET
    path: "/wholesale/incentive-programs/{id}/accruals"
    description: "Per-dealer accrual figures for the program."
    roles: [RegionalAllocator, Dealer]
    code: 200
    input: ["limit?", "offset?", "dealer_id?"]
    output: { dealer_id: string, amount_cents: integer, variant: string }
    side_effects: []

  # --- carriers & shipments ---
  - method: POST
    path: "/wholesale/carriers"
    description: "Create a carrier."
    roles: [LogisticsCoordinator]
    code: 201
    input: [code, name, weekly_capacity]
    output: Carrier
    side_effects: []
  - method: GET
    path: "/wholesale/carriers"
    description: "List carriers."
    roles: [RegionalAllocator, ProductionScheduler, LogisticsCoordinator]
    code: 200
    input: ["limit?", "offset?", "status?"]
    output: Carrier[]
    side_effects: []
  - method: GET
    path: "/wholesale/carriers/{id}"
    description: "Get one carrier."
    roles: [RegionalAllocator, ProductionScheduler, LogisticsCoordinator]
    code: 200
    input: []
    output: Carrier
    side_effects: []
  - method: POST
    path: "/wholesale/shipments"
    description: "Assign a BUILT order to a carrier for a pickup week (carrier capacity enforced)."
    roles: [LogisticsCoordinator]
    code: 201
    input: [order_id, carrier_id, pickup_week]
    output: Shipment
    side_effects: ["carrier_capacity check"]
  - method: GET
    path: "/wholesale/shipments"
    description: "List shipments (filtered list for FK reverse-reachability)."
    roles: [RegionalAllocator, Dealer, ProductionScheduler, LogisticsCoordinator]
    code: 200
    input: ["limit?", "offset?", "order_id?", "carrier_id?", "state?", "pickup_week?"]
    output: Shipment[]
    side_effects: []
  - method: GET
    path: "/wholesale/shipments/{id}"
    description: "Get one shipment."
    roles: [RegionalAllocator, Dealer, ProductionScheduler, LogisticsCoordinator]
    code: 200
    input: []
    output: Shipment
    side_effects: []
  - method: POST
    path: "/wholesale/shipments/{id}/pickup"
    description: "Mark picked up (not before pickup_week)."
    roles: [LogisticsCoordinator]
    code: 200
    input: []
    output: Shipment
    side_effects: ["state := PICKED_UP"]
  - method: POST
    path: "/wholesale/shipments/{id}/deliver"
    description: "Mark delivered; cascades the order to DELIVERED."
    roles: [LogisticsCoordinator]
    code: 200
    input: []
    output: Shipment
    side_effects: ["state := DELIVERED; order cascade BUILT -> DELIVERED; incentive_accrual provisional recompute; inventory_turn recompute"]
  - method: POST
    path: "/wholesale/shipments/{id}/cancel"
    description: "Cancel a PLANNED shipment."
    roles: [LogisticsCoordinator]
    code: 200
    input: []
    output: Shipment
    side_effects: ["state := CANCELLED"]

# =============================================================================
# 1.6 Error Code Catalog
# =============================================================================
errors:
  - id: ERR_UNAUTHENTICATED
    http: 401
    condition: "Missing/invalid auth headers"
  - id: ERR_FORBIDDEN
    http: 403
    condition: "Role not permitted, or entity-backed identity mismatch (dealer acting on another dealer's resource)"
  - id: ERR_NOT_FOUND
    http: 404
    condition: "Path or body FK reference does not exist"
  - id: ERR_VALIDATION
    http: 400
    condition: "Malformed request: missing required field, bad enum, out-of-range integer"
  - id: ERR_INVALID_STATE
    http: 409
    condition: "Transition not defined from the entity's current state"
  - id: ERR_PARENT_NOT_ACTIVE
    http: 409
    condition: "Parent lifecycle gate failed (run not PUBLISHED, dealer not ACTIVE, carrier not ACTIVE)"
  - id: ERR_STALE_ALLOCATION_VERSION
    http: 412
    condition: "expected_dealer_allocation_version does not match the DealerAllocation's current version"
  - id: ERR_STALE_RUN_VERSION
    http: 412
    condition: "expected_run_version does not match the AllocationRun's current version"
  - id: ERR_INVALID_CONFIGURATION
    http: 422
    condition: "Unknown commodity code in configuration, or customer_ref mismatch with order_kind"
  - id: ERR_COMMODITY_CAP_EXCEEDED
    http: 422
    condition: "Feature install-rate cap would be exceeded by accepting this order"
  - id: ERR_ALLOCATION_EXHAUSTED
    http: 422
    condition: "No remaining pool (total, or retail pool for RETAIL when stock pool also exhausted)"
  - id: ERR_TRADE_EXCEEDS_POOL
    http: 422
    condition: "Trade execute would drive from-dealer remaining pool negative"
  - id: ERR_TRADE_INVALID
    http: 422
    condition: "Cross-region trade, self-trade, or units < 1"
  - id: ERR_TRADE_EXPIRED
    http: 422
    condition: "Action on a trade at or after expires_at"
  - id: ERR_WINDOW_CLOSED
    http: 422
    condition: "Temporal window violated (appeal filing window, build before scheduled week, pickup before build week or before current week)"
  - id: ERR_PICKUP_BEFORE_BUILD_WEEK
    http: 422
    condition: "pickup_week earlier than the order's scheduled_week"
  - id: ERR_RESTRICTION_OVERLAP
    http: 422
    condition: "New restriction window overlaps the ACTIVE window for the same (commodity, line) without fully superseding"
  - id: ERR_RETROFIT_BLOCKED
    http: 409
    condition: "Retrofit attempted while the omitting restriction is still ACTIVE"
  - id: ERR_APPEAL_INELIGIBLE
    http: 422
    condition: "NEW_POINT appeal outside grace window, or MARKET_GAP claim not supported"
  - id: ERR_APPEALS_OPEN
    http: 409
    condition: "Run lock attempted while appeals are FILED or UNDER_REVIEW"
  - id: ERR_CHILDREN_NOT_LOCKED
    http: 409
    condition: "Run lock attempted while some DealerAllocation child is still OPEN"
  - id: ERR_DUPLICATE
    http: 409
    condition: "Uniqueness violation (codes, dealer-line pair, second non-CANCELLED shipment for an order)"
  - id: ERR_CARRIER_CAPACITY
    http: 422
    condition: "Carrier already at weekly_capacity for the requested pickup_week"
  - id: ERR_RUN_PERIOD_CONFLICT
    http: 409
    condition: "A run for the same model_line_id is already PUBLISHED and this op requires uniqueness (publish of second run)"
  - id: ERR_PARTIAL_BUILD_NOT_ALLOWED
    http: 422
    condition: "build_mode=WITHOUT_FEATURE but the restriction does not allow partial build"
  - id: ERR_PROGRAM_CLOSED
    http: 409
    condition: "Operation on an incentive program outside its window or already CLOSED"

# =============================================================================
# 1.7 RBAC Matrix
# =============================================================================
roles:
  - name: Anonymous
    description: "Unauthenticated caller placeholder used only to exercise the auth layer; possesses no permissions."
    identity: "opaque"
    exclusive_operations: []
    shared_operations: []
  - name: RegionalAllocator
    description: "OEM regional allocation staff; owns regions, dealers, model lines, runs, appeals decisions, trade execution, incentive programs. Hierarchical override over Dealer operations for reads."
    identity: "opaque"
    exclusive_operations:
      - "create regions/dealers/model-lines"
      - "create/publish/lock allocation runs; lock dealer allocations"
      - "review/grant/deny appeals"
      - "execute dealer trades"
      - "create/close incentive programs"
      - "set logical clock"
    shared_operations:
      - "read any entity"
  - name: Dealer
    description: "Franchised dealer user; enters orders, proposes/counters trades, files appeals, reads own allocations and order visibility."
    identity: "entity_backed:Dealer"
    exclusive_operations:
      - "create/cancel own orders"
      - "propose/counter/accept/decline/cancel own trades"
      - "file/withdraw own appeals"
    shared_operations:
      - "read own dealer, allocations, orders, shipments, accruals, catalog"
  - name: ProductionScheduler
    description: "Plant scheduling; schedules and builds orders, completes retrofits."
    identity: "opaque"
    exclusive_operations:
      - "schedule orders"
      - "build orders (with or without feature)"
      - "complete retrofits"
    shared_operations:
      - "read orders, runs, allocations, catalog"
  - name: LogisticsCoordinator
    description: "Transportation management; owns carriers and shipment lifecycle."
    identity: "opaque"
    exclusive_operations:
      - "create carriers"
      - "create/pickup/deliver/cancel shipments"
    shared_operations:
      - "read orders, carriers, shipments, catalog"
  - name: CommodityManager
    description: "Commodity supply team; owns commodities and restrictions."
    identity: "opaque"
    exclusive_operations:
      - "create/resolve/constrain commodities"
      - "create commodity restrictions (supersede)"
    shared_operations:
      - "read catalog and restrictions"
