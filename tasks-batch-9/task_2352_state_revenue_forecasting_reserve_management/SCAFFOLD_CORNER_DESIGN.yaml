      - name: manual_deposit_into_a_fund_at_cap_rejected
        claim_type: error_triggerable
        grounds:
          - validations[priority 25 ERR_FUND_AT_CAP]
          - state_machines.ReserveFund.ACCEPTING_to_AT_CAP
          - endpoints[POST /reserve-funds/{id}/deposits]
