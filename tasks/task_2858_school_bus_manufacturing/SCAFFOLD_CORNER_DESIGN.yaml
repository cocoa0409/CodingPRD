          - errors[ERR_ROUTE_RANGE_INSUFFICIENT]
          - errors[ERR_JOINT_STRENGTH_INSUFFICIENT]
          - calculations.spec_compliance_evaluation.input_set
          - entities.ContractOrder.fields.spec_profile_id
        distinguishing_aspect: |
          A bid that was CONFORMING at submit can still be blocked at mint, because the order freezes the
          profile that was PUBLISHED at AWARD time — a profile the bid was never evaluated against — and the
          two engineering items that the award-time upgrade cannot raise are re-gated there. Two orders show
          both items: a TX profile superseded with min_joint_strength_kn 70.0 blocks a 58.0 kN body, and an
          NV profile superseded with required_route_range_mi 100.0 blocks a bus whose derated range is 79.7.
