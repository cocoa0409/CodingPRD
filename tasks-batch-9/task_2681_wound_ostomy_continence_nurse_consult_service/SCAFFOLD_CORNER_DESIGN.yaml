            - call: "POST /skin-assessments/${a1_id}/validate"
              payload: { confirmed_stage: "STAGE_4", present_on_admission_confirmed: false }
              as: WocNurse
              as_user_id: "${n2_id}"
              captures: { err_id: "$.data.error_id" }
          assert:
            - "HTTP status is 409 and data.error_id == ERR_ASSESSMENT_INVALID_STATE"
            - "SkinAssessment.${a1_id}.validation_status == VALIDATED, confirmed_stage == STAGE_2 (not STAGE_4), poa_determination == POA"
            - "Patient.${p1_id}.poa_skin_assessment_documented == true from the first validation and is not toggled by the refused call"
            - "GET /pressure-injury-cases?skin_assessment_id=${a1_id} returns total_count == 1 with classification == POA and status == CLASSIFIED_POA"
            - "Unit.${u1_id}.open_hapi_rca_count == 0 and survey_posture == OPEN — the HAPI cascade never ran despite the second call claiming present_on_admission_confirmed false"
            - "ConsultRequest.${c1_id}.status == ASSESSED and acuity_score == 35.0 ((35 + 0 + 0 + min(15, floor(6/10)*5)) * 1.00), unchanged by the refused re-validation"

      - name: dispute_then_restage_returns_assessment_to_pending_validation
        claim_type: cyclic
        grounds:
          - state_machines.SkinAssessment.PENDING_VALIDATION_to_DISPUTED
          - state_machines.SkinAssessment.DISPUTED_to_PENDING_VALIDATION
          - entities.Unit.fields.disputed_staging_count
          - entities.ConsultRequest.fields.protocol_hold
        distinguishing_aspect: "The staging dispute loop is the SkinAssessment machine's cycle. Two counters behave differently across it: protocol_hold is a latch that the restage clears, while Unit.disputed_staging_count is a lifetime counter that the restage must NOT decrement."
        test_recipe:
          setup:
            - "Unit 3E exists with CERTIFIED nurse Nina and ADMITTED patient MRN-G8 (admitted 2026-07-31T12:00:00Z)."
            - "Consult C1 is ASSIGNED to Nina; Nina filed assessment A1 on the SACRUM, STAGE_2, area 6 cm2, observed 2026-08-01T00:00:00Z."
