      - name: concession_credit_application_preserves_the_committed_ledger_identity
        grounds:
          - calculations.concession_credit_application
          - calculations.concession_amortization
          - validations.priority_74_credit_periods_in_ascending_order
          - state_machines.Lease.concession.APPROVED_to_AMORTIZING
          - entities.Community.fields.committed_concession_cents
          - errors.ERR_CONCESSION_PERIOD_OUT_OF_ORDER
        distinguishing_aspect: |
          The invariant Community.committed_concession_cents == SUM(Lease.concession_remaining_cents)
          must hold after every credit application and, crucially, after a rejected one. Applying period
          1 of a 412685-cent straight-line schedule moves the ledger from 412685 to 378295 in lockstep on
          the lease, the program and the community; skipping to period 3 is refused by priority 74 and
          must leave all three numbers untouched at 378295 rather than half-applying the 34390 credit;
          applying period 2 then advances all three to 343905. An implementation that decrements the
          community counter before validating the period order, or that decrements it by the schedule's
          final 34395 residual instead of the current period's 34390, breaks the identity.
