            - call: "POST /payees"
              payload: { tin: "111-22-3333", tin_type: "SSN", legal_name: "Patricia Doeh" }
              as: TreasuryOperator
              captures: { err_id: $.data.error_id }
          assert:
            - "the response status is 409 and error_id == ERR_DUPLICATE_TIN"

      - name: payee_tin_mismatch_returns_422
        claim_type: Violation → Error
        grounds:
          - errors.ERR_PAYEE_TIN_MISMATCH
          - validations[priority=10]
          - entities.Payment.fields.payee_tin
        distinguishing_aspect: "The TIN declared on the payment record must equal the referenced Payee's TIN: payee_id exists (no 404) but payee_tin 999-99-9999 != Payee.tin 111-22-3333 is a 422 ERR_PAYEE_TIN_MISMATCH — payee verification is an integrity gate, not an existence check."
        test_recipe:
          setup:
            - "Logical clock 2026-09-01T00:00:00Z. Payee 111-22-3333 and FULL VENDOR policy ACTIVE; one file."
          setup_api_calls:
            - *k_clock
            - *k_payee1
