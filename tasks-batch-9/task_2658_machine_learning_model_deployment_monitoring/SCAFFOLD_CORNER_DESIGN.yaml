            - "PRIORITY 46: a challenger deployment carrying model B's version returns HTTP 422 'ERR_CHALLENGER_MODEL_MISMATCH' even though it IS a SHADOW deployment, so the arm-ownership check is independent of the pattern check"
            - "PRIORITY 55: pointing both arms at the REALTIME deployment d1 returns HTTP 422 'ERR_CHALLENGER_NOT_SHADOW' — the challenger arm must be SHADOW"
            - "reserved_samples 60000 against version 1.1.0's evaluation_sample_quota 50000 (budget 50000) returns HTTP 409 'ERR_SAMPLE_BUDGET_EXCEEDED'"
