      - name: cooling_safety_gate_outranks_row_density_gate_on_energize
        grounds:
          - validations.priority_25_ERR_COOLING_CAPACITY_EXCEEDED
          - validations.priority_29_ERR_ROW_DENSITY_LIMIT_EXCEEDED
          - calculations.provisioning_gate_thresholds
          - endpoints.PATCH_colocation_rows_row_id
          - state_machines.PowerCircuit.APPROVED_to_ENERGIZED
        distinguishing_aspect: |
          One 90A feed (derated 17.280) breaches BOTH the thermal ceiling (10.0 kW) and the
          density rejection ceiling (4.000 * 1.10 = 4.400); the safety gate at priority 25 must
          win, returning ERR_COOLING_CAPACITY_EXCEEDED. Raising only cooling_capacity_kw to
          20.0 via PATCH then exposes the previously masked ERR_ROW_DENSITY_LIMIT_EXCEEDED
          from the very same call, and raising design_density to 20.0 finally admits it — three
          different outcomes from one unchanged energize request.
        test_recipe:
          setup:
            - "Logical clock at 2026-08-01T00:00:00Z."
            - "Row HB/R1: design_density_kw_per_cabinet 4.0, max_row_power_kw 200.0, cooling_capacity_kw 10.0, so with 1 occupied slot density_ceiling_kw is 4.000 and the rejection ceiling is 4.400."
            - "Contract ACTIVE with power_commit_kw 20.0 (over-provision ceiling 22.000) so the fiscal gate never fires."
            - "Cabinet C01 rated 20.0 kW INSTALLED (breaker ceiling 25.000) with one APPROVED 90A/240V/SINGLE PRIMARY circuit, derated 17.280."
