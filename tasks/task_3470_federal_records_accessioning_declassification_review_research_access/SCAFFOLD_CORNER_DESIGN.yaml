      - name: appeal_window_inclusive_boundary
        claim_type: Violation → Error
        grounds:
          - calculations.appeal_window
          - errors.ERR_APPEAL_WINDOW_CLOSED
        distinguishing_aspect: "The 30-day appeal window is inclusive: an appeal at exactly decided_at + 30 days succeeds, while an appeal one day later fails with ERR_APPEAL_WINDOW_CLOSED."
        test_recipe:
          setup:
            - "Classified C1; Ada ACTIVE; two FOIA requests f1 and f2, both adjudicated DENY at clock 2026-09-01T00:00:00Z (decided_at)."
          setup_api_calls:
            - *k_clock
            - *k_ag_doj
            - *k_sch_s1_create
            - *k_sch_s1_submit
            - *k_sch_s1_appraise
            - *k_sch_s1_decide
            - *k_tr_t1_create
            - *k_tr_t1_meta
            - *k_tr_t1_accession
            - *k_res_ada
            - *k_res_ada_act
            - call: "POST /records/foia-requests"
              payload: { researcher_id: "${res_ada}", collection_id: "${col_c1}", description_of_records: "f1" }
              as: Researcher
              as_user_id: "${res_ada}"
              captures: { foia_f1: $.data.id }
            - call: "POST /records/foia-requests/${foia_f1}/adjudicate"
              payload: { decision: "DENY", claimed_exemptions: ["B1"] }
              as: FoiaOfficer
              as_user_id: "foia-1"
            - call: "POST /records/foia-requests"
              payload: { researcher_id: "${res_ada}", collection_id: "${col_c1}", description_of_records: "f2" }
              as: Researcher
              as_user_id: "${res_ada}"
              captures: { foia_f2: $.data.id }
            - call: "POST /records/foia-requests/${foia_f2}/adjudicate"
              payload: { decision: "DENY", claimed_exemptions: ["B3"] }
              as: FoiaOfficer
              as_user_id: "foia-1"
          trigger:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-10-01T00:00:00Z" }
              as: PlatformAdmin
              as_user_id: "admin-1"
            - call: "POST /records/foia-requests/${foia_f1}/appeal"
              payload: { appeal_reason: "timely at the boundary" }
              as: Researcher
              as_user_id: "${res_ada}"
              captures: { app_ok: $.data.status }
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-10-02T00:00:00Z" }
              as: PlatformAdmin
              as_user_id: "admin-1"
            - call: "POST /records/foia-requests/${foia_f2}/appeal"
              payload: { appeal_reason: "one day late" }
              as: Researcher
              as_user_id: "${res_ada}"
              captures: { err_win: $.data.error_id }
          assert:
            - "the boundary appeal at decided_at + 30 days returns 200 and app_ok == APPEALED"
            - "the appeal at decided_at + 31 days returns 409 and err_win == ERR_APPEAL_WINDOW_CLOSED"
            - "FoiaRequest.${foia_f2}.status remains DENIED"

