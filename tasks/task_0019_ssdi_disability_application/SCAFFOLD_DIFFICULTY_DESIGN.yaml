  # -------------------------------------------------------------------------
  # Rule 6 — Boundary-precision checks on different metrics/endpoints
  # -------------------------------------------------------------------------
  - rule_id: boundary_precision_check
    instances:

      - name: ssi_resource_limit_strict_inequality_at_200000_cents
        grounds:
          - calculations.ssi_supplement_amount
          - calculations.ssi_supplement_amount.constants.RESOURCE_LIMIT_CENTS
          - entities.SSISupplement.fields.status
        distinguishing_aspect: |
          Numeric threshold boundary on countable_resources_cents: STRICT >
          200000 (= $2,000) makes claimant ineligible. At exactly 200000:
          eligible (status=ACTIVE); at 200001: ineligible
          (status=INELIGIBLE_RESOURCES). Reachable via POST /claimants then
          the medical-decision cascade.
