              payload: { legal_name: "XSeller", seller_state: "TX", seller_type: "LLC" }
              as: PlatformAdmin
              captures: { s_id: $.data.id }
            - call: "POST /marketplace/buyers"
              payload: { legal_name: "XBuyer", buyer_state: "TX", entity_type: "LLC", proof_of_funds_cents: 100000000 }
