# =============================================================================
# SCAFFOLD_CORNER_DESIGN.yaml — §1.9 Coverage Index for Non-Difficulty Tests
# Corporate Actions Processing — breadth probe over §1.1–§1.7 claims
# =============================================================================
scaffold_corner_design:
  # ---------------------------------------------------------------------------
  - section: entities
    instances:
      - name: security_creation_defaults_status_active
        claim_type: creation
        grounds: [entities.Security.fields.status]
        distinguishing_aspect: "A security created with only ticker/cusip/name starts ACTIVE at version 1 with a server-minted UUID id."
        test_recipe:
          setup: ["empty database"]
          setup_api_calls: []
          trigger:
            - { call: "POST /api/securities", payload: { ticker: "ACME", cusip: "CUSPA00001", name: "Acme Corp" }, as: DeskAdministrator, captures: { sec_id: $.data.id, sec_status: $.data.status, sec_v: $.data.version } }
          assert:
            - "Security.${sec_id}.status == ACTIVE (default applied)"
            - "version == 1; id is a bare UUID; created_at/updated_at present"

      - name: account_opening_cash_defaults_to_zero
        claim_type: defaults
        grounds: [entities.Account.fields.opening_cash_cents, entities.Account.fields.cash_balance_cents]
        distinguishing_aspect: "Omitting opening_cash_cents initializes cash_balance_cents to 0, total_cost_basis_cents to 0, pending_entitlement_count to 0."
        test_recipe:
          setup: ["empty database"]
          setup_api_calls: []
          trigger:
            - { call: "POST /api/accounts", payload: { account_number: "A-9", holder_name: "Nine" }, as: DeskAdministrator, captures: { a_id: $.data.id, a_cash: $.data.cash_balance_cents } }
          assert:
            - "Account.${a_id}.cash_balance_cents == 0 (default opening_cash_cents == 0)"
            - "total_cost_basis_cents == 0 AND pending_entitlement_count == 0 AND status == ACTIVE"

      - name: account_computed_cash_input_ignored
        claim_type: computed_fields
        grounds: [entities.Account.fields.cash_balance_cents]
        distinguishing_aspect: "cash_balance_cents is computed: a client-supplied value in the create body is ignored, not stored."
        test_recipe:
          setup: ["empty database"]
          setup_api_calls: []
          trigger:
            - { call: "POST /api/accounts", payload: { account_number: "A-10", holder_name: "Ten", cash_balance_cents: 999999 }, as: DeskAdministrator, captures: { a_cash: $.data.cash_balance_cents } }
          assert:
            - "Response cash_balance_cents == 0 — client-supplied 999999 ignored (computed field)"

      - name: position_lot_zero_quantity_rejected
        claim_type: type_constraints
        grounds: [entities.PositionLot.fields.quantity, "errors[ERR_LOT_QUANTITY_INVALID]", "validations[priority=3]"]
        distinguishing_aspect: "quantity must be > 0: zero is rejected with ERR_LOT_QUANTITY_INVALID (400)."
        test_recipe:
          setup: ["security and account exist"]
          setup_api_calls:
            - { call: "POST /api/securities", payload: { ticker: "ACME", cusip: "CUSPA00002", name: "Acme Corp" }, as: DeskAdministrator, captures: { sec_id: $.data.id } }
            - { call: "POST /api/accounts", payload: { account_number: "A-1", holder_name: "One" }, as: DeskAdministrator, captures: { a1: $.data.id } }
          trigger:
            - { call: "POST /api/position-lots", payload: { account_id: "${a1}", security_id: "${sec_id}", quantity: 0, acquisition_date: "2026-04-01", cost_basis_total_cents: 100 }, as: DeskAdministrator, captures: { err: $.data.error_id } }
          assert:
            - "error_id == ERR_LOT_QUANTITY_INVALID (400)"

      - name: event_get_nonexistent_returns_404
        claim_type: not_found
        grounds: ["errors[ERR_EVENT_NOT_FOUND]", response_envelope]
        distinguishing_aspect: "GET on a random UUID yields the standard error envelope with error_id ERR_EVENT_NOT_FOUND (404)."
        test_recipe:
          setup: ["empty database"]
          setup_api_calls: []
          trigger:
            - { call: "GET /api/events/11111111-2222-3333-4444-555555555555", payload: {}, as: DeskAdministrator, captures: { err: $.data.error_id } }
          assert:
            - "error_id == ERR_EVENT_NOT_FOUND; envelope has response_type == 'error' and meta.api_request_id present"

      - name: securities_list_pagination_envelope
        claim_type: listing
        grounds: [response_envelope]
        distinguishing_aspect: "limit=1 over 2 securities returns exactly 1 row with total_count == 2 and has_more == true; offset=1 returns the second."
        test_recipe:
          setup: ["two securities exist"]
          setup_api_calls:
            - { call: "POST /api/securities", payload: { ticker: "ACME", cusip: "CUSPA00003", name: "Acme Corp" }, as: DeskAdministrator }
            - { call: "POST /api/securities", payload: { ticker: "BRAVO", cusip: "CUSPA00004", name: "Bravo Inc" }, as: DeskAdministrator }
          trigger:
            - { call: "GET /api/securities?limit=1&offset=0", payload: {}, as: DeskAdministrator }
            - { call: "GET /api/securities?limit=1&offset=1", payload: {}, as: DeskAdministrator }
          assert:
            - "Page 1: data length == 1, total_count == 2, has_more == true, limit == 1, offset == 0"
            - "Page 2: data length == 1, has_more == false; the two pages return different tickers"

      - name: source_notification_immutable_no_version
        claim_type: immutability
        grounds: [entities.SourceNotification]
        distinguishing_aspect: "common_fields:false — the create response carries id and created_at but NO version and NO updated_at."
        test_recipe:
          setup: ["security and source exist"]
          setup_api_calls:
            - { call: "POST /api/securities", payload: { ticker: "ACME", cusip: "CUSPA00005", name: "Acme Corp" }, as: DeskAdministrator, captures: { sec_id: $.data.id } }
            - { call: "POST /api/event-sources", payload: { name: "Vendor Alpha", source_type: "VENDOR", reliability_weight: 10 }, as: DeskAdministrator, captures: { s1: $.data.id } }
          trigger:
            - { call: "POST /api/source-notifications", payload: { source_id: "${s1}", security_id: "${sec_id}", event_type: "SPLIT", record_date: "2026-05-15", announced_terms: { ratio_num: 2, ratio_den: 1, price_per_share_cents: 3333, fractional_policy: "ROUND_HALF_UP" } }, as: VendorFeed, captures: { n_id: $.data.id, n_status: $.data.status } }
          assert:
            - "SourceNotification.${n_id} has id + created_at, status == RECEIVED, and no version/updated_at keys"

  # ---------------------------------------------------------------------------
  - section: state_machines
    instances:
      - name: event_created_in_draft_initial_state
        claim_type: initial_state
        grounds: [state_machines.CorporateActionEvent]
        distinguishing_aspect: "A scrubbed event starts in DRAFT with compensation_pool_remaining_cents == compensation_pool_cents and scrubbed_by_user_id recorded."
        test_recipe:
          setup: ["security ACME; two vendor sources; two matching notifications"]
          setup_api_calls:
            - { call: "POST /api/securities", payload: { ticker: "ACME", cusip: "CUSPB00001", name: "Acme Corp" }, as: DeskAdministrator, captures: { sec_id: $.data.id } }
            - { call: "POST /api/event-sources", payload: { name: "Vendor Alpha", source_type: "VENDOR", reliability_weight: 10 }, as: DeskAdministrator, captures: { s1: $.data.id } }
            - { call: "POST /api/event-sources", payload: { name: "Vendor Beta", source_type: "VENDOR", reliability_weight: 5 }, as: DeskAdministrator, captures: { s2: $.data.id } }
            - { call: "POST /api/source-notifications", payload: { source_id: "${s1}", security_id: "${sec_id}", event_type: "SPLIT", record_date: "2026-05-15", announced_terms: { ratio_num: 2, ratio_den: 1, price_per_share_cents: 3333, fractional_policy: "ROUND_HALF_UP" } }, as: VendorFeed, captures: { n1: $.data.id } }
            - { call: "POST /api/source-notifications", payload: { source_id: "${s2}", security_id: "${sec_id}", event_type: "SPLIT", record_date: "2026-05-15", announced_terms: { ratio_num: 2, ratio_den: 1, price_per_share_cents: 3333, fractional_policy: "ROUND_HALF_UP" } }, as: VendorFeed, captures: { n2: $.data.id } }
          trigger:
            - call: "POST /api/events"
              payload: { security_id: "${sec_id}", event_type: "SPLIT", terms: { ratio_num: 2, ratio_den: 1, price_per_share_cents: 3333, fractional_policy: "ROUND_HALF_UP" }, record_date: "2026-05-15", payable_date: "2026-05-29", source_notification_ids: ["${n1}", "${n2}"], compensation_pool_cents: 100000 }
              as: EventAnalyst
              as_user_id: "analyst-1"
              captures: { ev_id: $.data.id, ev_status: $.data.status, ev_pool: $.data.compensation_pool_remaining_cents, ev_scrub: $.data.scrubbed_by_user_id }
          assert:
            - "CorporateActionEvent.${ev_id}.status == DRAFT (initial state)"
            - "compensation_pool_remaining_cents == 100000; scrubbed_by_user_id == 'analyst-1'"
            - "Notifications ${n1} and ${n2} are now MATCHED (GET /api/source-notifications/${n1})"

      - name: book_from_draft_rejected
        claim_type: invalid_transition
        grounds: [state_machines.CorporateActionEvent.CONFIRMED_to_BOOKED, "errors[ERR_EVENT_NOT_CONFIRMED]"]
        distinguishing_aspect: "book requires CONFIRMED: from DRAFT it fails with ERR_EVENT_NOT_CONFIRMED and no Booking is created."
        test_recipe:
          setup: ["DRAFT SPLIT event on ACME (scrubbed, never confirmed)"]
          setup_api_calls:
            - { call: "POST /api/securities", payload: { ticker: "ACME", cusip: "CUSPB00002", name: "Acme Corp" }, as: DeskAdministrator, captures: { sec_id: $.data.id } }
            - { call: "POST /api/event-sources", payload: { name: "Vendor Alpha", source_type: "VENDOR", reliability_weight: 10 }, as: DeskAdministrator, captures: { s1: $.data.id } }
            - { call: "POST /api/event-sources", payload: { name: "Vendor Beta", source_type: "VENDOR", reliability_weight: 5 }, as: DeskAdministrator, captures: { s2: $.data.id } }
            - { call: "POST /api/source-notifications", payload: { source_id: "${s1}", security_id: "${sec_id}", event_type: "SPLIT", record_date: "2026-05-15", announced_terms: { ratio_num: 2, ratio_den: 1, price_per_share_cents: 3333, fractional_policy: "ROUND_HALF_UP" } }, as: VendorFeed, captures: { n1: $.data.id } }
            - { call: "POST /api/source-notifications", payload: { source_id: "${s2}", security_id: "${sec_id}", event_type: "SPLIT", record_date: "2026-05-15", announced_terms: { ratio_num: 2, ratio_den: 1, price_per_share_cents: 3333, fractional_policy: "ROUND_HALF_UP" } }, as: VendorFeed, captures: { n2: $.data.id } }
            - call: "POST /api/events"
              payload: { security_id: "${sec_id}", event_type: "SPLIT", terms: { ratio_num: 2, ratio_den: 1, price_per_share_cents: 3333, fractional_policy: "ROUND_HALF_UP" }, record_date: "2026-05-15", payable_date: "2026-05-29", source_notification_ids: ["${n1}", "${n2}"] }
              as: EventAnalyst
              as_user_id: "analyst-1"
              captures: { ev_id: $.data.id }
          trigger:
            - { call: "POST /api/events/${ev_id}/book", payload: {}, as: OperationsManager, captures: { err: $.data.error_id } }
          assert:
            - "error_id == ERR_EVENT_NOT_CONFIRMED (409); GET /api/events/${ev_id}/bookings returns total_count == 0"

      - name: amend_draft_event_rejected
        claim_type: invalid_transition
        grounds: [state_machines.CorporateActionEvent.CONFIRMED_to_AMENDED, "errors[ERR_EVENT_NOT_AMENDABLE]"]
        distinguishing_aspect: "amend requires CONFIRMED: from DRAFT it fails with ERR_EVENT_NOT_AMENDABLE before the OCC version check is even consulted."
        test_recipe:
          setup: ["DRAFT SPLIT event on ACME"]
          setup_api_calls:
            - { call: "POST /api/securities", payload: { ticker: "ACME", cusip: "CUSPB00003", name: "Acme Corp" }, as: DeskAdministrator, captures: { sec_id: $.data.id } }
            - { call: "POST /api/event-sources", payload: { name: "Vendor Alpha", source_type: "VENDOR", reliability_weight: 10 }, as: DeskAdministrator, captures: { s1: $.data.id } }
            - { call: "POST /api/event-sources", payload: { name: "Vendor Beta", source_type: "VENDOR", reliability_weight: 5 }, as: DeskAdministrator, captures: { s2: $.data.id } }
            - { call: "POST /api/source-notifications", payload: { source_id: "${s1}", security_id: "${sec_id}", event_type: "SPLIT", record_date: "2026-05-15", announced_terms: { ratio_num: 2, ratio_den: 1, price_per_share_cents: 3333, fractional_policy: "ROUND_HALF_UP" } }, as: VendorFeed, captures: { n1: $.data.id } }
            - { call: "POST /api/source-notifications", payload: { source_id: "${s2}", security_id: "${sec_id}", event_type: "SPLIT", record_date: "2026-05-15", announced_terms: { ratio_num: 2, ratio_den: 1, price_per_share_cents: 3333, fractional_policy: "ROUND_HALF_UP" } }, as: VendorFeed, captures: { n2: $.data.id } }
            - call: "POST /api/events"
              payload: { security_id: "${sec_id}", event_type: "SPLIT", terms: { ratio_num: 2, ratio_den: 1, price_per_share_cents: 3333, fractional_policy: "ROUND_HALF_UP" }, record_date: "2026-05-15", payable_date: "2026-05-29", source_notification_ids: ["${n1}", "${n2}"] }
              as: EventAnalyst
              as_user_id: "analyst-1"
              captures: { ev_id: $.data.id, ev_v: $.data.version }
          trigger:
            - { call: "POST /api/events/${ev_id}/amendments", payload: { amended_terms: { ratio_num: 3, ratio_den: 1, price_per_share_cents: 3333, fractional_policy: "ROUND_HALF_UP" }, reason: "early", expected_event_version: "${ev_v}" }, as: EventAnalyst, as_user_id: "analyst-1", captures: { err: $.data.error_id } }
          assert:
            - "error_id == ERR_EVENT_NOT_AMENDABLE (409); event still DRAFT at version ${ev_v}"

      - name: confirm_cancelled_event_rejected
        claim_type: terminal_state_lockdown
        grounds: [state_machines.CorporateActionEvent.DRAFT_to_CANCELLED, "errors[ERR_EVENT_ALREADY_TERMINAL]"]
        distinguishing_aspect: "CANCELLED is terminal: confirm afterwards fails with ERR_EVENT_ALREADY_TERMINAL."
        test_recipe:
          setup: ["DRAFT SPLIT event, then cancelled by the scrubbing analyst"]
          setup_api_calls:
            - { call: "POST /api/securities", payload: { ticker: "ACME", cusip: "CUSPB00004", name: "Acme Corp" }, as: DeskAdministrator, captures: { sec_id: $.data.id } }
            - { call: "POST /api/event-sources", payload: { name: "Vendor Alpha", source_type: "VENDOR", reliability_weight: 10 }, as: DeskAdministrator, captures: { s1: $.data.id } }
            - { call: "POST /api/event-sources", payload: { name: "Vendor Beta", source_type: "VENDOR", reliability_weight: 5 }, as: DeskAdministrator, captures: { s2: $.data.id } }
            - { call: "POST /api/source-notifications", payload: { source_id: "${s1}", security_id: "${sec_id}", event_type: "SPLIT", record_date: "2026-05-15", announced_terms: { ratio_num: 2, ratio_den: 1, price_per_share_cents: 3333, fractional_policy: "ROUND_HALF_UP" } }, as: VendorFeed, captures: { n1: $.data.id } }
            - { call: "POST /api/source-notifications", payload: { source_id: "${s2}", security_id: "${sec_id}", event_type: "SPLIT", record_date: "2026-05-15", announced_terms: { ratio_num: 2, ratio_den: 1, price_per_share_cents: 3333, fractional_policy: "ROUND_HALF_UP" } }, as: VendorFeed, captures: { n2: $.data.id } }
            - call: "POST /api/events"
              payload: { security_id: "${sec_id}", event_type: "SPLIT", terms: { ratio_num: 2, ratio_den: 1, price_per_share_cents: 3333, fractional_policy: "ROUND_HALF_UP" }, record_date: "2026-05-15", payable_date: "2026-05-29", source_notification_ids: ["${n1}", "${n2}"] }
              as: EventAnalyst
              as_user_id: "analyst-1"
              captures: { ev_id: $.data.id }
            - { call: "POST /api/events/${ev_id}/cancel", payload: {}, as: EventAnalyst, as_user_id: "analyst-1", captures: { ev_cx: $.data.status } }
          trigger:
            - { call: "POST /api/events/${ev_id}/confirm", payload: {}, as: EventAnalyst, as_user_id: "analyst-2", captures: { err: $.data.error_id } }
          assert:
            - "Event was CANCELLED (captured ${ev_cx}); confirm now fails with ERR_EVENT_ALREADY_TERMINAL (409)"

      - name: complete_from_confirmed_rejected
        claim_type: invalid_transition
        grounds: [state_machines.CorporateActionEvent.BOOKED_to_COMPLETED, "errors[ERR_EVENT_NOT_BOOKED]"]
        distinguishing_aspect: "complete requires BOOKED: from CONFIRMED it fails with ERR_EVENT_NOT_BOOKED."
        test_recipe:
          setup: ["SPLIT event CONFIRMED (no capture, no book)"]
          setup_api_calls:
            - { call: "POST /api/securities", payload: { ticker: "ACME", cusip: "CUSPB00005", name: "Acme Corp" }, as: DeskAdministrator, captures: { sec_id: $.data.id } }
            - { call: "POST /api/event-sources", payload: { name: "Vendor Alpha", source_type: "VENDOR", reliability_weight: 10 }, as: DeskAdministrator, captures: { s1: $.data.id } }
            - { call: "POST /api/event-sources", payload: { name: "Vendor Beta", source_type: "VENDOR", reliability_weight: 5 }, as: DeskAdministrator, captures: { s2: $.data.id } }
            - { call: "POST /api/source-notifications", payload: { source_id: "${s1}", security_id: "${sec_id}", event_type: "SPLIT", record_date: "2026-05-15", announced_terms: { ratio_num: 2, ratio_den: 1, price_per_share_cents: 3333, fractional_policy: "ROUND_HALF_UP" } }, as: VendorFeed, captures: { n1: $.data.id } }
            - { call: "POST /api/source-notifications", payload: { source_id: "${s2}", security_id: "${sec_id}", event_type: "SPLIT", record_date: "2026-05-15", announced_terms: { ratio_num: 2, ratio_den: 1, price_per_share_cents: 3333, fractional_policy: "ROUND_HALF_UP" } }, as: VendorFeed, captures: { n2: $.data.id } }
            - call: "POST /api/events"
              payload: { security_id: "${sec_id}", event_type: "SPLIT", terms: { ratio_num: 2, ratio_den: 1, price_per_share_cents: 3333, fractional_policy: "ROUND_HALF_UP" }, record_date: "2026-05-15", payable_date: "2026-05-29", source_notification_ids: ["${n1}", "${n2}"] }
              as: EventAnalyst
              as_user_id: "analyst-1"
              captures: { ev_id: $.data.id }
            - { call: "POST /api/events/${ev_id}/confirm", payload: {}, as: EventAnalyst, as_user_id: "analyst-2" }
          trigger:
            - { call: "POST /api/events/${ev_id}/complete", payload: {}, as: OperationsManager, captures: { err: $.data.error_id } }
          assert:
            - "error_id == ERR_EVENT_NOT_BOOKED (409); event remains CONFIRMED"

      - name: withdraw_void_election_rejected
        claim_type: invalid_transition
        grounds: [state_machines.Election.SUBMITTED_to_WITHDRAWN, "errors[ERR_ELECTION_INVALID_STATE]"]
        distinguishing_aspect: "withdraw requires SUBMITTED: an election VOIDs by event cancellation rejects withdraw with ERR_ELECTION_INVALID_STATE."
        test_recipe:
          setup:
            - "ACME + NEWCO; account A1 (10 sh); MERGER event CONFIRMED; A1 election SUBMITTED; then event CANCELLED (election -> VOID)"
          setup_api_calls:
            - { call: "POST /api/securities", payload: { ticker: "ACME", cusip: "CUSPB00006", name: "Acme Corp" }, as: DeskAdministrator, captures: { sec_id: $.data.id } }
            - { call: "POST /api/securities", payload: { ticker: "NWC", cusip: "CUSPB00007", name: "Newco Inc" }, as: DeskAdministrator, captures: { newco_id: $.data.id } }
            - { call: "POST /api/accounts", payload: { account_number: "A-1", holder_name: "One" }, as: DeskAdministrator, captures: { a1: $.data.id } }
            - { call: "POST /api/position-lots", payload: { account_id: "${a1}", security_id: "${sec_id}", quantity: 10, acquisition_date: "2026-04-01", cost_basis_total_cents: 50000 }, as: DeskAdministrator }
            - { call: "POST /api/event-sources", payload: { name: "Vendor Alpha", source_type: "VENDOR", reliability_weight: 10 }, as: DeskAdministrator, captures: { s1: $.data.id } }
            - { call: "POST /api/event-sources", payload: { name: "Vendor Beta", source_type: "VENDOR", reliability_weight: 5 }, as: DeskAdministrator, captures: { s2: $.data.id } }
            - { call: "POST /api/source-notifications", payload: { source_id: "${s1}", security_id: "${sec_id}", event_type: "MERGER", record_date: "2026-05-15", announced_terms: { cash_per_share_cents: 5000, cash_pool_cents: 900000, new_security_id: "${newco_id}", ratio_num: 1, ratio_den: 1, default_option: "STOCK" } }, as: VendorFeed, captures: { n1: $.data.id } }
            - { call: "POST /api/source-notifications", payload: { source_id: "${s2}", security_id: "${sec_id}", event_type: "MERGER", record_date: "2026-05-15", announced_terms: { cash_per_share_cents: 5000, cash_pool_cents: 900000, new_security_id: "${newco_id}", ratio_num: 1, ratio_den: 1, default_option: "STOCK" } }, as: VendorFeed, captures: { n2: $.data.id } }
            - call: "POST /api/events"
              payload: { security_id: "${sec_id}", event_type: "MERGER", election_required: true, election_deadline: "2026-05-20T16:00:00Z", terms: { cash_per_share_cents: 5000, cash_pool_cents: 900000, new_security_id: "${newco_id}", ratio_num: 1, ratio_den: 1, default_option: "STOCK" }, record_date: "2026-05-15", payable_date: "2026-05-29", source_notification_ids: ["${n1}", "${n2}"] }
              as: EventAnalyst
              as_user_id: "analyst-1"
              captures: { ev_id: $.data.id }
            - { call: "POST /api/events/${ev_id}/confirm", payload: {}, as: EventAnalyst, as_user_id: "analyst-2", captures: { ev_v: $.data.version } }
            - { call: "POST /api/events/${ev_id}/elections", payload: { account_id: "${a1}", option_code: "CASH", expected_event_version: "${ev_v}" }, as: AccountHolder, as_user_id: "${a1}", captures: { el_id: $.data.id } }
            - { call: "POST /api/events/${ev_id}/cancel", payload: {}, as: EventAnalyst, as_user_id: "analyst-1" }
            - { call: "GET /api/elections/${el_id}", payload: {}, as: OperationsManager, captures: { el_status: $.data.status } }
          trigger:
            - { call: "POST /api/elections/${el_id}/withdraw", payload: {}, as: AccountHolder, as_user_id: "${a1}", captures: { err: $.data.error_id } }
          assert:
            - "Election.${el_id} became VOID on event cancel (captured ${el_status})"
            - "withdraw now fails with ERR_ELECTION_INVALID_STATE (409)"

      - name: decide_twice_rejected
        claim_type: invalid_transition
        grounds: [state_machines.Claim.FILED_to_APPROVED, "errors[ERR_CLAIM_NOT_FILED]"]
        distinguishing_aspect: "decide requires review_status FILED: a second decide on an APPROVED claim fails with ERR_CLAIM_NOT_FILED."
        test_recipe:
          setup:
            - "ACME SPLIT 2:1 (price 5000) BOOKED with account A1 FROZEN (entitlement MISSED); claim filed at 2026-06-01 and APPROVED by examiner-1"
          setup_api_calls:
            - { call: "POST /api/securities", payload: { ticker: "ACME", cusip: "CUSPB00008", name: "Acme Corp" }, as: DeskAdministrator, captures: { sec_id: $.data.id } }
            - { call: "POST /api/accounts", payload: { account_number: "A-1", holder_name: "One" }, as: DeskAdministrator, captures: { a1: $.data.id } }
            - { call: "POST /api/position-lots", payload: { account_id: "${a1}", security_id: "${sec_id}", quantity: 5, acquisition_date: "2026-04-01", cost_basis_total_cents: 25000 }, as: DeskAdministrator }
