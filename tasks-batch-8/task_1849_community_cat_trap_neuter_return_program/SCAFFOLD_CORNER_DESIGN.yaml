- section: calculations
  instances:
  - name: voucher_reimbursement_variants
    claim_type: variant_divergence
    grounds:
    - calculations.voucher_reimbursement_amount
    excluded_because:
      difficulty_instance: dual_variant_calc / voucher_reimbursement_municipal_vs_donation
      rationale: Both funding-source variants asserted with literal reimbursement values in the named §1.8 instance.
  - name: clinic_capacity_branching
    claim_type: correct_result
    grounds:
    - calculations.clinic_day_effective_capacity
    excluded_because:
      difficulty_instance: combinatorial_formula / clinic_capacity_kitten_season_branching
      rationale: Surge-slot admission and adult exclusion both asserted there.
- section: state_machines
  instances:
  - name: foster_loop_cycle
    claim_type: valid_transition
    grounds:
    - state_machines.Cat.IN_FOSTER_to_POST_SURGERY
    excluded_because:
      difficulty_instance: non_linear_state_machine / cat_foster_loop_cycle
      rationale: Cycle completion, pathway reset, and foster counter compensation all asserted there.
  - name: surgery_cascade_chain
    claim_type: side_effect_execution
    grounds:
    - state_machines.Cat.AT_CLINIC_to_POST_SURGERY
    excluded_because:
      difficulty_instance: transitive_cascade / surgery_completion_four_hop_cascade
      rationale: All four cascade hops asserted with exact end states there.
  - name: noshow_sweep_chain
    claim_type: side_effect_execution
    grounds:
    - state_machines.ClinicDay.SCHEDULED_to_COMPLETED
    excluded_because:
      difficulty_instance: transitive_cascade / clinic_day_close_noshow_cascade
      rationale: No-show sweep's slot/voucher/cat end states asserted there.
