          GATED is derived from a count on a DIFFERENT entity - one OPEN MAJOR ReviewComment - and its
          blast radius is exactly three endpoints: POST /submittals and POST /acceptance-tests are 409
          while POST /hazard-areas on the very same project is 201, because the designer must still be
