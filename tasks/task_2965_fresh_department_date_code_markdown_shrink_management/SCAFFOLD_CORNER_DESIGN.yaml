      - name: audit_and_finding_gates_from_window_to_closure
        claim_type: violation_to_error
        grounds:
          - validations[priority 12]
          - validations[priority 37]
          - validations[priority 38]
          - errors[ERR_AUDIT_WINDOW_NOT_OPEN]
          - errors[ERR_AUDIT_ALREADY_SWEPT]
          - errors[ERR_ESCALATION_NOT_WARRANTED]
          - errors[ERR_REMEDIATION_NOT_PERMITTED]
          - errors[ERR_FINDING_ALREADY_RESOLVED]
        distinguishing_aspect: |
          Five gates on one audit: sweeping before window_start_at is
          ERR_AUDIT_WINDOW_NOT_OPEN (409), sweeping twice is ERR_AUDIT_ALREADY_SWEPT (409),
          escalating a MINOR audit is ERR_ESCALATION_NOT_WARRANTED (422), remediating with neither
          field and remediating WITHDRAWN on a lot that no longer holds units are both
          ERR_REMEDIATION_NOT_PERMITTED (422), and closing a WAIVED finding again is
          ERR_FINDING_ALREADY_RESOLVED (409).
        test_recipe:
          setup:
