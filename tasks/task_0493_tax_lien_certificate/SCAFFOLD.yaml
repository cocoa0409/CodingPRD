# =============================================================================
# Tax Lien Certificate Sale & Redemption — benchmark seed tables (Expert tier)
# =============================================================================

scenario: "Tax Lien Certificate Sale & Redemption: delinquent parcel & list, auction (bid-down rate/premium), certificate issuance & investor, redemption (interest accrual) & payoff, subsequent-tax (sub-tax) add, foreclosure/deed application after period, surplus/overage, assignment/transfer"

domain_name: tax-lien-certificate
api_prefix: /counties

complexity_profile:
  primary_archetype: compliance_audit
  secondary_archetype: ledger_reconciliation
  complexity_layers:
    - optimistic_concurrency
    - cascading_side_effects
    - dual_variant_calculation
    - rate_threshold_triggers
    - scheduled_deferred_actions
    - derived_field_reconciliation

  entity_topology: hybrid
  # County is a configuration root; Parcel/Investor are flat peers referenced by FK;
  # TaxSale -> SaleListing -> Bid form a tree; Certificate is a cross-aggregate hub
  # referenced by SubsequentTax, Redemption, Assignment, DeedApplication, SurplusDistribution.

  state_machine_shape: compound
  # Parcel posture (DELINQUENT/ON_SALE/LIENED/REDEEMED/DEEDED) is derived from its certificate;
  # SaleListing branches (SOLD / STRUCK_OFF / WITHDRAWN); Certificate has the rich lifecycle with
  # an ACTIVE<->FORECLOSURE_PENDING revision-style loop and branch into REDEEMED vs DEEDED.

  relationship_patterns:
    - one_to_many       # County -> Parcels, TaxSale -> SaleListings, Certificate -> SubsequentTax
    - cross_aggregate   # Certificate referenced from many satellites across aggregate boundaries
    - self_referential  # Assignment chains the holder; Certificate.assignment_seq tracks transfer depth

  role_model: segregation_of_duties
  # CountyTreasurer runs sales, issues certificates, processes redemptions, approves deeds.
  # Investor bids, holds certificates, adds sub-tax, applies for deed, accepts assignments.
  # An Investor may NOT also act as the Treasurer who awards their own lot (SoD on award).
  # Auditor is read-only.

  consistency_model: immediate

# =============================================================================
# Table 1.0: Response Envelope (FIXED — verbatim)
# =============================================================================
response_envelope:
  success: |
    { "meta": { "api_request_id": "req_xxx", "api_request_timestamp": "ISO8601" },
      "response_type": "object" | "array", "data": {} }
  error: |
    { "meta": { ... }, "response_type": "error",
      "data": { "error_id": "ERR_XXX", "message": "..." } }
  pagination_fields: ["limit", "offset", "total_count", "has_more"]
  pagination_defaults: { limit: 10, min: 1, max: 100, offset: 0 }

# =============================================================================
# Table 1.1: Entity-Relationship Table
# =============================================================================
entities:
  - name: County
    parent: null
    common_fields: true
    fields:
      - { name: name, type: string, source: input, description: "County name" }
      - { name: state_code, type: string, source: input, description: "Two-letter US state code (e.g. AZ, FL)" }
      - { name: max_interest_rate_bps, type: integer, source: input, description: "Statutory maximum annual interest rate in basis points used as the auction starting (ceiling) rate, e.g. 1600 = 16.00%", constraints: "1 <= max_interest_rate_bps <= 5000" }
      - { name: bid_down_increment_bps, type: integer, source: input, description: "Minimum bid-down step in basis points for RATE_BID_DOWN sales, e.g. 25 = 0.25%", constraints: ">= 1; max_interest_rate_bps must be an integer multiple of this" }
      - { name: redemption_period_days, type: integer, source: input, description: "Days from certificate issuance during which the owner may redeem before a deed application is allowed", constraints: ">= 1" }
      - { name: penalty_rate_bps, type: integer, source: input, description: "Flat mandatory minimum penalty applied to base tax at redemption regardless of elapsed time, in basis points, e.g. 500 = 5%", default: 0, constraints: ">= 0" }
      - { name: sub_tax_interest_rate_bps, type: integer, source: input, description: "Fixed annual interest rate in basis points applied to subsequent-tax principal (often the statutory ceiling, independent of the winning bid rate)", constraints: "1 <= sub_tax_interest_rate_bps <= 5000" }
      - { name: premium_bidding_enabled, type: boolean, source: input, description: "When true the county uses PREMIUM auctions (highest cash premium wins, fixed rate); when false it uses RATE_BID_DOWN auctions", default: false }
      - { name: premium_earns_interest, type: boolean, source: input, description: "Whether overbid premium is returned to the holder with interest at redemption (true) or forfeited (false)", default: false }
      - { name: day_count_basis, type: integer, source: input, description: "Days-in-year divisor for simple-interest accrual (e.g. 360 or 365)", default: 365, constraints: "day_count_basis IN {360, 365}" }

  - name: Parcel
    parent: null
    common_fields: true
    fields:
      - { name: county_id, type: string, source: input, description: "FK -> County.id" }
      - { name: apn, type: string, source: input, description: "Assessor's parcel number; unique within a county" }
      - { name: owner_name, type: string, source: input, description: "Record owner name" }
      - { name: assessed_value_cents, type: integer, source: input, description: "Assessed value in cents, used for surplus eligibility checks", constraints: ">= 0" }
      - { name: base_tax_due_cents, type: integer, source: input, description: "Original delinquent tax principal (face amount of the lien) in cents", constraints: ">= 1" }
      - { name: status, type: enum, source: system, description: "DELINQUENT | ON_SALE | LIENED | REDEEMED | DEEDED — derived parcel posture driven by its certificate", default: DELINQUENT, constraints: "DELINQUENT | ON_SALE | LIENED | REDEEMED | DEEDED" }
      - { name: active_certificate_id, type: string, source: computed, description: "Id of the current non-terminal Certificate on this parcel, or null", default: null }

  - name: Investor
    parent: null
    common_fields: true
    fields:
      - { name: legal_name, type: string, source: input, description: "Investor legal name" }
      - { name: tax_id, type: string, source: input, description: "Investor tax identifier; unique across investors" }
      - { name: escrow_balance_cents, type: integer, source: computed, description: "Available escrow = deposits minus active PLACED-bid holds minus committed winning awards/sub-tax outlays/deed costs plus released holds and redemption/lien receipts. A PLACED bid reduces this by its hold; LOST/REFUNDED credit the hold back; WON converts the hold to a permanent commit (no further change). See calculations.investor_escrow.", default: 0 }
      - { name: deposit_total_cents, type: integer, source: computed, description: "Cumulative deposits made by this investor in cents", default: 0 }
      - { name: registered, type: boolean, source: system, description: "Whether the investor has completed registration (escrow funded at least once)", default: false }

  - name: TaxSale
    parent: County
    common_fields: true
    fields:
      - { name: county_id, type: string, source: input, description: "FK -> County.id" }
      - { name: sale_name, type: string, source: input, description: "Human label for the sale event" }
      - { name: sale_type, type: enum, source: system, description: "RATE_BID_DOWN | PREMIUM — fixed at creation from the county's premium_bidding_enabled flag", constraints: "RATE_BID_DOWN | PREMIUM" }
      - { name: scheduled_at, type: datetime, source: input, description: "Logical-clock instant at/after which the sale may open" }
      - { name: status, type: enum, source: system, description: "DRAFT | OPEN | CLOSED | SETTLED", default: DRAFT, constraints: "DRAFT | OPEN | CLOSED | SETTLED" }
      - { name: listing_count, type: integer, source: computed, description: "Number of SaleListings attached to this sale", default: 0 }

  - name: SaleListing
    parent: TaxSale
    common_fields: true
    fields:
      - { name: sale_id, type: string, source: input, description: "FK -> TaxSale.id" }
      - { name: parcel_id, type: string, source: input, description: "FK -> Parcel.id" }
      - { name: opening_rate_bps, type: integer, source: system, description: "Starting auction rate in bps for a RATE_BID_DOWN listing, copied from County.max_interest_rate_bps at listing time" }
      - { name: status, type: enum, source: system, description: "LISTED | SOLD | STRUCK_OFF | WITHDRAWN", default: LISTED, constraints: "LISTED | SOLD | STRUCK_OFF | WITHDRAWN" }
      - { name: winning_bid_id, type: string, source: computed, description: "FK -> Bid.id; the awarded bid, set on award", default: null }
      - { name: certificate_id, type: string, source: computed, description: "FK -> Certificate.id; the certificate issued from this listing, set on award", default: null }

  - name: Bid
    parent: SaleListing
    common_fields: true
    fields:
      - { name: listing_id, type: string, source: input, description: "FK -> SaleListing.id" }
      - { name: investor_id, type: string, source: input, description: "FK -> Investor.id" }
      - { name: rate_bps, type: integer, source: input, description: "For RATE_BID_DOWN: the annual rate the investor is willing to accept, in bps, <= opening_rate_bps and a multiple of bid_down_increment_bps. Ignored for PREMIUM sales.", default: null }
      - { name: premium_cents, type: integer, source: input, description: "For PREMIUM: cash overbid above face the investor offers, in cents. Ignored for RATE_BID_DOWN sales.", default: 0 }
      - { name: status, type: enum, source: system, description: "PLACED | WON | LOST | REFUNDED", default: PLACED, constraints: "PLACED | WON | LOST | REFUNDED" }

  - name: Certificate
    parent: null
    common_fields: true
    fields:
      - { name: county_id, type: string, source: input, description: "FK -> County.id" }
      - { name: parcel_id, type: string, source: input, description: "FK -> Parcel.id" }
      - { name: listing_id, type: string, source: input, description: "FK -> SaleListing.id" }
      - { name: holder_investor_id, type: string, source: input, description: "FK -> Investor.id; current certificate holder (changes on assignment)" }
      - { name: face_amount_cents, type: integer, source: system, description: "Lien face = parcel.base_tax_due_cents at issuance", constraints: ">= 1" }
      - { name: rate_bps, type: integer, source: system, description: "Awarded annual interest rate in bps applied to face + sub-tax (the winning bid's rate, or county max for PREMIUM)" }
      - { name: premium_cents, type: integer, source: system, description: "Overbid premium paid at award, in cents", default: 0 }
      - { name: issued_at, type: datetime, source: system, description: "Logical-clock instant of issuance; interest accrues from here" }
      - { name: redeem_deadline_at, type: datetime, source: system, description: "issued_at + County.redemption_period_days; deed application allowed only at/after this instant" }
      - { name: sub_tax_total_cents, type: integer, source: computed, description: "Sum of principal across POSTED SubsequentTax rows on this certificate", default: 0 }
      - { name: assignment_seq, type: integer, source: computed, description: "Number of completed assignments (transfer depth); 0 at issuance", default: 0 }
      - { name: status, type: enum, source: system, description: "ACTIVE | FORECLOSURE_PENDING | REDEEMED | DEEDED", default: ACTIVE, constraints: "ACTIVE | FORECLOSURE_PENDING | REDEEMED | DEEDED" }

  - name: SubsequentTax
    parent: Certificate
    common_fields: true
    fields:
      - { name: certificate_id, type: string, source: input, description: "FK -> Certificate.id" }
      - { name: investor_id, type: string, source: input, description: "FK -> Investor.id; payer (must equal the certificate's current holder)" }
      - { name: tax_year, type: integer, source: input, description: "Tax year this sub-tax payment covers; unique per certificate" }
      - { name: principal_cents, type: integer, source: input, description: "Subsequent-tax principal paid in cents", constraints: ">= 1" }
      - { name: posted_at, type: datetime, source: system, description: "Logical-clock instant when paid; sub-tax interest accrues from here" }
      - { name: status, type: enum, source: system, description: "POSTED | REDEEMED", default: POSTED, constraints: "POSTED | REDEEMED" }

  - name: Redemption
    parent: Certificate
    common_fields: true
    fields:
      - { name: certificate_id, type: string, source: input, description: "FK -> Certificate.id" }
      - { name: redeemed_at, type: datetime, source: system, description: "Logical-clock instant of redemption (payoff date) used for interest accrual" }
      - { name: face_payoff_cents, type: integer, source: computed, description: "Face principal repaid (= certificate.face_amount_cents)" }
      - { name: face_interest_cents, type: integer, source: computed, description: "Simple interest on face from issued_at to redeemed_at at certificate rate" }
      - { name: penalty_cents, type: integer, source: computed, description: "Flat penalty = round(face * County.penalty_rate_bps / 10000)" }
      - { name: sub_tax_payoff_cents, type: integer, source: computed, description: "Sum of POSTED sub-tax principal repaid" }
      - { name: sub_tax_interest_cents, type: integer, source: computed, description: "Simple interest on each sub-tax from its posted_at to redeemed_at at County.sub_tax_interest_rate_bps" }
      - { name: premium_refund_cents, type: integer, source: computed, description: "Premium returned to holder: premium with interest if premium_earns_interest else 0" }
      - { name: total_payoff_cents, type: integer, source: computed, description: "Total amount the owner pays to redeem" }

  - name: Assignment
    parent: Certificate
    common_fields: true
    fields:
      - { name: certificate_id, type: string, source: input, description: "FK -> Certificate.id" }
      - { name: from_investor_id, type: string, source: input, description: "FK -> Investor.id; the assignor (must be current holder)" }
      - { name: to_investor_id, type: string, source: input, description: "FK -> Investor.id; the assignee" }
      - { name: consideration_cents, type: integer, source: input, description: "Cash paid by assignee to assignor for the certificate, in cents", constraints: ">= 0" }
      - { name: seq, type: integer, source: system, description: "1-based position in this certificate's assignment chain" }
      - { name: status, type: enum, source: system, description: "RECORDED — terminal once recorded", default: RECORDED, constraints: "RECORDED" }

  - name: DeedApplication
    parent: Certificate
    common_fields: true
    fields:
      - { name: certificate_id, type: string, source: input, description: "FK -> Certificate.id" }
      - { name: applicant_investor_id, type: string, source: input, description: "FK -> Investor.id; must be current holder" }
      - { name: deed_cost_cents, type: integer, source: input, description: "Statutory deed/foreclosure filing cost paid by applicant, in cents", constraints: ">= 0" }
      - { name: minimum_bid_cents, type: integer, source: computed, description: "Lien payoff floor at the deed sale = total certificate position (face + interest + penalty + sub-tax principal + sub-tax interest) + deed_cost_cents, snapshotted at application" }
      - { name: sale_price_cents, type: integer, source: input, description: "Hammer price realized at the deed sale; set on AWARDED", default: null }
      - { name: status, type: enum, source: system, description: "FILED | AWARDED | CANCELLED", default: FILED, constraints: "FILED | AWARDED | CANCELLED" }

  - name: SurplusDistribution
    parent: DeedApplication
    common_fields: true
    fields:
      - { name: deed_application_id, type: string, source: input, description: "FK -> DeedApplication.id" }
      - { name: certificate_id, type: string, source: input, description: "FK -> Certificate.id" }
      - { name: gross_proceeds_cents, type: integer, source: system, description: "= DeedApplication.sale_price_cents" }
      - { name: lien_satisfied_cents, type: integer, source: computed, description: "Amount paid to satisfy the certificate holder's full position (capped at gross_proceeds)" }
      - { name: surplus_cents, type: integer, source: computed, description: "Overage owed to the former owner = max(0, gross_proceeds - minimum_bid)" }
      - { name: claimed, type: boolean, source: system, description: "Whether the former owner has claimed the surplus", default: false }

# =============================================================================
# Table 1.2: State Machine Table
# =============================================================================
state_machines:
  - entity: TaxSale
    initial_state: DRAFT
    terminal_states: [SETTLED]
    transitions:
      - from: DRAFT
        to: OPEN
        trigger: "POST /counties/{countyId}/sales/{saleId}/open"
        actor: CountyTreasurer
        preconditions:
          - "TaxSale.status == DRAFT"
          - "current_clock >= TaxSale.scheduled_at (ERR_SALE_NOT_DUE)"
          - "listing_count >= 1 (ERR_SALE_EMPTY)"
        side_effects:
          - "increments TaxSale.version by 1"

      - from: OPEN
        to: CLOSED
        trigger: "POST /counties/{countyId}/sales/{saleId}/close"
        actor: CountyTreasurer
        preconditions:
          - "TaxSale.status == OPEN"
        side_effects:
          - "Each SaleListing with status LISTED and >=1 PLACED bid: award per award_winner calc -> SaleListing.status=SOLD, winning Bid.status=WON, losing Bids.status=LOST, a Certificate is issued (Certificate.status=ACTIVE), Parcel.status -> LIENED, Parcel.active_certificate_id set; this is a transitive cascade SaleListing->Bid->Certificate->Parcel"
          - "Each SaleListing with status LISTED and zero PLACED bids: SaleListing.status=STRUCK_OFF (no certificate)"
          - "Each losing Investor's escrow hold released (Bid.status=LOST, escrow_balance_cents credited back the held bid amount)"
          - "increments TaxSale.version by 1"

      - from: CLOSED
        to: SETTLED
        trigger: "POST /counties/{countyId}/sales/{saleId}/settle"
        actor: CountyTreasurer
        preconditions:
          - "TaxSale.status == CLOSED"
        side_effects:
          - "Sale is finalized; certificates already issued at close are unaffected"
          - "increments TaxSale.version by 1"

  - entity: SaleListing
    initial_state: LISTED
    terminal_states: [SOLD, STRUCK_OFF, WITHDRAWN]
    transitions:
      - from: LISTED
        to: WITHDRAWN
        trigger: "POST /counties/{countyId}/sales/{saleId}/listings/{listingId}/withdraw"
        actor: CountyTreasurer
        preconditions:
          - "SaleListing.status == LISTED"
          - "parent TaxSale.status IN {DRAFT, OPEN} (ERR_INVALID_STATE)"
        side_effects:
          - "Parcel.status reverts ON_SALE -> DELINQUENT if no other LISTED listing references it"
          - "All PLACED bids on this listing -> REFUNDED, holds released (escrow_balance_cents credited back)"
          - "increments SaleListing.version by 1"

      - from: LISTED
        to: SOLD
        trigger: "system: TaxSale OPEN->CLOSED award cascade"
        actor: system
        preconditions:
          - "At least one PLACED bid exists on the listing"
        side_effects:
          - "winning_bid_id set, certificate_id set, a Certificate is issued"

      - from: LISTED
        to: STRUCK_OFF
        trigger: "system: TaxSale OPEN->CLOSED with zero bids"
        actor: system
        preconditions:
          - "Zero PLACED bids on the listing"
        side_effects:
          - "Parcel.status stays LIENED only if another path liened it; otherwise reverts ON_SALE -> DELINQUENT"

  - entity: Bid
    initial_state: PLACED
    terminal_states: [WON, LOST, REFUNDED]
    transitions:
      - from: PLACED
        to: WON
        trigger: "system: award at sale close"
        actor: system
        preconditions:
          - "Bid is the award_winner of its listing"
        side_effects:
          - "Investor escrow committed: face_amount + premium debited permanently from winner"

      - from: PLACED
        to: LOST
        trigger: "system: award at sale close"
        actor: system
        preconditions:
          - "Bid is not the award_winner of a SOLD listing"
        side_effects:
          - "Investor escrow hold released (escrow_balance_cents credited back the held amount)"

      - from: PLACED
        to: REFUNDED
        trigger: "system: listing withdrawn before close"
        actor: system
        preconditions:
          - "Parent SaleListing transitions LISTED -> WITHDRAWN"
        side_effects:
          - "Investor escrow hold released"

  - entity: Certificate
    initial_state: ACTIVE
    terminal_states: [REDEEMED, DEEDED]
    transitions:
      - from: ACTIVE
        to: REDEEMED
        trigger: "POST /counties/{countyId}/certificates/{certificateId}/redeem"
        actor: CountyTreasurer
        preconditions:
          - "Certificate.status == ACTIVE"
        side_effects:
          - "A Redemption row is created with full payoff math (redemption_payoff calc)"
          - "Holder escrow credited total_payoff_cents minus premium_refund handling; all POSTED SubsequentTax -> REDEEMED"
          - "Parcel.status -> REDEEMED, Parcel.active_certificate_id -> null"
          - "increments Certificate.version by 1"

      - from: ACTIVE
        to: FORECLOSURE_PENDING
        trigger: "POST /counties/{countyId}/certificates/{certificateId}/deed-applications"
        actor: Investor
        preconditions:
          - "Certificate.status == ACTIVE"
          - "current_clock >= Certificate.redeem_deadline_at (ERR_REDEMPTION_PERIOD_OPEN)"
          - "applicant_investor_id == Certificate.holder_investor_id (ERR_NOT_CERTIFICATE_HOLDER)"
        side_effects:
          - "A DeedApplication is created (status FILED) with minimum_bid_cents snapshotted from the full position"
          - "increments Certificate.version by 1"

      - from: FORECLOSURE_PENDING
        to: ACTIVE
        trigger: "POST /counties/{countyId}/deed-applications/{deedApplicationId}/cancel"
        actor: CountyTreasurer
        preconditions:
          - "Certificate.status == FORECLOSURE_PENDING"
          - "DeedApplication.status == FILED"
        side_effects:
          - "DeedApplication.status -> CANCELLED; certificate returns to ACTIVE (redemption again possible); this is the revision loop"
          - "increments Certificate.version by 1"

      - from: FORECLOSURE_PENDING
        to: REDEEMED
        trigger: "POST /counties/{countyId}/certificates/{certificateId}/redeem"
        actor: CountyTreasurer
        preconditions:
          - "Certificate.status == FORECLOSURE_PENDING"
          - "DeedApplication.status == FILED (not yet AWARDED) (ERR_DEED_ALREADY_AWARDED)"
        side_effects:
          - "Redemption created including the FILED DeedApplication.deed_cost_cents in the payoff"
          - "DeedApplication.status -> CANCELLED; Parcel.status -> REDEEMED; POSTED SubsequentTax -> REDEEMED"
          - "increments Certificate.version by 1"

      - from: FORECLOSURE_PENDING
        to: DEEDED
        trigger: "POST /counties/{countyId}/deed-applications/{deedApplicationId}/award"
        actor: CountyTreasurer
        preconditions:
          - "Certificate.status == FORECLOSURE_PENDING"
          - "DeedApplication.status == FILED"
          - "sale_price_cents >= DeedApplication.minimum_bid_cents (ERR_BID_BELOW_MINIMUM)"
        side_effects:
          - "DeedApplication.status -> AWARDED; a SurplusDistribution is created (surplus_distribution calc)"
          - "Holder escrow credited lien_satisfied_cents; POSTED SubsequentTax -> REDEEMED"
          - "Parcel.status -> DEEDED; Parcel.active_certificate_id -> null; this is a transitive cascade DeedApplication->Certificate->Parcel and DeedApplication->SurplusDistribution"
          - "increments Certificate.version by 1"

  - entity: DeedApplication
    initial_state: FILED
    terminal_states: [AWARDED, CANCELLED]
    transitions:
      - from: FILED
        to: AWARDED
        trigger: "POST /counties/{countyId}/deed-applications/{deedApplicationId}/award"
        actor: CountyTreasurer
        preconditions:
          - "DeedApplication.status == FILED"
          - "Certificate.status == FORECLOSURE_PENDING"
          - "sale_price_cents >= minimum_bid_cents (ERR_BID_BELOW_MINIMUM)"
        side_effects:
          - "SurplusDistribution created; Certificate -> DEEDED (see Certificate machine)"
          - "increments DeedApplication.version by 1"

      - from: FILED
        to: CANCELLED
        trigger: "POST /counties/{countyId}/deed-applications/{deedApplicationId}/cancel  (or absorbed by redemption while pending)"
        actor: CountyTreasurer
        preconditions:
          - "DeedApplication.status == FILED"
        side_effects:
          - "Certificate -> ACTIVE (see Certificate machine)"
          - "increments DeedApplication.version by 1"

# =============================================================================
# Table 1.2.1: Concurrency Rules (OCC on parent version)
# =============================================================================
concurrency_rules:
  - rule_id: bid-place-stale-listing
    parent_entity: SaleListing
    write_endpoint: "POST /counties/{countyId}/sales/{saleId}/listings/{listingId}/bids"
    occ_field: "expected_listing_version"
    description: |
      Placing a Bid against a SaleListing whose version has advanced since the
      client last observed it is rejected. The version advances when the listing
      is withdrawn (which refunds prior bids and may revert the parcel); a bid
      carrying a stale listing version reflects a view in which the listing was
      still open and is rejected so the investor re-reads the listing's current
      status before committing escrow.
    error_id: ERR_STALE_VERSION
    http_status: 412

  - rule_id: subtax-add-stale-certificate
    parent_entity: Certificate
    write_endpoint: "POST /counties/{countyId}/certificates/{certificateId}/sub-taxes"
    occ_field: "expected_certificate_version"
    description: |
      Adding a SubsequentTax against a Certificate whose version has advanced
      since the client last observed it is rejected. The version advances when a
      redemption, assignment, or deed application mutates the certificate; a
      sub-tax carrying a stale certificate version reflects a view in which the
      holder or status differed and is rejected so the payer re-reads the
      certificate before committing the sub-tax outlay.
    error_id: ERR_STALE_VERSION
    http_status: 412

  - rule_id: assignment-record-stale-certificate
    parent_entity: Certificate
    write_endpoint: "POST /counties/{countyId}/certificates/{certificateId}/assignments"
    occ_field: "expected_certificate_version"
    description: |
      Recording an Assignment against a Certificate whose version has advanced
      since the client last observed it is rejected. A prior assignment already
      moved the holder (and bumped the version); a second assignment carrying the
      pre-transfer version reflects a view in which from_investor_id was still the
      holder and is rejected so the chain stays single-threaded and ordered.
    error_id: ERR_STALE_VERSION
    http_status: 412

# =============================================================================
# Table 1.3: Calculation Rules Table
# =============================================================================
calculations:
  - name: award_winner
    trigger: "TaxSale OPEN -> CLOSED (per LISTED listing with >=1 PLACED bid)"
    algorithm: selector_policy
    formula: |
      candidates = bids on the listing with status == PLACED
      if parent TaxSale.sale_type == RATE_BID_DOWN:
        # bid-down: lowest accepted rate wins; the rate the winner accrues at is its own rate_bps
        winner = candidate minimizing (rate_bps, created_at ASC)   # earliest bid wins ties at equal rate
        certificate.rate_bps = winner.rate_bps
        certificate.premium_cents = 0
      else:  # PREMIUM
        # highest cash premium wins; rate is fixed at the county ceiling
        winner = candidate maximizing premium_cents, tie-break created_at ASC (earliest)
        certificate.rate_bps = County.max_interest_rate_bps
        certificate.premium_cents = winner.premium_cents
    input_set: "Only Bid rows with status == PLACED on the listing being awarded; LOST/REFUNDED excluded."
    constants: {}
    precision: "integer bps / integer cents; no rounding in selection"
    variants:
      - name: rate_bid_down
        when: "TaxSale.sale_type == RATE_BID_DOWN"
        difference: "Minimize rate_bps (lower interest to the owner wins the lien); premium is always 0; certificate accrues at winner.rate_bps."
      - name: premium_overbid
        when: "TaxSale.sale_type == PREMIUM"
        difference: "Maximize premium_cents (most cash up front wins); certificate accrues at County.max_interest_rate_bps and carries the winner's premium."

  - name: redemption_payoff
    trigger: "Certificate ACTIVE|FORECLOSURE_PENDING -> REDEEMED (POST .../redeem)"
    algorithm: chronological
    formula: |
      let R = redeemed_at, basis = County.day_count_basis
      # --- face interest: simple interest accrued day-by-day from issuance ---
      face_days = floor_days(Certificate.issued_at -> R)         # whole elapsed days, inclusive of start exclusive of end
      face_interest = round( face_amount_cents * rate_bps * face_days / (10000 * basis) )   # round half up, per-component
      penalty = round( face_amount_cents * County.penalty_rate_bps / 10000 )
      # --- sub-tax interest: each POSTED sub-tax accrues from its OWN posted_at ---
      sub_tax_payoff = sum( s.principal_cents for s in POSTED sub-taxes )
      sub_tax_interest = sum_over_each_subtax(
          round( s.principal_cents * County.sub_tax_interest_rate_bps * floor_days(s.posted_at -> R) / (10000 * basis) )
      )   # ROUND PER SUB-TAX, THEN SUM (pinned order)
      # --- premium refund ---
      if County.premium_earns_interest:
        premium_refund = Certificate.premium_cents + round( Certificate.premium_cents * rate_bps * face_days / (10000 * basis) )
      else:
        premium_refund = 0
      # --- deed-cost passthrough when redeeming a FILED deed application ---
      filed_deed_cost = DeedApplication.deed_cost_cents if redeeming while FORECLOSURE_PENDING else 0
      total_payoff = face_amount_cents + face_interest + penalty
                   + sub_tax_payoff + sub_tax_interest + premium_refund + filed_deed_cost
    input_set: "POSTED SubsequentTax rows only (REDEEMED excluded); the single FILED DeedApplication if status==FORECLOSURE_PENDING."
    constants:
      ROUNDING: "round_half_up"
    precision: "2-step: round each interest COMPONENT (face, each sub-tax, premium) to whole cents, THEN sum; never sum-then-round"
    variants:
      - name: simple_pre_deadline
        when: "Certificate.status == ACTIVE at redemption"
        difference: "No deed cost; sub-tax accrues from each posted_at; standard payoff."
      - name: with_filed_deed_cost
        when: "Certificate.status == FORECLOSURE_PENDING with a FILED DeedApplication at redemption"
        difference: "Adds DeedApplication.deed_cost_cents to total_payoff; otherwise identical accrual; the DeedApplication is CANCELLED."

  - name: certificate_position
    trigger: "DeedApplication FILED (snapshot of minimum_bid_cents) and SurplusDistribution"
    algorithm: aggregation
    formula: |
      # Full lien position valued at the deed-application filing instant F = current_clock
      basis = County.day_count_basis
      face_days = floor_days(Certificate.issued_at -> F)
      face_interest = round( face_amount_cents * rate_bps * face_days / (10000 * basis) )
      penalty = round( face_amount_cents * County.penalty_rate_bps / 10000 )
      sub_tax_principal = sum( s.principal_cents for s in POSTED sub-taxes )
      sub_tax_interest  = sum_over_each_subtax(
          round( s.principal_cents * County.sub_tax_interest_rate_bps * floor_days(s.posted_at -> F) / (10000 * basis) ) )
      position = face_amount_cents + face_interest + penalty + sub_tax_principal + sub_tax_interest
      minimum_bid_cents = position + DeedApplication.deed_cost_cents
    input_set: "POSTED SubsequentTax rows only; snapshot taken once at deed-application filing and frozen on the DeedApplication."
    constants:
      ROUNDING: "round_half_up"
    precision: "round each interest component then sum, identical to redemption_payoff; value frozen at filing, NOT recomputed at award"

  - name: surplus_distribution
    trigger: "DeedApplication FILED -> AWARDED"
    algorithm: waterfall_allocation
    formula: |
      gross = DeedApplication.sale_price_cents
      # bucket 1: certificate holder's frozen position (minimum_bid minus deed_cost is the lien; deed_cost is reimbursed to applicant too)
      # The holder is made whole up to minimum_bid_cents (lien + deed cost), capped at gross.
      lien_satisfied = min(gross, DeedApplication.minimum_bid_cents)
      # bucket 2: overage to former owner
      surplus = max(0, gross - DeedApplication.minimum_bid_cents)
      # invariant: lien_satisfied + surplus == gross  (when gross >= minimum_bid; award is rejected otherwise)
    input_set: "Single DeedApplication being awarded; minimum_bid_cents is the frozen snapshot, not recomputed."
    constants: {}
    precision: "integer cents; waterfall fills holder bucket fully before any surplus"

  - name: investor_escrow
    trigger: "deposit, bid placement (hold), award (commit/release), sub-tax (debit), redemption (credit), deed (debit cost / credit lien)"
    algorithm: aggregation
    formula: |
      escrow_balance_cents =
          sum(deposits)
        - sum(committed winning awards: face_amount + premium for WON bids on this investor's behalf)
        + sum(released holds for LOST/REFUNDED bids)              # holds net to zero once released
        - sum(POSTED sub-tax principal paid by this investor)
        - sum(deed_cost for this investor's FILED/AWARDED deed applications)
        + sum(redemption credits received as holder: total_payoff minus filed_deed_cost passthrough)
        + sum(lien_satisfied credited as holder on AWARDED deeds)
      # A PLACED bid HOLDS funds: face_amount + premium (PREMIUM) or face_amount (RATE_BID_DOWN) reserved, not yet committed.
      deposit_total_cents = sum(deposits)
    input_set: "All escrow-affecting events for the investor; holds for PLACED bids are reserved and released on LOST/REFUNDED."
    constants: {}
    precision: "integer cents; a bid is rejected if hold would drive escrow_balance_cents < 0 (ERR_INSUFFICIENT_ESCROW)"

  - name: face_interest_days
    trigger: "any interest accrual (redemption_payoff, certificate_position)"
    algorithm: threshold
    formula: |
      floor_days(start, end):
        # whole calendar days between two logical-clock instants, floor (partial day does NOT accrue)
        # day 0 accrues nothing; interest begins to accrue only once a full day has elapsed
        return floor( (end - start) / 86400 seconds )
      # Boundary: redeeming exactly at issued_at + k*86400 yields k accrual days;
      # redeeming one second earlier yields k-1 days.
    input_set: "Two logical-clock instants on the same certificate or sub-tax."
    constants:
      SECONDS_PER_DAY: 86400
    precision: "integer day count via floor; partial days never accrue interest"

# =============================================================================
# Table 1.4: Validation Rules Table (ordered by priority)
# =============================================================================
validations:
  - priority: 1
    category: auth
    check: "X-User-Role and X-User-ID headers present and X-User-Role is a declared role"
    error_id: ERR_UNAUTHENTICATED
    http_status: 401
    applies_to: all

  - priority: 2
    category: auth
    check: "Role permitted for this operation per RBAC matrix (e.g. only CountyTreasurer may open/close/settle a sale, award/cancel deeds, process redemptions)"
    error_id: ERR_FORBIDDEN_ROLE
    http_status: 403
    applies_to: all

  - priority: 3
    category: existence
    check: "All path resources exist, validated left-to-right (county, sale, listing, bid, certificate, deed-application)"
    error_id: ERR_NOT_FOUND
    http_status: 404
    applies_to: all

  - priority: 4
    category: business_referential
    check: "Body FKs reference resources in the correct county scope (parcel.county_id == path county; investor exists; certificate belongs to county)"
    error_id: ERR_CROSS_COUNTY_REFERENCE
    http_status: 409
    applies_to: "POST listings, POST bids, POST certificates dependents"

  - priority: 5
    category: business_constraint
    check: "Request body shape valid: required fields present, enums in range, integers non-negative where required, OCC field present where required"
    error_id: ERR_INVALID_REQUEST
    http_status: 400
    applies_to: all mutating endpoints

  - priority: 6
    category: state
    check: "OCC: expected_<parent>_version matches the parent's current version"
    error_id: ERR_STALE_VERSION
    http_status: 412
    applies_to: "POST bids, POST sub-taxes, POST assignments"

  - priority: 7
    category: state
    check: "Target resource is in a state from which this transition is defined"
    error_id: ERR_INVALID_STATE
    http_status: 409
    applies_to: "all state-transition endpoints (open/close/settle/withdraw/redeem/deed-applications/award/cancel)"

  - priority: 8
    category: business_safety
    check: "Segregation of duties: the CountyTreasurer awarding a sale's listings (close) must not be acting as the X-User-ID of any Investor that holds a winning bid; bidding requires the Investor role, never CountyTreasurer"
    error_id: ERR_SEGREGATION_OF_DUTIES
    http_status: 403
    applies_to: "POST bids, POST .../close"

  - priority: 9
    category: business_temporal
    check: "Sale may open only at/after scheduled_at; deed application allowed only at/after redeem_deadline_at"
    error_id: ERR_SALE_NOT_DUE
    http_status: 409
    applies_to: "POST .../open, POST .../deed-applications"

  - priority: 10
    category: business_temporal
    check: "Deed application before redemption period elapsed is rejected"
    error_id: ERR_REDEMPTION_PERIOD_OPEN
    http_status: 409
    applies_to: "POST .../deed-applications"

  - priority: 11
    category: business_referential
    check: "Acting investor must be the certificate's current holder for sub-tax, assignment (as from), and deed application"
    error_id: ERR_NOT_CERTIFICATE_HOLDER
    http_status: 403
    applies_to: "POST sub-taxes, POST assignments, POST deed-applications"

  - priority: 12
    category: business_constraint
    check: "RATE_BID_DOWN bid: rate_bps <= listing.opening_rate_bps AND rate_bps is a positive multiple of County.bid_down_increment_bps; PREMIUM bid: premium_cents >= 0 and rate_bps omitted/ignored"
    error_id: ERR_INVALID_BID
    http_status: 422
    applies_to: "POST bids"

  - priority: 13
    category: business_constraint
    check: "Sub-tax tax_year unique per certificate; assignment to_investor_id != from_investor_id"
    error_id: ERR_DUPLICATE_SUB_TAX
    http_status: 409
    applies_to: "POST sub-taxes, POST assignments"

  - priority: 14
    category: business_fiscal
    check: "Investor escrow sufficient to cover a bid hold or sub-tax/deed-cost outlay"
    error_id: ERR_INSUFFICIENT_ESCROW
    http_status: 402
    applies_to: "POST bids, POST sub-taxes, POST deed-applications"

  - priority: 15
    category: business_fiscal
    check: "Deed sale hammer price must be >= minimum_bid_cents"
    error_id: ERR_BID_BELOW_MINIMUM
    http_status: 409
    applies_to: "POST .../award"

# =============================================================================
# Table 1.5: API Endpoint Table
# =============================================================================
endpoints:
  # --- test-driving: logical clock ---
  - method: POST
    path: "/_clock/set_current_utc"
    description: "Set the server logical clock to an arbitrary UTC instant. Server startup default is 2026-01-01T00:00:00Z; before any set call the clock reads exactly this default and never falls back to wall-clock time. All accrual, scheduling, and deadline rules read this clock."
    roles: [CountyTreasurer]
    code: 200
    input: [to_iso8601]
    output: "{ current_utc: string }"
    side_effects: ["Logical clock advanced/rewound to to_iso8601"]

  # --- County ---
  - method: POST
    path: "/counties"
    description: "Create a county tax-sale configuration"
    roles: [CountyTreasurer]
    code: 201
    input: [name, state_code, max_interest_rate_bps, bid_down_increment_bps, redemption_period_days, sub_tax_interest_rate_bps, "penalty_rate_bps?", "premium_bidding_enabled?", "premium_earns_interest?", "day_count_basis?"]
    output: County
    side_effects: []

  - method: GET
    path: "/counties/{countyId}"
    description: "Get a county"
    roles: [CountyTreasurer, Investor, Auditor]
    code: 200
    input: []
    output: County
    side_effects: []

  # --- Parcel ---
  - method: POST
    path: "/counties/{countyId}/parcels"
    description: "Register a delinquent parcel in a county (status DELINQUENT)"
    roles: [CountyTreasurer]
    code: 201
    input: [apn, owner_name, assessed_value_cents, base_tax_due_cents]
    output: Parcel
    side_effects: ["Parcel.status=DELINQUENT, county_id set"]

  - method: GET
    path: "/counties/{countyId}/parcels/{parcelId}"
    description: "Get a parcel"
    roles: [CountyTreasurer, Investor, Auditor]
    code: 200
    input: []
    output: Parcel
    side_effects: []

  - method: GET
    path: "/counties/{countyId}/parcels"
    description: "List parcels in a county (FK reverse-reachability for Parcel.county_id); filterable by status"
    roles: [CountyTreasurer, Investor, Auditor]
    code: 200
    input: ["county_id?", "status?", "limit?", "offset?"]
    output: Parcel[]
    side_effects: []

  # --- Investor ---
  - method: POST
    path: "/investors"
    description: "Register an investor"
    roles: [Investor, CountyTreasurer]
    code: 201
    input: [legal_name, tax_id]
    output: Investor
    side_effects: ["escrow_balance_cents=0, registered=false"]

  - method: GET
    path: "/investors/{investorId}"
    description: "Get an investor (escrow ledger view)"
    roles: [Investor, CountyTreasurer, Auditor]
    code: 200
    input: []
    output: Investor
    side_effects: []

  - method: POST
    path: "/investors/{investorId}/deposits"
    description: "Fund an investor's escrow account; first deposit sets registered=true"
    roles: [Investor, CountyTreasurer]
    code: 201
    input: [amount_cents]
    output: Investor
    side_effects: ["escrow_balance_cents += amount_cents, deposit_total_cents += amount_cents, registered=true"]

  # --- TaxSale ---
  - method: POST
    path: "/counties/{countyId}/sales"
    description: "Create a tax sale (DRAFT); sale_type fixed from county.premium_bidding_enabled"
    roles: [CountyTreasurer]
    code: 201
    input: [sale_name, scheduled_at]
    output: TaxSale
    side_effects: ["status=DRAFT, sale_type derived"]

  - method: GET
    path: "/counties/{countyId}/sales/{saleId}"
    description: "Get a tax sale"
    roles: [CountyTreasurer, Investor, Auditor]
    code: 200
    input: []
    output: TaxSale
    side_effects: []

  - method: GET
    path: "/counties/{countyId}/sales"
    description: "List sales in a county (FK reverse-reachability for TaxSale.county_id)"
    roles: [CountyTreasurer, Investor, Auditor]
    code: 200
    input: ["county_id?", "status?", "limit?", "offset?"]
    output: TaxSale[]
    side_effects: []

  - method: POST
    path: "/counties/{countyId}/sales/{saleId}/open"
    description: "Open a sale for bidding (DRAFT->OPEN)"
    roles: [CountyTreasurer]
    code: 200
    input: []
    output: TaxSale
    side_effects: ["status=OPEN"]

  - method: POST
    path: "/counties/{countyId}/sales/{saleId}/close"
    description: "Close a sale (OPEN->CLOSED); runs the award cascade issuing certificates"
    roles: [CountyTreasurer]
    code: 200
    input: []
    output: TaxSale
    side_effects: ["award_winner per listing; certificates issued; parcels LIENED; losing/refunded holds released"]

  - method: POST
    path: "/counties/{countyId}/sales/{saleId}/settle"
    description: "Settle a closed sale (CLOSED->SETTLED)"
    roles: [CountyTreasurer]
    code: 200
    input: []
    output: TaxSale
    side_effects: ["status=SETTLED"]

  # --- SaleListing ---
  - method: POST
    path: "/counties/{countyId}/sales/{saleId}/listings"
    description: "Attach a delinquent parcel to a sale as a listing (LISTED); copies opening_rate_bps from county.max_interest_rate_bps"
    roles: [CountyTreasurer]
    code: 201
    input: [parcel_id]
    output: SaleListing
    side_effects: ["status=LISTED, Parcel.status DELINQUENT->ON_SALE, opening_rate_bps set, sale.listing_count++"]

  - method: GET
    path: "/counties/{countyId}/sales/{saleId}/listings/{listingId}"
    description: "Get a listing"
    roles: [CountyTreasurer, Investor, Auditor]
    code: 200
    input: []
    output: SaleListing
    side_effects: []

  - method: GET
    path: "/counties/{countyId}/sales/{saleId}/listings"
    description: "List listings on a sale (FK reverse-reachability for SaleListing.sale_id); filter by parcel_id for SaleListing.parcel_id"
    roles: [CountyTreasurer, Investor, Auditor]
    code: 200
    input: ["sale_id?", "parcel_id?", "status?", "limit?", "offset?"]
    output: SaleListing[]
    side_effects: []

  - method: POST
    path: "/counties/{countyId}/sales/{saleId}/listings/{listingId}/withdraw"
    description: "Withdraw a listing before close (LISTED->WITHDRAWN); refunds bids, reverts parcel"
    roles: [CountyTreasurer]
    code: 200
    input: []
    output: SaleListing
    side_effects: ["status=WITHDRAWN; PLACED bids REFUNDED; Parcel reverts to DELINQUENT if no other LISTED listing"]

  # --- Bid ---
  - method: POST
    path: "/counties/{countyId}/sales/{saleId}/listings/{listingId}/bids"
    description: "Place a bid on a listing while sale OPEN; holds escrow"
    roles: [Investor]
    code: 201
    input: [investor_id, "rate_bps?", "premium_cents?", expected_listing_version]
    output: Bid
    side_effects: ["status=PLACED; investor escrow holds face_amount(+premium); increments SaleListing.version by 1"]

  - method: GET
    path: "/counties/{countyId}/sales/{saleId}/listings/{listingId}/bids/{bidId}"
    description: "Get a bid"
    roles: [CountyTreasurer, Investor, Auditor]
    code: 200
    input: []
    output: Bid
    side_effects: []

  - method: GET
    path: "/counties/{countyId}/sales/{saleId}/listings/{listingId}/bids"
    description: "List bids on a listing (FK reverse-reachability for Bid.listing_id); filter by investor_id"
    roles: [CountyTreasurer, Investor, Auditor]
    code: 200
    input: ["listing_id?", "investor_id?", "status?", "limit?", "offset?"]
    output: Bid[]
    side_effects: []

  # --- Certificate ---
  - method: GET
    path: "/counties/{countyId}/certificates/{certificateId}"
    description: "Get a certificate (computed sub_tax_total_cents, assignment_seq)"
    roles: [CountyTreasurer, Investor, Auditor]
    code: 200
    input: []
    output: Certificate
    side_effects: []

  - method: GET
    path: "/counties/{countyId}/certificates"
    description: "List certificates in a county; filter by parcel_id (FK reverse-reachability for Certificate.parcel_id), listing_id (Certificate.listing_id), holder_investor_id (Certificate.holder_investor_id), county_id (Certificate.county_id)"
    roles: [CountyTreasurer, Investor, Auditor]
    code: 200
    input: ["county_id?", "parcel_id?", "listing_id?", "holder_investor_id?", "status?", "limit?", "offset?"]
    output: Certificate[]
    side_effects: []

  - method: GET
    path: "/counties/{countyId}/certificates/{certificateId}/payoff-quote"
    description: "Computed read: payoff quote for redeeming the certificate at the current logical-clock instant (does not mutate)"
    roles: [CountyTreasurer, Investor, Auditor]
    code: 200
    input: []
    output: "{ face_payoff_cents: integer, face_interest_cents: integer, penalty_cents: integer, sub_tax_payoff_cents: integer, sub_tax_interest_cents: integer, premium_refund_cents: integer, total_payoff_cents: integer, as_of: string }"
    side_effects: []

  - method: POST
    path: "/counties/{countyId}/certificates/{certificateId}/redeem"
    description: "Owner redeems the certificate; computes payoff and pays the holder (ACTIVE|FORECLOSURE_PENDING -> REDEEMED)"
    roles: [CountyTreasurer]
    code: 201
    input: []
    output: Redemption
    side_effects: ["Redemption created; holder escrow credited; POSTED sub-taxes REDEEMED; FILED deed CANCELLED; Parcel REDEEMED; increments Certificate.version by 1"]

  # --- SubsequentTax ---
  - method: POST
    path: "/counties/{countyId}/certificates/{certificateId}/sub-taxes"
    description: "Holder pays a subsequent year's tax, adding it to the lien (POSTED)"
    roles: [Investor]
    code: 201
    input: [investor_id, tax_year, principal_cents, expected_certificate_version]
    output: SubsequentTax
    side_effects: ["status=POSTED, posted_at=clock; holder escrow debited principal; Certificate.sub_tax_total_cents recomputed; increments Certificate.version by 1"]

  - method: GET
    path: "/counties/{countyId}/certificates/{certificateId}/sub-taxes"
    description: "List sub-taxes on a certificate (FK reverse-reachability for SubsequentTax.certificate_id); filter by investor_id"
    roles: [CountyTreasurer, Investor, Auditor]
    code: 200
    input: ["certificate_id?", "investor_id?", "status?", "limit?", "offset?"]
    output: SubsequentTax[]
    side_effects: []

  # --- Redemption ---
  - method: GET
    path: "/counties/{countyId}/certificates/{certificateId}/redemptions"
    description: "List redemptions on a certificate (FK reverse-reachability for Redemption.certificate_id); returns 0 or 1"
    roles: [CountyTreasurer, Investor, Auditor]
    code: 200
    input: ["certificate_id?", "limit?", "offset?"]
    output: Redemption[]
    side_effects: []

  # --- Assignment ---
  - method: POST
    path: "/counties/{countyId}/certificates/{certificateId}/assignments"
    description: "Record transfer of the certificate from current holder to another investor (RECORDED)"
    roles: [Investor]
    code: 201
    input: [from_investor_id, to_investor_id, consideration_cents, expected_certificate_version]
    output: Assignment
    side_effects: ["status=RECORDED, seq assigned; Certificate.holder_investor_id -> to_investor_id; Certificate.assignment_seq++; increments Certificate.version by 1"]

  - method: GET
    path: "/counties/{countyId}/certificates/{certificateId}/assignments"
    description: "List assignments on a certificate in seq order (FK reverse-reachability for Assignment.certificate_id); filter by from_investor_id"
    roles: [CountyTreasurer, Investor, Auditor]
    code: 200
    input: ["certificate_id?", "from_investor_id?", "limit?", "offset?"]
    output: Assignment[]
    side_effects: []

  # --- DeedApplication ---
  - method: POST
    path: "/counties/{countyId}/certificates/{certificateId}/deed-applications"
    description: "Holder applies for a tax deed after the redemption period (ACTIVE->FORECLOSURE_PENDING)"
    roles: [Investor]
    code: 201
    input: [applicant_investor_id, deed_cost_cents]
    output: DeedApplication
    side_effects: ["status=FILED, minimum_bid_cents snapshotted; Certificate->FORECLOSURE_PENDING; holder escrow debited deed_cost; increments Certificate.version by 1"]

  - method: GET
    path: "/counties/{countyId}/deed-applications/{deedApplicationId}"
    description: "Get a deed application"
    roles: [CountyTreasurer, Investor, Auditor]
    code: 200
    input: []
    output: DeedApplication
    side_effects: []

  - method: GET
    path: "/counties/{countyId}/certificates/{certificateId}/deed-applications"
    description: "List deed applications on a certificate (FK reverse-reachability for DeedApplication.certificate_id)"
    roles: [CountyTreasurer, Investor, Auditor]
    code: 200
    input: ["certificate_id?", "status?", "limit?", "offset?"]
    output: DeedApplication[]
    side_effects: []

  - method: POST
    path: "/counties/{countyId}/deed-applications/{deedApplicationId}/award"
    description: "Treasurer awards the tax deed at the foreclosure sale (FILED->AWARDED, Certificate->DEEDED)"
    roles: [CountyTreasurer]
    code: 200
    input: [sale_price_cents]
    output: DeedApplication
    side_effects: ["status=AWARDED; SurplusDistribution created; holder escrow credited lien_satisfied; Parcel DEEDED; increments DeedApplication.version by 1; increments Certificate.version by 1"]

  - method: POST
    path: "/counties/{countyId}/deed-applications/{deedApplicationId}/cancel"
    description: "Treasurer cancels a filed deed application, returning certificate to ACTIVE (FILED->CANCELLED)"
    roles: [CountyTreasurer]
    code: 200
    input: []
    output: DeedApplication
    side_effects: ["status=CANCELLED; Certificate->ACTIVE; increments DeedApplication.version by 1; increments Certificate.version by 1"]

  # --- SurplusDistribution ---
  - method: GET
    path: "/counties/{countyId}/deed-applications/{deedApplicationId}/surplus"
    description: "List the surplus distribution for an awarded deed (FK reverse-reachability for SurplusDistribution.deed_application_id); returns 0 or 1"
    roles: [CountyTreasurer, Investor, Auditor]
    code: 200
    input: ["deed_application_id?", "limit?", "offset?"]
    output: SurplusDistribution[]
    side_effects: []

  - method: GET
    path: "/counties/{countyId}/certificates/{certificateId}/surplus"
    description: "List surplus distributions for a certificate (FK reverse-reachability for SurplusDistribution.certificate_id); returns 0 or 1"
    roles: [CountyTreasurer, Investor, Auditor]
    code: 200
    input: ["certificate_id?", "limit?", "offset?"]
    output: SurplusDistribution[]
    side_effects: []

  - method: POST
    path: "/counties/{countyId}/deed-applications/{deedApplicationId}/surplus/{surplusId}/claim"
    description: "Former owner claims the surplus overage (sets claimed=true)"
    roles: [CountyTreasurer]
    code: 200
    input: []
    output: SurplusDistribution
    side_effects: ["claimed=true"]

