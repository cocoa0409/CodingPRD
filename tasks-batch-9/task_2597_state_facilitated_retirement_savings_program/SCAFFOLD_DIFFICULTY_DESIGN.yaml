  # ===========================================================================
  # RULE 3 / 9 — non_linear_state_machine
  # ===========================================================================
  - rule_id: non_linear_state_machine
    instances:

      - name: enrollment_opt_out_then_reenroll_cycle_resets_rate_to_default
        grounds:
          - state_machines.Enrollment.ACTIVE_to_OPTED_OUT
          - state_machines.Enrollment.OPTED_OUT_to_ACTIVE
          - entities.Enrollment.fields.contribution_rate_bp
          - entities.Enrollment.fields.rate_source
          - entities.Enrollment.fields.reenrollment_count
          - entities.Enrollment.fields.escalation_opt_out
          - calculations.default_rate_and_escalation
        distinguishing_aspect: |
          A true cycle with state-destroying re-entry: the enrollment leaves ACTIVE for
          OPTED_OUT and returns to ACTIVE, but re-entry is NOT a restoration — the
          participant-elected 700 bp rate is discarded and the rate is re-seeded from the
          program-year default of 500 bp with rate_source back to DEFAULT, while
          reenrollment_count monotonically records the loop as 1. A linear or
          restore-on-revert machine would leave 700 bp / PARTICIPANT_ELECTED in place.
        test_recipe:
          setup:
            - "Program year 2026 with default_contribution_rate_bp 500; fund menu holds TDF2045 and MMKT01"
            - "Employer Delta Fabrication registered; Rosa Lim enrolled, activated by the auto-enrollment run, so contribution_rate_bp is 500 with rate_source DEFAULT"
            - "The participant then elects 700 bp, moving rate_source to PARTICIPANT_ELECTED"
            - "The participant then opts out, so enrollment_status is OPTED_OUT and opted_out_at is set"
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-01-01T00:00:00Z" }
              as: ProgramAdministrator
            - call: "POST /program-years"
              payload: { calendar_year: 2026, ira_annual_limit_cents: 700000, default_contribution_rate_bp: 500 }
              as: ProgramAdministrator
            - call: "POST /investment-options"
              payload: { fund_code: "TDF2045", name: "Target Retirement 2045", category: "TARGET_DATE", target_year: 2045, expense_ratio_bp: 30, default_eligible: true }
              as: ProgramAdministrator
            - call: "POST /investment-options"
              payload: { fund_code: "MMKT01", name: "Government Money Market", category: "CAPITAL_PRESERVATION", expense_ratio_bp: 20, default_eligible: true }
              as: ProgramAdministrator
            - call: "POST /employers"
              payload: { ein: "12-3456789", legal_name: "Delta Fabrication LLC", worksite_state: "CA", employee_count: 60 }
              as: ProgramAdministrator
              captures: { emp_id: "$.data.id" }
            - call: "POST /employers/${emp_id}/registration"
              payload: { non_fiduciary_acknowledged: true, payroll_contact_email: "payroll@delta.example" }
              as: Employer
              as_user_id: "${emp_id}"
            - call: "POST /participants"
              payload: { full_name: "Rosa Lim", date_of_birth: "1980-05-10", email: "rosa.lim@x.example", ssn_last4: "1234", state_resident: true }
              as: ProgramAdministrator
              captures: { par_id: "$.data.id" }
            - call: "POST /employers/${emp_id}/enrollments"
              payload: { participant_id: "${par_id}", hire_date: "2026-01-05", annual_compensation_cents: 9600000 }
              as: Employer
              as_user_id: "${emp_id}"
              captures: { enr_id: "$.data.id" }
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-02-01T00:00:00Z" }
              as: ProgramAdministrator
            - call: "POST /_ops/auto-enrollment-run"
              payload: {}
              as: ProgramAdministrator
            - call: "POST /enrollments/${enr_id}/rate-election"
              payload: { contribution_rate_bp: 700 }
              as: Participant
              as_user_id: "${par_id}"
            - call: "POST /enrollments/${enr_id}/opt-out"
              payload: { opt_out_reason_code: "AFFORDABILITY" }
              as: Participant
              as_user_id: "${par_id}"
          trigger:
            - call: "POST /enrollments/${enr_id}/reenroll"
              payload: {}
              as: Participant
              as_user_id: "${par_id}"
          assert:
            - "Enrollment.${enr_id}.enrollment_status == ACTIVE"
            - "Enrollment.${enr_id}.contribution_rate_bp == 500"
            - "Enrollment.${enr_id}.contribution_rate_bp != 700"
            - "Enrollment.${enr_id}.rate_source == DEFAULT"
            - "Enrollment.${enr_id}.reenrollment_count == 1"
            - "Enrollment.${enr_id}.escalation_opt_out == false"
            - "Enrollment.${enr_id}.opted_out_at == null"

      - name: employer_registration_and_compliance_dimensions_advance_independently
        grounds:
          - state_machines.Employer.registration_status
          - state_machines.Employer.compliance_status
          - complexity_profile.state_machine_shape
          - entities.Employer.fields.registration_status
          - entities.Employer.fields.compliance_status
          - entities.Employer.fields.unremitted_deduction_cents
        distinguishing_aspect: |
          Two parallel state dimensions on one entity: compliance_status walks
          COMPLIANT -> DELINQUENT -> PENALIZED under a missed remittance and then an assessment,
          while registration_status is pinned at REGISTERED the entire time and never
          regresses. A single fused status field would be forced to overwrite REGISTERED with
          DELINQUENT or PENALIZED, losing the fact that the employer is still validly registered.
        test_recipe:
          setup:
            - "Program year 2026; Harbor Micro Foods (5 employees, WAVE_3) completes registration so registration_status is REGISTERED and compliance_status is COMPLIANT"
            - "One participant enrolled and ACTIVE"
            - "A remittance for pay period 2025-12-01..2025-12-31 with pay_date 2026-01-02 (due 2026-01-09) holding 800000 cents is SUBMITTED but never posted"
            - "Clock advanced to 2026-12-31 so the remittance is past due and compliance_status has moved to DELINQUENT"
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
