          setup:
            - "Department with donation_partner_enabled true (default) and shrink_budget_pct 0.03."
            - "LOCKED BakeDay on 2026-08-12 holding: one COMPLETED PAR-CROIS run (2 racks, ingredient_cost 600, actual_units 80, unit_cost_basis 8, on_shelf 80), one SCHEDULED plan-generated filler run, one OPEN pickup slot 14:00-16:00Z with capacity 30, one CONFIRMED cake order holding 8 decoration units."
