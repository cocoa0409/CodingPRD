            - "${invV6_2_total} == 267500"
            - "${invV6_2_status} == ISSUED"
            - "${pV6_bal_3} == 267500"
      - name: threshold_config_weights_and_bounds_are_validated_as_an_aggregate
        claim_type: Aggregate validation
        grounds:
          - validations.priority_28
          - errors.ERR_THRESHOLD_CONFIG_INVALID
          - endpoints.POST_hie_match_threshold_configs
        distinguishing_aspect: |
          Every individual weight is inside its declared [0,1] range in all four requests, so the
          per-field schema check at priority 6 passes each time; only the collective sum, the ordering of
          the two thresholds and the open-interval bound on partial_credit_factor can reject them. The
          tolerance is exactly 0.0001: a sum of 1.0002 is refused while 1.0001 is accepted, and
          auto_link_threshold must be strictly above review_lower_bound, so equal bounds are refused.
        test_recipe:
          setup:
            - "No fixtures. The reference weights 0.20 + 0.12 + 0.25 + 0.28 + 0.08 + 0.07 sum to exactly 1.0000."
          setup_api_calls: []
          trigger:
            - call: "POST /hie/match-threshold-configs"
              payload: { config_label: "V7-SUM-1_0002", auto_link_threshold: 0.9200, review_lower_bound: 0.7500, score_variant_mode: "PROBABILISTIC_ONLY", weight_family_name: 0.20, weight_given_name: 0.12, weight_birth_date: 0.25, weight_ssn_last4: 0.28, weight_postal_code: 0.08, weight_phone_digits: 0.0702, partial_credit_factor: 0.50 }
              as: PrivacyOfficer
              as_user_id: "privacy-tuner-1"
              captures: { errV7_a: $.data.error_id }
            - call: "POST /hie/match-threshold-configs"
              payload: { config_label: "V7-BOUNDS-EQUAL", auto_link_threshold: 0.7500, review_lower_bound: 0.7500, score_variant_mode: "PROBABILISTIC_ONLY", weight_family_name: 0.20, weight_given_name: 0.12, weight_birth_date: 0.25, weight_ssn_last4: 0.28, weight_postal_code: 0.08, weight_phone_digits: 0.07, partial_credit_factor: 0.50 }
              as: PrivacyOfficer
              as_user_id: "privacy-tuner-1"
              captures: { errV7_b: $.data.error_id }
            - call: "POST /hie/match-threshold-configs"
              payload: { config_label: "V7-PARTIAL-1_0", auto_link_threshold: 0.9200, review_lower_bound: 0.7500, score_variant_mode: "PROBABILISTIC_ONLY", weight_family_name: 0.20, weight_given_name: 0.12, weight_birth_date: 0.25, weight_ssn_last4: 0.28, weight_postal_code: 0.08, weight_phone_digits: 0.07, partial_credit_factor: 1.0 }
              as: PrivacyOfficer
              as_user_id: "privacy-tuner-1"
              captures: { errV7_c: $.data.error_id }
            - call: "POST /hie/match-threshold-configs"
              payload: { config_label: "V7-SUM-1_0001", auto_link_threshold: 0.9200, review_lower_bound: 0.7500, score_variant_mode: "PROBABILISTIC_ONLY", weight_family_name: 0.20, weight_given_name: 0.12, weight_birth_date: 0.25, weight_ssn_last4: 0.28, weight_postal_code: 0.08, weight_phone_digits: 0.0701, partial_credit_factor: 0.50 }
              as: PrivacyOfficer
              as_user_id: "privacy-tuner-1"
              captures: { cfgV7_id: $.data.id, cfgV7_status: $.data.status, cfgV7_tuner: $.data.tuned_by_user_id, cfgV7_scored: $.data.scored_link_count }
          assert:
            - "${errV7_a} == ERR_THRESHOLD_CONFIG_INVALID"
            - "${errV7_b} == ERR_THRESHOLD_CONFIG_INVALID"
            - "${errV7_c} == ERR_THRESHOLD_CONFIG_INVALID"
            - "${cfgV7_status} == DRAFT"
            - "${cfgV7_tuner} == privacy-tuner-1"
            - "${cfgV7_scored} == 0"
      - name: review_note_length_is_enforced_only_for_an_unjustified_outcome
        claim_type: Conditional validation
        grounds:
          - validations.priority_23
          - errors.ERR_JUSTIFICATION_TOO_SHORT
          - state_machines.BreakGlassAccess.UNDER_REVIEW_to_JUSTIFIED
          - calculations.break_glass_sanction_points
        distinguishing_aspect: |
          Priority 23 has a conditional leg: review_note must reach 40 characters only when outcome ==
          UNJUSTIFIED. A JUSTIFIED decision carrying the 14-character note "Verified need" therefore
          succeeds and awards 0 sanction points, while an UNJUSTIFIED decision carrying a 21-character
          note is refused with ERR_JUSTIFICATION_TOO_SHORT and leaves review_status UNDER_REVIEW. The
          unconditional leg is also exercised: a 20-character justification_text is refused at session
          creation.
