      - name: corrective_action_projection_tracks_finding_status_and_reserve
        claim_type: projection
        grounds:
          - calculations.corrective_action_status
          - calculations.financial_assurance_requirement
          - state_machines.compliance_finding_lifecycle
        distinguishing_aspect: |
          One SNC finding drives the whole projection: NONE with no findings, OPEN on citation (reserve
          5,000,000, required 39,250,000), IN_PROGRESS once RESPONDED — where the reserve is still
          HELD, because open_snc_finding_count counts {OPEN, RESPONDED, REOPENED} while the projection
          only asks whether anything is OPEN or REOPENED — COMPLETED on closure, and back to OPEN with
          the reserve re-added on reopen. The projection and the counter read different status sets,
          so they must not be conflated.
        test_recipe:
          setup:
            - "Facility with assurance and no findings"
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-08-01T00:00:00Z" }
              as: PlatformAdmin
            - call: "POST /tsdf/facilities"
              payload: { name: "Ridgeline TSDF", epa_id: "TXD000111222", permit_number: "TX-HW-0091", permit_expires_at: "2027-06-30T00:00:00Z", permitted_methods: ["INCINERATION"], max_concurrent_treatment_batches: 5, post_closure_cost_cents: 8000000 }
              as: PlatformAdmin
              captures: { fac_id: $.data.id, fac_v: $.data.version }
            - call: "POST /tsdf/financial-assurance-instruments"
              payload: { facility_id: "${fac_id}", instrument_type: "TRUST_FUND", face_amount_cents: 90000000, effective_on: "2026-07-01", expected_facility_version: "${fac_v}" }
              as: ComplianceManager
          trigger:
            - call: "POST /tsdf/compliance-findings"
              payload: { facility_id: "${fac_id}", finding_class: "SNC", citation_code: "40CFR264.15", corrective_action_due_at: "2026-09-30T00:00:00Z", is_prior_release: true }
              as: RegulatoryInspector
              as_user_id: "insp-01"
              captures: { find_id: $.data.id }
            - call: "POST /tsdf/compliance-findings/${find_id}/status"
              payload: { to_status: "RESPONDED", corrective_action_completed_on: "2026-08-01", reason_code: "RELEASE_REMEDIATED" }
              as: ComplianceManager
              as_user_id: "cm-01"
            - call: "POST /tsdf/compliance-findings/${find_id}/status"
              payload: { to_status: "CLOSED" }
              as: RegulatoryInspector
              as_user_id: "insp-01"
            - call: "POST /tsdf/compliance-findings/${find_id}/status"
              payload: { to_status: "REOPENED", reason_code: "RELEASE_RECURRED" }
              as: RegulatoryInspector
              as_user_id: "insp-01"
          assert:
            - "Before the first trigger: Facility.${fac_id}.corrective_action_status == NONE and required_assurance_cents == 34250000"
            - "After citation: status == 201, ComplianceFinding.${find_id}.status == OPEN, is_prior_release == true, reopen_count == 0"
            - "After citation: Facility.${fac_id}.corrective_action_status == OPEN, open_snc_finding_count == 1, corrective_action_reserve_cents == 5000000, required_assurance_cents == 39250000"
            - "After RESPONDED: Facility.${fac_id}.corrective_action_status == IN_PROGRESS, open_snc_finding_count == 1, corrective_action_reserve_cents == 5000000, required_assurance_cents == 39250000"
            - "After CLOSED: Facility.${fac_id}.corrective_action_status == COMPLETED, open_snc_finding_count == 0, corrective_action_reserve_cents == 0, required_assurance_cents == 34250000"
            - "After REOPENED: ComplianceFinding.${find_id}.reopen_count == 1 and corrective_action_due_at == 2026-08-31T00:00:00Z"
            - "After REOPENED: Facility.${fac_id}.corrective_action_status == OPEN, open_snc_finding_count == 1, corrective_action_reserve_cents == 5000000, required_assurance_cents == 39250000"
            - "Facility.${fac_id}.assurance_shortfall_cents == 0 throughout, because 90000000 covers every figure above"

      - name: calculation_assurance_tier_selected_from_pre_surcharge_base
        claim_type: tiered_pricing
        grounds:
          - calculations.financial_assurance_requirement
        excluded_because:
          difficulty_instance: financial_assurance_tier_keyed_on_closure_cost_not_total
          rationale: |
            That §1.8 instance is built on exactly this ordering trap (tier from the pre-surcharge
            base, never re-derived from the surcharged total) and asserts the tier boundary in both
            directions; a corner test would restate it with weaker numbers.

      - name: calculation_line_charges_rounded_before_summation
        claim_type: aggregation
        grounds:
          - calculations.acceptance_charge
        excluded_because:
          difficulty_instance: line_charge_rounds_per_line_then_sums
          rationale: |
            The per-line-then-sum rounding order is the entire subject of that §1.8 instance, whose
            two-line construction differs by one cent from the wrong order. Duplicating it here adds
            no discrimination.

      - name: calculation_charge_variants_diverge_after_adjustment
        claim_type: variant_divergence
        grounds:
          - calculations.acceptance_charge.variants
        excluded_because:
          difficulty_instance: manifest_charge_provisional_vs_final_diverges
          rationale: |
            PROVISIONAL vs FINAL divergence (different included_lines AND different quantity field)
            is that §1.8 instance's premise, including the negative charge_adjustment_cents; this
            corner would be a subset.

      - name: calculation_reliability_variants_use_different_manifest_sets
        claim_type: variant_selection
        grounds:
          - calculations.generator_reliability_score.variants
        excluded_because:
          difficulty_instance: generator_reliability_rolling_vs_lifetime_diverges
          rationale: |
            Window-vs-lifetime set selection is asserted there with four closed manifests and the
            rolling window deliberately excluding the oldest; the corner above only pins the shared
            input filter (closed manifests), which is complementary rather than duplicative.

      - name: calculation_sample_deviation_exactly_at_full_tolerance
        claim_type: threshold
        grounds:
          - calculations.sample_acceptance_evaluation
        excluded_because:
          difficulty_instance: waste_profile_sample_failure_resubmit_cycle
          rationale: |
            That §1.8 chain already lands a sample at exactly 0.1000 deviation under the FULL
            tolerance and asserts the inclusive PASS, together with the attempt-count escalation that
            put the profile on FULL in the first place.

      - name: calculation_treatment_window_buffer_interval_merge
        claim_type: interval_merge
        grounds:
          - calculations.treatment_window_conflict
        excluded_because:
          difficulty_instance: unit_batch_class_change_buffer_overlap_rejected
          rationale: |
            The half-open interval arithmetic plus the class-inequality decontamination buffer is
            exercised there at the exact minute where the buffer decides the outcome; a coarser
            corner test would only re-check non-overlap.

  # ===========================================================================
  # 4. From Table 4 (Validation Rules)
  # ===========================================================================
  - section: validations
    instances:
      - name: role_check_precedes_existence_check_unauthorized
        claim_type: priority_ordering
        grounds:
          - validations[priority=2]
          - validations[priority=5]
          - errors[ERR_ROLE_NOT_PERMITTED]
        distinguishing_aspect: |
          A Generator asking for a facility id that does not exist must be told 403, not 404: the
          authorization gate at priority 2 runs before the existence gate at priority 5, so the API
          never leaks whether an out-of-scope resource exists.
        test_recipe:
          setup:
            - "One ACTIVE generator; no facility with the probed id"
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-08-01T00:00:00Z" }
              as: PlatformAdmin
            - call: "POST /tsdf/generators"
              payload: { epa_id: "TXR000555666", name: "Bayou Coatings", generator_category: "LQG", state_code: "TX" }
              as: PlatformAdmin
              captures: { gen_id: $.data.id }
          trigger:
            - call: "GET /tsdf/facilities/3f1b9c7e-0000-4000-8000-0000000000aa"
              payload: {}
              as: Generator
              as_user_id: "${gen_id}"
          assert:
            - "response status == 403 and data.error_id == ERR_ROLE_NOT_PERMITTED"
            - "data.error_id != ERR_FACILITY_NOT_FOUND"

      - name: aggregate_capacity_across_existing_containers_rejected
        claim_type: aggregate_validation
        grounds:
          - validations[priority=34]
          - entities.StorageUnit.fields.utilization_pct
          - errors[ERR_STORAGE_CAPACITY_EXCEEDED]
        distinguishing_aspect: |
          The capacity rule is an aggregate over the unit, not a per-container check: a 200.0 kg drum
          is refused by a unit permitted for 1000.0 kg that already holds 900.0 kg, even though the
          drum itself is small, the line has 1100.0 kg left to draw on (so priority 31 is satisfied)
          and the unit's posture is merely RESTRICTED rather than blocked. The line is deliberately
          accepted at 2000.0 kg so that priority 31 stays out of the way and priority 34 is the only
          rule that can fire.
        test_recipe:
          setup:
            - "Facility with assurance; unit CA-01 permitted for 1000.0 kg; manifest line accepted 2000.0 kg"
            - "One 900.0 kg container already in CA-01"
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-08-01T00:00:00Z" }
