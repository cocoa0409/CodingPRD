  # ===========================================================================
  # Rule 5 — priority_pair_validation_conflict (2 instances, different error-category pairs)
  # ===========================================================================
  - rule_id: priority_pair_validation_conflict
    instances:
      - name: state_vs_business_temporal_on_reschedule
        grounds:
          - validations[priority=4]
          - validations[priority=5]
          - errors[ERR_INVALID_STATE]
          - errors[ERR_SLOT_TOO_SOON]
        distinguishing_aspect: |
          Category pair (state, business_temporal): a reschedule request on a booking
          that is ALREADY terminal (CANCELLED_BY_CLIENT) AND carries a too-soon
          new_start_utc violates both priority 4 (state) and priority 5 (temporal);
          the state error MUST win because state preconditions are evaluated first.
        test_recipe:
          setup:
            - "Market DEN; photographer P; agent A; booking cancelled from DRAFT"
            - "Request then attempts reschedule with new_start_utc only 1h in the future"
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-01T00:00:00Z" }
              as: OpsAdmin
            - call: "POST /markets"
              payload: { market_code: "DEN", display_name: "Denver", pricing_multiplier_bps: 10000, standard_turnaround_hours: 48 }
              as: OpsAdmin
              captures: { mkt: $.data.id }
            - call: "POST /client-agents"
              payload: { brokerage_name: "BrokerCo", full_name: "Agent Ann", email: "ann@x.com", home_market_id: "${mkt}" }
              as: OpsAdmin
              captures: { agent: $.data.id }
            - call: "POST /shoot-bookings"
              payload: { order_ref: "ORD-PRIO1", market_id: "${mkt}", property_address: "1 Nowhere", equipment_package: "STANDARD", photo_count: 20, scheduled_start_utc: "2026-08-10T14:00:00Z" }
              as: ClientAgent
              as_user_id: "${agent}"
              captures: { bk: $.data.id }
            - call: "POST /shoot-bookings/${bk}/cancel"
              payload: {}
              as: ClientAgent
              as_user_id: "${agent}"
            - call: "GET /shoot-bookings/${bk}"
              payload: {}
              as: ClientAgent
              as_user_id: "${agent}"
              captures: { bk_v_live: $.data.version }
          trigger:
            - call: "POST /shoot-bookings/${bk}/reschedule"
              payload: { expected_booking_version: "${bk_v_live}", kind: "CLIENT", new_start_utc: "2026-08-01T01:00:00Z", reason_code: "SELLER_DELAY" }
              as: ClientAgent
              as_user_id: "${agent}"
              captures: { err: $.data.error_id }
          assert:
            - "error_id == ERR_BOOKING_NOT_RESCHEDULABLE (the state-machine-named domain error for this trigger; priority 4 state beats priority 5 temporal), NOT ERR_SLOT_TOO_SOON"
            - "HTTP status == 409"

      - name: business_safety_vs_business_constraint_on_assign
        grounds:
          - validations[priority=6]
          - validations[priority=7]
          - errors[ERR_DRONE_CERT_REQUIRED]
          - errors[ERR_PHOTOGRAPHER_DOUBLE_BOOKED]
        distinguishing_aspect: |
          Category pair (business_safety, business_constraint): an assign request
          where the photographer BOTH lacks drone certification (safety, priority 6)
          AND is temporally double-booked (constraint, priority 7) MUST return the
          safety error — airspace/certification checks dominate scheduling checks.
        test_recipe:
          setup:
            - "Market DEN; photographers P1 (drone_certified=false) and P2 (drone_certified=true)"
            - "Booking B1 assigned to P1-free slot first for P2? No — set up: booking B1 (no drone) assigned+confirmed to P2 at 2026-08-10T14:00:00Z occupying P2"
            - "Booking B2 with DRONE_STILLS, READY, scheduled 2026-08-10T14:30:00Z (overlaps B1 for any photographer); attempt to assign B2 to P2 (certified but double-booked) — wait: to trigger BOTH violations on ONE photographer, use P_UNCERT (certified=false) who is also already committed at that window via booking B1"
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-01T00:00:00Z" }
              as: OpsAdmin
            - call: "POST /markets"
              payload: { market_code: "DEN", display_name: "Denver", pricing_multiplier_bps: 10000, standard_turnaround_hours: 48, travel_buffer_minutes: 45 }
              as: OpsAdmin
              captures: { mkt: $.data.id }
            - call: "POST /photographers"
              payload: { market_id: "${mkt}", full_name: "Uncert Uma", email: "uma@x.com", equipment_packages: ["STANDARD"], drone_certified: false }
              as: OpsAdmin
              captures: { p_uncert: $.data.id }
            - call: "POST /client-agents"
              payload: { brokerage_name: "BrokerCo", full_name: "Agent Ann", email: "ann@x.com", home_market_id: "${mkt}" }
              as: OpsAdmin
              captures: { agent: $.data.id }
            # B1 occupies p_uncert 2026-08-10T14:00:00Z (60 min)
            - call: "POST /shoot-bookings"
              payload: { order_ref: "ORD-OCC", market_id: "${mkt}", property_address: "2 Busy St", equipment_package: "STANDARD", photo_count: 20, scheduled_start_utc: "2026-08-10T14:00:00Z" }
