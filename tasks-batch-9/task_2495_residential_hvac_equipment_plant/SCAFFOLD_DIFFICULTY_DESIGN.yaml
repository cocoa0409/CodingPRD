scaffold_difficulty_design:
  - rule_id: dual_variant_calc
    instances:
      - name: leak_verdict_diverges_by_method_on_same_magnitude
        grounds:
          - calculations.leak_test_verdict
          - entities.LeakTest.fields.method
          - entities.LeakTest.fields.applied_limit
          - entities.RefrigerantProgram.fields.flammability_class
          - state_machines.BuildOrder.BRAZED_to_LEAK_PASSED
          - state_machines.BuildOrder.BRAZED_to_REWORK
        distinguishing_aspect: |
          The two variants of leak_test_verdict are selected by LeakTest.method and consume different
          measurement fields and different constants, so the identical numeric magnitude 1.90 clears
          the PRESSURE_DECAY limit of 2.00 kPa over a 30-minute hold yet busts the
          HELIUM_MASS_SPEC limit of 1.500 g/year on the same A2L platform - one lot advances to
          LEAK_PASSED while the other falls into REWORK.
        test_recipe:
          setup:
            - "Logical clock at 2026-08-01T00:00:00Z."
            - "An ACTIVE A2L refrigerant program (R-454B) whose manufacture cutoff is 2027-01-01T00:00:00Z, so the A2L tightening factor 0.500 applies to both leak limits."
            - "A RELEASED HIGH-tier platform on that program with max_charge_grams 1800."
            - "Two build lots on that platform, both at BRAZED; lot 1 already carries a passing pressure-decay test."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-08-01T00:00:00Z" }
              as: PlantAdmin
            - call: "POST /plant/refrigerant-programs"
              payload: { refrigerant_code: "R-454B", gwp: 466, flammability_class: "A2L", manufacture_cutoff_utc: "2027-01-01T00:00:00Z", sell_through_deadline_utc: "2027-07-01T00:00:00Z" }
              as: PlantAdmin
              captures: { prog_id: $.data.id }
            - call: "POST /plant/product-platforms"
              payload: { model_code: "HX-3600-A2L", efficiency_tier: "HIGH", refrigerant_program_id: "${prog_id}", rated_capacity_btuh: 36000, rated_eer: 12.50, rated_seer2: 15.80, compressor_part_number: "CMP-5T-A2L", control_board_part_number: "CTL-9X", max_charge_grams: 1800 }
              as: DesignEngineer
              as_user_id: "user-de-1"
              captures: { plat_id: $.data.id }
            - call: "POST /plant/product-platforms/${plat_id}/submit-engineering-review"
              payload: {}
              as: DesignEngineer
              as_user_id: "user-de-1"
            - call: "POST /plant/product-platforms/${plat_id}/release"
              payload: {}
              as: ReliabilityEngineer
              as_user_id: "user-re-1"
            - call: "POST /plant/build-orders"
              payload: { platform_id: "${plat_id}", quantity_units: 12, scheduled_start_utc: "2026-08-05T06:00:00Z" }
              as: ProductionPlanner
              captures: { bo1_id: $.data.id }
            - call: "POST /plant/build-orders/${bo1_id}/start-coil-fab"
              payload: {}
              as: ProductionTechnician
            - call: "POST /plant/build-orders/${bo1_id}/complete-brazing"
              payload: {}
              as: ProductionTechnician
            - call: "POST /plant/leak-tests"
              payload: { build_order_id: "${bo1_id}", method: "PRESSURE_DECAY", decay_kpa: 1.90, hold_minutes: 30 }
              as: QualityTechnician
              as_user_id: "user-qt-1"
              captures: { lt1_id: $.data.id }
            - call: "POST /plant/build-orders"
              payload: { platform_id: "${plat_id}", quantity_units: 12, scheduled_start_utc: "2026-08-06T06:00:00Z" }
              as: ProductionPlanner
              captures: { bo2_id: $.data.id }
            - call: "POST /plant/build-orders/${bo2_id}/start-coil-fab"
              payload: {}
              as: ProductionTechnician
            - call: "POST /plant/build-orders/${bo2_id}/complete-brazing"
              payload: {}
              as: ProductionTechnician
          trigger:
            - call: "POST /plant/leak-tests"
              payload: { build_order_id: "${bo2_id}", method: "HELIUM_MASS_SPEC", measured_leak_rate_g_per_year: 1.90 }
              as: QualityTechnician
              as_user_id: "user-qt-1"
              captures: { lt2_id: $.data.id }
          assert:
            - "HTTP 201; trigger response data.applied_limit == 1.500 and data.verdict == FAIL"
            - "LeakTest.${lt1_id}.applied_limit == 2.00 and LeakTest.${lt1_id}.verdict == PASS"
            - "BuildOrder.${bo1_id}.status == LEAK_PASSED and BuildOrder.${bo1_id}.latest_leak_verdict == PASS and BuildOrder.${bo1_id}.rework_count == 0"
            - "BuildOrder.${bo2_id}.status == REWORK and BuildOrder.${bo2_id}.latest_leak_verdict == FAIL and BuildOrder.${bo2_id}.rework_count == 1"
            - "GET /plant/build-orders/${bo2_id}/leak-tests returns exactly 1 record whose method == HELIUM_MASS_SPEC and applied_limit == 1.500"

      - name: allocation_preview_waterfall_grants_80_prorata_grants_57
        grounds:
          - calculations.allocation_fill_plan
          - entities.ComponentSupply.fields.allocation_policy
          - entities.DistributorOrder.fields.allocated_units
          - entities.DistributorOrder.fields.allocation_status
        distinguishing_aspect: |
          The PRIORITY_WATERFALL variant lets the order in front take the whole kit capacity
          (min(80, 100) = 80) while the DEMAND_PRORATA variant caps the same order at a
          demand-weighted slice (floor(100 * 80 / 140) = 57) of the identical pool, so one pool and
          one order yield two different grants purely from the variant selector - a 23-unit delta.
        test_recipe:
          setup:
            - "Logical clock at 2026-08-01T00:00:00Z."
            - "A RELEASED HIGH-tier A2L platform whose compressor part is CMP-5T-A2L and control board part is CTL-9X."
            - "For supply month 2026-11: one compressor supply row of 100 allocatable units and one control-board supply row of 100 allocatable units, both PRIORITY_WATERFALL, both untouched (available_units 100)."
            - "Two PENDING, UNALLOCATED distributor orders on that platform for delivery month 2026-11: order A for 80 units and order B for 60 units, so total_open_demand is 140 and kit_capacity is 100."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-08-01T00:00:00Z" }
              as: PlantAdmin
            - call: "POST /plant/refrigerant-programs"
              payload: { refrigerant_code: "R-454B", gwp: 466, flammability_class: "A2L", manufacture_cutoff_utc: "2027-01-01T00:00:00Z", sell_through_deadline_utc: "2027-07-01T00:00:00Z" }
              as: PlantAdmin
              captures: { prog_id: $.data.id }
            - call: "POST /plant/product-platforms"
              payload: { model_code: "HX-3600-A2L", efficiency_tier: "HIGH", refrigerant_program_id: "${prog_id}", rated_capacity_btuh: 36000, rated_eer: 12.50, rated_seer2: 15.80, compressor_part_number: "CMP-5T-A2L", control_board_part_number: "CTL-9X", max_charge_grams: 1800 }
              as: DesignEngineer
              as_user_id: "user-de-1"
              captures: { plat_id: $.data.id }
            - call: "POST /plant/product-platforms/${plat_id}/submit-engineering-review"
              payload: {}
              as: DesignEngineer
              as_user_id: "user-de-1"
            - call: "POST /plant/product-platforms/${plat_id}/release"
              payload: {}
              as: ReliabilityEngineer
              as_user_id: "user-re-1"
            - call: "POST /plant/component-supplies"
              payload: { component_type: "COMPRESSOR", part_number: "CMP-5T-A2L", supplier_lot_code: "LOT-CMP-51", supply_month: "2026-11", total_allocatable_units: 100, allocation_policy: "PRIORITY_WATERFALL" }
              as: SupplyPlanner
              captures: { cmp_id: $.data.id }
            - call: "POST /plant/component-supplies"
              payload: { component_type: "CONTROL_BOARD", part_number: "CTL-9X", supplier_lot_code: "LOT-CTL-77", supply_month: "2026-11", total_allocatable_units: 100, allocation_policy: "PRIORITY_WATERFALL" }
              as: SupplyPlanner
              captures: { ctl_id: $.data.id }
            - call: "POST /plant/distributor-orders"
              payload: { distributor_code: "DIST-A", platform_id: "${plat_id}", region_code: "SOUTHEAST", requested_units: 80, priority_score: 90, requested_delivery_month: "2026-11" }
              as: DistributorRep
              as_user_id: "user-dr-1"
              captures: { ord_a_id: $.data.id }
            - call: "POST /plant/distributor-orders"
              payload: { distributor_code: "DIST-B", platform_id: "${plat_id}", region_code: "SOUTHEAST", requested_units: 60, priority_score: 40, requested_delivery_month: "2026-11" }
              as: DistributorRep
              as_user_id: "user-dr-2"
              captures: { ord_b_id: $.data.id }
          trigger:
            - call: "GET /plant/distributor-orders/${ord_a_id}/allocation-preview?policy=PRIORITY_WATERFALL"
              payload: { policy: "PRIORITY_WATERFALL" }
              as: SupplyPlanner
            - call: "GET /plant/distributor-orders/${ord_a_id}/allocation-preview?policy=DEMAND_PRORATA"
              payload: { policy: "DEMAND_PRORATA" }
              as: SupplyPlanner
          assert:
            - "First trigger response: data.granted_units == 80, data.kit_capacity == 100, data.remaining_need == 80, data.total_open_demand == 140"
            - "Second trigger response: data.granted_units == 57 (floor(100 * 80 / 140)), with the same data.kit_capacity == 100 and data.total_open_demand == 140"
            - "ComponentSupply.${cmp_id}.available_units == 100 and ComponentSupply.${ctl_id}.available_units == 100 - the preview mutates nothing"
            - "DistributorOrder.${ord_a_id}.allocation_status == UNALLOCATED and DistributorOrder.${ord_a_id}.allocated_units == 0"
            - "GET /plant/distributor-orders/${ord_a_id}/allocation-lines returns 0 records"

  - rule_id: combinatorial_formula
    instances:
      - name: run_test_tolerance_cell_high_a2l_passes_on_relaxed_pair
        grounds:
          - calculations.run_test_performance_verdict
          - entities.ProductPlatform.fields.efficiency_tier
          - entities.RefrigerantProgram.fields.flammability_class
          - entities.RunTest.fields.applied_capacity_tolerance
          - entities.RunTest.fields.applied_efficiency_tolerance
          - state_machines.BuildOrder.CHARGED_to_RUN_PASSED
        distinguishing_aspect: |
          Both tolerances are read from one cell of a 3-tier x 2-flammability-class table that is not
          separable into a tier factor and a class factor: the (HIGH, A2L) cell is 0.9600 / 0.9400
          while (HIGH, A1) is 0.9700 / 0.9500 and (PREMIUM, A2L) is 0.9800 / 0.9600 - identical to
          (PREMIUM, A1). The measured pair capacity_ratio 0.9650 / efficiency_ratio 0.9450 therefore
          PASSES only in the (HIGH, A2L) cell and fails in either neighbour.
        test_recipe:
          setup:
            - "Logical clock at 2026-08-01T00:00:00Z."
            - "An ACTIVE A2L program and a RELEASED HIGH-tier platform rated 36000 BTU/h, EER 12.50, max_charge_grams 1800."
            - "Test cell CELL-1 with the default 30-minute cooldown and no prior run tests."
            - "One build lot on that platform at CHARGED with 1750 g of refrigerant, whose passing leak test was performed by user-qt-1."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-08-01T00:00:00Z" }
              as: PlantAdmin
            - call: "POST /plant/refrigerant-programs"
              payload: { refrigerant_code: "R-454B", gwp: 466, flammability_class: "A2L", manufacture_cutoff_utc: "2027-01-01T00:00:00Z", sell_through_deadline_utc: "2027-07-01T00:00:00Z" }
              as: PlantAdmin
              captures: { prog_id: $.data.id }
            - call: "POST /plant/test-cells"
              payload: { cell_code: "CELL-1" }
              as: PlantAdmin
              captures: { cell_id: $.data.id }
            - call: "POST /plant/product-platforms"
              payload: { model_code: "HX-3600-A2L", efficiency_tier: "HIGH", refrigerant_program_id: "${prog_id}", rated_capacity_btuh: 36000, rated_eer: 12.50, rated_seer2: 15.80, compressor_part_number: "CMP-5T-A2L", control_board_part_number: "CTL-9X", max_charge_grams: 1800 }
              as: DesignEngineer
              as_user_id: "user-de-1"
              captures: { plat_id: $.data.id }
            - call: "POST /plant/product-platforms/${plat_id}/submit-engineering-review"
              payload: {}
              as: DesignEngineer
              as_user_id: "user-de-1"
            - call: "POST /plant/product-platforms/${plat_id}/release"
              payload: {}
              as: ReliabilityEngineer
              as_user_id: "user-re-1"
            - call: "POST /plant/build-orders"
              payload: { platform_id: "${plat_id}", quantity_units: 12, scheduled_start_utc: "2026-08-05T06:00:00Z" }
              as: ProductionPlanner
              captures: { bo_id: $.data.id }
            - call: "POST /plant/build-orders/${bo_id}/start-coil-fab"
              payload: {}
              as: ProductionTechnician
            - call: "POST /plant/build-orders/${bo_id}/complete-brazing"
              payload: {}
              as: ProductionTechnician
            - call: "POST /plant/leak-tests"
              payload: { build_order_id: "${bo_id}", method: "HELIUM_MASS_SPEC", measured_leak_rate_g_per_year: 1.20 }
              as: QualityTechnician
              as_user_id: "user-qt-1"
            - call: "POST /plant/build-orders/${bo_id}/charge"
              payload: { charge_grams: 1750 }
              as: ProductionTechnician
          trigger:
            - call: "POST /plant/run-tests"
              payload: { build_order_id: "${bo_id}", test_cell_id: "${cell_id}", window_start_utc: "2026-08-05T08:00:00Z", window_end_utc: "2026-08-05T09:00:00Z", measured_capacity_btuh: 35450, measured_power_w: 2941, measured_ambient_c: 30.0 }
              as: QualityTechnician
              as_user_id: "user-qt-2"
              captures: { rt_id: $.data.id }
          assert:
            - "HTTP 201; trigger response data.corrected_capacity_btuh == 34741 (round(35450 * (1 + 0.0040 * (30.0 - 35.0)), 0))"
            - "data.capacity_ratio == 0.9650 and data.efficiency_ratio == 0.9450"
            - "data.applied_capacity_tolerance == 0.9600 and data.applied_efficiency_tolerance == 0.9400"
            - "data.verdict == PASS"
            - "BuildOrder.${bo_id}.status == RUN_PASSED and BuildOrder.${bo_id}.latest_run_verdict == PASS and BuildOrder.${bo_id}.rework_count == 0"
            - "GET /plant/test-cells/${cell_id}/run-tests returns exactly 1 record whose id == ${rt_id}"

      - name: derate_matrix_control_board_band_10_plus_yields_50_not_100
        grounds:
          - calculations.supply_derate_plan
          - calculations.platform_warranty_claim_rate
          - calculations.platform_warranty_posture
          - calculations.supply_effective_capacity
          - entities.SupplierCorrectiveAction.fields.derate_pct
          - entities.SupplierCorrectiveAction.fields.cited_claim_count
          - state_machines.ComponentSupply.ACTIVE_to_DERATED
        distinguishing_aspect: |
          derate_pct is a cell of a (component_type x rate-band) table whose CONTROL_BOARD column is
          flat at 25 across the two lower bands and tops out at 50, while the COMPRESSOR column runs
          25 / 50 / 100. At one and the same platform rate of 15.00 percent the control-board lot is
          derated 50 and the compressor lot in the same database is untouched, so neither dimension
          alone predicts the result.
        test_recipe:
          setup:
            - "Logical clock at 2026-08-01T00:00:00Z."
            - "A RELEASED HIGH-tier A2L platform with one build lot of 20 units carried all the way to RELEASED_TO_STOCK, so units_built_released == 20."
            - "For supply month 2026-11: a compressor supply row for lot LOT-CMP-51 with 100 units and a control-board supply row for lot LOT-CTL-77 with 100 units, both ACTIVE and untouched."
            - "Two OPEN warranty claims naming COMPRESSOR / LOT-CMP-51 already filed; with 2 claims on 20 units the rate is 10.00 percent but the claim count is below MIN_CLAIMS_FOR_POSTURE, so warranty_posture is still OK and no corrective action exists."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-08-01T00:00:00Z" }
              as: PlantAdmin
            - call: "POST /plant/refrigerant-programs"
              payload: { refrigerant_code: "R-454B", gwp: 466, flammability_class: "A2L", manufacture_cutoff_utc: "2027-01-01T00:00:00Z", sell_through_deadline_utc: "2027-07-01T00:00:00Z" }
              as: PlantAdmin
              captures: { prog_id: $.data.id }
            - call: "POST /plant/test-cells"
              payload: { cell_code: "CELL-1" }
              as: PlantAdmin
              captures: { cell_id: $.data.id }
            - call: "POST /plant/product-platforms"
              payload: { model_code: "HX-3600-A2L", efficiency_tier: "HIGH", refrigerant_program_id: "${prog_id}", rated_capacity_btuh: 36000, rated_eer: 12.50, rated_seer2: 15.80, compressor_part_number: "CMP-5T-A2L", control_board_part_number: "CTL-9X", max_charge_grams: 1800 }
              as: DesignEngineer
              as_user_id: "user-de-1"
              captures: { plat_id: $.data.id }
            - call: "POST /plant/product-platforms/${plat_id}/submit-engineering-review"
              payload: {}
              as: DesignEngineer
              as_user_id: "user-de-1"
            - call: "POST /plant/product-platforms/${plat_id}/release"
              payload: {}
              as: ReliabilityEngineer
              as_user_id: "user-re-1"
            - call: "POST /plant/build-orders"
              payload: { platform_id: "${plat_id}", quantity_units: 20, scheduled_start_utc: "2026-08-05T06:00:00Z" }
              as: ProductionPlanner
              captures: { bo_id: $.data.id }
            - call: "POST /plant/build-orders/${bo_id}/start-coil-fab"
              payload: {}
              as: ProductionTechnician
            - call: "POST /plant/build-orders/${bo_id}/complete-brazing"
              payload: {}
              as: ProductionTechnician
            - call: "POST /plant/leak-tests"
              payload: { build_order_id: "${bo_id}", method: "HELIUM_MASS_SPEC", measured_leak_rate_g_per_year: 1.20 }
              as: QualityTechnician
              as_user_id: "user-qt-1"
            - call: "POST /plant/build-orders/${bo_id}/charge"
              payload: { charge_grams: 1750 }
              as: ProductionTechnician
            - call: "POST /plant/run-tests"
              payload: { build_order_id: "${bo_id}", test_cell_id: "${cell_id}", window_start_utc: "2026-08-05T08:00:00Z", window_end_utc: "2026-08-05T09:00:00Z", measured_capacity_btuh: 36000, measured_power_w: 2850, measured_ambient_c: 33.0 }
              as: QualityTechnician
              as_user_id: "user-qt-2"
            - call: "POST /plant/build-orders/${bo_id}/release-to-stock"
              payload: {}
              as: ProductionPlanner
            - call: "POST /plant/component-supplies"
              payload: { component_type: "COMPRESSOR", part_number: "CMP-5T-A2L", supplier_lot_code: "LOT-CMP-51", supply_month: "2026-11", total_allocatable_units: 100, allocation_policy: "PRIORITY_WATERFALL" }
              as: SupplyPlanner
              captures: { cmp_id: $.data.id }
            - call: "POST /plant/component-supplies"
              payload: { component_type: "CONTROL_BOARD", part_number: "CTL-9X", supplier_lot_code: "LOT-CTL-77", supply_month: "2026-11", total_allocatable_units: 100, allocation_policy: "PRIORITY_WATERFALL" }
              as: SupplyPlanner
              captures: { ctl_id: $.data.id }
            - call: "POST /plant/warranty-claims"
              payload: { platform_id: "${plat_id}", failure_code: "COMPRESSOR_FAILURE", claim_cost_cents: 41500, component_type: "COMPRESSOR", supplier_lot_code: "LOT-CMP-51" }
              as: WarrantyAnalyst
              as_user_id: "user-wa-1"
              captures: { wc1_id: $.data.id }
            - call: "POST /plant/warranty-claims"
              payload: { platform_id: "${plat_id}", failure_code: "COMPRESSOR_FAILURE", claim_cost_cents: 39900, component_type: "COMPRESSOR", supplier_lot_code: "LOT-CMP-51" }
              as: WarrantyAnalyst
              as_user_id: "user-wa-1"
              captures: { wc2_id: $.data.id }
          trigger:
            - call: "POST /plant/warranty-claims"
              payload: { platform_id: "${plat_id}", failure_code: "CONTROL_BOARD_FAULT", claim_cost_cents: 18200, component_type: "CONTROL_BOARD", supplier_lot_code: "LOT-CTL-77" }
              as: WarrantyAnalyst
              as_user_id: "user-wa-1"
              captures: { wc3_id: $.data.id }
          assert:
            - "HTTP 201; ProductPlatform.${plat_id}.rolling_claim_rate_pct == 15.00 (100 * 3 / 20) and ProductPlatform.${plat_id}.warranty_posture == DESIGN_CHANGE_REQUIRED"
            - "GET /plant/component-supplies/${ctl_id}/corrective-actions returns exactly 1 record with status == OPEN, component_type == CONTROL_BOARD, derate_pct == 50, cited_claim_count == 1, trigger_claim_rate_pct == 15.00"
            - "ComponentSupply.${ctl_id}.status == DERATED, derate_pct == 50, effective_allocatable_units == 50 (floor(100 * 50 / 100)), reserved_units == 0, available_units == 50"
            - "ComponentSupply.${cmp_id}.status == ACTIVE, derate_pct == 0, effective_allocatable_units == 100, available_units == 100 - the compressor lot is untouched even though it carries two of the three claims, because the crossing claim named the control board"
            - "GET /plant/component-supplies/${cmp_id}/corrective-actions returns 0 records"
            - "WarrantyClaim.${wc3_id}.status == LINKED_TO_CAPA while WarrantyClaim.${wc1_id}.status == OPEN and WarrantyClaim.${wc2_id}.status == OPEN"

  - rule_id: non_linear_state_machine
    instances:
      - name: third_leak_failure_scraps_lot_after_two_rework_cycles
        grounds:
          - state_machines.BuildOrder.BRAZED_to_REWORK
          - state_machines.BuildOrder.REWORK_to_COIL_FAB
          - state_machines.BuildOrder.BRAZED_to_SCRAPPED
          - entities.BuildOrder.fields.rework_count
          - entities.BuildOrder.fields.closed_reason
          - calculations.leak_test_verdict
        distinguishing_aspect: |
          One and the same trigger - a failing pressure-decay leak test on a BRAZED lot - lands in
          REWORK the first two times and in the terminal SCRAPPED state the third time, because the
          transition target is a function of the accumulated rework_count rather than of the current
          state alone; the lot loops COIL_FAB -> BRAZED -> REWORK -> COIL_FAB twice before the cycle
          budget is exhausted.
        test_recipe:
          setup:
            - "Logical clock at 2026-08-01T00:00:00Z."
            - "A RELEASED HIGH-tier A2L platform, so the pressure-decay allowance is 2.00 kPa over a 30-minute hold."
            - "One build lot that has already failed two leak tests, gone twice round the rework loop, and is at BRAZED for the third time with rework_count == 2."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-08-01T00:00:00Z" }
              as: PlantAdmin
            - call: "POST /plant/refrigerant-programs"
              payload: { refrigerant_code: "R-454B", gwp: 466, flammability_class: "A2L", manufacture_cutoff_utc: "2027-01-01T00:00:00Z", sell_through_deadline_utc: "2027-07-01T00:00:00Z" }
              as: PlantAdmin
              captures: { prog_id: $.data.id }
            - call: "POST /plant/product-platforms"
              payload: { model_code: "HX-3600-A2L", efficiency_tier: "HIGH", refrigerant_program_id: "${prog_id}", rated_capacity_btuh: 36000, rated_eer: 12.50, rated_seer2: 15.80, compressor_part_number: "CMP-5T-A2L", control_board_part_number: "CTL-9X", max_charge_grams: 1800 }
              as: DesignEngineer
              as_user_id: "user-de-1"
              captures: { plat_id: $.data.id }
