            - "Car type CT-I (BOXCAR, build_hours 1, regulatory_life_years 25, line_count_family LINE-I) with WHEELSET WS-I at qty_per_car 2 and CASTING CS-I at qty_per_car 1; substitute WHEELSET WS-I2 exists as a second catalogue part."
            - "One DRAFT order of 1 car stands at version 1; endorsement E1 (WS-I -> WS-I2) is created by X-User-ID user-op-9 and endorsement E2 (CS-I -> WS-I2, decides_material true) by X-User-ID user-op-8, each against the version current at its own creation."
          setup_api_calls:
            - call: "POST /api/v1/_clock/set_current_utc"
              payload: { to_iso8601: "2026-09-01T00:00:00Z" }
