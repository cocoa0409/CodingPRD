# =============================================================================
# §1.9 Scaffold Corner Design — Home Oxygen & Respiratory Therapy Service
#
# Breadth probe over the §1.1-§1.7 surface of SCAFFOLD.yaml. Depth (the nine
# §0.5 Difficulty Rules) lives in SCAFFOLD_DIFFICULTY_DESIGN.yaml; a corner that
# a §1.8 instance already asserts is emitted here as an `excluded_because:` stub
# with NO test_recipe.
#
# Shared conventions for every test_recipe below
# ---------------------------------------------
# * Logical clock: every instance starts at the mandated startup default
#   2026-08-01T00:00:00Z. The clock only ever moves forward, and only through
#   POST /home-oxygen/_clock/set_current_utc, whose every advance runs the
#   certificate ACTIVE -> EXPIRED sweep and the contract-suspension cascade.
# * Opaque X-User-ID values (§1.7 identity: opaque). Unless a call carries an
#   explicit as_user_id, the acting id is the canonical one for its role:
#     u-mgr-1    BranchManager          u-intake-1  IntakeCoordinator
#     u-phys-1   Physician              u-audit-1   ComplianceAuditor
#     u-rt-1     RespiratoryTherapist   u-drv-1     DeliveryDriver
#     u-bill-1   BillingSpecialist
#   The certificate chain therefore satisfies segregation of duties by default:
#   submit u-intake-1, sign u-phys-1, approve u-audit-1 are three distinct ids.
# * A non-existent id is always the literal UUID
#   00000000-0000-0000-0000-0000000000ff, which no chain here ever creates.
# * The canonical GROUP_I study used across instances is
#   RESTING_ROOM_AIR / spo2_percent 87 / tested_at 2026-07-25T14:00:00Z, whose
#   validity window is 30 days: test_validity_expires_at 2026-08-24T14:00:00Z,
#   grace exhausted at 2026-09-08T14:00:00Z.
# * The canonical certificate (GROUP_I, 24 h/day, narrative_element_count 3,
#   portable consistent, length_of_need_months 99, drafted while the study is
#   current) scores 30 + 20 + 15 + 20 + 10 + 5 = 100.00 and so clears the
#   priority-50 threshold of 85.00 at submit and at approve.
# * Money is always whole cents. The two recurring monthly_allowable_cents
#   values are 6913 (COMPETITIVE_BID_SINGLE_PAYMENT: STATIONARY_CONCENTRATOR
#   5590 + PORTABLE_CONCENTRATOR 1323) and 5590 (stationary alone).
# =============================================================================
scaffold_corner_design:

  # ===========================================================================
  - section: entities
    instances:

      - name: branch_creation_returns_every_declared_field_in_the_success_envelope
        claim_type: creation
        grounds:
          - entities.Branch
          - endpoints[POST /home-oxygen/branches]
          - response_envelope.success
        distinguishing_aspect: |
          Creation of the topology root: the 201 body carries all six declared inputs plus the
          four common fields, wrapped in the §1.0 success envelope with response_type "object".
        test_recipe:
          setup:
            - "Empty database; the clock is at the startup default 2026-08-01T00:00:00Z."
          setup_api_calls: []
          trigger:
            - call: "POST /home-oxygen/branches"
              payload: { name: "Tampa Bay", state_code: "FL", competitive_bid_area: true, liquid_oxygen_certified: true, refill_capacity_per_day: 6, tank_exchange_buffer_minutes: 45 }
              as: BranchManager
              captures: { br_id: $.data.id }
          assert:
            - "HTTP 201 with body.response_type == \"object\" and body.meta carrying api_request_id and api_request_timestamp"
            - "body.data.name == \"Tampa Bay\", state_code == \"FL\", competitive_bid_area == true, liquid_oxygen_certified == true, refill_capacity_per_day == 6, tank_exchange_buffer_minutes == 45"
            - "body.data.id is a server-generated identifier, version == 1, and created_at == updated_at == 2026-08-01T00:00:00Z (the logical clock, not wall time)"
            - "GET /home-oxygen/branches/${br_id} returns the identical field values with response_type \"object\""

      - name: patient_creation_and_retrieval_round_trip
        claim_type: retrieval
        grounds:
          - entities.Patient
          - endpoints[POST /home-oxygen/patients]
          - endpoints[GET /home-oxygen/patients/{patient_id}]
        distinguishing_aspect: |
          A freshly admitted patient reads back with every computed field at its declared default
          (current_cmn_status NONE, risk score 0.0, risk_variant_applied NONE, compliance_hold
          false) because no certificate, setup or malfunction has touched the row yet.
        test_recipe:
          setup:
            - "One branch (Tampa Bay, FL)."
          setup_api_calls:
            - call: "POST /home-oxygen/branches"
              payload: { name: "Tampa Bay", state_code: "FL", competitive_bid_area: true, liquid_oxygen_certified: false, refill_capacity_per_day: 4, tank_exchange_buffer_minutes: 30 }
              as: BranchManager
              captures: { br_id: $.data.id }
          trigger:
            - call: "POST /home-oxygen/patients"
              payload: { mrn: "MRN-0200", full_name: "Ada Kovac", branch_id: "${br_id}", payer_type: "MEDICAID", mobility_profile: "LIMITED_AMBULATORY", altitude_feet: 1200 }
              as: IntakeCoordinator
              captures: { p_id: $.data.id }
            - call: "GET /home-oxygen/patients/${p_id}"
              payload: {}
              as: RespiratoryTherapist
          assert:
            - "The GET body equals the POST body field for field: mrn \"MRN-0200\", full_name \"Ada Kovac\", branch_id ${br_id}, payer_type MEDICAID, mobility_profile LIMITED_AMBULATORY, altitude_feet 1200"
            - "status == ACTIVE (the declared initial state), transfer_to_branch_id == null, transfer_effective_date == null"
            - "current_cmn_status == NONE, oxygen_safety_risk_score == 0.0, risk_variant_applied == NONE, compliance_hold == false"
            - "version == 1 on both responses — a GET never increments version"

      - name: equipment_unit_listing_with_filters_and_pagination
        claim_type: listing
        grounds:
          - endpoints[GET /home-oxygen/equipment-units]
          - response_envelope.pagination_fields
          - response_envelope.pagination_defaults
        distinguishing_aspect: |
          The fleet list combines a branch filter, a status filter and a limit smaller than the
          match count, so total_count must report the filtered population (not the page size) and
          has_more must be true on the first page and false on the second.
        test_recipe:
          setup:
            - "Two branches: Tampa Bay (FL) and Sarasota (FL)."
            - "Three IN_STOCK units at Tampa Bay (SC-1001, SC-1002, PC-2001) and one at Sarasota (SC-9001)."
          setup_api_calls:
            - call: "POST /home-oxygen/branches"
              payload: { name: "Tampa Bay", state_code: "FL", competitive_bid_area: true, liquid_oxygen_certified: false, refill_capacity_per_day: 4, tank_exchange_buffer_minutes: 30 }
              as: BranchManager
              captures: { br_id: $.data.id }
            - call: "POST /home-oxygen/branches"
              payload: { name: "Sarasota", state_code: "FL", competitive_bid_area: false, liquid_oxygen_certified: false, refill_capacity_per_day: 4, tank_exchange_buffer_minutes: 30 }
              as: BranchManager
              captures: { br2_id: $.data.id }
            - call: "POST /home-oxygen/equipment-units"
              payload: { branch_id: "${br_id}", serial_number: "SC-1001", model_code: "CONC-5L", equipment_class: "STATIONARY_CONCENTRATOR", max_continuous_lpm: 5.0, max_pulse_setting: 0, pm_interval_days: 365, next_pm_due_date: "2027-06-01" }
              as: BranchManager
            - call: "POST /home-oxygen/equipment-units"
              payload: { branch_id: "${br_id}", serial_number: "SC-1002", model_code: "CONC-5L", equipment_class: "STATIONARY_CONCENTRATOR", max_continuous_lpm: 5.0, max_pulse_setting: 0, pm_interval_days: 365, next_pm_due_date: "2027-05-01" }
              as: BranchManager
            - call: "POST /home-oxygen/equipment-units"
              payload: { branch_id: "${br_id}", serial_number: "PC-2001", model_code: "POC-3L", equipment_class: "PORTABLE_CONCENTRATOR", max_continuous_lpm: 3.0, max_pulse_setting: 5, pm_interval_days: 365, next_pm_due_date: "2027-06-01" }
              as: BranchManager
            - call: "POST /home-oxygen/equipment-units"
              payload: { branch_id: "${br2_id}", serial_number: "SC-9001", model_code: "CONC-5L", equipment_class: "STATIONARY_CONCENTRATOR", max_continuous_lpm: 5.0, max_pulse_setting: 0, pm_interval_days: 365, next_pm_due_date: "2027-06-01" }
              as: BranchManager
          trigger:
            - call: "GET /home-oxygen/equipment-units?branch_id=${br_id}&status=IN_STOCK&limit=2&offset=0"
              payload: { branch_id: "${br_id}", status: "IN_STOCK", limit: 2, offset: 0 }
              as: BranchManager
            - call: "GET /home-oxygen/equipment-units?branch_id=${br_id}&status=IN_STOCK&limit=2&offset=2"
              payload: { branch_id: "${br_id}", status: "IN_STOCK", limit: 2, offset: 2 }
              as: BranchManager
            - call: "GET /home-oxygen/equipment-units?model_code=CONC-5L"
              payload: { model_code: "CONC-5L" }
              as: ComplianceAuditor
          assert:
            - "First page: response_type == \"array\", 2 elements, total_count == 3, limit == 2, offset == 0, has_more == true"
            - "Second page: 1 element, total_count == 3, limit == 2, offset == 2, has_more == false"
            - "The Sarasota unit SC-9001 appears in neither page — the branch_id filter is applied before pagination"
            - "The model_code filter crosses branches: total_count == 3 (SC-1001, SC-1002, SC-9001) with default limit 10 and offset 0 applied"

      - name: invalid_pagination_arguments_rejected
        claim_type: listing
        grounds:
          - validations[priority=19]
          - errors[ERR_INVALID_PAGINATION]
          - response_envelope.pagination_defaults
        distinguishing_aspect: |
          The declared window is limit 1..100 and offset >= 0, so 0, 101 and -1 are each one step
          outside a different edge of it and all three must be refused before any row is read.
        test_recipe:
          setup:
            - "One branch exists so the collection is non-empty."
          setup_api_calls:
            - call: "POST /home-oxygen/branches"
              payload: { name: "Tampa Bay", state_code: "FL" }
              as: BranchManager
          trigger:
            - call: "GET /home-oxygen/branches?limit=0"
              payload: { limit: 0 }
              as: BranchManager
              captures: { e1: $.data.error_id }
            - call: "GET /home-oxygen/branches?limit=101"
              payload: { limit: 101 }
              as: BranchManager
              captures: { e2: $.data.error_id }
            - call: "GET /home-oxygen/branches?offset=-1"
              payload: { offset: -1 }
              as: BranchManager
              captures: { e3: $.data.error_id }
            - call: "GET /home-oxygen/branches?limit=100&offset=0"
              payload: { limit: 100, offset: 0 }
              as: BranchManager
          assert:
            - "${e1} == ERR_INVALID_PAGINATION with HTTP 400 (limit 0 is below the declared minimum of 1)"
            - "${e2} == ERR_INVALID_PAGINATION with HTTP 400 (limit 101 is above the declared maximum of 100)"
            - "${e3} == ERR_INVALID_PAGINATION with HTTP 400 (offset -1 is below the declared minimum of 0)"
            - "limit=100 with offset=0 succeeds with HTTP 200 and total_count == 1, so both boundary values themselves are inside the window"
            - "Every rejection body carries response_type \"error\" with data.error_id and data.message and no array payload"

      - name: not_found_on_get_by_id_for_every_entity
        claim_type: not_found
        grounds:
          - validations[priority=5]
          - validations[priority=6]
          - validations[priority=7]
          - validations[priority=8]
          - validations[priority=9]
          - validations[priority=10]
          - validations[priority=11]
          - validations[priority=12]
          - validations[priority=13]
          - validations[priority=14]
          - validations[priority=15]
        distinguishing_aspect: |
          One unresolvable path id per entity: each of the eleven §1.1 entities must answer with
          its OWN existence error, never a shared generic 404, and the choice of error is driven
          by the path segment name and not by the order the ids appear.
        test_recipe:
          setup:
            - "Empty database; nothing is created, so every id below is unresolvable."
          setup_api_calls: []
          trigger:
            - call: "GET /home-oxygen/branches/00000000-0000-0000-0000-0000000000ff"
              payload: {}
              as: BranchManager
              captures: { e_branch: $.data.error_id }
            - call: "GET /home-oxygen/patients/00000000-0000-0000-0000-0000000000ff"
              payload: {}
              as: IntakeCoordinator
              captures: { e_patient: $.data.error_id }
            - call: "GET /home-oxygen/qualifying-tests/00000000-0000-0000-0000-0000000000ff"
              payload: {}
              as: IntakeCoordinator
              captures: { e_test: $.data.error_id }
            - call: "GET /home-oxygen/cmns/00000000-0000-0000-0000-0000000000ff"
              payload: {}
              as: Physician
              captures: { e_cmn: $.data.error_id }
            - call: "GET /home-oxygen/rental-contracts/00000000-0000-0000-0000-0000000000ff"
              payload: {}
              as: BillingSpecialist
              captures: { e_contract: $.data.error_id }
            - call: "GET /home-oxygen/equipment-units/00000000-0000-0000-0000-0000000000ff"
              payload: {}
              as: BranchManager
              captures: { e_unit: $.data.error_id }
            - call: "GET /home-oxygen/placements/00000000-0000-0000-0000-0000000000ff"
              payload: {}
              as: RespiratoryTherapist
              captures: { e_placement: $.data.error_id }
            - call: "GET /home-oxygen/delivery-routes/00000000-0000-0000-0000-0000000000ff"
              payload: {}
              as: DeliveryDriver
              captures: { e_route: $.data.error_id }
            - call: "GET /home-oxygen/route-stops/00000000-0000-0000-0000-0000000000ff"
              payload: {}
              as: DeliveryDriver
              captures: { e_stop: $.data.error_id }
            - call: "GET /home-oxygen/recall-notices/00000000-0000-0000-0000-0000000000ff"
              payload: {}
              as: ComplianceAuditor
              captures: { e_recall: $.data.error_id }
            - call: "GET /home-oxygen/travel-authorizations/00000000-0000-0000-0000-0000000000ff"
              payload: {}
              as: IntakeCoordinator
              captures: { e_travel: $.data.error_id }
          assert:
            - "${e_branch} == ERR_BRANCH_NOT_FOUND, ${e_patient} == ERR_PATIENT_NOT_FOUND, ${e_test} == ERR_QUALIFYING_TEST_NOT_FOUND, ${e_cmn} == ERR_CMN_NOT_FOUND"
            - "${e_contract} == ERR_CONTRACT_NOT_FOUND, ${e_unit} == ERR_EQUIPMENT_UNIT_NOT_FOUND, ${e_placement} == ERR_PLACEMENT_NOT_FOUND"
            - "${e_route} == ERR_ROUTE_NOT_FOUND, ${e_stop} == ERR_ROUTE_STOP_NOT_FOUND, ${e_recall} == ERR_RECALL_NOTICE_NOT_FOUND, ${e_travel} == ERR_TRAVEL_AUTHORIZATION_NOT_FOUND"
            - "All eleven responses are HTTP 404 with response_type \"error\", and the existence check (priorities 5-15) runs after the auth checks (priorities 1-3) but before every business rule"

      - name: body_foreign_key_references_not_found_rejected
        claim_type: parent_relationships
        grounds:
          - validations[priority=20]
          - validations[priority=21]
          - validations[priority=22]
          - validations[priority=23]
          - validations[priority=24]
          - validations[priority=25]
          - validations[priority=26]
        distinguishing_aspect: |
          Graph topology: a foreign key carried in the request BODY (not the path) must be resolved
          with the same rigour as a path id, and each body FK maps to its own existence error even
          when the same request carries several of them.
        test_recipe:
          setup:
            - "One branch, one patient, one GROUP_I study, one ACTIVE certificate, one contract and one route exist, so each rejected call below has exactly one unresolvable reference and every other reference is valid."
          setup_api_calls:
            - call: "POST /home-oxygen/branches"
              payload: { name: "Tampa Bay", state_code: "FL", competitive_bid_area: true, liquid_oxygen_certified: false, refill_capacity_per_day: 4, tank_exchange_buffer_minutes: 30 }
              as: BranchManager
              captures: { br_id: $.data.id }
            - call: "POST /home-oxygen/patients"
              payload: { mrn: "MRN-0210", full_name: "Bo Nilsen", branch_id: "${br_id}", payer_type: "MEDICARE_COMPETITIVE_BID", mobility_profile: "HOMEBOUND", altitude_feet: 500 }
              as: IntakeCoordinator
              captures: { p_id: $.data.id, p_ver: $.data.version }
            - call: "POST /home-oxygen/qualifying-tests"
              payload: { patient_id: "${p_id}", test_type: "RESTING_ROOM_AIR", spo2_percent: 87, tested_at: "2026-07-25T14:00:00Z", ordering_physician_npi: "1234567893" }
              as: IntakeCoordinator
              captures: { qt_id: $.data.id }
            - call: "POST /home-oxygen/cmns"
              payload: { patient_id: "${p_id}", qualifying_test_id: "${qt_id}", form_type: "INITIAL", prescribed_lpm: 3.0, hours_per_day: 24, portable_prescribed: false, length_of_need_months: 99, narrative_element_count: 3, expected_patient_version: "${p_ver}" }
              as: IntakeCoordinator
              captures: { cmn_id: $.data.id }
            - call: "POST /home-oxygen/cmns/${cmn_id}/submit"
              payload: {}
              as: IntakeCoordinator
              as_user_id: "u-intake-1"
            - call: "POST /home-oxygen/cmns/${cmn_id}/sign"
              payload: {}
              as: Physician
              as_user_id: "u-phys-1"
            - call: "POST /home-oxygen/cmns/${cmn_id}/approve"
              payload: {}
              as: ComplianceAuditor
              as_user_id: "u-audit-1"
            - call: "POST /home-oxygen/rental-contracts"
              payload: { patient_id: "${p_id}", cmn_id: "${cmn_id}", pricing_basis: "COMPETITIVE_BID_SINGLE_PAYMENT", cap_month_limit: 36 }
              as: BillingSpecialist
              captures: { c_id: $.data.id }
            - call: "POST /home-oxygen/delivery-routes"
              payload: { branch_id: "${br_id}", service_date: "2026-08-01", driver_user_id: "u-drv-1", shift_start_utc: "2026-08-01T12:00:00Z", shift_end_utc: "2026-08-01T22:00:00Z" }
              as: BranchManager
              captures: { r_id: $.data.id }
          trigger:
            - call: "POST /home-oxygen/patients"
              payload: { mrn: "MRN-0211", full_name: "Cy Odell", branch_id: "00000000-0000-0000-0000-0000000000ff", payer_type: "MEDICAID", mobility_profile: "HOMEBOUND" }
              as: IntakeCoordinator
              captures: { e_br: $.data.error_id }
            - call: "POST /home-oxygen/qualifying-tests"
              payload: { patient_id: "00000000-0000-0000-0000-0000000000ff", test_type: "RESTING_ROOM_AIR", spo2_percent: 87, tested_at: "2026-07-25T14:00:00Z", ordering_physician_npi: "1234567893" }
              as: IntakeCoordinator
              captures: { e_pt: $.data.error_id }
            - call: "POST /home-oxygen/cmns"
              payload: { patient_id: "${p_id}", qualifying_test_id: "00000000-0000-0000-0000-0000000000ff", form_type: "INITIAL", prescribed_lpm: 3.0, hours_per_day: 24, length_of_need_months: 99, expected_patient_version: "${p_ver}" }
              as: IntakeCoordinator
              captures: { e_qt: $.data.error_id }
            - call: "POST /home-oxygen/rental-contracts"
              payload: { patient_id: "${p_id}", cmn_id: "00000000-0000-0000-0000-0000000000ff", pricing_basis: "CASH" }
              as: BillingSpecialist
              captures: { e_cmn: $.data.error_id }
            - call: "POST /home-oxygen/route-stops"
              payload: { route_id: "00000000-0000-0000-0000-0000000000ff", contract_id: "${c_id}", stop_type: "SETUP_DELIVERY", window_start_utc: "2026-08-01T13:00:00Z", window_end_utc: "2026-08-01T14:00:00Z", service_minutes: 60 }
              as: BranchManager
              captures: { e_rt: $.data.error_id }
            - call: "POST /home-oxygen/route-stops"
              payload: { route_id: "${r_id}", contract_id: "00000000-0000-0000-0000-0000000000ff", stop_type: "SETUP_DELIVERY", window_start_utc: "2026-08-01T13:00:00Z", window_end_utc: "2026-08-01T14:00:00Z", service_minutes: 60 }
              as: BranchManager
              captures: { e_ct: $.data.error_id }
            - call: "POST /home-oxygen/equipment-units"
              payload: { branch_id: "${br_id}", serial_number: "SC-1099", model_code: "CONC-5L", equipment_class: "STATIONARY_CONCENTRATOR", max_continuous_lpm: 5.0, next_pm_due_date: "2027-06-01", replaces_unit_id: "00000000-0000-0000-0000-0000000000ff" }
              as: BranchManager
              captures: { e_un: $.data.error_id }
          assert:
            - "${e_br} == ERR_BRANCH_NOT_FOUND (404) and no Patient row is created"
            - "${e_pt} == ERR_PATIENT_NOT_FOUND (404) and no QualifyingTest row is created"
            - "${e_qt} == ERR_QUALIFYING_TEST_NOT_FOUND (404); the Patient version is still ${p_ver} because the priority-22 existence check precedes the priority-27 OCC check"
            - "${e_cmn} == ERR_CMN_NOT_FOUND (404) and GET /home-oxygen/rental-contracts?patient_id=${p_id} still reports total_count 1"
            - "${e_rt} == ERR_ROUTE_NOT_FOUND and ${e_ct} == ERR_CONTRACT_NOT_FOUND — the route id is checked at priority 25 and the contract id at priority 24, each in its own request"
            - "${e_un} == ERR_EQUIPMENT_UNIT_NOT_FOUND (404) for the self-referential replaces_unit_id; GET /home-oxygen/equipment-units?branch_id=${br_id} reports total_count 0"

      - name: posted_month_not_found_on_reversal_rejected
        claim_type: not_found
        grounds:
          - validations[priority=16]
          - errors[ERR_POSTED_MONTH_NOT_FOUND]
          - entities.RentalContract.fields.posted_months
        distinguishing_aspect: |
          The {service_month} path segment is a value key rather than a row id: it resolves against
          the contract's own posted_months array, so a well-formed month that was never posted is a
          404 on an otherwise perfectly valid contract.
        test_recipe:
          setup:
            - "One contract in (billing ACCRUING, service IN_SERVICE) after a passing setup on 2026-08-01, monthly_allowable_cents 5590, with 2026-08 posted and nothing else."
          setup_api_calls:
            - call: "POST /home-oxygen/branches"
              payload: { name: "Tampa Bay", state_code: "FL", competitive_bid_area: true, liquid_oxygen_certified: false, refill_capacity_per_day: 4, tank_exchange_buffer_minutes: 30 }
              as: BranchManager
              captures: { br_id: $.data.id }
            - call: "POST /home-oxygen/equipment-units"
              payload: { branch_id: "${br_id}", serial_number: "SC-1001", model_code: "CONC-5L", equipment_class: "STATIONARY_CONCENTRATOR", max_continuous_lpm: 5.0, max_pulse_setting: 0, pm_interval_days: 365, next_pm_due_date: "2027-06-01" }
              as: BranchManager
            - call: "POST /home-oxygen/patients"
              payload: { mrn: "MRN-0220", full_name: "Dov Halper", branch_id: "${br_id}", payer_type: "MEDICARE_COMPETITIVE_BID", mobility_profile: "HOMEBOUND", altitude_feet: 500 }
              as: IntakeCoordinator
              captures: { p_id: $.data.id, p_ver: $.data.version }
            - call: "POST /home-oxygen/qualifying-tests"
              payload: { patient_id: "${p_id}", test_type: "RESTING_ROOM_AIR", spo2_percent: 87, tested_at: "2026-07-25T14:00:00Z", ordering_physician_npi: "1234567893" }
              as: IntakeCoordinator
              captures: { qt_id: $.data.id }
            - call: "POST /home-oxygen/cmns"
              payload: { patient_id: "${p_id}", qualifying_test_id: "${qt_id}", form_type: "INITIAL", prescribed_lpm: 3.0, hours_per_day: 24, portable_prescribed: false, length_of_need_months: 99, narrative_element_count: 3, expected_patient_version: "${p_ver}" }
              as: IntakeCoordinator
              captures: { cmn_id: $.data.id }
            - call: "POST /home-oxygen/cmns/${cmn_id}/submit"
              payload: {}
              as: IntakeCoordinator
              as_user_id: "u-intake-1"
            - call: "POST /home-oxygen/cmns/${cmn_id}/sign"
              payload: {}
              as: Physician
              as_user_id: "u-phys-1"
            - call: "POST /home-oxygen/cmns/${cmn_id}/approve"
              payload: {}
              as: ComplianceAuditor
              as_user_id: "u-audit-1"
            - call: "POST /home-oxygen/rental-contracts"
