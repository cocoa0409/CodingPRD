# =============================================================================
# Task 1031 — Running & Fit Specialty Store
# §1.9 Scaffold Corner Design (breadth / non-difficulty coverage)
# =============================================================================
scaffold_corner_design:

  # ===========================================================================
  - section: entities
    instances:
      - name: c_member_create_success
        claim_type: Creation
        grounds: [entities.Member, endpoints]
        distinguishing_aspect: "POST /members with email/full_name/state_code returns 201 with loyalty_points_balance 0 and loyalty_tier STANDARD."
        test_recipe:
          setup: ["Empty DB."]
          setup_api_calls: []
          trigger:
            - call: "POST /members"
              payload: { email: "c1@x.com", full_name: "C One", state_code: "OR" }
              as: StoreManager
              captures: { m: $.data.id }
          assert:
            - "response.status == 201"
            - "Member.${m}.loyalty_points_balance == 0"
            - "Member.${m}.loyalty_tier == STANDARD"
            - "Member.${m}.status == ACTIVE"

      - name: c_member_not_found_returns_404
        claim_type: Not Found
        grounds: [entities.Member, "errors[ERR_NOT_FOUND]"]
        distinguishing_aspect: "GET /members/{non-existent} returns ERR_NOT_FOUND (404)."
        test_recipe:
          setup: ["Empty DB."]
          setup_api_calls: []
          trigger:
            - call: "GET /members/00000000-0000-0000-0000-000000000000"
              payload: {}
              as: StoreManager
              captures: { err: $.data.error_id }
          assert:
            - "response.data.error_id == ERR_NOT_FOUND"
            - "response.status == 404"

      - name: c_member_missing_required_field_returns_invalid_request
        claim_type: Required Fields
        grounds: [entities.Member, "errors[ERR_VALIDATION]"]
        distinguishing_aspect: "POST /members without full_name returns ERR_VALIDATION (422)."
        test_recipe:
          setup: ["Empty DB."]
          setup_api_calls: []
          trigger:
            - call: "POST /members"
              payload: { email: "c2@x.com", state_code: "OR" }
              as: StoreManager
              captures: { err: $.data.error_id }
          assert:
            - "response.data.error_id == ERR_VALIDATION"
            - "response.status == 422"

      - name: c_product_defaults_applied
        claim_type: Defaults
        grounds: [entities.Product.fields.mileage_life_miles, entities.Product.fields.stock_on_hand, entities.Product.fields.availability]
        distinguishing_aspect: "POST /products omitting mileage_life_miles and initial_stock yields mileage_life_miles 500, stock_on_hand 0, availability OUT_OF_STOCK."
        test_recipe:
          setup: ["Empty DB."]
          setup_api_calls: []
          trigger:
            - call: "POST /products"
              payload: { sku: "C-DEF", name: "Default Gel", category: "NUTRITION", unit_price_cents: 3000 }
              as: StoreManager
              captures: { pid: $.data.id }
          assert:
            - "Product.${pid}.mileage_life_miles == 500"
            - "Product.${pid}.stock_on_hand == 0"
            - "Product.${pid}.available_units == 0"
            - "Product.${pid}.availability == OUT_OF_STOCK"

      - name: c_orderline_unit_price_snapshot
        claim_type: Computed Fields
        grounds: [entities.OrderLine.fields.unit_price_cents, entities.OrderLine.fields.line_gross_cents]
        distinguishing_aspect: "OrderLine.unit_price_cents snapshots Product.unit_price_cents (4599) at order creation; line_gross_cents == 4599 for quantity 1."
        test_recipe:
          setup: ["Member; product priced 4599."]
          setup_api_calls:
            - call: "POST /members"
              payload: { email: "c3@x.com", full_name: "C Three", state_code: "OR" }
              as: StoreManager
              captures: { m: $.data.id }
            - call: "POST /products"
              payload: { sku: "C-SNAP", name: "Snap Shoe", category: "SHOE", unit_price_cents: 4599, initial_stock: 3 }
              as: StoreManager
              captures: { pid: $.data.id }
            - call: "POST /orders"
              payload: { member_id: "${m}", lines: [ { product_id: "${pid}", quantity: 1 } ] }
              as: StoreManager
              captures: { oid: $.data.id }
          trigger:
            - call: "GET /order-lines"
              payload: { order_id: "${oid}" }
              as: StoreManager
              captures: { line0: "$.data[0].id" }
          assert:
            - "OrderLine.${line0}.unit_price_cents == 4599"
            - "OrderLine.${line0}.line_gross_cents == 4599"

  # ===========================================================================
  - section: state_machines
    instances:
      - name: c_fulfill_requires_paid_returns_payment_not_captured
        claim_type: Precondition Enforcement
        grounds: [state_machines.Order.RESERVED_to_FULFILLED, "errors[ERR_PAYMENT_NOT_CAPTURED]"]
        distinguishing_aspect: "Fulfilling a RESERVED order whose payment_status is still UNPAID returns ERR_PAYMENT_NOT_CAPTURED (409)."
        test_recipe:
          setup: ["Member; product; order reserved but never paid."]
          setup_api_calls:
            - call: "POST /members"
              payload: { email: "c4@x.com", full_name: "C Four", state_code: "OR" }
              as: StoreManager
              captures: { m: $.data.id }
            - call: "POST /products"
              payload: { sku: "C-PNC", name: "PNC Shoe", category: "SHOE", unit_price_cents: 10000, initial_stock: 3 }
              as: StoreManager
              captures: { pid: $.data.id }
            - call: "POST /orders"
              payload: { member_id: "${m}", lines: [ { product_id: "${pid}", quantity: 1 } ] }
              as: StoreManager
              captures: { oid: $.data.id }
            - call: "POST /orders/${oid}/reserve"
              payload: {}
              as: StoreManager
          trigger:
            - call: "POST /orders/${oid}/fulfill"
              payload: {}
              as: StoreManager
              captures: { err: $.data.error_id }
          assert:
            - "response.data.error_id == ERR_PAYMENT_NOT_CAPTURED"
            - "response.status == 409"

      - name: c_return_approve_invalid_from_returns_not_inspectable
        claim_type: Invalid Transitions
        grounds: [state_machines.WearReturn.UNDER_INSPECTION_to_APPROVED, "errors[ERR_RETURN_NOT_INSPECTABLE]"]
        distinguishing_aspect: "Approving a return still in REQUESTED (never inspected) returns ERR_RETURN_NOT_INSPECTABLE (409)."
        test_recipe:
          setup: ["Member; SHOE fully fulfilled; a return opened (REQUESTED, not inspected)."]
          setup_api_calls:
            - call: "POST /members"
              payload: { email: "c5@x.com", full_name: "C Five", state_code: "OR" }
              as: StoreManager
              captures: { m: $.data.id }
            - call: "POST /products"
              payload: { sku: "C-RNI", name: "RNI Shoe", category: "SHOE", unit_price_cents: 10000, initial_stock: 3 }
              as: StoreManager
              captures: { pid: $.data.id }
            - call: "POST /orders"
              payload: { member_id: "${m}", lines: [ { product_id: "${pid}", quantity: 1 } ] }
              as: StoreManager
              captures: { oid: $.data.id }
            - call: "POST /orders/${oid}/authorize-payment"
              payload: {}
              as: StoreManager
            - call: "POST /orders/${oid}/capture-payment"
              payload: {}
              as: StoreManager
            - call: "POST /orders/${oid}/reserve"
              payload: {}
              as: StoreManager
            - call: "POST /orders/${oid}/fulfill"
              payload: {}
              as: StoreManager
            - call: "GET /order-lines"
              payload: { order_id: "${oid}" }
              as: StoreManager
              captures: { line0: "$.data[0].id" }
            - call: "POST /returns"
              payload: { order_line_id: "${line0}", reason: "just checking" }
              as: StoreManager
              captures: { rid: $.data.id }
          trigger:
            - call: "POST /returns/${rid}/approve"
              payload: {}
              as: StoreManager
              captures: { err: $.data.error_id }
          assert:
            - "response.data.error_id == ERR_RETURN_NOT_INSPECTABLE"
            - "response.status == 409"

      - name: c_shoe_logmileage_after_retire_returns_already_retired
        claim_type: Terminal State Lockdown
        grounds: [state_machines.RunningShoe.RETIREMENT_DUE_to_RETIRED, entities.RunningShoe.fields.status, "errors[ERR_SHOE_ALREADY_RETIRED]"]
        distinguishing_aspect: "Logging mileage on a RETIRED shoe returns ERR_SHOE_ALREADY_RETIRED (409)."
        test_recipe:
          setup: ["Member; SHOE fulfilled; the resulting shoe retired."]
          setup_api_calls:
            - call: "POST /members"
              payload: { email: "c6@x.com", full_name: "C Six", state_code: "OR" }
              as: StoreManager
              captures: { m: $.data.id }
            - call: "POST /products"
              payload: { sku: "C-RET", name: "RET Shoe", category: "SHOE", unit_price_cents: 10000, initial_stock: 3 }
              as: StoreManager
              captures: { pid: $.data.id }
            - call: "POST /orders"
              payload: { member_id: "${m}", lines: [ { product_id: "${pid}", quantity: 1 } ] }
              as: StoreManager
              captures: { oid: $.data.id }
            - call: "POST /orders/${oid}/authorize-payment"
              payload: {}
              as: StoreManager
            - call: "POST /orders/${oid}/capture-payment"
              payload: {}
              as: StoreManager
            - call: "POST /orders/${oid}/reserve"
              payload: {}
              as: StoreManager
            - call: "POST /orders/${oid}/fulfill"
              payload: {}
              as: StoreManager
            - call: "GET /running-shoes"
              payload: { source_order_id: "${oid}" }
              as: StoreManager
              captures: { shoe: "$.data[0].id" }
            - call: "POST /running-shoes/${shoe}/retire"
              payload: {}
              as: StoreManager
          trigger:
            - call: "POST /running-shoes/${shoe}/log-mileage"
              payload: { miles: 10 }
              as: StoreManager
              captures: { err: $.data.error_id }
          assert:
            - "response.data.error_id == ERR_SHOE_ALREADY_RETIRED"
            - "response.status == 409"

      - name: c_subscription_reactivate_invalid_from_active
        claim_type: Invalid Transitions
        grounds: [state_machines.Subscription.PAST_DUE_to_ACTIVE, "errors[ERR_INVALID_STATE]"]
        distinguishing_aspect: "Reactivating an already ACTIVE subscription returns ERR_INVALID_STATE (409)."
        test_recipe:
          setup: ["Member with an ACTIVE subscription."]
          setup_api_calls:
            - call: "POST /members"
              payload: { email: "c7@x.com", full_name: "C Seven", state_code: "OR" }
              as: StoreManager
              captures: { m: $.data.id }
            - call: "POST /subscriptions"
              payload: { member_id: "${m}", plan: "BASIC" }
              as: StoreManager
              captures: { sub: $.data.id }
          trigger:
            - call: "POST /subscriptions/${sub}/reactivate"
              payload: {}
              as: StoreManager
              captures: { err: $.data.error_id }
          assert:
            - "response.data.error_id == ERR_INVALID_STATE"
            - "response.status == 409"

      - name: c_fitment_complete_requires_checked_in
        claim_type: Invalid Transitions
        grounds: [state_machines.FitmentSession.CHECKED_IN_to_COMPLETED, "errors[ERR_INVALID_STATE]"]
        distinguishing_aspect: "Completing a SCHEDULED (not CHECKED_IN) fitment session returns ERR_INVALID_STATE (409)."
        test_recipe:
          setup: ["Member; fitter; a SCHEDULED fitment session."]
          setup_api_calls:
            - call: "POST /members"
              payload: { email: "c8@x.com", full_name: "C Eight", state_code: "OR" }
              as: StoreManager
              captures: { m: $.data.id }
            - call: "POST /fitters"
              payload: { full_name: "Coach Kim" }
              as: StoreManager
              captures: { fid: $.data.id }
            - call: "POST /fitment-sessions"
              payload: { member_id: "${m}", fitter_id: "${fid}", scheduled_start: "2026-08-20T10:00:00Z", scheduled_end: "2026-08-20T11:00:00Z" }
              as: StoreManager
              captures: { fs: $.data.id }
          trigger:
            - call: "POST /fitment-sessions/${fs}/complete"
              payload: { notes: "premature" }
              as: StoreManager
              captures: { err: $.data.error_id }
          assert:
            - "response.data.error_id == ERR_INVALID_STATE"
            - "response.status == 409"

      - name: c_order_cancel_after_cancelled_returns_invalid_state
        claim_type: Terminal State Lockdown
        grounds: [state_machines.Order.PENDING_to_CANCELLED, "errors[ERR_INVALID_STATE]"]
        distinguishing_aspect: "Cancelling an order whose fulfillment_status is already CANCELLED returns ERR_INVALID_STATE (409)."
        test_recipe:
          setup: ["Member; product; order created then cancelled once."]
          setup_api_calls:
            - call: "POST /members"
              payload: { email: "c9@x.com", full_name: "C Nine", state_code: "OR" }
              as: StoreManager
              captures: { m: $.data.id }
            - call: "POST /products"
              payload: { sku: "C-CAN", name: "CAN Gel", category: "NUTRITION", unit_price_cents: 3000, initial_stock: 3 }
              as: StoreManager
              captures: { pid: $.data.id }
            - call: "POST /orders"
              payload: { member_id: "${m}", lines: [ { product_id: "${pid}", quantity: 1 } ] }
              as: StoreManager
              captures: { oid: $.data.id }
            - call: "POST /orders/${oid}/cancel"
              payload: {}
              as: StoreManager
          trigger:
            - call: "POST /orders/${oid}/cancel"
              payload: {}
              as: StoreManager
              captures: { err: $.data.error_id }
          assert:
            - "response.data.error_id == ERR_INVALID_STATE"
            - "response.status == 409"

      - name: c_reserve_insufficient_stock_rejected
        claim_type: Precondition Enforcement
        grounds: [state_machines.Order.PENDING_to_RESERVED, "errors[ERR_INSUFFICIENT_STOCK]"]
        distinguishing_aspect: "Reserving an order for 5 units when the product has only 2 available returns ERR_INSUFFICIENT_STOCK (409)."
        test_recipe:
          setup: ["Member; product with 2 units on hand; order for 5 units."]
          setup_api_calls:
            - call: "POST /members"
              payload: { email: "c10@x.com", full_name: "C Ten", state_code: "OR" }
              as: StoreManager
              captures: { m: $.data.id }
            - call: "POST /products"
              payload: { sku: "C-STK", name: "STK Gel", category: "NUTRITION", unit_price_cents: 3000, initial_stock: 2 }
              as: StoreManager
              captures: { pid: $.data.id }
            - call: "POST /orders"
              payload: { member_id: "${m}", lines: [ { product_id: "${pid}", quantity: 5 } ] }
              as: StoreManager
              captures: { oid: $.data.id }
          trigger:
            - call: "POST /orders/${oid}/reserve"
              payload: {}
              as: StoreManager
              captures: { err: $.data.error_id }
          assert:
            - "response.data.error_id == ERR_INSUFFICIENT_STOCK"
            - "response.status == 409"

      - name: c_booking_full_routes_to_waitlist
        claim_type: Valid Transition
        grounds: [entities.TrainingBooking.fields.status, entities.TrainingSession.fields.available_slots]
        distinguishing_aspect: "Booking a capacity-1 session that is already full routes the new booking to WAITLISTED (not an error)."
        test_recipe:
          setup: ["Two members with ACTIVE subscriptions; capacity-1 session; member1 BOOKED."]
          setup_api_calls:
            - call: "POST /members"
              payload: { email: "c11a@x.com", full_name: "C11A", state_code: "OR" }
              as: StoreManager
              captures: { m1: $.data.id }
            - call: "POST /members"
              payload: { email: "c11b@x.com", full_name: "C11B", state_code: "OR" }
              as: StoreManager
              captures: { m2: $.data.id }
            - call: "POST /subscriptions"
              payload: { member_id: "${m1}", plan: "BASIC" }
              as: StoreManager
            - call: "POST /subscriptions"
              payload: { member_id: "${m2}", plan: "BASIC" }
              as: StoreManager
            - call: "POST /training-sessions"
              payload: { title: "Full 10k", start_time: "2026-08-21T13:00:00Z", end_time: "2026-08-21T14:00:00Z", capacity: 1 }
              as: StoreManager
              captures: { sid: $.data.id }
            - call: "POST /training-bookings"
              payload: { session_id: "${sid}", member_id: "${m1}" }
              as: StoreManager
              captures: { b1: $.data.id }
          trigger:
            - call: "POST /training-bookings"
              payload: { session_id: "${sid}", member_id: "${m2}" }
              as: StoreManager
              captures: { b2: $.data.id }
          assert:
            - "response.status == 201"
            - "TrainingBooking.${b2}.status == WAITLISTED"

      - name: c_fitment_in_past_rejected
        claim_type: Precondition Enforcement
        grounds: ["errors[ERR_APPOINTMENT_IN_PAST]", entities.FitmentSession.fields.scheduled_start]
        distinguishing_aspect: "Booking a fitment whose scheduled_start (2026-06-01) precedes the startup logical clock default (2026-07-01T00:00:00Z) returns ERR_APPOINTMENT_IN_PAST (422)."
        test_recipe:
          setup: ["Member; fitter; clock at startup default 2026-07-01T00:00:00Z (unset)."]
          setup_api_calls:
            - call: "POST /members"
              payload: { email: "c12@x.com", full_name: "C Twelve", state_code: "OR" }
              as: StoreManager
              captures: { m: $.data.id }
            - call: "POST /fitters"
              payload: { full_name: "Coach Lee" }
              as: StoreManager
              captures: { fid: $.data.id }
          trigger:
            - call: "POST /fitment-sessions"
              payload: { member_id: "${m}", fitter_id: "${fid}", scheduled_start: "2026-06-01T10:00:00Z", scheduled_end: "2026-06-01T11:00:00Z" }
              as: StoreManager
              captures: { err: $.data.error_id }
          assert:
            - "response.data.error_id == ERR_APPOINTMENT_IN_PAST"
            - "response.status == 422"

      - name: c_shoe_below_threshold_stays_active
        claim_type: Precondition Enforcement
        grounds: [calculations.shoe_mileage_retirement, entities.RunningShoe.fields.status]
        distinguishing_aspect: "Logging 299 miles on a shoe with retirement_threshold_miles 300 leaves status ACTIVE (below the inclusive >= boundary)."
        test_recipe:
          setup: ["Member; SHOE mileage_life_miles 300; order fulfilled so one RunningShoe exists."]
          setup_api_calls:
            - call: "POST /members"
              payload: { email: "c13@x.com", full_name: "C Thirteen", state_code: "OR" }
              as: StoreManager
              captures: { m: $.data.id }
            - call: "POST /products"
              payload: { sku: "C-MIL", name: "MIL Shoe", category: "SHOE", unit_price_cents: 10000, mileage_life_miles: 300, initial_stock: 3 }
              as: StoreManager
              captures: { pid: $.data.id }
            - call: "POST /orders"
              payload: { member_id: "${m}", lines: [ { product_id: "${pid}", quantity: 1 } ] }
              as: StoreManager
              captures: { oid: $.data.id }
            - call: "POST /orders/${oid}/authorize-payment"
              payload: {}
              as: StoreManager
            - call: "POST /orders/${oid}/capture-payment"
              payload: {}
              as: StoreManager
            - call: "POST /orders/${oid}/reserve"
              payload: {}
              as: StoreManager
            - call: "POST /orders/${oid}/fulfill"
              payload: {}
              as: StoreManager
            - call: "GET /running-shoes"
              payload: { source_order_id: "${oid}" }
              as: StoreManager
              captures: { shoe: "$.data[0].id" }
          trigger:
            - call: "POST /running-shoes/${shoe}/log-mileage"
              payload: { miles: 299 }
              as: StoreManager
          assert:
            - "RunningShoe.${shoe}.total_mileage_miles == 299"
            - "RunningShoe.${shoe}.status == ACTIVE"

  # ===========================================================================
  - section: calculations
    instances:
      - name: c_free_shipping_at_threshold
        claim_type: Correct Result
        grounds: [calculations.order_pricing, entities.Order.fields.shipping_fee_cents]
        distinguishing_aspect: "subtotal_after_discount exactly 7500 (== FREE_SHIP_THRESHOLD_CENTS) waives shipping: shipping_fee_cents 0, provisional_total_cents 7500."
        test_recipe:
          setup: ["Member (no subscription, STANDARD); product priced 7500."]
          setup_api_calls:
            - call: "POST /members"
              payload: { email: "c14@x.com", full_name: "C Fourteen", state_code: "OR" }
              as: StoreManager
              captures: { m: $.data.id }
            - call: "POST /products"
              payload: { sku: "C-FS0", name: "FS0", category: "GEAR", unit_price_cents: 7500, initial_stock: 3 }
              as: StoreManager
              captures: { pid: $.data.id }
          trigger:
            - call: "POST /orders"
              payload: { member_id: "${m}", lines: [ { product_id: "${pid}", quantity: 1 } ] }
              as: StoreManager
              captures: { oid: $.data.id }
          assert:
            - "Order.${oid}.shipping_fee_cents == 0"
            - "Order.${oid}.provisional_total_cents == 7500"

      - name: c_free_shipping_below_threshold
        claim_type: Correct Result
        grounds: [calculations.order_pricing, entities.Order.fields.shipping_fee_cents]
        distinguishing_aspect: "subtotal_after_discount 7499 (< 7500) charges SHIPPING_FEE_CENTS 599: provisional_total_cents 8098."
        test_recipe:
          setup: ["Member (STANDARD); product priced 7499."]
          setup_api_calls:
            - call: "POST /members"
              payload: { email: "c15@x.com", full_name: "C Fifteen", state_code: "OR" }
              as: StoreManager
              captures: { m: $.data.id }
            - call: "POST /products"
              payload: { sku: "C-FS1", name: "FS1", category: "GEAR", unit_price_cents: 7499, initial_stock: 3 }
              as: StoreManager
              captures: { pid: $.data.id }
          trigger:
            - call: "POST /orders"
              payload: { member_id: "${m}", lines: [ { product_id: "${pid}", quantity: 1 } ] }
              as: StoreManager
              captures: { oid: $.data.id }
          assert:
            - "Order.${oid}.shipping_fee_cents == 599"
            - "Order.${oid}.provisional_total_cents == 8098"

      - name: c_promo_gated_below_min_subtotal
        claim_type: Constants Applied
        grounds: [calculations.effective_discount, entities.Order.fields.discount_pct_applied]
        distinguishing_aspect: "With ELITE subscription + SPRING15 but subtotal 4000 (< PROMO_MIN_SUBTOTAL_CENTS 5000) the promo is disabled: discount_pct_applied 0.12 (stack cap only), discount_cents 480, provisional_total 4119 (shipping 599)."
        test_recipe:
          setup: ["Member with ACTIVE ELITE subscription; product priced 4000."]
          setup_api_calls:
            - call: "POST /members"
              payload: { email: "c16@x.com", full_name: "C Sixteen", state_code: "OR" }
              as: StoreManager
              captures: { m: $.data.id }
            - call: "POST /subscriptions"
              payload: { member_id: "${m}", plan: "ELITE" }
              as: StoreManager
            - call: "POST /products"
              payload: { sku: "C-PRM", name: "PRM", category: "GEAR", unit_price_cents: 4000, initial_stock: 3 }
              as: StoreManager
              captures: { pid: $.data.id }
          trigger:
            - call: "POST /orders"
              payload: { member_id: "${m}", lines: [ { product_id: "${pid}", quantity: 1 } ], promo_code: "SPRING15" }
              as: StoreManager
              captures: { oid: $.data.id }
          assert:
            - "Order.${oid}.discount_pct_applied == 0.12"
            - "Order.${oid}.discount_cents == 480"
            - "Order.${oid}.provisional_total_cents == 4119"

      - name: c_redemption_not_multiple_of_100_rejected
        claim_type: Constants Applied
        grounds: [calculations.order_pricing, "errors[ERR_REDEMPTION_EXCEEDS_CAP]"]
        distinguishing_aspect: "Redeeming 150 points (not a multiple of 100) on an UNPAID order returns ERR_REDEMPTION_EXCEEDS_CAP (422); member has 500 points so it is not an insufficiency."
        test_recipe:
          setup: ["Member granted 500 points; product 10000; UNPAID order."]
          setup_api_calls:
            - call: "POST /members"
              payload: { email: "c17@x.com", full_name: "C Seventeen", state_code: "OR" }
              as: StoreManager
              captures: { m: $.data.id }
            - call: "POST /members/${m}/loyalty-adjustments"
              payload: { points_delta: 500, reason: "seed" }
