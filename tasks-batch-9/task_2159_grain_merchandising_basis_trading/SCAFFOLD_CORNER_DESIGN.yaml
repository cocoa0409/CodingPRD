              payload: { fleet_id: "${fleet_id}", contract_id: "${c_id}", cars_requested: 25, placement_at: "2026-11-20T00:00:00Z", release_at: "2026-11-22T00:00:00Z", expected_fleet_version: "${fv0}" }
