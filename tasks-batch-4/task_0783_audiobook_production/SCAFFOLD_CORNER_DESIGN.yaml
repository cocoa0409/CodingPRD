        grounds: ["validations[priority=9]", "errors[ERR_DEAL_TYPE_FIELDS]"]
        distinguishing_aspect: "A ROYALTY_SHARE contract offered without royalty_share_pct returns ERR_DEAL_TYPE_FIELDS (422), distinct from a missing-field ERR_VALIDATION."
        test_recipe:
          setup:
            - "A CASTING-eligible title with an ACCEPTED audition."
          setup_api_calls:
            - call: "POST /authors"
              payload: { name: "AV2", email: "av2@x.com" }
              as: PlatformAdmin
              captures: { au: $.data.id }
            - call: "POST /narrators"
              payload: { name: "NV2", email: "nv2@x.com", hourly_rate_cents: 20000 }
              as: PlatformAdmin
              captures: { na: $.data.id }
            - call: "POST /titles"
              payload: { title_name: "VT2", isbn: "V2", exclusivity: "NON_EXCLUSIVE", territory: "WORLD", list_price_cents: 2000 }
