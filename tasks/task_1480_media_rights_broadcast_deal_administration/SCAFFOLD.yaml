  path: /deals/{dealId}/renewal-offers
  description: File a renewal offer (incumbent or third-party)
  roles:
  - BidCoordinator
  code: 201
  input:
  - offer_source
  - offeror_broadcaster_id
  - offered_fee_cents
  - escalator_rate_pct
  output: RenewalOffer
  side_effects:
  - status = OPEN
  - matching_window_end = current logical clock + MATCHING_WINDOW_DAYS
- method: GET
  path: /deals/{dealId}/renewal-offers
  description: List renewal offers
  roles:
  - RightsManager
  - BidCoordinator
  - FinanceController
  - ProductionAuditor
  - ComplianceOfficer
  code: 200
  input:
  - limit?
  - offset?
  - status?
  - offer_source?
  - deal_id?
  - offeror_broadcaster_id?
  output: RenewalOffer[]
  side_effects: []
- method: GET
  path: /deals/{dealId}/renewal-offers/{offerId}
  description: Get a renewal offer
  roles:
  - RightsManager
  - BidCoordinator
  - FinanceController
  - ProductionAuditor
  - ComplianceOfficer
  code: 200
  input: []
  output: RenewalOffer
  side_effects: []
- method: POST
  path: /deals/{dealId}/renewal-offers/{offerId}/match
  description: Incumbent matches a third-party offer
  roles:
  - BidCoordinator
  code: 200
  input: []
  output: RenewalOffer
  side_effects:
  - status → MATCHED
  - matched_by_incumbent = true
- method: POST
  path: /deals/{dealId}/renewal-offers/{offerId}/exercise
  description: Exercise a renewal offer (transitions deal to RENEWED)
  roles:
  - RightsManager
  code: 200
  input: []
  output: RenewalOffer
  side_effects:
  - Deal RENEWAL_OPEN → RENEWED
  - New PaymentMilestone + ProductionObligation rows auto-created
  - Other offers → SUPERSEDED
- method: POST
  path: /deals/{dealId}/renewal-offers/{offerId}/withdraw
  description: Withdraw a renewal offer (offeror only)
