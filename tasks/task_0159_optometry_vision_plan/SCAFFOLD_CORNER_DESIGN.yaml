        excluded_because:
          difficulty_instance: dual_variant_calc / materials_provisional_vs_final_diverges_on_laborder_domain
          rationale: "OCC stale-version is covered as its own corner below; this stub points at where eligibility version is re-read. See occ_stale_eligibility_version_rejected."

      - name: occ_stale_eligibility_version_rejected
        claim_type: violation_to_error
        grounds: ["errors[ERR_STALE_ELIGIBILITY_VERSION]", "concurrency_rules[laborder-create-stale-eligibility]"]
        distinguishing_aspect: "A second benefit-drawing LabOrder carrying the pre-first-draw expected_eligibility_version (now stale, since the first draw bumped Eligibility.version) is rejected with ERR_STALE_ELIGIBILITY_VERSION 412."
        test_recipe:
          setup: ["VSP patient, allowance 40000; one ACTIVE Rx; first benefit LabOrder placed with the original eligibility version, bumping it"]
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-06-01T00:00:00Z" }
              as: FrontDesk
            - call: "POST /providers"
              payload: { full_name: "Dr OD", role: "OPTOMETRIST", npi: "1234567890" }
              as: FrontDesk
              captures: { od_id: $.data.id }
            - call: "POST /providers"
              payload: { full_name: "Op T", role: "OPTICIAN", npi: "2222222222" }
              as: FrontDesk
              captures: { opt_id: $.data.id }
            - call: "POST /patients"
              payload: { full_name: "Pat OCC", date_of_birth: "1990-01-01", plan_carrier: "VSP" }
              as: FrontDesk
              captures: { pat_id: $.data.id }
            - call: "POST /eligibilities"
              payload: { patient_id: "${pat_id}", carrier: "VSP", benefit_period_start: "2026-01-01", exam_copay_cents: 2500, materials_allowance_cents: 40000 }
              as: FrontDesk
              captures: { elig_id: $.data.id, elig_v0: $.data.version }
            - call: "POST /encounters"
              payload: { patient_id: "${pat_id}", provider_id: "${od_id}", encounter_type: "ROUTINE_VISION", exam_fee_cents: 12000, refraction_fee_cents: 3000 }
              as: FrontDesk
              captures: { enc_id: $.data.id }
            - call: "POST /patients/${pat_id}/prescriptions"
              payload: { encounter_id: "${enc_id}", rx_type: "EYEGLASS", sphere_od: -1.25, sphere_os: -1.00, issue_date: "2026-06-01" }
              as: Optometrist
              as_user_id: "${od_id}"
              captures: { rx_id: $.data.id }
            - call: "POST /lab-orders"
              payload: { prescription_id: "${rx_id}", eligibility_id: "${elig_id}", expected_eligibility_version: "${elig_v0}", frame_charge_cents: 9000, lens_charge_cents: 5000, frame_brand_tier: "STANDARD" }
              as: Optician
              as_user_id: "${opt_id}"
          trigger:
            - call: "POST /lab-orders"
              payload: { prescription_id: "${rx_id}", eligibility_id: "${elig_id}", expected_eligibility_version: "${elig_v0}", frame_charge_cents: 9000, lens_charge_cents: 5000, frame_brand_tier: "STANDARD" }
