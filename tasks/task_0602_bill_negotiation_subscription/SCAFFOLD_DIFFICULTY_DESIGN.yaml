          Error-category pair state(priority 8) vs business_fiscal(priority 14): accepting a
          case that is in COUNTERED with current_offer ABOVE baseline is both wrong-state-for-
          this-from (if it were OPEN) and over-baseline; here the case is OPEN (cannot accept)
          AND its single proposed offer would be above baseline — the state check (priority 8)
          wins, returning ERR_INVALID_STATE not ERR_OFFER_ABOVE_BASELINE.
        test_recipe:
          setup:
            - "An ACTIVE member, CONFIRMED MONTHLY charge 5000 (baseline_annual 60000), an OPEN NegotiationCase (no proposal yet)."
          setup_api_calls:
