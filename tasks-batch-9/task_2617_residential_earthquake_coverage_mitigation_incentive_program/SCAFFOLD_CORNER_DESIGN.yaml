          difficulty_instance: premium_eight_factor_product_clamps_at_both_ends
          rationale: "That §1.8 combinatorial_formula instance already drives hazard_base_premium on known inputs and asserts the exact cents produced by the full eight-factor product, including the MIN_PREMIUM_CENTS and MAX_PREMIUM_CENTS clamps at both ends of the range. A plain correct-result test would be a strict subset of it."

