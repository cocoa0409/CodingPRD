# =============================================================================
# PRD Benchmark Scaffold — task_3337
# Franchise Mobile Tool Truck Routes & Customer Credit Extension (Snap-on)
# =============================================================================
scenario: |
  Franchise Mobile Tool Truck Routes & Customer Credit Extension: franchisee
  territory assignment with a route list of repair shops visited on a weekly
  cycle, truck inventory investment and replenishment ordering with product mix
  decisions by route, extended credit offered by the franchisee to technicians
  with weekly payment collection on the truck, revolving account and lease
  program financing carried by the franchisor with credit approval and recourse
  terms, delinquency management where a technician changes shops or leaves the
  trade, product warranty and tool replacement handled at the truck with claim
  submission, franchisee training, route development and territory resale, and
  new product launch allocation across routes.

domain_name: franchise-tool-truck-credit
api_prefix: /retail

complexity_profile:
  primary_archetype: quota_allocation
  secondary_archetype: temporal_windowing
  complexity_layers:
    - optimistic_concurrency
    - cascading_side_effects
    - dual_variant_calculation
    - rate_threshold_triggers
    - derived_field_reconciliation
    - idempotency
  entity_topology: flat
  state_machine_shape: parallel
  relationship_patterns:
    - one_to_many
    - self_referential
    - cross_aggregate
  role_model: peer_roles
  consistency_model: immediate
  entity_count: 15
  endpoint_count: 53
  error_code_count: 44
  calculation_count: 15
  validation_count: 22
  state_machine_count: 9
  role_count: 6

# =============================================================================
# §1.0 Response Envelope (FIXED — EMIT VERBATIM)
# =============================================================================
response_envelope:
  success: |
    { "meta": { "api_request_id": "req_xxx", "api_request_timestamp": "ISO8601" },
      "response_type": "object" | "array", "data": {} }
  error: |
    { "meta": { ... }, "response_type": "error",
      "data": { "error_id": "ERR_XXX", "message": "..." } }
  pagination_fields: ["limit", "offset", "total_count", "has_more"]
  pagination_defaults: { limit: 10, min: 1, max: 100, offset: 0 }

# =============================================================================
# §1.1 Entity-Relationship Table
# =============================================================================
entities:

  - name: Franchisee
    parent: null
    common_fields: true
    fields:
      - { name: legal_name, type: string, source: input, description: "Franchisee legal entity name" }
      - { name: training_status, type: enum, source: computed, description: "NOT_ENROLLED | ENROLLED | CERTIFIED; see franchisee_training_progress" }
      - { name: certified_on, type: datetime, source: system, description: "Logical-clock timestamp the franchisee became CERTIFIED; null until then" }
      - { name: total_route_count, type: integer, source: computed, description: "Number of Route rows owned by this franchisee, any route_status" }
      - { name: active_route_count, type: integer, source: computed, description: "Routes with route_status == IN_SERVICE" }
      - { name: credit_ceiling_cents, type: integer, source: computed, description: "Sum of credit_limit_cents over CreditAccounts whose account_status is ACTIVE or DELINQUENT" }
      - { name: outstanding_credit_cents, type: integer, source: computed, description: "Sum of current_balance_cents over CreditAccounts whose account_status is ACTIVE or DELINQUENT" }
      - { name: recourse_exposure_cents, type: integer, source: computed, description: "Sum of current_balance_cents over accounts whose recourse_holder == FRANCHISEE and account_status IN {ACTIVE, DELINQUENT, CHARGED_OFF}" }
      - { name: franchisee_capital_at_risk_cents, type: integer, source: computed, description: "outstanding_credit_cents minus recourse_exposure_cents; 0 when every open account is franchisor-recourse" }
      - { name: fallback_shop_location_id, type: string, source: computed, description: "Derived pointer to ShopLocation.id — the ACTIVE ShopLocation on this franchisee's routes with the earliest created_at; null when none. Deterministic collection fallback for franchisee-sourced accounts." }
      - { name: can_resell_territory, type: boolean, source: computed, description: "True when training_status == CERTIFIED" }

  - name: Route
    parent: Franchisee
    common_fields: true
    fields:
      - { name: route_code, type: string, source: input, description: "Globally unique human route code" }
      - { name: route_tier, type: enum, source: input, description: "A | B | C; A is the highest-volume territory band" }
      - { name: zip_codes, type: array, source: input, description: "Zip codes the territory covers; must be non-empty" }
      - { name: visit_weekday, type: integer, source: input, description: "Weekly visit cycle day, 1=Monday .. 7=Sunday" }
      - { name: truck_label, type: string, source: input, description: "Truck identifier" }
      - { name: inventory_invested_cents, type: integer, source: input, description: "Truck inventory investment declared at route activation" }
      - { name: mix_plan, type: enum, source: input, description: "DIAGNOSTIC_WEIGHTED | TOOL_STORAGE | POWER_TOOLS; the route's planned product mix" }
      - { name: inventory_at_risk_cents, type: integer, source: computed, description: "Sum over this route's InventoryPosition of reserved_qty * unit_cost_cents" }
      - { name: over_pledge_cents, type: integer, source: computed, description: "Cost of units committed to more than one confirmed order; see inventory_over_pledge" }
      - { name: schedule_anchor_utc, type: datetime, source: computed, description: "Most recent occurrence of visit_weekday at 08:00:00Z strictly before the logical clock; see route_schedule_anchor" }
      - { name: route_status, type: enum, source: system, description: "DRAFT | IN_SERVICE | SUSPENDED | PENDING_TRANSFER | RETIRED" }
      - { name: territory_development_status, type: enum, source: system, description: "UNASSIGNED | IN_DEVELOPMENT | QUALIFIED | SURRENDERED; independent of route_status" }
      - { name: territory_model, type: enum, source: input, description: "FRANCHISEE_ASSUMED | FRANCHISOR_RECOURSE; the default recourse model for accounts opened while this territory is in force" }
      - { name: territory_points, type: integer, source: input, description: "Development score the route has earned toward territory qualification" }
      - { name: in_force_from_week, type: datetime, source: system, description: "Monday 00:00:00Z of the week the territory entered IN_DEVELOPMENT or QUALIFIED; null while UNASSIGNED" }
      - { name: in_force_to_week, type: datetime, source: system, description: "Monday 00:00:00Z of the week the territory left QUALIFIED for SURRENDERED; null while in force" }
      - { name: resale_status, type: enum, source: system, description: "NONE | PENDING | APPROVED | DECLINED; independent of route_status and territory_development_status" }
      - { name: resale_buyer_training_status, type: enum, source: input, description: "NOT_ENROLLED | ENROLLED | CERTIFIED; the prospective buyer's training state on the route's resale application" }
      - { name: resale_trained_points, type: integer, source: input, description: "Development points the buyer's training programme has accumulated; null when no resale is pending" }
      - { name: reopening_fee_cents, type: integer, source: computed, description: "Buyer training reopening fee; see reopening_fee" }
      - { name: launch_risk_band, type: enum, source: computed, description: "LOW | MEDIUM | HIGH; see launch_allocation_plan" }

  - name: ShopLocation
    parent: Route
    common_fields: true
    fields:
      - { name: shop_name, type: string, source: input, description: "Repair shop name" }
      - { name: street_line, type: string, source: input, description: "Street address" }
      - { name: zip_code, type: string, source: input, description: "Must appear in the owning route's zip_codes" }
      - { name: shop_status, type: enum, source: system, description: "ACTIVE | INACTIVE" }
      - { name: active_technician_count, type: integer, source: computed, description: "Technicians with technician_status == ACTIVE whose current_shop_location_id is this shop" }

  - name: Technician
    parent: null
    common_fields: true
    fields:
      - { name: full_name, type: string, source: input, description: "Technician full name" }
      - { name: current_shop_location_id, type: string, source: input, description: "FK -> ShopLocation.id; the shop the technician currently works at; null after trade exit" }
      - { name: technician_status, type: enum, source: system, description: "ACTIVE | SHOP_CHANGE_PENDING | TRADE_EXITED" }
      - { name: credit_line_limit_cents, type: integer, source: input, description: "Technician-level revolving ceiling, shared across every revolving account the technician holds" }
      - { name: credit_line_status, type: enum, source: system, description: "ACTIVE | RESTRICTED | TERMINATED" }
      - { name: home_route_id, type: string, source: computed, description: "Derived from current_shop_location_id: the route owning that shop; null when unassigned" }
      - { name: last_known_shop_name, type: string, source: computed, description: "shop_name of current_shop_location_id captured at the moment of trade exit; retained after exit" }
      - { name: revolving_used_cents, type: integer, source: computed, description: "Sum of current_balance_cents over the technician's accounts with account_kind == REVOLVING and account_status IN {ACTIVE, DELINQUENT}" }
      - { name: revolving_available_cents, type: integer, source: computed, description: "max(0, credit_line_limit_cents - revolving_used_cents)" }
      - { name: open_account_count, type: integer, source: computed, description: "Accounts of this technician with account_status IN {ACTIVE, DELINQUENT, CHARGED_OFF}" }
      - { name: months_in_trade, type: integer, source: input, description: "Months the technician has worked in the trade" }
      - { name: employment_verified, type: boolean, source: input, description: "Employment verification flag captured at onboarding" }

  - name: CreditApplication
    parent: ShopLocation
    common_fields: true
    fields:
      - { name: technician_id, type: string, source: input, description: "FK -> Technician.id; the applicant, whose current_shop_location_id must equal this application's parent shop" }
      - { name: requested_limit_cents, type: integer, source: input, description: "Requested revolving credit limit in cents" }
      - { name: requested_kind, type: enum, source: input, description: "REVOLVING | LEASE" }
      - { name: requested_term_months, type: integer, source: input, description: "Lease term in months; required when requested_kind == LEASE, ignored when REVOLVING" }
      - { name: employment_verified, type: boolean, source: input, description: "Whether employment at the shop was verified" }
      - { name: months_in_trade, type: integer, source: input, description: "Months the technician has worked in the trade at application time" }
      - { name: prior_delinquency_count, type: integer, source: input, description: "Count of prior delinquencies on file" }
      - { name: decision_source, type: enum, source: input, description: "FRANCHISEE | FRANCHISOR; which party adjudicates this application" }
      - { name: application_status, type: enum, source: system, description: "SUBMITTED | UNDER_REVIEW | APPROVED | DECLINED | WITHDRAWN" }
      - { name: decision_score, type: integer, source: computed, description: "Weighted credit score clamped to the integer range 0..100; see credit_decision_score" }
      - { name: approved_limit_cents, type: integer, source: computed, description: "Limit granted at approval; 0 before a decision and 0 when DECLINED" }
      - { name: approved_kind, type: enum, source: computed, description: "REVOLVING | LEASE; frozen at approval, null before a decision" }
      - { name: approved_term_months, type: integer, source: computed, description: "Term months frozen at approval; 0 for REVOLVING and 0 before a decision" }
      - { name: decision_note, type: string, source: system, description: "System-stamped explanation of the decision" }

  - name: CreditAccount
    parent: CreditApplication
    common_fields: true
    fields:
      - { name: technician_id, type: string, source: system, description: "FK -> Technician.id; the technician who draws on this account" }
      - { name: application_id, type: string, source: system, description: "FK -> CreditApplication.id; the approval that minted this account" }
      - { name: account_kind, type: enum, source: system, description: "REVOLVING | LEASE; frozen from the application's approved_kind" }
      - { name: credit_limit_cents, type: integer, source: system, description: "Frozen from the application's approved_limit_cents at creation" }
      - { name: account_status, type: enum, source: system, description: "ACTIVE | SUSPENDED | DELINQUENT | CHARGED_OFF | CLOSED" }
      - { name: account_status_changed_at, type: datetime, source: system, description: "Logical-clock timestamp of the last account_status change; drives effective_charge_off_week" }
      - { name: payment_due_weekday, type: integer, source: system, description: "Day of week payment must be collected, 1=Monday .. 7=Sunday; inherited from the opening route's visit_weekday" }
      - { name: recourse_holder, type: enum, source: system, description: "FRANCHISEE | FRANCHISOR; see resolve_recourse_holder" }
      - { name: is_lease_program, type: boolean, source: computed, description: "True when account_kind == LEASE" }
      - { name: is_revolving_program, type: boolean, source: computed, description: "True when account_kind == REVOLVING; exactly one of is_lease_program / is_revolving_program is true" }
      - { name: use_final_basis, type: boolean, source: system, description: "Frozen programme predicate the finance-charge engine reads; equals is_lease_program at account creation" }
      - { name: current_balance_cents, type: integer, source: computed, description: "principal_balance_cents plus accrued_finance_charge_cents" }
      - { name: principal_balance_cents, type: integer, source: computed, description: "Sum of collection_applied_cents over the account's FinanceCharges" }
      - { name: accrued_finance_charge_cents, type: integer, source: computed, description: "current_balance_cents minus principal_balance_cents; increased only by finance_charge_accrual" }
      - { name: credit_available_cents, type: integer, source: computed, description: "max(0, credit_limit_cents - current_balance_cents)" }
      - { name: next_due_weekday, type: integer, source: computed, description: "expected_week_weekday of the earliest Payment in BOOKED status on this account; equals payment_due_weekday when no Payment is BOOKED" }
      - { name: missed_payment_count, type: integer, source: computed, description: "Count of this account's Payments in MISSED status" }
      - { name: last_payment_week_start, type: datetime, source: computed, description: "expected_week_start of the latest Payment in COLLECTED status; null when none" }
      - { name: installment_due_cents, type: integer, source: computed, description: "Scheduled periodic payment for LEASE accounts; 0 for REVOLVING; see lease_amortization" }
      - { name: minimum_payment_due_cents, type: integer, source: computed, description: "See minimum_payment_due" }

  - name: FinanceCharge
    parent: CreditAccount
    common_fields: true
    fields:
      - { name: accrual_iso_week, type: datetime, source: system, description: "Monday 00:00:00Z of the accounting week the charge was computed for" }
      - { name: accrual_seq, type: integer, source: system, description: "Monotonic sequence within the account for one accrual_iso_week; starts at 1" }
      - { name: opening_balance_cents, type: integer, source: system, description: "Recorded account principal at the start of the accrual week, in cents" }
      - { name: charge_amount_cents, type: integer, source: computed, description: "Accrued charge for the week; see finance_charge_accrual" }
      - { name: collection_applied_cents, type: integer, source: computed, description: "Cents of payments applied to this charge; see payment_allocation" }
      - { name: charge_status, type: enum, source: system, description: "OPEN | CLOSED" }
      - { name: charge_resolved_iso_week, type: datetime, source: system, description: "Monday 00:00:00Z of the week the charge flipped to CLOSED; null while OPEN" }

  - name: Payment
    parent: CreditAccount
    common_fields: true
    fields:
      - { name: amount_cents, type: integer, source: input, description: "Cash amount in cents; must be a positive integer" }
      - { name: collection_source, type: enum, source: input, description: "TRUCK_COLLECTION | FRANCHISOR_DRAFT | SETTLEMENT_APPLIED" }
      - { name: expected_week_start, type: datetime, source: input, description: "Monday 00:00:00Z of the week the collection is expected; must be a Monday and may not precede the logical clock's week" }
      - { name: effective_iso_week, type: datetime, source: system, description: "Monday 00:00:00Z of the logical-clock week in which the payment reached COLLECTED; null while BOOKED" }
      - { name: payment_status, type: enum, source: system, description: "BOOKED | COLLECTED | MISSED | REVERSED | CANCELLED" }
      - { name: charge_applied_cents, type: integer, source: computed, description: "Total cents applied to FinanceCharges when the payment collected; see payment_allocation" }

  - name: SalesOrder
    parent: Route
    common_fields: true
    fields:
      - { name: technician_id, type: string, source: input, description: "FK -> Technician.id; the buyer" }
      - { name: credit_account_id, type: string, source: input, description: "FK -> CreditAccount.id; the account the sale is financed against" }
      - { name: mix_profile, type: enum, source: input, description: "DIAGNOSTIC_WEIGHTED | TOOL_STORAGE | POWER_TOOLS; selects the route product mix ranking" }
      - { name: order_status, type: enum, source: system, description: "DRAFT | CONFIRMED | DELIVERED | SETTLED | CANCELLED" }
      - { name: lines, type: array, source: input, description: "Array of {product_id, quantity, unit_price_cents, warranty_terms: {type, months}} in client order; the array index is the line index" }
      - { name: sale_iso_week, type: datetime, source: system, description: "Monday 00:00:00Z of the logical-clock week at creation" }
      - { name: line_count, type: integer, source: computed, description: "Number of entries in lines; 0 is rejected at creation" }
      - { name: gross_total_cents, type: integer, source: computed, description: "Sum over lines of unit_price_cents * quantity evaluated in line order with no intermediate rounding; see order_gross_total" }
      - { name: financed_principal_cents, type: integer, source: computed, description: "Net account principal increase at DELIVERED: gross_total_cents minus the sum of principal_allocated_cents over this order's WarrantyClaims; see order_financing_variant" }

  - name: WarrantyClaim
    parent: SalesOrder
    common_fields: true
    fields:
      - { name: line_index, type: integer, source: input, description: "Zero-based index into the parent order's lines array" }
      - { name: claim_kind, type: enum, source: input, description: "WARRANTY_REPLACEMENT | CLAIM" }
      - { name: claim_status, type: enum, source: system, description: "OPEN | SUBMITTED | APPROVED | REJECTED" }
      - { name: idempotency_key, type: string, source: input, description: "Client-supplied key, scoped to the parent order" }
      - { name: apply_to_account_id, type: string, source: input, description: "Pointer to CreditAccount.id — the account that absorbs the replacement charge when the claim is approved. Required when claim_kind == CLAIM, ignored for WARRANTY_REPLACEMENT" }
      - { name: filed_iso_week, type: datetime, source: system, description: "Monday 00:00:00Z of the week of filing" }
      - { name: resolved_iso_week, type: datetime, source: system, description: "Monday 00:00:00Z of the week of resolution; null while the claim is not terminal" }
      - { name: replacement_charge_cents, type: integer, source: computed, description: "0 inside warranty; otherwise min(line.unit_price_cents, floor(0.40 * Product.unit_cost_cents)); see warranty_replacement_charge" }
      - { name: warranty_credit_amount_cents, type: integer, source: computed, description: "For an APPROVED claim of kind CLAIM: min(line.unit_price_cents, floor(0.60 * Product.unit_cost_cents)); 0 otherwise" }
      - { name: principal_allocated_cents, type: integer, source: computed, description: "Principal actually written onto apply_to_account_id at resolution; see warranty_principal_allocation" }
      - { name: is_idempotent_replay, type: boolean, source: computed, description: "True when a WarrantyClaim already exists on the same order with the same idempotency_key" }

  - name: Product
    parent: null
    common_fields: true
    fields:
      - { name: sku, type: string, source: input, description: "Globally unique SKU" }
      - { name: product_name, type: string, source: input, description: "Human product name" }
      - { name: category, type: enum, source: input, description: "DIAGNOSTICS | TOOL_STORAGE | POWER_TOOLS" }
      - { name: unit_cost_cents, type: integer, source: input, description: "Franchisee landed cost per unit; the basis for warranty credit and replacement-charge caps" }
      - { name: retail_price_cents, type: integer, source: input, description: "Suggested retail price per unit" }
      - { name: default_warranty_months, type: integer, source: input, description: "Default warranty period in months" }
      - { name: is_new_launch, type: boolean, source: input, description: "True when the product participates in a launch allocation" }
      - { name: launch_iso_week, type: datetime, source: input, description: "Monday 00:00:00Z of the launch week; null when not a launch product" }
      - { name: launch_status, type: enum, source: system, description: "ANNOUNCED | ALLOCATED | LIVE" }

  - name: InventoryPosition
    parent: Route
    common_fields: true
    fields:
      - { name: product_id, type: string, source: input, description: "Pointer to Product.id — the SKU held. A route holds at most one position per product" }
      - { name: unit_cost_cents, type: integer, source: system, description: "Cost frozen from Product.unit_cost_cents when the position was created" }
      - { name: on_hand_qty, type: integer, source: computed, description: "Units physically on the truck" }
      - { name: reserved_qty, type: integer, source: computed, description: "Units committed to this route's SalesOrders in CONFIRMED status" }
      - { name: remaining_qty, type: integer, source: computed, description: "on_hand_qty minus reserved_qty" }

  - name: ProductOrder
    parent: Route
    common_fields: true
    fields:
      - { name: product_order_status, type: enum, source: system, description: "DRAFT | SUBMITTED | SHIPPED | RECEIVED | ALLOCATED | CANCELLED" }
      - { name: mix_profile, type: enum, source: input, description: "DIAGNOSTIC_WEIGHTED | TOOL_STORAGE | POWER_TOOLS; determines which category is ranked first" }
      - { name: investment_ceiling_cents, type: integer, source: input, description: "Truck inventory investment ceiling for this replenishment order" }
      - { name: requested_lines, type: array, source: input, description: "Array of {product_id, requested_qty} in the client's requested order; the array index is the line_index" }
      - { name: requested_cost_cents, type: integer, source: computed, description: "Sum over requested_lines of requested_qty * Product.unit_cost_cents" }
      - { name: ordered_lines, type: array, source: computed, description: "Array of {product_id, ordered_qty, line_index, unit_cost_cents}; see route_replenishment_allocation" }
      - { name: deferred_lines, type: array, source: computed, description: "Array of {product_id, line_index, deferred_qty} for quantities the ceiling could not cover" }
      - { name: ordered_cost_cents, type: integer, source: computed, description: "Sum over ordered_lines of ordered_qty * unit_cost_cents; never exceeds investment_ceiling_cents" }
      - { name: is_fully_covered, type: boolean, source: computed, description: "True when every requested line is covered in full" }

  - name: SharePledge
    parent: ProductOrder
    common_fields: true
    fields:
      - { name: credit_account_id, type: string, source: input, description: "FK -> CreditAccount.id; the account that will settle this pledge" }
      - { name: pledged_lines, type: array, source: input, description: "Array of {product_id, qty} the account agrees to settle" }
      - { name: pledge_status, type: enum, source: system, description: "HELD | BOUND | RELEASED | CONSUMED" }
      - { name: sustained_amount_cents, type: integer, source: computed, description: "Sum over pledged_lines of qty * the order line's unit_cost_cents for shares that survive the mixed-inventory plan; see mixed_inventory_plan" }

  - name: LaunchAllocation
    parent: Route
    common_fields: true
    fields:
      - { name: product_id, type: string, source: input, description: "Pointer to Product.id — the launched SKU being distributed" }
      - { name: allocation_status, type: enum, source: system, description: "PLANNED | ALLOCATED | LIVE | CANCELLED" }
      - { name: priority_score, type: number, source: computed, description: "Route ranking score for this product; see launch_allocation_plan" }
      - { name: review_flag, type: boolean, source: input, description: "Set when the route's launch risk band is disputed and needs a manager review" }
      - { name: allocated_qty, type: integer, source: computed, description: "Units granted to this route; see launch_allocation_plan" }
      - { name: allocated_amount_cents, type: integer, source: computed, description: "allocated_qty * Product.unit_cost_cents" }
      - { name: launch_risk_band, type: enum, source: computed, description: "LOW | MEDIUM | HIGH for this route on this product; see launch_allocation_plan" }# =============================================================================
# §1.2 State Machine Table
# =============================================================================
state_machines:

  # --- SM1: Franchisee training — cyclic (ENROLLED ⇄ CERTIFIED) ---
  - entity: Franchisee
    field: training_status
    initial_state: NOT_ENROLLED
    terminal_states: []
    transitions:
      - from: NOT_ENROLLED
        to: ENROLLED
        trigger: "POST /retail/franchisees/{id}/training with action=ENROLL"
        actor: FranchiseOwner
        preconditions:
          - "franchisee.training_status == NOT_ENROLLED"
        side_effects:
          - "Franchisee.training_status = ENROLLED"
          - "Franchisee.can_resell_territory recomputed = false"
        note: "training_points is recorded on the enrollment row as the training programme progress."

      - from: ENROLLED
        to: CERTIFIED
        trigger: "POST /retail/franchisees/{id}/training with action=CERTIFY"
        actor: FranchiseOwner
        preconditions:
          - "franchisee.training_status == ENROLLED"
          - "franchisee.training_points >= 40"
        side_effects:
          - "Franchisee.training_status = CERTIFIED"
          - "Franchisee.certified_on = logical clock"
          - "Franchisee.can_resell_territory recomputed = true"
        note: "CASCADE ORIGIN — see §1.2 SM1 ENROLLED_to_CERTIFIED chain below."

      - from: CERTIFIED
        to: ENROLLED
        trigger: "POST /retail/franchisees/{id}/training with action=RECERTIFY"
        actor: FranchiseOwner
        preconditions:
          - "franchisee.training_status == CERTIFIED"
        side_effects:
          - "Franchisee.training_status = ENROLLED"
          - "Franchisee.certified_on = null"
          - "Franchisee.can_resell_territory recomputed = false"
        note: "Backward edge: a certified franchisee returning for re-certification re-enters the cycle."

  # --- SM2: Route lifecycle — cyclic (SUSPENDED ⇄ IN_SERVICE) ---
  - entity: Route
    field: route_status
    initial_state: DRAFT
    terminal_states: [RETIRED]
    transitions:
      - from: DRAFT
        to: IN_SERVICE
        trigger: "POST /retail/routes/{id}/status with action=ACTIVATE"
        actor: FranchiseOwner
        preconditions:
          - "route.route_status == DRAFT"
          - "route.zip_codes is non-empty"
          - "the owning franchisee has franchisee.training_status == CERTIFIED"
          - "route.inventory_invested_cents >= 1"
        side_effects:
          - "Route.route_status = IN_SERVICE"
          - "route.schedule_anchor_utc recomputed (route_schedule_anchor)"
          - "Franchisee.active_route_count recomputed"
        note: "CASCADE step 4 destination for the franchisee-certification chain; a route already IN_SERVICE accepts further certificate renewals without re-activation."

      - from: IN_SERVICE
        to: SUSPENDED
        trigger: "POST /retail/routes/{id}/status with action=SUSPEND"
        actor: FranchiseManager
        preconditions:
          - "route.route_status == IN_SERVICE"
        side_effects:
          - "Route.route_status = SUSPENDED"
          - "Every ShopLocation on this route with shop_status == ACTIVE → INACTIVE"
          - "Franchisee.active_route_count recomputed"
        note: "CASCADE ORIGIN — route suspension chain: Route → ShopLocation → Technician → CreditAccount. See §1.2 SM2 IN_SERVICE_to_SUSPENDED chain."

      - from: SUSPENDED
        to: IN_SERVICE
        trigger: "POST /retail/routes/{id}/status with action=REINSTATE"
        actor: FranchiseManager
        preconditions:
          - "route.route_status == SUSPENDED"
        side_effects:
          - "Route.route_status = IN_SERVICE"
          - "ShopLocations on this route left INACTIVE by suspension stay INACTIVE — reinstatement does not reopen shops"
          - "Franchisee.active_route_count recomputed"
        note: "Backward edge — compensation pair with IN_SERVICE_to_SUSPENDED."

      - from: [DRAFT, SUSPENDED]
        to: RETIRED
        trigger: "POST /retail/routes/{id}/status with action=RETIRE"
        actor: FranchiseManager
        preconditions:
          - "route.route_status IN {DRAFT, SUSPENDED}"
          - "route.resale_status != PENDING"
        side_effects:
          - "Route.route_status = RETIRED"
          - "route.tarritory_development_status → SURRENDERED when it was QUALIFIED; in_force_to_week stamped"
          - "Franchisee.active_route_count recomputed"

  # --- SM3: Territory development — parallel dimension on Route ---
  - entity: Route
    field: territory_development_status
    initial_state: UNASSIGNED
    terminal_states: []
    transitions:
      - from: UNASSIGNED
        to: IN_DEVELOPMENT
        trigger: "POST /retail/routes/{id}/territory with action=DEVELOP"
        actor: FranchiseOwner
        preconditions:
          - "route.territory_development_status == UNASSIGNED"
          - "route.territory_model is set"
        side_effects:
          - "Route.territory_development_status = IN_DEVELOPMENT"
          - "Route.territory_points = requested territory_points"
          - "Route.in_force_from_week = Monday 00:00:00Z of the logical clock's week"

      - from: IN_DEVELOPMENT
        to: QUALIFIED
        trigger: "POST /retail/routes/{id}/territory with action=DEVELOP and territory_points >= 60"
        actor: FranchiseOwner
        preconditions:
          - "route.territory_development_status == IN_DEVELOPMENT"
          - "route.territory_points >= 60"
          - "route.route_status == IN_SERVICE"
        side_effects:
          - "Route.territory_development_status = QUALIFIED"
          - "Credited accounts opened from this point inherit route.territory_model as recourse_holder"
        note: "Cross-entity precondition: qualification requires route_status == IN_SERVICE. See rule cross_entity_state_dependency."

      - from: QUALIFIED
        to: IN_DEVELOPMENT
        trigger: "POST /retail/routes/{id}/territory with action=DEVELOP and a reset development round"
        actor: FranchiseManager
        preconditions:
          - "route.territory_development_status == QUALIFIED"
        side_effects:
          - "Route.territory_development_status = IN_DEVELOPMENT"
          - "Route.territory_points reset to 0"
        note: "Backward edge — a new development round starts from a qualified territory."

      - from: QUALIFIED
        to: SURRENDERED
        trigger: "POST /retail/routes/{id}/territory with action=SURRENDER"
        actor: FranchiseManager
        preconditions:
          - "route.territory_development_status == QUALIFIED"
          - "route.resale_status == NONE"
        side_effects:
          - "Route.territory_development_status = SURRENDERED"
          - "Route.in_force_to_week = Monday 00:00:00Z of the logical clock's week"
          - "CreditAccounts whose opening territory is this route keep territory_id — recourse_holder is frozen, not recomputed"
        note: "Temporal-window close. TERMINAL for this axis; independent of route_status."

      - from: IN_DEVELOPMENT
        to: SURRENDERED
        trigger: "POST /retail/routes/{id}/territory with action=SURRENDER"
        actor: FranchiseManager
        preconditions:
          - "route.territory_development_status == IN_DEVELOPMENT"
          - "route.resale_status == NONE"
        side_effects:
          - "Route.territory_development_status = SURRENDERED"
          - "Route.in_force_to_week = Monday 00:00:00Z of the logical clock's week"
        note: "An abandoned development round can be surrendered without ever qualifying; the surrendered point floor defers territory_points - 60 to 0."

  # --- SM4: Route resale — third parallel dimension on Route, cyclic ---
  - entity: Route
    field: resale_status
    initial_state: NONE
    terminal_states: []
    transitions:
      - from: NONE
        to: PENDING
        trigger: "POST /retail/routes/{id}/resale with action=FILE"
        actor: FranchiseOwner
        preconditions:
          - "route.resale_status == NONE"
          - "the selling franchisee has franchisee.training_status == CERTIFIED"
          - "route.territory_development_status == QUALIFIED"
        side_effects:
          - "Route.resale_status = PENDING"
          - "Route.reopening_fee_cents recomputed (reopening_fee)"
          - "Route.resale_buyer_training_status = requested buyer_training_status"
          - "Route.resale_trained_points = requested buyer_training_points"

      - from: PENDING
        to: APPROVED
        trigger: "POST /retail/routes/{id}/resale with action=FILE with action=APPROVE"
        actor: FranchiseManager
        preconditions:
          - "route.resale_status == PENDING"
          - "route.reopening_fee_cents <= FRANCHISEE_RESALE_FEE_CAP_CENTS"
        side_effects:
          - "Route.resale_status = APPROVED"

      - from: PENDING
        to: DECLINED
        trigger: "POST /retail/routes/{id}/resale with action=FILE with action=DECLINE"
        actor: FranchiseManager
        preconditions:
          - "route.resale_status == PENDING"
        side_effects:
          - "Route.resale_status = DECLINED"

      - from: DECLINED
        to: PENDING
        trigger: "POST /retail/routes/{id}/resale with action=FILE"
        actor: FranchiseOwner
        preconditions:
          - "route.resale_status == DECLINED"
          - "the selling franchisee has franchisee.training_status == CERTIFIED"
        side_effects:
          - "Route.resale_status = PENDING"
          - "Route.reopening_fee_cents recomputed (reopening_fee)"
        note: "Backward edge — a declined resale can be re-filed."

      - from: APPROVED
        to: NONE
        trigger: "system (buyer takes over; route_status returns to IN_SERVICE under the new owner)"
        actor: system
        preconditions:
          - "route.resale_status == APPROVED"
        side_effects:
          - "Route.resale_status = NONE"
          - "Route.resale_buyer_training_status reset to NOT_ENROLLED"
          - "Route.resale_trained_points reset to 0"# --- SM5: Credit application adjudication — dual-decision-source, branching with revert ---
  - entity: CreditApplication
    field: application_status
    initial_state: SUBMITTED
    terminal_states: [WITHDRAWN]
    transitions:
      - from: SUBMITTED
        to: UNDER_REVIEW
        trigger: "POST /retail/credit-applications/{id}/status with action=REVIEW"
        actor: CreditOfficer
        preconditions:
          - "application.application_status == SUBMITTED"
          - "application.decision_source == FRANCHISOR"
        side_effects:
          - "CreditApplication.decision_score recomputed (credit_decision_score)"

      - from: UNDER_REVIEW
        to: APPROVED
        trigger: "POST /retail/credit-applications/{id}/status with action=APPROVE"
        actor: CreditOfficer
        preconditions:
          - "application.application_status == UNDER_REVIEW"
          - "application.decision_source == FRANCHISOR"
          - "application.decision_score >= 55"
        side_effects:
          - "CreditApplication.application_status = APPROVED"
          - "CreditApplication.approved_limit_cents = approved_limit_cents (credit_decision_limit)"
          - "CreditApplication.approved_kind = application.requested_kind"
          - "CreditApplication.approved_term_months = application.requested_term_months (0 for REVOLVING)"
          - "CreditApplication.decision_note stamped"
        note: "CASCADE ORIGIN — application-approval cascade; see the approval_opens_account chain in §1.2 SM6."

      - from: UNDER_REVIEW
        to: DECLINED
        trigger: "POST /retail/credit-applications/{id}/status with action=DECLINE"
        actor: CreditOfficer
        preconditions:
          - "application.application_status == UNDER_REVIEW"
          - "application.decision_source == FRANCHISOR"
        side_effects:
          - "CreditApplication.application_status = DECLINED"
          - "CreditApplication.approved_limit_cents = 0"
          - "CreditApplication.decision_note stamped"

      - from: SUBMITTED
        to: APPROVED
        trigger: "POST /retail/credit-applications/{id}/status with action=APPROVE"
        actor: FranchiseOwner
        preconditions:
          - "application.application_status == SUBMITTED"
          - "application.decision_source == FRANCHISEE"
          - "application.decision_score >= 40"
          - "application.employment_verified == true"
        side_effects:
          - "CreditApplication.application_status = APPROVED"
          - "CreditApplication.approved_limit_cents = approved_limit_cents (credit_decision_limit)"
          - "CreditApplication.approved_kind = application.requested_kind"
          - "CreditApplication.approved_term_months = application.requested_term_months (0 for REVOLVING)"
          - "CreditApplication.decision_note stamped"

      - from: SUBMITTED
        to: DECLINED
        trigger: "POST /retail/credit-applications/{id}/status with action=DECLINE"
        actor: FranchiseOwner
        preconditions:
          - "application.application_status == SUBMITTED"
          - "application.decision_source == FRANCHISEE"
        side_effects:
          - "CreditApplication.application_status = DECLINED"
          - "CreditApplication.approved_limit_cents = 0"
          - "CreditApplication.decision_note stamped"

      - from: DECLINED
        to: SUBMITTED
        trigger: "POST /retail/credit-applications/{id}/status with action=REOPEN"
        actor: FranchiseOwner
        preconditions:
          - "application.application_status == DECLINED"
          - "application.decision_source == FRANCHISEE"
        side_effects:
          - "CreditApplication.application_status = SUBMITTED"
          - "CreditApplication.decision_score recomputed (credit_decision_score)"
        note: "Backward edge — a franchisee-declined application may be re-filed."

      - from: [SUBMITTED, UNDER_REVIEW]
        to: WITHDRAWN
        trigger: "POST /retail/credit-applications/{id}/status with action=WITHDRAW"
        actor: FranchiseOwner
        preconditions:
          - "application.application_status IN {SUBMITTED, UNDER_REVIEW}"
        side_effects:
          - "CreditApplication.application_status = WITHDRAWN"

  # --- SM6: Credit account posture — cyclic (ACTIVE ⇄ SUSPENDED ⇄ DELINQUENT) ---
  - entity: CreditAccount
    field: account_status
    initial_state: ACTIVE
    terminal_states: [CLOSED]
    transitions:
      - from: APPLIED
        to: ACTIVE
        trigger: "POST /retail/credit-applications/{id}/accounts"
        actor: system
        preconditions:
          - "the parent CreditApplication.application_status == APPROVED"
        side_effects:
          - "CreditAccount.account_status = ACTIVE"
          - "CreditAccount.account_status_changed_at = logical clock"
          - "CreditAccount.credit_limit_cents = parent application.approved_limit_cents"
          - "CreditAccount.account_kind = parent application.approved_kind"
          - "CreditAccount.recourse_holder = resolve_recourse_holder (resolve_recourse_holder)"
          - "CreditAccount.payment_due_weekday = the opening route's visit_weekday"
          - "CreditAccount.is_lease_program recomputed"
          - "Technician.revolving_used_cents recomputed"
          - "Franchisee.outstanding_credit_cents recomputed"
        note: "Minting transition; the account row is created here, so APPLIED is a transient initial state."

      - from: ACTIVE
        to: SUSPENDED
        trigger: "POST /retail/credit-accounts/{id}/status with action=SUSPEND"
        actor: CreditOfficer
        preconditions:
          - "account.account_status == ACTIVE"
          - "account.credit_available_cents == 0"
        side_effects:
          - "CreditAccount.account_status = SUSPENDED"
          - "CreditAccount.account_status_changed_at = logical clock"
          - "Technician.revolving_available_cents recomputed"

      - from: SUSPENDED
        to: ACTIVE
        trigger: "POST /retail/credit-accounts/{id}/status with action=REINSTATE"
        actor: CreditOfficer
        preconditions:
          - "account.account_status == SUSPENDED"
          - "account.credit_available_cents > 0"
        side_effects:
          - "CreditAccount.account_status = ACTIVE"
          - "CreditAccount.account_status_changed_at = logical clock"
        note: "Backward edge — compensation pair with ACTIVE_to_SUSPENDED. A suspension cannot be lifted while the account is still fully drawn."

      - from: ACTIVE
        to: DELINQUENT
        trigger: "POST /retail/credit-accounts/{id}/payments/{paymentId}/status with action=MISS"
        actor: FranchiseManager
        preconditions:
          - "account.account_status == ACTIVE"
          - "the named Payment.payment_status == BOOKED"
          - "payment.expected_week_start < Monday 00:00:00Z of the logical clock's week"
        side_effects:
          - "CreditAccount.account_status = DELINQUENT"
          - "CreditAccount.account_status_changed_at = logical clock"
          - "Payment.payment_status = MISSED"
          - "Payment.effective_iso_week = null"
          - "CreditAccount.missed_payment_count recomputed"
          - "CreditAccount.accrued_finance_charge_cents recomputed (finance_charge_accrual)"
          - "CreditAccount.minimum_payment_due_cents recomputed (minimum_payment_due)"
          - "Technician.revolving_available_cents recomputed"
          - "Franchisee.outstanding_credit_cents recomputed"
        note: "CASCADE ORIGIN — 4-hop delinquency cascade: CreditAccount → Technician → Franchisee → the technician's home ShopLocation. See §1.2 SM6 ACTIVE_to_DELINQUENT chain."

      - from: SUSPENDED
        to: DELINQUENT
        trigger: "POST /retail/credit-accounts/{id}/payments/{paymentId}/status with action=MISS"
        actor: FranchiseManager
        preconditions:
          - "account.account_status == SUSPENDED"
          - "the named Payment.payment_status == BOOKED"
          - "payment.expected_week_start < Monday 00:00:00Z of the logical clock's week"
        side_effects:
          - "CreditAccount.account_status = DELINQUENT"
          - "CreditAccount.account_status_changed_at = logical clock"
          - "Payment.payment_status = MISSED"
          - "Payment.effective_iso_week = null"
          - "CreditAccount.missed_payment_count recomputed"
          - "CreditAccount.accrued_finance_charge_cents recomputed (finance_charge_accrual)"
          - "Technician.revolving_available_cents recomputed"
          - "Franchisee.outstanding_credit_cents recomputed"
        note: "Delinquency is the stronger posture: a suspended account goes straight to DELINQUENT, no reinstate step in between."

      - from: DELINQUENT
        to: ACTIVE
        trigger: "POST /retail/credit-accounts/{id}/status with action=REINSTATE"
        actor: CreditOfficer
        preconditions:
          - "account.account_status == DELINQUENT"
          - "account.missed_payment_count == 0"
          - "account.accrued_finance_charge_cents == 0"
        side_effects:
          - "CreditAccount.account_status = ACTIVE"
          - "CreditAccount.account_status_changed_at = logical clock"
          - "Technician.revolving_available_cents recomputed"
        note: "Backward edge — cure requires both a clean payment record and a zero accrued charge."

      - from: DELINQUENT
        to: CHARGED_OFF
        trigger: "system (charge-off sweep at the delinquency anniversary week)"
        actor: system
        preconditions:
          - "account.account_status == DELINQUENT"
          - "effective_charge_off_week (charge_off_week) <= Monday 00:00:00Z of the logical clock's week"
        side_effects:
          - "CreditAccount.account_status = CHARGED_OFF"
          - "CreditAccount.account_status_changed_at = logical clock"
          - "Technician.revolving_available_cents recomputed"
          - "Franchisee.outstanding_credit_cents recomputed"
          - "Franchisee.recourse_exposure_cents recomputed (recourse_holder may be FRANCHISEE)"

      - from: ACTIVE
        to: CHARGED_OFF
        trigger: "system (charge-off sweep when the account ages out with no live booking)"
        actor: system
        preconditions:
          - "account.account_status == ACTIVE"
          - "account.missed_payment_count >= 3"
          - "effective_charge_off_week (charge_off_week) <= Monday 00:00:00Z of the logical clock's week"
        side_effects:
          - "CreditAccount.account_status = CHARGED_OFF"
          - "CreditAccount.account_status_changed_at = logical clock"
          - "Technician.revolving_available_cents recomputed"
          - "Franchisee.outstanding_credit_cents recomputed"

      - from: CHARGED_OFF
        to: CLOSED
        trigger: "POST /retail/credit-accounts/{id}/status with action=SETTLE_CHARGE_OFF"
        actor: FranchiseManager
        preconditions:
          - "account.account_status == CHARGED_OFF"
          - "account.current_balance_cents == 0"
        side_effects:
          - "CreditAccount.account_status = CLOSED"
          - "CreditAccount.account_status_changed_at = logical clock"# --- SM7: Sales order fulfillment — linear with compensation ---
  - entity: SalesOrder
    field: order_status
    initial_state: DRAFT
    terminal_states: [SETTLED]
    transitions:
      - from: DRAFT
        to: CONFIRMED
        trigger: "POST /retail/sales-orders/{id}/status with action=CONFIRM"
        actor: RouteSalesRep
        preconditions:
          - "order.order_status == DRAFT"
          - "order.line_count >= 1"
          - "the target CreditAccount.account_status == ACTIVE"
          - "every line's quantity <= the matching InventoryPosition.remaining_qty on order.route_id"
          - "the order's technician.home_route_id == order.route_id"
        side_effects:
          - "SalesOrder.order_status = CONFIRMED"
          - "SalesOrder.gross_total_cents recomputed (order_gross_total)"
          - "SalesOrder.financed_principal_cents recomputed (order_financing_variant)"
          - "each line's InventoryPosition.reserved_qty incremented by the line quantity"
          - "Route.inventory_at_risk_cents recomputed"
          - "Route.over_pledge_cents recomputed (inventory_over_pledge)"
          - "Technician's CreditAccount.credit_available_cents recomputed (financed_principal reserved)"
        note: "CASCADE ORIGIN — confirmation cascade: SalesOrder → InventoryPosition → Route. See §1.2 SM7 DRAFT_to_CONFIRMED chain."

      - from: CONFIRMED
        to: DELIVERED
        trigger: "POST /retail/sales-orders/{id}/status with action=DELIVER"
        actor: RouteSalesRep
        preconditions:
          - "order.order_status == CONFIRMED"
          - "the financial ceiling check passes for order.financed_principal_cents"
        side_effects:
          - "SalesOrder.order_status = DELIVERED"
          - "each line's InventoryPosition.on_hand_qty decremented by the line quantity"
          - "each line's InventoryPosition.reserved_qty decremented by the line quantity"
          - "CreditAccount.principal_balance_cents increased by financed_principal_cents"
          - "CreditAccount.current_balance_cents recomputed"
          - "CreditAccount.credit_available_cents recomputed"
          - "Technician.revolving_used_cents recomputed"
          - "Franchisee.outstanding_credit_cents recomputed"

      - from: DELIVERED
        to: SETTLED
        trigger: "POST /retail/sales-orders/{id}/status with action=SETTLE"
        actor: CreditOfficer
        preconditions:
          - "order.order_status == DELIVERED"
          - "no WarrantyClaim on this order is in OPEN or SUBMITTED status"
          - "the order has no outstanding charge allocated to a reversed Payment"
        side_effects:
          - "SalesOrder.order_status = SETTLED"

      - from: [DRAFT, CONFIRMED]
        to: CANCELLED
        trigger: "POST /retail/sales-orders/{id}/status with action=CANCEL"
        actor: RouteSalesRep
        preconditions:
          - "order.order_status IN {DRAFT, CONFIRMED}"
        side_effects:
          - "SalesOrder.order_status = CANCELLED"
          - "each line's InventoryPosition.reserved_qty decremented by the line quantity"
          - "Route.inventory_at_risk_cents recomputed"
          - "Route.over_pledge_cents recomputed (inventory_over_pledge)"
        note: "Compensation of the DRAFT_to_CONFIRMED reservation; no account principal was written, so no ledger reversal is needed."

  # --- SM8: Payment lifecycle — linear with revert and one backward edge ---
  - entity: Payment
    field: payment_status
    initial_state: BOOKED
    terminal_states: [COLLECTED, REVERSED, CANCELLED]
    transitions:
      - from: BOOKED
        to: COLLECTED
        trigger: "POST /retail/credit-accounts/{id}/payments/{paymentId}/status with action=COLLECT"
        actor: RouteSalesRep
        preconditions:
          - "payment.payment_status == BOOKED"
          - "payment.amount_cents > 0"
          - "the parent CreditAccount.account_status IN {ACTIVE, SUSPENDED, DELINQUENT}"
        side_effects:
          - "Payment.payment_status = COLLECTED"
          - "Payment.effective_iso_week = Monday 00:00:00Z of the logical clock's week"
          - "Payment.charge_applied_cents = payment_allocation (payment_allocation)"
          - "the account's FinanceCharges updated oldest-first (payment_allocation)"
          - "CreditAccount.principal_balance_cents recomputed"
          - "CreditAccount.accrued_finance_charge_cents recomputed"
          - "CreditAccount.current_balance_cents recomputed"
          - "CreditAccount.credit_available_cents recomputed"
          - "CreditAccount.last_payment_week_start recomputed"
          - "CreditAccount.account_status → ACTIVE when it was SUSPENDED and credit_available_cents > 0"
          - "Technician.revolving_used_cents recomputed"
          - "Franchisee.outstanding_credit_cents recomputed"
          - "Franchisee.recourse_exposure_cents recomputed"
        note: "CASCADE ORIGIN — collection cascade: Payment → FinanceCharge → CreditAccount → Technician → Franchisee. See §1.2 SM8 BOOKED_to_COLLECTED chain."

      - from: BOOKED
        to: MISSED
        trigger: "POST /retail/credit-accounts/{id}/payments/{paymentId}/status with action=MISS"
        actor: FranchiseManager
        preconditions:
          - "payment.payment_status == BOOKED"
          - "payment.expected_week_start < Monday 00:00:00Z of the logical clock's week"
        side_effects:
          - "Payment.payment_status = MISSED"
          - "the parent CreditAccount.account_status → DELINQUENT (see §1.2 SM6)"
          - "CreditAccount.missed_payment_count recomputed"

      - from: MISSED
        to: COLLECTED
        trigger: "POST /retail/credit-accounts/{id}/payments/{paymentId}/status with action=COLLECT"
        actor: RouteSalesRep
        preconditions:
          - "payment.payment_status == MISSED"
          - "the parent CreditAccount.account_status == DELINQUENT"
        side_effects:
          - "Payment.payment_status = COLLECTED"
          - "Payment.effective_iso_week = Monday 00:00:00Z of the logical clock's week"
          - "Payment.charge_applied_cents = payment_allocation (payment_allocation)"
          - "CreditAccount.missed_payment_count recomputed"
          - "CreditAccount.current_balance_cents recomputed"
        note: "Backward edge — a missed booking can still be cured by a late truck collection; the MISSED row is not terminal."

      - from: BOOKED
        to: CANCELLED
        trigger: "POST /retail/credit-accounts/{id}/payments/{paymentId}/status with action=CANCEL"
        actor: FranchiseManager
        preconditions:
          - "payment.payment_status == BOOKED"
        side_effects:
          - "Payment.payment_status = CANCELLED"
          - "CreditAccount.next_due_weekday recomputed"

      - from: COLLECTED
        to: REVERSED
        trigger: "POST /retail/credit-accounts/{id}/payments/{paymentId}/status with action=REVERSE"
        actor: CreditOfficer
        preconditions:
          - "payment.payment_status == COLLECTED"
        side_effects:
          - "Payment.payment_status = REVERSED"
          - "every FinanceCharge credited by this payment has collection_applied_cents reduced (payment_allocation reversed)"
          - "any FinanceCharge whose collection_applied_cents returns to 0 reverts to OPEN and clears charge_resolved_iso_week"
          - "CreditAccount.principal_balance_cents recomputed"
          - "CreditAccount.accrued_finance_charge_cents recomputed"
          - "CreditAccount.current_balance_cents recomputed"
          - "CreditAccount.credit_available_cents recomputed"
          - "Technician.revolving_used_cents recomputed"
          - "Franchisee.outstanding_credit_cents recomputed"

  # --- SM9: Product (replenishment) order — linear with compensation ---
  - entity: ProductOrder
    field: product_order_status
    initial_state: DRAFT
    terminal_states: [ALLOCATED, CANCELLED]
    transitions:
      - from: DRAFT
        to: SUBMITTED
        trigger: "POST /retail/product-orders/{id}/status with action=SUBMIT"
        actor: FranchiseOwner
        preconditions:
          - "order.product_order_status == DRAFT"
          - "order.requested_lines is non-empty"
          - "order.requested_cost_cents <= order.investment_ceiling_cents"
        side_effects:
          - "ProductOrder.product_order_status = SUBMITTED"
          - "ProductOrder.ordered_lines recomputed (route_replenishment_allocation)"
          - "ProductOrder.ordered_cost_cents recomputed"
          - "ProductOrder.deferred_lines recomputed"
          - "ProductOrder.is_fully_covered recomputed"

      - from: SUBMITTED
        to: SHIPPED
        trigger: "POST /retail/product-orders/{id}/status with action=SHIP"
        actor: FranchiseManager
        preconditions:
          - "order.product_order_status == SUBMITTED"
          - "every SharePledge under this order has pledge_status IN {BOUND, RELEASED}"
        side_effects:
          - "ProductOrder.product_order_status = SHIPPED"

      - from: SHIPPED
        to: RECEIVED
        trigger: "POST /retail/product-orders/{id}/status with action=RECEIVE"
        actor: FranchiseOwner
        preconditions:
          - "order.product_order_status == SHIPPED"
        side_effects:
          - "ProductOrder.product_order_status = RECEIVED"
          - "each ordered line's InventoryPosition.on_hand_qty increased by ordered_qty; a position is created when the route holds none for that product"
          - "Route.inventory_at_risk_cents recomputed"

      - from: RECEIVED
        to: ALLOCATED
        trigger: "POST /retail/product-orders/{id}/status with action=ALLOCATE"
        actor: FranchiseManager
        preconditions:
          - "order.product_order_status == RECEIVED"
          - "every SharePledge under this order has pledge_status == BOUND"
        side_effects:
          - "ProductOrder.product_order_status = ALLOCATED"
          - "each SharePledge.pledge_status = CONSUMED"
          - "each SharePledge.sustained_amount_cents recomputed (mixed_inventory_plan)"
          - "each bound CreditAccount.credit_available_cents recomputed"

      - from: [DRAFT, SUBMITTED, SHIPPED, RECEIVED]
        to: CANCELLED
        trigger: "POST /retail/product-orders/{id}/status with action=CANCEL"
        actor: FranchiseManager
        preconditions:
          - "order.product_order_status IN {DRAFT, SUBMITTED, SHIPPED, RECEIVED}"
        side_effects:
          - "ProductOrder.product_order_status = CANCELLED"
          - "every SharePledge under this order → RELEASED"

  # --- SM10: Warranty claim — resolution pipeline with revert ---
  - entity: WarrantyClaim
    field: claim_status
    initial_state: OPEN
    terminal_states: [APPROVED, REJECTED]
    transitions:
      - from: OPEN
        to: SUBMITTED
        trigger: "POST /retail/sales-orders/{id}/warranty-claims/{claimId}/status with action=SUBMIT"
        actor: RouteSalesRep
        preconditions:
          - "claim.claim_status == OPEN"
          - "claim.line_index is within the parent order's lines array"
        side_effects:
          - "WarrantyClaim.claim_status = SUBMITTED"
          - "WarrantyClaim.replacement_charge_cents recomputed (warranty_replacement_charge)"
          - "WarrantyClaim.warranty_credit_amount_cents recomputed (warranty_replacement_charge)"

      - from: SUBMITTED
        to: APPROVED
        trigger: "POST /retail/sales-orders/{id}/warranty-claims/{claimId}/status with action=APPROVE"
        actor: WarrantyAdmin
        preconditions:
          - "claim.claim_status == SUBMITTED"
          - "when claim.claim_kind == CLAIM, claim.apply_to_account_id names an existing CreditAccount"
        side_effects:
          - "WarrantyClaim.claim_status = APPROVED"
          - "WarrantyClaim.resolved_iso_week = Monday 00:00:00Z of the logical clock's week"
          - "WarrantyClaim.principal_allocated_cents = warranty_principal_allocation (warranty_principal_allocation)"
          - "the target CreditAccount.principal_balance_cents adjusted by principal_allocated_cents"
          - "CreditAccount.current_balance_cents recomputed"
          - "CreditAccount.credit_available_cents recomputed"
          - "the parent SalesOrder.financed_principal_cents recomputed (order_financing_variant)"
          - "Technician.revolving_used_cents recomputed"
          - "Franchisee.outstanding_credit_cents recomputed"
        note: "CASCADE ORIGIN — warranty approval cascade: WarrantyClaim → CreditAccount → Technician → Franchisee. See §1.2 SM10 SUBMITTED_to_APPROVED chain."

      - from: SUBMITTED
        to: REJECTED
        trigger: "POST /retail/sales-orders/{id}/warranty-claims/{claimId}/status with action=REJECT"
        actor: WarrantyAdmin
        preconditions:
          - "claim.claim_status == SUBMITTED"
        side_effects:
          - "WarrantyClaim.claim_status = REJECTED"
          - "WarrantyClaim.resolved_iso_week = Monday 00:00:00Z of the logical clock's week"
          - "WarrantyClaim.principal_allocated_cents = 0"

      - from: APPROVED
        to: SUBMITTED
        trigger: "POST /retail/sales-orders/{id}/warranty-claims/{claimId}/status with action=REOPEN"
        actor: WarrantyAdmin
        preconditions:
          - "claim.claim_status == APPROVED"
        side_effects:
          - "WarrantyClaim.claim_status = SUBMITTED"
          - "WarrantyClaim.resolved_iso_week = null"
          - "the principal previously allocated is removed from the target account"
          - "the parent SalesOrder.financed_principal_cents recomputed (order_financing_variant)"
        note: "Backward edge — an approval can be reopened, and the principal allocation is reversed exactly."

      - from: REJECTED
        to: SUBMITTED
        trigger: "POST /retail/sales-orders/{id}/warranty-claims/{claimId}/status with action=SUBMIT"
        actor: RouteSalesRep
        preconditions:
          - "claim.claim_status == REJECTED"
          - "claim.idempotency_key unchanged from the rejected submission"
        side_effects:
          - "WarrantyClaim.claim_status = SUBMITTED"
          - "WarrantyClaim.resolved_iso_week = null"
        note: "Backward edge — a rejected claim can be resubmitted under its original idempotency key."

  # --- SM11: Technician standing — guarded by shop change and trade exit ---
  - entity: Technician
    field: technician_status
    initial_state: ACTIVE
    terminal_states: [TRADE_EXITED]
    transitions:
      - from: ACTIVE
        to: SHOP_CHANGE_PENDING
        trigger: "POST /retail/technicians/{id}/status with action=CHANGE_SHOP"
        actor: FranchiseOwner
        preconditions:
          - "technician.technician_status == ACTIVE"
          - "the target ShopLocation.shop_status == ACTIVE"
          - "every CreditAccount of this technician has account_status IN {ACTIVE, SUSPENDED, DELINQUENT, CHARGED_OFF}"
        side_effects:
          - "Technician.technician_status = SHOP_CHANGE_PENDING"
          - "Technician.current_shop_location_id = the target shop"
          - "Technician.home_route_id recomputed"
          - "the source ShopLocation.active_technician_count recomputed"
          - "the target ShopLocation.active_technician_count recomputed"
          - "each of the technician's CreditAccounts keeps territory_id and recourse_holder — neither is recomputed on a shop move"

      - from: SHOP_CHANGE_PENDING
        to: ACTIVE
        trigger: "POST /retail/technicians/{id}/status with action=CONFIRM_SHOP"
        actor: FranchiseOwner
        preconditions:
          - "technician.technician_status == SHOP_CHANGE_PENDING"
        side_effects:
          - "Technician.technician_status = ACTIVE"
          - "Technician.home_route_id recomputed"
        note: "Backward edge — the pending move is confirmed, restoring ACTIVE standing."

      - from: [ACTIVE, SHOP_CHANGE_PENDING]
        to: TRADE_EXITED
        trigger: "POST /retail/technicians/{id}/status with action=EXIT_TRADE"
        actor: FranchiseManager
        preconditions:
          - "technician.technician_status IN {ACTIVE, SHOP_CHANGE_PENDING}"
        side_effects:
          - "Technician.technician_status = TRADE_EXITED"
          - "Technician.last_known_shop_name = the current shop's shop_name"
          - "Technician.current_shop_location_id = null"
          - "Technician.home_route_id = null"
          - "every CreditAccount of this technician with account_status ACTIVE → SUSPENDED"
          - "the source ShopLocation.active_technician_count recomputed"
        note: "CASCADE ORIGIN — trade-exit cascade: Technician → CreditAccount → Franchisee. See §1.2 SM11 ACTIVE_to_TRADE_EXITED chain."

      - from: SHOP_CHANGE_PENDING
        to: ACTIVE
        trigger: "POST /retail/technicians/{id}/status with action=CANCEL_SHOP"
        actor: FranchiseOwner
        preconditions:
          - "technician.technician_status == SHOP_CHANGE_PENDING"
          - "the technician still has a prior shop on file (current_shop_location_id is set)"
        side_effects:
          - "Technician.technician_status = ACTIVE"
          - "Technician.current_shop_location_id = the prior shop"
          - "Technician.home_route_id recomputed"
          - "the abandoned target ShopLocation.active_technician_count recomputed"
        note: "Backward edge — a pending move can be abandoned, returning the technician to the prior shop."# =============================================================================
# §1.2.1 Concurrency Rules
# Only true races that OCC on a parent's `version` resolves. Every write-write
# conflict that two strictly sequential requests would already resolve via a
# state field is expressed as a §1.2 precondition or a §1.4 validation instead.
# =============================================================================
concurrency_rules:

  - rule_id: account-mint-stale-application
    parent_entity: CreditApplication
    write_endpoint: "POST /retail/credit-applications/{id}/accounts"
    occ_field: "expected_application_version"
    description: |
      Minting a CreditAccount against a CreditApplication whose version has
      advanced since the client last read it is rejected. The application
      legitimately mints a second account when it was reopened and re-approved,
      so a strictly sequential second mint would otherwise succeed; the stale
      version is what distinguishes an intentional re-mint from a writer
      working off an outdated view.
    error_id: ERR_STALE_VERSION
    http_status: 412

  - rule_id: sale-confirm-stale-order
    parent_entity: SalesOrder
    write_endpoint: "POST /retail/sales-orders/{id}/status"
    occ_field: "expected_sales_order_version"
    description: |
      Confirming a SalesOrder whose version has advanced since the client last
      read it is rejected. Editing the order's lines is a legitimate
      re-confirmation path, so a strictly sequential second confirm would
      otherwise succeed; the stale version marks the client as holding a
      superseded view of the line set.
    error_id: ERR_STALE_VERSION
    http_status: 412

  - rule_id: pledge-create-stale-order
    parent_entity: ProductOrder
    write_endpoint: "POST /retail/product-orders/{id}/pledges"
    occ_field: "expected_product_order_version"
    description: |
      Creating a SharePledge against a ProductOrder whose version has advanced
      since the client last read it is rejected. A replenishment order accepts
      further pledges whenever it is still DRAFT, so a strictly sequential
      second pledge would otherwise succeed; the stale version marks the
      pledge as sized against a superseded ordered_lines set.
    error_id: ERR_STALE_VERSION
    http_status: 412

  - rule_id: order-receive-stale-product-order
    parent_entity: ProductOrder
    write_endpoint: "POST /retail/product-orders/{id}/status"
    occ_field: "expected_product_order_version"
    description: |
      Receiving a ProductOrder whose version has advanced since the client last
      read it is rejected. The receive transition creates InventoryPositions
      whose on_hand_qty depends on the ordered_lines snapshot the client
      observed, so a stale version would post a quantity the order no longer
      carries.
    error_id: ERR_STALE_VERSION
    http_status: 412

  - rule_id: route-retire-stale-route
    parent_entity: Route
    write_endpoint: "POST /retail/routes/{id}/status"
    occ_field: "expected_route_version"
    description: |
      Retiring a Route whose version has advanced since the client last read it
      is rejected. The retire precondition reads resale_status, which a resale
      filing legitimately advances; a stale version would retire a route the
      client believed had no pending resale.
    error_id: ERR_STALE_VERSION
    http_status: 412# =============================================================================
# §1.3 Calculation Rules Table
# =============================================================================
calculations:

  - name: order_gross_total
    trigger: "POST /retail/sales-orders (creation) and POST /retail/sales-orders/{id}/confirm"
    algorithm: aggregation
    formula: |
      # Mode (b): nested rounding — the rounding order is PINNED as
      # "round each line, then sum". The reverse order is a different number.
      mix_factor = MIX_FACTOR[order.mix_profile]
      line_amount[i] = round_half_up(lines[i].unit_price_cents * lines[i].quantity * mix_factor)
      gross_total_cents = sum(line_amount[i] for i in 0..line_count-1)
      #
      # PROHIBITED VARIANT (produces different cents for the same order):
      #   gross_total_cents = round_half_up(sum(unit_price_cents * quantity) * mix_factor)
      # Rounding order is therefore observable and MUST be asserted directly.
    input_set: "All entries of SalesOrder.lines, in array order. No filtering; a line with quantity 0 contributes 0."
    constants:
      MIX_FACTOR:
        DIAGNOSTIC_WEIGHTED: 1.0075
        TOOL_STORAGE: 1.0150
        POWER_TOOLS: 1.0025
    precision: "round_half_up to integer cents per line, then exact integer sum"

  - name: order_financing_variant
    trigger: "POST /retail/sales-orders/{id}/confirm (PROVISIONAL) and POST /retail/sales-orders/{id}/deliver (FINAL)"
    algorithm: dual_variant
    formula: |
      # Same order, two valid bases, different principal amounts.
      PROVISIONAL basis (the value confirm reserves):
        financed_principal_cents = gross_total_cents
      FINAL basis (the value deliver writes to the account):
        financed_principal_cents = gross_total_cents
                                   - sum(claim.principal_allocated_cents
                                         for claim in this_order.warranty_claims
                                         where claim.claim_status == APPROVED)
      No recovery of a claim resolved after the order settled: once
      order_status == SETTLED the FINAL basis is frozen.
    input_set: "WarrantyClaims on this order whose claim_status == APPROVED. OPEN, SUBMITTED and REJECTED claims contribute 0."
    constants:
      PROVISIONAL_BASIS: GROSS
      FINAL_BASIS: GROSS_MINUS_APPROVED_CLAIMS
    precision: "integer cents, exact"
    variants:
      - name: provisional
        when: "order_status in {DRAFT, CONFIRMED}"
        difference: "Equals gross_total_cents; warranty allocations that exist already are ignored."
      - name: final
        when: "order_status == DELIVERED"
        difference: "Subtracts every APPROVED claim's principal_allocated_cents; for an order with one 3600-cent allocation the two bases differ by exactly 3600."

  - name: finance_charge_accrual
    trigger: "system, at the first request whose logical clock week is later than the account's last accrual_iso_week"
    algorithm: threshold
    formula: |
      # Dual variant on the accrual basis, selected by account.use_final_basis.
      # FROZEN predicate: use_final_basis == is_lease_program at account creation.
      basis = (
        opening_balance_cents                                   if not account.use_final_basis  # PRIOR_BALANCE
        else opening_balance_cents
             - sum(p.charge_applied_cents for p in account.payments
                   where p.payment_status == COLLECTED
                     and p.effective_iso_week == this_accrual_iso_week)   # SETTLED_BASIS
      )
      tier_rate = (
        RATE_LOW      if basis <  TIER_BOUNDARY_LOW
        RATE_MID      if basis <  TIER_BOUNDARY_HIGH
        RATE_HIGH     otherwise
      )
      charge_amount_cents = round_half_up(basis * tier_rate / WEEKS_PER_YEAR)
      charge_status = OPEN
      # Boundary precision is >=/<-on-the-cents: basis == 50000 is RATE_MID, not RATE_LOW.
    input_set: "The accrual is skipped entirely for account_status in {CLOSED}; it runs for ACTIVE, SUSPENDED, DELINQUENT and CHARGED_OFF."
    constants:
      WEEKS_PER_YEAR: 52
      TIER_BOUNDARY_LOW: 50000
      TIER_BOUNDARY_HIGH: 200000
      RATE_LOW: 0.1560
      RATE_MID: 0.1820
      RATE_HIGH: 0.2080
    precision: "round_half_up to integer cents, single rounding at the end of the formula"
    variants:
      - name: prior_balance
        when: "account.use_final_basis == false (every REVOLVING account)"
        difference: "Charges the full opening principal regardless of payments that collected in the same week."
      - name: settled_basis
        when: "account.use_final_basis == true (every LEASE account)"
        difference: "Deducts payments that reached COLLECTED in the same accrual week, so an identical payment reduces the charge on a LEASE account and leaves the REVOLVING charge untouched."

  - name: credit_decision_score
    trigger: "POST /retail/credit-applications/{id}/review and POST /retail/credit-applications/{id}/reopen"
    algorithm: weighted_scoring
    formula: |
      # Mode (a): >=3 inputs, non-linear interaction, clamp at BOTH ends.
      base = SCORE_BASE
             + MONTHS_IN_TRADE_WEIGHT * min(application.months_in_trade, MONTHS_CAP)
             - DELINQUENCY_PENALTY   * application.prior_delinquency_count
             + (EMPLOYMENT_BONUS if application.employment_verified else 0)
             + (REQUESTED_KIND_BONUS if application.requested_kind == "LEASE" else 0)
      scale = (
        HIGH_TIER_MULTIPLIER  if application.requested_limit_cents >= LIMIT_TIER_BOUNDARY
        else LOW_TIER_MULTIPLIER
      )
      score = floor(base * scale)
      decision_score = max(SCORE_FLOOR, min(SCORE_CEILING, score))
      # SCORE_FLOOR is reachable: 7 prior delinquencies at 8 points each drives
      # base far below 0, and the floor binds before the ceiling ever does.
    input_set: "Fields of the CreditApplication under decision. No other entity contributes."
    constants:
      SCORE_BASE: 40
      MONTHS_IN_TRADE_WEIGHT: 0.5
      MONTHS_CAP: 120
      DELINQUENCY_PENALTY: 9
      EMPLOYMENT_BONUS: 12
      REQUESTED_KIND_BONUS: 4
      LIMIT_TIER_BOUNDARY: 500000
      HIGH_TIER_MULTIPLIER: 1.05
      LOW_TIER_MULTIPLIER: 1.00
      SCORE_FLOOR: 1
      SCORE_CEILING: 100
    precision: "floor to integer, then integer clamp"

  - name: credit_decision_limit
    trigger: "POST /retail/credit-applications/{id}/decide when the decision is APPROVE"
    algorithm: tiered_pricing
    formula: |
      # Marginal tiering on the APPROVED SCORE, not the requested limit.
      approved_limit_cents = (
        T1_RATE * decision_score                                     if decision_score <= T1_MAX
        else T1_RATE * T1_MAX + T2_RATE * (decision_score - T1_MAX)   if decision_score <= T2_MAX
        else T1_RATE * T1_MAX + T2_RATE * (T2_MAX - T1_MAX)
             + T3_RATE * (decision_score - T2_MAX)
      )
      approved_limit_cents = min(approved_limit_cents, application.requested_limit_cents)
      A DECLINED application sets approved_limit_cents = 0.
      # Marginal, not average: score 60 is 30000 + 500*(60-40) = 40000,
      # NOT 60 * 750 = 45000.
    input_set: "The application's own decision_score and requested_limit_cents."
    constants:
      T1_MAX: 40
      T2_MAX: 60
      T1_RATE: 750
      T2_RATE: 500
      T3_RATE: 250
    precision: "exact integer cents; no rounding is applied at any tier boundary"

  - name: resolve_recourse_holder
    trigger: "CreditAccount minting (the APPLIED_to_ACTIVE transition)"
    algorithm: selector
    formula: |
      candidates = territories T where
          T is the Route referenced by CreditAccount.territory_id
          AND T.territory_development_status == QUALIFIED
          AND T.in_force_from_week <= current_week
          AND (T.in_force_to_week is null or current_week < T.in_force_to_week)
      if candidates is non-empty:
          # Tie-break on earliest created_at; id is NEVER consulted.
          chosen = min(candidates, key = (created_at ASC))
          recourse_holder = FRANCHISOR_RECOURSE_to_holder[chosen.territory_model]
            # FRANCHISEE_ASSUMED  -> FRANCHISOR
            # FRANCHISOR_RECOURSE -> FRANCHISEE
      else:
          # Empty-pool fallback: an account opened with no in-force territory.
          recourse_holder = FRANCHISOR
      # The holder is FROZEN at minting. A later surrender of the opening
      # territory never recomputes an already-open account's recourse_holder.
    input_set: "Territories in force on the current logical-clock week; QUALIFIED only. SURRENDERED, IN_DEVELOPMENT and UNASSIGNED territories are excluded."
    constants:
      FRANCHISEE_ASSUMED: FRANCHISOR
      FRANCHISOR_RECOURSE: FRANCHISEE
      EMPTY_POOL_FALLBACK: FRANCHISOR
    precision: "not applicable — enum selection"

  - name: route_replenishment_allocation
    trigger: "POST /retail/product-orders/{id}/submit"
    algorithm: waterfall_allocation
    formula: |
      # Deterministic fill order — the ceiling is consumed in this sequence,
      # nil budget is never handed to a later line while an earlier one is short.
      priority(product, mix_profile) = (
        (0 if product.category == LEAD_CATEGORY[mix_profile] else 1),
        product.unit_cost_cents ASC,     # cheaper SKUs first inside a band
        line_index ASC                   # client requested order is the final key
      )
      remaining = order.investment_ceiling_cents
      ordered_qty[i] = 0 for every line i
      for line i in requested_lines sorted by priority:
          unit_cost = Product[line.product_id].unit_cost_cents
          affordable = floor(remaining / unit_cost)
          ordered_qty[i] = min(line.requested_qty, affordable)
          remaining = remaining - ordered_qty[i] * unit_cost
      deferred_qty[i] = line.requested_qty - ordered_qty[i]
      # A line whose unit_cost EXCEEDS the remaining budget is skipped with
      # deferred_qty == requested_qty; the loop continues to cheaper lines.
      ordered_cost_cents = sum(ordered_qty[i] * unit_cost[i])
      is_fully_covered = all(deferred_qty[i] == 0)
    input_set: "Every entry of ProductOrder.requested_lines. Lines with requested_qty 0 are retained in ordered_lines with ordered_qty 0."
    constants:
      LEAD_CATEGORY:
        DIAGNOSTIC_WEIGHTED: DIAGNOSTICS
        TOOL_STORAGE: TOOL_STORAGE
        POWER_TOOLS: POWER_TOOLS
    precision: "floor division on the affordable-quantity step; all money is exact integer cents"

  - name: mixed_inventory_plan
    trigger: "POST /retail/product-orders/{id}/allocate"
    algorithm: waterfall_allocation
    formula: |
      # Conserved quantity: total pledged units for a (route, product) pair.
      # A unit may be claimed by at most ONE SharePledge.
      claim_order = sorted(pledges,
                           key = (pledge.line_index ASC,
                                  pledge.created_at ASC))
      claimed[product] = 0
      for pledge in claim_order:
          for share in pledge.pledged_lines:
              position = InventoryPosition[route, share.product_id]
              already_taken_for_this_pledge =
                  min(share.qty, max(0, position.remaining_qty - claimed[share.product_id]))
              sustained_qty = already_taken_for_this_pledge
              claimed[share.product_id] += sustained_qty
              pledge.sustained_amount_cents += sustained_qty * unit_cost_cents
      # INVARIANT: sum over pledges of sustained_qty(product) <= position.remaining_qty
      # INVARIANT: each pledge's sustained_amount_cents never exceeds the
      #            amount it pledged at share-set unit costs.
    input_set: "All SharePledges under the ProductOrder with pledge_status in {HELD, BOUND}; RELEASED and CONSUMED pledges are excluded."
    constants:
      CLAIM_ORDER_KEY: [line_index ASC, created_at ASC]
    precision: "integer units and integer cents; no rounding anywhere in this plan"

  - name: launch_allocation_plan
    trigger: "POST /retail/launch-allocations/plan or POST /retail/launch-allocations/{id}/reallocate"
    algorithm: waterfall_allocation
    formula: |
      eligible = routes R where R.route_status == IN_SERVICE
      priority_score(R) = TIER_WEIGHT[R.route_tier] * R.territory_points
                          / (1 + open_order_count(R))
      weights are normalised over eligible routes; allocated_qty(R) is the
      floor of the product's total_launch_qty times the normalised weight.
      ranked = sorted(eligible, key = (remaining_fraction DESC,
                                      R.created_at ASC))    # id is NEVER consulted
      distribute the total_launch_qty - sum(floor allocations) leftover units,
      one unit each, to routes in ranked order until exhausted.
      launch_risk_band = LOW    if priority_score >= RISK_LOW_THRESHOLD
                         MEDIUM if priority_score >= RISK_MEDIUM_THRESHOLD
                         HIGH   otherwise
      # run_priority = the launch week-1 for ANNOUNCED products; a re-run for the
      # same product is refused with ERR_LAUNCH_ALREADY_ALLOCATED.
    input_set: "Routes with route_status == IN_SERVICE only; DRAFT, SUSPENDED, PENDING_TRANSFER and RETIRED routes are excluded from the pool."
    constants:
      TIER_WEIGHT: { A: 3, B: 2, C: 1 }
      RISK_MEDIUM_THRESHOLD: 60
      RISK_LOW_THRESHOLD: 120
    precision: "floor on the initial per-route share; the remainder is distributed as whole units"

  - name: warranty_replacement_charge
    trigger: "POST /retail/sales-orders/{id}/warranty-claims/{claimId}/submit"
    algorithm: threshold
    formula: |
      line = parent_order.lines[claim.line_index]
      product = Product[line.product_id]
      elapsed_months = whole months from parent_order.sale_iso_week to the
                       logical clock's week
      inside_warranty = elapsed_months < line.warranty_terms.months
      if inside_warranty:
          replacement_charge_cents = 0
      else:
          replacement_charge_cents = min(line.unit_price_cents,
                                        floor(CAP_RATE * product.unit_cost_cents))
      warranty_credit_amount_cents = (
          min(line.unit_price_cents, floor(CREDIT_RATE * product.unit_cost_cents))
          if claim.claim_kind == "CLAIM" and claim.claim_status == "APPROVED"
          else 0
      )
      # BOUNDARY: elapsed_months == warranty_terms.months is OUTSIDE warranty
      # (strict "<"), so the charge switches on exactly at the nominal expiry.
    input_set: "The single line named by claim.line_index. Other lines of the same order do not contribute."
    constants:
      CAP_RATE: 0.40
      CREDIT_RATE: 0.60
    precision: "floor to integer cents on each rate product, then exact min()"

  - name: warranty_principal_allocation
    trigger: "POST /retail/sales-orders/{id}/warranty-claims/{claimId}/approve"
    algorithm: dual_variant
    formula: |
      # Two valid bases for how much principal the approval writes.
      CHARGE_BASIS (used when claim.claim_kind == "CLAIM"):
        principal_allocated_cents = replacement_charge_cents
        signed_effect_on_account = +principal_allocated_cents   # writes new principal
      CREDIT_BASIS (used when claim.claim_kind == "WARRANTY_REPLACEMENT"):
        principal_allocated_cents = warranty_credit_amount_cents
        signed_effect_on_account = -principal_allocated_cents   # credits principal away
      FINAL cap: principal_allocated_cents =
        min(principal_allocated_cents, target_account.principal_balance_cents)
        when the effect is negative — a credit never drives principal below 0.
    input_set: "The claim being approved and the CreditAccount named by claim.apply_to_account_id. WARRANTY_REPLACEMENT claims carry apply_to_account_id == null and contribute 0."
    constants:
      CHARGE_SIGN: 1
      CREDIT_SIGN: -1
    precision: "integer cents, exact; the negative-effect cap is a hard min()"
    variants:
      - name: charge_basis
        when: "claim.claim_kind == CLAIM"
        difference: "Adds replacement_charge_cents to the target account's principal."
      - name: credit_basis
        when: "claim.claim_kind == WARRANTY_REPLACEMENT"
        difference: "Subtracts warranty_credit_amount_cents from the target account's principal, floored at 0 — for an account holding less principal than the credit, the two bases differ by the unabsorbed remainder."

  - name: payment_allocation
    trigger: "POST /retail/credit-accounts/{id}/payments/{paymentId}/collect"
    algorithm: chronological
    formula: |
      # Oldest-accrual-first, and the allocation must be EXACT.
      remaining_cash = payment.amount_cents
      charges = sorted(account.finance_charges where charge_status == "OPEN",
                       key = (accrual_iso_week ASC, accrual_seq ASC, created_at ASC))
      for charge in charges:
          take = min(remaining_cash, charge.charge_amount_cents - charge.collection_applied_cents)
          charge.collection_applied_cents += take
          remaining_cash -= take
          if charge.collection_applied_cents == charge.charge_amount_cents:
              charge.charge_status = CLOSED
              charge.charge_resolved_iso_week = payment.effective_iso_week
          if remaining_cash == 0: break
      # Any cash left after every OPEN charge is fully covered reduces the
      # account's principal instead.
      payment.charge_applied_cents = payment.amount_cents - remaining_cash
      principal_reduction = remaining_cash
      # INVARIANT: payment.charge_applied_cents + principal_reduction == payment.amount_cents
    input_set: "FinanceCharges of the credited account in OPEN status only. CLOSED charges are never re-credited by a new payment."
    constants:
      ORDER_KEY: [accrual_iso_week ASC, accrual_seq ASC, created_at ASC]
    precision: "integer cents; the final allocation consumes the cash exactly, leaving no residue"

  - name: minimum_payment_due
    trigger: "Whenever the account's current_balance_cents changes"
    algorithm: aggregation
    formula: |
      # Mode (c): circular-looking dependency with a PINNED evaluation order.
      # The tier is selected from the OPENING balance, never from the value the
      # formula is about to produce. Evaluation order is fixed as:
      #   (1) read opening_balance_cents, (2) pick the tier, (3) derive the due.
      opening = account.current_balance_cents
      tier = (
        MIN_TIER_PCT   if opening <  MIN_TIER_BOUNDARY
        else MID_TIER_PCT if opening < MID_TIER_BOUNDARY
        else MAX_TIER_PCT
      )
      pct_due  = round_half_up(opening * tier)
      minimum_payment_due_cents = max(FLAT_MINIMUM_CENTS, pct_due)
      # A DELINQUENT account's due is raised to the full current balance —
      # the delinquency override is applied AFTER the max(), so it wins over
      # both the tier result and the flat minimum.
      if account.account_status == "DELINQUENT":
          minimum_payment_due_cents = account.current_balance_cents
      # For LEASE accounts the due is instead the amortised installment:
      #   minimum_payment_due_cents = installment_due_cents (lease_amortization)
    input_set: "The account's own current_balance_cents and account_status."
    constants:
      MIN_TIER_BOUNDARY: 25000
      MID_TIER_BOUNDARY: 150000
      MIN_TIER_PCT: 0.05
      MID_TIER_PCT: 0.10
      MAX_TIER_PCT: 0.20
      FLAT_MINIMUM_CENTS: 2500
    precision: "round_half_up on the percentage step, then integer max()"

  - name: lease_amortization
    trigger: "CreditAccount minting for a LEASE account, and after every principal write"
    algorithm: threshold
    formula: |
      # Nested rounding with a PINNED order: the monthly installment is rounded
      # once, then multiplied by the term; the final installment absorbs the
      # difference so the schedule sums exactly to principal + total interest.
      monthly_rate = LEASE_ANNUAL_RATE / MONTHS_PER_YEAR
      raw_installment = principal * monthly_rate
                        / (1 - (1 + monthly_rate) ** (-term_months))
      rounded_installment = round_half_up(raw_installment)
      if account.account_status == "DELINQUENT":
          installment_due_cents = round_half_up(rounded_installment * DELINQUENT_UPLIFT)
      else:
          installment_due_cents = rounded_installment
      # The schedule's last installment is
      #   principal + total_interest - rounded_installment * (term_months - 1)
      # so sum(installments) == principal + total_interest exactly.
    input_set: "LEASE accounts only. REVOLVING accounts carry installment_due_cents == 0 and are excluded from the schedule."
    constants:
      LEASE_ANNUAL_RATE: 0.2400
      MONTHS_PER_YEAR: 12
      DELINQUENT_UPLIFT: 1.25
    precision: "round_half_up once on the raw installment; the closing installment absorbs the residue"

  - name: charge_off_week
    trigger: "system, at the charge-off sweep evaluated on every request"
    algorithm: temporal_window
    formula: |
      # effective_charge_off_week is a half-open week window anchored on the
      # account's delinquency anniversary.
      base_week = week_start(account.account_status_changed_at)   # Monday 00:00:00Z
      effective_charge_off_week = base_week + CHARGE_OFF_WEEKS * 7 days
      charge_off_due = (effective_charge_off_week <= week_start(now))
      # BOUNDARY: exactly on the anniversary week the sweep fires
      # (<=, not <), so a clock parked on the anniversary week flips the
      # account to CHARGED_OFF on that very request.
      if account.account_status == "CHARGED_OFF":
          base_week is FROZEN: a further sweep does not move it.
    input_set: "Accounts with account_status in {ACTIVE, DELINQUENT}. SUSPENDED accounts are excluded, as are CLOSED accounts."
    constants:
      CHARGE_OFF_WEEKS: 26
    precision: "not applicable — whole-week datetime arithmetic; all week starts are Monday 00:00:00Z"

  - name: route_schedule_anchor
    trigger: "Route update (territory, truck, weekday) and every route read"
    algorithm: interval_merge
    formula: |
      # Most recent occurrence of visit_weekday at 08:00:00Z STRICTLY before
      # the logical clock. Half-open: an anchor exactly equal to the clock is
      # NOT the anchor — the previous week is.
      anchor = the latest datetime D such that
                 D.weekday == route.visit_weekday
                 AND D.time == 08:00:00Z
                 AND D < now
      # BOUNDARY: now == Monday 08:00:00Z with visit_weekday == 1 yields the
      # PREVIOUS Monday 08:00:00Z, i.e. 7 days earlier — never itself.
    input_set: "The route's own visit_weekday only; zip_codes and truck_label are irrelevant to the anchor."
    constants:
      ANCHOR_TIME_OF_DAY: "08:00:00Z"
      COMPARISON: "strictly less than the logical clock"
    precision: "second-resolution datetime; the logical clock's own seconds are preserved"

  - name: inventory_over_pledge
    trigger: "SalesOrder confirm, cancel and deliver; InventoryPosition receive"
    algorithm: aggregation
    formula: |
      # Aggregate capacity across a route's positions, not a per-pair lookup.
      for each (route, product):
        committed = reserved_qty
        cost = unit_cost_cents
        over_pledge_cents += max(0, committed - on_hand_qty) * cost
      # BOUNDARY: committed == on_hand_qty contributes 0 — a fully committed
      # position is not over-pledged. Only committed > on_hand_qty adds cost.
      Route.inventory_at_risk_cents = sum(reserved_qty * unit_cost_cents)
                                       over every position
    input_set: "Every InventoryPosition on the route. A position absent for a product contributes 0."
    constants:
      OVER_PLEDGE_THRESHOLD: "committed > on_hand_qty (strict)"
    precision: "integer cents, exact"

  - name: reopening_fee
    trigger: "POST /retail/routes/{id}/resale"
    algorithm: threshold
    formula: |
      # Step function keyed on the BUYER's training state, then on points.
      base = (
        FEE_NOT_ENROLLED  if route.resale_buyer_training_status == "NOT_ENROLLED"
        else FEE_ENROLLED if route.resale_buyer_training_status == "ENROLLED"
        else FEE_CERTIFIED
      )
      points_discount = floor(
          min(route.resale_trained_points, POINTS_CAP) / POINTS_PER_DISCOUNT_UNIT
      ) * DISCOUNT_PER_UNIT_CENTS
      reopening_fee_cents = max(FEE_FLOOR_CENTS, base - points_discount)
      # BOUNDARY: exactly POINTS_PER_DISCOUNT_UNIT points earns exactly one
      # discount unit; one point fewer earns none.
      # A CERTIFIED buyer pays FEE_CERTIFIED flat — the points discount applies
      # to ENROLLED and NOT_ENROLLED buyers only.
    input_set: "The route's own resale_buyer_training_status and resale_trained_points."
    constants:
      FEE_NOT_ENROLLED: 900000
      FEE_ENROLLED: 650000
      FEE_CERTIFIED: 250000
      POINTS_PER_DISCOUNT_UNIT: 10
      DISCOUNT_PER_UNIT_CENTS: 15000
      POINTS_CAP: 60
      FEE_FLOOR_CENTS: 200000
      FRANCHISEE_RESALE_FEE_CAP_CENTS: 900000
    precision: "floor on the discount-unit count; exact integer cents"

  - name: franchisee_training_progress
    trigger: "POST /retail/franchisees/{id}/training/enroll"
    algorithm: threshold
    formula: |
      training_status = (
        CERTIFIED if training_points >= CERTIFICATION_THRESHOLD
        else ENROLLED
      )
      # BOUNDARY: exactly 40 points certifies — 39 does not.
      # training_status can also move backwards: see SM1 CERTIFIED_to_ENROLLED.
    input_set: "The franchisee's own training_points as submitted on the enroll call."
    constants:
      CERTIFICATION_THRESHOLD: 40
    precision: "not applicable — integer comparison"# =============================================================================
# §1.4 Validation Rules Table (ordered by priority)
# Priority resolves dual-failure requests: the LOWEST priority number wins.
# =============================================================================
validations:

  - priority: 1
    category: auth
    check: "X-User-ID and X-User-Role headers are present and name a known role"
    error_id: ERR_MISSING_USER_CONTEXT
    http_status: 400
    applies_to: all endpoints

  - priority: 2
    category: auth
    check: "The acting role is permitted for this operation; entity-backed roles must own the resource they mutate (Technician may only act on its own CreditAccount, RouteSalesRep only on its own route's orders)"
    error_id: ERR_UNAUTHORIZED
    http_status: 403
    applies_to: all endpoints

  - priority: 3
    category: business_temporal
    check: "The logical clock must not move backwards: POST /_clock/set_current_utc with a current_utc earlier than the current logical clock is rejected"
    error_id: ERR_WEEK_CLOCK_BEHIND
    http_status: 422
    applies_to: ["POST /_clock/set_current_utc"]

  - priority: 4
    category: existence
    check: "Every resource id in the path exists, validated left to right (parent before child); a body-referenced id is checked after path ids"
    error_id: ERR_ROUTE_NOT_FOUND
    http_status: 404
    applies_to: all resource endpoints
    note: "Entity-specific 404s: ERR_FRANCHISEE_NOT_FOUND, ERR_ROUTE_NOT_FOUND, ERR_SHOP_NOT_FOUND, ERR_TECHNICIAN_NOT_FOUND, ERR_APPLICATION_NOT_FOUND, ERR_ACCOUNT_NOT_FOUND, ERR_PAYMENT_NOT_FOUND, ERR_ORDER_NOT_FOUND, ERR_CLAIM_NOT_FOUND, ERR_PRODUCT_NOT_FOUND, ERR_PRODUCT_ORDER_NOT_FOUND, ERR_INVENTORY_POSITION_NOT_FOUND"

  - priority: 5
    category: existence
    check: "Required input fields are present, correctly typed, and enum members are from the declared set; numeric fields are within their stated ranges"
    error_id: ERR_INVALID_REQUEST
    http_status: 400
    applies_to: all endpoints with a body

  - priority: 6
    category: state
    check: "The target resource is in a state from which this transition is declared"
    error_id: ERR_INVALID_STATE
    http_status: 409
    applies_to: all transition endpoints
    note: "Entity-specific state errors: ERR_ROUTE_NOT_IN_SERVICE, ERR_APPLICATION_ALREADY_DECIDED, ERR_ACCOUNT_NOT_ACTIVE, ERR_ACCOUNT_NOT_DELINQUENT, ERR_PAYMENT_NOT_BOOKED, ERR_CLAIM_ALREADY_TERMINAL, ERR_PRODUCT_ORDER_NOT_DRAFT"

  - priority: 7
    category: state
    check: "Cross-entity state dependency: a Route may only enter PENDING_TRANSFER while its resale_status is PENDING, and only while its franchisee is CERTIFIED"
    error_id: ERR_FRANCHISEE_NOT_CERTIFIED
    http_status: 409
    applies_to: ["POST /routes/{id}/resale", "POST /routes/{id}/status", "POST /routes/{id}/territory/develop"]

  - priority: 8
    category: business_safety
    check: "A technician may not leave the trade while any of its sales orders is in CONFIRMED status with unreserved stock; the trade-exit request must name only technicians whose open orders are DELIVERED or beyond"
    error_id: ERR_TRADE_EXIT_OPEN_ORDER
    http_status: 422
    applies_to: ["POST /technicians/{id}/status"]

  - priority: 9
    category: business_safety
    check: "A warranty claim may only be decided while its parent order is DELIVERED or SETTLED; a claim against a DRAFT or CONFIRMED order is rejected before any credit arithmetic runs"
    error_id: ERR_WARRANTY_ORDER_NOT_DELIVERED
    http_status: 422
    applies_to: ["POST /sales-orders/{id}/warranty-claims", "POST /sales-orders/{id}/warranty-claims/{claimId}/decide"]

  - priority: 10
    category: business_safety
    check: "A lease-kind CreditApplication must carry requested_term_months; a revolving application carrying it is accepted but the value is ignored"
    error_id: ERR_LEASE_TERM_REQUIRED
    http_status: 422
    applies_to: ["POST /shop-locations/{id}/credit-applications"]

  - priority: 11
    category: business_constraint
    check: "Uniqueness: route_code is globally unique, territory-level product mix is unique per franchisee, SKU is globally unique, and a route holds at most one inventory position per product"
    error_id: ERR_UNIQUENESS_VIOLATION
    http_status: 409
    applies_to: ["POST /routes", "POST /products", "POST /routes/{id}/inventory-positions"]
    note: "Entity-specific 409s: ERR_ROUTE_CODE_DUPLICATE, ERR_SKU_DUPLICATE, ERR_INVENTORY_POSITION_DUPLICATE"

  - priority: 12
    category: business_constraint
    check: "A shop's zip_code must appear in the owning route's zip_codes"
    error_id: ERR_SHOP_ZIP_NOT_IN_TERRITORY
    http_status: 400
    applies_to: ["POST /routes/{id}/shop-locations"]

  - priority: 13
    category: business_constraint
    check: "A sales-order line's quantity must not exceed the matching InventoryPosition.remaining_qty on the order's route"
    error_id: ERR_INSUFFICIENT_INVENTORY
    http_status: 409
    applies_to: ["POST /routes/{id}/sales-orders", "PATCH /sales-orders/{id}", "POST /sales-orders/{id}/status"]

  - priority: 14
    category: business_constraint
    check: "The replenishment order's requested_cost_cents must not exceed investment_ceiling_cents"
    error_id: ERR_ALLOCATION_CEILING_EXCEEDED
    http_status: 422
    applies_to: ["POST /routes/{id}/product-orders"]

  - priority: 15
    category: business_constraint
    check: "Pledged quantities must not exceed the ordered quantities on the same ProductOrder, and a pledge may only be filed while the order is DRAFT"
    error_id: ERR_PLEDGE_OVERSUBSCRIBED
    http_status: 422
    applies_to: ["POST /product-orders/{id}/pledges"]

  - priority: 16
    category: business_constraint
    check: "A launch allocation may be planned once per product: a second plan for a product whose launch_status is ALLOCATED or LIVE is rejected"
    error_id: ERR_LAUNCH_ALREADY_ALLOCATED
    http_status: 409
    applies_to: ["POST /products/{id}/launch-allocations"]

  - priority: 17
    category: business_temporal
    check: "A payment's expected_week_start must be a Monday 00:00:00Z and must not precede the logical clock's week"
    error_id: ERR_PAYMENT_WEEK_IN_PAST
    http_status: 422
    applies_to: ["POST /credit-accounts/{id}/bill"]

  - priority: 18
    category: business_temporal
    check: "Territory windows on one route must not overlap: a development round may only be opened when no earlier round of the same route is still in force (in_force_to_week is null)"
    error_id: ERR_TERRITORY_WINDOW_CONFLICT
    http_status: 409
    applies_to: ["POST /routes/{id}/territory/develop"]

  - priority: 19
    category: business_temporal
    check: "An account may only be charged off once effective_charge_off_week has been reached; a CLOSED account may only be closed with a zero current_balance_cents"
    error_id: ERR_CHARGE_OFF_NOT_DUE
    http_status: 422
    applies_to: ["POST /credit-accounts/{id}/status"]

  - priority: 20
    category: business_fiscal
    check: "A sales order's financed_principal_cents must fit the target CreditAccount's credit_available_cents"
    error_id: ERR_ACCOUNT_LIMIT_EXCEEDED
    http_status: 402
    applies_to: ["POST /sales-orders/{id}/status"]

  - priority: 21
    category: business_fiscal
    check: "A revolving financed amount must fit the technician's remaining credit_line_limit_cents less revolving_used_cents"
    error_id: ERR_CREDIT_LIMIT_EXCEEDED
    http_status: 402
    applies_to: ["POST /sales-orders/{id}/status", "POST /credit-applications/{id}/accounts"]

  - priority: 22
    category: business_fiscal
    check: "The granted limit must not exceed the appendix cap: approved_limit_cents is min(tiered amount, requested_limit_cents), and a requested_limit_cents above CREDIT_ABSOLUTE_CAP_CENTS is rejected outright"
    error_id: ERR_CREDIT_REQUEST_ABOVE_CAP
    http_status: 402
    applies_to: ["POST /shop-locations/{id}/credit-applications", "POST /credit-applications/{id}/decide"]# =============================================================================
# §1.5 API Endpoint Table
# =============================================================================
endpoints:

  # --- Logical clock (test-driving) ---
  - method: POST
    path: "/retail/_clock/set_current_utc"
    description: "Test-driving endpoint. Sets the logical clock. The server STARTUP DEFAULT is 2026-09-01T00:00:00Z; before any call here the clock reads exactly that instant and never falls back to wall-clock time. Moving the clock backwards is rejected."
    roles: [PlatformAdmin]
    code: 200
    input: [current_utc]
    output: { current_utc: datetime, current_week_start: datetime }
    side_effects: ["logical clock set", "charge-off sweep evaluated for every non-CLOSED account"]

  # --- Products ---
  - method: POST
    path: "/retail/products"
    description: "Create a product"
    roles: [PlatformAdmin]
    code: 201
    input: [sku, product_name, category, unit_cost_cents, retail_price_cents, default_warranty_months, is_new_launch, "launch_iso_week?"]
    output: Product
    side_effects: ["launch_status = ANNOUNCED when is_new_launch is true, otherwise LIVE"]

  - method: GET
    path: "/retail/products"
    description: "List products"
    roles: [PlatformAdmin, FranchiseOwner, FranchiseManager, CreditOfficer, RouteSalesRep, WarrantyAdmin, Technician]
    code: 200
    input: ["category?", "is_new_launch?", "limit?", "offset?"]
    output: "Product[]"
    side_effects: []

  - method: GET
    path: "/retail/products/{id}"
    description: "Get a product"
    roles: [PlatformAdmin, FranchiseOwner, FranchiseManager, CreditOfficer, RouteSalesRep, WarrantyAdmin, Technician]
    code: 200
    input: []
    output: Product
    side_effects: []

  # --- Franchisee + training ---
  - method: POST
    path: "/retail/franchisees"
    description: "Create a franchisee"
    roles: [PlatformAdmin]
    code: 201
    input: [legal_name]
    output: Franchisee
    side_effects: ["training_status = NOT_ENROLLED"]

  - method: GET
    path: "/retail/franchisees"
    description: "List franchisees"
    roles: [PlatformAdmin, FranchiseManager, CreditOfficer]
    code: 200
    input: ["training_status?", "limit?", "offset?"]
    output: "Franchisee[]"
    side_effects: []

  - method: GET
    path: "/retail/franchisees/{id}/draft-summary"
    description: "Franchisor draft eligibility summary for a franchisee. Resolves the franchisee's collection fallback location (fallback_shop_location_id) and returns ERR_FALLBACK_LOCATION_MISSING when the franchisee has no ACTIVE ShopLocation on any of its routes."
    roles: [PlatformAdmin, FranchiseManager, CreditOfficer]
    code: 200
    input: []
    output: { franchisee_id: string, fallback_shop_location_id: string, active_account_count: integer, recourse_exposure_cents: integer }
    side_effects: []

  - method: GET
    path: "/retail/franchisees/{id}"
    description: "Get a franchisee"
    roles: [PlatformAdmin, FranchiseOwner, FranchiseManager, CreditOfficer]
    code: 200
    input: []
    output: Franchisee
    side_effects: []

  - method: POST
    path: "/retail/franchisees/{id}/training"
    description: "Advance franchisee training. action=ENROLL moves NOT_ENROLLED to ENROLLED; action=CERTIFY requires training_points >= 40 and moves ENROLLED to CERTIFIED; action=RECERTIFY moves CERTIFIED back to ENROLLED."
    roles: [FranchiseOwner]
    code: 200
    input: [action, training_points]
    output: Franchisee
    side_effects: ["training_status recomputed (franchisee_training_progress)", "can_resell_territory recomputed", "certified_on stamped or cleared"]

  - method: POST
    path: "/retail/franchisees/{id}/routes"
    description: "Create a route under a franchisee"
    roles: [FranchiseOwner]
    code: 201
    input: [route_code, route_tier, zip_codes, visit_weekday, truck_label, inventory_invested_cents, mix_plan, territory_model, "territory_points?"]
    output: Route
    side_effects: ["route_status = DRAFT", "territory_development_status = UNASSIGNED", "resale_status = NONE", "schedule_anchor_utc recomputed (route_schedule_anchor)"]

  - method: GET
    path: "/retail/routes"
    description: "List routes"
    roles: [PlatformAdmin, FranchiseOwner, FranchiseManager, CreditOfficer, RouteSalesRep, WarrantyAdmin]
    code: 200
    input: ["franchisee_id?", "route_status?", "territory_development_status?", "resale_status?", "limit?", "offset?"]
    output: "Route[]"
    side_effects: []

  - method: GET
    path: "/retail/routes/{id}"
    description: "Get a route"
    roles: [PlatformAdmin, FranchiseOwner, FranchiseManager, CreditOfficer, RouteSalesRep, WarrantyAdmin]
    code: 200
    input: []
    output: Route
    side_effects: []

  - method: PUT
    path: "/retail/routes/{id}"
    description: "Update route attributes"
    roles: [FranchiseOwner]
    code: 200
    input: ["route_code?", "route_tier?", "zip_codes?", "visit_weekday?", "truck_label?", "inventory_invested_cents?", "mix_plan?", "territory_model?", "territory_points?"]
    output: Route
    side_effects: ["schedule_anchor_utc recomputed (route_schedule_anchor) when visit_weekday changes"]

  - method: POST
    path: "/retail/routes/{id}/status"
    description: "Advance a route's lifecycle. action=ACTIVATE (draft -> in service), action=SUSPEND (in service -> suspended), action=REINSTATE (suspended -> in service), action=RETIRE (draft or suspended -> retired, requires expected_route_version)."
    roles: [FranchiseOwner, FranchiseManager]
    code: 200
    input: [action, "expected_route_version?"]
    output: Route
    side_effects: ["route_status transition", "increments Route.version by 1", "on SUSPEND every ACTIVE ShopLocation on the route -> INACTIVE", "on RETIRE a QUALIFIED territory -> SURRENDERED", "franchisee.active_route_count recomputed"]

  - method: POST
    path: "/retail/routes/{id}/territory"
    description: "Advance territory development. action=DEVELOP opens or extends a development round and requires territory_points >= 60 to qualify when the route is IN_SERVICE; action=SURRENDER moves a QUALIFIED or IN_DEVELOPMENT territory to SURRENDERED."
    roles: [FranchiseOwner, FranchiseManager]
    code: 200
    input: [action, territory_points]
    output: Route
    side_effects: ["territory_development_status transition", "territory_points recorded", "in_force_from_week or in_force_to_week stamped"]

  - method: POST
    path: "/retail/routes/{id}/resale"
    description: "File a territory resale application, or decide one. action=FILE requires the selling franchisee CERTIFIED and the territory QUALIFIED and recomputes reopening_fee_cents; action=APPROVE and action=DECLINE resolve a pending filing."
    roles: [FranchiseOwner, FranchiseManager]
    code: 200
    input: [action, "buyer_training_status?", "buyer_training_points?"]
    output: Route
    side_effects: ["resale_status transition", "reopening_fee_cents recomputed (reopening_fee) on FILE", "resale_buyer_training_status and resale_trained_points recorded on FILE"]

  # --- Shops ---
  - method: POST
    path: "/retail/routes/{id}/shop-locations"
    description: "Add a repair shop to a route"
    roles: [FranchiseOwner]
    code: 201
    input: [shop_name, street_line, zip_code]
    output: ShopLocation
    side_effects: ["shop_status = ACTIVE", "franchisee.fallback_shop_location_id recomputed"]

  - method: GET
    path: "/retail/shop-locations"
    description: "List shops"
    roles: [PlatformAdmin, FranchiseOwner, FranchiseManager, CreditOfficer, RouteSalesRep]
    code: 200
    input: ["route_id?", "shop_status?", "zip_code?", "limit?", "offset?"]
    output: "ShopLocation[]"
    side_effects: []

  - method: GET
    path: "/retail/shop-locations/{id}"
    description: "Get a shop"
    roles: [PlatformAdmin, FranchiseOwner, FranchiseManager, CreditOfficer, RouteSalesRep]
    code: 200
    input: []
    output: ShopLocation
    side_effects: []

  - method: PUT
    path: "/retail/shop-locations/{id}"
    description: "Update a shop"
    roles: [FranchiseOwner]
    code: 200
    input: ["shop_name?", "street_line?", "shop_status?"]
    output: ShopLocation
    side_effects: ["franchisee.fallback_shop_location_id recomputed"]

  - method: GET
    path: "/retail/shop-locations/{id}/technicians"
    description: "List the technicians currently working at a shop"
    roles: [PlatformAdmin, FranchiseOwner, FranchiseManager, CreditOfficer, RouteSalesRep]
    code: 200
    input: ["technician_status?", "limit?", "offset?"]
    output: "Technician[]"
    side_effects: []

  - method: POST
    path: "/retail/technicians"
    description: "Onboard a technician at a shop"
    roles: [FranchiseOwner]
    code: 201
    input: [full_name, current_shop_location_id, credit_line_limit_cents, months_in_trade, employment_verified]
    output: Technician
    side_effects: ["technician_status = ACTIVE", "credit_line_status = ACTIVE", "home_route_id derived from the shop", "shop.active_technician_count recomputed"]

  - method: GET
    path: "/retail/technicians"
    description: "List technicians"
    roles: [PlatformAdmin, FranchiseOwner, FranchiseManager, CreditOfficer, RouteSalesRep]
    code: 200
    input: ["current_shop_location_id?", "technician_status?", "limit?", "offset?"]
    output: "Technician[]"
    side_effects: []

  - method: GET
    path: "/retail/technicians/{id}"
    description: "Get a technician"
    roles: [PlatformAdmin, FranchiseOwner, FranchiseManager, CreditOfficer, RouteSalesRep, Technician]
    code: 200
    input: []
    output: Technician
    side_effects: []

  - method: PUT
    path: "/retail/technicians/{id}"
    description: "Update a technician's attributes"
    roles: [FranchiseOwner]
    code: 200
    input: ["full_name?", "credit_line_limit_cents?", "months_in_trade?", "employment_verified?"]
    output: Technician
    side_effects: ["revolving_available_cents recomputed"]

  - method: POST
    path: "/retail/technicians/{id}/status"
    description: "Advance a technician's standing. action=CHANGE_SHOP (ACTIVE -> SHOP_CHANGE_PENDING, requires target_shop_location_id), action=CONFIRM_SHOP (SHOP_CHANGE_PENDING -> ACTIVE), action=CANCEL_SHOP (SHOP_CHANGE_PENDING -> ACTIVE at the prior shop), action=EXIT_TRADE (ACTIVE or SHOP_CHANGE_PENDING -> TRADE_EXITED)."
    roles: [FranchiseOwner, FranchiseManager]
    code: 200
    input: [action, "target_shop_location_id?"]
    output: Technician
    side_effects: ["technician_status transition", "home_route_id recomputed", "source and target shop.active_technician_count recomputed", "on EXIT_TRADE every ACTIVE CreditAccount -> SUSPENDED and last_known_shop_name captured"]
# --- Credit applications ---
  - method: POST
    path: "/retail/shop-locations/{id}/credit-applications"
    description: "File a credit application for a technician at a shop"
    roles: [FranchiseOwner, CreditOfficer]
    code: 201
    input: [technician_id, requested_limit_cents, requested_kind, "requested_term_months?", employment_verified, months_in_trade, prior_delinquency_count, decision_source]
    output: CreditApplication
    side_effects: ["application_status = SUBMITTED", "decision_score recomputed (credit_decision_score)"]

  - method: GET
    path: "/retail/credit-applications"
    description: "List credit applications"
    roles: [PlatformAdmin, FranchiseOwner, FranchiseManager, CreditOfficer]
    code: 200
    input: ["application_status?", "decision_source?", "technician_id?", "limit?", "offset?"]
    output: "CreditApplication[]"
    side_effects: []

  - method: GET
    path: "/retail/credit-applications/{id}"
    description: "Get a credit application"
    roles: [PlatformAdmin, FranchiseOwner, FranchiseManager, CreditOfficer]
    code: 200
    input: []
    output: CreditApplication
    side_effects: []

  - method: POST
    path: "/retail/credit-applications/{id}/status"
    description: "Advance an application. action=REVIEW opens a franchisor review and requires decision_source FRANCHISOR; action=APPROVE or action=DECLINE decides; action=WITHDRAW abandons an undecided application; action=REOPEN returns a declined franchisee-sourced application to SUBMITTED."
    roles: [CreditOfficer, FranchiseOwner]
    code: 200
    input: [action]
    output: CreditApplication
    side_effects: ["application_status transition", "decision_score recomputed (credit_decision_score) on REVIEW and REOPEN", "approved_limit_cents recomputed (credit_decision_limit) on APPROVE", "approved_kind and approved_term_months frozen on APPROVE", "approved_limit_cents and approved_kind frozen for account minting"]

  - method: POST
    path: "/retail/credit-applications/{id}/accounts"
    description: "Mint a credit account against an approved application"
    roles: [CreditOfficer]
    code: 201
    input: [expected_application_version]
    output: CreditAccount
    side_effects: ["increments CreditApplication.version by 1", "CreditAccount minted (resolve_recourse_holder)", "technician.revolving_used_cents recomputed", "franchisee.credit_ceiling_cents recomputed"]

  - method: GET
    path: "/retail/credit-accounts"
    description: "List credit accounts"
    roles: [PlatformAdmin, FranchiseOwner, FranchiseManager, CreditOfficer, Technician]
    code: 200
    input: ["technician_id?", "account_status?", "account_kind?", "recourse_holder?", "application_id?", "limit?", "offset?"]
    output: "CreditAccount[]"
    side_effects: []

  - method: GET
    path: "/retail/credit-accounts/{id}"
    description: "Get a credit account, accruing any finance charge due and applying the charge-off sweep before the read"
    roles: [PlatformAdmin, FranchiseOwner, FranchiseManager, CreditOfficer, Technician]
    code: 200
    input: []
    output: CreditAccount
    side_effects: ["accrues any finance charge due for the current logical-clock week (finance_charge_accrual)", "applies the charge-off sweep when effective_charge_off_week has been reached (charge_off_week)"]

  - method: POST
    path: "/retail/credit-accounts/{id}/status"
    description: "Advance an account's posture. action=SUSPEND requires credit_available_cents == 0; action=REINSTATE cures a suspended account with headroom or a fully paid delinquent account; action=CHARGE_OFF requires effective_charge_off_week reached; action=SETTLE_CHARGE_OFF and action=CLOSE require a zero balance."
    roles: [CreditOfficer, FranchiseManager]
    code: 200
    input: [action]
    output: CreditAccount
    side_effects: ["account_status transition", "account_status_changed_at stamped", "technician.revolving_available_cents recomputed", "franchisee.outstanding_credit_cents and recourse_exposure_cents recomputed"]

  - method: POST
    path: "/retail/credit-accounts/{id}/payments"
    description: "Book a scheduled payment against an account"
    roles: [RouteSalesRep]
    code: 201
    input: [amount_cents, collection_source, expected_week_start]
    output: Payment
    side_effects: ["payment_status = BOOKED", "account.next_due_weekday recomputed"]

  - method: GET
    path: "/retail/credit-accounts/{id}/payments"
    description: "List the payments on an account"
    roles: [PlatformAdmin, FranchiseOwner, FranchiseManager, CreditOfficer, Technician, RouteSalesRep]
    code: 200
    input: ["payment_status?", "collection_source?", "limit?", "offset?"]
    output: "Payment[]"
    side_effects: []

  - method: GET
    path: "/retail/credit-accounts/{id}/finance-charges"
    description: "List the finance charges on an account"
    roles: [PlatformAdmin, FranchiseOwner, FranchiseManager, CreditOfficer, Technician]
    code: 200
    input: ["charge_status?", "limit?", "offset?"]
    output: "FinanceCharge[]"
    side_effects: []

  - method: POST
    path: "/retail/credit-accounts/{id}/payments/{paymentId}/status"
    description: "Advance a payment. action=COLLECT collects a booked or missed payment; action=MISS marks an overdue booked payment missed; action=REVERSE reverses a collected payment; action=CANCEL cancels a booked payment."
    roles: [RouteSalesRep, FranchiseManager, CreditOfficer]
    code: 200
    input: [action]
    output: Payment
    side_effects: ["payment_status transition", "charge_applied_cents recomputed (payment_allocation) on COLLECT", "finance charges credited or un-credited (payment_allocation)", "account balances recomputed", "account_status -> DELINQUENT on MISS or -> ACTIVE on a curing COLLECT"]

  # --- Sales orders ---
  - method: POST
    path: "/retail/routes/{id}/sales-orders"
    description: "Create a draft sales order on a route"
    roles: [RouteSalesRep]
    code: 201
    input: [technician_id, credit_account_id, mix_profile, lines]
    output: SalesOrder
    side_effects: ["order_status = DRAFT", "gross_total_cents recomputed (order_gross_total)", "financed_principal_cents recomputed (order_financing_variant)"]

  - method: GET
    path: "/retail/sales-orders"
    description: "List sales orders"
    roles: [PlatformAdmin, FranchiseOwner, FranchiseManager, CreditOfficer, RouteSalesRep, Technician, WarrantyAdmin]
    code: 200
    input: ["route_id?", "technician_id?", "credit_account_id?", "order_status?", "limit?", "offset?"]
    output: "SalesOrder[]"
    side_effects: []

  - method: GET
    path: "/retail/sales-orders/{id}"
    description: "Get a sales order"
    roles: [PlatformAdmin, FranchiseOwner, FranchiseManager, CreditOfficer, RouteSalesRep, Technician, WarrantyAdmin]
    code: 200
    input: []
    output: SalesOrder
    side_effects: []

  - method: PATCH
    path: "/retail/sales-orders/{id}"
    description: "Replace a draft order's line set"
    roles: [RouteSalesRep]
    code: 200
    input: ["mix_profile?", "lines?"]
    output: SalesOrder
    side_effects: ["gross_total_cents recomputed (order_gross_total)", "financed_principal_cents recomputed (order_financing_variant)"]

  - method: POST
    path: "/retail/sales-orders/{id}/status"
    description: "Advance a sales order. action=CONFIRM reserves stock and requires expected_sales_order_version; action=DELIVER writes principal; action=SETTLE closes; action=CANCEL releases stock."
    roles: [RouteSalesRep]
    code: 200
    input: [action, "expected_sales_order_version?"]
    output: SalesOrder
    side_effects: ["order_status transition", "increments SalesOrder.version by 1", "InventoryPosition reserved_qty or on_hand_qty adjusted", "route.inventory_at_risk_cents recomputed", "route.over_pledge_cents recomputed (inventory_over_pledge)", "CreditAccount.principal_balance_cents adjusted on DELIVER", "financed_principal_cents recomputed (order_financing_variant)"]

  # --- Warranty claims ---
  - method: POST
    path: "/retail/sales-orders/{id}/warranty-claims"
    description: "File a warranty claim. Re-filing with an idempotency_key already present on the order replays the existing claim instead of creating a new one."
    roles: [RouteSalesRep]
    code: 201
    input: [line_index, claim_kind, idempotency_key, "apply_to_account_id?"]
    output: WarrantyClaim
    side_effects: ["claim_status = OPEN", "filed_iso_week stamped", "is_idempotent_replay recomputed"]

  - method: GET
    path: "/retail/warranty-claims"
    description: "List warranty claims"
    roles: [PlatformAdmin, FranchiseOwner, FranchiseManager, CreditOfficer, RouteSalesRep, WarrantyAdmin]
    code: 200
    input: ["order_id?", "apply_to_account_id?", "claim_status?", "claim_kind?", "limit?", "offset?"]
    output: "WarrantyClaim[]"
    side_effects: []

  - method: POST
    path: "/retail/sales-orders/{id}/warranty-claims/{claimId}/status"
    description: "Advance a warranty claim. action=SUBMIT prices the claim; action=APPROVE resolves it and allocates principal; action=REJECT terminates it; action=REOPEN returns an approval to SUBMITTED and reverses its principal allocation."
    roles: [RouteSalesRep, WarrantyAdmin]
    code: 200
    input: [action]
    output: WarrantyClaim
    side_effects: ["claim_status transition", "replacement_charge_cents recomputed (warranty_replacement_charge)", "warranty_credit_amount_cents recomputed (warranty_replacement_charge)", "principal_allocated_cents recomputed (warranty_principal_allocation)", "target CreditAccount principal adjusted", "parent SalesOrder.financed_principal_cents recomputed (order_financing_variant)", "technician.revolving_used_cents recomputed", "franchisee.outstanding_credit_cents recomputed"]# --- Inventory positions ---
  - method: POST
    path: "/retail/routes/{id}/inventory-positions"
    description: "Create a stock position on a route's truck, or adjust one. Omit on_hand_qty to create; supply inventory_position_id and on_hand_qty to adjust an existing position."
    roles: [FranchiseOwner, FranchiseManager]
    code: 201
    input: [product_id, on_hand_qty, "inventory_position_id?"]
    output: InventoryPosition
    side_effects: ["unit_cost_cents frozen from Product.unit_cost_cents on create", "on_hand_qty set or adjusted", "over_pledge_cents recomputed (inventory_over_pledge)", "route.inventory_at_risk_cents recomputed"]

  - method: GET
    path: "/retail/inventory-positions"
    description: "List inventory positions"
    roles: [PlatformAdmin, FranchiseOwner, FranchiseManager, CreditOfficer, RouteSalesRep]
    code: 200
    input: ["route_id?", "product_id?", "limit?", "offset?"]
    output: "InventoryPosition[]"
    side_effects: []

  - method: POST
    path: "/retail/routes/{id}/product-orders"
    description: "Create a draft replenishment order for a route's truck. The ceiling fill is previewed at DRAFT (ordered_lines, ordered_cost_cents, deferred_lines and is_fully_covered are computed on create and recomputed on SUBMIT), so a DRAFT order carries the ordered quantities a SharePledge is capped against."
    roles: [FranchiseOwner]
    code: 201
    input: [mix_profile, investment_ceiling_cents, requested_lines]
    output: ProductOrder
    side_effects: ["product_order_status = DRAFT", "requested_cost_cents recomputed", "ordered_lines, ordered_cost_cents, deferred_lines and is_fully_covered recomputed (route_replenishment_allocation)"]

  - method: GET
    path: "/retail/product-orders"
    description: "List replenishment orders"
    roles: [PlatformAdmin, FranchiseOwner, FranchiseManager, CreditOfficer]
    code: 200
    input: ["route_id?", "product_order_status?", "limit?", "offset?"]
    output: "ProductOrder[]"
    side_effects: []

  - method: GET
    path: "/retail/product-orders/{id}"
    description: "Get a replenishment order"
    roles: [PlatformAdmin, FranchiseOwner, FranchiseManager, CreditOfficer]
    code: 200
    input: []
    output: ProductOrder
    side_effects: []

  - method: POST
    path: "/retail/product-orders/{id}/status"
    description: "Advance a replenishment order. action=SUBMIT fills the order against the ceiling; action=SHIP requires every pledge BOUND or RELEASED; action=RECEIVE posts stock and requires expected_product_order_version; action=ALLOCATE consumes bound pledges; action=CANCEL releases pledges."
    roles: [FranchiseOwner, FranchiseManager]
    code: 200
    input: [action, "expected_product_order_version?"]
    output: ProductOrder
    side_effects: ["product_order_status transition", "increments ProductOrder.version by 1", "ordered_lines, deferred_lines and ordered_cost_cents recomputed (route_replenishment_allocation) on SUBMIT", "InventoryPosition.on_hand_qty incremented on RECEIVE", "sustained_amount_cents recomputed (mixed_inventory_plan) on ALLOCATE", "route.inventory_at_risk_cents recomputed"]

  # --- Share pledges ---
  - method: POST
    path: "/retail/product-orders/{id}/pledges"
    description: "Pledge an account's share of a draft replenishment order"
    roles: [FranchiseOwner, RouteSalesRep]
    code: 201
    input: [credit_account_id, pledged_lines, expected_product_order_version]
    output: SharePledge
    side_effects: ["pledge_status = HELD", "increments ProductOrder.version by 1"]

  - method: GET
    path: "/retail/pledges"
    description: "List share pledges"
    roles: [PlatformAdmin, FranchiseOwner, FranchiseManager, CreditOfficer, RouteSalesRep]
    code: 200
    input: ["product_order_id?", "credit_account_id?", "pledge_status?", "limit?", "offset?"]
    output: "SharePledge[]"
    side_effects: []

  - method: GET
    path: "/retail/credit-accounts/{id}/pledges"
    description: "List the share pledges filed by an account (its own pledges against draft replenishment orders)"
    roles: [PlatformAdmin, FranchiseOwner, FranchiseManager, CreditOfficer, RouteSalesRep]
    code: 200
    input: ["pledge_status?", "limit?", "offset?"]
    output: "SharePledge[]"
    side_effects: []

  - method: POST
    path: "/retail/pledges/{id}/status"
    description: "Advance a pledge: action=BIND confirms the account will settle its share; action=RELEASE withdraws it."
    roles: [FranchiseOwner, FranchiseManager]
    code: 200
    input: [action]
    output: SharePledge
    side_effects: ["pledge_status = BOUND or RELEASED"]

  # --- Launch allocations ---
  - method: POST
    path: "/retail/products/{id}/launch-allocations"
    description: "Plan a launch allocation across eligible in-service routes. run_priority=PRIMARY plans the launch; run_priority=SECONDARY re-plans and is refused with ERR_LAUNCH_ALREADY_ALLOCATED once the product is ALLOCATED."
    roles: [FranchiseManager]
    code: 200
    input: [total_launch_qty, run_priority]
    output: "LaunchAllocation[]"
    side_effects: ["one LaunchAllocation row per eligible route", "priority_score recomputed (launch_allocation_plan)", "allocated_qty recomputed (launch_allocation_plan)", "launch_risk_band recomputed", "product.launch_status = ALLOCATED"]

  - method: GET
    path: "/retail/launch-allocations"
    description: "List launch allocations"
    roles: [PlatformAdmin, FranchiseOwner, FranchiseManager, CreditOfficer]
    code: 200
    input: ["product_id?", "route_id?", "allocation_status?", "launch_risk_band?", "limit?", "offset?"]
    output: "LaunchAllocation[]"
    side_effects: []

  - method: POST
    path: "/retail/launch-allocations/{id}/reallocate"
    description: "Move part of a route's launch allocation to another eligible route"
    roles: [FranchiseManager]
    code: 200
    input: [target_route_id, allocated_qty]
    output: LaunchAllocation
    side_effects: ["source allocated_qty decremented", "target allocation row created or incremented", "priority_score and launch_risk_band recomputed (launch_allocation_plan)"]

  - method: POST
    path: "/retail/launch-allocations/{id}/review"
    description: "Flag or clear a route's launch allocation for manager review"
    roles: [FranchiseManager]
    code: 200
    input: [review_flag]
    output: LaunchAllocation
    side_effects: ["review_flag set"]# =============================================================================
# §1.6 Error Code Catalog
# =============================================================================
errors:

  - { id: ERR_MISSING_USER_CONTEXT, http: 400, condition: "X-User-ID or X-User-Role header absent or names an unknown role" }
  - { id: ERR_INVALID_REQUEST, http: 400, condition: "Body missing a required field, wrong type, unknown enum member, or numeric field outside its declared range" }
  - { id: ERR_UNAUTHORIZED, http: 403, condition: "Acting role is not permitted for this operation, or an entity-backed actor does not own the resource" }
  - { id: ERR_WEEK_CLOCK_BEHIND, http: 422, condition: "POST /_clock/set_current_utc targets an instant earlier than the current logical clock" }

  - { id: ERR_FRANCHISEE_NOT_FOUND, http: 404, condition: "No Franchisee exists for the id in the path" }
  - { id: ERR_ROUTE_NOT_FOUND, http: 404, condition: "No Route exists for the id in the path, or the route does not belong to the named franchisee" }
  - { id: ERR_SHOP_NOT_FOUND, http: 404, condition: "No ShopLocation exists for the id in the path" }
  - { id: ERR_TECHNICIAN_NOT_FOUND, http: 404, condition: "No Technician exists for the id in the path" }
  - { id: ERR_APPLICATION_NOT_FOUND, http: 404, condition: "No CreditApplication exists for the id in the path" }
  - { id: ERR_ACCOUNT_NOT_FOUND, http: 404, condition: "No CreditAccount exists for the id in the path" }
  - { id: ERR_PAYMENT_NOT_FOUND, http: 404, condition: "No Payment exists for the id in the path, or it does not belong to the named account" }
  - { id: ERR_ORDER_NOT_FOUND, http: 404, condition: "No SalesOrder exists for the id in the path" }
  - { id: ERR_CLAIM_NOT_FOUND, http: 404, condition: "No WarrantyClaim exists for the id in the path, or it does not belong to the named order" }
  - { id: ERR_PRODUCT_NOT_FOUND, http: 404, condition: "No Product exists for the id in the path or body" }
  - { id: ERR_PRODUCT_ORDER_NOT_FOUND, http: 404, condition: "No ProductOrder exists for the id in the path" }
  - { id: ERR_INVENTORY_POSITION_NOT_FOUND, http: 404, condition: "The route holds no InventoryPosition for the named product" }

  - { id: ERR_INVALID_STATE, http: 409, condition: "The target resource's state has no transition for this trigger" }
  - { id: ERR_ROUTE_NOT_IN_SERVICE, http: 409, condition: "Operation requires route_status == IN_SERVICE" }
  - { id: ERR_ROUTE_ALREADY_IN_SERVICE, http: 409, condition: "Activation requested for a route that is not DRAFT" }
  - { id: ERR_APPLICATION_ALREADY_DECIDED, http: 409, condition: "Decision requested for an application that is already APPROVED, DECLINED or WITHDRAWN" }
  - { id: ERR_APPLICATION_NOT_APPROVED, http: 409, condition: "Account minting requested for an application whose application_status != APPROVED" }
  - { id: ERR_ACCOUNT_NOT_ACTIVE, http: 409, condition: "Financing or account mutation requires account_status == ACTIVE" }
  - { id: ERR_ACCOUNT_NOT_DELINQUENT, http: 409, condition: "Cure requires account_status == DELINQUENT" }
  - { id: ERR_ACCOUNT_NOT_SUSPENDED, http: 409, condition: "Reinstatement requested for an account that is not SUSPENDED or DELINQUENT" }
  - { id: ERR_ACCOUNT_ALREADY_CLOSED, http: 409, condition: "Mutation attempted on a CLOSED account" }
  - { id: ERR_PAYMENT_NOT_BOOKED, http: 409, condition: "Collection or cancellation requires payment_status == BOOKED" }
  - { id: ERR_PAYMENT_NOT_COLLECTED, http: 409, condition: "Reversal requires payment_status == COLLECTED" }
  - { id: ERR_CLAIM_ALREADY_TERMINAL, http: 409, condition: "Decision requested for a claim whose claim_status is APPROVED or REJECTED" }
  - { id: ERR_CLAIM_NOT_TERMINAL, http: 409, condition: "Reopen requested for a claim that is not APPROVED or REJECTED" }
  - { id: ERR_PRODUCT_ORDER_NOT_DRAFT, http: 409, condition: "A pledge may only be filed against a ProductOrder in DRAFT status" }
  - { id: ERR_ORDER_NOT_CONFIRMABLE, http: 409, condition: "Confirmation requires order_status == DRAFT" }
  - { id: ERR_ORDER_NOT_DELIVERABLE, http: 409, condition: "Delivery requires order_status == CONFIRMED" }
  - { id: ERR_ORDER_NOT_SETTLEABLE, http: 409, condition: "Settlement requires order_status == DELIVERED with no live warranty claim" }
  - { id: ERR_TERRITORY_NOT_QUALIFIED, http: 409, condition: "Operation requires territory_development_status == QUALIFIED" }
  - { id: ERR_RESALE_NOT_PENDING, http: 409, condition: "Resale decision requires resale_status == PENDING" }
  - { id: ERR_RESALE_ALREADY_PENDING, http: 409, condition: "A resale filing is requested while resale_status == PENDING" }
  - { id: ERR_TECHNICIAN_NOT_ACTIVE, http: 409, condition: "Shop change requires technician_status == ACTIVE" }
  - { id: ERR_TECHNICIAN_EXITED, http: 409, condition: "Operation refused for a technician whose technician_status == TRADE_EXITED" }

  - { id: ERR_STALE_VERSION, http: 412, condition: "The supplied expected_<parent>_version does not match the parent's current version" }

  - { id: ERR_FRANCHISEE_NOT_CERTIFIED, http: 409, condition: "Route activation, territory qualification or resale requires franchisee.training_status == CERTIFIED" }
  - { id: ERR_TRADE_EXIT_OPEN_ORDER, http: 422, condition: "Trade exit refused while the technician has a SalesOrder in CONFIRMED status" }
  - { id: ERR_WARRANTY_ORDER_NOT_DELIVERED, http: 422, condition: "Warranty filing or decision requires the parent order in DELIVERED or SETTLED status" }
  - { id: ERR_LEASE_TERM_REQUIRED, http: 422, condition: "requested_term_months is absent on an application with requested_kind == LEASE" }
  - { id: ERR_UNIQUENESS_VIOLATION, http: 409, condition: "A declared unique key is already taken" }
  - { id: ERR_ROUTE_CODE_DUPLICATE, http: 409, condition: "route_code is already used by another route" }
  - { id: ERR_SKU_DUPLICATE, http: 409, condition: "sku is already used by another product" }
  - { id: ERR_INVENTORY_POSITION_DUPLICATE, http: 409, condition: "The route already holds an inventory position for that product" }
  - { id: ERR_SHOP_ZIP_NOT_IN_TERRITORY, http: 400, condition: "The shop's zip_code is absent from the owning route's zip_codes" }
  - { id: ERR_INSUFFICIENT_INVENTORY, http: 409, condition: "A sales line quantity exceeds the matching InventoryPosition.remaining_qty" }
  - { id: ERR_ALLOCATION_CEILING_EXCEEDED, http: 422, condition: "requested_cost_cents exceeds investment_ceiling_cents" }
  - { id: ERR_PLEDGE_OVERSUBSCRIBED, http: 422, condition: "Pledged qty for a product exceeds the ProductOrder's ordered_qty for that product" }
  - { id: ERR_LAUNCH_ALREADY_ALLOCATED, http: 409, condition: "A launch allocation already exists for this product" }
  - { id: ERR_PAYMENT_WEEK_IN_PAST, http: 422, condition: "expected_week_start is not a Monday 00:00:00Z, or precedes the logical clock's week" }
  - { id: ERR_TERRITORY_WINDOW_CONFLICT, http: 422, condition: "A development round would open while an earlier round on the same route is still in force" }
  - { id: ERR_CHARGE_OFF_NOT_DUE, http: 422, condition: "Charge-off requested before effective_charge_off_week, or close requested with a non-zero balance" }
  - { id: ERR_ACCOUNT_LIMIT_EXCEEDED, http: 402, condition: "financed_principal_cents exceeds the target account's credit_available_cents" }
  - { id: ERR_CREDIT_LIMIT_EXCEEDED, http: 402, condition: "Revolving financed amount exceeds the technician's revolving_available_cents" }
  - { id: ERR_CREDIT_REQUEST_ABOVE_CAP, http: 402, condition: "requested_limit_cents exceeds CREDIT_ABSOLUTE_CAP_CENTS" }
  - { id: ERR_ACCOUNT_HAS_BALANCE, http: 422, condition: "A closure or line termination is requested while current_balance_cents > 0" }
  - { id: ERR_FALLBACK_LOCATION_MISSING, http: 422, condition: "A franchisee-draft collection is requested but the franchisee has no ACTIVE ShopLocation to fall back to" }
  - { id: ERR_EMPTY_MIX_LINES, http: 422, condition: "A product order or sales order is submitted with an empty line array" }
  - { id: ERR_WARRANTY_LINE_OUT_OF_RANGE, http: 422, condition: "claim.line_index is outside the parent order's lines array" }
  - { id: ERR_WARRANTY_ALREADY_CLAIMED, http: 409, condition: "A non-terminal warranty claim already exists for the same (order, line_index)" }
  - { id: ERR_CERTIFICATION_POINTS_SHORT, http: 422, condition: "Certification requested with training_points below CERTIFICATION_THRESHOLD" }# =============================================================================
# §1.7 RBAC Matrix
# =============================================================================
roles:

  - name: PlatformAdmin
    description: "Benchmark operator role. Owns the logical clock and the product catalogue; performs no business mutation of routes, accounts or orders."
    identity: opaque
    exclusive_operations:
      - "POST /_clock/set_current_utc — set the logical clock"
      - "POST /products — create a product"
      - "PUT /products/{id} — update a product"
      - "GET /products, GET /products/{id} — read the catalogue"
    shared_operations:
      - "GET on every resource type (read-only oversight)"

  - name: FranchiseOwner
    description: "Entity-backed franchisee principal. Owns routes, shops, technician onboarding, replenishment orders and resale filings."
    identity: entity_backed:Franchisee
    exclusive_operations:
      - "POST /franchisees/{id}/training/enroll — enroll, certify or recertify"
      - "POST /franchisees/{id}/routes — create a route"
      - "PUT /routes/{id} — update route attributes"
      - "POST /routes/{id}/shop-locations — create a shop"
      - "POST /technicians — onboard a technician"
      - "PUT /technicians/{id} — update a technician"
      - "POST /routes/{id}/product-orders — create a replenishment order"
      - "POST /routes/{id}/inventory-positions — create an inventory position"
      - "POST /routes/{id}/resale — file a territory resale"
      - "POST /routes/{id}/territory/develop — open a development round"
    shared_operations:
      - "GET on routes, shops, technicians, accounts, orders"

  - name: FranchiseManager
    description: "Opaque franchisor field manager. Adjudicates route suspensions, territory surrenders, resale decisions, charge-off settlements and delinquency."
    identity: opaque
    exclusive_operations:
      - "POST /routes/{id}/status — suspend, reinstate or retire under manager authority"
      - "POST /routes/{id}/territory/surrender — surrender a qualified territory"
      - "POST /routes/{id}/resale/decide — approve or decline a resale"
      - "POST /credit-accounts/{id}/status — charge off, settle charge-off or close"
      - "POST /credit-accounts/{id}/payments/{paymentId}/status — mark a booking missed or cancel it"
      - "POST /technicians/{id}/status — record a trade exit"
      - "POST /product-orders/{id}/status — ship, allocate or cancel a replenishment order"
    shared_operations:
      - "GET on every resource type"

  - name: CreditOfficer
    description: "Opaque franchisor credit adjudicator. Reviews and decides franchisor-sourced applications, cures delinquency and reverses collections."
    identity: opaque
    exclusive_operations:
      - "POST /credit-applications/{id}/decide with decision=APPROVE for a FRANCHISOR-sourced application"
      - "POST /credit-applications/{id}/decide with decision=DECLINE for a FRANCHISOR-sourced application"
      - "POST /credit-applications/{id}/review — open a franchisor review"
      - "POST /credit-applications/{id}/accounts — mint a credit account"
      - "POST /credit-accounts/{id}/payments/{paymentId}/status with action=REVERSE"
    shared_operations:
      - "GET on applications, accounts, payments, orders, claims"

  - name: RouteSalesRep
    description: "Entity-backed route sales representative (acts as the franchisee's truck operator). Writes sales orders, collects payments and files warranty claims."
    identity: entity_backed:Franchisee
    exclusive_operations:
      - "POST /routes/{id}/sales-orders — create a sales order on own route"
      - "PATCH /sales-orders/{id} — edit lines on own route's draft order"
      - "POST /sales-orders/{id}/status — confirm, deliver, settle or cancel own route's order"
      - "POST /credit-accounts/{id}/bill — book a payment"
      - "POST /credit-accounts/{id}/payments/{paymentId}/status with action=COLLECT"
      - "POST /sales-orders/{id}/warranty-claims — file a warranty claim"
      - "POST /sales-orders/{id}/warranty-claims/{claimId}/decide with decision=SUBMIT or decision=REOPEN_REQUEST"
    shared_operations:
      - "GET on own route, its shops, its orders and its accounts"

  - name: WarrantyAdmin
    description: "Opaque franchisor warranty adjudicator. Approves or rejects submitted claims and reopens approvals."
    identity: opaque
    exclusive_operations:
      - "POST /sales-orders/{id}/warranty-claims/{claimId}/decide with decision=APPROVE"
      - "POST /sales-orders/{id}/warranty-claims/{claimId}/decide with decision=REJECT"
      - "POST /sales-orders/{id}/warranty-claims/{claimId}/decide with decision=REOPEN"
    shared_operations:
      - "GET on orders and claims"

  - name: Technician
    description: "Entity-backed tool buyer. Read-only access to its own credit accounts, payments and orders; may not mutate them."
    identity: entity_backed:Technician
    exclusive_operations: []
    shared_operations:
      - "GET /credit-accounts?technician_id={id} — list own accounts"
      - "GET /credit-accounts/{id} — read own account"
      - "GET /credit-accounts/{id}/payments — read own payment history"
      - "GET /sales-orders?technician_id={id} — read own orders"