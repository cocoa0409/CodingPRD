  - rule_id: cross_entity_state_dependency
    instances:
      - name: lease_create_rejected_when_the_only_published_schedule_takes_effect_after_the_start_date
        grounds:
          - validations.priority_72_eligible_published_schedule_required
          - calculations.base_rent_selection
          - state_machines.MarketRentSchedule.publication.PUBLISHED_to_SUPERSEDED
          - errors.ERR_NO_PUBLISHED_RENT_SCHEDULE
        distinguishing_aspect: |
          The lease is perfectly valid in itself — the homesite is AVAILABLE in a SECTIONS_RELEASED
          phase of an OPEN, plat-approved community — and fails only because of the state of a third
          entity it never names: the community's DETACHED MarketRentSchedule is PUBLISHED but its
          effective_from (2026-09-01) is after the lease start_date (2026-08-01), so the eligibility
          filter returns an empty candidate set. Publishing a second schedule with an EARLIER
          effective_from then makes the same request succeed, which also proves supersession follows
          publication order rather than effective_from order: the later-dated 300000 schedule is the one
          that becomes SUPERSEDED.
        test_recipe:
          setup:
            - "Community 'Ravensdale' with product_mix {DETACHED: 2, COTTAGE: 0, TOWNHOME: 0}, total_planned_units 2, plat APPROVED, posture OPEN."
            - "One SECTIONS_RELEASED housing phase with one released AVAILABLE DETACHED homesite."
            - "Exactly one PUBLISHED DETACHED schedule at 300000 whose effective_from is 2026-09-01, a month after the intended lease start_date."
            - "One household with monthly_income_cents 1200000. Logical clock at the default 2026-08-01T00:00:00Z."
