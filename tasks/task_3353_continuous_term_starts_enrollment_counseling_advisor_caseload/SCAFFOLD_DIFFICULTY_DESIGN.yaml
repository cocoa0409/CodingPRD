              as: RegistrarAdmin
              captures: { term_id: "$.data.id" }
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-09-05T00:00:00Z" }
              as: SystemAdmin
            - call: "POST /api/terms/${term_id}/advance"
              payload: { to_state: "ENROLLMENT_OPEN" }
              as: RegistrarAdmin
            - call: "POST /api/staff"
              payload: { full_name: "Ann Advisor", email: "adv@x.com", staff_type: "ADVISOR", caseload_cap: 5 }
              as: SystemAdmin
              captures: { adv_id: "$.data.id" }
            - call: "POST /api/applicants"
              payload: { full_name: "Pat Prospect", email: "p@x.com", state_code: "CO" }
              as: RegistrarAdmin
              captures: { ap_id: "$.data.id" }
            - call: "POST /api/applications"
              payload: { applicant_id: "${ap_id}", term_id: "${term_id}", program_id: "${prog_id}" }
              as: Applicant
              as_user_id: "${ap_id}"
              captures: { appl_id: "$.data.id" }
            - call: "POST /api/applications/${appl_id}/decision"
              payload: { decision: "ADMIT" }
              as: RegistrarAdmin
              captures: { appl_v: "$.data.version" }
            - call: "POST /api/applications/${appl_id}/transfer-credit-evaluations"
              payload: { accepted_credits: 0, in_progress_credits: 0 }
              as: RegistrarAdmin
              captures: { tce_id: "$.data.id" }
            - call: "POST /api/transfer-credit-evaluations/${tce_id}/advance"
              payload: { to_state: "IN_REVIEW" }
              as: RegistrarAdmin
            - call: "POST /api/transfer-credit-evaluations/${tce_id}/advance"
              payload: { to_state: "COMPLETED" }
              as: RegistrarAdmin
            - call: "POST /api/enrollments"
              payload: { application_id: "${appl_id}", advisor_id: "${adv_id}", enrollment_intensity: "FULL_TIME", tuition_cents: 500000, expected_application_version: "${appl_v}" }
              as: RegistrarAdmin
              captures: { enr_id: "$.data.id" }
