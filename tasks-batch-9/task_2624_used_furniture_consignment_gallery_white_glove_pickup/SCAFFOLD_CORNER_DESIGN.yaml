              as: GalleryManager
              as_user_id: "mgr-1"
              captures: { agr_id: $.data.id }
            - call: "POST /consignment-agreements/${agr_id}/activate"
              payload: {}
              as: GalleryManager
              as_user_id: "mgr-1"
          trigger:
            - call: "POST /consignment-agreements/${agr_id}/activate"
              payload: {}
              as: GalleryManager
              as_user_id: "mgr-2"
          assert:
            - "HTTP 409 and data.error_id == \"ERR_AGREEMENT_STATE_INVALID\""
            - "GET /consignment-agreements/${agr_id} still reports approved_by_user_id == \"mgr-1\", not mgr-2"
            - "GET /consignment-agreements/${agr_id} still reports version == 2 and effective_at == \"2026-08-01T00:00:00Z\""

      - name: placement_stamps_the_tag_the_listing_clock_and_the_zone_occupancy
        claim_type: side_effect_execution
        grounds:
          - state_machines.ConsignmentItem.lifecycle_state.transitions.AWAITING_PLACEMENT_to_ON_FLOOR
          - calculations.markdown_price
          - calculations.floor_zone_utilization
          - endpoints[POST /consignment-items/{id}/place]
        distinguishing_aspect: "One place call fires four declared side effects at once: lifecycle_state ON_FLOOR, tag_code and listed_at written from the logical clock, markdown_price seating the piece on sequence 1 at 51000, and floor_zone_utilization raising Front A's occupied_sqft from 0 to 20 with utilization_state NORMAL at ratio 0.10."
        test_recipe:
          setup:
            - "consignor Alpha at floor 1 without an elevator on an ACTIVE STD-2026 agreement"
            - "one CASEGOOD piece declared 60000 at 12 cuft and 20 sqft, screened and received at 8.0 / 9.0 / 9.0 -> photo_score 8.55 -> grade A -> list_price_cents round_half_up(round_half_up(60000*0.85) * 1.00) == 51000"
            - "collected on a completed 2-mover job from floor 1: 12000 + ceil(12/10)*2500 == 17000, cap round_half_up(0.35*60000) == 21000 not binding"
            - "zone Front A of type SHOWROOM_FRONT with capacity_sqft 200, currently empty"
            - "the logical clock never leaves 2026-08-01T00:00:00Z, so days_on_floor is 0 and the sequence-1 step (offset 0, markdown_pct 0.00) is in force"
