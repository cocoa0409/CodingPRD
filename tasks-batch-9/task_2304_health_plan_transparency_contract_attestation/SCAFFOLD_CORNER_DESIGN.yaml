          setup:
            - "ACTIVE PlanYear PY2027 (covered_lives 6000) with one TPA contract."
            - "One LIVE PriceComparisonTool launched 2027-05-01, covered_items_count 800, sla_target_uptime_pct default 99.00."
            - "Clock advanced to 2027-07-01T09:00:00Z, then four outage windows appended: 2027-05-20T00:00:00Z..2027-05-20T10:00:00Z (600 min), 2027-06-10T00:00:00Z..03:00:00Z (180 min), 2027-06-10T03:00:00Z..04:12:00Z (72 min, touching the previous one), 2027-06-20T01:00:00Z..02:00:00Z (60 min)."
