          assert:
            - "list1_cents == 100000000"
            - "the listing at 2026-09-01T00:59:59Z is rejected with error_id ERR_LISTING_COOLDOWN and HTTP status 409"
            - "err_inside == ERR_LISTING_COOLDOWN"
            - "the listing at exactly 2026-09-01T01:00:00Z succeeds because the cooldown window is the half-open interval [prev, prev + 1 hour)"
            - "HouseholdAccount.${acct_id}.last_listed_at == 2026-09-01T01:00:00Z after the second accepted listing"

  - rule_id: compensating_invariant
    instances:

      - name: block_cost_basis_conservation_via_execution_credit
        grounds:
          - calculations.over_allocation_credit
          - calculations.block_trade_average_price_allocation
          - state_machines.BlockOrder.ALLOCATED_to_SETTLED
          - entities.BlockAllocation.fields.fee_rebate_cents
        distinguishing_aspect: "Conserved quantity = money: after C4 runs, the sum of allocated_cost_cents minus the sum of fee_rebate_cents must equal the block notional 5237500 exactly, restoring the 1-cent drift created by per-allocation rounding and leaving zero residual on the block."
        test_recipe:
          setup:
            - "Logical clock at 2026-09-01T00:00:00Z. Firm with EXECUTED agreement and GRANTED TRADING_AUTHORIZATION and MODEL_MANAGEMENT entitlements, firm_posture OPEN."
            - "Approved model assigned to three OPEN accounts A1/A2/A3."
          setup_api_calls:
            - *c_clock
            - *c_firm
            - *c_agr
            - *c_agr_submit
            - *c_agr_exec
            - *c_ent_tr
            - *c_ent_tr_grant
            - *c_ent_mm
            - *c_ent_mm_grant
            - *c_house
            - *c_model
            - call: "POST /ria/models/${model_id}/targets"
              payload: { symbol: "VTI", target_weight_bps: 10000 }
              as: AdvisorOperationsLead
            - call: "POST /ria/models/${model_id}/approve"
