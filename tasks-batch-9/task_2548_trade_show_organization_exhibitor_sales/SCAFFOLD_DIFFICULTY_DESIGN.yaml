            - "After resolving ob2: Exhibitor.${ex1}.ledger_points == 590 (the credit lands on sponsorship_fulfillment_points, not on the ledger)"

      - name: show_close_cascades_missed_obligation_into_exhibitor_suspension
        grounds:
          - state_machines.Show.ON_SITE_to_CLOSED
