      - name: yield_on_cost_variants_produce_different_answers
        claim_type: variant_divergence
        grounds:
          - calculations.yield_on_cost.variants[underwritten]
          - calculations.yield_on_cost.variants[realized]
        excluded_because:
          difficulty_instance: yield_on_cost_underwritten_versus_realized_diverges_28_bps
          rationale: |
            Divergence has to be measured on one row whose two variant groups are both populated;
            that difficulty instance does exactly this and pins the 559 / 531 pair plus the resulting
            hold_sell_score_bps sign flip. A corner test could only re-assert one of the two halves.

      - name: fraud_score_variant_follows_verification_attempt_count
        claim_type: variant_selection
        grounds:
          - calculations.prospect_fraud_risk_score.variants[pre_verification]
          - calculations.prospect_fraud_risk_score.variants[post_verification]
        excluded_because:
          difficulty_instance: fraud_score_pre_versus_post_verification_diverges_3757_bps
          rationale: |
            Variant selection and variant divergence are the same two calls for this rule - create
            then verify - and that difficulty instance already asserts both fraud_score_variant tags
            along with the 4850 / 1093 scores.

      - name: turn_holdback_cap_is_a_share_of_gross_cost
        claim_type: constants_applied
        grounds:
          - calculations.turn_holdback
        excluded_because:
          difficulty_instance: turn_holdback_cap_keyed_on_gross_not_net_turn_cost
          rationale: |
            The cap constant is only observable when it binds, which needs the 1520000-cent gross and
            the 4-day overage that difficulty instance sets up; below that the raw holdback wins and
            the constant is invisible.

      - name: screening_rent_to_income_ceiling_is_inclusive
        claim_type: correct_result
        grounds:
          - calculations.screening_decision
        excluded_because:
          difficulty_instance: rent_to_income_exactly_at_market_ceiling_conditionally_approved
          rationale: |
            The interesting screening result is the boundary itself (verified income 537500 gives
            exactly 4000 bps and still passes), and that difficulty instance pairs it with the 537000
            failure case. An interior-value corner test would not exercise the comparison operator.

