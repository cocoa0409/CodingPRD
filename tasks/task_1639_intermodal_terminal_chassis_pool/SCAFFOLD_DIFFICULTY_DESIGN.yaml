  # ---------------------------------------------------------------------------
  # Rule 7 — Cross-entity state dependencies across different entity pairs
  # ---------------------------------------------------------------------------
  - rule_id: cross_entity_state_dependency
    instances:
      - name: container_ground_depends_on_train_arrived
        grounds:
          - state_machines.Container.transitions
          - state_machines.Train
          - validations[priority=13]
          - errors[ERR_TRAIN_NOT_ARRIVED]
        distinguishing_aspect: |
          Pair = Container -> Train: Container's INBOUND_TRAIN -> ON_GROUND
