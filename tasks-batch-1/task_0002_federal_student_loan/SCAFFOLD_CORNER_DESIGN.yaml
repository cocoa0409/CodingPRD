  # ==========================================================================
  # Section: errors
  # ==========================================================================
  - section: errors
    instances:
      - name: err_unauthenticated_missing_headers
        claim_type: violation_to_error
        grounds: ["errors[ERR_UNAUTHENTICATED]"]
        distinguishing_aspect: "POST /borrowers without X-User-Role or X-User-ID returns ERR_UNAUTHENTICATED 401."
        test_recipe:
          setup: ["empty DB"]
          setup_api_calls: []
          trigger:
            - call: "POST /loan-servicing/borrowers"
              payload: { full_name: "Anon B", ssn_last4: "0028" }
              as: Anonymous
              captures: { err: $.data.error_id }
          assert:
            - "${err} == ERR_UNAUTHENTICATED"

      - name: err_loan_not_found_on_unrelated_endpoint
        claim_type: violation_to_error
        grounds: ["errors[ERR_LOAN_NOT_FOUND]"]
        excluded_because:
          difficulty_instance: priority_pair_validation_conflict / priority_existence_vs_auth_loan_not_found_wins_over_unauthorized
          rationale: "Already exercised — distinguished by auth-priority winning over loan-existence on the wrong-role path."

      - name: err_resource_not_found_on_repayment_plan_activate
        claim_type: violation_to_error
        grounds: ["errors[ERR_RESOURCE_NOT_FOUND]"]
        distinguishing_aspect: "POST /repayment-plans/{nonexistent}/activate returns ERR_RESOURCE_NOT_FOUND 404."
        test_recipe:
          setup: ["empty DB"]
          setup_api_calls:
            - call: "POST /loan-servicing/_clock/set_current_utc"
              payload: { to_iso8601: "2026-06-01T00:00:00Z" }
              as: LoanServicer
          trigger:
            - call: "POST /loan-servicing/repayment-plans/00000000-0000-0000-0000-000000000000/activate"
              payload: {}
              as: LoanServicer
              captures: { err: $.data.error_id }
          assert:
            - "${err} == ERR_RESOURCE_NOT_FOUND"

  # ==========================================================================
  # Section: rbac
  # ==========================================================================
  - section: rbac
    instances:
      - name: borrower_cannot_certify_income
        claim_type: role_denial
        grounds: ["roles", "validations[priority=2]"]
        distinguishing_aspect: "Borrower role calling POST /income-certifications/{id}/certify (LoanServicer-exclusive) returns ERR_UNAUTHORIZED."
        test_recipe:
          setup: ["Borrower with SUBMITTED IncomeCertification"]
          setup_api_calls:
            - call: "POST /loan-servicing/_clock/set_current_utc"
              payload: { to_iso8601: "2026-06-01T00:00:00Z" }
              as: LoanServicer
            - call: "POST /loan-servicing/borrowers"
              payload: { full_name: "Rbac B", ssn_last4: "0029", is_veteran: false }
              as: LoanServicer
              captures: { b_id: $.data.id }
            - call: "POST /loan-servicing/income-certifications"
              payload: { borrower_id: "${b_id}", agi_cents: 6000000, family_size: 2, state_code: "CA", effective_date: "2026-05-01T00:00:00Z" }
              as: Borrower
              as_user_id: "${b_id}"
              captures: { ic_id: $.data.id }
          trigger:
            - call: "POST /loan-servicing/income-certifications/${ic_id}/certify"
              payload: {}
              as: Borrower
              as_user_id: "${b_id}"
              captures: { err: $.data.error_id }
          assert:
            - "${err} == ERR_UNAUTHORIZED"

      - name: collections_agent_cannot_post_payment
        claim_type: role_denial
        grounds: ["roles"]
        distinguishing_aspect: "CollectionsAgent calling POST /payments (not allowed) returns ERR_UNAUTHORIZED."
        test_recipe:
          setup: ["Loan in REPAYMENT"]
          setup_api_calls:
            - call: "POST /loan-servicing/_clock/set_current_utc"
              payload: { to_iso8601: "2026-06-01T00:00:00Z" }
              as: LoanServicer
            - call: "POST /loan-servicing/borrowers"
              payload: { full_name: "Coll B", ssn_last4: "0031", is_veteran: false }
              as: LoanServicer
              captures: { b_id: $.data.id }
            - call: "POST /loan-servicing/loans"
              payload: { borrower_id: "${b_id}", loan_type: "DIRECT_UNSUB", principal_cents: 100000, interest_rate_bps: 500, disbursement_date: "2026-06-01T00:00:00Z" }
              as: LoanServicer
              captures: { ln_id: $.data.id }
            - call: "POST /loan-servicing/loans/${ln_id}/enter-school"
              payload: {}
              as: LoanServicer
            - call: "POST /loan-servicing/loans/${ln_id}/graduate"
              payload: {}
              as: LoanServicer
            - call: "POST /loan-servicing/loans/${ln_id}/start-repayment"
              payload: {}
              as: LoanServicer
          trigger:
            - call: "POST /loan-servicing/payments"
              payload: { loan_id: "${ln_id}", amount_cents: 1000, payment_date: "2026-06-01T00:00:00Z" }
              as: CollectionsAgent
              captures: { err: $.data.error_id }
          assert:
            - "${err} == ERR_UNAUTHORIZED"

      - name: loan_servicer_cannot_declare_default
        claim_type: role_denial
        grounds: ["roles"]
        distinguishing_aspect: "LoanServicer calling /declare-default (CollectionsAgent-exclusive) returns ERR_UNAUTHORIZED — peer-role enforcement."
        test_recipe:
          setup: ["Loan in REPAYMENT with delinquency_days >= 270"]
          setup_api_calls:
            - call: "POST /loan-servicing/_clock/set_current_utc"
              payload: { to_iso8601: "2025-06-01T00:00:00Z" }
              as: LoanServicer
            - call: "POST /loan-servicing/borrowers"
              payload: { full_name: "Peer B", ssn_last4: "0032", is_veteran: false }
              as: LoanServicer
              captures: { b_id: $.data.id }
            - call: "POST /loan-servicing/loans"
              payload: { borrower_id: "${b_id}", loan_type: "DIRECT_UNSUB", principal_cents: 100000, interest_rate_bps: 500, disbursement_date: "2025-06-01T00:00:00Z" }
              as: LoanServicer
              captures: { ln_id: $.data.id }
            - call: "POST /loan-servicing/loans/${ln_id}/enter-school"
              payload: {}
              as: LoanServicer
            - call: "POST /loan-servicing/loans/${ln_id}/graduate"
              payload: {}
              as: LoanServicer
            - call: "POST /loan-servicing/loans/${ln_id}/start-repayment"
              payload: {}
              as: LoanServicer
            - call: "POST /loan-servicing/_clock/set_current_utc"
              payload: { to_iso8601: "2026-03-10T00:00:00Z" }
              as: LoanServicer
          trigger:
            - call: "POST /loan-servicing/loans/${ln_id}/declare-default"
              payload: {}
              as: LoanServicer
              captures: { err: $.data.error_id }
          assert:
