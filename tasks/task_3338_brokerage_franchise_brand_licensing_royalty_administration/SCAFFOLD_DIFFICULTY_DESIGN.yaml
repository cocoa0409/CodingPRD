scaffold_difficulty_design:
  - rule_id: dual_variant_calc
    instances:
      - name: royalty_final_vs_provisional_cap_binding
        grounds:
          - calculations.royalty_rate_assessment
          - entities.RoyaltyPeriod.fields.royalty_due_cents
          - entities.RoyaltyPeriod.fields.provisional_royalty_cents
        distinguishing_aspect: |
          Two variants of the same month's royalty diverge because the annual
          cap binds: final due = 0 (cap residual 2,000,000 minus rebate
          3,000,000 floored at 0) while provisional = 18,000,000 for identical
          GCI input — cap and rebate are skipped in the provisional variant.
        test_recipe:
          setup:
            - "Brand B1 ACTIVE; Market PHX; Brokerage BR1 FRANCHISED with agreement A1 ACTIVE (base 600bps, volume 300bps, threshold 1000000000, cap 50000000, ad fund 200bps)"
            - "GCI reports: 2027-01 = 800000000; 2027-02 = 400000000"
            - "RoyaltyPeriod for 2027-01 already assessed (billed 48000000, cumulative_gci 800000000)"
          setup_api_calls:
            - call: "POST /franchise/brands"
              payload: { brand_code: "B1", display_name: "Brand One" }
              as: FranchisorOps
              captures: { brand1: $.data.id }
            - call: "POST /franchise/markets"
              payload: { market_code: "PHX", name: "Phoenix Metro" }
              as: FranchisorOps
              captures: { mkt1: $.data.id }
            - call: "POST /franchise/brokerages"
              payload: { legal_name: "Desert Realty LLC", home_market_id: "${mkt1}", principal_email: "p@desert.example" }
              as: FranchisorOps
              captures: { brok1: $.data.id }
            - call: "POST /franchise/agreements"
              payload: { brokerage_id: "${brok1}", brand_id: "${brand1}", market_id: "${mkt1}", term_start: "2027-01-01T00:00:00Z", term_end: "2031-12-31T00:00:00Z", base_royalty_rate_bps: 600, annual_royalty_cap_cents: 50000000, volume_incentive_threshold_cents: 1000000000, volume_incentive_rate_bps: 300, ad_fund_rate_bps: 200 }
              as: FranchisorOps
              captures: { agr1: $.data.id, agr1_v: $.data.version }
            - call: "POST /franchise/agreements/${agr1}/conversion-plans"
              payload: { milestones: [ { name: "signage", target_date: "2027-01-01T00:00:00Z", sequence: 1 } ] }
              as: FranchisorOps
              captures: { cp1: $.data.id }
            - call: "POST /franchise/conversion-plans/${cp1}/milestones/complete"
              payload: { sequence: 1 }
              as: FranchisorOps
            - call: "POST /franchise/agreements/${agr1}/activate"
              payload: { expected_agreement_version: "${agr1_v}" }
              as: FranchisorOps
            - call: "POST /franchise/agreements/${agr1}/gci-reports"
              payload: { period_month: "2027-01", gci_cents: 800000000 }
              as: FranchisorOps
            - call: "POST /franchise/agreements/${agr1}/royalty-periods"
              payload: { period_month: "2027-01" }
              as: FranchisorOps
            - call: "POST /franchise/agreements/${agr1}/gci-reports"
              payload: { period_month: "2027-02", gci_cents: 400000000 }
              as: FranchisorOps
          trigger:
            - call: "POST /franchise/agreements/${agr1}/royalty-periods"
              payload: { period_month: "2027-02" }
              as: FranchisorOps
              captures: { rp2_due: $.data.royalty_due_cents, rp2_prov: $.data.provisional_royalty_cents }
          assert:
            - "RoyaltyPeriod(2027-02).royalty_due_cents == 0"
            - "RoyaltyPeriod(2027-02).provisional_royalty_cents == 18000000"
            - "FranchiseAgreement.${agr1}.cumulative_billed_royalty_cents == 50000000"
            - "FranchiseAgreement.${agr1}.cumulative_gci_cents == 1200000000"
      - name: ad_fund_zero_when_suspended_vs_active
        grounds:
          - calculations.ad_fund_accrual
          - entities.RoyaltyPeriod.fields.ad_fund_due_cents
        distinguishing_aspect: |
          Same GCI (100000000) assessed twice on the same agreement: the ACTIVE
          assessment accrues ad_fund_due_cents = 2000000 and writes a COLLECT
          ledger entry; the SUSPENDED assessment accrues 0 and writes no ledger
          entry — the suspension-state variant of the accrual calculation.
        test_recipe:
          setup:
            - "Agreement A2 ACTIVE (ad_fund_rate_bps 200, base 600, volume 300, threshold 1000000000, cap 900000000) with GCI report 2027-03 = 100000000 and period 2027-03 assessed while ACTIVE"
            - "A DefaultCase opened and agreement suspended; GCI report 2027-04 = 100000000"
          setup_api_calls:
            - call: "POST /franchise/brands"
              payload: { brand_code: "B2", display_name: "Brand Two" }
              as: FranchisorOps
              captures: { brand2: $.data.id }
            - call: "POST /franchise/markets"
              payload: { market_code: "TUC", name: "Tucson" }
              as: FranchisorOps
              captures: { mkt2: $.data.id }
            - call: "POST /franchise/brokerages"
              payload: { legal_name: "Cactus Homes Inc", home_market_id: "${mkt2}", principal_email: "p@cactus.example" }
              as: FranchisorOps
              captures: { brok2: $.data.id }
            - call: "POST /franchise/agreements"
              payload: { brokerage_id: "${brok2}", brand_id: "${brand2}", market_id: "${mkt2}", term_start: "2027-01-01T00:00:00Z", term_end: "2031-12-31T00:00:00Z", base_royalty_rate_bps: 600, annual_royalty_cap_cents: 900000000, volume_incentive_threshold_cents: 1000000000, volume_incentive_rate_bps: 300, ad_fund_rate_bps: 200 }
              as: FranchisorOps
              captures: { agr2: $.data.id, agr2_v: $.data.version }
            - call: "POST /franchise/agreements/${agr2}/conversion-plans"
              payload: { milestones: [ { name: "tech", target_date: "2027-01-01T00:00:00Z", sequence: 1 } ] }
              as: FranchisorOps
              captures: { cp2: $.data.id }
            - call: "POST /franchise/conversion-plans/${cp2}/milestones/complete"
              payload: { sequence: 1 }
              as: FranchisorOps
            - call: "POST /franchise/agreements/${agr2}/activate"
              payload: { expected_agreement_version: "${agr2_v}" }
              as: FranchisorOps
            - call: "POST /franchise/agreements/${agr2}/gci-reports"
              payload: { period_month: "2027-03", gci_cents: 100000000 }
              as: FranchisorOps
            - call: "POST /franchise/agreements/${agr2}/royalty-periods"
              payload: { period_month: "2027-03" }
              as: FranchisorOps
              captures: { rp3_fund: $.data.ad_fund_due_cents }
            - call: "POST /franchise/agreements/${agr2}/default-cases"
              payload: { reason_code: "PAYMENT" }
              as: FranchisorOps
            - call: "POST /franchise/agreements/${agr2}/suspend"
              payload: {}
              as: FranchisorOps
            - call: "POST /franchise/agreements/${agr2}/gci-reports"
              payload: { period_month: "2027-04", gci_cents: 100000000 }
              as: FranchisorOps
          trigger:
            - call: "POST /franchise/agreements/${agr2}/royalty-periods"
              payload: { period_month: "2027-04" }
              as: FranchisorOps
              captures: { rp4_fund: $.data.ad_fund_due_cents }
          assert:
            - "RoyaltyPeriod(2027-03).ad_fund_due_cents == 2000000"
            - "RoyaltyPeriod(2027-04).ad_fund_due_cents == 0"
            - "GET /franchise/brands/${brand2}/ad-fund-ledger returns exactly 1 COLLECT entry of 2000000 and no entry for period 2027-04"
  - rule_id: combinatorial_formula
    instances:
      - name: royalty_tier_split_rounding_per_leg
        grounds:
          - calculations.royalty_rate_assessment
        distinguishing_aspect: |
          Mode (b) nested rounding: per-leg floor-then-sum is pinned. With
          GCI=1999999, threshold=1000000, base=633bps, volume=211bps the legs
          floor independently (63300 + 21099 = 84399 raw) and the rebate floors
          separately (21099), yielding royalty_due_cents = 63300; sum-then-round
          would produce different cents.
        test_recipe:
          setup:
            - "Agreement A3 ACTIVE (base 633bps, volume 211bps, threshold 1000000, cap 900000000000, ad fund 100bps)"
            - "GCI report 2027-05 = 1999999"
          setup_api_calls:
            - call: "POST /franchise/brands"
              payload: { brand_code: "B3", display_name: "Brand Three" }
              as: FranchisorOps
              captures: { brand3: $.data.id }
            - call: "POST /franchise/markets"
              payload: { market_code: "ABQ", name: "Albuquerque" }
              as: FranchisorOps
              captures: { mkt3: $.data.id }
            - call: "POST /franchise/brokerages"
              payload: { legal_name: "Mesa Properties", home_market_id: "${mkt3}", principal_email: "p@mesa.example" }
              as: FranchisorOps
              captures: { brok3: $.data.id }
            - call: "POST /franchise/agreements"
              payload: { brokerage_id: "${brok3}", brand_id: "${brand3}", market_id: "${mkt3}", term_start: "2027-01-01T00:00:00Z", term_end: "2031-12-31T00:00:00Z", base_royalty_rate_bps: 633, annual_royalty_cap_cents: 900000000000, volume_incentive_threshold_cents: 1000000, volume_incentive_rate_bps: 211, ad_fund_rate_bps: 100 }
              as: FranchisorOps
              captures: { agr3: $.data.id, agr3_v: $.data.version }
            - call: "POST /franchise/agreements/${agr3}/conversion-plans"
              payload: { milestones: [ { name: "signage", target_date: "2027-01-01T00:00:00Z", sequence: 1 } ] }
              as: FranchisorOps
              captures: { cp3: $.data.id }
            - call: "POST /franchise/conversion-plans/${cp3}/milestones/complete"
              payload: { sequence: 1 }
              as: FranchisorOps
            - call: "POST /franchise/agreements/${agr3}/activate"
              payload: { expected_agreement_version: "${agr3_v}" }
              as: FranchisorOps
            - call: "POST /franchise/agreements/${agr3}/gci-reports"
              payload: { period_month: "2027-05", gci_cents: 1999999 }
              as: FranchisorOps
          trigger:
            - call: "POST /franchise/agreements/${agr3}/royalty-periods"
              payload: { period_month: "2027-05" }
              as: FranchisorOps
          assert:
            - "RoyaltyPeriod(2027-05).royalty_due_cents == 63300"
            - "RoyaltyPeriod(2027-05).provisional_royalty_cents == 84399"
      - name: quorum_threshold_branching_on_odd_seats
        grounds:
          - calculations.quorum_rule
          - state_machines.AdFundSpendProposal.SUBMITTED_to_APPROVED
        distinguishing_aspect: |
          Mode (a) non-linear multi-input branch: quorum = floor(seat_count/2)+1
          with >= comparison drives a state transition; with seat_count=5 the
          third APPROVE vote (exactly at quorum 3, not 4) flips SUBMITTED ->
          APPROVED, and subsequent votes are rejected as invalid-state.
