            - call: "POST /ipa/delegation-agreements"
              payload: { payer_name: "Corner Constants Health", payer_tax_id: "94-3000054", delegation_scope: "FULL_RISK", base_pmpm_cents: 30000, reconciliation_method: "ROSTER_SNAPSHOT", ibnr_method: "COMPLETION_FACTOR", ibnr_completion_factor_bps: 8000, target_claims_pmpm_cents: 15000, professional_pool_share_bps: 6000, institutional_pool_share_bps: 4000, quality_withhold_bps: 700, stop_loss_attachment_cents: 5000000, reinsurance_recovery_bps: 9000, max_panel_size: 5 }
