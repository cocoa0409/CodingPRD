            - call: "POST /fuel/hedge-programs"
              payload: { policy_id: "${policy_id}", program_code: "HP-CORNER", period_start_month: "2027-01", period_end_month: "2027-03", route_groups: ["DOMESTIC_SHORT"], target_coverage_pct: 30.00 }
              as: FuelAnalyst
              captures: { prog_id: $.data.id }
            - call: "POST /fuel/hedge-programs/${prog_id}/size"
              payload: {}
              as: FuelAnalyst
              captures: { prog_v: $.data.version }
            - call: "POST /fuel/hedge-programs/${prog_id}/instruments"
              payload: { counterparty_id: "${cp_id}", instrument_type: "SWAP", notional_gallons: 1000000, maturity_month: "2027-03", expected_hedge_program_version: "${prog_v}", strike_usd_per_gal: 2.5000 }
              as: FuelAnalyst
              captures: { inst_id: $.data.id }
            - call: "POST /fuel/hedge-programs/${prog_id}/submit"
              payload: {}
              as: FuelAnalyst
              as_user_id: u_analyst_1
            - call: "POST /fuel/hedge-programs/${prog_id}/activate"
              payload: {}
              as: TreasuryRiskManager
              as_user_id: u_trm_1
          trigger:
            - call: "POST /fuel/hedge-instruments/${inst_id}/execute"
              payload: {}
              as: TreasuryRiskManager
              as_user_id: u_trm_1
            - call: "GET /fuel/counterparties/${cp_id}"
              payload: {}
              as: TreasuryRiskManager
            - call: "GET /fuel/hedge-programs/${prog_id}"
              payload: {}
              as: TreasuryRiskManager
            - call: "GET /fuel/hedge-instruments"
              payload: { counterparty_id: "${cp_id}", trade_status: "EXECUTED" }
              as: TreasuryRiskManager
            - call: "POST /fuel/hedge-instruments/${inst_id}/execute"
              payload: {}
              as: TreasuryRiskManager
              as_user_id: u_trm_1
              captures: { e1: $.data.error_id }
          assert:
            - "Trigger call 1: HTTP 200, response_type == \"object\", meta.api_request_id is present, data.trade_status == \"EXECUTED\", data.margin_requirement_usd == 60000.00, data.delta_adjusted_gallons == 1000000.00, data.executed_at is non-null."
            - "Trigger call 2: data.utilized_credit_usd == 60000.00, data.utilization_pct == 3.00, data.credit_posture == \"NORMAL\", data.posted_collateral_usd == 0."
            - "Trigger call 3: data.hedged_gallons == 1000000, data.delta_adjusted_gallons == 1000000.00, data.coverage_pct_notional == 22.73, data.coverage_pct_delta == 22.73, data.compliance_posture == \"COMPLIANT\"."
            - "Trigger call 4: response_type == \"array\", meta.total_count == 1, meta.limit == 10, meta.offset == 0, meta.has_more == false, data[0].id == ${inst_id}."
            - "Trigger call 5: HTTP 409, response_type == \"error\", data.error_id == \"ERR_INSTRUMENT_INVALID_TRADE_STATE\", data.message is a non-empty string."
