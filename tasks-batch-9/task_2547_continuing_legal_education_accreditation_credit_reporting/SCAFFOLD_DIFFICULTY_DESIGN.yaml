              captures: { cs1: $.data.id }
            - call: "POST /cle/courses"
              payload: { title: "Self-Study: Records Retention", delivery_format: "SELF_STUDY", total_minutes: 180, presented_at: "2026-06-20T09:00:00Z", attendance_verification_method: "AFFIRMATION_ONLY", credit_allocations: [ { category: "GENERAL", minutes: 180 } ], provider_id: "${prov_id}" }
