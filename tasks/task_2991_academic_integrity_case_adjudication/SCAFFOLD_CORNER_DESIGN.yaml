        distinguishing_aspect: |
          Ten shape rules, ten rejections, all ERR_INVALID_REQUEST (400): a lower-case department
          code, a course_code without its hyphen, a term_code with an unknown season, grade_components
          whose weight_pct sum is 99, a duplicate component code, an upper-case sha256, a sha256 of
          63 characters, a similarity_pct with three fractional digits, a similarity_pct of 100.01,
          and a class_year of 9. The paired accepted values sit one step inside each boundary, so an
          implementation with an off-by-one bound fails on the positive side rather than the negative.
