      - name: club_representative_cannot_create_a_product_category_unauthorized
        claim_type: unauthorized_operation
        grounds:
          - roles.ClubRepresentative
          - roles.LeagueLicensingManager
          - endpoints.POST_/licensing/product-categories
          - errors.ERR_UNAUTHORIZED
        distinguishing_aspect: |
          ClubRepresentative reads categories and even suspends its own club's
          marks, which makes a blanket "clubs may write" reading tempting. Category
          creation is exclusive to LeagueLicensingManager, so the club call is a
          403 ERR_UNAUTHORIZED and no row is created; the same payload from
          LeagueLicensingManager is a 201.
        test_recipe:
          setup:
            - "clock at the mandatory default 2026-08-01T00:00:00Z"
            - "an ACTIVE club ATL exists and no category with code HEADWEAR exists"
          setup_api_calls:
            - call: "POST /licensing/_clock/set_current_utc"
              payload: { current_utc: "2026-08-01T00:00:00Z" }
              as: LeagueLicensingManager
              as_user_id: "u_ops_1"
            - call: "POST /licensing/clubs"
              payload: { club_code: "ATL", market_name: "Atlanta", revenue_share_units: 100, status: "ACTIVE" }
              as: LeagueLicensingManager
              as_user_id: "u_ops_1"
              captures: { club_atl: $.data.id }
          trigger:
            - call: "POST /licensing/product-categories"
              payload: { category_code: "HEADWEAR", display_name: "Caps and hats", base_royalty_rate_bps: 1000, tier_schedule: [{ from_cents: 0, to_cents: null, rate_bps: 1000 }], closeout_rate_bps: 400, exclusivity_allowed: false, minimum_guarantee_floor_cents: 500000, mark_usage_class: "LEAGUE_AND_CLUB" }
              as: ClubRepresentative
              as_user_id: "${club_atl}"
            - call: "POST /licensing/product-categories"
              payload: { category_code: "HEADWEAR", display_name: "Caps and hats", base_royalty_rate_bps: 1000, tier_schedule: [{ from_cents: 0, to_cents: null, rate_bps: 1000 }], closeout_rate_bps: 400, exclusivity_allowed: false, minimum_guarantee_floor_cents: 500000, mark_usage_class: "LEAGUE_AND_CLUB" }
              as: LeagueLicensingManager
              as_user_id: "u_ops_1"
          assert:
            - "the ClubRepresentative call returns 403 with data.error_id == 'ERR_UNAUTHORIZED'"
            - "the LeagueLicensingManager call returns 201 with data.category_code == 'HEADWEAR'"
            - "exactly one HEADWEAR category exists after both calls"

      - name: group_licensing_opt_in_is_shared_by_player_agent_and_league
        claim_type: peer_roles
        grounds:
          - roles.PlayerAgent
          - roles.LeagueLicensingManager
          - endpoints.POST_/licensing/players/{playerId}/group-licensing
          - validations.priority_4
        distinguishing_aspect: |
          group-licensing is a SHARED operation: the player's own agent may flip
          the flag (X-User-ID equal to the Player.id, satisfying the entity-backed
          scope rule at priority 4) and so may LeagueLicensingManager, whose
          opaque identity is not scope-checked at all. Both calls return 200 and
          the second overwrites the first, so an implementation that treats the
          endpoint as agent-only or league-only fails one of them.
        test_recipe:
          setup:
            - "clock at the mandatory default 2026-08-01T00:00:00Z"
            - "an ACTIVE club ATL with player PL_ATL_1 whose group_licensing_opt_in == true"
          setup_api_calls:
            - call: "POST /licensing/_clock/set_current_utc"
              payload: { current_utc: "2026-08-01T00:00:00Z" }
              as: LeagueLicensingManager
              as_user_id: "u_ops_1"
            - call: "POST /licensing/clubs"
              payload: { club_code: "ATL", market_name: "Atlanta", revenue_share_units: 100, status: "ACTIVE" }
              as: LeagueLicensingManager
              as_user_id: "u_ops_1"
              captures: { club_atl: $.data.id }
            - call: "POST /licensing/clubs/${club_atl}/players"
              payload: { full_name: "A. Marchetti", group_licensing_opt_in: true, status: "ACTIVE" }
              as: LeagueLicensingManager
              as_user_id: "u_ops_1"
              captures: { player_atl_1: $.data.id }
          trigger:
            - call: "POST /licensing/players/${player_atl_1}/group-licensing"
              payload: { opt_in: false }
              as: PlayerAgent
              as_user_id: "${player_atl_1}"
            - call: "POST /licensing/players/${player_atl_1}/group-licensing"
              payload: { opt_in: true }
              as: LeagueLicensingManager
              as_user_id: "u_ops_1"
          assert:
            - "the PlayerAgent call returns 200 with data.group_licensing_opt_in == false"
            - "the LeagueLicensingManager call returns 200 with data.group_licensing_opt_in == true"
            - "Player.${player_atl_1}.version increased by exactly 2 across the two calls"

      - name: player_agent_cannot_flip_another_players_group_licensing_forbidden_scope
        claim_type: peer_roles
        grounds:
          - roles.PlayerAgent
          - validations.priority_4
          - errors.ERR_FORBIDDEN_SCOPE
        distinguishing_aspect: |
          PlayerAgent is entity-backed, so authority is per-row: agent for
          PL_ATL_1 calling the endpoint for PL_ATL_2 is a 403 ERR_FORBIDDEN_SCOPE
