      - name: peak_award_inventory_withheld_from_a_delinquent_property_while_standard_still_books
        grounds:
          - validations.priority_50_ERR_PEAK_INVENTORY_WITHHELD
          - validations.priority_40_ERR_HOTEL_NOT_ACTIVE
          - validations.priority_84_ERR_FUND_IMPAIRED_PEAK_BLOCKED
          - calculations.redemption_pricing_selection
          - state_machines.Hotel.ACTIVE_to_FEE_DELINQUENT
          - entities.Hotel.fields.fee_ledger_balance_cents
        distinguishing_aspect: |
          A different entity pair - Redemption creation depending on Hotel.status - and a
          SEASON-CONDITIONAL dependency rather than an absolute one: the same property, the same
          member and the same 2-night length are rejected for a December PEAK date and accepted for a
          December STANDARD date. The fund is deliberately held at WATCH so the rejection cannot be
          attributed to priority 84, and the property is FEE_DELINQUENT rather than ONBOARDING so it
          cannot be attributed to priority 40 either.
        test_recipe:
          setup:
            - "One property with program_fee_pct 0.05 and a GROUP rate plan; a 10-night GROUP stay for 6000000 cents posts a 300000-cent fee and drives it to FEE_DELINQUENT while awarding the member 360000 points."
            - "Two award windows: STANDARD covering 2026-01-01 to 2026-12-31 at 40000 points per night with allotment 3, and PEAK covering 2026-12-20 to 2026-12-31 at 60000 points per night with allotment 3 and a 2500-cent nightly copay. Both are min_tier BASE."
            - "A second, unrelated member's settled 200000-point DIRECT_PURCHASE puts 220000 cents in the fund, holding solvency at WATCH rather than IMPAIRED."
          setup_api_calls:
            - call: "POST /loyalty/hotels"
              payload: { name: "Ironworks Convention Centre Hotel", brand_code: "ICC", market_tier: "URBAN", program_fee_pct: 0.05, rooms_count: 500, trailing_12m_occupancy_pct: 0.9, trailing_12m_adr_cents: 20000 }
              as: ProgramAdministrator
              captures: { h_id: $.data.id }
            - call: "POST /loyalty/hotels/${h_id}/rate-plans"
              payload: { rate_code: "GRP-ICC", rate_category: "GROUP" }
              as: ProgramAdministrator
              captures: { rp_id: $.data.id }
            - call: "POST /loyalty/hotels/${h_id}/activate"
              payload: {}
              as: ProgramAdministrator
            - call: "POST /loyalty/hotels/${h_id}/redemption-pricing"
              payload: { season: "STANDARD", window_start_date: "2026-01-01", window_end_date: "2026-12-31", points_per_night: 40000, cash_copay_cents: 0, min_tier_required: "BASE", award_allotment_per_night: 3 }
              as: ProgramAdministrator
            - call: "POST /loyalty/hotels/${h_id}/redemption-pricing"
              payload: { season: "PEAK", window_start_date: "2026-12-20", window_end_date: "2026-12-31", points_per_night: 60000, cash_copay_cents: 2500, min_tier_required: "BASE", award_allotment_per_night: 3 }
              as: ProgramAdministrator
            - call: "POST /loyalty/members"
              payload: { email: "ces2@example.com", full_name: "Owen Fitzgerald", enrollment_date: "2026-02-20" }
              as: ProgramAdministrator
              captures: { m_id: $.data.id }
            - call: "POST /loyalty/members"
              payload: { email: "ces2b@example.com", full_name: "Lucia Ferrari", enrollment_date: "2026-02-21" }
              as: ProgramAdministrator
              captures: { m2_id: $.data.id }
            - call: "POST /loyalty/point-purchases"
              payload: { member_id: "${m2_id}", channel: "DIRECT_PURCHASE", points_quantity: 200000 }
              as: ProgramAdministrator
              captures: { pp_id: $.data.id }
            - call: "POST /loyalty/point-purchases/${pp_id}/settle"
              payload: {}
              as: ProgramAdministrator
            - call: "POST /loyalty/stays"
              payload: { member_id: "${m_id}", hotel_id: "${h_id}", rate_plan_id: "${rp_id}", checkin_date: "2026-06-01", checkout_date: "2026-06-11", room_revenue_cents: 6000000 }
              as: ProgramAdministrator
              captures: { s_id: $.data.id }
            - call: "POST /loyalty/stays/${s_id}/post"
              payload: {}
              as: ProgramAdministrator
            - call: "GET /loyalty/hotels/${h_id}"
              payload: {}
              as: ProgramAdministrator
              captures: { h_v: $.data.version, h_status: $.data.status, h_fee: $.data.fee_ledger_balance_cents }
            - call: "GET /loyalty/program-fund"
              payload: {}
              as: ProgramAuditor
              captures: { fund_status: $.data.status, fund_ratio: $.data.solvency_ratio }
          trigger:
            - call: "POST /loyalty/redemptions"
              payload: { member_id: "${m_id}", hotel_id: "${h_id}", checkin_date: "2026-12-22", checkout_date: "2026-12-24", expected_hotel_version: "${h_v}" }
              as: Member
              as_user_id: "${m_id}"
              captures: { err_peak: $.data.error_id }
            - call: "POST /loyalty/redemptions"
              payload: { member_id: "${m_id}", hotel_id: "${h_id}", checkin_date: "2026-12-10", checkout_date: "2026-12-12", expected_hotel_version: "${h_v}" }
              as: Member
              as_user_id: "${m_id}"
              captures: { r_id: $.data.id, r_season: $.data.season }
          assert:
            - "the captured ${h_status} was FEE_DELINQUENT with ${h_fee} == 300000, and ${fund_status} was WATCH with ${fund_ratio} == 0.8185 (220000 / 268800)"
            - "first trigger: response code 409 and ${err_peak} == ERR_PEAK_INVENTORY_WITHHELD - the 2026-12-22 checkin selects the PEAK row because SEASON_RANK ranks PEAK above the overlapping STANDARD row"
            - "first trigger: ${err_peak} is NOT ERR_FUND_IMPAIRED_PEAK_BLOCKED (the fund is WATCH, not IMPAIRED) and NOT ERR_HOTEL_NOT_ACTIVE (a delinquent property may still take award bookings)"
            - "second trigger: response code 201, ${r_season} == STANDARD, points_per_night_applied == 40000 and cash_copay_cents == 0"
            - "Redemption.${r_id}.points_charged == 80000 (2 nights, no free night below the 5-night minimum, no tier discount at BASE) and Member.${m_id}.point_balance == 280000"
            - "Hotel.${h_id}.status is still FEE_DELINQUENT and version is still ${h_v} - a redemption never touches the property row"
            - "no Redemption row exists with checkin_date 2026-12-22"

  # ===========================================================================
  - rule_id: resource_temporal_overlap
    instances:
      - name: blackout_windows_need_seven_clear_days_so_a_six_day_gap_is_refused
        grounds:
          - calculations.blackout_conflict_check
          - validations.priority_61_ERR_BLACKOUT_WINDOW_BUFFER_CONFLICT
          - state_machines.BlackoutWindow.DRAFT_to_ACTIVE
          - entities.Hotel.fields.blackout_days_used_current_year
          - entities.BlackoutWindow.fields.day_count
        distinguishing_aspect: |
          Resource: the property's award calendar. Interval semantics: CLOSED on both endpoints with a
          mandatory 7-clear-day buffer, so direct adjacency and even a 6-day gap are refused. Two
          candidate windows differ by a single day of start date and land on opposite sides of the
          rule; the refused window also proves it consumed none of the 60-day annual cap.
        test_recipe:
          setup:
            - "One ACTIVE property with a TRANSIENT rate plan."
            - "Window W1: 2026-11-01 to 2026-11-05, scope ALL_REDEMPTIONS, ACTIVE - day_count 5, so blackout_days_used_current_year reads 5."
            - "Window W2: DRAFT, 2026-11-12 to 2026-11-14 - exactly 6 clear days after W1 ends."
            - "Window W3: DRAFT, 2026-11-13 to 2026-11-15 - exactly 7 clear days after W1 ends."
          setup_api_calls:
            - call: "POST /loyalty/hotels"
              payload: { name: "Beacon Hollow Retreat", brand_code: "BHR", market_tier: "RESORT", program_fee_pct: 0.045, rooms_count: 70, trailing_12m_occupancy_pct: 0.66, trailing_12m_adr_cents: 41000 }
              as: ProgramAdministrator
              captures: { h_id: $.data.id }
            - call: "POST /loyalty/hotels/${h_id}/rate-plans"
              payload: { rate_code: "BAR-BHR", rate_category: "TRANSIENT" }
              as: ProgramAdministrator
            - call: "POST /loyalty/hotels/${h_id}/activate"
              payload: {}
              as: ProgramAdministrator
            - call: "POST /loyalty/hotels/${h_id}/blackout-windows"
              payload: { start_date: "2026-11-01", end_date: "2026-11-05", scope: "ALL_REDEMPTIONS" }
              as: ProgramAdministrator
              captures: { w1_id: $.data.id, w1_days: $.data.day_count }
            - call: "POST /loyalty/blackout-windows/${w1_id}/activate"
              payload: {}
              as: ProgramAdministrator
            - call: "GET /loyalty/hotels/${h_id}"
              payload: {}
              as: ProgramAdministrator
              captures: { days_after_w1: $.data.blackout_days_used_current_year }
            - call: "POST /loyalty/hotels/${h_id}/blackout-windows"
              payload: { start_date: "2026-11-12", end_date: "2026-11-14", scope: "ALL_REDEMPTIONS" }
              as: ProgramAdministrator
              captures: { w2_id: $.data.id }
            - call: "POST /loyalty/hotels/${h_id}/blackout-windows"
              payload: { start_date: "2026-11-13", end_date: "2026-11-15", scope: "STANDARD_ONLY" }
              as: ProgramAdministrator
              captures: { w3_id: $.data.id, w3_days: $.data.day_count }
          trigger:
            - call: "POST /loyalty/blackout-windows/${w2_id}/activate"
              payload: {}
              as: ProgramAdministrator
              captures: { err_gap: $.data.error_id }
            - call: "POST /loyalty/blackout-windows/${w3_id}/activate"
              payload: {}
              as: ProgramAdministrator
              captures: { w3_status: $.data.status }
          assert:
            - "the captured ${w1_days} was 5 (both endpoints inclusive) and ${days_after_w1} was 5"
            - "first trigger: response code 409 and ${err_gap} == ERR_BLACKOUT_WINDOW_BUFFER_CONFLICT - gap_days == (2026-11-12 - 2026-11-05).days - 1 == 6, one short of the required 7"
            - "BlackoutWindow.${w2_id}.status is still DRAFT and Hotel.${h_id}.blackout_days_used_current_year is still 5 - a refused activation consumes none of the 60-day annual cap"
            - "second trigger: response code 200 and ${w3_status} == ACTIVE - gap_days == 7 is accepted at the boundary"
            - "the captured ${w3_days} was 3 and Hotel.${h_id}.blackout_days_used_current_year == 8 (5 + 3)"
            - "the DRAFT window ${w2_id} does not block any redemption: only ACTIVE windows are consulted by priority 60"

      - name: member_award_stays_may_touch_at_the_checkout_date_but_not_share_a_night
        grounds:
          - calculations.member_redemption_overlap_check
          - validations.priority_62_ERR_MEMBER_REDEMPTION_OVERLAP
          - calculations.redemption_points_price
          - entities.Redemption.fields.checkin_date
          - entities.Member.fields.point_balance
        distinguishing_aspect: |
          A different resource - the member's own award calendar rather than the property's - and the
          opposite interval convention: HALF-OPEN [checkin, checkout), so a new stay starting on the
          exact checkout date of an existing one is accepted, which is precisely the case the closed
          blackout geometry above rejects. One shared night is enough to refuse.
        test_recipe:
          setup:
            - "One ACTIVE property with a STANDARD award window over all of 2026 at 40000 points per night, allotment 5, min_tier BASE, so award inventory is never the binding constraint."
            - "A member holding 300000 points: a 100000-point goodwill grant written while the ledger was empty, plus a settled 200000-point DIRECT_PURCHASE."
            - "Redemption R1 already HELD for 2026-09-08 to 2026-09-12 (4 nights, 160000 points), leaving 140000 points."
          setup_api_calls:
            - call: "POST /loyalty/hotels"
              payload: { name: "Larkspur Meadows Inn", brand_code: "LMI", market_tier: "SELECT", program_fee_pct: 0.04, rooms_count: 85, trailing_12m_occupancy_pct: 0.72, trailing_12m_adr_cents: 19000 }
              as: ProgramAdministrator
              captures: { h_id: $.data.id }
            - call: "POST /loyalty/hotels/${h_id}/rate-plans"
              payload: { rate_code: "BAR-LMI", rate_category: "TRANSIENT" }
              as: ProgramAdministrator
            - call: "POST /loyalty/hotels/${h_id}/activate"
              payload: {}
              as: ProgramAdministrator
            - call: "POST /loyalty/hotels/${h_id}/redemption-pricing"
              payload: { season: "STANDARD", window_start_date: "2026-01-01", window_end_date: "2026-12-31", points_per_night: 40000, cash_copay_cents: 0, min_tier_required: "BASE", award_allotment_per_night: 5 }
              as: ProgramAdministrator
            - call: "POST /loyalty/members"
              payload: { email: "rto1@example.com", full_name: "Bertrand Cloutier", enrollment_date: "2026-03-15" }
              as: ProgramAdministrator
              captures: { m_id: $.data.id }
            - call: "GET /loyalty/members/${m_id}"
              payload: {}
              as: ProgramAdministrator
              captures: { m_v: $.data.version }
            - call: "POST /loyalty/point-adjustments"
              payload: { member_id: "${m_id}", points: 100000, adjustment_reason: "Legacy program conversion balance", expected_member_version: "${m_v}" }
              as: ProgramAdministrator
            - call: "POST /loyalty/point-purchases"
              payload: { member_id: "${m_id}", channel: "DIRECT_PURCHASE", points_quantity: 200000 }
              as: ProgramAdministrator
              captures: { pp_id: $.data.id }
            - call: "POST /loyalty/point-purchases/${pp_id}/settle"
              payload: {}
              as: ProgramAdministrator
            - call: "GET /loyalty/hotels/${h_id}"
              payload: {}
              as: ProgramAdministrator
              captures: { h_v: $.data.version }
            - call: "POST /loyalty/redemptions"
              payload: { member_id: "${m_id}", hotel_id: "${h_id}", checkin_date: "2026-09-08", checkout_date: "2026-09-12", expected_hotel_version: "${h_v}" }
              as: Member
              as_user_id: "${m_id}"
              captures: { r1_id: $.data.id, r1_charged: $.data.points_charged }
          trigger:
            - call: "POST /loyalty/redemptions"
              payload: { member_id: "${m_id}", hotel_id: "${h_id}", checkin_date: "2026-09-11", checkout_date: "2026-09-13", expected_hotel_version: "${h_v}" }
              as: Member
              as_user_id: "${m_id}"
              captures: { err_overlap: $.data.error_id }
            - call: "POST /loyalty/redemptions"
              payload: { member_id: "${m_id}", hotel_id: "${h_id}", checkin_date: "2026-09-12", checkout_date: "2026-09-14", expected_hotel_version: "${h_v}" }
              as: Member
              as_user_id: "${m_id}"
              captures: { r3_id: $.data.id, r3_charged: $.data.points_charged }
          assert:
            - "the captured ${r1_charged} was 160000 (4 nights * 40000, below the 5-night free-night minimum) so Member.${m_id}.point_balance read 140000 before the triggers"
            - "first trigger: response code 409 and ${err_overlap} == ERR_MEMBER_REDEMPTION_OVERLAP - the night of 2026-09-11 belongs to both [2026-09-08, 2026-09-12) and [2026-09-11, 2026-09-13)"
            - "first trigger: the rejection is not fiscal - 80000 points were available - and Member.${m_id}.point_balance is unchanged at 140000 with no REDEEM entry written"
            - "second trigger: response code 201 and ${r3_charged} == 80000 - [2026-09-12, 2026-09-14) only touches R1's checkout date and shares no night"
            - "Redemption.${r3_id}.fulfillment_status == HELD and Redemption.${r1_id} is untouched and still HELD"
            - "Member.${m_id}.point_balance == 60000 (300000 - 160000 - 80000) and exactly two REDEEM PointLedgerEntry rows exist for that member"
            - "the property's award allotment of 5 per night was never the binding constraint: no ERR_AWARD_INVENTORY_UNAVAILABLE appears on either trigger"

