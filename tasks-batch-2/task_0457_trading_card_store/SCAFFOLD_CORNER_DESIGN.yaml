          trigger:
            - call: "POST /pre-orders/${po}/allocate"
              payload: { expected_release_product_version: "${rpv0}" }
              as: StoreManager
          assert:
            - "PreOrder.${po}.status == ALLOCATED"
            - "ReleaseProduct.${rp}.quantity_allocated == 2"

