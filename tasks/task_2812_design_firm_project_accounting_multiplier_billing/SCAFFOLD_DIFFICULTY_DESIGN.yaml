              payload: {}
              as: Controller
              as_user_id: "ctl-001"
            - call: "POST /invoices/${inv_id}/record-payment"
              payload: { received_on: "2026-06-01" }
              as: Controller
              as_user_id: "ctl-001"
          assert:
            - "release of ${ci_pwp} with client_invoice_id null returns 409 ERR_PAY_WHEN_PAID_NOT_SATISFIED and payment_status stays WITHHELD"
            - "release of ${ci_free} returns 200 with payment_status == RELEASED, ConsultantSubcontract.${sc_free}.released_to_date == 30000.00 and status == CLOSED"
            - "the flag, not the amount, decides: ${ci_pwp} and ${ci_free} carry the same applied_markup_pct 0.1000 and were approved by the same user in the same posture"
            - "Invoice.${inv_id} sweeps both payables: consultant_billed == 55000.00, labor_billed == 0.00, expense_billed == 0.00, gross_billed == 55000.00, volume_discount_pct == 0.0000, retainage_amount == 2750.00, net_due == 52250.00, swept_consultant_count == 2"
            - "release of ${ci_pwp} while Invoice.${inv_id}.status == DRAFT still returns 409 ERR_PAY_WHEN_PAID_NOT_SATISFIED, and so does the attempt made while the invoice is APPROVED — being billed is not enough, only PAID is"
            - "after record-payment ConsultantInvoice.${ci_pwp}.payment_status == RELEASED without any further release call, ConsultantSubcontract.${sc_pwp}.released_to_date == 20000.00 and status == CLOSED"
            - "Project.${p_id}.paid_gross_to_date == 55000.00, billed_open == 0.00, unbilled_wip == 0.00, total_charge_value == 55000.00"
            - "Phase.${ph_id}.consultant_committed_open == 0.00 once both subcontracts are CLOSED"

      - name: public_invoicing_gated_by_certification_row_state_and_year
        grounds:
          - calculations.project_billing_posture
          - state_machines.OverheadRateCertification.SUBMITTED_to_CERTIFIED
          - state_machines.OverheadRateCertification.SUBMITTED_to_REJECTED
          - validations[priority=50]
          - validations[priority=67]
        distinguishing_aspect: |
          A public-agency project's ability to invoice depends on a firm-wide entity it has no
          foreign key to: an OverheadRateCertification must exist, be CERTIFIED, and match the
          fiscal year of the logical clock. Three near-misses are each insufficient — a CERTIFIED
          2025 row, a SUBMITTED 2026 row, and a REJECTED 2026 row — and the uniqueness rule
          interacts with the state, since a duplicate is refused only while the incumbent is
