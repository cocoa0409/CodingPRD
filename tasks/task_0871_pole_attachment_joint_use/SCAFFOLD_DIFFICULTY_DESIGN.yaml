# =============================================================================
# 1.8 Scaffold Difficulty Design (Test Targeting Index)
# Pole-Attachment & Joint-Use Management — 9 rules x 2 instances = 18
# Default logical clock at server start: 2026-05-01T00:00:00Z
# Canonical owner rates: annual_rental_rate_cents=1000, make_ready_labor_rate_cents_per_hour=12000
# =============================================================================
scaffold_difficulty_design:

  # ---------------------------------------------------------------------------
  - rule_id: dual_variant_calc
    instances:
      - name: make_ready_fee_estimate_vs_final_on_application
        grounds:
          - calculations.make_ready_fee
          - entities.AttachmentApplication.fields.make_ready_fee_estimate_cents
          - entities.AttachmentApplication.fields.make_ready_fee_final_cents
          - state_machines.AttachmentApplication.ESTIMATE_ACCEPTED_to_PERMIT_GRANTED
        distinguishing_aspect: "Same survey inputs yield ESTIMATE (with +15% contingency) 210450 and FINAL (actual 10h, no contingency) 225000 on the AttachmentApplication cost-accounting domain."
        test_recipe:
          setup:
            - "Owner (labor 12000/hr), pole (usable 60), attacher; application surveyed COMPLEX, 8 est-hours, 2 existing attachers, make_ready_required=true; estimate issued; accepted."
          setup_api_calls:
            - call: "POST /joint-use/pole-owners"
              payload: { legal_name: "O", owner_category: "ELECTRIC_UTILITY", annual_rental_rate_cents: 1000, make_ready_labor_rate_cents_per_hour: 12000 }
              as: JointUseCoordinator
              captures: { owner_id: $.data.id }
            - call: "POST /joint-use/crews"
              payload: { pole_owner_id: "${owner_id}", crew_name: "C1", region: "R1" }
              as: JointUseCoordinator
              captures: { crew_id: $.data.id }
            - call: "POST /joint-use/poles"
              payload: { pole_owner_id: "${owner_id}", tag: "P1", height_ft: 35, usable_communication_space_inches: 60 }
              as: JointUseCoordinator
              captures: { pole_id: $.data.id }
            - call: "POST /joint-use/attachers"
              payload: { company_name: "Acme", cin: "CIN1", contact_email: "a@x.com" }
              as: JointUseCoordinator
              captures: { att_id: $.data.id }
            - call: "POST /joint-use/applications"
              payload: { pole_id: "${pole_id}", attacher_id: "${att_id}", requested_space_inches: 6, requested_position_inches: 240, purpose: "FIBER" }
              as: Attacher
              as_user_id: "${att_id}"
              captures: { app_id: $.data.id }
            - call: "POST /joint-use/applications/${app_id}/survey"
              payload: { crew_id: "${crew_id}", window_start: "2026-05-10T08:00:00Z", window_end: "2026-05-10T12:00:00Z", estimated_labor_hours: 8, make_ready_required: true, existing_attacher_count: 2, complexity_class: "COMPLEX", findings: "ok" }
              as: Engineer
              as_user_id: "eng-1"
            - call: "GET /joint-use/applications/${app_id}"
              as: Engineer
              captures: { app_v: $.data.version }
            - call: "POST /joint-use/applications/${app_id}/estimate"
              payload: { expected_application_version: "${app_v}" }
              as: Engineer
              as_user_id: "eng-1"
            - call: "POST /joint-use/applications/${app_id}/estimate-decision"
              payload: { decision: "ACCEPT" }
              as: Attacher
              as_user_id: "${att_id}"
          trigger:
            - call: "POST /joint-use/applications/${app_id}/permit"
              payload: { decision: "GRANTED", actual_labor_hours: 10 }
              as: PermitOfficer
              as_user_id: "po-1"
              captures: { est_fee: $.data.make_ready_fee_estimate_cents, fin_fee: $.data.make_ready_fee_final_cents }
          assert:
            - "AttachmentApplication.${app_id}.make_ready_fee_estimate_cents == 210450"
            - "AttachmentApplication.${app_id}.make_ready_fee_final_cents == 225000"
            - "AttachmentApplication.${app_id}.make_ready_fee_final_cents != AttachmentApplication.${app_id}.make_ready_fee_estimate_cents"

      - name: back_rental_good_faith_vs_bad_faith_on_finding
        grounds:
          - calculations.back_rental_and_penalty
          - entities.UnauthorizedAttachmentFinding.fields.back_rental_cents
          - entities.UnauthorizedAttachmentFinding.fields.good_faith
        distinguishing_aspect: "Identical 12-inch finding yields GOOD_FAITH back_rental 1000 (1 yr) vs BAD_FAITH 5000 (min(7,5) yrs) on the UnauthorizedAttachmentFinding compliance domain — different entity than make_ready_fee."
        test_recipe:
          setup:
            - "Owner (annual rate 1000), pole, two attachers; two findings of 12 inches, one good_faith=true, one good_faith=false with estimated_install_years_ago=7."
          setup_api_calls:
            - call: "POST /joint-use/pole-owners"
              payload: { legal_name: "O", owner_category: "ILEC", annual_rental_rate_cents: 1000, make_ready_labor_rate_cents_per_hour: 12000 }
              as: JointUseCoordinator
              captures: { owner_id: $.data.id }
            - call: "POST /joint-use/poles"
              payload: { pole_owner_id: "${owner_id}", tag: "P1", height_ft: 35, usable_communication_space_inches: 60 }
              as: JointUseCoordinator
              captures: { pole_id: $.data.id }
            - call: "POST /joint-use/attachers"
              payload: { company_name: "GF", cin: "CINGF", contact_email: "gf@x.com" }
              as: JointUseCoordinator
              captures: { att_gf: $.data.id }
            - call: "POST /joint-use/attachers"
              payload: { company_name: "BF", cin: "CINBF", contact_email: "bf@x.com" }
              as: JointUseCoordinator
              captures: { att_bf: $.data.id }
            - call: "POST /joint-use/findings"
              payload: { pole_id: "${pole_id}", attacher_id: "${att_gf}", discovered_space_inches: 12, discovered_position_inches: 200, good_faith: true, estimated_install_years_ago: 7 }
              as: FieldAuditor
              captures: { finding_gf: $.data.id }
          trigger:
            - call: "POST /joint-use/findings"
              payload: { pole_id: "${pole_id}", attacher_id: "${att_bf}", discovered_space_inches: 12, discovered_position_inches: 260, good_faith: false, estimated_install_years_ago: 7 }
              as: FieldAuditor
              captures: { finding_bf: $.data.id, bf_back: $.data.back_rental_cents }
          assert:
            - "UnauthorizedAttachmentFinding.${finding_gf}.back_rental_cents == 1000"
            - "UnauthorizedAttachmentFinding.${finding_bf}.back_rental_cents == 5000"
            - "UnauthorizedAttachmentFinding.${finding_gf}.penalty_cents == 25000"

  # ---------------------------------------------------------------------------
  - rule_id: combinatorial_formula
    instances:
      - name: make_ready_fee_multi_input_nonlinear
        grounds:
          - calculations.make_ready_fee
          - entities.MakeReadySurvey.fields.complexity_class
          - entities.MakeReadySurvey.fields.existing_attacher_count
        distinguishing_aspect: "Mode (a): >=3 inputs (labor_rate, hours, COMPLEX multiplier 1.75, existing_attacher_count 2) with a make_ready_required branch and a tier-select multiplier combine non-linearly to 210450."
        test_recipe:
          setup:
            - "Owner labor 12000/hr; application surveyed COMPLEX, 8 hours, 2 existing attachers, make_ready_required=true; estimate issued."
          setup_api_calls:
            - call: "POST /joint-use/pole-owners"
              payload: { legal_name: "O", owner_category: "ELECTRIC_UTILITY", annual_rental_rate_cents: 1000, make_ready_labor_rate_cents_per_hour: 12000 }
              as: JointUseCoordinator
              captures: { owner_id: $.data.id }
            - call: "POST /joint-use/crews"
              payload: { pole_owner_id: "${owner_id}", crew_name: "C1", region: "R1" }
              as: JointUseCoordinator
              captures: { crew_id: $.data.id }
            - call: "POST /joint-use/poles"
              payload: { pole_owner_id: "${owner_id}", tag: "P1", height_ft: 35, usable_communication_space_inches: 60 }
              as: JointUseCoordinator
              captures: { pole_id: $.data.id }
            - call: "POST /joint-use/attachers"
              payload: { company_name: "Acme", cin: "CIN1", contact_email: "a@x.com" }
              as: JointUseCoordinator
              captures: { att_id: $.data.id }
            - call: "POST /joint-use/applications"
              payload: { pole_id: "${pole_id}", attacher_id: "${att_id}", requested_space_inches: 6, requested_position_inches: 240, purpose: "COAX" }
              as: Attacher
              as_user_id: "${att_id}"
              captures: { app_id: $.data.id }
            - call: "POST /joint-use/applications/${app_id}/survey"
              payload: { crew_id: "${crew_id}", window_start: "2026-05-10T08:00:00Z", window_end: "2026-05-10T12:00:00Z", estimated_labor_hours: 8, make_ready_required: true, existing_attacher_count: 2, complexity_class: "COMPLEX", findings: "ok" }
              as: Engineer
              as_user_id: "eng-1"
            - call: "GET /joint-use/applications/${app_id}"
              as: Engineer
              captures: { app_v: $.data.version }
          trigger:
            - call: "POST /joint-use/applications/${app_id}/estimate"
              payload: { expected_application_version: "${app_v}" }
              as: Engineer
              as_user_id: "eng-1"
              captures: { est_fee: $.data.make_ready_fee_estimate_cents }
          assert:
            - "AttachmentApplication.${app_id}.make_ready_fee_estimate_cents == 210450"

      - name: annual_rental_round_per_line_then_sum
        grounds:
          - calculations.annual_rental_true_up
          - entities.Invoice.fields.line_items
          - entities.Invoice.fields.amount_cents
        distinguishing_aspect: "Mode (b): three ACTIVE 1-inch attachments at rate 1000 give per-line round(83.33)=83; round-per-line-then-sum=249, NOT sum-then-round=250 — the pinned rounding order is observable."
        test_recipe:
          setup:
            - "Owner (annual rate 1000), pole; one attacher owning three ACTIVE 1-inch attachments (created by legalizing three findings); then an ANNUAL_RENTAL true-up invoice is generated."
          setup_api_calls:
            - call: "POST /joint-use/pole-owners"
              payload: { legal_name: "O", owner_category: "MUNICIPAL", annual_rental_rate_cents: 1000, make_ready_labor_rate_cents_per_hour: 12000 }
              as: JointUseCoordinator
              captures: { owner_id: $.data.id }
            - call: "POST /joint-use/poles"
              payload: { pole_owner_id: "${owner_id}", tag: "P1", height_ft: 35, usable_communication_space_inches: 60 }
              as: JointUseCoordinator
              captures: { pole_id: $.data.id }
            - call: "POST /joint-use/attachers"
              payload: { company_name: "Acme", cin: "CIN1", contact_email: "a@x.com" }
              as: JointUseCoordinator
              captures: { att_id: $.data.id }
            - call: "POST /joint-use/findings"
              payload: { pole_id: "${pole_id}", attacher_id: "${att_id}", discovered_space_inches: 1, discovered_position_inches: 100, good_faith: true, estimated_install_years_ago: 1 }
              as: FieldAuditor
              captures: { f1: $.data.id }
            - call: "POST /joint-use/findings/${f1}/resolve"
              payload: { resolution: "LEGALIZE" }
              as: JointUseCoordinator
            - call: "POST /joint-use/findings"
              payload: { pole_id: "${pole_id}", attacher_id: "${att_id}", discovered_space_inches: 1, discovered_position_inches: 130, good_faith: true, estimated_install_years_ago: 1 }
              as: FieldAuditor
              captures: { f2: $.data.id }
            - call: "POST /joint-use/findings/${f2}/resolve"
              payload: { resolution: "LEGALIZE" }
              as: JointUseCoordinator
            - call: "POST /joint-use/findings"
              payload: { pole_id: "${pole_id}", attacher_id: "${att_id}", discovered_space_inches: 1, discovered_position_inches: 160, good_faith: true, estimated_install_years_ago: 1 }
              as: FieldAuditor
              captures: { f3: $.data.id }
            - call: "POST /joint-use/findings/${f3}/resolve"
              payload: { resolution: "LEGALIZE" }
              as: JointUseCoordinator
          trigger:
            - call: "POST /joint-use/invoices"
              payload: { attacher_id: "${att_id}", pole_owner_id: "${owner_id}", invoice_type: "ANNUAL_RENTAL" }
              as: JointUseCoordinator
              captures: { inv_id: $.data.id, amt: $.data.amount_cents }
          assert:
            - "Invoice.${inv_id}.amount_cents == 249"
            - "Invoice.${inv_id}.invoice_type == ANNUAL_RENTAL"

  # ---------------------------------------------------------------------------
  - rule_id: non_linear_state_machine
    instances:
      - name: application_fork_estimate_accepted_to_permit_denied
        grounds:
          - state_machines.AttachmentApplication.ESTIMATE_ACCEPTED_to_PERMIT_DENIED
          - state_machines.AttachmentApplication.ESTIMATE_ACCEPTED_to_PERMIT_GRANTED
          - entities.AttachmentApplication.fields.status
        distinguishing_aspect: "Branching fork on AttachmentApplication: ESTIMATE_ACCEPTED forks to PERMIT_GRANTED (creates Attachment, occupies space) vs PERMIT_DENIED (releases reservation, voids invoice) — this instance exercises the DENIED branch's divergent side-effects."
        test_recipe:
          setup:
            - "Application accepted (reservation 6 on pole, MAKE_READY invoice ISSUED 210450); permit officer differs from surveyor."
          setup_api_calls:
            - call: "POST /joint-use/pole-owners"
              payload: { legal_name: "O", owner_category: "ELECTRIC_UTILITY", annual_rental_rate_cents: 1000, make_ready_labor_rate_cents_per_hour: 12000 }
              as: JointUseCoordinator
              captures: { owner_id: $.data.id }
            - call: "POST /joint-use/crews"
              payload: { pole_owner_id: "${owner_id}", crew_name: "C1", region: "R1" }
              as: JointUseCoordinator
              captures: { crew_id: $.data.id }
            - call: "POST /joint-use/poles"
              payload: { pole_owner_id: "${owner_id}", tag: "P1", height_ft: 35, usable_communication_space_inches: 60 }
              as: JointUseCoordinator
              captures: { pole_id: $.data.id }
            - call: "POST /joint-use/attachers"
              payload: { company_name: "Acme", cin: "CIN1", contact_email: "a@x.com" }
              as: JointUseCoordinator
              captures: { att_id: $.data.id }
            - call: "POST /joint-use/applications"
              payload: { pole_id: "${pole_id}", attacher_id: "${att_id}", requested_space_inches: 6, requested_position_inches: 240, purpose: "FIBER" }
              as: Attacher
              as_user_id: "${att_id}"
              captures: { app_id: $.data.id }
            - call: "POST /joint-use/applications/${app_id}/survey"
              payload: { crew_id: "${crew_id}", window_start: "2026-05-10T08:00:00Z", window_end: "2026-05-10T12:00:00Z", estimated_labor_hours: 8, make_ready_required: true, existing_attacher_count: 2, complexity_class: "COMPLEX", findings: "ok" }
              as: Engineer
              as_user_id: "eng-1"
            - call: "GET /joint-use/applications/${app_id}"
              as: Engineer
              captures: { app_v: $.data.version }
            - call: "POST /joint-use/applications/${app_id}/estimate"
              payload: { expected_application_version: "${app_v}" }
              as: Engineer
              as_user_id: "eng-1"
            - call: "POST /joint-use/applications/${app_id}/estimate-decision"
              payload: { decision: "ACCEPT" }
              as: Attacher
              as_user_id: "${att_id}"
          trigger:
            - call: "POST /joint-use/applications/${app_id}/permit"
              payload: { decision: "DENIED" }
              as: PermitOfficer
              as_user_id: "po-1"
          assert:
            - "AttachmentApplication.${app_id}.status == PERMIT_DENIED"
            - "AttachmentApplication.${app_id}.reserved_space_inches == 0"
            - "Pole.${pole_id}.reserved_space_inches == 0"

      - name: dispute_cyclic_review_info_requested_rounds
        grounds:
          - state_machines.Dispute.INFO_REQUESTED_to_UNDER_REVIEW
          - state_machines.Dispute.UNDER_REVIEW_to_INFO_REQUESTED
          - entities.Dispute.fields.round_count
        distinguishing_aspect: "Cyclic on Dispute: UNDER_REVIEW<->INFO_REQUESTED repeats; after two respond cycles round_count==2, a loop no linear pipeline can reach."
        test_recipe:
          setup:
            - "An UNAUTHORIZED finding disputed by its attacher; dispute opened then reviewed."
          setup_api_calls:
            - call: "POST /joint-use/pole-owners"
              payload: { legal_name: "O", owner_category: "ILEC", annual_rental_rate_cents: 1000, make_ready_labor_rate_cents_per_hour: 12000 }
              as: JointUseCoordinator
              captures: { owner_id: $.data.id }
            - call: "POST /joint-use/poles"
              payload: { pole_owner_id: "${owner_id}", tag: "P1", height_ft: 35, usable_communication_space_inches: 60 }
              as: JointUseCoordinator
              captures: { pole_id: $.data.id }
            - call: "POST /joint-use/attachers"
              payload: { company_name: "Acme", cin: "CIN1", contact_email: "a@x.com" }
              as: JointUseCoordinator
              captures: { att_id: $.data.id }
            - call: "POST /joint-use/findings"
              payload: { pole_id: "${pole_id}", attacher_id: "${att_id}", discovered_space_inches: 8, discovered_position_inches: 150, good_faith: true, estimated_install_years_ago: 1 }
              as: FieldAuditor
              captures: { finding_id: $.data.id }
            - call: "POST /joint-use/disputes"
              payload: { attacher_id: "${att_id}", finding_id: "${finding_id}", reason: "not ours" }
              as: Attacher
              as_user_id: "${att_id}"
              captures: { disp_id: $.data.id }
            - call: "POST /joint-use/disputes/${disp_id}/transition"
              payload: { to_state: "UNDER_REVIEW" }
              as: JointUseCoordinator
            - call: "POST /joint-use/disputes/${disp_id}/transition"
              payload: { to_state: "INFO_REQUESTED" }
              as: JointUseCoordinator
            - call: "POST /joint-use/disputes/${disp_id}/transition"
              payload: { to_state: "UNDER_REVIEW" }
              as: Attacher
              as_user_id: "${att_id}"
            - call: "POST /joint-use/disputes/${disp_id}/transition"
              payload: { to_state: "INFO_REQUESTED" }
              as: JointUseCoordinator
          trigger:
            - call: "POST /joint-use/disputes/${disp_id}/transition"
              payload: { to_state: "UNDER_REVIEW" }
              as: Attacher
              as_user_id: "${att_id}"
              captures: { rc: $.data.round_count }
          assert:
            - "Dispute.${disp_id}.round_count == 2"
            - "Dispute.${disp_id}.status == UNDER_REVIEW"

  # ---------------------------------------------------------------------------
  - rule_id: transitive_cascade
    instances:
      - name: permit_denied_cascade_application_invoice_attacher
        grounds:
          - state_machines.AttachmentApplication.ESTIMATE_ACCEPTED_to_PERMIT_DENIED
          - state_machines.Invoice.ISSUED_to_VOID
          - calculations.attacher_account_balance
        distinguishing_aspect: "Depth-3 chain from the permit-DENIED trigger: permit deny -> Application PERMIT_DENIED -> its MAKE_READY Invoice VOID -> Attacher.account_balance_cents recomputed to 0; each hop caused by the previous."
        test_recipe:
          setup:
            - "Application accepted with MAKE_READY invoice ISSUED (balance 210450)."
          setup_api_calls:
            - call: "POST /joint-use/pole-owners"
              payload: { legal_name: "O", owner_category: "ELECTRIC_UTILITY", annual_rental_rate_cents: 1000, make_ready_labor_rate_cents_per_hour: 12000 }
              as: JointUseCoordinator
              captures: { owner_id: $.data.id }
            - call: "POST /joint-use/crews"
              payload: { pole_owner_id: "${owner_id}", crew_name: "C1", region: "R1" }
              as: JointUseCoordinator
              captures: { crew_id: $.data.id }
            - call: "POST /joint-use/poles"
              payload: { pole_owner_id: "${owner_id}", tag: "P1", height_ft: 35, usable_communication_space_inches: 60 }
              as: JointUseCoordinator
              captures: { pole_id: $.data.id }
            - call: "POST /joint-use/attachers"
              payload: { company_name: "Acme", cin: "CIN1", contact_email: "a@x.com" }
              as: JointUseCoordinator
              captures: { att_id: $.data.id }
            - call: "POST /joint-use/applications"
              payload: { pole_id: "${pole_id}", attacher_id: "${att_id}", requested_space_inches: 6, requested_position_inches: 240, purpose: "FIBER" }
              as: Attacher
              as_user_id: "${att_id}"
              captures: { app_id: $.data.id }
            - call: "POST /joint-use/applications/${app_id}/survey"
              payload: { crew_id: "${crew_id}", window_start: "2026-05-10T08:00:00Z", window_end: "2026-05-10T12:00:00Z", estimated_labor_hours: 8, make_ready_required: true, existing_attacher_count: 2, complexity_class: "COMPLEX", findings: "ok" }
              as: Engineer
              as_user_id: "eng-1"
            - call: "GET /joint-use/applications/${app_id}"
              as: Engineer
              captures: { app_v: $.data.version }
            - call: "POST /joint-use/applications/${app_id}/estimate"
              payload: { expected_application_version: "${app_v}" }
              as: Engineer
              as_user_id: "eng-1"
            - call: "POST /joint-use/applications/${app_id}/estimate-decision"
              payload: { decision: "ACCEPT" }
              as: Attacher
              as_user_id: "${att_id}"
            - call: "GET /joint-use/invoices"
              payload: { application_id: "${app_id}" }
              as: JointUseCoordinator
              captures: { inv_id: "$.data[0].id" }
          trigger:
            - call: "POST /joint-use/applications/${app_id}/permit"
              payload: { decision: "DENIED" }
              as: PermitOfficer
              as_user_id: "po-1"
          assert:
            - "Invoice.${inv_id}.status == VOID"
            - "Attacher.${att_id}.account_balance_cents == 0"

      - name: dispute_adjusted_cascade_invoice_attacher
        grounds:
          - state_machines.Dispute.UNDER_REVIEW_to_RESOLVED_ADJUSTED
          - entities.Invoice.fields.amount_cents
          - calculations.attacher_account_balance
        distinguishing_aspect: "Depth-2 chain from the dispute-resolve trigger (different from permit-deny): RESOLVED_ADJUSTED -> Invoice.amount_cents:=30000 -> Attacher.account_balance_cents recomputed to 30000."
        test_recipe:
          setup:
            - "BAD_FAITH 12-inch finding (UNAUTHORIZED invoice 55000 = 50000? no: penalty 25000 + back 30000... recompute) disputed via its invoice; dispute reviewed."
          setup_api_calls:
            - call: "POST /joint-use/pole-owners"
              payload: { legal_name: "O", owner_category: "ILEC", annual_rental_rate_cents: 1000, make_ready_labor_rate_cents_per_hour: 12000 }
              as: JointUseCoordinator
              captures: { owner_id: $.data.id }
            - call: "POST /joint-use/poles"
              payload: { pole_owner_id: "${owner_id}", tag: "P1", height_ft: 35, usable_communication_space_inches: 60 }
              as: JointUseCoordinator
              captures: { pole_id: $.data.id }
            - call: "POST /joint-use/attachers"
              payload: { company_name: "Acme", cin: "CIN1", contact_email: "a@x.com" }
              as: JointUseCoordinator
              captures: { att_id: $.data.id }
            - call: "POST /joint-use/findings"
              payload: { pole_id: "${pole_id}", attacher_id: "${att_id}", discovered_space_inches: 12, discovered_position_inches: 150, good_faith: false, estimated_install_years_ago: 7 }
              as: FieldAuditor
              captures: { finding_id: $.data.id, pen_inv: $.data.penalty_invoice_id }
            - call: "POST /joint-use/disputes"
              payload: { attacher_id: "${att_id}", invoice_id: "${pen_inv}", reason: "overcharged" }
              as: Attacher
              as_user_id: "${att_id}"
              captures: { disp_id: $.data.id }
            - call: "POST /joint-use/disputes/${disp_id}/transition"
              payload: { to_state: "UNDER_REVIEW" }
              as: JointUseCoordinator
          trigger:
            - call: "POST /joint-use/disputes/${disp_id}/transition"
              payload: { to_state: "RESOLVED_ADJUSTED", adjusted_amount_cents: 30000 }
              as: JointUseCoordinator
          assert:
            - "Invoice.${pen_inv}.amount_cents == 30000"
            - "Attacher.${att_id}.account_balance_cents == 30000"

  # ---------------------------------------------------------------------------
