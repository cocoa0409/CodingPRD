  - rule_id: resource_temporal_overlap
    instances:
      - name: booth_rental_half_open_terms_allow_adjacency_but_reject_one_millisecond
        grounds:
          - validations.priority_66.ERR_BOOTH_RENTAL_OVERLAP
          - entities.BoothRental.fields.term_start_at
          - entities.BoothRental.fields.term_end_at
          - concurrency_rules.booth-rental-create-stale-workstation
          - endpoints.POST_/cosmetology/booth-rentals
        distinguishing_aspect: |
          Resource: a Workstation, contended for by BoothRental terms with HALF-OPEN
          [term_start_at, term_end_at) semantics and NO buffer. The accepted rental starts on exactly
          the millisecond the previous one ends, and the rejected rental is a one-millisecond term
          that steals only the final millisecond of the first term while still merely touching the
          second - so an implementation using closed intervals rejects the adjacent case and one
          using date-granularity comparison accepts the overlapping case.
        test_recipe:
          setup:
            - "One school 'Lakeside Institute' with required_clock_hours 16.0."
            - "One ACTIVE COSMETOLOGIST 'Tova Lund' credited with 16.00 school hours, licence effective 2026-08-01T00:00:00Z."
            - "One establishment 'Cedar Studio' (PENDING_INSPECTION, posture CLEAR) with STYLING_CHAIR workstation number 1 and no rentals."
            - "The logical clock is at its startup default 2026-08-01T00:00:00Z."
          setup_api_calls:
            - call: "POST /cosmetology/schools"
              payload: { name: "Lakeside Institute", county_code: "NCJ", required_clock_hours: 16.0, accreditation_status: "ACCREDITED" }
              as: BoardAdmin
              as_user_id: "admin-001"
