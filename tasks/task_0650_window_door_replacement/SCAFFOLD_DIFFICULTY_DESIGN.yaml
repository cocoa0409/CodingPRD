          - entities.Crew.fields.daily_capacity_openings
          - entities.InstallJob.fields.opening_count
          - validations[priority=16]
        distinguishing_aspect: |
          Conserved quantity = crew remaining daily capacity. Schedule a job
          consuming the crew's only capacity slot (daily_capacity_openings=1),
          then cancel it; the compensating release MUST restore capacity so a
          NEW same-day job (opening_count 1) for a different project schedules
          successfully — net consumed capacity returns to its pre-schedule
