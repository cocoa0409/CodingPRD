              as_user_id: "${tech_id}"
              captures: { disp_a: $.data.id }
          trigger:
            - call: "POST /warewashing/_clock/set_current_utc"
              payload: { current_utc: "2026-09-01T00:00:00Z" }
              as: PlatformAdmin
              captures: { n_renewal: $.data.agreements_moved_to_renewal_pending, n_expired: $.data.agreements_expired, n_esc: $.data.tickets_escalated }
            - call: "GET /warewashing/machine-placements/${pl_a}"
              payload: {}
