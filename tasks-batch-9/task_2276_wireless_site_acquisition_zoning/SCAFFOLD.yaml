    code: 201
    input: [candidate_id, analysis_type, existing_load_pct, appurtenance_count, wind_speed_mph, ice_thickness_in, performed_by_user_id, expected_candidate_version]
    output: StructuralAnalysis
    side_effects: ["status = IN_PROGRESS", "any prior analysis of the candidate -> SUPERSEDED", "Candidate.feasibility_status = STRUCTURAL_HOLD", "increments Candidate.version by 1"]
  - method: GET
    path: "/structural-analyses/{id}"
    description: "Reads one structural analysis."
    roles: [RfEngineer, SiteAcquisitionAgent, ZoningPlanner, StructuralEngineer, EnvironmentalReviewer, ConstructionManager, ProgramDirector]
    code: 200
    input: []
    output: StructuralAnalysis
    side_effects: []
  - method: GET
    path: "/structural-analyses"
    description: "Lists structural analyses with pagination; filterable by candidate and status."
    roles: [RfEngineer, SiteAcquisitionAgent, ZoningPlanner, StructuralEngineer, EnvironmentalReviewer, ConstructionManager, ProgramDirector]
    code: 200
    input: ["candidate_id?", "status?", "result?", "limit?", "offset?"]
    output: StructuralAnalysis[]
    side_effects: []
  - method: POST
    path: "/structural-analyses/{id}/complete"
    description: "Completes the analysis, computing utilization and the pass/fail result; FAIL starts cascade A."
