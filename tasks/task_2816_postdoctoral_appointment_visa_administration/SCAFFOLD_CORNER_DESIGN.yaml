  - section: errors
    instances:

      - name: every_declared_not_found_error_is_reachable_from_its_own_unknown_path_id
        claim_type: error_triggerable
        grounds:
          - errors.ERR_POSTDOC_NOT_FOUND
          - errors.ERR_LABORATORY_NOT_FOUND
          - errors.ERR_VISA_CASE_NOT_FOUND
        distinguishing_aspect: "Each of the nine per-entity NOT_FOUND ids has exactly one reachable path id, and only that resource's own id yields it: an unknown VisaCase id on submit-petition must not be reported as ERR_APPOINTMENT_NOT_FOUND, and an unknown ExitRecord id on ip-assignment must not be reported as ERR_NOT_RESOURCE_OWNER even though the ownership rule sits at priority 4 - existence at priority 3 always wins. All nine responses carry http 404 and the same envelope shape."
        test_recipe:
          setup:
            - "Empty database; no entity of any type exists, so every id used below is unknown."
          setup_api_calls: []
          trigger:
            - call: "GET /postdocs/00000000-0000-4000-8000-000000000001"
              payload: {}
              as: PostdocAffairsOfficer
              captures: { nf_postdoc: "$.data.error_id" }
            - call: "GET /faculty-mentors/00000000-0000-4000-8000-000000000002"
              payload: {}
              as: PostdocAffairsOfficer
              captures: { nf_mentor: "$.data.error_id" }
            - call: "GET /funding-sources/00000000-0000-4000-8000-000000000003"
              payload: {}
              as: HRCompensationApprover
              captures: { nf_funding: "$.data.error_id" }
