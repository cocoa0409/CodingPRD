      - name: repeated_sweep_at_the_same_clock_reports_all_zero_counters
        claim_type: idempotency
        grounds: ["state_machines.Violation.transitions.NOTICED_to_ESCALATED", "state_machines.Reseller.transitions.SUSPENDED_to_AUTHORIZED_by_sweep"]
        distinguishing_aspect: "The sweep is safely re-runnable: a second sweep at the unchanged clock finds nothing eligible and returns 0 for all four counters while leaving the first sweep's results in place."
        test_recipe:
