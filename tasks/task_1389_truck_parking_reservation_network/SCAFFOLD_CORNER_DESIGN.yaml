# =============================================================================
# §1.9 Scaffold Corner Design — Coverage Index for Non-Difficulty Tests
# Truck Parking Reservation Network (task_1389)
# =============================================================================
scaffold_corner_design:

  - section: entities
    instances:
      - name: site_creation_applies_defaults_and_initial_posture
        claim_type: creation_defaults
        grounds: [entities.Site.fields.no_show_grace_minutes, entities.Site.fields.posture]
        distinguishing_aspect: "Minimal create yields defaults 60/30/24, posture NORMAL, ops_run_index 0, version 1, and an auto-created default ACTIVE rate plan."
        test_recipe:
          setup: ["empty DB; clock unset (default 2026-08-01T00:00:00Z)"]
          setup_api_calls:
            - { call: "POST /sites", payload: { name: "S", base_nightly_rate_cents: 5000 }, as: NetworkAdmin, captures: { site_id: $.data.id, v: $.data.version, grace: $.data.no_show_grace_minutes } }
          trigger:
            - { call: "GET /sites/${site_id}/rate-plans", payload: { status: "ACTIVE" }, as: NetworkAdmin, captures: { rp0: "$.data[0].status" } }
          assert:
            - "Site.no_show_grace_minutes == 60, overstay_grace_minutes == 30, cancellation_free_window_hours == 24"
            - "Site.posture == NORMAL and ops_run_index == 0 and version == 1"
            - "exactly one RatePlan with status == ACTIVE exists (the default plan)"

      - name: site_create_with_posture_input_ignored
        claim_type: computed_fields
        grounds: [entities.Site.fields.posture]
        distinguishing_aspect: "Client-supplied computed field posture is ignored; server derives NORMAL."
        test_recipe:
          setup: ["empty DB"]
          setup_api_calls:
            - { call: "POST /sites", payload: { name: "S", base_nightly_rate_cents: 5000, posture: "ESCALATED" }, as: NetworkAdmin, captures: { posture: $.data.posture } }
          trigger: []
          assert:
            - "response posture == NORMAL (client input for computed field ignored)"

      - name: driver_register_duplicate_cdl_rejected
        claim_type: type_constraints
        grounds: [entities.Driver.fields.cdl_number, "errors[ERR_VALIDATION]"]
        distinguishing_aspect: "cdl_number global uniqueness enforced with ERR_VALIDATION on the second registration."
        test_recipe:
          setup: ["one driver registered with CDL-DUP-1"]
          setup_api_calls:
            - { call: "POST /drivers", payload: { cdl_number: "CDL-DUP-1", full_name: "First" }, as: Anonymous }
          trigger:
            - { call: "POST /drivers", payload: { cdl_number: "CDL-DUP-1", full_name: "Second" }, as: Anonymous, captures: { err: $.data.error_id } }
          assert:
            - "error_id == ERR_VALIDATION (http 400)"

      - name: booking_get_not_found_returns_404
        claim_type: not_found
        grounds: ["errors[ERR_NOT_FOUND]", "validations[priority=3]"]
        distinguishing_aspect: "GET with a well-formed but absent UUID yields ERR_NOT_FOUND 404."
        test_recipe:
          setup: ["empty DB"]
          setup_api_calls: []
          trigger:
            - { call: "GET /bookings/8a3e1c0b-2f4d-4a91-9c8b-12e7b6a0f1d2", payload: {}, as: NetworkAdmin, captures: { err: $.data.error_id } }
          assert:
            - "error_id == ERR_NOT_FOUND (http 404)"

      - name: sites_list_pagination_envelope
        claim_type: listing
        grounds: [response_envelope]
        distinguishing_aspect: "12 sites with default limit 10: page 1 has 10 items, total_count 12, has_more true; offset 10 returns 2 items, has_more false."
        test_recipe:
          setup: ["12 sites created"]
          setup_api_calls:
            - { call: "POST /sites", payload: { name: "S01", base_nightly_rate_cents: 5000 }, as: NetworkAdmin }
            - { call: "POST /sites", payload: { name: "S02", base_nightly_rate_cents: 5000 }, as: NetworkAdmin }
            - { call: "POST /sites", payload: { name: "S03", base_nightly_rate_cents: 5000 }, as: NetworkAdmin }
            - { call: "POST /sites", payload: { name: "S04", base_nightly_rate_cents: 5000 }, as: NetworkAdmin }
            - { call: "POST /sites", payload: { name: "S05", base_nightly_rate_cents: 5000 }, as: NetworkAdmin }
            - { call: "POST /sites", payload: { name: "S06", base_nightly_rate_cents: 5000 }, as: NetworkAdmin }
            - { call: "POST /sites", payload: { name: "S07", base_nightly_rate_cents: 5000 }, as: NetworkAdmin }
            - { call: "POST /sites", payload: { name: "S08", base_nightly_rate_cents: 5000 }, as: NetworkAdmin }
            - { call: "POST /sites", payload: { name: "S09", base_nightly_rate_cents: 5000 }, as: NetworkAdmin }
            - { call: "POST /sites", payload: { name: "S10", base_nightly_rate_cents: 5000 }, as: NetworkAdmin }
            - { call: "POST /sites", payload: { name: "S11", base_nightly_rate_cents: 5000 }, as: NetworkAdmin }
            - { call: "POST /sites", payload: { name: "S12", base_nightly_rate_cents: 5000 }, as: NetworkAdmin }
          trigger:
            - { call: "GET /sites", payload: {}, as: NetworkAdmin }
            - { call: "GET /sites", payload: { limit: 10, offset: 10 }, as: NetworkAdmin }
          assert:
            - "page 1: data length == 10, total_count == 12, has_more == true"
            - "page 2 (offset 10): data length == 2, total_count == 12, has_more == false"

      - name: duplicate_stall_number_rejected
        claim_type: type_constraints
        grounds: [entities.Stall.fields.stall_number, "errors[ERR_DUPLICATE_STALL_NUMBER]"]
        distinguishing_aspect: "stall_number uniqueness is per-site: duplicate within a site rejected; same number on another site accepted."
        test_recipe:
          setup: ["sites S1 and S2; S1 already has stall R01"]
          setup_api_calls:
            - { call: "POST /sites", payload: { name: "S1", base_nightly_rate_cents: 5000 }, as: NetworkAdmin, captures: { s1: $.data.id } }
            - { call: "POST /sites", payload: { name: "S2", base_nightly_rate_cents: 5000 }, as: NetworkAdmin, captures: { s2: $.data.id } }
            - { call: "POST /sites/${s1}/stalls", payload: { stall_number: "R01", stall_class: "STANDARD", is_reservable: true }, as: NetworkAdmin }
          trigger:
            - { call: "POST /sites/${s1}/stalls", payload: { stall_number: "R01", stall_class: "STANDARD", is_reservable: true }, as: NetworkAdmin, captures: { err: $.data.error_id } }
            - { call: "POST /sites/${s2}/stalls", payload: { stall_number: "R01", stall_class: "STANDARD", is_reservable: true }, as: NetworkAdmin, captures: { ok: $.data.id } }
          assert:
            - "duplicate on S1 -> error_id == ERR_DUPLICATE_STALL_NUMBER (409)"
            - "same number on S2 -> 201 created"

  - section: state_machines
    instances:
      - name: cancel_already_cancelled_booking_returns_invalid_state
        claim_type: invalid_transition
        grounds: [state_machines.Booking.BOOKED_to_CANCELLED, "errors[ERR_INVALID_STATE]"]
        distinguishing_aspect: "CANCELLED is terminal for the lifecycle axis; a second cancel yields ERR_INVALID_STATE and no fee drift."
        test_recipe:
          setup: ["site with 1 reservable stall; driver with a BOOKED booking arrival 2026-08-10; booking already cancelled at clock 2026-08-01 (free window)"]
          setup_api_calls:
            - { call: "POST /sites", payload: { name: "S", base_nightly_rate_cents: 5000 }, as: NetworkAdmin, captures: { site_id: $.data.id } }
            - { call: "POST /sites/${site_id}/stalls", payload: { stall_number: "R01", stall_class: "STANDARD", is_reservable: true }, as: NetworkAdmin }
            - { call: "POST /drivers", payload: { cdl_number: "CDL-T1", full_name: "T One" }, as: Anonymous, captures: { d1: $.data.id } }
            - { call: "POST /_clock/set_current_utc", payload: { to_iso8601: "2026-08-01T00:00:00Z" }, as: NetworkAdmin }
            - { call: "POST /bookings", payload: { driver_id: "${d1}", site_id: "${site_id}", booking_kind: "RESERVED", arrival_date: "2026-08-10", night_count: 1, payment_mode: "DRIVER_DIRECT" }, as: Driver, as_user_id: "${d1}", captures: { b1: $.data.id } }
            - { call: "POST /bookings/${b1}/cancel", payload: {}, as: Driver, as_user_id: "${d1}" }
          trigger:
            - { call: "POST /bookings/${b1}/cancel", payload: {}, as: Driver, as_user_id: "${d1}", captures: { err: $.data.error_id } }
          assert:
            - "second cancel -> error_id == ERR_INVALID_STATE"
            - "Booking.${b1}.fee_cents remains 0 and billing_status remains WAIVED"

      - name: checkout_from_booked_returns_invalid_state
        claim_type: invalid_transition
        grounds: [state_machines.Booking.CHECKED_IN_to_CHECKED_OUT, "errors[ERR_INVALID_STATE]"]
        distinguishing_aspect: "check-out requires CHECKED_IN or OVERSTAY; from BOOKED it is rejected."
        test_recipe:
          setup: ["site with 1 reservable stall; BOOKED booking arrival 2026-08-10; clock inside the check-in window"]
          setup_api_calls:
            - { call: "POST /sites", payload: { name: "S", base_nightly_rate_cents: 5000 }, as: NetworkAdmin, captures: { site_id: $.data.id } }
            - { call: "POST /sites/${site_id}/stalls", payload: { stall_number: "R01", stall_class: "STANDARD", is_reservable: true }, as: NetworkAdmin }
            - { call: "POST /drivers", payload: { cdl_number: "CDL-T2", full_name: "T Two" }, as: Anonymous, captures: { d1: $.data.id } }
            - { call: "POST /_clock/set_current_utc", payload: { to_iso8601: "2026-08-01T00:00:00Z" }, as: NetworkAdmin }
            - { call: "POST /bookings", payload: { driver_id: "${d1}", site_id: "${site_id}", booking_kind: "RESERVED", arrival_date: "2026-08-10", night_count: 1, payment_mode: "DRIVER_DIRECT" }, as: Driver, as_user_id: "${d1}", captures: { b1: $.data.id } }
            - { call: "POST /_clock/set_current_utc", payload: { to_iso8601: "2026-08-10T15:30:00Z" }, as: NetworkAdmin }
          trigger:
            - { call: "POST /bookings/${b1}/check-out", payload: {}, as: Driver, as_user_id: "${d1}", captures: { err: $.data.error_id } }
          assert:
            - "error_id == ERR_INVALID_STATE (never checked in)"

      - name: walkin_enters_checked_in_at_flat_base_rate
        claim_type: initial_state
        grounds: [state_machines.Booking, calculations.nightly_dynamic_rate]
        distinguishing_aspect: "WALK_IN skips BOOKED and starts at CHECKED_IN; pricing is flat base rate regardless of occupancy or peak day, and no discounts apply."
        test_recipe:
          setup:
            - "Site S (base 5000) with 1 reservable stall R01 and 1 first-come stall F01; clock 2026-08-14T18:00:00Z (Friday peak)"
            - "a RESERVED booking occupies R01 for the night (occupancy pressure irrelevant to walk-in pricing)"
          setup_api_calls:
            - { call: "POST /sites", payload: { name: "S", base_nightly_rate_cents: 5000 }, as: NetworkAdmin, captures: { site_id: $.data.id } }
            - { call: "POST /sites/${site_id}/stalls", payload: { stall_number: "R01", stall_class: "STANDARD", is_reservable: true }, as: NetworkAdmin }
            - { call: "POST /sites/${site_id}/stalls", payload: { stall_number: "F01", stall_class: "STANDARD", is_reservable: false }, as: NetworkAdmin, captures: { f1: $.data.id } }
            - { call: "POST /drivers", payload: { cdl_number: "CDL-W1", full_name: "W One" }, as: Anonymous, captures: { d1: $.data.id } }
            - { call: "POST /drivers", payload: { cdl_number: "CDL-W2", full_name: "W Two" }, as: Anonymous, captures: { d2: $.data.id } }
            - { call: "POST /_clock/set_current_utc", payload: { to_iso8601: "2026-08-01T00:00:00Z" }, as: NetworkAdmin }
            - { call: "POST /bookings", payload: { driver_id: "${d1}", site_id: "${site_id}", booking_kind: "RESERVED", arrival_date: "2026-08-14", night_count: 1, payment_mode: "DRIVER_DIRECT" }, as: Driver, as_user_id: "${d1}", captures: { rb: $.data.id, rq: $.data.quoted_total_cents } }
            - { call: "POST /_clock/set_current_utc", payload: { to_iso8601: "2026-08-14T18:00:00Z" }, as: NetworkAdmin }
          trigger:
            - { call: "POST /bookings", payload: { driver_id: "${d2}", site_id: "${site_id}", booking_kind: "WALK_IN", arrival_date: "2026-08-14", night_count: 1, payment_mode: "DRIVER_DIRECT" }, as: Driver, as_user_id: "${d2}", captures: { wb: $.data.id, ws: $.data.status, wstall: $.data.stall_id, wq: $.data.quoted_total_cents } }
          assert:
            - "walk-in Booking.status == CHECKED_IN immediately and stall_id == ${f1} (first-come pool)"
            - "walk-in quoted_total_cents == 5000 (flat base) while reserved quote for the same Friday night == 5400 (rhu(5000*0.9*1.2))"

      - name: noshow_sweep_strict_greater_than_boundary
        claim_type: side_effect_execution
        grounds: [state_machines.Booking.BOOKED_to_NO_SHOW, calculations.no_show_fee]
        distinguishing_aspect: "The sweep marks NO_SHOW only when clock is STRICTLY past open+grace: at exactly 16:00:00Z the booking survives; at 16:00:01Z it flips with fee = first-night rate."
        test_recipe:
          setup: ["site (base 5000, grace 60) with 1 reservable stall; BOOKED booking arrival 2026-08-10 (rate 4500 at 0% occupancy)"]
          setup_api_calls:
            - { call: "POST /sites", payload: { name: "S", base_nightly_rate_cents: 5000 }, as: NetworkAdmin, captures: { site_id: $.data.id } }
            - { call: "POST /sites/${site_id}/stalls", payload: { stall_number: "R01", stall_class: "STANDARD", is_reservable: true }, as: NetworkAdmin }
            - { call: "POST /drivers", payload: { cdl_number: "CDL-NB", full_name: "N Bee" }, as: Anonymous, captures: { d1: $.data.id } }
            - { call: "POST /_clock/set_current_utc", payload: { to_iso8601: "2026-08-01T00:00:00Z" }, as: NetworkAdmin }
            - { call: "POST /bookings", payload: { driver_id: "${d1}", site_id: "${site_id}", booking_kind: "RESERVED", arrival_date: "2026-08-10", night_count: 1, payment_mode: "DRIVER_DIRECT" }, as: Driver, as_user_id: "${d1}", captures: { b1: $.data.id } }
            - { call: "POST /_clock/set_current_utc", payload: { to_iso8601: "2026-08-10T16:00:00Z" }, as: NetworkAdmin }
            - { call: "POST /sites/${site_id}/ops-run", payload: {}, as: NetworkAdmin }
            - { call: "GET /bookings/${b1}", payload: {}, as: NetworkAdmin, captures: { s1: $.data.status } }
          trigger:
            - { call: "POST /_clock/set_current_utc", payload: { to_iso8601: "2026-08-10T16:00:01Z" }, as: NetworkAdmin }
            - { call: "POST /sites/${site_id}/ops-run", payload: {}, as: NetworkAdmin }
            - { call: "GET /bookings/${b1}", payload: {}, as: NetworkAdmin, captures: { s2: $.data.status, fee: $.data.fee_cents } }
          assert:
            - "after ops-run at exactly 16:00:00Z status == BOOKED (strict > boundary)"
            - "after ops-run at 16:00:01Z status == NO_SHOW and fee_cents == 4500 and final_total_cents == 4500"

      - name: waitlist_offer_expiry_reoffers_next_in_queue
        claim_type: side_effect_execution
        grounds: [state_machines.WaitlistEntry.OFFERED_to_EXPIRED, calculations.waitlist_offer_selector]
        distinguishing_aspect: "Offer TTL 30 minutes: expiry sweep flips OFFERED -> EXPIRED and re-offers the same stall to the next QUEUED entry (FIFO by created_at among STANDARD peers)."
        test_recipe:
          setup:
            - "Site S with 1 reservable stall; driver A holds the only booking for 2026-08-10; drivers W1 then W2 queued for the same night"
            - "A cancels inside the free window -> W1 receives the offer"
          setup_api_calls:
            - { call: "POST /sites", payload: { name: "S", base_nightly_rate_cents: 5000 }, as: NetworkAdmin, captures: { site_id: $.data.id } }
            - { call: "POST /sites/${site_id}/stalls", payload: { stall_number: "R01", stall_class: "STANDARD", is_reservable: true }, as: NetworkAdmin, captures: { s1: $.data.id } }
            - { call: "POST /drivers", payload: { cdl_number: "CDL-QA", full_name: "Q A" }, as: Anonymous, captures: { da: $.data.id } }
            - { call: "POST /drivers", payload: { cdl_number: "CDL-Q1", full_name: "Q One" }, as: Anonymous, captures: { dw1: $.data.id } }
            - { call: "POST /drivers", payload: { cdl_number: "CDL-Q2", full_name: "Q Two" }, as: Anonymous, captures: { dw2: $.data.id } }
            - { call: "POST /_clock/set_current_utc", payload: { to_iso8601: "2026-08-01T00:00:00Z" }, as: NetworkAdmin }
            - { call: "POST /bookings", payload: { driver_id: "${da}", site_id: "${site_id}", booking_kind: "RESERVED", arrival_date: "2026-08-10", night_count: 1, payment_mode: "DRIVER_DIRECT" }, as: Driver, as_user_id: "${da}", captures: { ba: $.data.id } }
            - { call: "POST /waitlist-entries", payload: { driver_id: "${dw1}", site_id: "${site_id}", arrival_date: "2026-08-10", night_count: 1, stall_class: "STANDARD", payment_mode: "DRIVER_DIRECT" }, as: Driver, as_user_id: "${dw1}", captures: { e1: $.data.id } }
            - { call: "POST /waitlist-entries", payload: { driver_id: "${dw2}", site_id: "${site_id}", arrival_date: "2026-08-10", night_count: 1, stall_class: "STANDARD", payment_mode: "DRIVER_DIRECT" }, as: Driver, as_user_id: "${dw2}", captures: { e2: $.data.id } }
            - { call: "POST /bookings/${ba}/cancel", payload: {}, as: Driver, as_user_id: "${da}" }
            - { call: "GET /waitlist-entries/${e1}", payload: {}, as: NetworkAdmin, captures: { e1s: $.data.status, e1stall: $.data.offered_stall_id } }
          trigger:
            - { call: "POST /_clock/set_current_utc", payload: { to_iso8601: "2026-08-01T00:31:00Z" }, as: NetworkAdmin }
            - { call: "POST /sites/${site_id}/ops-run", payload: {}, as: NetworkAdmin }
            - { call: "GET /waitlist-entries/${e1}", payload: {}, as: NetworkAdmin, captures: { e1s2: $.data.status } }
            - { call: "GET /waitlist-entries/${e2}", payload: {}, as: NetworkAdmin, captures: { e2s2: $.data.status, e2stall: $.data.offered_stall_id } }
          assert:
            - "after cancel: E1 OFFERED with offered_stall_id == ${s1}; E2 still QUEUED"
            - "after expiry sweep: E1 EXPIRED (clock 00:31 > offer_expires 00:30) and E2 OFFERED with offered_stall_id == ${s1}"

      - name: waitlist_accept_promotes_and_creates_booking
        claim_type: valid_transition
        grounds: [state_machines.WaitlistEntry.OFFERED_to_PROMOTED, 'endpoints["GET /bookings"]']
        distinguishing_aspect: "Accept flips OFFERED -> PROMOTED and materializes a BOOKED booking whose waitlist_entry_id points back to the entry."
        test_recipe:
          setup: ["same shape as the offer corner: site with 1 reservable stall, booking cancelled, entry E1 OFFERED"]
          setup_api_calls:
            - { call: "POST /sites", payload: { name: "S", base_nightly_rate_cents: 5000 }, as: NetworkAdmin, captures: { site_id: $.data.id } }
            - { call: "POST /sites/${site_id}/stalls", payload: { stall_number: "R01", stall_class: "STANDARD", is_reservable: true }, as: NetworkAdmin, captures: { s1: $.data.id } }
            - { call: "POST /drivers", payload: { cdl_number: "CDL-PA", full_name: "P A" }, as: Anonymous, captures: { da: $.data.id } }
            - { call: "POST /drivers", payload: { cdl_number: "CDL-P1", full_name: "P One" }, as: Anonymous, captures: { dw1: $.data.id } }
            - { call: "POST /_clock/set_current_utc", payload: { to_iso8601: "2026-08-01T00:00:00Z" }, as: NetworkAdmin }
            - { call: "POST /bookings", payload: { driver_id: "${da}", site_id: "${site_id}", booking_kind: "RESERVED", arrival_date: "2026-08-10", night_count: 1, payment_mode: "DRIVER_DIRECT" }, as: Driver, as_user_id: "${da}", captures: { ba: $.data.id } }
            - { call: "POST /waitlist-entries", payload: { driver_id: "${dw1}", site_id: "${site_id}", arrival_date: "2026-08-10", night_count: 1, stall_class: "STANDARD", payment_mode: "DRIVER_DIRECT" }, as: Driver, as_user_id: "${dw1}", captures: { e1: $.data.id } }
            - { call: "POST /bookings/${ba}/cancel", payload: {}, as: Driver, as_user_id: "${da}" }
          trigger:
            - { call: "POST /waitlist-entries/${e1}/accept", payload: {}, as: Driver, as_user_id: "${dw1}", captures: { e1s: $.data.status } }
            - { call: "GET /bookings", payload: { waitlist_entry_id: "${e1}" }, as: NetworkAdmin, captures: { nb: "$.data[0].status", nbstall: "$.data[0].stall_id", nbq: "$.data[0].quoted_total_cents" } }
          assert:
            - "E1 status == PROMOTED"
            - "exactly one booking with waitlist_entry_id == ${e1}: status BOOKED, stall_id == ${s1}, quoted_total_cents == 4500 (occupancy 0% at promotion time)"

      - name: escalated_posture_blocks_then_recovers
        claim_type: guarded_transitions
        grounds: [state_machines.Site.posture, calculations.site_posture, "errors[ERR_SITE_ESCALATED]"]
        distinguishing_aspect: "CRITICAL incident flips posture ESCALATED and blocks booking creation; resolving the incident recomputes posture to NORMAL and creation succeeds again."
        test_recipe:
          setup: ["site with 1 reservable stall; two drivers; CRITICAL SECURITY incident open"]
          setup_api_calls:
            - { call: "POST /sites", payload: { name: "S", base_nightly_rate_cents: 5000 }, as: NetworkAdmin, captures: { site_id: $.data.id } }
            - { call: "POST /sites/${site_id}/stalls", payload: { stall_number: "R01", stall_class: "STANDARD", is_reservable: true }, as: NetworkAdmin }
            - { call: "POST /drivers", payload: { cdl_number: "CDL-E1", full_name: "E One" }, as: Anonymous, captures: { d1: $.data.id } }
            - { call: "POST /drivers", payload: { cdl_number: "CDL-E2", full_name: "E Two" }, as: Anonymous, captures: { d2: $.data.id } }
            - { call: "POST /_clock/set_current_utc", payload: { to_iso8601: "2026-08-01T00:00:00Z" }, as: NetworkAdmin }
            - { call: "POST /sites/${site_id}/incidents", payload: { category: "SECURITY", severity: "CRITICAL", description: "break-in", reporter_driver_id: "${d1}" }, as: Driver, as_user_id: "${d1}", captures: { inc: $.data.id } }
          trigger:
            - { call: "POST /bookings", payload: { driver_id: "${d2}", site_id: "${site_id}", booking_kind: "RESERVED", arrival_date: "2026-08-10", night_count: 1, payment_mode: "DRIVER_DIRECT" }, as: Driver, as_user_id: "${d2}", captures: { err: $.data.error_id } }
            - { call: "POST /incidents/${inc}/transition", payload: { to: "ACKNOWLEDGED" }, as: SiteOperator, as_user_id: "op-alice" }
            - { call: "POST /incidents/${inc}/transition", payload: { to: "INVESTIGATING" }, as: SiteOperator, as_user_id: "op-alice" }
            - { call: "POST /incidents/${inc}/transition", payload: { to: "RESOLVED" }, as: SiteOperator, as_user_id: "op-bob" }
            - { call: "POST /bookings", payload: { driver_id: "${d2}", site_id: "${site_id}", booking_kind: "RESERVED", arrival_date: "2026-08-10", night_count: 1, payment_mode: "DRIVER_DIRECT" }, as: Driver, as_user_id: "${d2}", captures: { okb: $.data.id } }
          assert:
            - "while ESCALATED: error_id == ERR_SITE_ESCALATED"
            - "after RESOLVED: posture recomputed NORMAL and the same create succeeds (201)"

      - name: degraded_posture_caps_occupancy_surge
        claim_type: guarded_transitions
        grounds: [state_machines.Site.posture, calculations.nightly_dynamic_rate]
        distinguishing_aspect: "With >= 3 open LIGHTING incidents (DEGRADED), the occupancy multiplier is capped at 1.00: a quote at 80% occupancy costs 5000, not 6250."
        test_recipe:
          setup: ["site (base 5000) with 5 reservable stalls; 4 bookings covering 2026-08-10 (occupancy 80% for the 5th request); 3 OPEN LIGHTING incidents"]
          setup_api_calls:
