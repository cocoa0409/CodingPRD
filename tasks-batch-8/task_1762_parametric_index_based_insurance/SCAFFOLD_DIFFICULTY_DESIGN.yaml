            - "observation naming another program's station -> error_id (${xref_err}) == ERR_CROSS_REFERENCE_INVALID, HTTP 422 (business_referential priority 7)"
            - "PayoutClaim.${claim_a}.status still == APPROVED (SoD rejection is side-effect-free)"

  # ---------------------------------------------------------------------------
  # Rule 6 — boundary_precision_check (different metrics, different endpoints)
  # ---------------------------------------------------------------------------
  - rule_id: boundary_precision_check
    instances:
      - name: threshold_inclusive_boundary_at_exact_tier_value
        grounds:
          - calculations.max_tier_breached
          - calculations.blended_index_value
        distinguishing_aspect: |
          Numeric-threshold boundary on the trigger index: with BELOW semantics
          and thresholds t1<=50/t2<=30, an observation of exactly 30 breaches tier
          2 (inclusive <=), while 30.0001 breaches only tier 1 — the boundary sits
          on the tier metric and is reached via the observation-ingestion endpoint.
        test_recipe:
          setup:
            - "Program ACTIVE, index BELOW t1<=50/0.25 t2<=30/0.50, PHYSICAL station w=1.0"
            - "Holder ACTIVE, policy si 2,000,000 BOUND"
            - "Observation value exactly 30 on window 2026-06-30"
