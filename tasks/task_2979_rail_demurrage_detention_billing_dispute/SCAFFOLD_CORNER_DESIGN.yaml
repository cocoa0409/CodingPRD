      - name: evidence_on_unknown_dispute_returns_demurrage_dispute_not_found
        claim_type: not_found
        grounds:
          - validations.priority_30_path_existence
          - errors.ERR_DEMURRAGE_DISPUTE_NOT_FOUND
        distinguishing_aspect: |
          Existence at priority 30 outranks the Customer ownership check at
          priority 22: there is no owning customer to compare against, so the
          answer is 404 and not 403.
        test_recipe:
          setup:
            - "one customer, used only to supply a syntactically valid X-User-ID"
          setup_api_calls:
