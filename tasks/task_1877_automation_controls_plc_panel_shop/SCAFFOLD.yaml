    output: SubstitutionRequest
    side_effects: []
  - method: GET
    path: "/panel-shop/panels/{id}/substitution-requests"
    description: "List substitution requests of a panel (FK reverse reachability)."
    roles: [ProjectManager, QAManager, DesignEngineer, Customer]
    code: 200
    input: ["status?", "limit?", "offset?"]
