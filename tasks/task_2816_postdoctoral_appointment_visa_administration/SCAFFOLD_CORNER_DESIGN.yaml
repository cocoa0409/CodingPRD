      - name: a_salary_exception_lowers_the_effective_floor_and_unblocks_the_offer
        claim_type: action_endpoint
        grounds:
          - endpoints.POST /appointments/{id}/salary-exception
          - validations.priority_36_ERR_EXCEPTION_FLOOR_INVALID
          - calculations.salary_floor_computation
        distinguishing_aspect: "The exception writes salary_exception_floor_usd, which becomes the effective floor used by ERR_SALARY_BELOW_FLOOR, so a 58000.00 salary that is refused against the 61008.00 scale floor issues cleanly once a 57000.00 exception is approved - and the encumbrance is computed from the salary, 75980.00, not from either floor. A floor equal to the scale value is not strictly below it and must be refused with ERR_EXCEPTION_FLOOR_INVALID."
        test_recipe:
          setup:
            - "One mentor with valid training, one US-citizen scholar needing no sponsorship with no prior rank months, so the band-0 NIH floor is 61008.00."
            - "One VERIFIED NIH_SCALE FEDERAL_GRANT (300000.00, 2026-09-01 to 2027-12-31) with no document requirements."
            - "One DRAFT EMPLOYEE / POSTDOC_ASSOCIATE appointment 2026-10-01 to 2027-09-30 at 58000.00, prepared by officer_pa_58 so the HR approver is a different user."
