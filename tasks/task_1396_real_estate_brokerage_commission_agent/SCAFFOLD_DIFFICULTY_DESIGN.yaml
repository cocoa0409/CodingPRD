  - rule_id: boundary_precision_check
    instances:
      - name: company_dollar_cap_exact_threshold_selects_next_tier
        grounds:
          - calculations.tier_split_with_cap_clip
          - entities.Settlement.fields.cap_clipped
          - endpoints: "POST /brokerage/deals/{dealId}/settle"
        distinguishing_aspect: |
          Metric: company-dollar cap (endpoint: settle). A seed deal lands the
          accumulator at EXACTLY the 2500000 threshold (the seed itself clips:
          tentative 2539468 -> 2500000); the follow-up deal then observes
