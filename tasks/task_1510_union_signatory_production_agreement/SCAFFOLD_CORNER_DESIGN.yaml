          - "calculations.grievance_filing_deadline"
          - "errors[ERR_FILING_WINDOW_EXPIRED]"
        distinguishing_aspect: "Force majeure tolling: with FM [2026-07-01, 2026-07-10) on production A, an incident on 2026-07-05 gets 5 tolling days (deadline 2026-08-09) so filing at clock 2026-08-06 succeeds; on production B whose FM [2026-07-01, 2026-07-03) does not overlap the window, the same filing fails ERR_FILING_WINDOW_EXPIRED (deadline 2026-08-04)."
        test_recipe:
          setup:
            - "SIGNATORY company; production A STAFFING with FM event [2026-07-01, 2026-07-10) declared and lifted; production B STAFFING with FM event [2026-07-01, 2026-07-03) declared and lifted; clock at 2026-08-06"
          setup_api_calls:
            - { call: "POST /union-compliance/producer-companies", payload: { legal_name: "Quince LLC", fein: "20-0000044" }, as: ProducerRep, captures: { co_id: $.data.id } }
            - { call: "POST /union-compliance/signatory-applications", payload: { producer_company_id: "${co_id}", requested_agreement_scope: "THEATRICAL", estimated_slate_budget_cents: 40000000 }, as: ProducerRep, as_user_id: "${co_id}", captures: { app_id: $.data.id } }
            - { call: "POST /union-compliance/signatory-applications/${app_id}/submit", payload: {}, as: ProducerRep, as_user_id: "${co_id}" }
            - { call: "POST /union-compliance/signatory-applications/${app_id}/decide", payload: { decision: "APPROVE" }, as: UnionRep }
            - { call: "POST /union-compliance/productions", payload: { producer_company_id: "${co_id}", title: "Quince A", agreement_tier: "ULTRA_LOW_BUDGET", budget_cents: 20000000 }, as: ProducerRep, as_user_id: "${co_id}", captures: { prod_a: $.data.id } }
            - { call: "GET /union-compliance/productions/${prod_a}/bonds", payload: {}, as: ProducerRep, as_user_id: "${co_id}", captures: { bond_a: "$.data[0].id" } }
            - { call: "POST /union-compliance/bonds/${bond_a}/post", payload: { amount_cents: 2500000 }, as: ProducerRep, as_user_id: "${co_id}" }
            - { call: "POST /union-compliance/productions", payload: { producer_company_id: "${co_id}", title: "Quince B", agreement_tier: "ULTRA_LOW_BUDGET", budget_cents: 20000000 }, as: ProducerRep, as_user_id: "${co_id}", captures: { prod_b: $.data.id } }
            - { call: "GET /union-compliance/productions/${prod_b}/bonds", payload: {}, as: ProducerRep, as_user_id: "${co_id}", captures: { bond_b: "$.data[0].id" } }
            - { call: "POST /union-compliance/bonds/${bond_b}/post", payload: { amount_cents: 2500000 }, as: ProducerRep, as_user_id: "${co_id}" }
            - { call: "POST /_clock/set_current_utc", payload: { to_iso8601: "2026-08-06T00:00:00Z" }, as: PlatformAdmin }
            - { call: "POST /union-compliance/force-majeure-events", payload: { production_id: "${prod_a}", event_type: "STRIKE", start_date: "2026-07-01", end_date: "2026-07-10" }, as: UnionRep, captures: { fm_a: $.data.id } }
            - { call: "POST /union-compliance/force-majeure-events/${fm_a}/lift", payload: {}, as: UnionRep }
            - { call: "POST /union-compliance/force-majeure-events", payload: { production_id: "${prod_b}", event_type: "STRIKE", start_date: "2026-07-01", end_date: "2026-07-03" }, as: UnionRep, captures: { fm_b: $.data.id } }
            - { call: "POST /union-compliance/force-majeure-events/${fm_b}/lift", payload: {}, as: UnionRep }
          trigger:
            - { call: "POST /union-compliance/grievances", payload: { production_id: "${prod_a}", category: "OTHER", incident_date: "2026-07-05", description: "Tolled window filing" }, as: UnionRep, as_user_id: "ur_1", captures: { grv_a: $.data.id } }
            - { call: "POST /union-compliance/grievances", payload: { production_id: "${prod_b}", category: "OTHER", incident_date: "2026-07-05", description: "Untolled window filing" }, as: UnionRep, as_user_id: "ur_1", captures: { err_b: $.data.error_id } }
          assert:
            - "Grievance.${grv_a}.status == FILED (tolling extends deadline to 2026-08-09, filing on 2026-08-06 valid)"
            - "${err_b} == ERR_FILING_WINDOW_EXPIRED (no overlap -> deadline stays 2026-08-04)"

