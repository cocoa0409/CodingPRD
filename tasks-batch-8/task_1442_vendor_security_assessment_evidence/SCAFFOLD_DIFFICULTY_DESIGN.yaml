  # ===========================================================================
  # Rule 5 — priority_pair_validation_conflict (different error-category pairs)
  # ===========================================================================
  - rule_id: priority_pair_validation_conflict
    instances:
      - name: state_before_segregation_of_duties_on_verify
        grounds:
          - validations[priority=4]
          - validations[priority=5]
          - errors[ERR_INVALID_STATE]
          - errors[ERR_SEGREGATION_OF_DUTIES]
        distinguishing_aspect: |
          Category pair state (P4) vs business_safety/SoD (P5): a plan-verify
          call where the plan is still PROPOSED AND the caller equals the plan
          approver must return ERR_INVALID_STATE (409), not
          ERR_SEGREGATION_OF_DUTIES, because state is checked first.
        test_recipe:
          setup:
            - "Cycle in REMEDIATION with one OPEN exception; a PROPOSED plan exists (acceptor will be the same analyst who later attempts verify)"
          setup_api_calls:
