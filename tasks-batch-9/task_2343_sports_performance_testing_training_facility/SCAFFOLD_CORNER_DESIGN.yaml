              payload: { athlete_id: "${athlete_id}", rts_plan_id: null, document_type: "MEDICAL_HOLD_RELEASE", stage_number: null, expires_on: "2026-08-10" }
              as: MedicalProvider
              captures: { document_id: $.data.id }
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-08-20T09:00:00Z" }
              as: PerformanceDirector
              captures: { clearance_documents_expired_count: $.data.clearance_documents_expired_count }
          action:
            - call: "POST /clearance-documents/${document_id}/sign"
              payload: { provider_license_id: "MD-77-2291" }
              as: MedicalProvider
              captures: { err: $.data.error_id }
          assertions:
            - "status 422"
            - "$.data.error_id == 'ERR_CLEARANCE_EXPIRED'"
            - "the clock sweep only expires SIGNED documents, so clearance_documents_expired_count == 0 and this PENDING document is still PENDING -- the rejection comes from the signing validation, not from a swept status"
            - "GET the document shows status 'PENDING' with signed_at null and provider_license_id null"
            - "GET /athletes/${athlete_id} still shows training_clearance 'MEDICAL_HOLD'"

      - name: appending_results_to_a_finalized_test_session_returns_already_terminal
        claim_type: Error triggerability
        claim: "ERR_ALREADY_TERMINAL is reachable: FINALIZED is terminal for TestSession, so appending further results is rejected and result_count is unchanged"
        test_recipe:
          setup:
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-08-01T09:00:00Z" }
              as: PerformanceDirector
            - call: "POST /athletes"
              payload: { full_name: "Finalized Test Athlete", date_of_birth: "2009-02-02", sport: "BASKETBALL", position: "GUARD" }
              as: FrontDesk
              captures: { athlete_id: $.data.id }
            - call: "POST /test-sessions"
              payload: { athlete_id: "${athlete_id}", battery_type: "MOVEMENT_SCREEN" }
              as: Coach
              captures: { screen_id: $.data.id }
            - call: "POST /test-sessions/${screen_id}/results"
              payload: { results: [ { metric_code: "OH_SQUAT", value: 3, side: "BILATERAL" }, { metric_code: "HURDLE_STEP", value: 3, side: "BILATERAL" }, { metric_code: "INLINE_LUNGE", value: 3, side: "BILATERAL" }, { metric_code: "SL_HOP_L", value: 3, side: "LEFT" }, { metric_code: "SL_HOP_R", value: 3, side: "RIGHT" } ] }
              as: Coach
              captures: { result_count: $.data.result_count }
            - call: "POST /test-sessions/${screen_id}/finalize"
              as: Coach
              captures: { status: $.data.status }
          action:
            - call: "POST /test-sessions/${screen_id}/results"
              payload: { results: [ { metric_code: "OH_SQUAT", value: 3, side: "BILATERAL" }, { metric_code: "HURDLE_STEP", value: 3, side: "BILATERAL" }, { metric_code: "INLINE_LUNGE", value: 3, side: "BILATERAL" }, { metric_code: "SL_HOP_L", value: 3, side: "LEFT" }, { metric_code: "SL_HOP_R", value: 3, side: "RIGHT" } ] }
              as: Coach
              captures: { err: $.data.error_id }
          assertions:
            - "the setup finalize returned 200 with status 'FINALIZED'"
            - "status 409"
            - "$.data.error_id == 'ERR_ALREADY_TERMINAL'"
            - "GET /test-sessions/${screen_id} still shows result_count 5 and the same risk_score"

      - name: remaining_catalog_errors_are_asserted_by_difficulty_instances
        claim_type: Error triggerability
        excluded_because:
          difficulty_instance: staff_credential_error_outranks_staff_schedule_conflict_on_coach_assignment
          rationale: "The remaining catalog entries are each already triggered by a §1.8 instance: ERR_STAFF_CREDENTIAL_LAPSED and ERR_STAFF_SCHEDULE_CONFLICT by the cited instance; ERR_TRAVEL_BUFFER_VIOLATION by staff_closed_interval_touching_allowed_but_cross_site_gap_under_buffer_rejected; ERR_ATHLETE_SCHEDULE_CONFLICT by athlete_half_open_back_to_back_enrollments_allowed_but_overlap_rejected; ERR_SITE_CONCURRENCY_EXCEEDED by aggregate_onsite_concurrency_cap_counts_overlaps_across_all_sessions; ERR_ATHLETE_SUSPENDED and ERR_NO_SESSION_CREDIT by suspension_state_error_outranks_missing_session_credit_on_enrollment; ERR_ATHLETE_MEDICAL_HOLD and ERR_COACH_RATIO_EXCEEDED by medical_hold_safety_error_outranks_coach_ratio_error_on_offsite_enrollment; ERR_INVALID_STATE by roster_lock_blocked_until_staffing_recovers_from_staff_credential_state; ERR_STAGE_CLEARANCE_MISSING by rts_stage_pass_blocked_until_clearance_document_reaches_signed; ERR_NORM_BAND_UNAVAILABLE and ERR_NO_TEST_RESULTS by empty_result_set_and_empty_norm_band_set_are_distinguished_on_finalize. ERR_STALE_VERSION is asserted twice in the cross_cutting_layers section of this file, once per §1.2.1 concurrency rule, and ERR_UNAUTHENTICATED, ERR_UNAUTHORIZED, ERR_ATHLETE_SCOPE_VIOLATION and ERR_SEGREGATION_OF_DUTIES are asserted in the rbac section of this file."

  # =========================================================================
  # SECTION 7 -- From Table 7 (RBAC)
  # =========================================================================
  - section: rbac
    instances:

      - name: performance_director_and_front_desk_share_the_session_creation_operation
        claim_type: shared_operations
        claim: "Both roles listed on POST /group-sessions can perform it, and both can also link an athlete to a contract, confirming shared operations are open to every listed role"
        test_recipe:
          setup:
            - call: "POST /athletes"
              payload: { full_name: "Shared Op Athlete", date_of_birth: "2009-02-02", sport: "BASKETBALL", position: "GUARD" }
              as: FrontDesk
              captures: { athlete_id: $.data.id }
            - call: "POST /team-contracts"
              payload: { organization_name: "Shared Op Club", organization_type: "CLUB", contracted_sessions: 4, base_rate_cents: 30000, offsite_allowance: 1, term_start: "2026-08-01", term_end: "2027-05-31" }
              as: PerformanceDirector
              captures: { contract_id: $.data.id }
            - call: "POST /team-contracts/${contract_id}/activate"
              as: PerformanceDirector
          action:
            - call: "POST /group-sessions"
              payload: { start_at: "2026-08-25T16:00:00Z", end_at: "2026-08-25T17:00:00Z", site_code: "ONSITE", station_count: 3, phase_focus: "GENERAL_PREP", max_athletes: 8 }
              as: PerformanceDirector
              captures: { session_pd: $.data.id }
            - call: "POST /group-sessions"
              payload: { start_at: "2026-08-26T16:00:00Z", end_at: "2026-08-26T17:00:00Z", site_code: "ONSITE", station_count: 3, phase_focus: "GENERAL_PREP", max_athletes: 8 }
              as: FrontDesk
              captures: { session_fd: $.data.id }
            - call: "POST /team-contracts/${contract_id}/athletes"
              payload: { athlete_id: "${athlete_id}" }
              as: FrontDesk
              captures: { linked: $.data.team_contract_id }
          assertions:
            - "both session creations return 201 with session_status 'SCHEDULED' and staffing_status 'STAFF_PENDING'"
            - "the FrontDesk contract link returns 200 with $.data.team_contract_id == '${contract_id}'"
            - "no ERR_UNAUTHORIZED is produced for either role on any of these three shared operations"

      - name: front_desk_cannot_create_staff_members
        claim_type: exclusive_operations
        claim: "POST /staff-members is exclusive to PerformanceDirector, so FrontDesk and Coach both receive ERR_UNAUTHORIZED"
        test_recipe:
          setup: []
          action:
            - call: "POST /staff-members"
              payload: { full_name: "Should Not Exist", role_title: "PERFORMANCE_COACH", liability_insurance_expires_on: "2027-12-31" }
              as: FrontDesk
              captures: { err_fd: $.data.error_id }
            - call: "POST /staff-members"
              payload: { full_name: "Should Not Exist Either", role_title: "PERFORMANCE_COACH", liability_insurance_expires_on: "2027-12-31" }
              as: Coach
              captures: { err_coach: $.data.error_id }
          assertions:
            - "both calls return status 403 with $.data.error_id == 'ERR_UNAUTHORIZED'"
            - "role authorisation (priority 2) precedes schema validation (priority 5), so an unauthorised call with a malformed body still returns ERR_UNAUTHORIZED"
            - "GET /staff-members as PerformanceDirector shows total_count 0"

      - name: coach_cannot_void_completion_of_a_group_session
        claim_type: exclusive_operations
        claim: "void-completion is exclusive to PerformanceDirector: a Coach attempting it gets ERR_UNAUTHORIZED even though the Coach is the role that completed the session"
        test_recipe:
          setup:
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-08-01T09:00:00Z" }
              as: PerformanceDirector
            - call: "POST /group-sessions"
              payload: { start_at: "2026-08-20T16:00:00Z", end_at: "2026-08-20T17:00:00Z", site_code: "ONSITE", station_count: 3, phase_focus: "GENERAL_PREP", max_athletes: 8 }
              as: PerformanceDirector
              captures: { session_id: $.data.id }
          action:
            - call: "POST /group-sessions/${session_id}/void-completion"
              payload: { void_reason: "Coach attempting an unauthorised reversal" }
              as: Coach
              captures: { err: $.data.error_id }
          assertions:
            - "status 403"
            - "$.data.error_id == 'ERR_UNAUTHORIZED'"
            - "the role check precedes the state check, so the still-SCHEDULED session does not produce ERR_INVALID_STATE"
            - "GET /group-sessions/${session_id} still shows session_status 'SCHEDULED'"

      - name: athlete_cannot_read_another_athletes_progress_report
        claim_type: peer_roles
        claim: "The Athlete role is ownership-scoped: reading another athlete's progress report returns ERR_ATHLETE_SCOPE_VIOLATION while reading one's own succeeds"
        test_recipe:
          setup:
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-08-01T09:00:00Z" }
              as: PerformanceDirector
            - call: "POST /athletes"
              payload: { full_name: "Self Reader", date_of_birth: "2005-01-15", sport: "BASKETBALL", position: "GUARD" }
              as: FrontDesk
              captures: { athlete_self: $.data.id }
            - call: "POST /athletes"
              payload: { full_name: "Other Athlete", date_of_birth: "2005-02-15", sport: "BASKETBALL", position: "GUARD" }
              as: FrontDesk
              captures: { athlete_other: $.data.id }
          action:
            - call: "GET /athletes/${athlete_other}/progress-report"
              as: Athlete
              as_user_id: ${athlete_self}
              captures: { err: $.data.error_id }
            - call: "GET /athletes/${athlete_self}/progress-report"
              as: Athlete
              as_user_id: ${athlete_self}
              captures: { own_report: $.data.athlete_id }
          assertions:
            - "the cross-athlete read returns status 403 with $.data.error_id == 'ERR_ATHLETE_SCOPE_VIOLATION'"
            - "the self read returns 200 with $.data.athlete_id == '${athlete_self}' and readiness_index 50.00"
            - "PerformanceDirector can read both reports, so the restriction is specific to the ownership-scoped roles"

      - name: guardian_acting_for_an_adult_athlete_is_rejected
        claim_type: delegated_authority
        claim: "Guardian access is a delegated, conditional grant: it requires the athlete to be under 18 with a non-null guardian_email, so a Guardian acting for an adult athlete gets ERR_ATHLETE_SCOPE_VIOLATION"
        test_recipe:
          setup:
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-08-01T09:00:00Z" }
              as: PerformanceDirector
            - call: "POST /athletes"
              payload: { full_name: "Adult Athlete", date_of_birth: "2005-01-15", sport: "BASKETBALL", position: "GUARD" }
              as: FrontDesk
              captures: { athlete_adult: $.data.id }
            - call: "POST /athletes"
              payload: { full_name: "Minor Athlete", date_of_birth: "2012-01-15", sport: "BASKETBALL", position: "GUARD", guardian_email: "g.minor@example.com" }
              as: FrontDesk
              captures: { athlete_minor: $.data.id }
          action:
            - call: "GET /athletes/${athlete_adult}"
              as: Guardian
              as_user_id: ${athlete_adult}
              captures: { err: $.data.error_id }
            - call: "GET /athletes/${athlete_minor}"
              as: Guardian
              as_user_id: ${athlete_minor}
              captures: { minor_id: $.data.id }
          assertions:
            - "the adult athlete is age 21 at the 2026-08-01 clock and carries guardian_email null"
            - "the first read returns status 403 with $.data.error_id == 'ERR_ATHLETE_SCOPE_VIOLATION'"
            - "the second read returns 200 with $.data.id == '${athlete_minor}', proving the guard is the age-plus-guardian_email condition and not the role itself"

      - name: missing_x_user_role_header_returns_unauthenticated
        claim_type: authentication
        claim: "Authentication (priority 1) precedes every other check: a request without the X-User-Role header returns ERR_UNAUTHENTICATED (401) regardless of how invalid the rest of the request is"
        test_recipe:
          setup: []
          action:
            - call: "POST /athletes"
              payload: { full_name: "No Header Athlete", date_of_birth: "not-a-date", sport: "QUIDDITCH", position: "SEEKER" }
              as: "<no X-User-Role header supplied>"
              captures: { err_no_role: $.data.error_id }
            - call: "GET /athletes/00000000-0000-4000-8000-0000000000ff"
              as: "<no X-User-Role header supplied>"
              captures: { err_read: $.data.error_id }
          assertions:
            - "both calls return status 401 with $.data.error_id == 'ERR_UNAUTHENTICATED'"
            - "the first call is not ERR_INVALID_REQUEST despite the malformed date and unknown enums, confirming the priority-1 short circuit"
            - "the second call is not ERR_ATHLETE_NOT_FOUND despite the unknown id"
            - "an unrecognised X-User-Role value is likewise rejected with ERR_UNAUTHENTICATED rather than ERR_UNAUTHORIZED"

      - name: stage_decision_by_the_administering_coach_is_rejected
        claim_type: Segregation of duties
        claim: "Segregation of duties is enforced on the RTS decision: the user recorded as administered_by_staff_id on the stage test cannot also record the stage decision, even holding the MedicalProvider role"
        test_recipe:
          setup:
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-08-01T09:00:00Z" }
              as: PerformanceDirector
            - call: "POST /staff-members"
              payload: { full_name: "Coach And Provider", role_title: "PERFORMANCE_COACH", liability_insurance_expires_on: "2027-12-31" }
              as: PerformanceDirector
              captures: { coach_id: $.data.id }
            - call: "POST /certifications"
              payload: { staff_member_id: "${coach_id}", cert_code: "CPR_AED", issued_on: "2026-01-01", expires_on: "2027-12-31", ceu_credits_required: 6 }
              as: PerformanceDirector
            - call: "POST /athletes"
              payload: { full_name: "SoD Athlete", date_of_birth: "2009-02-02", sport: "BASKETBALL", position: "GUARD" }
              as: FrontDesk
              captures: { athlete_id: $.data.id }
            - call: "POST /test-sessions"
              payload: { athlete_id: "${athlete_id}", battery_type: "MOVEMENT_SCREEN" }
              as: Coach
              captures: { screen_id: $.data.id }
            - call: "POST /test-sessions/${screen_id}/results"
              payload: { results: [ { metric_code: "OH_SQUAT", value: 3, side: "BILATERAL" }, { metric_code: "HURDLE_STEP", value: 3, side: "BILATERAL" }, { metric_code: "INLINE_LUNGE", value: 3, side: "BILATERAL" }, { metric_code: "SL_HOP_L", value: 3, side: "LEFT" }, { metric_code: "SL_HOP_R", value: 3, side: "RIGHT" } ] }
              as: Coach
            - call: "POST /test-sessions/${screen_id}/finalize"
              as: Coach
            - call: "POST /injury-records"
              payload: { athlete_id: "${athlete_id}", body_region: "KNEE", severity: "MODERATE", occurred_on: "2026-07-15", rts_required: true }
              as: MedicalProvider
              captures: { injury_id: $.data.id }
            - call: "POST /rts-plans"
              payload: { athlete_id: "${athlete_id}", injury_record_id: "${injury_id}", target_stage_count: 3 }
              as: MedicalProvider
              captures: { rts_plan_id: $.data.id }
            - call: "POST /rts-plans/${rts_plan_id}/stage-test"
              as: Coach
              as_user_id: ${coach_id}
              captures: { stage_test_id: $.data.id }
            - call: "POST /test-sessions/${stage_test_id}/results"
              payload: { results: [ { metric_code: "CMJ_CM", value: 44.0, side: "BILATERAL" }, { metric_code: "SPRINT_10M_S", value: 1.72, side: "BILATERAL" }, { metric_code: "IMTP_N", value: 1900, side: "BILATERAL" } ] }
              as: Coach
              as_user_id: ${coach_id}
            - call: "POST /test-sessions/${stage_test_id}/finalize"
              as: Coach
              as_user_id: ${coach_id}
          action:
            - call: "POST /rts-plans/${rts_plan_id}/stage-decision"
              payload: { decision: "FAIL" }
              as: MedicalProvider
              as_user_id: ${coach_id}
              captures: { err: $.data.error_id }
          assertions:
            - "the stage test was administered with X-User-ID equal to ${coach_id}, so administered_by_staff_id == '${coach_id}'"
            - "status 403"
            - "$.data.error_id == 'ERR_SEGREGATION_OF_DUTIES'"
            - "GET /rts-plans/${rts_plan_id} still shows status 'STAGE_TESTING', current_stage 1 and stage_attempts unchanged"
            - "the identical call from a different X-User-ID is accepted, proving the block is the identity match and not the payload"

  # =========================================================================
  # SECTION 8 -- From Cross-Cutting Complexity Layers
  # =========================================================================
  - section: cross_cutting_layers
    instances:

      - name: entity_version_increments_by_one_on_every_mutation
        claim_type: optimistic_concurrency
        claim: "The version counter starts at 1 and increases by exactly one per successful write, and a rejected write does not consume a version"
        test_recipe:
          setup:
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-08-01T09:00:00Z" }
              as: PerformanceDirector
            - call: "POST /staff-members"
              payload: { full_name: "Coach Versioning", role_title: "PERFORMANCE_COACH", liability_insurance_expires_on: "2027-12-31" }
              as: PerformanceDirector
              captures: { coach_id: $.data.id }
            - call: "POST /certifications"
              payload: { staff_member_id: "${coach_id}", cert_code: "CPR_AED", issued_on: "2026-01-01", expires_on: "2027-12-31", ceu_credits_required: 6 }
              as: PerformanceDirector
          action:
            - call: "POST /group-sessions"
              payload: { start_at: "2026-08-25T16:00:00Z", end_at: "2026-08-25T17:00:00Z", site_code: "ONSITE", station_count: 3, phase_focus: "GENERAL_PREP", max_athletes: 8 }
              as: PerformanceDirector
              captures: { session_id: $.data.id, version_after_create: $.data.version }
            - call: "POST /group-sessions/${session_id}/coaches"
              payload: { staff_member_id: "${coach_id}", expected_group_session_version: "${version_after_create}" }
              as: PerformanceDirector
              captures: { version_after_coach: $.data.version }
            - call: "POST /group-sessions/${session_id}/cancel"
              payload: { cancel_reason: "Version probe" }
              as: PerformanceDirector
              captures: { version_after_cancel: $.data.version }
          assertions:
            - "$.data.version == 1 immediately after creation"
            - "$.data.version == 2 after the coach assignment"
            - "$.data.version == 3 after the cancellation"
            - "each increment is exactly 1 even though the coach assignment also recomputed compliant_coach_count, required_coach_count and staffing_status in the same write"
            - "GET /group-sessions/${session_id} reports version 3, matching the last mutating response"

      - name: coach_assignment_with_stale_session_version_returns_stale_version
        claim_type: optimistic_concurrency
        claim: "The coach-assign-stale-session concurrency rule is enforced: POST /group-sessions/{id}/coaches with an expected_group_session_version that has been superseded returns ERR_STALE_VERSION (412) and applies nothing, while the refreshed version succeeds"
        test_recipe:
          setup:
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-08-01T09:00:00Z" }
              as: PerformanceDirector
            - call: "POST /staff-members"
              payload: { full_name: "Coach Alpha", role_title: "PERFORMANCE_COACH", liability_insurance_expires_on: "2027-12-31" }
              as: PerformanceDirector
              captures: { coach_a: $.data.id }
            - call: "POST /certifications"
              payload: { staff_member_id: "${coach_a}", cert_code: "CPR_AED", issued_on: "2026-01-01", expires_on: "2027-12-31", ceu_credits_required: 6 }
              as: PerformanceDirector
            - call: "POST /staff-members"
              payload: { full_name: "Coach Beta", role_title: "PERFORMANCE_COACH", liability_insurance_expires_on: "2027-12-31" }
              as: PerformanceDirector
              captures: { coach_b: $.data.id }
            - call: "POST /certifications"
              payload: { staff_member_id: "${coach_b}", cert_code: "CPR_AED", issued_on: "2026-01-01", expires_on: "2027-12-31", ceu_credits_required: 6 }
              as: PerformanceDirector
            - call: "POST /group-sessions"
              payload: { start_at: "2026-08-25T16:00:00Z", end_at: "2026-08-25T17:00:00Z", site_code: "ONSITE", station_count: 6, phase_focus: "GENERAL_PREP", max_athletes: 20 }
              as: PerformanceDirector
              captures: { session_id: $.data.id, stale_version: $.data.version }
            - call: "POST /group-sessions/${session_id}/coaches"
              payload: { staff_member_id: "${coach_a}", expected_group_session_version: "${stale_version}" }
              as: PerformanceDirector
              captures: { fresh_version: $.data.version }
          action:
            - call: "POST /group-sessions/${session_id}/coaches"
              payload: { staff_member_id: "${coach_b}", expected_group_session_version: "${stale_version}" }
              as: PerformanceDirector
              captures: { err: $.data.error_id }
            - call: "POST /group-sessions/${session_id}/coaches"
              payload: { staff_member_id: "${coach_b}", expected_group_session_version: "${fresh_version}" }
              as: PerformanceDirector
              captures: { compliant_coach_count: $.data.compliant_coach_count }
          assertions:
            - "the first setup assignment succeeded and moved the version from 1 to 2, so stale_version 1 is now stale"
            - "the first action call returns status 412 with $.data.error_id == 'ERR_STALE_VERSION'"
            - "the rejected call changes nothing: assigned_staff still holds only coach_a, compliant_coach_count is 1 and version is still 2"
            - "the retry with fresh_version 2 returns 200 with compliant_coach_count 2 and version 3"
            - "the OCC field is expected_group_session_version and the guarded entity is GroupSession, exactly as declared in §1.2.1"

      - name: program_block_append_with_stale_program_version_returns_stale_version
        claim_type: optimistic_concurrency
        claim: "The block-add-stale-program concurrency rule is enforced independently: POST /training-programs/{id}/blocks with a superseded expected_training_program_version returns ERR_STALE_VERSION and no block is appended"
        test_recipe:
          setup:
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-08-01T09:00:00Z" }
              as: PerformanceDirector
            - call: "POST /athletes"
              payload: { full_name: "OCC Program Athlete", date_of_birth: "2009-02-02", sport: "BASKETBALL", position: "GUARD" }
              as: FrontDesk
              captures: { athlete_id: $.data.id }
            - call: "POST /training-programs"
              payload: { athlete_id: "${athlete_id}", sport: "BASKETBALL", position: "GUARD", competition_start_date: "2026-11-01", competition_end_date: "2027-02-01" }
              as: PerformanceDirector
              captures: { program_id: $.data.id, stale_version: $.data.version }
            - call: "POST /training-programs/${program_id}/blocks"
              payload: { expected_training_program_version: "${stale_version}", phase: "GENERAL_PREP", start_week: 1, end_week: 4, target_intensity_pct: 60, weekly_volume_units: 20.00 }
              as: PerformanceDirector
              captures: { block_one: $.data.id }
          action:
            - call: "POST /training-programs/${program_id}/blocks"
              payload: { expected_training_program_version: "${stale_version}", phase: "SPECIFIC_PREP", start_week: 5, end_week: 8, target_intensity_pct: 80, weekly_volume_units: 18.00, predecessor_block_id: "${block_one}" }
              as: PerformanceDirector
              captures: { err: $.data.error_id }
          assertions:
            - "the setup append succeeded with stale_version 1 and left the program at version 2"
            - "status 412"
            - "$.data.error_id == 'ERR_STALE_VERSION'"
            - "the body was otherwise valid (start_week 5 continues the chain from end_week 4), so the failure is purely the version guard"
            - "GET /training-programs/${program_id} shows block_count 1, planned_load_units unchanged and version 2"

      - name: clock_advance_sweeps_signed_clearances_then_packages_in_pinned_order
        claim_type: scheduled_actions
        claim: "A single clock advance runs the declared sweep in the pinned order -- SIGNED ClearanceDocuments first, then MembershipPackages in created_at ascending order -- and never touches Certifications, whose lapse is driven only by credential-review"
        test_recipe:
          setup:
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-08-01T09:00:00Z" }
              as: PerformanceDirector
            - call: "POST /staff-members"
              payload: { full_name: "Coach Unswept", role_title: "PERFORMANCE_COACH", liability_insurance_expires_on: "2027-12-31" }
              as: PerformanceDirector
              captures: { coach_id: $.data.id }
            - call: "POST /certifications"
              payload: { staff_member_id: "${coach_id}", cert_code: "CSCS", issued_on: "2023-08-02", expires_on: "2026-08-02", ceu_credits_required: 6 }
              as: PerformanceDirector
              captures: { cert_id: $.data.id }
            - call: "POST /athletes"
              payload: { full_name: "Sweep Order Athlete", date_of_birth: "2009-02-02", sport: "BASKETBALL", position: "GUARD" }
              as: FrontDesk
              captures: { athlete_id: $.data.id }
            - call: "POST /athletes/${athlete_id}/medical-hold"
              payload: { hold_reason: "Provider release on file" }
              as: MedicalProvider
            - call: "POST /clearance-documents"
              payload: { athlete_id: "${athlete_id}", rts_plan_id: null, document_type: "MEDICAL_HOLD_RELEASE", stage_number: null, expires_on: "2026-08-05" }
              as: MedicalProvider
              captures: { document_id: $.data.id }
            - call: "POST /clearance-documents/${document_id}/sign"
              payload: { provider_license_id: "MD-31-8842" }
              as: MedicalProvider
              captures: { document_status: $.data.status }
            - call: "POST /membership-packages"
              payload: { athlete_id: "${athlete_id}", sessions_purchased: 2, price_cents: 9000, expires_on: "2026-08-06" }
              as: FrontDesk
              captures: { package_id: $.data.id }
          action:
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-08-15T09:00:00Z" }
              as: PerformanceDirector
              captures: { clearance_documents_expired_count: $.data.clearance_documents_expired_count, packages_expired_count: $.data.packages_expired_count }
          assertions:
            - "the sign call returned 200 with $.data.status == 'SIGNED'"
            - "status 200 on the clock advance"
            - "$.data.current_utc == '2026-08-15T09:00:00Z'"
            - "$.data.clearance_documents_expired_count == 1 and $.data.packages_expired_count == 1"
            - "GET the clearance document shows status 'EXPIRED'"
            - "GET the package shows status 'EXPIRED' with sessions_remaining 0 and sessions_forfeited 2"
            - "GET /certifications/${cert_id} still shows status 'VALID' even though expires_on 2026-08-02 is now in the past, because Certifications are never swept by the clock"
            - "GET /staff-members/${coach_id} still shows credential_status 'VALID' with valid_certification_count 1; only POST /staff-members/{id}/credential-review would reclassify it"

      - name: cascading_side_effect_chain_verified_end_to_end
        claim_type: cascading_side_effects
        excluded_because:
          difficulty_instance: credential_review_lapse_cascades_five_hops_to_cleared_station_numbers
          rationale: "The deepest declared chain is the credential-review lapse, and the cited §1.8 instance asserts every one of its five hops plus the ordering sensitivity; third_no_show_strike_cascades_suspension_refund_and_waitlist_promotion covers the second independent chain."

      - name: dual_variant_results_and_switch_delta
        claim_type: dual_variant_calculation
        excluded_because:
          difficulty_instance: movement_screen_intake_variant_scores_lower_than_reassessment_variant
          rationale: "Both declared dual-variant rules are asserted in §1.8 -- the cited instance for movement_screen_risk_score and performance_composite_raw_norm_variant_diverges_from_maturity_adjusted_variant for the composite -- each running identical inputs through both variants and asserting the delta."

  # =========================================================================
  # SECTION 9 -- From Consistency Model
  # =========================================================================
  - section: consistency_model
    instances:

      - name: coach_assignment_response_reflects_recomputed_staffing_in_the_same_response
        claim_type: immediate
        claim: "The declared consistency model is immediate: every derived field touched by a write is already correct in that write's own response body, with no re-read required"
        test_recipe:
          setup:
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-08-01T09:00:00Z" }
              as: PerformanceDirector
            - call: "POST /staff-members"
              payload: { full_name: "Coach Immediate", role_title: "PERFORMANCE_COACH", liability_insurance_expires_on: "2027-12-31" }
              as: PerformanceDirector
              captures: { coach_id: $.data.id }
            - call: "POST /certifications"
              payload: { staff_member_id: "${coach_id}", cert_code: "CPR_AED", issued_on: "2026-01-01", expires_on: "2027-12-31", ceu_credits_required: 6 }
              as: PerformanceDirector
            - call: "POST /athletes"
              payload: { full_name: "Immediate Athlete", date_of_birth: "2009-02-02", sport: "BASKETBALL", position: "GUARD" }
              as: FrontDesk
              captures: { athlete_id: $.data.id }
            - call: "POST /test-sessions"
              payload: { athlete_id: "${athlete_id}", battery_type: "MOVEMENT_SCREEN" }
              as: Coach
              captures: { screen_id: $.data.id }
            - call: "POST /test-sessions/${screen_id}/results"
              payload: { results: [ { metric_code: "OH_SQUAT", value: 3, side: "BILATERAL" }, { metric_code: "HURDLE_STEP", value: 3, side: "BILATERAL" }, { metric_code: "INLINE_LUNGE", value: 3, side: "BILATERAL" }, { metric_code: "SL_HOP_L", value: 3, side: "LEFT" }, { metric_code: "SL_HOP_R", value: 3, side: "RIGHT" } ] }
              as: Coach
            - call: "POST /test-sessions/${screen_id}/finalize"
              as: Coach
              captures: { risk_score: $.data.risk_score }
            - call: "POST /group-sessions"
              payload: { start_at: "2026-08-25T16:00:00Z", end_at: "2026-08-25T17:00:00Z", site_code: "ONSITE", station_count: 3, phase_focus: "GENERAL_PREP", max_athletes: 8 }
              as: PerformanceDirector
              captures: { session_id: $.data.id, version_after_create: $.data.version }
            - call: "POST /enrollments"
              payload: { athlete_id: "${athlete_id}", group_session_id: "${session_id}" }
              as: FrontDesk
              captures: { enrollment_id: $.data.id }
          action:
            - call: "POST /group-sessions/${session_id}/coaches"
              payload: { staff_member_id: "${coach_id}", expected_group_session_version: "${version_after_create}" }
              as: PerformanceDirector
              captures: { staffing_status: $.data.staffing_status }
            - call: "GET /group-sessions/${session_id}"
              as: PerformanceDirector
              captures: { reread_staffing_status: $.data.staffing_status }
          assertions:
            - "the finalize response already carried risk_score 0.00 in its own body, and the athlete became CLEARED and ACTIVE in the same request"
            - "the coach-assignment response already carries compliant_coach_count 1, required_coach_count 1, staffing_status 'STAFFED' and version 2 -- no second call is needed to observe them"
            - "$.data.athlete_units == 1.0 and reserved_count == 1 in that same response, reflecting the enrollment made before the assignment"
            - "the subsequent GET returns byte-identical derived values (staffing_status 'STAFFED', compliant_coach_count 1, athlete_units 1.0, version 2), proving nothing lags"
            - "no field is observed to change between the write response and the immediately following read"
