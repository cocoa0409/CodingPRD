scaffold_difficulty_design:
  # ===========================================================================
  - rule_id: dual_variant_calc
    instances:
      - name: fee_single_vs_annual_variant
        grounds:
          - calculations.compute_permit_fee
          - entities.Permit.fields.fee_cents
          - entities.Permit.fields.permit_type
        distinguishing_aspect: >-
          The SINGLE_TRIP variant (mileage + surcharges) and the ANNUAL variant
          (flat base + surcharges, no mileage) yield different fee_cents for the
          same OVERSIZE_OVERWEIGHT load — dual variant lives on the Permit domain.
        test_recipe:
          setup:
            - "A carrier exists."
            - "A SINGLE_TRIP OVERSIZE_OVERWEIGHT permit (front_overhang 80in -> oversize, gross 120000 -> overweight) with two 10.1-mile route segments."
            - "An ANNUAL permit with identical dimensions and one route segment."
          setup_api_calls:
            - call: "POST /carriers"
              payload: { legal_name: "Acme Hauling", usdot_number: "USDOT-DV1" }
              as: DOTAdmin
              captures: { carrier_id: $.data.id }
            - call: "POST /permits"
              payload: { carrier_id: "${carrier_id}", permit_type: "SINGLE_TRIP", length_in: 900, width_in: 100, height_in: 100, front_overhang_in: 80, rear_overhang_in: 0, gross_weight_lbs: 120000, num_axles: 9, valid_from: "2026-06-01T00:00:00Z", valid_until: "2026-06-30T00:00:00Z" }
              as: Carrier
              as_user_id: "${carrier_id}"
              captures: { p_single_id: $.data.id }
            - call: "POST /permits/${p_single_id}/route-segments"
              payload: { sequence_index: 1, highway_id: "I-80", from_milepost: 0, to_milepost: 10.1 }
              as: Carrier
              as_user_id: "${carrier_id}"
            - call: "POST /permits/${p_single_id}/route-segments"
              payload: { sequence_index: 2, highway_id: "I-80", from_milepost: 10.1, to_milepost: 20.2 }
              as: Carrier
              as_user_id: "${carrier_id}"
            - call: "POST /permits"
              payload: { carrier_id: "${carrier_id}", permit_type: "ANNUAL", length_in: 900, width_in: 100, height_in: 100, front_overhang_in: 80, rear_overhang_in: 0, gross_weight_lbs: 120000, num_axles: 9, valid_from: "2026-06-01T00:00:00Z", valid_until: "2026-12-31T00:00:00Z" }
              as: Carrier
              as_user_id: "${carrier_id}"
              captures: { p_annual_id: $.data.id }
            - call: "POST /permits/${p_annual_id}/route-segments"
              payload: { sequence_index: 1, highway_id: "I-80", from_milepost: 0, to_milepost: 10.1 }
              as: Carrier
              as_user_id: "${carrier_id}"
          trigger:
            - call: "POST /permits/${p_single_id}/submit"
              payload: {}
              as: Carrier
              as_user_id: "${carrier_id}"
              captures: { fee_single: $.data.fee_cents, class_single: $.data.classification }
            - call: "POST /permits/${p_annual_id}/submit"
              payload: {}
              as: Carrier
              as_user_id: "${carrier_id}"
              captures: { fee_annual: $.data.fee_cents }
          assert:
            - "Permit.${p_single_id}.classification == OVERSIZE_OVERWEIGHT"
            - "Permit.${p_single_id}.fee_cents == 45006"
            - "Permit.${p_annual_id}.fee_cents == 83000"
            - "Permit.${p_single_id}.fee_cents != Permit.${p_annual_id}.fee_cents"

      - name: bridge_lfr_vs_lrfr_rating
        grounds:
          - calculations.compute_rating_factor
          - entities.BridgeAnalysis.fields.rating_factor
          - entities.BridgeAnalysis.fields.method
        distinguishing_aspect: >-
          For one Structure (rated 200t, dead 40t) and one 120000-lb load, the LFR
          method yields rating_factor 1.1367 and the LRFR method yields 1.4286 —
          dual variant on the Structure/BridgeAnalysis domain (distinct from the
          Permit-fee dual variant).
        test_recipe:
          setup:
            - "A structure rated 200t / dead 40t."
            - "Two OVERWEIGHT permits (gross 120000) each crossing that structure, each under standard review."
          setup_api_calls:
            - call: "POST /carriers"
              payload: { legal_name: "Bridge Hauler", usdot_number: "USDOT-DV2" }
              as: DOTAdmin
              captures: { carrier_id: $.data.id }
            - call: "POST /structures"
              payload: { name: "Span 200", highway_id: "I-80", milepost: 5, rated_capacity_tonnage: 200, dead_load_tonnage: 40 }
              as: DOTAdmin
              captures: { structure_id: $.data.id }
            - call: "POST /permits"
              payload: { carrier_id: "${carrier_id}", permit_type: "SINGLE_TRIP", length_in: 900, width_in: 100, height_in: 100, front_overhang_in: 0, rear_overhang_in: 0, gross_weight_lbs: 120000, num_axles: 9, valid_from: "2026-06-01T00:00:00Z", valid_until: "2026-06-30T00:00:00Z" }
              as: Carrier
              as_user_id: "${carrier_id}"
              captures: { p1_id: $.data.id }
            - call: "POST /permits/${p1_id}/route-segments"
              payload: { sequence_index: 1, highway_id: "I-80", from_milepost: 0, to_milepost: 10, structure_id: "${structure_id}", planned_cross_start_utc: "2026-06-05T10:00:00Z", planned_cross_end_utc: "2026-06-05T10:30:00Z" }
              as: Carrier
              as_user_id: "${carrier_id}"
            - call: "POST /permits/${p1_id}/submit"
              payload: {}
              as: Carrier
              as_user_id: "${carrier_id}"
            - call: "GET /bridge-analyses?permit_id=${p1_id}"
              payload: {}
              as: BridgeEngineer
              captures: { ba1_id: "$.data[0].id"}
            - call: "POST /permits/${p1_id}/begin-review"
              payload: {}
              as: PermitOfficer
            - call: "POST /permits"
              payload: { carrier_id: "${carrier_id}", permit_type: "SINGLE_TRIP", length_in: 900, width_in: 100, height_in: 100, front_overhang_in: 0, rear_overhang_in: 0, gross_weight_lbs: 120000, num_axles: 9, valid_from: "2026-06-01T00:00:00Z", valid_until: "2026-06-30T00:00:00Z" }
              as: Carrier
              as_user_id: "${carrier_id}"
              captures: { p2_id: $.data.id }
            - call: "POST /permits/${p2_id}/route-segments"
              payload: { sequence_index: 1, highway_id: "I-80", from_milepost: 0, to_milepost: 10, structure_id: "${structure_id}", planned_cross_start_utc: "2026-06-06T10:00:00Z", planned_cross_end_utc: "2026-06-06T10:30:00Z" }
              as: Carrier
              as_user_id: "${carrier_id}"
            - call: "POST /permits/${p2_id}/submit"
              payload: {}
              as: Carrier
              as_user_id: "${carrier_id}"
            - call: "GET /bridge-analyses?permit_id=${p2_id}"
              payload: {}
              as: BridgeEngineer
              captures: { ba2_id: "$.data[0].id"}
            - call: "POST /permits/${p2_id}/begin-review"
              payload: {}
              as: PermitOfficer
          trigger:
            - call: "POST /bridge-analyses/${ba1_id}/review"
              payload: { method: "LFR" }
              as: BridgeEngineer
              captures: { rf1: $.data.rating_factor, st1: $.data.status }
            - call: "POST /bridge-analyses/${ba2_id}/review"
              payload: { method: "LRFR" }
              as: BridgeEngineer
              captures: { rf2: $.data.rating_factor, st2: $.data.status }
          assert:
            - "BridgeAnalysis.${ba1_id}.rating_factor == 1.1367"
            - "BridgeAnalysis.${ba2_id}.rating_factor == 1.4286"
            - "BridgeAnalysis.${ba1_id}.status == CLEARED"
            - "BridgeAnalysis.${ba2_id}.status == CLEARED"
            - "BridgeAnalysis.${ba1_id}.rating_factor != BridgeAnalysis.${ba2_id}.rating_factor"

  # ===========================================================================
  - rule_id: combinatorial_formula
    instances:
      - name: escort_nested_max_tiered
        grounds:
          - calculations.compute_escort_requirement
          - entities.Permit.fields.required_escort_count
        distinguishing_aspect: >-
          Mode (a): required_escort_count = max(width_comp, length_comp) + height_comp
          + police_comp uses four inputs (width, length, height, gross) with a nested
          max over two tiered components — for width 180 / length 1000 / height 170 /
          gross 210000 it equals 4, not the naive sum 6.
        test_recipe:
          setup:
            - "A carrier and a SINGLE_TRIP permit with width 180in (comp 2), length 1000in (comp 1), height 170in (comp 1), gross 210000 (police 1)."
            - "One route segment (no structure)."
          setup_api_calls:
            - call: "POST /carriers"
              payload: { legal_name: "Wide Load Co", usdot_number: "USDOT-CF1" }
              as: DOTAdmin
              captures: { carrier_id: $.data.id }
            - call: "POST /permits"
              payload: { carrier_id: "${carrier_id}", permit_type: "SINGLE_TRIP", length_in: 1000, width_in: 180, height_in: 170, front_overhang_in: 0, rear_overhang_in: 0, gross_weight_lbs: 210000, num_axles: 13, valid_from: "2026-06-01T00:00:00Z", valid_until: "2026-06-30T00:00:00Z" }
              as: Carrier
              as_user_id: "${carrier_id}"
              captures: { permit_id: $.data.id }
            - call: "POST /permits/${permit_id}/route-segments"
              payload: { sequence_index: 1, highway_id: "I-80", from_milepost: 0, to_milepost: 15 }
              as: Carrier
              as_user_id: "${carrier_id}"
          trigger:
            - call: "POST /permits/${permit_id}/submit"
              payload: {}
              as: Carrier
              as_user_id: "${carrier_id}"
              captures: { escorts: $.data.required_escort_count, cls: $.data.classification }
          assert:
            - "Permit.${permit_id}.required_escort_count == 4"
            - "Permit.${permit_id}.classification == SUPERLOAD"

      - name: fee_per_segment_round_then_sum
        grounds:
          - calculations.compute_permit_fee
          - entities.Permit.fields.fee_cents
          - entities.RouteSegment.fields.miles
        distinguishing_aspect: >-
          Mode (b): mileage is round_half_up PER SEGMENT then summed — two 10.1-mile
          segments give 253 + 253 = 506 cents, whereas the forbidden sum-then-round
          (20.2 * 25 = 505) diverges by 1 cent, making total fee 45006 not 45005.
        test_recipe:
          setup:
            - "A carrier and a SINGLE_TRIP OVERSIZE_OVERWEIGHT permit (overhang 80, gross 120000)."
            - "Two 10.1-mile route segments (no structures)."
          setup_api_calls:
            - call: "POST /carriers"
              payload: { legal_name: "Round Freight", usdot_number: "USDOT-CF2" }
              as: DOTAdmin
              captures: { carrier_id: $.data.id }
            - call: "POST /permits"
              payload: { carrier_id: "${carrier_id}", permit_type: "SINGLE_TRIP", length_in: 900, width_in: 100, height_in: 100, front_overhang_in: 80, rear_overhang_in: 0, gross_weight_lbs: 120000, num_axles: 9, valid_from: "2026-06-01T00:00:00Z", valid_until: "2026-06-30T00:00:00Z" }
              as: Carrier
              as_user_id: "${carrier_id}"
              captures: { permit_id: $.data.id }
            - call: "POST /permits/${permit_id}/route-segments"
              payload: { sequence_index: 1, highway_id: "I-80", from_milepost: 0, to_milepost: 10.1 }
              as: Carrier
              as_user_id: "${carrier_id}"
            - call: "POST /permits/${permit_id}/route-segments"
              payload: { sequence_index: 2, highway_id: "I-80", from_milepost: 10.1, to_milepost: 20.2 }
              as: Carrier
              as_user_id: "${carrier_id}"
          trigger:
            - call: "POST /permits/${permit_id}/submit"
              payload: {}
              as: Carrier
              as_user_id: "${carrier_id}"
              captures: { fee: $.data.fee_cents }
          assert:
            - "Permit.${permit_id}.fee_cents == 45006"

  # ===========================================================================
  - rule_id: non_linear_state_machine
    instances:
      - name: permit_return_resubmit_cycle
        grounds:
          - state_machines.Permit.SUBMITTED_to_UNDER_STANDARD_REVIEW
          - state_machines.Permit.UNDER_STANDARD_REVIEW_to_RETURNED_FOR_CORRECTION
          - state_machines.Permit.RETURNED_FOR_CORRECTION_to_SUBMITTED
        distinguishing_aspect: >-
          The Permit machine is cyclic: SUBMITTED -> UNDER_STANDARD_REVIEW ->
          RETURNED_FOR_CORRECTION -> SUBMITTED re-enters an already-visited state,
          which a linear A->B->C pipeline cannot do.
        test_recipe:
          setup:
            - "An OVERWEIGHT permit with one route segment (no structure), submitted and in standard review."
          setup_api_calls:
            - call: "POST /carriers"
              payload: { legal_name: "Loop Carriers", usdot_number: "USDOT-NL1" }
              as: DOTAdmin
              captures: { carrier_id: $.data.id }
            - call: "POST /permits"
              payload: { carrier_id: "${carrier_id}", permit_type: "SINGLE_TRIP", length_in: 900, width_in: 100, height_in: 100, front_overhang_in: 0, rear_overhang_in: 0, gross_weight_lbs: 120000, num_axles: 9, valid_from: "2026-06-01T00:00:00Z", valid_until: "2026-06-30T00:00:00Z" }
              as: Carrier
              as_user_id: "${carrier_id}"
              captures: { permit_id: $.data.id }
            - call: "POST /permits/${permit_id}/route-segments"
              payload: { sequence_index: 1, highway_id: "I-80", from_milepost: 0, to_milepost: 10 }
              as: Carrier
              as_user_id: "${carrier_id}"
            - call: "POST /permits/${permit_id}/submit"
              payload: {}
              as: Carrier
              as_user_id: "${carrier_id}"
            - call: "POST /permits/${permit_id}/begin-review"
              payload: {}
              as: PermitOfficer
            - call: "POST /permits/${permit_id}/return"
              payload: { reason: "fix overhang" }
              as: PermitOfficer
              captures: { returned_status: $.data.status }
          trigger:
            - call: "POST /permits/${permit_id}/submit"
              payload: {}
              as: Carrier
              as_user_id: "${carrier_id}"
              captures: { resubmit_status: $.data.status }
          assert:
            - "Permit.${permit_id}.status was RETURNED_FOR_CORRECTION after return"
            - "Permit.${permit_id}.status == SUBMITTED after the second submit (cycle closed)"

      - name: bridge_conditional_then_cleared_branch
        grounds:
          - state_machines.BridgeAnalysis.REQUESTED_to_CONDITIONAL
          - state_machines.BridgeAnalysis.CONDITIONAL_to_CLEARED
          - entities.BridgeAnalysis.fields.conditions_note
        distinguishing_aspect: >-
          BridgeAnalysis forks REQUESTED -> CONDITIONAL (rating_factor 0.9585, the
          divergent branch that sets conditions_note) and then CONDITIONAL -> CLEARED
          via carrier accept-conditions — a non-linear branch+rejoin on an entity
          other than Permit.
        test_recipe:
          setup:
            - "A structure rated 130t / dead 20t and an OVERWEIGHT permit (gross 100000) crossing it, under standard review."
          setup_api_calls:
            - call: "POST /carriers"
              payload: { legal_name: "Cond Hauling", usdot_number: "USDOT-NL2" }
              as: DOTAdmin
              captures: { carrier_id: $.data.id }
            - call: "POST /structures"
              payload: { name: "Span 130", highway_id: "I-70", milepost: 8, rated_capacity_tonnage: 130, dead_load_tonnage: 20 }
              as: DOTAdmin
              captures: { structure_id: $.data.id }
            - call: "POST /permits"
              payload: { carrier_id: "${carrier_id}", permit_type: "SINGLE_TRIP", length_in: 900, width_in: 100, height_in: 100, front_overhang_in: 0, rear_overhang_in: 0, gross_weight_lbs: 100000, num_axles: 7, valid_from: "2026-06-01T00:00:00Z", valid_until: "2026-06-30T00:00:00Z" }
              as: Carrier
              as_user_id: "${carrier_id}"
              captures: { permit_id: $.data.id }
            - call: "POST /permits/${permit_id}/route-segments"
              payload: { sequence_index: 1, highway_id: "I-70", from_milepost: 0, to_milepost: 12, structure_id: "${structure_id}", planned_cross_start_utc: "2026-06-05T10:00:00Z", planned_cross_end_utc: "2026-06-05T10:30:00Z" }
              as: Carrier
              as_user_id: "${carrier_id}"
            - call: "POST /permits/${permit_id}/submit"
              payload: {}
              as: Carrier
              as_user_id: "${carrier_id}"
            - call: "GET /bridge-analyses?permit_id=${permit_id}"
              payload: {}
              as: BridgeEngineer
              captures: { ba_id: "$.data[0].id"}
            - call: "POST /permits/${permit_id}/begin-review"
              payload: {}
              as: PermitOfficer
          trigger:
            - call: "POST /bridge-analyses/${ba_id}/review"
              payload: { method: "LFR" }
              as: BridgeEngineer
              captures: { rf: $.data.rating_factor, cond_status: $.data.status }
            - call: "POST /bridge-analyses/${ba_id}/accept-conditions"
              payload: {}
              as: Carrier
              as_user_id: "${carrier_id}"
              captures: { final_status: $.data.status }
          assert:
            - "BridgeAnalysis.${ba_id}.rating_factor == 0.9585"
            - "BridgeAnalysis.${ba_id}.status == CONDITIONAL immediately after review"
            - "BridgeAnalysis.${ba_id}.status == CLEARED after accept-conditions"

  # ===========================================================================
  - rule_id: transitive_cascade
    instances:
      - name: issue_permit_bond_carrier_cascade
        grounds:
          - state_machines.Permit.APPROVED_to_ISSUED
          - state_machines.Bond.DRAFT_to_ACTIVE
          - entities.Carrier.fields.escrow_balance_cents
          - entities.Carrier.fields.active_bond_amount_cents
        distinguishing_aspect: >-
          Depth-3 cascade from POST issue: Permit->ISSUED activates the Bond
          (DRAFT->ACTIVE), and the Bond activation itself debits Carrier.escrow_balance_cents
          (10000000->4000000) and credits active_bond_amount_cents (0->6000000).
        test_recipe:
          setup:
            - "A carrier with 10000000c escrow; a pilot car; a SUPERLOAD permit (gross 210000) with one no-structure segment and one confirmed POLICE escort, approved."
          setup_api_calls:
            - call: "POST /carriers"
              payload: { legal_name: "Super Freight", usdot_number: "USDOT-TC1" }
              as: DOTAdmin
              captures: { carrier_id: $.data.id }
            - call: "POST /carriers/${carrier_id}/escrow-deposits"
              payload: { amount_cents: 10000000 }
              as: DOTAdmin
            - call: "POST /pilot-cars"
              payload: { company_name: "Escort Co", cert_number: "PC-TC1" }
              as: DOTAdmin
              captures: { pilot_id: $.data.id }
            - call: "POST /permits"
              payload: { carrier_id: "${carrier_id}", permit_type: "SINGLE_TRIP", length_in: 900, width_in: 100, height_in: 100, front_overhang_in: 0, rear_overhang_in: 0, gross_weight_lbs: 210000, num_axles: 13, valid_from: "2026-06-01T00:00:00Z", valid_until: "2026-06-30T00:00:00Z" }
              as: Carrier
              as_user_id: "${carrier_id}"
              captures: { permit_id: $.data.id }
            - call: "POST /permits/${permit_id}/route-segments"
              payload: { sequence_index: 1, highway_id: "I-80", from_milepost: 0, to_milepost: 10 }
              as: Carrier
              as_user_id: "${carrier_id}"
            - call: "POST /permits/${permit_id}/escort-assignments"
              payload: { pilot_car_id: "${pilot_id}", role: "POLICE", window_start_utc: "2026-06-05T09:00:00Z", window_end_utc: "2026-06-05T12:00:00Z" }
              as: Carrier
              as_user_id: "${carrier_id}"
              captures: { escort_id: $.data.id }
            - call: "POST /permits/${permit_id}/submit"
              payload: {}
              as: Carrier
              as_user_id: "${carrier_id}"
            - call: "POST /escort-assignments/${escort_id}/confirm"
              payload: {}
              as: Carrier
              as_user_id: "${carrier_id}"
            - call: "POST /permits/${permit_id}/begin-review"
              payload: {}
              as: BridgeEngineer
            - call: "POST /permits/${permit_id}/approve"
              payload: {}
              as: BridgeEngineer
          trigger:
            - call: "POST /permits/${permit_id}/issue"
              payload: {}
              as: PermitOfficer
              captures: { issued_status: $.data.status }
          assert:
            - "Permit.${permit_id}.status == ISSUED"
            - "Carrier.${carrier_id}.escrow_balance_cents == 4000000"
            - "Carrier.${carrier_id}.active_bond_amount_cents == 6000000"

      - name: critical_violation_revoke_segment_structure_cascade
        grounds:
          - state_machines.Violation.OPEN_to_UPHELD
          - state_machines.Permit.SUSPENDED_to_REVOKED
          - state_machines.RouteSegment.RESERVED_to_RELEASED
          - entities.Structure.fields.committed_tonnage
        distinguishing_aspect: >-
          Depth-4 cascade from a different trigger (uphold): Violation UPHELD ->
          Permit SUSPENDED->REVOKED -> its RESERVED RouteSegment RESERVED->RELEASED ->
          crossed Structure.committed_tonnage 60->0 (available 140->200). Each hop is
          caused by the prior hop.
        test_recipe:
          setup:
            - "An OVERWEIGHT permit (gross 120000) crossing a structure (rated 200 / dead 40), ISSUED (segment RESERVED, structure committed 60)."
            - "A CRITICAL OFF_ROUTE violation cited on it (permit now SUSPENDED)."
          setup_api_calls:
            - call: "POST /carriers"
              payload: { legal_name: "Revoke Hauling", usdot_number: "USDOT-TC2" }
              as: DOTAdmin
              captures: { carrier_id: $.data.id }
            - call: "POST /structures"
              payload: { name: "Span 200b", highway_id: "I-90", milepost: 3, rated_capacity_tonnage: 200, dead_load_tonnage: 40 }
              as: DOTAdmin
              captures: { structure_id: $.data.id }
            - call: "POST /permits"
              payload: { carrier_id: "${carrier_id}", permit_type: "SINGLE_TRIP", length_in: 900, width_in: 100, height_in: 100, front_overhang_in: 0, rear_overhang_in: 0, gross_weight_lbs: 120000, num_axles: 9, valid_from: "2026-06-01T00:00:00Z", valid_until: "2026-06-30T00:00:00Z" }
              as: Carrier
              as_user_id: "${carrier_id}"
              captures: { permit_id: $.data.id }
            - call: "POST /permits/${permit_id}/route-segments"
              payload: { sequence_index: 1, highway_id: "I-90", from_milepost: 0, to_milepost: 10, structure_id: "${structure_id}", planned_cross_start_utc: "2026-06-05T10:00:00Z", planned_cross_end_utc: "2026-06-05T10:30:00Z" }
              as: Carrier
              as_user_id: "${carrier_id}"
            - call: "POST /permits/${permit_id}/submit"
              payload: {}
              as: Carrier
              as_user_id: "${carrier_id}"
            - call: "GET /bridge-analyses?permit_id=${permit_id}"
              payload: {}
              as: BridgeEngineer
              captures: { ba_id: "$.data[0].id"}
            - call: "POST /permits/${permit_id}/begin-review"
              payload: {}
              as: PermitOfficer
            - call: "POST /bridge-analyses/${ba_id}/review"
              payload: { method: "LFR" }
              as: BridgeEngineer
            - call: "POST /permits/${permit_id}/approve"
              payload: {}
              as: PermitOfficer
            - call: "POST /permits/${permit_id}/issue"
              payload: {}
              as: PermitOfficer
            - call: "POST /violations"
              payload: { permit_id: "${permit_id}", violation_type: "OFF_ROUTE", severity: "CRITICAL" }
              as: EnforcementOfficer
              captures: { violation_id: $.data.id }
          trigger:
            - call: "POST /violations/${violation_id}/uphold"
              payload: {}
              as: EnforcementOfficer
              captures: { v_status: $.data.status }
          assert:
            - "Violation.${violation_id}.status == UPHELD"
            - "Permit.${permit_id}.status == REVOKED"
            - "Structure.${structure_id}.committed_tonnage == 0"
            - "Structure.${structure_id}.available_tonnage == 200"

  # ===========================================================================
  - rule_id: priority_pair_validation_conflict
    instances:
      - name: issue_state_beats_insufficient_escrow
        grounds:
          - validations[priority=8]
          - validations[priority=25]
        distinguishing_aspect: >-
          On POST issue a SUBMITTED (not APPROVED) superload permit with zero escrow
          fails both the state precondition (priority 8) and the insufficient-escrow
          fiscal check (priority 25); the state error ERR_INVALID_PERMIT_STATE wins —
          category pair {state, business_fiscal}.
        test_recipe:
          setup:
            - "A carrier with NO escrow; a SUPERLOAD permit (gross 210000) submitted but not approved (Bond DRAFT exists, escrow 0)."
          setup_api_calls:
            - call: "POST /carriers"
              payload: { legal_name: "Broke Hauler", usdot_number: "USDOT-PP1" }
              as: DOTAdmin
              captures: { carrier_id: $.data.id }
            - call: "POST /permits"
              payload: { carrier_id: "${carrier_id}", permit_type: "SINGLE_TRIP", length_in: 900, width_in: 100, height_in: 100, front_overhang_in: 0, rear_overhang_in: 0, gross_weight_lbs: 210000, num_axles: 13, valid_from: "2026-06-01T00:00:00Z", valid_until: "2026-06-30T00:00:00Z" }
              as: Carrier
              as_user_id: "${carrier_id}"
              captures: { permit_id: $.data.id }
            - call: "POST /permits/${permit_id}/route-segments"
              payload: { sequence_index: 1, highway_id: "I-80", from_milepost: 0, to_milepost: 10 }
              as: Carrier
              as_user_id: "${carrier_id}"
            - call: "POST /permits/${permit_id}/submit"
              payload: {}
              as: Carrier
              as_user_id: "${carrier_id}"
          trigger:
            - call: "POST /permits/${permit_id}/issue"
              payload: {}
              as: PermitOfficer
              captures: { err: $.data.error_id }
          assert:
            - "response error_id == ERR_INVALID_PERMIT_STATE"
            - "response HTTP status == 409 (not 402)"

      - name: submit_annual_superload_beats_unpaid_fees
        grounds:
          - validations[priority=14]
          - validations[priority=24]
        distinguishing_aspect: >-
          On POST submit an ANNUAL permit whose load is SUPERLOAD, cited to a carrier
          with unpaid fees, fails both the annual-superload constraint (priority 14)
          and the unpaid-fees fiscal check (priority 24); ERR_ANNUAL_SUPERLOAD_FORBIDDEN
          wins — category pair {business_constraint, business_fiscal}, distinct from
          the {state, business_fiscal} pair.
        test_recipe:
          setup:
            - "A carrier with unpaid_fee_balance_cents 100000 (from one UPHELD MINOR violation on a throwaway DRAFT permit)."
            - "A second ANNUAL permit with SUPERLOAD dimensions (gross 210000) and one route segment."
          setup_api_calls:
            - call: "POST /carriers"
              payload: { legal_name: "Owing Freight", usdot_number: "USDOT-PP2" }
              as: DOTAdmin
              captures: { carrier_id: $.data.id }
            - call: "POST /permits"
              payload: { carrier_id: "${carrier_id}", permit_type: "SINGLE_TRIP", length_in: 900, width_in: 100, height_in: 100, front_overhang_in: 0, rear_overhang_in: 0, gross_weight_lbs: 120000, num_axles: 9, valid_from: "2026-06-01T00:00:00Z", valid_until: "2026-06-30T00:00:00Z" }
              as: Carrier
              as_user_id: "${carrier_id}"
              captures: { p_throwaway_id: $.data.id }
            - call: "POST /violations"
              payload: { permit_id: "${p_throwaway_id}", violation_type: "OVER_DIMENSION", severity: "MINOR" }
              as: EnforcementOfficer
              captures: { v_id: $.data.id }
            - call: "POST /violations/${v_id}/uphold"
              payload: {}
              as: EnforcementOfficer
            - call: "POST /permits"
              payload: { carrier_id: "${carrier_id}", permit_type: "ANNUAL", length_in: 900, width_in: 100, height_in: 100, front_overhang_in: 0, rear_overhang_in: 0, gross_weight_lbs: 210000, num_axles: 13, valid_from: "2026-06-01T00:00:00Z", valid_until: "2026-12-31T00:00:00Z" }
              as: Carrier
              as_user_id: "${carrier_id}"
              captures: { permit_id: $.data.id }
            - call: "POST /permits/${permit_id}/route-segments"
              payload: { sequence_index: 1, highway_id: "I-80", from_milepost: 0, to_milepost: 10 }
              as: Carrier
              as_user_id: "${carrier_id}"
          trigger:
            - call: "POST /permits/${permit_id}/submit"
              payload: {}
              as: Carrier
              as_user_id: "${carrier_id}"
              captures: { err: $.data.error_id }
          assert:
            - "Carrier.${carrier_id}.unpaid_fee_balance_cents == 100000 before the trigger"
            - "response error_id == ERR_ANNUAL_SUPERLOAD_FORBIDDEN"
            - "response HTTP status == 422 (not 402)"

  # ===========================================================================
  - rule_id: boundary_precision_check
    instances:
      - name: superload_weight_ge_200000_boundary
        grounds:
          - calculations.classify_load
          - entities.Permit.fields.classification
        distinguishing_aspect: >-
          classify_load uses gross_weight_lbs >= 200000 for SUPERLOAD: exactly 200000
          classifies SUPERLOAD (199999 would not) — a >= numeric boundary reached via
          POST submit.
        test_recipe:
          setup:
            - "A SINGLE_TRIP permit with gross exactly 200000 and one no-structure route segment."
          setup_api_calls:
            - call: "POST /carriers"
              payload: { legal_name: "Edge Hauling", usdot_number: "USDOT-BP1" }
              as: DOTAdmin
              captures: { carrier_id: $.data.id }
            - call: "POST /permits"
              payload: { carrier_id: "${carrier_id}", permit_type: "SINGLE_TRIP", length_in: 900, width_in: 100, height_in: 100, front_overhang_in: 0, rear_overhang_in: 0, gross_weight_lbs: 200000, num_axles: 13, valid_from: "2026-06-01T00:00:00Z", valid_until: "2026-06-30T00:00:00Z" }
              as: Carrier
              as_user_id: "${carrier_id}"
              captures: { permit_id: $.data.id }
            - call: "POST /permits/${permit_id}/route-segments"
              payload: { sequence_index: 1, highway_id: "I-80", from_milepost: 0, to_milepost: 10 }
              as: Carrier
              as_user_id: "${carrier_id}"
          trigger:
            - call: "POST /permits/${permit_id}/submit"
              payload: {}
              as: Carrier
              as_user_id: "${carrier_id}"
              captures: { cls: $.data.classification }
          assert:
            - "Permit.${permit_id}.classification == SUPERLOAD"

      - name: empty_bridge_analyses_vacuous_approve
        grounds:
          - validations[priority=16]
          - state_machines.Permit.UNDER_STANDARD_REVIEW_to_APPROVED
        distinguishing_aspect: >-
          A permit whose route crosses zero structures produces an empty BridgeAnalysis
          set, so the all-cleared safety check (priority 15) passes vacuously and
          POST approve succeeds — an empty-collection boundary reached via a distinct
          endpoint (/approve) from the numeric boundary above.
        test_recipe:
          setup:
            - "An OVERWEIGHT permit (gross 120000) with one no-structure segment, under standard review; required_escort_count is 0."
          setup_api_calls:
            - call: "POST /carriers"
              payload: { legal_name: "NoBridge Freight", usdot_number: "USDOT-BP2" }
              as: DOTAdmin
              captures: { carrier_id: $.data.id }
            - call: "POST /permits"
              payload: { carrier_id: "${carrier_id}", permit_type: "SINGLE_TRIP", length_in: 900, width_in: 100, height_in: 100, front_overhang_in: 0, rear_overhang_in: 0, gross_weight_lbs: 120000, num_axles: 9, valid_from: "2026-06-01T00:00:00Z", valid_until: "2026-06-30T00:00:00Z" }
              as: Carrier
              as_user_id: "${carrier_id}"
              captures: { permit_id: $.data.id }
            - call: "POST /permits/${permit_id}/route-segments"
              payload: { sequence_index: 1, highway_id: "I-80", from_milepost: 0, to_milepost: 10 }
              as: Carrier
              as_user_id: "${carrier_id}"
            - call: "POST /permits/${permit_id}/submit"
              payload: {}
              as: Carrier
              as_user_id: "${carrier_id}"
            - call: "GET /bridge-analyses?permit_id=${permit_id}"
              payload: {}
              as: PermitOfficer
              captures: { ba_total: $.data }
            - call: "POST /permits/${permit_id}/begin-review"
              payload: {}
              as: PermitOfficer
          trigger:
            - call: "POST /permits/${permit_id}/approve"
              payload: {}
              as: PermitOfficer
              captures: { st: $.data.status }
          assert:
            - "GET /bridge-analyses?permit_id=${permit_id} returns total_count == 0"
            - "Permit.${permit_id}.status == APPROVED"

  # ===========================================================================
  - rule_id: cross_entity_state_dependency
    instances:
      - name: approve_requires_all_bridges_cleared
        grounds:
          - state_machines.Permit.UNDER_STANDARD_REVIEW_to_APPROVED
          - entities.BridgeAnalysis.fields.status
          - validations[priority=16]
        distinguishing_aspect: >-
          Permit APPROVE is gated on the state of a different entity: with one
          BridgeAnalysis still REQUESTED (unreviewed), approve fails with
          ERR_BRIDGE_ANALYSIS_INCOMPLETE — entity pair Permit<-BridgeAnalysis.
        test_recipe:
          setup:
            - "An OVERWEIGHT permit crossing a structure, under standard review, with its BridgeAnalysis still REQUESTED (never reviewed)."
          setup_api_calls:
            - call: "POST /carriers"
              payload: { legal_name: "Gate Hauling", usdot_number: "USDOT-CE1" }
              as: DOTAdmin
              captures: { carrier_id: $.data.id }
            - call: "POST /structures"
              payload: { name: "Span 200c", highway_id: "I-40", milepost: 2, rated_capacity_tonnage: 200, dead_load_tonnage: 40 }
              as: DOTAdmin
              captures: { structure_id: $.data.id }
            - call: "POST /permits"
              payload: { carrier_id: "${carrier_id}", permit_type: "SINGLE_TRIP", length_in: 900, width_in: 100, height_in: 100, front_overhang_in: 0, rear_overhang_in: 0, gross_weight_lbs: 120000, num_axles: 9, valid_from: "2026-06-01T00:00:00Z", valid_until: "2026-06-30T00:00:00Z" }
              as: Carrier
              as_user_id: "${carrier_id}"
              captures: { permit_id: $.data.id }
            - call: "POST /permits/${permit_id}/route-segments"
              payload: { sequence_index: 1, highway_id: "I-40", from_milepost: 0, to_milepost: 10, structure_id: "${structure_id}", planned_cross_start_utc: "2026-06-05T10:00:00Z", planned_cross_end_utc: "2026-06-05T10:30:00Z" }
              as: Carrier
              as_user_id: "${carrier_id}"
            - call: "POST /permits/${permit_id}/submit"
              payload: {}
              as: Carrier
              as_user_id: "${carrier_id}"
            - call: "POST /permits/${permit_id}/begin-review"
              payload: {}
              as: PermitOfficer
          trigger:
            - call: "POST /permits/${permit_id}/approve"
              payload: {}
              as: PermitOfficer
              captures: { err: $.data.error_id }
          assert:
            - "response error_id == ERR_BRIDGE_ANALYSIS_INCOMPLETE"
            - "Permit.${permit_id}.status == UNDER_STANDARD_REVIEW (unchanged)"

      - name: confirm_requires_pilot_available
        grounds:
          - state_machines.EscortAssignment.PENDING_to_CONFIRMED
          - entities.PilotCar.fields.status
          - validations[priority=20]
        distinguishing_aspect: >-
          EscortAssignment CONFIRM is gated on PilotCar.status: an OUT_OF_SERVICE
          pilot car makes confirm fail with ERR_PILOT_CAR_UNAVAILABLE — entity pair
          EscortAssignment<-PilotCar (different from Permit<-BridgeAnalysis).
        test_recipe:
          setup:
            - "An OUT_OF_SERVICE pilot car; a permit with a PENDING escort assignment referencing it."
          setup_api_calls:
            - call: "POST /carriers"
              payload: { legal_name: "Escort Gate Co", usdot_number: "USDOT-CE2" }
              as: DOTAdmin
              captures: { carrier_id: $.data.id }
            - call: "POST /pilot-cars"
              payload: { company_name: "Down Escorts", cert_number: "PC-CE2", status: "OUT_OF_SERVICE" }
              as: DOTAdmin
              captures: { pilot_id: $.data.id }
            - call: "POST /permits"
              payload: { carrier_id: "${carrier_id}", permit_type: "SINGLE_TRIP", length_in: 900, width_in: 100, height_in: 100, front_overhang_in: 0, rear_overhang_in: 0, gross_weight_lbs: 120000, num_axles: 9, valid_from: "2026-06-01T00:00:00Z", valid_until: "2026-06-30T00:00:00Z" }
              as: Carrier
              as_user_id: "${carrier_id}"
              captures: { permit_id: $.data.id }
            - call: "POST /permits/${permit_id}/escort-assignments"
              payload: { pilot_car_id: "${pilot_id}", role: "FRONT", window_start_utc: "2026-06-05T10:00:00Z", window_end_utc: "2026-06-05T12:00:00Z" }
              as: Carrier
