  # ==========================================================================
  # Rule 7 — Cross-entity state dependencies across different entity pairs
  # ==========================================================================
  - rule_id: cross_entity_state_dependency
    instances:
      - name: order_submit_depends_on_shipping_state_rule
        grounds:
          - validations[priority=13]
          - entities.Order.fields.fulfillment_status
          - entities.ShippingStateRule.fields.allows_dtc
        distinguishing_aspect: |
          Entity pair (Order, ShippingStateRule): the DRAFT->PICKING transition
          on Order is gated by ShippingStateRule[ship_to_state_code].allows_dtc
          being true. A state rule change (allows_dtc flipped to false) blocks
          the Order transition without any change to the Order itself.
        test_recipe:
          setup:
            - "SKU, lot, Member ATTESTED"
            - "ShippingStateRule NV: allows_dtc=true initially"
            - "DRAFT DTC Order to NV"
            - "Then update ShippingStateRule NV: allows_dtc=false (via re-creation; for this scaffold we model rule update via a fresh POST with new state_code OR we model a PUT — see NOTE)"
            - "NOTE: scaffold does not currently expose a state-rule UPDATE endpoint; we engineer the cross-entity dependency differently: pick ship_to_state_code='UT' whose rule is created with allows_dtc=false BEFORE order submission."
          setup_api_calls:
            - call: "POST /nabs/_clock/set_current_utc"
              payload: { to_iso8601: "2026-05-01T00:00:00Z" }
              as: PlatformAdmin
            - call: "POST /nabs/categories"
              payload: { code: "tea13", display_name: "Tea13", compliance_class: "STANDARD" }
              as: PlatformAdmin
              captures:
                cat13_id: "$.data.id"
            - call: "POST /nabs/skus"
              payload: { category_id: "${cat13_id}", sku_code: "sku-13", title: "S13", base_price_cents: 500, abv_basis_points: 0 }
              as: PlatformAdmin
              captures:
                sku13_id: "$.data.id"
            - call: "POST /nabs/skus/${sku13_id}/lots"
              payload: { lot_code: "L13", qty_received: 10, unit_cost_cents: 100, expires_on: "2027-01-01" }
              as: PlatformAdmin
            - call: "POST /nabs/members"
              payload: { email: "m13@x.com", full_name: "M13", date_of_birth: "1990-01-01", home_state_code: "CA" }
              as: PlatformAdmin
              captures:
                member13_id: "$.data.id"
            - call: "POST /nabs/shipping-state-rules"
              payload: { state_code: "UT", allows_dtc: false, min_age_years: 21, abv_cap_basis_points: 500, surcharge_cents_per_order: 0, tax_rate_bps: 0 }
              as: PlatformAdmin
            - call: "POST /nabs/orders"
              payload: { member_id: "${member13_id}", channel: "DTC", ship_to_state_code: "UT" }
              as: Member
              as_user_id: "${member13_id}"
              captures:
                order13_id: "$.data.id"
            - call: "POST /nabs/orders/${order13_id}/lines"
              payload: { sku_id: "${sku13_id}", qty: 1 }
              as: Member
              as_user_id: "${member13_id}"
            - call: "GET /nabs/orders/${order13_id}"
              as: Member
              as_user_id: "${member13_id}"
              captures:
                order13_v: "$.data.version"
          trigger:
            - call: "POST /nabs/orders/${order13_id}/submit"
              payload: { expected_order_version: "${order13_v}" }
              as: Member
              as_user_id: "${member13_id}"
              captures:
                err13: "$.data.error_id"
          assert:
            - "captured err13 == 'ERR_DTC_STATE_PROHIBITED'"
            - "Order.${order13_id}.fulfillment_status == 'DRAFT' (unchanged)"

      - name: seat_confirm_depends_on_tasting_event_status
        grounds:
          - validations[priority=10]
          - state_machines.TastingSeat.RESERVED_to_CONFIRMED
          - entities.TastingEvent.fields.status
        distinguishing_aspect: |
          Entity pair (TastingSeat, TastingEvent): the RESERVED->CONFIRMED
          transition on TastingSeat is gated by TastingEvent.status being in
          {PUBLISHED, RESCHEDULED}. Once the event transitions to LOCKED (via
          clock), seat confirm fails — different entity pair from instance 1.
        test_recipe:
          setup:
            - "TastingEvent capacity=5, starts_at = 2026-05-02T10:00:00Z (24h after initial clock)"
            - "Event PUBLISHED; one seat RESERVED for member m14"
            - "Advance clock to 2026-05-01T11:00:00Z — event transitions PUBLISHED -> LOCKED (LOCKED at starts_at - 24h)"
          setup_api_calls:
            - call: "POST /nabs/_clock/set_current_utc"
              payload: { to_iso8601: "2026-04-30T09:00:00Z" }
              as: PlatformAdmin
            - call: "POST /nabs/categories"
              payload: { code: "tea14", display_name: "Tea14", compliance_class: "STANDARD" }
              as: PlatformAdmin
              captures:
                cat14_id: "$.data.id"
            - call: "POST /nabs/skus"
              payload: { category_id: "${cat14_id}", sku_code: "sku-14", title: "S14", base_price_cents: 100, abv_basis_points: 0 }
              as: PlatformAdmin
              captures:
                sku14_id: "$.data.id"
            - call: "POST /nabs/skus/${sku14_id}/lots"
              payload: { lot_code: "L14", qty_received: 50, unit_cost_cents: 10, expires_on: "2027-01-01" }
              as: PlatformAdmin
            - call: "POST /nabs/members"
              payload: { email: "host14@x.com", full_name: "H14", date_of_birth: "1980-01-01", home_state_code: "CA" }
              as: PlatformAdmin
              captures:
                host14_id: "$.data.id"
            - call: "POST /nabs/members"
              payload: { email: "m14@x.com", full_name: "M14", date_of_birth: "1990-01-01", home_state_code: "CA" }
              as: PlatformAdmin
              captures:
                member14_id: "$.data.id"
            - call: "POST /nabs/tasting-events"
              payload: { title: "T14", host_member_id: "${host14_id}", starts_at: "2026-05-02T10:00:00Z", ends_at: "2026-05-02T12:00:00Z", capacity: 5, flight_price_cents: 1000, min_attendee_age_years: 0 }
              as: ShopStaff
              captures:
                ev14_id: "$.data.id"
            - call: "POST /nabs/tasting-events/${ev14_id}/flight-items"
              payload: { sku_id: "${sku14_id}", pour_size_ml: 30, sequence_no: 1 }
              as: ShopStaff
            - call: "POST /nabs/tasting-events/${ev14_id}/publish"
              as: ShopStaff
            - call: "GET /nabs/tasting-events/${ev14_id}"
              as: ShopStaff
              captures:
                ev14_v: "$.data.version"
            - call: "POST /nabs/tasting-events/${ev14_id}/seats"
              payload: { member_id: "${member14_id}", expected_event_version: "${ev14_v}" }
              as: Member
              as_user_id: "${member14_id}"
              captures:
                seat14_id: "$.data.id"
            # Advance clock past LOCKED threshold (starts_at - 24h = 2026-05-01T10:00)
            - call: "POST /nabs/_clock/set_current_utc"
              payload: { to_iso8601: "2026-05-01T11:00:00Z" }
              as: PlatformAdmin
            - call: "GET /nabs/tasting-events/${ev14_id}"
              as: ShopStaff
              captures:
                ev14_status: "$.data.status"
          trigger:
            - call: "POST /nabs/tasting-seats/${seat14_id}/confirm"
              as: Member
              as_user_id: "${member14_id}"
              captures:
                err14: "$.data.error_id"
          assert:
            - "TastingEvent.status == 'LOCKED'"
            - "captured err14 == 'ERR_BOOKING_WINDOW_CLOSED'"
            - "TastingSeat.${seat14_id}.status == 'RESERVED' (unchanged)"

  # ==========================================================================
  # Rule 8 — Resource temporal-overlap conflicts across different interval semantics
  # ==========================================================================
  - rule_id: resource_temporal_overlap
    instances:
      - name: tasting_event_time_range_validation_half_open
        grounds:
          - validations[priority=9]
          - entities.TastingEvent.fields.starts_at
          - entities.TastingEvent.fields.ends_at
        distinguishing_aspect: |
          Interval semantics (a) — strict inequality within a single resource:
          ends_at MUST be strictly after starts_at (half-open [start, end)
          where degenerate [t,t) is invalid). Boundary: ends_at == starts_at
          must be rejected.
        test_recipe:
          setup:
            - "Member host"
          setup_api_calls:
            - call: "POST /nabs/_clock/set_current_utc"
              payload: { to_iso8601: "2026-05-01T00:00:00Z" }
              as: PlatformAdmin
            - call: "POST /nabs/members"
              payload: { email: "host15@x.com", full_name: "H15", date_of_birth: "1980-01-01", home_state_code: "CA" }
              as: PlatformAdmin
              captures:
                host15_id: "$.data.id"
          trigger:
            - call: "POST /nabs/tasting-events"
              payload: { title: "T15", host_member_id: "${host15_id}", starts_at: "2026-05-10T10:00:00Z", ends_at: "2026-05-10T10:00:00Z", capacity: 5, flight_price_cents: 1000, min_attendee_age_years: 0 }
              as: ShopStaff
              captures:
                err15: "$.data.error_id"
          assert:
            - "captured err15 == 'ERR_INVALID_TIME_RANGE'"

      - name: club_subscription_billing_catch_up_multi_cycle_skip
        grounds:
          - calculations.subscription_billing_advance
          - entities.ClubSubscription.fields.next_billing_on
        distinguishing_aspect: |
          Interval semantics (b) — aggregate cadence-based window advancement:
          when the clock has advanced multiple cadence periods past
          next_billing_on, the algorithm MUST skip forward by whole cadence
          units until next_billing_on >= today (no partial-cycle drift).
          Different semantic from (a): this is not overlap rejection but
          aggregated interval arithmetic on a billing resource.
        test_recipe:
          setup:
            - "ClubPlan MONTHLY cadence"
            - "ClubSubscription ACTIVE, next_billing_on = 2026-01-15"
            - "Clock advanced to 2026-05-01 (more than 3 months past next_billing_on)"
            - "On SUCCEEDED billing, next_billing_on must advance to 2026-05-15 (the first 15th >= today)"
          setup_api_calls:
            - call: "POST /nabs/_clock/set_current_utc"
              payload: { to_iso8601: "2026-01-01T00:00:00Z" }
              as: PlatformAdmin
            - call: "POST /nabs/categories"
              payload: { code: "tea16", display_name: "Tea16", compliance_class: "STANDARD" }
              as: PlatformAdmin
              captures:
                cat16_id: "$.data.id"
            - call: "POST /nabs/club-plans"
              payload: { code: "PLAN-C", cadence: "MONTHLY", bottles_per_shipment: 1, price_cents_per_cycle: 1000, allowed_category_ids: ["${cat16_id}"], discount_bps_on_retail: 0, max_active_subscriptions: 10 }
              as: PlatformAdmin
              captures:
                plan16_id: "$.data.id"
                plan16_v: "$.data.version"
            - call: "POST /nabs/members"
              payload: { email: "m16@x.com", full_name: "M16", date_of_birth: "1990-01-01", home_state_code: "CA" }
              as: PlatformAdmin
              captures:
                member16_id: "$.data.id"
            - call: "POST /nabs/club-subscriptions"
              payload: { plan_id: "${plan16_id}", member_id: "${member16_id}", started_on: "2026-01-15", expected_plan_version: "${plan16_v}", trial_days: 0 }
              as: Member
              as_user_id: "${member16_id}"
              captures:
                sub16_id: "$.data.id"
                sub16_billing_init: "$.data.next_billing_on"
            # Advance clock to 2026-05-01 — multiple MONTHLY cycles past
            - call: "POST /nabs/_clock/set_current_utc"
              payload: { to_iso8601: "2026-05-01T00:00:00Z" }
              as: PlatformAdmin
          trigger:
            - call: "POST /nabs/_billing/simulate"
              payload: { club_subscription_id: "${sub16_id}", outcome: "SUCCEEDED" }
              as: PlatformAdmin
            - call: "GET /nabs/club-subscriptions/${sub16_id}"
              as: Member
              as_user_id: "${member16_id}"
              captures:
                sub16_billing_post: "$.data.next_billing_on"
          assert:
            - "Initial next_billing_on == '2026-02-15' (started 2026-01-15 + 1mo at creation time 2026-01-01? No: subscription created at clock=2026-01-01 with started_on=2026-01-15 → first billing is 2026-02-15)"
            # After SUCCEEDED at clock=2026-05-01, advance by 1mo steps: 2026-02-15, 03-15, 04-15, 05-15 (>= today)
            - "Post-billing next_billing_on == '2026-05-15'"

  # ==========================================================================
  # Rule 9 — Compensating-action invariants across different conserved quantities
  # ==========================================================================
  - rule_id: compensating_invariant
    instances:
      - name: order_submit_cancel_conserves_inventory
        grounds:
          - state_machines.Order.PICKING_to_CANCELLED
          - calculations.lot_allocation_walk
          - entities.InventoryLot.fields.qty_remaining
        distinguishing_aspect: |
          Conserved quantity = sum of InventoryLot.qty_remaining for the SKU
          across all lots. Forward action (submit) decrements it; compensating
          action (cancel from PICKING) MUST restore it to the exact pre-submit
          value. Invariant: sum(qty_remaining) after cancel == sum(qty_remaining)
          before submit.
        test_recipe:
          setup:
            - "SKU sku-17 base=1000 abv=0; lot L17 qty_received=20"
            - "Member m17 ATTESTED; ShippingStateRule CA allows_dtc=true tax=0 surcharge=0"
            - "Order DTC qty=6"
