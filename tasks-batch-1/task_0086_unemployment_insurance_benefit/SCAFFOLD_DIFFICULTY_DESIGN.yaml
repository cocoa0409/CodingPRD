        distinguishing_aspect: |
          Pair `state` (priority 7, ERR_INVALID_STATE) vs `business_constraint`
          (priority 10, ERR_WORK_SEARCH_INSUFFICIENT): a week already INELIGIBLE that
          also has zero work-search contacts must return ERR_INVALID_STATE (state
          checked first), not the work-search error.
        test_recipe:
          setup:
            - "Claim S MONETARILY_ELIGIBLE; a week adjudicated INELIGIBLE (terminal-ish on the adjudication axis); no work-search contacts logged."
          setup_api_calls:
