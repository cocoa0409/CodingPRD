              captures: { zed_id: $.data.id }
            - call: "POST /role-assignments"
              payload: { employee_id: "${ana_id}", job_role_id: "${server_role_id}", effective_from: "2026-07-01T00:00:00Z", tip_credit_notice_acknowledged_at: "2026-07-01T00:00:00Z", is_primary: true }
              as: PayrollAdmin
              captures: { ana_server_id: $.data.id }
          trigger:
            - call: "POST /pay-periods"
              payload: { location_id: "${loc_id}", start_date: "2026-08-03T00:00:00Z", end_date: "2026-08-10T00:00:00Z" }
              as: PayrollPreparer
              captures: { err_long: $.data.error_id }
            - call: "POST /pay-periods"
              payload: { location_id: "${loc_id}", start_date: "2026-08-03T00:00:00Z", end_date: "2026-08-08T00:00:00Z" }
              as: PayrollPreparer
              captures: { err_short: $.data.error_id }
            - call: "POST /pay-periods"
              payload: { location_id: "${loc_id}", start_date: "2026-08-03T00:00:00Z", end_date: "2026-08-09T00:00:00Z" }
              as: PayrollPreparer
              captures: { p1_id: $.data.id }
            - call: "POST /role-assignments"
              payload: { employee_id: "${ana_id}", job_role_id: "${server_role_id}", effective_from: "2026-08-01T00:00:00Z", is_primary: false }
