      - Investor A onboarded.
      - ExchangeFile A with relinquished_closed_on 2026-08-05 under THREE_PROPERTY, so identification_deadline is 2026-09-19T23:59:59.999Z and exchange_deadline is 2027-02-01T23:59:59.999Z.
