            - "trigger call 2 HTTP status == 200: outstanding_obligation_cents == 7000000, settled_cents == 5000000, allocation_round == 1, last_allocated_cents == 5000000"
            - "after trigger call 2: allocation_lines == [{jurisdiction_code: DE, line_cents: 2142858}, {jurisdiction_code: AT, line_cents: 1428571}, {jurisdiction_code: CH, line_cents: 1428571}]   # round_half_up per line gives 2142857/1428571/1428571 = 4999999, then the +1 residue lands entirely on DE"
            - "trigger call 3 HTTP status == 200: outstanding_obligation_cents == 6999998, settled_cents == 5000002, allocation_round == 2, last_allocated_cents == 2"
            - "after trigger call 3: allocation_lines == [{jurisdiction_code: DE, line_cents: 0}, {jurisdiction_code: AT, line_cents: 1}, {jurisdiction_code: CH, line_cents: 1}]   # per-line rounding gives 2/1/1 = 4, so the residue is -1 and DE absorbs it down to 0; sum is still exactly 2"
            - "trigger call 4 HTTP status == 422 and data.error_id == ERR_REVERSAL_AMOUNT_MISMATCH   # last_allocated_cents is 2, not 5000000; counters unchanged at 6999998 / 5000002 / round 2"
            - "trigger call 5 HTTP status == 200: outstanding_obligation_cents == 7000000, settled_cents == 5000000, allocation_round == 1, last_allocated_cents == 0   # REVERSE is the exact inverse of the 2-cent allocation"
            - "trigger call 6 HTTP status == 422 and data.error_id == ERR_REVERSAL_AMOUNT_MISMATCH   # two REVERSEs in a row are refused because last_allocated_cents was reset to 0"
            - "trigger call 7 HTTP status == 422 and data.error_id == ERR_SETTLEMENT_EXCEEDS_OUTSTANDING   # 7000001 > outstanding 7000000; counters unchanged"
            - "trigger call 8 HTTP status == 200: outstanding_obligation_cents == 0, settled_cents == 12000000, allocation_round == 2, last_allocated_cents == 7000000"
            - "after trigger call 8: allocation_lines == [{jurisdiction_code: DE, line_cents: 3000000}, {jurisdiction_code: AT, line_cents: 2000000}, {jurisdiction_code: CH, line_cents: 2000000}]   # exact split, residue 0"
            - "at every point in the sequence, including after each 422: outstanding_obligation_cents + settled_cents == 12000000 and 0 <= outstanding_obligation_cents <= 12000000"
            - "ClosurePlan.${l_plan}.original_obligation_cents == 12000000 and ClosurePlan.${l_plan}.state == APPROVED   # allocations never move the plan state"

      - name: nested_exposure_units_survive_a_confirm_suspend_lift_revert_round_trip_with_depth_weighted_deltas
        grounds:
          - calculations.nested_exposure_rollup
          - calculations.nested_chain_depth
          - state_machines.NestedRelationship.DISCLOSED_to_CONFIRMED
          - state_machines.NestedRelationship.CONFIRMED_to_SUSPENDED
          - state_machines.NestedRelationship.SUSPENDED_to_CONFIRMED
          - state_machines.NestedRelationship.CONFIRMED_to_DISCLOSED
          - entities.RespondentBank.fields.nested_exposure_units
        distinguishing_aspect: |
          A different conserved quantity from the settlement instance: nested_exposure_units =
          sum(state_weight * depth), so every delta is scaled by the row's depth and the two rows
          here deliberately sit at different depths (2 via a chain through a known RespondentBank,
          1 for a leaf institution). CONFIRM must add 2*depth (+4 then +2), the RESTRICT cascade must
          add nothing at all because CONFIRMED and SUSPENDED share weight 3, LIFT must likewise add
          nothing, and the two REVERTs must subtract exactly 2*depth each to land back on the
          baseline 3. disclosed_nested_count, by contrast, is NOT conserved across the suspension: it
          counts DISCLOSED and CONFIRMED only, so it drops to 0 while units stay at 9 - an
          implementation that reuses one counter for both, or that applies a flat +-2 per confirm,
          diverges immediately.
        test_recipe:
          setup: >
            JurisdictionProfiles DE (basel_aml_index 4.0), AT (3.0) and CH (3.0), all PERMITTED,
            fatf_listing NONE, secrecy_flag false, corridor_risk_weight 1.00,
            max_permitted_risk_rating HIGH. Respondent Z is created (home AT,
            nested_activity_permitted true) and left in PROSPECT with one DISCLOSED
            NestedRelationship of its own to a CH leaf institution, so any chain entering Z extends
            one more hop. Respondent M is then created (home DE, expected_monthly_volume_usd
            5000000.00, expected_monthly_count 150, nested_activity_permitted true), licensed
            ACTIVE/GOOD_STANDING, with one VERIFIED 100.00% DE natural-person owner and two
            QUESTIONNAIRE-sourced (therefore DISCLOSED) nested rows: R1 pointing at Z via
            downstream_respondent_bank_id, whose chain_depth is 1 + 1 = 2 because Z has a live row,
            and R2 pointing at a CH leaf with depth 1. Baseline rollup:
            nested_exposure_units = 1*2 + 1*1 = 3, disclosed_nested_count 2,
            undisclosed_nested_count 0, max_nested_depth 2. The questionnaire declares nested
            activity with eight self_rating 3 rows assessed ONBOARDING_PROVISIONAL (control_score
            60.00, control_credit 0.2250), so inherent_risk_score = 8.00 (jurisdiction) + 0
            (ownership) + min(20, 0 + 8 for max_nested_depth >= 2) + min(16, 6 + 2 for permitted
            nesting) = 24.00 and residual = round(24.00*0.7750, 2) = 18.60, risk_rating LOW, and the
            committee approves at clock 2026-08-01T00:00:00Z.
          setup_api_calls:
            - { call: "POST /correspondent-banking/jurisdiction-profiles", payload: { jurisdiction_code: "DE", name: "Germany", basel_aml_index: 4.0, corridor_risk_weight: 1.00, sanctions_status: "PERMITTED", fatf_listing: "NONE", secrecy_flag: false, max_permitted_risk_rating: "HIGH" }, as: PlatformAdmin }
            - { call: "POST /correspondent-banking/jurisdiction-profiles", payload: { jurisdiction_code: "AT", name: "Austria", basel_aml_index: 3.0, corridor_risk_weight: 1.00, sanctions_status: "PERMITTED", fatf_listing: "NONE", secrecy_flag: false, max_permitted_risk_rating: "HIGH" }, as: PlatformAdmin }
            - { call: "POST /correspondent-banking/jurisdiction-profiles", payload: { jurisdiction_code: "CH", name: "Switzerland", basel_aml_index: 3.0, corridor_risk_weight: 1.00, sanctions_status: "PERMITTED", fatf_listing: "NONE", secrecy_flag: false, max_permitted_risk_rating: "HIGH" }, as: PlatformAdmin }
            - { call: "POST /correspondent-banking/respondents", payload: { legal_name: "Alpenland Regionalbank AG", swift_bic: "ALPRATWWXXX", home_jurisdiction_code: "AT", relationship_manager_user_id: "user-rm-01", expected_monthly_volume_usd: 500000.00, expected_monthly_count: 20, nested_activity_permitted: true }, as: FIGRelationshipManager, as_user_id: "user-rm-01", captures: { z_id: $.data.id } }
            - { call: "POST /correspondent-banking/respondents/${z_id}/nested-relationships", payload: { downstream_institution_name: "Kleinbank Sued eG", downstream_jurisdiction_code: "CH", relationship_type: "DOWNSTREAM_CORRESPONDENT", discovery_source: "QUESTIONNAIRE" }, as: ComplianceAnalyst, as_user_id: "user-analyst-01", captures: { z_row: $.data.id } }
            - { call: "POST /correspondent-banking/respondents", payload: { legal_name: "Mainkontor Bank AG", swift_bic: "MAINDEF0XXX", home_jurisdiction_code: "DE", relationship_manager_user_id: "user-rm-01", expected_monthly_volume_usd: 5000000.00, expected_monthly_count: 150, nested_activity_permitted: true }, as: FIGRelationshipManager, as_user_id: "user-rm-01", captures: { m_id: $.data.id } }
            - { call: "POST /correspondent-banking/respondents/${m_id}/licensing-verification", payload: { license_status: "ACTIVE", regulator_standing: "GOOD_STANDING", regulator_name: "BaFin" }, as: ComplianceAnalyst, as_user_id: "user-analyst-01" }
            - { call: "POST /correspondent-banking/respondents/${m_id}/beneficial-owners", payload: { owner_name: "Mainkontor Holding", owner_type: "NATURAL_PERSON", ownership_pct: 100.00, country_of_residence: "DE", is_pep: false }, as: ComplianceAnalyst, as_user_id: "user-analyst-01", captures: { m_own: $.data.id } }
            - { call: "POST /correspondent-banking/beneficial-owners/${m_own}/verification", payload: { action: "VERIFY" }, as: ComplianceAnalyst, as_user_id: "user-analyst-01" }
            - { call: "POST /correspondent-banking/respondents/${m_id}/nested-relationships", payload: { downstream_institution_name: "Alpenland Regionalbank AG", downstream_jurisdiction_code: "AT", relationship_type: "DOWNSTREAM_CORRESPONDENT", discovery_source: "QUESTIONNAIRE", downstream_respondent_bank_id: "${z_id}" }, as: ComplianceAnalyst, as_user_id: "user-analyst-01", captures: { r1: $.data.id } }
            - { call: "POST /correspondent-banking/respondents/${m_id}/nested-relationships", payload: { downstream_institution_name: "Alpenbank Filiale Basel", downstream_jurisdiction_code: "CH", relationship_type: "DOWNSTREAM_CORRESPONDENT", discovery_source: "QUESTIONNAIRE" }, as: ComplianceAnalyst, as_user_id: "user-analyst-01", captures: { r2: $.data.id } }
            - { call: "GET /correspondent-banking/respondents/${m_id}", as: ComplianceAnalyst, as_user_id: "user-analyst-01", captures: { mv0: $.data.version } }
            - { call: "POST /correspondent-banking/respondents/${m_id}/questionnaires", payload: { questionnaire_version: 1, expected_respondent_version: "${mv0}", declared_nested_activity: true, declared_downstream_count: 2 }, as: RespondentContact, as_user_id: "${m_id}", captures: { mq: $.data.id } }
            - { call: "POST /correspondent-banking/questionnaires/${mq}/control-assessments", payload: { control_domain: "GOVERNANCE", self_rating: 3 }, as: RespondentContact, as_user_id: "${m_id}" }
            - { call: "POST /correspondent-banking/questionnaires/${mq}/control-assessments", payload: { control_domain: "KYC_ONBOARDING", self_rating: 3 }, as: RespondentContact, as_user_id: "${m_id}" }
            - { call: "POST /correspondent-banking/questionnaires/${mq}/control-assessments", payload: { control_domain: "TRANSACTION_MONITORING", self_rating: 3 }, as: RespondentContact, as_user_id: "${m_id}" }
            - { call: "POST /correspondent-banking/questionnaires/${mq}/control-assessments", payload: { control_domain: "SANCTIONS_SCREENING", self_rating: 3 }, as: RespondentContact, as_user_id: "${m_id}" }
            - { call: "POST /correspondent-banking/questionnaires/${mq}/control-assessments", payload: { control_domain: "PEP_HANDLING", self_rating: 3 }, as: RespondentContact, as_user_id: "${m_id}" }
            - { call: "POST /correspondent-banking/questionnaires/${mq}/control-assessments", payload: { control_domain: "TRAINING", self_rating: 3 }, as: RespondentContact, as_user_id: "${m_id}" }
            - { call: "POST /correspondent-banking/questionnaires/${mq}/control-assessments", payload: { control_domain: "AUDIT", self_rating: 3 }, as: RespondentContact, as_user_id: "${m_id}" }
            - { call: "POST /correspondent-banking/questionnaires/${mq}/control-assessments", payload: { control_domain: "NESTED_CONTROLS", self_rating: 3 }, as: RespondentContact, as_user_id: "${m_id}" }
            - { call: "POST /correspondent-banking/questionnaires/${mq}/submission", payload: {}, as: RespondentContact, as_user_id: "${m_id}" }
            - { call: "POST /correspondent-banking/questionnaires/${mq}/assessment-decision", payload: { action: "ASSESS", variant: "ONBOARDING_PROVISIONAL" }, as: ComplianceAnalyst, as_user_id: "user-analyst-01" }
            - { call: "POST /correspondent-banking/respondents/${m_id}/risk-assessment", payload: { variant: "ONBOARDING_PROVISIONAL" }, as: ComplianceAnalyst, as_user_id: "user-analyst-01" }
            - { call: "POST /correspondent-banking/respondents/${m_id}/approval", payload: { action: "APPROVE" }, as: CommitteeApprover, as_user_id: "user-committee-01" }
          trigger:
            - { call: "POST /correspondent-banking/nested-relationships/${r1}/adjudication", payload: { action: "CONFIRM" }, as: ComplianceAnalyst, as_user_id: "user-analyst-01" }
            - { call: "POST /correspondent-banking/nested-relationships/${r2}/adjudication", payload: { action: "CONFIRM" }, as: ComplianceAnalyst, as_user_id: "user-analyst-01" }
            - { call: "POST /correspondent-banking/respondents/${m_id}/restriction", payload: { action: "RESTRICT", restriction_reason: "OFFICER_ACTION", payment_posture: "SCREEN_ONLY" }, as: SanctionsOfficer, as_user_id: "user-sanctions-01" }
            - { call: "POST /correspondent-banking/respondents/${m_id}/restriction", payload: { action: "LIFT" }, as: SanctionsOfficer, as_user_id: "user-sanctions-01" }
            - { call: "POST /correspondent-banking/nested-relationships/${r1}/adjudication", payload: { action: "REVERT" }, as: ComplianceAnalyst, as_user_id: "user-analyst-01" }
            - { call: "POST /correspondent-banking/nested-relationships/${r2}/adjudication", payload: { action: "REVERT" }, as: ComplianceAnalyst, as_user_id: "user-analyst-01" }
          assert:
            - "before the trigger: NestedRelationship.${r1}.depth == 2 and NestedRelationship.${r2}.depth == 1   # R1's chain runs M -> Z -> Kleinbank because Z's own row is live"
            - "before the trigger: RespondentBank.${m_id}.nested_exposure_units == 3, disclosed_nested_count == 2, undisclosed_nested_count == 0, max_nested_depth == 2"
            - "before the trigger: RespondentBank.${m_id}.inherent_risk_score == 24.00, control_score == 60.00, control_credit == 0.2250, residual_risk_score == 18.60, risk_rating == LOW, dd_state == APPROVED"
            - "trigger call 1 HTTP status == 200: NestedRelationship.${r1}.state == CONFIRMED and RespondentBank.${m_id}.nested_exposure_units == 7   # 3 + 2*depth(2)"
            - "after trigger call 1: disclosed_nested_count == 2 and max_nested_depth == 2   # DISCLOSED and CONFIRMED both count toward disclosed_nested_count"
            - "trigger call 2 HTTP status == 200: NestedRelationship.${r2}.state == CONFIRMED and RespondentBank.${m_id}.nested_exposure_units == 9   # 7 + 2*depth(1)"
            - "trigger call 3 HTTP status == 200: RespondentBank.${m_id}.dd_state == RESTRICTED with restriction_reason OFFICER_ACTION and payment_posture SCREEN_ONLY"
            - "after trigger call 3: NestedRelationship.${r1}.state == SUSPENDED and NestedRelationship.${r2}.state == SUSPENDED and RespondentBank.${m_id}.nested_exposure_units == 9   # CONFIRMED and SUSPENDED share weight 3, so the cascade moves nothing"
            - "after trigger call 3: disclosed_nested_count == 0 and max_nested_depth == 2   # SUSPENDED rows leave the disclosed count but still count for depth"
            - "trigger call 4 HTTP status == 200: RespondentBank.${m_id}.dd_state == APPROVED, restriction_reason is null, payment_posture == SCREEN_ONLY"
            - "after trigger call 4: NestedRelationship.${r1}.state == CONFIRMED and NestedRelationship.${r2}.state == CONFIRMED and nested_exposure_units == 9 and disclosed_nested_count == 2"
            - "trigger call 5 HTTP status == 200: NestedRelationship.${r1}.state == DISCLOSED and RespondentBank.${m_id}.nested_exposure_units == 5   # 9 - 2*depth(2), the exact compensation of call 1"
            - "trigger call 6 HTTP status == 200: NestedRelationship.${r2}.state == DISCLOSED and RespondentBank.${m_id}.nested_exposure_units == 3   # back to the baseline"
            - "after trigger call 6: disclosed_nested_count == 2, undisclosed_nested_count == 0, max_nested_depth == 2 and NestedRelationship.${r1}.depth == 2   # every rollup field is restored, depth included"
            - "after trigger call 6: RespondentBank.${m_id}.inherent_risk_score == 24.00 and residual_risk_score == 18.60   # the rollup fields moved throughout without any risk-assessment being re-run"
            - "RespondentBank.${z_id}.nested_exposure_units == 1 throughout   # the downstream respondent's own rollup is untouched by M's adjudications"
