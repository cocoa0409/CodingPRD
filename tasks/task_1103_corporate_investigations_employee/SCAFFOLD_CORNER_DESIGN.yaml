    - state_machines.RemediationAction
    distinguishing_aspect: 'Case.open_remediation_count tracks the child lifecycle immediately: +1 on create, -1 on WAIVED, and reflects AWAITING_VERIFICATION -> IN_PROGRESS reject without drifting.'
    test_recipe:
      setup:
      - Case REMEDIATION with one action driven OPEN->IN_PROGRESS->AWAITING_VERIFICATION->IN_PROGRESS (rejected once)
      setup_api_calls:
      - call: POST /api/_clock/set_current_utc
