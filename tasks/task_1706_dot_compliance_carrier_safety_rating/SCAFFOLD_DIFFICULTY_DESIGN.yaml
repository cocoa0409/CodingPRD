# =============================================================================
# 1.8 Scaffold Difficulty Design (Test Targeting Index) — 9 rules x 2 instances
# All numeric asserts below were computed by executing the §1.3 formulas.
# Default logical clock at startup is 2026-08-01T00:00:00Z (see /_clock endpoint).
# =============================================================================
scaffold_difficulty_design:
  - rule_id: dual_variant_calc
    instances:
      - name: category_measure_official_vs_provisional
        grounds:
          - calculations.category_measure
          - calculations.percentile_from_measure
          - entities.MeasurementSnapshot.fields.official_measure
          - entities.MeasurementSnapshot.fields.provisional_measure
          - state_machines.InspectionViolation.ACTIVE_to_CHALLENGED
        distinguishing_aspect: |
          Safety-measure domain dual variant: a CHALLENGED violation is counted in
          official_measure but excluded from provisional_measure on the same snapshot
          (official 3.60 vs provisional 1.20 for identical underlying events).
        test_recipe:
          setup:
            - "Carrier fleet_size 10; category VEHICLE_MAINTENANCE threshold 65 benchmark 12.0; one driver; one inspection with two violations occurred 2026-05-01 (sev 8 -> 24 pts, sev 4 -> 12 pts, both time-weight 3 at the 2026-08-01 default clock); first violation is CHALLENGED via a SUBMITTED DataQs challenge"
          setup_api_calls:
            - { call: "POST /safety/carriers", payload: { dot_number: "DOT-1001", legal_name: "Hauler One", fleet_size: 10 }, as: SafetyAdmin, captures: { c_id: $.data.id } }
            - { call: "POST /safety/violation-categories", payload: { category_code: "VEHICLE_MAINTENANCE", display_name: "Vehicle Maintenance", intervention_threshold: 65, benchmark_measure: 12.0 }, as: SafetyAdmin, captures: { cat_id: $.data.id } }
            - { call: "POST /safety/drivers", payload: { carrier_id: "${c_id}", cdl_number: "CDL-1", full_name: "Dan Roe", hire_date: "2025-01-05T00:00:00Z" }, as: SafetyManager, captures: { d_id: $.data.id } }
            - { call: "POST /safety/roadside-inspections", payload: { carrier_id: "${c_id}", driver_id: "${d_id}", report_number: "R-100", inspection_date: "2026-05-01T00:00:00Z", inspection_level: 2, state_code: "CA" }, as: SafetyManager, captures: { i_id: $.data.id } }
            - { call: "POST /safety/inspection-violations", payload: { inspection_id: "${i_id}", category_id: "${cat_id}", violation_code: "396.3", severity_weight: 8, occurred_at: "2026-05-01T00:00:00Z" }, as: SafetyManager, captures: { v1_id: $.data.id } }
            - { call: "POST /safety/inspection-violations", payload: { inspection_id: "${i_id}", category_id: "${cat_id}", violation_code: "396.5", severity_weight: 4, occurred_at: "2026-05-01T00:00:00Z" }, as: SafetyManager, captures: { v2_id: $.data.id } }
            - { call: "POST /safety/dataqs-challenges", payload: { violation_id: "${v1_id}", reason_code: "INCORRECT_DATA", evidence_note: "Wrong trailer number on report" }, as: ComplianceAnalyst, captures: { ch_id: $.data.id } }
          trigger:
            - { call: "POST /safety/measurement-cycles", payload: { carrier_id: "${c_id}" }, as: ComplianceAnalyst }
            - { call: "GET /safety/measurement-snapshots", payload: {}, as: ComplianceAnalyst, captures: { snap_off: "$.data[0].official_measure", snap_prov: "$.data[0].provisional_measure", snap_off_pct: "$.data[0].official_percentile", snap_prov_pct: "$.data[0].provisional_percentile" } }
          assert:
            - "snapshot.official_measure == 3.60 (both violations: (24+12)/10)"
            - "snapshot.provisional_measure == 1.20 (CHALLENGED v1 excluded: 12/10)"
            - "snapshot.official_percentile == 30 and snapshot.provisional_percentile == 10"
            - "snapshot.alerted_official == false and snapshot.alerted_provisional == false (threshold 65)"
            - "violation ${v1_id}.status == CHALLENGED and still counted officially"

      - name: premium_baseline_vs_projected
        grounds:
          - calculations.insurance_premium
          - entities.InsurancePremiumModel.fields.computed_premium_cents
          - entities.InsurancePremiumModel.fields.scenario
        distinguishing_aspect: |
          Fiscal domain dual variant (different entity domain from the safety-measure
          instance): identical carrier data yields 427779 cents under BASELINE
          (rating NONE 1.05, one alerted category, one preventable crash, one HIGH
          driver) and 377778 cents under PROJECTED (assume SATISFACTORY, category
          cleared, crash removed).
        test_recipe:
          setup:
            - "Carrier fleet_size 3, rating NONE; category HOURS_OF_SERVICE threshold 65 benchmark 10.0; one driver with one sev-8 violation occurred 2026-06-01 (24 pts -> risk HIGH); one preventable reportable accident occurred 2026-06-15 (injuries 1, tow_away true); measurement cycle has run so HOS is alerted (measure 8.00 -> percentile 80)"
          setup_api_calls:
            - { call: "POST /safety/carriers", payload: { dot_number: "DOT-1002", legal_name: "Hauler Two", fleet_size: 3 }, as: SafetyAdmin, captures: { c_id: $.data.id } }
            - { call: "POST /safety/violation-categories", payload: { category_code: "HOURS_OF_SERVICE", display_name: "HOS Compliance", intervention_threshold: 65, benchmark_measure: 10.0 }, as: SafetyAdmin, captures: { cat_id: $.data.id } }
            - { call: "POST /safety/drivers", payload: { carrier_id: "${c_id}", cdl_number: "CDL-2", full_name: "Dee Ray", hire_date: "2025-02-01T00:00:00Z" }, as: SafetyManager, captures: { d_id: $.data.id } }
            - { call: "POST /safety/roadside-inspections", payload: { carrier_id: "${c_id}", driver_id: "${d_id}", report_number: "R-200", inspection_date: "2026-06-01T00:00:00Z", inspection_level: 1, state_code: "TX" }, as: SafetyManager, captures: { i_id: $.data.id } }
            - { call: "POST /safety/inspection-violations", payload: { inspection_id: "${i_id}", category_id: "${cat_id}", violation_code: "395.8", severity_weight: 8, occurred_at: "2026-06-01T00:00:00Z" }, as: SafetyManager, captures: { v_id: $.data.id } }
            - { call: "POST /safety/accident-records", payload: { carrier_id: "${c_id}", driver_id: "${d_id}", occurred_at: "2026-06-15T00:00:00Z", fatalities: 0, injuries: 1, tow_away: true }, as: SafetyManager, as_user_id: "sm-1", captures: { acc_id: $.data.id } }
            - { call: "POST /safety/accident-records/${acc_id}/determine-preventability", payload: { determination: "PREVENTABLE" }, as: SafetyDirector, as_user_id: "sd-1" }
            - { call: "POST /safety/measurement-cycles", payload: { carrier_id: "${c_id}" }, as: ComplianceAnalyst }
          trigger:
            - { call: "POST /safety/insurance-premium-models", payload: { carrier_id: "${c_id}", policy_period_start: "2027-01-01T00:00:00Z", policy_period_end: "2027-12-31T00:00:00Z", base_rate_cents_per_unit: 123457, scenario: "BASELINE" }, as: InsuranceAnalyst, captures: { m_a: $.data.id, prem_a: $.data.computed_premium_cents } }
            - { call: "POST /safety/insurance-premium-models", payload: { carrier_id: "${c_id}", policy_period_start: "2028-01-01T00:00:00Z", policy_period_end: "2028-12-31T00:00:00Z", base_rate_cents_per_unit: 123457, scenario: "PROJECTED", assume_rating: "SATISFACTORY", assume_cleared_category_codes: ["HOURS_OF_SERVICE"], assume_removed_preventable_accidents: 1 }, as: InsuranceAnalyst, captures: { m_b: $.data.id, prem_b: $.data.computed_premium_cents } }
          assert:
            - "model ${m_a}.computed_premium_cents == 427779 (370371 x 1.05 x 1.10 = 427778.505 -> half-up)"
            - "model ${m_b}.computed_premium_cents == 377778 (370371 x 1.00 x 1.02 = 377778.42)"
            - "model ${m_a}.rating_factor_used == 1.05 and model ${m_b}.rating_factor_used == 1.00"
            - "model ${m_a}.score_loading_pct == 3 and model ${m_b}.score_loading_pct == 0"
            - "model ${m_a}.crash_loading_pct == 5 and model ${m_b}.crash_loading_pct == 0"
            - "prem_a != prem_b for identical underlying carrier data"

  - rule_id: combinatorial_formula
    instances:
      - name: posture_first_match_wins
        grounds:
          - calculations.carrier_posture
          - calculations.percentile_from_measure
          - state_machines.Carrier
        distinguishing_aspect: |
          Mode (a) combinatorial: posture takes 3+ inputs (safety_rating,
          new_entrant_status, alerted-category count/identity) with a normative
          first-match-wins order — after the audit close, rule 1 (UNSATISFACTORY
          rating) dominates rule 2 (>=2 alerted categories), flipping posture from
          INTERVENTION_PRIORITY to OUT_OF_SERVICE_PROPOSED.
        test_recipe:
          setup:
            - "Carrier fleet_size 4; categories HOURS_OF_SERVICE and VEHICLE_MAINTENANCE, both threshold 65 benchmark 8.0; one driver with a DQ_FILE document; two sev-8 violations occurred 2026-05-01 (one per category, 24 pts each); cycle run -> each measure 6.00 -> percentile 75 -> 2 alerted categories; then a COMPLIANCE_REVIEW audit reaches FINDINGS_ISSUED with acute_count 2 (proposed UNSATISFACTORY)"
          setup_api_calls:
            - { call: "POST /safety/carriers", payload: { dot_number: "DOT-1003", legal_name: "Hauler Three", fleet_size: 4 }, as: SafetyAdmin, captures: { c_id: $.data.id } }
            - { call: "POST /safety/violation-categories", payload: { category_code: "HOURS_OF_SERVICE", display_name: "HOS", intervention_threshold: 65, benchmark_measure: 8.0 }, as: SafetyAdmin, captures: { cat_h: $.data.id } }
            - { call: "POST /safety/violation-categories", payload: { category_code: "VEHICLE_MAINTENANCE", display_name: "VM", intervention_threshold: 65, benchmark_measure: 8.0 }, as: SafetyAdmin, captures: { cat_v: $.data.id } }
            - { call: "POST /safety/drivers", payload: { carrier_id: "${c_id}", cdl_number: "CDL-3", full_name: "Hal Byrd", hire_date: "2025-03-01T00:00:00Z" }, as: SafetyManager, captures: { d_id: $.data.id } }
            - { call: "POST /safety/document-records", payload: { carrier_id: "${c_id}", driver_id: "${d_id}", document_type: "DQ_FILE", filed_at: "2026-01-01T00:00:00Z" }, as: SafetyManager }
            - { call: "POST /safety/roadside-inspections", payload: { carrier_id: "${c_id}", driver_id: "${d_id}", report_number: "R-300", inspection_date: "2026-05-01T00:00:00Z", inspection_level: 2, state_code: "OH" }, as: SafetyManager, captures: { i_id: $.data.id } }
            - { call: "POST /safety/inspection-violations", payload: { inspection_id: "${i_id}", category_id: "${cat_h}", violation_code: "395.3", severity_weight: 8, occurred_at: "2026-05-01T00:00:00Z" }, as: SafetyManager }
            - { call: "POST /safety/inspection-violations", payload: { inspection_id: "${i_id}", category_id: "${cat_v}", violation_code: "396.3", severity_weight: 8, occurred_at: "2026-05-01T00:00:00Z" }, as: SafetyManager }
            - { call: "POST /safety/measurement-cycles", payload: { carrier_id: "${c_id}" }, as: ComplianceAnalyst, captures: { posture_mid: $.data.posture_after } }
            - { call: "POST /safety/compliance-audit-cases", payload: { carrier_id: "${c_id}", audit_type: "COMPLIANCE_REVIEW", scheduled_date: "2026-08-01T00:00:00Z", field_work_duration_days: 14 }, as: SafetyAdmin, captures: { au_id: $.data.id } }
            - { call: "POST /safety/compliance-audit-cases/${au_id}/start-field-work", payload: {}, as: SafetyAdmin }
            - { call: "POST /safety/compliance-audit-cases/${au_id}/issue-findings", payload: { acute_count: 2, critical_count: 0 }, as: SafetyAdmin }
          trigger:
            - { call: "POST /safety/compliance-audit-cases/${au_id}/close", payload: {}, as: SafetyDirector }
            - { call: "GET /safety/carriers/${c_id}", payload: {}, as: SafetyDirector, captures: { posture_end: $.data.posture, rating_end: $.data.safety_rating } }
          assert:
            - "cycle response posture_after == INTERVENTION_PRIORITY (2 alerted categories, rating still NONE)"
            - "after close: carrier.safety_rating == UNSATISFACTORY (acute 2 -> UNSATISFACTORY per audit_outcome_rating)"
            - "after close: carrier.posture == OUT_OF_SERVICE_PROPOSED — rule 1 wins over the >=2-alerts rule 2"
            - "audit case status == CLOSED_FAILED"

      - name: premium_single_final_rounding
        grounds:
          - calculations.insurance_premium
          - entities.InsurancePremiumModel.fields.computed_premium_cents
        distinguishing_aspect: |
          Mode (b) nested rounding (different mode from the posture instance): the
          scaffold pins 'sum all loadings, multiply, then round half-up once at the
          end' — on fleet 1 / rate 99990 / NONE 1.05 / loadings 3+5+2 this yields
          115488 cents, whereas per-component rounding would yield 115489.
        test_recipe:
          setup:
            - "Carrier fleet_size 1, rating NONE; category HOURS_OF_SERVICE threshold 65 benchmark 10.0; driver with sev-8 violation occurred 2026-05-01 (24 pts -> risk HIGH -> driver_loading 2%); one preventable accident occurred 2026-06-15 (injuries 1 -> crash_loading 5%); cycle run -> HOS alerted (measure 24.00 -> percentile 100 -> score_loading 3%)"
          setup_api_calls:
            - { call: "POST /safety/carriers", payload: { dot_number: "DOT-1004", legal_name: "Hauler Four", fleet_size: 1 }, as: SafetyAdmin, captures: { c_id: $.data.id } }
            - { call: "POST /safety/violation-categories", payload: { category_code: "HOURS_OF_SERVICE", display_name: "HOS", intervention_threshold: 65, benchmark_measure: 10.0 }, as: SafetyAdmin, captures: { cat_id: $.data.id } }
            - { call: "POST /safety/drivers", payload: { carrier_id: "${c_id}", cdl_number: "CDL-4", full_name: "Ivy Koh", hire_date: "2025-04-01T00:00:00Z" }, as: SafetyManager, captures: { d_id: $.data.id } }
            - { call: "POST /safety/roadside-inspections", payload: { carrier_id: "${c_id}", driver_id: "${d_id}", report_number: "R-400", inspection_date: "2026-05-01T00:00:00Z", inspection_level: 1, state_code: "NV" }, as: SafetyManager, captures: { i_id: $.data.id } }
            - { call: "POST /safety/inspection-violations", payload: { inspection_id: "${i_id}", category_id: "${cat_id}", violation_code: "395.8", severity_weight: 8, occurred_at: "2026-05-01T00:00:00Z" }, as: SafetyManager }
            - { call: "POST /safety/accident-records", payload: { carrier_id: "${c_id}", driver_id: "${d_id}", occurred_at: "2026-06-15T00:00:00Z", fatalities: 0, injuries: 1, tow_away: false }, as: SafetyManager, as_user_id: "sm-1", captures: { acc_id: $.data.id } }
            - { call: "POST /safety/accident-records/${acc_id}/determine-preventability", payload: { determination: "PREVENTABLE" }, as: SafetyDirector, as_user_id: "sd-1" }
            - { call: "POST /safety/measurement-cycles", payload: { carrier_id: "${c_id}" }, as: ComplianceAnalyst }
          trigger:
            - { call: "POST /safety/insurance-premium-models", payload: { carrier_id: "${c_id}", policy_period_start: "2027-01-01T00:00:00Z", policy_period_end: "2027-12-31T00:00:00Z", base_rate_cents_per_unit: 99990, scenario: "BASELINE" }, as: InsuranceAnalyst, captures: { m_id: $.data.id, prem: $.data.computed_premium_cents } }
          assert:
            - "model.computed_premium_cents == 115488 (99990 x 1.05 x 1.10 = 115488.45, single final round half-up)"
            - "model.computed_premium_cents != 115489 (the per-component-rounding value)"
            - "model.rating_factor_used == 1.05, score_loading_pct == 3, crash_loading_pct == 5, driver_loading_pct == 2"

  - rule_id: non_linear_state_machine
    instances:
      - name: dataqs_remand_cycle_bounded
        grounds:
          - state_machines.DataQsChallenge
          - errors[ERR_REMAND_LIMIT_REACHED]
          - entities.DataQsChallenge.fields.remand_count
        distinguishing_aspect: |
          Cyclic machine with a loop bound: SUBMITTED -> UNDER_REVIEW -> REMANDED ->
          SUBMITTED may repeat only while remand_count < 2; the third REMAND decision
          is rejected with ERR_REMAND_LIMIT_REACHED, after which UPHELD still succeeds.
        test_recipe:
          setup:
            - "Carrier fleet_size 5; category VEHICLE_MAINTENANCE threshold 65 benchmark 10.0; one driver; one inspection; one ACTIVE violation (sev 5, occurred 2026-05-01); a DataQs challenge on it"
          setup_api_calls:
            - { call: "POST /safety/carriers", payload: { dot_number: "DOT-1005", legal_name: "Hauler Five", fleet_size: 5 }, as: SafetyAdmin, captures: { c_id: $.data.id } }
            - { call: "POST /safety/violation-categories", payload: { category_code: "VEHICLE_MAINTENANCE", display_name: "VM", intervention_threshold: 65, benchmark_measure: 10.0 }, as: SafetyAdmin, captures: { cat_id: $.data.id } }
            - { call: "POST /safety/drivers", payload: { carrier_id: "${c_id}", cdl_number: "CDL-5", full_name: "Jay Lin", hire_date: "2025-05-01T00:00:00Z" }, as: SafetyManager, captures: { d_id: $.data.id } }
            - { call: "POST /safety/roadside-inspections", payload: { carrier_id: "${c_id}", driver_id: "${d_id}", report_number: "R-500", inspection_date: "2026-05-01T00:00:00Z", inspection_level: 2, state_code: "AZ" }, as: SafetyManager, captures: { i_id: $.data.id } }
            - { call: "POST /safety/inspection-violations", payload: { inspection_id: "${i_id}", category_id: "${cat_id}", violation_code: "396.9", severity_weight: 5, occurred_at: "2026-05-01T00:00:00Z" }, as: SafetyManager, captures: { v_id: $.data.id } }
            - { call: "POST /safety/dataqs-challenges", payload: { violation_id: "${v_id}", reason_code: "WRONG_DRIVER", evidence_note: "Driver was on leave" }, as: ComplianceAnalyst, captures: { ch_id: $.data.id } }
            - { call: "POST /safety/dataqs-challenges/${ch_id}/start-review", payload: {}, as: SafetyAdmin }
            - { call: "POST /safety/dataqs-challenges/${ch_id}/decide", payload: { outcome: "REMANDED" }, as: SafetyAdmin, captures: { rc1: $.data.remand_count } }
            - { call: "POST /safety/dataqs-challenges/${ch_id}/resubmit", payload: { evidence_note: "Added leave records" }, as: ComplianceAnalyst }
            - { call: "POST /safety/dataqs-challenges/${ch_id}/start-review", payload: {}, as: SafetyAdmin }
            - { call: "POST /safety/dataqs-challenges/${ch_id}/decide", payload: { outcome: "REMANDED" }, as: SafetyAdmin, captures: { rc2: $.data.remand_count } }
            - { call: "POST /safety/dataqs-challenges/${ch_id}/resubmit", payload: { evidence_note: "Added payroll proof" }, as: ComplianceAnalyst }
            - { call: "POST /safety/dataqs-challenges/${ch_id}/start-review", payload: {}, as: SafetyAdmin }
          trigger:
            - { call: "POST /safety/dataqs-challenges/${ch_id}/decide", payload: { outcome: "REMANDED" }, as: SafetyAdmin, captures: { err: $.data.error_id } }
            - { call: "POST /safety/dataqs-challenges/${ch_id}/decide", payload: { outcome: "UPHELD" }, as: SafetyAdmin, captures: { final_status: $.data.status } }
            - { call: "GET /safety/inspection-violations/${v_id}", payload: {}, as: ComplianceAnalyst, captures: { v_status: $.data.status } }
          assert:
            - "rc1 == 1 and rc2 == 2 (cycle iterated twice)"
            - "third REMANDED decision -> error_id ERR_REMAND_LIMIT_REACHED (HTTP 409), challenge stays UNDER_REVIEW with remand_count == 2"
            - "subsequent UPHELD decision succeeds: challenge.status == UPHELD (terminal)"
            - "violation ${v_id}.status == ACTIVE again (CHALLENGED -> ACTIVE on UPHELD)"

      - name: premium_model_stale_requote_loop
        grounds:
          - state_machines.InsurancePremiumModel
          - state_machines.Carrier
          - state_machines.RatingUpgradeRequest
        distinguishing_aspect: |
          Cyclic machine on a different entity: InsurancePremiumModel loops
          DRAFT -> QUOTED -> STALE -> DRAFT -> QUOTED -> BOUND, where the STALE
          back-edge is triggered by a cross-entity event (rating upgrade approval),
          and recompute reprices 250000 -> 200000 cents.
        test_recipe:
          setup:
            - "Carrier fleet_size 2 with safety_rating CONDITIONAL (via audit: acute 0 critical 2) and rating_cooling_off_until 2027-01-28; driver with DQ_FILE; a QUOTED BASELINE premium model (rate 100000, period 2027) at 250000 cents"
          setup_api_calls:
            - { call: "POST /safety/carriers", payload: { dot_number: "DOT-1006", legal_name: "Hauler Six", fleet_size: 2 }, as: SafetyAdmin, captures: { c_id: $.data.id } }
            - { call: "POST /safety/drivers", payload: { carrier_id: "${c_id}", cdl_number: "CDL-6", full_name: "Kim Poe", hire_date: "2025-06-01T00:00:00Z" }, as: SafetyManager, captures: { d_id: $.data.id } }
            - { call: "POST /safety/document-records", payload: { carrier_id: "${c_id}", driver_id: "${d_id}", document_type: "DQ_FILE", filed_at: "2026-01-01T00:00:00Z" }, as: SafetyManager }
            - { call: "POST /safety/compliance-audit-cases", payload: { carrier_id: "${c_id}", audit_type: "COMPLIANCE_REVIEW", scheduled_date: "2026-08-01T00:00:00Z", field_work_duration_days: 14 }, as: SafetyAdmin, captures: { au_id: $.data.id } }
            - { call: "POST /safety/compliance-audit-cases/${au_id}/start-field-work", payload: {}, as: SafetyAdmin }
            - { call: "POST /safety/compliance-audit-cases/${au_id}/issue-findings", payload: { acute_count: 0, critical_count: 2 }, as: SafetyAdmin }
            - { call: "POST /safety/compliance-audit-cases/${au_id}/close", payload: {}, as: SafetyDirector }
            - { call: "POST /safety/insurance-premium-models", payload: { carrier_id: "${c_id}", policy_period_start: "2027-01-01T00:00:00Z", policy_period_end: "2027-12-31T00:00:00Z", base_rate_cents_per_unit: 100000, scenario: "BASELINE" }, as: InsuranceAnalyst, captures: { m_id: $.data.id, prem_a: $.data.computed_premium_cents } }
            - { call: "POST /safety/insurance-premium-models/${m_id}/quote", payload: {}, as: InsuranceAnalyst }
            - { call: "POST /_clock/set_current_utc", payload: { to_iso8601: "2027-02-01T00:00:00Z" }, as: SafetyAdmin }
            - { call: "POST /safety/rating-upgrade-requests", payload: { carrier_id: "${c_id}", requested_rating: "SATISFACTORY", justification_note: "Corrective plan complete" }, as: SafetyManager, captures: { u_id: $.data.id } }
            - { call: "POST /safety/rating-upgrade-requests/${u_id}/start-review", payload: {}, as: SafetyDirector }
          trigger:
            - { call: "POST /safety/rating-upgrade-requests/${u_id}/decide", payload: { outcome: "APPROVED" }, as: SafetyDirector }
            - { call: "GET /safety/insurance-premium-models/${m_id}", payload: {}, as: InsuranceAnalyst, captures: { m_stale: $.data.status } }
            - { call: "POST /safety/insurance-premium-models/${m_id}/recompute", payload: {}, as: InsuranceAnalyst, captures: { m_draft: $.data.status, prem_b: $.data.computed_premium_cents } }
            - { call: "POST /safety/insurance-premium-models/${m_id}/quote", payload: {}, as: InsuranceAnalyst }
            - { call: "POST /safety/insurance-premium-models/${m_id}/bind", payload: {}, as: InsuranceAnalyst, captures: { m_bound: $.data.status } }
          assert:
            - "prem_a == 250000 (200000 x 1.25 CONDITIONAL)"
            - "after upgrade approval: model.status == STALE (QUOTED -> STALE back-edge fired by carrier rating change)"
            - "after recompute: model.status == DRAFT and computed_premium_cents == 200000 (rating factor now 1.00)"
            - "after second quote + bind: model.status == BOUND"
            - "carrier.safety_rating == SATISFACTORY and rating_cooling_off_until == null"

  - rule_id: transitive_cascade
    instances:
      - name: cascade_overturn_to_premium_stale
        grounds:
          - state_machines.DataQsChallenge.UNDER_REVIEW_to_OVERTURNED
          - state_machines.InspectionViolation.CHALLENGED_to_REMOVED
          - calculations.driver_risk_score
          - state_machines.InsurancePremiumModel
        distinguishing_aspect: |
          Depth-4 cascade from the challenge-decision trigger: OVERTURNED ->
          violation REMOVED -> inspection.total_weighted_points 42 -> 18 AND
          driver.risk_score 42 -> 18 (tier HIGH -> MEDIUM) -> QUOTED premium model
          -> STALE. Each hop is caused by the previous hop's mutation.
        test_recipe:
          setup:
            - "Carrier fleet_size 2; category HOURS_OF_SERVICE threshold 65 benchmark 100.0 (measure stays below threshold so only driver_loading is in play); driver with violations sev 8 (24 pts) and sev 6 (18 pts), both occurred 2026-05-01 -> risk_score 42, tier HIGH; a QUOTED BASELINE premium model (rate 50000, period 2027) at 107100 cents; challenge on the sev-8 violation, UNDER_REVIEW"
          setup_api_calls:
            - { call: "POST /safety/carriers", payload: { dot_number: "DOT-1007", legal_name: "Hauler Seven", fleet_size: 2 }, as: SafetyAdmin, captures: { c_id: $.data.id } }
            - { call: "POST /safety/violation-categories", payload: { category_code: "HOURS_OF_SERVICE", display_name: "HOS", intervention_threshold: 65, benchmark_measure: 100.0 }, as: SafetyAdmin, captures: { cat_id: $.data.id } }
            - { call: "POST /safety/drivers", payload: { carrier_id: "${c_id}", cdl_number: "CDL-7", full_name: "Lou May", hire_date: "2025-07-01T00:00:00Z" }, as: SafetyManager, captures: { d_id: $.data.id } }
            - { call: "POST /safety/roadside-inspections", payload: { carrier_id: "${c_id}", driver_id: "${d_id}", report_number: "R-700", inspection_date: "2026-05-01T00:00:00Z", inspection_level: 1, state_code: "CO" }, as: SafetyManager, captures: { i_id: $.data.id } }
            - { call: "POST /safety/inspection-violations", payload: { inspection_id: "${i_id}", category_id: "${cat_id}", violation_code: "395.8", severity_weight: 8, occurred_at: "2026-05-01T00:00:00Z" }, as: SafetyManager, captures: { v1_id: $.data.id } }
            - { call: "POST /safety/inspection-violations", payload: { inspection_id: "${i_id}", category_id: "${cat_id}", violation_code: "395.3", severity_weight: 6, occurred_at: "2026-05-01T00:00:00Z" }, as: SafetyManager, captures: { v2_id: $.data.id } }
            - { call: "POST /safety/insurance-premium-models", payload: { carrier_id: "${c_id}", policy_period_start: "2027-01-01T00:00:00Z", policy_period_end: "2027-12-31T00:00:00Z", base_rate_cents_per_unit: 50000, scenario: "BASELINE" }, as: InsuranceAnalyst, captures: { m_id: $.data.id, prem: $.data.computed_premium_cents } }
            - { call: "POST /safety/insurance-premium-models/${m_id}/quote", payload: {}, as: InsuranceAnalyst }
            - { call: "POST /safety/dataqs-challenges", payload: { violation_id: "${v1_id}", reason_code: "INCORRECT_DATA", evidence_note: "ELD extract attached" }, as: ComplianceAnalyst, captures: { ch_id: $.data.id } }
            - { call: "POST /safety/dataqs-challenges/${ch_id}/start-review", payload: {}, as: SafetyAdmin }
          trigger:
            - { call: "POST /safety/dataqs-challenges/${ch_id}/decide", payload: { outcome: "OVERTURNED" }, as: SafetyAdmin }
            - { call: "GET /safety/roadside-inspections/${i_id}", payload: {}, as: ComplianceAnalyst, captures: { insp_pts: $.data.total_weighted_points } }
            - { call: "GET /safety/drivers/${d_id}", payload: {}, as: SafetyManager, captures: { d_risk: $.data.risk_score, d_tier: $.data.risk_tier } }
            - { call: "GET /safety/insurance-premium-models/${m_id}", payload: {}, as: InsuranceAnalyst, captures: { m_status: $.data.status } }
          assert:
            - "prem == 107100 at quote time (100000 x 1.05 x 1.02: NONE factor, one HIGH driver)"
            - "violation ${v1_id}.status == REMOVED (hop 1)"
            - "inspection.total_weighted_points == 18 (hop 2: 42 - 24)"
            - "driver.risk_score == 18 and driver.risk_tier == MEDIUM (hop 3: tier crossed 20 boundary downward)"
            - "premium model.status == STALE (hop 4: tier change marked it)"
            - "challenge.status == OVERTURNED and challenge.decided_at == 2026-08-01T00:00:00Z"

      - name: cascade_audit_close_unsatisfactory
        grounds:
          - state_machines.ComplianceAuditCase
          - state_machines.Carrier
          - calculations.carrier_posture
          - state_machines.InsurancePremiumModel
        distinguishing_aspect: |
          Depth-3 cascade from a different trigger (audit close): CLOSED_FAILED ->
          carrier.safety_rating NONE -> UNSATISFACTORY (cooling-off set to
          2027-01-28) -> posture OUT_OF_SERVICE_PROPOSED -> QUOTED premium model
          -> STALE.
        test_recipe:
          setup:
            - "Carrier fleet_size 2, rating NONE; driver with DQ_FILE (audit-ready); a QUOTED BASELINE premium model (rate 100000, period 2027) at 210000 cents; a COMPLIANCE_REVIEW audit in FINDINGS_ISSUED with acute_count 2, critical_count 0 (proposed UNSATISFACTORY)"
          setup_api_calls:
            - { call: "POST /safety/carriers", payload: { dot_number: "DOT-1008", legal_name: "Hauler Eight", fleet_size: 2 }, as: SafetyAdmin, captures: { c_id: $.data.id } }
            - { call: "POST /safety/drivers", payload: { carrier_id: "${c_id}", cdl_number: "CDL-8", full_name: "Mel Noe", hire_date: "2025-08-01T00:00:00Z" }, as: SafetyManager, captures: { d_id: $.data.id } }
            - { call: "POST /safety/document-records", payload: { carrier_id: "${c_id}", driver_id: "${d_id}", document_type: "DQ_FILE", filed_at: "2026-01-01T00:00:00Z" }, as: SafetyManager }
            - { call: "POST /safety/insurance-premium-models", payload: { carrier_id: "${c_id}", policy_period_start: "2027-01-01T00:00:00Z", policy_period_end: "2027-12-31T00:00:00Z", base_rate_cents_per_unit: 100000, scenario: "BASELINE" }, as: InsuranceAnalyst, captures: { m_id: $.data.id, prem: $.data.computed_premium_cents } }
            - { call: "POST /safety/insurance-premium-models/${m_id}/quote", payload: {}, as: InsuranceAnalyst }
            - { call: "POST /safety/compliance-audit-cases", payload: { carrier_id: "${c_id}", audit_type: "COMPLIANCE_REVIEW", scheduled_date: "2026-08-01T00:00:00Z", field_work_duration_days: 14 }, as: SafetyAdmin, captures: { au_id: $.data.id } }
            - { call: "POST /safety/compliance-audit-cases/${au_id}/start-field-work", payload: {}, as: SafetyAdmin }
            - { call: "POST /safety/compliance-audit-cases/${au_id}/issue-findings", payload: { acute_count: 2, critical_count: 0 }, as: SafetyAdmin, captures: { outcome: $.data.proposed_outcome } }
          trigger:
            - { call: "POST /safety/compliance-audit-cases/${au_id}/close", payload: {}, as: SafetyDirector }
            - { call: "GET /safety/carriers/${c_id}", payload: {}, as: SafetyDirector, captures: { rating: $.data.safety_rating, posture: $.data.posture, cool: $.data.rating_cooling_off_until } }
            - { call: "GET /safety/insurance-premium-models/${m_id}", payload: {}, as: InsuranceAnalyst, captures: { m_status: $.data.status } }
          assert:
            - "proposed_outcome == UNSATISFACTORY (acute_count 2 >= 2)"
            - "audit case.status == CLOSED_FAILED (adverse outcome)"
            - "carrier.safety_rating == UNSATISFACTORY (hop 1)"
            - "carrier.rating_cooling_off_until == 2027-01-28T00:00:00Z (2026-08-01 + 180 days; downgrade)"
            - "carrier.posture == OUT_OF_SERVICE_PROPOSED (hop 2: posture rule 1)"
            - "premium model.status == STALE (hop 3)"
  - rule_id: priority_pair_validation_conflict
    instances:
      - name: conflict_state_beats_temporal_post_accident
        grounds:
          - "validations[priority=5]"
          - "validations[priority=8]"
          - errors[ERR_DRIVER_NOT_ACTIVE]
          - errors[ERR_POST_ACCIDENT_WINDOW_MISSED]
        distinguishing_aspect: |
          Category pair (state, business_temporal): the request violates both the
          driver-ACTIVE state rule and the 32-hour post-accident window rule; the
          state error ERR_DRIVER_NOT_ACTIVE must win because state (priority 5)
          precedes temporal (priority 8).
        test_recipe:
          setup:
            - "Carrier; driver TERMINATED; a reportable accident occurred 2026-07-01T00:00:00Z registered before termination"
          setup_api_calls:
            - { call: "POST /safety/carriers", payload: { dot_number: "DOT-1009", legal_name: "Hauler Nine", fleet_size: 2 }, as: SafetyAdmin, captures: { c_id: $.data.id } }
            - { call: "POST /safety/drivers", payload: { carrier_id: "${c_id}", cdl_number: "CDL-9", full_name: "Ned Orr", hire_date: "2025-09-01T00:00:00Z" }, as: SafetyManager, captures: { d_id: $.data.id } }
            - { call: "POST /safety/accident-records", payload: { carrier_id: "${c_id}", driver_id: "${d_id}", occurred_at: "2026-07-01T00:00:00Z", fatalities: 0, injuries: 1, tow_away: false }, as: SafetyManager, as_user_id: "sm-1", captures: { acc_id: $.data.id } }
            - { call: "POST /safety/drivers/${d_id}/terminate", payload: {}, as: SafetyManager }
          trigger:
            - { call: "POST /safety/drug-alcohol-tests", payload: { driver_id: "${d_id}", test_type: "POST_ACCIDENT", substance: "DRUG", collected_at: "2026-07-03T12:00:00Z", accident_id: "${acc_id}" }, as: SafetyManager, captures: { err: $.data.error_id } }
          assert:
            - "error_id == ERR_DRIVER_NOT_ACTIVE (state, priority 5)"
            - "error_id != ERR_POST_ACCIDENT_WINDOW_MISSED although collected_at is 60h (> 32h) after the accident"
            - "HTTP status == 409"

      - name: conflict_temporal_beats_constraint_upgrade
        grounds:
          - "validations[priority=8]"
          - "validations[priority=9]"
          - errors[ERR_COOLING_OFF_ACTIVE]
          - errors[ERR_OPEN_UPGRADE_REQUEST_EXISTS]
        distinguishing_aspect: |
          Category pair (business_temporal, business_constraint) — different pair
          from the state/temporal instance: the create violates both cooling-off
          and one-open-request rules; ERR_COOLING_OFF_ACTIVE (temporal, priority 8)
          must beat ERR_OPEN_UPGRADE_REQUEST_EXISTS (constraint, priority 9).
        test_recipe:
          setup:
            - "Carrier downgraded to CONDITIONAL by audit A1 (acute 1, cooling_off 2027-01-28); clock advanced to 2027-02-01; upgrade request R1 filed and still SUBMITTED; audit A2 (scheduled 2027-02-01) closed with critical_count 4 -> rating UNSATISFACTORY, cooling_off extended to 2027-07-31 while R1 remains open"
          setup_api_calls:
            - { call: "POST /safety/carriers", payload: { dot_number: "DOT-1010", legal_name: "Hauler Ten", fleet_size: 1 }, as: SafetyAdmin, captures: { c_id: $.data.id } }
            - { call: "POST /safety/drivers", payload: { carrier_id: "${c_id}", cdl_number: "CDL-10", full_name: "Ola Paz", hire_date: "2025-10-01T00:00:00Z" }, as: SafetyManager, captures: { d_id: $.data.id } }
            - { call: "POST /safety/document-records", payload: { carrier_id: "${c_id}", driver_id: "${d_id}", document_type: "DQ_FILE", filed_at: "2026-01-01T00:00:00Z" }, as: SafetyManager }
            - { call: "POST /safety/compliance-audit-cases", payload: { carrier_id: "${c_id}", audit_type: "COMPLIANCE_REVIEW", scheduled_date: "2026-08-01T00:00:00Z", field_work_duration_days: 14 }, as: SafetyAdmin, captures: { au1: $.data.id } }
            - { call: "POST /safety/compliance-audit-cases/${au1}/start-field-work", payload: {}, as: SafetyAdmin }
            - { call: "POST /safety/compliance-audit-cases/${au1}/issue-findings", payload: { acute_count: 1, critical_count: 0 }, as: SafetyAdmin }
            - { call: "POST /safety/compliance-audit-cases/${au1}/close", payload: {}, as: SafetyDirector }
            - { call: "POST /_clock/set_current_utc", payload: { to_iso8601: "2027-02-01T00:00:00Z" }, as: SafetyAdmin }
            - { call: "POST /safety/rating-upgrade-requests", payload: { carrier_id: "${c_id}", requested_rating: "SATISFACTORY", justification_note: "CAP evidence" }, as: SafetyManager, captures: { r1: $.data.id } }
            - { call: "POST /safety/compliance-audit-cases", payload: { carrier_id: "${c_id}", audit_type: "COMPLIANCE_REVIEW", scheduled_date: "2027-02-01T00:00:00Z", field_work_duration_days: 14 }, as: SafetyAdmin, captures: { au2: $.data.id } }
            - { call: "POST /safety/compliance-audit-cases/${au2}/start-field-work", payload: {}, as: SafetyAdmin }
            - { call: "POST /safety/compliance-audit-cases/${au2}/issue-findings", payload: { acute_count: 0, critical_count: 4 }, as: SafetyAdmin }
            - { call: "POST /safety/compliance-audit-cases/${au2}/close", payload: {}, as: SafetyDirector }
          trigger:
            - { call: "POST /safety/rating-upgrade-requests", payload: { carrier_id: "${c_id}", requested_rating: "SATISFACTORY", justification_note: "Second attempt" }, as: SafetyManager, captures: { err: $.data.error_id } }
          assert:
            - "error_id == ERR_COOLING_OFF_ACTIVE (temporal, priority 8: clock 2027-02-01 < cooling_off_until 2027-07-31)"
            - "error_id != ERR_OPEN_UPGRADE_REQUEST_EXISTS although R1 ${r1} is still SUBMITTED"
            - "HTTP status == 409"

  - rule_id: boundary_precision_check
    instances:
      - name: time_weight_six_month_inclusive_boundary
        grounds:
          - calculations.violation_time_weight
          - entities.InspectionViolation.fields.time_weight_multiplier
        distinguishing_aspect: |
          Metric: violation age in calendar months against the cycle as_of. The
          interval start is INCLUSIVE: occurred_at == as_of - 6 months keeps
          multiplier 3, while one day earlier drops to 2; both violations feed one
          snapshot whose measure (5.00) and percentile (50) are pinned.
        test_recipe:
          setup:
            - "Carrier fleet_size 5; category UNSAFE_DRIVING threshold 65 benchmark 10.0; one driver; one inspection holding violation A occurred exactly 2026-02-01T00:00:00Z (= default clock 2026-08-01 minus 6 months) and violation B occurred 2026-01-31T00:00:00Z, both severity 5"
          setup_api_calls:
            - { call: "POST /safety/carriers", payload: { dot_number: "DOT-1011", legal_name: "Hauler Eleven", fleet_size: 5 }, as: SafetyAdmin, captures: { c_id: $.data.id } }
            - { call: "POST /safety/violation-categories", payload: { category_code: "UNSAFE_DRIVING", display_name: "Unsafe Driving", intervention_threshold: 65, benchmark_measure: 10.0 }, as: SafetyAdmin, captures: { cat_id: $.data.id } }
            - { call: "POST /safety/drivers", payload: { carrier_id: "${c_id}", cdl_number: "CDL-11", full_name: "Pam Ulf", hire_date: "2025-01-15T00:00:00Z" }, as: SafetyManager, captures: { d_id: $.data.id } }
            - { call: "POST /safety/roadside-inspections", payload: { carrier_id: "${c_id}", driver_id: "${d_id}", report_number: "R-1100", inspection_date: "2026-01-31T00:00:00Z", inspection_level: 2, state_code: "WA" }, as: SafetyManager, captures: { i_id: $.data.id } }
            - { call: "POST /safety/inspection-violations", payload: { inspection_id: "${i_id}", category_id: "${cat_id}", violation_code: "392.2", severity_weight: 5, occurred_at: "2026-02-01T00:00:00Z" }, as: SafetyManager, captures: { va_id: $.data.id } }
            - { call: "POST /safety/inspection-violations", payload: { inspection_id: "${i_id}", category_id: "${cat_id}", violation_code: "392.4", severity_weight: 5, occurred_at: "2026-01-31T00:00:00Z" }, as: SafetyManager, captures: { vb_id: $.data.id } }
          trigger:
            - { call: "POST /safety/measurement-cycles", payload: { carrier_id: "${c_id}" }, as: ComplianceAnalyst }
            - { call: "GET /safety/inspection-violations/${va_id}", payload: {}, as: ComplianceAnalyst, captures: { va_tw: $.data.time_weight_multiplier, va_pts: $.data.weighted_points } }
            - { call: "GET /safety/inspection-violations/${vb_id}", payload: {}, as: ComplianceAnalyst, captures: { vb_tw: $.data.time_weight_multiplier, vb_pts: $.data.weighted_points } }
            - { call: "GET /safety/measurement-snapshots", payload: {}, as: ComplianceAnalyst, captures: { measure: "$.data[0].official_measure", pct: "$.data[0].official_percentile" } }
          assert:
            - "violation A (occurred exactly as_of - 6mo): time_weight_multiplier == 3, weighted_points == 15"
            - "violation B (one day older): time_weight_multiplier == 2, weighted_points == 10"
            - "snapshot.official_measure == 5.00 ((15+10)/5) and official_percentile == 50"

      - name: random_quota_exact_multiple_no_roundup
        grounds:
          - calculations.random_testing_quota
          - entities.RandomTestingPeriod.fields.required_drug_tests
        distinguishing_aspect: |
          Different metric (driver-count x rate through ceil) reachable through a
          different endpoint (testing-period creation, not measurement-cycles): an
          exact integer product does NOT round up (8 drivers x 0.25 = 2.0 -> 2),
          while a fractional product does (9 x 0.25 = 2.25 -> 3).
        test_recipe:
          setup:
            - "Two carriers registered"
          setup_api_calls:
            - { call: "POST /safety/carriers", payload: { dot_number: "DOT-1012A", legal_name: "Hauler Twelve A", fleet_size: 8 }, as: SafetyAdmin, captures: { ca_id: $.data.id } }
            - { call: "POST /safety/carriers", payload: { dot_number: "DOT-1012B", legal_name: "Hauler Twelve B", fleet_size: 9 }, as: SafetyAdmin, captures: { cb_id: $.data.id } }
          trigger:
            - { call: "POST /safety/random-testing-periods", payload: { carrier_id: "${ca_id}", program_year: 2026, avg_driver_count: 8 }, as: SafetyManager, captures: { drug_a: $.data.required_drug_tests, alc_a: $.data.required_alcohol_tests } }
            - { call: "POST /safety/random-testing-periods", payload: { carrier_id: "${cb_id}", program_year: 2026, avg_driver_count: 9 }, as: SafetyManager, captures: { drug_b: $.data.required_drug_tests, alc_b: $.data.required_alcohol_tests } }
          assert:
            - "carrier A: required_drug_tests == 2 (ceil(8 x 0.25) = ceil(2.0) = 2, not 3)"
            - "carrier A: required_alcohol_tests == 1 (ceil(0.8))"
            - "carrier B: required_drug_tests == 3 (ceil(2.25)) and required_alcohol_tests == 1 (ceil(0.9))"

  - rule_id: cross_entity_state_dependency
    instances:
      - name: finalize_blocked_by_open_challenge
        grounds:
          - state_machines.RoadsideInspection.UNDER_REVIEW_to_FINALIZED
          - errors[ERR_OPEN_CHALLENGES_BLOCK_FINALIZE]
        distinguishing_aspect: |
          Entity pair RoadsideInspection <- DataQsChallenge: finalize is rejected
          while any violation of the inspection carries an open challenge, and
          succeeds once the challenge reaches the UPHELD terminal state.
        test_recipe:
          setup:
            - "Carrier fleet_size 5; category VEHICLE_MAINTENANCE; driver; inspection in UNDER_REVIEW with one ACTIVE violation (sev 3, occurred 2026-05-01); an open (SUBMITTED) challenge on that violation"
          setup_api_calls:
            - { call: "POST /safety/carriers", payload: { dot_number: "DOT-1013", legal_name: "Hauler Thirteen", fleet_size: 5 }, as: SafetyAdmin, captures: { c_id: $.data.id } }
            - { call: "POST /safety/violation-categories", payload: { category_code: "VEHICLE_MAINTENANCE", display_name: "VM", intervention_threshold: 65, benchmark_measure: 10.0 }, as: SafetyAdmin, captures: { cat_id: $.data.id } }
            - { call: "POST /safety/drivers", payload: { carrier_id: "${c_id}", cdl_number: "CDL-13", full_name: "Rob Ihn", hire_date: "2025-02-15T00:00:00Z" }, as: SafetyManager, captures: { d_id: $.data.id } }
            - { call: "POST /safety/roadside-inspections", payload: { carrier_id: "${c_id}", driver_id: "${d_id}", report_number: "R-1300", inspection_date: "2026-05-01T00:00:00Z", inspection_level: 3, state_code: "GA" }, as: SafetyManager, captures: { i_id: $.data.id } }
            - { call: "POST /safety/inspection-violations", payload: { inspection_id: "${i_id}", category_id: "${cat_id}", violation_code: "396.1", severity_weight: 3, occurred_at: "2026-05-01T00:00:00Z" }, as: SafetyManager, captures: { v_id: $.data.id } }
            - { call: "POST /safety/roadside-inspections/${i_id}/begin-review", payload: {}, as: ComplianceAnalyst }
            - { call: "POST /safety/dataqs-challenges", payload: { violation_id: "${v_id}", reason_code: "OTHER", evidence_note: "Vendor invoice attached" }, as: ComplianceAnalyst, captures: { ch_id: $.data.id } }
          trigger:
            - { call: "POST /safety/roadside-inspections/${i_id}/finalize", payload: {}, as: ComplianceAnalyst, captures: { err: $.data.error_id } }
            - { call: "POST /safety/dataqs-challenges/${ch_id}/start-review", payload: {}, as: SafetyAdmin }
            - { call: "POST /safety/dataqs-challenges/${ch_id}/decide", payload: { outcome: "UPHELD" }, as: SafetyAdmin }
            - { call: "POST /safety/roadside-inspections/${i_id}/finalize", payload: {}, as: ComplianceAnalyst, captures: { final_status: $.data.review_status } }
          assert:
            - "first finalize -> error_id ERR_OPEN_CHALLENGES_BLOCK_FINALIZE (HTTP 409); inspection stays UNDER_REVIEW"
            - "after the challenge is UPHELD (violation back to ACTIVE): finalize succeeds, review_status == FINALIZED"

      - name: reinstate_requires_verified_rtd_negative
        grounds:
          - state_machines.Driver.SUSPENDED_to_ACTIVE
          - calculations.suspension_hold_evaluation
          - errors[ERR_REINSTATE_REQUIREMENTS_UNMET]
        distinguishing_aspect: |
          Different entity pair (Driver <- DrugAlcoholTest): reinstate is rejected
          while the driver's verified-positive test lacks a later verified
          RETURN_TO_DUTY negative, and succeeds only after the RTD chain completes.
        test_recipe:
          setup:
            - "Carrier; driver SUSPENDED by a VERIFIED_POSITIVE RANDOM drug test (collected 2026-07-01, verified at the 2026-08-01 default clock)"
          setup_api_calls:
            - { call: "POST /safety/carriers", payload: { dot_number: "DOT-1014", legal_name: "Hauler Fourteen", fleet_size: 2 }, as: SafetyAdmin, captures: { c_id: $.data.id } }
            - { call: "POST /safety/drivers", payload: { carrier_id: "${c_id}", cdl_number: "CDL-14", full_name: "Sue Vey", hire_date: "2025-03-15T00:00:00Z" }, as: SafetyManager, captures: { d_id: $.data.id } }
            - { call: "POST /safety/drug-alcohol-tests", payload: { driver_id: "${d_id}", test_type: "RANDOM", substance: "DRUG", collected_at: "2026-07-01T00:00:00Z" }, as: SafetyManager, as_user_id: "sm-1", captures: { t1: $.data.id } }
            - { call: "POST /safety/drug-alcohol-tests/${t1}/report-lab-result", payload: { lab_result: "POSITIVE" }, as: SafetyManager }
            - { call: "POST /safety/drug-alcohol-tests/${t1}/verify", payload: { verdict: "VERIFIED_POSITIVE" }, as: MedicalReviewOfficer, as_user_id: "mro-1" }
          trigger:
            - { call: "POST /safety/drivers/${d_id}/reinstate", payload: {}, as: SafetyManager, captures: { err: $.data.error_id } }
            - { call: "POST /_clock/set_current_utc", payload: { to_iso8601: "2026-08-03T00:00:00Z" }, as: SafetyAdmin }
            - { call: "POST /safety/drug-alcohol-tests", payload: { driver_id: "${d_id}", test_type: "RETURN_TO_DUTY", substance: "DRUG", collected_at: "2026-08-02T00:00:00Z" }, as: SafetyManager, as_user_id: "sm-1", captures: { t2: $.data.id } }
            - { call: "POST /safety/drug-alcohol-tests/${t2}/report-lab-result", payload: { lab_result: "NEGATIVE" }, as: SafetyManager }
            - { call: "POST /safety/drug-alcohol-tests/${t2}/verify", payload: { verdict: "VERIFIED_NEGATIVE" }, as: MedicalReviewOfficer, as_user_id: "mro-1" }
            - { call: "POST /safety/drivers/${d_id}/reinstate", payload: {}, as: SafetyManager, captures: { emp: $.data.employment_status } }
          assert:
            - "driver is SUSPENDED after the verified positive (cascade of the verify transition)"
            - "first reinstate -> error_id ERR_REINSTATE_REQUIREMENTS_UNMET (HTTP 409)"
            - "RTD test creation is allowed on a SUSPENDED driver (RETURN_TO_DUTY exemption)"
            - "after verified RTD negative (collected_at 2026-08-02 > positive verified_at 2026-08-01): reinstate succeeds, employment_status == ACTIVE"

  - rule_id: resource_temporal_overlap
    instances:
      - name: audit_window_half_open_adjacency
        grounds:
          - errors[ERR_AUDIT_WINDOW_OVERLAP]
          - entities.ComplianceAuditCase.fields.field_work_duration_days
        distinguishing_aspect: |
          Half-open interval semantics on ComplianceAuditCase: the field-work window
          is [scheduled_date, scheduled_date + duration); a new audit starting inside
          the window conflicts, but one starting exactly at the window's end is
          adjacent and allowed.
        test_recipe:
          setup:
            - "Carrier; audit A SCHEDULED with window [2026-09-01, 2026-09-15)"
          setup_api_calls:
            - { call: "POST /safety/carriers", payload: { dot_number: "DOT-1015", legal_name: "Hauler Fifteen", fleet_size: 2 }, as: SafetyAdmin, captures: { c_id: $.data.id } }
            - { call: "POST /safety/compliance-audit-cases", payload: { carrier_id: "${c_id}", audit_type: "COMPLIANCE_REVIEW", scheduled_date: "2026-09-01T00:00:00Z", field_work_duration_days: 14 }, as: SafetyAdmin, captures: { au_a: $.data.id } }
          trigger:
            - { call: "POST /safety/compliance-audit-cases", payload: { carrier_id: "${c_id}", audit_type: "COMPLIANCE_REVIEW", scheduled_date: "2026-09-14T00:00:00Z", field_work_duration_days: 7 }, as: SafetyAdmin, captures: { err: $.data.error_id } }
            - { call: "POST /safety/compliance-audit-cases", payload: { carrier_id: "${c_id}", audit_type: "COMPLIANCE_REVIEW", scheduled_date: "2026-09-15T00:00:00Z", field_work_duration_days: 7 }, as: SafetyAdmin, captures: { au_c: $.data.id } }
          assert:
            - "audit B (starts 2026-09-14, inside [09-01, 09-15)) -> ERR_AUDIT_WINDOW_OVERLAP (HTTP 409)"
            - "audit C (starts exactly 2026-09-15 == A's exclusive end) -> created with status SCHEDULED"

      - name: policy_period_closed_interval_touching
        grounds:
          - errors[ERR_POLICY_PERIOD_OVERLAP]
          - entities.InsurancePremiumModel.fields.policy_period_end
        distinguishing_aspect: |
          Different resource AND different interval semantics from the audit
          instance: premium policy periods are CLOSED intervals, so a model whose
          start equals the existing model's end date (2027-12-31) DOES conflict,
          while 2028-01-01 succeeds — the opposite adjacency outcome from audits.
        test_recipe:
          setup:
            - "Carrier fleet_size 1; BASELINE premium model A with period [2027-01-01, 2027-12-31] in DRAFT"
          setup_api_calls:
            - { call: "POST /safety/carriers", payload: { dot_number: "DOT-1016", legal_name: "Hauler Sixteen", fleet_size: 1 }, as: SafetyAdmin, captures: { c_id: $.data.id } }
            - { call: "POST /safety/insurance-premium-models", payload: { carrier_id: "${c_id}", policy_period_start: "2027-01-01T00:00:00Z", policy_period_end: "2027-12-31T00:00:00Z", base_rate_cents_per_unit: 50000, scenario: "BASELINE" }, as: InsuranceAnalyst, captures: { m_a: $.data.id } }
          trigger:
            - { call: "POST /safety/insurance-premium-models", payload: { carrier_id: "${c_id}", policy_period_start: "2027-12-31T00:00:00Z", policy_period_end: "2028-06-30T00:00:00Z", base_rate_cents_per_unit: 50000, scenario: "BASELINE" }, as: InsuranceAnalyst, captures: { err: $.data.error_id } }
            - { call: "POST /safety/insurance-premium-models", payload: { carrier_id: "${c_id}", policy_period_start: "2028-01-01T00:00:00Z", policy_period_end: "2028-12-31T00:00:00Z", base_rate_cents_per_unit: 50000, scenario: "BASELINE" }, as: InsuranceAnalyst, captures: { m_c: $.data.id } }
          assert:
            - "model B (start 2027-12-31 touches A's inclusive end) -> ERR_POLICY_PERIOD_OVERLAP (HTTP 409)"
            - "model C (start 2028-01-01, first day after A's end) -> created with status DRAFT"

  - rule_id: compensating_invariant
    instances:
      - name: challenge_uphold_conserves_weighted_points
        grounds:
          - state_machines.InspectionViolation.ACTIVE_to_CHALLENGED
          - state_machines.InspectionViolation.CHALLENGED_to_ACTIVE
          - calculations.category_measure
        distinguishing_aspect: |
          Conserved quantity: violation weighted points. The forward action (file
          challenge) paired with its compensating action (decide UPHELD) leaves
          inspection.total_weighted_points, driver.risk_score, and the next cycle's
          official_measure/provisional_measure bit-identical to pre-challenge values.
        test_recipe:
          setup:
            - "Carrier fleet_size 5; category VEHICLE_MAINTENANCE threshold 65 benchmark 10.0; driver; inspection with one violation sev 5 occurred 2026-05-01 (15 pts); cycle 1 already run at default clock (official measure 3.00, provisional 3.00)"
          setup_api_calls:
            - { call: "POST /safety/carriers", payload: { dot_number: "DOT-1017", legal_name: "Hauler Seventeen", fleet_size: 5 }, as: SafetyAdmin, captures: { c_id: $.data.id } }
            - { call: "POST /safety/violation-categories", payload: { category_code: "VEHICLE_MAINTENANCE", display_name: "VM", intervention_threshold: 65, benchmark_measure: 10.0 }, as: SafetyAdmin, captures: { cat_id: $.data.id } }
            - { call: "POST /safety/drivers", payload: { carrier_id: "${c_id}", cdl_number: "CDL-17", full_name: "Tom Rye", hire_date: "2025-05-15T00:00:00Z" }, as: SafetyManager, captures: { d_id: $.data.id } }
            - { call: "POST /safety/roadside-inspections", payload: { carrier_id: "${c_id}", driver_id: "${d_id}", report_number: "R-1700", inspection_date: "2026-05-01T00:00:00Z", inspection_level: 2, state_code: "NM" }, as: SafetyManager, captures: { i_id: $.data.id } }
            - { call: "POST /safety/inspection-violations", payload: { inspection_id: "${i_id}", category_id: "${cat_id}", violation_code: "396.3", severity_weight: 5, occurred_at: "2026-05-01T00:00:00Z" }, as: SafetyManager, captures: { v_id: $.data.id } }
            - { call: "POST /safety/measurement-cycles", payload: { carrier_id: "${c_id}" }, as: ComplianceAnalyst }
            - { call: "GET /safety/measurement-snapshots", payload: {}, as: ComplianceAnalyst, captures: { s1_off: "$.data[0].official_measure", s1_prov: "$.data[0].provisional_measure" } }
          trigger:
            - { call: "POST /safety/dataqs-challenges", payload: { violation_id: "${v_id}", reason_code: "INCORRECT_DATA", evidence_note: "Contesting brake citation" }, as: ComplianceAnalyst, captures: { ch_id: $.data.id } }
            - { call: "POST /safety/dataqs-challenges/${ch_id}/start-review", payload: {}, as: SafetyAdmin }
            - { call: "POST /safety/dataqs-challenges/${ch_id}/decide", payload: { outcome: "UPHELD" }, as: SafetyAdmin }
            - { call: "GET /safety/roadside-inspections/${i_id}", payload: {}, as: ComplianceAnalyst, captures: { pts_after: $.data.total_weighted_points } }
            - { call: "GET /safety/drivers/${d_id}", payload: {}, as: SafetyManager, captures: { risk_after: $.data.risk_score } }
            - { call: "POST /_clock/set_current_utc", payload: { to_iso8601: "2026-08-02T00:00:00Z" }, as: SafetyAdmin }
            - { call: "POST /safety/measurement-cycles", payload: { carrier_id: "${c_id}" }, as: ComplianceAnalyst }
            - { call: "GET /safety/measurement-snapshots", payload: {}, as: ComplianceAnalyst, captures: { s2_off: "$.data[1].official_measure", s2_prov: "$.data[1].provisional_measure" } }
          assert:
            - "before challenge: inspection.total_weighted_points == 15, driver.risk_score == 15, snapshot1 official_measure == 3.00 and provisional_measure == 3.00 (15/5 = 3.00)"
            - "after UPHELD: violation ${v_id}.status == ACTIVE, inspection.total_weighted_points == 15, driver.risk_score == 15 (compensating pair restores the conserved quantity)"
            - "snapshot2 (cycle at 2026-08-02): official_measure == 3.00 and provisional_measure == 3.00 — identical to pre-challenge snapshot1"

      - name: premium_recompute_after_noop_stale_conserves_cents
        grounds:
          - state_machines.InsurancePremiumModel
          - calculations.insurance_premium
          - concurrency_rules[carrier-patch-stale-version]
        distinguishing_aspect: |
          Conserved quantity: monetary premium cents (different from violation
          points). A carrier PATCH that touches only legal_name still bumps
          Carrier.version and marks the QUOTED model STALE; recompute with unchanged
          rating/alert/crash/driver inputs restores DRAFT with bit-identical
          computed_premium_cents (210000).
        test_recipe:
          setup:
            - "Carrier fleet_size 2, rating NONE, no violations/accidents; BASELINE premium model rate 100000 for 2027 quoted at 210000 cents"
          setup_api_calls:
            - { call: "POST /safety/carriers", payload: { dot_number: "DOT-1018", legal_name: "Hauler Eighteen", fleet_size: 2 }, as: SafetyAdmin, captures: { c_id: $.data.id, c_ver: $.data.version } }
            - { call: "POST /safety/insurance-premium-models", payload: { carrier_id: "${c_id}", policy_period_start: "2027-01-01T00:00:00Z", policy_period_end: "2027-12-31T00:00:00Z", base_rate_cents_per_unit: 100000, scenario: "BASELINE" }, as: InsuranceAnalyst, captures: { m_id: $.data.id, prem_a: $.data.computed_premium_cents } }
            - { call: "POST /safety/insurance-premium-models/${m_id}/quote", payload: {}, as: InsuranceAnalyst }
          trigger:
            - { call: "PATCH /safety/carriers/${c_id}", payload: { legal_name: "Hauler Eighteen Renamed", expected_carrier_version: "${c_ver}" }, as: SafetyAdmin, captures: { c_ver2: $.data.version } }
            - { call: "GET /safety/insurance-premium-models/${m_id}", payload: {}, as: InsuranceAnalyst, captures: { m_stale: $.data.status } }
            - { call: "POST /safety/insurance-premium-models/${m_id}/recompute", payload: {}, as: InsuranceAnalyst, captures: { prem_b: $.data.computed_premium_cents, m_draft: $.data.status } }
          assert:
            - "prem_a == 210000 (200000 x 1.05, no loadings)"
            - "PATCH bumps carrier.version from ${c_ver} to ${c_ver2} == ${c_ver} + 1 and marks the model STALE (m_stale == STALE)"
            - "recompute returns model to DRAFT with computed_premium_cents == 210000 — identical to the pre-stale quote (no input drift => no value drift)"
