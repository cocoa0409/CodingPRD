      - '${e2} == ERR_POLE_EXEMPT     # fresh version passes OCC and hits the state gate'
      - No audit was created by either rejected submit (GET /streetlights/audits?pole_id=${pole} total_count == 1)
  - name: val_audit_occ_stale_then_fresh_submit
    claim_type: violation_to_error
    grounds:
    - concurrency_rules[audit-submit-stale-pole]
    - errors[ERR_STALE_VERSION]
    - validations[priority=7]
    distinguishing_aspect: 'The audit-create OCC rule in action: submitting audit A bumps Pole.version; a second submit carrying A''s pre-submission version fails 412 ERR_STALE_VERSION (even though no audit
      is pending and the natural semantics would allow it); re-reading the pole and resubmitting with the fresh version succeeds.'
