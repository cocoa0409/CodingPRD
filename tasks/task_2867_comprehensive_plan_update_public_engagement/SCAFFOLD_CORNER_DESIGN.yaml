            - call: "POST /planning/inventory-datasets/${i_lu}/certify"
              as: PlanningDirector
              as_user_id: "director-1"
              captures: { lu_v: $.data.version }
            - call: "POST /planning/growth-scenarios"
              payload: { plan_update_id: "${pu}", land_use_inventory_id: "${i_lu}", expected_inventory_version: "${lu_v}", label: "Trend 2045", method: "TREND", horizon_year: 2045, base_households: 20000, annual_household_growth_rate: 0.012, job_growth_total: 15000, demolition_replacement_units: 500 }
