  # ---------------------------------------------------------------------------
  - section: endpoints
    instances:
      - name: response_envelope_success_shape
        claim_type: response_envelope
        grounds: ["response_envelope"]
        distinguishing_aspect: "Every success response carries meta.api_request_id, meta.api_request_timestamp, response_type, and data; a single-entity GET reports response_type == object."
        test_recipe:
          setup: ["one principal exists"]
          setup_api_calls:
            - call: "POST /rep-agency/principals"
              payload: { name: "P1", annual_quota_cents: 10000000 }
              as: AgencyAdmin
              captures: { p1: $.data.id }
          trigger:
            - call: "GET /rep-agency/principals/${p1}"
              as: Auditor
          assert:
            - "envelope: meta.api_request_id is a non-empty string; meta.api_request_timestamp is ISO8601"
            - "response_type == \"object\"; data.id == ${p1}"

      - name: list_pagination_defaults
        claim_type: pagination_defaults
        grounds: ["response_envelope"]
        distinguishing_aspect: "List endpoints default to limit 10 / offset 0 and report total_count and has_more; with 3 records has_more is false and response_type is array."
        test_recipe:
          setup: ["three reps created"]
          setup_api_calls:
            - call: "POST /rep-agency/reps"
