      - name: sign_sod_precedes_no_studies_referential
        grounds:
          - validations[priority=7]
          - validations[priority=8]
          - errors[ERR_SOD_SIGNER_CONFLICT]
          - errors[ERR_OPINION_NO_STUDIES]
        distinguishing_aspect: |
          Category pair business_safety vs business_referential (different pair from
          the first instance): signing as the opinion's own drafter violates SoD
          (priority 7) while the opinion also has zero attached studies (priority 8);
