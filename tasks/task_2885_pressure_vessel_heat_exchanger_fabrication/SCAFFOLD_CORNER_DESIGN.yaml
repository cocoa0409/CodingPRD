  - section: errors
    instances:
      - name: error_duplicate_key_family_across_every_unique_business_key
        claim_type: Error Triggerable
        grounds:
          - validations[priority=85]
          - errors[ERR_DUPLICATE_CERT_NUMBER]
          - errors[ERR_DUPLICATE_STAMP_INITIALS]
          - errors[ERR_DUPLICATE_JOB_NUMBER]
          - errors[ERR_DUPLICATE_HEAT_NUMBER]
          - errors[ERR_DUPLICATE_WPS_NUMBER]
          - errors[ERR_DUPLICATE_WELDER_QUALIFICATION]
        distinguishing_aspect: "Every uniqueness key in the catalog is fired once and each one's SCOPE is proved by a control that must succeed: heat_number is unique per spec, so the same H-6400 is legal against SA-105 after colliding on SA-516-70, and a qualification key is (welder_stamp, wps_id), so welder W-88 may be qualified again on a second procedure after colliding on the first."
        test_recipe:
          setup:
            - "A QC_INSPECTOR and a WELDING_ENGINEER exist, certificate CA-U-8926 is ACTIVE, job J-2885-C41 exists on it, heat H-6400 (SA-516-70) exists, and QUALIFIED procedures WPS-130 and WPS-131 exist with welder W-88 already qualified on WPS-130."
