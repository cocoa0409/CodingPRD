scaffold_difficulty_design:
  # =====================================================================
  # Rule 1 — dual_variant_calc
  # =====================================================================
  - rule_id: dual_variant_calc
    instances:
      - name: interest_day_count_basis_divergence
        grounds:
          - calculations.interest_accrual
          - entities.Tranche.fields.day_count_convention
          - entities.PaymentRun.fields.gross_amount_cents
        distinguishing_aspect: |
          Identical principal, rate, and period produce different per-position
          interest and gross amounts solely from day_count_convention:
          ACT_360 yields 10166667/8895833/6354167 (gross 25416667) while
          ACT_365 yields 10027397/8773973/6267123 (gross 25068493) for the
          half-open window [2026-06-15, 2026-12-15) — entity domain: Tranche
          interest accrual.
        test_recipe:
          setup:
            - "Two indentures I360/I365, each with one tranche (500 bps, principal 1000000000) differing only in day_count_convention (ACT_360 vs ACT_365), each with three ACTIVE positions 400000000/350000000/250000000"
            - "One INTEREST run per tranche over [2026-06-15, 2026-12-15), fully funded at the provisional gross"
          setup_api_calls:
            - { call: "POST /indentures", payload: { name: "I360", issuer_ref: "issuer-1", governing_law: "NY", initial_trustee_ref: "trustee-alpha", annual_admin_fee_cents: 2500000, extraordinary_hourly_rate_cents: 45000, default_hourly_rate_cents: 65000 }, as: PlatformAdmin, captures: { ind360: $.data.id } }
            - { call: "POST /tranches", payload: { indenture_id: "${ind360}", series_code: "T360", original_principal_cents: 1000000000, interest_rate_bps: 500, day_count_convention: "ACT_360", payment_frequency: "SEMI_ANNUAL", maturity_date: "2030-12-15", notice_period_days: 30 }, as: PlatformAdmin, captures: { t360: $.data.id } }
            - { call: "POST /indentures/${ind360}/activate", payload: {}, as: PlatformAdmin }
            - { call: "POST /noteholder-accounts", payload: { holder_ref: "H-A", legal_name: "Holder A", contact_email: "a@x.com" }, as: PlatformAdmin, captures: { nha: $.data.id } }
            - { call: "POST /noteholder-accounts", payload: { holder_ref: "H-B", legal_name: "Holder B", contact_email: "b@x.com" }, as: PlatformAdmin, captures: { nhb: $.data.id } }
            - { call: "POST /noteholder-accounts", payload: { holder_ref: "H-C", legal_name: "Holder C", contact_email: "c@x.com" }, as: PlatformAdmin, captures: { nhc: $.data.id } }
            - { call: "POST /positions", payload: { tranche_id: "${t360}", noteholder_account_id: "${nha}", original_principal_cents: 400000000 }, as: PlatformAdmin }
            - { call: "POST /positions", payload: { tranche_id: "${t360}", noteholder_account_id: "${nhb}", original_principal_cents: 350000000 }, as: PlatformAdmin }
            - { call: "POST /positions", payload: { tranche_id: "${t360}", noteholder_account_id: "${nhc}", original_principal_cents: 250000000 }, as: PlatformAdmin }
            - { call: "POST /indentures", payload: { name: "I365", issuer_ref: "issuer-1", governing_law: "NY", initial_trustee_ref: "trustee-alpha", annual_admin_fee_cents: 2500000, extraordinary_hourly_rate_cents: 45000, default_hourly_rate_cents: 65000 }, as: PlatformAdmin, captures: { ind365: $.data.id } }
            - { call: "POST /tranches", payload: { indenture_id: "${ind365}", series_code: "T365", original_principal_cents: 1000000000, interest_rate_bps: 500, day_count_convention: "ACT_365", payment_frequency: "SEMI_ANNUAL", maturity_date: "2030-12-15", notice_period_days: 30 }, as: PlatformAdmin, captures: { t365: $.data.id } }
            - { call: "POST /indentures/${ind365}/activate", payload: {}, as: PlatformAdmin }
            - { call: "POST /positions", payload: { tranche_id: "${t365}", noteholder_account_id: "${nha}", original_principal_cents: 400000000 }, as: PlatformAdmin }
            - { call: "POST /positions", payload: { tranche_id: "${t365}", noteholder_account_id: "${nhb}", original_principal_cents: 350000000 }, as: PlatformAdmin }
            - { call: "POST /positions", payload: { tranche_id: "${t365}", noteholder_account_id: "${nhc}", original_principal_cents: 250000000 }, as: PlatformAdmin }
            - { call: "POST /payment-runs", payload: { tranche_id: "${t360}", payment_type: "INTEREST", period_start_date: "2026-06-15", period_end_date: "2026-12-15", scheduled_payment_date: "2026-12-15" }, as: TrustOfficer, captures: { run360: $.data.id } }
            - { call: "POST /payment-runs", payload: { tranche_id: "${t365}", payment_type: "INTEREST", period_start_date: "2026-06-15", period_end_date: "2026-12-15", scheduled_payment_date: "2026-12-15" }, as: TrustOfficer, captures: { run365: $.data.id } }
            - { call: "POST /payment-runs/${run360}/fund", payload: { amount_cents: 25416667 }, as: Issuer, as_user_id: "issuer-1" }
            - { call: "POST /payment-runs/${run365}/fund", payload: { amount_cents: 25068493 }, as: Issuer, as_user_id: "issuer-1" }
          trigger:
            - { call: "POST /payment-runs/${run360}/execute", payload: {}, as: TrustOfficer }
            - { call: "POST /payment-runs/${run365}/execute", payload: {}, as: TrustOfficer }
            - { call: "GET /distribution-records?payment_run_id=${run360}", payload: {}, as: TrustOfficer, captures: { d360_a: "$.data[0].allocated_cents", d360_b: "$.data[1].allocated_cents", d360_c: "$.data[2].allocated_cents" } }
            - { call: "GET /distribution-records?payment_run_id=${run365}", payload: {}, as: TrustOfficer, captures: { d365_a: "$.data[0].allocated_cents", d365_b: "$.data[1].allocated_cents", d365_c: "$.data[2].allocated_cents" } }
          assert:
            - "PaymentRun.${run360}.gross_amount_cents == 25416667"
            - "PaymentRun.${run365}.gross_amount_cents == 25068493"
            - "records of ${run360} in position-creation order are [10166667, 8895833, 6354167]"
            - "records of ${run365} in position-creation order are [10027397, 8773973, 6267123]"
            - "25416667 != 25068493 — identical inputs diverge solely by day_count_convention"

      - name: consent_record_date_vs_current_outstanding
        grounds:
          - calculations.consent_tabulation
          - entities.ConsentSolicitation.fields.tabulation_basis
          - entities.Position.fields.principal_history
        distinguishing_aspect: |
          Identical ballots (holders A+B CONSENT) pass under RECORD_DATE
          tabulation (weights frozen at record_date before a redemption:
          750000000 >= 80% of 900000001) but fail under CURRENT_OUTSTANDING
          (weights recomputed at close after the redemption: 675000001 <
          80% of 900000001) — entity domain: ConsentSolicitation governance,
          distinct from interest accrual.
        test_recipe:
          setup:
            - "Indenture with ACT_360 tranche (positions A 400000000, B 350000000, C 250000000)"
            - "Solicitation S1: RECORD_DATE basis, record_date 2026-06-01, expiry 2026-07-01, threshold 8000 bps; ballots A,B = CONSENT cast at 2026-06-05"
            - "SINKING_FUND_REDEMPTION run (target 99999999) executed at 2026-06-10, after record_date, before close"
            - "Solicitation S2: CURRENT_OUTSTANDING basis, same window and threshold, created after S1 reaches PASSED (terminal, so no window overlap); identical ballots cast"
          setup_api_calls:
            - { call: "POST /_clock/set_current_utc", payload: { to_iso8601: "2026-05-01T00:00:00Z" }, as: PlatformAdmin }
            - { call: "POST /indentures", payload: { name: "I1", issuer_ref: "issuer-1", governing_law: "NY", initial_trustee_ref: "trustee-alpha", annual_admin_fee_cents: 2500000, extraordinary_hourly_rate_cents: 45000, default_hourly_rate_cents: 65000 }, as: PlatformAdmin, captures: { ind: $.data.id } }
            - { call: "POST /tranches", payload: { indenture_id: "${ind}", series_code: "T1", original_principal_cents: 1000000000, interest_rate_bps: 500, day_count_convention: "ACT_360", payment_frequency: "SEMI_ANNUAL", maturity_date: "2030-12-15", notice_period_days: 30 }, as: PlatformAdmin, captures: { t1: $.data.id } }
            - { call: "POST /indentures/${ind}/activate", payload: {}, as: PlatformAdmin }
            - { call: "POST /noteholder-accounts", payload: { holder_ref: "H-A", legal_name: "Holder A", contact_email: "a@x.com" }, as: PlatformAdmin, captures: { nha: $.data.id } }
            - { call: "POST /noteholder-accounts", payload: { holder_ref: "H-B", legal_name: "Holder B", contact_email: "b@x.com" }, as: PlatformAdmin, captures: { nhb: $.data.id } }
            - { call: "POST /noteholder-accounts", payload: { holder_ref: "H-C", legal_name: "Holder C", contact_email: "c@x.com" }, as: PlatformAdmin, captures: { nhc: $.data.id } }
            - { call: "POST /positions", payload: { tranche_id: "${t1}", noteholder_account_id: "${nha}", original_principal_cents: 400000000 }, as: PlatformAdmin }
            - { call: "POST /positions", payload: { tranche_id: "${t1}", noteholder_account_id: "${nhb}", original_principal_cents: 350000000 }, as: PlatformAdmin }
            - { call: "POST /positions", payload: { tranche_id: "${t1}", noteholder_account_id: "${nhc}", original_principal_cents: 250000000 }, as: PlatformAdmin }
            - { call: "POST /consent-solicitations", payload: { indenture_id: "${ind}", subject_type: "AMEND_TERMS", amendment_payload: { annual_admin_fee_cents: 2600000 }, consent_threshold_bps: 8000, tabulation_basis: "RECORD_DATE", record_date: "2026-06-01", expiry_date: "2026-07-01" }, as: Issuer, as_user_id: "issuer-1", captures: { sol1: $.data.id } }
            - { call: "POST /consent-solicitations/${sol1}/open", payload: {}, as: TrustOfficer }
            - { call: "POST /_clock/set_current_utc", payload: { to_iso8601: "2026-06-05T00:00:00Z" }, as: PlatformAdmin }
            - { call: "POST /consent-solicitations/${sol1}/ballots", payload: { noteholder_account_id: "${nha}", vote: "CONSENT" }, as: Noteholder, as_user_id: "${nha}" }
            - { call: "POST /consent-solicitations/${sol1}/ballots", payload: { noteholder_account_id: "${nhb}", vote: "CONSENT" }, as: Noteholder, as_user_id: "${nhb}" }
            - { call: "POST /_clock/set_current_utc", payload: { to_iso8601: "2026-06-10T00:00:00Z" }, as: PlatformAdmin }
            - { call: "POST /payment-runs", payload: { tranche_id: "${t1}", payment_type: "SINKING_FUND_REDEMPTION", scheduled_payment_date: "2026-07-15", target_amount_cents: 99999999 }, as: TrustOfficer, captures: { red: $.data.id } }
            - { call: "POST /payment-runs/${red}/fund", payload: { amount_cents: 99999999 }, as: Issuer, as_user_id: "issuer-1" }
            - { call: "POST /payment-runs/${red}/execute", payload: {}, as: TrustOfficer }
            - { call: "POST /consent-solicitations/${sol1}/close", payload: {}, as: TrustOfficer }
            - { call: "POST /consent-solicitations", payload: { indenture_id: "${ind}", subject_type: "AMEND_TERMS", amendment_payload: { annual_admin_fee_cents: 2600000 }, consent_threshold_bps: 8000, tabulation_basis: "CURRENT_OUTSTANDING", record_date: "2026-06-01", expiry_date: "2026-07-01" }, as: Issuer, as_user_id: "issuer-1", captures: { sol2: $.data.id } }
            - { call: "POST /consent-solicitations/${sol2}/open", payload: {}, as: TrustOfficer }
            - { call: "POST /consent-solicitations/${sol2}/ballots", payload: { noteholder_account_id: "${nha}", vote: "CONSENT" }, as: Noteholder, as_user_id: "${nha}" }
            - { call: "POST /consent-solicitations/${sol2}/ballots", payload: { noteholder_account_id: "${nhb}", vote: "CONSENT" }, as: Noteholder, as_user_id: "${nhb}" }
          trigger:
            - { call: "POST /consent-solicitations/${sol2}/close", payload: {}, as: TrustOfficer }
          assert:
            - "ConsentSolicitation.${sol1}.status == PASSED (record-date weights 400000000+350000000=750000000; 750000000*10000 >= 8000*900000001)"
            - "ConsentSolicitation.${sol1}.consenting_principal_cents == 750000000"
            - "ConsentSolicitation.${sol2}.status == FAILED (current weights 360000001+315000000=675000001; 675000001*10000 < 8000*900000001)"
            - "ConsentSolicitation.${sol2}.consenting_principal_cents == 675000001"
            - "Tranche.${t1}.outstanding_principal_cents == 900000001"

      - name: covenant_ttm_vs_quarterly_annualized_basis
        grounds:
          - calculations.covenant_ratio_check
          - entities.CovenantObligation.fields.measurement_basis
        distinguishing_aspect: |
          Identical certificate financials (ttm_metric_value 2.5,
          metric_value 1.5, threshold MIN 2.0) PASS review on a TTM-basis
          obligation but are REJECTED with ERR_COVENANT_RATIO_FAILED on a
          QUARTERLY_ANNUALIZED-basis obligation — entity domain:
          CovenantCertificate review, distinct from both interest accrual
          and consent tabulation.
        test_recipe:
          setup:
            - "Active indenture with tranche; two DEBT_SERVICE_COVERAGE obligations, O_TTM (basis TTM) and O_QA (basis QUARTERLY_ANNUALIZED), both threshold_value 2.0 direction MIN"
            - "One certificate per obligation, each carrying ttm_metric_value 2.5 and metric_value 1.5"
          setup_api_calls:
            - { call: "POST /indentures", payload: { name: "I1", issuer_ref: "issuer-1", governing_law: "NY", initial_trustee_ref: "trustee-alpha", annual_admin_fee_cents: 2500000, extraordinary_hourly_rate_cents: 45000, default_hourly_rate_cents: 65000 }, as: PlatformAdmin, captures: { ind: $.data.id } }
            - { call: "POST /tranches", payload: { indenture_id: "${ind}", series_code: "T1", original_principal_cents: 1000000000, interest_rate_bps: 500, day_count_convention: "ACT_360", payment_frequency: "SEMI_ANNUAL", maturity_date: "2030-12-15" }, as: PlatformAdmin }
            - { call: "POST /indentures/${ind}/activate", payload: {}, as: PlatformAdmin }
            - { call: "POST /covenant-obligations", payload: { indenture_id: "${ind}", covenant_type: "DEBT_SERVICE_COVERAGE", frequency: "QUARTERLY", period_anchor_date: "2026-06-30", threshold_value: 2.0, threshold_direction: "MIN", measurement_basis: "TTM", grace_period_days: 10 }, as: TrustOfficer, captures: { ob_ttm: $.data.id } }
            - { call: "POST /covenant-obligations", payload: { indenture_id: "${ind}", covenant_type: "DEBT_SERVICE_COVERAGE", frequency: "QUARTERLY", period_anchor_date: "2026-06-30", threshold_value: 2.0, threshold_direction: "MIN", measurement_basis: "QUARTERLY_ANNUALIZED", grace_period_days: 10 }, as: TrustOfficer, captures: { ob_qa: $.data.id } }
            - { call: "POST /covenant-certificates", payload: { covenant_obligation_id: "${ob_ttm}", period_end_date: "2026-06-30", document_ref: "doc-1", metric_value: 1.5, ttm_metric_value: 2.5 }, as: Issuer, as_user_id: "issuer-1", captures: { cert_ttm: $.data.id } }
            - { call: "POST /covenant-certificates", payload: { covenant_obligation_id: "${ob_qa}", period_end_date: "2026-06-30", document_ref: "doc-2", metric_value: 1.5, ttm_metric_value: 2.5 }, as: Issuer, as_user_id: "issuer-1", captures: { cert_qa: $.data.id } }
          trigger:
            - { call: "POST /covenant-certificates/${cert_ttm}/review", payload: { decision: "ACCEPT" }, as: TrustOfficer }
            - { call: "POST /covenant-certificates/${cert_qa}/review", payload: { decision: "ACCEPT" }, as: TrustOfficer, captures: { err: $.data.error_id } }
          assert:
            - "CovenantCertificate.${cert_ttm}.status == ACCEPTED"
            - "CovenantObligation.${ob_ttm}.next_due_date == 2026-09-30 (advanced one QUARTERLY period)"
            - "review of ${cert_qa} rejected with error_id == ERR_COVENANT_RATIO_FAILED"
            - "CovenantCertificate.${cert_qa}.status == SUBMITTED (unchanged)"

  # =====================================================================
  # Rule 2 — combinatorial_formula (three different modes)
  # =====================================================================
  - rule_id: combinatorial_formula
    instances:
      - name: extraordinary_fee_tiered_rate_state_switch_and_cap
        grounds:
          - calculations.extraordinary_fee
          - entities.Indenture.fields.default_hourly_rate_cents
        distinguishing_aspect: |
          Mode (a): >=3 inputs with non-linear interaction — hours, the
          indenture-status rate switch, the 10h tier split at 1.5x, and the
          4x-annual-fee cap: DEFAULTED 12.5h -> 893750; ACTIVE 12.5h ->
          618750; ACTIVE 500h -> capped 10000000 (uncapped 33525000).
        test_recipe:
          setup:
            - "Indenture (annual fee 2500000, ext rate 45000, default rate 65000) ACTIVE with a tranche; a DefaultCase declared and cured so the extraordinary basis exists while status is ACTIVE"
            - "Second indenture DEFAULTED via a confirmed default, for the default-rate branch"
          setup_api_calls:
            - { call: "POST /_clock/set_current_utc", payload: { to_iso8601: "2026-05-01T00:00:00Z" }, as: PlatformAdmin }
            - { call: "POST /indentures", payload: { name: "I1", issuer_ref: "issuer-1", governing_law: "NY", initial_trustee_ref: "trustee-alpha", annual_admin_fee_cents: 2500000, extraordinary_hourly_rate_cents: 45000, default_hourly_rate_cents: 65000 }, as: PlatformAdmin, captures: { ind: $.data.id } }
            - { call: "POST /tranches", payload: { indenture_id: "${ind}", series_code: "T1", original_principal_cents: 1000000000, interest_rate_bps: 500, day_count_convention: "ACT_360", payment_frequency: "SEMI_ANNUAL", maturity_date: "2030-12-15" }, as: PlatformAdmin }
            - { call: "POST /indentures/${ind}/activate", payload: {}, as: PlatformAdmin }
            - { call: "POST /default-cases", payload: { indenture_id: "${ind}", default_type: "COVENANT_BREACH", cure_deadline: "2026-12-31T00:00:00Z" }, as: TrustOfficer, as_user_id: "officer-1", captures: { dc1: $.data.id } }
            - { call: "POST /default-cases/${dc1}/confirm", payload: {}, as: TrustManager, as_user_id: "manager-1" }
            - { call: "POST /default-cases/${dc1}/cure", payload: {}, as: TrustManager, as_user_id: "manager-1" }
            - { call: "POST /indentures", payload: { name: "I2", issuer_ref: "issuer-2", governing_law: "NY", initial_trustee_ref: "trustee-alpha", annual_admin_fee_cents: 2500000, extraordinary_hourly_rate_cents: 45000, default_hourly_rate_cents: 65000 }, as: PlatformAdmin, captures: { ind2: $.data.id } }
            - { call: "POST /tranches", payload: { indenture_id: "${ind2}", series_code: "T2", original_principal_cents: 100000000, interest_rate_bps: 500, day_count_convention: "ACT_360", payment_frequency: "SEMI_ANNUAL", maturity_date: "2030-12-15" }, as: PlatformAdmin }
            - { call: "POST /indentures/${ind2}/activate", payload: {}, as: PlatformAdmin }
            - { call: "POST /default-cases", payload: { indenture_id: "${ind2}", default_type: "PAYMENT", cure_deadline: "2026-12-31T00:00:00Z" }, as: TrustOfficer, as_user_id: "officer-1", captures: { dc2: $.data.id } }
            - { call: "POST /default-cases/${dc2}/confirm", payload: {}, as: TrustManager, as_user_id: "manager-1" }
          trigger:
            - { call: "POST /fee-invoices", payload: { indenture_id: "${ind}", invoice_type: "EXTRAORDINARY_SERVICE", service_period_start: "2026-05-01", service_period_end: "2026-05-31", extraordinary_hours: 12.5, description: "default admin (active rate)" }, as: TrustOfficer, as_user_id: "officer-1", captures: { inv_active: $.data.id } }
            - { call: "POST /fee-invoices", payload: { indenture_id: "${ind2}", invoice_type: "EXTRAORDINARY_SERVICE", service_period_start: "2026-05-01", service_period_end: "2026-05-31", extraordinary_hours: 12.5, description: "default admin (default rate)" }, as: TrustOfficer, as_user_id: "officer-1", captures: { inv_dflt: $.data.id } }
            - { call: "POST /fee-invoices", payload: { indenture_id: "${ind}", invoice_type: "EXTRAORDINARY_SERVICE", service_period_start: "2026-05-01", service_period_end: "2026-05-31", extraordinary_hours: 500, description: "huge engagement hits cap" }, as: TrustOfficer, as_user_id: "officer-1", captures: { inv_cap: $.data.id } }
          assert:
            - "FeeInvoice.${inv_active}.amount_cents == 618750 (10*45000 + 2.5*67500)"
            - "FeeInvoice.${inv_dflt}.amount_cents == 893750 (10*65000 + 2.5*97500)"
            - "FeeInvoice.${inv_cap}.amount_cents == 10000000 (min(33525000, 4*2500000))"
            - "Indenture.${ind}.status == ACTIVE and Indenture.${ind2}.status == DEFAULTED (rate switch evidence)"

      - name: pro_rata_largest_remainder_reconciliation
        grounds:
          - calculations.pro_rata_allocation
          - entities.DistributionRecord.fields.allocated_cents
        distinguishing_aspect: |
          Mode (b): pinned rounding order — floor per position FIRST, then
          reconcile remainder cents by largest fractional remainder. Target
          99999999 over principals 400000000/350000000/250000000 floors to
          39999999/34999999/24999999 (sum 99999997) and the 2 remainder cents
          go to the two largest fractions: final 39999999/35000000/25000000,
          sum exactly 99999999. A sum-then-round order would assign B and C
          differently (34999999.3 -> 34999999, 24999999.75 -> 25000000)
          and leave the total irreconciled against the funded gross.
        test_recipe:
          setup:
            - "Active indenture, ACT_360 tranche, positions A 400000000 / B 350000000 / C 250000000 (created in that order)"
            - "SINKING_FUND_REDEMPTION run, target 99999999, notice 30 days respected, fully funded"
          setup_api_calls:
            - { call: "POST /_clock/set_current_utc", payload: { to_iso8601: "2026-05-01T00:00:00Z" }, as: PlatformAdmin }
            - { call: "POST /indentures", payload: { name: "I1", issuer_ref: "issuer-1", governing_law: "NY", initial_trustee_ref: "trustee-alpha", annual_admin_fee_cents: 2500000, extraordinary_hourly_rate_cents: 45000, default_hourly_rate_cents: 65000 }, as: PlatformAdmin, captures: { ind: $.data.id } }
            - { call: "POST /tranches", payload: { indenture_id: "${ind}", series_code: "T1", original_principal_cents: 1000000000, interest_rate_bps: 500, day_count_convention: "ACT_360", payment_frequency: "SEMI_ANNUAL", maturity_date: "2030-12-15", notice_period_days: 30 }, as: PlatformAdmin, captures: { t1: $.data.id } }
            - { call: "POST /indentures/${ind}/activate", payload: {}, as: PlatformAdmin }
            - { call: "POST /noteholder-accounts", payload: { holder_ref: "H-A", legal_name: "Holder A", contact_email: "a@x.com" }, as: PlatformAdmin, captures: { nha: $.data.id } }
            - { call: "POST /noteholder-accounts", payload: { holder_ref: "H-B", legal_name: "Holder B", contact_email: "b@x.com" }, as: PlatformAdmin, captures: { nhb: $.data.id } }
            - { call: "POST /noteholder-accounts", payload: { holder_ref: "H-C", legal_name: "Holder C", contact_email: "c@x.com" }, as: PlatformAdmin, captures: { nhc: $.data.id } }
            - { call: "POST /positions", payload: { tranche_id: "${t1}", noteholder_account_id: "${nha}", original_principal_cents: 400000000 }, as: PlatformAdmin, captures: { pa: $.data.id } }
            - { call: "POST /positions", payload: { tranche_id: "${t1}", noteholder_account_id: "${nhb}", original_principal_cents: 350000000 }, as: PlatformAdmin, captures: { pb: $.data.id } }
            - { call: "POST /positions", payload: { tranche_id: "${t1}", noteholder_account_id: "${nhc}", original_principal_cents: 250000000 }, as: PlatformAdmin, captures: { pc: $.data.id } }
            - { call: "POST /payment-runs", payload: { tranche_id: "${t1}", payment_type: "SINKING_FUND_REDEMPTION", scheduled_payment_date: "2026-06-15", target_amount_cents: 99999999 }, as: TrustOfficer, captures: { red: $.data.id } }
            - { call: "POST /payment-runs/${red}/fund", payload: { amount_cents: 99999999 }, as: Issuer, as_user_id: "issuer-1" }
          trigger:
            - { call: "POST /payment-runs/${red}/execute", payload: {}, as: TrustOfficer }
            - { call: "GET /distribution-records?payment_run_id=${red}", payload: {}, as: TrustOfficer, captures: { ra: "$.data[0].allocated_cents", rb: "$.data[1].allocated_cents", rc: "$.data[2].allocated_cents" } }
          assert:
            - "DistributionRecord for position ${pa}: allocated_cents == 39999999"
            - "DistributionRecord for position ${pb}: allocated_cents == 35000000 (floor 34999999 + 1 remainder cent, fraction 0.65)"
            - "DistributionRecord for position ${pc}: allocated_cents == 25000000 (floor 24999999 + 1 remainder cent, fraction 0.75)"
            - "sum of allocated_cents == 99999999 == PaymentRun.${red}.gross_amount_cents (exact reconciliation)"
            - "Position.${pa}.principal_amount_cents == 360000001; Position.${pb} == 315000000; Position.${pc} == 225000000"
            - "Tranche.${t1}.outstanding_principal_cents == 900000001"

      - name: collateral_substitute_haircut_evaluation_order
        grounds:
          - calculations.collateral_coverage
          - entities.CollateralReleaseRequest.fields.post_release_coverage_bps
        distinguishing_aspect: |
          Mode (c): circular-looking dependency with pinned evaluation order —
          the substitute's haircut tier is selected from coverage EXCLUDING
          the substitute (796000000/1000000000 = 0.796 < 2.0 -> STANDARD tier
          2500 bps), then the substitute contributes 470000000*0.975 =
          458250000, giving post_release_coverage_bps == 12542. Including
          the substitute before tier selection (the circular reading) would
          select the HIGH tier and yield a different number.
        test_recipe:
          setup:
            - "Active indenture (outstanding 1000000000) with pledged items C1 SECURITIES appraised 800000000 (pledged value 796000000) and C2 REAL_ESTATE appraised 500000000"
            - "SUBSTITUTION request on C2 with SECURITIES substitute appraised 470000000, valuation 2026-04-01 (fresh at clock 2026-05-01)"
          setup_api_calls:
            - { call: "POST /_clock/set_current_utc", payload: { to_iso8601: "2026-05-01T00:00:00Z" }, as: PlatformAdmin }
            - { call: "POST /indentures", payload: { name: "I1", issuer_ref: "issuer-1", governing_law: "NY", initial_trustee_ref: "trustee-alpha", annual_admin_fee_cents: 2500000, extraordinary_hourly_rate_cents: 45000, default_hourly_rate_cents: 65000 }, as: PlatformAdmin, captures: { ind: $.data.id } }
            - { call: "POST /tranches", payload: { indenture_id: "${ind}", series_code: "T1", original_principal_cents: 1000000000, interest_rate_bps: 500, day_count_convention: "ACT_360", payment_frequency: "SEMI_ANNUAL", maturity_date: "2030-12-15" }, as: PlatformAdmin, captures: { t1: $.data.id } }
            - { call: "POST /indentures/${ind}/activate", payload: {}, as: PlatformAdmin }
            - { call: "POST /noteholder-accounts", payload: { holder_ref: "H-A", legal_name: "Holder A", contact_email: "a@x.com" }, as: PlatformAdmin, captures: { nha: $.data.id } }
            - { call: "POST /positions", payload: { tranche_id: "${t1}", noteholder_account_id: "${nha}", original_principal_cents: 1000000000 }, as: PlatformAdmin }
            - { call: "POST /collateral-items", payload: { indenture_id: "${ind}", description: "C1 securities", collateral_type: "SECURITIES", appraised_value_cents: 800000000, valuation_date: "2026-04-01" }, as: TrustOfficer }
            - { call: "POST /collateral-items", payload: { indenture_id: "${ind}", description: "C2 real estate", collateral_type: "REAL_ESTATE", appraised_value_cents: 500000000, valuation_date: "2026-04-01" }, as: TrustOfficer, captures: { c2: $.data.id, c2_v: $.data.version } }
          trigger:
            - { call: "POST /collateral-release-requests", payload: { collateral_item_id: "${c2}", request_type: "SUBSTITUTION", substitute_description: "substitute securities", substitute_collateral_type: "SECURITIES", substitute_appraised_value_cents: 470000000, substitute_valuation_date: "2026-04-15", expected_collateral_item_version: "${c2_v}" }, as: Issuer, as_user_id: "issuer-1", captures: { rr: $.data.id } }
            - { call: "POST /collateral-release-requests/${rr}/verify", payload: {}, as: TrustOfficer, as_user_id: "officer-1" }
          assert:
            - "CollateralReleaseRequest.${rr}.post_release_coverage_bps == 12542 (floor((796000000 + 458250000) * 10000 / 1000000000))"
            - "Substitute haircut tier is STANDARD (2500 bps) because coverage excluding the substitute is 7960 bps < 2.0 ratio — proving tier selection precedes substitute inclusion"

  # =====================================================================
  # Rule 3 — non_linear_state_machine (different entities)
  # =====================================================================
  - rule_id: non_linear_state_machine
    instances:
      - name: payment_run_parallel_funding_and_distribution_dimensions
        grounds:
          - state_machines.PaymentRun
          - entities.PaymentRun.fields.funding_status
          - entities.PaymentRun.fields.distribution_status
        distinguishing_aspect: |
          Two independent state axes on one entity: funding_status
          (UNFUNDED -> PARTIALLY_FUNDED -> FUNDED) evolves via /fund while
          distribution_status (SCHEDULED -> DISTRIBUTED -> REVERSED) evolves
          via /execute and /reverse; after reverse the combined state is
          funding FUNDED x distribution REVERSED — money stayed on deposit
          while distributions unwound, proving the dimensions are parallel,
          not a single linear pipeline.
        test_recipe:
          setup:
            - "Active indenture, ACT_360 tranche, single position 400000000"
            - "INTEREST run over [2026-06-15, 2026-12-15), gross 10166667"
          setup_api_calls:
            - { call: "POST /_clock/set_current_utc", payload: { to_iso8601: "2026-05-01T00:00:00Z" }, as: PlatformAdmin }
            - { call: "POST /indentures", payload: { name: "I1", issuer_ref: "issuer-1", governing_law: "NY", initial_trustee_ref: "trustee-alpha", annual_admin_fee_cents: 2500000, extraordinary_hourly_rate_cents: 45000, default_hourly_rate_cents: 65000 }, as: PlatformAdmin, captures: { ind: $.data.id } }
            - { call: "POST /tranches", payload: { indenture_id: "${ind}", series_code: "T1", original_principal_cents: 1000000000, interest_rate_bps: 500, day_count_convention: "ACT_360", payment_frequency: "SEMI_ANNUAL", maturity_date: "2030-12-15" }, as: PlatformAdmin, captures: { t1: $.data.id } }
            - { call: "POST /indentures/${ind}/activate", payload: {}, as: PlatformAdmin }
            - { call: "POST /noteholder-accounts", payload: { holder_ref: "H-A", legal_name: "Holder A", contact_email: "a@x.com" }, as: PlatformAdmin, captures: { nha: $.data.id } }
            - { call: "POST /positions", payload: { tranche_id: "${t1}", noteholder_account_id: "${nha}", original_principal_cents: 400000000 }, as: PlatformAdmin }
            - { call: "POST /payment-runs", payload: { tranche_id: "${t1}", payment_type: "INTEREST", period_start_date: "2026-06-15", period_end_date: "2026-12-15", scheduled_payment_date: "2026-12-15" }, as: TrustOfficer, captures: { run: $.data.id } }
            - { call: "POST /payment-runs/${run}/fund", payload: { amount_cents: 10000000 }, as: Issuer, as_user_id: "issuer-1" }
            - { call: "POST /payment-runs/${run}/execute", payload: {}, as: TrustOfficer, captures: { err_short: $.data.error_id } }
            - { call: "POST /payment-runs/${run}/fund", payload: { amount_cents: 166667 }, as: Issuer, as_user_id: "issuer-1" }
          trigger:
            - { call: "POST /payment-runs/${run}/execute", payload: {}, as: TrustOfficer }
            - { call: "POST /payment-runs/${run}/reverse", payload: {}, as: TrustManager, as_user_id: "manager-1" }
            - { call: "GET /payment-runs/${run}", payload: {}, as: TrustOfficer }
          assert:
            - "mid-chain execute with funded 10000000 < gross 10166667 rejected with error_id == ERR_FUNDING_SHORTFALL while distribution_status stayed SCHEDULED"
            - "after partial fund: funding_status == PARTIALLY_FUNDED, distribution_status == SCHEDULED"
            - "second fund of 166667 reaches funded == gross == 10166667 exactly -> FUNDED (equality suffices); after execute: distribution_status == DISTRIBUTED"
            - "after reverse: funding_status == FUNDED (dimension untouched), distribution_status == REVERSED — parallel axes demonstrated"
            - "the single DistributionRecord of the run is RETURNED; the sole position's principal_amount_cents remains 400000000 (interest never touches principal)"

      - name: fee_invoice_dispute_amend_reissue_cycle
        grounds:
          - state_machines.FeeInvoice
          - calculations.extraordinary_fee
        distinguishing_aspect: |
          Cyclic machine on FeeInvoice: ISSUED -> DISPUTED -> AMENDED ->
          ISSUED -> PAID, with amount_cents recomputed on amend (893750 at
          12.5h default-rate -> 520000 at 8.0h default-rate) — a review loop
          on one entity, distinct from PaymentRun's parallel dimensions.
        test_recipe:
          setup:
            - "Indenture I2 DEFAULTED (confirmed PAYMENT default), giving both the extraordinary basis and the default hourly rate"
            - "EXTRAORDINARY_SERVICE invoice drafted by officer-1 at 12.5 hours"
          setup_api_calls:
            - { call: "POST /_clock/set_current_utc", payload: { to_iso8601: "2026-05-01T00:00:00Z" }, as: PlatformAdmin }
            - { call: "POST /indentures", payload: { name: "I2", issuer_ref: "issuer-2", governing_law: "NY", initial_trustee_ref: "trustee-alpha", annual_admin_fee_cents: 2500000, extraordinary_hourly_rate_cents: 45000, default_hourly_rate_cents: 65000 }, as: PlatformAdmin, captures: { ind: $.data.id } }
            - { call: "POST /tranches", payload: { indenture_id: "${ind}", series_code: "T2", original_principal_cents: 100000000, interest_rate_bps: 500, day_count_convention: "ACT_360", payment_frequency: "SEMI_ANNUAL", maturity_date: "2030-12-15" }, as: PlatformAdmin }
            - { call: "POST /indentures/${ind}/activate", payload: {}, as: PlatformAdmin }
            - { call: "POST /default-cases", payload: { indenture_id: "${ind}", default_type: "PAYMENT", cure_deadline: "2026-12-31T00:00:00Z" }, as: TrustOfficer, as_user_id: "officer-1", captures: { dc: $.data.id } }
            - { call: "POST /default-cases/${dc}/confirm", payload: {}, as: TrustManager, as_user_id: "manager-1" }
            - { call: "POST /fee-invoices", payload: { indenture_id: "${ind}", invoice_type: "EXTRAORDINARY_SERVICE", service_period_start: "2026-05-01", service_period_end: "2026-05-31", extraordinary_hours: 12.5, description: "default administration" }, as: TrustOfficer, as_user_id: "officer-1", captures: { inv: $.data.id } }
          trigger:
            - { call: "POST /fee-invoices/${inv}/issue", payload: {}, as: TrustManager, as_user_id: "manager-1" }
            - { call: "POST /fee-invoices/${inv}/dispute", payload: {}, as: Issuer, as_user_id: "issuer-2" }
            - { call: "POST /fee-invoices/${inv}/amend", payload: { extraordinary_hours: 8.0, description: "revised hours" }, as: TrustOfficer, as_user_id: "officer-1" }
            - { call: "POST /fee-invoices/${inv}/issue", payload: {}, as: TrustManager, as_user_id: "manager-1" }
            - { call: "POST /fee-invoices/${inv}/pay", payload: {}, as: Issuer, as_user_id: "issuer-2" }
          assert:
            - "initial DRAFT amount_cents == 893750"
            - "cycle observed: ISSUED -> DISPUTED -> AMENDED -> ISSUED -> PAID on the same invoice id"
            - "AMENDED amount_cents == 520000 (8.0 * 65000, tier-1 only)"
            - "final status == PAID; drafted_by_user_id != issued_by_user_id throughout"

      - name: direction_circulating_effective_oscillation
        grounds:
          - state_machines.NoteholderDirection
          - calculations.quorum_tally
        distinguishing_aspect: |
          Cyclic threshold machine on NoteholderDirection (an entity distinct
          from PaymentRun and FeeInvoice): CIRCULATING -> EFFECTIVE when C's
          endorsement reaches exactly 25%, EFFECTIVE -> CIRCULATING again when
          C withdraws, then EFFECTIVE once more when A endorses — the loop is
          driven by live quorum re-evaluation, not by a new resource.
        test_recipe:
          setup:
            - "Active indenture, tranche with positions A 400000000 / B 350000000 / C 250000000; CONFIRMED default case"
            - "ACCELERATE direction circulating with expiry 2026-12-31"
          setup_api_calls:
            - { call: "POST /_clock/set_current_utc", payload: { to_iso8601: "2026-05-01T00:00:00Z" }, as: PlatformAdmin }
            - { call: "POST /indentures", payload: { name: "I1", issuer_ref: "issuer-1", governing_law: "NY", initial_trustee_ref: "trustee-alpha", annual_admin_fee_cents: 2500000, extraordinary_hourly_rate_cents: 45000, default_hourly_rate_cents: 65000 }, as: PlatformAdmin, captures: { ind: $.data.id } }
            - { call: "POST /tranches", payload: { indenture_id: "${ind}", series_code: "T1", original_principal_cents: 1000000000, interest_rate_bps: 500, day_count_convention: "ACT_360", payment_frequency: "SEMI_ANNUAL", maturity_date: "2030-12-15" }, as: PlatformAdmin, captures: { t1: $.data.id } }
            - { call: "POST /indentures/${ind}/activate", payload: {}, as: PlatformAdmin }
            - { call: "POST /noteholder-accounts", payload: { holder_ref: "H-A", legal_name: "Holder A", contact_email: "a@x.com" }, as: PlatformAdmin, captures: { nha: $.data.id } }
            - { call: "POST /noteholder-accounts", payload: { holder_ref: "H-B", legal_name: "Holder B", contact_email: "b@x.com" }, as: PlatformAdmin, captures: { nhb: $.data.id } }
            - { call: "POST /noteholder-accounts", payload: { holder_ref: "H-C", legal_name: "Holder C", contact_email: "c@x.com" }, as: PlatformAdmin, captures: { nhc: $.data.id } }
            - { call: "POST /positions", payload: { tranche_id: "${t1}", noteholder_account_id: "${nha}", original_principal_cents: 400000000 }, as: PlatformAdmin }
            - { call: "POST /positions", payload: { tranche_id: "${t1}", noteholder_account_id: "${nhb}", original_principal_cents: 350000000 }, as: PlatformAdmin }
            - { call: "POST /positions", payload: { tranche_id: "${t1}", noteholder_account_id: "${nhc}", original_principal_cents: 250000000 }, as: PlatformAdmin }
            - { call: "POST /default-cases", payload: { indenture_id: "${ind}", default_type: "PAYMENT", cure_deadline: "2026-12-31T00:00:00Z" }, as: TrustOfficer, as_user_id: "officer-1", captures: { dc: $.data.id } }
            - { call: "POST /default-cases/${dc}/confirm", payload: {}, as: TrustManager, as_user_id: "manager-1" }
            - { call: "GET /default-cases/${dc}", payload: {}, as: TrustOfficer, captures: { dc_v: $.data.version } }
            - { call: "POST /directions", payload: { default_case_id: "${dc}", instruction_type: "ACCELERATE", expires_at: "2026-12-31T00:00:00Z", expected_default_case_version: "${dc_v}" }, as: TrustOfficer, captures: { dir: $.data.id } }
            - { call: "POST /directions/${dir}/endorsements", payload: { noteholder_account_id: "${nhc}" }, as: Noteholder, as_user_id: "${nhc}", captures: { end_c: $.data.id } }
            - { call: "GET /directions/${dir}", payload: {}, as: TrustOfficer, captures: { st_after_c: $.data.status } }
          trigger:
            - { call: "POST /direction-endorsements/${end_c}/withdraw", payload: {}, as: Noteholder, as_user_id: "${nhc}" }
            - { call: "GET /directions/${dir}", payload: {}, as: TrustOfficer, captures: { st_after_wd: $.data.status, sup_after_wd: $.data.supporting_principal_cents } }
            - { call: "POST /directions/${dir}/endorsements", payload: { noteholder_account_id: "${nha}" }, as: Noteholder, as_user_id: "${nha}" }
            - { call: "GET /directions/${dir}", payload: {}, as: TrustOfficer, captures: { st_final: $.data.status, sup_final: $.data.supporting_principal_cents } }
          assert:
            - "captured st_after_c == EFFECTIVE (C's 250000000 is exactly 25% of 1000000000; inclusive threshold)"
            - "captured st_after_wd == CIRCULATING and sup_after_wd == 0 (cycle back on withdrawal)"
            - "captured st_final == EFFECTIVE and sup_final == 400000000 (A's endorsement)"
            - "endorsement ${end_c}.status == WITHDRAWN"

  # =====================================================================
  # Rule 4 — transitive_cascade (different triggers; depth >= 3 and >= 2)
  # =====================================================================
  - rule_id: transitive_cascade
    instances:
      - name: default_confirm_suspension_cascade
        grounds:
          - state_machines.Indenture.ACTIVE_to_DEFAULTED
          - state_machines.PaymentRun
          - state_machines.DistributionRecord
          - entities.NoteholderAccount.fields.total_unpaid_cents
        distinguishing_aspect: |
          Depth-4 chain from POST /default-cases/{id}/confirm: confirm ->
          Indenture ACTIVE->DEFAULTED (1) -> still-SCHEDULED runs SUSPENDED
          (2) -> PENDING DistributionRecords of already-DISTRIBUTED runs HELD
          (3) -> NoteholderAccount.total_unpaid_cents recomputed (4). Each
          link is caused by the previous one; the original trigger touches
          only the DefaultCase.
        test_recipe:
          setup:
            - "Active indenture, tranche, positions A 400000000 / B 350000000 / C 250000000"
            - "Run R1 INTEREST [2026-06-15, 2026-12-15) executed (records PENDING; clock 2026-05-01 < scheduled_payment_date so unsettled)"
            - "Run R2 INTEREST [2026-12-15, 2027-06-15) created, still SCHEDULED and UNFUNDED"
            - "DefaultCase declared (ALLEGED) by officer-1"
          setup_api_calls:
            - { call: "POST /_clock/set_current_utc", payload: { to_iso8601: "2026-05-01T00:00:00Z" }, as: PlatformAdmin }
            - { call: "POST /indentures", payload: { name: "I1", issuer_ref: "issuer-1", governing_law: "NY", initial_trustee_ref: "trustee-alpha", annual_admin_fee_cents: 2500000, extraordinary_hourly_rate_cents: 45000, default_hourly_rate_cents: 65000 }, as: PlatformAdmin, captures: { ind: $.data.id } }
            - { call: "POST /tranches", payload: { indenture_id: "${ind}", series_code: "T1", original_principal_cents: 1000000000, interest_rate_bps: 500, day_count_convention: "ACT_360", payment_frequency: "SEMI_ANNUAL", maturity_date: "2030-12-15" }, as: PlatformAdmin, captures: { t1: $.data.id } }
            - { call: "POST /indentures/${ind}/activate", payload: {}, as: PlatformAdmin }
            - { call: "POST /noteholder-accounts", payload: { holder_ref: "H-A", legal_name: "Holder A", contact_email: "a@x.com" }, as: PlatformAdmin, captures: { nha: $.data.id } }
            - { call: "POST /noteholder-accounts", payload: { holder_ref: "H-B", legal_name: "Holder B", contact_email: "b@x.com" }, as: PlatformAdmin, captures: { nhb: $.data.id } }
            - { call: "POST /noteholder-accounts", payload: { holder_ref: "H-C", legal_name: "Holder C", contact_email: "c@x.com" }, as: PlatformAdmin, captures: { nhc: $.data.id } }
            - { call: "POST /positions", payload: { tranche_id: "${t1}", noteholder_account_id: "${nha}", original_principal_cents: 400000000 }, as: PlatformAdmin }
            - { call: "POST /positions", payload: { tranche_id: "${t1}", noteholder_account_id: "${nhb}", original_principal_cents: 350000000 }, as: PlatformAdmin }
            - { call: "POST /positions", payload: { tranche_id: "${t1}", noteholder_account_id: "${nhc}", original_principal_cents: 250000000 }, as: PlatformAdmin }
            - { call: "POST /payment-runs", payload: { tranche_id: "${t1}", payment_type: "INTEREST", period_start_date: "2026-06-15", period_end_date: "2026-12-15", scheduled_payment_date: "2026-12-15" }, as: TrustOfficer, captures: { r1: $.data.id } }
            - { call: "POST /payment-runs/${r1}/fund", payload: { amount_cents: 25416667 }, as: Issuer, as_user_id: "issuer-1" }
            - { call: "POST /payment-runs/${r1}/execute", payload: {}, as: TrustOfficer }
            - { call: "POST /payment-runs", payload: { tranche_id: "${t1}", payment_type: "INTEREST", period_start_date: "2026-12-15", period_end_date: "2027-06-15", scheduled_payment_date: "2027-06-15" }, as: TrustOfficer, captures: { r2: $.data.id } }
            - { call: "POST /default-cases", payload: { indenture_id: "${ind}", default_type: "PAYMENT", cure_deadline: "2026-12-31T00:00:00Z" }, as: TrustOfficer, as_user_id: "officer-1", captures: { dc: $.data.id } }
          trigger:
            - { call: "POST /default-cases/${dc}/confirm", payload: {}, as: TrustManager, as_user_id: "manager-1" }
            - { call: "GET /distribution-records?payment_run_id=${r1}", payload: {}, as: TrustOfficer, captures: { rec_a_status: "$.data[0].status" } }
          assert:
            - "Indenture.${ind}.status == DEFAULTED and active_default_count == 1 (link 1)"
            - "PaymentRun.${r2}.distribution_status == SUSPENDED (link 2)"
            - "PaymentRun.${r1}.distribution_status == DISTRIBUTED (unchanged — already executed)"
            - "every DistributionRecord of ${r1} has status HELD (link 3)"
            - "NoteholderAccount.${nha}.total_unpaid_cents == 10166667 (link 4); total_received_cents == 0"
            - "NoteholderAccount.${nhb}.total_unpaid_cents == 8895833; NoteholderAccount.${nhc}.total_unpaid_cents == 6354167"

      - name: covenant_cure_certificate_cascade
        grounds:
          - state_machines.CovenantObligation
          - state_machines.DefaultCase
          - entities.Indenture.fields.covenant_posture
        distinguishing_aspect: |
          Depth-3 chain from POST /covenant-certificates/{id}/review ACCEPT on
          a BREACHED obligation: obligation rolls forward (1) -> linked ALLEGED
          DefaultCase (source_ref match) becomes CURED (2) -> Indenture
          covenant_posture and active_default_count recomputed (3). Trigger
          differs from default_confirm_suspension_cascade (a review decision,
          not a default confirmation).
        test_recipe:
          setup:
            - "Active indenture with QUARTERLY FINANCIAL_REPORT obligation, anchor 2026-06-30, grace 10 days"
            - "Clock advanced to 2026-07-11: sweep moved obligation OPEN->LATE->BREACHED and auto-created an ALLEGED DefaultCase (COVENANT_BREACH, source_ref = obligation)"
            - "Issuer submits a late certificate (is_late == true)"
          setup_api_calls:
            - { call: "POST /_clock/set_current_utc", payload: { to_iso8601: "2026-05-01T00:00:00Z" }, as: PlatformAdmin }
            - { call: "POST /indentures", payload: { name: "I1", issuer_ref: "issuer-1", governing_law: "NY", initial_trustee_ref: "trustee-alpha", annual_admin_fee_cents: 2500000, extraordinary_hourly_rate_cents: 45000, default_hourly_rate_cents: 65000 }, as: PlatformAdmin, captures: { ind: $.data.id } }
            - { call: "POST /tranches", payload: { indenture_id: "${ind}", series_code: "T1", original_principal_cents: 1000000000, interest_rate_bps: 500, day_count_convention: "ACT_360", payment_frequency: "SEMI_ANNUAL", maturity_date: "2030-12-15" }, as: PlatformAdmin }
            - { call: "POST /indentures/${ind}/activate", payload: {}, as: PlatformAdmin }
            - { call: "POST /covenant-obligations", payload: { indenture_id: "${ind}", covenant_type: "FINANCIAL_REPORT", frequency: "QUARTERLY", period_anchor_date: "2026-06-30", grace_period_days: 10 }, as: TrustOfficer, captures: { ob: $.data.id } }
            - { call: "POST /_clock/set_current_utc", payload: { to_iso8601: "2026-07-11T00:00:00Z" }, as: PlatformAdmin }
            - { call: "GET /default-cases?indenture_id=${ind}", payload: {}, as: TrustOfficer, captures: { auto_case: "$.data[0].id" } }
            - { call: "POST /covenant-certificates", payload: { covenant_obligation_id: "${ob}", period_end_date: "2026-06-30", document_ref: "doc-late" }, as: Issuer, as_user_id: "issuer-1", captures: { cert: $.data.id } }
          trigger:
            - { call: "POST /covenant-certificates/${cert}/review", payload: { decision: "ACCEPT" }, as: TrustOfficer, as_user_id: "officer-1" }
          assert:
            - "CovenantCertificate.${cert}.is_late == true and status == ACCEPTED"
            - "CovenantObligation.${ob}.status == OPEN and next_due_date == 2026-09-30 (link 1: roll-forward)"
            - "DefaultCase.${auto_case}.status == CURED (link 2: source_ref match cured automatically)"
            - "Indenture.${ind}.covenant_posture == CURRENT and active_default_count == 0 (link 3)"

      - name: consent_passed_covenant_waiver_cascade
        grounds:
          - state_machines.ConsentSolicitation
          - state_machines.CovenantObligation
          - state_machines.DefaultCase
        distinguishing_aspect: |
          Depth-3 chain from POST /consent-solicitations/{id}/close reaching
          PASSED for a WAIVE_COVENANT subject: solicitation PASSED (trigger)
          -> target CovenantObligation WAIVED (1) -> linked ALLEGED
          DefaultCase WAIVED (2) -> Indenture covenant_posture recomputed
          (3). Distinct trigger from the confirm- and review-driven cascades.
        test_recipe:
          setup:
            - "Active indenture, tranche, positions A 400000000 / B 350000000 / C 250000000"
            - "OPEN covenant obligation O with a manually declared ALLEGED COVENANT_BREACH DefaultCase whose source_ref == O"
            - "WAIVE_COVENANT solicitation targeting O: threshold 5000 bps, CURRENT_OUTSTANDING basis, window [2026-06-01, 2026-07-01], OPEN with ballots A,B = CONSENT"
          setup_api_calls:
            - { call: "POST /_clock/set_current_utc", payload: { to_iso8601: "2026-05-01T00:00:00Z" }, as: PlatformAdmin }
            - { call: "POST /indentures", payload: { name: "I1", issuer_ref: "issuer-1", governing_law: "NY", initial_trustee_ref: "trustee-alpha", annual_admin_fee_cents: 2500000, extraordinary_hourly_rate_cents: 45000, default_hourly_rate_cents: 65000 }, as: PlatformAdmin, captures: { ind: $.data.id } }
            - { call: "POST /tranches", payload: { indenture_id: "${ind}", series_code: "T1", original_principal_cents: 1000000000, interest_rate_bps: 500, day_count_convention: "ACT_360", payment_frequency: "SEMI_ANNUAL", maturity_date: "2030-12-15" }, as: PlatformAdmin, captures: { t1: $.data.id } }
            - { call: "POST /indentures/${ind}/activate", payload: {}, as: PlatformAdmin }
            - { call: "POST /noteholder-accounts", payload: { holder_ref: "H-A", legal_name: "Holder A", contact_email: "a@x.com" }, as: PlatformAdmin, captures: { nha: $.data.id } }
            - { call: "POST /noteholder-accounts", payload: { holder_ref: "H-B", legal_name: "Holder B", contact_email: "b@x.com" }, as: PlatformAdmin, captures: { nhb: $.data.id } }
            - { call: "POST /positions", payload: { tranche_id: "${t1}", noteholder_account_id: "${nha}", original_principal_cents: 400000000 }, as: PlatformAdmin }
            - { call: "POST /positions", payload: { tranche_id: "${t1}", noteholder_account_id: "${nhb}", original_principal_cents: 350000000 }, as: PlatformAdmin }
            - { call: "POST /covenant-obligations", payload: { indenture_id: "${ind}", covenant_type: "INSURANCE_CERT", frequency: "ANNUAL", period_anchor_date: "2026-12-31", grace_period_days: 10 }, as: TrustOfficer, captures: { ob: $.data.id } }
            - { call: "POST /default-cases", payload: { indenture_id: "${ind}", default_type: "COVENANT_BREACH", cure_deadline: "2026-12-31T00:00:00Z", source_ref: "${ob}" }, as: TrustOfficer, as_user_id: "officer-1", captures: { dc: $.data.id } }
            - { call: "POST /consent-solicitations", payload: { indenture_id: "${ind}", subject_type: "WAIVE_COVENANT", target_obligation_id: "${ob}", consent_threshold_bps: 5000, tabulation_basis: "CURRENT_OUTSTANDING", record_date: "2026-06-01", expiry_date: "2026-07-01" }, as: Issuer, as_user_id: "issuer-1", captures: { sol: $.data.id } }
            - { call: "POST /consent-solicitations/${sol}/open", payload: {}, as: TrustOfficer }
