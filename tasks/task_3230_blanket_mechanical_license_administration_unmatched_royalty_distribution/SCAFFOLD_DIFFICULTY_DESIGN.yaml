              payload: { reporting_month: "2026-06" }
              as: ServiceProviderUser
              as_user_id: "${dsp_id}"
              captures: { r0: $.data.id }
            - call: "POST /mlc/service-providers/${dsp_id}/usage-reports/${r0}/lines"
              payload: { isrc: "USAA19900011", track_title: "Merlin", plays_count: 100, duration_seconds: 100 }
