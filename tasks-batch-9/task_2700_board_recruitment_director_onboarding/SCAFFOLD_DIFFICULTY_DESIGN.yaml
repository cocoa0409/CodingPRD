      - name: interview_scheduling_state_error_wins_over_double_booking_error
        grounds:
          - validations.priority_40.ERR_CANDIDATE_STATE_INVALID
          - validations.priority_62.ERR_INTERVIEWER_DOUBLE_BOOKED
          - state_machines.Candidate.SCREEN_PASSED_to_INTERVIEWING
          - endpoints.POST_/governance/interviews
        distinguishing_aspect: |
          The same request violates two rules at once - the candidate is still SOURCED (priority 40) and the
          interviewer's calendar already holds an overlapping session (priority 62). Only the
          priority-40 error may be returned. The control call in the same instance sends the identical window
          for a SCREEN_PASSED candidate and must then surface ERR_INTERVIEWER_DOUBLE_BOOKED, which proves the
          second violation was genuinely present and merely outranked.
