        excluded_because:
          difficulty_instance: combinatorial_formula / bookable_capacity_nested_min_max
          rationale: "OCC stale-version on POST /reservations is exercised via the version captures and re-reads in that §1.8 instance's chain; a dedicated stale-version negative is mechanically identical."
      - name: occ_stale_version_on_enrollment_confirm
        claim_type: optimistic_concurrency
        grounds: ["concurrency_rules[enrollment-confirm-stale-workshop]"]
        distinguishing_aspect: "Confirming an enrollment with a stale expected_workshop_version (one behind current) -> ERR_STALE_VERSION (412)."
        test_recipe:
          setup: ["Workshop W OPEN seat_capacity 2; M1 confirmed (bumped workshop version); M2 applied, holding a stale version."]
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-02-01T00:00:00Z" }
              as: StudioManager
            - call: "POST /rooms"
