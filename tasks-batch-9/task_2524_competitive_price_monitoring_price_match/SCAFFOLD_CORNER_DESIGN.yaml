            - "Order 1 (AUTOMATED_RULE, window 2026-08-01T00:00:00Z .. 2026-08-02T00:00:00Z) is executed at 00:00, setting own_price 19400, last_price_change_at 2026-08-01T00:00:00Z, price_change_count 1, version 2."
            - "The clock then moves to 2026-08-04T00:00:00Z, a fresh observation at 20000 is collected, and order 2 (window from 2026-08-04T00:00:00Z, open-ended) is created, submitted and approved."
