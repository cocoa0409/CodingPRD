        as: SpaCoordinator
        captures: { g1: $.data.id, g1_v: $.data.version }
      - call: POST /guests/${g1}/intake-forms
        payload: { expected_guest_version: "${g1_v}", condition_codes: ["RECENT_SURGERY_90D"], medications: [] }
        as: Guest
        as_user_id: "${g1}"
        captures: { in1: $.data.id }
      - call: POST /intake-forms/${in1}/consent
        payload: { consent_version: "2026.1" }
        as: Guest
        as_user_id: "${g1}"
      - call: POST /intake-forms/${in1}/submit
        payload: {}
        as: Guest
        as_user_id: "${g1}"
      - call: POST /intake-forms/${in1}/screen
        payload: {}
        as: ComplianceOfficer
        as_user_id: "co-3"
      - call: POST /intake-forms/${in1}/override
        payload: { override_reason: "surgeon clearance on file" }
        as: SpaDirector
        as_user_id: "dir-1"
      - call: POST /therapists
        payload: { full_name: "Boundary Therapist", employment_type: "EMPLOYEE", commission_tier: "SENIOR", base_hourly_cost_cents: 5200, practice_state_code: "CA" }
        as: SpaDirector
        captures: { th: $.data.id }
      - call: POST /therapists/${th}/licenses
        payload: { license_number: "LMT-6001", license_type: "LMT", state_code: "CA", issued_on: "2024-01-01", expires_on: "2026-08-09", current_period_start_on: "2024-01-01", ce_hours_required: 0 }
        as: ComplianceOfficer
        as_user_id: "co-1"
        captures: { lic: $.data.id }
      - call: POST /therapist-licenses/${lic}/review
        payload: { decision: "VERIFIED" }
        as: ComplianceOfficer
        as_user_id: "co-2"
      - call: POST /therapists/${th}/certifications
        payload: { skill_code: "SWEDISH", scope_level: "BASIC", granted_on: "2026-01-01", expires_on: "2026-08-09" }
        as: ComplianceOfficer
        as_user_id: "co-1"
      - call: POST /therapists/${th}/shift-blocks
        payload: { block_type: "AVAILABLE", start_at: "2026-08-09T11:00:00.000Z", end_at: "2026-08-09T12:00:00.000Z" }
        as: SpaCoordinator
      trigger:
      - call: POST /appointments
        payload: { guest_id: "${g1}", treatment_type_id: "${tt_b}", room_id: "${room_a}", therapist_id: "${th}", start_at: "2026-08-09T11:01:00.000Z" }
        as: SpaCoordinator
        captures: { err_one_minute_past: $.data.error_id }
      - call: POST /appointments
        payload: { guest_id: "${g1}", treatment_type_id: "${tt_b}", room_id: "${room_a}", therapist_id: "${th}", start_at: "2026-08-09T11:00:00.000Z" }
