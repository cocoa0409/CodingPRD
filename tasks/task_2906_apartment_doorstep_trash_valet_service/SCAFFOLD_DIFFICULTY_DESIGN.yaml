              payload: { contractor_id: "${ct_id}", unit_from: 101, unit_to: 104, expected_service_night_version: "${n2_v}" }
              as: ValetOpsManager
              captures: { rt2_id: $.data.id }
          assert:
            - "the first route-assignment POST returns HTTP 409 with error_id == 'ERR_COMPACTOR_BLOCKED' while Property.${prop_id}.status == 'ACTIVE' and escalation_level == 1"
            - "GET /valet/route-assignments?service_night_id=${n2_id} returns 0 routes after the rejection and ServiceNight.${n2_id}.version == ${n2_v} — the OCC token was not consumed by the rejected write"
            - "the resolve moves CompactorIncident.${inc1_id}.status to 'RESOLVED' and Property.${prop_id}.escalation_level back to 0"
            - "the second route-assignment POST returns HTTP 201 with RouteAssignment.${rt2_id}.status == 'ASSIGNED' and unit_coverage_count == 4"
            - "ServiceNight.${n2_id}.assigned_unit_coverage_count == 4 after the successful create"

  - rule_id: resource_temporal_overlap
    instances:

      - name: contractor_service_windows_are_half_open_so_touching_boundary_is_allowed
        grounds:
          - validations[priority=15]
          - errors[ERR_CONTRACTOR_WINDOW_CONFLICT]
          - entities.ServiceNight.fields.service_window_start
          - entities.ServiceNight.fields.service_window_end
          - state_machines.RouteAssignment.initial_state
        distinguishing_aspect: |
          The shared resource is the valet's own labour time and the interval semantics are
          HALF-OPEN [start, end): a night whose window starts strictly inside a live route's window
          collides, while a night whose window starts at the exact instant the first one ends does
          not. Both candidate windows are 8 hours long and differ only in their start instant, so
          the pair isolates the open-versus-closed upper endpoint and nothing else.
        test_recipe:
          setup:
            - "Property 'Harbour Lofts' unit_count 4, contract ACTIVE, service_night_days SUN..THU"
            - "Night A on 2026-09-01 with an overnight window 2026-09-01T18:00:00Z -> 2026-09-02T04:00:00Z, carrying an ASSIGNED route for valet X over units 101-104"
            - "Night B on 2026-09-02 with window 2026-09-02T02:00:00Z -> 2026-09-02T10:00:00Z — starts two hours before night A's window ends"
            - "Night C on 2026-09-02 with window 2026-09-02T04:00:00Z -> 2026-09-02T12:00:00Z — starts at the exact instant night A's window ends"
          setup_api_calls:
            - call: "POST /valet/_clock/set_current_utc"
              payload: { to_iso8601: "2026-09-01T00:00:00Z" }
              as: PlatformAdmin
            - call: "POST /valet/properties"
              payload: { name: "Harbour Lofts", unit_count: 4, market_code: "ATL" }
              as: PlatformAdmin
              captures: { prop_id: $.data.id }
            - call: "POST /valet/properties/${prop_id}/contracts"
              payload: { per_unit_monthly_fee_cents: 3495, property_revenue_share_bps: 1500, service_night_days: ["SUN", "MON", "TUE", "WED", "THU"], effective_from: "2026-09-01", effective_to: "2027-08-31", sla_missed_threshold_bps: 1000 }
              as: BillingAnalyst
              as_user_id: "analyst-drafter"
              captures: { contract_id: $.data.id }
            - call: "POST /valet/contracts/${contract_id}/activate"
              payload: {}
              as: PlatformAdmin
            - call: "POST /valet/contractors"
              payload: { legal_name: "Val Ito", equipment_provided_by_company: true, sets_own_schedule: true, works_exclusively: false, weekly_committed_hours: 20 }
              as: ValetOpsManager
              captures: { ct_id: $.data.id }
            - call: "POST /valet/contractors/${ct_id}/documents"
              payload: { tax_form_type: "W9", direct_deposit_on_file: true }
              as: ValetOpsManager
            - call: "POST /valet/contractors/${ct_id}/background-check"
              payload: { result: "CLEAR" }
              as: ComplianceOfficer
              as_user_id: "co-screener"
            - call: "POST /valet/contractors/${ct_id}/classification"
              payload: { basis: "DECLARED" }
              as: ComplianceOfficer
              as_user_id: "co-screener"
            - call: "POST /valet/contracts/${contract_id}/service-nights"
              payload: { service_date: "2026-09-01", service_window_start: "2026-09-01T18:00:00.000Z", service_window_end: "2026-09-02T04:00:00.000Z" }
              as: ValetOpsManager
              captures: { na_id: $.data.id, na_v: $.data.version }
            - call: "POST /valet/contracts/${contract_id}/service-nights"
              payload: { service_date: "2026-09-02", service_window_start: "2026-09-02T02:00:00.000Z", service_window_end: "2026-09-02T10:00:00.000Z" }
              as: ValetOpsManager
              captures: { nb_id: $.data.id, nb_v: $.data.version }
            - call: "POST /valet/contracts/${contract_id}/service-nights"
              payload: { service_date: "2026-09-02", service_window_start: "2026-09-02T04:00:00.000Z", service_window_end: "2026-09-02T12:00:00.000Z" }
              as: ValetOpsManager
