# =============================================================================
# Scaffold: Criminal Record Expungement & Sealing (task_0542)
# Difficulty band: Expert
# =============================================================================

scenario: |
  Criminal Record Expungement & Sealing: eligibility screening by offense/waiting-period,
  petition assembly & filing, agency notification & objection window, hearing scheduling,
  court order & record-sealing distribution, background-vendor update, fee waiver, status
  tracking

domain_name: record-expungement
api_prefix: /expungement

complexity_profile:
  primary_archetype: compliance_audit
  secondary_archetype: workflow_orchestration
  complexity_layers:
    - cascading_side_effects
    - dual_variant_calculation
    - optimistic_concurrency
    - scheduled_actions        # logical clock gates waiting-periods & objection windows

  entity_topology: flat        # peer entities linked by FK fields; collections live directly under the prefix
  state_machine_shape: branching   # Petition forks GRANTED/DENIED and reverts FILED<->OBJECTION_REVIEW; SealingDistribution cycles FAILED<->QUEUED
  relationship_patterns:
    - one_to_many              # Petitioner -> CriminalRecords; CourtOrder -> SealingDistributions
    - many_to_many             # Petition <-> CriminalRecord via PetitionItem junction
    - cross_aggregate          # Hearing references Courtroom & Judge across aggregate boundaries
  role_model: peer_roles       # Petitioner owns its records/petitions; Clerk drives court process; Agency objects; Judge rules
  consistency_model: immediate

# =============================================================================
# 1.0 Response Envelope (FIXED)
# =============================================================================
response_envelope:
  success: |
    { "meta": { "api_request_id": "req_xxx", "api_request_timestamp": "ISO8601" },
      "response_type": "object" | "array", "data": {} }
  error: |
    { "meta": { ... }, "response_type": "error",
      "data": { "error_id": "ERR_XXX", "message": "..." } }
  pagination_fields: ["limit", "offset", "total_count", "has_more"]
  pagination_defaults: { limit: 10, min: 1, max: 100, offset: 0 }

# =============================================================================
# 1.1 Entity-Relationship Table
# =============================================================================
entities:
  - name: Petitioner
    parent: null
    common_fields: true      # id, created_at, updated_at, version
    fields:
      - { name: full_name, type: string, source: input, description: "Petitioner legal name" }
      - { name: date_of_birth, type: datetime, source: input, description: "Date of birth (ISO 8601)" }
      - { name: annual_income_cents, type: integer, source: input, description: "Self-reported annual household income in cents" }
      - { name: household_size, type: integer, source: input, description: "Number of persons in household; used in poverty-line calc", constraints: ">= 1" }
      - { name: monthly_liquid_assets_cents, type: integer, source: input, default: 0, description: "Liquid assets in cents; used in fee-waiver asset test" }
      - { name: fee_paid_cents, type: integer, source: system, default: 0, description: "Running ledger of filing fees this petitioner has paid across all petitions" }
      - { name: fee_refunded_cents, type: integer, source: system, default: 0, description: "Running ledger of filing fees refunded to this petitioner on withdrawal" }

  - name: Courtroom
    parent: null
    common_fields: false     # id, created_at only (configuration resource)
    fields:
      - { name: name, type: string, source: input, description: "Courtroom label" }
      - { name: jurisdiction_code, type: string, source: input, description: "Jurisdiction this room serves; must match petition jurisdiction to host its hearing" }

  - name: Judge
    parent: null
    common_fields: false
    fields:
      - { name: name, type: string, source: input, description: "Judge name" }
      - { name: jurisdiction_code, type: string, source: input, description: "Jurisdiction this judge presides over" }

  - name: BackgroundVendor
    parent: null
    common_fields: false
    fields:
      - { name: name, type: string, source: input, description: "Background-check vendor name" }
      - { name: api_endpoint, type: string, source: input, description: "Vendor callback URL for sealing updates" }
      - { name: records_updated_count, type: integer, source: system, default: 0, description: "Count of sealing distributions this vendor has ACKNOWLEDGED" }

  - name: CriminalRecord
    parent: null
    common_fields: true
    fields:
      - { name: petitioner_id, type: string, source: input, description: "FK -> Petitioner.id" }
      - { name: offense_code, type: string, source: input, description: "Statutory offense code (free text)" }
      - { name: offense_class, type: enum, source: input, description: "INFRACTION | MISDEMEANOR | FELONY_CLASS_C | FELONY_CLASS_B | FELONY_CLASS_A | VIOLENT_FELONY" }
      - { name: disposition, type: enum, source: input, description: "CONVICTED | DISMISSED | ARREST_ONLY | ACQUITTED" }
      - { name: disposition_date, type: datetime, source: input, description: "Date the case was disposed" }
      - { name: sentence_completion_date, type: datetime, source: input, default: null, description: "Date sentence completed; required for CONVICTED, null otherwise" }
      - { name: status, type: enum, source: system, description: "UNSCREENED | ELIGIBLE | INELIGIBLE | SEALED" }
      - { name: eligible_on, type: datetime, source: computed, default: null, description: "Earliest date this record may be expunged; set by screening" }
      - { name: ineligible_reason, type: enum, source: computed, default: null, description: "NEVER_ELIGIBLE | WAITING_PERIOD (set when screening yields INELIGIBLE)" }

  - name: Petition
    parent: null
    common_fields: true
    fields:
      - { name: petitioner_id, type: string, source: input, description: "FK -> Petitioner.id" }
      - { name: jurisdiction_code, type: string, source: input, description: "Jurisdiction the petition is filed in" }
      - { name: status, type: enum, source: system, description: "DRAFT | SCREENED | FILED | OBJECTION_REVIEW | HEARING_SET | GRANTED | DENIED | WITHDRAWN" }
      - { name: provisional_fee_cents, type: integer, source: computed, default: null, description: "Estimated filing fee over ALL candidate records; set on SCREENED" }
      - { name: final_fee_cents, type: integer, source: computed, default: null, description: "Filing fee over ELIGIBLE records only; set on FILED" }
      - { name: amount_paid_cents, type: integer, source: system, default: 0, description: "Total fee paid toward this petition" }
      - { name: fee_due_cents, type: integer, source: computed, default: null, description: "= max(final_fee_cents - amount_paid_cents, 0); 0 when fee_waived" }
      - { name: fee_waived, type: boolean, source: computed, default: false, description: "True once an associated FeeWaiver is GRANTED" }

  - name: PetitionItem
    parent: null
    common_fields: false     # junction row; id, created_at only, immutable snapshot
    fields:
      - { name: petition_id, type: string, source: system, description: "FK -> Petition.id" }
      - { name: record_id, type: string, source: system, description: "FK -> CriminalRecord.id" }
      - { name: eligibility_at_screening, type: enum, source: computed, default: null, description: "ELIGIBLE | INELIGIBLE snapshot captured when the petition reaches SCREENED" }
      - { name: fee_at_screening_cents, type: integer, source: computed, default: null, description: "Per-record fee captured at SCREENED (round_half_up per record)" }

  - name: FeeWaiver
    parent: null
    common_fields: true
    fields:
      - { name: petitioner_id, type: string, source: input, description: "FK -> Petitioner.id" }
      - { name: petition_id, type: string, source: input, description: "FK -> Petition.id" }
      - { name: status, type: enum, source: system, description: "REQUESTED | GRANTED | DENIED | SUPERSEDED" }
      - { name: determination_basis, type: enum, source: computed, description: "INCOME_UNDER_125 | OVER_THRESHOLD (computed at request time)" }
      - { name: income_threshold_cents, type: integer, source: computed, description: "125% federal-poverty-line threshold for the petitioner's household_size at request time" }

  - name: AgencyNotification
    parent: null
    common_fields: true
    fields:
      - { name: petition_id, type: string, source: system, description: "FK -> Petition.id" }
      - { name: agency_type, type: enum, source: system, description: "DA | ARRESTING_AGENCY | STATE_REPOSITORY (one row of each is created on FILED)" }
      - { name: status, type: enum, source: system, description: "PENDING | SERVED | OBJECTED | CLEARED" }
      - { name: served_at, type: datetime, source: system, default: null, description: "Logical-clock time the notice was served" }
      - { name: objection_deadline, type: datetime, source: computed, default: null, description: "= served_at + OBJECTION_WINDOW_DAYS; end of the objection window" }

  - name: Objection
    parent: null
    common_fields: true
    fields:
      - { name: notification_id, type: string, source: system, description: "FK -> AgencyNotification.id" }
      - { name: grounds, type: string, source: input, description: "Free-text objection grounds" }
      - { name: status, type: enum, source: system, description: "REQUESTED | SUSTAINED | OVERRULED" }
      - { name: filed_at, type: datetime, source: system, description: "Logical-clock time the objection was filed" }

  - name: Hearing
    parent: null
    common_fields: true
    fields:
      - { name: petition_id, type: string, source: system, description: "FK -> Petition.id" }
      - { name: courtroom_id, type: string, source: input, description: "FK -> Courtroom.id" }
      - { name: judge_id, type: string, source: input, description: "FK -> Judge.id" }
      - { name: scheduled_start, type: datetime, source: input, description: "Hearing start (ISO 8601, inclusive)" }
      - { name: scheduled_end, type: datetime, source: input, description: "Hearing end (ISO 8601, exclusive)" }
      - { name: status, type: enum, source: system, description: "SCHEDULED | HELD | VACATED | SUPERSEDED" }

  - name: CourtOrder
    parent: null
    common_fields: true
    fields:
      - { name: petition_id, type: string, source: system, description: "FK -> Petition.id" }
      - { name: hearing_id, type: string, source: system, description: "FK -> Hearing.id" }
      - { name: disposition, type: enum, source: input, description: "GRANTED | DENIED" }
      - { name: status, type: enum, source: system, description: "ENTERED | DISTRIBUTED | VACATED" }
      - { name: entered_at, type: datetime, source: system, description: "Logical-clock time the order was entered" }

  - name: SealingDistribution
    parent: null
    common_fields: true
    fields:
      - { name: court_order_id, type: string, source: system, description: "FK -> CourtOrder.id" }
      - { name: recipient_type, type: enum, source: system, description: "DA | ARRESTING_AGENCY | STATE_REPOSITORY | BACKGROUND_VENDOR" }
      - { name: recipient_ref, type: string, source: system, description: "Polymorphic recipient handle: BackgroundVendor.id when recipient_type=BACKGROUND_VENDOR, else the agency code string (NOT a canonical FK)" }
      - { name: status, type: enum, source: system, description: "QUEUED | SENT | ACKNOWLEDGED | FAILED | CANCELLED" }
      - { name: attempt_count, type: integer, source: system, default: 0, description: "Number of send retries consumed (retry increments by 1)" }

# =============================================================================
# 1.2 State Machine Table
# =============================================================================
state_machines:
  - entity: CriminalRecord
    initial_state: UNSCREENED
    terminal_states: []
    transitions:
      - from: UNSCREENED
        to: ELIGIBLE
        trigger: "POST /expungement/criminal-records/{id}/screen"
        actor: Clerk
        preconditions:
          - "offense_class != VIOLENT_FELONY"
          - "current logical clock >= computed eligible_on (see record_eligibility)"
        side_effects:
          - "eligible_on = base_date + waiting_period(offense_class), where base_date = sentence_completion_date for CONVICTED else disposition_date"
          - "status = ELIGIBLE"
      - from: UNSCREENED
        to: INELIGIBLE
        trigger: "POST /expungement/criminal-records/{id}/screen"
        actor: Clerk
        preconditions: []
        side_effects:
          - "ineligible_reason = NEVER_ELIGIBLE when offense_class == VIOLENT_FELONY, else WAITING_PERIOD when clock < eligible_on"
          - "eligible_on set when computable (WAITING_PERIOD case); left null for NEVER_ELIGIBLE"
          - "status = INELIGIBLE"
      - from: INELIGIBLE
        to: ELIGIBLE
        trigger: "POST /expungement/criminal-records/{id}/screen"
        actor: Clerk
        preconditions:
          - "offense_class != VIOLENT_FELONY"
          - "current logical clock >= eligible_on"
        side_effects: ["status = ELIGIBLE (re-screen after the waiting period elapses)"]
      - from: ELIGIBLE
        to: SEALED
        trigger: "system: CourtOrder GRANTED cascade (POST /expungement/hearings/{id}/order)"
        actor: system
        preconditions: ["record is an ELIGIBLE item of the granted petition"]
        side_effects: ["status = SEALED; this transition itself queues one SealingDistribution set (transitive hop 3)"]
      - from: SEALED
        to: ELIGIBLE
        trigger: "system: CourtOrder VACATED compensation (POST /expungement/court-orders/{id}/vacate)"
        actor: system
        preconditions: []
        side_effects: ["status = ELIGIBLE (unseal); restores the sealed-record conservation invariant"]

  - entity: Petition
    initial_state: DRAFT
    terminal_states: [GRANTED, DENIED, WITHDRAWN]
    transitions:
      - from: DRAFT
        to: SCREENED
        trigger: "POST /expungement/petitions/{id}/transition (to_status=SCREENED)"
        actor: Clerk
        preconditions:
          - "petition has >= 1 PetitionItem"
          - "every item's record status IN {ELIGIBLE, INELIGIBLE} (all records screened) — ERR_RECORDS_NOT_SCREENED"
        side_effects:
          - "provisional_fee_cents = SUM over ALL items of round_half_up(base_fee[class]*disp_mult[disp]*1.075) (round per-record then sum)"
          - "each PetitionItem.eligibility_at_screening + fee_at_screening_cents snapshotted"
          - "increments Petition.version by 1"
      - from: SCREENED
        to: FILED
        trigger: "POST /expungement/petitions/{id}/transition (to_status=FILED)"
        actor: Clerk
        preconditions:
          - "at least one item with eligibility_at_screening == ELIGIBLE — else ERR_NO_ELIGIBLE_RECORDS (business_safety)"
          - "fee satisfied: fee_waived == true OR amount_paid_cents >= final_fee_cents — else ERR_FILING_FEE_UNPAID (business_fiscal)"
        side_effects:
          - "final_fee_cents = SUM over ELIGIBLE items only of round_half_up(base_fee*disp_mult*1.075)"
          - "fee_due_cents = 0 if fee_waived else max(final_fee_cents - amount_paid_cents, 0)"
          - "create 3 AgencyNotification rows (DA, ARRESTING_AGENCY, STATE_REPOSITORY) each status=PENDING"
          - "increments Petition.version by 1"
      - from: FILED
        to: OBJECTION_REVIEW
        trigger: "system: Objection filed (POST /expungement/agency-notifications/{id}/objections)"
        actor: system
        preconditions: ["the objected notification belongs to this petition"]
        side_effects:
          - "transitive cascade hop 2: notification -> OBJECTED (hop 1) itself drives petition -> OBJECTION_REVIEW"
          - "increments Petition.version by 1"
      - from: OBJECTION_REVIEW
        to: FILED
        trigger: "system: Objection OVERRULED (POST /expungement/objections/{id}/transition to_status=OVERRULED)"
        actor: system
        preconditions: ["no other notification of this petition is still OBJECTED"]
        side_effects: ["revert loop back to FILED; increments Petition.version by 1"]
      - from: OBJECTION_REVIEW
        to: DENIED
        trigger: "system: Objection SUSTAINED (POST /expungement/objections/{id}/transition to_status=SUSTAINED)"
        actor: system
        preconditions: []
        side_effects: ["branch: petition terminally DENIED; increments Petition.version by 1"]
      - from: FILED
        to: HEARING_SET
        trigger: "POST /expungement/petitions/{id}/hearings"
        actor: Clerk
        preconditions:
          - "courtroom.jurisdiction_code == petition.jurisdiction_code AND judge.jurisdiction_code == petition.jurisdiction_code — else ERR_JURISDICTION_MISMATCH (business_referential)"
          - "no Courtroom temporal conflict (buffer semantics) — else ERR_COURTROOM_UNAVAILABLE (business_temporal)"
          - "no Judge temporal conflict (half-open semantics) — else ERR_JUDGE_UNAVAILABLE (business_temporal)"
          - "every AgencyNotification of this petition is CLEARED — else ERR_NOTIFICATIONS_NOT_CLEARED (business_safety)"
        side_effects:
          - "create Hearing status=SCHEDULED"
          - "increments Petition.version by 1"
      - from: HEARING_SET
        to: HEARING_SET
        trigger: "POST /expungement/petitions/{id}/hearings (reschedule)"
        actor: Clerk
        preconditions:
          - "expected_petition_version matches Petition.version (OCC) — else ERR_STALE_VERSION (412)"
          - "same jurisdiction + temporal checks as FILED->HEARING_SET"
        side_effects:
          - "prior SCHEDULED Hearing of this petition -> SUPERSEDED"
          - "create replacement Hearing status=SCHEDULED"
          - "increments Petition.version by 1"
      - from: HEARING_SET
        to: GRANTED
        trigger: "system: CourtOrder disposition=GRANTED (POST /expungement/hearings/{id}/order)"
        actor: system
        preconditions: ["the hearing is HELD — else ERR_HEARING_NOT_HELD"]
        side_effects:
          - "transitive cascade hop 1: petition -> GRANTED"
          - "hop 2: every item with eligibility_at_screening==ELIGIBLE -> its CriminalRecord.status = SEALED"
          - "hop 3: each newly SEALED record fans a SealingDistribution set (3 agency rows + 1 per BackgroundVendor) status=QUEUED"
          - "increments Petition.version by 1"
      - from: HEARING_SET
        to: DENIED
        trigger: "system: CourtOrder disposition=DENIED (POST /expungement/hearings/{id}/order)"
        actor: system
        preconditions: ["the hearing is HELD"]
        side_effects: ["petition terminally DENIED; no records sealed; increments Petition.version by 1"]
      - from: DRAFT
        to: WITHDRAWN
        trigger: "POST /expungement/petitions/{id}/transition (to_status=WITHDRAWN)"
        actor: Petitioner
        preconditions: []
        side_effects: ["petition -> WITHDRAWN"]
      - from: SCREENED
        to: WITHDRAWN
        trigger: "POST /expungement/petitions/{id}/transition (to_status=WITHDRAWN)"
        actor: Petitioner
        preconditions: []
        side_effects:
          - "compensation: Petitioner.fee_refunded_cents += Petition.amount_paid_cents (conserves the fee ledger)"
          - "petition -> WITHDRAWN"
      - from: FILED
        to: WITHDRAWN
        trigger: "POST /expungement/petitions/{id}/transition (to_status=WITHDRAWN)"
        actor: Petitioner
        preconditions: []
        side_effects:
          - "compensation: Petitioner.fee_refunded_cents += Petition.amount_paid_cents"
          - "all non-CLEARED AgencyNotifications -> CLEARED"
          - "petition -> WITHDRAWN"
      - from: HEARING_SET
        to: WITHDRAWN
        trigger: "POST /expungement/petitions/{id}/transition (to_status=WITHDRAWN)"
        actor: Petitioner
        preconditions: []
        side_effects:
          - "compensation: Petitioner.fee_refunded_cents += Petition.amount_paid_cents"
          - "any SCHEDULED Hearing -> VACATED"
          - "petition -> WITHDRAWN"

  - entity: FeeWaiver
    initial_state: REQUESTED
    terminal_states: [GRANTED, DENIED, SUPERSEDED]
    transitions:
      - from: REQUESTED
        to: GRANTED
        trigger: "POST /expungement/fee-waivers/{id}/transition (to_status=GRANTED)"
        actor: Clerk
        preconditions: ["determination_basis == INCOME_UNDER_125 — else ERR_WAIVER_NOT_ELIGIBLE"]
        side_effects:
          - "referenced Petition.fee_waived = true; Petition.fee_due_cents = 0"
          - "increments FeeWaiver.version by 1"
      - from: REQUESTED
        to: DENIED
        trigger: "POST /expungement/fee-waivers/{id}/transition (to_status=DENIED)"
        actor: Clerk
        preconditions: []
        side_effects: ["increments FeeWaiver.version by 1"]
      - from: REQUESTED
        to: SUPERSEDED
        trigger: "system: a newer FeeWaiver is created for the same petition (POST /expungement/fee-waivers)"
        actor: system
        preconditions: []
        side_effects: ["prior REQUESTED waiver for this petition is superseded"]

  - entity: AgencyNotification
    initial_state: PENDING
    terminal_states: [CLEARED]
    transitions:
      - from: PENDING
        to: SERVED
        trigger: "POST /expungement/agency-notifications/{id}/transition (to_status=SERVED)"
        actor: Clerk
        preconditions: []
        side_effects:
          - "served_at = current logical clock"
          - "objection_deadline = served_at + OBJECTION_WINDOW_DAYS"
          - "increments AgencyNotification.version by 1"
      - from: SERVED
        to: OBJECTED
        trigger: "system: Objection filed (POST /expungement/agency-notifications/{id}/objections)"
        actor: system
        preconditions: ["current logical clock <= objection_deadline (within window) — else ERR_OBJECTION_WINDOW_CLOSED"]
        side_effects: ["transitive cascade hop 1: notification -> OBJECTED; increments version by 1"]
      - from: SERVED
        to: CLEARED
        trigger: "POST /expungement/agency-notifications/{id}/transition (to_status=CLEARED)"
        actor: Clerk
        preconditions:
          - "current logical clock >= objection_deadline (window elapsed) — else ERR_OBJECTION_WINDOW_OPEN"
          - "no REQUESTED objection outstanding on this notification"
        side_effects: ["increments AgencyNotification.version by 1"]
      - from: OBJECTED
        to: CLEARED
        trigger: "system: Objection OVERRULED (POST /expungement/objections/{id}/transition to_status=OVERRULED)"
        actor: system
        preconditions: []
        side_effects: ["increments AgencyNotification.version by 1"]

  - entity: Objection
    initial_state: REQUESTED
    terminal_states: [SUSTAINED, OVERRULED]
    transitions:
      - from: REQUESTED
        to: SUSTAINED
        trigger: "POST /expungement/objections/{id}/transition (to_status=SUSTAINED)"
        actor: Clerk
        preconditions: []
        side_effects: ["cascade: petition OBJECTION_REVIEW -> DENIED; increments Objection.version by 1"]
      - from: REQUESTED
        to: OVERRULED
        trigger: "POST /expungement/objections/{id}/transition (to_status=OVERRULED)"
        actor: Clerk
        preconditions: []
        side_effects:
          - "cascade: parent notification OBJECTED -> CLEARED; if no other OBJECTED notice, petition OBJECTION_REVIEW -> FILED"
          - "increments Objection.version by 1"

  - entity: Hearing
    initial_state: SCHEDULED
    terminal_states: [HELD, VACATED, SUPERSEDED]
    transitions:
      - from: SCHEDULED
        to: HELD
        trigger: "POST /expungement/hearings/{id}/transition (to_status=HELD)"
        actor: Clerk
        preconditions: []
        side_effects: ["increments Hearing.version by 1"]
      - from: SCHEDULED
        to: VACATED
        trigger: "POST /expungement/hearings/{id}/transition (to_status=VACATED)"
        actor: Clerk
        preconditions: []
        side_effects: ["increments Hearing.version by 1"]
      - from: SCHEDULED
        to: SUPERSEDED
        trigger: "system: petition reschedule (POST /expungement/petitions/{id}/hearings)"
        actor: system
        preconditions: []
        side_effects: ["replaced by the newly created Hearing"]

  - entity: CourtOrder
    initial_state: ENTERED
    terminal_states: [VACATED]
    transitions:
      - from: ENTERED
        to: DISTRIBUTED
        trigger: "system: all sibling SealingDistributions ACKNOWLEDGED (bubble-up from POST /expungement/sealing-distributions/{id}/transition)"
        actor: system
        preconditions: ["disposition == GRANTED", "every SealingDistribution of this order is ACKNOWLEDGED"]
        side_effects: ["increments CourtOrder.version by 1"]
      - from: ENTERED
        to: VACATED
        trigger: "POST /expungement/court-orders/{id}/vacate"
        actor: Judge
        preconditions: ["disposition == GRANTED — else ERR_INVALID_STATE"]
        side_effects:
          - "compensation: every SEALED record of this order's petition -> ELIGIBLE (unseal)"
          - "every non-terminal SealingDistribution of this order -> CANCELLED"
          - "increments CourtOrder.version by 1"
      - from: DISTRIBUTED
        to: VACATED
        trigger: "POST /expungement/court-orders/{id}/vacate"
        actor: Judge
        preconditions: []
        side_effects:
          - "compensation: every SEALED record of this order's petition -> ELIGIBLE (unseal)"
          - "increments CourtOrder.version by 1"

  - entity: SealingDistribution
    initial_state: QUEUED
    terminal_states: [ACKNOWLEDGED, CANCELLED]
    transitions:
      - from: QUEUED
        to: SENT
        trigger: "POST /expungement/sealing-distributions/{id}/transition (to_status=SENT)"
        actor: Clerk
        preconditions: []
        side_effects: ["increments SealingDistribution.version by 1"]
      - from: SENT
        to: ACKNOWLEDGED
        trigger: "POST /expungement/sealing-distributions/{id}/transition (to_status=ACKNOWLEDGED)"
        actor: Clerk
        preconditions: []
        side_effects:
          - "if recipient_type == BACKGROUND_VENDOR: BackgroundVendor(recipient_ref).records_updated_count += 1"
          - "bubble-up: if every sibling SealingDistribution of the order is ACKNOWLEDGED and order.disposition==GRANTED -> CourtOrder -> DISTRIBUTED"
          - "increments SealingDistribution.version by 1"
      - from: SENT
        to: FAILED
        trigger: "POST /expungement/sealing-distributions/{id}/transition (to_status=FAILED)"
        actor: Clerk
        preconditions: []
        side_effects: ["increments SealingDistribution.version by 1"]
      - from: FAILED
        to: QUEUED
        trigger: "POST /expungement/sealing-distributions/{id}/transition (to_status=QUEUED)"
        actor: Clerk
        preconditions: ["attempt_count < MAX_ATTEMPTS (MAX_ATTEMPTS = 2) — else ERR_MAX_RETRIES_EXCEEDED"]
        side_effects:
          - "attempt_count += 1 (retry loop back to QUEUED)"
          - "increments SealingDistribution.version by 1"

# =============================================================================
# 1.2.1 Concurrency Rules
# =============================================================================
concurrency_rules:
  - rule_id: hearing-create-stale-petition
    parent_entity: Petition
    write_endpoint: "POST /expungement/petitions/{id}/hearings"
    occ_field: "expected_petition_version"
    description: |
      Scheduling (or rescheduling) a Hearing against a Petition whose version has
      advanced since the client last observed it is rejected. A reschedule from
      HEARING_SET legitimately supersedes the petition's prior SCHEDULED hearing,
      so a second create carrying a version the server has already moved past is a
      stale-view write and must fail on the version check rather than silently
      superseding a hearing the client never saw.
    error_id: ERR_STALE_VERSION
    http_status: 412

# =============================================================================
# 1.3 Calculation Rules Table
# =============================================================================
calculations:
  - name: record_eligibility
    trigger: "POST /expungement/criminal-records/{id}/screen"
    algorithm: threshold
    formula: |
      base_date = sentence_completion_date if disposition == CONVICTED else disposition_date
      eligible_on = base_date + WAITING_PERIOD_YEARS[offense_class] (calendar years)
      if offense_class in NEVER_ELIGIBLE:        status=INELIGIBLE, ineligible_reason=NEVER_ELIGIBLE, eligible_on=null
      elif current_clock >= eligible_on:         status=ELIGIBLE            # boundary is inclusive (>=)
      else:                                      status=INELIGIBLE, ineligible_reason=WAITING_PERIOD
    input_set: "the single record being screened; current_clock is the logical clock"
    constants:
      WAITING_PERIOD_YEARS: { INFRACTION: 1, MISDEMEANOR: 2, FELONY_CLASS_C: 3, FELONY_CLASS_B: 5, FELONY_CLASS_A: 7 }
      NEVER_ELIGIBLE: [VIOLENT_FELONY]
    precision: "date arithmetic in whole calendar years; comparison inclusive at eligible_on"
    variants:
      - name: sentence_based_base_date
        when: "disposition == CONVICTED (a sentence exists)"
        difference: "waiting period measured from sentence_completion_date"
      - name: disposition_based_base_date
        when: "disposition in {DISMISSED, ARREST_ONLY, ACQUITTED} (no sentence)"
        difference: "waiting period measured from disposition_date; for identical dates this yields a different eligible_on than the sentence-based variant"

  - name: petition_filing_fee
    trigger: "Petition DRAFT->SCREENED (provisional) and SCREENED->FILED (final)"
    algorithm: aggregation
    formula: |
      per_record_fee(r) = round_half_up( BASE_FEE_CENTS[r.offense_class] * DISP_MULT[r.disposition] * (1 + EFILE_SURCHARGE) )
      # ROUND-ORDER IS PINNED: round each per_record_fee first, THEN sum. Never sum-then-round.
      provisional_fee_cents = SUM(per_record_fee(r) for r in ALL items)          # computed on SCREENED
      final_fee_cents       = SUM(per_record_fee(r) for r in items with eligibility_at_screening == ELIGIBLE)  # computed on FILED
    input_set: "ALL PetitionItems for provisional; only ELIGIBLE-snapshot items for final"
    constants:
      BASE_FEE_CENTS: { INFRACTION: 5000, MISDEMEANOR: 12000, FELONY_CLASS_C: 18000, FELONY_CLASS_B: 25000, FELONY_CLASS_A: 30000, VIOLENT_FELONY: 30000 }
      DISP_MULT: { CONVICTED: 1.0, DISMISSED: 0.5, ARREST_ONLY: 0.25, ACQUITTED: 0.10 }
      EFILE_SURCHARGE: 0.075
    precision: "cents, round_half_up per record BEFORE summation"
    variants:
      - name: provisional
        when: "SCREENED — includes every candidate record regardless of eligibility"
        difference: "sums over ALL items"
      - name: final
        when: "FILED — the filing actually charges only for records that will be sealed"
        difference: "sums over ELIGIBLE items only; strictly <= provisional when any item is INELIGIBLE"

  - name: fee_waiver_determination
    trigger: "POST /expungement/fee-waivers (computed at request time)"
    algorithm: threshold
    formula: |
      poverty_line_cents = FPL_BASE_CENTS + (household_size - 1) * FPL_PER_ADDL_CENTS
      income_threshold_cents = round_half_up( poverty_line_cents * FPL_MULTIPLIER )
      if annual_income_cents <= income_threshold_cents AND monthly_liquid_assets_cents <= ASSET_CAP_CENTS:
          determination_basis = INCOME_UNDER_125
      else:
          determination_basis = OVER_THRESHOLD
    input_set: "the requesting Petitioner's annual_income_cents, household_size, monthly_liquid_assets_cents"
    constants:
      FPL_BASE_CENTS: 1500000
      FPL_PER_ADDL_CENTS: 530000
      FPL_MULTIPLIER: 1.25
      ASSET_CAP_CENTS: 200000
    precision: "cents; income threshold inclusive (<=)"

  - name: fee_ledger_reconciliation
    trigger: "POST /expungement/petitions/{id}/pay-fee and Petition ->WITHDRAWN compensation"
    algorithm: aggregation
    formula: |
      on pay-fee(amount):   Petition.amount_paid_cents += amount ; Petitioner.fee_paid_cents += amount
      on withdraw:          Petitioner.fee_refunded_cents += Petition.amount_paid_cents
      # Conserved quantity: NET_FEES(petitioner) = fee_paid_cents - fee_refunded_cents
      # A pay followed by its withdrawal returns NET_FEES to its pre-payment value (zero drift).
    input_set: "all payments and refunds for the petitioner"
    precision: "cents, exact integer arithmetic"

# =============================================================================
# 1.4 Validation Rules Table (ordered by priority)
# =============================================================================
validations:
  - priority: 1
    category: auth
    check: "X-User-Role and X-User-ID headers present and X-User-Role is a known role"
    error_id: ERR_UNAUTHENTICATED
    http_status: 401
    applies_to: all

  - priority: 2
    category: auth
    check: "the acting role is permitted to call this endpoint per the RBAC matrix"
    error_id: ERR_UNAUTHORIZED
    http_status: 403
    applies_to: all

  - priority: 3
    category: business_constraint
    check: "request body well-formed: required fields present, enums in range, integers non-negative, household_size>=1, scheduled_end > scheduled_start"
    error_id: ERR_VALIDATION
    http_status: 422
    applies_to: "all mutating endpoints"

  - priority: 4
    category: existence
    check: "every path id and body FK resolves to an existing resource (validated left-to-right)"
    error_id: "ERR_PETITIONER_NOT_FOUND / ERR_RECORD_NOT_FOUND / ERR_PETITION_NOT_FOUND / ERR_HEARING_NOT_FOUND / ERR_COURT_ORDER_NOT_FOUND / ERR_NOT_FOUND"
    http_status: 404
    applies_to: all

  - priority: 5
    category: business_referential
    check: "ownership: when acting role is Petitioner, X-User-ID equals the target resource's petitioner_id"
    error_id: ERR_NOT_RESOURCE_OWNER
    http_status: 403
    applies_to: "POST /criminal-records, POST /petitions, POST /petitions/{id}/pay-fee, POST /fee-waivers, POST /petitions/{id}/transition (WITHDRAWN)"

  - priority: 6
    category: state
    check: "target resource is in a state from which the requested transition is defined"
    error_id: ERR_INVALID_STATE
    http_status: 409
    applies_to: "all state-transition, order, vacate, screen, hearing-create endpoints"

  - priority: 7
    category: business_constraint
    check: "optimistic concurrency: expected_petition_version equals Petition.version"
    error_id: ERR_STALE_VERSION
    http_status: 412
    applies_to: "POST /expungement/petitions/{id}/hearings"

  - priority: 8
    category: business_referential
    check: "cross-entity reference integrity: (a) each record_id belongs to the petition's petitioner_id (ERR_RECORD_NOT_OWNED); (b) courtroom.jurisdiction_code and judge.jurisdiction_code equal petition.jurisdiction_code (ERR_JURISDICTION_MISMATCH)"
    error_id: "ERR_RECORD_NOT_OWNED / ERR_JURISDICTION_MISMATCH"
    http_status: 409
    applies_to: "POST /petitions, POST /petitions/{id}/hearings"

  - priority: 9
    category: business_temporal
    check: "temporal availability: courtroom buffer-conflict (ERR_COURTROOM_UNAVAILABLE), judge half-open overlap (ERR_JUDGE_UNAVAILABLE), objection window open/closed (ERR_OBJECTION_WINDOW_CLOSED / ERR_OBJECTION_WINDOW_OPEN)"
    error_id: "ERR_COURTROOM_UNAVAILABLE / ERR_JUDGE_UNAVAILABLE / ERR_OBJECTION_WINDOW_CLOSED / ERR_OBJECTION_WINDOW_OPEN"
    http_status: 409
    applies_to: "POST /petitions/{id}/hearings, POST /agency-notifications/{id}/objections, POST /agency-notifications/{id}/transition (CLEARED)"

  - priority: 10
    category: business_safety
    check: "compliance gates: records screened before SCREENED (ERR_RECORDS_NOT_SCREENED); >=1 eligible record before FILED (ERR_NO_ELIGIBLE_RECORDS); all notifications CLEARED before HEARING_SET (ERR_NOTIFICATIONS_NOT_CLEARED); hearing HELD before order (ERR_HEARING_NOT_HELD); retry cap (ERR_MAX_RETRIES_EXCEEDED); waiver eligibility (ERR_WAIVER_NOT_ELIGIBLE)"
    error_id: "ERR_RECORDS_NOT_SCREENED / ERR_NO_ELIGIBLE_RECORDS / ERR_NOTIFICATIONS_NOT_CLEARED / ERR_HEARING_NOT_HELD / ERR_MAX_RETRIES_EXCEEDED / ERR_WAIVER_NOT_ELIGIBLE"
    http_status: 409
    applies_to: "petition/hearing/order/sealing/fee-waiver transition endpoints"

  - priority: 11
    category: business_fiscal
    check: "filing fee satisfied on FILED: fee_waived OR amount_paid_cents >= final_fee_cents"
    error_id: ERR_FILING_FEE_UNPAID
    http_status: 402
    applies_to: "POST /expungement/petitions/{id}/transition (FILED)"

# =============================================================================
# 1.5 API Endpoint Table
# =============================================================================
endpoints:
  # ---- Configuration resources ----
  - { method: POST, path: "/expungement/courtrooms", description: "Create a courtroom", roles: [Clerk], code: 201, input: [name, jurisdiction_code], output: Courtroom, side_effects: [] }
  - { method: GET, path: "/expungement/courtrooms/{id}", description: "Get a courtroom", roles: [Petitioner, Clerk, Agency, Judge], code: 200, input: [], output: Courtroom, side_effects: [] }
  - { method: POST, path: "/expungement/judges", description: "Create a judge", roles: [Clerk], code: 201, input: [name, jurisdiction_code], output: Judge, side_effects: [] }
  - { method: GET, path: "/expungement/judges/{id}", description: "Get a judge", roles: [Petitioner, Clerk, Agency, Judge], code: 200, input: [], output: Judge, side_effects: [] }
  - { method: POST, path: "/expungement/background-vendors", description: "Register a background-check vendor", roles: [Clerk], code: 201, input: [name, api_endpoint], output: BackgroundVendor, side_effects: [] }
  - { method: GET, path: "/expungement/background-vendors/{id}", description: "Get a background vendor", roles: [Petitioner, Clerk, Agency, Judge], code: 200, input: [], output: BackgroundVendor, side_effects: [] }

  # ---- Petitioner ----
  - { method: POST, path: "/expungement/petitioners", description: "Create a petitioner profile", roles: [Clerk], code: 201, input: [full_name, date_of_birth, annual_income_cents, household_size, "monthly_liquid_assets_cents?"], output: Petitioner, side_effects: ["fee_paid_cents=0, fee_refunded_cents=0"] }
  - { method: GET, path: "/expungement/petitioners/{id}", description: "Get a petitioner (includes fee ledger)", roles: [Petitioner, Clerk, Agency, Judge], code: 200, input: [], output: Petitioner, side_effects: [] }

  # ---- Criminal records ----
  - { method: POST, path: "/expungement/criminal-records", description: "Attach a criminal record to a petitioner", roles: [Petitioner, Clerk], code: 201, input: [petitioner_id, offense_code, offense_class, disposition, disposition_date, "sentence_completion_date?"], output: CriminalRecord, side_effects: ["status=UNSCREENED"] }
  - { method: GET, path: "/expungement/criminal-records/{id}", description: "Get a criminal record", roles: [Petitioner, Clerk, Agency, Judge], code: 200, input: [], output: CriminalRecord, side_effects: [] }
  - { method: GET, path: "/expungement/criminal-records", description: "List criminal records (filter by petitioner)", roles: [Petitioner, Clerk, Agency, Judge], code: 200, input: ["petitioner_id?", "status?", "limit?", "offset?"], output: "CriminalRecord[]", side_effects: [] }
  - { method: POST, path: "/expungement/criminal-records/{id}/screen", description: "Run eligibility screening on a record", roles: [Clerk], code: 200, input: [], output: CriminalRecord, side_effects: ["compute eligible_on; set status ELIGIBLE/INELIGIBLE (record_eligibility)"] }

  # ---- Petition & items ----
  - { method: POST, path: "/expungement/petitions", description: "Assemble a petition from a petitioner's records", roles: [Petitioner, Clerk], code: 201, input: [petitioner_id, jurisdiction_code, record_ids], output: Petition, side_effects: ["status=DRAFT; create one PetitionItem per record_id"] }
  - { method: GET, path: "/expungement/petitions/{id}", description: "Get a petition (status + fee fields)", roles: [Petitioner, Clerk, Agency, Judge], code: 200, input: [], output: Petition, side_effects: [] }
  - { method: GET, path: "/expungement/petitions", description: "List petitions (filter by petitioner)", roles: [Petitioner, Clerk, Agency, Judge], code: 200, input: ["petitioner_id?", "jurisdiction_code?", "status?", "limit?", "offset?"], output: "Petition[]", side_effects: [] }
  - { method: GET, path: "/expungement/petition-items/{id}", description: "Get a petition item (screening snapshot)", roles: [Petitioner, Clerk, Agency, Judge], code: 200, input: [], output: PetitionItem, side_effects: [] }
  - { method: GET, path: "/expungement/petition-items", description: "List petition items (filter by petition or record)", roles: [Petitioner, Clerk, Agency, Judge], code: 200, input: ["petition_id?", "record_id?", "limit?", "offset?"], output: "PetitionItem[]", side_effects: [] }
  - { method: POST, path: "/expungement/petitions/{id}/transition", description: "Advance petition status (SCREENED, FILED, WITHDRAWN)", roles: [Petitioner, Clerk], code: 200, input: [to_status], output: Petition, side_effects: ["petition_filing_fee (provisional/final); notification fan-out on FILED; refund compensation on WITHDRAWN"] }
  - { method: POST, path: "/expungement/petitions/{id}/pay-fee", description: "Record a filing-fee payment", roles: [Petitioner, Clerk], code: 200, input: [amount_cents], output: Petition, side_effects: ["Petition.amount_paid_cents += amount; Petitioner.fee_paid_cents += amount (fee_ledger_reconciliation)"] }
  - { method: POST, path: "/expungement/petitions/{id}/hearings", description: "Schedule (or reschedule) the petition's hearing", roles: [Clerk], code: 201, input: [courtroom_id, judge_id, scheduled_start, scheduled_end, expected_petition_version], output: Hearing, side_effects: ["create Hearing SCHEDULED; supersede prior SCHEDULED hearing on reschedule; petition -> HEARING_SET; increments Petition.version by 1"] }

  # ---- Fee waivers ----
  - { method: POST, path: "/expungement/fee-waivers", description: "Request a fee waiver for a petition", roles: [Petitioner, Clerk], code: 201, input: [petitioner_id, petition_id], output: FeeWaiver, side_effects: ["status=REQUESTED; fee_waiver_determination computes determination_basis + income_threshold_cents; supersede prior REQUESTED waiver of the same petition"] }
  - { method: GET, path: "/expungement/fee-waivers/{id}", description: "Get a fee waiver", roles: [Petitioner, Clerk, Agency, Judge], code: 200, input: [], output: FeeWaiver, side_effects: [] }
  - { method: GET, path: "/expungement/fee-waivers", description: "List fee waivers (filter by petitioner or petition)", roles: [Petitioner, Clerk, Agency, Judge], code: 200, input: ["petitioner_id?", "petition_id?", "status?", "limit?", "offset?"], output: "FeeWaiver[]", side_effects: [] }
  - { method: POST, path: "/expungement/fee-waivers/{id}/transition", description: "Decide a fee waiver (GRANTED / DENIED)", roles: [Clerk], code: 200, input: [to_status], output: FeeWaiver, side_effects: ["on GRANTED: petition.fee_waived=true, fee_due_cents=0"] }

  # ---- Agency notifications & objections ----
  - { method: GET, path: "/expungement/agency-notifications/{id}", description: "Get an agency notification", roles: [Petitioner, Clerk, Agency, Judge], code: 200, input: [], output: AgencyNotification, side_effects: [] }
  - { method: GET, path: "/expungement/agency-notifications", description: "List agency notifications (filter by petition)", roles: [Petitioner, Clerk, Agency, Judge], code: 200, input: ["petition_id?", "status?", "limit?", "offset?"], output: "AgencyNotification[]", side_effects: [] }
  - { method: POST, path: "/expungement/agency-notifications/{id}/transition", description: "Advance a notification (SERVED, CLEARED)", roles: [Clerk], code: 200, input: [to_status], output: AgencyNotification, side_effects: ["on SERVED: set served_at + objection_deadline"] }
  - { method: POST, path: "/expungement/agency-notifications/{id}/objections", description: "File an objection within the window", roles: [Agency], code: 201, input: [grounds], output: Objection, side_effects: ["notification -> OBJECTED; petition FILED -> OBJECTION_REVIEW (cascade)"] }
  - { method: GET, path: "/expungement/objections/{id}", description: "Get an objection", roles: [Petitioner, Clerk, Agency, Judge], code: 200, input: [], output: Objection, side_effects: [] }
  - { method: GET, path: "/expungement/objections", description: "List objections (filter by notification)", roles: [Petitioner, Clerk, Agency, Judge], code: 200, input: ["notification_id?", "status?", "limit?", "offset?"], output: "Objection[]", side_effects: [] }
  - { method: POST, path: "/expungement/objections/{id}/transition", description: "Resolve an objection (SUSTAINED / OVERRULED)", roles: [Clerk], code: 200, input: [to_status], output: Objection, side_effects: ["SUSTAINED -> petition DENIED; OVERRULED -> notification CLEARED, petition back to FILED"] }

  # ---- Hearing & order ----
  - { method: GET, path: "/expungement/hearings/{id}", description: "Get a hearing", roles: [Petitioner, Clerk, Agency, Judge], code: 200, input: [], output: Hearing, side_effects: [] }
  - { method: GET, path: "/expungement/hearings", description: "List hearings (filter by petition, courtroom, or judge)", roles: [Petitioner, Clerk, Agency, Judge], code: 200, input: ["petition_id?", "courtroom_id?", "judge_id?", "status?", "limit?", "offset?"], output: "Hearing[]", side_effects: [] }
  - { method: POST, path: "/expungement/hearings/{id}/transition", description: "Advance a hearing (HELD, VACATED)", roles: [Clerk], code: 200, input: [to_status], output: Hearing, side_effects: [] }
  - { method: POST, path: "/expungement/hearings/{id}/order", description: "Enter the court order for a held hearing", roles: [Judge], code: 201, input: [disposition], output: CourtOrder, side_effects: ["GRANTED cascade: petition GRANTED -> records SEALED -> SealingDistributions QUEUED; DENIED: petition DENIED"] }
  - { method: GET, path: "/expungement/court-orders/{id}", description: "Get a court order", roles: [Petitioner, Clerk, Agency, Judge], code: 200, input: [], output: CourtOrder, side_effects: [] }
  - { method: GET, path: "/expungement/court-orders", description: "List court orders (filter by petition or hearing)", roles: [Petitioner, Clerk, Agency, Judge], code: 200, input: ["petition_id?", "hearing_id?", "status?", "limit?", "offset?"], output: "CourtOrder[]", side_effects: [] }
  - { method: POST, path: "/expungement/court-orders/{id}/vacate", description: "Vacate a granted order (unseal + cancel distributions)", roles: [Judge], code: 200, input: [], output: CourtOrder, side_effects: ["records unsealed -> ELIGIBLE; distributions -> CANCELLED"] }

  # ---- Sealing distributions ----
  - { method: GET, path: "/expungement/sealing-distributions/{id}", description: "Get a sealing distribution", roles: [Petitioner, Clerk, Agency, Judge], code: 200, input: [], output: SealingDistribution, side_effects: [] }
  - { method: GET, path: "/expungement/sealing-distributions", description: "List sealing distributions (filter by order)", roles: [Petitioner, Clerk, Agency, Judge], code: 200, input: ["court_order_id?", "recipient_type?", "status?", "limit?", "offset?"], output: "SealingDistribution[]", side_effects: [] }
  - { method: POST, path: "/expungement/sealing-distributions/{id}/transition", description: "Advance a distribution (SENT, ACKNOWLEDGED, FAILED, QUEUED-retry)", roles: [Clerk], code: 200, input: [to_status], output: SealingDistribution, side_effects: ["ACKNOWLEDGED: vendor counter + order bubble-up; QUEUED: attempt_count += 1"] }

  # ---- Test-driving: logical clock ----
  - { method: POST, path: "/_clock/set_current_utc", description: "Set the server's logical clock. Startup default is 2026-05-01T00:00:00Z; the clock never falls back to wall-clock time, so all waiting-period and objection-window rules are deterministic.", roles: [Clerk], code: 200, input: [to_iso8601], output: null, side_effects: ["logical clock set to to_iso8601"] }

# =============================================================================
# 1.6 Error Code Catalog
# =============================================================================
errors:
  - { id: ERR_UNAUTHENTICATED, http: 401, condition: "Missing/unknown X-User-Role or X-User-ID header" }
  - { id: ERR_UNAUTHORIZED, http: 403, condition: "Acting role not permitted for this endpoint" }
  - { id: ERR_NOT_RESOURCE_OWNER, http: 403, condition: "Petitioner acting on a resource whose petitioner_id != X-User-ID" }
  - { id: ERR_VALIDATION, http: 422, condition: "Malformed body: missing required field, bad enum, negative integer, household_size<1, or scheduled_end<=scheduled_start" }
  - { id: ERR_PETITIONER_NOT_FOUND, http: 404, condition: "petitioner_id does not resolve" }
  - { id: ERR_RECORD_NOT_FOUND, http: 404, condition: "criminal record id does not resolve" }
  - { id: ERR_PETITION_NOT_FOUND, http: 404, condition: "petition id does not resolve" }
  - { id: ERR_HEARING_NOT_FOUND, http: 404, condition: "hearing id does not resolve" }
  - { id: ERR_COURT_ORDER_NOT_FOUND, http: 404, condition: "court order id does not resolve" }
  - { id: ERR_NOT_FOUND, http: 404, condition: "generic not-found for courtroom, judge, vendor, petition-item, notification, objection, fee-waiver, or distribution ids" }
  - { id: ERR_INVALID_STATE, http: 409, condition: "Requested transition not defined from the resource's current state" }
  - { id: ERR_STALE_VERSION, http: 412, condition: "expected_petition_version does not match Petition.version (OCC)" }
  - { id: ERR_RECORD_NOT_OWNED, http: 409, condition: "A record_id in a petition belongs to a different petitioner" }
  - { id: ERR_JURISDICTION_MISMATCH, http: 409, condition: "Courtroom or judge jurisdiction_code != petition jurisdiction_code" }
  - { id: ERR_COURTROOM_UNAVAILABLE, http: 409, condition: "New hearing violates the courtroom buffer against another SCHEDULED hearing" }
  - { id: ERR_JUDGE_UNAVAILABLE, http: 409, condition: "New hearing half-open-overlaps another SCHEDULED hearing on the same judge" }
  - { id: ERR_OBJECTION_WINDOW_CLOSED, http: 409, condition: "Objection filed after objection_deadline" }
  - { id: ERR_OBJECTION_WINDOW_OPEN, http: 409, condition: "Notification CLEARED attempted before objection_deadline" }
  - { id: ERR_RECORDS_NOT_SCREENED, http: 409, condition: "SCREENED attempted while some petition records are still UNSCREENED" }
  - { id: ERR_NO_ELIGIBLE_RECORDS, http: 409, condition: "FILED attempted with zero ELIGIBLE records (empty-set boundary)" }
  - { id: ERR_NOTIFICATIONS_NOT_CLEARED, http: 409, condition: "Hearing scheduling attempted while a notification is not CLEARED" }
  - { id: ERR_HEARING_NOT_HELD, http: 409, condition: "Court order entered before the hearing is HELD" }
  - { id: ERR_MAX_RETRIES_EXCEEDED, http: 409, condition: "Distribution retry attempted at attempt_count == MAX_ATTEMPTS (=2)" }
  - { id: ERR_WAIVER_NOT_ELIGIBLE, http: 409, condition: "Fee waiver GRANTED attempted when determination_basis != INCOME_UNDER_125" }
  - { id: ERR_FILING_FEE_UNPAID, http: 402, condition: "FILED attempted with fee neither waived nor amount_paid_cents >= final_fee_cents" }

# =============================================================================
# 1.7 RBAC Matrix
# =============================================================================
roles:
  - name: Petitioner
    description: "The individual seeking expungement; owns their criminal records, petitions, payments, and fee-waiver requests."
    identity: "entity_backed:Petitioner"
    exclusive_operations:
      - "POST /expungement/petitions/{id}/pay-fee — pay own filing fee"
      - "POST /expungement/petitions/{id}/transition (WITHDRAWN) — withdraw own petition"
    shared_operations:
      - "POST /expungement/criminal-records (with Clerk) — for own petitioner_id"
      - "POST /expungement/petitions (with Clerk) — for own petitioner_id"
      - "POST /expungement/fee-waivers (with Clerk)"
      - "all GET reads"

  - name: Clerk
    description: "Court clerk operating the intake and process workflow."
    identity: "opaque"
    exclusive_operations:
      - "POST /expungement/courtrooms, /judges, /background-vendors, /petitioners"
      - "POST /expungement/criminal-records/{id}/screen"
      - "POST /expungement/petitions/{id}/transition (SCREENED, FILED)"
      - "POST /expungement/petitions/{id}/hearings"
      - "POST /expungement/fee-waivers/{id}/transition"
      - "POST /expungement/agency-notifications/{id}/transition"
      - "POST /expungement/objections/{id}/transition"
      - "POST /expungement/hearings/{id}/transition"
      - "POST /expungement/sealing-distributions/{id}/transition"
      - "POST /_clock/set_current_utc"
    shared_operations:
      - "POST /expungement/criminal-records, /petitions, /fee-waivers (with Petitioner)"
      - "all GET reads"

  - name: Agency
    description: "Notified agency (DA, arresting agency, or state repository) that may object during the window."
    identity: "opaque"
    exclusive_operations:
      - "POST /expungement/agency-notifications/{id}/objections — file an objection"
    shared_operations:
      - "all GET reads"

  - name: Judge
