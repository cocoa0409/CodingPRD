  # ===========================================================================
  - section: rbac
    instances:

      - name: only_the_platform_admin_may_drive_the_logical_clock
        claim_type: exclusive_operation
        grounds:
          - roles.PlatformAdmin.exclusive_operations
          - endpoints.POST_/_clock/set_current_utc
          - errors[ERR_INSUFFICIENT_PERMISSIONS]
        distinguishing_aspect: "The clock is exclusive to PlatformAdmin, so SiteCoordinator is refused with 403 and the clock stays where it was while the PlatformAdmin call moves it."
        test_recipe:
          setup:
            - "The anchored base fixture up to the verified site."
          setup_api_calls:
            - *x_clock
            - *x_prod
            - *x_prog
            - *x_batch
            - call: "POST /vaccine-distribution/allocation-batches/${batch_id}/cartons"
              payload: { carton_serial: "C-01", vials_per_carton: 195 }
              as: ManufacturingQA
              captures: { c01: "$.data.id" }
            - call: "POST /vaccine-distribution/allocation-batches/${batch_id}/release"
              payload: {}
              as: ManufacturingQA
            - *x_win
            - *x_open
            - *x_ent
            - *x_site
            - *x_verify
          trigger:
            - call: "POST /vaccine-distribution/_clock/set_current_utc"
              payload: { current_utc: "2026-09-05T00:00:00Z" }
              as: SiteCoordinator
              as_user_id: "${site_id}"
              captures: { error_id: "$.data.error_id" }
            - call: "POST /vaccine-distribution/_clock/set_current_utc"
              payload: { current_utc: "2026-09-05T00:00:00Z" }
              as: PlatformAdmin
              captures: { clock_now: "$.data.current_utc" }
          assert:
            - "the SiteCoordinator attempt returns 403 with error_id == ERR_INSUFFICIENT_PERMISSIONS"
            - "clock_now == 2026-09-05T00:00:00Z after the PlatformAdmin call"
            - "the refused call did not move the clock: the subsequent PlatformAdmin call is the one that stamped the new value"
            - "Carton.${c01}.temperature_state is still ULTRA_COLD and its version is 1"

      - name: manufacturing_qa_cannot_recall_a_batch
        claim_type: forbidden_operation
        grounds:
          - roles.RegulatoryAffairsOfficer.exclusive_operations
          - endpoints.POST_/allocation-batches/{id}/recall
          - errors[ERR_INSUFFICIENT_PERMISSIONS]
        distinguishing_aspect: "Recall is exclusive to RegulatoryAffairsOfficer, so the same recall as ManufacturingQA is refused with 403 while the RegulatoryAffairsOfficer call succeeds."
        test_recipe:
          setup:
            - "The anchored base fixture with a released batch and one carton registered."
          setup_api_calls:
            - *x_clock
            - *x_prod
            - *x_prog
            - *x_batch
            - call: "POST /vaccine-distribution/allocation-batches/${batch_id}/cartons"
              payload: { carton_serial: "C-01", vials_per_carton: 195 }
              as: ManufacturingQA
              captures: { c01: "$.data.id" }
            - call: "POST /vaccine-distribution/allocation-batches/${batch_id}/release"
              payload: {}
              as: ManufacturingQA
          trigger:
            - call: "POST /vaccine-distribution/allocation-batches/${batch_id}/recall"
              payload: { reason: "Attempting recall from QA." }
              as: ManufacturingQA
              captures: { error_id: "$.data.error_id" }
            - call: "POST /vaccine-distribution/allocation-batches/${batch_id}/recall"
              payload: { reason: "Regulatory hold on the fill line." }
              as: RegulatoryAffairsOfficer
              captures: { status_after: "$.data.status" }
          assert:
            - "the ManufacturingQA attempt returns 403 with error_id == ERR_INSUFFICIENT_PERMISSIONS"
            - "AllocationBatch.${batch_id}.status is still RELEASED after the refused attempt"
            - "status_after == RECALLED after the RegulatoryAffairsOfficer attempt"
            - "Carton.${c01}.temperature_state == DESTROYED"

      - name: a_coordinator_cannot_accept_its_own_order
        claim_type: peer_role_isolation
        grounds:
          - roles.SiteCoordinator.exclusive_operations
          - roles.DistributionPlanner.exclusive_operations
          - endpoints.POST_/site-orders/{id}/accept
          - errors[ERR_INSUFFICIENT_PERMISSIONS]
        distinguishing_aspect: "Acceptance belongs to DistributionPlanner and not to the ordering site's own role, so the SiteCoordinator's attempt is refused with 403 and the planner's identical call succeeds."
        test_recipe:
          setup:
            - "The anchored base fixture with one submitted order from MI-RIV-01."
          setup_api_calls:
            - *x_clock
            - *x_prod
            - *x_prog
            - *x_batch
            - call: "POST /vaccine-distribution/allocation-batches/${batch_id}/cartons"
              payload: { carton_serial: "C-01", vials_per_carton: 195 }
              as: ManufacturingQA
              captures: { c01: "$.data.id" }
            - call: "POST /vaccine-distribution/allocation-batches/${batch_id}/release"
              payload: {}
              as: ManufacturingQA
            - *x_win
            - *x_open
            - *x_ent
            - *x_site
            - *x_verify
            - *x_order
            - call: "POST /vaccine-distribution/site-orders/${order_id}/submit"
              payload: {}
              as: SiteCoordinator
              as_user_id: "${site_id}"
          trigger:
            - call: "POST /vaccine-distribution/site-orders/${order_id}/accept"
              payload: { accepted_cartons: 2, deliver_at: "2026-09-01T06:00:00Z", expected_allocation_window_version: "${win_v}" }
              as: SiteCoordinator
              as_user_id: "${site_id}"
              captures: { error_id: "$.data.error_id" }
            - call: "POST /vaccine-distribution/site-orders/${order_id}/accept"
              payload: { accepted_cartons: 2, deliver_at: "2026-09-01T06:00:00Z", expected_allocation_window_version: "${win_v}" }
              as: DistributionPlanner
              captures: { accepted_after: "$.data.accepted_cartons" }
          assert:
            - "the SiteCoordinator attempt returns 403 with error_id == ERR_INSUFFICIENT_PERMISSIONS"
            - "SiteOrder.${order_id}.accepted_cartons == 0 after the refused attempt"
            - "accepted_after == 2 after the planner's acceptance"
            - "AllocationEntitlement.${ent_id}.held_cartons == 2 and available_cartons == 8"

      - name: manufacturing_qa_can_read_cartons_and_shippers
        claim_type: shared_operation
        grounds:
          - roles.ManufacturingQA.shared_operations
          - endpoints.GET_/cartons
          - endpoints.GET_/shippers/{id}
        distinguishing_aspect: "ManufacturingQA holds read access to cartons and shippers for release work while holding no write access to any of them, so both reads return 200."
