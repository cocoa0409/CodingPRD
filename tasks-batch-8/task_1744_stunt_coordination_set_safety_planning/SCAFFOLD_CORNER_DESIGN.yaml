        distinguishing_aspect: "Version-pinning on approval: approving a NEW assessment for a READY sequence supersedes the pinned one, re-pins current_assessment_id, bumps the sequence version, and drops the sequence to SAFETY_HOLD; reverify-readiness restores READY because the operational gates still pass."
