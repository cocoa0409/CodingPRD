# ===========================================================================
# 1.9 Scaffold Corner Design - Multifamily Physical Inspection Readiness
# ===========================================================================
# Breadth probe over SCAFFOLD.yaml sections 1.1-1.7. Sections and claim_type
# values are taken verbatim from references/claim-extraction-guide.md; no
# category is invented here. Corners already asserted by a
# SCAFFOLD_DIFFICULTY_DESIGN.yaml instance carry an `excluded_because:` stub
# naming that instance instead of a duplicate test_recipe.
#
# Shared fixture vocabulary (identical to the difficulty design file):
#   standard NSPIRE-2026        weights 50.00 / 30.00 / 20.00
#   LT_GAS        UNIT    LIFE_THREATENING  base 10.00  deadline 24
#   SEV_WINDOW    UNIT    SEVERE            base  8.00  deadline 720
#   MOD_HANDRAIL  INSIDE  MODERATE          base  6.00  deadline 720
#   LOW_TRASH     OUTSIDE LOW               base  4.00  deadline 720
#   PropertyOwner acts with as_user_id == the Property id it owns; the other
#   five roles are opaque (tech-1, insp-1, qa-1, appeals-1, admin-1).
#   The logical clock starts at its 2026-08-01T00:00:00.000Z default.
# ===========================================================================

scaffold_corner_design:
  - section: entities
    instances:
      - name: create_property_returns_all_fields_with_zeroed_derived_counters
        claim_type: creation
        grounds:
          - entities.Property
          - endpoints[POST /properties]
        distinguishing_aspect: |
          A freshly registered Property must come back with every declared field materialised,
          not just the four input fields: readiness_posture READY, three deficiency counters at 0,
          last_final_score and last_sweep_closed_at null, allocated_reserve_total_cents 0 and
          version 1. An implementation that leaves the derived block absent until the first
          deficiency arrives fails the response contract on day one.
        test_recipe:
          setup:
            - "Empty database; no standard is needed because a Property is a root entity."
          setup_api_calls: []
          trigger:
            - call: "POST /properties"
              payload: { name: "Maple Court", total_unit_count: 4, capital_reserve_cents: 1000000, owner_contact_email: "owner@maple.example" }
              as: PlatformAdmin
              captures: { prop_id: $.data.id }
          assert:
            - "the trigger returns HTTP 201"
            - "data.name == Maple Court and data.total_unit_count == 4"
            - "data.capital_reserve_cents == 1000000 and data.owner_contact_email == owner@maple.example"
            - "data.readiness_posture == READY"
            - "data.open_life_threatening_count == 0 and data.overdue_life_threatening_count == 0 and data.open_severe_count == 0"
            - "data.last_final_score is null and data.last_sweep_closed_at is null"
            - "data.allocated_reserve_total_cents == 0"
            - "data.id is a UUID with no type prefix, data.version == 1, data.created_at and data.updated_at are ISO 8601 UTC with three fractional digits"

      - name: get_defect_definition_returns_the_stored_row
        claim_type: retrieval
        grounds:
          - entities.DefectDefinition
          - endpoints[GET /defect-definitions/{id}]
        distinguishing_aspect: |
          The single-resource read must echo the stored definition including the computed
          is_life_threatening flag, which is derived from severity rather than supplied.
        test_recipe:
          setup:
            - "A DRAFT standard NSPIRE-2026 with one LIFE_THREATENING definition LT_GAS."
          setup_api_calls:
            - call: "POST /inspection-standards"
              payload: { code: "NSPIRE-2026", name: "NSPIRE 2026", effective_date: "2026-01-01T00:00:00.000Z", unit_weight_pct: 50.00, inside_weight_pct: 30.00, outside_weight_pct: 20.00 }
              as: PlatformAdmin
              captures: { std_id: $.data.id }
            - call: "POST /defect-definitions"
              payload: { standard_id: "${std_id}", code: "LT_GAS", name: "Gas leak at range connection", inspectable_area: "UNIT", severity: "LIFE_THREATENING", base_point_value: 10.00, correction_deadline_hours: 24 }
              as: PlatformAdmin
              captures: { dd_lt: $.data.id }
          trigger:
            - call: "GET /defect-definitions/${dd_lt}"
              payload: {}
              as: HousingAgencyInspector
          assert:
            - "the trigger returns HTTP 200"
            - "data.id == ${dd_lt} and data.standard_id == ${std_id}"
            - "data.code == LT_GAS and data.inspectable_area == UNIT and data.severity == LIFE_THREATENING"
            - "data.base_point_value == 10.00 and data.correction_deadline_hours == 24"
            - "data.is_life_threatening == true"

      - name: list_units_paginates_with_total_count_and_has_more
        claim_type: listing
        grounds:
          - endpoints[GET /units]
          - response_envelope.pagination_fields
        distinguishing_aspect: |
          Three units on one property read back through limit=2/offset=0 and limit=2/offset=2:
          total_count must report 3 in BOTH pages (not the page length), has_more must be true on
          the first page and false on the second, and the two pages must not repeat a row.
        test_recipe:
          setup:
            - "Property Maple Court with three units 101, 102 and 103 created in that order."
          setup_api_calls:
            - call: "POST /properties"
              payload: { name: "Maple Court", total_unit_count: 4, capital_reserve_cents: 1000000, owner_contact_email: "owner@maple.example" }
              as: PlatformAdmin
              captures: { prop_id: $.data.id }
            - call: "POST /units"
              payload: { property_id: "${prop_id}", unit_number: "101", bedroom_count: 2, occupancy_status: "OCCUPIED", occupant_display_name: "Household 101" }
              as: PlatformAdmin
              captures: { u1_id: $.data.id }
            - call: "POST /units"
              payload: { property_id: "${prop_id}", unit_number: "102", bedroom_count: 1, occupancy_status: "VACANT" }
              as: PlatformAdmin
              captures: { u2_id: $.data.id }
            - call: "POST /units"
              payload: { property_id: "${prop_id}", unit_number: "103", bedroom_count: 3, occupancy_status: "DOWN" }
              as: PlatformAdmin
              captures: { u3_id: $.data.id }
          trigger:
            - call: "GET /units?property_id=${prop_id}&limit=2&offset=0"
              payload: {}
              as: PlatformAdmin
            - call: "GET /units?property_id=${prop_id}&limit=2&offset=2"
              payload: {}
              as: PlatformAdmin
          assert:
            - "the first trigger call returns HTTP 200 with 2 rows, total_count == 3 and has_more == true"
            - "the second trigger call returns HTTP 200 with 1 row, total_count == 3 and has_more == false"
            - "the union of the two pages is exactly {${u1_id}, ${u2_id}, ${u3_id}} with no repeated id"
            - "response_type == array on both calls"

      - name: get_property_with_unknown_id_returns_not_found
        claim_type: not_found
        grounds:
          - errors[ERR_PROPERTY_NOT_FOUND]
          - endpoints[GET /properties/{id}]
        distinguishing_aspect: |
          A well-formed but unknown UUID must produce ERR_PROPERTY_NOT_FOUND with HTTP 404 rather
          than an empty 200 body or a 400 parse complaint.
        test_recipe:
          setup:
            - "Empty database."
          setup_api_calls: []
          trigger:
            - call: "GET /properties/00000000-0000-4000-8000-000000000000"
              payload: {}
              as: PlatformAdmin
          assert:
            - "the trigger returns HTTP 404 with error_id ERR_PROPERTY_NOT_FOUND"
            - "response_type == error and data.message is a non-empty string"

      - name: create_unit_missing_required_property_id_returns_invalid_request
        claim_type: required_fields
        grounds:
          - errors[ERR_INVALID_REQUEST]
          - validations[priority=3]
          - endpoints[POST /units]
        distinguishing_aspect: |
          property_id has source input with no default, so omitting it is a body error at
          priority 3 (ERR_INVALID_REQUEST / 400) and must NOT be reported as the 404
          ERR_PROPERTY_NOT_FOUND that an unknown id would produce.
        test_recipe:
          setup:
            - "Property Maple Court exists, so the only defect in the request is the missing field."
          setup_api_calls:
            - call: "POST /properties"
              payload: { name: "Maple Court", total_unit_count: 4, capital_reserve_cents: 1000000, owner_contact_email: "owner@maple.example" }
              as: PlatformAdmin
              captures: { prop_id: $.data.id }
          trigger:
            - call: "POST /units"
              payload: { unit_number: "101", bedroom_count: 2, occupancy_status: "OCCUPIED" }
              as: PlatformAdmin
          assert:
            - "the trigger returns HTTP 400 with error_id ERR_INVALID_REQUEST"
            - "GET /units?property_id=${prop_id} has total_count == 0"

      - name: create_unit_omitting_occupancy_status_defaults_to_occupied
        claim_type: defaults
        grounds:
          - entities.Unit.fields.occupancy_status
          - entities.Unit.fields.occupant_display_name
        distinguishing_aspect: |
          occupancy_status carries default OCCUPIED and occupant_display_name default null, so a
          minimal unit body must be accepted and the defaults materialised - which also makes the
          unit sampling-eligible without any further write.
        test_recipe:
          setup:
            - "Property Maple Court exists."
          setup_api_calls:
            - call: "POST /properties"
              payload: { name: "Maple Court", total_unit_count: 4, capital_reserve_cents: 1000000, owner_contact_email: "owner@maple.example" }
              as: PlatformAdmin
              captures: { prop_id: $.data.id }
          trigger:
            - call: "POST /units"
              payload: { property_id: "${prop_id}", unit_number: "101", bedroom_count: 2 }
              as: PlatformAdmin
              captures: { u1_id: $.data.id }
          assert:
            - "the trigger returns HTTP 201"
            - "data.occupancy_status == OCCUPIED"
            - "data.occupant_display_name is null"
            - "data.prior_deficiency_count == 0 and data.open_deficiency_count == 0"
            - "data.version == 1"

      - name: create_unit_with_prior_deficiency_count_extra_field_is_ignored
        claim_type: computed_fields
        grounds:
          - entities.Unit.fields.prior_deficiency_count
          - entities.Unit.fields.open_deficiency_count
        distinguishing_aspect: |
          prior_deficiency_count and open_deficiency_count have source computed, so a client
          supplying them must not be able to seed the sampling ranking: both must read 0 on the
          created row regardless of the body.
        test_recipe:
          setup:
            - "Property Maple Court exists."
          setup_api_calls:
            - call: "POST /properties"
              payload: { name: "Maple Court", total_unit_count: 4, capital_reserve_cents: 1000000, owner_contact_email: "owner@maple.example" }
              as: PlatformAdmin
              captures: { prop_id: $.data.id }
          trigger:
            - call: "POST /units"
              payload: { property_id: "${prop_id}", unit_number: "101", bedroom_count: 2, occupancy_status: "OCCUPIED", prior_deficiency_count: 99, open_deficiency_count: 99 }
              as: PlatformAdmin
              captures: { u1_id: $.data.id }
          assert:
            - "the trigger returns HTTP 201"
            - "data.prior_deficiency_count == 0"
            - "data.open_deficiency_count == 0"
            - "GET /units/${u1_id} still reports prior_deficiency_count == 0"

      - name: create_standard_with_supplied_system_extra_field_is_ignored
        claim_type: system_fields
        grounds:
          - entities.InspectionStandard.fields.adoption_status
          - entities.InspectionStandard.fields.adopted_at
        distinguishing_aspect: |
          adoption_status, adopted_at, superseded_at, id and version are system-sourced, so a body
          claiming ADOPTED must still produce a DRAFT standard with adopted_at null and a
          server-minted id - otherwise the whole adoption gate could be bypassed at creation time.
        test_recipe:
          setup:
            - "Empty database."
          setup_api_calls: []
          trigger:
            - call: "POST /inspection-standards"
              payload: { code: "NSPIRE-2026", name: "NSPIRE 2026", effective_date: "2026-01-01T00:00:00.000Z", unit_weight_pct: 50.00, inside_weight_pct: 30.00, outside_weight_pct: 20.00, adoption_status: "ADOPTED", adopted_at: "2020-01-01T00:00:00.000Z", version: 77 }
              as: PlatformAdmin
              captures: { std_id: $.data.id }
          assert:
            - "the trigger returns HTTP 201"
            - "data.adoption_status == DRAFT"
            - "data.adopted_at is null and data.superseded_at is null"
            - "data.version == 1"
            - "data.defect_definition_count == 0 and data.life_threatening_definition_count == 0"
            - "data.id != 77 and data.id is a server-minted UUID"

      - name: create_defect_definition_with_unknown_severity_returns_invalid_enum_value
        claim_type: type_constraints
        grounds:
          - errors[ERR_INVALID_ENUM_VALUE]
          - validations[priority=4]
          - entities.DefectDefinition.fields.severity
        distinguishing_aspect: |
          severity is closed over four members, so CRITICAL must fail at priority 4 with
          ERR_INVALID_ENUM_VALUE (422) - not the priority-3 ERR_INVALID_REQUEST used for missing
          or mistyped fields, and not the LIFE_THREATENING deadline rule at priority 66.
        test_recipe:
          setup:
            - "A DRAFT standard NSPIRE-2026 exists."
          setup_api_calls:
            - call: "POST /inspection-standards"
              payload: { code: "NSPIRE-2026", name: "NSPIRE 2026", effective_date: "2026-01-01T00:00:00.000Z", unit_weight_pct: 50.00, inside_weight_pct: 30.00, outside_weight_pct: 20.00 }
              as: PlatformAdmin
              captures: { std_id: $.data.id }
          trigger:
            - call: "POST /defect-definitions"
              payload: { standard_id: "${std_id}", code: "CRIT_ROOF", name: "Collapsing roof deck", inspectable_area: "OUTSIDE", severity: "CRITICAL", base_point_value: 8.00, correction_deadline_hours: 720 }
              as: PlatformAdmin
          assert:
            - "the trigger returns HTTP 422 with error_id ERR_INVALID_ENUM_VALUE"
            - "GET /defect-definitions?standard_id=${std_id} has total_count == 0"
            - "InspectionStandard.${std_id}.defect_definition_count == 0"

      - name: create_unit_under_unknown_property_returns_not_found
        claim_type: parent_relationships
        grounds:
          - errors[ERR_PROPERTY_NOT_FOUND]
          - validations[priority=5]
          - entities.Unit.fields.property_id
        distinguishing_aspect: |
          Unit.property_id is a declared FK, so a syntactically valid but unknown parent id must
          produce the 404 existence error at priority 5 - after the body checks, before any
          business rule such as the duplicate unit_number constraint.
        test_recipe:
          setup:
            - "Empty database, so no property id can resolve."
          setup_api_calls: []
          trigger:
            - call: "POST /units"
              payload: { property_id: "00000000-0000-4000-8000-000000000000", unit_number: "101", bedroom_count: 2, occupancy_status: "OCCUPIED" }
              as: PlatformAdmin
          assert:
            - "the trigger returns HTTP 404 with error_id ERR_PROPERTY_NOT_FOUND"

      - name: record_finding_with_unknown_defect_definition_returns_not_found
        claim_type: flat
        grounds:
          - errors[ERR_DEFECT_DEFINITION_NOT_FOUND]
          - validations[priority=6]
          - complexity_profile.entity_topology
        distinguishing_aspect: |
          In a flat topology every cross-entity link arrives as a body FK rather than a URL
          segment, so the findings endpoint must validate defect_definition_id itself. The sweep is
          legitimately IN_PROGRESS and the OCC version is correct, which isolates the FK check.
        test_recipe:
          setup:
            - "Property Maple Court with unit 101 and an IN_PROGRESS ALL_AREAS sweep."
          setup_api_calls:
            - call: "POST /properties"
              payload: { name: "Maple Court", total_unit_count: 4, capital_reserve_cents: 1000000, owner_contact_email: "owner@maple.example" }
              as: PlatformAdmin
              captures: { prop_id: $.data.id }
            - call: "POST /units"
              payload: { property_id: "${prop_id}", unit_number: "101", bedroom_count: 2, occupancy_status: "OCCUPIED" }
              as: PlatformAdmin
              captures: { u1_id: $.data.id }
            - call: "POST /self-assessment-sweeps"
              payload: { property_id: "${prop_id}", window_start: "2026-08-02T00:00:00.000Z", window_end: "2026-08-20T00:00:00.000Z", planned_area_scope: "ALL_AREAS" }
              as: PropertyOwner
              as_user_id: "${prop_id}"
              captures: { sw_id: $.data.id }
            - call: "POST /self-assessment-sweeps/${sw_id}/start"
              payload: { started_at: "2026-08-02T08:00:00.000Z" }
              as: PropertyOwner
              as_user_id: "${prop_id}"
              captures: { sw_v1: $.data.version }
          trigger:
            - call: "POST /self-assessment-sweeps/${sw_id}/findings"
              payload: { expected_sweep_version: "${sw_v1}", defect_definition_id: "00000000-0000-4000-8000-000000000000", inspectable_area: "UNIT", unit_id: "${u1_id}", observed_at: "2026-08-03T09:00:00.000Z" }
              as: PropertyOwner
              as_user_id: "${prop_id}"
          assert:
            - "the trigger returns HTTP 404 with error_id ERR_DEFECT_DEFINITION_NOT_FOUND"
            - "SelfAssessmentSweep.${sw_id}.version == ${sw_v1}"
            - "SelfAssessmentSweep.${sw_id}.generated_work_order_count == 0"
            - "GET /work-orders?sweep_id=${sw_id} has total_count == 0"

  - section: state_machines
    instances:
      - name: adopt_standard_moves_draft_to_adopted_and_stamps_adopted_at
        claim_type: valid_transition
        grounds:
          - state_machines.InspectionStandard.DRAFT_to_ADOPTED
          - endpoints[POST /inspection-standards/{id}/adopt]
        distinguishing_aspect: |
          The adopt action is the only writer of adoption_status ADOPTED and adopted_at, and it is
          admissible only once the standard defines at least one LIFE_THREATENING defect, so the
          transition must be observed together with life_threatening_definition_count == 1.
        test_recipe:
          setup:
            - "A DRAFT standard NSPIRE-2026 with LT_GAS and SEV_WINDOW defined."
          setup_api_calls:
            - call: "POST /inspection-standards"
              payload: { code: "NSPIRE-2026", name: "NSPIRE 2026", effective_date: "2026-01-01T00:00:00.000Z", unit_weight_pct: 50.00, inside_weight_pct: 30.00, outside_weight_pct: 20.00 }
              as: PlatformAdmin
              captures: { std_id: $.data.id, std_v1: $.data.version }
            - call: "POST /defect-definitions"
              payload: { standard_id: "${std_id}", code: "LT_GAS", name: "Gas leak at range connection", inspectable_area: "UNIT", severity: "LIFE_THREATENING", base_point_value: 10.00, correction_deadline_hours: 24 }
              as: PlatformAdmin
            - call: "POST /defect-definitions"
              payload: { standard_id: "${std_id}", code: "SEV_WINDOW", name: "Inoperable egress window", inspectable_area: "UNIT", severity: "SEVERE", base_point_value: 8.00, correction_deadline_hours: 720 }
              as: PlatformAdmin
          trigger:
            - call: "POST /inspection-standards/${std_id}/adopt"
              payload: { adopted_at: "2026-01-02T00:00:00.000Z" }
              as: PlatformAdmin
          assert:
            - "the trigger returns HTTP 200"
            - "data.adoption_status == ADOPTED"
            - "data.adopted_at == 2026-01-02T00:00:00.000Z"
            - "data.defect_definition_count == 2 and data.life_threatening_definition_count == 1"
            - "data.version == ${std_v1} + 1"

      - name: start_inspection_rejected_when_notice_lead_is_under_forty_eight_hours
        claim_type: precondition_enforcement
        grounds:
          - state_machines.Inspection.NOTIFIED_to_IN_PROGRESS
          - validations[priority=70]
          - errors[ERR_NOTICE_WINDOW_TOO_SHORT]
          - calculations.notice_lead_hours
        distinguishing_aspect: |
          The tenant-notice lead is measured from Inspection.scheduled_start back to notified_at,
          not from the access window, so a notice issued 24 hours before the inspection blocks
          start even though the access window itself is perfectly valid. The inspection must remain
          in NOTIFIED with started_at null.
        test_recipe:
          setup:
            - "ADOPTED NSPIRE-2026; Property Cedar Walk (total_unit_count 1) with unit 101."
            - "The single sample slot is noticed at 2026-09-09T09:00:00.000Z for an inspection scheduled to start 2026-09-10T09:00:00.000Z, so notice_lead_hours is 24.00."
          setup_api_calls:
            - call: "POST /inspection-standards"
              payload: { code: "NSPIRE-2026", name: "NSPIRE 2026", effective_date: "2026-01-01T00:00:00.000Z", unit_weight_pct: 50.00, inside_weight_pct: 30.00, outside_weight_pct: 20.00 }
              as: PlatformAdmin
              captures: { std_id: $.data.id }
            - call: "POST /defect-definitions"
              payload: { standard_id: "${std_id}", code: "LT_GAS", name: "Gas leak at range connection", inspectable_area: "UNIT", severity: "LIFE_THREATENING", base_point_value: 10.00, correction_deadline_hours: 24 }
              as: PlatformAdmin
            - call: "POST /inspection-standards/${std_id}/adopt"
              payload: { adopted_at: "2026-01-02T00:00:00.000Z" }
              as: PlatformAdmin
            - call: "POST /properties"
              payload: { name: "Cedar Walk", total_unit_count: 1, capital_reserve_cents: 500000, owner_contact_email: "owner@cedar.example" }
              as: PlatformAdmin
              captures: { prop_id: $.data.id }
            - call: "POST /units"
              payload: { property_id: "${prop_id}", unit_number: "101", bedroom_count: 1, occupancy_status: "OCCUPIED" }
              as: PlatformAdmin
              captures: { u1_id: $.data.id }
            - call: "POST /inspections"
              payload: { property_id: "${prop_id}", standard_id: "${std_id}", scheduled_start: "2026-09-10T09:00:00.000Z", scheduled_end: "2026-09-10T17:00:00.000Z", inspection_kind: "INITIAL" }
              as: HousingAgencyInspector
              captures: { insp_id: $.data.id }
            - call: "POST /inspections/${insp_id}/draw-sample"
              payload: { drawn_at: "2026-08-02T00:00:00.000Z" }
              as: HousingAgencyInspector
            - call: "GET /sample-selections?inspection_id=${insp_id}&unit_id=${u1_id}"
              payload: {}
              as: HousingAgencyInspector
              captures: { sel1_id: "$.data[0].id" }
            - call: "POST /sample-selections/${sel1_id}/notice"
              payload: { notice_method: "MAILED", notified_at: "2026-09-09T09:00:00.000Z", access_window_start: "2026-09-10T09:00:00.000Z", access_window_end: "2026-09-10T17:00:00.000Z" }
              as: PropertyOwner
              as_user_id: "${prop_id}"
              captures: { lead: $.data.notice_lead_hours }
          trigger:
            - call: "POST /inspections/${insp_id}/start"
              payload: { started_at: "2026-09-10T09:00:00.000Z" }
              as: HousingAgencyInspector
          assert:
            - "${lead} == 24.00"
            - "the trigger returns HTTP 422 with error_id ERR_NOTICE_WINDOW_TOO_SHORT"
            - "Inspection.${insp_id}.status == NOTIFIED"
            - "Inspection.${insp_id}.started_at is null"
            - "SampleSelection.${sel1_id}.access_status == NOTIFIED"

      - name: draw_sample_ranks_slots_by_prior_deficiency_count_then_created_at
        claim_type: side_effect_execution
        grounds:
          - state_machines.Inspection.SCHEDULED_to_SAMPLED
          - calculations.unit_sample_size
          - entities.SampleSelection.fields.selection_rank
          - entities.Unit.fields.prior_deficiency_count
        distinguishing_aspect: |
          The draw must materialise sample_size slots in the pinned order - prior_deficiency_count
          DESC, then created_at ASC, never id - so unit 103 (one historical deficiency) takes rank 1
          ahead of the earlier-created 101, and 102 gets no slot at all. sample_tier_value comes from
          the DECLARED total_unit_count 2 even though three units exist.
        test_recipe:
          setup:
            - "ADOPTED NSPIRE-2026 with LT_GAS and SEV_WINDOW."
            - "Property Ash Terrace declares total_unit_count 2 but carries three OCCUPIED units created in the order 101, 102, 103."
            - "One injected CLOSED historical inspection carries a SEV_WINDOW deficiency on unit 103, so its prior_deficiency_count is 1 while 101 and 102 stay at 0."
          setup_api_calls:
            - call: "POST /inspection-standards"
              payload: { code: "NSPIRE-2026", name: "NSPIRE 2026", effective_date: "2026-01-01T00:00:00.000Z", unit_weight_pct: 50.00, inside_weight_pct: 30.00, outside_weight_pct: 20.00 }
              as: PlatformAdmin
              captures: { std_id: $.data.id }
            - call: "POST /defect-definitions"
