      - name: sm_offering_withdraw_blocked_by_active_agreement
        claim_type: precondition_enforcement
        grounds:
          - errors[ERR_OFFERING_HAS_ACTIVE_AGREEMENTS]
        distinguishing_aspect: "Conditional cascade guard: a VERIFIED offering referenced by a PROPOSED agreement cannot be withdrawn."
