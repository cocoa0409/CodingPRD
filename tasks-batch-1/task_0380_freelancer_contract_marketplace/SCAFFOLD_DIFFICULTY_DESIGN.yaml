              as_user_id: "${client_id}"
          trigger:
            - call: "POST /contracts/${contract_id}/terminate"
              payload: {}
              as: Client
              as_user_id: "${client_id}"
            - call: "GET /clients/${client_id}"
              payload: {}
              as: Client
              as_user_id: "${client_id}"
              captures: { wallet: $.data.wallet_balance_cents }
            - call: "GET /contracts/${contract_id}/milestones"
              payload: {}
              as: Client
              as_user_id: "${client_id}"
          assert:
            - "Contract.${contract_id}.status == TERMINATED"
            - "Milestone.${mf}.status == CANCELLED and Milestone.${md}.status == CANCELLED (hop 1)"
            - "Client.${client_id}.wallet_balance_cents == 15000 (hop 2 REFUND of the funded milestone only)"

