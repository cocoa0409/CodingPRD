            - "requested_bottles exactly 10 returns 201 — the bound is inclusive"
            - "the same venue's follow-up claim for 1 bottle returns 409 ERR_DUPLICATE_CLAIM even though 1 bottle would fit"
            - "venue ${v2_id} may still claim the full 10 (201), because the uniqueness key is (offer_id, venue_id)"
            - "AllocationOffer.${off_id}.claim_count == 2 and unallocated_bottles is still 10 — claiming reserves nothing until allocate runs"
      - name: lot_received_at_after_the_clock_returns_received_at_in_future
        claim_type: Temporal validation
        grounds:
          - validations[priority 44].ERR_RECEIVED_AT_IN_FUTURE
          - entities.InventoryLot.fields.received_at
        distinguishing_aspect: >-
          The bound is "not later than" the logical clock, so received_at exactly equal to the clock is
          legal while one second later is not. This matters because received_at is the FIFO sort key:
          accepting a future stamp would silently reorder every later depletion.
        test_recipe:
          setup:
            - "Logical clock at 2026-09-01T12:00:00Z."
            - "Venue HRB with bin A1 (capacity 48) and one RED wine."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-09-01T12:00:00Z" }
              as: BeverageDirector
              as_user_id: "bd-001"
            - call: "POST /beverage-program/venues"
              payload: { name: "Harbor Room", venue_code: "HRB", cogs_target_pct_by_category: { SPARKLING: 30.0, WHITE: 25.0, ROSE: 28.0, RED: 28.0, DESSERT: 32.0, FORTIFIED: 35.0 } }
              as: BeverageDirector
              as_user_id: "bd-001"
              captures: { v1_id: $.data.id }
            - call: "POST /beverage-program/venues/${v1_id}/cellar-bins"
              payload: { bin_code: "A1", zone: "CELLAR", capacity_bottles: 48, temperature_controlled: true }
              as: VenueSommelier
              as_user_id: "${v1_id}"
              captures: { bin1_id: $.data.id }
            - call: "POST /beverage-program/wines"
              payload: { producer: "Ridge", cuvee: "Monte Bello", vintage_year: 2019, category: "RED", reference_cost_cents: 2400, bottle_size_ml: 750, case_pack: 6, is_allocated: false }
              as: BeverageDirector
              as_user_id: "bd-001"
              captures: { w1_id: $.data.id }
          trigger:
            - call: "POST /beverage-program/inventory-lots"
              payload: { venue_id: "${v1_id}", wine_id: "${w1_id}", bin_id: "${bin1_id}", bottles_received: 6, unit_cost_cents: 2400, received_at: "2026-09-01T12:00:01Z" }
              as: VenueSommelier
              as_user_id: "${v1_id}"
            - call: "POST /beverage-program/inventory-lots"
              payload: { venue_id: "${v1_id}", wine_id: "${w1_id}", bin_id: "${bin1_id}", bottles_received: 6, unit_cost_cents: 2400, received_at: "2026-09-01T12:00:00Z" }
              as: VenueSommelier
              as_user_id: "${v1_id}"
              captures: { lot1_id: $.data.id }
            - call: "POST /beverage-program/inventory-lots"
              payload: { venue_id: "${v1_id}", wine_id: "${w1_id}", bin_id: "${bin1_id}", bottles_received: 60, unit_cost_cents: 2400, received_at: "2026-08-10T00:00:00Z" }
              as: VenueSommelier
              as_user_id: "${v1_id}"
          assert:
            - "received_at one second after the clock returns 422 ERR_RECEIVED_AT_IN_FUTURE and no lot or bin movement occurs"
            - "received_at exactly equal to the clock returns 201 with state ON_HAND, bottles_on_hand 6 and bottles_committed 0"
            - "CellarBin.${bin1_id}.bottles_stored == 6 and utilization_pct == 12.50 after the accepted lot"
            - "the 60-bottle backdated lot returns 409 ERR_BIN_CAPACITY_EXCEEDED (priority 54): 6 + 60 > 48, and the past received_at does not exempt it"
            - "GET /beverage-program/inventory-lots?venue_id=${v1_id} returns exactly 1 row"
      - name: prohibited_byo_category_beats_byo_bottle_limit
        claim_type: Priority conflict
        grounds:
          - validations[priority 42].ERR_BYO_CATEGORY_PROHIBITED
          - validations[priority 59].ERR_BYO_LIMIT_EXCEEDED
          - validations[priority 13].ERR_INVALID_ENUM_VALUE
        distinguishing_aspect: >-
          One corkage quote can violate the safety rule at 42 and the constraint rule at 59 at the same
          time; the answer must be the safety error. A malformed category then jumps ahead of both to
          the enum rule at 13, giving a three-level ladder over a single stateless endpoint.
        test_recipe:
          setup:
            - "Logical clock at 2026-09-01T12:00:00Z."
            - "Venue HRB configured with byo_bottle_limit_per_party 2, byo_prohibited_categories [SPARKLING], corkage_fee_cents 3500 and corkage_waiver_purchase_ratio 2."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-09-01T12:00:00Z" }
              as: BeverageDirector
              as_user_id: "bd-001"
            - call: "POST /beverage-program/venues"
              payload: { name: "Harbor Room", venue_code: "HRB", cogs_target_pct_by_category: { SPARKLING: 30.0, WHITE: 25.0, ROSE: 28.0, RED: 28.0, DESSERT: 32.0, FORTIFIED: 35.0 }, corkage_fee_cents: 3500, corkage_waiver_purchase_ratio: 2, byo_bottle_limit_per_party: 2, byo_prohibited_categories: ["SPARKLING"] }
              as: BeverageDirector
              as_user_id: "bd-001"
              captures: { v1_id: $.data.id }
          trigger:
            - call: "POST /beverage-program/venues/${v1_id}/corkage-charges"
              payload: { byo_bottle_count: 3, bottles_purchased_from_list: 0, party_size: 4, byo_categories: ["SPARKLING", "RED"] }
              as: VenueSommelier
              as_user_id: "${v1_id}"
            - call: "POST /beverage-program/venues/${v1_id}/corkage-charges"
              payload: { byo_bottle_count: 3, bottles_purchased_from_list: 0, party_size: 4, byo_categories: ["RED"] }
              as: VenueSommelier
              as_user_id: "${v1_id}"
            - call: "POST /beverage-program/venues/${v1_id}/corkage-charges"
              payload: { byo_bottle_count: 1, bottles_purchased_from_list: 0, party_size: 4, byo_categories: ["MERLOT"] }
              as: VenueSommelier
              as_user_id: "${v1_id}"
            - call: "POST /beverage-program/venues/${v1_id}/corkage-charges"
              payload: { byo_bottle_count: 2, bottles_purchased_from_list: 4, party_size: 4, byo_categories: ["RED"] }
              as: VenueSommelier
              as_user_id: "${v1_id}"
          assert:
            - "3 SPARKLING-and-RED bottles violate both 42 and 59 and return 422 ERR_BYO_CATEGORY_PROHIBITED — the safety rule wins"
            - "3 RED bottles violate only the limit and return 422 ERR_BYO_LIMIT_EXCEEDED"
            - "byo_categories [MERLOT] returns 422 ERR_INVALID_ENUM_VALUE (priority 13) even though the count 1 is legal — shape checks precede both business rules"
            - "the legal quote returns 200 with waived_bottles 2 (floor(4 / 2) capped at the 2 bottles brought), chargeable_bottles 0, corkage_total_cents 0 and large_party_discount_applied false"
            - "nothing was persisted by any of the four calls: the endpoint declares no side effects and Venue.${v1_id}.version is unchanged"
      - name: publish_state_gate_outranks_frozen_posture
        claim_type: Priority Ordering
        grounds:
          - validations[priority 25].ERR_LIST_VERSION_NOT_IN_REVIEW
          - validations[priority 60].ERR_VENUE_PROGRAM_FROZEN
        excluded_because:
          difficulty_instance: priority_pair_validation_conflict / state_beats_business_fiscal_on_publish_at_frozen_venue
          rationale: "That instance violates both rules in one publish call and asserts the state error, then isolates each rule separately."
      - name: compliance_hold_outranks_bin_capacity_on_receipt
        claim_type: Priority Ordering
        grounds:
          - validations[priority 40].ERR_DISTRIBUTOR_COMPLIANCE_HOLD
          - validations[priority 54].ERR_BIN_CAPACITY_EXCEEDED
        excluded_because:
          difficulty_instance: priority_pair_validation_conflict / business_safety_beats_business_constraint_on_allocation_receipt
          rationale: "The receipt there violates the safety rule and the capacity rule simultaneously and asserts the safety error, then clears the hold to expose the constraint error."
  - section: endpoints
    instances:
      - name: list_entry_patch_applies_partial_update_only_while_draft
        claim_type: Standard CRUD
        grounds:
          - endpoints["PATCH /beverage-program/list-entries/{list_entry_id}"]
          - validations[priority 24].ERR_LIST_VERSION_NOT_DRAFT
        distinguishing_aspect: >-
          PATCH is a true partial update: omitted keys must keep their stored values, education_verified
          must re-run the contest score, and the whole endpoint must close once the parent version
          leaves DRAFT — so the identical body that worked before publish returns 409 afterwards.
        test_recipe:
          setup:
            - "Logical clock at 2026-09-01T12:00:00Z."
            - "Venue HRB with one RED wine and a DRAFT ListVersion carrying a bottle-only entry (par_bottles 6, tasting_note \"Youthful.\", education_verified false)."
