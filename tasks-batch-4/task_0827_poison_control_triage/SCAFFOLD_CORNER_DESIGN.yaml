scaffold_corner_design:

  # =================================================================
  - section: entities
    instances:
      - name: create_exposure_case_success
        claim_type: Creation
        grounds: [entities.ExposureCase, endpoints]
        distinguishing_aspect: "POST /exposure-cases with all required fields returns 201 with status INTAKE, version 1, and a server-minted id."
        test_recipe:
          setup: ["One SPI specialist exists."]
          setup_api_calls:
            - call: "POST /specialists"
              payload: { full_name: "Sam SPI", credential: "SPI" }
              as: SystemAdmin
              captures: { spi: $.data.id }
          trigger:
            - call: "POST /exposure-cases"
              payload: { patient_age_years: 4, patient_weight_kg: 18, patient_sex: "FEMALE", chief_complaint: "berry ingestion" }
              as: Specialist
              as_user_id: "${spi}"
              captures: { case: $.data.id }
          assert:
            - "response code 201; ExposureCase.${case}.status == INTAKE"
            - "ExposureCase.${case}.version == 1"
            - "ExposureCase.${case}.patient_weight_kg == 18"

      - name: system_field_intake_specialist_from_header
        claim_type: System Fields
        grounds: [entities.ExposureCase.fields.intake_specialist_id]
        distinguishing_aspect: "intake_specialist_id is set from X-User-ID (system source), not from the request body."
        test_recipe:
          setup: ["One SPI specialist."]
          setup_api_calls:
            - call: "POST /specialists"
              payload: { full_name: "Sam SPI", credential: "SPI" }
              as: SystemAdmin
              captures: { spi: $.data.id }
          trigger:
            - call: "POST /exposure-cases"
              payload: { patient_age_years: 4, patient_weight_kg: 18, patient_sex: "MALE", chief_complaint: "ingestion" }
              as: Specialist
              as_user_id: "${spi}"
              captures: { case: $.data.id }
          assert:
            - "ExposureCase.${case}.intake_specialist_id == ${spi}"

      - name: get_exposure_case_not_found
        claim_type: Not Found
        grounds: [entities.ExposureCase, "errors[ERR_CASE_NOT_FOUND]"]
        distinguishing_aspect: "GET /exposure-cases/{id} with a non-existent UUID returns ERR_CASE_NOT_FOUND (404)."
        test_recipe:
          setup: ["One SPI specialist (to authenticate)."]
          setup_api_calls:
            - call: "POST /specialists"
              payload: { full_name: "Sam SPI", credential: "SPI" }
              as: SystemAdmin
              captures: { spi: $.data.id }
          trigger:
            - call: "GET /exposure-cases/00000000-0000-4000-8000-000000000000"
              payload: {}
              as: Specialist
              as_user_id: "${spi}"
              captures: { err: $.data.error_id }
          assert:
            - "response error_id == ERR_CASE_NOT_FOUND (404)"

      - name: create_case_missing_required_weight_rejected
        claim_type: Required Fields
        grounds: [entities.ExposureCase.fields.patient_weight_kg, "errors[ERR_INVALID_REQUEST]"]
        distinguishing_aspect: "POST /exposure-cases without patient_weight_kg returns ERR_INVALID_REQUEST (400)."
        test_recipe:
          setup: ["One SPI specialist."]
          setup_api_calls:
            - call: "POST /specialists"
              payload: { full_name: "Sam SPI", credential: "SPI" }
              as: SystemAdmin
              captures: { spi: $.data.id }
          trigger:
            - call: "POST /exposure-cases"
              payload: { patient_age_years: 4, patient_sex: "MALE", chief_complaint: "ingestion" }
              as: Specialist
              as_user_id: "${spi}"
              captures: { err: $.data.error_id }
          assert:
            - "response error_id == ERR_INVALID_REQUEST (400)"

      - name: interpreter_language_required_when_flag_set
        claim_type: Conditional validation
        grounds: ["validations[priority=19]", "errors[ERR_INTERPRETER_LANGUAGE_REQUIRED]", entities.ExposureCase.fields.interpreter_language]
        distinguishing_aspect: "POST /exposure-cases with interpreter_required=true but no interpreter_language returns ERR_INTERPRETER_LANGUAGE_REQUIRED (422)."
        test_recipe:
          setup: ["One SPI specialist."]
          setup_api_calls:
            - call: "POST /specialists"
              payload: { full_name: "Sam SPI", credential: "SPI" }
              as: SystemAdmin
              captures: { spi: $.data.id }
          trigger:
            - call: "POST /exposure-cases"
              payload: { patient_age_years: 4, patient_weight_kg: 18, patient_sex: "MALE", chief_complaint: "ingestion", interpreter_required: true }
              as: Specialist
              as_user_id: "${spi}"
              captures: { err: $.data.error_id }
          assert:
            - "response error_id == ERR_INTERPRETER_LANGUAGE_REQUIRED (422)"

      - name: list_exposure_cases_pagination_envelope
        claim_type: Listing
        grounds: [entities.ExposureCase, endpoints]
        distinguishing_aspect: "GET /exposure-cases returns an array with pagination fields total_count and has_more."
        test_recipe:
          setup: ["One SPI specialist; two cases created."]
          setup_api_calls:
            - call: "POST /specialists"
              payload: { full_name: "Sam SPI", credential: "SPI" }
              as: SystemAdmin
              captures: { spi: $.data.id }
            - call: "POST /exposure-cases"
              payload: { patient_age_years: 4, patient_weight_kg: 18, patient_sex: "MALE", chief_complaint: "c1" }
              as: Specialist
              as_user_id: "${spi}"
            - call: "POST /exposure-cases"
              payload: { patient_age_years: 5, patient_weight_kg: 20, patient_sex: "FEMALE", chief_complaint: "c2" }
              as: Specialist
              as_user_id: "${spi}"
          trigger:
            - call: "GET /exposure-cases?limit=1&offset=0"
              payload: {}
              as: Specialist
              as_user_id: "${spi}"
          assert:
            - "response total_count == 2 and has_more == true and data length == 1"

  # =================================================================
  - section: state_machines
    instances:
      - name: triage_from_already_triaged_returns_invalid_state
        claim_type: invalid_transition
        grounds: [state_machines.ExposureCase.INTAKE_to_TRIAGED, "errors[ERR_INVALID_STATE]"]
        distinguishing_aspect: "Triaging a case already in TRIAGED returns ERR_INVALID_STATE (409); no state change."
        test_recipe:
          setup: ["A case with one exposure, already triaged."]
          setup_api_calls:
            - call: "POST /substances"
              payload: { name: "acetaminophen", category: "ANALGESIC", toxic_dose_mg_per_kg: 150, onset_hours: 4, reference_route: "INGESTION" }
              as: SystemAdmin
              captures: { sub_apap: $.data.id }
            - call: "POST /specialists"
              payload: { full_name: "Sam SPI", credential: "SPI" }
              as: SystemAdmin
              captures: { spi: $.data.id }
            - call: "POST /exposure-cases"
              payload: { patient_age_years: 6, patient_weight_kg: 20, patient_sex: "MALE", chief_complaint: "ingestion" }
              as: Specialist
              as_user_id: "${spi}"
              captures: { case: $.data.id }
            - call: "POST /exposure-cases/${case}/exposures"
              payload: { substance_id: "${sub_apap}", route: "INGESTION", dose_range_low_mg: 1200, dose_range_high_mg: 1500, time_since_exposure_hours: 2 }
              as: Specialist
              as_user_id: "${spi}"
            - call: "POST /exposure-cases/${case}/triage"
              payload: {}
              as: Specialist
              as_user_id: "${spi}"
          trigger:
            - call: "POST /exposure-cases/${case}/triage"
              payload: {}
              as: Specialist
              as_user_id: "${spi}"
              captures: { err: $.data.error_id }
          assert:
            - "response error_id == ERR_INVALID_STATE (409)"

      - name: finalize_twice_second_returns_invalid_state
        claim_type: Idempotency
        grounds: [state_machines.RiskAssessment.COMPLETED_to_FINALIZED, "errors[ERR_INVALID_STATE]"]
        distinguishing_aspect: "A second finalize on an already-FINALIZED assessment (by an authorized Specialist) returns ERR_INVALID_STATE (409)."
        test_recipe:
          setup: ["A MODERATE case with a FINALIZED RiskAssessment."]
          setup_api_calls:
            - call: "POST /substances"
              payload: { name: "acetaminophen", category: "ANALGESIC", toxic_dose_mg_per_kg: 150, onset_hours: 4, reference_route: "INGESTION" }
              as: SystemAdmin
              captures: { sub_apap: $.data.id }
            - call: "POST /protocols"
              payload: { risk_tier: "MODERATE", management_setting: "HOME", followup_count: 1, followup_interval_hours: 24, requires_toxicologist: false }
              as: SystemAdmin
            - call: "POST /specialists"
              payload: { full_name: "Sam SPI", credential: "SPI" }
              as: SystemAdmin
              captures: { spi: $.data.id }
            - call: "POST /exposure-cases"
              payload: { patient_age_years: 6, patient_weight_kg: 20, patient_sex: "MALE", chief_complaint: "ingestion" }
              as: Specialist
              as_user_id: "${spi}"
              captures: { case: $.data.id }
            - call: "POST /exposure-cases/${case}/exposures"
              payload: { substance_id: "${sub_apap}", route: "INGESTION", dose_range_low_mg: 1200, dose_range_high_mg: 1500, time_since_exposure_hours: 2 }
              as: Specialist
              as_user_id: "${spi}"
            - call: "POST /exposure-cases/${case}/triage"
              payload: {}
              as: Specialist
              as_user_id: "${spi}"
              captures: { case_v: $.data.version }
            - call: "POST /exposure-cases/${case}/risk-assessments"
              payload: { expected_case_version: "${case_v}" }
              as: Specialist
              as_user_id: "${spi}"
              captures: { ra: $.data.id }
            - call: "POST /risk-assessments/${ra}/finalize"
              payload: {}
              as: Specialist
              as_user_id: "${spi}"
          trigger:
            - call: "POST /risk-assessments/${ra}/finalize"
              payload: {}
              as: Specialist
              as_user_id: "${spi}"
              captures: { err: $.data.error_id }
          assert:
            - "response error_id == ERR_INVALID_STATE (409)"

      - name: risk_assessment_initial_state_completed
        claim_type: Initial State
        grounds: [state_machines.RiskAssessment, entities.RiskAssessment.fields.status]
        distinguishing_aspect: "A newly created RiskAssessment starts in status COMPLETED."
        test_recipe:
          setup: ["A triaged MODERATE case."]
          setup_api_calls:
            - call: "POST /substances"
              payload: { name: "acetaminophen", category: "ANALGESIC", toxic_dose_mg_per_kg: 150, onset_hours: 4, reference_route: "INGESTION" }
              as: SystemAdmin
              captures: { sub_apap: $.data.id }
            - call: "POST /specialists"
              payload: { full_name: "Sam SPI", credential: "SPI" }
              as: SystemAdmin
              captures: { spi: $.data.id }
            - call: "POST /exposure-cases"
              payload: { patient_age_years: 6, patient_weight_kg: 20, patient_sex: "MALE", chief_complaint: "ingestion" }
              as: Specialist
              as_user_id: "${spi}"
              captures: { case: $.data.id }
            - call: "POST /exposure-cases/${case}/exposures"
              payload: { substance_id: "${sub_apap}", route: "INGESTION", dose_range_low_mg: 1200, dose_range_high_mg: 1500, time_since_exposure_hours: 2 }
              as: Specialist
              as_user_id: "${spi}"
            - call: "POST /exposure-cases/${case}/triage"
              payload: {}
              as: Specialist
              as_user_id: "${spi}"
              captures: { case_v: $.data.version }
          trigger:
            - call: "POST /exposure-cases/${case}/risk-assessments"
              payload: { expected_case_version: "${case_v}" }
              as: Specialist
              as_user_id: "${spi}"
              captures: { ra: $.data.id }
          assert:
            - "RiskAssessment.${ra}.status == COMPLETED"

  # =================================================================
  - section: calculations
    instances:
      - name: consult_billing_units_discount_correct
        claim_type: Correct Result
        grounds: [calculations.consult_billing_units, entities.FacilityConsult.fields.billing_units]
        distinguishing_aspect: "For a SEVERE case, a 90-minute consult bills specialist_units 4.50, gross 6.50, 10% discount, net billing_units 5.85 (discount keyed on gross)."
        test_recipe:
          setup: ["SEVERE case (exposure dose 3000 -> 1.00) with a COMPLETED RiskAssessment; ACCEPTING facility; consult opened; closed with confirmed_dose 3000 (no tier change)."]
          setup_api_calls:
            - call: "POST /substances"
              payload: { name: "acetaminophen", category: "ANALGESIC", toxic_dose_mg_per_kg: 150, onset_hours: 4, reference_route: "INGESTION" }
              as: SystemAdmin
              captures: { sub_apap: $.data.id }
            - call: "POST /healthcare-facilities"
              payload: { name: "Metro ED", facility_type: "ED", status: "ACCEPTING", consult_capacity: 2 }
              as: SystemAdmin
              captures: { fac: $.data.id }
            - call: "POST /specialists"
              payload: { full_name: "Sam SPI", credential: "SPI" }
              as: SystemAdmin
              captures: { spi: $.data.id }
            - call: "POST /specialists"
              payload: { full_name: "Tara Tox", credential: "TOXICOLOGIST" }
              as: SystemAdmin
              captures: { tox: $.data.id }
            - call: "POST /exposure-cases"
              payload: { patient_age_years: 6, patient_weight_kg: 20, patient_sex: "MALE", chief_complaint: "ingestion" }
              as: Specialist
              as_user_id: "${spi}"
              captures: { case: $.data.id }
            - call: "POST /exposure-cases/${case}/exposures"
              payload: { substance_id: "${sub_apap}", route: "INGESTION", dose_range_low_mg: 3000, dose_range_high_mg: 3000, time_since_exposure_hours: 2 }
              as: Specialist
              as_user_id: "${spi}"
            - call: "POST /exposure-cases/${case}/triage"
              payload: {}
              as: Specialist
              as_user_id: "${spi}"
              captures: { case_v: $.data.version }
            - call: "POST /exposure-cases/${case}/risk-assessments"
              payload: { expected_case_version: "${case_v}" }
              as: Specialist
              as_user_id: "${spi}"
            - call: "POST /facility-consults"
              payload: { case_id: "${case}", facility_id: "${fac}", consult_duration_minutes: 90 }
              as: Toxicologist
              as_user_id: "${tox}"
              captures: { consult: $.data.id }
          trigger:
            - call: "POST /facility-consults/${consult}/close"
              payload: { confirmed_dose_mg: 3000 }
              as: Toxicologist
              as_user_id: "${tox}"
          assert:
            - "FacilityConsult.${consult}.billing_units == 5.85"

      - name: npds_medical_outcome_from_additive
        claim_type: Correct Result
        grounds: [calculations.npds_medical_outcome, entities.NpdsReport.fields.medical_outcome]
        distinguishing_aspect: "A single-exposure MODERATE case (additive 0.50) yields NpdsReport.medical_outcome == MODERATE."
        test_recipe:
          setup: ["A triaged MODERATE case (exposure score 0.50) with a COMPLETED RiskAssessment."]
          setup_api_calls:
            - call: "POST /substances"
              payload: { name: "acetaminophen", category: "ANALGESIC", toxic_dose_mg_per_kg: 150, onset_hours: 4, reference_route: "INGESTION" }
              as: SystemAdmin
              captures: { sub_apap: $.data.id }
            - call: "POST /specialists"
              payload: { full_name: "Sam SPI", credential: "SPI" }
              as: SystemAdmin
              captures: { spi: $.data.id }
            - call: "POST /exposure-cases"
              payload: { patient_age_years: 6, patient_weight_kg: 20, patient_sex: "MALE", chief_complaint: "ingestion" }
              as: Specialist
              as_user_id: "${spi}"
              captures: { case: $.data.id }
            - call: "POST /exposure-cases/${case}/exposures"
              payload: { substance_id: "${sub_apap}", route: "INGESTION", dose_range_low_mg: 1500, dose_range_high_mg: 1500, time_since_exposure_hours: 2 }
              as: Specialist
              as_user_id: "${spi}"
            - call: "POST /exposure-cases/${case}/triage"
              payload: {}
              as: Specialist
              as_user_id: "${spi}"
              captures: { case_v: $.data.version }
            - call: "POST /exposure-cases/${case}/risk-assessments"
              payload: { expected_case_version: "${case_v}" }
              as: Specialist
              as_user_id: "${spi}"
          trigger:
            - call: "POST /npds-reports"
              payload: { case_id: "${case}", primary_substance_id: "${sub_apap}" }
              as: SurveillanceOfficer
              captures: { report: $.data.id }
          assert:
            - "NpdsReport.${report}.medical_outcome == MODERATE"

      - name: additive_co_ingestant_multiplier_applied
        claim_type: Constants Applied
        grounds: [calculations.case_aggregate_risk]
        excluded_because:
          difficulty_instance: combinatorial_formula / additive_round_per_exposure_then_sum
          rationale: "The co-ingestant 1.15 multiplier and per-exposure weights are asserted numerically by the named additive §1.8 instance."

  # =================================================================
  - section: validations
    instances:
      - name: ed_referral_without_facility_rejected
        claim_type: Violation to Error
        grounds: ["validations[priority=9]", "errors[ERR_DISPOSITION_FACILITY_MISMATCH]"]
        distinguishing_aspect: "A disposition with disposition_type=ED_REFERRAL and no facility_id returns ERR_DISPOSITION_FACILITY_MISMATCH (422)."
        test_recipe:
          setup: ["A triaged MODERATE case with a FINALIZED RiskAssessment."]
          setup_api_calls:
            - call: "POST /substances"
              payload: { name: "acetaminophen", category: "ANALGESIC", toxic_dose_mg_per_kg: 150, onset_hours: 4, reference_route: "INGESTION" }
              as: SystemAdmin
              captures: { sub_apap: $.data.id }
            - call: "POST /protocols"
              payload: { risk_tier: "MODERATE", management_setting: "HOME", followup_count: 1, followup_interval_hours: 24, requires_toxicologist: false }
              as: SystemAdmin
            - call: "POST /specialists"
              payload: { full_name: "Sam SPI", credential: "SPI" }
              as: SystemAdmin
              captures: { spi: $.data.id }
            - call: "POST /exposure-cases"
              payload: { patient_age_years: 6, patient_weight_kg: 20, patient_sex: "MALE", chief_complaint: "ingestion" }
              as: Specialist
              as_user_id: "${spi}"
              captures: { case: $.data.id }
            - call: "POST /exposure-cases/${case}/exposures"
              payload: { substance_id: "${sub_apap}", route: "INGESTION", dose_range_low_mg: 1200, dose_range_high_mg: 1500, time_since_exposure_hours: 2 }
              as: Specialist
              as_user_id: "${spi}"
            - call: "POST /exposure-cases/${case}/triage"
              payload: {}
              as: Specialist
              as_user_id: "${spi}"
              captures: { case_v: $.data.version }
            - call: "POST /exposure-cases/${case}/risk-assessments"
              payload: { expected_case_version: "${case_v}" }
              as: Specialist
              as_user_id: "${spi}"
              captures: { ra: $.data.id }
            - call: "POST /risk-assessments/${ra}/finalize"
              payload: {}
              as: Specialist
              as_user_id: "${spi}"
          trigger:
            - call: "POST /exposure-cases/${case}/dispositions"
              payload: { risk_assessment_id: "${ra}", disposition_type: "ED_REFERRAL" }
              as: Specialist
              as_user_id: "${spi}"
              captures: { err: $.data.error_id }
          assert:
            - "response error_id == ERR_DISPOSITION_FACILITY_MISMATCH (422)"

      - name: unsafe_home_disposition_on_severe_rejected
        claim_type: Violation to Error
        grounds: ["validations[priority=7]", "errors[ERR_UNSAFE_DISPOSITION]"]
        distinguishing_aspect: "A HOME_MANAGEMENT disposition on a SEVERE case with a FINALIZED assessment returns ERR_UNSAFE_DISPOSITION (422)."
        test_recipe:
          setup: ["A SEVERE case (exposure 3000 -> 1.00) with a FINALIZED RiskAssessment (SEVERE protocol requires_toxicologist true; finalized by Toxicologist)."]
          setup_api_calls:
            - call: "POST /substances"
              payload: { name: "acetaminophen", category: "ANALGESIC", toxic_dose_mg_per_kg: 150, onset_hours: 4, reference_route: "INGESTION" }
              as: SystemAdmin
              captures: { sub_apap: $.data.id }
            - call: "POST /protocols"
              payload: { risk_tier: "SEVERE", management_setting: "ED", followup_count: 0, followup_interval_hours: 24, requires_toxicologist: true }
              as: SystemAdmin
            - call: "POST /specialists"
              payload: { full_name: "Sam SPI", credential: "SPI" }
              as: SystemAdmin
              captures: { spi: $.data.id }
            - call: "POST /specialists"
              payload: { full_name: "Tara Tox", credential: "TOXICOLOGIST" }
              as: SystemAdmin
              captures: { tox: $.data.id }
            - call: "POST /exposure-cases"
              payload: { patient_age_years: 6, patient_weight_kg: 20, patient_sex: "MALE", chief_complaint: "large ingestion" }
              as: Specialist
              as_user_id: "${spi}"
              captures: { case: $.data.id }
            - call: "POST /exposure-cases/${case}/exposures"
              payload: { substance_id: "${sub_apap}", route: "INGESTION", dose_range_low_mg: 3000, dose_range_high_mg: 3000, time_since_exposure_hours: 2 }
              as: Specialist
              as_user_id: "${spi}"
            - call: "POST /exposure-cases/${case}/triage"
              payload: {}
              as: Specialist
              as_user_id: "${spi}"
              captures: { case_v: $.data.version }
            - call: "POST /exposure-cases/${case}/risk-assessments"
              payload: { expected_case_version: "${case_v}" }
              as: Specialist
              as_user_id: "${spi}"
              captures: { ra: $.data.id }
            - call: "POST /risk-assessments/${ra}/finalize"
              payload: {}
              as: Toxicologist
              as_user_id: "${tox}"
          trigger:
            - call: "POST /exposure-cases/${case}/dispositions"
              payload: { risk_assessment_id: "${ra}", disposition_type: "HOME_MANAGEMENT" }
              as: Specialist
              as_user_id: "${spi}"
              captures: { err: $.data.error_id }
          assert:
            - "response error_id == ERR_UNSAFE_DISPOSITION (422)"

      - name: followup_invalid_window_rejected
        claim_type: Violation to Error
        grounds: ["validations[priority=14]", "errors[ERR_INVALID_WINDOW]"]
        distinguishing_aspect: "A follow-up call with scheduled_end <= scheduled_start returns ERR_INVALID_WINDOW (422)."
        test_recipe:
          setup: ["A triaged case and a specialist."]
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-06-01T00:00:00Z" }
              as: SystemAdmin
            - call: "POST /substances"
              payload: { name: "acetaminophen", category: "ANALGESIC", toxic_dose_mg_per_kg: 150, onset_hours: 4, reference_route: "INGESTION" }
              as: SystemAdmin
              captures: { sub_apap: $.data.id }
            - call: "POST /specialists"
              payload: { full_name: "Sam SPI", credential: "SPI" }
              as: SystemAdmin
              captures: { spi: $.data.id }
            - call: "POST /exposure-cases"
              payload: { patient_age_years: 6, patient_weight_kg: 20, patient_sex: "MALE", chief_complaint: "ingestion" }
              as: Specialist
              as_user_id: "${spi}"
              captures: { case: $.data.id }
            - call: "POST /exposure-cases/${case}/exposures"
              payload: { substance_id: "${sub_apap}", route: "INGESTION", dose_range_low_mg: 1200, dose_range_high_mg: 1500, time_since_exposure_hours: 2 }
              as: Specialist
              as_user_id: "${spi}"
            - call: "POST /exposure-cases/${case}/triage"
              payload: {}
              as: Specialist
              as_user_id: "${spi}"
          trigger:
            - call: "POST /exposure-cases/${case}/follow-up-calls"
              payload: { assigned_specialist_id: "${spi}", sequence_index: 0, scheduled_start: "2026-06-02T10:00:00Z", scheduled_end: "2026-06-02T10:00:00Z" }
              as: Specialist
              as_user_id: "${spi}"
              captures: { err: $.data.error_id }
          assert:
            - "response error_id == ERR_INVALID_WINDOW (422)"

      - name: facility_at_capacity_rejected
        claim_type: Aggregate validation
        grounds: ["validations[priority=11]", "errors[ERR_FACILITY_AT_CAPACITY]", entities.HealthcareFacility.fields.consult_capacity]
        distinguishing_aspect: "Opening a second consult on a facility with consult_capacity 1 (already 1 ACTIVE) returns ERR_FACILITY_AT_CAPACITY (409)."
        test_recipe:
          setup: ["ACCEPTING facility with consult_capacity 1; a case; one ACTIVE consult already open."]
