  - section: consistency_model
    instances:
      - name: immediate_consistency_claim_allow_visible_on_debt_read
        claim_type: immediate
        grounds: [entities.Debt.fields.allowed_amount_cents, state_machines.ClaimRecord.FILED_to_ALLOWED]
