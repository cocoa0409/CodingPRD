  # =========================================================================
  # Rule 8 — Resource temporal-overlap conflicts across different interval semantics
  # =========================================================================
  - rule_id: resource_temporal_overlap
    instances:
      - name: shopday_aggregate_capacity_overlap_rejected
        grounds:
          - validations[priority=40]
          - calculations.shop_capacity
          - errors[ERR_CAPACITY_EXCEEDED]
          - entities.ShopDay.fields.labor_capacity_hours
        distinguishing_aspect: |
          AGGREGATE-CAPACITY interval semantics on the ShopDay resource: a second PRODUCTION leg of 5h
          onto a 6h-capacity day already holding 4h is rejected (4+5=9 > 6) -- the conflict is pool
          exhaustion, not geometric window overlap.
        test_recipe:
          setup:
            - "ShopDay capacity 6h with 4h already booked by a first approved order; a second approved order needs 5h."
          setup_api_calls:
            - call: "POST /shop-days"
