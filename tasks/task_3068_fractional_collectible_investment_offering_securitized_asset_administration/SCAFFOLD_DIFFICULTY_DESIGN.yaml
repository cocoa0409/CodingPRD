  # ===========================================================================
  - rule_id: cross_entity_state_dependency
    instances:

      - name: offering_may_only_be_filed_while_the_artwork_is_authenticated
        grounds:
          - state_machines.Offering.DRAFT_to_QUALIFICATION_FILED
          - state_machines.Artwork.APPRAISED_to_AUTHENTICATED
          - state_machines.Artwork.AUTHENTICATED_to_OFFERING_PENDING
          - entities.Artwork.artifacts_overview
          - errors.ERR_INVALID_STATE
        distinguishing_aspect: "A cross-entity dependency on the Offering-to-Artwork pair: the qualification filing's validity depends on the Artwork's authentication state, so the same request against an Offering whose artwork is still APPRAISED is refused — a different entity pair from the subscription-to-investor dependency."
        test_recipe:
          setup:
            - "Logical clock at 2026-09-10T00:00:00Z. An artwork with only the PROVENANCE component filed, so it is still APPRAISED; an offering created against it."
          setup_api_calls:
            - call: "POST /api/_clock/set_current_utc"
              payload: { current_utc: "2026-09-01T00:00:00Z" }
              as: PlatformAdmin
            - call: "POST /api/artists"
              payload: { legal_name: "Hollis Vandermeer", attribution_status: "CONFIRMED", nationality_country_code: "US", birth_year: 1948 }
              as: IssuerOps
              captures: { artist_id: $.data.id }
            - call: "POST /api/artworks"
              payload: { title: "Untitled (Meridian Field)", artist_id: "${artist_id}", creation_year: 1971, medium: "PAINTING", acquisition_cost_cents: 60000000, reserve_price_cents: 100000000 }
              as: IssuerOps
              captures: { artwork_id: $.data.id }
            - call: "POST /api/artworks/${artwork_id}/asset-reports"
              payload: { report_type: "PROVENANCE", outcome: "VERIFIED", firm_name: "Halden Provenance Research" }
              as: IssuerOps
          trigger:
            - call: "POST /api/artworks/${artwork_id}/offerings"
              payload: { total_shares: 40000, price_per_share_cents: 1500, exemption_type: "REG_D_506C", registration_cap_pct: 2000, liquidity_ratio_bps: 1000, hold_period_days: 182, management_fee_bps: 150, profit_participation_bps: 2000, cost_pass_through_bps: 10000, preferred_return_bps: 800 }
              as: IssuerOps
              captures: { err_id: $.data.error_id }
          assert:
            - "the response status is 409 and err_id == ERR_INVALID_STATE"
            - "Artwork.${artwork_id}.status is still APPRAISED"
            - "GET /api/offerings?artwork_id=${artwork_id} returns 0 rows"
            - "after filing the AUTHENTICATION component the identical request succeeds with 201 and Artwork.${artwork_id}.status becomes OFFERING_PENDING"

      - name: subscription_may_only_be_screened_while_the_investor_is_not_revoked
        grounds:
          - state_machines.Subscription.RECEIVED_to_SUBSCRIBED
          - state_machines.Investor.APPROVED_to_REVOKED
          - validations[priority=2]
          - errors.ERR_INVALID_STATE
          - endpoints.POST_/api/subscriptions/{id}/screen
        distinguishing_aspect: "A cross-entity dependency on the Subscription-to-Investor pair: the screen's validity depends on the Investor's suitability state, so a subscription raised before a suitability revocation can no longer be screened afterwards — a different entity pair from the offering-to-artwork dependency."
        test_recipe:
          setup:
            - "Logical clock at 2026-09-10T00:00:00Z. A filed offering; an investor whose suitability was APPROVED by an earlier screen, then revoked."
            - "A second RECEIVED subscription raised by that investor before the revocation took effect on it."
          setup_api_calls:
            - call: "POST /api/_clock/set_current_utc"
              payload: { current_utc: "2026-09-01T00:00:00Z" }
              as: PlatformAdmin
            - call: "POST /api/artists"
              payload: { legal_name: "Hollis Vandermeer", attribution_status: "CONFIRMED", nationality_country_code: "US", birth_year: 1948 }
              as: IssuerOps
              captures: { artist_id: $.data.id }
            - call: "POST /api/artworks"
              payload: { title: "Untitled (Meridian Field)", artist_id: "${artist_id}", creation_year: 1971, medium: "PAINTING", acquisition_cost_cents: 60000000, reserve_price_cents: 100000000 }
              as: IssuerOps
              captures: { artwork_id: $.data.id }
            - call: "POST /api/artworks/${artwork_id}/asset-reports"
              payload: { report_type: "AUTHENTICATION", outcome: "VERIFIED", firm_name: "Vandermeer Catalogue Raisonne Committee" }
              as: IssuerOps
            - call: "POST /api/artworks/${artwork_id}/asset-reports"
              payload: { report_type: "PROVENANCE", outcome: "VERIFIED", firm_name: "Halden Provenance Research" }
              as: IssuerOps
            - call: "POST /api/artworks/${artwork_id}/offerings"
              payload: { total_shares: 40000, price_per_share_cents: 1500, exemption_type: "REG_D_506C", registration_cap_pct: 2000, liquidity_ratio_bps: 1000, hold_period_days: 182, management_fee_bps: 150, profit_participation_bps: 2000, cost_pass_through_bps: 10000, preferred_return_bps: 800 }
              as: IssuerOps
              captures: { offering_id: $.data.id, off_v0: $.data.version }
            - call: "POST /api/investors"
              payload: { email: "mireille@x.com", legal_name: "Mireille Dax", password: "p", citizenship_country_code: "US", residency_country_code: "GB", birth_date: "1971-07-19", annual_income_cents: 35000000, net_worth_cents: 260000000 }
              as: Anonymous
              captures: { inv_revoked: $.data.id }
            - call: "POST /api/offerings/${offering_id}/qualification-filing"
              payload: { circular_reference: "CIRC-2026-3068-10", expected_offering_version: "${off_v0}" }
              as: ComplianceOfficer
            - call: "POST /api/subscriptions"
              payload: { offering_id: "${offering_id}", investor_id: "${inv_revoked}", requested_shares: 500 }
              as: Investor
              as_user_id: "${inv_revoked}"
              captures: { sub_first: $.data.id }
            - call: "POST /api/subscriptions/${sub_first}/screen"
              payload: { outcome: "VERIFIED" }
              as: ComplianceOfficer
            - call: "POST /api/investors/${inv_revoked}/revoke-suitability"
              payload: { reason: "Retroactive suitability review" }
              as: ComplianceOfficer
            - call: "POST /api/subscriptions"
              payload: { offering_id: "${offering_id}", investor_id: "${inv_revoked}", requested_shares: 300 }
              as: Investor
              as_user_id: "${inv_revoked}"
              captures: { sub_after: $.data.id }
          trigger:
            - call: "POST /api/subscriptions/${sub_after}/screen"
              payload: { outcome: "VERIFIED" }
              as: ComplianceOfficer
              captures: { err_id: $.data.error_id }
          assert:
            - "the response status is 409 and err_id == ERR_INVALID_STATE"
            - "Investor.${inv_revoked}.suitability_status == REVOKED"
            - "Subscription.${sub_first}.status == REJECTED — the revocation cascade already reached the earlier subscription"
            - "Subscription.${sub_after}.status is still RECEIVED and Offering.accepted_shares == 0"

