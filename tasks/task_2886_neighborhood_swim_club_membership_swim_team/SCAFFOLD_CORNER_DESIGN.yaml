            - call: "POST /swim-club/meets"
              payload: { season_id: "${s27_id}", name: "July Invitational", start_iso: "2027-07-10T08:00:00Z", end_iso: "2027-07-10T14:00:00Z", expected_swimmers: 60, volunteer_slots_required: 4 }
