# =============================================================================
# 1.9 Scaffold Corner Design (Coverage Index for Non-Difficulty Tests)
# Breadth probe over §1.1–§1.7 claims not already covered by §1.8.
# Logical clock default is 2026-08-01T00:00:00Z unless a chain sets it.
# =============================================================================
scaffold_corner_design:
  - section: entities
    instances:
      - name: mariner_creation_defaults_and_computed_fields
        claim_type: creation
        grounds: [entities.Mariner, "endpoints.'POST /mariners'"]
        distinguishing_aspect: "POST /mariners with only required inputs returns 201 with server defaults: status APPLICANT, readiness_posture BLOCKED (STATUS_NOT_ACTIVE), training_privileges ENABLED, no_show_strike_count 0, annual_training_cap_cents 500000, version 1; a subsequent GET returns identical stored values."
        test_recipe:
          setup: ["empty DB"]
          setup_api_calls:
            - { call: "POST /mariners", payload: { full_name: "Corner Create", mariner_reference_number: "MRN-EN1-1", home_port_code: "NOLA", hire_channel: "DIRECT", rank_track: "ENGINE", rank_grade: 3, primary_endorsement_code: "ENG_QMED" }, as: FleetAdmin, captures: { m_id: $.data.id, m_status: $.data.status, m_posture: $.data.readiness_posture, m_priv: $.data.training_privileges, m_strikes: $.data.no_show_strike_count, m_cap: $.data.annual_training_cap_cents, m_ver: $.data.version } }
          trigger:
            - { call: "GET /mariners/${m_id}", as: FleetAdmin, captures: { g_status: $.data.status, g_reasons: $.data.readiness_reasons } }
          assert:
            - "m_status == APPLICANT and m_posture == BLOCKED and m_priv == ENABLED and m_strikes == 0"
            - "m_cap == 500000 (default applied when annual_training_cap_cents omitted)"
            - "m_ver == 1 and m_id is a server-minted UUID"
            - "g_status == APPLICANT and g_reasons contains STATUS_NOT_ACTIVE"
      - name: mariner_create_system_fields_input_ignored
        claim_type: system_fields
        grounds: [entities.Mariner, "endpoints.'POST /mariners'"]
        distinguishing_aspect: "Client-supplied id, version, created_at, readiness_posture in the create payload are ignored; the server mints its own values (201, version 1, posture BLOCKED)."
        test_recipe:
          setup: ["empty DB"]
          setup_api_calls: []
          trigger:
            - { call: "POST /mariners", payload: { full_name: "Ignored Fields", mariner_reference_number: "MRN-EN2-1", home_port_code: "SFO", hire_channel: "DIRECT", rank_track: "DECK", rank_grade: 5, primary_endorsement_code: "DECK_AB", id: "00000000-0000-0000-0000-0000000000aa", version: 99, readiness_posture: "CLEAR" }, as: FleetAdmin, captures: { m_id: $.data.id, m_ver: $.data.version, m_posture: $.data.readiness_posture } }
          assert:
            - "m_id != '00000000-0000-0000-0000-0000000000aa' (server-minted)"
            - "m_ver == 1 and m_posture == BLOCKED (client inputs for system/computed fields ignored)"
      - name: mariner_missing_required_field_rejected
        claim_type: required_fields
        grounds: [entities.Mariner.fields.rank_track, "errors[ERR_INVALID_REQUEST]"]
        distinguishing_aspect: "Omitting required field rank_track yields 400 ERR_INVALID_REQUEST; no mariner row is persisted."
        test_recipe:
          setup: ["empty DB"]
          setup_api_calls: []
          trigger:
            - { call: "POST /mariners", payload: { full_name: "No Track", mariner_reference_number: "MRN-EN3-1", home_port_code: "SFO", hire_channel: "DIRECT", rank_grade: 5, primary_endorsement_code: "DECK_AB" }, as: FleetAdmin, captures: { err: $.data.error_id } }
          assert:
            - "err == ERR_INVALID_REQUEST"
      - name: mariner_duplicate_reference_number_rejected
        claim_type: type_constraints
        grounds: [entities.Mariner.fields.mariner_reference_number, "errors[ERR_INVALID_REQUEST]"]
        distinguishing_aspect: "mariner_reference_number uniqueness: second create with the same reference number fails 400 while the first remains the only row."
        test_recipe:
          setup: ["M1 exists with mariner_reference_number MRN-EN4-DUP"]
          setup_api_calls:
            - { call: "POST /mariners", payload: { full_name: "Dup One", mariner_reference_number: "MRN-EN4-DUP", home_port_code: "SFO", hire_channel: "DIRECT", rank_track: "DECK", rank_grade: 5, primary_endorsement_code: "DECK_AB" }, as: FleetAdmin, captures: { m_id: $.data.id } }
          trigger:
            - { call: "POST /mariners", payload: { full_name: "Dup Two", mariner_reference_number: "MRN-EN4-DUP", home_port_code: "SEA", hire_channel: "UNION_HALL", rank_track: "ENGINE", rank_grade: 2, primary_endorsement_code: "ENG_QMED" }, as: FleetAdmin, captures: { err: $.data.error_id } }
            - { call: "GET /mariners", as: FleetAdmin, captures: { total: $.meta } }
          assert:
            - "err == ERR_INVALID_REQUEST"
            - "only one mariner with reference MRN-EN4-DUP exists (list total_count == 1 when filtered)"
      - name: mariner_get_not_found_returns_404
        claim_type: not_found
        grounds: ["errors[ERR_MARINER_NOT_FOUND]", "endpoints.'GET /mariners/{id}'"]
        distinguishing_aspect: "GET with a well-formed but non-existent UUID returns 404 ERR_MARINER_NOT_FOUND."
        test_recipe:
          setup: ["empty DB"]
          setup_api_calls: []
          trigger:
            - { call: "GET /mariners/11111111-2222-3333-4444-555555555555", as: FleetAdmin, captures: { err: $.data.error_id } }
          assert:
            - "err == ERR_MARINER_NOT_FOUND"
      - name: vessel_invalid_enum_rejected
        claim_type: type_constraints
        grounds: [entities.Vessel.fields.vessel_class, "errors[ERR_INVALID_REQUEST]"]
        distinguishing_aspect: "vessel_class outside {TANKER, CONTAINER, BULK, PASSENGER, OSV} is rejected 400 at create."
        test_recipe:
          setup: ["empty DB"]
          setup_api_calls: []
          trigger:
            - { call: "POST /vessels", payload: { vessel_name: "SS Hover", imo_number: "IMO-EN6", vessel_class: "HOVERCRAFT", flag_state: "US" }, as: FleetAdmin, captures: { err: $.data.error_id } }
          assert:
            - "err == ERR_INVALID_REQUEST"
      - name: credential_create_under_missing_mariner_not_found
        claim_type: parent_relationships
        grounds: [entities.Credential.fields.mariner_id, "errors[ERR_MARINER_NOT_FOUND]"]
        distinguishing_aspect: "Nested create under a non-existent parent id fails 404 with the PARENT's error (left-to-right path validation)."
        test_recipe:
          setup: ["empty DB"]
          setup_api_calls: []
          trigger:
            - { call: "POST /mariners/11111111-2222-3333-4444-555555555555/credentials", payload: { credential_type: "MMC_BASE", endorsement_code: "DECK_AB", issue_date: "2026-01-01T00:00:00Z", expiry_date: "2030-01-01T00:00:00Z" }, as: CredentialingOfficer, captures: { err: $.data.error_id } }
          assert:
            - "err == ERR_MARINER_NOT_FOUND"
      - name: course_listing_pagination_envelope
        claim_type: listing
        grounds: [response_envelope, "endpoints.'GET /training-courses'"]
        distinguishing_aspect: "List endpoints honor limit/offset with envelope fields total_count and has_more: 2 courses, limit 1 -> page 1 has 1 item, total_count 2, has_more true; offset 1 -> the second item, has_more false."
        test_recipe:
          setup: ["two courses exist (EN8-A, EN8-B)"]
          setup_api_calls:
            - { call: "POST /training-courses", payload: { course_code: "EN8-A", title: "Course A", provider: "MaritimeEd", start_date: "2026-09-01T00:00:00Z", end_date: "2026-09-03T00:00:00Z", seat_capacity: 5, cost_cents: 50000 }, as: FleetAdmin, captures: { ca_id: $.data.id } }
            - { call: "POST /training-courses", payload: { course_code: "EN8-B", title: "Course B", provider: "MaritimeEd", start_date: "2026-09-10T00:00:00Z", end_date: "2026-09-12T00:00:00Z", seat_capacity: 5, cost_cents: 60000 }, as: FleetAdmin, captures: { cb_id: $.data.id } }
          trigger:
            - { call: "GET /training-courses?limit=1&offset=0", as: FleetAdmin, captures: { p1: $.data, p1_total: $.meta } }
            - { call: "GET /training-courses?limit=1&offset=1", as: FleetAdmin, captures: { p2: $.data } }
          assert:
            - "page1 data length == 1 and meta.total_count == 2 and meta.has_more == true"
            - "page2 data length == 1 and has_more == false; the two pages contain ${ca_id} and ${cb_id} in creation order"
            - "response envelope carries meta.api_request_id and response_type == array"
      - name: assignment_server_fields_input_ignored
        claim_type: computed_fields
        grounds: [entities.Assignment.fields.vessel_id, entities.Assignment.fields.travel_status]
        distinguishing_aspect: "Client-injected travel_status READY, repatriation_status DUE, and a bogus vessel_id are ignored on create: travel_status starts PENDING, repatriation NOT_DUE, vessel_id denormalized from the slot's vessel."
        test_recipe:
          setup: ["activated mariner; ACTIVE vessel with AB slot; rotation plan"]
          setup_api_calls:
            - { call: "POST /mariners", payload: { full_name: "Ignore Asg", mariner_reference_number: "MRN-EN9-1", home_port_code: "SFO", hire_channel: "DIRECT", rank_track: "DECK", rank_grade: 5, primary_endorsement_code: "DECK_AB" }, as: FleetAdmin, captures: { m_id: $.data.id } }
            - { call: "POST /mariners/${m_id}/medical-certificates", payload: { cert_type: "USCG_MEDICAL", issue_date: "2026-01-01T00:00:00Z", expiry_date: "2027-06-01T00:00:00Z" }, as: CredentialingOfficer }
            - { call: "POST /mariners/${m_id}/credentials", payload: { credential_type: "MMC_BASE", endorsement_code: "DECK_AB", issue_date: "2026-01-01T00:00:00Z", expiry_date: "2030-01-01T00:00:00Z" }, as: CredentialingOfficer }
            - { call: "POST /mariners/${m_id}/drug-tests", payload: { test_type: "PRE_EMPLOYMENT", scheduled_date: "2026-01-02T00:00:00Z" }, as: CredentialingOfficer, captures: { dt_id: $.data.id } }
            - { call: "POST /mariners/${m_id}/drug-tests/${dt_id}/record-result", payload: { result: "NEGATIVE", collected_date: "2026-01-02T00:00:00Z" }, as: CredentialingOfficer }
            - { call: "POST /mariners/${m_id}/activate", payload: {}, as: FleetAdmin }
            - { call: "POST /vessels", payload: { vessel_name: "SS Ignore", imo_number: "IMO-EN9", vessel_class: "BULK", flag_state: "US" }, as: FleetAdmin, captures: { v_id: $.data.id } }
            - { call: "POST /vessels/${v_id}/manning-slots", payload: { position_code: "AB", rank_track: "DECK", min_rank_grade: 2, required_endorsement_code: "DECK_AB", is_critical_position: false, standard_tour_days: 90 }, as: PortCaptain, captures: { s_id: $.data.id } }
            - { call: "POST /vessels/${v_id}/activate", payload: {}, as: FleetAdmin, captures: { v_ver: $.data.version } }
            - { call: "POST /vessels/${v_id}/rotation-plans", payload: { effective_from: "2026-08-01T00:00:00Z", effective_to: "2027-08-01T00:00:00Z", standard_tour_days: 90, max_handover_overlap_days: 3, expected_vessel_version: "${v_ver}" }, as: CrewingManager }
          trigger:
            - { call: "POST /assignments", payload: { mariner_id: "${m_id}", manning_slot_id: "${s_id}", assignment_channel: "DIRECT_HIRE", sign_on_date: "2026-08-10T00:00:00Z", planned_relief_date: "2026-11-10T00:00:00Z", travel_status: "READY", repatriation_status: "DUE", vessel_id: "11111111-2222-3333-4444-555555555555" }, as: CrewingManager, captures: { a_vessel: $.data.vessel_id, a_travel: $.data.travel_status, a_repat: $.data.repatriation_status, a_status: $.data.assignment_status } }
          assert:
            - "a_status == PROPOSED and a_travel == PENDING and a_repat == NOT_DUE (injected lifecycle fields ignored)"
            - "a_vessel == ${v_id} (denormalized from slot, injected bogus vessel_id ignored)"

  - section: state_machines
    instances:
      - name: repatriation_auto_create_covered
        claim_type: side_effect_execution
        grounds: [state_machines.Assignment.ONBOARD_to_RELIEVED, entities.TravelBooking]
        excluded_because:
          difficulty_instance: "non_linear_state_machine / assignment_parallel_travel_dimensions"
          rationale: "The system-created QUOTED REPATRIATION booking is asserted (direction, status) in the named §1.8 instance."
      - name: sea_service_initial_state_draft
        claim_type: initial_state
        grounds: [state_machines.SeaServiceRecord, entities.SeaServiceRecord.fields.record_status]
        distinguishing_aspect: "A new SeaServiceRecord starts DRAFT with provisional_days computed (inclusive calendar days) and verified_days null."
        test_recipe:
          setup: ["mariner and vessel exist"]
          setup_api_calls:
            - { call: "POST /mariners", payload: { full_name: "Draft One", mariner_reference_number: "MRN-SM1-1", home_port_code: "SFO", hire_channel: "DIRECT", rank_track: "DECK", rank_grade: 5, primary_endorsement_code: "DECK_AB" }, as: FleetAdmin, captures: { m_id: $.data.id } }
            - { call: "POST /vessels", payload: { vessel_name: "SS Draft", imo_number: "IMO-SM1", vessel_class: "BULK", flag_state: "US" }, as: FleetAdmin, captures: { v_id: $.data.id } }
          trigger:
            - { call: "POST /mariners/${m_id}/sea-service-records", payload: { vessel_id: "${v_id}", position_code: "AB", rank_track: "DECK", rank_grade: 5, service_region: "OCEAN", watch_schedule: "TWELVE_HOUR", start_date: "2025-03-01T00:00:00Z", end_date: "2025-03-11T00:00:00Z" }, as: Mariner, as_user_id: "${m_id}", captures: { r_status: $.data.record_status, r_prov: $.data.provisional_days, r_ver: $.data.verified_days } }
          assert:
            - "r_status == DRAFT and r_prov == 11.0 (Mar 1..Mar 11 inclusive) and r_ver == null"
      - name: mariner_activation_gates_missing_rejected
        claim_type: precondition_enforcement
        grounds: [state_machines.Mariner.APPLICANT_to_ACTIVE, "errors[ERR_MARINER_ACTIVATION_REQUIREMENTS_MISSING]"]
        distinguishing_aspect: "Activate with zero of three gates satisfied fails; after adding only medical and credential (no drug test) it still fails; the error is ERR_MARINER_ACTIVATION_REQUIREMENTS_MISSING both times."
        test_recipe:
          setup: ["mariner M exists (APPLICANT), then medical+credential added but no drug test"]
          setup_api_calls:
            - { call: "POST /mariners", payload: { full_name: "Gate One", mariner_reference_number: "MRN-SM2-1", home_port_code: "SFO", hire_channel: "DIRECT", rank_track: "DECK", rank_grade: 5, primary_endorsement_code: "DECK_AB" }, as: FleetAdmin, captures: { m_id: $.data.id } }
            - { call: "POST /mariners/${m_id}/medical-certificates", payload: { cert_type: "USCG_MEDICAL", issue_date: "2026-01-01T00:00:00Z", expiry_date: "2027-06-01T00:00:00Z" }, as: CredentialingOfficer }
            - { call: "POST /mariners/${m_id}/credentials", payload: { credential_type: "MMC_BASE", endorsement_code: "DECK_AB", issue_date: "2026-01-01T00:00:00Z", expiry_date: "2030-01-01T00:00:00Z" }, as: CredentialingOfficer }
          trigger:
            - { call: "POST /mariners/${m_id}/activate", payload: {}, as: FleetAdmin, captures: { err: $.data.error_id } }
          assert:
            - "err == ERR_MARINER_ACTIVATION_REQUIREMENTS_MISSING (drug-test gate unmet even with medical+credential present)"
      - name: vessel_activate_requires_manning_slot_rejected
        claim_type: precondition_enforcement
        grounds: [state_machines.Vessel.REGISTERED_to_ACTIVE, "errors[ERR_NO_MANNING_SLOTS]"]
        distinguishing_aspect: "Vessel activation with zero ACTIVE manning slots fails ERR_NO_MANNING_SLOTS; after defining one slot, activation succeeds."
        test_recipe:
          setup: ["vessel REGISTERED, no slots"]
          setup_api_calls:
            - { call: "POST /vessels", payload: { vessel_name: "SS Empty", imo_number: "IMO-SM3", vessel_class: "OSV", flag_state: "US" }, as: FleetAdmin, captures: { v_id: $.data.id } }
          trigger:
            - { call: "POST /vessels/${v_id}/activate", payload: {}, as: FleetAdmin, captures: { err: $.data.error_id } }
            - { call: "POST /vessels/${v_id}/manning-slots", payload: { position_code: "MASTER", rank_track: "DECK", min_rank_grade: 8, required_endorsement_code: "MASTER_UNL", is_critical_position: true, standard_tour_days: 120 }, as: PortCaptain }
            - { call: "POST /vessels/${v_id}/activate", payload: {}, as: FleetAdmin, captures: { v_status: $.data.status } }
          assert:
            - "err == ERR_NO_MANNING_SLOTS"
            - "v_status == ACTIVE after the slot exists"
      - name: drug_test_double_result_rejected
        claim_type: idempotency
        grounds: [state_machines.DrugTestRecord.PENDING_to_COMPLETED, "errors[ERR_DRUG_TEST_NOT_PENDING]"]
        distinguishing_aspect: "record-result is not repeatable: the second call on a COMPLETED test fails ERR_DRUG_TEST_NOT_PENDING; the recorded result is unchanged."
        test_recipe:
          setup: ["mariner with one PENDING drug test, already recorded NEGATIVE"]
          setup_api_calls:
            - { call: "POST /mariners", payload: { full_name: "Drug Twice", mariner_reference_number: "MRN-SM4-1", home_port_code: "SFO", hire_channel: "DIRECT", rank_track: "DECK", rank_grade: 5, primary_endorsement_code: "DECK_AB" }, as: FleetAdmin, captures: { m_id: $.data.id } }
            - { call: "POST /mariners/${m_id}/drug-tests", payload: { test_type: "RANDOM", scheduled_date: "2026-05-01T00:00:00Z" }, as: CredentialingOfficer, captures: { dt_id: $.data.id } }
            - { call: "POST /mariners/${m_id}/drug-tests/${dt_id}/record-result", payload: { result: "NEGATIVE", collected_date: "2026-05-01T00:00:00Z" }, as: CredentialingOfficer, captures: { dt_status: $.data.status } }
          trigger:
            - { call: "POST /mariners/${m_id}/drug-tests/${dt_id}/record-result", payload: { result: "POSITIVE", collected_date: "2026-05-02T00:00:00Z" }, as: CredentialingOfficer, captures: { err: $.data.error_id } }
            - { call: "GET /mariners/${m_id}/drug-tests", as: CredentialingOfficer, captures: { dt_result: "$.data[0].result" } }
          assert:
            - "dt_status == COMPLETED after first record-result"
            - "err == ERR_DRUG_TEST_NOT_PENDING (terminal lockdown on COMPLETED)"
            - "dt_result == NEGATIVE (second call had no effect)"
      - name: assignment_cancel_from_cancelled_lockdown
        claim_type: terminal_lockdown
        grounds: [state_machines.Assignment, "errors[ERR_INVALID_STATE]"]
        distinguishing_aspect: "CANCELLED is terminal: a second cancel on the same assignment returns ERR_INVALID_STATE and mutates nothing."
        test_recipe:
          setup: ["activated mariner; vessel/slot/plan; assignment PROPOSED then CANCELLED"]
          setup_api_calls:
            - { call: "POST /mariners", payload: { full_name: "Lock One", mariner_reference_number: "MRN-SM5-1", home_port_code: "SFO", hire_channel: "DIRECT", rank_track: "DECK", rank_grade: 5, primary_endorsement_code: "DECK_AB" }, as: FleetAdmin, captures: { m_id: $.data.id } }
            - { call: "POST /mariners/${m_id}/medical-certificates", payload: { cert_type: "USCG_MEDICAL", issue_date: "2026-01-01T00:00:00Z", expiry_date: "2027-06-01T00:00:00Z" }, as: CredentialingOfficer }
            - { call: "POST /mariners/${m_id}/credentials", payload: { credential_type: "MMC_BASE", endorsement_code: "DECK_AB", issue_date: "2026-01-01T00:00:00Z", expiry_date: "2030-01-01T00:00:00Z" }, as: CredentialingOfficer }
            - { call: "POST /mariners/${m_id}/drug-tests", payload: { test_type: "PRE_EMPLOYMENT", scheduled_date: "2026-01-02T00:00:00Z" }, as: CredentialingOfficer, captures: { dt_id: $.data.id } }
            - { call: "POST /mariners/${m_id}/drug-tests/${dt_id}/record-result", payload: { result: "NEGATIVE", collected_date: "2026-01-02T00:00:00Z" }, as: CredentialingOfficer }
            - { call: "POST /mariners/${m_id}/activate", payload: {}, as: FleetAdmin }
            - { call: "POST /vessels", payload: { vessel_name: "SS Lock", imo_number: "IMO-SM5", vessel_class: "CONTAINER", flag_state: "US" }, as: FleetAdmin, captures: { v_id: $.data.id } }
            - { call: "POST /vessels/${v_id}/manning-slots", payload: { position_code: "AB", rank_track: "DECK", min_rank_grade: 2, required_endorsement_code: "DECK_AB", is_critical_position: false, standard_tour_days: 90 }, as: PortCaptain, captures: { s_id: $.data.id } }
            - { call: "POST /vessels/${v_id}/activate", payload: {}, as: FleetAdmin, captures: { v_ver: $.data.version } }
            - { call: "POST /vessels/${v_id}/rotation-plans", payload: { effective_from: "2026-08-01T00:00:00Z", effective_to: "2027-08-01T00:00:00Z", standard_tour_days: 90, max_handover_overlap_days: 3, expected_vessel_version: "${v_ver}" }, as: CrewingManager }
            - { call: "POST /assignments", payload: { mariner_id: "${m_id}", manning_slot_id: "${s_id}", assignment_channel: "DIRECT_HIRE", sign_on_date: "2026-08-10T00:00:00Z", planned_relief_date: "2026-11-10T00:00:00Z", local_join: true }, as: CrewingManager, captures: { a_id: $.data.id } }
            - { call: "POST /assignments/${a_id}/cancel", payload: {}, as: CrewingManager, captures: { a_status: $.data.assignment_status } }
          trigger:
            - { call: "POST /assignments/${a_id}/cancel", payload: {}, as: CrewingManager, captures: { err: $.data.error_id } }
          assert:
            - "a_status == CANCELLED after first cancel"
            - "err == ERR_INVALID_STATE (no exit from terminal CANCELLED)"
      - name: enrollment_privileges_suspended_rejected
        claim_type: precondition_enforcement
        grounds: [entities.Mariner.fields.training_privileges, "errors[ERR_TRAINING_PRIVILEGES_SUSPENDED]"]
        distinguishing_aspect: "After two NO_SHOW strikes suspend privileges, any NEW enrollment request by that mariner fails ERR_TRAINING_PRIVILEGES_SUSPENDED even on a different, open course."
        test_recipe:
          setup: ["M activated; two NO_SHOW outcomes recorded on courses P1 and P2 (strikes == 2, privileges SUSPENDED); course P3 SCHEDULED"]
          setup_api_calls:
            - { call: "POST /mariners", payload: { full_name: "Strike Two", mariner_reference_number: "MRN-SM6-1", home_port_code: "SFO", hire_channel: "DIRECT", rank_track: "DECK", rank_grade: 5, primary_endorsement_code: "DECK_AB" }, as: FleetAdmin, captures: { m_id: $.data.id } }
            - { call: "POST /mariners/${m_id}/medical-certificates", payload: { cert_type: "USCG_MEDICAL", issue_date: "2026-01-01T00:00:00Z", expiry_date: "2027-06-01T00:00:00Z" }, as: CredentialingOfficer }
            - { call: "POST /mariners/${m_id}/credentials", payload: { credential_type: "MMC_BASE", endorsement_code: "DECK_AB", issue_date: "2026-01-01T00:00:00Z", expiry_date: "2030-01-01T00:00:00Z" }, as: CredentialingOfficer }
            - { call: "POST /mariners/${m_id}/drug-tests", payload: { test_type: "PRE_EMPLOYMENT", scheduled_date: "2026-01-02T00:00:00Z" }, as: CredentialingOfficer, captures: { dt_id: $.data.id } }
            - { call: "POST /mariners/${m_id}/drug-tests/${dt_id}/record-result", payload: { result: "NEGATIVE", collected_date: "2026-01-02T00:00:00Z" }, as: CredentialingOfficer }
            - { call: "POST /mariners/${m_id}/activate", payload: {}, as: FleetAdmin }
