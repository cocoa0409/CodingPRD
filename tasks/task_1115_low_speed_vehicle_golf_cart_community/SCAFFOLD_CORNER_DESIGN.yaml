            - { call: "POST /api/charging-stations", payload: { community_id: "${comm_id}", name: "S-ELG", slot_count: 1, rate_cents_per_min: 10 }, as: CommunityAdmin, captures: { st_id: $.data.id } }
            - { call: "POST /api/fleet-vehicles", payload: { community_id: "${comm_id}", station_id: "${st_id}", label: "F-ELG" }, as: CommunityAdmin, captures: { fv_id: $.data.id } }
