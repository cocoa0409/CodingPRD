            - "LegalReview.${review_id}.status == SUBMITTED"

  # ===========================================================================
  # Rule 2: combinatorial_formula — two formulas with combinatorial complexity
  # in DIFFERENT modes {(a) >=3-input non-linear, (b) nested rounding, (c)
  # circular-looking dependency}.
  # ===========================================================================
  - rule_id: combinatorial_formula
    instances:
      - name: legal_risk_score_three_input_nonlinear_mode_a
        grounds:
          - calculations.legal_risk_score
        distinguishing_aspect: |
          Mode (a) — >=3 inputs with non-linear interaction. Six factor
          weights feed a formula with a conditional multiplier
          (DOCUMENTATION_GAP doubles the sum) and a conditional compound
          bonus (+10 if base >= 50 AND WHISTLEBLOWER_HISTORY present); the
          result is floor-clamped at 0 and ceiling-clamped at 100. Nested
          conditional branches on entity state make the formula
          combinatorial rather than a flat weighted sum.
        test_recipe:
          setup:
            - "Org unit with PIP P1 ACTIVE and a claimed LegalReview LR1"
            - "Clock at 2026-08-11T10:00:00Z"
          setup_api_calls:
            - call: "POST /hr-org-units"
              payload: { name: "OU1" }
              as: HRSystemAdmin
              captures: { ou_id: $.data.id }
            - call: "POST /hr-org-units/${ou_id}/employees"
              payload: { full_name: "Boss", email: "m@x.com", job_family: "ENGINEERING", job_level: 6 }
              as: HRSystemAdmin
              captures: { mgr_id: $.data.id }
            - call: "POST /hr-org-units/${ou_id}/employees"
              payload: { full_name: "HRBP", email: "h@x.com", job_family: "OPERATIONS", job_level: 7 }
              as: HRSystemAdmin
              captures: { hrbp_id: $.data.id }
            - call: "POST /hr-org-units/${ou_id}/employees"
              payload: { full_name: "Counsel", email: "l@x.com", job_family: "OPERATIONS", job_level: 8 }
              as: HRSystemAdmin
              captures: { counsel_id: $.data.id }
            - call: "POST /hr-org-units/${ou_id}/employees"
              payload: { full_name: "E1", email: "e@x.com", job_family: "ENGINEERING", job_level: 5, manager_id: "${mgr_id}" }
              as: HRSystemAdmin
              captures: { emp_id: $.data.id }
            - call: "POST /hr-org-units/${ou_id}/employees/${emp_id}/coaching-log-entries"
              payload: { occurred_at: "2026-07-01T10:00:00Z", category: "CONDUCT", severity: "DOCUMENTED", narrative: "Coaching on professional conduct following documented altercation in sprint review meeting." }
              as: Manager
              as_user_id: "${mgr_id}"
              captures: { cle1: $.data.id }
            - call: "POST /hr-org-units/${ou_id}/employees/${emp_id}/coaching-log-entries"
              payload: { occurred_at: "2026-07-08T10:00:00Z", category: "CONDUCT", severity: "ESCALATED", narrative: "Second conduct incident; escalated with written warning and HRBP looped in." }
              as: Manager
              as_user_id: "${mgr_id}"
              captures: { cle2: $.data.id }
            - call: "POST /hr-org-units/${ou_id}/employees/${emp_id}/performance-concerns"
              payload: { category: "CONDUCT", summary: "Repeated conduct incidents despite written warning", coaching_log_entry_ids: ["${cle1}", "${cle2}"] }
              as: Manager
              as_user_id: "${mgr_id}"
              captures: { concern_id: $.data.id }
            - call: "POST /hr-org-units/${ou_id}/employees/${emp_id}/performance-concerns/${concern_id}/submit"
              payload: {}
              as: Manager
              as_user_id: "${mgr_id}"
            - call: "POST /hr-org-units/${ou_id}/employees/${emp_id}/performance-concerns/${concern_id}/accept"
              payload: {}
              as: HRBusinessPartner
              as_user_id: "${hrbp_id}"
            - call: "POST /hr-org-units/${ou_id}/pip-templates"
              payload:
                name: "T"
                category: "CONDUCT"
                goal_blueprints:
                  - { metric_key: "incidents", target_value: 0, unit: "count", weight: 100 }
                duration_days: 60
                check_in_cadence_days: 15
              as: HRBusinessPartner
              as_user_id: "${hrbp_id}"
              captures: { tpl_id: $.data.id }
            - call: "POST /hr-org-units/${ou_id}/pip-templates/${tpl_id}/publish"
              payload: {}
              as: HRBusinessPartner
              as_user_id: "${hrbp_id}"
            - call: "POST /hr-org-units/${ou_id}/employees/${emp_id}/pips"
              payload: { concern_id: "${concern_id}", template_id: "${tpl_id}", start_date: "2026-08-01T00:00:00Z" }
              as: HRBusinessPartner
              as_user_id: "${hrbp_id}"
              captures: { pip_id: $.data.id, pip_v_create: $.data.version }
            - call: "POST /hr-org-units/${ou_id}/employees/${emp_id}/pips/${pip_id}/issue"
              payload: { expected_pip_version: "${pip_v_create}" }
              as: HRBusinessPartner
              as_user_id: "${hrbp_id}"
            - call: "POST /hr-org-units/${ou_id}/employees/${emp_id}/pips/${pip_id}/check-ins"
