          One fixture drives at least one exclusive operation of every declared role and the shared
          reads that all five may perform, so the permission matrix is proven positively rather
          than only by rejection. The ComplianceAdmin-only void at the end also demonstrates that a
          role outside the plan workflow can compensate a ledger it never wrote.
