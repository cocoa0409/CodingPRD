            - "The first post is accepted with ${bs_1} == ACCRUING, ${paid_1} == 5590 and ${last_1} == 2026-08; ${pos_1} == 1 and ${rem_1} == 1"
            - "${exp_n} == 0: advancing a full month expires nothing, because recert_due_date is 2027-08-01"
            - "The second post is accepted with ${bs_2} == CAP_REACHED, ${paid_2} == 11180 and ${pmc_2} == 2: effective_position 2 equals cap_month_limit 2, which satisfies the inclusive priority-95 comparison and is the sole entry into CAP_REACHED"
            - "${pos_2} == 2 and ${rem_2} == 0: months_remaining floors at zero rather than going negative"
            - "Both posts carry the same amount_cents 5590 because the PLACED set did not change between them"

      - name: route_stop_window_conflict_corner
        claim_type: violation_to_error
        grounds:
          - validations[priority=74]
        excluded_because:
          difficulty_instance: route_stop_half_open_window_with_trailing_buffer
          rationale: |
            The buffered half-open conflict rule, including the accepted adjacency case where a new
            stop starts exactly on an existing stop's buffered end instant, is already driven end to
            end by the §1.8 resource_temporal_overlap instance. A corner instance here would replay
            the same three windows against the same 30-minute buffer.

      - name: travel_interval_conflict_corner
        claim_type: violation_to_error
        grounds:
          - validations[priority=76]
        excluded_because:
          difficulty_instance: travel_authorization_closed_interval_touching_endpoints_conflict
          rationale: |
            The closed-interval conflict rule and its deliberate contrast with the half-open stop rule
            (touching endpoints conflict here, adjacency is accepted there) is the entire subject of
            the §1.8 instance, which already covers REQUESTED, APPROVED and DENIED predecessors.

      - name: documentation_score_threshold_corner
        claim_type: violation_to_error
        grounds:
          - validations[priority=50]
        excluded_because:
          difficulty_instance: documentation_score_exactly_85_passes_submit_84_38_fails
          rationale: |
            The pass threshold is exercised on both sides of the boundary by the §1.8
            boundary_precision_check instance, including the single-final-rounding subtlety that makes
            84.38 fail. The corner calculations section already covers the component arithmetic, so a
            third pass over the same threshold would add nothing.

      - name: portable_role_occupancy_corner
        claim_type: violation_to_error
        grounds:
          - validations[priority=54]
          - validations[priority=87]
        excluded_because:
          difficulty_instance: portable_not_indicated_beats_role_occupied
          rationale: |
            Both the portable-indication rule and the role-occupancy rule are triggered, and their
            relative order adjudicated, inside the §1.8 priority_pair_validation_conflict instance for
            this pair.

      - name: billing_suspension_precedence_corner
        claim_type: violation_to_error
        grounds:
          - validations[priority=35]
        excluded_because:
          difficulty_instance: suspended_billing_beats_cap_exhausted
          rationale: |
            ERR_CONTRACT_BILLING_SUSPENDED masking the cap error on a SUSPENDED or CAP_REACHED
            contract is precisely the §1.8 priority-pair instance; the corner instance
            cap_reversal_and_exhaustion_rules_reject deliberately routes around that mask through the
            transfer request/cancel pair instead of duplicating it.

      - name: compliance_hold_blocks_travel_corner
        claim_type: violation_to_error
        grounds:
          - validations[priority=53]
        excluded_because:
          difficulty_instance: travel_approval_blocked_when_patient_on_compliance_hold
          rationale: |
            The compliance-hold gate is driven on both the travel-authorisation request and the
            approval action by the §1.8 cross_entity_state_dependency instance, which also builds the
            risk score that raises the hold in the first place.

  # ===========================================================================
  - section: endpoints
    instances:

      - name: restricted_computed_reads_agree_with_stored_rows
        claim_type: computed_read
        grounds:
          - endpoints[GET /home-oxygen/patients/{patient_id}/risk-assessment]
          - endpoints[GET /home-oxygen/rental-contracts/{contract_id}/cap-summary]
          - endpoints[GET /home-oxygen/delivery-routes/{route_id}/manifest]
        distinguishing_aspect: |
          All three reads expose intermediate values that no write response ever returns: the
          risk read publishes the losing variant alongside the persisted one, the cap read publishes
          both counting bases plus the candidate month for a month that has not been posted, and the
          manifest publishes the route's live PLANNED count — which is zero on a route whose only stop
          has been completed, because the field counts PLANNED stops rather than accumulating them.
        test_recipe:
          setup:
            - "One branch with refill_capacity_per_day 4 and one stationary concentrator."
            - "A HOMEBOUND patient with a GROUP_I study, an ACTIVE certificate at 3.0 L/min, and a contract driven to IN_SERVICE with a teachback score of 4."
            - "No billing month is posted, so the cap read has to answer about a candidate month."
          setup_api_calls:
            - call: "POST /home-oxygen/branches"
              payload: { name: "Tampa Bay", state_code: "FL", competitive_bid_area: true, liquid_oxygen_certified: false, refill_capacity_per_day: 4, tank_exchange_buffer_minutes: 30 }
              as: BranchManager
              captures: { br_id: $.data.id }
            - call: "POST /home-oxygen/equipment-units"
              payload: { branch_id: "${br_id}", serial_number: "SC-1001", model_code: "CONC-5L", equipment_class: "STATIONARY_CONCENTRATOR", max_continuous_lpm: 5.0, max_pulse_setting: 0, pm_interval_days: 365, next_pm_due_date: "2027-06-01" }
              as: BranchManager
              captures: { u_stat: $.data.id }
            - call: "POST /home-oxygen/patients"
              payload: { mrn: "MRN-0730", full_name: "Zerlina Okonkwo", branch_id: "${br_id}", payer_type: "MEDICARE_COMPETITIVE_BID", mobility_profile: "HOMEBOUND", altitude_feet: 500 }
              as: IntakeCoordinator
              captures: { p_id: $.data.id, p_ver: $.data.version }
            - call: "POST /home-oxygen/qualifying-tests"
              payload: { patient_id: "${p_id}", test_type: "RESTING_ROOM_AIR", spo2_percent: 87, tested_at: "2026-07-25T14:00:00Z", ordering_physician_npi: "1234567893" }
              as: IntakeCoordinator
              captures: { qt_id: $.data.id }
            - call: "POST /home-oxygen/cmns"
              payload: { patient_id: "${p_id}", qualifying_test_id: "${qt_id}", form_type: "INITIAL", prescribed_lpm: 3.0, hours_per_day: 24, portable_prescribed: false, length_of_need_months: 99, narrative_element_count: 3, expected_patient_version: "${p_ver}" }
              as: IntakeCoordinator
              captures: { cmn_id: $.data.id }
            - call: "POST /home-oxygen/cmns/${cmn_id}/submit"
              payload: {}
              as: IntakeCoordinator
              as_user_id: "u-intake-1"
            - call: "POST /home-oxygen/cmns/${cmn_id}/sign"
              payload: {}
              as: Physician
              as_user_id: "u-phys-1"
            - call: "POST /home-oxygen/cmns/${cmn_id}/approve"
              payload: {}
              as: ComplianceAuditor
              as_user_id: "u-audit-1"
            - call: "POST /home-oxygen/rental-contracts"
              payload: { patient_id: "${p_id}", cmn_id: "${cmn_id}", pricing_basis: "COMPETITIVE_BID_SINGLE_PAYMENT", cap_month_limit: 36 }
              as: BillingSpecialist
              captures: { c_id: $.data.id }
            - call: "POST /home-oxygen/rental-contracts/${c_id}/equipment-assignments"
              payload: { role: "PRIMARY_STATIONARY" }
              as: RespiratoryTherapist
            - call: "POST /home-oxygen/delivery-routes"
              payload: { branch_id: "${br_id}", service_date: "2026-08-01", driver_user_id: "u-drv-1", shift_start_utc: "2026-08-01T12:00:00Z", shift_end_utc: "2026-08-01T22:00:00Z" }
              as: BranchManager
              captures: { r1: $.data.id }
            - call: "POST /home-oxygen/route-stops"
              payload: { route_id: "${r1}", contract_id: "${c_id}", stop_type: "SETUP_DELIVERY", window_start_utc: "2026-08-01T13:00:00Z", window_end_utc: "2026-08-01T14:00:00Z", service_minutes: 60, cylinders_requested: 0 }
              as: BranchManager
              captures: { s_setup: $.data.id }
            - call: "POST /home-oxygen/delivery-routes/${r1}/lock"
              payload: {}
              as: BranchManager
            - call: "POST /home-oxygen/delivery-routes/${r1}/dispatch"
              payload: {}
              as: BranchManager
            - call: "POST /home-oxygen/route-stops/${s_setup}/complete-setup"
              payload: { smoking_in_home: false, electrical_pass: true, patient_teachback_score: 4, education_topics_covered: ["EQUIPMENT_OPERATION", "FIRE_SAFETY", "EMERGENCY_CONTACT"] }
              as: RespiratoryTherapist
              as_user_id: "u-rt-1"
          trigger:
            - call: "GET /home-oxygen/patients/${p_id}/risk-assessment"
              payload: {}
              as: RespiratoryTherapist
              captures: { f_smoke: $.data.factor_smoking, f_elec: $.data.factor_electrical, f_teach: $.data.factor_teachback, f_flow: $.data.factor_flow, f_inc: $.data.factor_incident, s_init: $.data.initial_assessment_score, s_ong: $.data.ongoing_surveillance_score, s_persist: $.data.persisted_score, v_persist: $.data.persisted_variant, hold: $.data.compliance_hold }
            - call: "GET /home-oxygen/patients/${p_id}"
              payload: {}
              as: RespiratoryTherapist
              captures: { row_score: $.data.oxygen_safety_risk_score, row_variant: $.data.risk_variant_applied, row_hold: $.data.compliance_hold }
            - call: "GET /home-oxygen/rental-contracts/${c_id}/cap-summary"
              payload: {}
              as: BillingSpecialist
              captures: { cs_month: $.data.candidate_service_month, cs_svc: $.data.service_month_basis_position, cs_paid: $.data.paid_month_basis_position, cs_variant: $.data.variant_applied, cs_eff: $.data.effective_position, cs_rem: $.data.months_remaining, cs_allow: $.data.monthly_allowable_cents, cs_life: $.data.lifetime_paid_cents, cs_count: $.data.posted_month_count }
            - call: "GET /home-oxygen/delivery-routes/${r1}/manifest"
              payload: {}
              as: BranchManager
              captures: { m_status: $.data.status, m_planned: $.data.planned_stop_count, m_done: $.data.completed_stop_count, m_missed: $.data.missed_stop_count, m_cancelled: $.data.cancelled_stop_count, m_slots: $.data.refill_slots_used, m_cap: $.data.refill_capacity_per_day, m_liters: $.data.total_o2_liters_committed }
          assert:
            - "Factors are ${f_smoke} == 0, ${f_elec} == 0, ${f_teach} == 20 (teachback 4 gives (5-4)*20), ${f_flow} == 20 (3.0 L/min falls in the <= 4.0 band) and ${f_inc} == 0"
            - "${s_init} == 9.00 (0.15*20 + 0.30*20) while ${s_ong} == 25.00 (max factor 20 plus one 5-point escalation step for the second non-zero factor): the read publishes both variants even though only one is persisted"
            - "${s_persist} == 9.00 with ${v_persist} == INITIAL_ASSESSMENT and ${hold} == false, and these equal ${row_score}, ${row_variant} and ${row_hold} on the Patient row itself"
            - "${cs_month} == 2026-08 with ${cs_svc} == 1, ${cs_paid} == 1, ${cs_variant} == SERVICE_MONTH_BASIS, ${cs_eff} == 1, ${cs_rem} == 35, ${cs_allow} == 5590, ${cs_life} == 0 and ${cs_count} == 0: the read answers about a month that has not been posted and both bases happen to agree at position 1"
            - "${m_status} == COMPLETED and ${m_done} == 1, but ${m_planned} == 0: planned_stop_count is a live count of PLANNED stops, so completing the only stop empties it while completed_stop_count records the history"
            - "${m_missed} == 0, ${m_cancelled} == 0, ${m_slots} == 0, ${m_cap} == 4 and ${m_liters} == 0: a setup stop requesting zero cylinders commits no litres, and the manifest echoes the branch's capacity next to the used slots"

      - name: equipment_assignment_links_contract_and_unit_both_ways
        claim_type: cross_reference_link
        grounds:
          - endpoints[POST /home-oxygen/rental-contracts/{contract_id}/equipment-assignments]
          - endpoints[GET /home-oxygen/placements]
          - entities.Placement
        distinguishing_aspect: |
          The link endpoint takes only a role: the unit side of the association is chosen by the
          server, so the client cannot name it, and the junction row is the only place the pairing is
          visible. The same list endpoint therefore has to answer in both directions — by contract and
          by equipment unit — and the contract identifier arrives in the path while the unit
          identifier is a system field of the row that was just created.
        test_recipe:
          setup:
            - "One branch holding a stationary concentrator and a portable concentrator, both adequate for 3.0 L/min."
            - "A LIMITED_AMBULATORY patient with an ACTIVE certificate that prescribes a portable, and one open contract."
          setup_api_calls:
            - call: "POST /home-oxygen/branches"
              payload: { name: "Tampa Bay", state_code: "FL", competitive_bid_area: true, liquid_oxygen_certified: false, refill_capacity_per_day: 4, tank_exchange_buffer_minutes: 30 }
              as: BranchManager
              captures: { br_id: $.data.id }
            - call: "POST /home-oxygen/equipment-units"
              payload: { branch_id: "${br_id}", serial_number: "SC-1001", model_code: "CONC-5L", equipment_class: "STATIONARY_CONCENTRATOR", max_continuous_lpm: 5.0, max_pulse_setting: 0, pm_interval_days: 365, next_pm_due_date: "2027-06-01" }
              as: BranchManager
              captures: { u_stat: $.data.id }
            - call: "POST /home-oxygen/equipment-units"
              payload: { branch_id: "${br_id}", serial_number: "PC-2001", model_code: "POC-3L", equipment_class: "PORTABLE_CONCENTRATOR", max_continuous_lpm: 3.0, max_pulse_setting: 5, pm_interval_days: 365, next_pm_due_date: "2027-06-01" }
              as: BranchManager
              captures: { u_por: $.data.id }
            - call: "POST /home-oxygen/patients"
              payload: { mrn: "MRN-0740", full_name: "Aurelio Bergqvist", branch_id: "${br_id}", payer_type: "MEDICARE_COMPETITIVE_BID", mobility_profile: "LIMITED_AMBULATORY", altitude_feet: 500 }
              as: IntakeCoordinator
              captures: { p_id: $.data.id, p_ver: $.data.version }
            - call: "POST /home-oxygen/qualifying-tests"
              payload: { patient_id: "${p_id}", test_type: "RESTING_ROOM_AIR", spo2_percent: 87, tested_at: "2026-07-25T14:00:00Z", ordering_physician_npi: "1234567893" }
              as: IntakeCoordinator
              captures: { qt_id: $.data.id }
            - call: "POST /home-oxygen/cmns"
              payload: { patient_id: "${p_id}", qualifying_test_id: "${qt_id}", form_type: "INITIAL", prescribed_lpm: 3.0, hours_per_day: 24, portable_prescribed: true, length_of_need_months: 99, narrative_element_count: 3, expected_patient_version: "${p_ver}" }
              as: IntakeCoordinator
              captures: { cmn_id: $.data.id }
            - call: "POST /home-oxygen/cmns/${cmn_id}/submit"
              payload: {}
              as: IntakeCoordinator
              as_user_id: "u-intake-1"
            - call: "POST /home-oxygen/cmns/${cmn_id}/sign"
              payload: {}
              as: Physician
              as_user_id: "u-phys-1"
            - call: "POST /home-oxygen/cmns/${cmn_id}/approve"
              payload: {}
              as: ComplianceAuditor
              as_user_id: "u-audit-1"
            - call: "POST /home-oxygen/rental-contracts"
              payload: { patient_id: "${p_id}", cmn_id: "${cmn_id}", pricing_basis: "COMPETITIVE_BID_SINGLE_PAYMENT", cap_month_limit: 36 }
              as: BillingSpecialist
              captures: { c_id: $.data.id }
          trigger:
            - call: "POST /home-oxygen/rental-contracts/${c_id}/equipment-assignments"
              payload: { role: "PRIMARY_STATIONARY" }
              as: RespiratoryTherapist
              captures: { pl_a: $.data.id, pl_a_unit: $.data.equipment_unit_id, pl_a_role: $.data.role, pl_a_status: $.data.status, pl_a_contract: $.data.contract_id }
            - call: "POST /home-oxygen/rental-contracts/${c_id}/equipment-assignments"
              payload: { role: "PORTABLE" }
              as: RespiratoryTherapist
              captures: { pl_b: $.data.id, pl_b_unit: $.data.equipment_unit_id }
            - call: "GET /home-oxygen/placements"
              payload: { contract_id: "${c_id}" }
              as: RespiratoryTherapist
              captures: { fwd_first_role: "$.data[0].role", fwd_first_status: "$.data[0].status" }
            - call: "GET /home-oxygen/placements"
              payload: { equipment_unit_id: "${u_por}" }
              as: RespiratoryTherapist
              captures: { rev_role: "$.data[0].role", rev_contract: "$.data[0].contract_id" }
            - call: "GET /home-oxygen/equipment-units/${u_stat}"
              payload: {}
              as: RespiratoryTherapist
              captures: { u_stat_status: $.data.status }
            - call: "POST /home-oxygen/rental-contracts/00000000-0000-0000-0000-0000000000ff/equipment-assignments"
              payload: { role: "BACKUP" }
              as: RespiratoryTherapist
              captures: { e_contract: $.data.error_id }
          assert:
            - "${pl_a_contract} == ${c_id} and ${pl_a_unit} == ${u_stat}: the junction row carries both sides even though the request body named only the role ${pl_a_role} == PRIMARY_STATIONARY"
            - "${pl_a_status} == RESERVED and ${u_stat_status} == RESERVED: creating the link moves the unit out of the branch's IN_STOCK pool in the same request"
            - "${pl_b_unit} == ${u_por}: the PORTABLE role resolves to the portable concentrator, because REQUIRED_CLASSES for that role excludes the stationary unit entirely"
            - "The contract-scoped list returns both ${pl_a} and ${pl_b}, with ${fwd_first_role} == PRIMARY_STATIONARY and ${fwd_first_status} == RESERVED"
            - "The unit-scoped list returns exactly one row with ${rev_role} == PORTABLE and ${rev_contract} == ${c_id}: the association is navigable from the equipment side without knowing the contract"
            - "${e_contract} == ERR_CONTRACT_NOT_FOUND (404): the path side of the link is resolved before any equipment is selected, so no unit is reserved by the failed call"

      - name: placement_release_is_conditional_on_reserved_status
        claim_type: conditional_action
        grounds:
          - endpoints[DELETE /home-oxygen/placements/{placement_id}]
          - state_machines.Placement
          - calculations.monthly_allowable_cents
        distinguishing_aspect: |
          The release verb is a genuine conditional action rather than a delete: it exists only while
          the placement is RESERVED. Once the in-home setup has moved the row to PLACED the same call
          is refused, because equipment in a patient's home leaves through a PICKUP stop and not
          through the endpoint that undoes a reservation — and the allowable follows the PLACED set,
          so it is zero before setup and 5590 after.
        test_recipe:
          setup:
            - "One branch with a single stationary concentrator and a contract in PENDING_SETUP."
