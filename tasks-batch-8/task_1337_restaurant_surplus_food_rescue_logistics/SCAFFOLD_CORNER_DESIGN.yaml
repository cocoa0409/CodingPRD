  # ============================================================ validations ===
  - section: validations
    instances:
      - name: ownership_mismatch_masked_as_not_found
        claim_type: cross_entity_validation
        grounds: ["validations[priority=5]", "errors[ERR_DONOR_NOT_FOUND]"]
        distinguishing_aspect: "Entity-backed callers addressing another tenant's resource get the resource's 404, not a 403 — no cross-tenant existence leak (DonorCoordinator D1 reading D2's record, D2's offer list, or posting an offer as D2)."
        test_recipe:
          setup: ["Donors D1 and D2 both ACTIVE; D2 has one offer O2"]
          setup_api_calls:
            - call: "POST /api/donor-sites"
              payload: { legal_name: "Own One", ein: "100000016", contact_email: "o1@bistro.example" }
              as: DispatchAdmin
              captures: { d1: $.data.id }
            - call: "POST /api/donor-sites"
              payload: { legal_name: "Own Two", ein: "100000017", contact_email: "o2@bistro.example" }
              as: DispatchAdmin
              captures: { d2: $.data.id }
            - call: "POST /api/donation-offers"
              payload: { donor_site_id: "${d2}", food_category: "SHELF_STABLE", estimated_weight_lbs: 5, pickup_window_start: "2026-08-02T10:00:00Z", pickup_window_end: "2026-08-02T12:00:00Z" }
              as: DonorCoordinator
              as_user_id: "${d2}"
          trigger:
            - call: "GET /api/donor-sites/${d2}"
              as: DonorCoordinator
              as_user_id: "${d1}"
              captures: { e1: $.data.error_id }
            - call: "GET /api/donor-sites/${d2}/donation-offers"
              as: DonorCoordinator
              as_user_id: "${d1}"
              captures: { e2: $.data.error_id }
            - call: "POST /api/donation-offers"
              payload: { donor_site_id: "${d2}", food_category: "SHELF_STABLE", estimated_weight_lbs: 5, pickup_window_start: "2026-08-02T10:00:00Z", pickup_window_end: "2026-08-02T12:00:00Z" }
              as: DonorCoordinator
              as_user_id: "${d1}"
              captures: { e3: $.data.error_id }
          assert:
            - "e1 == ERR_DONOR_NOT_FOUND and e2 == ERR_DONOR_NOT_FOUND and e3 == ERR_DONOR_NOT_FOUND (ownership violations masked as 404)"

      - name: schema_validation_beats_existence_rejected
        claim_type: priority_ordering
        grounds: ["validations[priority=3]", "validations[priority=4]", "errors[ERR_INVALID_REQUEST]"]
        distinguishing_aspect: "A dispatch body missing the required offer_id AND carrying a bogus driver_id fails schema validation (priority 3) before existence (priority 4): ERR_INVALID_REQUEST, never ERR_DRIVER_NOT_FOUND."
        test_recipe:
          setup: ["Empty DB except logical clock default"]
          setup_api_calls: []
          trigger:
            - call: "POST /api/rescue-runs"
              payload: { driver_id: "00000000-0000-4000-8000-0000000000zz" }
              as: DispatchAdmin
              captures: { err: $.data.error_id }
          assert:
            - "err == ERR_INVALID_REQUEST (schema fires before any 404 resolution)"

