          mk_lv: $.data.version
      - call: POST /produce/sourcing-bids
        payload:
          supply_lot_id: ${mk_l}
          supplier_id: ${mk_s}
          bid_unit_cost_cents: 100
          quantity_offered: 300
        as: Supplier
        as_user_id: ${mk_s}
      - call: POST /produce/supply-lots/${mk_l}/award
        payload:
          bidder_quota: 1
