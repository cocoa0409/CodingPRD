              as: DealerAdmin
            - call: "POST /casings"
              payload: { fleet_account_id: "${fleet_id}", casing_serial: "CS-3101", brand: "Bridgestone", casing_spec_code: "ANY", intended_position: "DRIVE", scrap_weight_lbs: 125 }
              as: DealerAdmin
              captures: { cas1_id: $.data.id }
            - call: "POST /casings/${cas1_id}/collect"
              payload: { collected_at_location_id: "${loc_id}" }
              as: TireTechnician
              captures: { cas1_v: $.data.version }
            - call: "POST /casings/${cas1_id}/inspect"
              payload: { grade: "REJECT", expected_casing_version: "${cas1_v}" }
              as: CasingInspector
              as_user_id: "inspector-1"
            - call: "POST /casings"
              payload: { fleet_account_id: "${fleet_id}", casing_serial: "CS-3102", brand: "Bridgestone", casing_spec_code: "ANY", intended_position: "DRIVE", scrap_weight_lbs: 130 }
              as: DealerAdmin
              captures: { cas2_id: $.data.id }
            - call: "POST /casings/${cas2_id}/collect"
              payload: { collected_at_location_id: "${loc_id}" }
              as: TireTechnician
              captures: { cas2_v: $.data.version }
            - call: "POST /casings/${cas2_id}/inspect"
              payload: { grade: "REJECT", expected_casing_version: "${cas2_v}" }
              as: CasingInspector
              as_user_id: "inspector-1"
            - call: "POST /service-locations/${loc_id}/scrap-manifests"
              payload: { hauler_permit_number: "HAUL-31", hauler_capacity_lbs: 500 }
              as: ComplianceOfficer
              as_user_id: "officer-signer"
              captures: { man1_id: $.data.id }
            - call: "POST /scrap-manifests/${man1_id}/lines"
              payload: { casing_id: "${cas1_id}" }
              as: ComplianceOfficer
              as_user_id: "officer-signer"
            - call: "POST /scrap-manifests/${man1_id}/lines"
              payload: { casing_id: "${cas2_id}" }
              as: ComplianceOfficer
              as_user_id: "officer-signer"
            - call: "POST /scrap-manifests/${man1_id}/sign"
              payload: { signed_at: "2026-08-11T09:00:00Z" }
              as: ComplianceOfficer
              as_user_id: "officer-signer"
          trigger:
            - call: "POST /scrap-manifests/${man1_id}/void"
              payload: { void_reason: "Hauler cancelled the pickup" }
              as: ComplianceOfficer
              as_user_id: "officer-signer"
            - call: "POST /service-locations/${loc_id}/scrap-manifests"
              payload: { hauler_permit_number: "HAUL-32", hauler_capacity_lbs: 500 }
              as: ComplianceOfficer
              as_user_id: "officer-signer"
              captures: { man2_id: $.data.id }
            - call: "POST /scrap-manifests/${man2_id}/lines"
              payload: { casing_id: "${cas1_id}" }
              as: ComplianceOfficer
              as_user_id: "officer-signer"
            - call: "POST /scrap-manifests/${man2_id}/lines"
              payload: { casing_id: "${cas2_id}" }
              as: ComplianceOfficer
              as_user_id: "officer-signer"
          assert:
            - "before the void: ScrapManifest.${man1_id}.status == SIGNED, tire_count == 2, total_weight_lbs == 255, and both casings carry scrap_manifest_id == ${man1_id}"
            - "after the void: status == VOIDED, tire_count == 0, total_weight_lbs == 0, signed_by_user_id == null and signed_at == null"
            - "Casing.${cas1_id}.scrap_manifest_id == null and Casing.${cas2_id}.scrap_manifest_id == null"
            - "both casings are STILL in status REJECTED — voiding the document does not un-condemn a tire, and ServiceLocation.${loc_id}.casings_in_holding_count == 2 is unchanged"
            - "the two casings can be listed on a fresh manifest without ERR_CASING_ALREADY_ON_MANIFEST, and ScrapManifest.${man2_id} reaches tire_count == 2 and total_weight_lbs == 255 — the aggregate is reconstructed exactly, proving the linkage was truly released"
