            - { call: "GET /v1/blending-tanks/${tank_id}", payload: {}, as: Any, captures: { t_posture: $.data.posture, t_batch: $.data.occupying_batch_id } }
            - { call: "GET /v1/batches/${batch_id}/process-runs", payload: {}, as: Any, captures: { pruns: $.data } }
            - { call: "POST /v1/batches/${batch_id}/condemn", payload: {}, as: QAInspector, as_user_id: "qa-1", captures: { err_again: $.data.error_id } }
            - { call: "POST /v1/batches/${batch_id}/release", payload: {}, as: QAInspector, as_user_id: "qa-1", captures: { err_rel: $.data.error_id } }
          assert:
            - "b_status == CONDEMNED"
            - "t_posture == AWAITING_CIP and t_batch is null (condemn frees the tank for cleaning)"
            - "pruns == [] (no process run ever existed — abort branch correctly absent)"
            - "err_again == ERR_BATCH_STATE_INVALID and err_rel == ERR_BATCH_STATE_INVALID (CONDEMNED terminal)"

      - name: recall_deallocates_allocated_order
        claim_type: side_effect_execution
        grounds:
          - state_machines.FinishedGoodLot.AVAILABLE_to_RECALLED
