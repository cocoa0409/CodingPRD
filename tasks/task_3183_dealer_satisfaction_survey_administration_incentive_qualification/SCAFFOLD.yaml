    description: "Close wave; expires non-terminal invitations, recomputes dealer scores/posture"
    roles: [PlatformAdmin]
    code: 200
    input: []
    output: SurveyWave
    side_effects: ["OPEN -> CLOSED; increments SurveyWave.version by 1", "QUEUED/SENT -> EXPIRED", "dealer score + posture recompute"]

  - method: POST
    path: "/survey/waves/{id}/finalize"
    description: "Finalize wave; promotes PROVISIONAL statements to FINAL"
    roles: [PlatformAdmin]
    code: 200
    input: []
    output: SurveyWave
    side_effects: ["CLOSED -> FINALIZED; increments SurveyWave.version by 1", "statements PROVISIONAL -> FINAL"]

  - method: GET
    path: "/survey/waves/{id}/benchmarks/{dealer_id}"
    description: "Regional benchmark for a dealer in this wave"
    roles: [PlatformAdmin, RegionalManager, ComplianceAuditor, FieldConsultant, DealerPrincipal]
    code: 200
    input: []
    output: "{ region_id: string, wave_id: string, dealer_count: integer, dealer_rank: integer, percentile: number }"
