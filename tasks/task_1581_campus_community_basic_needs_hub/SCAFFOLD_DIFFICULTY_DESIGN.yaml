              captures: { gc_status: $.data.status }
          trigger:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-04T00:00:01Z" }
              as: HubAdmin
            - call: "POST /_sweeps/run_pending_transitions"
              payload: {}
              as: HubAdmin
