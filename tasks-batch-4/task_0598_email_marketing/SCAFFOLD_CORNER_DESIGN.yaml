              as: CampaignAuthor
              as_user_id: "${authorA}"
              captures: { tpl: $.data.id }
            - call: "POST /campaigns"
              payload: { account_id: "${acctA}", audience_id: "${aud}", template_id: "${tpl}", name: "C1" }
              as: CampaignAuthor
              as_user_id: "${authorA}"
              captures: { c1: $.data.id }
          trigger:
            - call: "POST /campaigns/${c1}/submit-review"
              payload: {}
              as: CampaignAuthor
              as_user_id: "${authorB}"
              captures: { err: $.data.error_id }
          assert:
            - "HTTP status == 403"
            - "${err} == \"ERR_CROSS_ACCOUNT_ACCESS\""
            - "Campaign.${c1}.status == \"DRAFT\""

      - name: campaign_author_claiming_approver_role_identity_mismatch
        claim_type: Conditional validation
        grounds: ["validations[priority=3]", "errors[ERR_ROLE_IDENTITY_MISMATCH]", roles.ComplianceApprover]
        distinguishing_aspect: "An AccountUser whose user_role is CAMPAIGN_AUTHOR may not send X-User-Role: ComplianceApprover; the identity check (priority 3) returns 403 ERR_ROLE_IDENTITY_MISMATCH before any segregation-of-duties or state reasoning."
        test_recipe:
          setup: ["One account; author u1 (CAMPAIGN_AUTHOR) and approver u2 (COMPLIANCE_APPROVER). Campaign C1 authored by u1 sits IN_REVIEW."]
          setup_api_calls:
            - call: "POST /accounts"
              payload: { name: "Acme" }
              as: PlatformAdmin
              captures: { acct: $.data.id }
            - call: "POST /accounts/${acct}/users"
              payload: { email: "u1@acme.com", user_role: "CAMPAIGN_AUTHOR" }
              as: PlatformAdmin
              captures: { u1: $.data.id }
            - call: "POST /accounts/${acct}/users"
              payload: { email: "u2@acme.com", user_role: "COMPLIANCE_APPROVER" }
              as: PlatformAdmin
              captures: { u2: $.data.id }
            - call: "POST /audiences"
              payload: { account_id: "${acct}", name: "Main", default_from_email: "hi@acme.com", double_optin_required: false }
              as: CampaignAuthor
              as_user_id: "${u1}"
              captures: { aud: $.data.id }
            - call: "POST /templates"
              payload: { account_id: "${acct}", name: "T", subject: "S", html_body: "<a href=\"{{unsubscribe_url}}\">u</a>" }
              as: CampaignAuthor
              as_user_id: "${u1}"
              captures: { tpl: $.data.id }
            - call: "POST /templates/${tpl}/publish"
              payload: {}
              as: CampaignAuthor
              as_user_id: "${u1}"
            - call: "POST /campaigns"
              payload: { account_id: "${acct}", audience_id: "${aud}", template_id: "${tpl}", name: "C1" }
              as: CampaignAuthor
              as_user_id: "${u1}"
              captures: { c1: $.data.id }
            - call: "POST /campaigns/${c1}/submit-review"
              payload: {}
              as: CampaignAuthor
              as_user_id: "${u1}"
          trigger:
            - call: "POST /campaigns/${c1}/review"
              payload: { decision: "APPROVE" }
              as: ComplianceApprover
              as_user_id: "${u1}"
              captures: { err: $.data.error_id }
          assert:
            - "HTTP status == 403"
            - "${err} == \"ERR_ROLE_IDENTITY_MISMATCH\"   # u1's user_role is CAMPAIGN_AUTHOR, not DUAL"
            - "Campaign.${c1}.status == \"IN_REVIEW\""

      - name: suppressed_email_cannot_be_resubscribed
        claim_type: Cross-entity validation
        grounds: ["validations[priority=18]", "errors[ERR_EMAIL_SUPPRESSED]", entities.SuppressionEntry.fields.email]
        distinguishing_aspect: "Suppression is account-wide, not audience-scoped: after s1@x.com unsubscribes from audience L1, creating s1@x.com in a DIFFERENT audience L2 of the same account returns 409 ERR_EMAIL_SUPPRESSED."
        test_recipe:
          setup: ["One account with two single-opt-in audiences L1 and L2; s1@x.com was added to L1 and then unsubscribed, so it sits on the account suppression list."]
          setup_api_calls:
            - call: "POST /accounts"
              payload: { name: "Acme" }
              as: PlatformAdmin
              captures: { acct: $.data.id }
            - call: "POST /audiences"
              payload: { account_id: "${acct}", name: "L1", default_from_email: "hi@acme.com", double_optin_required: false }
              as: PlatformAdmin
              captures: { l1: $.data.id }
            - call: "POST /audiences"
              payload: { account_id: "${acct}", name: "L2", default_from_email: "hi@acme.com", double_optin_required: false }
              as: PlatformAdmin
              captures: { l2: $.data.id }
            - call: "POST /audiences/${l1}/subscribers"
              payload: { email: "s1@x.com", consent_source: "API" }
              as: PlatformAdmin
              captures: { s1: $.data.id, tok: $.data.unsubscribe_token }
            - call: "POST /subscribers/${s1}/unsubscribe"
              payload: { unsubscribe_token: "${tok}" }
              as: Anonymous
          trigger:
            - call: "POST /audiences/${l2}/subscribers"
              payload: { email: "s1@x.com", consent_source: "SIGNUP_FORM" }
              as: Anonymous
              captures: { err: $.data.error_id }
          assert:
            - "HTTP status == 409"
            - "${err} == \"ERR_EMAIL_SUPPRESSED\""
            - "Audience.${l2}.subscriber_count == 0"

      - name: duplicate_email_in_same_audience_rejected
        claim_type: Violation → Error
        grounds: ["validations[priority=20]", "errors[ERR_SUBSCRIBER_EXISTS]"]
        distinguishing_aspect: "Email uniqueness is enforced per audience across EVERY consent_state; re-adding an existing CONFIRMED address returns 409 ERR_SUBSCRIBER_EXISTS."
        test_recipe:
          setup: ["One single-opt-in audience holding s1@x.com."]
          setup_api_calls:
            - call: "POST /accounts"
              payload: { name: "Acme" }
              as: PlatformAdmin
              captures: { acct: $.data.id }
            - call: "POST /audiences"
              payload: { account_id: "${acct}", name: "Main", default_from_email: "hi@acme.com", double_optin_required: false }
              as: PlatformAdmin
              captures: { aud: $.data.id }
            - call: "POST /audiences/${aud}/subscribers"
              payload: { email: "s1@x.com", consent_source: "API" }
              as: PlatformAdmin
          trigger:
            - call: "POST /audiences/${aud}/subscribers"
              payload: { email: "s1@x.com", consent_source: "SIGNUP_FORM" }
              as: Anonymous
              captures: { err: $.data.error_id }
          assert:
            - "HTTP status == 409"
            - "${err} == \"ERR_SUBSCRIBER_EXISTS\""
            - "Audience.${aud}.subscriber_count == 1"

      - name: expired_confirmation_token_rejected_after_48h
        claim_type: Temporal validation
        grounds: ["validations[priority=21]", "errors[ERR_CONFIRMATION_EXPIRED]"]
        distinguishing_aspect: "The confirmation window is `now < created_at + 48h`: at exactly 48 hours after creation, the correct token is rejected with 422 ERR_CONFIRMATION_EXPIRED and the subscriber remains PENDING."
        test_recipe:
          setup: ["One double-opt-in audience with a PENDING subscriber created at the clock default 2026-05-01T00:00:00Z; the clock now reads 2026-05-03T00:00:00Z (exactly 48h)."]
          setup_api_calls:
            - call: "POST /accounts"
              payload: { name: "Acme" }
              as: PlatformAdmin
              captures: { acct: $.data.id }
            - call: "POST /audiences"
              payload: { account_id: "${acct}", name: "Main", default_from_email: "hi@acme.com", double_optin_required: true }
              as: PlatformAdmin
              captures: { aud: $.data.id }
            - call: "POST /audiences/${aud}/subscribers"
              payload: { email: "s1@x.com", consent_source: "SIGNUP_FORM" }
              as: Anonymous
              captures: { s1: $.data.id, tok: $.data.confirmation_token }
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-05-03T00:00:00Z" }
              as: PlatformAdmin
          trigger:
            - call: "POST /subscribers/${s1}/confirm"
              payload: { confirmation_token: "${tok}" }
              as: Anonymous
              captures: { err: $.data.error_id }
          assert:
            - "HTTP status == 422"
            - "${err} == \"ERR_CONFIRMATION_EXPIRED\""
            - "Subscriber.${s1}.consent_state == \"PENDING\"   # not archived until an ops run happens"

      - name: wrong_unsubscribe_token_rejected
        claim_type: Violation → Error
        grounds: ["validations[priority=19]", "errors[ERR_INVALID_UNSUBSCRIBE_TOKEN]"]
        distinguishing_aspect: "POST /subscribers/{id}/unsubscribe with a token that does not equal Subscriber.unsubscribe_token returns 403 ERR_INVALID_UNSUBSCRIBE_TOKEN, leaves consent_state CONFIRMED and writes no SuppressionEntry."
        test_recipe:
          setup: ["One single-opt-in audience with one CONFIRMED subscriber."]
          setup_api_calls:
            - call: "POST /accounts"
              payload: { name: "Acme" }
              as: PlatformAdmin
              captures: { acct: $.data.id }
            - call: "POST /audiences"
              payload: { account_id: "${acct}", name: "Main", default_from_email: "hi@acme.com", double_optin_required: false }
              as: PlatformAdmin
              captures: { aud: $.data.id }
            - call: "POST /audiences/${aud}/subscribers"
              payload: { email: "s1@x.com", consent_source: "API" }
              as: PlatformAdmin
              captures: { s1: $.data.id }
          trigger:
            - call: "POST /subscribers/${s1}/unsubscribe"
              payload: { unsubscribe_token: "not-the-right-token" }
              as: Anonymous
              captures: { err: $.data.error_id }
          assert:
            - "HTTP status == 403"
            - "${err} == \"ERR_INVALID_UNSUBSCRIBE_TOKEN\""
            - "Subscriber.${s1}.consent_state == \"CONFIRMED\""
            - "GET /accounts/${acct}/suppressions returns 0 rows"

      - name: segment_from_other_audience_rejected_on_campaign_create
        claim_type: Violation → Error
        grounds: ["validations[priority=9]", "errors[ERR_SEGMENT_AUDIENCE_MISMATCH]"]
        distinguishing_aspect: "POST /campaigns whose segment_id belongs to a different audience than audience_id is rejected with 422 ERR_SEGMENT_AUDIENCE_MISMATCH (referential, not a 404)."
        test_recipe:
          setup: ["One account with two single-opt-in audiences L1 and L2; segment SEG belongs to L2."]
          setup_api_calls:
            - call: "POST /accounts"
              payload: { name: "Acme" }
              as: PlatformAdmin
              captures: { acct: $.data.id }
            - call: "POST /accounts/${acct}/users"
              payload: { email: "author@acme.com", user_role: "CAMPAIGN_AUTHOR" }
              as: PlatformAdmin
