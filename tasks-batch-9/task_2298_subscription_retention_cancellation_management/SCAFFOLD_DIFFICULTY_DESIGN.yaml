              payload: { to_iso8601: "2026-04-12T00:00:00Z" }
              as: PlatformAdmin
            - call: "POST /winback-targets/${tgt_bb_id}/send"
              payload: {}
              as: RetentionSpecialist
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-04-13T00:00:00Z" }
              as: PlatformAdmin
            - call: "POST /winback-targets/${tgt_bb_id}/send"
              payload: {}
              as: RetentionSpecialist
          assert:
            - "WinBackTarget.${tgt_a_id}.days_since_lapse_at_target == 34"
            - "WinBackTarget.${tgt_a_id}.priority_score == 0.5478"
            - "WinBackTarget.${tgt_a_id}.state == SENT"
            - "WinBackTarget.${tgt_a_id}.sent_at == 2026-03-13T00:00:00Z"
            - "Subscriber.${sub_b2_id}.last_contacted_at == 2026-03-13T00:00:00Z"
            - "The send of ${tgt_bb_id} at 2026-03-20 returns 422 with error_id ERR_CONTACT_CAP_EXCEEDED"
            - "The send of ${tgt_bb_id} at 2026-04-12 returns 422 with error_id ERR_CONTACT_CAP_EXCEEDED"
            - "Immediately after those failures WinBackTarget.${tgt_bb_id}.state == ELIGIBLE and sent_at == null"
            - "The send of ${tgt_bb_id} at 2026-04-13 returns 200"
            - "WinBackTarget.${tgt_bb_id}.state == SENT"
            - "WinBackTarget.${tgt_bb_id}.sent_at == 2026-04-13T00:00:00Z"
            - "WinBackTarget.${tgt_bb_id}.expires_at == 2026-04-27T00:00:00Z"
            - "Subscriber.${sub_b2_id}.last_contacted_at == 2026-04-13T00:00:00Z"

  # ===========================================================================
  - rule_id: compensating_invariant
    instances:
      - name: committed_price_conserved_across_downgrade_and_reversal
        grounds:
          - calculations.committed_price_cents
          - state_machines.SubscriptionModification.APPLIED_to_REVERSED
          - entities.SubscriptionModification.fields.delta_price_cents
          - entities.SubscriptionModification.fields.prior_snapshot
          - entities.Subscription.fields.baseline_price_cents
          - concurrency_rules[modification-create-stale-subscription]
        distinguishing_aspect: |
          The money invariant committed_price_cents == baseline_price_cents + sum of
          delta_price_cents over modifications in state APPLIED or REVERSED holds exactly at 7197
          after a forward downgrade of -4198 is reversed by a compensating +4198 row, and a
          SCHEDULED ADDON_REMOVE contributes 0 because SCHEDULED rows are excluded from the sum.
        test_recipe:
          setup:
            - "LITE (2999/1400, empty addon catalog) and CORE (4999/2100, MUG 1299/520 and TUMBLER 899/360, downgrade target LITE) exist."
            - "Subscriber G subscribed to CORE on 2026-01-10 at 4-week cadence with no addons, so baseline_price_cents is 4999, and its signup invoice was paid, leaving no OPEN invoice."
            - "ADDON_ADD MUG (+1299) and ADDON_ADD TUMBLER (+899) were applied, taking committed_price_cents to 7197."
            - "A subscriber-initiated PLAN_DOWNGRADE to LITE was then applied, dropping both addons and taking committed_price_cents to 2999 with delta -4198."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-01-10T00:00:00Z" }
              as: PlatformAdmin
            - call: "POST /plans"
              payload: { code: "LITE", name: "Lite Box", monthly_price_cents: 2999, unit_cogs_cents: 1400, margin_floor_pct: 0.4000, shipments_per_cycle: 1, shipments_per_term: 12, allowed_frequency_weeks: [2, 4, 8], is_negative_option: true, renewal_reminder_days_before: 10, max_pause_cycles: 3, addon_catalog: [] }
              as: PlatformAdmin
              captures: { lite_g_id: $.data.id }
            - call: "POST /plans"
              payload: { code: "CORE", name: "Core Box", monthly_price_cents: 4999, unit_cogs_cents: 2100, margin_floor_pct: 0.4200, shipments_per_cycle: 1, shipments_per_term: 12, allowed_frequency_weeks: [2, 4, 8], is_negative_option: true, renewal_reminder_days_before: 10, max_pause_cycles: 3, addon_catalog: [{ code: "MUG", unit_price_cents: 1299, unit_cogs_cents: 520 }, { code: "TUMBLER", unit_price_cents: 899, unit_cogs_cents: 360 }], downgrade_target_plan_id: "${lite_g_id}" }
              as: PlatformAdmin
              captures: { core_g_id: $.data.id }
            - call: "POST /subscribers"
              payload: { email: "g@dtc.test", acquisition_channel: "SEARCH" }
              as: PlatformAdmin
              captures: { sub_g_id: $.data.id }
            - call: "POST /payment-methods"
              payload: { subscriber_id: "${sub_g_id}", card_last4: "1717", exp_month: 9, exp_year: 2033, network: "VISA" }
              as: PlatformAdmin
              captures: { pm_g_id: $.data.id }
            - call: "POST /subscriptions"
              payload: { subscriber_id: "${sub_g_id}", plan_id: "${core_g_id}", payment_method_id: "${pm_g_id}", frequency_weeks: 4, disclosure_acknowledged: true }
              as: PlatformAdmin
              captures: { s_g_id: $.data.id }
            - call: "GET /invoices"
              payload: { subscription_id: "${s_g_id}" }
              as: PlatformAdmin
              captures: { inv_g1_id: "$.data[0].id" }
            - call: "POST /invoices/${inv_g1_id}/dunning-attempts"
              payload: {}
              as: BillingOperator
            - call: "POST /_payments/simulate"
              payload: { invoice_id: "${inv_g1_id}", outcome: "SUCCEEDED" }
              as: BillingOperator
            - call: "GET /subscriptions/${s_g_id}"
              payload: {}
              as: PlatformAdmin
              captures: { v_g1: $.data.version }
            - call: "POST /subscriptions/${s_g_id}/modifications"
              payload: { mod_type: "ADDON_ADD", expected_subscription_version: "${v_g1}", addon_code: "MUG", addon_qty: 1, effective_at: "2026-01-10T00:00:00Z" }
              as: Subscriber
              as_user_id: "${sub_g_id}"
              captures: { mod_g1_id: $.data.id }
            - call: "GET /subscriptions/${s_g_id}"
              payload: {}
              as: PlatformAdmin
              captures: { v_g2: $.data.version }
            - call: "POST /subscriptions/${s_g_id}/modifications"
              payload: { mod_type: "ADDON_ADD", expected_subscription_version: "${v_g2}", addon_code: "TUMBLER", addon_qty: 1, effective_at: "2026-01-10T00:00:00Z" }
              as: Subscriber
              as_user_id: "${sub_g_id}"
              captures: { mod_g2_id: $.data.id }
            - call: "GET /subscriptions/${s_g_id}"
              payload: {}
              as: PlatformAdmin
              captures: { v_g3: $.data.version }
            - call: "POST /subscriptions/${s_g_id}/modifications"
              payload: { mod_type: "PLAN_DOWNGRADE", expected_subscription_version: "${v_g3}", target_plan_id: "${lite_g_id}", effective_at: "2026-01-10T00:00:00Z" }
              as: Subscriber
              as_user_id: "${sub_g_id}"
              captures: { mod_g3_id: $.data.id }
          trigger:
            - call: "POST /subscription-modifications/${mod_g3_id}/reverse"
              payload: { reason_note: "downgrade applied in error" }
              as: RetentionSpecialist
              captures: { mod_g4_id: $.data.id }
            - call: "GET /subscriptions/${s_g_id}"
              payload: {}
              as: PlatformAdmin
              captures: { v_g4: $.data.version }
            - call: "POST /subscriptions/${s_g_id}/modifications"
              payload: { mod_type: "ADDON_REMOVE", expected_subscription_version: "${v_g4}", addon_code: "MUG", effective_at: "2026-03-01T00:00:00Z" }
              as: Subscriber
              as_user_id: "${sub_g_id}"
              captures: { mod_g5_id: $.data.id }
          assert:
            - "Subscription.${s_g_id}.baseline_price_cents == 4999"
            - "SubscriptionModification.${mod_g1_id}.delta_price_cents == 1299"
            - "SubscriptionModification.${mod_g2_id}.delta_price_cents == 899"
            - "SubscriptionModification.${mod_g3_id}.delta_price_cents == -4198"
            - "SubscriptionModification.${mod_g3_id}.state == REVERSED"
            - "SubscriptionModification.${mod_g4_id}.reverses_modification_id == ${mod_g3_id}"
            - "SubscriptionModification.${mod_g4_id}.state == APPLIED"
            - "SubscriptionModification.${mod_g4_id}.delta_price_cents == 4198"
            - "SubscriptionModification.${mod_g5_id}.state == SCHEDULED"
            - "SubscriptionModification.${mod_g5_id}.delta_price_cents == 0"
            - "Subscription.${s_g_id}.plan_id == ${core_g_id}"
            - "Subscription.${s_g_id}.committed_price_cents == 7197"
            - "4999 + 1299 + 899 + (-4198) + 4198 + 0 == 7197, so committed_price_cents equals baseline_price_cents plus the delta sum over states APPLIED and REVERSED"
            - "Subscription.${s_g_id}.addons has exactly 2 entries with codes MUG and TUMBLER"

      - name: term_shipment_units_conserved_across_skip_and_reversal
        grounds:
          - entities.Subscription.fields.term_shipments_delivered
          - entities.Subscription.fields.term_shipments_skipped
          - entities.Subscription.fields.term_shipments_remaining
          - state_machines.SubscriptionModification.APPLIED_to_REVERSED
          - entities.Plan.fields.shipments_per_term
        distinguishing_aspect: |
          A second conserved quantity, shipment units rather than money, holds at every step:
          delivered + skipped + remaining equals Plan.shipments_per_term (12) after signup
          (1 + 0 + 11), after an applied SKIP_SHIPMENT (1 + 1 + 10) and after its reversal
          (1 + 0 + 11), with no drift in remaining.
        test_recipe:
          setup:
            - "CORE exists with shipments_per_term 12 and 4-week cadence."
            - "Subscriber Q subscribed to CORE on 2026-01-10, so term_shipments_delivered is 1, term_shipments_skipped is 0 and term_shipments_remaining is 11."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-01-10T00:00:00Z" }
              as: PlatformAdmin
            - call: "POST /plans"
              payload: { code: "CORE", name: "Core Box", monthly_price_cents: 4999, unit_cogs_cents: 2100, margin_floor_pct: 0.4200, shipments_per_cycle: 1, shipments_per_term: 12, allowed_frequency_weeks: [2, 4, 8], is_negative_option: true, renewal_reminder_days_before: 10, max_pause_cycles: 3, addon_catalog: [] }
              as: PlatformAdmin
              captures: { core_q_id: $.data.id }
            - call: "POST /subscribers"
              payload: { email: "q@dtc.test", acquisition_channel: "ORGANIC" }
              as: PlatformAdmin
              captures: { sub_q_id: $.data.id }
            - call: "POST /payment-methods"
              payload: { subscriber_id: "${sub_q_id}", card_last4: "1818", exp_month: 8, exp_year: 2033, network: "VISA" }
              as: PlatformAdmin
              captures: { pm_q_id: $.data.id }
            - call: "POST /subscriptions"
              payload: { subscriber_id: "${sub_q_id}", plan_id: "${core_q_id}", payment_method_id: "${pm_q_id}", frequency_weeks: 4, disclosure_acknowledged: true }
              as: PlatformAdmin
              captures: { s_q_id: $.data.id, v_q0: $.data.version }
          trigger:
            - call: "POST /subscriptions/${s_q_id}/modifications"
              payload: { mod_type: "SKIP_SHIPMENT", expected_subscription_version: "${v_q0}", skip_ship_at: "2026-02-07T00:00:00Z", effective_at: "2026-01-10T00:00:00Z" }
              as: Subscriber
              as_user_id: "${sub_q_id}"
              captures: { mod_q1_id: $.data.id }
            - call: "POST /subscription-modifications/${mod_q1_id}/reverse"
              payload: { reason_note: "subscriber changed their mind" }
              as: RetentionSpecialist
              captures: { mod_q2_id: $.data.id }
          assert:
            - "After the SKIP was applied Subscription.${s_q_id}.term_shipments_skipped == 1 and term_shipments_remaining == 10"
            - "SubscriptionModification.${mod_q1_id}.mod_type == SKIP_SHIPMENT"
            - "SubscriptionModification.${mod_q1_id}.state == REVERSED"
            - "SubscriptionModification.${mod_q1_id}.delta_price_cents == 0"
            - "SubscriptionModification.${mod_q2_id}.reverses_modification_id == ${mod_q1_id}"
            - "SubscriptionModification.${mod_q2_id}.state == APPLIED"
            - "Subscription.${s_q_id}.term_shipments_delivered == 1"
            - "Subscription.${s_q_id}.term_shipments_skipped == 0"
            - "Subscription.${s_q_id}.term_shipments_remaining == 11"
            - "1 + 0 + 11 == 12 == Plan.${core_q_id}.shipments_per_term at every observation point"
            - "Subscription.${s_q_id}.committed_price_cents == 4999"
