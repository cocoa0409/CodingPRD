# =============================================================================
# §1.9 Scaffold Corner Design (Coverage Index for Non-Difficulty Tests)
# Census & Field-Survey Operations — breadth probe over §1.1–§1.7
# =============================================================================
scaffold_corner_design:

  # ------------------------------- Entities ----------------------------------
  - section: entities
    instances:
      - name: create_project_missing_name_returns_validation
        claim_type: required_field
        grounds:
          - entities.SurveyProject.fields.name
          - errors[ERR_VALIDATION]
        distinguishing_aspect: "Omitting the required name field on project creation returns ERR_VALIDATION (400)."
        test_recipe:
          setup: ["Empty DB."]
          setup_api_calls: []
          trigger:
            - call: "POST /survey-projects"
              payload: { region_code: "R1", default_language: "EN", supported_languages: ["EN"] }
              as: SurveyAdmin
              captures: { err: $.data.error_id }
          assert:
            - "trigger response error_id == ERR_VALIDATION"
            - "trigger response HTTP status == 400"

      - name: create_project_defaults_applied
        claim_type: default_value
        grounds:
          - entities.SurveyProject.fields.fraud_score_threshold
          - entities.SurveyProject.fields.max_attempts
          - entities.SurveyProject.fields.mileage_rate_cents_per_mile
        distinguishing_aspect: "Creating a project without the optional tuning fields applies defaults 60 / 6 / 67 and status PLANNING."
        test_recipe:
          setup: ["Empty DB."]
          setup_api_calls: []
          trigger:
            - call: "POST /survey-projects"
              payload: { name: "Wave S", region_code: "R1", default_language: "EN", supported_languages: ["EN"] }
              as: SurveyAdmin
              captures: { proj_id: $.data.id }
          assert:
            - "SurveyProject.${proj_id}.fraud_score_threshold == 60"
            - "SurveyProject.${proj_id}.max_attempts == 6"
            - "SurveyProject.${proj_id}.mileage_rate_cents_per_mile == 67"
            - "SurveyProject.${proj_id}.status == PLANNING"

      - name: get_case_nonexistent_returns_not_found
        claim_type: not_found
        grounds:
          - errors[ERR_CASE_NOT_FOUND]
        distinguishing_aspect: "GET on a non-existent case id returns ERR_CASE_NOT_FOUND (404)."
        test_recipe:
          setup: ["Empty DB."]
          setup_api_calls: []
          trigger:
            - call: "GET /cases/00000000-0000-0000-0000-000000000000"
              payload: {}
              as: SurveyAdmin
              captures: { err: $.data.error_id }
          assert:
            - "trigger response error_id == ERR_CASE_NOT_FOUND"
            - "trigger response HTTP status == 404"

      - name: assign_nonexistent_enumerator_returns_not_found
        claim_type: not_found
        grounds:
          - validations[priority=4]
          - errors[ERR_ENUMERATOR_NOT_FOUND]
        distinguishing_aspect: "A body foreign key enumerator_id that does not exist returns ERR_ENUMERATOR_NOT_FOUND (404) on assignment."
        test_recipe:
          setup: ["An IN_FIELD area with one UNASSIGNED case."]
          setup_api_calls:
            - call: "POST /survey-projects"
              payload: { name: "Wave T", region_code: "R1", default_language: "EN", supported_languages: ["EN"] }
              as: SurveyAdmin
              captures: { proj_id: $.data.id }
            - call: "POST /survey-projects/${proj_id}/open"
              payload: {}
              as: SurveyAdmin
            - call: "POST /survey-projects/${proj_id}/assignment-areas"
              payload: { area_code: "A1", budget_cents: 1000000 }
              as: SurveyAdmin
              captures: { area_id: $.data.id }
            - call: "POST /assignment-areas/${area_id}/open"
              payload: {}
              as: SurveyAdmin
            - call: "POST /assignment-areas/${area_id}/cases"
              payload: { address: "A St", respondent_language: "EN" }
              as: SurveyAdmin
              captures: { case_id: $.data.id, case_v: $.data.version }
          trigger:
            - call: "POST /cases/${case_id}/assignments"
              payload: { enumerator_id: "00000000-0000-0000-0000-000000000000", expected_case_version: "${case_v}" }
              as: FieldSupervisor
              captures: { err: $.data.error_id }
          assert:
            - "trigger response error_id == ERR_ENUMERATOR_NOT_FOUND"

  # ---------------------------- State Machines --------------------------------
  - section: state_machines
    instances:
      - name: created_case_starts_unassigned
        claim_type: initial_state
        grounds:
          - state_machines.Case
          - entities.Case.fields.status
          - entities.Case.fields.assigned_enumerator_id
        distinguishing_aspect: "A newly created case starts UNASSIGNED with attempt_count=0 and assigned_enumerator_id=null."
        test_recipe:
          setup: ["A project with a DRAFT area."]
          setup_api_calls:
            - call: "POST /survey-projects"
              payload: { name: "Wave U", region_code: "R1", default_language: "EN", supported_languages: ["EN"] }
              as: SurveyAdmin
              captures: { proj_id: $.data.id }
            - call: "POST /survey-projects/${proj_id}/assignment-areas"
              payload: { area_code: "A1", budget_cents: 1000000 }
              as: SurveyAdmin
              captures: { area_id: $.data.id }
          trigger:
            - call: "POST /assignment-areas/${area_id}/cases"
              payload: { address: "A St", respondent_language: "EN" }
              as: SurveyAdmin
              captures: { case_id: $.data.id }
          assert:
            - "Case.${case_id}.status == UNASSIGNED"
            - "Case.${case_id}.attempt_count == 0"
            - "Case.${case_id}.assigned_enumerator_id == null"

      - name: reopen_project_open_twice_returns_invalid_state
        claim_type: invalid_transition
        grounds:
          - state_machines.SurveyProject.PLANNING_to_IN_FIELD
          - errors[ERR_PROJECT_INVALID_STATE]
        distinguishing_aspect: "Opening an already-IN_FIELD project again returns ERR_PROJECT_INVALID_STATE (409); no side effects."
        test_recipe:
          setup: ["An IN_FIELD project."]
          setup_api_calls:
            - call: "POST /survey-projects"
              payload: { name: "Wave V", region_code: "R1", default_language: "EN", supported_languages: ["EN"] }
              as: SurveyAdmin
              captures: { proj_id: $.data.id }
            - call: "POST /survey-projects/${proj_id}/open"
              payload: {}
              as: SurveyAdmin
          trigger:
            - call: "POST /survey-projects/${proj_id}/open"
              payload: {}
              as: SurveyAdmin
              captures: { err: $.data.error_id }
          assert:
            - "trigger response error_id == ERR_PROJECT_INVALID_STATE"

      - name: lock_paid_pay_period_returns_invalid_state
        claim_type: terminal_state
        grounds:
          - state_machines.PayPeriod
          - errors[ERR_PAY_PERIOD_INVALID_STATE]
        distinguishing_aspect: "A PAID (terminal) pay period rejects a further lock with ERR_PAY_PERIOD_INVALID_STATE (409)."
        test_recipe:
          setup: ["A pay period taken OPEN -> LOCKED -> PAID."]
          setup_api_calls:
            - call: "POST /survey-projects"
              payload: { name: "Wave W", region_code: "R1", default_language: "EN", supported_languages: ["EN"] }
              as: SurveyAdmin
              captures: { proj_id: $.data.id }
            - call: "POST /survey-projects/${proj_id}/pay-periods"
              payload: { label: "P1" }
              as: SurveyAdmin
              captures: { pp_id: $.data.id }
            - call: "POST /pay-periods/${pp_id}/lock"
              payload: {}
              as: SurveyAdmin
            - call: "POST /pay-periods/${pp_id}/pay"
              payload: {}
              as: SurveyAdmin
          trigger:
            - call: "POST /pay-periods/${pp_id}/lock"
              payload: {}
              as: SurveyAdmin
              captures: { err: $.data.error_id }
          assert:
            - "trigger response error_id == ERR_PAY_PERIOD_INVALID_STATE"

      - name: unfreeze_area_returns_to_in_field
        claim_type: valid_transition
        grounds:
          - state_machines.AssignmentArea.FROZEN_to_IN_FIELD
        distinguishing_aspect: "Unfreezing a FROZEN area returns it to IN_FIELD."
        test_recipe:
          setup: ["An IN_FIELD area that was then FROZEN."]
          setup_api_calls:
            - call: "POST /survey-projects"
              payload: { name: "Wave X", region_code: "R1", default_language: "EN", supported_languages: ["EN"] }
              as: SurveyAdmin
              captures: { proj_id: $.data.id }
            - call: "POST /survey-projects/${proj_id}/open"
              payload: {}
              as: SurveyAdmin
            - call: "POST /survey-projects/${proj_id}/assignment-areas"
              payload: { area_code: "A1", budget_cents: 1000000 }
              as: SurveyAdmin
              captures: { area_id: $.data.id }
            - call: "POST /assignment-areas/${area_id}/open"
              payload: {}
              as: SurveyAdmin
            - call: "POST /assignment-areas/${area_id}/freeze"
              payload: {}
              as: SurveyAdmin
          trigger:
            - call: "POST /assignment-areas/${area_id}/unfreeze"
              payload: {}
              as: SurveyAdmin
          assert:
            - "AssignmentArea.${area_id}.status == IN_FIELD"

      - name: suspend_enumerator_releases_assignment
        claim_type: side_effect
        grounds:
          - state_machines.Enumerator.ACTIVE_to_SUSPENDED
          - state_machines.CaseAssignment.ACTIVE_to_RELEASED
          - entities.Case.fields.assigned_enumerator_id
        distinguishing_aspect: "Suspending an enumerator releases their ACTIVE assignment (RELEASED) and clears the case's assigned_enumerator_id to null."
        test_recipe:
          setup: ["An IN_FIELD area with one case assigned to ACTIVE E1."]
          setup_api_calls:
            - call: "POST /survey-projects"
              payload: { name: "Wave Y", region_code: "R1", default_language: "EN", supported_languages: ["EN"] }
              as: SurveyAdmin
              captures: { proj_id: $.data.id }
            - call: "POST /survey-projects/${proj_id}/open"
              payload: {}
              as: SurveyAdmin
            - call: "POST /survey-projects/${proj_id}/assignment-areas"
              payload: { area_code: "A1", budget_cents: 1000000 }
              as: SurveyAdmin
              captures: { area_id: $.data.id }
            - call: "POST /assignment-areas/${area_id}/open"
              payload: {}
              as: SurveyAdmin
            - call: "POST /survey-projects/${proj_id}/enumerators"
              payload: { full_name: "E1", languages: ["EN"], hourly_rate_cents: 3000 }
              as: SurveyAdmin
              captures: { en1_id: $.data.id }
            - call: "POST /enumerators/${en1_id}/hire"
              payload: {}
              as: SurveyAdmin
            - call: "POST /enumerators/${en1_id}/activate"
              payload: {}
              as: SurveyAdmin
            - call: "POST /assignment-areas/${area_id}/cases"
              payload: { address: "A St", respondent_language: "EN" }
              as: SurveyAdmin
              captures: { case_id: $.data.id, case_v: $.data.version }
            - call: "POST /cases/${case_id}/assignments"
              payload: { enumerator_id: "${en1_id}", expected_case_version: "${case_v}" }
              as: FieldSupervisor
              captures: { asg_id: $.data.id }
          trigger:
            - call: "POST /enumerators/${en1_id}/suspend"
              payload: {}
              as: SurveyAdmin
          assert:
            - "Enumerator.${en1_id}.status == SUSPENDED"
            - "CaseAssignment.${asg_id}.status == RELEASED"
            - "Case.${case_id}.assigned_enumerator_id == null"

  # ------------------------------ Validations ---------------------------------
  - section: validations
    instances:
      - name: response_without_contact_made_returns_error
        claim_type: violation_to_error
        grounds:
          - validations[priority=15]
          - errors[ERR_NO_CONTACT_MADE]
        distinguishing_aspect: "Capturing a response on a case with only NO_ONE_HOME attempts (no CONTACT_MADE) returns ERR_NO_CONTACT_MADE (409)."
        test_recipe:
          setup: ["A case assigned to ACTIVE E1 with one LOGGED NO_ONE_HOME attempt (IN_PROGRESS)."]
          setup_api_calls:
            - call: "POST /survey-projects"
              payload: { name: "Wave Z", region_code: "R1", default_language: "EN", supported_languages: ["EN"] }
              as: SurveyAdmin
              captures: { proj_id: $.data.id }
            - call: "POST /survey-projects/${proj_id}/open"
              payload: {}
              as: SurveyAdmin
            - call: "POST /survey-projects/${proj_id}/assignment-areas"
              payload: { area_code: "A1", budget_cents: 1000000 }
              as: SurveyAdmin
              captures: { area_id: $.data.id }
            - call: "POST /assignment-areas/${area_id}/open"
              payload: {}
              as: SurveyAdmin
            - call: "POST /survey-projects/${proj_id}/enumerators"
              payload: { full_name: "E1", languages: ["EN"], hourly_rate_cents: 3000 }
              as: SurveyAdmin
              captures: { en1_id: $.data.id }
            - call: "POST /enumerators/${en1_id}/hire"
              payload: {}
              as: SurveyAdmin
            - call: "POST /enumerators/${en1_id}/activate"
              payload: {}
              as: SurveyAdmin
            - call: "POST /assignment-areas/${area_id}/cases"
              payload: { address: "A St", respondent_language: "EN" }
              as: SurveyAdmin
              captures: { case_id: $.data.id, case_v: $.data.version }
            - call: "POST /cases/${case_id}/assignments"
              payload: { enumerator_id: "${en1_id}", expected_case_version: "${case_v}" }
              as: FieldSupervisor
            - call: "POST /cases/${case_id}/attempts"
              payload: { mode: "PHONE", window_start: "2026-03-01T10:00:00Z", window_end: "2026-03-01T10:30:00Z", disposition: "NO_ONE_HOME" }
              as: Enumerator
              as_user_id: "${en1_id}"
          trigger:
            - call: "POST /cases/${case_id}/responses"
              payload: { mode: "PHONE", language_used: "EN", duration_minutes: 20, flagged_answer_count: 0, gps_variance_meters: 0 }
              as: Enumerator
              as_user_id: "${en1_id}"
              captures: { err: $.data.error_id }
          assert:
            - "trigger response error_id == ERR_NO_CONTACT_MADE"

      - name: response_language_not_in_enumerator_languages_returns_error
        claim_type: violation_to_error
        grounds:
          - validations[priority=14]
          - errors[ERR_LANGUAGE_NOT_SUPPORTED]
        distinguishing_aspect: "language_used=ES while the capturing enumerator only speaks EN returns ERR_LANGUAGE_NOT_SUPPORTED (422)."
        test_recipe:
          setup: ["Project supporting EN,ES; E1 (languages EN only) ACTIVE; a case assigned to E1 with a CONTACT_MADE attempt."]
          setup_api_calls:
            - call: "POST /survey-projects"
              payload: { name: "Wave AA", region_code: "R1", default_language: "EN", supported_languages: ["EN", "ES"] }
              as: SurveyAdmin
              captures: { proj_id: $.data.id }
            - call: "POST /survey-projects/${proj_id}/open"
              payload: {}
              as: SurveyAdmin
            - call: "POST /survey-projects/${proj_id}/assignment-areas"
              payload: { area_code: "A1", budget_cents: 1000000 }
              as: SurveyAdmin
              captures: { area_id: $.data.id }
            - call: "POST /assignment-areas/${area_id}/open"
              payload: {}
              as: SurveyAdmin
            - call: "POST /survey-projects/${proj_id}/enumerators"
              payload: { full_name: "E1", languages: ["EN"], hourly_rate_cents: 3000 }
              as: SurveyAdmin
              captures: { en1_id: $.data.id }
            - call: "POST /enumerators/${en1_id}/hire"
              payload: {}
              as: SurveyAdmin
            - call: "POST /enumerators/${en1_id}/activate"
              payload: {}
              as: SurveyAdmin
            - call: "POST /assignment-areas/${area_id}/cases"
              payload: { address: "A St", respondent_language: "EN" }
              as: SurveyAdmin
              captures: { case_id: $.data.id, case_v: $.data.version }
            - call: "POST /cases/${case_id}/assignments"
              payload: { enumerator_id: "${en1_id}", expected_case_version: "${case_v}" }
              as: FieldSupervisor
            - call: "POST /cases/${case_id}/attempts"
              payload: { mode: "IN_PERSON", window_start: "2026-03-01T10:00:00Z", window_end: "2026-03-01T10:30:00Z", disposition: "CONTACT_MADE", mileage_miles: 0 }
              as: Enumerator
              as_user_id: "${en1_id}"
          trigger:
            - call: "POST /cases/${case_id}/responses"
              payload: { mode: "IN_PERSON", language_used: "ES", duration_minutes: 20, flagged_answer_count: 0, gps_variance_meters: 0 }
              as: Enumerator
              as_user_id: "${en1_id}"
              captures: { err: $.data.error_id }
          assert:
            - "trigger response error_id == ERR_LANGUAGE_NOT_SUPPORTED"

      - name: create_project_default_language_unsupported_returns_error
        claim_type: violation_to_error
        grounds:
          - validations[priority=6]
          - errors[ERR_UNSUPPORTED_LANGUAGE]
        distinguishing_aspect: "default_language=ZH not present in supported_languages [EN,ES] returns ERR_UNSUPPORTED_LANGUAGE (400)."
        test_recipe:
          setup: ["Empty DB."]
          setup_api_calls: []
          trigger:
            - call: "POST /survey-projects"
              payload: { name: "Wave AB", region_code: "R1", default_language: "ZH", supported_languages: ["EN", "ES"] }
              as: SurveyAdmin
              captures: { err: $.data.error_id }
          assert:
            - "trigger response error_id == ERR_UNSUPPORTED_LANGUAGE"

      - name: attempt_invalid_time_window_returns_validation
        claim_type: violation_to_error
        grounds:
          - validations[priority=5]
          - errors[ERR_VALIDATION]
        distinguishing_aspect: "An attempt whose window_end is not strictly after window_start returns ERR_VALIDATION (400)."
        test_recipe:
          setup: ["A case assigned to ACTIVE E1 in an IN_FIELD area."]
          setup_api_calls:
            - call: "POST /survey-projects"
              payload: { name: "Wave AC", region_code: "R1", default_language: "EN", supported_languages: ["EN"] }
              as: SurveyAdmin
              captures: { proj_id: $.data.id }
            - call: "POST /survey-projects/${proj_id}/open"
              payload: {}
              as: SurveyAdmin
            - call: "POST /survey-projects/${proj_id}/assignment-areas"
              payload: { area_code: "A1", budget_cents: 1000000 }
              as: SurveyAdmin
              captures: { area_id: $.data.id }
            - call: "POST /assignment-areas/${area_id}/open"
              payload: {}
              as: SurveyAdmin
            - call: "POST /survey-projects/${proj_id}/enumerators"
              payload: { full_name: "E1", languages: ["EN"], hourly_rate_cents: 3000 }
              as: SurveyAdmin
              captures: { en1_id: $.data.id }
            - call: "POST /enumerators/${en1_id}/hire"
              payload: {}
              as: SurveyAdmin
            - call: "POST /enumerators/${en1_id}/activate"
              payload: {}
              as: SurveyAdmin
            - call: "POST /assignment-areas/${area_id}/cases"
              payload: { address: "A St", respondent_language: "EN" }
              as: SurveyAdmin
              captures: { case_id: $.data.id, case_v: $.data.version }
            - call: "POST /cases/${case_id}/assignments"
              payload: { enumerator_id: "${en1_id}", expected_case_version: "${case_v}" }
              as: FieldSupervisor
          trigger:
            - call: "POST /cases/${case_id}/attempts"
              payload: { mode: "PHONE", window_start: "2026-03-01T11:00:00Z", window_end: "2026-03-01T10:00:00Z", disposition: "NO_ONE_HOME" }
              as: Enumerator
              as_user_id: "${en1_id}"
              captures: { err: $.data.error_id }
          assert:
            - "trigger response error_id == ERR_VALIDATION"

      - name: reinterview_reviewer_equals_capturer_returns_sod
        claim_type: violation_to_error
        grounds:
          - validations[priority=17]
          - errors[ERR_SEGREGATION_OF_DUTIES]
        distinguishing_aspect: "With an ACTIVE reviewer that equals the response's capturing enumerator, the referential check passes and SoD fails: ERR_SEGREGATION_OF_DUTIES (422)."
        test_recipe:
          setup: ["A CAPTURED response captured by ACTIVE E1."]
          setup_api_calls:
            - call: "POST /survey-projects"
              payload: { name: "Wave AD", region_code: "R1", default_language: "EN", supported_languages: ["EN"] }
              as: SurveyAdmin
              captures: { proj_id: $.data.id }
            - call: "POST /survey-projects/${proj_id}/open"
              payload: {}
              as: SurveyAdmin
            - call: "POST /survey-projects/${proj_id}/assignment-areas"
              payload: { area_code: "A1", budget_cents: 1000000 }
              as: SurveyAdmin
              captures: { area_id: $.data.id }
            - call: "POST /assignment-areas/${area_id}/open"
              payload: {}
              as: SurveyAdmin
            - call: "POST /survey-projects/${proj_id}/enumerators"
              payload: { full_name: "E1", languages: ["EN"], hourly_rate_cents: 3000 }
              as: SurveyAdmin
              captures: { en1_id: $.data.id }
            - call: "POST /enumerators/${en1_id}/hire"
              payload: {}
              as: SurveyAdmin
            - call: "POST /enumerators/${en1_id}/activate"
              payload: {}
              as: SurveyAdmin
            - call: "POST /assignment-areas/${area_id}/cases"
              payload: { address: "A St", respondent_language: "EN" }
              as: SurveyAdmin
              captures: { case_id: $.data.id, case_v: $.data.version }
            - call: "POST /cases/${case_id}/assignments"
              payload: { enumerator_id: "${en1_id}", expected_case_version: "${case_v}" }
              as: FieldSupervisor
            - call: "POST /cases/${case_id}/attempts"
              payload: { mode: "IN_PERSON", window_start: "2026-03-01T10:00:00Z", window_end: "2026-03-01T10:30:00Z", disposition: "CONTACT_MADE", mileage_miles: 0 }
              as: Enumerator
              as_user_id: "${en1_id}"
            - call: "POST /cases/${case_id}/responses"
              payload: { mode: "IN_PERSON", language_used: "EN", duration_minutes: 20, flagged_answer_count: 0, gps_variance_meters: 0 }
              as: Enumerator
              as_user_id: "${en1_id}"
              captures: { resp_id: $.data.id }
          trigger:
            - call: "POST /responses/${resp_id}/reinterviews"
              payload: { reviewer_enumerator_id: "${en1_id}", reason: "MANUAL" }
              as: QCReviewer
              captures: { err: $.data.error_id }
          assert:
            - "trigger response error_id == ERR_SEGREGATION_OF_DUTIES"

      - name: fraud_threshold_boundary_covered_by_difficulty
        claim_type: violation_to_error
        grounds:
          - calculations.response_fraud_score
        excluded_because:
          difficulty_instance: fraud_threshold_exact_ge
          rationale: "The fraud_score>=threshold boundary is asserted by the named §1.8 boundary_precision_check instance."

  # ------------------------------- Endpoints ----------------------------------
  - section: endpoints
    instances:
      - name: list_cases_returns_paginated_envelope
        claim_type: listing
        grounds:
          - response_envelope
          - entities.Case.fields.assignment_area_id
        distinguishing_aspect: "GET /assignment-areas/{id}/cases returns an array envelope with total_count=2 and has_more=false for two cases."
        test_recipe:
          setup: ["A DRAFT area with 2 cases."]
          setup_api_calls:
            - call: "POST /survey-projects"
              payload: { name: "Wave AE", region_code: "R1", default_language: "EN", supported_languages: ["EN"] }
              as: SurveyAdmin
              captures: { proj_id: $.data.id }
            - call: "POST /survey-projects/${proj_id}/assignment-areas"
              payload: { area_code: "A1", budget_cents: 1000000 }
              as: SurveyAdmin
              captures: { area_id: $.data.id }
            - call: "POST /assignment-areas/${area_id}/cases"
              payload: { address: "1 A St", respondent_language: "EN" }
              as: SurveyAdmin
            - call: "POST /assignment-areas/${area_id}/cases"
              payload: { address: "2 A St", respondent_language: "EN" }
              as: SurveyAdmin
          trigger:
            - call: "GET /assignment-areas/${area_id}/cases"
              payload: {}
              as: SurveyAdmin
          assert:
            - "trigger response response_type == array"
            - "trigger response meta.total_count == 2"
            - "trigger response meta.has_more == false"

      - name: create_project_success_envelope_shape
        claim_type: response_envelope
        grounds:
          - response_envelope
