              as: ProjectManager
              as_user_id: pm-01
              captures: { rnd2: $.data.id }
            - call: "POST /review-rounds/${rnd2}/votes"
              payload: { decision: "APPROVE" }
              as: Curator
              as_user_id: cur-01
            - call: "POST /review-rounds/${rnd2}/votes"
