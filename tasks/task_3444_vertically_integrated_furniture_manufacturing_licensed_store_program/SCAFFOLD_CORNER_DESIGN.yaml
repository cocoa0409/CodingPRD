              as_user_id: "${r1}"
          trigger:
            - call: "POST /api/retail-accounts/${r1}/transition"
              payload: { to_state: CLOSED }
              as: PlatformAdmin
              captures: { err: $.data.error_id }
          assert:
            - "the response is 422 with error_id == ERR_ACCOUNT_HAS_OPEN_EXPOSURE and the account stays ACTIVE"

      - name: second_active_appointment_on_same_order_rejected
        claim_type: violation_to_error
        grounds:
          - errors.ERR_APPOINTMENT_ALREADY_ACTIVE
        distinguishing_aspect: "An order supports at most one non-terminal appointment: while AP1 sits REQUESTED, AP2 for the same order is 409 ERR_APPOINTMENT_ALREADY_ACTIVE."
        test_recipe:
          setup:
            - "Clock 2026-09-01T00:00:00Z. Full home-delivery setup; order PICKED; AP1 created (REQUESTED, not yet confirmed)."
          setup_api_calls:
            - *c_clock
            - *c_factory
            - *c_line
            - *c_line_active
            - *c_licensee
            - *c_licensee_active
            - *c_terr_sea
            - *c_assign_sea
            - *c_dc
            - *c_cycle1
            - *c_hd_order
            - *c_submit_o1
            - *c_run_c1
            - *c_pick_o1
            - call: "POST /api/delivery-appointments"
              payload: { supply_order_id: "${o1}", dc_id: "${dc1}", zone: LOCAL, region_code: "T-SEA", window_start: "2026-09-10T09:00:00Z", window_end: "2026-09-10T12:00:00Z", crew_units: 1 }
              as: LicenseeManager
              as_user_id: "${l1}"
              captures: { ap1: $.data.id }
          trigger:
            - call: "POST /api/delivery-appointments"
              payload: { supply_order_id: "${o1}", dc_id: "${dc1}", zone: LOCAL, region_code: "T-SEA", window_start: "2026-09-11T09:00:00Z", window_end: "2026-09-11T12:00:00Z", crew_units: 1 }
              as: LicenseeManager
              as_user_id: "${l1}"
              captures: { err: $.data.error_id }
          assert:
            - "the second create is 409 ERR_APPOINTMENT_ALREADY_ACTIVE (AP1 is REQUESTED, a non-terminal status)"

      - name: window_in_past_rejected
        claim_type: violation_to_error
        grounds:
          - errors.ERR_WINDOW_IN_PAST
          - validations[priority=8]
        distinguishing_aspect: "window_start 2026-08-30 precedes the 2026-09-01 clock: 422 ERR_WINDOW_IN_PAST (checked before the lead-time rule)."
        test_recipe:
          setup:
            - "Clock 2026-09-01T00:00:00Z. Full home-delivery setup; order PICKED."
          setup_api_calls:
            - *c_clock
            - *c_factory
            - *c_line
            - *c_line_active
            - *c_licensee
            - *c_licensee_active
            - *c_terr_sea
            - *c_assign_sea
            - *c_dc
            - *c_cycle1
            - *c_hd_order
            - *c_submit_o1
            - *c_run_c1
            - *c_pick_o1
          trigger:
            - call: "POST /api/delivery-appointments"
              payload: { supply_order_id: "${o1}", dc_id: "${dc1}", zone: LOCAL, region_code: "T-SEA", window_start: "2026-08-30T09:00:00Z", window_end: "2026-08-30T11:00:00Z", crew_units: 1 }
              as: LicenseeManager
              as_user_id: "${l1}"
              captures: { err: $.data.error_id }
          assert:
            - "the response is 422 with error_id == ERR_WINDOW_IN_PAST"

      - name: window_duration_sixty_minutes_rejected
        claim_type: violation_to_error
        grounds:
          - errors.ERR_WINDOW_DURATION_INVALID
        distinguishing_aspect: "A window of 60 minutes (below the 120-minute floor) with otherwise valid lead time and territory is 422 ERR_WINDOW_DURATION_INVALID — isolating the duration rule."
        test_recipe:
          setup:
            - "Clock 2026-09-01T00:00:00Z. Full home-delivery setup; order PICKED."
          setup_api_calls:
            - *c_clock
            - *c_factory
            - *c_line
            - *c_line_active
            - *c_licensee
            - *c_licensee_active
            - *c_terr_sea
            - *c_assign_sea
            - *c_dc
            - *c_cycle1
            - *c_hd_order
            - *c_submit_o1
            - *c_run_c1
            - *c_pick_o1
          trigger:
            - call: "POST /api/delivery-appointments"
              payload: { supply_order_id: "${o1}", dc_id: "${dc1}", zone: LOCAL, region_code: "T-SEA", window_start: "2026-09-10T09:00:00Z", window_end: "2026-09-10T10:00:00Z", crew_units: 1 }
              as: LicenseeManager
              as_user_id: "${l1}"
              captures: { err: $.data.error_id }
          assert:
            - "the response is 422 with error_id == ERR_WINDOW_DURATION_INVALID"

      - name: fourth_territory_assignment_rejected
        claim_type: violation_to_error
        grounds:
          - errors.ERR_MAX_TERRITORIES_EXCEEDED
        distinguishing_aspect: "A licensee may hold at most 3 ASSIGNED territories: the fourth assignment is 422 ERR_MAX_TERRITORIES_EXCEEDED while the first three succeed."
        test_recipe:
          setup:
            - "Clock 2026-09-01T00:00:00Z. Licensee Summit ACTIVE; territories T-SEA, T-PDX, T-BOI, T-SPO."
          setup_api_calls:
            - *c_clock
            - *c_licensee
            - *c_licensee_active
            - *c_terr_sea
            - call: "POST /api/territories"
              payload: { region_code: "T-PDX", population_tier: SUBURBAN }
              as: PlatformAdmin
              captures: { t_pdx: $.data.id }
            - call: "POST /api/territories"
              payload: { region_code: "T-BOI", population_tier: RURAL }
              as: PlatformAdmin
              captures: { t_boi: $.data.id }
            - call: "POST /api/territories"
              payload: { region_code: "T-SPO", population_tier: RURAL }
              as: PlatformAdmin
              captures: { t_spo: $.data.id }
            - *c_assign_sea
            - call: "POST /api/territories/${t_pdx}/transition"
              payload: { to_state: ASSIGNED, licensee_id: "${l1}" }
              as: PlatformAdmin
            - call: "POST /api/territories/${t_boi}/transition"
              payload: { to_state: ASSIGNED, licensee_id: "${l1}" }
              as: PlatformAdmin
          trigger:
            - call: "POST /api/territories/${t_spo}/transition"
              payload: { to_state: ASSIGNED, licensee_id: "${l1}" }
              as: PlatformAdmin
              captures: { err: $.data.error_id }
          assert:
            - "three assignments succeed; the fourth is 422 ERR_MAX_TERRITORIES_EXCEEDED"
            - "Territory.${t_spo}.status remains OPEN"

      - name: territory_assign_to_applicant_licensee_rejected
        claim_type: violation_to_error
        grounds:
          - errors.ERR_LICENSEE_NOT_ACTIVE
        distinguishing_aspect: "Territory assignment requires licensee status ACTIVE; an APPLICANT licensee is refused with 409 ERR_LICENSEE_NOT_ACTIVE."
        test_recipe:
          setup:
            - "Clock 2026-09-01T00:00:00Z. Licensee Summit created but never activated; territory T-SEA."
          setup_api_calls:
            - *c_clock
            - *c_licensee
            - *c_terr_sea
          trigger:
            - call: "POST /api/territories/${t_sea}/transition"
              payload: { to_state: ASSIGNED, licensee_id: "${l1}" }
              as: PlatformAdmin
              captures: { err: $.data.error_id }
          assert:
            - "the response is 409 with error_id == ERR_LICENSEE_NOT_ACTIVE and the territory stays OPEN"

      - name: territory_double_assign_rejected
        claim_type: violation_to_error
        grounds:
          - errors.ERR_REGION_ALREADY_ASSIGNED
        distinguishing_aspect: "Assigning an already-ASSIGNED territory to a different ACTIVE licensee is 409 ERR_REGION_ALREADY_ASSIGNED (exclusivity)."
        test_recipe:
          setup:
            - "Clock 2026-09-01T00:00:00Z. Licensees Summit and Prairie both ACTIVE; T-SEA assigned to Summit."
          setup_api_calls:
            - *c_clock
            - *c_licensee
            - *c_licensee_active
            - call: "POST /api/licensees"
              payload: { business_name: "Prairie Furniture Co" }
              as: PlatformAdmin
              captures: { l2: $.data.id }
            - call: "POST /api/licensees/${l2}/transition"
              payload: { to_state: ACTIVE }
              as: PlatformAdmin
            - *c_terr_sea
            - *c_assign_sea
          trigger:
            - call: "POST /api/territories/${t_sea}/transition"
              payload: { to_state: ASSIGNED, licensee_id: "${l2}" }
              as: PlatformAdmin
              captures: { err: $.data.error_id }
          assert:
            - "the response is 409 with error_id == ERR_REGION_ALREADY_ASSIGNED"
            - "Territory.${t_sea}.assigned_licensee_id still equals ${l1}"

      - name: submit_against_allocated_cycle_returns_409
        claim_type: violation_to_error
        grounds:
          - errors.ERR_CYCLE_NOT_OPEN
        distinguishing_aspect: "A draft created while the cycle was OPEN cannot be submitted after run-allocation: SUBMIT re-checks cycle status and fails 409 ERR_CYCLE_NOT_OPEN."
        test_recipe:
          setup:
            - "Clock 2026-09-01T00:00:00Z. Factory, line Alder ACTIVE, licensee Summit ACTIVE; draft order created; cycle run before the order's SUBMIT."
          setup_api_calls:
            - *c_clock
            - *c_factory
            - *c_line
            - *c_line_active
            - *c_licensee
            - *c_licensee_active
            - *c_cycle1
            - *c_fr_order
            - *c_run_c1
          trigger:
            - call: "POST /api/orders/${o1}/transition"
              payload: { action: SUBMIT }
              as: LicenseeManager
              as_user_id: "${l1}"
              captures: { err: $.data.error_id }
          assert:
            - "the response is 409 with error_id == ERR_CYCLE_NOT_OPEN"
            - "SupplyOrder.${o1}.allocation_state remains UNALLOCATED"

      - name: suspended_licensee_submit_rejected
        claim_type: violation_to_error
        grounds:
          - errors.ERR_LICENSEE_NOT_ORDERABLE
        distinguishing_aspect: "A SUSPENDED licensee cannot submit: SUBMIT is 409 ERR_LICENSEE_NOT_ORDERABLE (PROBATION would still be orderable)."
        test_recipe:
          setup:
            - "Clock 2026-09-01T00:00:00Z. Factory, line Alder ACTIVE, licensee Summit activated then SUSPENDED, OPEN cycle; draft order."
          setup_api_calls:
            - *c_clock
            - *c_factory
            - *c_line
            - *c_line_active
            - *c_licensee
            - *c_licensee_active
            - call: "POST /api/licensees/${l1}/transition"
              payload: { to_state: SUSPENDED }
              as: PlatformAdmin
            - *c_cycle1
            - *c_fr_order
          trigger:
            - call: "POST /api/orders/${o1}/transition"
              payload: { action: SUBMIT }
              as: LicenseeManager
              as_user_id: "${l1}"
              captures: { err: $.data.error_id }
          assert:
            - "the response is 409 with error_id == ERR_LICENSEE_NOT_ORDERABLE"

      - name: appointment_on_dc_without_home_delivery_rejected
        claim_type: violation_to_error
        grounds:
          - errors.ERR_HOME_DELIVERY_UNSUPPORTED
        distinguishing_aspect: "DC-TUK has supports_home_delivery false: appointment create against it is 422 ERR_HOME_DELIVERY_UNSUPPORTED even with valid territory and window."
        test_recipe:
          setup:
            - "Clock 2026-09-01T00:00:00Z. Full home-delivery setup; order PICKED; second DC without home-delivery support."
          setup_api_calls:
            - *c_clock
            - *c_factory
            - *c_line
            - *c_line_active
            - *c_licensee
            - *c_licensee_active
            - *c_terr_sea
            - *c_assign_sea
            - *c_dc
            - call: "POST /api/distribution-centers"
              payload: { code: "DC-TUK", supports_home_delivery: false, region_codes: ["T-SEA"] }
              as: PlatformAdmin
              captures: { dc2: $.data.id }
            - *c_cycle1
            - *c_hd_order
            - *c_submit_o1
            - *c_run_c1
            - *c_pick_o1
          trigger:
            - call: "POST /api/delivery-appointments"
              payload: { supply_order_id: "${o1}", dc_id: "${dc2}", zone: LOCAL, region_code: "T-SEA", window_start: "2026-09-10T09:00:00Z", window_end: "2026-09-10T12:00:00Z", crew_units: 1 }
              as: LicenseeManager
              as_user_id: "${l1}"
              captures: { err: $.data.error_id }
          assert:
            - "the response is 422 with error_id == ERR_HOME_DELIVERY_UNSUPPORTED"

      - name: error_lead_time_trigger
        claim_type: violation_to_error
        grounds: [errors.ERR_LEAD_TIME_TOO_SHORT]
        excluded_because:
          difficulty_instance: lead_time_beats_window_duration_on_appointment_create
          rationale: "Asserted as the winning error of the temporal-vs-constraint priority instance."

  # ===========================================================================
  - section: rbac
    instances:
      - name: wholesale_buyer_cannot_create_product_line
        claim_type: role_denial
        grounds:
          - roles.WholesaleBuyer
          - errors.ERR_FORBIDDEN_ROLE
        distinguishing_aspect: "WholesaleBuyer is not in POST /api/product-lines roles: 403 ERR_FORBIDDEN_ROLE even with a valid payload."
        test_recipe:
          setup:
            - "Clock 2026-09-01T00:00:00Z. Retail account Metro exists."
          setup_api_calls:
            - *c_clock
            - *c_retail
          trigger:
            - call: "POST /api/product-lines"
              payload: { name: "Forbidden Line", category: BEDDING, price_point_cents: 39900, style_code: "FB-01" }
              as: WholesaleBuyer
              as_user_id: "${r1}"
              captures: { err: $.data.error_id }
          assert:
            - "the response is 403 with error_id == ERR_FORBIDDEN_ROLE and no line is persisted"

      - name: licensee_manager_cannot_run_allocation
        claim_type: role_denial
        grounds:
          - roles.LicenseeManager
          - roles.ProductionPlanner
          - errors.ERR_FORBIDDEN_ROLE
        distinguishing_aspect: "run-allocation is ProductionPlanner-exclusive: a LicenseeManager calling it (even on a cycle containing their own orders) gets 403 ERR_FORBIDDEN_ROLE."
        test_recipe:
          setup:
            - "Clock 2026-09-01T00:00:00Z. Factory, licensee Summit ACTIVE, OPEN cycle week 2026-09-07."
          setup_api_calls:
            - *c_clock
            - *c_factory
            - *c_licensee
            - *c_licensee_active
            - *c_cycle1
          trigger:
            - call: "POST /api/allocation-cycles/${c1}/run-allocation"
              payload: {}
              as: LicenseeManager
              as_user_id: "${l1}"
              captures: { err: $.data.error_id }
          assert:
            - "the response is 403 with error_id == ERR_FORBIDDEN_ROLE and the cycle stays OPEN"

      - name: licensee_cannot_cancel_other_licensees_order
        claim_type: ownership_denial
        grounds:
          - roles.LicenseeManager
          - errors.ERR_NOT_RESOURCE_OWNER
          - validations[priority=4]
        distinguishing_aspect: "Entity-backed ownership: Prairie's manager (X-User-ID == Prairie id) attempting to CANCEL Summit's order is 403 ERR_NOT_RESOURCE_OWNER — role is allowed, ownership is not."
        test_recipe:
          setup:
            - "Clock 2026-09-01T00:00:00Z. Factory, line Alder ACTIVE, licensees Summit and Prairie ACTIVE, OPEN cycle; Summit order RESERVED."
          setup_api_calls:
            - *c_clock
            - *c_factory
            - *c_line
            - *c_line_active
            - *c_licensee
            - *c_licensee_active
            - call: "POST /api/licensees"
              payload: { business_name: "Prairie Furniture Co" }
              as: PlatformAdmin
              captures: { l2: $.data.id }
            - call: "POST /api/licensees/${l2}/transition"
              payload: { to_state: ACTIVE }
              as: PlatformAdmin
            - *c_cycle1
            - *c_fr_order
            - call: "POST /api/orders/${o1}/transition"
              payload: { action: SUBMIT }
              as: LicenseeManager
              as_user_id: "${l1}"
          trigger:
            - call: "POST /api/orders/${o1}/transition"
              payload: { action: CANCEL, reason: "not mine but trying" }
              as: LicenseeManager
              as_user_id: "${l2}"
              captures: { err: $.data.error_id }
          assert:
            - "the response is 403 with error_id == ERR_NOT_RESOURCE_OWNER"
            - "SupplyOrder.${o1} remains RESERVED with fulfillment PENDING"

      - name: missing_auth_headers_returns_unauthenticated
        claim_type: auth_denial
        grounds:
          - errors.ERR_UNAUTHENTICATED
          - validations[priority=1]
        distinguishing_aspect: "A request with neither X-User-Role nor X-User-ID is 401 ERR_UNAUTHENTICATED before any role or shape check runs."
        test_recipe:
          setup:
            - "Clock 2026-09-01T00:00:00Z. Empty database."
          setup_api_calls:
            - *c_clock
          trigger:
            - call: "GET /api/licensees/00000000-0000-0000-0000-000000000000"
              payload: {}
              captures: { err: $.data.error_id }
          assert:
            - "the response is 401 with error_id == ERR_UNAUTHENTICATED (auth priority 1 beats existence priority 5)"

  # ===========================================================================
  - section: consistency_model
    instances:
      - name: terms_update_response_reflects_new_values_immediately
        claim_type: immediate_consistency
        grounds:
          - complexity_profile.consistency_model
          - concurrency_rules[licensee-terms-update]
        distinguishing_aspect: "Immediate consistency: the PUT /api/licensees/{id}/terms response body itself carries royalty_rate 0.05, the bumped version, and refreshed updated_at — no follow-up read needed."
        test_recipe:
          setup:
            - "Clock 2026-09-01T00:00:00Z. Licensee Summit created and activated."
          setup_api_calls:
            - *c_clock
            - *c_licensee
            - *c_licensee_active
            - call: "GET /api/licensees/${l1}"
              payload: {}
              as: PlatformAdmin
              captures: { l1_v: $.data.version }
          trigger:
            - call: "PUT /api/licensees/${l1}/terms"
              payload: { expected_licensee_version: "${l1_v}", royalty_rate: 0.05, merchandising_standard_version: "MS-2026.2" }
              as: PlatformAdmin
              captures: { l1_rr: $.data.royalty_rate, l1_ms: $.data.merchandising_standard_version, l1_v2: $.data.version }
          assert:
            - "the PUT response shows royalty_rate == 0.05 and merchandising_standard_version == MS-2026.2 in the same envelope"
            - "version == ${l1_v} + 1 and updated_at advanced"
