  # ===========================================================================
  # Rule 9 — compensating_invariant (3 instances, 3 conserved quantities)
  # ===========================================================================
  - rule_id: compensating_invariant
    instances:
      - name: stock_line_create_delete_conserves_quantity
        grounds:
          - calculations.stock_valuation
          - endpoints["POST /scenic/takeoff-lines"]
          - endpoints["DELETE /scenic/takeoff-lines/{lineId}"]
        distinguishing_aspect: |
          Conserved quantity: physical stock units. Pin:
          StockItem.quantity_on_hand(after create+delete pair) ==
          quantity_on_hand(before) — a STOCK line creation debits 30 (100 ->
          70) and its DELETE credits exactly the same 30 back (70 -> 100);
          any drift violates the invariant.
        test_recipe:
          setup:
            - "Shop; client; package; StockItem LUMBER_4X8 grade A qty 100 replacement 3000; DRAFT takeoff"
          setup_api_calls:
            - call: "POST /scenic/shops"
              payload: { name: "Metro Scenic", weekly_crew_hours_capacity: 100, horizon_weeks: 4, bay_count: 2, truck_fleet_size: 6, labor_rate_cents_per_hour: 8000, overtime_multiplier_bp: 15000, overhead_pct_bp: 1000, margin_pct_bp: 2000 }
              as: ShopAdmin
              captures: { shop_id: $.data.id }
            - call: "POST /scenic/clients"
              payload: { shop_id: "${shop_id}", company_name: "Northlight Productions", contact_email: "pm@northlight.example", credit_limit_cents: 100000000 }
              as: ShopAdmin
              captures: { cl_id: $.data.id }
            - call: "POST /scenic/design-packages"
              payload: { client_id: "${cl_id}", show_title: "Hamlet", venue: "Lyric Theatre", load_in_at: "2026-09-26T00:00:00Z", strike_at: "2026-10-10T00:00:00Z" }
              as: ClientPM
              as_user_id: "${cl_id}"
              captures: { pkg_id: $.data.id }
            - call: "POST /scenic/stock-items"
              payload: { shop_id: "${shop_id}", material_code: "LUMBER_4X8", condition_grade: "A", quantity_on_hand: 100, replacement_cost_cents: 3000 }
              as: ShopAdmin
              captures: { si_id: $.data.id }
            - call: "POST /scenic/takeoffs"
              payload: { design_package_id: "${pkg_id}", labor_hours_est: 10 }
              as: Estimator
              captures: { to_id: $.data.id, to_v: $.data.version }
          trigger:
            - call: "POST /scenic/takeoff-lines"
              payload: { takeoff_id: "${to_id}", expected_takeoff_version: "${to_v}", material_code: "LUMBER_4X8", quantity: 30, source: "STOCK", stock_item_id: "${si_id}" }
              as: Estimator
              captures: { line_id: $.data.id }
            - call: "GET /scenic/stock-items/${si_id}"
              payload: {}
              as: ShopAdmin
              captures: { qty_mid: $.data.quantity_on_hand }
            - call: "DELETE /scenic/takeoff-lines/${line_id}"
              payload: {}
              as: Estimator
            - call: "GET /scenic/stock-items/${si_id}"
              payload: {}
              as: ShopAdmin
              captures: { qty_end: $.data.quantity_on_hand }
          assert:
            - "after line create: StockItem.${si_id}.quantity_on_hand == 70   # 100 - 30"
            - "after line delete: StockItem.${si_id}.quantity_on_hand == 100  # invariant: create+delete conserves on-hand units"
            - "Takeoff.${to_id}.materials_subtotal_cents == 0 after the delete"

      - name: change_order_reject_conserves_production_price
        grounds:
          - state_machines.ChangeOrder.PROPOSED_to_REJECTED
          - entities.Production.fields.current_price_cents
        distinguishing_aspect: |
          Conserved quantity: production commercial terms. Pin:
          Production.current_price_cents == accepted bid price + sum of
          APPROVED CO deltas — a REJECTED CO (delta_price 135000, computed
          and pinned at creation) contributes 0; price stays 900000, deadline
          stays 2026-09-26, committed hours stay 100, applied_revision stays 1.
        test_recipe:
          setup:
            - "Production SCHEDULED (price 900000, hours 100, deadline 2026-09-26, applied_revision 1); package revision 2 uploaded"
            - "PROPOSED CO: dm 50000, dh +10, dd +2 (OPEN posture: labor 10x8000=80000; materials round(50000x1.10)=55000; rush 0 -> delta_price 135000)"
