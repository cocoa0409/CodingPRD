  # =====================================================================
  - rule_id: non_linear_state_machine
    instances:

      - name: placement_compliance_cycles_warned_billed_then_back_to_meeting_minimum
        grounds:
          - state_machines.EquipmentPlacement.MEETING_MINIMUM_to_SHORTFALL_WARNED
          - state_machines.EquipmentPlacement.SHORTFALL_WARNED_to_SHORTFALL_BILLED
          - state_machines.EquipmentPlacement.SHORTFALL_BILLED_to_MEETING_MINIMUM
          - calculations.trailing_purchase_rollup
          - entities.EquipmentPlacement.fields.compliance_status
        distinguishing_aspect: |
          Cycle on EquipmentPlacement.compliance_status: the same endpoint drives
          MEETING_MINIMUM -> SHORTFALL_WARNED -> SHORTFALL_BILLED -> MEETING_MINIMUM on one row, and
          the return hop clears shortfall_fee_cents from 35000 back to 0 while placement_status stays
          ACTIVE throughout, proving the two dimensions evolve independently.
        test_recipe:
          setup:
            - "clock at 2026-08-03T08:00:00Z; one MON route; model URN-30; one green-linked COFFEE product at 4500000 micros"
            - "one account, one planned site, one PLACEMENT asset, one LOAN placement with minimum_purchase_cents 100000"
            - "a SCHEDULED visit on 2026-08-03 09:00-09:45 already carries a requested line of 250 COFFEE units, and the clock has been moved to 2026-08-03T09:30:00Z"
            - "no visit has been completed yet, so trailing_purchase_rollup still returns 0"
          setup_api_calls:
            - call: "POST /ocs/_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-03T08:00:00Z" }
              as: ProgramAdmin
            - call: "POST /ocs/routes"
              payload: { name: "Metro MON", service_day: "MON", capacity_minutes: 480, travel_buffer_minutes: 30 }
