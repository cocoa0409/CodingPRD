            - { call: "POST /credit/financial-statements", payload: { loan_application_id: "${app1}", period_end_date: "2025-12-31", revenue_cents: 100000000, ebitda_cents: 50000000, addbacks_cents: 0, distributions_cents: 0, maintenance_capex_cents: 0, existing_annual_debt_service_cents: 0, total_assets_cents: 500000000, total_liabilities_cents: 200000000 }, as: CreditAnalyst, as_user_id: "${an}", captures: { stmt1: $.data.id } }
