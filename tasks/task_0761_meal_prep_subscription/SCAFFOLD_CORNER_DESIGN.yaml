# =============================================================================
# 1.9 Scaffold Corner Design (breadth coverage of §1.1–§1.7 testable claims)
# task_0761_meal_prep_subscription
# =============================================================================
scaffold_corner_design:

  - section: entities
    instances:
      - name: create_plan_returns_201_with_all_fields
        claim_type: Creation
        grounds: ["entities.Plan", "endpoints"]
        distinguishing_aspect: "POST /plans with all required fields returns 201 and echoes plan_code/meals_per_week/price_per_meal_cents plus system id/version=1."
        test_recipe:
          setup: ["Empty DB."]
          setup_api_calls: []
          trigger:
            - call: "POST /plans"
              payload: { plan_code: "PRO", name: "Pro", meals_per_week: 12, price_per_meal_cents: 1099 }
              as: PlatformAdmin
              captures: { plan_id: $.data.id }
          assert:
            - "response HTTP status == 201"
            - "Plan.${plan_id}.meals_per_week == 12"
            - "Plan.${plan_id}.price_per_meal_cents == 1099"
            - "Plan.${plan_id}.version == 1"

      - name: get_subscription_not_found_returns_404
        claim_type: Not Found
        grounds: ["entities.Subscription", "errors[ERR_SUBSCRIPTION_NOT_FOUND]"]
        distinguishing_aspect: "GET /subscriptions/{unknown-uuid} returns ERR_SUBSCRIPTION_NOT_FOUND with HTTP 404."
        test_recipe:
          setup: ["Empty DB."]
          setup_api_calls: []
          trigger:
            - call: "GET /subscriptions/00000000-0000-4000-8000-000000000000"
              payload: {}
              as: PlatformAdmin
              captures: { err: $.data.error_id }
          assert:
            - "response error_id == ERR_SUBSCRIPTION_NOT_FOUND"
            - "HTTP status == 404"

      - name: create_customer_missing_required_shipping_zone_returns_invalid_request
        claim_type: Required Fields
        grounds: ["entities.Customer.fields.shipping_zone_id", "errors[ERR_INVALID_REQUEST]"]
        distinguishing_aspect: "POST /customers without the required shipping_zone_id returns ERR_INVALID_REQUEST (422)."
        test_recipe:
          setup: ["Empty DB."]
          setup_api_calls: []
          trigger:
            - call: "POST /customers"
              payload: { email: "a@x.com", full_name: "Cust A" }
              as: Anonymous
              captures: { err: $.data.error_id }
          assert:
            - "response error_id == ERR_INVALID_REQUEST"
            - "HTTP status == 422"

      - name: create_customer_defaults_and_system_referral_code
        claim_type: Defaults
        grounds: ["entities.Customer.fields.allergen_exclusions", "entities.Customer.fields.referral_code", "entities.Customer.fields.wallet_credit_cents"]
        distinguishing_aspect: "Omitting allergen_exclusions yields default []; referral_code is server-minted non-empty; wallet_credit_cents defaults to 0."
        test_recipe:
          setup: ["A shipping zone exists."]
          setup_api_calls:
            - call: "POST /shipping-zones"
              payload: { zone_code: "WEST", name: "West", requires_cold_pack: true, base_shipping_fee_cents: 1000, cold_pack_fee_cents: 500, order_lead_days: 4, cutoff_time_utc: "18:00" }
              as: PlatformAdmin
              captures: { zone_id: $.data.id }
          trigger:
            - call: "POST /customers"
              payload: { email: "a@x.com", full_name: "Cust A", shipping_zone_id: "${zone_id}" }
              as: Anonymous
              captures: { cust_id: $.data.id }
          assert:
            - "Customer.${cust_id}.allergen_exclusions == []"
            - "Customer.${cust_id}.wallet_credit_cents == 0"
            - "Customer.${cust_id}.referral_code is a non-empty string"

      - name: create_credit_invalid_enum_reason_returns_invalid_enum
        claim_type: Type Constraints
        grounds: ["entities.CreditLedger.fields.reason", "errors[ERR_INVALID_ENUM]"]
        distinguishing_aspect: "POST /customers/{id}/credits with reason outside its declared set returns ERR_INVALID_ENUM (422)."
        test_recipe:
          setup: ["A customer exists."]
          setup_api_calls:
            - call: "POST /shipping-zones"
              payload: { zone_code: "WEST", name: "West", requires_cold_pack: true, base_shipping_fee_cents: 1000, cold_pack_fee_cents: 500, order_lead_days: 4, cutoff_time_utc: "18:00" }
              as: PlatformAdmin
              captures: { zone_id: $.data.id }
            - call: "POST /customers"
              payload: { email: "a@x.com", full_name: "Cust A", shipping_zone_id: "${zone_id}" }
              as: Anonymous
              captures: { cust_id: $.data.id }
          trigger:
            - call: "POST /customers/${cust_id}/credits"
              payload: { amount_cents: 500, reason: "BOGUS" }
              as: PlatformAdmin
              captures: { err: $.data.error_id }
          assert:
            - "response error_id == ERR_INVALID_ENUM"
            - "HTTP status == 422"

      - name: box_computed_cutoff_and_first_box_flag
        claim_type: Computed Fields
        grounds: ["entities.Box.fields.cutoff_at", "entities.Box.fields.is_first_box", "calculations.box_cutoff_at"]
        distinguishing_aspect: "A new box for delivery 2026-03-16 in WEST (lead 4, cutoff 18:00) has cutoff_at 2026-03-12T18:00:00Z and is_first_box true for the customer's first box."
        test_recipe:
          setup: ["PRO customer in WEST; first box created for 2026-03-16."]
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-03-01T00:00:00Z" }
              as: PlatformAdmin
            - call: "POST /shipping-zones"
              payload: { zone_code: "WEST", name: "West", requires_cold_pack: true, base_shipping_fee_cents: 1000, cold_pack_fee_cents: 500, order_lead_days: 4, cutoff_time_utc: "18:00" }
              as: PlatformAdmin
              captures: { zone_id: $.data.id }
            - call: "POST /plans"
              payload: { plan_code: "PRO", name: "Pro", meals_per_week: 12, price_per_meal_cents: 1099 }
              as: PlatformAdmin
              captures: { pro_plan_id: $.data.id }
            - call: "POST /customers"
              payload: { email: "a@x.com", full_name: "Cust A", shipping_zone_id: "${zone_id}" }
              as: Anonymous
              captures: { cust_id: $.data.id }
            - call: "POST /subscriptions"
              payload: { customer_id: "${cust_id}", plan_id: "${pro_plan_id}" }
              as: Customer
              as_user_id: "${cust_id}"
              captures: { sub_id: $.data.id }
          trigger:
            - call: "POST /subscriptions/${sub_id}/boxes"
              payload: { delivery_date: "2026-03-16" }
              as: Customer
              as_user_id: "${cust_id}"
              captures: { box_id: $.data.id }
          assert:
            - "Box.${box_id}.cutoff_at == 2026-03-12T18:00:00Z"
            - "Box.${box_id}.is_first_box == true"
            - "Box.${box_id}.fulfillment_status == OPEN"
            - "Box.${box_id}.billing_status == UNCHARGED"

      - name: create_customer_unknown_shipping_zone_returns_zone_not_found
        claim_type: Parent Relationships
        grounds: ["entities.Customer.fields.shipping_zone_id", "errors[ERR_ZONE_NOT_FOUND]"]
        distinguishing_aspect: "POST /customers whose shipping_zone_id references no ShippingZone returns ERR_ZONE_NOT_FOUND (404)."
        test_recipe:
          setup: ["Empty DB (no zones)."]
          setup_api_calls: []
          trigger:
            - call: "POST /customers"
              payload: { email: "a@x.com", full_name: "Cust A", shipping_zone_id: "00000000-0000-4000-8000-000000000000" }
              as: Anonymous
              captures: { err: $.data.error_id }
          assert:
            - "response error_id == ERR_ZONE_NOT_FOUND"
            - "HTTP status == 404"

  - section: state_machines
    instances:
      - name: ship_open_box_invalid_transition
        claim_type: Invalid Transitions
        grounds: ["state_machines.Box.LOCKED_to_SHIPPED", "errors[ERR_INVALID_STATE]"]
        distinguishing_aspect: "POST /boxes/{id}/ship on an OPEN (never-locked) box returns ERR_INVALID_STATE (409); no state changes."
        test_recipe:
          setup: ["An OPEN box exists."]
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-03-01T00:00:00Z" }
              as: PlatformAdmin
            - call: "POST /shipping-zones"
              payload: { zone_code: "WEST", name: "West", requires_cold_pack: true, base_shipping_fee_cents: 1000, cold_pack_fee_cents: 500, order_lead_days: 4, cutoff_time_utc: "18:00" }
              as: PlatformAdmin
              captures: { zone_id: $.data.id }
            - call: "POST /plans"
              payload: { plan_code: "PRO", name: "Pro", meals_per_week: 12, price_per_meal_cents: 1099 }
              as: PlatformAdmin
              captures: { pro_plan_id: $.data.id }
            - call: "POST /customers"
              payload: { email: "a@x.com", full_name: "Cust A", shipping_zone_id: "${zone_id}" }
              as: Anonymous
              captures: { cust_id: $.data.id }
            - call: "POST /subscriptions"
              payload: { customer_id: "${cust_id}", plan_id: "${pro_plan_id}" }
              as: Customer
              as_user_id: "${cust_id}"
              captures: { sub_id: $.data.id }
            - call: "POST /subscriptions/${sub_id}/boxes"
              payload: { delivery_date: "2026-03-16" }
              as: Customer
              as_user_id: "${cust_id}"
              captures: { box_id: $.data.id }
          trigger:
            - call: "POST /boxes/${box_id}/ship"
              payload: {}
              as: PlatformAdmin
              captures: { err: $.data.error_id }
          assert:
            - "response error_id == ERR_INVALID_STATE"
            - "HTTP status == 409"

      - name: cancel_subscription_twice_terminal_lockdown
        claim_type: Terminal State Lockdown
        grounds: ["state_machines.Subscription.ACTIVE_to_CANCELLED", "errors[ERR_INVALID_STATE]"]
        distinguishing_aspect: "Cancelling an already-CANCELLED subscription returns ERR_INVALID_STATE (409); CANCELLED is terminal."
        test_recipe:
          setup: ["A cancelled subscription."]
          setup_api_calls:
            - call: "POST /shipping-zones"
              payload: { zone_code: "WEST", name: "West", requires_cold_pack: true, base_shipping_fee_cents: 1000, cold_pack_fee_cents: 500, order_lead_days: 4, cutoff_time_utc: "18:00" }
              as: PlatformAdmin
              captures: { zone_id: $.data.id }
            - call: "POST /plans"
              payload: { plan_code: "PRO", name: "Pro", meals_per_week: 12, price_per_meal_cents: 1099 }
              as: PlatformAdmin
              captures: { pro_plan_id: $.data.id }
            - call: "POST /customers"
              payload: { email: "a@x.com", full_name: "Cust A", shipping_zone_id: "${zone_id}" }
              as: Anonymous
              captures: { cust_id: $.data.id }
            - call: "POST /subscriptions"
              payload: { customer_id: "${cust_id}", plan_id: "${pro_plan_id}" }
              as: Customer
              as_user_id: "${cust_id}"
              captures: { sub_id: $.data.id }
            - call: "POST /subscriptions/${sub_id}/cancel"
              payload: {}
              as: Customer
              as_user_id: "${cust_id}"
          trigger:
            - call: "POST /subscriptions/${sub_id}/cancel"
              payload: {}
              as: Customer
              as_user_id: "${cust_id}"
              captures: { err: $.data.error_id }
          assert:
            - "response error_id == ERR_INVALID_STATE"
            - "HTTP status == 409"

      - name: open_already_available_run_invalid_transition
        claim_type: Invalid Transitions
        grounds: ["state_machines.ProductionRun.SCHEDULED_to_AVAILABLE", "errors[ERR_INVALID_STATE]"]
        distinguishing_aspect: "POST /production-runs/{id}/open on a run already AVAILABLE returns ERR_INVALID_STATE (409)."
        test_recipe:
          setup: ["An opened (AVAILABLE) run."]
          setup_api_calls:
            - call: "POST /meals"
              payload: { meal_code: "M1", name: "Meal 1", protein_g: 40, carb_g: 30, fat_g: 10, calories: 400, allergens: [], dietary_tags: [] }
              as: PlatformAdmin
              captures: { m1_id: $.data.id }
            - call: "POST /production-runs"
              payload: { meal_id: "${m1_id}", delivery_date: "2026-03-16", line_code: "L1", window_start: "2026-03-14T06:00:00Z", window_end: "2026-03-14T10:00:00Z", par_total: 100 }
              as: PlatformAdmin
              captures: { run_id: $.data.id }
            - call: "POST /production-runs/${run_id}/open"
              payload: {}
              as: PlatformAdmin
          trigger:
            - call: "POST /production-runs/${run_id}/open"
              payload: {}
              as: PlatformAdmin
              captures: { err: $.data.error_id }
          assert:
            - "response error_id == ERR_INVALID_STATE"
            - "HTTP status == 409"

  - section: calculations
    instances:
      - name: free_ship_below_threshold_charges_base_shipping
        claim_type: Correct Result
        grounds: ["calculations.box_charge", "entities.Box.fields.shipping_fee_cents"]
        distinguishing_aspect: "A box with meals_count 11 (< FREE_SHIP_MIN_MEALS 12) charges shipping_fee_cents 1000; subtotal 12089, cold_pack 500, total 13589."
        test_recipe:
          setup: ["PRO customer; box for 2026-03-16 with 11 meals; locked and charged."]
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-03-01T00:00:00Z" }
              as: PlatformAdmin
            - call: "POST /shipping-zones"
              payload: { zone_code: "WEST", name: "West", requires_cold_pack: true, base_shipping_fee_cents: 1000, cold_pack_fee_cents: 500, order_lead_days: 4, cutoff_time_utc: "18:00" }
              as: PlatformAdmin
              captures: { zone_id: $.data.id }
            - call: "POST /plans"
              payload: { plan_code: "PRO", name: "Pro", meals_per_week: 12, price_per_meal_cents: 1099 }
              as: PlatformAdmin
              captures: { pro_plan_id: $.data.id }
            - call: "POST /meals"
              payload: { meal_code: "M1", name: "Meal 1", protein_g: 40, carb_g: 30, fat_g: 10, calories: 400, allergens: [], dietary_tags: [] }
              as: PlatformAdmin
              captures: { m1_id: $.data.id }
            - call: "POST /customers"
              payload: { email: "a@x.com", full_name: "Cust A", shipping_zone_id: "${zone_id}" }
              as: Anonymous
              captures: { cust_id: $.data.id }
            - call: "POST /subscriptions"
              payload: { customer_id: "${cust_id}", plan_id: "${pro_plan_id}" }
              as: Customer
              as_user_id: "${cust_id}"
              captures: { sub_id: $.data.id }
            - call: "POST /production-runs"
              payload: { meal_id: "${m1_id}", delivery_date: "2026-03-16", line_code: "L1", window_start: "2026-03-14T06:00:00Z", window_end: "2026-03-14T10:00:00Z", par_total: 100 }
              as: PlatformAdmin
              captures: { run_id: $.data.id }
            - call: "POST /production-runs/${run_id}/open"
              payload: {}
              as: PlatformAdmin
            - call: "POST /subscriptions/${sub_id}/boxes"
              payload: { delivery_date: "2026-03-16" }
              as: Customer
              as_user_id: "${cust_id}"
              captures: { box_id: $.data.id }
            - call: "POST /boxes/${box_id}/items"
              payload: { meal_id: "${m1_id}", quantity: 11 }
              as: Customer
              as_user_id: "${cust_id}"
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-03-12T18:00:00Z" }
              as: PlatformAdmin
            - call: "POST /boxes/${box_id}/lock"
              payload: {}
              as: PlatformAdmin
          trigger:
            - call: "POST /_payments/simulate"
              payload: { box_id: "${box_id}", outcome: "SUCCEEDED" }
              as: PlatformAdmin
          assert:
            - "Box.${box_id}.subtotal_cents == 12089"
            - "Box.${box_id}.shipping_fee_cents == 1000"
            - "Box.${box_id}.total_charged_cents == 13589"

      - name: box_charge_result_covered
        claim_type: Correct Result
        grounds: ["calculations.box_charge"]
        excluded_because:
          difficulty_instance: combinatorial_formula / box_charge_nested_min_credit_and_shipping_branch_mode_a
          rationale: "Free-ship branch + nested-min credit already asserted with literals by the named §1.8 instance."

      - name: referee_discount_result_covered
        claim_type: Correct Result
        grounds: ["calculations.referee_first_box_discount"]
        excluded_because:
          difficulty_instance: combinatorial_formula / referee_first_box_discount_round_per_line_then_sum_mode_b
          rationale: "Per-line rounding order asserted with literals by the named §1.8 instance."

      - name: referral_reward_result_covered
        claim_type: Variant Divergence
        grounds: ["calculations.referral_reward"]
        excluded_because:
          difficulty_instance: dual_variant_calc / referral_reward_standard_vs_premium_on_customer_domain
          rationale: "Standard vs premium reward variants asserted by the named §1.8 instance."

      - name: box_refund_result_covered
        claim_type: Variant Divergence
        grounds: ["calculations.box_refund"]
        excluded_because:
          difficulty_instance: dual_variant_calc / box_refund_pre_vs_post_ship_on_box_domain
          rationale: "Pre-ship vs post-ship refund variants asserted by the named §1.8 instance."

  - section: validations
    instances:
      - name: pagination_limit_zero_returns_invalid_pagination
        claim_type: Violation → Error
        grounds: ["validations[priority=12]", "errors[ERR_INVALID_PAGINATION]"]
        distinguishing_aspect: "GET /boxes?limit=0 returns ERR_INVALID_PAGINATION (400) since limit must be >= 1."
        test_recipe:
          setup: ["Empty DB."]
          setup_api_calls: []
          trigger:
            - call: "GET /boxes?limit=0"
              payload: {}
              as: PlatformAdmin
              captures: { err: $.data.error_id }
          assert:
            - "response error_id == ERR_INVALID_PAGINATION"
            - "HTTP status == 400"

      - name: duplicate_customer_email_returns_duplicate
        claim_type: Violation → Error
        grounds: ["entities.Customer.fields.email", "errors[ERR_DUPLICATE]"]
        distinguishing_aspect: "Registering a second customer with an email already taken returns ERR_DUPLICATE (422)."
        test_recipe:
          setup: ["A zone and one customer with email a@x.com already exist."]
          setup_api_calls:
            - call: "POST /shipping-zones"
              payload: { zone_code: "WEST", name: "West", requires_cold_pack: true, base_shipping_fee_cents: 1000, cold_pack_fee_cents: 500, order_lead_days: 4, cutoff_time_utc: "18:00" }
              as: PlatformAdmin
              captures: { zone_id: $.data.id }
            - call: "POST /customers"
              payload: { email: "a@x.com", full_name: "Cust A", shipping_zone_id: "${zone_id}" }
              as: Anonymous
          trigger:
            - call: "POST /customers"
              payload: { email: "a@x.com", full_name: "Cust A2", shipping_zone_id: "${zone_id}" }
              as: Anonymous
              captures: { err: $.data.error_id }
          assert:
            - "response error_id == ERR_DUPLICATE"
            - "HTTP status == 422"

      - name: duplicate_box_delivery_date_returns_duplicate
        claim_type: Violation → Error
        grounds: ["entities.Box.fields.delivery_date", "errors[ERR_DUPLICATE]"]
        distinguishing_aspect: "Creating a second box for the same subscription and delivery_date returns ERR_DUPLICATE (422)."
        test_recipe:
          setup: ["A subscription with one box for 2026-03-16."]
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-03-01T00:00:00Z" }
              as: PlatformAdmin
            - call: "POST /shipping-zones"
              payload: { zone_code: "WEST", name: "West", requires_cold_pack: true, base_shipping_fee_cents: 1000, cold_pack_fee_cents: 500, order_lead_days: 4, cutoff_time_utc: "18:00" }
              as: PlatformAdmin
              captures: { zone_id: $.data.id }
            - call: "POST /plans"
              payload: { plan_code: "PRO", name: "Pro", meals_per_week: 12, price_per_meal_cents: 1099 }
              as: PlatformAdmin
              captures: { pro_plan_id: $.data.id }
            - call: "POST /customers"
              payload: { email: "a@x.com", full_name: "Cust A", shipping_zone_id: "${zone_id}" }
              as: Anonymous
              captures: { cust_id: $.data.id }
            - call: "POST /subscriptions"
              payload: { customer_id: "${cust_id}", plan_id: "${pro_plan_id}" }
              as: Customer
              as_user_id: "${cust_id}"
              captures: { sub_id: $.data.id }
            - call: "POST /subscriptions/${sub_id}/boxes"
              payload: { delivery_date: "2026-03-16" }
              as: Customer
              as_user_id: "${cust_id}"
          trigger:
            - call: "POST /subscriptions/${sub_id}/boxes"
              payload: { delivery_date: "2026-03-16" }
              as: Customer
              as_user_id: "${cust_id}"
              captures: { err: $.data.error_id }
          assert:
            - "response error_id == ERR_DUPLICATE"
            - "HTTP status == 422"

      - name: add_item_after_cutoff_returns_cutoff_passed
        claim_type: Temporal validation
        grounds: ["validations[priority=5]", "errors[ERR_CUTOFF_PASSED]"]
        distinguishing_aspect: "Adding an item to a box whose cutoff has passed (clock 2026-03-13 > cutoff 2026-03-12T18:00:00Z) returns ERR_CUTOFF_PASSED via the items endpoint (distinct endpoint from the skip boundary)."
        test_recipe:
          setup: ["An OPEN box for 2026-03-16 with an opened run for M1; clock advanced past cutoff."]
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-03-01T00:00:00Z" }
              as: PlatformAdmin
            - call: "POST /shipping-zones"
              payload: { zone_code: "WEST", name: "West", requires_cold_pack: true, base_shipping_fee_cents: 1000, cold_pack_fee_cents: 500, order_lead_days: 4, cutoff_time_utc: "18:00" }
              as: PlatformAdmin
              captures: { zone_id: $.data.id }
            - call: "POST /plans"
              payload: { plan_code: "PRO", name: "Pro", meals_per_week: 12, price_per_meal_cents: 1099 }
              as: PlatformAdmin
              captures: { pro_plan_id: $.data.id }
            - call: "POST /meals"
              payload: { meal_code: "M1", name: "Meal 1", protein_g: 40, carb_g: 30, fat_g: 10, calories: 400, allergens: [], dietary_tags: [] }
              as: PlatformAdmin
              captures: { m1_id: $.data.id }
            - call: "POST /customers"
              payload: { email: "a@x.com", full_name: "Cust A", shipping_zone_id: "${zone_id}" }
              as: Anonymous
              captures: { cust_id: $.data.id }
            - call: "POST /subscriptions"
              payload: { customer_id: "${cust_id}", plan_id: "${pro_plan_id}" }
              as: Customer
              as_user_id: "${cust_id}"
              captures: { sub_id: $.data.id }
            - call: "POST /production-runs"
              payload: { meal_id: "${m1_id}", delivery_date: "2026-03-16", line_code: "L1", window_start: "2026-03-14T06:00:00Z", window_end: "2026-03-14T10:00:00Z", par_total: 100 }
              as: PlatformAdmin
              captures: { run_id: $.data.id }
            - call: "POST /production-runs/${run_id}/open"
              payload: {}
              as: PlatformAdmin
            - call: "POST /subscriptions/${sub_id}/boxes"
              payload: { delivery_date: "2026-03-16" }
              as: Customer
              as_user_id: "${cust_id}"
              captures: { box_id: $.data.id }
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-03-13T00:00:00Z" }
              as: PlatformAdmin
          trigger:
            - call: "POST /boxes/${box_id}/items"
              payload: { meal_id: "${m1_id}", quantity: 1 }
              as: Customer
              as_user_id: "${cust_id}"
              captures: { err: $.data.error_id }
          assert:
