          - errors[ERR_STALE_DOMAIN_VERSION]
        distinguishing_aspect: "The first renew advances Domain.version; a second renew still carrying the pre-renew version is rejected with 412 ERR_STALE_DOMAIN_VERSION even though a second renewal would otherwise be perfectly legal."
        test_recipe:
          setup: ["ACTIVE example.com whose version has been read once by the client."]
