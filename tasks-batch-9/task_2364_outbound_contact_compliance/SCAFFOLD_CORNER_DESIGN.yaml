  - name: suppression_entry_remove_twice_returns_state_invalid
    claim_type: Idempotency
    grounds:
    - state_machines.SuppressionEntry.ACTIVE_to_REMOVED
    - validations[priority=68]
    - errors[ERR_SUPPRESSION_ENTRY_STATE_INVALID]
    distinguishing_aspect: remove requires status ACTIVE, so a replay on a REMOVED entry returns ERR_SUPPRESSION_ENTRY_STATE_INVALID and removal_reason keeps the first call's value.
    test_recipe:
      setup:
