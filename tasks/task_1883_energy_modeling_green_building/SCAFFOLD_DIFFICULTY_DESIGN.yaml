        distinguishing_aspect: |
          Cyclic machine on CreditAttempt: UNDER_REVIEW -> CLARIFICATION_REQUESTED
          -> RESUBMITTED -> UNDER_REVIEW loops back to a previously visited state
          (a linear pipeline cannot); the ReviewComment on the attempt cycles
          OPEN -> ADDRESSED -> ACCEPTED alongside it.
