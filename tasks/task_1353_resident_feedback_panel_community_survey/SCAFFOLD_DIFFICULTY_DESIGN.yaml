            - { call: "POST /feedback-panel/panelists", payload: { external_ref: "p4@x", full_name: "P Four", age_band: "AGE_18_29", district: "D1", tenure_bucket: "RENTER", preferred_locale: "en" }, as: PanelManager, captures: { p4_id: $.data.id } }
            - { call: "POST /feedback-panel/panelists/${p1_id}/enroll", payload: {}, as: PanelManager }
