  - section: calculations
    instances:
      - name: freeze_rank_score_constants_and_cutoff
        claim_type: constants_applied
        grounds: [calculations.work_rank_score]
        distinguishing_aspect: "Constants RISK_WEIGHT/DOWNSTREAM_WEIGHT/COST_TERM applied exactly: A1 scores 5488 (5000+0+488), B1 and C1 tie at 1496 (1000+0+496) with created_at ASC tie-break; the inclusive cutoff (position <= 2) freezes B1 and defers C1."
        test_recipe:
          setup: ["turnaround PLANNING with items A1 (risk A, cost 120000), B1 (risk C, cost 40000, created first of the pair), C1 (risk C, cost 40000, created second)"]
          setup_api_calls:
            - { call: "POST /turnarounds", payload: { name: "TA-RK", plant_unit: "CRU-2", planned_start: "2026-06-10T00:00:00Z", planned_end: "2026-07-10T00:00:00Z", authorized_budget_cents: 500000, contingency_budget_cents: 100000 }, as: TurnaroundManager, captures: { t_id: "$.data.id" } }
            - { call: "POST /turnarounds/${t_id}/work-items", payload: { title: "A1", system_area: "A", work_type: "CORRECTIVE", risk_class: "A", estimated_hours: 10, estimated_cost_cents: 120000 }, as: Planner, captures: { a1_id: "$.data.id" } }
            - { call: "POST /turnarounds/${t_id}/work-items", payload: { title: "B1", system_area: "B", work_type: "PREVENTIVE", risk_class: "C", estimated_hours: 20, estimated_cost_cents: 40000 }, as: Planner, captures: { b1_id: "$.data.id" } }
            - { call: "POST /turnarounds/${t_id}/work-items", payload: { title: "C1", system_area: "C", work_type: "INSPECTION", risk_class: "C", estimated_hours: 30, estimated_cost_cents: 40000 }, as: Planner, captures: { c1_id: "$.data.id" } }
          trigger:
            - { call: "POST /turnarounds/${t_id}/freeze-scope", payload: { scope_cutoff_count: 2 }, as: TurnaroundManager }
            - { call: "GET /work-items/${a1_id}", payload: {}, as: Planner, captures: { a1s: "$.data.rank_score", a1p: "$.data.rank_position", a1st: "$.data.status" } }
            - { call: "GET /work-items/${b1_id}", payload: {}, as: Planner, captures: { b1s: "$.data.rank_score", b1p: "$.data.rank_position", b1st: "$.data.status" } }
            - { call: "GET /work-items/${c1_id}", payload: {}, as: Planner, captures: { c1s: "$.data.rank_score", c1p: "$.data.rank_position", c1st: "$.data.status" } }
          assert:
            - "A1: rank_score == 5488, rank_position == 1, status FROZEN"
            - "B1: rank_score == 1496, rank_position == 2, status FROZEN (inclusive cutoff: position 2 <= scope_cutoff_count 2)"
            - "C1: rank_score == 1496, rank_position == 3, status DEFERRED (tie with B1 broken by created_at ASC)"

      - name: critical_path_zero_float_chain
        claim_type: correct_result
        grounds: [calculations.critical_path_float, entities.WorkItem.fields.is_critical_path]
        distinguishing_aspect: "Topological float: chain X(40h) -> M(24h) -> N(16h) gives project length 80; all three chain members have total_float 0 -> is_critical_path true; unattached Y(4h) has float 76 -> false."
        test_recipe:
          setup: ["turnaround PLANNING with PROPOSED items X, M, N, Y and dependencies X->M, M->N (lag 0)"]
          setup_api_calls:
            - { call: "POST /turnarounds", payload: { name: "TA-CP", plant_unit: "CRU-2", planned_start: "2026-06-10T00:00:00Z", planned_end: "2026-07-10T00:00:00Z", authorized_budget_cents: 900000000, contingency_budget_cents: 100000 }, as: TurnaroundManager, captures: { t_id: "$.data.id" } }
            - { call: "POST /turnarounds/${t_id}/work-items", payload: { title: "X", system_area: "A", work_type: "CORRECTIVE", risk_class: "A", estimated_hours: 40, estimated_cost_cents: 80000 }, as: Planner, captures: { x_id: "$.data.id" } }
            - { call: "POST /turnarounds/${t_id}/work-items", payload: { title: "M", system_area: "A", work_type: "CORRECTIVE", risk_class: "B", estimated_hours: 24, estimated_cost_cents: 60000 }, as: Planner, captures: { m_id: "$.data.id" } }
            - { call: "POST /turnarounds/${t_id}/work-items", payload: { title: "N", system_area: "A", work_type: "CORRECTIVE", risk_class: "C", estimated_hours: 16, estimated_cost_cents: 30000 }, as: Planner, captures: { n_id: "$.data.id" } }
            - { call: "POST /turnarounds/${t_id}/work-items", payload: { title: "Y", system_area: "B", work_type: "INSPECTION", risk_class: "C", estimated_hours: 4, estimated_cost_cents: 8000 }, as: Planner, captures: { y_id: "$.data.id" } }
            - { call: "POST /work-items/${m_id}/dependencies", payload: { predecessor_work_item_id: "${x_id}", lag_hours: 0 }, as: Planner }
            - { call: "POST /work-items/${n_id}/dependencies", payload: { predecessor_work_item_id: "${m_id}", lag_hours: 0 }, as: Planner }
          trigger:
            - { call: "POST /turnarounds/${t_id}/freeze-scope", payload: { scope_cutoff_count: 4 }, as: TurnaroundManager }
            - { call: "GET /work-items/${x_id}", payload: {}, as: Planner, captures: { x_cp: "$.data.is_critical_path", x_sc: "$.data.rank_score" } }
            - { call: "GET /work-items/${y_id}", payload: {}, as: Planner, captures: { y_cp: "$.data.is_critical_path" } }
          assert:
            - "X.is_critical_path == true (and M, N likewise: single 80h chain, float 0)"
            - "Y.is_critical_path == false (path_length 4, project_length 80, float 76)"
            - "X.rank_score == 5000 + 25*2 + max(0, 500-8) == 5542 (downstream_count 2: M and N)"

