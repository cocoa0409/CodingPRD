      - name: risk_components_capped_and_dispersion_clamped
        claim_type: weighted_scoring
        grounds:
          - calculations.customer_structuring_risk_score
          - calculations.customer_structuring_risk_score.constants
          - entities.Customer.fields.structuring_risk_tier
        distinguishing_aspect: "Each component is floored individually and then capped, and the dispersion term is clamped up from a negative value: a customer with two 910539-cent settlements at one branch has a raw volume term of 72 capped to 40, a frequency term of 22, and a dispersion term of max(0, 12 * (1 - 1)) = 0, giving exactly 62 and tier ELEVATED - while a customer with no settlements at all scores 0 rather than -12."
        test_recipe:
          setup:
            - "Branch BR-LHR (SOUTH) with vault_limit_usd_cents 100000000 and a 200 x 10000 EUR position (2000000 minor, 2173913 cents, 217 bps, OPEN)."
            - "A PUBLISHED 550/450 EUR card (sell 878600) and a 920000-micro mid."
            - "Customer Ravi Chandra with a PASSPORT expiring 2030-01-01 (both deals exceed ID_REQUIRED_CENTS); customer Ana Diaz with no deals at all."
