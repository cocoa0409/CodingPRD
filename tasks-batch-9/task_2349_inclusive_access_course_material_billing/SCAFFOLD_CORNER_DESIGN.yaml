            - "FA26 OPEN. PUB-A ACTIVE (max_list_price_pct 0.60) prices T1 (list 18000, tier [1,2] -> 9000) on section ECON-101-001; PUB-B ACTIVE (max_list_price_pct 0.80) prices T3 (list 18000, tier [1,null] -> 12000) on section HIST-201-001."
