          assert:
            - "the response status is 409 and err_id == ERR_QUOTE_EXPIRED"
            - "the quote was created at 2026-09-01T00:00:00Z so expires_at == 2026-09-01T00:30:00Z — clock >= expires_at is expired"

      - name: err_method_not_allowed_on_quote
        claim_type: violation_to_error
        grounds:
          - errors.ERR_METHOD_NOT_ALLOWED
          - entities.ServiceCatalogItem.fields.allowed_methods
        distinguishing_aspect: "A CARD-only service rejects an ECHECK quote at creation with 409 ERR_METHOD_NOT_ALLOWED — the method must be a member of allowed_methods."
        test_recipe:
          setup:
            - "CF agency base chain plus a second ACTIVE CF service (code CARD-ONLY, allowed_methods [CARD], own APPROVED authorization)."
          setup_api_calls:
            - *c_clock
            - *c_agency
            - *c_account
            - *c_verify
            - *c_attest
            - *c_agency_on
            - call: "POST /portal/services"
              payload: { agency_id: "${ag_id}", service_code: "CARD-ONLY", name: "Card Only Counter Fee", fee_model: "CONVENIENCE_FEE", allowed_methods: ["CARD"], min_amount_cents: 100, max_amount_cents: 100000, gl_code: "4130" }
              as: AgencyAdmin
              as_user_id: "aa-lead"
