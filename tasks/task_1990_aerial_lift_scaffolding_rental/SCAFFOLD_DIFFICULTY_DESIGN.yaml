            - call: "GET /rental-contracts/${contract_id}"
              as: RentalCoordinator
              captures: { c_rental: $.data.rental_subtotal_cents }
          assert:
            - "record status == CERTIFIED"
            - "link 1: unit status == QUARANTINED"
            - "link 2: RESERVED line status == CANCELLED (conditional cascade caused by the quarantine, not by the certify call directly)"
            - "contract rental_subtotal_cents == 0 (CANCELLED line contributes 0)"

