          On PresentationSlot the single PRESENTED -> TALLIED arc branches: the RECOMMEND slot drives
          its submission to ADOPTED, stamps FL into its title's adopted_state_codes and locks its
          PricingProposal, while the REJECT slot on the SAME panel drives its submission to
          NOT_ADOPTED and leaves its title's adopted_state_codes empty and its proposal unlocked.
