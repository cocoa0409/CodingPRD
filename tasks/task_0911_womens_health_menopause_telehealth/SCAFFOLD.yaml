# =============================================================================
# Women's Health & Menopause Telehealth — scaffold seed tables (Expert)
# =============================================================================
scenario: |
  Women's Health & Menopause Telehealth: intake & symptom assessment, provider
  visit & HRT prescription, lab & follow-up, subscription & refill, insurance vs
  cash, care-plan messaging, specialist referral, adherence

domain_name: womens-health-menopause-telehealth
# Flat topology: peer entities linked by foreign keys; collections live at the
# root, so there is no single top-level resource prefix. Empty prefix = "/".
api_prefix: ""

complexity_profile:
  primary_archetype: compliance_audit          # HRT safety gating, lab-before-refill, contraindication clearance
  secondary_archetype: pricing_engine          # insurance-adjudicated vs cash patient responsibility
  complexity_layers:
    - dual_variant_calculation                 # estimate vs adjudicated cost; realized vs projected adherence
    - cascading_side_effects                   # lab-abnormal and refill-reverse propagation chains
    - optimistic_concurrency                   # subscription create-with-supersede on Patient.version
    - rate_threshold_triggers                  # adherence PDC bands; refills-remaining zero edge

  entity_topology: flat                         # PRIORITIZED for diversity — peers with FK references, flat URLs
  state_machine_shape: cyclic                   # Prescription ACTIVE<->SUSPENDED; Subscription ACTIVE<->PAST_DUE
  relationship_patterns:
    - one_to_many
    - cross_aggregate
    - polymorphic                               # Charge.billable_id -> Visit | Refill (resolved by billable_kind)
  role_model: peer_roles                        # Patient / Provider / BillingAdmin / CareCoordinator own distinct surfaces
  consistency_model: immediate

# =============================================================================
# 1.0 Response Envelope (FIXED — verbatim)
# =============================================================================
response_envelope:
  success: |
    { "meta": { "api_request_id": "req_xxx", "api_request_timestamp": "ISO8601" },
      "response_type": "object" | "array", "data": {} }
  error: |
    { "meta": { ... }, "response_type": "error",
      "data": { "error_id": "ERR_XXX", "message": "..." } }
  pagination_fields: ["limit", "offset", "total_count", "has_more"]
  pagination_defaults: { limit: 10, min: 1, max: 100, offset: 0 }

# =============================================================================
# 1.1 Entity-Relationship Table
# =============================================================================
entities:
  - name: Patient
    parent: null
    common_fields: true   # id, created_at, updated_at, version
    fields:
      - { name: full_name, type: string, source: input, description: "Patient legal name" }
      - { name: email, type: string, source: input, description: "Contact email (unique)" }
      - { name: date_of_birth, type: string, source: input, description: "ISO date YYYY-MM-DD" }
      - { name: state_code, type: string, source: input, description: "US state of residence, 2-letter (licensure gate)" }
      - { name: billing_mode, type: enum, source: input, description: "CASH | INSURANCE — determines charge pricing algorithm", constraints: "one of CASH, INSURANCE" }
      - { name: menopause_stage, type: enum, source: input, description: "PERIMENOPAUSE | MENOPAUSE | POSTMENOPAUSE | UNKNOWN", constraints: "one of PERIMENOPAUSE, MENOPAUSE, POSTMENOPAUSE, UNKNOWN" }

  - name: Provider
    parent: null
    common_fields: true
    fields:
      - { name: full_name, type: string, source: input, description: "Clinician name" }
      - { name: specialty, type: enum, source: input, description: "GYNECOLOGY | ENDOCRINOLOGY | FAMILY_MEDICINE", constraints: "one of GYNECOLOGY, ENDOCRINOLOGY, FAMILY_MEDICINE" }
      - { name: npi, type: string, source: input, description: "National Provider Identifier" }
      - { name: visit_fee_cents, type: integer, source: input, description: "List price of a visit in cents; becomes the VISIT charge allowed_amount_cents" }

  - name: InsurancePolicy
    parent: null
    common_fields: true
    fields:
      - { name: patient_id, type: string, source: input, description: "FK -> Patient.id; at most one policy per patient" }
      - { name: payer_name, type: string, source: input, description: "Insurer name" }
      - { name: deductible_cents, type: integer, source: input, description: "Annual deductible in cents (conserved-quantity anchor)" }
      - { name: remaining_deductible_cents, type: integer, source: computed, description: "Deductible not yet consumed; initialized to deductible_cents, decremented on charge ADJUDICATED, restored on REVERSED" }
      - { name: consumed_deductible_cents, type: integer, source: computed, default: 0, description: "Deductible consumed to date; invariant remaining_deductible_cents + consumed_deductible_cents == deductible_cents" }
      - { name: coinsurance_rate, type: number, source: input, description: "Patient coinsurance fraction after deductible, 0..1 (e.g. 0.20)" }
      - { name: out_of_pocket_max_cents, type: integer, source: input, description: "Annual out-of-pocket maximum in cents" }
      - { name: oop_accumulated_cents, type: integer, source: computed, default: 0, description: "Out-of-pocket paid to date; caps patient responsibility" }

  - name: IntakeAssessment
    parent: null
    common_fields: true
    fields:
      - { name: patient_id, type: string, source: input, description: "FK -> Patient.id" }
      - { name: symptom_ratings, type: array, source: input, description: "List of {domain, severity}; domain in VASOMOTOR|SLEEP|MOOD|GENITOURINARY|COGNITIVE, severity integer 0..10" }
      - { name: reported_conditions, type: array, source: input, description: "List of history flags; enum members BREAST_CANCER_HISTORY|VTE_HISTORY|UNDIAGNOSED_BLEEDING|STROKE_HISTORY|NONE" }
      - { name: symptom_severity_score, type: number, source: computed, description: "Weighted symptom score, 2 decimals; see calculations.symptom_severity_score" }
      - { name: has_absolute_contraindication, type: boolean, source: computed, description: "True if reported_conditions intersects the absolute-contraindication set" }
      - { name: submitted_at, type: datetime, source: computed, description: "Logical-clock instant the assessment was submitted; null while DRAFT" }
      - { name: status, type: enum, source: system, description: "DRAFT -> CLEARED | FLAGGED; FLAGGED -> CLEARED", constraints: "one of DRAFT, CLEARED, FLAGGED" }

  - name: Visit
    parent: null
    common_fields: true
    fields:
      - { name: patient_id, type: string, source: input, description: "FK -> Patient.id" }
      - { name: provider_id, type: string, source: input, description: "FK -> Provider.id" }
      - { name: intake_assessment_id, type: string, source: input, description: "FK -> IntakeAssessment.id; must be a submitted (CLEARED or FLAGGED) intake for the same patient" }
      - { name: scheduled_start, type: datetime, source: input, description: "ISO8601 slot start (inclusive)" }
      - { name: scheduled_end, type: datetime, source: input, description: "ISO8601 slot end (exclusive)" }
      - { name: visit_charge_id, type: string, source: computed, description: "Id of the VISIT Charge created on completion; null until COMPLETED" }
      - { name: status, type: enum, source: system, description: "SCHEDULED -> COMPLETED | CANCELLED", constraints: "one of SCHEDULED, COMPLETED, CANCELLED" }

  - name: Prescription
    parent: null
    common_fields: true
    fields:
      - { name: patient_id, type: string, source: system, description: "FK -> Patient.id; copied from the source visit" }
      - { name: provider_id, type: string, source: system, description: "FK -> Provider.id; the acting clinician (X-User-ID)" }
      - { name: visit_id, type: string, source: input, description: "FK -> Visit.id; must be COMPLETED" }
      - { name: care_plan_id, type: string, source: computed, description: "Id of the CarePlan auto-created with this prescription" }
      - { name: hrt_type, type: enum, source: input, description: "ESTROGEN_PATCH | ESTROGEN_ORAL | PROGESTERONE | COMBINED | VAGINAL_ESTROGEN", constraints: "one of ESTROGEN_PATCH, ESTROGEN_ORAL, PROGESTERONE, COMBINED, VAGINAL_ESTROGEN" }
      - { name: days_supply_per_fill, type: integer, source: input, description: "Days of medication each fulfilled refill covers (>=1)" }
      - { name: total_refills_authorized, type: integer, source: input, description: "Total refills the provider authorized (>=0)" }
      - { name: refills_remaining, type: integer, source: computed, description: "= total_refills_authorized - count(Refill in FULFILLED); invariant refills_remaining + FULFILLED count == total_refills_authorized" }
      - { name: lab_required_before_refill, type: boolean, source: input, description: "If true, a REVIEWED-NORMAL LabOrder is required before a refill may be APPROVED" }
      - { name: coverage_days, type: integer, source: input, description: "Length of the coverage window in days" }
      - { name: coverage_start_date, type: string, source: computed, description: "Logical-clock date at creation (YYYY-MM-DD)" }
      - { name: coverage_end_date, type: string, source: computed, description: "= coverage_start_date + coverage_days (YYYY-MM-DD)" }
      - { name: last_fill_date, type: string, source: computed, description: "Logical-clock date of most recent FULFILLED refill; null if none" }
      - { name: status, type: enum, source: system, description: "ACTIVE <-> SUSPENDED; -> DISCONTINUED | EXPIRED", constraints: "one of ACTIVE, SUSPENDED, DISCONTINUED, EXPIRED" }

  - name: LabOrder
    parent: null
    common_fields: true
    fields:
      - { name: prescription_id, type: string, source: input, description: "FK -> Prescription.id" }
      - { name: panel_type, type: enum, source: input, description: "LIPID | HORMONE | LIVER | MAMMOGRAM", constraints: "one of LIPID, HORMONE, LIVER, MAMMOGRAM" }
      - { name: result, type: enum, source: input, description: "NORMAL | ABNORMAL; null until resolved", constraints: "one of NORMAL, ABNORMAL" }
      - { name: resulted_at, type: string, source: computed, description: "Logical-clock date the order was resolved; null while PENDING" }
      - { name: status, type: enum, source: system, description: "PENDING -> REVIEWED; PENDING -> CANCELLED (cascade)", constraints: "one of PENDING, REVIEWED, CANCELLED" }

  - name: Refill
    parent: null
    common_fields: true
    fields:
      - { name: prescription_id, type: string, source: input, description: "FK -> Prescription.id" }
      - { name: days_supply, type: integer, source: computed, description: "Snapshot of prescription.days_supply_per_fill at fulfillment; contributes to adherence" }
      - { name: fill_date, type: string, source: computed, description: "Logical-clock date the refill was FULFILLED; null otherwise" }
      - { name: charge_id, type: string, source: computed, description: "Id of the REFILL Charge created on fulfillment; null until FULFILLED" }
      - { name: denial_reason, type: string, source: computed, description: "Reason string when DENIED; null otherwise" }
      - { name: status, type: enum, source: system, description: "REQUESTED -> APPROVED | DENIED; APPROVED -> FULFILLED; FULFILLED -> REVERSED", constraints: "one of REQUESTED, APPROVED, DENIED, FULFILLED, REVERSED" }

  - name: Subscription
    parent: null
    common_fields: true
    fields:
      - { name: patient_id, type: string, source: input, description: "FK -> Patient.id" }
      - { name: plan_tier, type: enum, source: input, description: "ESSENTIAL | PLUS", constraints: "one of ESSENTIAL, PLUS" }
      - { name: monthly_fee_cents, type: integer, source: computed, description: "Derived from plan_tier: ESSENTIAL=3900, PLUS=7900" }
      - { name: started_at, type: datetime, source: computed, description: "Logical-clock instant of activation" }
      - { name: status, type: enum, source: system, description: "ACTIVE <-> PAST_DUE; -> CANCELLED | SUPERSEDED", constraints: "one of ACTIVE, PAST_DUE, CANCELLED, SUPERSEDED" }

  - name: Charge
    parent: null
    common_fields: true
    fields:
      - { name: patient_id, type: string, source: system, description: "FK -> Patient.id" }
      - { name: billable_kind, type: enum, source: system, description: "VISIT | REFILL — discriminant for polymorphic billable_id", constraints: "one of VISIT, REFILL" }
      - { name: billable_id, type: string, source: system, description: "Polymorphic reference to the billed resource id; resolves to Visit.id when billable_kind=VISIT, Refill.id when billable_kind=REFILL. Not an FK-prefixed field." }
      - { name: insurance_policy_id, type: string, source: system, description: "Reference to the InsurancePolicy used for adjudication; resolved as the patient's unique policy at charge creation; null for CASH charges. Not an FK-prefixed field." }
      - { name: billing_mode, type: enum, source: system, description: "CASH | INSURANCE snapshot of patient.billing_mode at creation", constraints: "one of CASH, INSURANCE" }
      - { name: allowed_amount_cents, type: integer, source: system, description: "List/negotiated price in cents (visit_fee_cents or refill_price_cents)" }
      - { name: estimated_patient_responsibility_cents, type: integer, source: computed, description: "Provisional patient responsibility at service time; see calculations.patient_responsibility variant=estimate" }
      - { name: final_patient_responsibility_cents, type: integer, source: computed, description: "Adjudicated patient responsibility; see calculations.patient_responsibility variant=final; null until ADJUDICATED" }
      - { name: insurance_paid_cents, type: integer, source: computed, description: "= allowed_amount_cents - final_patient_responsibility_cents; null until ADJUDICATED (0 for CASH)" }
      - { name: deductible_applied_cents, type: integer, source: computed, description: "Deductible portion applied at adjudication; restored to the policy on REVERSED; null until ADJUDICATED" }
      - { name: status, type: enum, source: system, description: "ESTIMATED -> ADJUDICATED | VOID; ADJUDICATED -> REVERSED", constraints: "one of ESTIMATED, ADJUDICATED, VOID, REVERSED" }

  - name: CarePlan
    parent: null
    common_fields: true
    fields:
      - { name: patient_id, type: string, source: system, description: "FK -> Patient.id" }
      - { name: prescription_id, type: string, source: system, description: "FK -> Prescription.id; 1:1, auto-created with the prescription" }
      - { name: realized_pdc, type: number, source: computed, description: "Proportion of Days Covered from FULFILLED refills only, 4 decimals; see calculations.adherence_pdc variant=realized" }
      - { name: projected_pdc, type: number, source: computed, description: "Forward-looking PDC counting pending (REQUESTED/APPROVED) refills, 4 decimals; see calculations.adherence_pdc variant=projected" }
      - { name: adherence_status, type: enum, source: computed, description: "NON_ADHERENT if realized_pdc < 0.80; AT_RISK if 0.80 <= realized_pdc < 0.90; ADHERENT if realized_pdc >= 0.90", constraints: "one of NON_ADHERENT, AT_RISK, ADHERENT" }

  - name: CarePlanMessage
    parent: null
    common_fields: false   # append-only event log: carries only id + created_at
    fields:
      - { name: care_plan_id, type: string, source: input, description: "FK -> CarePlan.id" }
      - { name: author_kind, type: enum, source: system, description: "PATIENT | PROVIDER | CARE_COORDINATOR | SYSTEM (SYSTEM for cascade-generated notices)", constraints: "one of PATIENT, PROVIDER, CARE_COORDINATOR, SYSTEM" }
      - { name: message_type, type: enum, source: input, description: "GENERAL | ADHERENCE_OUTREACH | SUSPENSION_NOTICE | DENIAL_NOTICE", default: GENERAL, constraints: "one of GENERAL, ADHERENCE_OUTREACH, SUSPENSION_NOTICE, DENIAL_NOTICE" }
      - { name: body, type: string, source: input, description: "Message text" }

# =============================================================================
# 1.2 State Machine Table
# =============================================================================
state_machines:
  - entity: IntakeAssessment
    initial_state: DRAFT
    terminal_states: []
    transitions:
      - from: DRAFT
        to: CLEARED
        trigger: "POST /intake-assessments/{id}/submit (no absolute contraindication)"
        actor: Patient
        preconditions:
          - "Assessment is DRAFT (ERR_INTAKE_INVALID_STATE)"
          - "has_absolute_contraindication computes false"
        side_effects:
          - "compute symptom_severity_score"
          - "set submitted_at = current logical clock"
      - from: DRAFT
        to: FLAGGED
        trigger: "POST /intake-assessments/{id}/submit (absolute contraindication present)"
        actor: Patient
        preconditions:
          - "Assessment is DRAFT (ERR_INTAKE_INVALID_STATE)"
          - "has_absolute_contraindication computes true"
        side_effects:
          - "compute symptom_severity_score"
          - "set submitted_at = current logical clock"
      - from: FLAGGED
        to: CLEARED
        trigger: "POST /intake-assessments/{id}/clear"
        actor: Provider
        preconditions:
          - "Assessment is FLAGGED (ERR_INTAKE_INVALID_STATE)"
        side_effects: []

  - entity: Visit
    initial_state: SCHEDULED
    terminal_states: [COMPLETED, CANCELLED]
    transitions:
      - from: SCHEDULED
        to: COMPLETED
        trigger: "POST /visits/{id}/complete"
        actor: Provider
        preconditions:
          - "Visit is SCHEDULED (ERR_VISIT_INVALID_STATE)"
        side_effects:
          - "create Charge{billable_kind=VISIT, billable_id=visit.id, allowed_amount_cents=provider.visit_fee_cents, billing_mode=patient.billing_mode, status=ESTIMATED}"
          - "compute estimated_patient_responsibility_cents on that charge"
          - "set visit_charge_id"
      - from: SCHEDULED
        to: CANCELLED
        trigger: "POST /visits/{id}/cancel"
        actor: Patient
        preconditions:
          - "Visit is SCHEDULED (ERR_VISIT_INVALID_STATE)"
        side_effects: []

  - entity: Prescription
    initial_state: ACTIVE
    terminal_states: [DISCONTINUED, EXPIRED]
    transitions:
      - from: ACTIVE
        to: SUSPENDED
        trigger: "POST /prescriptions/{id}/suspend; OR cascade from LabOrder ABNORMAL review; OR cascade from Subscription cancel"
        actor: Provider | system
        preconditions:
          - "Prescription is ACTIVE (ERR_PRESCRIPTION_INVALID_STATE)"
        side_effects:
          - "CASCADE: every Refill of this prescription in REQUESTED status -> DENIED (denial_reason='prescription suspended'), which itself appends a SYSTEM CarePlanMessage{message_type=DENIAL_NOTICE}"
      - from: SUSPENDED
        to: ACTIVE
        trigger: "POST /prescriptions/{id}/reactivate"
        actor: Provider
        preconditions:
          - "Prescription is SUSPENDED (ERR_PRESCRIPTION_INVALID_STATE)"
          - "If lab_required_before_refill: a LabOrder for this prescription is REVIEWED with result NORMAL (ERR_LAB_REQUIRED_BEFORE_REFILL)"
          - "Patient has no Subscription in PAST_DUE (ERR_SUBSCRIPTION_PAST_DUE)"
        side_effects:
          - "append SYSTEM CarePlanMessage{message_type=GENERAL, body='prescription reactivated'}"
      - from: ACTIVE
        to: DISCONTINUED
        trigger: "POST /prescriptions/{id}/discontinue"
        actor: Provider
        preconditions:
          - "Prescription is ACTIVE or SUSPENDED (ERR_PRESCRIPTION_INVALID_STATE)"
        side_effects:
          - "CASCADE: every LabOrder of this prescription in PENDING -> CANCELLED"
          - "CASCADE: every Refill in REQUESTED or APPROVED -> DENIED (denial_reason='prescription discontinued')"
      - from: SUSPENDED
        to: DISCONTINUED
        trigger: "POST /prescriptions/{id}/discontinue"
        actor: Provider
        preconditions:
          - "Prescription is ACTIVE or SUSPENDED (ERR_PRESCRIPTION_INVALID_STATE)"
        side_effects:
          - "CASCADE: every LabOrder of this prescription in PENDING -> CANCELLED"
          - "CASCADE: every Refill in REQUESTED or APPROVED -> DENIED (denial_reason='prescription discontinued')"
      - from: ACTIVE
        to: EXPIRED
        trigger: "system: a refill request/approve is attempted after coverage_end_date"
        actor: system
        preconditions:
          - "current logical clock date > coverage_end_date"
        side_effects: []

  - entity: LabOrder
    initial_state: PENDING
    terminal_states: [REVIEWED, CANCELLED]
    transitions:
      - from: PENDING
        to: REVIEWED
        trigger: "POST /lab-orders/{id}/resolve"
        actor: Provider
        preconditions:
          - "LabOrder is PENDING (ERR_LAB_ORDER_INVALID_STATE)"
          - "result in {NORMAL, ABNORMAL} (ERR_VALIDATION)"
        side_effects:
          - "set result and resulted_at"
          - "if result==ABNORMAL and parent prescription is ACTIVE: CASCADE prescription -> SUSPENDED (which denies REQUESTED refills, which append DENIAL_NOTICE messages)"
      - from: PENDING
        to: CANCELLED
        trigger: "system: cascade from Prescription discontinue"
        actor: system
        preconditions: []
        side_effects: []

  - entity: Refill
    initial_state: REQUESTED
    terminal_states: [DENIED, REVERSED]
    transitions:
      - from: REQUESTED
        to: APPROVED
        trigger: "POST /refills/{id}/approve"
        actor: Provider
        preconditions:
          - "Refill is REQUESTED (ERR_REFILL_INVALID_STATE)"
          - "Prescription is ACTIVE (ERR_PRESCRIPTION_NOT_ACTIVE)"
          - "If prescription.lab_required_before_refill: a LabOrder for this prescription is REVIEWED with result NORMAL (ERR_LAB_REQUIRED_BEFORE_REFILL)"
        side_effects: []
      - from: REQUESTED
        to: DENIED
        trigger: "POST /refills/{id}/deny; OR cascade from prescription SUSPENDED/DISCONTINUED"
        actor: Provider | system
        preconditions:
          - "Refill is REQUESTED (ERR_REFILL_INVALID_STATE)"
        side_effects:
          - "set denial_reason"
          - "append CarePlanMessage{author_kind=SYSTEM, message_type=DENIAL_NOTICE} to the prescription's CarePlan"
      - from: APPROVED
        to: FULFILLED
        trigger: "POST /refills/{id}/fulfill"
        actor: Provider
        preconditions:
          - "Refill is APPROVED (ERR_REFILL_INVALID_STATE)"
          - "Prescription is ACTIVE (ERR_PRESCRIPTION_NOT_ACTIVE)"
        side_effects:
          - "set days_supply = prescription.days_supply_per_fill, fill_date = current clock date"
          - "prescription.refills_remaining -= 1; prescription.last_fill_date = fill_date"
          - "create Charge{billable_kind=REFILL, billable_id=refill.id, allowed_amount_cents=prescription.refill_price_cents, billing_mode=patient.billing_mode, status=ESTIMATED}; compute estimated_patient_responsibility_cents; set charge_id"
      - from: FULFILLED
        to: REVERSED
        trigger: "POST /refills/{id}/reverse"
        actor: Provider
        preconditions:
          - "Refill is FULFILLED (ERR_REFILL_INVALID_STATE)"
        side_effects:
          - "prescription.refills_remaining += 1 (restore)"
          - "CASCADE: the linked Charge (charge_id) if ESTIMATED -> VOID; if ADJUDICATED -> REVERSED, which itself restores insurance_policy.remaining_deductible_cents += deductible_applied_cents and consumed_deductible_cents -= deductible_applied_cents and oop_accumulated_cents -= final_patient_responsibility_cents"

  - entity: Subscription
    initial_state: ACTIVE
    terminal_states: [CANCELLED, SUPERSEDED]
    transitions:
      - from: ACTIVE
        to: PAST_DUE
        trigger: "POST /subscriptions/{id}/mark-past-due"
        actor: BillingAdmin
        preconditions:
          - "Subscription is ACTIVE (ERR_SUBSCRIPTION_INVALID_STATE)"
        side_effects: []
      - from: PAST_DUE
        to: ACTIVE
        trigger: "POST /subscriptions/{id}/reinstate is NOT offered; reactivation only via a fresh superseding create"
        actor: system
        preconditions: []
        side_effects: []
        note: "PAST_DUE is exited only by cancel or by being SUPERSEDED; documented for completeness, no dedicated reinstate endpoint."
      - from: ACTIVE
        to: CANCELLED
        trigger: "POST /subscriptions/{id}/cancel"
        actor: Patient
        preconditions:
          - "Subscription is ACTIVE or PAST_DUE (ERR_SUBSCRIPTION_INVALID_STATE)"
        side_effects:
          - "CASCADE: every ACTIVE Prescription of this patient -> SUSPENDED, which appends a SYSTEM CarePlanMessage{message_type=SUSPENSION_NOTICE} to each such prescription's CarePlan"
      - from: PAST_DUE
        to: CANCELLED
        trigger: "POST /subscriptions/{id}/cancel"
        actor: Patient
        preconditions:
          - "Subscription is ACTIVE or PAST_DUE (ERR_SUBSCRIPTION_INVALID_STATE)"
        side_effects:
          - "CASCADE: every ACTIVE Prescription of this patient -> SUSPENDED, which appends a SYSTEM CarePlanMessage{message_type=SUSPENSION_NOTICE} to each such prescription's CarePlan"
      - from: ACTIVE
        to: SUPERSEDED
        trigger: "system: a newer Subscription is created for the same patient via POST /subscriptions"
        actor: system
        preconditions: []
        side_effects: []
      - from: PAST_DUE
        to: SUPERSEDED
        trigger: "system: a newer Subscription is created for the same patient via POST /subscriptions"
        actor: system
        preconditions: []
        side_effects: []

  - entity: Charge
    initial_state: ESTIMATED
    terminal_states: [ADJUDICATED, VOID, REVERSED]
    transitions:
      - from: ESTIMATED
        to: ADJUDICATED
        trigger: "POST /charges/{id}/adjudicate"
        actor: BillingAdmin
        preconditions:
          - "Charge is ESTIMATED (ERR_CHARGE_INVALID_STATE)"
        side_effects:
          - "compute final_patient_responsibility_cents, insurance_paid_cents, deductible_applied_cents using the CURRENT policy state"
          - "if INSURANCE: insurance_policy.remaining_deductible_cents -= deductible_applied_cents; consumed_deductible_cents += deductible_applied_cents; oop_accumulated_cents += final_patient_responsibility_cents"
      - from: ESTIMATED
        to: VOID
        trigger: "system: cascade from Refill reverse when the charge is still ESTIMATED"
        actor: system
        preconditions: []
        side_effects: []
      - from: ADJUDICATED
        to: REVERSED
        trigger: "POST /charges/{id}/reverse; OR cascade from Refill reverse when charge is ADJUDICATED"
        actor: BillingAdmin | system
        preconditions:
          - "Charge is ADJUDICATED (ERR_CHARGE_INVALID_STATE)"
        side_effects:
          - "if INSURANCE: insurance_policy.remaining_deductible_cents += deductible_applied_cents; consumed_deductible_cents -= deductible_applied_cents; oop_accumulated_cents -= final_patient_responsibility_cents (conserved-quantity restoration)"

# =============================================================================
# 1.2.1 Concurrency Rules
# =============================================================================
concurrency_rules:
  - rule_id: subscription-create-stale-patient
    parent_entity: Patient
    write_endpoint: "POST /subscriptions"
    occ_field: "expected_patient_version"
    description: |
      Creating a Subscription for a Patient whose version has advanced since the
      client last observed it is rejected. A new subscription legitimately
      supersedes the patient's prior ACTIVE/PAST_DUE subscription and advances
      Patient.version; a create still carrying the pre-supersede version is
      operating on a stale view of the patient's membership and is refused.
    error_id: ERR_STALE_PATIENT_VERSION
    http_status: 412

# =============================================================================
# 1.3 Calculation Rules Table
# =============================================================================
calculations:
  - name: symptom_severity_score
    trigger: "IntakeAssessment submit (DRAFT -> CLEARED/FLAGGED)"
    algorithm: weighted_scoring
    formula: |
      DOMAIN_WEIGHT = { VASOMOTOR: 1.0, SLEEP: 0.833, MOOD: 0.667,
                        GENITOURINARY: 0.75, COGNITIVE: 0.6 }
      For each {domain, severity} in symptom_ratings:
        contribution = ROUND_HALF_UP(severity * DOMAIN_WEIGHT[domain], 2 decimals)
      symptom_severity_score = ROUND_HALF_UP(sum(contribution over domains), 2 decimals)
      PINNED ORDER: round EACH per-domain contribution to 2 decimals FIRST, then sum,
      then round the total to 2 decimals. (round-per-domain-then-sum, NOT sum-then-round.)
    input_set: "all symptom_ratings entries on the assessment"
    constants:
      DOMAIN_WEIGHT_VASOMOTOR: 1.0
      DOMAIN_WEIGHT_SLEEP: 0.833
      DOMAIN_WEIGHT_MOOD: 0.667
      DOMAIN_WEIGHT_GENITOURINARY: 0.75
      DOMAIN_WEIGHT_COGNITIVE: 0.6
    precision: "2 decimal places, round_half_up, per-domain then summed"

  - name: contraindication_flag
    trigger: "IntakeAssessment submit"
    algorithm: aggregation
    formula: |
      ABSOLUTE = { BREAST_CANCER_HISTORY, VTE_HISTORY, UNDIAGNOSED_BLEEDING, STROKE_HISTORY }
      has_absolute_contraindication = (reported_conditions intersect ABSOLUTE) is non-empty
      status = FLAGGED if has_absolute_contraindication else CLEARED
    input_set: "reported_conditions array on the assessment"
    constants:
      ABSOLUTE_SET: "BREAST_CANCER_HISTORY,VTE_HISTORY,UNDIAGNOSED_BLEEDING,STROKE_HISTORY"

  - name: patient_responsibility
    trigger: "Charge creation (variant=estimate) and Charge adjudicate (variant=final)"
    algorithm: tiered_pricing
    formula: |
      allowed = charge.allowed_amount_cents
      IF billing_mode == CASH:
        responsibility = ROUND_HALF_UP(allowed * (1 - CASH_DISCOUNT_RATE))   # cash pays 90%
        deductible_applied = 0; insurance_paid = 0
      ELSE (INSURANCE), using the policy fields (snapshot for estimate, CURRENT for final):
        deductible_portion   = min(remaining_deductible_cents, allowed)
        after_deductible     = allowed - deductible_portion
        coinsurance_portion  = ROUND_HALF_UP(after_deductible * coinsurance_rate)
        responsibility_pre_oop = deductible_portion + coinsurance_portion
        oop_room             = out_of_pocket_max_cents - oop_accumulated_cents
        responsibility       = min(responsibility_pre_oop, oop_room)
        deductible_applied   = deductible_portion
        insurance_paid       = allowed - responsibility
      PINNED EVALUATION ORDER: deductible first, then coinsurance on the remainder,
      then the OOP-max cap last. Nested min/max with conditional branch on billing_mode.
    input_set: "one Charge plus the patient's InsurancePolicy (INSURANCE only)"
    constants:
      CASH_DISCOUNT_RATE: 0.10
    precision: "integer cents, round_half_up on the coinsurance step"
    variants:
      - name: estimate
        when: "at Charge creation (ESTIMATED), before adjudication"
        difference: "uses the policy's remaining_deductible_cents / oop_accumulated_cents AS OF service time (snapshot). Written to estimated_patient_responsibility_cents."
      - name: final
        when: "at Charge adjudicate (ESTIMATED -> ADJUDICATED)"
        difference: "recomputes using the policy's CURRENT remaining_deductible_cents / oop_accumulated_cents, which may have shrunk because other charges adjudicated in between; diverges from estimate once the deductible is partially consumed. Written to final_patient_responsibility_cents."

  - name: adherence_pdc
    trigger: "read of a CarePlan (GET /care-plans/{id} or list); recomputed on refill fulfill/reverse"
    algorithm: aggregation
    formula: |
      elapsed_days = max(1, (current_clock_date - prescription.coverage_start_date) in days)
      supplied_realized  = sum(days_supply over Refills in FULFILLED for this prescription)
      supplied_projected = supplied_realized
                           + prescription.days_supply_per_fill * count(Refills in {REQUESTED, APPROVED})
      realized_pdc  = ROUND_HALF_UP(min(supplied_realized, elapsed_days) / elapsed_days, 4)
      projected_pdc = ROUND_HALF_UP(min(supplied_projected, elapsed_days) / elapsed_days, 4)
    input_set: "Refills of the prescription filtered by status as noted"
    precision: "4 decimal places, round_half_up"
    variants:
      - name: realized
        when: "always; drives adherence_status"
        difference: "counts only FULFILLED refills' days_supply"
      - name: projected
        when: "forward-looking adherence view"
        difference: "additionally counts pending (REQUESTED/APPROVED) refills as if they will be fulfilled at full days_supply_per_fill; diverges from realized whenever a pending refill exists"

  - name: adherence_status_band
    trigger: "CarePlan read (after adherence_pdc)"
    algorithm: threshold
    formula: |
      if realized_pdc < 0.80:                 adherence_status = NON_ADHERENT
      elif realized_pdc < 0.90:               adherence_status = AT_RISK      # 0.80 <= pdc < 0.90
      else:                                   adherence_status = ADHERENT     # pdc >= 0.90
      BOUNDARY: 0.80 is inclusive on the AT_RISK side (>=), 0.90 is inclusive on the ADHERENT side (>=).
    input_set: "realized_pdc"
    constants:
      AT_RISK_FLOOR: 0.80
      ADHERENT_FLOOR: 0.90

  - name: refill_count_invariant
    trigger: "refill fulfill (forward) and refill reverse (compensating)"
    algorithm: aggregation
    formula: |
      INVARIANT (must hold after every refill fulfill/reverse):
        prescription.refills_remaining + count(Refill where status == FULFILLED)
          == prescription.total_refills_authorized
      fulfill: refills_remaining -= 1 and the refill enters FULFILLED (net 0 change to the sum)
      reverse: refills_remaining += 1 and the refill leaves FULFILLED for REVERSED (net 0)
    input_set: "Refills of the prescription"

  - name: deductible_conservation_invariant
    trigger: "charge adjudicate (forward) and charge reverse (compensating)"
    algorithm: aggregation
    formula: |
      INVARIANT (must hold at all times on an InsurancePolicy):
        remaining_deductible_cents + consumed_deductible_cents == deductible_cents
      adjudicate: remaining -= deductible_applied; consumed += deductible_applied (net 0)
      reverse:    remaining += deductible_applied; consumed -= deductible_applied (net 0)
    input_set: "one InsurancePolicy across all its ADJUDICATED/REVERSED charges"

# =============================================================================
# 1.4 Validation Rules Table (ordered by priority)
# =============================================================================
validations:
  - priority: 1
    category: auth
    check: "X-User-ID and X-User-Role headers present and valid"
    error_id: ERR_MISSING_AUTH_CONTEXT
    http_status: 401
    applies_to: all

  - priority: 2
    category: auth
    check: "Role permitted for this operation per §1.7"
    error_id: ERR_ROLE_NOT_PERMITTED
    http_status: 403
    applies_to: all

  - priority: 3
    category: existence
    check: "All path-referenced resources exist (validated left-to-right)"
    error_id: "ERR_<RESOURCE>_NOT_FOUND"
    http_status: 404
    applies_to: all endpoints with path ids

  - priority: 4
    category: state
    check: "OCC: expected_patient_version equals Patient.version when supplied"
    error_id: ERR_STALE_PATIENT_VERSION
    http_status: 412
    applies_to: "POST /subscriptions"
    note: "checked before subscription business logic"

  - priority: 5
    category: business_referential
    check: "Request body types/enums valid; required fields present"
    error_id: ERR_VALIDATION
    http_status: 422
    applies_to: all write endpoints

  - priority: 6
    category: business_referential
    check: "Body-referenced FK resources exist and belong to the acting patient where ownership applies (e.g., intake.patient_id == path patient; visit.patient_id matches)"
    error_id: ERR_PATIENT_MISMATCH
    http_status: 422
    applies_to: "POST /visits, POST /prescriptions"

  - priority: 7
    category: state
    check: "Target resource in the correct state for the transition"
    error_id: "ERR_<RESOURCE>_INVALID_STATE"
    http_status: 409
    applies_to: "all lifecycle action endpoints"

  - priority: 8
    category: state
    check: "Refill approve/fulfill require the parent Prescription in ACTIVE"
    error_id: ERR_PRESCRIPTION_NOT_ACTIVE
    http_status: 409
    applies_to: "POST /refills/{id}/approve, POST /refills/{id}/fulfill"
    note: "CONFLICT-A high side: state check precedes the business_safety lab check (priority 10)"

  - priority: 9
    category: state
    check: "Prescription requires source Visit COMPLETED and IntakeAssessment CLEARED"
    error_id: ERR_INTAKE_NOT_CLEARED
    http_status: 409
    applies_to: "POST /prescriptions"

  - priority: 9.5
    category: state
    check: "Visit requires its IntakeAssessment be submitted (CLEARED or FLAGGED)"
    error_id: ERR_INTAKE_NOT_SUBMITTED
    http_status: 409
    applies_to: "POST /visits"

  - priority: 10
    category: business_safety
    check: "If prescription.lab_required_before_refill, a REVIEWED-NORMAL LabOrder must exist"
    error_id: ERR_LAB_REQUIRED_BEFORE_REFILL
    http_status: 409
    applies_to: "POST /refills/{id}/approve, POST /prescriptions/{id}/reactivate"
    note: "CONFLICT-A low side: yields to the state check at priority 8"

  - priority: 11
    category: business_temporal
    check: "Visit slot [scheduled_start, scheduled_end) must not overlap another SCHEDULED visit for the same provider (half-open; touching endpoints allowed)"
    error_id: ERR_PROVIDER_SLOT_OVERLAP
    http_status: 409
    applies_to: "POST /visits"
    note: "CONFLICT-B high side: precedes the subscription fiscal check (priority 13)"

  - priority: 12
    category: business_temporal
    check: "New Prescription coverage window for the same patient+hrt_type must keep a >= COVERAGE_BUFFER_DAYS(7) gap from any ACTIVE/SUSPENDED prescription window (closed intervals, buffer-inclusive)"
    error_id: ERR_COVERAGE_WINDOW_CONFLICT
    http_status: 409
    applies_to: "POST /prescriptions"

  - priority: 12.5
    category: business_temporal
    check: "IntakeAssessment must have been submitted within INTAKE_VALIDITY_DAYS(90) of the current clock at prescription creation"
    error_id: ERR_INTAKE_EXPIRED
    http_status: 409
    applies_to: "POST /prescriptions"

  - priority: 13
    category: business_constraint
    check: "Refill request requires prescription.refills_remaining >= 1"
    error_id: ERR_NO_REFILLS_REMAINING
    http_status: 409
    applies_to: "POST /prescriptions/{id}/refills"

  - priority: 13.5
    category: business_constraint
    check: "At most one InsurancePolicy per patient"
    error_id: ERR_POLICY_ALREADY_EXISTS
    http_status: 409
    applies_to: "POST /patients/{id}/insurance-policies"

  - priority: 14
    category: business_fiscal
    check: "Scheduling a Visit is refused when the patient has a Subscription in PAST_DUE"
    error_id: ERR_SUBSCRIPTION_PAST_DUE
    http_status: 402
    applies_to: "POST /visits"
    note: "CONFLICT-B low side: yields to the provider-overlap check at priority 11"

# =============================================================================
# 1.5 API Endpoint Table
# =============================================================================
endpoints:
  # --- Logical clock (test-driving) ---
  - method: POST
    path: "/_clock/set_current_utc"
    description: "Set the server logical clock. Startup default is 2026-05-01T00:00:00Z; before any call the clock reads exactly this default (never wall-clock)."
    roles: [BillingAdmin]
    code: 200
    input: [to_iso8601]
    output: null
    side_effects: ["logical clock set to to_iso8601"]

  # --- Patients ---
  - method: POST
    path: "/patients"
    description: "Register a patient"
    roles: [CareCoordinator]
    code: 201
    input: [full_name, email, date_of_birth, state_code, billing_mode, menopause_stage]
    output: Patient
    side_effects: ["version initialized to 1"]
  - method: GET
    path: "/patients/{id}"
    description: "Get a patient"
    roles: [Patient, Provider, BillingAdmin, CareCoordinator]
    code: 200
    input: []
    output: Patient
    side_effects: []

  # --- Providers ---
  - method: POST
    path: "/providers"
    description: "Register a provider"
    roles: [CareCoordinator]
    code: 201
    input: [full_name, specialty, npi, visit_fee_cents]
    output: Provider
    side_effects: []

  # --- Insurance policies (FK Patient) ---
  - method: POST
    path: "/patients/{id}/insurance-policies"
    description: "Attach an insurance policy to a patient (max one)"
    roles: [BillingAdmin]
    code: 201
    input: [payer_name, deductible_cents, coinsurance_rate, out_of_pocket_max_cents]
    output: InsurancePolicy
    side_effects: ["remaining_deductible_cents=deductible_cents; consumed_deductible_cents=0; oop_accumulated_cents=0"]
  - method: GET
    path: "/patients/{id}/insurance-policies"
    description: "List a patient's insurance policies (reverse-reachability for InsurancePolicy.patient_id)"
    roles: [Patient, Provider, BillingAdmin, CareCoordinator]
    code: 200
    input: []
    output: "InsurancePolicy[]"
    side_effects: []

  # --- Intake assessments (FK Patient) ---
  - method: POST
    path: "/patients/{id}/intake-assessments"
    description: "Create a DRAFT intake assessment"
    roles: [Patient]
    code: 201
    input: [symptom_ratings, reported_conditions]
    output: IntakeAssessment
    side_effects: ["status=DRAFT"]
  - method: POST
    path: "/intake-assessments/{id}/submit"
    description: "Submit an intake; computes score + contraindication flag, transitions to CLEARED or FLAGGED"
    roles: [Patient]
    code: 200
    input: []
    output: IntakeAssessment
    side_effects: ["compute symptom_severity_score, has_absolute_contraindication, submitted_at; status -> CLEARED|FLAGGED"]
  - method: POST
    path: "/intake-assessments/{id}/clear"
    description: "Provider clears a FLAGGED intake after review"
    roles: [Provider]
    code: 200
    input: []
    output: IntakeAssessment
    side_effects: ["status FLAGGED -> CLEARED"]
  - method: GET
    path: "/intake-assessments/{id}"
    description: "Get an intake assessment"
    roles: [Patient, Provider, BillingAdmin, CareCoordinator]
    code: 200
    input: []
    output: IntakeAssessment
    side_effects: []
  - method: GET
    path: "/patients/{id}/intake-assessments"
    description: "List a patient's intake assessments (reverse-reachability for IntakeAssessment.patient_id)"
    roles: [Patient, Provider, BillingAdmin, CareCoordinator]
    code: 200
    input: []
    output: "IntakeAssessment[]"
    side_effects: []

  # --- Visits (FK Patient, Provider, IntakeAssessment) ---
  - method: POST
    path: "/visits"
    description: "Schedule a visit"
    roles: [Patient]
    code: 201
    input: [patient_id, provider_id, intake_assessment_id, scheduled_start, scheduled_end]
    output: Visit
    side_effects: ["status=SCHEDULED"]
  - method: POST
    path: "/visits/{id}/complete"
    description: "Provider completes a visit; creates a VISIT charge"
    roles: [Provider]
    code: 200
    input: []
    output: Visit
    side_effects: ["status -> COMPLETED", "create ESTIMATED VISIT Charge", "set visit_charge_id"]
  - method: POST
    path: "/visits/{id}/cancel"
    description: "Patient cancels a scheduled visit"
    roles: [Patient]
    code: 200
    input: []
    output: Visit
    side_effects: ["status -> CANCELLED"]
  - method: GET
    path: "/visits/{id}"
    description: "Get a visit"
    roles: [Patient, Provider, BillingAdmin, CareCoordinator]
    code: 200
    input: []
    output: Visit
    side_effects: []
  - method: GET
    path: "/visits"
    description: "List/filter visits (reverse-reachability for Visit.patient_id, provider_id, intake_assessment_id)"
    roles: [Patient, Provider, BillingAdmin, CareCoordinator]
    code: 200
    input: ["patient_id?", "provider_id?", "intake_assessment_id?"]
    output: "Visit[]"
    side_effects: []

  # --- Prescriptions (FK Patient, Provider, Visit) ---
  - method: POST
    path: "/prescriptions"
    description: "Provider writes an HRT prescription from a completed visit; auto-creates a CarePlan"
    roles: [Provider]
    code: 201
    input: [visit_id, hrt_type, days_supply_per_fill, total_refills_authorized, lab_required_before_refill, coverage_days, refill_price_cents]
    output: Prescription
    side_effects: ["status=ACTIVE", "patient_id/provider_id copied", "refills_remaining=total_refills_authorized", "coverage_start_date=clock date; coverage_end_date=start+coverage_days", "create CarePlan; set care_plan_id"]
  - method: POST
    path: "/prescriptions/{id}/suspend"
    description: "Provider suspends an active prescription"
    roles: [Provider]
    code: 200
    input: ["reason?"]
    output: Prescription
    side_effects: ["status ACTIVE -> SUSPENDED", "cascade deny REQUESTED refills"]
  - method: POST
    path: "/prescriptions/{id}/reactivate"
    description: "Provider reactivates a suspended prescription"
    roles: [Provider]
    code: 200
    input: []
    output: Prescription
    side_effects: ["status SUSPENDED -> ACTIVE"]
  - method: POST
    path: "/prescriptions/{id}/discontinue"
    description: "Provider discontinues a prescription"
    roles: [Provider]
    code: 200
    input: ["reason?"]
    output: Prescription
    side_effects: ["status -> DISCONTINUED", "cancel PENDING labs", "deny open refills"]
  - method: GET
    path: "/prescriptions/{id}"
    description: "Get a prescription"
    roles: [Patient, Provider, BillingAdmin, CareCoordinator]
    code: 200
    input: []
    output: Prescription
    side_effects: []
  - method: GET
    path: "/prescriptions"
    description: "List/filter prescriptions (reverse-reachability for Prescription.patient_id, provider_id, visit_id)"
    roles: [Patient, Provider, BillingAdmin, CareCoordinator]
    code: 200
    input: ["patient_id?", "provider_id?", "visit_id?"]
    output: "Prescription[]"
    side_effects: []

  # --- Lab orders (FK Prescription) ---
  - method: POST
    path: "/prescriptions/{id}/lab-orders"
    description: "Provider orders a lab against a prescription"
    roles: [Provider]
    code: 201
    input: [panel_type]
    output: LabOrder
    side_effects: ["status=PENDING"]
  - method: POST
    path: "/lab-orders/{id}/resolve"
    description: "Provider records + reviews a lab result; ABNORMAL cascades a prescription suspension"
    roles: [Provider]
    code: 200
    input: [result]
    output: LabOrder
    side_effects: ["status PENDING -> REVIEWED", "set result, resulted_at", "if ABNORMAL and prescription ACTIVE: cascade suspend"]
  - method: GET
    path: "/lab-orders/{id}"
    description: "Get a lab order"
    roles: [Patient, Provider, BillingAdmin, CareCoordinator]
    code: 200
    input: []
    output: LabOrder
    side_effects: []
  - method: GET
    path: "/prescriptions/{id}/lab-orders"
    description: "List a prescription's lab orders (reverse-reachability for LabOrder.prescription_id)"
    roles: [Patient, Provider, BillingAdmin, CareCoordinator]
    code: 200
    input: []
    output: "LabOrder[]"
    side_effects: []

  # --- Refills (FK Prescription) ---
  - method: POST
    path: "/prescriptions/{id}/refills"
    description: "Patient requests a refill"
    roles: [Patient]
    code: 201
    input: []
    output: Refill
    side_effects: ["status=REQUESTED"]
  - method: POST
    path: "/refills/{id}/approve"
    description: "Provider approves a refill (state + lab checks)"
    roles: [Provider]
    code: 200
    input: []
    output: Refill
    side_effects: ["status REQUESTED -> APPROVED"]
  - method: POST
    path: "/refills/{id}/deny"
    description: "Provider denies a refill"
    roles: [Provider]
    code: 200
    input: ["denial_reason?"]
    output: Refill
    side_effects: ["status REQUESTED -> DENIED", "append DENIAL_NOTICE CarePlanMessage"]
  - method: POST
    path: "/refills/{id}/fulfill"
    description: "Provider fulfills an approved refill; creates a REFILL charge, decrements refills_remaining"
    roles: [Provider]
    code: 200
    input: []
    output: Refill
    side_effects: ["status APPROVED -> FULFILLED", "refills_remaining -= 1", "create ESTIMATED REFILL Charge; set charge_id", "set days_supply, fill_date, last_fill_date"]
  - method: POST
    path: "/refills/{id}/reverse"
    description: "Provider reverses a fulfilled refill; restores the refill count and voids/reverses the charge"
    roles: [Provider]
    code: 200
    input: ["reason?"]
    output: Refill
    side_effects: ["status FULFILLED -> REVERSED", "refills_remaining += 1", "cascade charge VOID/REVERSED (+ deductible restore)"]
  - method: GET
    path: "/refills/{id}"
    description: "Get a refill"
    roles: [Patient, Provider, BillingAdmin, CareCoordinator]
    code: 200
    input: []
    output: Refill
    side_effects: []
  - method: GET
    path: "/prescriptions/{id}/refills"
    description: "List a prescription's refills (reverse-reachability for Refill.prescription_id)"
    roles: [Patient, Provider, BillingAdmin, CareCoordinator]
    code: 200
    input: []
    output: "Refill[]"
    side_effects: []

  # --- Subscriptions (FK Patient) ---
  - method: POST
    path: "/subscriptions"
    description: "Create a subscription (OCC on Patient.version; supersedes prior)"
    roles: [Patient]
    code: 201
    input: [patient_id, plan_tier, expected_patient_version]
    output: Subscription
    side_effects: ["status=ACTIVE", "monthly_fee_cents from plan_tier", "prior ACTIVE/PAST_DUE subscription -> SUPERSEDED", "increments Patient.version by 1"]
  - method: POST
    path: "/subscriptions/{id}/cancel"
    description: "Patient cancels a subscription; suspends the patient's active prescriptions"
    roles: [Patient]
    code: 200
    input: []
    output: Subscription
    side_effects: ["status -> CANCELLED", "cascade suspend active prescriptions"]
  - method: POST
    path: "/subscriptions/{id}/mark-past-due"
    description: "Billing marks a subscription past due (dunning)"
    roles: [BillingAdmin]
    code: 200
    input: []
    output: Subscription
    side_effects: ["status ACTIVE -> PAST_DUE"]
  - method: GET
    path: "/subscriptions/{id}"
    description: "Get a subscription"
    roles: [Patient, Provider, BillingAdmin, CareCoordinator]
    code: 200
    input: []
    output: Subscription
    side_effects: []
  - method: GET
    path: "/patients/{id}/subscriptions"
    description: "List a patient's subscriptions (reverse-reachability for Subscription.patient_id)"
    roles: [Patient, Provider, BillingAdmin, CareCoordinator]
    code: 200
    input: []
    output: "Subscription[]"
    side_effects: []

  # --- Charges (FK Patient; created only via side effects) ---
  - method: POST
    path: "/charges/{id}/adjudicate"
    description: "Billing adjudicates an estimated charge; applies deductible/coinsurance to the policy"
    roles: [BillingAdmin]
    code: 200
    input: []
    output: Charge
    side_effects: ["status ESTIMATED -> ADJUDICATED", "compute final_patient_responsibility_cents, insurance_paid_cents, deductible_applied_cents", "apply to policy"]
  - method: POST
    path: "/charges/{id}/reverse"
    description: "Billing reverses an adjudicated charge; restores the policy deductible"
    roles: [BillingAdmin]
    code: 200
    input: ["reason?"]
    output: Charge
    side_effects: ["status ADJUDICATED -> REVERSED", "restore remaining_deductible_cents/consumed/oop"]
  - method: GET
    path: "/charges/{id}"
    description: "Get a charge"
    roles: [Patient, Provider, BillingAdmin, CareCoordinator]
    code: 200
    input: []
    output: Charge
    side_effects: []
  - method: GET
    path: "/charges"
    description: "List/filter charges (reverse-reachability for Charge.patient_id; billable_id filter for polymorphic lookup)"
    roles: [Patient, Provider, BillingAdmin, CareCoordinator]
    code: 200
    input: ["patient_id?", "billable_id?"]
    output: "Charge[]"
    side_effects: []

  # --- Care plans (FK Patient, Prescription; auto-created) ---
  - method: GET
    path: "/care-plans/{id}"
    description: "Get a care plan (computes realized_pdc, projected_pdc, adherence_status on read)"
    roles: [Patient, Provider, BillingAdmin, CareCoordinator]
    code: 200
    input: []
    output: CarePlan
    side_effects: []
  - method: GET
    path: "/care-plans"
    description: "List/filter care plans (reverse-reachability for CarePlan.patient_id and CarePlan.prescription_id)"
    roles: [Patient, Provider, BillingAdmin, CareCoordinator]
    code: 200
    input: ["patient_id?", "prescription_id?"]
    output: "CarePlan[]"
    side_effects: []

  # --- Care-plan messages (FK CarePlan; append-only) ---
  - method: POST
    path: "/care-plans/{id}/messages"
    description: "Append a message to a care plan"
    roles: [Patient, Provider, CareCoordinator]
    code: 201
    input: [body, "message_type?"]
    output: CarePlanMessage
    side_effects: ["author_kind derived from X-User-Role"]
  - method: GET
    path: "/care-plans/{id}/messages"
    description: "List a care plan's messages (reverse-reachability for CarePlanMessage.care_plan_id)"
    roles: [Patient, Provider, BillingAdmin, CareCoordinator]
    code: 200
    input: []
    output: "CarePlanMessage[]"
    side_effects: []

