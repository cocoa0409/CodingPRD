    side_effects: ["status -> CLOSED", "balance_at_closure_cents / refundable_computed_cents snapshot", "RefundRequest created iff refundable > 0 (latest_refund_request_id set)", "else CLOSURE_FEE ledger entry zeroes the balance"]
  - method: POST
