            - "MilestoneBuild.${gold_build_id}.build_number == 1 (the rejected attempt never consumed the number)"
            - "after trigger call 2: Milestone.${m1_id}.status == UNDER_REVIEW and latest_build_number == 1"
            - "DevelopmentAgreement.${agreement_id}.status == ACTIVE"

      - name: royalty_statement_with_empty_revenue_lines_and_uncapped_cost_claim
        grounds:
          - calculations.royalty_settlement
          - calculations.royalty_settlement.constants.MIN_REVENUE_LINES
          - entities.RoyaltyStatement.fields.distributable_total_cents
          - entities.RoyaltyStatement.fields.cost_deduction_cents
          - entities.DevelopmentAgreement.fields.unrecouped_advance_cents
          - state_machines.RoyaltyStatement.DRAFT_to_FINALIZED
        distinguishing_aspect: |
          revenue_lines == [] drives distributable_total_cents to 0, which is the denominator of the
          PROVISIONAL per-line pro-ration: the statement must report 0 across the board (cost cap 0,
          so a 1000000 cost claim is fully disallowed) rather than dividing by zero or letting the
          claim create a negative recoupment base. Finalizing the empty statement must leave the
          3420000 advance completely unrecouped and recoupment_state at RECOUPING.
