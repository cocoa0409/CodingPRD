        setup:
        - Logical clock at 2026-08-05T09:00:00.000Z.
        - Empty database - no MeetingEvent exists.
        setup_api_calls:
        - call: POST /_clock/set_current_utc
          payload: {current_utc: '2026-08-05T09:00:00.000Z'}
          as: ProgramAdmin
        trigger:
        - call: POST /sourcing/events
