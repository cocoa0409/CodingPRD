              captures: { ch_v1: "$.data.version" }
            - call: "POST /upfit/chassis/${ch}/quarantine"
              payload: { quarantine_reason: "cab paint blister found in receiving" }
              as: PlantAdmin
              as_user_id: "adm-1"
              captures: { ch_v2: "$.data.version" }
            - call: "POST /upfit/upfit-orders"
              payload: { order_number: "UO-2401", order_type: "CUSTOMER_SPECIFIC", customer_id: "${cust}", build_configuration_id: "${cfg}", body_mount_offset_from_front_axle_in: 120, required_payload_lb: 5000, requested_in_service_date: "2026-09-15" }
