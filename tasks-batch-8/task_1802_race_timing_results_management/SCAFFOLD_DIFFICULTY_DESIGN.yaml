        grounds:
          - state_machines.Race.FINALIZED_to_AMENDMENT_OPEN
          - state_machines.Race.AMENDMENT_OPEN_to_PROVISIONAL_PUBLISHED
          - state_machines.Race.PROVISIONAL_PUBLISHED_to_FINALIZED
          - concurrency_rules[correction-adjudication-stale-race]
        distinguishing_aspect: |
          Cyclic machine on Race (not a linear pipeline): FINALIZED ->
          AMENDMENT_OPEN -> PROVISIONAL_PUBLISHED -> FINALIZED completes a full
          amendment loop; amendment_count == 1 and the Result revisits OFFICIAL
          with revision 2 and chip_time_ms 1860000 after the 60s correction.
        test_recipe:
          setup:
            - "Single-finisher 10km race R1: START 07:00:05, SPLIT5k 07:15:05, FINISH 07:30:05 (chip 1800000, gun 1805000)"
            - "Published at 09:00:00, finalized at 09:30:00 (window equality, inclusive); Result OFFICIAL, Award OVERALL_M p1 CONFIRMED"
