  # =====================================================================
  # Section: validations
  # =====================================================================
  - section: validations
    instances:
      - name: get_property_unauthenticated_returns_401
        claim_type: violation_to_error
        grounds: ["validations[priority=1]", "errors[ERR_UNAUTHENTICATED]"]
        distinguishing_aspect: "Missing role identity short-circuits everything, including existence checks (a nonexistent id still yields 401 first)."
        test_recipe:
          setup: ["Empty database"]
          setup_api_calls: []
          trigger:
            - { call: "GET /api/oreo-properties/11111111-2222-3333-4444-555555555555", payload: {}, as: Anonymous, captures: { err: $.data.error_id } }
          assert:
            - "err == ERR_UNAUTHENTICATED (HTTP 401), not ERR_NOT_FOUND — priority 1 beats priority 4"

      - name: appraiser_cannot_certify_appraisal_forbidden
        claim_type: violation_to_error
        grounds: ["validations[priority=2]", roles.ChiefAppraiser, "errors[ERR_FORBIDDEN]"]
        distinguishing_aspect: "Certify is exclusive to ChiefAppraiser; an Appraiser-role caller is rejected at priority 2."
        test_recipe:
