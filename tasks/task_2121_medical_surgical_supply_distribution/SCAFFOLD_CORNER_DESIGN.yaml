          - errors[ERR_NO_ACTIVE_CONTRACT_PRICE]
        distinguishing_aspect: "An ACTIVE contract whose member_class_scope is NON_ACUTE never enters the candidate set for an ACUTE room, so the line write fails with ERR_NO_ACTIVE_CONTRACT_PRICE 422 even though a price for the item exists."
