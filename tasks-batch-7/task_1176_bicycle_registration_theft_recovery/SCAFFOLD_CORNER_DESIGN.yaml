        distinguishing_aspect: "Exactly one non-CANCELLED auction per intake: second create fails ERR_AUCTION_ALREADY_EXISTS (intake also no longer UNCLAIMED — the existence error is reported because the already-exists constraint is evaluated first in the constraint cluster)."
