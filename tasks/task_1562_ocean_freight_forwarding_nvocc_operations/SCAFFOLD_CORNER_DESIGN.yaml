        claim_type: violation_to_error
        grounds:
          - validations[priority=6]
          - errors[ERR_SHIPPER_SUSPENDED]
          - state_machines.Shipper
        distinguishing_aspect: "Manual suspension flips the create gate: the same payload that succeeded while ACTIVE fails with ERR_SHIPPER_SUSPENDED while SUSPENDED, and succeeds again after reinstate."
        test_recipe:
          setup: ["Shipper created then manually SUSPENDED; tariff/contract/voyage ready"]
          setup_api_calls:
            - { call: "POST /freight/shippers", payload: { legal_name: "ACME SUS", credit_limit_cents: 100000000 }, as: OperationsManager, captures: { s: $.data.id } }
