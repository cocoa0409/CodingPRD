            - "after_add == 20"
            - "after_release == 0"

      - name: slice_bound_device_count_bind_unbind_conserves
        grounds:
          - entities.NetworkSlice.fields.bound_device_count
          - state_machines.NetworkSlice
        distinguishing_aspect: |
          Conserved quantity = NetworkSlice.bound_device_count. Invariant:
          count_after(bind) - count_before == 1; then count_after(unbind)
          == count_before. Different conserved quantity from the spectrum
          MHz invariant.
        test_recipe:
          setup:
            - "Site OPERATIONAL; slice ACTIVATED with bound_device_count=0; ACTIVE Device ready"
          setup_api_calls:
            - call: "POST /private-wireless/enterprises"
              payload: { legal_name: "CI2 Co", erp_account_code: "CI2-001", industry_vertical: "VENUE", security_posture: "STANDARD" }
              as: NetworkArchitect
              captures: { ent_id: $.data.id }
            - call: "POST /private-wireless/enterprises/${ent_id}/activate"
              payload: {}
              as: NetworkArchitect
            - call: "POST /private-wireless/enterprises/${ent_id}/sites"
              payload: { site_code: "CI2", address: "2 CI", geo_latitude: 40.0, geo_longitude: -75.0, site_area_sqm: 2000, target_capacity_mbps: 500, target_availability_pct: 99.9 }
              as: NetworkArchitect
              captures: { site_id: $.data.id }
            - call: "POST /private-wireless/sites/${site_id}/slices"
              payload: { slice_name: "S", slice_type: "EMBB", guaranteed_bandwidth_mbps: 100, max_latency_ms: 50, max_devices: 10 }
              as: NetworkArchitect
              captures: { slice_id: $.data.id }
          trigger:
            - call: "GET /private-wireless/sites/${site_id}/slices/${slice_id}"
              payload: {}
              as: NetworkArchitect
              captures: { count_before: $.data.bound_device_count }
          assert:
            - "count_before == 0"
            - "After bind: count == 1"
            - "After unbind: count == 0"
