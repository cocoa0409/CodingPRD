          cost_per_kg_cents: 850
        as: DesignEngineer
        captures:
          ms_id: $.data.id
      trigger:
      - call: POST /spring-designs
        payload:
          program_id: 11111111-1111-4111-8111-111111111111
          material_spec_id: ${ms_id}
          part_number: D1
