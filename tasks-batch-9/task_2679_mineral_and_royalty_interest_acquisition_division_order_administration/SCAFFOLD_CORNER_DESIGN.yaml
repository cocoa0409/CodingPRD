# 4. VALIDATIONS
# ===========================================================================
- section: validations
  instances:

  - name: unit_capacity_exact_equality_accepted_then_next_acre_oversubscribes
    claim_type: Satisfaction → Pass
    grounds:
    - validations[priority=80]
    - errors[ERR_UNIT_ACREAGE_OVERSUBSCRIBED]
    - calculations.unit_acreage_conservation_invariant
    distinguishing_aspect: "The capacity check is inclusive at equality: 320.0000 + 960.0000 == 1280.0000 is accepted and drives unallocated_acres to exactly 0.0000, while the very next allocation of 0.0001 acres is rejected with ERR_UNIT_ACREAGE_OVERSUBSCRIBED (422)."
    test_recipe:
      setup:
      - "logical clock at its default 2026-08-01T00:00:00Z"
      - "three CERTIFIED tracts and one Unit of 1280.0000 acres owned by op-user-001"
      setup_api_calls:
      - call: "POST /tracts"
        payload: { county: "Reeves", state_code: "TX", gross_acres: 640.0000, operator_activity_tier: "HIGH" }
        as: TitleAnalyst
        captures: { v1t1: $.data.id }
      - call: "POST /tracts/${v1t1}/title-chain-entries"
        payload: { instrument_type: "PATENT", instrument_date: "1902-05-01", conveyed_fraction: 1.0, county_book_page: "100/1", grantor_name: "United States", grantee_name: "A Patentee" }
        as: TitleAnalyst
      - call: "POST /tracts/${v1t1}/certify-title"
        payload: {}
        as: TitleAnalyst
      - call: "POST /tracts"
        payload: { county: "Reeves", state_code: "TX", gross_acres: 1280.0000, operator_activity_tier: "MODERATE" }
        as: TitleAnalyst
        captures: { v1t2: $.data.id }
      - call: "POST /tracts/${v1t2}/title-chain-entries"
        payload: { instrument_type: "PATENT", instrument_date: "1903-06-02", conveyed_fraction: 1.0, county_book_page: "101/2", grantor_name: "United States", grantee_name: "E Patentee" }
        as: TitleAnalyst
      - call: "POST /tracts/${v1t2}/certify-title"
        payload: {}
        as: TitleAnalyst
      - call: "POST /tracts"
        payload: { county: "Reeves", state_code: "TX", gross_acres: 320.0000, operator_activity_tier: "LOW" }
        as: TitleAnalyst
        captures: { v1t3: $.data.id }
      - call: "POST /tracts/${v1t3}/title-chain-entries"
        payload: { instrument_type: "PATENT", instrument_date: "1904-07-03", conveyed_fraction: 1.0, county_book_page: "102/3", grantor_name: "United States", grantee_name: "F Patentee" }
        as: TitleAnalyst
      - call: "POST /tracts/${v1t3}/certify-title"
        payload: {}
        as: TitleAnalyst
      - call: "POST /units"
        payload: { unit_name: "Reeves Unit 31H", formation: "Wolfcamp", state_code: "TX", unit_gross_acres: 1280.0000, royalty_rate_cap: 0.2500, producing_depth_count: 2, total_depth_count: 3 }
        as: Operator
        as_user_id: "op-user-001"
        captures: { v1u: $.data.id }
      trigger:
      - call: "POST /unit-tract-allocations"
        payload: { unit_id: "${v1u}", tract_id: "${v1t1}", allocated_acres: 320.0000, effective_from: "2026-01-01", effective_to: "2028-01-01", pooling_election: "POOLED" }
        as: Operator
        as_user_id: "op-user-001"
      - call: "POST /unit-tract-allocations"
        payload: { unit_id: "${v1u}", tract_id: "${v1t2}", allocated_acres: 960.0000, effective_from: "2026-01-01", effective_to: "2028-01-01", pooling_election: "POOLED" }
        as: Operator
        as_user_id: "op-user-001"
      - call: "POST /unit-tract-allocations"
        payload: { unit_id: "${v1u}", tract_id: "${v1t3}", allocated_acres: 0.0001, effective_from: "2026-01-01", effective_to: "2028-01-01", pooling_election: "POOLED" }
        as: Operator
        as_user_id: "op-user-001"
      assert:
      - "the first two calls return HTTP 201"
      - "after the second call Unit.${v1u}.unallocated_acres == 0.0000 and active_allocation_count == 2"
      - "the third call returns HTTP 422 with data.error_id == ERR_UNIT_ACREAGE_OVERSUBSCRIBED"
      - "Unit.${v1u}.unallocated_acres is still 0.0000 and active_allocation_count is still 2 after the rejection"

