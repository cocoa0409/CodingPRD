  code: 200
  input: []
  output: SalvageBatch
  side_effects: []
- method: POST
  path: /streetlights/salvage-batches/{id}/items
  description: Move an unbatched SalvageItem into an ACCUMULATING batch, declaring weight/mercury
  roles:
  - ProgramManager
  code: 200
  input:
  - salvage_item_id
  - weight_lbs?
  - mercury_flag?
  output: SalvageItem
  side_effects:
  - item.batch_id := batch; weight_lbs/mercury_flag recorded; batch aggregates recomputed
- method: GET
  path: /streetlights/salvage-items
  description: List salvage items; filterable (batch_id=null filter via 'batch_id' param value 'null'); sorted by created_at ASC
  roles:
  - ProgramManager
  - FieldSupervisor
  - QaInspector
  - BillingAnalyst
  - ComplianceOfficer
  - CitizenReporter
  - Auditor
  code: 200
  input:
  - batch_id?
  - pole_id?
  - fixture_class?
  - limit?
  - offset?
  output: SalvageItem[]
  side_effects: []
- method: GET
  path: /streetlights/salvage-items/{id}
  description: Get one salvage item
  roles:
  - ProgramManager
  - FieldSupervisor
  - QaInspector
  - BillingAnalyst
  - ComplianceOfficer
  - CitizenReporter
  - Auditor
  code: 200
  input: []
  output: SalvageItem
  side_effects: []
- method: POST
  path: /streetlights/salvage-batches/{id}/seal
  description: ACCUMULATING -> SEALED (requires >= 1 item); records contaminated_flag
  roles:
  - ComplianceOfficer
  code: 200
  input:
  - contaminated_flag
  output: SalvageBatch
  side_effects:
  - contaminated_flag stored
- method: POST
  path: /streetlights/salvage-batches/{id}/manifest
  description: SEALED -> MANIFESTED; computes settlement_value_cents
  roles:
  - ComplianceOfficer
  code: 200
  input: []
  output: SalvageBatch
  side_effects:
  - manifest_code minted; salvage_settlement_value computed
- method: POST
  path: /streetlights/salvage-batches/{id}/settle
  description: MANIFESTED -> SETTLED; credits program budget
  roles:
  - BillingAnalyst
  code: 200
  input: []
  output: SalvageBatch
  side_effects:
  - program.budget_balance_cents += settlement_value_cents; program.version += 1
- method: POST
  path: /streetlights/salvage-batches/{id}/reject
  description: SEALED|MANIFESTED -> REJECTED; items return to unbatched pool
  roles:
  - ComplianceOfficer
  code: 200
  input: []
  output: SalvageBatch
  side_effects:
  - items batch_id := null; settlement_value_cents := null; program pending_salvage_item_count recomputed
- method: POST
  path: /streetlights/savings-reports
  description: 'Create a report (OCC: expected_program_version required); supersedes prior DRAFT/REJECTED report of same period'
  roles:
  - ProgramManager
  code: 201
  input:
  - program_id
  - period
  - method
  - fiscal_year_label
  - expected_program_version
  output: SavingsReport
  side_effects:
  - prior DRAFT/REJECTED report for (program, period) -> SUPERSEDED; kwh/credit fields computed; increments ConversionProgram.version by 1; ERR_REPORT_PERIOD_FINALIZED when an ATTESTED report exists for
    the period
- method: GET
  path: /streetlights/savings-reports
  description: List reports; filterable; sorted by created_at ASC
  roles:
  - ProgramManager
  - FieldSupervisor
  - QaInspector
  - BillingAnalyst
  - ComplianceOfficer
  - CitizenReporter
  - Auditor
  code: 200
  input:
  - program_id?
  - period?
  - status?
  - limit?
  - offset?
  output: SavingsReport[]
  side_effects: []
- method: GET
  path: /streetlights/savings-reports/{id}
  description: Get one report
  roles:
  - ProgramManager
  - FieldSupervisor
  - QaInspector
  - BillingAnalyst
  - ComplianceOfficer
  - CitizenReporter
  - Auditor
  code: 200
  input: []
  output: SavingsReport
  side_effects: []
- method: POST
  path: /streetlights/savings-reports/{id}/submit
  description: DRAFT -> SUBMITTED; requires all program accounts past report.period
  roles:
  - ProgramManager
  code: 200
  input: []
  output: SavingsReport
  side_effects:
  - submitted_by_user_id recorded
- method: POST
  path: /streetlights/savings-reports/{id}/attest
  description: SUBMITTED -> ATTESTED (SoD vs submitter); capped credit posted to budget
  roles:
  - Auditor
  code: 200
  input: []
  output: SavingsReport
  side_effects:
  - incentive_rebate_credit computed; program.budget_balance_cents credited; program.version += 1
- method: POST
  path: /streetlights/savings-reports/{id}/reject
  description: SUBMITTED -> REJECTED (SoD vs submitter)
  roles:
  - Auditor
  code: 200
  input: []
  output: SavingsReport
  side_effects: []
- method: POST
  path: /streetlights/savings-reports/{id}/revise
  description: REJECTED -> DRAFT; computed fields refreshed
  roles:
  - ProgramManager
  code: 200
  input: []
  output: SavingsReport
  side_effects:
  - kwh/credit recomputed; submitted_by_user_id cleared
- method: POST
  path: /streetlights/compliance-exceptions
  description: Request a CCT_WAIVER or CONVERSION_EXEMPTION for a pole
  roles:
  - ProgramManager
  code: 201
  input:
  - pole_id
  - exception_kind
  - requested_cct_kelvin?
  - valid_until
  output: ComplianceException
  side_effects:
  - ERR_EXCEPTION_WINDOW_PAST when valid_until < current date
- method: GET
  path: /streetlights/compliance-exceptions
  description: List exceptions; filterable
  roles:
  - ProgramManager
  - FieldSupervisor
  - QaInspector
  - BillingAnalyst
  - ComplianceOfficer
  - CitizenReporter
  - Auditor
  code: 200
  input:
  - pole_id?
  - exception_kind?
  - status?
  - limit?
  - offset?
  output: ComplianceException[]
  side_effects: []
- method: GET
  path: /streetlights/compliance-exceptions/{id}
  description: Get one exception
  roles:
  - ProgramManager
  - FieldSupervisor
  - QaInspector
  - BillingAnalyst
  - ComplianceOfficer
  - CitizenReporter
  - Auditor
  code: 200
  input: []
  output: ComplianceException
  side_effects: []
- method: POST
  path: /streetlights/compliance-exceptions/{id}/approve
  description: REQUESTED -> APPROVED; CONVERSION_EXEMPTION requires pole AUDIT_CLEARED and exempts it
  roles:
  - ComplianceOfficer
  code: 200
  input: []
  output: ComplianceException
  side_effects:
  - 'CONVERSION_EXEMPTION: pole AUDIT_CLEARED -> EXEMPT'
- method: POST
  path: /streetlights/compliance-exceptions/{id}/deny
  description: REQUESTED -> DENIED
  roles:
  - ComplianceOfficer
  code: 200
  input: []
  output: ComplianceException
  side_effects: []
- method: POST
  path: /streetlights/compliance-exceptions/{id}/refresh
  description: Materialize APPROVED -> EXPIRED once current date > valid_until
  roles:
  - ProgramManager
  - FieldSupervisor
  - QaInspector
  - BillingAnalyst
  - ComplianceOfficer
  - CitizenReporter
  - Auditor
  code: 200
  input: []
  output: ComplianceException
  side_effects:
  - ERR_EXCEPTION_NOT_EXPIRED when not yet past valid_until
- method: POST
  path: /_clock/set_current_utc
  description: Set the server's logical clock (ISO8601 UTC). Default before any set call is exactly 2026-08-01T00:00:00Z; the logical clock NEVER falls back to wall-clock time.
  roles:
  - ProgramManager
  code: 200
  input:
  - to_iso8601
  output:
    current_utc: string
  side_effects:
  - all date/datetime derivations (periods, SLA, in-service dates, window checks) read this clock
errors:
- id: ERR_UNAUTHENTICATED
  http: 401
  condition: X-User-Role or X-User-ID header missing, or role not declared
- id: ERR_INVALID_REQUEST
  http: 400
  condition: 'Malformed body: missing required field, type mismatch, invalid enum, bad ISO date, window_end_date < window_start_date, weight_lbs <= 0 or with > 1 decimal when provided, retire effective_until
    <= effective_from or < current date'
- id: ERR_FORBIDDEN
  http: 403
  condition: Role not permitted on endpoint, or ownership identity mismatch (crew/reporter)
- id: ERR_SEGREGATION_OF_DUTIES
  http: 403
  condition: QC decider == work-order completer, or report attester/rejecter == report submitter
- id: ERR_STALE_VERSION
  http: 412
  condition: expected_pole_version != Pole.version (audit create) or expected_program_version != ConversionProgram.version (report create)
- id: ERR_PROGRAM_NOT_FOUND
  http: 404
  condition: program id does not exist
- id: ERR_DISTRICT_NOT_FOUND
  http: 404
  condition: district id does not exist
- id: ERR_POLE_NOT_FOUND
  http: 404
  condition: pole id does not exist
- id: ERR_AUDIT_NOT_FOUND
  http: 404
  condition: audit id does not exist
- id: ERR_CREW_NOT_FOUND
  http: 404
  condition: crew id does not exist
- id: ERR_ROUTE_NOT_FOUND
  http: 404
  condition: route id does not exist
- id: ERR_STOP_NOT_FOUND
  http: 404
  condition: route-stop id does not exist
- id: ERR_WORK_ORDER_NOT_FOUND
  http: 404
  condition: work-order id does not exist
- id: ERR_RATE_SCHEDULE_NOT_FOUND
  http: 404
  condition: rate-schedule id does not exist
- id: ERR_ACCOUNT_NOT_FOUND
  http: 404
  condition: tariff-account id does not exist
- id: ERR_BILLING_LINE_NOT_FOUND
  http: 404
  condition: billing-line id does not exist
- id: ERR_TICKET_NOT_FOUND
  http: 404
  condition: outage-ticket id does not exist
- id: ERR_BATCH_NOT_FOUND
  http: 404
  condition: salvage-batch id does not exist
- id: ERR_SALVAGE_ITEM_NOT_FOUND
  http: 404
  condition: salvage-item id does not exist
- id: ERR_REPORT_NOT_FOUND
  http: 404
  condition: savings-report id does not exist
- id: ERR_EXCEPTION_NOT_FOUND
  http: 404
  condition: compliance-exception id does not exist
- id: ERR_PROGRAM_NOT_ACTIVE
  http: 409
  condition: Child-resource mutation while program is DRAFT or CLOSED
- id: ERR_POLE_NOT_AUDIT_CLEARED
  http: 409
  condition: Stop-add requires pole AUDIT_CLEARED; CONVERSION_EXEMPTION approval requires pole AUDIT_CLEARED
- id: ERR_POLE_EXEMPT
  http: 409
  condition: Operation not permitted on an EXEMPT pole (audit submit/accept, outage ticket create, stop-add)
- id: ERR_AUDIT_NOT_SUBMITTED
  http: 409
  condition: accept/dispute requires audit SUBMITTED; resubmit requires DISPUTED
- id: ERR_ROUTE_NOT_PLANNED
  http: 409
  condition: stop-add / release require route PLANNED
- id: ERR_ROUTE_SUSPENDED
  http: 409
  condition: work-order dispatch while route SUSPENDED
- id: ERR_ROUTE_NOT_SUSPENDED
  http: 409
  condition: resume requires route SUSPENDED; suspend requires IN_PROGRESS
- id: ERR_ROUTE_STILL_BLOCKED
  http: 409
  condition: resume while blocked_stop_count * 2 >= stop_count
- id: ERR_ROUTES_STILL_ACTIVE
  http: 409
  condition: program close with any route not in {CLOSED, CANCELLED}
- id: ERR_STOP_NOT_PENDING
  http: 409
  condition: skip requires stop PENDING (with no DISPATCHED/COMPLETED linked work order)
- id: ERR_STOP_BLOCKED
  http: 409
  condition: dispatch of a work order whose linked stop is BLOCKED
- id: ERR_WORK_ORDER_NOT_DISPATCHABLE
  http: 409
  condition: dispatch requires execution_status PENDING or REWORK_PENDING
- id: ERR_WORK_ORDER_NOT_COMPLETABLE
  http: 409
  condition: complete/fail require execution_status DISPATCHED
- id: ERR_WORK_ORDER_NOT_CANCELLABLE
  http: 409
  condition: cancel requires execution_status PENDING, DISPATCHED, or REWORK_PENDING
- id: ERR_QC_NOT_AWAITING
  http: 409
  condition: qc-pass/qc-fail require execution COMPLETED with qc_status AWAITING_QC
- id: ERR_ACCOUNT_NOT_OPEN
  http: 409
  condition: generate-lines/close-period require account OPEN (not FROZEN)
- id: ERR_TICKET_NOT_OPEN
  http: 409
  condition: triage requires status OPEN or REOPENED
- id: ERR_TICKET_NOT_TRIAGED
  http: 409
  condition: dispatch requires status TRIAGED
- id: ERR_TICKET_NOT_DISPATCHED
  http: 409
  condition: resolve requires status DISPATCHED
- id: ERR_TICKET_NOT_RESOLVED
  http: 409
  condition: verify/reopen require status RESOLVED
- id: ERR_BATCH_NOT_ACCUMULATING
  http: 409
  condition: item-add/seal require batch ACCUMULATING
- id: ERR_BATCH_NOT_SEALED
  http: 409
  condition: manifest requires batch SEALED
- id: ERR_BATCH_NOT_MANIFESTED
  http: 409
  condition: settle requires batch MANIFESTED
- id: ERR_REPORT_NOT_DRAFT
  http: 409
  condition: 'submit/revise: submit requires DRAFT; revise requires REJECTED'
- id: ERR_REPORT_NOT_SUBMITTED
  http: 409
  condition: attest/reject require SUBMITTED
- id: ERR_EXCEPTION_NOT_PENDING
  http: 409
  condition: approve/deny require REQUESTED
- id: ERR_EXCEPTION_NOT_EXPIRED
  http: 409
  condition: refresh requires current date > valid_until on an APPROVED exception
- id: ERR_RATE_SCHEDULE_NOT_DRAFT
  http: 409
  condition: file requires DRAFT
- id: ERR_RATE_SCHEDULE_NOT_FILED
  http: 409
  condition: activate requires FILED
- id: ERR_RATE_SCHEDULE_NOT_EFFECTIVE
  http: 409
  condition: retire requires EFFECTIVE
- id: ERR_CCT_EXCEEDS_ZONE_CAP
  http: 422
  condition: new_cct_kelvin > district cct_cap_kelvin and no covering APPROVED unexpired CCT_WAIVER
- id: ERR_SHIELDING_REQUIRED
  http: 422
  condition: district full_cutoff_required (RESIDENTIAL/RURAL) and shielding != FULL_CUTOFF
- id: ERR_ROUTE_WINDOW_OVERLAP
  http: 409
  condition: Crew already has a non-CANCELLED route whose CLOSED window shares a calendar day
- id: ERR_RATE_WINDOW_OVERLAP
  http: 409
  condition: HALF-OPEN window overlaps a FILED/EFFECTIVE schedule of the same (program, ownership_class)
- id: ERR_ROUTE_WINDOW_PAST
  http: 422
  condition: stop-add when route.window_start_date < current date
- id: ERR_EXCEPTION_WINDOW_PAST
  http: 422
  condition: valid_until < current date at exception creation or approval
- id: ERR_REOPEN_WINDOW_EXPIRED
  http: 422
  condition: reopen after resolved_at + 72 hours
- id: ERR_DUPLICATE_POLE_NUMBER
  http: 409
  condition: pole_number already exists within the program
- id: ERR_DUPLICATE_ACCOUNT
  http: 409
  condition: an OPEN/FROZEN account already exists for (district_id, ownership_class)
- id: ERR_DUPLICATE_SEQUENCE
  http: 409
  condition: sequence_number already used on this route
- id: ERR_DUPLICATE_STOP
  http: 409
  condition: pole already holds a PENDING stop on a non-terminal route
- id: ERR_ROUTE_CAPACITY_EXCEEDED
  http: 422
  condition: candidate stop violates shift-fit (required_shifts > window_days) or stop-rate (ceil(stops/required_shifts) > crew.base_stops_per_shift)
- id: ERR_EMPTY_ROUTE
  http: 422
  condition: release with stop_count == 0
- id: ERR_ACTIVE_WORK_ORDER_EXISTS
  http: 409
  condition: another DISPATCHED work order exists for the same pole
- id: ERR_INSUFFICIENT_WATTAGE_REDUCTION
  http: 422
  condition: new_fixture_wattage * 5 > pole.effective_wattage * 4 (less than 20% reduction)
- id: ERR_AUDIT_ALREADY_PENDING
  http: 409
  condition: pole already has a SUBMITTED audit
- id: ERR_EMPTY_BATCH
  http: 422
  condition: seal with item_count == 0
- id: ERR_UNWEIGHED_ITEMS
  http: 422
  condition: manifest with any item weight_lbs == 0
- id: ERR_REPORT_PERIOD_FINALIZED
  http: 409
  condition: an ATTESTED report already exists for (program, period)
- id: ERR_REPORT_PERIOD_OPEN
  http: 409
  condition: submit while any program account has current_period <= report.period or ESTIMATED lines in report.period
- id: ERR_NO_EFFECTIVE_RATE_SCHEDULE
  http: 422
  condition: generate-lines finds no EFFECTIVE/SUPERSEDED schedule window covering the period start for some eligible pole's ownership class
- id: ERR_BATCH_NOT_REJECTABLE
  http: 409
  condition: reject requires batch SEALED or MANIFESTED
- id: ERR_SALVAGE_ITEM_ALREADY_BATCHED
  http: 409
  condition: item already belongs to a non-REJECTED batch
- id: ERR_CROSS_DISTRICT_STOP
  http: 422
  condition: stop pole's district_id != route's district_id
- id: ERR_AUDIT_NOT_PERMITTED_UTILITY
  http: 422
  condition: wattage audit submitted for a UTILITY_OWNED pole
- id: ERR_ATTEST_NOT_PERMITTED_MUNICIPAL
  http: 422
  condition: nameplate attestation attempted on a MUNICIPAL pole
- id: ERR_PROGRAM_BUDGET_EXCEEDED
  http: 402
  condition: estimated_labor_cost_cents > program.budget_balance_cents at dispatch
roles:
- name: ProgramManager
  description: 'Municipal program office: owns program/district/pole/route/salvage-batch administration, audit decisions, ticket triage, savings-report preparation'
  identity: opaque
  exclusive_operations:
  - POST /streetlights/programs, /activate, /close
  - POST /streetlights/districts, /poles, /crews, /conversion-routes
  - POST /streetlights/conversion-routes/{id}/stops|release|suspend|resume|cancel
  - POST /streetlights/route-stops/{id}/skip
  - POST /streetlights/audits/{id}/accept|dispute
  - POST /streetlights/work-orders/{id}/cancel
  - POST /streetlights/outage-tickets/{id}/triage|dispatch
  - POST /streetlights/salvage-batches, /salvage-batches/{id}/items
  - POST /streetlights/savings-reports, /submit, /revise
  - POST /streetlights/compliance-exceptions
  - POST /_clock/set_current_utc
  shared_operations:
  - all GET endpoints
  - POST /streetlights/compliance-exceptions/{id}/refresh
- name: FieldSupervisor
  description: Crew supervisor; X-User-ID equals the Crew id the supervisor leads; submits wattage audits, dispatches/completes/fails own crew's work orders, resolves assigned outage tickets
  identity: entity_backed:Crew
  exclusive_operations:
  - POST /streetlights/poles/{poleId}/audits
  - POST /streetlights/audits/{id}/resubmit
  - POST /streetlights/work-orders/{id}/dispatch|complete|fail
  - POST /streetlights/outage-tickets/{id}/resolve
  shared_operations:
  - all GET endpoints
  - POST /streetlights/compliance-exceptions/{id}/refresh
- name: QaInspector
  description: Independent quality inspector; may not QC work performed by the same user (segregation of duties)
  identity: opaque
  exclusive_operations:
  - POST /streetlights/work-orders/{id}/qc-pass
  - POST /streetlights/work-orders/{id}/qc-fail
  shared_operations:
  - all GET endpoints
  - POST /streetlights/compliance-exceptions/{id}/refresh
- name: BillingAnalyst
  description: 'Utility billing liaison: rate schedules, tariff accounts, line generation/period close, salvage settlement, utility nameplate attestation'
  identity: opaque
  exclusive_operations:
  - POST /streetlights/poles/{id}/attest-nameplate
  - POST /streetlights/rate-schedules, /file, /activate, /retire
  - POST /streetlights/tariff-accounts, /freeze, /unfreeze, /generate-lines, /close-period
  - POST /streetlights/salvage-batches/{id}/settle
  shared_operations:
  - all GET endpoints
  - POST /streetlights/compliance-exceptions/{id}/refresh
- name: ComplianceOfficer
  description: 'Dark-sky and environmental compliance: decides exceptions, seals/manifests/rejects salvage batches'
  identity: opaque
  exclusive_operations:
  - POST /streetlights/compliance-exceptions/{id}/approve|deny
  - POST /streetlights/salvage-batches/{id}/seal|manifest|reject
  shared_operations:
  - all GET endpoints
  - POST /streetlights/compliance-exceptions/{id}/refresh
- name: CitizenReporter
  description: Public portal user; reports outages and verifies/reopens resolutions (own tickets only)
  identity: opaque
  exclusive_operations:
  - POST /streetlights/outage-tickets
  - POST /streetlights/outage-tickets/{id}/verify|reopen
  shared_operations:
  - all GET endpoints
  - POST /streetlights/compliance-exceptions/{id}/refresh
- name: Auditor
  description: External savings verifier; attests or rejects submitted savings reports (never own submissions)
  identity: opaque
  exclusive_operations:
  - POST /streetlights/savings-reports/{id}/attest
  - POST /streetlights/savings-reports/{id}/reject
  shared_operations:
  - all GET endpoints
  - POST /streetlights/compliance-exceptions/{id}/refresh
