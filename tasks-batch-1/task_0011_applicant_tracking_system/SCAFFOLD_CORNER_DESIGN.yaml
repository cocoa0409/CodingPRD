  # ===================================================================
  # rbac — denial of cross-role exclusive operations
  # ===================================================================
  - section: rbac
    instances:
      - name: recruiter_cannot_approve_requisition
        claim_type: Cross-role denial
        grounds:
          - roles[Recruiter]
          - roles[HiringManager]
          - endpoints[POST /ats/requisitions/{id}/approve]
          - errors[ERR_FORBIDDEN]
          - validations[priority=2]
        distinguishing_aspect: |
          POST /ats/requisitions/{id}/approve is exclusive to HiringManager. A request with
          X-User-Role=Recruiter must return 403 ERR_FORBIDDEN (priority 2).
        test_recipe:
          setup:
            - "Requisition R in PENDING_APPROVAL after submit"
          setup_api_calls:
            - call: "POST /ats/departments"
              payload: { name: "RbacDept", cost_center_code: "RBC-001", hiring_budget_cents: 100000000 }
              as: PlatformAdmin
