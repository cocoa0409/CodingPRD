      - name: err_launch_lock_ladder_runs_window_label_dates_then_readiness
        claim_type: guard_ladder
        grounds:
          - errors[ERR_WINDOW_CATEGORY_MISMATCH]
          - errors[ERR_LABEL_NOT_APPROVED]
          - errors[ERR_LAUNCH_DATE_OUTSIDE_WINDOW]
          - errors[ERR_LOCK_LEAD_TIME_VIOLATION]
          - errors[ERR_LAUNCH_READINESS_INCOMPLETE]
        distinguishing_aspect: |
          Locking a launch date runs five guards in priority order, and each one is only reachable
          once its predecessors are satisfied: wrong window category, unapproved label, a date
          outside the reset window, a date inside the window but inside the 45 day lock lead time,
          and finally a readiness of 58.33 caused by a waived distribution deliverable that
          nonetheless counted as complete at the gate.
        test_recipe:
          setup:
