          apply-corrections is not idempotent-by-emptiness: a DRAFT settlement whose driver has no PENDING
          RetroCorrection must be refused with ERR_NO_PENDING_CORRECTIONS at 409 rather than returning 200 with
          zero lines swept. The expected_settlement_version handed in was read immediately beforehand, so the
