# =============================================================================
# task_2309 — §1.8 Scaffold Difficulty Design (Test Targeting Index)
#
# Nine §0.5 rule_ids × 2 instances = 18 instances. Every `grounds:` entry
# resolves into SCAFFOLD.yaml §1.1–§1.6; every `${var}` is bound by an earlier
# `captures:`; every numeric assert literal was executed against the §1.3
# formulas before being written here.
#
# Logical clock: 2026-08-01T00:00:00Z unless a chain moves it.
# =============================================================================
scaffold_difficulty_design:

  # ===========================================================================
  - rule_id: dual_variant_calc
    instances:

      - name: incentive_provisional_vs_final_diverge_on_short_interview
        grounds:
          - calculations.interview_incentive_amount
          - entities.Interview.fields.incentive_provisional_usd
          - entities.Interview.fields.incentive_final_usd
          - entities.Program.fields.incentive_committed_usd
          - entities.Program.fields.incentive_paid_usd
          - state_machines.Interview.SCHEDULED_to_COMPLETED
        distinguishing_aspect: |
          This instance is dual-variant money accounting on the Interview entity: the
          PROVISIONAL variant reads the SCHEDULED interval (60 min, factor 1.00, 250.00)
          while the FINAL variant reads the ACTUAL interval (30 min, factor 0.60, 150.00),
          so the same interview yields two different USD amounts and the Program ledger
          must move 250.00 out of committed and only 150.00 into paid.
        test_recipe:
          setup:
            - "Logical clock at 2026-08-01T00:00:00Z."
            - "Program 'WL FY27Q1' ACTIVE, incentive_budget_usd 10000.00, interview_incentive_cap_usd 500.00, min_deal_value_usd 50000.00, posture OPEN."
            - "Competitor 'Northwind' tier PRIMARY; Analyst 'Ana One' INTERNAL, not a sales-org member, certified until 2027-01-01."
            - "Deal CRM-1001 LOST, ENTERPRISE, acr_usd 300000.00, close_date 2026-06-15, drawn into a SEALED frame so research_status == SELECTED."
            - "BuyerContact buyer1@acme.test, title_band ECONOMIC_BUYER, incentive_eligibility ELIGIBLE, consent GRANTED."
            - "Interview scheduled 2026-08-10T14:00:00Z -> 15:00:00Z (60 min) so incentive_provisional_usd == 250.00 and Program.incentive_committed_usd == 250.00."
            - "All three pinned guide topics recorded, so the completion coverage gate passes."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-08-01T00:00:00Z" }
              as: ProgramAdmin
            - call: "POST /programs"
              payload: { name: "WL FY27Q1", fiscal_quarter: "FY27Q1", incentive_budget_usd: 10000.00, interview_incentive_cap_usd: 500.00, min_deal_value_usd: 50000.00 }
              as: ProgramAdmin
              captures: { prog_id: $.data.id }
            - call: "POST /programs/${prog_id}/activate"
              payload: {}
              as: ProgramAdmin
            - call: "POST /competitors"
              payload: { program_id: "${prog_id}", name: "Northwind", tier: "PRIMARY" }
              as: ProgramAdmin
              captures: { comp_id: $.data.id }
            - call: "POST /analysts"
              payload: { program_id: "${prog_id}", full_name: "Ana One", linked_user_ref: "u-ana-1", employment_type: "INTERNAL", certified_until: "2027-01-01T00:00:00Z", sales_org_member: false }
              as: ProgramAdmin
              captures: { a1_id: $.data.id }
            - call: "POST /deals"
              payload: { program_id: "${prog_id}", crm_deal_ref: "CRM-1001", outcome: "LOST", acr_usd: 300000.00, close_date: "2026-06-15T00:00:00Z", segment: "ENTERPRISE", sales_rep_user_ref: "rep-77", primary_competitor_id: "${comp_id}" }
              as: ProgramAdmin
              captures: { d1_id: $.data.id }
            - call: "POST /deals/${d1_id}/buyer-contacts"
              payload: { email: "buyer1@acme.test", full_name: "Bea Uno", title_band: "ECONOMIC_BUYER", incentive_eligibility: "ELIGIBLE" }
              as: ResearchAnalyst
              as_user_id: "${a1_id}"
              captures: { c1_id: $.data.id }
            - call: "POST /deals/${d1_id}/buyer-contacts/${c1_id}/consent"
              payload: { consent_status: "GRANTED" }
              as: ResearchAnalyst
              as_user_id: "${a1_id}"
            - call: "POST /sampling-frames"
              payload: { program_id: "${prog_id}", label: "FY27Q1 Frame", window_start: "2026-04-01T00:00:00Z", window_end: "2026-07-01T00:00:00Z", quota_won: 2, quota_lost: 2, quota_no_decision: 1, selection_basis: "STRATIFIED_BY_SEGMENT" }
              as: ResearchAnalyst
              as_user_id: "${a1_id}"
              captures: { frame_id: $.data.id }
            - call: "POST /sampling-frames/${frame_id}/seal"
              payload: {}
              as: ResearchAnalyst
              as_user_id: "${a1_id}"
            - call: "POST /sampling-frames/${frame_id}/draw"
              payload: { stratum: "LOST", requested_count: 1 }
              as: ResearchAnalyst
              as_user_id: "${a1_id}"
              captures: { d1_score: "$.data[0].selection_rank_score" }
            - call: "POST /interviews"
              payload: { deal_id: "${d1_id}", buyer_contact_id: "${c1_id}", analyst_id: "${a1_id}", scheduled_start_at: "2026-08-10T14:00:00Z", scheduled_end_at: "2026-08-10T15:00:00Z" }
              as: ResearchAnalyst
              as_user_id: "${a1_id}"
              captures: { i1_id: $.data.id, i1_prov: $.data.incentive_provisional_usd }
            - call: "POST /interviews/${i1_id}/responses"
              payload: { question_key: "EVALUATION_CRITERIA", verbatim_text: "Ranked on integration depth.", recorded_at: "2026-08-10T14:10:00Z", rating: 4 }
              as: ResearchAnalyst
              as_user_id: "${a1_id}"
            - call: "POST /interviews/${i1_id}/responses"
              payload: { question_key: "COMPETITOR_POSITIONING", verbatim_text: "Northwind pitched a bundled suite.", recorded_at: "2026-08-10T14:15:00Z", rating: 4 }
              as: ResearchAnalyst
              as_user_id: "${a1_id}"
            - call: "POST /interviews/${i1_id}/responses"
              payload: { question_key: "PRICING_PERCEPTION", verbatim_text: "List price felt 20 percent high.", recorded_at: "2026-08-10T14:20:00Z", rating: 2 }
              as: ResearchAnalyst
              as_user_id: "${a1_id}"
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-08-10T15:30:00Z" }
              as: ProgramAdmin
          trigger:
            - call: "POST /interviews/${i1_id}/complete"
              payload: { actual_start_at: "2026-08-10T14:05:00Z", actual_end_at: "2026-08-10T14:35:00Z" }
              as: ResearchAnalyst
              as_user_id: "${a1_id}"
              captures: { i1_final: $.data.incentive_final_usd }
          assert:
            - "Interview.${i1_id}.incentive_provisional_usd == 250.00"
            - "Interview.${i1_id}.incentive_final_usd == 150.00"
            - "Interview.${i1_id}.incentive_provisional_usd != Interview.${i1_id}.incentive_final_usd"
            - "Interview.${i1_id}.incentive_status == PAID"
            - "Program.${prog_id}.incentive_committed_usd == 0.00"
            - "Program.${prog_id}.incentive_paid_usd == 150.00"
            - "Program.${prog_id}.posture == OPEN"
            - "Deal.${d1_id}.research_status == INTERVIEWED"
            - "Deal.${d1_id}.interview_coverage_count == 1"
            - "BuyerContact.${c1_id}.completed_interview_count == 1"
            - "BuyerContact.${c1_id}.last_completed_interview_end_at == 2026-08-10T14:35:00Z"
            - "Analyst.${a1_id}.open_interview_count == 0"
            - "Analyst.${a1_id}.committed_minutes == 0"

      - name: loss_trend_shares_diverge_between_ratified_only_and_include_provisional
        grounds:
          - calculations.loss_reason_trend_shares
          - entities.LossAttribution.fields.status
          - entities.LossAttribution.fields.weight_primary
          - entities.Deal.fields.segment
          - state_machines.Deal.PROVISIONAL_to_RATIFIED
        distinguishing_aspect: |
          This instance is dual-variant aggregation on the LossAttribution/Deal domain —
          a different subject and a different metric from the Interview incentive above:
          RATIFIED_ONLY sees one attribution and reports a single ENTERPRISE row at share
          1.0000, while INCLUDE_PROVISIONAL sees two and reports two rows at 0.5000 each,
          so every denominator in the report changes with the basis.
        test_recipe:
          setup:
            - "Program ACTIVE with two root-level ACTIVE leaf loss reasons: PRICE (code 'PRICE') and FEATURE_GAP (code 'FEATURE_GAP')."
            - "Two ENTERPRISE LOST deals CRM-1001 (close_date 2026-06-15) and CRM-1002 (close_date 2026-06-20), both drawn into the SEALED frame and both INTERVIEWED after a completed interview."
            - "Deal CRM-1001 carries a RATIFIED LossAttribution citing PRICE with weight_primary 1.00; Deal CRM-1002 carries a PROVISIONAL LossAttribution citing FEATURE_GAP with weight_primary 1.00."
            - "A second analyst 'Ana Two' exists who conducted no interview, so she may ratify."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-08-01T00:00:00Z" }
              as: ProgramAdmin
            - call: "POST /programs"
              payload: { name: "WL FY27Q1", fiscal_quarter: "FY27Q1", incentive_budget_usd: 10000.00, interview_incentive_cap_usd: 500.00, min_deal_value_usd: 50000.00 }
              as: ProgramAdmin
              captures: { prog_id: $.data.id }
            - call: "POST /programs/${prog_id}/activate"
