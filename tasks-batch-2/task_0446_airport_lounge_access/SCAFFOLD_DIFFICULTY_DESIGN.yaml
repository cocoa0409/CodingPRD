            - "HTTP status == 422"

      - name: ppvc_no_active_card_beats_lounge_overflow
        grounds:
          - validations[priority=6]
          - validations[priority=10]
          - errors[ERR_NO_ACTIVE_CARD]
        distinguishing_aspect: |
          business_referential (p6 ERR_NO_ACTIVE_CARD) vs business_temporal (p10 ERR_LOUNGE_OVERFLOW) — a different
          category pair from the first instance: a member with no card holding on an OVERFLOW lounge gets
          ERR_NO_ACTIVE_CARD (p6) not ERR_LOUNGE_OVERFLOW (p10).
        test_recipe:
          setup:
