            - { call: "POST /etax/nexus-cases", payload: { state_code: "OR" }, as: NexusAnalyst, captures: { nc_or: $.data.id } }
            - { call: "POST /etax/_clock/set_current_utc", payload: { to_iso8601: "2026-08-20T00:00:00Z" }, as: TaxDirector }
            - { call: "POST /etax/nexus-cases/${nc_or}/recompute", payload: {}, as: NexusAnalyst }
            - { call: "POST /etax/registrations", payload: { agency_id: "${ag_or_wh}", projected_annual_withholding_cents: 1000000, expected_employer_version: "${emp_v}" }, as: NexusAnalyst, captures: { reg_or: $.data.id } }
          trigger:
            - { call: "POST /etax/registrations/${reg_or}/submit", payload: {}, as: NexusAnalyst, captures: { err: $.data.error_id } }
            - { call: "POST /etax/nexus-cases/${nc_or}/confirm", payload: {}, as: NexusAnalyst }
            - { call: "POST /etax/registrations/${reg_or}/submit", payload: {}, as: NexusAnalyst, captures: { st: $.data.status } }
          assert:
            - "First submit: error_id == ERR_NEXUS_NOT_CONFIRMED (THRESHOLD_MET is not CONFIRMED)"
            - "After confirm: submit succeeds, status == SUBMITTED"

      - name: vc_approve_blocked_by_delinquent_posture
        grounds:
          - validations[priority=9]
          - state_machines.VoluntaryContribution.PROPOSED_to_APPROVED
          - calculations.compliance_posture
          - errors[ERR_COMPANY_POSTURE_DELINQUENT]
        distinguishing_aspect: |
          Entity pair VoluntaryContribution -> Employer (different pair from
          Registration -> NexusCase): approve is gated on the employer's derived
          posture; an ESCALATED notice forces DELINQUENT and blocks approval
          until the notice is resolved.
        test_recipe:
          setup:
            - "Employer; PA-UI agency; five PA employees wage 6,000,000; PA nexus CONFIRMED; PA-UI registration ACTIVE; UIRate EFFECTIVE (390bp); VC proposed (100,000, deadline 2026-12-01)"
