            - "RebateSubmission.${rbr_id}.status remains DOCS_COMPLETE"

      - name: warranty_processor_cannot_pay_claim
        claim_type: rbac_denial
        grounds: ["roles[WarrantyProcessor]", "roles[DistributorAdmin]", "errors[ERR_UNAUTHORIZED]"]
        distinguishing_aspect: "PAY action on an APPROVED claim by WarrantyProcessor is denied — payment is DistributorAdmin-exclusive (segregation of duties)."
        test_recipe:
          setup: ["APPROVED claim PC-R"]
          setup_api_calls:
            - call: "POST /api/v1/_clock/set_current_utc"
              payload: { to_iso8601: "2026-06-10T00:00:00Z" }
              as: DistributorAdmin
            - call: "POST /api/v1/contractors"
              payload: { company_name: "Sod Co", license_number: "LIC-C701" }
              as: DistributorAdmin
              captures: { cs7_id: $.data.id }
            - call: "POST /api/v1/equipment-models"
              payload: { model_number: "CU-S701", equipment_type: "CONDENSER", refrigerant_type: "R410A", capacity_btuh: 36000, family_code: "FAM-S2", list_price_cents: 800000 }
              as: DistributorAdmin
              captures: { ms7_id: $.data.id }
            - call: "POST /api/v1/orders"
              payload: { contractor_id: "${cs7_id}" }
              as: ContractorUser
              as_user_id: "${cs7_id}"
              captures: { os7_id: $.data.id }
            - call: "POST /api/v1/orders/${os7_id}/lines"
              payload: { equipment_model_id: "${ms7_id}", quantity: 1 }
              as: ContractorUser
              as_user_id: "${cs7_id}"
            - call: "POST /api/v1/orders/${os7_id}/submit"
              payload: {}
              as: ContractorUser
              as_user_id: "${cs7_id}"
            - call: "POST /api/v1/orders/${os7_id}/ship"
              payload: {}
              as: DistributorAdmin
            - call: "POST /api/v1/orders/${os7_id}/deliver"
              payload: {}
              as: DistributorAdmin
            - call: "POST /api/v1/warranty-registrations"
              payload: { serial_number: "SN-S701", equipment_model_id: "${ms7_id}", contractor_id: "${cs7_id}", order_id: "${os7_id}", install_date: "2026-06-01T00:00:00Z" }
              as: ContractorUser
              as_user_id: "${cs7_id}"
              captures: { ws7_id: $.data.id }
            - call: "POST /api/v1/warranty-registrations/${ws7_id}/register"
              payload: {}
              as: ContractorUser
              as_user_id: "${cs7_id}"
            - call: "POST /api/v1/parts-claims"
              payload: { warranty_registration_id: "${ws7_id}", contractor_id: "${cs7_id}", failure_date: "2026-06-08T00:00:00Z", part_cost_cents: 100000, labor_cost_cents: 40000 }
              as: ContractorUser
              as_user_id: "${cs7_id}"
              captures: { pcs7_id: $.data.id }
            - call: "POST /api/v1/parts-claims/${pcs7_id}/decision"
              payload: { action: "BEGIN_REVIEW" }
              as: WarrantyProcessor
            - call: "POST /api/v1/parts-claims/${pcs7_id}/decision"
              payload: { action: "APPROVE" }
              as: WarrantyProcessor
          trigger:
            - call: "POST /api/v1/parts-claims/${pcs7_id}/decision"
              payload: { action: "PAY" }
              as: WarrantyProcessor
              captures: { e: $.data.error_id }
          assert:
            - "trigger error_id == ERR_UNAUTHORIZED (PAY is DistributorAdmin-only)"
            - "PartsClaim.${pcs7_id}.status remains APPROVED"

      - name: missing_auth_headers_rejected
        claim_type: rbac_denial
        grounds: ["validations[priority=1]", "errors[ERR_UNAUTHENTICATED]"]
        distinguishing_aspect: "A request with no X-User-Role/X-User-ID headers fails ERR_UNAUTHENTICATED (401) before any role check."
        test_recipe:
          setup: ["empty DB"]
          setup_api_calls: []
          trigger:
            - call: "GET /api/v1/contractors"
              payload: {}
              as: Anonymous
              captures: { e: $.data.error_id }
          assert:
            - "trigger error_id == ERR_UNAUTHENTICATED and http status 401"

  # =========================================================================
  # Section: cross_cutting_layers
  # =========================================================================
  - section: cross_cutting_layers
    instances:
      - name: version_increments_on_every_mutation
        claim_type: occ_version_monotonicity
        grounds: ["complexity_profile.complexity_layers[optimistic_concurrency]", entities.Order]
        distinguishing_aspect: "Every mutation (line add, submit, billing event) bumps Order.version by exactly 1; a DRAFT order through create(1) -> line add(2) -> submit(3) shows version 3."
        test_recipe:
          setup: ["DRAFT order through line add and submit"]
          setup_api_calls:
            - call: "POST /api/v1/contractors"
              payload: { company_name: "Ver Co", license_number: "LIC-C800" }
              as: DistributorAdmin
              captures: { cv_id: $.data.id }
            - call: "POST /api/v1/equipment-models"
              payload: { model_number: "CU-V800", equipment_type: "CONDENSER", refrigerant_type: "R410A", capacity_btuh: 36000, family_code: "FAM-R1", list_price_cents: 500000 }
              as: DistributorAdmin
              captures: { mv_id: $.data.id }
            - call: "POST /api/v1/orders"
              payload: { contractor_id: "${cv_id}" }
              as: ContractorUser
              as_user_id: "${cv_id}"
              captures: { ov_id: $.data.id, ov_v: $.data.version }
          trigger:
            - call: "POST /api/v1/orders/${ov_id}/lines"
              payload: { equipment_model_id: "${mv_id}", quantity: 1 }
              as: ContractorUser
              as_user_id: "${cv_id}"
            - call: "POST /api/v1/orders/${ov_id}/submit"
              payload: {}
              as: ContractorUser
              as_user_id: "${cv_id}"
            - call: "GET /api/v1/orders/${ov_id}"
              payload: {}
              as: ContractorUser
              as_user_id: "${cv_id}"
          assert:
            - "Order.${ov_id}.version == ${ov_v} + 2 (line add +1, submit +1)"

      - name: backordered_order_recovers_on_pool_reopen
        claim_type: cascade_recovery
        grounds: ["complexity_profile.complexity_layers[cascading_side_effects]", calculations.allocation_consumption]
        distinguishing_aspect: "A BACKORDERED order (short by a pool of 1) recovers to ALLOCATED when a second pool for the same family opens; the recovery sweep honors tier priority (GOLD contractor's order re-reserves before STANDARD's)."
        test_recipe:
          setup:
            - "pool AP-R1 FAM-Q9 total 1 covering August; GOLD contractor C-G (ytd 20,000,000 via a seeded delivered order) and STANDARD contractor C-S"
            - "order O-G1 qty 1 by C-G submitted first -> ALLOCATED; order O-S1 qty 1 by C-S -> BACKORDERED; order O-G2 qty 1 by C-G -> BACKORDERED"
            - "trigger: new pool AP-R2 FAM-Q9 total 1 opens -> re-reservation sweep: C-G's backordered O-G2 (tier GOLD) wins over C-S's O-S1 (STANDARD) despite O-S1 being older"
          setup_api_calls:
            - call: "POST /api/v1/_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-05T00:00:00Z" }
              as: DistributorAdmin
            - call: "POST /api/v1/contractors"
              payload: { company_name: "Gold Co", license_number: "LIC-C801" }
              as: DistributorAdmin
              captures: { cg8_id: $.data.id }
            - call: "POST /api/v1/contractors"
              payload: { company_name: "Std Co", license_number: "LIC-C802" }
              as: DistributorAdmin
              captures: { cs8_id: $.data.id }
            - call: "POST /api/v1/equipment-models"
              payload: { model_number: "CU-GOLD-SEED", equipment_type: "CONDENSER", refrigerant_type: "R410A", capacity_btuh: 36000, family_code: "FAM-P0", list_price_cents: 20000000 }
              as: DistributorAdmin
              captures: { mseed8_id: $.data.id }
            - call: "POST /api/v1/equipment-models"
              payload: { model_number: "CU-Q9", equipment_type: "CONDENSER", refrigerant_type: "R454B", capacity_btuh: 36000, family_code: "FAM-Q9", list_price_cents: 600000 }
              as: DistributorAdmin
              captures: { mq9_id: $.data.id }
            - call: "POST /api/v1/orders"
              payload: { contractor_id: "${cg8_id}" }
              as: ContractorUser
              as_user_id: "${cg8_id}"
              captures: { oseed8_id: $.data.id }
            - call: "POST /api/v1/orders/${oseed8_id}/lines"
              payload: { equipment_model_id: "${mseed8_id}", quantity: 1 }
              as: ContractorUser
              as_user_id: "${cg8_id}"
            - call: "POST /api/v1/orders/${oseed8_id}/submit"
              payload: {}
              as: ContractorUser
              as_user_id: "${cg8_id}"
            - call: "POST /api/v1/orders/${oseed8_id}/ship"
              payload: {}
              as: DistributorAdmin
            - call: "POST /api/v1/orders/${oseed8_id}/deliver"
              payload: {}
              as: DistributorAdmin
            - call: "POST /api/v1/allocation-pools"
              payload: { family_code: "FAM-Q9", season_start: "2026-08-01T00:00:00Z", season_end: "2026-09-01T00:00:00Z", total_qty: 1 }
              as: DistributorAdmin
              captures: { apr1_id: $.data.id }
            - call: "POST /api/v1/orders"
              payload: { contractor_id: "${cg8_id}" }
              as: ContractorUser
              as_user_id: "${cg8_id}"
              captures: { og1_id: $.data.id }
            - call: "POST /api/v1/orders/${og1_id}/lines"
              payload: { equipment_model_id: "${mq9_id}", quantity: 1 }
              as: ContractorUser
              as_user_id: "${cg8_id}"
            - call: "POST /api/v1/orders/${og1_id}/submit"
              payload: {}
              as: ContractorUser
              as_user_id: "${cg8_id}"
            - call: "POST /api/v1/orders"
              payload: { contractor_id: "${cs8_id}" }
              as: ContractorUser
              as_user_id: "${cs8_id}"
              captures: { os1_id: $.data.id }
            - call: "POST /api/v1/orders/${os1_id}/lines"
              payload: { equipment_model_id: "${mq9_id}", quantity: 1 }
              as: ContractorUser
              as_user_id: "${cs8_id}"
            - call: "POST /api/v1/orders/${os1_id}/submit"
              payload: {}
              as: ContractorUser
              as_user_id: "${cs8_id}"
            - call: "POST /api/v1/orders"
              payload: { contractor_id: "${cg8_id}" }
              as: ContractorUser
              as_user_id: "${cg8_id}"
              captures: { og2_id: $.data.id }
            - call: "POST /api/v1/orders/${og2_id}/lines"
              payload: { equipment_model_id: "${mq9_id}", quantity: 1 }
              as: ContractorUser
