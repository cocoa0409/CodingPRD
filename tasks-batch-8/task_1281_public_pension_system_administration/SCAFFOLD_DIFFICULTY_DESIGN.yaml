        distinguishing_aspect: |
          Depth-2 bubble-up chain triggered by a line review (different trigger
          from member death): review REJECTED->ACCEPTED mutates the line (link 1),
          which recomputes report totals, and the totals mutation itself flips the
          report VARIANCE -> RECONCILED (link 2). Companion instance
