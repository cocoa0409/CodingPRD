      - name: rollover_settlement_past_the_deadline_and_after_return_are_both_rejected
        claim_type: violation_to_error
        grounds:
          - validations.v_rollover_window_expired
          - validations.v_transfer_state
          - errors.ERR_ROLLOVER_WINDOW_EXPIRED
          - errors.ERR_TRANSFER_STATE_INVALID
          - entities.PortabilityTransfer.fields.settle_by_date
        distinguishing_aspect: "settle_by_date is requested_on + 60 days = 2026-05-09, so a settled_on of 2026-05-10 is one day too late and the 60-day rollover fails as a temporal violation (priority 58) — not as a state violation, because the transfer is still legitimately REQUESTED. After the return, the SAME call fails for a different reason at priority 20, proving the two guards are distinct and ordered, and the return must have restored the in-transit 100000 to the account."
        test_recipe:
          setup:
            - "ProgramYear 2026 configured; Delta Fabrication registered; Rosa Lim ACTIVE with balance_cents 400000 and contribution_basis_cents 400000 from one posted remittance"
            - "At clock 2026-03-10 Rosa requested an INDIRECT_60_DAY transfer of 100000 to an external IRA, so settle_by_date is 2026-05-09, in_transit_cents is 100000 and her balance dropped to 300000"
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-03-10T00:00:00Z" }
              as: ProgramAdministrator
            - call: "POST /portability-transfers"
              payload: { participant_id: "${par_id}", source_account_id: "${acct_id}", destination_type: "EXTERNAL_IRA", transfer_kind: "INDIRECT_60_DAY", amount_cents: 100000, external_institution_name: "Harborline Trust IRA" }
              as: Participant
              as_user_id: "${par_id}"
              captures: { xfer_id: "$.data.id" }
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-05-10T00:00:00Z" }
              as: ProgramAdministrator
          trigger:
            - call: "POST /portability-transfers/${xfer_id}/settle"
              payload: { settled_on: "2026-05-10", settlement_reference: "RLV-LATE-1" }
              as: Recordkeeper
            - call: "POST /portability-transfers/${xfer_id}/return"
              payload: { return_reason: "Sixty-day window lapsed without receiving institution confirmation" }
              as: Recordkeeper
            - call: "POST /portability-transfers/${xfer_id}/settle"
              payload: { settled_on: "2026-05-10", settlement_reference: "RLV-LATE-2" }
              as: Recordkeeper
          assert:
            - "PortabilityTransfer.${xfer_id}.settle_by_date == 2026-05-09"
            - "the first trigger call returns status == 409 with data.error_id == ERR_ROLLOVER_WINDOW_EXPIRED"
            - "after the first trigger call PortabilityTransfer.${xfer_id}.status == REQUESTED"
            - "the second trigger call returns status == 200"
            - "PortabilityTransfer.${xfer_id}.status == RETURNED"
            - "PortabilityTransfer.${xfer_id}.in_transit_cents == 0"
            - "ParticipantAccount.${acct_id}.balance_cents == 400000"
            - "ParticipantAccount.${acct_id}.contribution_basis_cents == 400000"
            - "the third trigger call returns status == 409 with data.error_id == ERR_TRANSFER_STATE_INVALID"
            - "the third trigger call does not return data.error_id == ERR_ROLLOVER_WINDOW_EXPIRED"
            - "PortabilityTransfer.${xfer_id}.settlement_reference == null"

      - name: excess_completion_before_election_and_election_after_deadline_are_rejected
        claim_type: violation_to_error
        grounds:
          - validations.v_excess_case_state
          - validations.v_correction_deadline_passed
          - errors.ERR_EXCESS_CASE_STATE_INVALID
          - errors.ERR_CORRECTION_DEADLINE_PASSED
          - entities.ExcessContributionCase.fields.deadline_date
        distinguishing_aspect: "The correction workflow is election-then-completion, so completion on a DETECTED case is a state violation even though the settlement reference is well formed. The deadline is the tax-filing date of the FOLLOWING year (2027-04-15), not one year from detection, so an election on 2027-04-16 is exactly one day past and must fail on the temporal rule — and the case must remain DETECTED, leaving uncorrected_excess_cents on the account."
        test_recipe:
          setup:
            - "ProgramYear 2026 configured with ira_annual_limit_cents 700000 and correction_deadline_month_day 04-15; Delta Fabrication registered; Rosa Lim ACTIVE"
            - "Two remittances of 400000 each have been posted (pay_dates 2026-02-05 and 2026-03-05), so ytd_contribution_cents reached 800000 and an ExcessContributionCase for 100000 was opened in DETECTED"
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-03-05T00:00:00Z" }
              as: ProgramAdministrator
            - call: "POST /employers/${emp_id}/payroll-remittances"
              payload: { pay_period_start: "2026-02-01", pay_period_end: "2026-02-28", pay_date: "2026-03-05", total_deducted_cents: 400000 }
              as: Employer
              as_user_id: "${emp_id}"
              captures: { rem2_id: "$.data.id" }
            - call: "POST /payroll-remittances/${rem2_id}/remittance-lines"
              payload: { enrollment_id: "${enr_id}", gross_wages_cents: 8000000, deducted_cents: 400000 }
              as: Employer
              as_user_id: "${emp_id}"
            - call: "POST /payroll-remittances/${rem2_id}/submit"
              payload: {}
              as: Employer
              as_user_id: "${emp_id}"
            - call: "POST /payroll-remittances/${rem2_id}/post"
              payload: { posting_reference: "ACH-2026-03-05" }
              as: Recordkeeper
            - call: "GET /participant-accounts/${acct_id}/excess-contribution-cases"
              payload: {}
              as: ProgramAdministrator
              captures: { case_id: "$.data[0].id" }
          trigger:
            - call: "POST /excess-contribution-cases/${case_id}/completion"
              payload: { settlement_reference: "COR-2026-0001" }
              as: Recordkeeper
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2027-04-16T00:00:00Z" }
              as: ProgramAdministrator
            - call: "POST /excess-contribution-cases/${case_id}/method-election"
              payload: { correction_method: "REFUND_TO_PARTICIPANT" }
