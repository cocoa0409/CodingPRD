          trigger:
            - { call: "POST /facility-audits/${au}/submit-report", payload: { lots: [ { lot_code: "L1", input_qty: 200, recovered_qty: 190 } ] }, as: Auditor, as_user_id: "aud-2", captures: { err: $.data.error_id } }
          assert:
            - "error_id == ERR_NOT_ASSIGNED_AUDITOR and http status == 403"

  # ===========================================================================
  - section: cross_cutting_layers
    instances:
      - name: occ_stale_version_on_plan_create_rejected
        claim_type: optimistic_concurrency
        grounds: ["concurrency_rules[plan-create-stale-product-version]", "errors[ERR_STALE_VERSION]"]
        distinguishing_aspect: "OCC loser path: after plan A's creation bumps Product.version, a second create replaying the pre-A version is rejected 412 ERR_STALE_VERSION and plan A stays ACTIVE (no supersede occurred)."
        test_recipe:
          setup: ["product UNDER_EVALUATION; client holds product version V observed before any plan exists"]
          setup_api_calls:
            - { call: "POST /claim-standards", payload: { claim_code: "NGMO", name: "Non-GMO", ingredient_threshold_pct: 0.9, exemption_max_weight_pct: 0.5 }, as: VerifierAdmin, captures: { std: $.data.id } }
            - { call: "POST /brands", payload: { name: "B1", contact_email: "b1@x.com" }, as: VerifierAdmin, captures: { b1: $.data.id } }
            - { call: "POST /products", payload: { brand_id: "${b1}", standard_id: "${std}", name: "P1", gtin: "G-P1", annual_volume_units: 100 }, as: BrandRep, as_user_id: "${b1}", captures: { p1: $.data.id } }
            - { call: "POST /ingredients", payload: { product_id: "${p1}", name: "Soy", crop_type: "HIGH_RISK", declared_weight_pct: 100.00 }, as: BrandRep, as_user_id: "${b1}", captures: { ing: $.data.id } }
            - { call: "POST /affidavits", payload: { ingredient_id: "${ing}", supplier_name: "S", valid_from: "2026-01-01T00:00:00Z", valid_until: "2028-01-01T00:00:00Z" }, as: BrandRep, as_user_id: "${b1}", captures: { aff: $.data.id } }
            - { call: "POST /affidavits/${aff}/review", payload: { decision: "ACCEPTED" }, as: VerifierAdmin }
            - { call: "POST /products/${p1}/submit", as: BrandRep, as_user_id: "${b1}" }
            - { call: "POST /products/${p1}/begin-evaluation", as: VerifierAdmin }
            - { call: "GET /products/${p1}", as: VerifierAdmin, captures: { pv: $.data.version } }
          trigger:
            - { call: "POST /sampling-plans", payload: { product_id: "${p1}", risk_point: "INGREDIENT_INTAKE", expected_product_version: "${pv}" }, as: VerifierAdmin, captures: { planA: $.data.id } }
            - { call: "POST /sampling-plans", payload: { product_id: "${p1}", risk_point: "IN_PROCESS", expected_product_version: "${pv}" }, as: VerifierAdmin, captures: { err: $.data.error_id } }
            - { call: "GET /sampling-plans/${planA}", as: VerifierAdmin, captures: { ast: $.data.status } }
          assert:
            - "first create succeeds (plan A ACTIVE); second create with the same stale version: error_id == ERR_STALE_VERSION, http 412"
            - "plan A remains ACTIVE (the rejected write superseded nothing)"

      - name: plan_supersede_cancels_previous_with_fresh_version
        claim_type: optimistic_concurrency
        grounds: ["concurrency_rules[plan-create-stale-product-version]", "state_machines.SamplingPlan.ACTIVE_to_CANCELLED"]
        distinguishing_aspect: "OCC winner path: a create carrying the current Product.version succeeds, supersedes plan A (CANCELLED with superseded_by_plan_id == plan B), and bumps Product.version by 1."
        test_recipe:
          setup: ["product UNDER_EVALUATION with plan A ACTIVE; client re-reads the product to obtain the fresh version"]
          setup_api_calls:
            - { call: "POST /claim-standards", payload: { claim_code: "NGMO", name: "Non-GMO", ingredient_threshold_pct: 0.9, exemption_max_weight_pct: 0.5 }, as: VerifierAdmin, captures: { std: $.data.id } }
            - { call: "POST /brands", payload: { name: "B1", contact_email: "b1@x.com" }, as: VerifierAdmin, captures: { b1: $.data.id } }
            - { call: "POST /products", payload: { brand_id: "${b1}", standard_id: "${std}", name: "P1", gtin: "G-P1", annual_volume_units: 100 }, as: BrandRep, as_user_id: "${b1}", captures: { p1: $.data.id } }
            - { call: "POST /ingredients", payload: { product_id: "${p1}", name: "Soy", crop_type: "HIGH_RISK", declared_weight_pct: 100.00 }, as: BrandRep, as_user_id: "${b1}", captures: { ing: $.data.id } }
            - { call: "POST /affidavits", payload: { ingredient_id: "${ing}", supplier_name: "S", valid_from: "2026-01-01T00:00:00Z", valid_until: "2028-01-01T00:00:00Z" }, as: BrandRep, as_user_id: "${b1}", captures: { aff: $.data.id } }
            - { call: "POST /affidavits/${aff}/review", payload: { decision: "ACCEPTED" }, as: VerifierAdmin }
            - { call: "POST /products/${p1}/submit", as: BrandRep, as_user_id: "${b1}" }
            - { call: "POST /products/${p1}/begin-evaluation", as: VerifierAdmin }
            - { call: "GET /products/${p1}", as: VerifierAdmin, captures: { pv1: $.data.version } }
            - { call: "POST /sampling-plans", payload: { product_id: "${p1}", risk_point: "INGREDIENT_INTAKE", expected_product_version: "${pv1}" }, as: VerifierAdmin, captures: { planA: $.data.id } }
          trigger:
            - { call: "GET /products/${p1}", as: VerifierAdmin, captures: { pv2: $.data.version } }
            - { call: "POST /sampling-plans", payload: { product_id: "${p1}", risk_point: "IN_PROCESS", expected_product_version: "${pv2}" }, as: VerifierAdmin, captures: { planB: $.data.id, bst: $.data.status } }
            - { call: "GET /sampling-plans/${planA}", as: VerifierAdmin, captures: { ast: $.data.status, sup: $.data.superseded_by_plan_id } }
            - { call: "GET /products/${p1}", as: VerifierAdmin, captures: { pv3: $.data.version } }
          assert:
            - "plan B created ACTIVE; plan A status == CANCELLED and superseded_by_plan_id == plan B's id"
            - "Product.version advanced by exactly 1 per plan creation (pv2 = pv1 + 1, pv3 = pv2 + 1)"

      - name: missing_auth_headers_returns_context_error
        claim_type: violation_to_error
        grounds: ["validations[priority=1]", "errors[ERR_MISSING_OR_INVALID_USER_CONTEXT]"]
        distinguishing_aspect: "Requests without X-User-ID/X-User-Role fail at priority 1 with 400 ERR_MISSING_OR_INVALID_USER_CONTEXT, before role or existence checks."
        test_recipe:
          setup: ["any resource may exist; the call carries no identity headers"]
          setup_api_calls:
            - { call: "POST /brands", payload: { name: "B1", contact_email: "b1@x.com" }, as: VerifierAdmin, captures: { b1: $.data.id } }
          trigger:
            - { call: "GET /brands/${b1}", as: Anonymous, captures: { err: $.data.error_id } }
          assert:
            - "error_id == ERR_MISSING_OR_INVALID_USER_CONTEXT and http status == 400"

