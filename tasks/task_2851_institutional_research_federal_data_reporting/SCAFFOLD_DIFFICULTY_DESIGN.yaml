        test_recipe:
          setup:
            - "ReportingCycle IPEDS-2027 is CENSUS_LOCKED; its ENROLLMENT component holds TOTAL_HEADCOUNT 1000 against prior-year 1000 and is PREPARED with edit_status CLEARED but not yet certified."
            - "A DRAFT ExternalSubmission targets a STATE recipient with metric_key TOTAL_HEADCOUNT at reported_value 1005."
          setup_api_calls:
            - call: "POST /ir/reporting-cycles"
