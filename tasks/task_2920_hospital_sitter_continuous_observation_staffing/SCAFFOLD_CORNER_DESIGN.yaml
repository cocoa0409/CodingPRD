# =============================================================================
# Task 2920 — §1.9 Scaffold Corner Design
# Breadth probe over the nine sections of references/claim-extraction-guide.md,
# walked against SCAFFOLD.yaml §1.1–§1.7. Corners already asserted by §1.8
# appear as excluded_because stubs naming the covering difficulty instance.
# =============================================================================
scaffold_corner_design:

  - section: entities
    instances:
      - name: unit_creation_returns_declared_fields_and_success_envelope
        claim_type: creation
        grounds:
          - entities.Unit
          - endpoints.POST_observation_units
        distinguishing_aspect: "A unit created with all required inputs returns 201, the documented success envelope, and every computed/system field at its declared initial value (ledger head 0, status OPEN, version 1)."
        test_recipe:
          setup:
            - "Empty database; the clock is at the mandatory startup default 2026-08-01T00:00:00Z."
          setup_api_calls: []
          trigger:
            - call: "POST /observation/units"
              payload: { unit_code: "UNIT-C01", name: "Corner Unit One", observation_cost_budget_cents: 250000, video_monitoring_enabled: true }
              as: NurseManager
              as_user_id: "mgr-1"
              captures: { u: $.data.id }
          assert:
            - "HTTP 201 and the body carries meta.api_request_id, meta.api_request_timestamp and response_type == object"
            - "data.unit_code == UNIT-C01, data.name == Corner Unit One, data.observation_cost_budget_cents == 250000, data.video_monitoring_enabled == true"
            - "data.status == OPEN, data.restriction_reason == null, data.observed_cost_to_date_cents == 0"
            - "data.id is a non-empty string, data.version == 1, data.created_at == 2026-08-01T00:00:00Z, data.updated_at == 2026-08-01T00:00:00Z"

      - name: patient_retrieval_returns_the_stored_row
        claim_type: retrieval
        grounds:
          - entities.Patient
          - endpoints.GET_observation_patients__id
        distinguishing_aspect: "GET /observation/patients/{id} echoes exactly what POST stored, including the FK to the unit and the ADMITTED default, with no field drift."
        test_recipe:
          setup:
            - "One unit exists; one patient has been admitted to it at the default clock."
          setup_api_calls:
            - call: "POST /observation/units"
              payload: { unit_code: "UNIT-C02", name: "Corner Unit Two", observation_cost_budget_cents: 250000, video_monitoring_enabled: false }
              as: NurseManager
              captures: { u2: $.data.id }
            - call: "POST /observation/patients"
              payload: { unit_id: "${u2}", mrn: "MRN-C0201", full_name: "Corner Patient Two", age_years: 71 }
              as: NurseManager
              captures: { pt2: $.data.id }
          trigger:
            - call: "GET /observation/patients/${pt2}"
              payload: {}
              as: Sitter
              as_user_id: "reader-1"
          assert:
            - "HTTP 200 with response_type == object"
            - "data.id == ${pt2}, data.unit_id == ${u2}, data.mrn == MRN-C0201, data.full_name == Corner Patient Two, data.age_years == 71"
            - "data.status == ADMITTED and data.discharged_at == null"
            - "data.version == 1"

      - name: orders_list_paginates_with_total_count_and_has_more
        claim_type: listing
        grounds:
          - endpoints.GET_observation_orders
          - response_envelope.pagination_fields
        distinguishing_aspect: "Three orders exist; a limit=2 page returns exactly two rows with total_count 3 and has_more true, and the offset=2 page returns the remaining row with has_more false."
        test_recipe:
          setup:
            - "One unit, three admitted patients age 60, one ACTIVE FALL-only order each, all created at the default clock."
          setup_api_calls:
            - call: "POST /observation/units"
              payload: { unit_code: "UNIT-C03", name: "Corner Unit Three", observation_cost_budget_cents: 250000, video_monitoring_enabled: false }
              as: NurseManager
              captures: { u3: $.data.id }
            - call: "POST /observation/patients"
              payload: { unit_id: "${u3}", mrn: "MRN-C0301", full_name: "Corner Patient A", age_years: 60 }
              as: NurseManager
              captures: { pa: $.data.id }
            - call: "POST /observation/patients"
              payload: { unit_id: "${u3}", mrn: "MRN-C0302", full_name: "Corner Patient B", age_years: 60 }
              as: NurseManager
              captures: { pb: $.data.id }
            - call: "POST /observation/patients"
              payload: { unit_id: "${u3}", mrn: "MRN-C0303", full_name: "Corner Patient C", age_years: 60 }
              as: NurseManager
              captures: { pc: $.data.id }
            - call: "POST /observation/orders"
              payload: { patient_id: "${pa}", ordering_provider_user_id: "prov-1", risk_categories: ["FALL"], required_modality: "ONE_TO_ONE_SITTER", clinical_rationale: "Order A" }
              as: AttendingProvider
              as_user_id: "prov-1"
              captures: { oa: $.data.id }
            - call: "POST /observation/orders"
              payload: { patient_id: "${pb}", ordering_provider_user_id: "prov-1", risk_categories: ["FALL"], required_modality: "ONE_TO_ONE_SITTER", clinical_rationale: "Order B" }
              as: AttendingProvider
              as_user_id: "prov-1"
              captures: { ob: $.data.id }
            - call: "POST /observation/orders"
              payload: { patient_id: "${pc}", ordering_provider_user_id: "prov-1", risk_categories: ["FALL"], required_modality: "ONE_TO_ONE_SITTER", clinical_rationale: "Order C" }
              as: AttendingProvider
              as_user_id: "prov-1"
              captures: { oc: $.data.id }
          trigger:
            - call: "GET /observation/orders?limit=2&offset=0"
              payload: {}
              as: NurseManager
              as_user_id: "mgr-1"
            - call: "GET /observation/orders?limit=2&offset=2"
              payload: {}
              as: NurseManager
              as_user_id: "mgr-1"
          assert:
            - "First page: HTTP 200, response_type == array, len(data) == 2, total_count == 3, limit == 2, offset == 0, has_more == true"
            - "Second page: len(data) == 1, total_count == 3, offset == 2, has_more == false"
            - "The three ids across both pages are exactly {${oa}, ${ob}, ${oc}} with no duplicates"

      - name: staff_retrieval_with_unknown_id_returns_staff_not_found
        claim_type: not_found
        grounds:
          - errors.ERR_STAFF_NOT_FOUND
          - endpoints.GET_observation_staff__id
        distinguishing_aspect: "A syntactically valid but unknown staff id returns the entity-specific 404 code, not a generic one."
        test_recipe:
          setup:
            - "Empty database; no Staff row has ever been created."
          setup_api_calls: []
          trigger:
            - call: "GET /observation/staff/11111111-1111-4111-8111-111111111111"
              payload: {}
              as: StaffingCoordinator
              as_user_id: "coord-1"
          assert:
            - "HTTP 404 with response_type == error and data.error_id == ERR_STAFF_NOT_FOUND"

      - name: order_create_without_risk_categories_is_rejected
        claim_type: required_fields
        grounds:
          - endpoints.POST_observation_orders
          - validations.priority_3
          - errors.ERR_INVALID_REQUEST
        distinguishing_aspect: "risk_categories is a required input with no default; omitting it fails the shape gate at priority 3 before any FK lookup or business rule runs, so the response is 400 and not a 404 for the (valid) patient."
        test_recipe:
          setup:
            - "One unit and one admitted patient age 60 exist."
          setup_api_calls:
            - call: "POST /observation/units"
              payload: { unit_code: "UNIT-C05", name: "Corner Unit Five", observation_cost_budget_cents: 250000, video_monitoring_enabled: false }
              as: NurseManager
              captures: { u5: $.data.id }
            - call: "POST /observation/patients"
              payload: { unit_id: "${u5}", mrn: "MRN-C0501", full_name: "Corner Patient Five", age_years: 60 }
              as: NurseManager
              captures: { pt5: $.data.id }
          trigger:
            - call: "POST /observation/orders"
              payload: { patient_id: "${pt5}", ordering_provider_user_id: "prov-1", required_modality: "ONE_TO_ONE_SITTER", clinical_rationale: "Missing risk categories" }
              as: AttendingProvider
              as_user_id: "prov-1"
          assert:
            - "HTTP 400 with data.error_id == ERR_INVALID_REQUEST"
            - "GET /observation/patients/${pt5}/orders returns 0 rows"

      - name: staff_create_defaults_to_available_with_null_suspension_reason
        claim_type: defaults
        grounds:
          - entities.Staff.fields.status
          - entities.Staff.fields.suspension_reason
          - entities.Staff.fields.last_shift_end_at
        distinguishing_aspect: "A freshly created staff row takes its declared defaults (AVAILABLE, null suspension_reason, null last_shift_end_at) even though the client supplies neither."
        test_recipe:
          setup:
            - "One unit exists; nothing else."
          setup_api_calls:
            - call: "POST /observation/units"
              payload: { unit_code: "UNIT-C06", name: "Corner Unit Six", observation_cost_budget_cents: 250000, video_monitoring_enabled: false }
              as: NurseManager
              captures: { u6: $.data.id }
          trigger:
            - call: "POST /observation/staff"
              payload: { home_unit_id: "${u6}", full_name: "Corner Sitter Six", source_pool: "VOLUNTEER", hourly_rate_cents: 0, competency_level: "BASIC", deescalation_cert_expires_on: "2027-01-01T00:00:00Z" }
              as: StaffingCoordinator
              as_user_id: "coord-1"
              captures: { st6: $.data.id }
          assert:
            - "HTTP 201 with data.status == AVAILABLE, data.suspension_reason == null, data.last_shift_end_at == null"
            - "data.source_pool == VOLUNTEER, data.hourly_rate_cents == 0, data.competency_level == BASIC, data.home_unit_id == ${u6}"
            - "data.version == 1"

      - name: unit_create_sets_every_system_field_itself
        claim_type: system_fields
        grounds:
          - entities.Unit.fields.observed_cost_to_date_cents
          - entities.Unit.fields.status
        distinguishing_aspect: "The create body carries only the four declared inputs, so id, version, created_at, updated_at, status, restriction_reason, open_order_count and the computed ledger head must all be server-sourced. version starts at 1 and the ledger head starts at 0 even though nothing in the request mentions either."
        test_recipe:
          setup:
            - "Empty database; the logical clock is at the startup default 2026-08-01T00:00:00Z."
          setup_api_calls: []
          trigger:
            - call: "POST /observation/units"
              payload: { unit_code: "UNIT-C07", name: "Corner Unit Seven", observation_cost_budget_cents: 250000, video_monitoring_enabled: false }
              as: NurseManager
              as_user_id: "mgr-1"
              captures: { u7: $.data.id }
          assert:
            - "data.id is a non-empty server-generated string that appeared nowhere in the request"
            - "data.version == 1 and data.created_at == data.updated_at == 2026-08-01T00:00:00Z (the logical clock, not wall time)"
            - "data.status == OPEN and data.restriction_reason == null"
            - "data.observed_cost_to_date_cents == 0 and data.open_order_count == 0"
            - "GET /observation/units/${u7} returns byte-identical values for all of the above"

      - name: order_create_with_duplicate_risk_category_is_rejected
        claim_type: type_constraints
        grounds:
          - entities.ObservationOrder.fields.risk_categories
          - errors.ERR_INVALID_REQUEST
        distinguishing_aspect: "risk_categories is constrained to a non-empty duplicate-free subset of {FALL, ELOPEMENT, SELF_HARM}; a duplicated member would silently double the score weight, so it must be rejected at the shape gate rather than scored."
        test_recipe:
          setup:
            - "One unit and one admitted patient age 60 exist."
          setup_api_calls:
            - call: "POST /observation/units"
              payload: { unit_code: "UNIT-C08", name: "Corner Unit Eight", observation_cost_budget_cents: 250000, video_monitoring_enabled: false }
              as: NurseManager
              captures: { u8: $.data.id }
            - call: "POST /observation/patients"
              payload: { unit_id: "${u8}", mrn: "MRN-C0801", full_name: "Corner Patient Eight", age_years: 60 }
              as: NurseManager
              captures: { pt8: $.data.id }
          trigger:
            - call: "POST /observation/orders"
              payload: { patient_id: "${pt8}", ordering_provider_user_id: "prov-1", risk_categories: ["FALL", "FALL"], required_modality: "ONE_TO_ONE_SITTER", clinical_rationale: "Duplicated category" }
              as: AttendingProvider
              as_user_id: "prov-1"
          assert:
            - "HTTP 400 with data.error_id == ERR_INVALID_REQUEST"
            - "GET /observation/patients/${pt8}/orders returns 0 rows (no order was scored at 3.0)"

      - name: reassessment_rows_are_immutable_and_carry_no_version
        claim_type: immutability
        grounds:
          - entities.Reassessment
          - endpoints.GET_observation_reassessments__id
        distinguishing_aspect: "Reassessment is declared common_fields: false, so its rows expose no version and no updated_at and there is no endpoint that mutates one; the audit trail is append-only and a second reassessment adds a row rather than editing the first."
        test_recipe:
          setup:
            - "One unit, one admitted patient age 60, one ACTIVE FALL-only order (score 1.5, interval 24h) at the default clock."
            - "Two reassessments are performed at the same clock instant, the second one adding ELOPEMENT."
          setup_api_calls:
            - call: "POST /observation/units"
              payload: { unit_code: "UNIT-C09", name: "Corner Unit Nine", observation_cost_budget_cents: 250000, video_monitoring_enabled: false }
              as: NurseManager
              captures: { u9: $.data.id }
            - call: "POST /observation/patients"
              payload: { unit_id: "${u9}", mrn: "MRN-C0901", full_name: "Corner Patient Nine", age_years: 60 }
              as: NurseManager
              captures: { pt9: $.data.id }
            - call: "POST /observation/orders"
              payload: { patient_id: "${pt9}", ordering_provider_user_id: "prov-1", risk_categories: ["FALL"], required_modality: "ONE_TO_ONE_SITTER", clinical_rationale: "Baseline fall risk" }
              as: AttendingProvider
              as_user_id: "prov-1"
              captures: { o9c: $.data.id }
            - call: "POST /observation/orders/${o9c}/reassessments"
              payload: { risk_categories_after: ["FALL"] }
              as: AttendingProvider
              as_user_id: "prov-1"
              captures: { ra1: $.data.id }
          trigger:
            - call: "POST /observation/orders/${o9c}/reassessments"
              payload: { risk_categories_after: ["FALL", "ELOPEMENT"] }
              as: AttendingProvider
              as_user_id: "prov-3"
              captures: { ra2: $.data.id }
          assert:
            - "GET /observation/reassessments/${ra1} still reports score_before == 1.5, score_after == 1.5, interval_hours_after == 24 and performed_by_user_id == prov-1 — the first row is untouched"
            - "The Reassessment payload exposes no version and no updated_at field (common_fields: false)"
            - "GET /observation/reassessments/${ra2} reports score_before == 1.5, score_after == 4.0, interval_hours_after == 12, performed_by_user_id == prov-3"
            - "GET /observation/orders/${o9c}/reassessments returns exactly 2 rows in ascending reassessed_at order, ${ra1} then ${ra2}"
            - "ObservationOrder.${o9c}.reassessment_count == 2, elopement_risk_score == 4.0, risk_categories == [FALL, ELOPEMENT]"

      - name: sitter_assignment_create_with_unknown_staff_id_returns_staff_not_found
        claim_type: parent_relationships
        grounds:
          - validations.priority_5
          - errors.ERR_STAFF_NOT_FOUND
          - entities.SitterAssignment.fields.staff_id
        distinguishing_aspect: "entity_topology is flat, so every body FK is validated on its own: an assignment naming a real order but an unknown staff_id fails with the staff-specific 404 at priority 5 — ahead of the OCC check at priority 7, even though the supplied expected_order_version is deliberately stale."
        test_recipe:
          setup:
            - "One unit, one admitted patient age 60, one ACTIVE FALL-only order."
            - "An early reassessment is performed immediately, which bumps the order version, so the version captured at creation is now genuinely stale."
            - "The request names a staff id that was never created AND replays that stale order version, so the ordering of priorities 5 and 7 is observable."
          setup_api_calls:
            - call: "POST /observation/units"
              payload: { unit_code: "UNIT-C10", name: "Corner Unit Ten", observation_cost_budget_cents: 250000, video_monitoring_enabled: false }
              as: NurseManager
              captures: { u10: $.data.id }
            - call: "POST /observation/patients"
              payload: { unit_id: "${u10}", mrn: "MRN-C1001", full_name: "Corner Patient Ten", age_years: 60 }
              as: NurseManager
              captures: { pt10: $.data.id }
            - call: "POST /observation/orders"
              payload: { patient_id: "${pt10}", ordering_provider_user_id: "prov-1", risk_categories: ["FALL"], required_modality: "ONE_TO_ONE_SITTER", clinical_rationale: "Fall precautions" }
              as: AttendingProvider
              as_user_id: "prov-1"
              captures: { o10c: $.data.id, o10c_v1: $.data.version }
            - call: "POST /observation/orders/${o10c}/reassessments"
              payload: { risk_categories_after: ["FALL"] }
              as: AttendingProvider
              as_user_id: "prov-1"
            - call: "GET /observation/orders/${o10c}"
              payload: {}
              as: StaffingCoordinator
              captures: { o10c_v2: $.data.version }
          trigger:
            - call: "POST /observation/sitter-assignments"
              payload: { order_id: "${o10c}", staff_id: "22222222-2222-4222-8222-222222222222", shift_start_at: "2026-08-01T08:00:00Z", shift_end_at: "2026-08-01T16:00:00Z", expected_order_version: "${o10c_v1}" }
              as: StaffingCoordinator
              as_user_id: "coord-1"
          assert:
            - "HTTP 404 with data.error_id == ERR_STAFF_NOT_FOUND — not 412 ERR_STALE_ORDER_VERSION, although replaying ${o10c_v1} against the current ${o10c_v2} also violates priority 7"
            - "ObservationOrder.${o10c}.version == ${o10c_v2} (the rejected create bumped nothing)"
            - "Unit.${u10}.observed_cost_to_date_cents == 0"

      - name: unit_ledger_head_is_a_computed_field_not_a_stored_input
        claim_type: computed_fields
        grounds:
          - entities.Unit.fields.observed_cost_to_date_cents
        excluded_because:
          difficulty_instance: "compensating_invariant / void_reverses_the_provisional_charge_leaving_the_unit_ledger_at_zero"
          rationale: "That instance asserts the head at 0, then 19200, then 0 again strictly as a function of the POSTED CostEntry set, which is exactly the computed-field claim."

  - section: state_machines
    instances:
      - name: new_order_starts_active_with_the_admission_baseline_variant
        claim_type: initial_state
        grounds:
          - state_machines.ObservationOrder.initial_state
          - calculations.patient_elopement_risk_score.variants.admission_baseline
        distinguishing_aspect: "A newly created order starts in ACTIVE with the ADMISSION_BASELINE score variant, reassessment_count 0 and last_reassessed_at pinned to the creation instant — the baseline variant reads no SafetyEvent row even for a patient who has one on an earlier order."
        test_recipe:
          setup:
            - "One unit; one admitted patient age 76 (over the age-adjustment threshold); an ELOPEMENT_ATTEMPT event already exists on an EARLIER order for the same patient, closed at the default clock."
            - "The earlier order is left ACTIVE; the assertion is about the SECOND order created for the same patient."
          setup_api_calls:
            - call: "POST /observation/units"
              payload: { unit_code: "UNIT-C11", name: "Corner Unit Eleven", observation_cost_budget_cents: 250000, video_monitoring_enabled: false }
              as: NurseManager
              captures: { u11: $.data.id }
            - call: "POST /observation/patients"
              payload: { unit_id: "${u11}", mrn: "MRN-C1101", full_name: "Corner Patient Eleven", age_years: 76 }
              as: NurseManager
              captures: { pt11: $.data.id }
            - call: "POST /observation/staff"
              payload: { home_unit_id: "${u11}", full_name: "Corner Sitter Eleven", source_pool: "INTERNAL_FLOAT", hourly_rate_cents: 2000, competency_level: "ADVANCED", deescalation_cert_expires_on: "2027-01-01T00:00:00Z" }
              as: StaffingCoordinator
              captures: { st11: $.data.id }
            - call: "POST /observation/orders"
              payload: { patient_id: "${pt11}", ordering_provider_user_id: "prov-1", risk_categories: ["ELOPEMENT"], required_modality: "ONE_TO_ONE_SITTER", clinical_rationale: "First order for this patient" }
              as: AttendingProvider
              as_user_id: "prov-1"
              captures: { o11a: $.data.id }
            - call: "POST /observation/safety-events"
              payload: { order_id: "${o11a}", event_kind: "ELOPEMENT_ATTEMPT", narrative: "Attempted to follow a visitor out" }
              as: Sitter
              as_user_id: "${st11}"
              captures: { ev11: $.data.id }
            - call: "POST /observation/safety-events/${ev11}/escalate-response"
              payload: { response_actions: ["VERBAL_REDIRECTION"] }
              as: SafetyOfficer
              as_user_id: "safety-1"
            - call: "POST /observation/safety-events/${ev11}/close"
              payload: { resolution: "CONTINUE_OBSERVATION" }
              as: SafetyOfficer
              as_user_id: "safety-2"
          trigger:
            - call: "POST /observation/orders"
              payload: { patient_id: "${pt11}", ordering_provider_user_id: "prov-1", risk_categories: ["FALL"], required_modality: "ONE_TO_ONE_SITTER", clinical_rationale: "Second order, fall precautions" }
              as: AttendingProvider
              as_user_id: "prov-1"
              captures: { o11b: $.data.id }
          assert:
            - "HTTP 201 with data.status == ACTIVE"
            - "data.elopement_risk_score == 2.5 (FALL 1.5 + age adjustment 1.0 + event_component fixed at 0.0) and data.risk_score_variant == ADMISSION_BASELINE"
            - "data.reassessment_interval_hours == 24 and data.next_reassessment_due_at == 2026-08-02T00:00:00Z"
            - "data.last_reassessed_at == 2026-08-01T00:00:00Z, data.reassessment_count == 0, data.coverage_gap_flag == false"
            - "data.discontinuation_recommendation == null, data.discontinued_at == null, data.lapsed_at == null, data.version == 1"
            - "The earlier order ${o11a} still reports elopement_risk_score 3.5 with variant ROLLING_EVENT_WEIGHTED, proving the two orders are scored independently"

      - name: break_start_from_scheduled_watch_is_rejected
        claim_type: invalid_transitions
        grounds:
          - state_machines.SitterAssignment.watch_status
          - errors.ERR_INVALID_ASSIGNMENT_STATE
        distinguishing_aspect: "ON_BREAK is only declared as a target from ON_WATCH; break-start on a still-SCHEDULED watch is an undeclared edge and must fail at priority 8 with no FINAL_SEGMENT posted."
        test_recipe:
          setup:
            - "One unit budget 250000, one admitted patient age 60, one ACTIVE FALL-only order, one SCHEDULED watch 08:00Z -> 16:00Z at 2000 cents/hour (PROVISIONAL 16000)."
            - "The clock is advanced to 2026-08-01T08:00:00Z but start-watch is deliberately never called."
          setup_api_calls:
            - call: "POST /observation/units"
              payload: { unit_code: "UNIT-C12", name: "Corner Unit Twelve", observation_cost_budget_cents: 250000, video_monitoring_enabled: false }
              as: NurseManager
              captures: { u12: $.data.id }
            - call: "POST /observation/patients"
              payload: { unit_id: "${u12}", mrn: "MRN-C1201", full_name: "Corner Patient Twelve", age_years: 60 }
              as: NurseManager
              captures: { pt12: $.data.id }
            - call: "POST /observation/staff"
              payload: { home_unit_id: "${u12}", full_name: "Corner Sitter Twelve", source_pool: "INTERNAL_FLOAT", hourly_rate_cents: 2000, competency_level: "ADVANCED", deescalation_cert_expires_on: "2027-01-01T00:00:00Z" }
              as: StaffingCoordinator
              captures: { st12: $.data.id }
            - call: "POST /observation/orders"
              payload: { patient_id: "${pt12}", ordering_provider_user_id: "prov-1", risk_categories: ["FALL"], required_modality: "ONE_TO_ONE_SITTER", clinical_rationale: "Fall precautions" }
              as: AttendingProvider
              as_user_id: "prov-1"
              captures: { o12c: $.data.id, o12c_v1: $.data.version }
            - call: "POST /observation/sitter-assignments"
              payload: { order_id: "${o12c}", staff_id: "${st12}", shift_start_at: "2026-08-01T08:00:00Z", shift_end_at: "2026-08-01T16:00:00Z", expected_order_version: "${o12c_v1}" }
              as: StaffingCoordinator
              captures: { a12: $.data.id }
            - call: "POST /observation/_clock/set_current_utc"
