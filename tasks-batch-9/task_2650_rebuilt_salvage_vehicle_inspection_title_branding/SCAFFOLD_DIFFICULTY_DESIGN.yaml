# =============================================================================
# §1.8 SCAFFOLD DIFFICULTY DESIGN — task_2650 rebuilt salvage vehicle inspection
# & title branding
#
# Nine §0.5 rule_ids x 2 instances = 18 instances. Every `grounds:` entry resolves
# into SCAFFOLD.yaml §1.1-§1.7; every numeric assert below was executed against the
# declared formula and its constants and is written as a literal.
#
# Logical-clock convention: the server starts at 2026-08-01T00:00:00Z. Chains that
# need a later or earlier instant call POST /v1/_clock/set_current_utc explicitly.
# =============================================================================

scaffold_difficulty_design:

  # ===========================================================================
  - rule_id: dual_variant_calc
    instances:
      - name: damage_basis_variant_flips_recommended_brand_on_identical_damage
        grounds:
          - calculations.damage_threshold_evaluation
          - calculations.damage_threshold_evaluation.variants.gross_estimate_basis
          - calculations.damage_threshold_evaluation.variants.net_of_salvage_basis
          - entities.InsurerDamageReport.fields.damage_ratio
          - entities.InsurerDamageReport.fields.recommended_brand_code
        distinguishing_aspect: |
          This instance's dual variant lives in the InsurerDamageReport / title-branding domain: two
          reports carrying byte-identical acv_cents (1000000) and repair_estimate_cents (740000)
          produce damage_ratio 0.7400 -> NONE under gross_estimate_basis and 0.8222 -> SALVAGE under
          net_of_salvage_basis, because the net variant shrinks the denominator by
          salvage_retention_cents (100000).
        test_recipe:
          setup:
            - "two registered SEDAN vehicles, no titles yet"
            - "logical clock at its 2026-08-01T00:00:00Z default"
          setup_api_calls:
            - call: "POST /v1/vehicles"
              payload: { vin: "1HGCM82633A004352", model_year: 2019, make: "Honda", model: "Accord", body_class: "SEDAN", registered_state_code: "NV" }
              as: StateTitleClerk
              as_user_id: "clerk-01"
              captures: { veh_gross_id: $.data.id }
            - call: "POST /v1/vehicles"
              payload: { vin: "1HGCM82633A004353", model_year: 2019, make: "Honda", model: "Accord", body_class: "SEDAN", registered_state_code: "NV" }
              as: StateTitleClerk
              as_user_id: "clerk-01"
              captures: { veh_net_id: $.data.id }
          trigger:
            - call: "POST /v1/damage-reports"
              payload: { vehicle_id: "${veh_gross_id}", insurer_name: "Cascade Mutual", claim_number: "CM-70001", basis_code: "GROSS_ESTIMATE", acv_cents: 1000000, repair_estimate_cents: 740000, damage_type: "COLLISION", odometer_reading_miles: 64000, report_effective_at: "2026-07-15T00:00:00Z", total_loss_declared: true }
              as: InsurerAdjuster
              as_user_id: "adj-01"
              captures: { rep_gross_id: $.data.id, ratio_gross: $.data.damage_ratio }
            - call: "POST /v1/damage-reports"
              payload: { vehicle_id: "${veh_net_id}", insurer_name: "Cascade Mutual", claim_number: "CM-70002", basis_code: "NET_OF_SALVAGE", acv_cents: 1000000, repair_estimate_cents: 740000, salvage_retention_cents: 100000, damage_type: "COLLISION", odometer_reading_miles: 64000, report_effective_at: "2026-07-15T00:00:00Z", total_loss_declared: true }
              as: InsurerAdjuster
              as_user_id: "adj-01"
              captures: { rep_net_id: $.data.id, ratio_net: $.data.damage_ratio }
          assert:
            - "InsurerDamageReport.${rep_gross_id}.damage_ratio == 0.7400"
            - "InsurerDamageReport.${rep_gross_id}.recommended_brand_code == NONE"
            - "InsurerDamageReport.${rep_net_id}.damage_ratio == 0.8222"
            - "InsurerDamageReport.${rep_net_id}.recommended_brand_code == SALVAGE"
            - "the two reports carry identical acv_cents and repair_estimate_cents, so the 0.0822 ratio delta is attributable only to the variant"

      - name: recordkeeping_score_rolling_window_diverges_from_lifetime_cumulative
        grounds:
          - calculations.rebuilder_recordkeeping_score
          - calculations.rebuilder_recordkeeping_score.variants.rolling_12_month
          - calculations.rebuilder_recordkeeping_score.variants.lifetime_cumulative
          - entities.Rebuilder.fields.recordkeeping_score_rolling
          - entities.Rebuilder.fields.recordkeeping_score_lifetime
        distinguishing_aspect: |
          This instance's dual variant lives in the Rebuilder / record-keeping domain (not the
          damage-report domain of the sibling instance): one REJECTED document filed at
          2025-01-10 sits outside the 365-day window while one VERIFIED traceable document filed at
          2026-08-01 sits inside, so recordkeeping_score_rolling == 100.00 while
          recordkeeping_score_lifetime == 50.00 over the same rebuilder.
        test_recipe:
          setup:
            - "one licensed rebuilder with a DRAFT application on a SALVAGE-titled SEDAN"
            - "one REJECTED parts document created at 2025-01-10, i.e. more than 365 days before the observation instant"
            - "one VERIFIED traceable parts document created at 2026-08-01, inside the rolling window"
          setup_api_calls:
            - call: "POST /v1/_clock/set_current_utc"
              payload: { to_iso8601: "2025-01-10T00:00:00Z" }
              as: ProgramAdmin
              as_user_id: "admin-01"
            - call: "POST /v1/vehicles"
              payload: { vin: "1HGCM82633A004401", model_year: 2018, make: "Toyota", model: "Camry", body_class: "SEDAN", registered_state_code: "NV" }
              as: StateTitleClerk
              as_user_id: "clerk-01"
              captures: { veh_id: $.data.id }
            - call: "POST /v1/rebuilders"
              payload: { legal_name: "Sierra Rebuilders LLC", license_number: "RB-1001", license_expires_at: "2027-06-30T00:00:00Z", bond_amount_cents: 2500000 }
              as: ProgramAdmin
              as_user_id: "admin-01"
              captures: { rb_id: $.data.id }
            - call: "POST /v1/inspectors"
              payload: { full_name: "Dana Ruiz", badge_number: "INS-3001", credential_expires_at: "2027-01-01T00:00:00Z", certifications: ["STRUCTURAL", "VIN"], home_state_code: "NV" }
              as: ProgramAdmin
              as_user_id: "admin-01"
              captures: { insp_id: $.data.id }
            - call: "POST /v1/damage-reports"
              payload: { vehicle_id: "${veh_id}", insurer_name: "Cascade Mutual", claim_number: "CM-70010", basis_code: "GROSS_ESTIMATE", acv_cents: 1000000, repair_estimate_cents: 800000, damage_type: "COLLISION", odometer_reading_miles: 71000, report_effective_at: "2025-01-05T00:00:00Z", total_loss_declared: true }
              as: InsurerAdjuster
              as_user_id: "adj-01"
              captures: { rep_id: $.data.id }
            - call: "POST /v1/title-records"
              payload: { vehicle_id: "${veh_id}", issuing_state_code: "NV", owner_name: "Ada Reyes", source_damage_report_id: "${rep_id}" }
              as: StateTitleClerk
              as_user_id: "clerk-01"
              captures: { sal_title_id: $.data.id }
            - call: "POST /v1/applications"
              payload: { vehicle_id: "${veh_id}", rebuilder_id: "${rb_id}", salvage_title_id: "${sal_title_id}", declared_repair_cost_cents: 800000 }
              as: Rebuilder
              as_user_id: "${rb_id}"
              captures: { app_id: $.data.id }
            - call: "POST /v1/applications/${app_id}/parts-documents"
              payload: { doc_type: "RECEIPT", part_class: "BODY_PANEL", source_type: "NEW", amount_cents: 40000, vendor_name: "Valley Body Supply" }
              as: Rebuilder
              as_user_id: "${rb_id}"
              captures: { doc_old_id: $.data.id }
            - call: "POST /v1/parts-documents/${doc_old_id}/reject"
              payload: { rejection_reason: "ILLEGIBLE", rejection_note: "receipt scan unreadable" }
              as: Inspector
              as_user_id: "${insp_id}"
            - call: "POST /v1/_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-01T00:00:00Z" }
              as: ProgramAdmin
              as_user_id: "admin-01"
            - call: "POST /v1/applications/${app_id}/parts-documents"
              payload: { doc_type: "PARTS_INVOICE", part_class: "STRUCTURAL", source_type: "NEW", amount_cents: 200000, vendor_name: "OEM Frame Supply", part_serial_number: "FR-88231" }
              as: Rebuilder
              as_user_id: "${rb_id}"
              captures: { doc_new_id: $.data.id }
          trigger:
            - call: "POST /v1/parts-documents/${doc_new_id}/verify"
              payload: { verification_note: "OEM invoice matches part serial" }
              as: Inspector
              as_user_id: "${insp_id}"
          assert:
            - "Rebuilder.${rb_id}.recordkeeping_score_rolling == 100.00"
            - "Rebuilder.${rb_id}.recordkeeping_score_lifetime == 50.00"
            - "PartsDocument.${doc_old_id}.status == REJECTED and PartsDocument.${doc_new_id}.status == VERIFIED"
            - "PartsDocument.${doc_new_id}.traceable == true"

  # ===========================================================================
  - rule_id: combinatorial_formula
    instances:
      - name: donor_surcharge_rounds_each_line_before_summation
        grounds:
          - calculations.inspection_fee_assessment
          - entities.RebuiltApplication.fields.assessed_fee_cents
          - entities.PartsDocument.fields.source_type
          - state_machines.PartsDocument.SUBMITTED_to_VERIFIED
        distinguishing_aspect: |
          Mode (b) — rounding order: three USED_DONOR lines of 12499 cents each round to 187 cents
          apiece BEFORE summation, giving donor_surcharge 561 and assessed_fee_cents 8061; summing
          the amounts first (37497 * 0.015 = 562.455 -> 562) would yield 8062, so the two orders are
          separated by exactly 1 cent.
        test_recipe:
          setup:
            - "a TRAILER vehicle (REQUIRED_PART_CLASSES is empty, so documentation gating is out of the way)"
            - "a donor vehicle holding an unbranded ACTIVE title used as the traceable donor source"
            - "three USED_DONOR POWERTRAIN documents of 12499 cents each, none of them STRUCTURAL"
          setup_api_calls:
            - call: "POST /v1/vehicles"
              payload: { vin: "1HGCM82633A004501", model_year: 2020, make: "Wells", model: "Cargo", body_class: "TRAILER", registered_state_code: "NV" }
              as: StateTitleClerk
              as_user_id: "clerk-01"
              captures: { veh_id: $.data.id }
            - call: "POST /v1/vehicles"
              payload: { vin: "1HGCM82633A004502", model_year: 2015, make: "Wells", model: "Cargo", body_class: "TRAILER", registered_state_code: "NV" }
              as: StateTitleClerk
              as_user_id: "clerk-01"
              captures: { donor_veh_id: $.data.id }
            - call: "POST /v1/title-records"
              payload: { vehicle_id: "${donor_veh_id}", issuing_state_code: "NV", owner_name: "Pine Salvage Yard" }
              as: StateTitleClerk
              as_user_id: "clerk-01"
              captures: { donor_title_id: $.data.id }
            - call: "POST /v1/rebuilders"
              payload: { legal_name: "Sierra Rebuilders LLC", license_number: "RB-1002", license_expires_at: "2027-06-30T00:00:00Z", bond_amount_cents: 2500000 }
              as: ProgramAdmin
              as_user_id: "admin-01"
              captures: { rb_id: $.data.id }
            - call: "POST /v1/inspectors"
              payload: { full_name: "Dana Ruiz", badge_number: "INS-3002", credential_expires_at: "2027-01-01T00:00:00Z", certifications: ["STRUCTURAL", "VIN"], home_state_code: "NV" }
              as: ProgramAdmin
              as_user_id: "admin-01"
              captures: { insp_id: $.data.id }
            - call: "POST /v1/damage-reports"
              payload: { vehicle_id: "${veh_id}", insurer_name: "Cascade Mutual", claim_number: "CM-70020", basis_code: "GROSS_ESTIMATE", acv_cents: 400000, repair_estimate_cents: 320000, damage_type: "COLLISION", odometer_reading_miles: 0, report_effective_at: "2026-07-20T00:00:00Z", total_loss_declared: true }
              as: InsurerAdjuster
              as_user_id: "adj-01"
              captures: { rep_id: $.data.id }
            - call: "POST /v1/title-records"
              payload: { vehicle_id: "${veh_id}", issuing_state_code: "NV", owner_name: "Ada Reyes", source_damage_report_id: "${rep_id}" }
              as: StateTitleClerk
              as_user_id: "clerk-01"
              captures: { sal_title_id: $.data.id }
            - call: "POST /v1/applications"
              payload: { vehicle_id: "${veh_id}", rebuilder_id: "${rb_id}", salvage_title_id: "${sal_title_id}", declared_repair_cost_cents: 320000 }
              as: Rebuilder
              as_user_id: "${rb_id}"
              captures: { app_id: $.data.id }
            - call: "POST /v1/applications/${app_id}/parts-documents"
              payload: { doc_type: "PARTS_INVOICE", part_class: "POWERTRAIN", source_type: "USED_DONOR", amount_cents: 12499, vendor_name: "Pine Salvage Yard", part_serial_number: "PT-1", donor_vin: "1HGCM82633A004502", donor_title_id: "${donor_title_id}" }
              as: Rebuilder
              as_user_id: "${rb_id}"
              captures: { doc1_id: $.data.id }
            - call: "POST /v1/applications/${app_id}/parts-documents"
              payload: { doc_type: "PARTS_INVOICE", part_class: "POWERTRAIN", source_type: "USED_DONOR", amount_cents: 12499, vendor_name: "Pine Salvage Yard", part_serial_number: "PT-2", donor_vin: "1HGCM82633A004502", donor_title_id: "${donor_title_id}" }
              as: Rebuilder
              as_user_id: "${rb_id}"
              captures: { doc2_id: $.data.id }
            - call: "POST /v1/applications/${app_id}/parts-documents"
              payload: { doc_type: "PARTS_INVOICE", part_class: "POWERTRAIN", source_type: "USED_DONOR", amount_cents: 12499, vendor_name: "Pine Salvage Yard", part_serial_number: "PT-3", donor_vin: "1HGCM82633A004502", donor_title_id: "${donor_title_id}" }
              as: Rebuilder
              as_user_id: "${rb_id}"
              captures: { doc3_id: $.data.id }
            - call: "POST /v1/parts-documents/${doc1_id}/verify"
              payload: { verification_note: "donor title checked" }
              as: Inspector
              as_user_id: "${insp_id}"
            - call: "POST /v1/parts-documents/${doc2_id}/verify"
              payload: { verification_note: "donor title checked" }
              as: Inspector
              as_user_id: "${insp_id}"
          trigger:
            - call: "POST /v1/parts-documents/${doc3_id}/verify"
              payload: { verification_note: "donor title checked" }
              as: Inspector
              as_user_id: "${insp_id}"
          assert:
            - "RebuiltApplication.${app_id}.assessed_fee_cents == 8061"
            - "RebuiltApplication.${app_id}.documented_parts_cost_cents == 37497"
            - "RebuiltApplication.${app_id}.assessed_fee_cents != 8062 (the sum-then-round order is wrong)"
            - "RebuiltApplication.${app_id}.documentation_completeness_pct == 100.00"

      - name: expedite_tier_keyed_on_subtotal_not_on_running_total
        grounds:
          - calculations.total_program_charge
          - calculations.inspection_fee_assessment
          - entities.RebuiltApplication.fields.total_program_charge_cents
          - state_machines.RebuiltApplication.DRAFT_to_SUBMITTED
        distinguishing_aspect: |
          Mode (c) — evaluation order, a different mode from the sibling instance's rounding order:
          assessed_fee_cents 9800 gives subtotal_cents 9800, which is below EXPEDITE_TIER_1_CEILING
          (10000) so expedite_pct is 0.10 and total_program_charge_cents == 10780; keying the tier on
          the running total (10780, which is above the ceiling) would apply 0.07 and produce 10486.
        test_recipe:
          setup:
            - "a TRAILER vehicle on a SALVAGE title, application created with expedite_requested = true"
            - "one VERIFIED USED_DONOR POWERTRAIN document of 153333 cents (surcharge 2300, assessed fee 9800) and no VERIFIED STRUCTURAL document"
            - "four PHOTOGRAPH documents covering FRONT, REAR, LEFT and RIGHT"
            - "rebuilder fee_balance_cents == 500000, attempts_completed == 0, applications_titled_count == 0"
          setup_api_calls:
            - call: "POST /v1/vehicles"
              payload: { vin: "1HGCM82633A004601", model_year: 2020, make: "Wells", model: "Cargo", body_class: "TRAILER", registered_state_code: "NV" }
              as: StateTitleClerk
              as_user_id: "clerk-01"
              captures: { veh_id: $.data.id }
            - call: "POST /v1/vehicles"
              payload: { vin: "1HGCM82633A004602", model_year: 2014, make: "Wells", model: "Cargo", body_class: "TRAILER", registered_state_code: "NV" }
              as: StateTitleClerk
              as_user_id: "clerk-01"
              captures: { donor_veh_id: $.data.id }
            - call: "POST /v1/title-records"
              payload: { vehicle_id: "${donor_veh_id}", issuing_state_code: "NV", owner_name: "Pine Salvage Yard" }
              as: StateTitleClerk
              as_user_id: "clerk-01"
              captures: { donor_title_id: $.data.id }
            - call: "POST /v1/rebuilders"
              payload: { legal_name: "Sierra Rebuilders LLC", license_number: "RB-1003", license_expires_at: "2027-06-30T00:00:00Z", bond_amount_cents: 2500000 }
              as: ProgramAdmin
              as_user_id: "admin-01"
              captures: { rb_id: $.data.id }
            - call: "POST /v1/rebuilders/${rb_id}/deposits"
              payload: { amount_cents: 500000 }
              as: ProgramAdmin
              as_user_id: "admin-01"
            - call: "POST /v1/inspectors"
              payload: { full_name: "Dana Ruiz", badge_number: "INS-3003", credential_expires_at: "2027-01-01T00:00:00Z", certifications: ["STRUCTURAL", "VIN"], home_state_code: "NV" }
              as: ProgramAdmin
              as_user_id: "admin-01"
              captures: { insp_id: $.data.id }
            - call: "POST /v1/damage-reports"
              payload: { vehicle_id: "${veh_id}", insurer_name: "Cascade Mutual", claim_number: "CM-70030", basis_code: "GROSS_ESTIMATE", acv_cents: 400000, repair_estimate_cents: 320000, damage_type: "COLLISION", odometer_reading_miles: 0, report_effective_at: "2026-07-20T00:00:00Z", total_loss_declared: true }
              as: InsurerAdjuster
              as_user_id: "adj-01"
              captures: { rep_id: $.data.id }
            - call: "POST /v1/title-records"
              payload: { vehicle_id: "${veh_id}", issuing_state_code: "NV", owner_name: "Ada Reyes", source_damage_report_id: "${rep_id}" }
              as: StateTitleClerk
              as_user_id: "clerk-01"
              captures: { sal_title_id: $.data.id }
            - call: "POST /v1/applications"
              payload: { vehicle_id: "${veh_id}", rebuilder_id: "${rb_id}", salvage_title_id: "${sal_title_id}", declared_repair_cost_cents: 320000, expedite_requested: true }
              as: Rebuilder
              as_user_id: "${rb_id}"
              captures: { app_id: $.data.id }
            - call: "POST /v1/applications/${app_id}/parts-documents"
              payload: { doc_type: "PARTS_INVOICE", part_class: "POWERTRAIN", source_type: "USED_DONOR", amount_cents: 153333, vendor_name: "Pine Salvage Yard", part_serial_number: "PT-9", donor_vin: "1HGCM82633A004602", donor_title_id: "${donor_title_id}" }
              as: Rebuilder
              as_user_id: "${rb_id}"
              captures: { doc_donor_id: $.data.id }
            - call: "POST /v1/parts-documents/${doc_donor_id}/verify"
              payload: { verification_note: "donor title checked" }
              as: Inspector
              as_user_id: "${insp_id}"
            - call: "POST /v1/applications/${app_id}/parts-documents"
              payload: { doc_type: "PHOTOGRAPH", part_class: "PHOTO_SET", source_type: "OWNER_SUPPLIED", photo_view_code: "FRONT" }
              as: Rebuilder
              as_user_id: "${rb_id}"
            - call: "POST /v1/applications/${app_id}/parts-documents"
              payload: { doc_type: "PHOTOGRAPH", part_class: "PHOTO_SET", source_type: "OWNER_SUPPLIED", photo_view_code: "REAR" }
              as: Rebuilder
              as_user_id: "${rb_id}"
            - call: "POST /v1/applications/${app_id}/parts-documents"
              payload: { doc_type: "PHOTOGRAPH", part_class: "PHOTO_SET", source_type: "OWNER_SUPPLIED", photo_view_code: "LEFT" }
              as: Rebuilder
              as_user_id: "${rb_id}"
            - call: "POST /v1/applications/${app_id}/parts-documents"
              payload: { doc_type: "PHOTOGRAPH", part_class: "PHOTO_SET", source_type: "OWNER_SUPPLIED", photo_view_code: "RIGHT" }
              as: Rebuilder
              as_user_id: "${rb_id}"
          trigger:
            - call: "POST /v1/applications/${app_id}/submit"
              payload: { attestation_signed: true }
              as: Rebuilder
              as_user_id: "${rb_id}"
          assert:
            - "RebuiltApplication.${app_id}.assessed_fee_cents == 9800"
            - "RebuiltApplication.${app_id}.total_program_charge_cents == 10780"
            - "RebuiltApplication.${app_id}.total_program_charge_cents != 10486 (tier keyed on the running total is wrong)"
            - "RebuiltApplication.${app_id}.fee_escrowed_cents == 10780"
            - "Rebuilder.${rb_id}.fee_balance_cents == 489220"
            - "Rebuilder.${rb_id}.escrowed_fee_total_cents == 10780"
            - "RebuiltApplication.${app_id}.status == SUBMITTED"

  # ===========================================================================
  - rule_id: non_linear_state_machine
    instances:
      - name: docs_review_return_loops_application_back_to_draft_with_escrow_retained
        grounds:
          - state_machines.RebuiltApplication.SUBMITTED_to_DOCS_UNDER_REVIEW
          - state_machines.RebuiltApplication.DOCS_UNDER_REVIEW_to_DRAFT
          - entities.RebuiltApplication.fields.fee_escrowed_cents
          - validations[priority=61]
        distinguishing_aspect: |
          Non-linearity of the RebuiltApplication machine: the RETURN decision walks the workflow
          BACKWARDS from DOCS_UNDER_REVIEW to the initial state DRAFT while fee_escrowed_cents stays
          at 20000 and Rebuilder.fee_balance_cents stays at 480000, so the cycle is not a reset.
        test_recipe:
          setup:
            - "a SEDAN on a SALVAGE title with STRUCTURAL, RESTRAINT and LIGHTING documents VERIFIED and four photo views on file"
            - "rebuilder funded with 500000 cents; the application already submitted (escrow 20000) and opened for review"
          setup_api_calls:
            - call: "POST /v1/vehicles"
              payload: { vin: "1HGCM82633A004701", model_year: 2019, make: "Honda", model: "Accord", body_class: "SEDAN", registered_state_code: "NV" }
              as: StateTitleClerk
              as_user_id: "clerk-01"
              captures: { veh_id: $.data.id }
            - call: "POST /v1/rebuilders"
              payload: { legal_name: "Sierra Rebuilders LLC", license_number: "RB-1004", license_expires_at: "2027-06-30T00:00:00Z", bond_amount_cents: 2500000 }
              as: ProgramAdmin
              as_user_id: "admin-01"
              captures: { rb_id: $.data.id }
            - call: "POST /v1/rebuilders/${rb_id}/deposits"
              payload: { amount_cents: 500000 }
              as: ProgramAdmin
              as_user_id: "admin-01"
            - call: "POST /v1/inspectors"
              payload: { full_name: "Dana Ruiz", badge_number: "INS-3004", credential_expires_at: "2027-01-01T00:00:00Z", certifications: ["STRUCTURAL", "VIN"], home_state_code: "NV" }
              as: ProgramAdmin
              as_user_id: "admin-01"
              captures: { insp_id: $.data.id }
            - call: "POST /v1/damage-reports"
              payload: { vehicle_id: "${veh_id}", insurer_name: "Cascade Mutual", claim_number: "CM-70040", basis_code: "GROSS_ESTIMATE", acv_cents: 1000000, repair_estimate_cents: 800000, damage_type: "COLLISION", odometer_reading_miles: 64000, report_effective_at: "2026-07-20T00:00:00Z", total_loss_declared: true }
