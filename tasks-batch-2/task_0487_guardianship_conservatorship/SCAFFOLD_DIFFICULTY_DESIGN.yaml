  # ===========================================================================
  - rule_id: resource_temporal_overlap
    instances:
      # ---- Instance 1: CarePlan half-open [start,end) interval overlap
      - name: rto_care_plan_half_open_overlap
        grounds:
          - state_machines.CarePlan.DRAFT_to_ACTIVE
          - entities.CarePlan.fields.window_start_iso
          - entities.CarePlan.fields.window_end_iso
          - errors[ERR_CARE_PLAN_OVERLAP]
        distinguishing_aspect: |
          CarePlan windows are half-open [start, end): an existing ACTIVE plan [2026-01-01, 2026-06-01)
          rejects a new plan [2026-05-01, 2026-09-01) (overlap) with ERR_CARE_PLAN_OVERLAP, but ACCEPTS
          an adjacent plan starting exactly at 2026-06-01 (touching boundary is NOT overlap under half-open semantics).
        test_recipe:
          setup:
            - "GUARDIANSHIP case ACTIVE; one ACTIVE CarePlan window [2026-01-01T00:00:00Z, 2026-06-01T00:00:00Z)"
          setup_api_calls:
            - call: "POST /gc/protected-persons"
              payload: { full_name: "Care Ward", date_of_birth: "1937-08-08", annual_income_cents: 0, liquid_estate_cents: 100000 }
              as: CourtClerk
              captures: { person_id: $.data.id }
