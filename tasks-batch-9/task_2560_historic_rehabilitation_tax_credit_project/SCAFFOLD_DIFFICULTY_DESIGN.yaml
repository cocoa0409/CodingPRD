              as: Developer
              as_user_id: "${dev_id}"
              captures: { proj_id: $.data.id }
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2028-10-01T00:00:00Z" }
              as: PlatformAdmin
          trigger:
            - call: "POST /cost-line-items"
              payload: { project_id: "${proj_id}", vendor_name: "Keystone Masonry", category: "HARD_CONSTRUCTION", amount_cents: 5000000, incurred_date: "2028-09-01", classification: "QRE" }
              as: Developer
              as_user_id: "${dev_id}"
            - call: "POST /cost-line-items"
              payload: { project_id: "${proj_id}", vendor_name: "Keystone Masonry", category: "HARD_CONSTRUCTION", amount_cents: 5000000, incurred_date: "2028-08-31", classification: "QRE" }
              as: Developer
