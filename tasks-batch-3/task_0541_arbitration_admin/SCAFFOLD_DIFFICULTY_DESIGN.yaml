# =============================================================================
# §1.8 Scaffold Difficulty Design (Test Targeting Index)
# task_0541_arbitration_admin  — 9 rules x 2 instances = 18 instances
# Clock default = 2026-05-01T00:00:00Z. HEARING_NOTICE_DAYS=7, APPEAL_WINDOW_DAYS=30,
# NEUTRAL_BUFFER_MINUTES=30. Fee tiers: T1=75000 T2=175000 T3=400000 T4=700000 (cents);
# tier floors 1_000_000 / 7_500_000 / 50_000_000 inclusive.
# =============================================================================
scaffold_difficulty_design:

  - rule_id: dual_variant_calc
    instances:
      - name: filing_fee_provisional_vs_final_admin_fee
        grounds:
          - calculations.filing_fee
          - calculations.final_admin_fee
          - entities.Case.fields.filing_fee_cents
          - entities.Case.fields.final_admin_fee_cents
          - state_machines.Award.DRAFT_to_ISSUED
        distinguishing_aspect: |
          Same tiered formula on the Case-fee domain yields 400000 at filing (tier keyed on
          claim 10_000_000 => TIER_3) but 75000 at award (tier keyed on awarded 500_000 =>
          TIER_1); the two variants diverge because the tier input differs.
        test_recipe:
          setup:
            - "ARBITRATION case, panel_size 1, claim 10_000_000 (TIER_3, provisional filing 400000)"
            - "One CLAIMANT + one RESPONDENT party; a rostered ARBITRATOR appointed; case in HEARING"
            - "A DRAFT MONETARY award of 500_000 (TIER_1 when the fee is recomputed)"
          setup_api_calls:
            - call: "POST /neutrals"
              payload: { full_name: "Arb One", neutral_type: "ARBITRATOR", hourly_rate_cents: 50000 }
              as: CaseAdministrator
              captures: { n_id: $.data.id }
            - call: "POST /cases"
              payload: { case_type: "ARBITRATION", title: "Fee Divergence", claim_amount_cents: 10000000, panel_size: 1 }
              as: CaseAdministrator
              captures: { c_id: $.data.id }
            - call: "POST /parties"
              payload: { case_id: "${c_id}", role: "CLAIMANT", display_name: "Cl", share_pct: 50 }
              as: CaseAdministrator
              captures: { pA: $.data.id }
            - call: "POST /parties"
              payload: { case_id: "${c_id}", role: "RESPONDENT", display_name: "Re", share_pct: 50 }
              as: CaseAdministrator
              captures: { pB: $.data.id }
            - call: "POST /cases/${c_id}/transition"
              payload: { to_status: "SELECTION" }
              as: CaseAdministrator
              captures: { cv_sel: $.data.version }
            - call: "POST /cases/${c_id}/candidates"
              payload: { neutral_id: "${n_id}", expected_case_version: "${cv_sel}" }
              as: CaseAdministrator
              captures: { cand: $.data.id }
            - call: "POST /candidates/${cand}/disclose"
              payload: { disclosure_text: "no relationships", has_conflict: false }
              as: Neutral
              as_user_id: "${n_id}"
            - call: "POST /candidates/${cand}/transition"
              payload: { to_status: "CLEARED" }
              as: CaseAdministrator
            - call: "GET /cases/${c_id}"
              as: CaseAdministrator
              captures: { cv_pre: $.data.version }
            - call: "POST /cases/${c_id}/appoint"
              payload: { expected_case_version: "${cv_pre}" }
              as: CaseAdministrator
            - call: "POST /cases/${c_id}/transition"
              payload: { to_status: "HEARING" }
              as: CaseAdministrator
            - call: "POST /cases/${c_id}/awards"
              payload: { award_type: "MONETARY", award_amount_cents: 500000 }
              as: CaseAdministrator
              captures: { aw: $.data.id }
          trigger:
            - call: "POST /awards/${aw}/transition"
              payload: { to_status: "ISSUED" }
              as: CaseAdministrator
          assert:
            - "Case.${c_id}.filing_fee_cents == 400000"
            - "Case.${c_id}.final_admin_fee_cents == 75000"
            - "Case.${c_id}.filing_fee_cents != Case.${c_id}.final_admin_fee_cents"

      - name: neutral_estimated_vs_actual_compensation
        grounds:
          - calculations.neutral_estimated_comp
          - calculations.neutral_actual_comp
          - entities.Case.fields.estimated_neutral_fee_cents
          - entities.Case.fields.actual_neutral_fee_cents
          - entities.FeeCharge.fields.amount_cents
        distinguishing_aspect: |
          On the Neutral-compensation domain, the projection over a 3h SCHEDULED hearing gives
          150000 (50000*3) while the realized charge on 4 logged hours gives 200000 (50000*4);
          estimate and actual diverge because planned duration != logged hours.
        test_recipe:
          setup:
            - "ARBITRATION case with ARBITRATOR (rate 50000/hr) appointed, case in HEARING"
            - "A 3-hour SCHEDULED hearing (2026-06-15 09:00-12:00) => estimate 150000"
            - "A PAID deposit of 500000 so a 200000 fee charge clears the fiscal gate"
          setup_api_calls:
            - call: "POST /neutrals"
              payload: { full_name: "Arb Rate", neutral_type: "ARBITRATOR", hourly_rate_cents: 50000 }
              as: CaseAdministrator
              captures: { n_id: $.data.id }
            - call: "POST /cases"
              payload: { case_type: "ARBITRATION", title: "Comp", claim_amount_cents: 2000000, panel_size: 1 }
              as: CaseAdministrator
              captures: { c_id: $.data.id }
            - call: "POST /parties"
              payload: { case_id: "${c_id}", role: "CLAIMANT", display_name: "Cl", share_pct: 50 }
              as: CaseAdministrator
              captures: { pA: $.data.id }
            - call: "POST /parties"
              payload: { case_id: "${c_id}", role: "RESPONDENT", display_name: "Re", share_pct: 50 }
              as: CaseAdministrator
              captures: { pB: $.data.id }
            - call: "POST /cases/${c_id}/transition"
              payload: { to_status: "SELECTION" }
              as: CaseAdministrator
              captures: { cv_sel: $.data.version }
            - call: "POST /cases/${c_id}/candidates"
              payload: { neutral_id: "${n_id}", expected_case_version: "${cv_sel}" }
              as: CaseAdministrator
              captures: { cand: $.data.id }
            - call: "POST /candidates/${cand}/disclose"
              payload: { disclosure_text: "none", has_conflict: false }
              as: Neutral
              as_user_id: "${n_id}"
            - call: "POST /candidates/${cand}/transition"
              payload: { to_status: "CLEARED" }
              as: CaseAdministrator
            - call: "GET /cases/${c_id}"
              as: CaseAdministrator
              captures: { cv_pre: $.data.version }
            - call: "POST /cases/${c_id}/appoint"
              payload: { expected_case_version: "${cv_pre}" }
              as: CaseAdministrator
            - call: "POST /cases/${c_id}/transition"
              payload: { to_status: "HEARING" }
              as: CaseAdministrator
            - call: "POST /cases/${c_id}/hearings"
              payload: { hearing_type: "EVIDENTIARY", start_at: "2026-06-15T09:00:00Z", end_at: "2026-06-15T12:00:00Z", location: "Room A" }
              as: CaseAdministrator
              captures: { h: $.data.id }
            - call: "POST /deposits"
              payload: { case_id: "${c_id}", amount_cents: 500000 }
              as: CaseAdministrator
              captures: { dep: $.data.id }
            - call: "POST /deposits/${dep}/pay"
              as: Party
              as_user_id: "${pA}"
            - call: "GET /cases/${c_id}"
              as: CaseAdministrator
              captures: { cv_fee: $.data.version }
          trigger:
            - call: "POST /cases/${c_id}/fee-charges"
              payload: { neutral_id: "${n_id}", hours: 4, expected_case_version: "${cv_fee}" }
              as: CaseAdministrator
              captures: { fc: $.data.id }
          assert:
            - "Case.${c_id}.estimated_neutral_fee_cents == 150000"
            - "Case.${c_id}.actual_neutral_fee_cents == 200000"
            - "Case.${c_id}.estimated_neutral_fee_cents != Case.${c_id}.actual_neutral_fee_cents"

  - rule_id: combinatorial_formula
    instances:
      - name: filing_fee_tier_times_panel_multiplier
        grounds:
          - calculations.filing_fee
          - calculations.case_fee_tier
          - entities.Case.fields.panel_size
          - entities.Case.fields.case_type
        distinguishing_aspect: |
          Mode (a): filing_fee = tier_base(claim) * case_type_mult * panel_mult combines 3
          inputs non-linearly — TIER_3 base 400000 * 1.0 (ARBITRATION) * 1.5 (panel 3) = 600000.
        test_recipe:
          setup:
            - "No prior state; a single ARBITRATION filing with a 3-arbitrator panel and claim 10_000_000"
          setup_api_calls: []
          trigger:
            - call: "POST /cases"
              payload: { case_type: "ARBITRATION", title: "Panel3", claim_amount_cents: 10000000, panel_size: 3 }
              as: CaseAdministrator
              captures: { c_id: $.data.id }
          assert:
            - "Case.${c_id}.fee_tier == TIER_3"
            - "Case.${c_id}.filing_fee_cents == 600000"

      - name: party_fee_allocation_floor_then_remainder
        grounds:
          - calculations.party_fee_allocation
          - entities.Party.fields.allocated_fee_share_cents
          - entities.Party.fields.share_pct
          - state_machines.FeeCharge.POSTED_to_REVERSED
        distinguishing_aspect: |
          Mode (b): allocating 100001 cents across two 50%% parties uses the PINNED order
          floor-per-party (50000 each) THEN distribute the 1-cent remainder to the earliest
          party by created_at ASC => A=50001, B=50000; divide-then-round-each would drift.
        test_recipe:
          setup:
            - "ARBITRATION case with ARBITRATOR (rate 100001/hr) appointed, case in HEARING"
            - "Two 50%% parties, CLAIMANT A created before RESPONDENT B"
            - "PAID deposit 200000; a 1-hour fee charge posts 100001 cents"
          setup_api_calls:
            - call: "POST /neutrals"
              payload: { full_name: "Arb Odd", neutral_type: "ARBITRATOR", hourly_rate_cents: 100001 }
              as: CaseAdministrator
              captures: { n_id: $.data.id }
            - call: "POST /cases"
              payload: { case_type: "ARBITRATION", title: "Split", claim_amount_cents: 2000000, panel_size: 1 }
              as: CaseAdministrator
              captures: { c_id: $.data.id }
            - call: "POST /parties"
              payload: { case_id: "${c_id}", role: "CLAIMANT", display_name: "A", share_pct: 50 }
              as: CaseAdministrator
              captures: { pA: $.data.id }
            - call: "POST /parties"
              payload: { case_id: "${c_id}", role: "RESPONDENT", display_name: "B", share_pct: 50 }
              as: CaseAdministrator
              captures: { pB: $.data.id }
            - call: "POST /cases/${c_id}/transition"
              payload: { to_status: "SELECTION" }
              as: CaseAdministrator
              captures: { cv_sel: $.data.version }
            - call: "POST /cases/${c_id}/candidates"
              payload: { neutral_id: "${n_id}", expected_case_version: "${cv_sel}" }
              as: CaseAdministrator
              captures: { cand: $.data.id }
            - call: "POST /candidates/${cand}/disclose"
              payload: { disclosure_text: "none", has_conflict: false }
              as: Neutral
              as_user_id: "${n_id}"
            - call: "POST /candidates/${cand}/transition"
              payload: { to_status: "CLEARED" }
              as: CaseAdministrator
            - call: "GET /cases/${c_id}"
              as: CaseAdministrator
              captures: { cv_pre: $.data.version }
            - call: "POST /cases/${c_id}/appoint"
              payload: { expected_case_version: "${cv_pre}" }
              as: CaseAdministrator
            - call: "POST /cases/${c_id}/transition"
              payload: { to_status: "HEARING" }
              as: CaseAdministrator
            - call: "POST /deposits"
              payload: { case_id: "${c_id}", amount_cents: 200000 }
              as: CaseAdministrator
              captures: { dep: $.data.id }
            - call: "POST /deposits/${dep}/pay"
              as: Party
              as_user_id: "${pA}"
            - call: "GET /cases/${c_id}"
              as: CaseAdministrator
              captures: { cv_fee: $.data.version }
          trigger:
            - call: "POST /cases/${c_id}/fee-charges"
              payload: { neutral_id: "${n_id}", hours: 1, expected_case_version: "${cv_fee}" }
              as: CaseAdministrator
              captures: { fc: $.data.id }
          assert:
            - "Case.${c_id}.posted_fee_cents == 100001"
            - "Party.${pA}.allocated_fee_share_cents == 50001"
            - "Party.${pB}.allocated_fee_share_cents == 50000"

  - rule_id: non_linear_state_machine
    instances:
      - name: award_vacatur_redraft_cycle
        grounds:
          - state_machines.Award.ISSUED_to_VACATED
          - state_machines.Award.VACATED_to_DRAFT
          - state_machines.Case.AWARD_ISSUED_to_HEARING
        distinguishing_aspect: |
          Award is cyclic: ISSUED -> VACATED (on appeal grant) -> DRAFT (re-draft), returning to
          an earlier state on the SAME Award entity, unlike any linear pipeline.
        test_recipe:
          setup:
            - "ARBITRATION case appointed, HEARING; a DRAFT MONETARY award 500000 ISSUED"
            - "An appeal FILED then UNDER_REVIEW then GRANTED, vacating the award and reverting case to HEARING"
          setup_api_calls:
            - call: "POST /neutrals"
              payload: { full_name: "Arb Cyc", neutral_type: "ARBITRATOR", hourly_rate_cents: 50000 }
              as: CaseAdministrator
              captures: { n_id: $.data.id }
            - call: "POST /cases"
              payload: { case_type: "ARBITRATION", title: "Cycle", claim_amount_cents: 2000000, panel_size: 1 }
              as: CaseAdministrator
              captures: { c_id: $.data.id }
            - call: "POST /parties"
              payload: { case_id: "${c_id}", role: "CLAIMANT", display_name: "A", share_pct: 50 }
              as: CaseAdministrator
              captures: { pA: $.data.id }
            - call: "POST /parties"
              payload: { case_id: "${c_id}", role: "RESPONDENT", display_name: "B", share_pct: 50 }
              as: CaseAdministrator
              captures: { pB: $.data.id }
            - call: "POST /cases/${c_id}/transition"
              payload: { to_status: "SELECTION" }
              as: CaseAdministrator
              captures: { cv_sel: $.data.version }
            - call: "POST /cases/${c_id}/candidates"
              payload: { neutral_id: "${n_id}", expected_case_version: "${cv_sel}" }
              as: CaseAdministrator
              captures: { cand: $.data.id }
            - call: "POST /candidates/${cand}/disclose"
              payload: { disclosure_text: "none", has_conflict: false }
              as: Neutral
              as_user_id: "${n_id}"
            - call: "POST /candidates/${cand}/transition"
              payload: { to_status: "CLEARED" }
              as: CaseAdministrator
            - call: "GET /cases/${c_id}"
              as: CaseAdministrator
              captures: { cv_pre: $.data.version }
            - call: "POST /cases/${c_id}/appoint"
              payload: { expected_case_version: "${cv_pre}" }
              as: CaseAdministrator
            - call: "POST /cases/${c_id}/transition"
              payload: { to_status: "HEARING" }
              as: CaseAdministrator
            - call: "POST /cases/${c_id}/awards"
              payload: { award_type: "MONETARY", award_amount_cents: 500000 }
              as: CaseAdministrator
              captures: { aw: $.data.id }
            - call: "POST /awards/${aw}/transition"
              payload: { to_status: "ISSUED" }
              as: CaseAdministrator
            - call: "POST /appeals"
              payload: { award_id: "${aw}", ground: "EVIDENT_PARTIALITY" }
              as: Party
              as_user_id: "${pA}"
              captures: { ap: $.data.id }
            - call: "POST /appeals/${ap}/transition"
              payload: { to_status: "UNDER_REVIEW" }
              as: CaseAdministrator
            - call: "POST /appeals/${ap}/transition"
              payload: { to_status: "GRANTED" }
              as: CaseAdministrator
          trigger:
            - call: "POST /awards/${aw}/transition"
              payload: { to_status: "DRAFT" }
              as: CaseAdministrator
          assert:
            - "Award.${aw}.status == DRAFT"
            - "Case.${c_id}.status == HEARING"

      - name: candidate_objection_cured_back_to_cleared
        grounds:
          - state_machines.Candidate.DISCLOSED_to_OBJECTED
          - state_machines.Candidate.OBJECTED_to_CLEARED
          - state_machines.Candidate.OBJECTED_to_DISQUALIFIED
        distinguishing_aspect: |
          Candidate is branching with re-join: DISCLOSED -> OBJECTED can either cure to CLEARED
          or fork to DISQUALIFIED; the cure edge OBJECTED -> CLEARED is a non-linear back-edge on
          the Candidate entity (distinct from the cyclic Award machine).
        test_recipe:
          setup:
            - "SELECTION-phase case with one PROPOSED candidate that has DISCLOSED (no conflict) then been OBJECTED"
          setup_api_calls:
            - call: "POST /neutrals"
              payload: { full_name: "Arb Br", neutral_type: "ARBITRATOR", hourly_rate_cents: 40000 }
              as: CaseAdministrator
              captures: { n_id: $.data.id }
            - call: "POST /cases"
              payload: { case_type: "ARBITRATION", title: "Branch", claim_amount_cents: 500000, panel_size: 1 }
              as: CaseAdministrator
              captures: { c_id: $.data.id }
            - call: "POST /parties"
              payload: { case_id: "${c_id}", role: "CLAIMANT", display_name: "A", share_pct: 50 }
              as: CaseAdministrator
              captures: { pA: $.data.id }
            - call: "POST /parties"
              payload: { case_id: "${c_id}", role: "RESPONDENT", display_name: "B", share_pct: 50 }
              as: CaseAdministrator
              captures: { pB: $.data.id }
            - call: "POST /cases/${c_id}/transition"
              payload: { to_status: "SELECTION" }
              as: CaseAdministrator
              captures: { cv_sel: $.data.version }
            - call: "POST /cases/${c_id}/candidates"
              payload: { neutral_id: "${n_id}", expected_case_version: "${cv_sel}" }
              as: CaseAdministrator
              captures: { cand: $.data.id }
            - call: "POST /candidates/${cand}/disclose"
              payload: { disclosure_text: "minor prior engagement", has_conflict: false }
              as: Neutral
              as_user_id: "${n_id}"
            - call: "POST /candidates/${cand}/transition"
              payload: { to_status: "OBJECTED" }
              as: CaseAdministrator
          trigger:
            - call: "POST /candidates/${cand}/transition"
              payload: { to_status: "CLEARED" }
              as: CaseAdministrator
          assert:
            - "Candidate.${cand}.status == CLEARED"

  - rule_id: transitive_cascade
    instances:
      - name: appeal_grant_vacates_award_reverts_case_restores_balance
        grounds:
          - state_machines.Appeal.UNDER_REVIEW_to_GRANTED
          - state_machines.Award.ISSUED_to_VACATED
          - state_machines.Case.AWARD_ISSUED_to_HEARING
          - calculations.deposit_balance
        distinguishing_aspect: |
          Depth-3 chain from ONE trigger (appeal GRANTED): Appeal.GRANTED -> Award VACATED
          (link1) -> Case AWARD_ISSUED->HEARING (link2) -> deposit_balance recomputed without
          the 75000 admin-fee debit (link3), restoring 425000 to 500000.
        test_recipe:
          setup:
            - "ARBITRATION case (claim 10_000_000) appointed, HEARING; PAID deposit 500000"
            - "MONETARY award 500000 ISSUED => final_admin_fee 75000; deposit_balance 425000"
            - "Appeal FILED then UNDER_REVIEW against the issued award"
          setup_api_calls:
            - call: "POST /neutrals"
              payload: { full_name: "Arb Casc", neutral_type: "ARBITRATOR", hourly_rate_cents: 50000 }
              as: CaseAdministrator
              captures: { n_id: $.data.id }
            - call: "POST /cases"
              payload: { case_type: "ARBITRATION", title: "Casc", claim_amount_cents: 10000000, panel_size: 1 }
              as: CaseAdministrator
              captures: { c_id: $.data.id }
            - call: "POST /parties"
              payload: { case_id: "${c_id}", role: "CLAIMANT", display_name: "A", share_pct: 50 }
              as: CaseAdministrator
              captures: { pA: $.data.id }
            - call: "POST /parties"
              payload: { case_id: "${c_id}", role: "RESPONDENT", display_name: "B", share_pct: 50 }
              as: CaseAdministrator
              captures: { pB: $.data.id }
            - call: "POST /cases/${c_id}/transition"
              payload: { to_status: "SELECTION" }
              as: CaseAdministrator
              captures: { cv_sel: $.data.version }
            - call: "POST /cases/${c_id}/candidates"
              payload: { neutral_id: "${n_id}", expected_case_version: "${cv_sel}" }
              as: CaseAdministrator
              captures: { cand: $.data.id }
            - call: "POST /candidates/${cand}/disclose"
              payload: { disclosure_text: "none", has_conflict: false }
              as: Neutral
              as_user_id: "${n_id}"
            - call: "POST /candidates/${cand}/transition"
              payload: { to_status: "CLEARED" }
              as: CaseAdministrator
            - call: "GET /cases/${c_id}"
              as: CaseAdministrator
              captures: { cv_pre: $.data.version }
            - call: "POST /cases/${c_id}/appoint"
              payload: { expected_case_version: "${cv_pre}" }
              as: CaseAdministrator
            - call: "POST /cases/${c_id}/transition"
              payload: { to_status: "HEARING" }
              as: CaseAdministrator
            - call: "POST /deposits"
              payload: { case_id: "${c_id}", amount_cents: 500000 }
              as: CaseAdministrator
              captures: { dep: $.data.id }
            - call: "POST /deposits/${dep}/pay"
              as: Party
              as_user_id: "${pA}"
            - call: "POST /cases/${c_id}/awards"
              payload: { award_type: "MONETARY", award_amount_cents: 500000 }
              as: CaseAdministrator
              captures: { aw: $.data.id }
            - call: "POST /awards/${aw}/transition"
              payload: { to_status: "ISSUED" }
              as: CaseAdministrator
            - call: "POST /appeals"
              payload: { award_id: "${aw}", ground: "EXCEEDED_POWERS" }
              as: Party
              as_user_id: "${pA}"
              captures: { ap: $.data.id }
            - call: "POST /appeals/${ap}/transition"
              payload: { to_status: "UNDER_REVIEW" }
              as: CaseAdministrator
          trigger:
            - call: "POST /appeals/${ap}/transition"
              payload: { to_status: "GRANTED" }
              as: CaseAdministrator
          assert:
            - "Appeal.${ap}.status == GRANTED"
            - "Award.${aw}.status == VACATED"
            - "Case.${c_id}.status == HEARING"
            - "Case.${c_id}.deposit_balance_cents == 500000"

      - name: appoint_sets_winner_and_cascades_siblings_not_selected
        grounds:
          - state_machines.Case.SELECTION_to_APPOINTED
          - state_machines.Candidate.CLEARED_to_APPOINTED
          - state_machines.Candidate.CLEARED_to_NOT_SELECTED
          - calculations.appoint_selector
        distinguishing_aspect: |
          Depth-2 chain from the appoint trigger: winning Candidate -> APPOINTED (link1 sets
          Case.APPOINTED + appointed_neutral_id) which then cascades every sibling Candidate ->
          NOT_SELECTED (link2); originates from a different trigger than the appeal cascade.
        test_recipe:
          setup:
            - "SELECTION-phase case with two CLEARED candidates (neutrals n1, n2)"
            - "Party A ranks candidate 1 with 5 points so it outranks candidate 2 (score 0)"
          setup_api_calls:
            - call: "POST /neutrals"
              payload: { full_name: "N1", neutral_type: "ARBITRATOR", hourly_rate_cents: 40000 }
              as: CaseAdministrator
              captures: { n1: $.data.id }
            - call: "POST /neutrals"
              payload: { full_name: "N2", neutral_type: "ARBITRATOR", hourly_rate_cents: 40000 }
              as: CaseAdministrator
              captures: { n2: $.data.id }
            - call: "POST /cases"
              payload: { case_type: "ARBITRATION", title: "TwoCand", claim_amount_cents: 500000, panel_size: 1 }
              as: CaseAdministrator
              captures: { c_id: $.data.id }
            - call: "POST /parties"
              payload: { case_id: "${c_id}", role: "CLAIMANT", display_name: "A", share_pct: 50 }
              as: CaseAdministrator
              captures: { pA: $.data.id }
            - call: "POST /parties"
