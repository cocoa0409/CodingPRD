              as: UtilityAdmin
              captures: { unit_id: $.data.id }
            - call: "POST /ccr/reuse-agreements"
              payload: { unit_id: "${unit_id}", agreement_code: "AGR-WIN-A", product_type: "CONCRETE_POZZOLAN", offtaker_name: "Piedmont Ready-Mix", committed_tons: 30000, commitment_start_on: "2026-01-01", commitment_end_on: "2026-06-30", loi_percent: 6.00, retained_325_percent: 20.00, oxide_sum_percent: 82.00, market_price_usd_cents_per_ton: 3200, haul_distance_miles: 60 }
              as: UtilityAdmin
              captures: { agr_a_id: $.data.id }
            - call: "POST /ccr/reuse-agreements/${agr_a_id}/qualify"
              payload: { qualified_on: "2026-08-01" }
              as: ProfessionalEngineer
              as_user_id: "${pe_civil_id}"
            - call: "POST /ccr/reuse-agreements"
              payload: { unit_id: "${unit_id}", agreement_code: "AGR-WIN-B", product_type: "CONCRETE_POZZOLAN", offtaker_name: "Piedmont Ready-Mix", committed_tons: 25000, commitment_start_on: "2026-06-30", commitment_end_on: "2026-12-31", loi_percent: 6.00, retained_325_percent: 20.00, oxide_sum_percent: 82.00, market_price_usd_cents_per_ton: 3200, haul_distance_miles: 60 }
              as: UtilityAdmin
              captures: { agr_b_id: $.data.id }
            - call: "POST /ccr/reuse-agreements"
              payload: { unit_id: "${unit_id}", agreement_code: "AGR-WIN-C", product_type: "CONCRETE_POZZOLAN", offtaker_name: "Piedmont Ready-Mix", committed_tons: 25000, commitment_start_on: "2026-07-01", commitment_end_on: "2026-12-31", loi_percent: 6.00, retained_325_percent: 20.00, oxide_sum_percent: 82.00, market_price_usd_cents_per_ton: 3200, haul_distance_miles: 60 }
              as: UtilityAdmin
              captures: { agr_c_id: $.data.id }
          trigger:
            - call: "POST /ccr/reuse-agreements/${agr_b_id}/qualify"
              payload: { qualified_on: "2026-08-01" }
              as: ProfessionalEngineer
              as_user_id: "${pe_civil_id}"
            - call: "POST /ccr/reuse-agreements/${agr_c_id}/qualify"
              payload: { qualified_on: "2026-08-01" }
              as: ProfessionalEngineer
              as_user_id: "${pe_civil_id}"
          assert:
            - "DisposalUnit.${unit_id}.ash_in_place_tons == 50000"
            - "BeneficialReuseAgreement.${agr_a_id}.status == QUALIFIED and qualification_score == 70.30 and meets_astm_c618_class_f == true"
            - "trigger call 1 returns HTTP 409 with error_id ERR_REUSE_COMMITMENT_OVERLAP"
            - "BeneficialReuseAgreement.${agr_b_id}.status == DRAFT and qualified_on == null and qualified_by == null"
            - "trigger call 2 returns HTTP 200 or 201"
            - "BeneficialReuseAgreement.${agr_c_id}.status == QUALIFIED and qualified_by == ${pe_civil_id} and qualification_score == 70.30"
            - "BeneficialReuseAgreement.${agr_a_id}.status is still QUALIFIED (qualifying C does not disturb A)"

  - rule_id: compensating_invariant
    instances:
      - name: shipment_return_restores_the_ash_inventory_and_the_agreement_ledger_exactly
        grounds:
          - calculations.ash_in_place_balance
          - state_machines.ReuseShipment.SHIPPED_to_RETURNED
          - entities.DisposalUnit.fields.ash_mass_balance_ok
          - entities.BeneficialReuseAgreement.fields.shipped_tons_total
        distinguishing_aspect: |
          Shipping draws 12000 tons out of two independent derived ledgers at once (the unit's
          ash_in_place_tons and the agreement's shipped_tons_total) and the return must put both back to
          their exact pre-shipment values, not merely to a consistent pair. The invariant
          ash_in_place_tons + shipped_out == original_ash_in_place_tons is asserted before, between and
          after, so an implementation that decrements on ship but forgets to re-add on return, or that
          re-adds to only one of the two ledgers, is caught.
        test_recipe:
          setup:
            - "One clean unit with original_ash_in_place_tons 480000 and no shipments, so its posture is not RESTRICTED and activation is permitted"
            - "One ACTIVE agreement for 30000 tons over the closed window 2026-01-01..2026-12-31 with Class F ash chemistry"
            - "The unit's version is re-read immediately before each write so that expected_unit_version is always current and the priority-16 OCC gate never fires"
          setup_api_calls:
            - call: "POST /ccr/professionals"
              payload: { full_name: "Owen Park", license_number: "PE-22002", license_state: "NC", discipline: "CIVIL" }
              as: UtilityAdmin
              captures: { pe_civil_id: $.data.id }
            - call: "POST /ccr/units"
              payload: { unit_code: "IMP-0018", unit_name: "Ash Pond 18", unit_type: "SURFACE_IMPOUNDMENT", plant_code: "PLNT01", liner_class: "COMPOSITE_LINED", hazard_potential_class: "SIGNIFICANT", original_ash_in_place_tons: 480000, cessation_date: "2026-03-31", uppermost_aquifer_separation_ft: 12.50, wetland_distance_ft: 2000.00, seismic_pga_g: 0.050, fault_distance_ft: 1200.00, unstable_area_flag: false }
              as: UtilityAdmin
              captures: { unit_id: $.data.id }
            - call: "POST /ccr/reuse-agreements"
              payload: { unit_id: "${unit_id}", agreement_code: "AGR-BAL-1", product_type: "CONCRETE_POZZOLAN", offtaker_name: "Piedmont Ready-Mix", committed_tons: 30000, commitment_start_on: "2026-01-01", commitment_end_on: "2026-12-31", loi_percent: 6.00, retained_325_percent: 20.00, oxide_sum_percent: 82.00, market_price_usd_cents_per_ton: 3200, haul_distance_miles: 60 }
              as: UtilityAdmin
              captures: { agr_id: $.data.id }
            - call: "POST /ccr/reuse-agreements/${agr_id}/qualify"
              payload: { qualified_on: "2026-08-01" }
              as: ProfessionalEngineer
              as_user_id: "${pe_civil_id}"
            - call: "POST /ccr/reuse-agreements/${agr_id}/activate"
              payload: { activated_on: "2026-08-01" }
              as: UtilityAdmin
            - call: "GET /ccr/units/${unit_id}"
              as: UtilityAdmin
              captures: { unit_v_before: $.data.version, ash_before: $.data.ash_in_place_tons }
          trigger:
            - call: "POST /ccr/reuse-shipments"
              payload: { agreement_id: "${agr_id}", shipment_code: "SHP-BAL-1", tons: 12000, shipped_on: "2026-07-01", expected_unit_version: "${unit_v_before}" }
              as: UtilityAdmin
              captures: { ship_id: $.data.id }
            - call: "GET /ccr/units/${unit_id}"
              as: UtilityAdmin
              captures: { unit_v_mid: $.data.version, ash_mid: $.data.ash_in_place_tons }
            - call: "POST /ccr/reuse-shipments/${ship_id}/return"
              payload: { returned_on: "2026-07-15", return_reason: "Offtaker rejected the load for excess moisture at the plant gate", expected_unit_version: "${unit_v_mid}" }
              as: UtilityAdmin
            - call: "GET /ccr/units/${unit_id}"
              as: UtilityAdmin
              captures: { unit_v_after: $.data.version, ash_after: $.data.ash_in_place_tons }
          assert:
            - "${ash_before} == 480000 and DisposalUnit.${unit_id}.ash_mass_balance_ok == true before the shipment"
            - "trigger call 1 returns HTTP 201 and ReuseShipment.${ship_id}.status == SHIPPED"
            - "${ash_mid} == 468000 (480000 minus the 12000 shipped)"
            - "BeneficialReuseAgreement.${agr_id}.shipped_tons_total == 12000 between the two writes"
            - "DisposalUnit.${unit_id}.ash_mass_balance_ok == true between the two writes"
            - "trigger call 3 returns HTTP 200 and ReuseShipment.${ship_id}.status == RETURNED with returned_on == 2026-07-15"
            - "${ash_after} == 480000, exactly equal to ${ash_before}"
            - "BeneficialReuseAgreement.${agr_id}.shipped_tons_total == 0 after the return"
            - "BeneficialReuseAgreement.${agr_id}.status == ACTIVE (the return does not close the agreement)"
            - "DisposalUnit.${unit_id}.ash_mass_balance_ok == true after the return"
            - "${unit_v_mid} is greater than ${unit_v_before} and ${unit_v_after} is greater than ${unit_v_mid} (the compensation is a new write, not a rollback of history)"

      - name: extension_rescission_restores_the_closure_deadline_from_cessation_date_not_by_subtraction
        grounds:
          - calculations.closure_deadline_date
          - state_machines.ClosureExtensionRequest.GRANTED_to_RESCINDED
          - entities.DisposalUnit.fields.granted_extension_months
          - validations.priority_50_ERR_COMMUNITY_ENGAGEMENT_INCOMPLETE
        distinguishing_aspect: |
          The granted extension moves the closure deadline by 24 calendar months and the rescission must
          return it to the byte-identical original date. Because the deadline is always re-derived as
          add_months(cessation_date, base + current granted_extension_months) rather than adjusted
          incrementally, the restored value must be exactly 2031-03-31; an implementation that subtracts
          24 months from the granted date, or that leaves granted_extension_months elevated, drifts.
          The rescinded request is also terminal, so a second rescission must be refused.
        test_recipe:
          setup:
            - "One clean SURFACE_IMPOUNDMENT with cessation_date 2026-03-31, giving a 60-month base closure_deadline_date of 2031-03-31 and granted_extension_months 0"
            - "One REQUESTED extension request for 24 months"
            - "One POSTED EXTENSION_DEMONSTRATION posting carrying community_meeting_held_on, satisfying the priority-49 and priority-50 gates on GRANT"
          setup_api_calls:
            - call: "POST /ccr/units"
              payload: { unit_code: "IMP-0019", unit_name: "Ash Pond 19", unit_type: "SURFACE_IMPOUNDMENT", plant_code: "PLNT01", liner_class: "COMPOSITE_LINED", hazard_potential_class: "SIGNIFICANT", original_ash_in_place_tons: 480000, cessation_date: "2026-03-31", uppermost_aquifer_separation_ft: 12.50, wetland_distance_ft: 2000.00, seismic_pga_g: 0.050, fault_distance_ft: 1200.00, unstable_area_flag: false }
              as: UtilityAdmin
              captures: { unit_id: $.data.id, deadline_before: $.data.closure_deadline_date }
            - call: "POST /ccr/extension-requests"
              payload: { unit_id: "${unit_id}", requested_months: 24, justification_category: "NO_ALTERNATIVE_CAPACITY", narrative: "No permitted disposal capacity is available within the base closure period for the volume in this impoundment" }
              as: UtilityAdmin
              captures: { ext_id: $.data.id }
            - call: "POST /ccr/public-postings"
              payload: { unit_id: "${unit_id}", posting_type: "EXTENSION_DEMONSTRATION", posted_on: "2026-08-01", document_uri: "https://utility.example.com/ccr/imp-0019/extension-demonstration.pdf", document_sha256: "a3f1a3f1a3f1a3f1a3f1a3f1a3f1a3f1a3f1a3f1a3f1a3f1a3f1a3f1a3f1a3f1", community_meeting_held_on: "2026-07-20" }
              as: ComplianceOfficer
              captures: { posting_id: $.data.id }
          trigger:
            - call: "POST /ccr/extension-requests/${ext_id}/decision"
              payload: { decision: "GRANT", granted_months: 24, decided_on: "2026-08-01", decision_note: "Capacity demonstration accepted; 24 months granted" }
              as: Regulator
            - call: "GET /ccr/units/${unit_id}"
              as: UtilityAdmin
              captures: { deadline_granted: $.data.closure_deadline_date }
            - call: "POST /ccr/extension-requests/${ext_id}/rescind"
              payload: { rescinded_on: "2026-08-01", rescission_reason: "Alternative permitted capacity became available, so the relief is withdrawn" }
              as: Regulator
            - call: "GET /ccr/units/${unit_id}"
              as: UtilityAdmin
              captures: { deadline_after: $.data.closure_deadline_date }
            - call: "POST /ccr/extension-requests/${ext_id}/rescind"
              payload: { rescinded_on: "2026-08-01", rescission_reason: "Duplicate rescission attempt against a terminal request" }
              as: Regulator
          assert:
            - "${deadline_before} == 2031-03-31 and DisposalUnit.${unit_id}.granted_extension_months == 0"
            - "PublicPosting.${posting_id}.status == POSTED and community_meeting_held_on == 2026-07-20"
            - "trigger call 1 returns HTTP 200 or 201 and ClosureExtensionRequest.${ext_id}.status == GRANTED with granted_months == 24"
            - "${deadline_granted} == 2033-03-31 and DisposalUnit.${unit_id}.granted_extension_months == 24"
            - "trigger call 3 returns HTTP 200 and ClosureExtensionRequest.${ext_id}.status == RESCINDED with granted_months == 0 and rescinded_on == 2026-08-01"
            - "${deadline_after} == 2031-03-31, exactly equal to ${deadline_before}"
            - "DisposalUnit.${unit_id}.granted_extension_months == 0 after the rescission"
            - "trigger call 5 returns HTTP 409 with error_id ERR_INVALID_EXTENSION_STATE"
            - "${deadline_after} is unchanged by the refused second rescission"
