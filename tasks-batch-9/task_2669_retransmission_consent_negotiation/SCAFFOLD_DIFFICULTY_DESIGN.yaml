  - rule_id: compensating_invariant
    instances:
      - name: settlement_void_restores_agreement_lifetime_money_ledger
        grounds:
          - state_machines.FeeSettlement.ISSUED_to_VOIDED
          - endpoints[POST /retrans/fee-settlements/{id}/void]
          - entities.CarriageAgreement.fields.lifetime_gross_fee_cents
          - entities.CarriageAgreement.fields.lifetime_net_retained_cents
          - validations[priority=7]
        distinguishing_aspect: |
          Conserved quantity is MONEY: the agreement's lifetime gross and net cent ledgers must return
          to their exact pre-issuance values (0 and 0) after the void, with no rounding drift left
          behind by the reverse-compensation split, and the voided settlement's own amounts frozen as
          the audit record. Segregation of duties is part of the compensation path, since the issuing
          counsel cannot void their own settlement.
        test_recipe:
          setup:
            - "The station / affiliation / distributor / election / report / offer chain, agreement EXECUTED"
            - "Lifetime ledgers observed at 0 before any settlement is issued"
