  - rule_id: boundary_precision_check
    instances:

      - name: free_cancel_window_exact_24_hour_boundary
        grounds:
          - calculations.cancellation_charge
          - calculations.cancellation_charge.constants.FREE_CANCEL_HOURS
          - calculations.cancellation_charge.constants.LATE_CANCEL_BP
          - calculations.cancellation_charge.constants.HIGH_DEMAND_UPLIFT_BP
          - state_machines.Appointment.schedule_status.CONFIRMED_to_CANCELLED
          - state_machines.Appointment.schedule_status.CONFIRMED_to_LATE_CANCELLED
          - entities.Guest.fields.late_cancel_count
        distinguishing_aspect: |
          A time boundary tested at exactly the inclusive edge and one minute
          inside it: 24h00m before start is FREE (FREE_CANCEL_HOURS uses >=, so
          charge 0 and status CANCELLED), while 23h59m produces the LATE band
          (5000 + 2000 high-demand uplift = 7000 bp of 42800 = 29960 and status
          LATE_CANCELLED). The off-by-one that turns >= into > is invisible
          anywhere except at this exact instant. The other instance in this rule
          is a numeric zero-denominator boundary, not a temporal one.
        test_recipe:
          setup:
            - "HYDRO90 fixture with two HYDRO rooms HYDRO-1 and HYDRO-2 (turnover 30) so the two appointments never contend for a room"
            - "one SENIOR therapist available 2026-08-10 08:00-22:00Z; the closed intervals [17:00,18:30] and [19:00,20:30] do not intersect"
            - "PLATINUM guest with a SCREENED_CLEAR intake and consent 2026.1"
            - "appointment A CONFIRMED at 2026-08-10T17:00:00.000Z in HYDRO-1 (quoted 42800, high_demand_slot true)"
            - "appointment B CONFIRMED at 2026-08-10T19:00:00.000Z in HYDRO-2 (also peak, quoted 42800)"
