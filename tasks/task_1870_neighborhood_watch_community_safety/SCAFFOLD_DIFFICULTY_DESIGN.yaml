  # =====================================================================
  # Rule 8 — resource_temporal_overlap (different interval semantics)
  # =====================================================================
  - rule_id: resource_temporal_overlap
    instances:
      - name: meeting_room_half_open_adjacency_allowed
        grounds:
          - validations[priority=8]
          - state_machines.LiaisonMeeting
        distinguishing_aspect: |
          Half-open [start, end) semantics on the LiaisonMeeting room resource:
          a meeting ending at 19:00 and another starting at 19:00 in the same
          precinct are adjacent-but-legal (no error), while one starting at
          18:59 overlaps and is rejected ERR_ROOM_SLOT_CONFLICT — the boundary is
          end == other.start being allowed.
        test_recipe:
          setup:
            - "Two groups in the same precinct PCT15 (meetings share the precinct room pool)."
            - "Existing SCHEDULED meeting 18:00-19:00 on 2026-08-05."
          setup_api_calls:
            - call: "POST /watch/watch-groups"
              payload: { name: "Room Watch 1", precinct_code: "PCT15" }
              as: ProgramCoordinator
              captures: { g1: $.data.id }
            - call: "POST /watch/watch-groups"
              payload: { name: "Room Watch 2", precinct_code: "PCT15" }
              as: ProgramCoordinator
              captures: { g2: $.data.id }
            - call: "POST /watch/liaison-officers"
              payload: { badge_number: "B150", full_name: "Officer M", precinct_code: "PCT15" }
              as: ProgramCoordinator
              captures: { off: $.data.id }
            - call: "POST /watch/liaison-meetings"
              payload: { watch_group_id: "${g1}", liaison_officer_id: "${off}", room_slot_start: "2026-08-05T18:00:00Z", room_slot_end: "2026-08-05T19:00:00Z" }
              as: LiaisonOfficer
              as_user_id: "${off}"
              captures: { mt0: $.data.id }
          trigger:
            - call: "POST /watch/liaison-meetings"
              payload: { watch_group_id: "${g2}", liaison_officer_id: "${off}", room_slot_start: "2026-08-05T19:00:00Z", room_slot_end: "2026-08-05T20:00:00Z" }
              as: LiaisonOfficer
              as_user_id: "${off}"
              captures: { mt_adj: $.data.id }
            - call: "POST /watch/liaison-meetings"
              payload: { watch_group_id: "${g2}", liaison_officer_id: "${off}", room_slot_start: "2026-08-05T18:59:00Z", room_slot_end: "2026-08-05T19:30:00Z" }
              as: LiaisonOfficer
              as_user_id: "${off}"
              captures: { err_ovl: $.data.error_id }
          assert:
            - "mt_adj created (201): start == existing.end is legal under half-open [start, end) semantics"
            - "err_ovl == ERR_ROOM_SLOT_CONFLICT: 18:59 start overlaps [18:00, 19:00)"

      - name: event_closure_buffer_inclusive_zero_gap_rejected
        grounds:
          - validations[priority=9]
          - state_machines.CommunityEvent.PROPOSED_to_APPROVED
        distinguishing_aspect: |
          Different interval semantics on a different resource than the meeting
          room: CommunityEvent street-closure windows carry a 2-hour buffer on
          both ends and use touching-forbidden semantics — an APPROVED anchor
          event closing 12:00 buffers its window to [08:00, 14:00], so a second
          event whose closure starts at exactly 14:00:00 (zero gap, touching the
          buffer) is REJECTED with ERR_CLOSURE_CONFLICT at creation, while a
