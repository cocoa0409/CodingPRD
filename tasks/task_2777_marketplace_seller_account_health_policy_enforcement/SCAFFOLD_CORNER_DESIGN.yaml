              payload: {}
              as: ComplianceOfficer
              as_user_id: "co-1"
              captures: { ev: $.data.id, ev_tier: $.data.metric_tier, ev_score: $.data.health_score }
          assert:
            - "HTTP 201"
            - "${ev_tier} == EXEMPT   # EXEMPT is checked before BREACHING / AT_RISK / HEALTHY"
            - "${ev_score} == 100.00"
            - "HealthEvaluation.${ev}.order_volume_final == 0"
            - "HealthEvaluation.${ev}.odr_provisional == 0.0000 and HealthEvaluation.${ev}.odr_final == 0.0000"
            - "HealthEvaluation.${ev}.late_shipment_rate == 0.0000 and HealthEvaluation.${ev}.cancellation_rate == 0.0000"
            - "HealthEvaluation.${ev}.valid_tracking_rate == 1.0000   # zero-shipment guard returns the perfect rate, not 0.0000"
