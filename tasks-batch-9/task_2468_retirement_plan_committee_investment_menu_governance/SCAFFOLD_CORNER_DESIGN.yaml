            - "training arm fired: trigger call 3 returns exactly one row with total_count 1 — FiduciaryTrainingRecord.${tr_par_c6_id}, COMPLETED -> EXPIRED — because completed_quarter_index 0 + validity_quarters 1 <= the new fiscal_quarter_index 1"
