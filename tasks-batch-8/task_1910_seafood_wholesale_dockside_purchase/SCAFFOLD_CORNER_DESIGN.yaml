          - "state_machines.SubstitutionApproval.REQUESTED_to_APPROVED"
        distinguishing_aspect: "Group check precedes price check at approve: a SHRIMP substitute (group CRUSTACEAN) for a COD line (GADOID) fails with ERR_SUBSTITUTION_GROUP_MISMATCH regardless of price."
        test_recipe:
          setup: ["CONFIRMED order, COD line 10.00 kg allow_substitution true; SHRIMP species (different group) with PUBLISHED quote 800"]
          setup_api_calls:
            - { call: "POST /species", payload: { species_code: "COD", common_name: "Atlantic Cod", labeling_name: "Cod", substitution_group: "GADOID", fresh_shelf_life_hours: 72, frozen_shelf_life_days: 30 }, as: OperationsManager, captures: { sp1_id: $.data.id, sp1_v: $.data.version } }
