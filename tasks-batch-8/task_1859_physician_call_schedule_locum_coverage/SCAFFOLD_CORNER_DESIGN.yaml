  - section: rbac
    instances:
      - name: physician_cannot_create_program
        claim_type: rbac_deny
        grounds:
          - "roles[SchedulerAdmin]"
          - "errors[ERR_FORBIDDEN]"
        distinguishing_aspect: "Program creation is exclusive to SchedulerAdmin; a Physician gets ERR_FORBIDDEN."
        test_recipe:
          setup: ["P1 registered"]
          setup_api_calls:
            - call: "POST /api/physicians"
              payload: { full_name: "Dr A", specialty: "CARDIOLOGY", employment_type: "STAFF" }
              as: SchedulerAdmin
              captures: { p1_id: $.data.id }
          trigger:
            - call: "POST /api/call-programs"
              payload: { name: "Nope", service_line: "CARDIOLOGY", period_start: "2026-09-08", period_end: "2026-09-08", payroll_budget_cents: 1000000 }
              as: Physician
              as_user_id: "${p1_id}"
              captures: { err: $.data.error_id }
          assert:
            - "rejected with ERR_FORBIDDEN (captured ${err}); no program persisted"

      - name: scheduler_admin_cannot_complete_credentialing_item
        claim_type: rbac_deny
        grounds:
          - "roles[CredentialingOfficer]"
          - "errors[ERR_FORBIDDEN]"
        distinguishing_aspect: "complete-item is exclusive to CredentialingOfficer; even the SchedulerAdmin is denied with ERR_FORBIDDEN (peer roles, not hierarchical override)."
        test_recipe:
          setup: ["requisition in CREDENTIALING with an INITIATED case"]
          setup_api_calls:
            - call: "POST /api/call-programs"
              payload: { name: "Cards", service_line: "CARDIOLOGY", period_start: "2026-09-08", period_end: "2026-09-08", payroll_budget_cents: 1000000, weekday_primary_required: 1, weekend_primary_required: 0, holiday_primary_required: 0, weekday_backup_required: 0, weekend_backup_required: 0, holiday_backup_required: 0 }
              as: SchedulerAdmin
              captures: { prog_id: $.data.id }
            - call: "POST /api/call-programs/${prog_id}/generate"
              as: SchedulerAdmin
            - call: "POST /api/call-programs/${prog_id}/publish"
              as: SchedulerAdmin
            - call: "POST /api/physicians"
              payload: { full_name: "Dr Locum", specialty: "CARDIOLOGY", employment_type: "LOCUM" }
              as: SchedulerAdmin
              captures: { l1_id: $.data.id }
            - call: "GET /api/coverage-gaps?program_id=${prog_id}&status=OPEN"
              as: SchedulerAdmin
              captures: { gap_id: $.data.0.id }
            - call: "POST /api/locum-requisitions"
              payload: { gap_id: "${gap_id}" }
              as: SchedulerAdmin
              captures: { req_id: $.data.id }
            - call: "POST /api/locum-requisitions/${req_id}/propose-candidate"
              payload: { candidate_physician_id: "${l1_id}" }
              as: SchedulerAdmin
            - call: "POST /api/locum-requisitions/${req_id}/begin-credentialing"
              as: CredentialingOfficer
            - call: "GET /api/credentialing-cases?requisition_id=${req_id}"
              as: CredentialingOfficer
              captures: { case_id: $.data.0.id }
          trigger:
            - call: "POST /api/credentialing-cases/${case_id}/complete-item"
              payload: { item: "license_verification" }
              as: SchedulerAdmin
              captures: { err: $.data.error_id }
          assert:
            - "rejected with ERR_FORBIDDEN (captured ${err}); case remains INITIATED with all items null"

      - name: chief_of_staff_cannot_approve_unavailability_window
        claim_type: rbac_deny
        grounds:
          - "roles[ChiefOfStaff]"
          - "errors[ERR_FORBIDDEN]"
        distinguishing_aspect: "Window approval is exclusive to SchedulerAdmin; ChiefOfStaff (who approves swaps) is denied with ERR_FORBIDDEN — approval authority is per-resource, not global."
        test_recipe:
          setup: ["P1 registered with a REQUESTED window"]
          setup_api_calls:
            - call: "POST /api/physicians"
              payload: { full_name: "Dr A", specialty: "CARDIOLOGY", employment_type: "STAFF" }
              as: SchedulerAdmin
              captures: { p1_id: $.data.id }
            - call: "POST /api/unavailability-windows"
              payload: { physician_id: "${p1_id}", start_date: "2026-09-05", end_date: "2026-09-06", kind: "VACATION" }
              as: Physician
              as_user_id: "${p1_id}"
              captures: { win_id: $.data.id }
          trigger:
            - call: "POST /api/unavailability-windows/${win_id}/approve"
              as: ChiefOfStaff
              captures: { err: $.data.error_id }
          assert:
            - "rejected with ERR_FORBIDDEN (captured ${err}); window remains REQUESTED"

      - name: credentialing_officer_runs_begin_credentialing
        claim_type: rbac_allow
        grounds:
          - "roles[CredentialingOfficer]"
        excluded_because:
          difficulty_instance: "non_linear_state_machine / locum_requisition_credentialing_fail_reopen_cycle"
          rationale: "begin-credentialing, complete-item and fail are all executed as CredentialingOfficer in the named §1.8 instance's chain."

  - section: cross_cutting_layers
    instances:
      - name: occ_regenerate_stale_version_rejected
        claim_type: optimistic_concurrency
        grounds:
          - "concurrency_rules[program-regenerate-stale-version]"
          - "errors[ERR_STALE_VERSION]"
        distinguishing_aspect: "Regenerate carries expected_call_program_version: the version observed after generate (2) succeeds once (version -> 3), then the same stale version is rejected with 412 ERR_STALE_VERSION on a strictly sequential second call."
        test_recipe:
          setup: ["program created (version 1) and generated (version 2); zero physicians so regeneration has no progress blockage"]
          setup_api_calls:
            - call: "POST /api/call-programs"
              payload: { name: "Cards OCC", service_line: "CARDIOLOGY", period_start: "2026-09-08", period_end: "2026-09-08", payroll_budget_cents: 1000000, weekday_primary_required: 1, weekend_primary_required: 0, holiday_primary_required: 0, weekday_backup_required: 0, weekend_backup_required: 0, holiday_backup_required: 0 }
              as: SchedulerAdmin
              captures: { prog_id: $.data.id, prog_v1: $.data.version }
            - call: "POST /api/call-programs/${prog_id}/generate"
              as: SchedulerAdmin
              captures: { prog_v2: $.data.version }
          trigger:
            - call: "POST /api/call-programs/${prog_id}/regenerate"
              payload: { expected_call_program_version: "${prog_v2}" }
              as: SchedulerAdmin
              captures: { prog_v3: $.data.version }
            - call: "POST /api/call-programs/${prog_id}/regenerate"
              payload: { expected_call_program_version: "${prog_v2}" }
              as: SchedulerAdmin
              captures: { err: $.data.error_id }
          assert:
            - "create returned version 1 and generate returned version 2 (captured ${prog_v1}, ${prog_v2})"
            - "first regenerate with the observed version succeeded: version == 3 (captured ${prog_v3})"
            - "second regenerate with the now-stale version rejected with ERR_STALE_VERSION (captured ${err}), http 412"
            - "the failed regenerate changed nothing: GET program still version 3 and still GENERATED"

      - name: cascading_side_effects_layer
        claim_type: cascading_side_effects
        grounds:
          - "complexity_profile.complexity_layers"
        excluded_because:
          difficulty_instance: "transitive_cascade / credentialing_completion_autofill_cascade"
          rationale: "Depth-5 cascade asserted end-to-end in the named §1.8 instance (plus the unavailability approval cascade instance)."

      - name: dual_variant_calculation_layer
        claim_type: dual_variant_calculation
        grounds:
          - "complexity_profile.complexity_layers"
        excluded_because:
          difficulty_instance: "dual_variant_calc / fairness_points_prospective_vs_actual"
          rationale: "Both dual-variant calculations are asserted by the two §1.8 dual_variant_calc instances."

      - name: rate_threshold_layer
        claim_type: rate_threshold_triggers
        grounds:
          - "complexity_profile.complexity_layers"
        excluded_because:
          difficulty_instance: "boundary_precision_check / moonlight_cap_equality_allowed_overage_rejected"
          rationale: "Threshold boundary semantics (<= cap, >= premium threshold) asserted in the named §1.8 instance and the 28-day window corner."

