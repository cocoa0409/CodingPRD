  - section: consistency_model
    instances:
      - name: snapshot_publish_immediate_visibility
        claim_type: immediate
        grounds: [entities.Zone.fields.current_multiplier, response_envelope]
        distinguishing_aspect: "Publishing a snapshot updates Zone.current_multiplier and heat_level in the same request lifecycle; a follow-up GET /zones/{id} sees current_multiplier 2.00 and heat_level HOT immediately."
        test_recipe:
          setup: ["One zone base 1000 at version 1."]
          setup_api_calls:
            - call: "POST /zones"
              payload: { name: "Z1", grid_code: "AA1", base_fare_cents: 1000 }
              as: Dispatcher
              captures: { z_id: $.data.id, z_v: $.data.version }
            - call: "POST /zones/${z_id}/surge-snapshots"
              payload: { observed_demand: 4, observed_supply: 2, is_rush_hour: false, effective_from: "2026-06-01T00:00:00Z", effective_to: "2026-06-01T01:00:00Z", expected_zone_version: "${z_v}" }
              as: Dispatcher
          trigger:
            - call: "GET /zones/${z_id}"
              payload: {}
              as: Dispatcher
              captures: { live_mult: $.data.current_multiplier, live_heat: $.data.heat_level }
          assert:
            - "Zone.${z_id}.current_multiplier == 2.00 and Zone.${z_id}.heat_level == HOT"
