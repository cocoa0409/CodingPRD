  - rule_id: priority_pair_validation_conflict
    instances:
      - name: design_not_approved_state_gate_outranks_parcel_flow_cap_fiscal_gate
        grounds:
          - validations[priority=11]
          - validations[priority=26]
          - errors[ERR_DESIGN_NOT_APPROVED]
          - errors[ERR_DESIGN_FLOW_EXCEEDS_PARCEL_CAP]
        distinguishing_aspect: |
          Error-category pair `state` (priority 11) versus `business_fiscal` (priority 26): a
          single POST /construction-permits violates BOTH — the design is UNDER_REVIEW rather
          than APPROVED, and its 360 gpd design flow already exceeds the 200 gpd cap of the
          4000 sqft parcel. The state error must win; approving the design then re-issuing
          surfaces the fiscal error, proving the ordering rather than a lucky single failure.
