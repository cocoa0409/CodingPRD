    description: "Withdraw a released edition; conflicting drops HELD"
    roles: [ComplianceReviewer]
    code: 200
    input: []
    output: RegionalEdition
    side_effects: ["edition_status -> WITHDRAWN; conflicting drops HELD"]

  # --- RoyaltyStatement ---
  - method: POST
    path: "/licensing/royalty-statements"
    description: "Open a royalty statement for a period"
    roles: [FinanceController]
    code: 201
    input: [agreement_id, period_start_on, period_end_on, gross_sales_cents, returns_cents, pending_sales_cents]
    output: RoyaltyStatement
    side_effects: ["statement_status=OPEN"]

  - method: GET
    path: "/licensing/royalty-statements/{statement_id}"
    description: "Get a royalty statement"
    roles: [LicensingAdmin, FinanceController, LeagueAuditor, UnionAuditor]
    code: 200
    input: []
    output: RoyaltyStatement
    side_effects: []

  - method: POST
    path: "/licensing/royalty-statements/{statement_id}/compute-provisional"
    description: "Compute PROVISIONAL accrual"
    roles: [FinanceController]
    code: 200
    input: []
    output: RoyaltyStatement
    side_effects: ["statement_status -> PROVISIONAL; accrued_royalty_cents under PROVISIONAL variant"]

  - method: POST
    path: "/licensing/royalty-statements/{statement_id}/finalize"
    description: "Finalize after period end; FINAL variant recompute"
    roles: [FinanceController]
    code: 200
    input: []
    output: RoyaltyStatement
    side_effects: ["statement_status -> FINALIZED; accrued_royalty_cents under FINAL variant; agreement outstanding increases"]

  - method: POST
    path: "/licensing/royalty-statements/{statement_id}/pay"
    description: "Pay a FINALIZED (or settled DISPUTED) statement"
    roles: [FinanceController]
    code: 200
    input: []
    output: RoyaltyStatement
    side_effects: ["statement_status -> PAID; paid_royalty_cents set; agreement outstanding decreases; recoupment updated"]

  - method: GET
    path: "/licensing/royalty-statements/{id}/audit-cases"
    description: "List audit cases referencing a royalty statement"
    roles: [LicensingAdmin, FinanceController, LeagueAuditor, UnionAuditor]
    code: 200
    input: ["limit?", "offset?"]
    output: "AuditCase[]"
    side_effects: []

  # --- AuditCase ---
  - method: POST
    path: "/licensing/audit-cases"
    description: "Open an audit on a FINALIZED statement within the audit window"
    roles: [LeagueAuditor, UnionAuditor]
    code: 201
    input: [agreement_id, statement_id, opened_by_role]
    output: AuditCase
    side_effects: ["audit_status=OPEN; statement FINALIZED -> DISPUTED"]

  - method: GET
    path: "/licensing/audit-cases/{case_id}"
    description: "Get an audit case"
    roles: [LicensingAdmin, FinanceController, LeagueAuditor, UnionAuditor]
    code: 200
    input: []
    output: AuditCase
    side_effects: []

  - method: POST
    path: "/licensing/audit-cases/{case_id}/file-findings"
    description: "File audit findings with a signed delta"
    roles: [LeagueAuditor, UnionAuditor]
    code: 200
    input: [finding_delta_cents]
    output: AuditCase
    side_effects: ["audit_status -> FINDINGS_FILED"]

  - method: POST
    path: "/licensing/audit-cases/{case_id}/settle"
    description: "Settle the audit (different actor than opener); applies delta to the statement"
    roles: [FinanceController]
    code: 200
    input: []
    output: AuditCase
    side_effects: ["audit_status -> SETTLED; statement accrued adjusted by finding_delta_cents"]

  - method: POST
    path: "/licensing/audit-cases/{case_id}/close"
    description: "Close a settled audit after the statement is paid"
    roles: [FinanceController]
    code: 200
    input: []
    output: AuditCase
    side_effects: ["audit_status -> CLOSED"]

# =============================================================================
# Table 6: Error Code Catalog
# =============================================================================
errors:
  - { id: ERR_MISSING_CONTEXT, http: 400, condition: "X-User-ID or X-User-Role header missing or malformed" }
  - { id: ERR_FORBIDDEN_ROLE, http: 403, condition: "Role not permitted for this endpoint" }
  - { id: ERR_NOT_FOUND, http: 404, condition: "Path id or body FK does not resolve" }
  - { id: ERR_INVALID_INPUT, http: 400, condition: "Missing required field, invalid enum, or range violation (rating 40..99, share_bps sum 10000, amount_vc > 0)" }
  - { id: ERR_INVALID_STATE, http: 409, condition: "Requested transition not valid from the resource's current state" }
  - { id: ERR_SEGREGATION_OF_DUTIES, http: 409, condition: "Actor of this step must differ from the actor of the prior step (roster submit vs publish; edition submit vs approve; audit open vs settle)" }
  - { id: ERR_REFERENCE_STATE, http: 409, condition: "Cross-entity state precondition failed (agreement not ACTIVE, athlete not ELIGIBLE, season not LIVE)" }
  - { id: ERR_TEMPORAL_CONFLICT, http: 409, condition: "Temporal rule violated: outside term/registration/scheduled window, embargo not reached, audit window missed, or exclusivity overlap" }
  - { id: ERR_FISCAL_BLOCK, http: 422, condition: "Fiscal rule violated: insufficient wallet balance, blocking audit on statement, or prize shares not totaling 10000 bps" }
  - { id: ERR_STALE_SEASON_VERSION, http: 412, condition: "Roster batch publish against a stale season version" }
  - { id: ERR_STALE_PROGRAM_VERSION, http: 412, condition: "Payout finalize against a stale tournament program version" }
  - { id: ERR_EXCLUSIVITY_CONFLICT, http: 409, condition: "Activating agreement would overlap an ACTIVE/SUSPENDED exclusive agreement in the same sport category" }
  - { id: ERR_ATHLETE_NOT_ELIGIBLE, http: 409, condition: "Athlete lacks a GRANTED likeness grant (or college opt-in missing) required for this operation" }
  - { id: ERR_DROP_WINDOW, http: 409, condition: "Content drop release attempted outside [scheduled_start_at, scheduled_end_at)" }
  - { id: ERR_CENSORSHIP_CONFLICT, http: 409, condition: "Drop content conflicts with a RELEASED regional edition's censorship flags" }
  - { id: ERR_EMPTY_BATCH, http: 409, condition: "Roster batch validate/publish attempted with zero entries" }
  - { id: ERR_ROLLBACK_NOT_HEAD, http: 409, condition: "Rollback attempted on a batch that is not the most recently published batch" }
  - { id: ERR_AUDIT_WINDOW_MISSED, http: 409, condition: "Audit opened after agreement.audit_window_days past statement finalization" }
  - { id: ERR_AUDIT_BLOCKS_TERMINATION, http: 409, condition: "Agreement termination blocked by an OPEN or FINDINGS_FILED audit case" }
  - { id: ERR_WALLET_FROZEN, http: 409, condition: "Debit attempted on a FROZEN wallet" }
  - { id: ERR_INSUFFICIENT_VC, http: 422, condition: "Wallet balance below debit amount" }
  - { id: ERR_PRIZE_SHARES_INVALID, http: 422, condition: "Prize share_bps rows do not total 10000 at record-results" }
  - { id: ERR_UNSANCTIONED_PAYOUT, http: 422, condition: "finalize-payout on a program with league_sanctioned == false" }
  - { id: ERR_GRANT_TERM_OUTSIDE_AGREEMENT, http: 409, condition: "Likeness grant term not contained in the agreement term" }
  - { id: ERR_COLLEGE_OPT_IN_REQUIRED, http: 409, condition: "COLLEGE athlete grant requires college_opt_in == true" }
  - { id: ERR_AUDIO_UNCOVERED, http: 409, condition: "Operation requires an ACTIVE audio license covering the asset" }

# =============================================================================
# Table 7: RBAC Matrix
# =============================================================================
roles:
  - name: LicensingAdmin
    description: "Owns license agreement lifecycle and logical clock"
    identity: opaque
    exclusive_operations:
      - "POST /licensing/agreements — create agreement"
      - "POST /licensing/agreements/{id}/activate|suspend|reinstate|terminate"
      - "POST /licensing/_clock/set_current_utc"
    shared_operations:
      - "All GET endpoints"

  - name: RightsOfficer
    description: "Manages athletes, likeness grants, and audio rights"
    identity: opaque
    exclusive_operations:
      - "POST /licensing/athletes"
      - "POST /licensing/likeness-grants and grant/suspend/reinstate/revoke"
      - "POST /licensing/audio-assets, /audio-licenses, terminate, retire"
    shared_operations:
      - "GET agreements, athletes, likeness-grants, audio resources"

  - name: RosterOperator
    description: "Builds and validates roster batches; may not publish or reject"
    identity: opaque
    exclusive_operations:
      - "POST /licensing/roster-batches"
      - "POST /licensing/roster-batches/{id}/entries"
      - "POST /licensing/roster-batches/{id}/validate"
    shared_operations:
      - "GET seasons, athletes, roster-batches, entries"

  - name: RosterReviewer
    description: "Publishes, rejects, and rolls back roster batches; must differ from the submitting operator"
    identity: opaque
    exclusive_operations:
      - "POST /licensing/roster-batches/{id}/publish"
      - "POST /licensing/roster-batches/{id}/reject"
      - "POST /licensing/roster-batches/{id}/rollback"
    shared_operations:
      - "GET seasons, athletes, roster-batches, entries"

  - name: LiveOpsManager
    description: "Runs seasons, drops, wallets, tournaments, and edition submissions"
    identity: opaque
    exclusive_operations:
      - "POST /licensing/seasons and launch/sunset/archive"
      - "POST /licensing/content-drops, release, cancel, purchase"
      - "POST /licensing/wallets, freeze, unfreeze, ledger-entries"
      - "POST /licensing/tournaments and registration/results/cancel"
      - "POST /licensing/editions and submit-review/release"
    shared_operations:
      - "GET seasons, drops, wallets, tournaments, editions, athletes, audio-assets"

  - name: FinanceController
    description: "Owns royalty statements, payouts, prize finalization, and audit settlement"
    identity: opaque
    exclusive_operations:
      - "POST /licensing/royalty-statements and compute-provisional/finalize/pay"
      - "POST /licensing/tournaments/{id}/finalize-payout"
      - "POST /licensing/audit-cases/{id}/settle and /close"
    shared_operations:
      - "GET statements, audit-cases, agreements, wallets, ledger-entries, likeness-grants"

  - name: LeagueAuditor
    description: "League-held audit rights: opens audits and files findings"
    identity: opaque
    exclusive_operations:
      - "POST /licensing/audit-cases"
      - "POST /licensing/audit-cases/{id}/file-findings"
    shared_operations:
      - "GET agreements, statements, audit-cases, likeness-grants"

  - name: UnionAuditor
    description: "Players-association audit rights: opens audits and files findings"
    identity: opaque
    exclusive_operations:
      - "POST /licensing/audit-cases"
      - "POST /licensing/audit-cases/{id}/file-findings"
    shared_operations:
      - "GET agreements, statements, audit-cases"

  - name: ComplianceReviewer
    description: "Approves and withdraws regional editions; must differ from submitting operator"
    identity: opaque
    exclusive_operations:
      - "POST /licensing/editions/{id}/approve"
      - "POST /licensing/editions/{id}/return-to-draft"
      - "POST /licensing/editions/{id}/withdraw"
    shared_operations:
      - "GET editions, seasons, content-drops"
