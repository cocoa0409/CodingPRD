            - "${e_disp} == ERR_TRADE_IN_NOT_DISPOSITIONABLE  # HTTP 409"
            - "${st} == SUBMITTED and ${ver_after} == ${ver1} and ${appeals} == 0 and ${auth_res} == PENDING"

      - name: rejected_trade_in_is_terminal_for_every_trigger
