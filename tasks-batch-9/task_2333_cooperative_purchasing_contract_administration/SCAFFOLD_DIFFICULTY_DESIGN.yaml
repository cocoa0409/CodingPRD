            - call: "POST /coop/piggyback-analyses/${pb_id}/determination"
              payload: { action: "DETERMINE" }
              as: CoopAdministrator
              as_user_id: "adm-piggy-05"
            - call: "POST /coop/contract-usages"
              payload: { contract_id: "${mc_id}", member_agency_id: "${mem_id}", line_item_id: "${li_liner_id}", piggyback_analysis_id: "${pb_id}", quantity: 1 }
              as: MemberRepresentative
              as_user_id: "${mem_id}"
              captures: { use_1_id: $.data.id }
            - call: "POST /coop/contract-usages/${use_1_id}/disposition"
              payload: { action: "CONFIRM" }
              as: MemberRepresentative
              as_user_id: "${mem_id}"
            - call: "POST /coop/contract-usages"
              payload: { contract_id: "${mc_id}", member_agency_id: "${mem_id}", line_item_id: "${li_liner_id}", piggyback_analysis_id: "${pb_id}", quantity: 1 }
              as: MemberRepresentative
              as_user_id: "${mem_id}"
              captures: { use_2_id: $.data.id }
            - call: "POST /coop/contract-usages/${use_2_id}/disposition"
              payload: { action: "CONFIRM" }
              as: MemberRepresentative
              as_user_id: "${mem_id}"
            - call: "POST /coop/contract-usages"
              payload: { contract_id: "${mc_id}", member_agency_id: "${mem_id}", line_item_id: "${li_liner_id}", piggyback_analysis_id: "${pb_id}", quantity: 1 }
              as: MemberRepresentative
              as_user_id: "${mem_id}"
              captures: { use_3_id: $.data.id }
            - call: "POST /coop/contract-usages/${use_3_id}/disposition"
              payload: { action: "CONFIRM" }
              as: MemberRepresentative
              as_user_id: "${mem_id}"
            - call: "POST /coop/usage-reports"
              payload: { contract_id: "${mc_id}", period_start: "2026-09-01T00:00:00Z", period_end: "2026-09-30T23:59:59Z" }
              as: SupplierRepresentative
              as_user_id: "${sup_a_id}"
              captures: { rpt_id: $.data.id }
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-10-01T00:00:00Z" }
              as: CoopAdministrator
          trigger:
            - call: "POST /coop/usage-reports/${rpt_id}/submission"
              payload: { action: "SUBMIT" }
              as: SupplierRepresentative
              as_user_id: "${sup_a_id}"
              captures: { rpt_reported_fee: $.data.reported_fee_cents }
            - call: "POST /coop/usage-reports/${rpt_id}/review"
              payload: { action: "ACCEPT" }
              as: CoopAdministrator
              as_user_id: "adm-review-02"
            - call: "POST /coop/usage-reports/${rpt_id}/fee-remittance"
              payload: { action: "REMIT", amount_cents: 541 }
              as: SupplierRepresentative
              as_user_id: "${sup_a_id}"
            - call: "POST /coop/usage-reports/${rpt_id}/review"
              payload: { action: "RECONCILE" }
              as: CoopAdministrator
              as_user_id: "adm-review-02"
          assert:
            - "UsageReport.${rpt_id}.swept_usage_count == 3"
            - "UsageReport.${rpt_id}.reported_chargeable_cents == 27045"
            - "UsageReport.${rpt_id}.reported_usage_cents == 27585"
            - "UsageReport.${rpt_id}.reported_fee_cents == 541"
            - "UsageReport.${rpt_id}.audited_fee_cents == 540"
            - "UsageReport.${rpt_id}.fee_true_up_cents == -1"
            - "UsageReport.${rpt_id}.fee_rebate_cents == 1"
            - "UsageReport.${rpt_id}.variance_pct == 0.19"
            - "UsageReport.${rpt_id}.variance_flagged == false"
            - "UsageReport.${rpt_id}.status == RECONCILED"
            - "ContractUsage.${use_1_id}.admin_fee_cents == 180"
            - "ContractUsage.${use_1_id}.effective_fee_rate_bps == 200"
            - "Supplier.${sup_a_id}.performance_score == 100.00"

      - name: admin_fee_reported_versus_audited_tier_rebate_divergence
        grounds:
          - calculations.admin_fee_assessment
          - calculations.member_usage_total
          - entities.ContractUsage.fields.effective_fee_rate_bps
          - entities.UsageReport.fields.variance_flagged
          - state_machines.UsageReport.status.ACCEPTED_to_RECONCILED
          - calculations.supplier_performance_score
        distinguishing_aspect: |
          The divergence here is caused by the TIER REBATE rather than by rounding: the single
          swept usage sits in discount tier 2 and therefore froze effective_fee_rate_bps 150,
          so AUDITED yields 1538 while REPORTED applies the contract's un-rebated 200 bps to
          the same 102500-cent base and yields 2050 - a 33.29% variance that trips
          MAX_REPORT_VARIANCE_PCT and charges VARIANCE_DEDUCTION_POINTS, which the
          rounding-only instance never does.
        test_recipe:
          setup:
            - "StateLawRule row exists for TX with piggyback_doctrine STATUTORY_STRICT and requires_lead_agency_in_state false."
            - "Supplier Acme (TX) is QUALIFIED with ACTIVE contract COOP-MC-2026-001 (admin_fee_rate_bps 200, tier 2 at 20000000 cents / 18% discount, FEE_REBATE_BY_TIER[2] = 0.2500)."
            - "MemberAgency Gulf Coast (TX, COUNTY, ceiling 50000000) is ACTIVE and has been primed to committed_spend_cents exactly 20000000 by one RECORDED (never CONFIRMED, therefore never swept) usage of 19607843 units on the one-cent adjustment line."
            - "One further usage of 10 units of JAN-DISP-500 is CONFIRMED at tier 2: net_unit_price_cents 10250, chargeable_base_cents 102500, effective_fee_rate_bps 150, admin_fee_cents 1538."
