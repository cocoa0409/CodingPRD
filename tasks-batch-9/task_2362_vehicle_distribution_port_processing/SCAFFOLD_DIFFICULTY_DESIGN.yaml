        distinguishing_aspect: |
          A third metric on a third endpoint: occupancy_ratio on
          POST /vpc/vessels/{vesselId}/vehicles with yard_capacity_slots 5. At 4 units the ratio is
          exactly 0.80 -> CONSTRAINED (inclusive lower bound) and the fifth unit is still admitted;
          only at ratio 1.00 >= 0.95 does GRIDLOCK reject. Computing the ratio in floating point or
          treating CONSTRAINED as a rejection state both fail here.
