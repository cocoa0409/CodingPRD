              as: SiteOps
              captures: { ro_shr: $.data.id }
            - call: "POST /mfc/replenish-orders/${ro_shr}/place"
              payload: {}
              as: SiteOps
            - call: "POST /mfc/replenish-orders/${ro_shr}/finalize"
              payload: { lot_expiries: { "${prod_milk}": "2026-09-20T00:00:00Z" } }
              as: SiteOps
            - call: "GET /mfc/stock-lots"
              payload: {}
              as: SiteOps
              captures: { lot_shr: "$.data[0].id" }
          trigger:
            - call: "POST /mfc/inventory-balances/${bal_milk}/adjustments"
              payload: { kind: "SHRINK_DISPOSE", qty: 2, lot_id: "${lot_shr}", reason: "premature" }
              as: SiteOps
              captures: { err_shr: $.data.error_id }
            - call: "POST /mfc/_clock/set_current_utc"
              payload: { current_utc: "2026-09-21T00:00:00Z" }
              as: SiteOps
            - call: "POST /mfc/inventory-balances/${bal_milk}/adjustments"
              payload: { kind: "SHRINK_DISPOSE", qty: 9, lot_id: "${lot_shr}", reason: "too many" }
              as: SiteOps
              captures: { err_shr2: $.data.error_id }
            - call: "POST /mfc/inventory-balances/${bal_milk}/adjustments"
              payload: { kind: "SHRINK_DISPOSE", qty: 5, lot_id: "${lot_shr}", reason: "expired write-off" }
              as: SiteOps
          assert:
            - "FRESH-lot disposal: 422 and error_id == ERR_SHRINK_EXCEEDS_LOT (lot not EXPIRED at the clock)"
            - "Over-qty disposal after expiry: 422 ERR_SHRINK_EXCEEDS_LOT (9 > 5 remaining)"
            - "Valid disposal of 5: lot remaining_qty == 0 and InventoryBalance.${bal_milk}.on_hand == 0"

