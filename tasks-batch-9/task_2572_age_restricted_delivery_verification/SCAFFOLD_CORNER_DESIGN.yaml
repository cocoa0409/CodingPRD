          - entities.ViolationCase.fields.investigation_rounds
          - errors[ERR_INVALID_CASE_STATE]
        distinguishing_aspect: |
          The PENDING_PARTNER_RESPONSE cycle edge is traversed twice from the same case, so
          investigation_rounds must reach 3 (one investigate plus two partner answers) rather than
          saturating at 1; and while the case waits on the partner, decide is not merely ignored
          but rejected 409 ERR_INVALID_CASE_STATE, proving the officer path is gated on the state
