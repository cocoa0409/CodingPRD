  - rule_id: priority_pair_validation_conflict
    instances:
      - name: condition_beats_security_which_beats_the_environmental_envelope_on_one_placement
        grounds:
          - validations.priority_62
          - validations.priority_64
          - validations.priority_66
          - calculations.case_environmental_envelope
          - concurrency_rules.placement-create-stale-case
        distinguishing_aspect: |
          Four placement requests differ only in the artifact they name, and the
          rules they break are nested: the first breaks 62, 64 and 66 at once,
          the second breaks 64 and 66, the third breaks only 66, and the fourth
          breaks nothing. The reported error_id must therefore step down the
          ladder ERR_ARTIFACT_CONDITION_UNSTABLE -> ERR_SECURITY_TIER_INSUFFICIENT
          -> ERR_ENV_ENVELOPE_INFEASIBLE -> 201. Any implementation that
          evaluates the environmental envelope first (the natural order, since
          it is the expensive computed check) reports ERR_ENV_ENVELOPE_INFEASIBLE
          three times. A second trap rides along: because all three failures are
          rejections, the case version must NOT move, so the fourth request can
          still use the original expected_case_version.
        test_recipe:
          setup:
            - "project in phase SCHEMATIC with an APPROVED SCHEMATIC package and zone Z-A"
            - "case C-01: security_tier ENHANCED, target_rh_pct 50.0, rh_tolerance_pct 2.0, target_lux 50.0, so the case demands 48.0-52.0 %RH and 50.0 lux"
            - "artifact 2021.1.1 UNSTABLE / HIGH_VALUE / max_lux 30.0 (breaks 62, 64 and 66)"
            - "artifact 2021.1.2 STABLE / HIGH_VALUE / max_lux 30.0 (breaks 64 and 66)"
            - "artifact 2021.1.3 STABLE / ENHANCED / max_lux 30.0 (breaks 66 only)"
            - "artifact 2021.1.4 STABLE / ENHANCED / max_lux 50.0, RH 45.0-55.0 (breaks nothing)"
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-08-01T00:00:00Z" }
              as: ProjectManager
            - call: "POST /exhibit-projects"
