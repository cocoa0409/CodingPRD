              as_user_id: "compliance-2"
            - call: "POST /recruitment/applications"
              payload: { agency_id: "${ag1_id}", program_id: "${prog0_id}", student_ref: "STU-0001", student_residence_country: "IN", student_us_person: false }
              as: AgencyOwner
              as_user_id: "${ag1_id}"
              captures: { a0_id: "$.data.id" }
            - call: "POST /recruitment/applications/${a0_id}/documents"
              payload: { doc_type: "PASSPORT", content_hash: "hash-passport-0001", issuer_name: "MEA India", declared_signals: [] }
              as: AgencyOwner
              as_user_id: "${ag1_id}"
              captures: { d0_id: "$.data.id" }
            - call: "POST /recruitment/documents/${d0_id}/verification"
              payload: { outcome: "VERIFIED" }
              as: ComplianceOfficer
              as_user_id: "compliance-1"
            - call: "POST /recruitment/applications/${a0_id}/disclosure"
              payload: { action: "ISSUE" }
              as: RecruitmentOfficer
              as_user_id: "officer-1"
              captures: { tok0: "$.data.disclosure_ack_token" }
            - call: "POST /recruitment/applications/${a0_id}/disclosure"
              payload: { action: "ACKNOWLEDGE", ack_token: "${tok0}" }
              as: Applicant
              as_user_id: "applicant-0001"
            - call: "POST /recruitment/applications/${a0_id}/submit"
              payload: {}
              as: AgencyOwner
              as_user_id: "${ag1_id}"
            - call: "POST /recruitment/applications/${a0_id}/decision"
              payload: { decision: "ADMIT" }
              as: RecruitmentOfficer
              as_user_id: "officer-1"
              captures: { a0_v1: "$.data.version" }
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-03T00:00:00Z" }
              as: RecruitmentOfficer
              as_user_id: "officer-1"
            - call: "POST /recruitment/applications/${a0_id}/milestones"
              payload: { milestone: "DEPOSIT_PAID", event_date: "2026-08-03", expected_application_version: "${a0_v1}" }
              as: Registrar
              as_user_id: "registrar-1"
              captures: { a0_v2: "$.data.version" }
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-04T00:00:00Z" }
              as: RecruitmentOfficer
              as_user_id: "officer-1"
            - call: "POST /recruitment/applications/${a0_id}/milestones"
              payload: { milestone: "ENROLLED", event_date: "2026-08-04", expected_application_version: "${a0_v2}" }
              as: Registrar
              as_user_id: "registrar-1"
              captures: { a0_v3: "$.data.version" }
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-06T00:00:00Z" }
              as: RecruitmentOfficer
              as_user_id: "officer-1"
            - call: "POST /recruitment/applications/${a0_id}/milestones"
              payload: { milestone: "CENSUS_CONFIRMED", event_date: "2026-08-06", expected_application_version: "${a0_v3}" }
              as: Registrar
              as_user_id: "registrar-1"
              captures: { a0_v4: "$.data.version" }
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-10T00:00:00Z" }
              as: RecruitmentOfficer
              as_user_id: "officer-1"
            - call: "POST /recruitment/applications/${a0_id}/milestones"
              payload: { milestone: "PERSISTED", event_date: "2026-08-10", expected_application_version: "${a0_v4}" }
              as: Registrar
              as_user_id: "registrar-1"
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-11T00:00:00Z" }
              as: RecruitmentOfficer
              as_user_id: "officer-1"
            - call: "POST /recruitment/agencies/${ag1_id}/scorecards"
              payload: { period_start_date: "2026-08-01", period_end_date: "2026-08-11" }
              as: RecruitmentOfficer
              as_user_id: "officer-1"
              captures: { sc_plat_id: "$.data.id" }
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-12T00:00:00Z" }
              as: RecruitmentOfficer
              as_user_id: "officer-1"
            - call: "POST /recruitment/applications"
              payload: { agency_id: "${ag1_id}", program_id: "${prog1_id}", student_ref: "STU-1001", student_residence_country: "IN", student_us_person: false }
              as: AgencyOwner
              as_user_id: "${ag1_id}"
              captures: { a1_id: "$.data.id" }
            - call: "POST /recruitment/applications/${a1_id}/documents"
              payload: { doc_type: "PASSPORT", content_hash: "hash-passport-1001", issuer_name: "MEA India", declared_signals: [] }
              as: AgencyOwner
              as_user_id: "${ag1_id}"
              captures: { d1_id: "$.data.id" }
            - call: "POST /recruitment/documents/${d1_id}/verification"
              payload: { outcome: "VERIFIED" }
              as: ComplianceOfficer
              as_user_id: "compliance-1"
