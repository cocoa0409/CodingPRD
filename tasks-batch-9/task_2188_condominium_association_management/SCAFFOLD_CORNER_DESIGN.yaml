              captures: { unit2: "$.data.id" }
            - call: "POST /associations/${assoc}/board-meetings"
              as: CommunityManager
              payload: { scheduled_start: "2026-09-01T10:00:00Z", scheduled_end: "2026-09-01T12:00:00Z", agenda_kinds: ["BUDGET_RATIFICATION"] }
              captures: { meeting1: "$.data.id" }
            - call: "GET /associations/${assoc}"
              as: CommunityManager
              captures: { av1: "$.data.version" }
            - call: "POST /associations/${assoc}/budgets"
              as: CommunityManager
              payload: { fiscal_year: 2026, operating_total_cents: 12000000, reserve_contribution_cents: 1200000, ratification_meeting_id: "${meeting1}", expected_association_version: "${av1}" }
              captures: { budget1: "$.data.id" }
            - call: "POST /budgets/${budget1}/propose"
              as: CommunityManager
              payload: {}
            - call: "POST /budgets/${budget1}/send-notice"
              as: CommunityManager
              payload: {}
            - call: "POST /_clock/set_current_utc"
              as: CommunityManager
