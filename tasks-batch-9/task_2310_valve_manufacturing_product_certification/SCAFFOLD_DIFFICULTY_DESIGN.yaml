              payload: { model_code: "BV-600-CEIL", valve_type: "BALL", pressure_class: 600, body_material_grade: "CF8M", bore_size_mm: 100, seat_type: "METAL", base_break_torque_nm: 900.0 }
              as: ProductEngineer
              captures: { m_id: $.data.id }
            - call: "POST /valve-mfg/heat-lots"
              payload: { foundry_id: "${f_id}", heat_number: "H-1301", material_grade: "CF8M", process: "CASTING", qty_received_kg: 500.000, mtr_document_ref: "MTR-1301", carbon_equivalent_pct: 0.35, impact_energy_j: 40 }
              as: ProcurementSpecialist
              captures: { l_id: $.data.id }
            - call: "POST /valve-mfg/heat-lots/${l_id}/dispositions"
              payload: { action: "VERIFY" }
              as: QualityManager
            - call: "POST /valve-mfg/heat-lots/${l_id}/dispositions"
              payload: { action: "RELEASE" }
