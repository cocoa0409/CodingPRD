              as: Technician
              as_user_id: "${tech_id}"
              captures: { defect_id: $.data.id }
            - call: "POST /work-orders"
              payload: { defect_id: "${defect_id}", assigned_technician_id: "${tech_id}", title: "Replace fan", estimated_hours: 3 }
              as: OperationsManager
              captures: { wo_id: $.data.id }
            - call: "POST /outage-windows"
              payload: { substation_id: "${sub_id}", asset_id: "${asset_id}", start_ts: "2026-08-12T08:00:00Z", end_ts: "2026-08-12T16:00:00Z", purpose: "Fan replacement" }
              as: OutageCoordinator
              as_user_id: "coord-1"
              captures: { ow_id: $.data.id }
            - call: "POST /outage-windows/${ow_id}/switching-steps"
              payload: { sequence_no: 1, description: "Isolate transformer" }
              as: OutageCoordinator
            - call: "POST /outage-windows/${ow_id}/approve"
