            - "409 with error_id ERR_CLUSTER_WINDOW_OVERLAP on the second create"
            - "no second BunchingClaim row was created, and a window starting 2026-08-06T00:00:00Z would have been accepted"

      - name: second_open_average_agreement_for_the_same_month
        claim_type: violation_to_error
        grounds:
          - validations.priority_68_duplicate_agreement_month
          - errors.ERR_DUPLICATE_AGREEMENT_MONTH
        distinguishing_aspect: |
          The uniqueness key is (customer, agreement_month, status OPEN), so a
          different month or a different customer is fine and only a second OPEN
          row for the same month collides. A RECONCILED row for the month would
          not block.
        test_recipe:
          setup:
            - "one customer with an OPEN AverageAgreement for 2026-08"
          setup_api_calls:
            - call: "POST /demurrage/_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-01T00:00:00Z" }
              as: BillingAdmin
            - call: "POST /demurrage/customers"
              payload: { customer_code: "C9VB-CUST", name: "Duplicate Dolomite", serving_station_code: "STN80" }
              as: BillingAdmin
              captures: { cust_id: $.data.id }
            - call: "POST /demurrage/average-agreements"
              payload: { customer_id: "${cust_id}", agreement_month: "2026-08", credit_cap_ratio: 0.25 }
              as: BillingAdmin
              captures: { agr1_id: $.data.id }
          trigger:
            - call: "POST /demurrage/average-agreements"
              payload: { customer_id: "${cust_id}", agreement_month: "2026-08", credit_cap_ratio: 0.4 }
              as: BillingAdmin
              captures: { error_id: $.data.error_id, message: $.data.message }
          assert:
            - "409 with error_id ERR_DUPLICATE_AGREEMENT_MONTH"
            - "no second AverageAgreement row was created and the first one still has credit_cap_ratio 0.25 and status OPEN"
            - "the same payload with agreement_month 2026-09 would be accepted"

      - name: release_a_car_for_a_customer_on_credit_hold
        claim_type: violation_to_error
        grounds:
          - validations.priority_70_credit_hold
          - errors.ERR_CUSTOMER_CREDIT_HOLD
        distinguishing_aspect: |
          The fiscal band is the LAST gate on release, so the facility is OPEN,
          the notice was delivered and the instant is chronological; the only
          thing wrong is the customer's billing_posture. The 402 status code is
          unique to this rule.
        test_recipe:
          setup:
            - "a cycle ACTUALLY_PLACED with a delivered EDI notice at an OPEN facility"
            - "the customer put on credit hold after the placement"
          setup_api_calls:
            - call: "POST /demurrage/_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-01T00:00:00Z" }
