            - call: "POST /price-integrity/stores/${store_b}/aisles"
              payload: { aisle_code: "B01", category_code: "DAIRY" }
              as: PricingAdmin
              captures: { aisle_b1: $.data.id }
            - call: "POST /price-integrity/stores/${store_a}/associates"
              payload: { employee_number: "E-LA1", full_name: "Lee Label", role_code: "LABEL_ASSOCIATE" }
              as: PricingAdmin
              captures: { la1: $.data.id }
            - call: "POST /price-integrity/associates/${la1}/training-completions"
              payload: { module_code: "LABEL_101", score_pct: 95 }
              as: PricingAdmin
            - call: "POST /price-integrity/stores/${store_b}/associates"
              payload: { employee_number: "E-LA2", full_name: "Lou Label", role_code: "LABEL_ASSOCIATE" }
              as: PricingAdmin
              captures: { la2: $.data.id }
            - call: "POST /price-integrity/associates/${la2}/training-completions"
              payload: { module_code: "LABEL_101", score_pct: 95 }
              as: PricingAdmin
            - call: "POST /price-integrity/stores/${store_a}/associates"
              payload: { employee_number: "E-SM1", full_name: "Sam Manager", role_code: "STORE_MANAGER" }
              as: PricingAdmin
              captures: { sm1: $.data.id }
            - call: "POST /price-integrity/associates/${sm1}/training-completions"
              payload: { module_code: "LABEL_101", score_pct: 95 }
              as: PricingAdmin
            - call: "POST /price-integrity/price-change-files"
              payload: { file_number: "PCF-1001", jurisdiction_id: "${jur_a}", effective_date: "2026-08-03T00:00:00Z", scope_store_ids: ["${store_a}"], priority: "ROUTINE" }
              as: PricingAdmin
              captures: { file_a: $.data.id }
