          The waiver rung is conditional on the member state's own rule, so the first Nevada analysis is refused for a missing waiver_reference while a Texas member on the identical contract needs none; once a waiver-bearing analysis supersedes it, the RECIPROCITY_LIBERAL variant charges 15.00 for the unlisted lead state plus a notice shortfall capped at 10.00 and lands on exactly 75.00, which is CONDITIONAL rather than DENIED.
