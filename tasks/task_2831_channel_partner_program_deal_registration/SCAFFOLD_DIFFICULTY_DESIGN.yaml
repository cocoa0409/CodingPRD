  # =========================================================================
  # Rule 4 - transitive cascades from different triggering transitions
  # =========================================================================
  - rule_id: transitive_cascade
    instances:
      - name: cascade_a_registration_approval_to_partner_probation_depth_four
        grounds:
          - state_machines.DealRegistration.UNDER_REVIEW_to_APPROVED
          - state_machines.Account.OPEN_CHANNEL_to_CHANNEL_PROTECTED
          - state_machines.DealRegistration.SUBMITTED_to_CONFLICT_HELD
          - calculations.conflict_recommendation
          - calculations.portal_entitlement
          - entities.Partner.fields.open_conflict_count
          - entities.Partner.fields.tier_status
        distinguishing_aspect: |
          CASCADE A is triggered by DealRegistration UNDER_REVIEW -> APPROVED and each hop is
          caused by the previous one: approval writes Account.coverage_state (hop 1), the account
          becoming CHANNEL_PROTECTED holds the rival registration (hop 2), the held registration
          raises a ConflictCase (hop 3), and the new OPEN case pushes the rival partner's
          open_conflict_count to CONFLICT_PROBATION_THRESHOLD 2, downgrading its tier_status to
          PROBATION and its portal entitlement (hop 4).
        test_recipe:
          setup:
            - "Logical clock at 2026-04-01T00:00:00.000Z."
            - "Two RESELLER partners, each with one TECH_ASSOCIATE certification (2 credits) and marketing_commitment_cents = 0, both REGISTERED / COMPLIANT."
            - "Two OPEN_CHANNEL accounts."
            - "The rival partner has one SUBMITTED registration on EACH account for ANALYTICS_ADDON."
            - "On the first account the other partner's registration is already APPROVED, so the rival already holds exactly one OPEN ConflictCase (open_conflict_count == 1, still COMPLIANT because 1 < CONFLICT_PROBATION_THRESHOLD)."
            - "On the second account the other partner's registration is UNDER_REVIEW, awaiting the decision that is the trigger."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-04-01T00:00:00.000Z" }
              as: ChannelOpsAnalyst
