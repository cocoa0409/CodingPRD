# =============================================================================
# SCAFFOLD_CORNER_DESIGN — Task 1606 Boarding School Residential Life
# §1.9 Coverage Index: every testable claim of §1.1-§1.7 not already pinned by
# SCAFFOLD_DIFFICULTY_DESIGN.yaml. Sections follow the claim-extraction guide.
# Default logical clock is 2026-08-01T00:00:00Z unless a set_current_utc call says otherwise.
# =============================================================================
scaffold_corner_design:
  - section: entities
    instances:
      - name: student_create_missing_required_field_returns_400
        claim_type: required_fields
        grounds: ["entities.Student.fields.grade", "errors[ERR_MISSING_REQUIRED_FIELD]"]
        distinguishing_aspect: "POST /reslife/students without the required `grade` input is rejected with ERR_MISSING_REQUIRED_FIELD (400) before any other check."
        test_recipe:
          setup: ["a Parent exists to reference"]
          setup_api_calls:
            - { call: "POST /reslife/parents", payload: { full_name: "Pat A", email: "pa@x.com" }, as: SchoolAdmin, captures: { par: "$.data.id" } }
          trigger:
            - { call: "POST /reslife/students", payload: { legal_name: "No Grade", gender: "MALE", is_international: false, parent_id: "${par}", sleep_schedule: 3, cleanliness: 3, noise_tolerance: 3, guests_comfort: 3 }, as: SchoolAdmin, captures: { err: "$.data.error_id" } }
          assert:
            - "captured err == ERR_MISSING_REQUIRED_FIELD"
      - name: student_create_invalid_enum_returns_422
        claim_type: type_constraints
        grounds: ["entities.Student.fields.gender", "errors[ERR_INVALID_FIELD_VALUE]"]
        distinguishing_aspect: "gender is an enum {MALE, FEMALE}; the value NONBINARY_X is outside the domain and returns ERR_INVALID_FIELD_VALUE (422)."
        test_recipe:
          setup: ["a Parent exists to reference"]
          setup_api_calls:
            - { call: "POST /reslife/parents", payload: { full_name: "Pat B", email: "pb@x.com" }, as: SchoolAdmin, captures: { par: "$.data.id" } }
          trigger:
            - { call: "POST /reslife/students", payload: { legal_name: "Bad Enum", grade: 10, gender: "NONBINARY_X", is_international: false, parent_id: "${par}", sleep_schedule: 3, cleanliness: 3, noise_tolerance: 3, guests_comfort: 3 }, as: SchoolAdmin, captures: { err: "$.data.error_id" } }
          assert:
            - "captured err == ERR_INVALID_FIELD_VALUE"
      - name: student_get_nonexistent_returns_not_found
        claim_type: not_found
        grounds: ["errors[ERR_NOT_FOUND]"]
        distinguishing_aspect: "GET with a well-formed but unknown UUID returns ERR_NOT_FOUND (404), not an empty object."
        test_recipe:
          setup: ["empty database"]
          setup_api_calls: []
          trigger:
            - { call: "GET /reslife/students/11111111-2222-3333-4444-555555555555", payload: {}, as: SchoolAdmin, captures: { err: "$.data.error_id" } }
          assert:
            - "captured err == ERR_NOT_FOUND"
      - name: medication_order_default_refill_threshold_applied
        claim_type: defaults
        grounds: ["entities.MedicationOrder.fields.refill_threshold"]
        distinguishing_aspect: "Omitting refill_threshold applies the declared default 5 on the created MedicationOrder."
        test_recipe:
          setup: ["ENROLLED student and a Nurse"]
          setup_api_calls:
            - { call: "POST /reslife/parents", payload: { full_name: "Pat C", email: "pc@x.com" }, as: SchoolAdmin, captures: { par: "$.data.id" } }
            - { call: "POST /reslife/students", payload: { legal_name: "Stu C", grade: 9, gender: "FEMALE", is_international: false, parent_id: "${par}", sleep_schedule: 3, cleanliness: 3, noise_tolerance: 3, guests_comfort: 3 }, as: SchoolAdmin, captures: { stu: "$.data.id" } }
            - { call: "POST /reslife/staff", payload: { full_name: "Nurse One", staff_role: "NURSE" }, as: SchoolAdmin, captures: { nurse: "$.data.id" } }
          trigger:
            - { call: "POST /reslife/medication-orders", payload: { student_id: "${stu}", medication_name: "Ibuprofen", dose_mg: 200, slot: "NOON", doses_total: 30, is_controlled: false, prescriber_name: "Dr C" }, as: Nurse, as_user_id: "${nurse}", captures: { thr: "$.data.refill_threshold", rem: "$.data.doses_remaining", low: "$.data.low_stock" } }
          assert:
            - "captured thr == 5 (default applied)"
            - "captured rem == 30 (doses_remaining initialized to doses_total)"
            - "captured low == false (30 > 5)"
      - name: students_list_pagination_and_filter
        claim_type: listing
        grounds: ["response_envelope.pagination_fields", "response_envelope.pagination_defaults"]
        distinguishing_aspect: "List endpoint honors filter + limit/offset: two grade-10 students exist, GET /students?grade=10&limit=1&offset=0 returns 1 row with total_count 2 and has_more true; offset=1 returns the second row with has_more false."
        test_recipe:
          setup: ["three students: two grade 10, one grade 11"]
          setup_api_calls:
            - { call: "POST /reslife/parents", payload: { full_name: "Pat D", email: "pd@x.com" }, as: SchoolAdmin, captures: { par1: "$.data.id" } }
            - { call: "POST /reslife/parents", payload: { full_name: "Pat E", email: "pe@x.com" }, as: SchoolAdmin, captures: { par2: "$.data.id" } }
            - { call: "POST /reslife/parents", payload: { full_name: "Pat F", email: "pf@x.com" }, as: SchoolAdmin, captures: { par3: "$.data.id" } }
            - { call: "POST /reslife/students", payload: { legal_name: "G10 A", grade: 10, gender: "MALE", is_international: false, parent_id: "${par1}", sleep_schedule: 3, cleanliness: 3, noise_tolerance: 3, guests_comfort: 3 }, as: SchoolAdmin }
            - { call: "POST /reslife/students", payload: { legal_name: "G10 B", grade: 10, gender: "FEMALE", is_international: false, parent_id: "${par2}", sleep_schedule: 3, cleanliness: 3, noise_tolerance: 3, guests_comfort: 3 }, as: SchoolAdmin }
            - { call: "POST /reslife/students", payload: { legal_name: "G11 C", grade: 11, gender: "MALE", is_international: false, parent_id: "${par3}", sleep_schedule: 3, cleanliness: 3, noise_tolerance: 3, guests_comfort: 3 }, as: SchoolAdmin }
          trigger:
            - { call: "GET /reslife/students?grade=10&limit=1&offset=0", payload: {}, as: SchoolAdmin, captures: { first_name0: "$.data[0].legal_name" } }
            - { call: "GET /reslife/students?grade=10&limit=1&offset=1", payload: {}, as: SchoolAdmin, captures: { first_name1: "$.data[0].legal_name" } }
          assert:
            - "first page: exactly 1 data row, total_count == 2, has_more == true"
            - "second page: exactly 1 data row, total_count == 2, has_more == false"
            - "captured first_name0 != captured first_name1 (the two grade-10 students, distinct rows)"
      - name: questionnaire_patch_recomputes_compatibility
        claim_type: computed_fields
        grounds: ["calculations.roommate_compatibility_score", "entities.DormAssignment.fields.compatibility_score"]
        distinguishing_aspect: "PATCH of a questionnaire field on one student recomputes the linked pair's compatibility_score: changing sleep_schedule 5->2 (delta vs partner 0) raises the score from 32 to 68 on BOTH assignments."
        test_recipe:
          setup: ["term ACTIVE; students A(5,4,5,3) and B(2,4,1,3) confirmed as linked roommates in a 2-bed room; compatibility_score 32"]
          setup_api_calls:
            - { call: "POST /reslife/dorms", payload: { name: "Lowell House", gender_policy: "ANY", curfew_weekday: "22:30", curfew_weekend: "23:30" }, as: SchoolAdmin, captures: { dorm_id: "$.data.id" } }
            - { call: "POST /reslife/rooms", payload: { dorm_id: "${dorm_id}", room_number: "L-201", beds: 2 }, as: SchoolAdmin, captures: { room_id: "$.data.id" } }
            - { call: "POST /reslife/terms", payload: { name: "FALL_2026", starts_on: "2026-08-24", ends_on: "2026-12-18" }, as: SchoolAdmin, captures: { term_id: "$.data.id" } }
            - { call: "POST /reslife/terms/${term_id}/activate", payload: {}, as: SchoolAdmin }
            - { call: "POST /reslife/parents", payload: { full_name: "Pat G", email: "pg@x.com" }, as: SchoolAdmin, captures: { par_a: "$.data.id" } }
            - { call: "POST /reslife/parents", payload: { full_name: "Pat H", email: "ph@x.com" }, as: SchoolAdmin, captures: { par_b: "$.data.id" } }
            - { call: "POST /reslife/students", payload: { legal_name: "Stu G", grade: 11, gender: "MALE", is_international: false, parent_id: "${par_a}", sleep_schedule: 5, cleanliness: 4, noise_tolerance: 5, guests_comfort: 3 }, as: SchoolAdmin, captures: { stu_a: "$.data.id", stu_a_v: "$.data.version" } }
            - { call: "POST /reslife/students", payload: { legal_name: "Stu H", grade: 11, gender: "MALE", is_international: false, parent_id: "${par_b}", sleep_schedule: 2, cleanliness: 4, noise_tolerance: 1, guests_comfort: 3 }, as: SchoolAdmin, captures: { stu_b: "$.data.id", stu_b_v: "$.data.version" } }
            - { call: "POST /reslife/dorm-assignments", payload: { student_id: "${stu_a}", room_id: "${room_id}", term_id: "${term_id}", expected_student_version: "${stu_a_v}" }, as: SchoolAdmin, captures: { asg_a: "$.data.id" } }
            - { call: "POST /reslife/dorm-assignments", payload: { student_id: "${stu_b}", room_id: "${room_id}", term_id: "${term_id}", expected_student_version: "${stu_b_v}" }, as: SchoolAdmin, captures: { asg_b: "$.data.id" } }
            - { call: "POST /reslife/dorm-assignments/${asg_a}/link-roommate", payload: { roommate_assignment_id: "${asg_b}" }, as: SchoolAdmin }
          trigger:
            - { call: "PATCH /reslife/students/${stu_a}", payload: { sleep_schedule: 2 }, as: SchoolAdmin }
            - { call: "GET /reslife/dorm-assignments/${asg_a}", payload: {}, as: SchoolAdmin, captures: { comp_a: "$.data.compatibility_score" } }
            - { call: "GET /reslife/dorm-assignments/${asg_b}", payload: {}, as: SchoolAdmin, captures: { comp_b: "$.data.compatibility_score" } }
          assert:
            - "captured comp_a == 68 (100 - 12*0 - 8*0 - 8*4 - 4*0)"
            - "captured comp_b == 68 (mutual recompute)"
      - name: guardian_wards_counter_tracks_student_creation
        claim_type: computed_fields
        grounds: ["entities.Guardian.fields.wards_assigned"]
        distinguishing_aspect: "Derived cross-entity counter: after one international ENROLLED student references the guardian, wards_assigned == 1 on the Guardian read."
        test_recipe:
          setup: ["APPROVED guardian with max_wards 3; one international student created against them"]
          setup_api_calls:
            - { call: "POST /reslife/guardians", payload: { full_name: "Gua Three", email: "g3@x.com", city: "Salem", max_wards: 3 }, as: SchoolAdmin, captures: { grd: "$.data.id" } }
            - { call: "POST /reslife/guardians/${grd}/approve", payload: {}, as: SchoolAdmin }
            - { call: "POST /reslife/parents", payload: { full_name: "Pat I", email: "pi@x.com" }, as: SchoolAdmin, captures: { par: "$.data.id" } }
            - { call: "POST /reslife/students", payload: { legal_name: "Stu I", grade: 9, gender: "FEMALE", is_international: true, parent_id: "${par}", guardian_id: "${grd}", sleep_schedule: 3, cleanliness: 3, noise_tolerance: 3, guests_comfort: 3 }, as: SchoolAdmin }
          trigger:
            - { call: "GET /reslife/guardians/${grd}", payload: {}, as: SchoolAdmin, captures: { wards: "$.data.wards_assigned" } }
          assert:
            - "captured wards == 1"

  - section: state_machines
    instances:
      - name: leave_cancel_from_returned_returns_invalid_state
        claim_type: terminal_state_lockdown
        grounds: ["state_machines.LeaveRequest", "errors[ERR_INVALID_STATE]"]
        distinguishing_aspect: "RETURNED is terminal: a cancel attempt on a fully completed leave returns ERR_INVALID_STATE and mutates nothing."
        test_recipe:
          setup:
            - "CONFIRMED student; WEEKEND_OVERNIGHT leave APPROVED; signed out at 2026-09-04T18:00Z (within window); returned at 2026-09-06T18:00Z (before returns_at, late_return_minutes 0)"
          setup_api_calls:
            - { call: "POST /reslife/dorms", payload: { name: "Winslow House", gender_policy: "ANY", curfew_weekday: "22:30", curfew_weekend: "23:30" }, as: SchoolAdmin, captures: { dorm_id: "$.data.id" } }
            - { call: "POST /reslife/rooms", payload: { dorm_id: "${dorm_id}", room_number: "W-101", beds: 2 }, as: SchoolAdmin, captures: { room_id: "$.data.id" } }
            - { call: "POST /reslife/terms", payload: { name: "FALL_2026", starts_on: "2026-08-24", ends_on: "2026-12-18" }, as: SchoolAdmin, captures: { term_id: "$.data.id" } }
            - { call: "POST /reslife/terms/${term_id}/activate", payload: {}, as: SchoolAdmin }
            - { call: "POST /reslife/parents", payload: { full_name: "Pat J", email: "pj@x.com" }, as: SchoolAdmin, captures: { par: "$.data.id" } }
            - { call: "POST /reslife/students", payload: { legal_name: "Stu J", grade: 12, gender: "MALE", is_international: false, parent_id: "${par}", sleep_schedule: 3, cleanliness: 3, noise_tolerance: 3, guests_comfort: 3 }, as: SchoolAdmin, captures: { stu: "$.data.id", stu_v: "$.data.version" } }
            - { call: "POST /reslife/staff", payload: { full_name: "DP One", staff_role: "DORM_PARENT", dorm_id: "${dorm_id}" }, as: SchoolAdmin, captures: { dp: "$.data.id" } }
            - { call: "POST /reslife/staff", payload: { full_name: "FD One", staff_role: "FRONT_DESK" }, as: SchoolAdmin, captures: { fd: "$.data.id" } }
            - { call: "POST /reslife/dorm-assignments", payload: { student_id: "${stu}", room_id: "${room_id}", term_id: "${term_id}", expected_student_version: "${stu_v}" }, as: SchoolAdmin, captures: { asg: "$.data.id" } }
            - { call: "POST /reslife/dorm-assignments/${asg}/confirm", payload: {}, as: SchoolAdmin }
            - { call: "POST /reslife/leave-requests", payload: { leave_type: "WEEKEND_OVERNIGHT", destination: "Boston", departs_at: "2026-09-04T17:00:00Z", returns_at: "2026-09-06T19:00:00Z" }, as: Student, as_user_id: "${stu}", captures: { leave: "$.data.id" } }
            - { call: "POST /reslife/leave-requests/${leave}/parent-decision", payload: { decision: "APPROVE" }, as: Parent, as_user_id: "${par}" }
            - { call: "POST /reslife/leave-requests/${leave}/dorm-decision", payload: { decision: "APPROVE" }, as: DormParent, as_user_id: "${dp}" }
            - { call: "POST /reslife/_clock/set_current_utc", payload: { to_iso8601: "2026-09-04T18:00:00Z" }, as: SchoolAdmin }
            - { call: "POST /reslife/leave-requests/${leave}/sign-out", payload: {}, as: FrontDesk, as_user_id: "${fd}" }
            - { call: "POST /reslife/_clock/set_current_utc", payload: { to_iso8601: "2026-09-06T18:00:00Z" }, as: SchoolAdmin }
            - { call: "POST /reslife/leave-requests/${leave}/return", payload: {}, as: FrontDesk, as_user_id: "${fd}", captures: { ret_status: "$.data.status", ret_late: "$.data.late_return_minutes" } }
          trigger:
            - { call: "POST /reslife/leave-requests/${leave}/cancel", payload: {}, as: Student, as_user_id: "${stu}", captures: { err: "$.data.error_id" } }
          assert:
            - "captured ret_status == RETURNED and ret_late == 0"
            - "captured err == ERR_INVALID_STATE"
      - name: guardian_approve_twice_returns_invalid_state
        claim_type: idempotency
        grounds: ["state_machines.Guardian", "errors[ERR_INVALID_STATE]"]
        distinguishing_aspect: "Approving an already-APPROVED guardian is rejected with ERR_INVALID_STATE (no silent no-op)."
        test_recipe:
          setup: ["guardian created and approved once"]
          setup_api_calls:
            - { call: "POST /reslife/guardians", payload: { full_name: "Gua Four", email: "g4@x.com", city: "Portland", max_wards: 2 }, as: SchoolAdmin, captures: { grd: "$.data.id" } }
            - { call: "POST /reslife/guardians/${grd}/approve", payload: {}, as: SchoolAdmin }
          trigger:
            - { call: "POST /reslife/guardians/${grd}/approve", payload: {}, as: SchoolAdmin, captures: { err: "$.data.error_id" } }
          assert:
            - "captured err == ERR_INVALID_STATE"
      - name: duty_swap_decline_keeps_owner
        claim_type: valid_transition
        grounds: ["state_machines.DutyShift.SWAP_PENDING_to_SCHEDULED"]
        distinguishing_aspect: "Declined swap cycles SWAP_PENDING->SCHEDULED with staff_id UNCHANGED and swap_requested_to_id cleared."
        test_recipe:
          setup: ["two dorm parents dp1/dp2 in the dorm; SCHEDULED shift owned by dp1; swap requested to dp2"]
          setup_api_calls:
            - { call: "POST /reslife/dorms", payload: { name: "Winslow House", gender_policy: "ANY", curfew_weekday: "22:30", curfew_weekend: "23:30" }, as: SchoolAdmin, captures: { dorm_id: "$.data.id", dorm_v: "$.data.version" } }
            - { call: "POST /reslife/staff", payload: { full_name: "DP One", staff_role: "DORM_PARENT", dorm_id: "${dorm_id}" }, as: SchoolAdmin, captures: { dp1: "$.data.id" } }
            - { call: "POST /reslife/staff", payload: { full_name: "DP Two", staff_role: "DORM_PARENT", dorm_id: "${dorm_id}" }, as: SchoolAdmin, captures: { dp2: "$.data.id" } }
            - { call: "POST /reslife/duty-shifts", payload: { dorm_id: "${dorm_id}", staff_id: "${dp1}", duty_date: "2026-09-07", shift_slot: "WEEKDAY_NIGHT", expected_dorm_version: "${dorm_v}" }, as: SchoolAdmin, captures: { shift: "$.data.id" } }
            - { call: "POST /reslife/duty-shifts/${shift}/request-swap", payload: { target_staff_id: "${dp2}" }, as: DormParent, as_user_id: "${dp1}" }
          trigger:
            - { call: "POST /reslife/duty-shifts/${shift}/swap-respond", payload: { accept: false }, as: DormParent, as_user_id: "${dp2}", captures: { st: "$.data.status", owner: "$.data.staff_id", tgt: "$.data.swap_requested_to_id" } }
          assert:
            - "captured st == SCHEDULED"
            - "captured owner == ${dp1} (unchanged)"
            - "captured tgt == null"
      - name: duty_swap_accept_moves_ownership
        claim_type: valid_transition
        grounds: ["state_machines.DutyShift.SWAP_PENDING_to_SCHEDULED"]
        distinguishing_aspect: "Accepted swap cycles SWAP_PENDING->SCHEDULED and transfers staff_id to the target — the loop terminates back in SCHEDULED with a new owner who can then complete the shift."
        test_recipe:
          setup: ["same as decline instance but the target accepts"]
          setup_api_calls:
            - { call: "POST /reslife/dorms", payload: { name: "Winslow House", gender_policy: "ANY", curfew_weekday: "22:30", curfew_weekend: "23:30" }, as: SchoolAdmin, captures: { dorm_id: "$.data.id", dorm_v: "$.data.version" } }
            - { call: "POST /reslife/staff", payload: { full_name: "DP One", staff_role: "DORM_PARENT", dorm_id: "${dorm_id}" }, as: SchoolAdmin, captures: { dp1: "$.data.id" } }
            - { call: "POST /reslife/staff", payload: { full_name: "DP Two", staff_role: "DORM_PARENT", dorm_id: "${dorm_id}" }, as: SchoolAdmin, captures: { dp2: "$.data.id" } }
            - { call: "POST /reslife/duty-shifts", payload: { dorm_id: "${dorm_id}", staff_id: "${dp1}", duty_date: "2026-09-08", shift_slot: "WEEKDAY_NIGHT", expected_dorm_version: "${dorm_v}" }, as: SchoolAdmin, captures: { shift: "$.data.id" } }
            - { call: "POST /reslife/duty-shifts/${shift}/request-swap", payload: { target_staff_id: "${dp2}" }, as: DormParent, as_user_id: "${dp1}" }
          trigger:
            - { call: "POST /reslife/duty-shifts/${shift}/swap-respond", payload: { accept: true }, as: DormParent, as_user_id: "${dp2}", captures: { st: "$.data.status", owner: "$.data.staff_id" } }
          assert:
            - "captured st == SCHEDULED"
            - "captured owner == ${dp2} (ownership moved)"
      - name: medication_resume_from_active_returns_invalid_state
        claim_type: invalid_transition
        grounds: ["state_machines.MedicationOrder", "errors[ERR_INVALID_STATE]"]
        distinguishing_aspect: "resume is only declared from HOLD; calling it on an ACTIVE order returns ERR_INVALID_STATE."
        test_recipe:
          setup: ["ENROLLED student; ACTIVE order"]
          setup_api_calls:
            - { call: "POST /reslife/parents", payload: { full_name: "Pat K", email: "pk@x.com" }, as: SchoolAdmin, captures: { par: "$.data.id" } }
            - { call: "POST /reslife/students", payload: { legal_name: "Stu K", grade: 10, gender: "MALE", is_international: false, parent_id: "${par}", sleep_schedule: 3, cleanliness: 3, noise_tolerance: 3, guests_comfort: 3 }, as: SchoolAdmin, captures: { stu: "$.data.id" } }
            - { call: "POST /reslife/staff", payload: { full_name: "Nurse One", staff_role: "NURSE" }, as: SchoolAdmin, captures: { nurse: "$.data.id" } }
            - { call: "POST /reslife/medication-orders", payload: { student_id: "${stu}", medication_name: "Cetirizine", dose_mg: 10, slot: "MORNING", doses_total: 30, is_controlled: false, prescriber_name: "Dr C" }, as: Nurse, as_user_id: "${nurse}", captures: { order: "$.data.id" } }
          trigger:
            - { call: "POST /reslife/medication-orders/${order}/resume", payload: {}, as: Nurse, as_user_id: "${nurse}", captures: { err: "$.data.error_id" } }
          assert:
            - "captured err == ERR_INVALID_STATE"
      - name: break_housing_checkin_before_break_active_returns_error
        claim_type: precondition_enforcement
        grounds: ["state_machines.BreakHousingRequest.APPROVED_to_CHECKED_IN", "errors[ERR_BREAK_NOT_ACTIVE]"]
        distinguishing_aspect: "Guarded transition: check-in of an APPROVED break-housing request while the BreakPeriod is still UPCOMING fails with ERR_BREAK_NOT_ACTIVE."
        test_recipe:
          setup: ["international student; THANKSGIVING break UPCOMING; break-housing request APPROVED"]
          setup_api_calls:
            - { call: "POST /reslife/guardians", payload: { full_name: "Gua Five", email: "g5@x.com", city: "Boston", max_wards: 5 }, as: SchoolAdmin, captures: { grd: "$.data.id" } }
            - { call: "POST /reslife/guardians/${grd}/approve", payload: {}, as: SchoolAdmin }
            - { call: "POST /reslife/parents", payload: { full_name: "Pat L", email: "pl@x.com" }, as: SchoolAdmin, captures: { par: "$.data.id" } }
            - { call: "POST /reslife/students", payload: { legal_name: "Stu L", grade: 11, gender: "FEMALE", is_international: true, parent_id: "${par}", guardian_id: "${grd}", sleep_schedule: 3, cleanliness: 3, noise_tolerance: 3, guests_comfort: 3 }, as: SchoolAdmin, captures: { stu: "$.data.id" } }
            - { call: "POST /reslife/staff", payload: { full_name: "Dean One", staff_role: "DEAN" }, as: SchoolAdmin, captures: { dean1: "$.data.id" } }
            - { call: "POST /reslife/staff", payload: { full_name: "DP One", staff_role: "DORM_PARENT" }, as: SchoolAdmin, captures: { dp: "$.data.id" } }
            - { call: "POST /reslife/break-periods", payload: { name: "THANKSGIVING_2026", kind: "THANKSGIVING", starts_on: "2026-11-24", ends_on: "2026-11-29", housing_available: true }, as: SchoolAdmin, captures: { brk: "$.data.id" } }
            - { call: "POST /reslife/break-housing-requests", payload: { break_period_id: "${brk}", reason: "Visa travel delay" }, as: Student, as_user_id: "${stu}", captures: { bhr: "$.data.id" } }
            - { call: "POST /reslife/break-housing-requests/${bhr}/decide", payload: { decision: "APPROVE" }, as: Dean, as_user_id: "${dean1}" }
          trigger:
            - { call: "POST /reslife/break-housing-requests/${bhr}/check-in", payload: {}, as: DormParent, as_user_id: "${dp}", captures: { err: "$.data.error_id" } }
          assert:
            - "captured err == ERR_BREAK_NOT_ACTIVE (break still UPCOMING at default clock 2026-08-01)"
      - name: room_block_occupied_returns_room_occupied
        claim_type: precondition_enforcement
