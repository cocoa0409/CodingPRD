# =============================================================================
# PRD Benchmark Scaffold — Specialty Glass Co-Development & Capacity Commitment
# =============================================================================

scenario: |
  Specialty Glass Co-Development & Capacity Commitment (Corning): customer co-development programs where glass composition and strengthening are tuned to a device design under confidentiality, capacity investment decisions requiring customer volume commitments or prepayments before building a melting tank, melting tank campaigns that run continuously for years making changeover decisions costly and irreversible, product qualification cycles with customer reliability testing and design freeze timing, yield improvement curves on new compositions affecting cost and supply, brand licensing to device makers with usage rights and marketing coordination, secondary applications for the same platform across automotive, pharmaceutical packaging and architectural markets, intellectual property protection and reverse engineering monitoring

domain_name: specialty-glass-codesign
api_prefix: /glass

complexity_profile:
  primary_archetype: quota_allocation
  secondary_archetype: temporal_windowing
  complexity_layers:
    - optimistic_concurrency
    - cascading_side_effects
    - dual_variant_calculation
    - ops_run_checkpoint
  entity_topology: flat
  state_machine_shape: cyclic
  relationship_patterns:
    - many_to_many
    - cross_aggregate
  role_model: segregation_of_duties
  consistency_model: immediate

# =============================================================================
# Canonical constants — every CONST.* referenced anywhere in this scaffold is
# defined exactly once here, with an explicit value.
# =============================================================================
constants:
  CONST.DEFAULT_CLOCK_ISO: "2026-09-01T00:00:00Z"
  CONST.TANK_CONSTRUCTION_DAYS: 540
  CONST.MIN_CAMPAIGN_DAYS: 365
  CONST.MAX_CAMPAIGN_DAYS: 1825
  CONST.CHANGEOVER_GAP_DAYS: 45
  CONST.MAX_QUAL_ATTEMPTS: 3
  CONST.LICENSE_MIN_TERM_DAYS: 180
  CONST.YIELD_STEP1_MAX_UNITS: 20000
  CONST.YIELD_STEP1_RATE: 0.62
  CONST.YIELD_STEP2_MAX_UNITS: 80000
  CONST.YIELD_STEP2_RATE: 0.78
  CONST.YIELD_STEP3_RATE: 0.90
  CONST.BASE_MELT_COST_CENTS_PER_UNIT: 850
  CONST.ENERGY_SURCHARGE_T1_MAX_UNITS: 50000
  CONST.ENERGY_SURCHARGE_T1_CENTS: 120
  CONST.ENERGY_SURCHARGE_T2_CENTS: 60
  CONST.CHANGEOVER_AMORTIZATION_CENTS_PER_DAY: 4000
  CONST.PREPAYMENT_UNIT_CREDIT_CENTS: 1000
  CONST.MIN_PREPAYMENT_CENTS: 1000000
  CONST.TIER_A_COVERAGE_MIN: 1.2
  CONST.TIER_B_COVERAGE_MIN: 1.0
  CONST.TIER_A_BONUS_RATE: 0.05
  CONST.TIER_B_BONUS_RATE: 0.02
  CONST.SUPPLY_COVERAGE_MIN: 1.0
  CONST.BREACH_GRACE_DAYS: 90
  CONST.ROYALTY_T1_MAX_UNITS: 100000
  CONST.ROYALTY_T1_RATE: 0.03
  CONST.ROYALTY_T2_MAX_UNITS: 500000
  CONST.ROYALTY_T2_RATE: 0.022
  CONST.ROYALTY_T3_RATE: 0.015

# =============================================================================
# Table 1.0: Response Envelope (FIXED)
# =============================================================================
response_envelope:
  success: |
    { "meta": { "api_request_id": "req_xxx", "api_request_timestamp": "ISO8601" },
      "response_type": "object" | "array", "data": {} }
  error: |
    { "meta": { ... }, "response_type": "error",
      "data": { "error_id": "ERR_XXX", "message": "..." } }
  pagination_fields: ["limit", "offset", "total_count", "has_more"]
  pagination_defaults: { limit: 10, min: 1, max: 100, offset: 0 }

# =============================================================================
# Table 1.1: Entity-Relationship Table (flat topology, FK references)
# =============================================================================
entities:
  - name: DeviceMaker
    parent: null
    common_fields: true
    fields:
      - { name: name, type: string, source: input, description: "Device maker legal name" }
      - { name: region, type: string, source: input, description: "Headquarters region code" }
      - { name: standing_tier, type: enum, source: input, default: STANDARD, constraints: "STANDARD | STRATEGIC | PROBATION", description: "Commercial standing; demoted one step by breach-watch cascade, never auto-restored" }
      - { name: ip_review_status, type: enum, source: system, default: CLEAR, constraints: "CLEAR | UNDER_REVIEW | CONFIRMED_INFRINGEMENT | CLEARED", description: "Reverse-engineering / IP monitoring posture of this maker" }

  - name: Program
    parent: null
    common_fields: true
    fields:
      - { name: device_maker_id, type: string, source: input, description: "FK -> DeviceMaker.id; the customer this co-development program serves" }
      - { name: name, type: string, source: input, description: "Program code name (confidential)" }
      - { name: primary_market, type: enum, source: input, constraints: "CONSUMER_ELECTRONICS | AUTOMOTIVE | PHARMA_PACKAGING | ARCHITECTURAL", description: "Primary device market; licenses for any other market are secondary applications" }
      - { name: confidentiality_tier, type: enum, source: input, default: STANDARD_CONFIDENTIAL, constraints: "STANDARD_CONFIDENTIAL | HIGH_CONFIDENTIAL", description: "NDA confidentiality tier" }
      - { name: status, type: enum, source: system, constraints: "DRAFT | NDA_EXECUTED | COMPOSITION_TUNING | QUALIFICATION | DESIGN_FROZEN | CLOSED | TERMINATED", description: "Program lifecycle state" }
      - { name: nda_reference, type: string, source: system, description: "NDA document reference stored on execute-nda; null until then" }
      - { name: design_freeze_date, type: datetime, source: system, description: "Design freeze deadline set by begin-qualification; cleared to null by rework" }

  - name: Composition
    parent: null
    common_fields: true
    fields:
      - { name: program_id, type: string, source: input, description: "FK -> Program.id; program this composition is tuned under" }
      - { name: composition_code, type: string, source: input, description: "Lab code; unique within program (ERR_COMPOSITION_CODE_CONFLICT on duplicate)" }
      - { name: complexity_multiplier, type: number, source: input, constraints: "1.0 <= value <= 2.5", description: "Melting difficulty multiplier used by campaign_unit_cost" }
      - { name: status, type: enum, source: system, constraints: "EXPERIMENTAL | TUNED | QUALIFIED | LOCKED | RETIRED", description: "Composition maturity; LOCKED is immutable and cannot be retired" }

  - name: QualCycle
    parent: null
    common_fields: true
    fields:
      - { name: composition_id, type: string, source: input, description: "FK -> Composition.id; composition under reliability testing" }
      - { name: test_plan_ref, type: string, source: input, description: "Customer reliability test plan reference" }
      - { name: attempt_number, type: integer, source: system, default: 1, description: "1-based attempt counter; incremented by resubmit; hard cap CONST.MAX_QUAL_ATTEMPTS" }
      - { name: status, type: enum, source: system, constraints: "SUBMITTED | IN_TESTING | PASSED | FAILED", description: "Qualification cycle state" }
      - { name: result_recorded_at, type: datetime, source: system, description: "Logical clock time when record-result fired; null until then" }

  - name: Tank
    parent: null
    common_fields: true
    fields:
      - { name: commitment_id, type: string, source: input, description: "FK -> Commitment.id; the SECURED capacity commitment that funds this melting tank" }
      - { name: capacity_units_per_day, type: integer, source: input, constraints: "> 0", description: "Melting capacity in units per day" }
      - { name: status, type: enum, source: system, constraints: "CONSTRUCTING | COMMISSIONED", description: "Tank lifecycle; tanks are never decommissioned in this model" }
      - { name: construction_ready_date, type: datetime, source: system, description: "created_at + CONST.TANK_CONSTRUCTION_DAYS; commission allowed at or after this instant" }

  - name: Campaign
    parent: null
    common_fields: true
    fields:
      - { name: tank_id, type: string, source: input, description: "FK -> Tank.id; melting tank this campaign occupies" }
      - { name: composition_id, type: string, source: input, description: "FK -> Composition.id; composition melted during this campaign" }
      - { name: start_date, type: datetime, source: input, description: "Campaign window start (half-open interval start)" }
      - { name: end_date, type: datetime, source: input, description: "Campaign window end (half-open interval end, exclusive)" }
      - { name: planned_units, type: integer, source: input, constraints: "> 0 and <= tank.capacity_units_per_day * campaign_days", description: "Planned melt units for the window" }
      - { name: status, type: enum, source: system, constraints: "SCHEDULED | RUNNING | COMPLETED | ABORTED | CANCELLED", description: "Campaign lifecycle; ABORTED is operator-triggered, CANCELLED is cascade/checkpoint-triggered" }
      - { name: expected_good_units, type: integer, source: computed, description: "floor(planned_units * provisional_yield); fixed at creation; the allocatable supply pool" }
      - { name: unallocated_units, type: integer, source: computed, description: "expected_good_units minus units of Allocations in RESERVED or FULFILLED; conservation invariant target" }
      - { name: cumulative_good_units, type: integer, source: computed, default: 0, description: "Sum of good_units over production records" }
      - { name: cumulative_scrap_units, type: integer, source: computed, default: 0, description: "Sum of scrap_units over production records" }
      - { name: realized_yield, type: number, source: computed, description: "cumulative_good/(cumulative_good+cumulative_scrap), 6dp round_half_up; null until first production record" }
      - { name: provisional_unit_cost_cents, type: integer, source: computed, description: "Unit cost at scheduling per campaign_unit_cost provisional variant" }
      - { name: final_unit_cost_cents, type: integer, source: computed, description: "Unit cost per campaign_unit_cost final variant; null until COMPLETED or ABORTED-from-RUNNING with at least one production record" }

  - name: Commitment
    parent: null
    common_fields: true
    fields:
      - { name: program_id, type: string, source: input, description: "FK -> Program.id; program whose capacity this commitment secures" }
      - { name: device_maker_id, type: string, source: system, description: "FK -> DeviceMaker.id; copied from program.device_maker_id at creation" }
      - { name: committed_units, type: integer, source: input, constraints: "> 0", description: "Volume the customer commits to take" }
      - { name: required_units, type: integer, source: input, constraints: "> 0", description: "Capacity ask used as coverage denominator" }
      - { name: prepayment_cents, type: integer, source: input, constraints: ">= CONST.MIN_PREPAYMENT_CENTS", description: "Prepayment backing the capacity investment" }
      - { name: status, type: enum, source: system, constraints: "PROPOSED | SIGNED | COUNTERSIGNED | SECURED | BREACH_WATCH | EXHAUSTED | BREACHED | RELEASED", description: "Commitment lifecycle; SECURED requires both planner countersign and finance prepayment confirmation" }
      - { name: coverage_tier, type: enum, source: computed, constraints: "TIER_A | TIER_B | TIER_C", description: "Computed by commitment_coverage at SECURED; null until then" }
      - { name: effective_units, type: integer, source: computed, description: "base_units * (1 + tier bonus), floored; null until SECURED" }
      - { name: fulfilled_units, type: integer, source: computed, default: 0, description: "Sum of units of this commitment's Allocations in FULFILLED" }
      - { name: supply_coverage, type: number, source: computed, default: 0, description: "sum(Allocations in RESERVED or FULFILLED).units / committed_units, 4dp round_half_up" }
      - { name: prepayment_applied_cents, type: integer, source: computed, default: 0, description: "Prepayment applied to invoices; ledger bucket 1" }
      - { name: prepayment_remaining_cents, type: integer, source: computed, description: "Prepayment not yet applied; ledger bucket 2; initialized to prepayment_cents" }
      - { name: prepayment_refunded_cents, type: integer, source: computed, default: 0, description: "Prepayment refunded on release; ledger bucket 3" }
      - { name: breach_deadline, type: datetime, source: system, description: "BREACH_WATCH entry time + CONST.BREACH_GRACE_DAYS; null unless BREACH_WATCH" }
      - { name: countersigned_by, type: string, source: system, description: "X-User-ID of the CapacityPlanner who countersigned; segregation-of-duties anchor" }
      - { name: signed_at, type: datetime, source: system, description: "Logical clock time of the sign transition; null until SIGNED; waterfall tie-break key" }

  - name: Allocation
    parent: null
    common_fields: true
    fields:
      - { name: commitment_id, type: string, source: input, description: "FK -> Commitment.id; commitment receiving supply" }
      - { name: campaign_id, type: string, source: input, description: "FK -> Campaign.id; campaign supplying units" }
      - { name: units, type: integer, source: input, constraints: "> 0", description: "Allocated units" }
      - { name: status, type: enum, source: system, constraints: "RESERVED | FULFILLED | RELEASED", description: "Allocation lifecycle" }

  - name: License
    parent: null
    common_fields: true
    fields:
      - { name: device_maker_id, type: string, source: input, description: "FK -> DeviceMaker.id; licensee" }
      - { name: program_id, type: string, source: input, description: "FK -> Program.id; platform program being brand-licensed" }
      - { name: market, type: enum, source: input, constraints: "CONSUMER_ELECTRONICS | AUTOMOTIVE | PHARMA_PACKAGING | ARCHITECTURAL", description: "Licensed usage market; market != program.primary_market is a secondary application" }
      - { name: effective_date, type: datetime, source: input, description: "License term start (closed interval start, inclusive)" }
      - { name: expiry_date, type: datetime, source: input, description: "License term end (closed interval end, inclusive); term must span at least CONST.LICENSE_MIN_TERM_DAYS" }
      - { name: license_status, type: enum, source: system, constraints: "NEGOTIATION | ACTIVE | SUSPENDED | TERMINATED | EXPIRED", description: "License lifecycle dimension (independent of marketing_status)" }
      - { name: marketing_status, type: enum, source: system, constraints: "DRAFT | IN_REVIEW | APPROVED | CHANGES_REQUIRED", description: "Marketing coordination dimension (independent of license_status)" }
      - { name: suspension_reason, type: enum, source: system, default: NONE, constraints: "NONE | IP_REVIEW | MANUAL", description: "Why the license was suspended" }
      - { name: cumulative_royalty_cents, type: integer, source: computed, default: 0, description: "Sum of final_royalty_cents over ACCEPTED usage reports" }

  - name: UsageReport
    parent: null
    common_fields: true
    fields:
      - { name: license_id, type: string, source: input, description: "FK -> License.id; license being reported against" }
      - { name: period_start, type: datetime, source: input, description: "Reporting period start (closed interval, inclusive)" }
      - { name: period_end, type: datetime, source: input, description: "Reporting period end (closed interval, inclusive); must be > period_start" }
      - { name: lines, type: array, source: input, description: "Non-empty array of {channel: DOMESTIC|EXPORT, units: integer > 0, net_revenue_cents: integer >= 0}" }
      - { name: status, type: enum, source: system, constraints: "SUBMITTED | ACCEPTED | DISPUTED | HELD", description: "Report lifecycle; HELD set by infringement cascade" }
      - { name: royalty_rate_applied, type: number, source: computed, description: "Tier rate selected by total units across lines" }
      - { name: provisional_royalty_cents, type: integer, source: computed, description: "Per-line round_half_up then sum, computed at submission" }
      - { name: final_royalty_cents, type: integer, source: computed, description: "Sum of line revenues then one round_half_up, computed at acceptance; null until ACCEPTED" }

# =============================================================================
# Table 1.2: State Machine Table
# =============================================================================
state_machines:
  - entity: DeviceMaker
    field: ip_review_status
    initial_state: CLEAR
    terminal_states: []
    transitions:
      - from: CLEAR
        to: UNDER_REVIEW
        trigger: "POST /glass/device-makers/{id}/ip-review with to_status=UNDER_REVIEW"
        actor: LegalCounsel
        preconditions: []
        side_effects: []
      - from: UNDER_REVIEW
        to: CONFIRMED_INFRINGEMENT
        trigger: "POST /glass/device-makers/{id}/ip-review with to_status=CONFIRMED_INFRINGEMENT"
        actor: LegalCounsel
        preconditions: []
        side_effects:
          - "CASCADE hop 1: every License with device_maker_id == this maker and license_status == ACTIVE transitions to SUSPENDED with suspension_reason = IP_REVIEW"
          - "CASCADE hop 2: for each License suspended by hop 1, every UsageReport with license_id == that license and status == SUBMITTED transitions to HELD"
      - from: UNDER_REVIEW
        to: CLEARED
        trigger: "POST /glass/device-makers/{id}/ip-review with to_status=CLEARED"
        actor: LegalCounsel
        preconditions: []
        side_effects: []
      - from: CONFIRMED_INFRINGEMENT
        to: CLEARED
        trigger: "POST /glass/device-makers/{id}/ip-review with to_status=CLEARED"
        actor: LegalCounsel
        preconditions: []
        side_effects:
          - "No automatic license reinstatement; SUSPENDED licenses stay SUSPENDED until manually reinstated"

  - entity: Program
    field: status
    initial_state: DRAFT
    terminal_states: [CLOSED, TERMINATED]
    transitions:
      - from: DRAFT
        to: NDA_EXECUTED
        trigger: "POST /glass/programs/{id}/execute-nda"
        actor: ProgramManager
        preconditions: []
        side_effects:
          - "nda_reference := payload nda_reference"
      - from: NDA_EXECUTED
        to: COMPOSITION_TUNING
        trigger: "system (first Composition created under this program)"
        actor: system
        preconditions:
          - "A Composition with program_id == this program is created"
        side_effects: []
      - from: COMPOSITION_TUNING
        to: QUALIFICATION
        trigger: "POST /glass/programs/{id}/begin-qualification"
        actor: ProgramManager
        preconditions:
          - "payload design_freeze_date is strictly after the current logical clock time (else ERR_INVALID_REQUEST)"
        side_effects:
          - "design_freeze_date := payload design_freeze_date"
      - from: QUALIFICATION
        to: COMPOSITION_TUNING
        trigger: "POST /glass/programs/{id}/rework"
        actor: ProgramManager
        preconditions: []
        side_effects:
          - "design_freeze_date := null"
      - from: QUALIFICATION
        to: DESIGN_FROZEN
        trigger: "POST /glass/programs/{id}/freeze-design"
        actor: ProgramManager
        preconditions:
          - "current logical clock time <= design_freeze_date (inclusive boundary; else ERR_DESIGN_FREEZE_PASSED)"
          - "at least one Composition with program_id == this program has status IN {QUALIFIED, LOCKED} (else ERR_NO_QUALIFIED_COMPOSITION)"
        side_effects: []
      - from: DESIGN_FROZEN
        to: CLOSED
        trigger: "POST /glass/programs/{id}/close"
        actor: ProgramManager
        preconditions:
          - "no Campaign with composition_id in this program's compositions has status IN {SCHEDULED, RUNNING}"
          - "no Commitment with program_id == this program has status IN {PROPOSED, SIGNED, COUNTERSIGNED, SECURED, BREACH_WATCH}"
        side_effects: []
      - from: [DRAFT, NDA_EXECUTED, COMPOSITION_TUNING, QUALIFICATION, DESIGN_FROZEN]
        to: TERMINATED
        trigger: "POST /glass/programs/{id}/terminate"
        actor: ProgramManager
        preconditions: []
        side_effects:
          - "CASCADE hop 1: every Commitment with program_id == this program and status IN {PROPOSED, SIGNED, COUNTERSIGNED, SECURED, BREACH_WATCH} transitions to RELEASED; for each, prepayment_refunded_cents += prepayment_remaining_cents then prepayment_remaining_cents := 0"
          - "CASCADE hop 1: every Campaign with composition_id in this program's compositions and status == SCHEDULED transitions to CANCELLED"
          - "CASCADE hop 2: every Allocation with campaign_id in the campaigns cancelled by hop 1 and status == RESERVED transitions to RELEASED"
          - "Commitments already RELEASED by hop 1 do NOT enter BREACH_WATCH; breach recompute applies only to commitments still SECURED, and none remain"

  - entity: Composition
    field: status
    initial_state: EXPERIMENTAL
    terminal_states: [RETIRED]
    transitions:
      - from: EXPERIMENTAL
        to: TUNED
        trigger: "system (first QualCycle with composition_id == this composition enters IN_TESTING)"
        actor: system
        preconditions: []
        side_effects: []
      - from: TUNED
        to: QUALIFIED
        trigger: "system (a QualCycle with composition_id == this composition records outcome PASSED)"
        actor: system
        preconditions: []
        side_effects: []
      - from: QUALIFIED
        to: LOCKED
        trigger: "POST /glass/compositions/{id}/lock"
        actor: ProgramManager
        preconditions: []
        side_effects: []
      - from: [EXPERIMENTAL, TUNED, QUALIFIED]
        to: RETIRED
        trigger: "POST /glass/compositions/{id}/retire"
        actor: ProgramManager
        preconditions:
          - "status != LOCKED (a LOCKED composition can never be retired; attempt yields ERR_INVALID_STATE)"
        side_effects:
          - "CASCADE hop 1: every Campaign with composition_id == this composition and status == SCHEDULED transitions to CANCELLED"
          - "CASCADE hop 2: every Allocation with campaign_id in the campaigns cancelled by hop 1 and status == RESERVED transitions to RELEASED, and each such campaign's unallocated_units is increased by the released units"
          - "CASCADE hop 3: for each Commitment referenced by an Allocation released in hop 2 where commitment.status == SECURED: recompute supply_coverage; if supply_coverage < CONST.SUPPLY_COVERAGE_MIN the commitment transitions SECURED -> BREACH_WATCH with breach_deadline := current clock + CONST.BREACH_GRACE_DAYS days"
          - "CASCADE hop 4: for each Commitment that entered BREACH_WATCH in hop 3, its DeviceMaker.standing_tier is demoted one step (STRATEGIC -> STANDARD, STANDARD -> PROBATION, PROBATION unchanged)"
        note: "RUNNING campaigns are untouched; molten glass cannot be un-run"

  - entity: QualCycle
    field: status
    initial_state: SUBMITTED
    terminal_states: [PASSED]
    transitions:
      - from: SUBMITTED
        to: IN_TESTING
        trigger: "POST /glass/qual-cycles/{id}/begin-testing"
        actor: DeviceMaker
        preconditions:
          - "X-User-ID == composition's program's device_maker_id (else ERR_OWNERSHIP_MISMATCH)"
        side_effects:
          - "if the referenced Composition has status == EXPERIMENTAL it transitions EXPERIMENTAL -> TUNED"
      - from: IN_TESTING
        to: PASSED
        trigger: "POST /glass/qual-cycles/{id}/record-result with outcome=PASSED"
        actor: DeviceMaker
        preconditions:
          - "X-User-ID == composition's program's device_maker_id (else ERR_OWNERSHIP_MISMATCH)"
        side_effects:
          - "result_recorded_at := current logical clock time"
          - "if the referenced Composition has status == TUNED it transitions TUNED -> QUALIFIED"
      - from: IN_TESTING
        to: FAILED
        trigger: "POST /glass/qual-cycles/{id}/record-result with outcome=FAILED"
        actor: DeviceMaker
        preconditions:
          - "X-User-ID == composition's program's device_maker_id (else ERR_OWNERSHIP_MISMATCH)"
        side_effects:
          - "result_recorded_at := current logical clock time"
      - from: FAILED
        to: SUBMITTED
        trigger: "POST /glass/qual-cycles/{id}/resubmit"
        actor: ProgramManager
        preconditions:
          - "attempt_number < CONST.MAX_QUAL_ATTEMPTS (else ERR_MAX_QUAL_ATTEMPTS)"
        side_effects:
          - "attempt_number += 1"

  - entity: Tank
    field: status
    initial_state: CONSTRUCTING
    terminal_states: []
    transitions:
      - from: CONSTRUCTING
        to: COMMISSIONED
        trigger: "POST /glass/tanks/{id}/commission"
        actor: CapacityPlanner
        preconditions:
          - "current logical clock time >= construction_ready_date (else ERR_TANK_UNDER_CONSTRUCTION)"
        side_effects: []

  - entity: Campaign
    field: status
    initial_state: SCHEDULED
    terminal_states: [COMPLETED, ABORTED, CANCELLED]
    transitions:
      - from: SCHEDULED
        to: RUNNING
        trigger: "POST /glass/campaigns/{id}/start"
        actor: CapacityPlanner
        preconditions:
          - "current logical clock time >= start_date (else ERR_CAMPAIGN_NOT_STARTED)"
          - "current logical clock time < end_date (else ERR_INVALID_STATE)"
          - "referenced Composition has status IN {QUALIFIED, LOCKED} (else ERR_COMPOSITION_NOT_QUALIFIED)"
          - "referenced Tank has status == COMMISSIONED (else ERR_TANK_UNDER_CONSTRUCTION)"
        side_effects: []
      - from: RUNNING
        to: COMPLETED
        trigger: "POST /glass/campaigns/{id}/complete, or system at ops checkpoint when current clock >= end_date"
        actor: "CapacityPlanner or system"
        preconditions:
          - "current logical clock time >= end_date (else ERR_CAMPAIGN_NOT_ENDED)"
        side_effects:
          - "realized_yield recomputed from production records; final_unit_cost_cents computed per campaign_unit_cost final variant (null if no production records)"
      - from: [SCHEDULED, RUNNING]
        to: ABORTED
        trigger: "POST /glass/campaigns/{id}/abort"
        actor: CapacityPlanner
        preconditions: []
        side_effects:
          - "if aborting from RUNNING with at least one production record: final_unit_cost_cents computed per campaign_unit_cost final variant"
          - "CASCADE hop 1: every Allocation with campaign_id == this campaign and status == RESERVED transitions to RELEASED, and this campaign's unallocated_units is increased by the released units"
          - "CASCADE hop 2: for each Commitment referenced by an Allocation released in hop 1 where commitment.status == SECURED: recompute supply_coverage; if supply_coverage < CONST.SUPPLY_COVERAGE_MIN the commitment transitions SECURED -> BREACH_WATCH with breach_deadline := current clock + CONST.BREACH_GRACE_DAYS days"
          - "CASCADE hop 3: for each Commitment that entered BREACH_WATCH in hop 2, its DeviceMaker.standing_tier is demoted one step (STRATEGIC -> STANDARD, STANDARD -> PROBATION, PROBATION unchanged)"
      - from: SCHEDULED
        to: CANCELLED
        trigger: "system (composition retired, program terminated, or ops checkpoint with current clock >= end_date while still SCHEDULED)"
        actor: system
        preconditions: []
        side_effects:
          - "every Allocation with campaign_id == this campaign and status == RESERVED transitions to RELEASED, and unallocated_units is increased by the released units"
          - "for each Commitment referenced by a released Allocation where commitment.status == SECURED: recompute supply_coverage; if < CONST.SUPPLY_COVERAGE_MIN transition to BREACH_WATCH (breach_deadline := current clock + CONST.BREACH_GRACE_DAYS days) and demote its DeviceMaker.standing_tier one step"

  - entity: Commitment
    field: status
    initial_state: PROPOSED
    terminal_states: [EXHAUSTED, BREACHED, RELEASED]
    transitions:
      - from: PROPOSED
        to: SIGNED
        trigger: "POST /glass/commitments/{id}/sign"
        actor: DeviceMaker
        preconditions:
          - "X-User-ID == device_maker_id (else ERR_OWNERSHIP_MISMATCH)"
        side_effects:
          - "signed_at := current logical clock time"
        note: "multiple active commitments per program are allowed (tranches); only PROPOSED uniqueness is enforced, via supersession at creation time"
      - from: SIGNED
        to: COUNTERSIGNED
        trigger: "POST /glass/commitments/{id}/countersign"
        actor: CapacityPlanner
        preconditions: []
        side_effects:
          - "countersigned_by := X-User-ID"
      - from: COUNTERSIGNED
        to: SECURED
        trigger: "POST /glass/commitments/{id}/confirm-prepayment"
        actor: FinanceController
        preconditions:
          - "X-User-ID != countersigned_by (segregation of duties; else ERR_SEGREGATION_OF_DUTIES)"
          - "commitment_coverage base_coverage >= CONST.TIER_B_COVERAGE_MIN (else ERR_COMMITMENT_COVERAGE_INSUFFICIENT)"
        side_effects:
          - "coverage_tier and effective_units computed per commitment_coverage and stored"
      - from: SECURED
        to: BREACH_WATCH
        trigger: "system (supply_coverage recomputed below CONST.SUPPLY_COVERAGE_MIN after an allocation-release cascade or a manual allocation release)"
        actor: system
        preconditions: []
        side_effects:
          - "breach_deadline := current logical clock time + CONST.BREACH_GRACE_DAYS days"
          - "DeviceMaker.standing_tier demoted one step (STRATEGIC -> STANDARD, STANDARD -> PROBATION, PROBATION unchanged)"
      - from: BREACH_WATCH
        to: SECURED
        trigger: "system (supply_coverage recomputed at or above CONST.SUPPLY_COVERAGE_MIN after a new allocation)"
        actor: system
        preconditions: []
        side_effects:
          - "breach_deadline := null"
      - from: [SECURED, BREACH_WATCH]
        to: EXHAUSTED
        trigger: "system (ops checkpoint: fulfilled_units >= committed_units)"
        actor: system
        preconditions: []
        side_effects: []
      - from: BREACH_WATCH
        to: BREACHED
        trigger: "system (ops checkpoint: current logical clock time > breach_deadline)"
        actor: system
        preconditions: []
        side_effects: []
      - from: [PROPOSED, SIGNED, COUNTERSIGNED, SECURED, BREACH_WATCH]
        to: RELEASED
        trigger: "POST /glass/commitments/{id}/release, or system (program terminated, or superseded by a newly created commitment on the same program)"
        actor: "ProgramManager or system"
        preconditions: []
        side_effects:
          - "prepayment_refunded_cents += prepayment_remaining_cents; prepayment_remaining_cents := 0"
          - "every Allocation with commitment_id == this commitment and status == RESERVED transitions to RELEASED, and each affected campaign's unallocated_units is increased by the released units"

  - entity: Allocation
    field: status
    initial_state: RESERVED
    terminal_states: [FULFILLED, RELEASED]
    transitions:
      - from: RESERVED
        to: FULFILLED
        trigger: "POST /glass/allocations/{id}/fulfill"
        actor: CapacityPlanner
        preconditions:
          - "referenced Campaign has status IN {RUNNING, COMPLETED} (else ERR_INVALID_STATE)"
          - "referenced Commitment has status IN {SECURED, BREACH_WATCH} (else ERR_INVALID_STATE)"
        side_effects:
          - "commitment.fulfilled_units += units; commitment.supply_coverage recomputed (if commitment was BREACH_WATCH and supply_coverage >= CONST.SUPPLY_COVERAGE_MIN it transitions BREACH_WATCH -> SECURED)"
      - from: RESERVED
        to: RELEASED
        trigger: "POST /glass/allocations/{id}/release, or system (campaign aborted/cancelled, composition retired, program terminated, commitment released)"
        actor: "CapacityPlanner or system"
        preconditions: []
        side_effects:
          - "campaign.unallocated_units += units"
          - "commitment.supply_coverage recomputed; if commitment.status == SECURED and supply_coverage < CONST.SUPPLY_COVERAGE_MIN, commitment transitions SECURED -> BREACH_WATCH (breach_deadline set, maker standing demoted one step)"

  - entity: License
    field: license_status
    initial_state: NEGOTIATION
    terminal_states: [TERMINATED, EXPIRED]
    transitions:
      - from: NEGOTIATION
        to: ACTIVE
        trigger: "POST /glass/licenses/{id}/activate"
        actor: LegalCounsel
        preconditions:
          - "referenced Program has status == DESIGN_FROZEN (else ERR_PROGRAM_NOT_FROZEN)"
          - "referenced DeviceMaker has ip_review_status != CONFIRMED_INFRINGEMENT (else ERR_IP_LITIGATION_HOLD)"
          - "if market != program.primary_market (secondary application): at least one Composition of the program has status == LOCKED (else ERR_BASE_PLATFORM_NOT_QUALIFIED)"
          - "current logical clock time >= effective_date and <= expiry_date (else ERR_LICENSE_TERM_INVALID)"
          - "no other License with same device_maker_id, same market, license_status == ACTIVE, whose closed interval [effective_date, expiry_date] intersects this license's closed interval (else ERR_LICENSE_TERM_OVERLAP)"
        side_effects: []
      - from: ACTIVE
        to: SUSPENDED
        trigger: "POST /glass/licenses/{id}/suspend (reason MANUAL), or system (maker ip_review_status -> CONFIRMED_INFRINGEMENT; reason IP_REVIEW)"
        actor: "LegalCounsel or system"
        preconditions: []
        side_effects: []
      - from: SUSPENDED
        to: ACTIVE
        trigger: "POST /glass/licenses/{id}/reinstate"
        actor: LegalCounsel
        preconditions:
          - "referenced DeviceMaker has ip_review_status IN {CLEAR, CLEARED} (else ERR_IP_LITIGATION_HOLD)"
          - "current logical clock time <= expiry_date (else ERR_LICENSE_TERM_INVALID)"
          - "closed-interval overlap rule re-evaluated against other ACTIVE licenses of same maker and market (else ERR_LICENSE_TERM_OVERLAP)"
        side_effects:
          - "suspension_reason := NONE"
      - from: [NEGOTIATION, ACTIVE, SUSPENDED]
        to: TERMINATED
        trigger: "POST /glass/licenses/{id}/terminate"
        actor: LegalCounsel
        preconditions: []
        side_effects: []
      - from: ACTIVE
        to: EXPIRED
        trigger: "system (ops checkpoint: current logical clock time > expiry_date)"
        actor: system
        preconditions: []
        side_effects: []

  - entity: License
    field: marketing_status
    initial_state: DRAFT
    terminal_states: []
    transitions:
      - from: [DRAFT, CHANGES_REQUIRED]
        to: IN_REVIEW
        trigger: "POST /glass/licenses/{id}/submit-marketing"
        actor: DeviceMaker
        preconditions:
          - "X-User-ID == license.device_maker_id (else ERR_OWNERSHIP_MISMATCH)"
          - "license.license_status IN {NEGOTIATION, ACTIVE} (else ERR_INVALID_STATE)"
        side_effects: []
      - from: IN_REVIEW
        to: APPROVED
        trigger: "POST /glass/licenses/{id}/review-marketing with decision=APPROVED"
        actor: LegalCounsel
        preconditions: []
        side_effects: []
      - from: IN_REVIEW
        to: CHANGES_REQUIRED
        trigger: "POST /glass/licenses/{id}/review-marketing with decision=CHANGES_REQUIRED"
        actor: LegalCounsel
        preconditions: []
        side_effects: []

  - entity: UsageReport
    field: status
    initial_state: SUBMITTED
    terminal_states: [ACCEPTED, DISPUTED, HELD]
    transitions:
      - from: SUBMITTED
        to: ACCEPTED
        trigger: "POST /glass/usage-reports/{id}/accept"
        actor: FinanceController
        preconditions:
          - "referenced License has license_status IN {ACTIVE, SUSPENDED} (else ERR_INVALID_STATE)"
          - "referenced License has marketing_status == APPROVED (else ERR_MARKETING_NOT_APPROVED)"
        side_effects:
          - "final_royalty_cents computed per royalty_statement final variant"
          - "license.cumulative_royalty_cents += final_royalty_cents"
      - from: SUBMITTED
        to: DISPUTED
        trigger: "POST /glass/usage-reports/{id}/dispute"
        actor: FinanceController
        preconditions: []
        side_effects: []
      - from: SUBMITTED
        to: HELD
        trigger: "system (maker ip_review_status -> CONFIRMED_INFRINGEMENT cascade)"
        actor: system
        preconditions: []
        side_effects: []

# =============================================================================
# Table 1.2.1: Concurrency Rules (OCC on parent version only)
# =============================================================================
concurrency_rules:
  - rule_id: commitment-create-stale-program
    parent_entity: Program
    write_endpoint: "POST /glass/commitments"
    occ_field: expected_program_version
    description: |
      Creating a Commitment against a Program whose version has advanced since
      the client last observed it is rejected. Creating a commitment legitimately
      supersedes any existing PROPOSED commitment on the same program, so a
      client holding a stale program view must re-observe before proposing.
    error_id: ERR_STALE_PROGRAM_VERSION
    http_status: 412
  - rule_id: allocation-create-stale-commitment
    parent_entity: Commitment
    write_endpoint: "POST /glass/allocations"
    occ_field: expected_commitment_version
    description: |
      Creating an Allocation against a Commitment whose version has advanced
      since the client last observed it is rejected. An allocation mutates the
      commitment's remaining supply need, so a client holding a stale commitment
      view must re-observe before allocating.
    error_id: ERR_STALE_COMMITMENT_VERSION
    http_status: 412

# =============================================================================
# Table 1.3: Calculation Rules Table
# =============================================================================
calculations:
  - name: yield_learning_curve
    trigger: "campaign creation (provisional variant); each POST /glass/campaigns/{id}/record-production and campaign completion (realized variant)"
    algorithm: threshold
    formula: |
      provisional_yield(planned_units):
        if planned_units < CONST.YIELD_STEP1_MAX_UNITS: CONST.YIELD_STEP1_RATE
        elif planned_units < CONST.YIELD_STEP2_MAX_UNITS: CONST.YIELD_STEP2_RATE
        else: CONST.YIELD_STEP3_RATE
      expected_good_units = floor(planned_units * provisional_yield)
      realized_yield =
        if no production records: null
        else: (sum(good_units) / (sum(good_units) + sum(scrap_units))) rounded to 6dp, round_half_up
    input_set: "the campaign's planned_units (provisional); all production records of the campaign regardless of record_date order (realized)"
    constants_used: [CONST.YIELD_STEP1_MAX_UNITS, CONST.YIELD_STEP1_RATE, CONST.YIELD_STEP2_MAX_UNITS, CONST.YIELD_STEP2_RATE, CONST.YIELD_STEP3_RATE]
    precision: "expected_good_units floored to integer; realized_yield 6 decimal places round_half_up"
    variants:
      - name: provisional
        when: "at campaign creation, from planned_units only"
        difference: "uses the step curve on planned volume; ignores actual production"
      - name: realized
        when: "after at least one production record exists"
        difference: "uses actual good/scrap ratio; typically differs from provisional"

  - name: campaign_unit_cost
    trigger: "campaign creation (provisional_unit_cost_cents); campaign completion or abort-from-RUNNING with >= 1 production record (final_unit_cost_cents)"
    algorithm: tiered_pricing
    formula: |
      campaign_days = (end_date - start_date).days
      basis_units  = planned_units            (provisional) | cumulative_good_units (final)
      yield_basis  = provisional_yield        (provisional) | realized_yield        (final)
      energy_cents = CONST.ENERGY_SURCHARGE_T2_CENTS if basis_units >= CONST.ENERGY_SURCHARGE_T1_MAX_UNITS
                     else CONST.ENERGY_SURCHARGE_T1_CENTS
      prior = the campaign on the same tank with the latest end_date <= this.start_date
              and status IN {SCHEDULED, RUNNING, COMPLETED, ABORTED}
      changeover_cents_total =
        0 if prior is none or prior.composition_id == this.composition_id
        else CONST.CHANGEOVER_AMORTIZATION_CENTS_PER_DAY * campaign_days
      unit_cost_cents = ceil((CONST.BASE_MELT_COST_CENTS_PER_UNIT * composition.complexity_multiplier + energy_cents) / yield_basis)
                        + ceil(changeover_cents_total / basis_units)
      The two ceil operations are applied separately and THEN summed; order is pinned.
    input_set: "the campaign, its composition, and the prior campaign on the same tank (if any)"
    constants_used: [CONST.BASE_MELT_COST_CENTS_PER_UNIT, CONST.ENERGY_SURCHARGE_T1_MAX_UNITS, CONST.ENERGY_SURCHARGE_T1_CENTS, CONST.ENERGY_SURCHARGE_T2_CENTS, CONST.CHANGEOVER_AMORTIZATION_CENTS_PER_DAY]
    precision: "integer cents; ceil applied per component before summation"
    variants:
      - name: provisional
        when: "at scheduling"
        difference: "planned_units and step-curve yield"
      - name: final
        when: "at completion or abort-from-RUNNING with >= 1 production record"
        difference: "cumulative_good_units and realized yield; energy tier re-selected on actual good units"

  - name: royalty_statement
    trigger: "usage report creation (provisional_royalty_cents); usage report acceptance (final_royalty_cents)"
    algorithm: tiered_pricing
    formula: |
      total_units = sum(lines[].units)
      rate = CONST.ROYALTY_T1_RATE if total_units <= CONST.ROYALTY_T1_MAX_UNITS
             else CONST.ROYALTY_T2_RATE if total_units <= CONST.ROYALTY_T2_MAX_UNITS
             else CONST.ROYALTY_T3_RATE
      provisional_royalty_cents = sum over lines of round_half_up(line.net_revenue_cents * rate)
      final_royalty_cents       = round_half_up(sum(lines[].net_revenue_cents) * rate)
      Rounding order is pinned and differs BY DESIGN: provisional rounds each line
      first and sums the rounded cents; final sums raw line revenues and rounds once.
    input_set: "the report's lines; tier selected by total units across ALL lines (average rate, not marginal)"
    constants_used: [CONST.ROYALTY_T1_MAX_UNITS, CONST.ROYALTY_T1_RATE, CONST.ROYALTY_T2_MAX_UNITS, CONST.ROYALTY_T2_RATE, CONST.ROYALTY_T3_RATE]
    precision: "integer cents, round_half_up at each rounding site"
    variants:
      - name: provisional
        when: "at submission"
        difference: "round per line, then sum"
      - name: final
        when: "at acceptance"
        difference: "sum raw revenues, then round once; differs from provisional whenever per-line fractional parts cross a rounding boundary in aggregate"

  - name: commitment_coverage
    trigger: "POST /glass/commitments/{id}/confirm-prepayment (gate + storage of coverage_tier and effective_units)"
    algorithm: constraint_propagation
    formula: |
      Evaluation order is pinned; later steps MUST NOT feed back into earlier ones:
      step 1: credit_units  = floor(prepayment_cents / CONST.PREPAYMENT_UNIT_CREDIT_CENTS)
      step 2: base_units    = committed_units + credit_units
      step 3: base_coverage = base_units / required_units   (unrounded for comparisons)
      step 4: coverage_tier = TIER_A if base_coverage >= CONST.TIER_A_COVERAGE_MIN
                              else TIER_B if base_coverage >= CONST.TIER_B_COVERAGE_MIN
                              else TIER_C
      step 5: bonus_rate    = CONST.TIER_A_BONUS_RATE (TIER_A) | CONST.TIER_B_BONUS_RATE (TIER_B) | 0 (TIER_C)
      step 6: effective_units    = floor(base_units * (1 + bonus_rate))
      step 7: effective_coverage = effective_units / required_units (stored 4dp round_half_up)
      GATE: confirm-prepayment succeeds only if base_coverage >= CONST.TIER_B_COVERAGE_MIN,
      else ERR_COMMITMENT_COVERAGE_INSUFFICIENT.
      Circular-looking dependency resolved: the tier bonus depends on the tier, and the
      tier is derived from base (pre-bonus) coverage only; effective_units never re-enters
      the tier derivation.
    input_set: "the commitment's committed_units, required_units, prepayment_cents"
    constants_used: [CONST.PREPAYMENT_UNIT_CREDIT_CENTS, CONST.MIN_PREPAYMENT_CENTS, CONST.TIER_A_COVERAGE_MIN, CONST.TIER_B_COVERAGE_MIN, CONST.TIER_A_BONUS_RATE, CONST.TIER_B_BONUS_RATE]
    precision: "integer units floored; effective_coverage 4 decimal places round_half_up"
    variants: []

  - name: allocation_waterfall
    trigger: "POST /glass/campaigns/{id}/auto-allocate"
    algorithm: waterfall_allocation
    formula: |
      candidates = Commitments c where
        c.program_id == campaign.composition.program_id
        AND c.status IN {SECURED, BREACH_WATCH}
        AND c's device_maker.ip_review_status != CONFIRMED_INFRINGEMENT
      rank order (deterministic, no id anywhere):
        (1) status BREACH_WATCH before SECURED
        (2) coverage_tier rank descending: TIER_A > TIER_B > TIER_C
        (3) signed_at ascending (earliest signature first)
        (4) created_at ascending
      headroom = campaign.unallocated_units
      for each candidate in rank order while headroom > 0:
        need  = c.committed_units - sum(units of c's Allocations in {RESERVED, FULFILLED})
        grant = min(need, headroom)
        if grant > 0: create Allocation(commitment_id=c, campaign_id, units=grant, status=RESERVED);
                      headroom -= grant; campaign.unallocated_units -= grant;
                      c.version += 1; c.supply_coverage recomputed;
                      if c was BREACH_WATCH and supply_coverage >= CONST.SUPPLY_COVERAGE_MIN: c -> SECURED
      empty candidate set: no allocations created; endpoint returns 200 with an empty list.
    input_set: "all commitments of the campaign composition's program in the eligible statuses above"
    constants_used: [CONST.SUPPLY_COVERAGE_MIN]
    precision: "integer units; no rounding"
    variants: []

# =============================================================================
# Table 1.4: Validation Rules Table (ordered by priority; first failure wins)
# =============================================================================
validations:
  - priority: 1
    category: auth
    check: "X-User-Role and X-User-ID headers are present and X-User-Role is a declared role"
    error_id: ERR_UNAUTHENTICATED
    http_status: 401
    applies_to: "all"
  - priority: 2
    category: auth
    check: "X-User-Role is listed in the endpoint's roles"
    error_id: ERR_FORBIDDEN_ROLE
    http_status: 403
    applies_to: "all"
  - priority: 3
    category: existence
    check: "Request body shape: required fields present, types valid, enum members valid, complexity_multiplier within [1.0, 2.5], usage report period_start < period_end, lines non-empty, license term >= CONST.LICENSE_MIN_TERM_DAYS, apply-prepayment amount_cents > 0"
    error_id: ERR_INVALID_REQUEST
    http_status: 400
    applies_to: "all"
  - priority: 4
    category: existence
    check: "Path ids and body foreign-key references resolve to existing entities, validated left-to-right"
    error_id: ERR_NOT_FOUND
    http_status: 404
    applies_to: "all"
  - priority: 5
    category: auth
    check: "Ownership: for DeviceMaker-role writes, X-User-ID equals the owning DeviceMaker id (commitment sign, qual begin-testing/record-result, submit-marketing, usage-report create)"
    error_id: ERR_OWNERSHIP_MISMATCH
    http_status: 403
    applies_to: ["POST /glass/commitments/{commitmentId}/sign", "POST /glass/qual-cycles/{qualCycleId}/begin-testing", "POST /glass/qual-cycles/{qualCycleId}/record-result", "POST /glass/licenses/{licenseId}/submit-marketing", "POST /glass/usage-reports"]
  - priority: 6
    category: state
    check: "Target entity is in a state from which the requested transition is defined (covers retire on LOCKED composition, actions on TERMINATED/CLOSED programs, campaign start after end_date, and all other off-transition attempts); creation-time state gates on referenced entities also live here: POST /glass/allocations requires commitment SECURED or BREACH_WATCH and campaign SCHEDULED or RUNNING, POST /glass/usage-reports requires license ACTIVE or SUSPENDED"
    error_id: ERR_INVALID_STATE
    http_status: 409
    applies_to: "all state-transition endpoints"
  - priority: 7
    category: state
    check: "OCC: expected_program_version on POST /glass/commitments equals Program.version; expected_commitment_version on POST /glass/allocations equals Commitment.version"
    error_id: ERR_STALE_PROGRAM_VERSION
    http_status: 412
    applies_to: ["POST /glass/commitments", "POST /glass/allocations"]
    note: "POST /glass/allocations uses ERR_STALE_COMMITMENT_VERSION; both share this priority"
  - priority: 8
    category: business_safety
    check: "Confidentiality: program must be past DRAFT (NDA executed) before compositions, commitments, or licenses are created against it"
    error_id: ERR_NDA_REQUIRED
    http_status: 403
    applies_to: ["POST /glass/compositions", "POST /glass/commitments", "POST /glass/licenses"]
  - priority: 9
    category: business_safety
    check: "IP litigation hold: the referenced DeviceMaker must not have ip_review_status == CONFIRMED_INFRINGEMENT"
    error_id: ERR_IP_LITIGATION_HOLD
    http_status: 403
    applies_to: ["POST /glass/licenses/{licenseId}/activate", "POST /glass/licenses/{licenseId}/reinstate", "POST /glass/allocations", "POST /glass/usage-reports"]
  - priority: 10
    category: business_safety
    check: "Segregation of duties: confirm-prepayment X-User-ID must differ from the commitment's countersigned_by"
    error_id: ERR_SEGREGATION_OF_DUTIES
    http_status: 403
    applies_to: ["POST /glass/commitments/{commitmentId}/confirm-prepayment"]
  - priority: 11
    category: business_temporal
    check: "Design freeze: freeze-design allowed only at or before design_freeze_date"
    error_id: ERR_DESIGN_FREEZE_PASSED
    http_status: 422
    applies_to: ["POST /glass/programs/{programId}/freeze-design"]
  - priority: 12
    category: business_temporal
    check: "Campaign window: end_date > start_date and CONST.MIN_CAMPAIGN_DAYS <= (end_date - start_date).days <= CONST.MAX_CAMPAIGN_DAYS"
    error_id: ERR_INVALID_CAMPAIGN_WINDOW
    http_status: 422
    applies_to: ["POST /glass/campaigns"]
  - priority: 13
    category: business_temporal
    check: "Tank schedule: on the same tank, the new half-open window must not overlap any existing non-terminal campaign window; additionally, versus every existing campaign on that tank with a different composition_id, the gap between the windows must be >= CONST.CHANGEOVER_GAP_DAYS on whichever side they adjoin (same-composition adjacency needs gap 0)"
    error_id: ERR_TANK_SCHEDULE_CONFLICT
    http_status: 422
    applies_to: ["POST /glass/campaigns"]
  - priority: 14
    category: business_temporal
    check: "Campaign start/complete timing and tank commission readiness against the logical clock"
    error_id: ERR_CAMPAIGN_NOT_STARTED
    http_status: 422
    applies_to: ["POST /glass/campaigns/{campaignId}/start"]
    note: "complete uses ERR_CAMPAIGN_NOT_ENDED; commission uses ERR_TANK_UNDER_CONSTRUCTION; same priority"
  - priority: 15
    category: business_temporal
    check: "License term: activate/reinstate only within [effective_date, expiry_date]; closed-interval term overlap among ACTIVE licenses of the same (device_maker_id, market)"
    error_id: ERR_LICENSE_TERM_INVALID
    http_status: 422
    applies_to: ["POST /glass/licenses/{licenseId}/activate", "POST /glass/licenses/{licenseId}/reinstate"]
    note: "overlap variant uses ERR_LICENSE_TERM_OVERLAP; same priority"
  - priority: 16
    category: business_temporal
    check: "Usage report period must not overlap an existing report of the same license whose status is SUBMITTED or ACCEPTED (overlap vs DISPUTED or HELD reports is permitted — supersession)"
    error_id: ERR_REPORT_PERIOD_OVERLAP
    http_status: 422
    applies_to: ["POST /glass/usage-reports"]
  - priority: 17
    category: business_referential
    check: "Referenced composition maturity: campaign creation requires composition status IN {TUNED, QUALIFIED, LOCKED}; campaign start requires {QUALIFIED, LOCKED}"
    error_id: ERR_COMPOSITION_NOT_QUALIFIED
    http_status: 422
    applies_to: ["POST /glass/campaigns", "POST /glass/campaigns/{campaignId}/start"]
    note: "a CONSTRUCTING tank referenced by campaign creation or start uses ERR_TANK_UNDER_CONSTRUCTION at this same priority"
  - priority: 18
    category: business_referential
    check: "License activation requires program DESIGN_FROZEN; secondary market (market != program.primary_market) additionally requires a LOCKED base composition in the program"
    error_id: ERR_PROGRAM_NOT_FROZEN
    http_status: 422
    applies_to: ["POST /glass/licenses/{licenseId}/activate", "POST /glass/licenses/{licenseId}/reinstate"]
    note: "secondary-market failure uses ERR_BASE_PLATFORM_NOT_QUALIFIED; same priority"
  - priority: 19
    category: business_referential
    check: "Allocation's campaign and commitment must belong to the same program (campaign.composition.program_id == commitment.program_id)"
    error_id: ERR_PROGRAM_MISMATCH
    http_status: 422
    applies_to: ["POST /glass/allocations"]
  - priority: 20
    category: business_referential
    check: "Tank creation requires the referenced commitment to be SECURED (capacity investment is gated on a secured customer commitment)"
    error_id: ERR_COMMITMENT_NOT_SECURED
    http_status: 422
    applies_to: ["POST /glass/tanks"]
  - priority: 21
    category: business_constraint
    check: "Qual resubmission cap (attempt_number < CONST.MAX_QUAL_ATTEMPTS); strictly positive units on allocations, production records, campaign planned_units; one tank per commitment; composition_code unique within program; campaign planned_units <= tank.capacity_units_per_day * campaign_days; freeze-design requires a QUALIFIED/LOCKED composition"
    error_id: ERR_MAX_QUAL_ATTEMPTS
    http_status: 422
    applies_to: ["POST /glass/qual-cycles/{qualCycleId}/resubmit", "POST /glass/allocations", "POST /glass/campaigns/{campaignId}/record-production", "POST /glass/campaigns", "POST /glass/tanks", "POST /glass/compositions", "POST /glass/programs/{programId}/freeze-design"]
    note: "per-endpoint error ids: ERR_MAX_QUAL_ATTEMPTS, ERR_NONPOSITIVE_UNITS, ERR_TANK_ALREADY_EXISTS, ERR_COMPOSITION_CODE_CONFLICT, ERR_CAMPAIGN_OVER_CAPACITY, ERR_NO_QUALIFIED_COMPOSITION"
  - priority: 22
    category: business_fiscal
    check: "Fiscal rules, evaluated last: prepayment_cents >= CONST.MIN_PREPAYMENT_CENTS; commitment_coverage gate >= CONST.TIER_B_COVERAGE_MIN; allocation units <= commitment remaining need; allocation units <= campaign.unallocated_units; apply-prepayment amount <= prepayment_remaining_cents; usage-report accept requires marketing APPROVED"
    error_id: ERR_PREPAYMENT_INSUFFICIENT
    http_status: 422
    applies_to: ["POST /glass/commitments", "POST /glass/commitments/{commitmentId}/confirm-prepayment", "POST /glass/allocations", "POST /glass/commitments/{commitmentId}/apply-prepayment", "POST /glass/usage-reports/{usageReportId}/accept"]
    note: "per-endpoint error ids: ERR_PREPAYMENT_INSUFFICIENT, ERR_COMMITMENT_COVERAGE_INSUFFICIENT, ERR_COMMITMENT_UNITS_EXCEEDED, ERR_INSUFFICIENT_CAMPAIGN_HEADROOM, ERR_PREPAYMENT_OVERAPPLY, ERR_MARKETING_NOT_APPROVED — in this row's listed order when several fail"

# =============================================================================
# Table 1.5: API Endpoint Table
# =============================================================================
endpoints:
  # --- DeviceMaker ---
  - { method: POST, path: "/glass/device-makers", description: "Register a device maker", roles: [PlatformAdmin], code: 201, input: [name, region, "standing_tier?"], output: DeviceMaker, side_effects: ["standing_tier defaults to STANDARD, ip_review_status defaults to CLEAR"] }
  - { method: GET, path: "/glass/device-makers/{deviceMakerId}", description: "Get a device maker", roles: [PlatformAdmin, ProgramManager, CapacityPlanner, FinanceController, LegalCounsel, DeviceMaker], code: 200, input: [], output: DeviceMaker, side_effects: [] }
  - { method: GET, path: "/glass/device-makers", description: "List device makers", roles: [PlatformAdmin, ProgramManager, CapacityPlanner, FinanceController, LegalCounsel, DeviceMaker], code: 200, input: ["standing_tier?", "ip_review_status?", "limit?", "offset?"], output: "DeviceMaker[]", side_effects: [] }
  - { method: POST, path: "/glass/device-makers/{deviceMakerId}/ip-review", description: "Advance IP monitoring status; CONFIRMED_INFRINGEMENT cascades to licenses and usage reports", roles: [LegalCounsel], code: 200, input: [to_status], output: DeviceMaker, side_effects: ["per DeviceMaker ip_review_status transitions, including license suspension and report hold cascade"] }

  # --- Program ---
  - { method: POST, path: "/glass/programs", description: "Create a co-development program (starts DRAFT)", roles: [ProgramManager], code: 201, input: [device_maker_id, name, primary_market, "confidentiality_tier?"], output: Program, side_effects: [] }
  - { method: GET, path: "/glass/programs/{programId}", description: "Get a program", roles: [PlatformAdmin, ProgramManager, CapacityPlanner, FinanceController, LegalCounsel, DeviceMaker], code: 200, input: [], output: Program, side_effects: [] }
  - { method: GET, path: "/glass/programs", description: "List programs", roles: [PlatformAdmin, ProgramManager, CapacityPlanner, FinanceController, LegalCounsel, DeviceMaker], code: 200, input: ["device_maker_id?", "status?", "limit?", "offset?"], output: "Program[]", side_effects: [] }
  - { method: POST, path: "/glass/programs/{programId}/execute-nda", description: "Execute confidentiality agreement: DRAFT -> NDA_EXECUTED", roles: [ProgramManager], code: 200, input: [nda_reference], output: Program, side_effects: ["stores nda_reference", "increments Program.version by 1"] }
  - { method: POST, path: "/glass/programs/{programId}/begin-qualification", description: "Enter qualification and pin design freeze deadline: COMPOSITION_TUNING -> QUALIFICATION", roles: [ProgramManager], code: 200, input: [design_freeze_date], output: Program, side_effects: ["sets design_freeze_date", "increments Program.version by 1"] }
  - { method: POST, path: "/glass/programs/{programId}/rework", description: "Send program back to tuning: QUALIFICATION -> COMPOSITION_TUNING", roles: [ProgramManager], code: 200, input: [], output: Program, side_effects: ["clears design_freeze_date to null", "increments Program.version by 1"] }
  - { method: POST, path: "/glass/programs/{programId}/freeze-design", description: "Freeze device design: QUALIFICATION -> DESIGN_FROZEN; allowed at or before design_freeze_date and only with a QUALIFIED or LOCKED composition", roles: [ProgramManager], code: 200, input: [], output: Program, side_effects: ["increments Program.version by 1"] }
  - { method: POST, path: "/glass/programs/{programId}/close", description: "Close a frozen program with no in-flight campaigns or commitments: DESIGN_FROZEN -> CLOSED", roles: [ProgramManager], code: 200, input: [], output: Program, side_effects: ["increments Program.version by 1"] }
  - { method: POST, path: "/glass/programs/{programId}/terminate", description: "Terminate a program; releases non-terminal commitments (refunding remaining prepayment) and cancels SCHEDULED campaigns", roles: [ProgramManager], code: 200, input: ["reason?"], output: Program, side_effects: ["commitment release cascade", "campaign cancel cascade with allocation release", "increments Program.version by 1"] }

  # --- Composition ---
  - { method: POST, path: "/glass/compositions", description: "Create a glass composition under a program (starts EXPERIMENTAL)", roles: [ProgramManager], code: 201, input: [program_id, composition_code, complexity_multiplier], output: Composition, side_effects: ["if this is the program's first composition and program is NDA_EXECUTED, program transitions NDA_EXECUTED -> COMPOSITION_TUNING and Program.version increments"] }
  - { method: GET, path: "/glass/compositions/{compositionId}", description: "Get a composition", roles: [PlatformAdmin, ProgramManager, CapacityPlanner, FinanceController, LegalCounsel, DeviceMaker], code: 200, input: [], output: Composition, side_effects: [] }
  - { method: GET, path: "/glass/compositions", description: "List compositions", roles: [PlatformAdmin, ProgramManager, CapacityPlanner, FinanceController, LegalCounsel, DeviceMaker], code: 200, input: ["program_id?", "status?", "limit?", "offset?"], output: "Composition[]", side_effects: [] }
  - { method: POST, path: "/glass/compositions/{compositionId}/lock", description: "Lock a qualified composition (immutable thereafter): QUALIFIED -> LOCKED", roles: [ProgramManager], code: 200, input: [], output: Composition, side_effects: [] }
  - { method: POST, path: "/glass/compositions/{compositionId}/retire", description: "Retire a non-LOCKED composition; cancels its SCHEDULED campaigns and releases their allocations", roles: [ProgramManager], code: 200, input: [], output: Composition, side_effects: ["campaign cancel cascade", "allocation release cascade", "commitment breach-watch cascade with standing demotion"] }

  # --- QualCycle ---
  - { method: POST, path: "/glass/qual-cycles", description: "Submit a composition for a customer reliability qualification cycle (starts SUBMITTED, attempt_number 1)", roles: [ProgramManager], code: 201, input: [composition_id, test_plan_ref], output: QualCycle, side_effects: [] }
  - { method: GET, path: "/glass/qual-cycles/{qualCycleId}", description: "Get a qualification cycle", roles: [PlatformAdmin, ProgramManager, CapacityPlanner, FinanceController, LegalCounsel, DeviceMaker], code: 200, input: [], output: QualCycle, side_effects: [] }
  - { method: GET, path: "/glass/qual-cycles", description: "List qualification cycles", roles: [PlatformAdmin, ProgramManager, CapacityPlanner, FinanceController, LegalCounsel, DeviceMaker], code: 200, input: ["composition_id?", "status?", "limit?", "offset?"], output: "QualCycle[]", side_effects: [] }
  - { method: POST, path: "/glass/qual-cycles/{qualCycleId}/begin-testing", description: "Customer begins reliability testing: SUBMITTED -> IN_TESTING; first begin tunes the composition (EXPERIMENTAL -> TUNED)", roles: [DeviceMaker], code: 200, input: [], output: QualCycle, side_effects: ["composition EXPERIMENTAL -> TUNED if applicable"] }
  - { method: POST, path: "/glass/qual-cycles/{qualCycleId}/record-result", description: "Customer records reliability outcome: IN_TESTING -> PASSED or FAILED; a PASS qualifies a TUNED composition", roles: [DeviceMaker], code: 200, input: [outcome], output: QualCycle, side_effects: ["sets result_recorded_at", "composition TUNED -> QUALIFIED on PASSED"] }
  - { method: POST, path: "/glass/qual-cycles/{qualCycleId}/resubmit", description: "Resubmit a failed cycle for another attempt: FAILED -> SUBMITTED, attempt_number += 1, hard cap CONST.MAX_QUAL_ATTEMPTS", roles: [ProgramManager], code: 200, input: [], output: QualCycle, side_effects: ["attempt_number += 1"] }

  # --- Tank ---
  - { method: POST, path: "/glass/tanks", description: "Build a melting tank funded by a SECURED commitment (starts CONSTRUCTING; construction_ready_date = created_at + CONST.TANK_CONSTRUCTION_DAYS days)", roles: [CapacityPlanner], code: 201, input: [commitment_id, capacity_units_per_day], output: Tank, side_effects: ["sets construction_ready_date"] }
  - { method: GET, path: "/glass/tanks/{tankId}", description: "Get a tank", roles: [PlatformAdmin, ProgramManager, CapacityPlanner, FinanceController, LegalCounsel, DeviceMaker], code: 200, input: [], output: Tank, side_effects: [] }
  - { method: GET, path: "/glass/tanks", description: "List tanks", roles: [PlatformAdmin, ProgramManager, CapacityPlanner, FinanceController, LegalCounsel, DeviceMaker], code: 200, input: ["commitment_id?", "status?", "limit?", "offset?"], output: "Tank[]", side_effects: [] }
  - { method: POST, path: "/glass/tanks/{tankId}/commission", description: "Commission a tank once the logical clock reaches construction_ready_date", roles: [CapacityPlanner], code: 200, input: [], output: Tank, side_effects: [] }

  # --- Campaign ---
  - { method: POST, path: "/glass/campaigns", description: "Schedule a melting campaign on a tank for a composition (starts SCHEDULED); window, capacity, and changeover-buffer rules apply", roles: [CapacityPlanner], code: 201, input: [tank_id, composition_id, start_date, end_date, planned_units], output: Campaign, side_effects: ["computes expected_good_units and provisional_unit_cost_cents", "unallocated_units := expected_good_units"] }
  - { method: GET, path: "/glass/campaigns/{campaignId}", description: "Get a campaign", roles: [PlatformAdmin, ProgramManager, CapacityPlanner, FinanceController, LegalCounsel, DeviceMaker], code: 200, input: [], output: Campaign, side_effects: [] }
  - { method: GET, path: "/glass/campaigns", description: "List campaigns", roles: [PlatformAdmin, ProgramManager, CapacityPlanner, FinanceController, LegalCounsel, DeviceMaker], code: 200, input: ["tank_id?", "composition_id?", "status?", "limit?", "offset?"], output: "Campaign[]", side_effects: [] }
  - { method: POST, path: "/glass/campaigns/{campaignId}/start", description: "Start a scheduled campaign: SCHEDULED -> RUNNING; requires clock in window, composition QUALIFIED or LOCKED, tank COMMISSIONED", roles: [CapacityPlanner], code: 200, input: [], output: Campaign, side_effects: [] }
  - { method: POST, path: "/glass/campaigns/{campaignId}/abort", description: "Abort a SCHEDULED or RUNNING campaign; releases its RESERVED allocations and may push commitments into BREACH_WATCH", roles: [CapacityPlanner], code: 200, input: [], output: Campaign, side_effects: ["allocation release cascade", "commitment breach-watch cascade with standing demotion", "final_unit_cost_cents computed when aborting from RUNNING with production records"] }
  - { method: POST, path: "/glass/campaigns/{campaignId}/complete", description: "Complete a RUNNING campaign at or after end_date; computes final yield and unit cost", roles: [CapacityPlanner], code: 200, input: [], output: Campaign, side_effects: ["realized_yield recomputed", "final_unit_cost_cents computed (null if no production records)"] }
  - { method: POST, path: "/glass/campaigns/{campaignId}/record-production", description: "Record a production tally (good and scrap units) against a RUNNING campaign", roles: [CapacityPlanner], code: 200, input: [record_date, good_units, scrap_units], output: Campaign, side_effects: ["cumulative_good_units += good_units", "cumulative_scrap_units += scrap_units", "realized_yield recomputed"] }
  - { method: POST, path: "/glass/campaigns/{campaignId}/auto-allocate", description: "Run the allocation waterfall over eligible commitments of the campaign's program; returns created allocations (empty list when none eligible)", roles: [CapacityPlanner], code: 200, input: [], output: "Allocation[]", side_effects: ["creates RESERVED allocations per allocation_waterfall", "decrements campaign.unallocated_units", "increments each touched Commitment.version by 1", "may recover BREACH_WATCH commitments to SECURED"] }

  # --- Commitment ---
  - { method: POST, path: "/glass/commitments", description: "Propose a capacity commitment against a program (OCC on expected_program_version); supersedes any existing PROPOSED commitment on the same program", roles: [ProgramManager], code: 201, input: [program_id, committed_units, required_units, prepayment_cents, expected_program_version], output: Commitment, side_effects: ["existing PROPOSED commitments of the same program transition to RELEASED (superseded)", "increments Program.version by 1", "device_maker_id copied from program", "prepayment_remaining_cents := prepayment_cents"] }
  - { method: GET, path: "/glass/commitments/{commitmentId}", description: "Get a commitment", roles: [PlatformAdmin, ProgramManager, CapacityPlanner, FinanceController, LegalCounsel, DeviceMaker], code: 200, input: [], output: Commitment, side_effects: [] }
  - { method: GET, path: "/glass/commitments", description: "List commitments", roles: [PlatformAdmin, ProgramManager, CapacityPlanner, FinanceController, LegalCounsel, DeviceMaker], code: 200, input: ["program_id?", "device_maker_id?", "status?", "limit?", "offset?"], output: "Commitment[]", side_effects: [] }
  - { method: POST, path: "/glass/commitments/{commitmentId}/sign", description: "Device maker signs the commitment: PROPOSED -> SIGNED; only one active commitment per program", roles: [DeviceMaker], code: 200, input: [], output: Commitment, side_effects: ["sets signed_at"] }
  - { method: POST, path: "/glass/commitments/{commitmentId}/countersign", description: "Capacity planner countersigns: SIGNED -> COUNTERSIGNED", roles: [CapacityPlanner], code: 200, input: [], output: Commitment, side_effects: ["countersigned_by := X-User-ID"] }
  - { method: POST, path: "/glass/commitments/{commitmentId}/confirm-prepayment", description: "Finance confirms prepayment receipt: COUNTERSIGNED -> SECURED; computes coverage tier; segregated from countersigner", roles: [FinanceController], code: 200, input: [], output: Commitment, side_effects: ["computes and stores coverage_tier and effective_units per commitment_coverage"] }
  - { method: POST, path: "/glass/commitments/{commitmentId}/apply-prepayment", description: "Apply part of the remaining prepayment to an invoice (moves cents from remaining to applied bucket)", roles: [FinanceController], code: 200, input: [amount_cents], output: Commitment, side_effects: ["prepayment_applied_cents += amount_cents", "prepayment_remaining_cents -= amount_cents"] }
  - { method: POST, path: "/glass/commitments/{commitmentId}/release", description: "Release a non-terminal commitment; refunds remaining prepayment and releases its RESERVED allocations", roles: [ProgramManager], code: 200, input: ["reason?"], output: Commitment, side_effects: ["prepayment_refunded_cents += prepayment_remaining_cents; prepayment_remaining_cents := 0", "RESERVED allocations released, campaign unallocated_units restored"] }

  # --- Allocation ---
  - { method: POST, path: "/glass/allocations", description: "Allocate campaign supply to a commitment (OCC on expected_commitment_version); same-program, headroom, and remaining-need rules apply", roles: [CapacityPlanner], code: 201, input: [commitment_id, campaign_id, units, expected_commitment_version], output: Allocation, side_effects: ["campaign.unallocated_units -= units", "increments Commitment.version by 1", "commitment.supply_coverage recomputed; BREACH_WATCH recovers to SECURED when coverage reaches CONST.SUPPLY_COVERAGE_MIN"] }
  - { method: GET, path: "/glass/allocations/{allocationId}", description: "Get an allocation", roles: [PlatformAdmin, ProgramManager, CapacityPlanner, FinanceController, LegalCounsel, DeviceMaker], code: 200, input: [], output: Allocation, side_effects: [] }
  - { method: GET, path: "/glass/allocations", description: "List allocations", roles: [PlatformAdmin, ProgramManager, CapacityPlanner, FinanceController, LegalCounsel, DeviceMaker], code: 200, input: ["commitment_id?", "campaign_id?", "status?", "limit?", "offset?"], output: "Allocation[]", side_effects: [] }
  - { method: POST, path: "/glass/allocations/{allocationId}/release", description: "Release a RESERVED allocation; restores campaign headroom and may push the commitment into BREACH_WATCH", roles: [CapacityPlanner], code: 200, input: [], output: Allocation, side_effects: ["campaign.unallocated_units += units", "commitment supply_coverage recompute with possible BREACH_WATCH transition and standing demotion"] }
  - { method: POST, path: "/glass/allocations/{allocationId}/fulfill", description: "Mark a RESERVED allocation fulfilled (glass shipped); requires campaign RUNNING or COMPLETED and commitment SECURED or BREACH_WATCH", roles: [CapacityPlanner], code: 200, input: [], output: Allocation, side_effects: ["commitment.fulfilled_units += units", "commitment.supply_coverage recomputed"] }

  # --- License ---
  - { method: POST, path: "/glass/licenses", description: "Create a brand license (license_status NEGOTIATION, marketing_status DRAFT); market differing from program.primary_market is a secondary application", roles: [LegalCounsel], code: 201, input: [device_maker_id, program_id, market, effective_date, expiry_date], output: License, side_effects: [] }
  - { method: GET, path: "/glass/licenses/{licenseId}", description: "Get a license", roles: [PlatformAdmin, ProgramManager, CapacityPlanner, FinanceController, LegalCounsel, DeviceMaker], code: 200, input: [], output: License, side_effects: [] }
  - { method: GET, path: "/glass/licenses", description: "List licenses", roles: [PlatformAdmin, ProgramManager, CapacityPlanner, FinanceController, LegalCounsel, DeviceMaker], code: 200, input: ["device_maker_id?", "program_id?", "market?", "license_status?", "limit?", "offset?"], output: "License[]", side_effects: [] }
  - { method: POST, path: "/glass/licenses/{licenseId}/activate", description: "Activate a negotiated license: NEGOTIATION -> ACTIVE; requires program DESIGN_FROZEN, no IP hold, qualified base platform for secondary markets, in-term clock, no closed-interval term overlap", roles: [LegalCounsel], code: 200, input: [], output: License, side_effects: [] }
  - { method: POST, path: "/glass/licenses/{licenseId}/suspend", description: "Suspend an active license (reason MANUAL): ACTIVE -> SUSPENDED", roles: [LegalCounsel], code: 200, input: [], output: License, side_effects: ["suspension_reason := MANUAL"] }
  - { method: POST, path: "/glass/licenses/{licenseId}/reinstate", description: "Reinstate a suspended license: SUSPENDED -> ACTIVE; requires IP posture CLEAR or CLEARED and in-term clock", roles: [LegalCounsel], code: 200, input: [], output: License, side_effects: ["suspension_reason := NONE"] }
  - { method: POST, path: "/glass/licenses/{licenseId}/terminate", description: "Terminate a license from any non-terminal state", roles: [LegalCounsel], code: 200, input: [], output: License, side_effects: [] }
  - { method: POST, path: "/glass/licenses/{licenseId}/submit-marketing", description: "Device maker submits brand-usage materials: marketing DRAFT or CHANGES_REQUIRED -> IN_REVIEW", roles: [DeviceMaker], code: 200, input: [materials_ref], output: License, side_effects: [] }
  - { method: POST, path: "/glass/licenses/{licenseId}/review-marketing", description: "Legal reviews marketing materials: IN_REVIEW -> APPROVED or CHANGES_REQUIRED", roles: [LegalCounsel], code: 200, input: [decision], output: License, side_effects: [] }

  # --- UsageReport ---
  - { method: POST, path: "/glass/usage-reports", description: "Submit a royalty usage report (starts SUBMITTED); provisional royalty computed with per-line rounding", roles: [DeviceMaker], code: 201, input: [license_id, period_start, period_end, lines], output: UsageReport, side_effects: ["computes royalty_rate_applied and provisional_royalty_cents per royalty_statement provisional variant"] }
  - { method: GET, path: "/glass/usage-reports/{usageReportId}", description: "Get a usage report", roles: [PlatformAdmin, ProgramManager, CapacityPlanner, FinanceController, LegalCounsel, DeviceMaker], code: 200, input: [], output: UsageReport, side_effects: [] }
  - { method: GET, path: "/glass/usage-reports", description: "List usage reports", roles: [PlatformAdmin, ProgramManager, CapacityPlanner, FinanceController, LegalCounsel, DeviceMaker], code: 200, input: ["license_id?", "status?", "limit?", "offset?"], output: "UsageReport[]", side_effects: [] }
  - { method: POST, path: "/glass/usage-reports/{usageReportId}/accept", description: "Accept a report: computes final royalty (sum-then-round) and accrues it to the license; requires marketing APPROVED", roles: [FinanceController], code: 200, input: [], output: UsageReport, side_effects: ["computes final_royalty_cents per royalty_statement final variant", "license.cumulative_royalty_cents += final_royalty_cents"] }
  - { method: POST, path: "/glass/usage-reports/{usageReportId}/dispute", description: "Dispute a report: SUBMITTED -> DISPUTED; a fresh report may then be submitted for an overlapping period (supersession)", roles: [FinanceController], code: 200, input: ["reason?"], output: UsageReport, side_effects: [] }

  # --- System / test-driving ---
  - { method: POST, path: "/glass/_clock/set_current_utc", description: "Set the logical clock (ISO8601 UTC). Before any call to this endpoint the logical clock reads exactly 2026-09-01T00:00:00Z (CONST.DEFAULT_CLOCK_ISO) and MUST NOT fall back to wall-clock time", roles: [PlatformAdmin], code: 200, input: [to_iso8601], output: "{ current_utc: string }", side_effects: ["sets logical clock"] }
  - { method: POST, path: "/glass/ops/checkpoint", description: "Ops-run checkpoint: completes RUNNING campaigns past end_date, cancels SCHEDULED campaigns past end_date (with allocation-release cascade), expires licenses past expiry_date, marks commitments EXHAUSTED when fulfilled_units >= committed_units, and flips BREACH_WATCH commitments past breach_deadline to BREACHED", roles: [PlatformAdmin, CapacityPlanner], code: 200, input: [], output: "{ campaigns_completed: integer, campaigns_cancelled: integer, licenses_expired: integer, commitments_exhausted: integer, commitments_breached: integer }", side_effects: ["campaign completion/cancellation sweep", "license expiry sweep", "commitment exhaustion and breach sweep"] }

# =============================================================================
# Table 1.6: Error Code Catalog
# =============================================================================
errors:
  - { id: ERR_UNAUTHENTICATED, http: 401, condition: "Missing or unrecognized X-User-Role / X-User-ID headers" }
  - { id: ERR_FORBIDDEN_ROLE, http: 403, condition: "Role not permitted on this endpoint" }
  - { id: ERR_INVALID_REQUEST, http: 400, condition: "Missing required field, invalid type/enum, complexity_multiplier outside [1.0, 2.5], report period_start >= period_end, empty lines, license term shorter than CONST.LICENSE_MIN_TERM_DAYS, or design_freeze_date not in the future" }
  - { id: ERR_NOT_FOUND, http: 404, condition: "Path id or referenced FK does not resolve" }
  - { id: ERR_OWNERSHIP_MISMATCH, http: 403, condition: "DeviceMaker-role caller is not the owner of the target resource" }
  - { id: ERR_INVALID_STATE, http: 409, condition: "No transition defined from the entity's current state for this trigger" }
  - { id: ERR_STALE_PROGRAM_VERSION, http: 412, condition: "expected_program_version does not match Program.version on commitment creation" }
  - { id: ERR_STALE_COMMITMENT_VERSION, http: 412, condition: "expected_commitment_version does not match Commitment.version on allocation creation" }
  - { id: ERR_NDA_REQUIRED, http: 403, condition: "Program still DRAFT; NDA must be executed before compositions, commitments, or licenses reference it" }
  - { id: ERR_IP_LITIGATION_HOLD, http: 403, condition: "Device maker under CONFIRMED_INFRINGEMENT; license activation/reinstatement, allocations, and usage reports are blocked" }
  - { id: ERR_SEGREGATION_OF_DUTIES, http: 403, condition: "confirm-prepayment caller matches countersigned_by; the same person may not perform both duties" }
  - { id: ERR_DESIGN_FREEZE_PASSED, http: 422, condition: "freeze-design attempted after design_freeze_date (boundary: exactly at the deadline is allowed)" }
  - { id: ERR_INVALID_CAMPAIGN_WINDOW, http: 422, condition: "Campaign window shorter than CONST.MIN_CAMPAIGN_DAYS, longer than CONST.MAX_CAMPAIGN_DAYS, or end_date <= start_date (boundary: exactly MIN_CAMPAIGN_DAYS is allowed)" }
  - { id: ERR_TANK_SCHEDULE_CONFLICT, http: 422, condition: "Campaign window overlaps another non-terminal campaign on the same tank, or adjoins a different-composition campaign with less than CONST.CHANGEOVER_GAP_DAYS gap" }
  - { id: ERR_CAMPAIGN_NOT_STARTED, http: 422, condition: "Campaign start attempted before start_date" }
  - { id: ERR_CAMPAIGN_NOT_ENDED, http: 422, condition: "Campaign complete attempted before end_date" }
  - { id: ERR_TANK_UNDER_CONSTRUCTION, http: 422, condition: "Tank commission attempted before construction_ready_date, or campaign scheduled/started on a CONSTRUCTING tank" }
  - { id: ERR_LICENSE_TERM_INVALID, http: 422, condition: "License activate/reinstate outside [effective_date, expiry_date]" }
  - { id: ERR_LICENSE_TERM_OVERLAP, http: 422, condition: "Closed-interval term collision with another ACTIVE license of the same maker and market (touching expiry dates count as overlap)" }
  - { id: ERR_REPORT_PERIOD_OVERLAP, http: 422, condition: "Report period overlaps an existing SUBMITTED or ACCEPTED report of the same license" }
  - { id: ERR_COMPOSITION_NOT_QUALIFIED, http: 422, condition: "Campaign creation requires composition TUNED/QUALIFIED/LOCKED; campaign start requires QUALIFIED/LOCKED" }
  - { id: ERR_PROGRAM_NOT_FROZEN, http: 422, condition: "License activation requires the program to be DESIGN_FROZEN" }
  - { id: ERR_BASE_PLATFORM_NOT_QUALIFIED, http: 422, condition: "Secondary-market license activation requires a LOCKED base composition in the program (QUALIFIED alone is insufficient for adjacent-market certification)" }
  - { id: ERR_PROGRAM_MISMATCH, http: 422, condition: "Allocation spans two programs: campaign's composition program != commitment's program" }
  - { id: ERR_COMMITMENT_NOT_SECURED, http: 422, condition: "Tank creation requires a SECURED commitment" }
  - { id: ERR_MAX_QUAL_ATTEMPTS, http: 422, condition: "Resubmit attempted when attempt_number has reached CONST.MAX_QUAL_ATTEMPTS" }
  - { id: ERR_NONPOSITIVE_UNITS, http: 422, condition: "units, planned_units, or good_units+scrap_units must be strictly positive (boundary: zero rejected)" }
  - { id: ERR_TANK_ALREADY_EXISTS, http: 422, condition: "The funding commitment already has a tank" }
  - { id: ERR_NO_QUALIFIED_COMPOSITION, http: 422, condition: "freeze-design requires at least one QUALIFIED or LOCKED composition in the program" }
  - { id: ERR_COMPOSITION_CODE_CONFLICT, http: 422, condition: "composition_code already used within the same program" }
  - { id: ERR_CAMPAIGN_OVER_CAPACITY, http: 422, condition: "planned_units exceeds tank.capacity_units_per_day * campaign_days" }
  - { id: ERR_PREPAYMENT_INSUFFICIENT, http: 422, condition: "prepayment_cents below CONST.MIN_PREPAYMENT_CENTS (boundary: exactly the minimum is allowed)" }
  - { id: ERR_COMMITMENT_COVERAGE_INSUFFICIENT, http: 422, condition: "base_coverage below CONST.TIER_B_COVERAGE_MIN at confirm-prepayment (boundary: exactly 1.0 is allowed)" }
  - { id: ERR_COMMITMENT_UNITS_EXCEEDED, http: 422, condition: "Allocation units exceed the commitment's remaining need" }
  - { id: ERR_INSUFFICIENT_CAMPAIGN_HEADROOM, http: 422, condition: "Allocation units exceed campaign.unallocated_units (boundary: exactly equal is allowed)" }
  - { id: ERR_PREPAYMENT_OVERAPPLY, http: 422, condition: "apply-prepayment amount exceeds prepayment_remaining_cents" }
  - { id: ERR_MARKETING_NOT_APPROVED, http: 422, condition: "Usage report acceptance requires license marketing_status == APPROVED" }

# =============================================================================
# Table 1.7: RBAC Matrix
# =============================================================================
roles:
  - name: PlatformAdmin
    description: "Corning platform operator; registers device makers and drives the logical clock and ops checkpoints"
    identity: opaque
    exclusive_operations: ["POST /glass/device-makers", "POST /glass/_clock/set_current_utc"]
    shared_operations: ["POST /glass/ops/checkpoint", "all GET endpoints"]
  - name: ProgramManager
    description: "Corning co-development program manager; owns programs, compositions, qualification submissions, and commitment proposals/releases"
    identity: opaque
    exclusive_operations: ["POST /glass/programs and program lifecycle actions", "POST /glass/compositions, lock, retire", "POST /glass/qual-cycles and resubmit", "POST /glass/commitments", "POST /glass/commitments/{id}/release"]
    shared_operations: ["all GET endpoints"]
  - name: CapacityPlanner
    description: "Corning capacity planner; owns tanks, campaigns, production records, allocation waterfall, and commitment countersignature"
    identity: opaque
    exclusive_operations: ["POST /glass/tanks and commission", "POST /glass/campaigns and campaign actions", "POST /glass/allocations, release, fulfill", "POST /glass/commitments/{id}/countersign"]
    shared_operations: ["POST /glass/ops/checkpoint", "all GET endpoints"]
  - name: FinanceController
    description: "Corning finance controller; confirms prepayments, applies prepayment to invoices, adjudicates royalty reports"
    identity: opaque
    exclusive_operations: ["POST /glass/commitments/{id}/confirm-prepayment", "POST /glass/commitments/{id}/apply-prepayment", "POST /glass/usage-reports/{id}/accept", "POST /glass/usage-reports/{id}/dispute"]
    shared_operations: ["all GET endpoints"]
  - name: LegalCounsel
    description: "Corning legal counsel; owns licenses, marketing review, and IP monitoring"
    identity: opaque
    exclusive_operations: ["POST /glass/licenses and license lifecycle actions", "POST /glass/licenses/{id}/review-marketing", "POST /glass/device-makers/{id}/ip-review"]
    shared_operations: ["all GET endpoints"]
  - name: DeviceMaker
    description: "Customer device maker; signs commitments, runs reliability testing, submits marketing materials and usage reports"
    identity: "entity_backed:DeviceMaker"
    exclusive_operations: ["POST /glass/commitments/{id}/sign", "POST /glass/qual-cycles/{id}/begin-testing", "POST /glass/qual-cycles/{id}/record-result", "POST /glass/licenses/{id}/submit-marketing", "POST /glass/usage-reports"]
    shared_operations: ["all GET endpoints"]
