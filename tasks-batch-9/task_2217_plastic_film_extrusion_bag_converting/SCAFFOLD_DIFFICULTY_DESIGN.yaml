            - &a_pj1_reg { call: "POST /print-jobs/${pj1}/registration-check", payload: { registration_drift_micron: 40.0 }, as: PrintOperator }
            - &a_pj1_col { call: "POST /print-jobs/${pj1}/color-proof", payload: { delta_e_measured: 1.2 }, as: PrintOperator }
            - &a_pj1_sp { call: "POST /print-jobs/${pj1}/start-print", payload: {}, as: PrintOperator }
            - &a_pj1_cmp { call: "POST /print-jobs/${pj1}/complete", payload: { printed_kg: 576.0 }, as: PrintOperator }
            - &a_bl1 { call: "POST /bag-lots", payload: { lot_code: "BL-1", print_job_id: "${pj1}", product_id: "${p_fd}", bag_count_produced: 46000 }, as: ConvertingOperator, captures: { bl1: "$.data.id" } }
            - &a_bl1_s1_25 { call: "POST /bag-lots/${bl1}/seal-tests", payload: { specimen_index: 1, measured_n_per_15mm: 25.0 }, as: ConvertingOperator, as_user_id: "u-co-1" }
            - &a_bl1_s2_23 { call: "POST /bag-lots/${bl1}/seal-tests", payload: { specimen_index: 2, measured_n_per_15mm: 23.0 }, as: ConvertingOperator, as_user_id: "u-co-1" }
            - &a_bl1_s3_18 { call: "POST /bag-lots/${bl1}/seal-tests", payload: { specimen_index: 3, measured_n_per_15mm: 18.0 }, as: ConvertingOperator, as_user_id: "u-co-1" }
            - &a_bl1_s3_17 { call: "POST /bag-lots/${bl1}/seal-tests", payload: { specimen_index: 3, measured_n_per_15mm: 17.0 }, as: ConvertingOperator, as_user_id: "u-co-1" }
