            - { call: "GET /api/cases/${c1}/escrow-account", as: FinanceOfficer, captures: { esc: "$.data[0].id" } }
            - { call: "POST /api/escrow-accounts/${esc}/fund", payload: { amount_cents: 6090000 }, as: FinanceOfficer, as_user_id: "fo_1" }
            - { call: "POST /api/closing-packages/${pkg}/submit-carrier", payload: {}, as: CaseManager }
            - { call: "POST /api/closing-packages/${pkg}/confirm-ownership", payload: {}, as: CaseManager }
            - { call: "POST /api/_clock/set_current_utc", payload: { to_iso8601: "2026-09-05T00:00:00Z" }, as: PlatformAdmin }
            - { call: "POST /api/escrow-accounts/${esc}/release", payload: {}, as: FinanceOfficer, as_user_id: "fo_1" }
            - { call: "GET /api/cases/${c1}", as: PortfolioManager, captures: { c_v: "$.data.version" } }
            - { call: "POST /api/cases/${c1}/premium-schedules", payload: { expected_case_version: "${c_v}" }, as: PortfolioManager, captures: { sched: "$.data.id" } }
            - { call: "POST /api/_clock/set_current_utc", payload: { to_iso8601: "2026-10-01T00:00:00Z" }, as: PlatformAdmin }
            - { call: "GET /api/portfolios/${pf}", as: PortfolioManager, captures: { pf_v: "$.data.version" } }
            - { call: "POST /api/portfolios/${pf}/valuation-snapshots", payload: { period_start: "2026-09-05", period_end: "2026-10-01", expected_portfolio_version: "${pf_v}" }, as: PortfolioManager, captures: { snap: "$.data.id" } }
