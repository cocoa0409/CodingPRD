      - name: withholding_constants_are_bypassed_when_the_tin_is_on_file
        claim_type: constants_applied
        grounds:
          - calculations.installment_payment_schedule
          - entities.Artist.fields.tin_status
          - entities.PaymentInstallment.fields.withholding_rate
        distinguishing_aspect: |
          WITHHOLDING_RATE_NO_TIN 0.2707 must apply only when tin_status !=
          ON_FILE; with the TIN on file every withholding_rate is 0.0, every
          withholding_cents is 0, net == gross on all three rows and the award's
          scheduled_withholding_cents is 0. An implementation that always applies
          the constant reports 162_420 / 142_118 / 101_513 and fails. The
          OFFSET_DAYS constants [0, 120, 240] are pinned by the three dates.
        test_recipe:
          setup:
            - "CornerMain award accepted at 2026-10-16; the recipient's tin_status is ON_FILE"
          setup_api_calls:
            - *n_clock
            - *n_cycle
            - *n_disc
            - *n_open
            - *n_art
            - *n_app
            - *n_ws1
            - *n_ws2
            - *n_sub
            - *n_clock16
            - *n_close
            - *n_elig
            - *n_pr
            - *n_panel
            - *n_pl1
            - *n_pl2
            - *n_pl3
            - *n_seat1
            - *n_seat2
            - *n_seat3
            - *n_charter
            - *n_round
            - *n_rev1
            - *n_srev1
            - *n_rev2
            - *n_srev2
            - *n_rev3
            - *n_srev3
            - *n_closeround
            - *n_board
            - *n_getpan
            - *n_slate
            - *n_getslot
            - *n_getcyc
            - *n_approve
            - *n_getaw
            - *n_accept
          trigger:
            - { call: "GET /grants/payment-installments", payload: { award_id: "${aw}" }, as: FiscalOfficer, as_user_id: "fiscal-1" }
            - { call: "GET /grants/awards/${aw}", payload: {}, as: FiscalOfficer, as_user_id: "fiscal-1" }
          assert:
            - "total_count == 3 with installment_number 1, 2, 3 and status \"SCHEDULED\""
            - "withholding_rate == 0.0 on all three rows"
            - "withholding_cents == 0 and net_cents == gross_cents on all three rows"
            - "scheduled_date == \"2027-01-01\", \"2027-05-01\" and \"2027-08-29\" respectively"
            - "The award reads scheduled_withholding_cents == 0, total_withholding_cents == 0, undisbursed_gross_cents == 1500000 and final_report_due_at == \"2028-02-29T00:00:00.000Z\""

      - name: installment_split_puts_the_rounding_remainder_in_the_third_row
        claim_type: aggregation
        grounds:
          - calculations.installment_payment_schedule
          - entities.Award.fields.gross_amount_cents
        distinguishing_aspect: |
          SPLIT_1 0.40 and SPLIT_2 0.35 are rounded, and SPLIT_3 is defined as
          the remainder: 600_000 + 525_000 + 375_000 must equal the gross
          1_500_000 exactly. An implementation that computes the third row as
          round(gross * 0.25) happens to agree here, but one that computes all
          three by ratio and drops the residue leaves the sum at 1_499_999 or
          1_500_001 on any gross not divisible by 20 — the assert pins the
          identity, not just the three numbers.
        test_recipe:
          setup:
            - "CornerMain award of 1_500_000 accepted, three SCHEDULED installments on file"
          setup_api_calls:
            - *n_clock
            - *n_cycle
            - *n_disc
            - *n_open
            - *n_art
            - *n_app
            - *n_ws1
            - *n_ws2
            - *n_sub
            - *n_clock16
            - *n_close
            - *n_elig
            - *n_pr
            - *n_panel
            - *n_pl1
            - *n_pl2
            - *n_pl3
            - *n_seat1
            - *n_seat2
            - *n_seat3
            - *n_charter
            - *n_round
            - *n_rev1
            - *n_srev1
            - *n_rev2
            - *n_srev2
            - *n_rev3
            - *n_srev3
            - *n_closeround
            - *n_board
            - *n_getpan
            - *n_slate
            - *n_getslot
            - *n_getcyc
            - *n_approve
            - *n_getaw
            - *n_accept
          trigger:
            - { call: "GET /grants/payment-installments", payload: { award_id: "${aw}" }, as: FiscalOfficer, as_user_id: "fiscal-1" }
          assert:
            - "gross_cents == 600000 for installment_number 1 (round_half_up(1500000 * 0.40))"
            - "gross_cents == 525000 for installment_number 2 (round_half_up(1500000 * 0.35))"
            - "gross_cents == 375000 for installment_number 3 (1500000 - 600000 - 525000)"
            - "The three gross_cents sum to exactly 1500000, matching the award's gross_amount_cents"

      - name: charter_gate_passes_at_exactly_the_seventy_five_readiness_threshold
        claim_type: threshold
        grounds:
          - calculations.panel_readiness_score
          - validations[error_id=ERR_PANEL_NOT_READY]
        distinguishing_aspect: |
          On a 4-seat panel needing NORTH/CENTRAL/SOUTH, two seats covering two
          regions give 100*(2/4)*(2/3) = 33.33 and the charter must fail; adding
          the SOUTH seat gives 100*(3/4)*(3/3) = 75.00 exactly, which must PASS
          because CHARTER_READINESS_MIN is compared with >=. An implementation
          using strict > refuses the second charter, and one that ignores the
          region factor reads 50.00 then 75.00 and passes for the wrong reason —
          the 33.33 literal separates them.
        test_recipe:
          setup:
            - "CornerMain in PANEL_REVIEW with one ELIGIBLE application"
            - "A 4-seat panel requiring NORTH, CENTRAL and SOUTH; NORTH and CENTRAL seated"
          setup_api_calls:
            - *n_clock
            - *n_cycle
            - *n_disc
            - *n_open
            - *n_art
            - *n_app
            - *n_ws1
            - *n_ws2
            - *n_sub
            - *n_clock16
            - *n_close
            - *n_elig
            - *n_pr
            - { call: "POST /grants/panels", payload: { cycle_id: "${cyc}", discipline_category_id: "${disc}", required_seats: 4, required_regions: [NORTH, CENTRAL, SOUTH], deliberation_window_start: "2026-11-01T00:00:00Z", deliberation_window_end: "2026-12-01T00:00:00Z" }, as: ProgramOfficer, as_user_id: "officer-1", captures: { pan4: "$.data.id" } }
            - { call: "POST /grants/panelists", payload: { panel_id: "${pan4}", person_email: "chair.north@example.org", full_name: "Kira Vale", region: NORTH, expertise_codes: [LITERARY_ARTS], is_chair: true }, as: ProgramOfficer, as_user_id: "officer-1", captures: { p4a: "$.data.id" } }
            - { call: "POST /grants/panelists", payload: { panel_id: "${pan4}", person_email: "reader.central@example.org", full_name: "Lev Ostrom", region: CENTRAL, expertise_codes: [LITERARY_ARTS], is_chair: false }, as: ProgramOfficer, as_user_id: "officer-1", captures: { p4b: "$.data.id" } }
            - { call: "POST /grants/panelists/${p4a}/seat", payload: {}, as: ProgramOfficer, as_user_id: "officer-1" }
            - { call: "POST /grants/panelists/${p4b}/seat", payload: {}, as: ProgramOfficer, as_user_id: "officer-1" }
          trigger:
            - { call: "GET /grants/panels/${pan4}", payload: {}, as: ProgramOfficer, as_user_id: "officer-1" }
            - { call: "POST /grants/panels/${pan4}/charter", payload: {}, as: ProgramOfficer, as_user_id: "officer-1" }
            - { call: "POST /grants/panelists", payload: { panel_id: "${pan4}", person_email: "reader.south@example.org", full_name: "Mira Sol", region: SOUTH, expertise_codes: [LITERARY_ARTS], is_chair: false }, as: ProgramOfficer, as_user_id: "officer-1", captures: { p4c: "$.data.id" } }
            - { call: "POST /grants/panelists/${p4c}/seat", payload: {}, as: ProgramOfficer, as_user_id: "officer-1" }
            - { call: "POST /grants/panels/${pan4}/charter", payload: {}, as: ProgramOfficer, as_user_id: "officer-1" }
          assert:
            - "The first read shows seated_count == 2, region_coverage_count == 2 and readiness_score == 33.33"
            - "The first charter returns 409 ERR_PANEL_NOT_READY and the panel stays \"FORMING\""
            - "The third seat response shows the panel at seated_count == 3, region_coverage_count == 3, readiness_score == 75.00"
            - "The second charter returns 200 with status \"CHARTERED\" and assigned_application_count == 1 — 75.00 is admitted by the >= comparison"

