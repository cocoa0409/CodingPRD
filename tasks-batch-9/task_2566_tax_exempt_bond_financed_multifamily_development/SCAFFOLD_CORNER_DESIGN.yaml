          - state_machines.InvestorDelivery.ACCEPTED_to_RECAPTURE_FLAGGED
          - calculations.recapture_exposure
        excluded_because:
          difficulty_instance: noncompliance_finding_cascades_project_then_credit_allocation_then_accepted_delivery
          rationale: |
            The §1.8 transitive_cascade instance already drives the full
            three-level chain from one compliance-report review - project
            RESTRICTED -> NONCOMPLIANT, every ISSUED CreditAllocation ->
            RECAPTURE_PENDING with recapture_amount_cents stamped from
            recapture_exposure, and every ACCEPTED InvestorDelivery ->
            RECAPTURE_FLAGGED - and asserts the untouched siblings, so a second
            cascade test here would only duplicate it.

      - name: compensation_reverses_every_side_effect_of_a_funded_draw
        claim_type: compensation
        grounds:
          - state_machines.DrawRequest.FUNDED_to_VOIDED
