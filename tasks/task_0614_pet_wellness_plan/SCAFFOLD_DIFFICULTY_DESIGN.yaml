        grounds:
          - errors[ERR_NOT_DUE_FOR_BILLING]
          - entities.BillingCycle.fields.period_start
          - entities.BillingCycle.fields.period_end
        distinguishing_aspect: |
          BillingCycle uses adjacency (gap-zero tiling) interval semantics on a different resource entity:
          a second run-epoch on the SAME calendar day produces no new overlapping BillingCycle for an
          already-billed membership (count of BILLED cycles stays 1) — adjacency/no-double-cover, distinct
          from the point-in-interval term rule.
        test_recipe:
          setup:
            - "PLUS membership ENROLLED at 2026-01-01 (anchor day 1); activate created BillingCycle #1"
            - "Run epoch twice on the same day 2026-02-01"
