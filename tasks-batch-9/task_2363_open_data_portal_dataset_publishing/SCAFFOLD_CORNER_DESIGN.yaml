          - calculations.department_compliance_posture
        distinguishing_aspect: "At risk_points 6 the posture is SUSPENDED and the gate becomes unconditional — even a brand-new TIER_1 dataset cannot be screened, which distinguishes this error from the tier-sensitive RESTRICTED variant."
        test_recipe:
          setup:
            - "Logical clock at 2026-08-01T00:00:00Z"
            - "Dataset A 'weekly-traffic-counts' committed as high-value while READY (TIER_1 by AS_DECLARED 75.00) then PUBLISHED, so next_due_at is 2026-08-08T00:00:00Z and the stored tier becomes TIER_3 (AS_OBSERVED 33.60, GRACE_DAYS 14)"
            - "A CRITICAL/PRIVACY issue on A is triaged and ACCEPTED at 2026-08-01, so A is UNDER_REMEDIATION with correction_due_at 2026-08-06T00:00:00Z"
            - "The currency ladder is walked one declared step per sweep: clock 2026-08-20 (12 days overdue) sweeps CURRENT -> AGING, clock 2026-08-25 (17 > 14) sweeps AGING -> STALE, clock 2026-09-06 (29 > 28) sweeps STALE -> BREACHED"
            - "After the last sweep risk_points is 3*1 (breached) + 2*0 (stale) + 2*1 (remediation) + 1*1 (breached correction) = 6, so compliance_posture is SUSPENDED"
            - "A fresh dataset C 'crash-reports-weekly' (public_demand_score 92, policy_value_score 96 → 75.00, TIER_1) is inventoried while the posture is SUSPENDED, which POST /datasets still allows"
