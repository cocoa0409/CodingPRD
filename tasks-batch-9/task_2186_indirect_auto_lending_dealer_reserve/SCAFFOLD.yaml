scenario: "desgin task harder than expert level.!!!!2186. Indirect Auto Lending & Dealer Reserve (indirect auto lender): dealer agreement & program eligibility, application decisioning & tiered rate sheet, dealer participation (reserve) calculation & caps, contract funding & document verification, chargeback of reserve on early payoff/default, dealer performance scorecard & portfolio quality, fair lending analysis of markup, dealer termination & buyback of contracts"
domain_name: indirect-auto-lending-dealer-reserve
api_prefix: /lending

complexity_profile:
  primary_archetype: pricing_engine
  secondary_archetype: compliance_audit
  complexity_layers:
    - optimistic_concurrency
    - cascading_side_effects
    - dual_variant_calculation
    - rate_threshold_triggers
    - derived_field_reconciliation

  entity_topology: flat
  # Peer entities linked by foreign keys declared in the request body. Only four
  # sub-resource URL shapes exist (rate-sheet tiers, contract documents, contract
  # chargeback-events, dealer scorecards); every other relationship is expressed
  # as an FK field plus a filtered list endpoint.

  state_machine_shape: branching
  # Dealer branches (ACTIVE <-> SUSPENDED cycle, TERMINATED sink); CreditApplication
  # is cyclic (CONDITIONED -> RESUBMITTED -> CONDITIONED); RetailContract carries two
  # independent state dimensions (funding_status x reserve_status); BuybackDemand is
  # cyclic (ISSUED/ACKNOWLEDGED <-> DISPUTED); FairLendingReview forks on its finding.

  relationship_patterns:
    - one_to_many          # Dealer -> CreditApplication, RetailContract, ReserveEntry
    - self_referential     # DealerAgreement.supersedes_agreement_id -> DealerAgreement.id
    - cross_aggregate      # RetailContract pins Dealer, DealerAgreement, RateSheetTier
    - polymorphic          # ReserveEntry.contract_id is nullable: dealer-level or contract-level

  role_model: segregation_of_duties
  # The CreditAnalyst user id that decisions an application is barred from funding the
  # resulting contract as a FundingSpecialist; ComplianceOfficer alone may place or
  # release a compliance hold; PortfolioAdmin alone may terminate a dealer.

  consistency_model: immediate

difficulty_level: expert

response_envelope:
  success: |
    { "meta": { "api_request_id": "req_xxx", "api_request_timestamp": "ISO8601" },
      "response_type": "object" | "array", "data": {} }
  error: |
    { "meta": { ... }, "response_type": "error",
      "data": { "error_id": "ERR_XXX", "message": "..." } }
  pagination_fields: ["limit", "offset", "total_count", "has_more"]
  pagination_defaults: { limit: 10, min: 1, max: 100, offset: 0 }

# =============================================================================
# 1.1 Entity-Relationship Table
# =============================================================================
entities:

  - name: Dealer
    parent: null
    common_fields: true
    fields:
      - name: legal_name
        type: string
        source: input
        description: Legal name of the franchised or independent dealership.
        constraints: "1..120 characters, non-blank"
      - name: state_code
        type: string
        source: input
        description: Two-letter US state code where the dealership is licensed.
        constraints: "exactly 2 uppercase letters"
      - name: program_code
        type: string
        source: input
        default: "PS-STANDARD"
        description: Rate-sheet program the dealer buys under; selects which RateSheet applies at decision time.
      - name: funding_line_cents
        type: integer
        source: input
        default: 50000000
        description: Maximum aggregate unpaid principal the lender will carry for this dealer at one time.
        constraints: ">= 0"
      - name: status
        type: enum
        source: system
        default: PROSPECT
        description: Dealer lifecycle state.
        constraints: "one of PROSPECT, ACTIVE, SUSPENDED, TERMINATED"
      - name: compliance_hold
        type: boolean
        source: system
        default: false
        description: True while a fair-lending remediation or a ComplianceOfficer hold is open; blocks decisioning, contract booking and funding.
      - name: suspension_reason
        type: string
        source: system
        default: null
        description: Free-text or sentinel reason recorded on the most recent SUSPEND transition; null while ACTIVE.
      - name: reserve_balance_cents
        type: integer
        source: computed
        default: 0
        description: "Sum of ReserveEntry.amount_cents over every ReserveEntry whose dealer_id equals this Dealer.id (all entry_types, signed). Recomputed on every ledger posting."
      - name: outstanding_principal_cents
        type: integer
        source: computed
        default: 0
        description: "Sum of RetailContract.unpaid_principal_cents over this dealer's contracts whose funding_status == FUNDED, using each contract's currently persisted value (never re-amortized on read). Fully recomputed on funding and on every funding_status transition."
      - name: funded_contract_count
        type: integer
        source: computed
        default: 0
        description: "Count of this dealer's RetailContract rows whose funding_status == FUNDED. Fully recomputed alongside outstanding_principal_cents."
      - name: total_funded_ever_count
        type: integer
        source: system
        default: 0
        description: Monotonic counter incremented by 1 on every successful funding; never decremented.
      - name: early_payoff_count
        type: integer
        source: system
        default: 0
        description: Count of this dealer's contracts that reached PAID_OFF with payoff_months_seasoned < EARLY_PAYOFF_SEASONING_MONTHS.
      - name: default_count
        type: integer
        source: system
        default: 0
        description: Count of this dealer's contracts that reached DEFAULTED.
      - name: repurchase_count
        type: integer
        source: system
        default: 0
        description: Count of this dealer's contracts that reached REPURCHASED through a settled BuybackDemand.
      - name: chargeback_count
        type: integer
        source: system
        default: 0
        description: Count of ReserveEntry rows of entry_type CHARGEBACK posted against this dealer.
      - name: early_payoff_rate_bps
        type: integer
        source: computed
        default: 0
        description: "round_half_up(10000 * early_payoff_count / total_funded_ever_count) when total_funded_ever_count > 0, otherwise 0. Recomputed whenever early_payoff_count or total_funded_ever_count changes."
      - name: latest_scorecard_grade
        type: enum
        source: system
        default: null
        description: Grade of the most recently FINALIZED DealerScorecard for this dealer; null until one is finalized.
        constraints: "one of A, B, C, D, UNRATED, or null"
      - name: scorecard_stale
        type: boolean
        source: system
        default: false
        description: Set true whenever reserve_balance_cents changes after a chargeback posting; cleared to false when any DealerScorecard for this dealer is finalized.

  - name: DealerAgreement
    parent: null
    common_fields: true
    fields:
      - name: dealer_id
        type: string
        source: input
        description: "FK -> Dealer.id; the dealership bound by this agreement."
      - name: supersedes_agreement_id
        type: string
        source: input
        default: null
        description: "FK -> DealerAgreement.id; the prior agreement this one replaces when countersigned. Null for a dealer's first agreement or for a non-superseding successor."
      - name: participation_method
        type: enum
        source: input
        description: How dealer participation (reserve) is earned on contracts booked under this agreement.
        constraints: "one of RATE_PARTICIPATION, FLAT_FEE"
      - name: max_participation_bps
        type: integer
        source: input
        description: Contractual cap on the rate markup the dealer may retain, in basis points.
        constraints: "0..250 inclusive"
      - name: flat_fee_cap_cents
        type: integer
        source: input
        default: 0
        description: Per-contract cap applied when participation_method == FLAT_FEE; ignored under RATE_PARTICIPATION.
        constraints: ">= 0"
      - name: chargeback_window_days
        type: integer
        source: input
        default: 360
        description: Number of days after funding during which reserve is subject to pro-rata chargeback. Divided by 30 to yield window_months.
        constraints: "multiple of 30, between 60 and 720 inclusive"
      - name: effective_from
        type: datetime
        source: input
        description: Inclusive start of the agreement's in-force window (ISO 8601 UTC).
      - name: effective_to
        type: datetime
        source: input
        description: Inclusive end of the agreement's in-force window (ISO 8601 UTC); must be strictly after effective_from.
      - name: status
        type: enum
        source: system
        default: PENDING_COUNTERSIGN
        description: Agreement lifecycle state.
        constraints: "one of PENDING_COUNTERSIGN, ACTIVE, SUPERSEDED, TERMINATED"
      - name: countersigned_at
        type: datetime
        source: system
        default: null
        description: Logical-clock instant at which the DealerPrincipal countersigned; null while PENDING_COUNTERSIGN.
      - name: signer_name
        type: string
        source: system
        default: null
        description: Name supplied on the countersign call; null while PENDING_COUNTERSIGN.

  - name: RateSheet
    parent: null
    common_fields: true
    fields:
      - name: program_code
        type: string
        source: input
        description: Program this sheet prices; matched against Dealer.program_code at decision time.
      - name: effective_from
        type: datetime
        source: input
        description: Inclusive start of the sheet's half-open effectivity window (ISO 8601 UTC).
      - name: effective_to
        type: datetime
        source: input
        description: Exclusive end of the sheet's half-open effectivity window (ISO 8601 UTC); must be strictly after effective_from.
      - name: status
        type: enum
        source: system
        default: DRAFT
        description: Rate-sheet lifecycle state.
        constraints: "one of DRAFT, PUBLISHED, RETIRED"
      - name: tier_count
        type: integer
        source: computed
        default: 0
        description: Count of RateSheetTier rows whose rate_sheet_id equals this RateSheet.id.
      - name: published_at
        type: datetime
        source: system
        default: null
        description: Logical-clock instant of publication; null while DRAFT.

  - name: RateSheetTier
    parent: null
    common_fields: false
    fields:
      - name: rate_sheet_id
        type: string
        source: input
        description: "FK -> RateSheet.id; the sheet this tier row belongs to."
      - name: tier_code
        type: enum
        source: input
        description: Credit tier label. Tier ordering for demotion is by min_credit_score DESC, tie-broken by tier_code ASC.
        constraints: "one of T1, T2, T3; unique per rate_sheet_id"
      - name: min_credit_score
        type: integer
        source: input
        description: Inclusive lower bound of the tier's credit-score band.
        constraints: "300..900"
      - name: max_credit_score
        type: integer
        source: input
        description: Inclusive upper bound of the tier's credit-score band.
        constraints: "300..900, >= min_credit_score"
      - name: max_ltv_pct
        type: integer
        source: input
        description: Maximum loan-to-value percentage tolerated at this tier before a one-step demotion.
        constraints: "50..150"
      - name: max_term_months
        type: integer
        source: input
        description: Maximum contract term tolerated at this tier before a one-step demotion.
        constraints: "12..96"
      - name: buy_rate_apr_bps
        type: integer
        source: input
        description: The lender's buy rate for this tier, in basis points of APR.
        constraints: "0..3000"
      - name: advance_rate_pct
        type: integer
        source: input
        description: Maximum percentage of collateral_value_cents the lender will advance at this tier.
        constraints: "50..150"
      - name: acquisition_fee_cents
        type: integer
        source: input
        description: Flat fee deducted from dealer proceeds at funding for contracts booked at this tier.
        constraints: ">= 0"

  - name: CreditApplication
    parent: null
    common_fields: true
    fields:
      - name: dealer_id
        type: string
        source: input
        description: "FK -> Dealer.id; the originating dealership."
      - name: agreement_id
        type: string
        source: system
        default: null
        description: "FK -> DealerAgreement.id; the in-force agreement pinned at the moment of the first APPROVE or CONDITION decision. Null until then."
      - name: rate_sheet_id
        type: string
        source: system
        default: null
        description: "FK -> RateSheet.id; the effective rate sheet pinned at decision time. Null until then."
      - name: assigned_tier_id
        type: string
        source: system
        default: null
        description: "FK -> RateSheetTier.id; the tier row selected by the tier_assignment_and_buy_rate calculation. Null until an APPROVE decision succeeds."
      - name: applicant_reference
        type: string
        source: input
        description: Dealer-supplied opaque reference for the retail applicant (no personally identifying data is stored).
        constraints: "1..64 characters"
      - name: monitoring_cohort
        type: enum
        source: input
        description: Regulatory monitoring cohort label used only by fair-lending markup analysis.
        constraints: "one of CONTROL, MONITORED"
      - name: credit_score
        type: integer
        source: input
        description: Applicant credit bureau score used for tier banding.
        constraints: "300..900"
      - name: monthly_income_cents
        type: integer
        source: input
        description: Verified gross monthly income in cents.
        constraints: "> 0"
      - name: monthly_debt_cents
        type: integer
        source: input
        description: Existing monthly debt service in cents.
        constraints: ">= 0"
      - name: amount_financed_cents
        type: integer
        source: input
        description: Requested amount financed in cents.
        constraints: "> 0"
      - name: collateral_value_cents
        type: integer
        source: input
        description: Book value of the vehicle collateral in cents.
        constraints: "> 0"
      - name: term_months
        type: integer
        source: input
        description: Requested contract term in months.
        constraints: "12..96"
      - name: vehicle_model_year
        type: integer
        source: input
        description: Model year of the collateral vehicle.
        constraints: "1990..2030"
      - name: requested_apr_bps
        type: integer
        source: input
        description: APR in basis points the dealer intends to quote the retail customer.
        constraints: "0..3600"
      - name: ltv_pct
        type: number
        source: computed
        default: 0
        description: "round_half_up(amount_financed_cents * 100 / collateral_value_cents, 2). Recomputed on submission and on every resubmission."
      - name: dti_pct
        type: number
        source: computed
        default: 0
        description: "round_half_up(monthly_debt_cents * 100 / monthly_income_cents, 2). Recomputed on submission and on every resubmission."
      - name: base_tier_code
        type: enum
        source: computed
        default: null
        description: Tier whose credit-score band contains credit_score, before any demotion. Null until a decision runs.
        constraints: "one of T1, T2, T3, or null"
      - name: demotion_count
        type: integer
        source: computed
        default: 0
        description: Number of one-step tier demotions applied by the tier_assignment_and_buy_rate calculation (0, 1 or 2).
      - name: assigned_tier_code
        type: enum
        source: computed
        default: null
        description: Tier actually assigned after demotion; mirrors the tier_code of assigned_tier_id.
        constraints: "one of T1, T2, T3, or null"
      - name: buy_rate_apr_bps
        type: integer
        source: computed
        default: null
        description: buy_rate_apr_bps of the assigned tier, pinned at APPROVE.
      - name: max_contract_apr_bps
        type: integer
        source: computed
        default: null
        description: "buy_rate_apr_bps + min(agreement.max_participation_bps, PROGRAM_MAX_MARKUP_BPS). Pinned at APPROVE."
      - name: status
        type: enum
        source: system
        default: SUBMITTED
        description: Application lifecycle state.
        constraints: "one of SUBMITTED, CONDITIONED, RESUBMITTED, APPROVED, DECLINED, ON_HOLD, WITHDRAWN, CONTRACTED"
      - name: held_from_status
        type: enum
        source: system
        default: null
        description: Status the application occupied immediately before a dealer suspension moved it to ON_HOLD; restored verbatim on dealer reinstatement, then cleared to null.
        constraints: "one of SUBMITTED, CONDITIONED, RESUBMITTED, APPROVED, or null"
      - name: resubmission_count
        type: integer
        source: system
        default: 0
        description: Number of successful resubmit calls; capped by MAX_RESUBMISSIONS.
      - name: stipulation_count
        type: integer
        source: system
        default: 0
        description: Stipulations attached by the most recent CONDITION decision; a value > 0 adds INCOME_VERIFICATION to the contract's required document set.
      - name: decisioned_by_user_id
        type: string
        source: system
        default: null
        description: X-User-ID of the CreditAnalyst who issued the most recent APPROVE, CONDITION or DECLINE decision. Barred from funding the resulting contract.
      - name: decisioned_at
        type: datetime
        source: system
        default: null
        description: Logical-clock instant of the most recent decision; starts the funding window.
      - name: decline_reason
        type: string
        source: system
        default: null
        description: Sentinel reason recorded when status becomes DECLINED.

  - name: RetailContract
    parent: null
    common_fields: true
    fields:
      - name: application_id
        type: string
        source: input
        description: "FK -> CreditApplication.id; the approved application this contract books."
      - name: dealer_id
        type: string
        source: system
        description: "FK -> Dealer.id; copied from the application at creation."
      - name: agreement_id
        type: string
        source: system
        description: "FK -> DealerAgreement.id; copied from the application at creation and used for every reserve and chargeback computation on this contract, even if the agreement later becomes SUPERSEDED."
      - name: contract_apr_bps
        type: integer
        source: input
        description: APR actually contracted with the retail customer, in basis points.
        constraints: ">= application.buy_rate_apr_bps and <= application.max_contract_apr_bps"
      - name: contract_date
        type: datetime
        source: input
        description: Date the retail installment contract was signed at the dealership.
      - name: amount_financed_cents
        type: integer
        source: computed
        description: Copied from CreditApplication.amount_financed_cents at creation.
      - name: term_months
        type: integer
        source: computed
        description: Copied from CreditApplication.term_months at creation.
      - name: buy_rate_apr_bps
        type: integer
        source: computed
        description: Copied from CreditApplication.buy_rate_apr_bps at creation.
      - name: markup_bps
        type: integer
        source: computed
        description: "contract_apr_bps - buy_rate_apr_bps, computed at creation."
      - name: monitoring_cohort
        type: enum
        source: computed
        description: Copied from CreditApplication.monitoring_cohort at creation.
        constraints: "one of CONTROL, MONITORED"
      - name: acquisition_fee_cents
        type: integer
        source: computed
        description: Copied from the assigned RateSheetTier.acquisition_fee_cents at creation.
      - name: required_doc_types
        type: array
        source: computed
        description: "BASE_REQUIRED_DOC_TYPES, plus INCOME_VERIFICATION when the application's stipulation_count > 0. Pinned at creation."
      - name: funding_status
        type: enum
        source: system
        default: PENDING_DOCS
        description: First state dimension - document and funding lifecycle.
        constraints: "one of PENDING_DOCS, DOCS_VERIFIED, FUNDED, PAID_OFF, DEFAULTED, REPURCHASED"
      - name: reserve_status
        type: enum
        source: system
        default: NONE
        description: Second, independent state dimension - dealer participation lifecycle.
        constraints: "one of NONE, ACCRUED, HELD, CHARGED_BACK, EARNED"
      - name: verified_doc_count
        type: integer
        source: system
        default: 0
        description: Count of this contract's ContractDocument rows whose status == VERIFIED and whose doc_type is in required_doc_types.
      - name: doc_defect_count
        type: integer
        source: system
        default: 0
        description: Monotonic count of REJECT verifications ever recorded against this contract's documents; never decremented.
      - name: funded_at
        type: datetime
        source: system
        default: null
        description: funding_date supplied on the funding call; anchors months_seasoned arithmetic.
      - name: funded_by_user_id
        type: string
        source: system
        default: null
        description: X-User-ID of the FundingSpecialist who funded the contract.
      - name: reserve_accrued_cents
        type: integer
        source: computed
        default: 0
        description: Participation reserve accrued at funding by the dealer_reserve_amount calculation, scheduled_yield variant.
      - name: incentive_accrued_cents
        type: integer
        source: computed
        default: 0
        description: Volume incentive accrued at funding by the dealer_reserve_amount calculation.
      - name: dealer_proceeds_cents
        type: integer
        source: computed
        default: 0
        description: "amount_financed_cents - acquisition_fee_cents + reserve_accrued_cents + incentive_accrued_cents, computed once at funding."
      - name: unpaid_principal_cents
        type: integer
        source: computed
        default: 0
        description: "Set to amount_financed_cents at funding; recomputed by the straight-line formula at each funding_status transition; set to 0 on PAID_OFF, DEFAULTED or REPURCHASED after the dealer roll-up has consumed the recomputed value."
      - name: months_seasoned
        type: integer
        source: computed
        default: 0
        description: "floor(days_between(funded_at, event_date) / 30), recomputed on each chargeback event and buyback issuance; 0 before funding."
      - name: payoff_months_seasoned
        type: integer
        source: system
        default: null
        description: months_seasoned captured at the instant funding_status became PAID_OFF; null otherwise.

  - name: ContractDocument
    parent: null
    common_fields: true
    fields:
      - name: contract_id
        type: string
        source: input
        description: "FK -> RetailContract.id; the contract this document belongs to."
      - name: doc_type
        type: enum
        source: input
        description: Funding-package document type.
        constraints: "one of RETAIL_INSTALLMENT_CONTRACT, TITLE_APPLICATION, INSURANCE_BINDER, INCOME_VERIFICATION; unique per contract_id"
      - name: document_reference
        type: string
        source: input
        description: Dealer-supplied imaging reference for the scanned document.
        constraints: "1..64 characters"
      - name: status
        type: enum
        source: system
        default: RECEIVED
        description: Verification state of this single document.
        constraints: "one of RECEIVED, VERIFIED, REJECTED"
      - name: defect_code
        type: string
        source: system
        default: null
        description: Sentinel defect recorded by the most recent REJECT verification; cleared to null on a subsequent VERIFY.
      - name: verified_by_user_id
        type: string
        source: system
        default: null
        description: X-User-ID of the FundingSpecialist who last acted on this document.
      - name: verified_at
        type: datetime
        source: system
        default: null
        description: Logical-clock instant of the most recent verification action.

  - name: ReserveEntry
    parent: null
    common_fields: false
    fields:
      - name: dealer_id
        type: string
        source: input
        description: "FK -> Dealer.id; the dealer whose reserve ledger this entry moves."
      - name: contract_id
        type: string
        source: input
        default: null
        description: "FK -> RetailContract.id; the contract the entry is attributable to. Null for dealer-level entries (MANUAL_ADJUSTMENT, REMEDIATION)."
      - name: entry_type
        type: enum
        source: system
        description: Ledger entry classification.
        constraints: "one of PARTICIPATION_ACCRUAL, INCENTIVE_ACCRUAL, CHARGEBACK, BUYBACK_OFFSET, REMEDIATION, MANUAL_ADJUSTMENT"
      - name: amount_cents
        type: integer
        source: input
        description: Signed movement in cents; positive credits the dealer, negative claws back.
      - name: reason
        type: string
        source: input
        description: Sentinel or free-text explanation stored with the entry.
        constraints: "1..120 characters"
      - name: balance_after_cents
        type: integer
        source: computed
        description: Dealer.reserve_balance_cents immediately after this entry was posted.

  - name: ChargebackEvent
    parent: null
    common_fields: false
    fields:
      - name: contract_id
        type: string
        source: input
        description: "FK -> RetailContract.id; the funded contract that paid off early or defaulted."
      - name: event_type
        type: enum
        source: input
        description: Portfolio event that triggers the reserve chargeback test.
        constraints: "one of EARLY_PAYOFF, DEFAULT"
      - name: event_date
        type: datetime
        source: input
        description: Date the payoff or default was recorded; must be >= the contract's funded_at.
      - name: months_seasoned
        type: integer
        source: computed
        description: "floor(days_between(contract.funded_at, event_date) / 30)."
      - name: window_months
        type: integer
        source: computed
        description: "agreement.chargeback_window_days / 30, taken from the contract's pinned agreement_id."
      - name: within_window
        type: boolean
        source: computed
        description: "True when months_seasoned < window_months; false otherwise."
      - name: participation_chargeback_cents
        type: integer
        source: computed
        description: Pro-rata clawback of the contract's PARTICIPATION_ACCRUAL entry, rounded on its own before summing.
      - name: incentive_chargeback_cents
        type: integer
        source: computed
        description: Pro-rata clawback of the contract's INCENTIVE_ACCRUAL entry, rounded on its own before summing.
      - name: chargeback_total_cents
        type: integer
        source: computed
        description: "participation_chargeback_cents + incentive_chargeback_cents, capped at the contract's net posted accruals."
      - name: earned_to_date_reserve_cents
        type: integer
        source: computed
        description: Disclosure-only value of the dealer_reserve_amount calculation's earned_to_date variant at months_seasoned; never posted to the ledger and deliberately unequal to reserve_accrued_cents - participation_chargeback_cents.

  - name: DealerScorecard
    parent: null
    common_fields: true
    fields:
      - name: dealer_id
        type: string
        source: input
        description: "FK -> Dealer.id; the scored dealership."
      - name: period_start
        type: datetime
        source: input
        description: Inclusive start of the scoring window (ISO 8601 UTC).
      - name: period_end
        type: datetime
        source: input
        description: Exclusive end of the scoring window (ISO 8601 UTC); must be strictly after period_start.
      - name: basis
        type: enum
        source: input
        description: Which population variant of dealer_scorecard_composite to run.
        constraints: "one of TRAILING_WINDOW, INCEPTION_TO_DATE"
      - name: population_count
        type: integer
        source: computed
        default: 0
        description: Number of contracts in the variant's population.
      - name: default_rate_bps
        type: integer
        source: computed
        default: 0
        description: "round_half_up(10000 * defaulted_count / population_count); 0 when population_count == 0."
      - name: early_payoff_rate_bps
        type: integer
        source: computed
        default: 0
        description: "round_half_up(10000 * early_payoff_count / population_count); 0 when population_count == 0."
      - name: doc_defect_rate_bps
        type: integer
        source: computed
        default: 0
        description: "round_half_up(10000 * defect_contract_count / population_count); 0 when population_count == 0."
      - name: avg_markup_bps
        type: integer
        source: computed
        default: 0
        description: "round_half_up(sum(markup_bps) / population_count); 0 when population_count == 0."
      - name: composite_score
        type: integer
        source: computed
        default: null
        description: Weighted 0..1000 score; null when population_count == 0.
      - name: grade
        type: enum
        source: computed
        default: UNRATED
        description: Letter grade banded from composite_score; UNRATED when population_count == 0.
        constraints: "one of A, B, C, D, UNRATED"
      - name: status
        type: enum
        source: system
        default: DRAFT
        description: Scorecard lifecycle state.
        constraints: "one of DRAFT, FINALIZED"
      - name: finalized_at
        type: datetime
        source: system
        default: null
        description: Logical-clock instant of finalization; null while DRAFT.

  - name: FairLendingReview
    parent: null
    common_fields: true
    fields:
      - name: dealer_id
        type: string
        source: input
        description: "FK -> Dealer.id; the dealership whose markup distribution is reviewed."
      - name: window_start
        type: datetime
        source: input
        description: Inclusive start of the review window over funded_at (ISO 8601 UTC).
      - name: window_end
        type: datetime
        source: input
        description: Exclusive end of the review window over funded_at (ISO 8601 UTC); must be strictly after window_start.
      - name: population_count
        type: integer
        source: computed
        description: Number of contracts in the review population snapshot.
      - name: benchmark_markup_bps
        type: integer
        source: computed
        description: Dollar-weighted mean markup over the whole population, computed once at review creation and never recomputed.
      - name: control_avg_markup_bps
        type: integer
        source: computed
        description: Unweighted mean markup over population contracts whose monitoring_cohort == CONTROL.
      - name: monitored_avg_markup_bps
        type: integer
        source: computed
        description: Unweighted mean markup over population contracts whose monitoring_cohort == MONITORED.
      - name: disparity_bps
        type: integer
        source: computed
        description: "monitored_avg_markup_bps - control_avg_markup_bps (signed)."
      - name: finding
        type: enum
        source: computed
        description: Review outcome banded from disparity_bps against DISPARITY_THRESHOLD_BPS.
        constraints: "one of WITHIN_TOLERANCE, EXCEEDS_THRESHOLD"
      - name: remediation_pool_cents
        type: integer
        source: computed
        description: Sum of per-contract remediation amounts over MONITORED contracts; 0 when finding == WITHIN_TOLERANCE.
      - name: status
        type: enum
        source: system
        default: DRAFT
        description: Review lifecycle state.
        constraints: "one of DRAFT, PUBLISHED, REMEDIATION_ORDERED, CLOSED"
      - name: published_at
        type: datetime
        source: system
        default: null
        description: Logical-clock instant of publication; null while DRAFT.
      - name: closed_at
        type: datetime
        source: system
        default: null
        description: Logical-clock instant of closure; null until CLOSED.

  - name: BuybackDemand
    parent: null
    common_fields: true
    fields:
      - name: contract_id
        type: string
        source: input
        description: "FK -> RetailContract.id; the contract the lender demands the dealer repurchase."
      - name: dealer_id
        type: string
        source: system
        description: "FK -> Dealer.id; copied from the contract at issuance."
      - name: reason
        type: enum
        source: input
        description: Grounds for the repurchase demand.
        constraints: "one of DOC_DEFECT, EARLY_DEFAULT, FRAUD, DEALER_TERMINATION"
      - name: status
        type: enum
        source: system
        default: ISSUED
        description: Demand lifecycle state.
        constraints: "one of ISSUED, ACKNOWLEDGED, DISPUTED, SETTLED, WITHDRAWN"
      - name: unpaid_principal_cents
        type: integer
        source: computed
        description: Contract unpaid principal snapshot taken at issuance by the buyback_settlement_amount calculation.
      - name: reserve_offset_cents
        type: integer
        source: computed
        description: Net posted reserve for the contract at issuance; clawed back on settlement.
      - name: admin_fee_cents
        type: integer
        source: computed
        description: BUYBACK_ADMIN_FEE_CENTS, snapshot at issuance.
      - name: buyback_amount_cents
        type: integer
        source: computed
        description: "unpaid_principal_cents + reserve_offset_cents + admin_fee_cents, snapshot at issuance and used verbatim at settlement."
      - name: dispute_reason
        type: string
        source: system
        default: null
        description: Reason supplied on the most recent DISPUTE action; retained after the dispute is resolved.
      - name: settled_at
        type: datetime
        source: system
        default: null
        description: settlement_date supplied on the SETTLE action; null otherwise.

# =============================================================================
# 1.2 State Machine Table
# =============================================================================
state_machines:

  - entity: Dealer
    initial_state: PROSPECT
    terminal_states: [TERMINATED]
    transitions:
      - from: PROSPECT
        to: ACTIVE
        trigger: "POST /lending/dealer-agreements/{id}/countersign (first agreement countersigned for this dealer)"
        actor: DealerPrincipal
        preconditions:
          - "dealer.status == PROSPECT"
          - "agreement.status == PENDING_COUNTERSIGN"
          - "agreement.dealer_id == X-User-ID"
        side_effects:
          - "agreement.status := ACTIVE; agreement.countersigned_at := current clock; agreement.signer_name := signer_name"
          - "dealer.status := ACTIVE"
          - "increments Dealer.version by 1"
        note: "Program eligibility begins only when a countersigned agreement exists."
      - from: ACTIVE
        to: SUSPENDED
        trigger: "POST /lending/dealers/{id}/status with action=SUSPEND"
        actor: PortfolioAdmin
        preconditions:
          - "dealer.status == ACTIVE"
        side_effects:
          - "dealer.suspension_reason := reason (or 'MANUAL_SUSPENSION' when omitted)"
          - "every CreditApplication of this dealer whose status is in {SUBMITTED, CONDITIONED, RESUBMITTED, APPROVED}: held_from_status := status; status := ON_HOLD"
          - "increments Dealer.version by 1"
      - from: ACTIVE
        to: SUSPENDED
        trigger: "system: Dealer.early_payoff_rate_bps recomputation after a PAID_OFF transition crosses the probation threshold"
        actor: system
        preconditions:
          - "dealer.status == ACTIVE"
          - "dealer.total_funded_ever_count >= PROBATION_MIN_FUNDED_COUNT (2)"
          - "dealer.early_payoff_rate_bps >= PROBATION_EARLY_PAYOFF_RATE_BPS (3000)"
        side_effects:
          - "dealer.suspension_reason := 'AUTO_EARLY_PAYOFF_RATE'"
          - "every CreditApplication of this dealer whose status is in {SUBMITTED, CONDITIONED, RESUBMITTED, APPROVED}: held_from_status := status; status := ON_HOLD"
          - "increments Dealer.version by 1"
        note: "Link 3 of the early-payoff cascade; fires inside the same request as the chargeback event."
      - from: ACTIVE
        to: SUSPENDED
        trigger: "system: DealerScorecard finalization yields grade D"
        actor: system
        preconditions:
          - "dealer.status == ACTIVE"
          - "scorecard.grade == D"
        side_effects:
          - "dealer.suspension_reason := 'AUTO_SCORECARD_GRADE_D'"
          - "every CreditApplication of this dealer whose status is in {SUBMITTED, CONDITIONED, RESUBMITTED, APPROVED}: held_from_status := status; status := ON_HOLD"
          - "increments Dealer.version by 1"
      - from: SUSPENDED
        to: ACTIVE
        trigger: "POST /lending/dealers/{id}/status with action=REINSTATE"
        actor: PortfolioAdmin
        preconditions:
          - "dealer.status == SUSPENDED"
          - "dealer.compliance_hold == false"
          - "no FairLendingReview of this dealer has status == REMEDIATION_ORDERED"
        side_effects:
          - "dealer.suspension_reason := null"
          - "every CreditApplication of this dealer whose status == ON_HOLD: status := held_from_status; held_from_status := null"
          - "increments Dealer.version by 1"
        note: "Cycle: ACTIVE -> SUSPENDED -> ACTIVE."
      - from: ACTIVE
        to: TERMINATED
        trigger: "POST /lending/dealers/{id}/status with action=TERMINATE"
        actor: PortfolioAdmin
        preconditions:
          - "dealer.status in {ACTIVE, SUSPENDED}"
        side_effects:
          - "cascade link 1: dealer.status := TERMINATED; dealer.suspension_reason := reason (or 'TERMINATION')"
          - "cascade link 2 (caused by link 1): every DealerAgreement of this dealer whose status is in {PENDING_COUNTERSIGN, ACTIVE} transitions to TERMINATED"
          - "cascade link 3 (caused by link 2): every CreditApplication pinned to a now-TERMINATED agreement, or belonging to this dealer with agreement_id == null, whose status is in {SUBMITTED, CONDITIONED, RESUBMITTED, APPROVED, ON_HOLD} transitions to WITHDRAWN"
          - "cascade link 4 (caused by link 2): for every RetailContract of this dealer with funding_status == FUNDED and months_seasoned < window_months, a BuybackDemand is issued with reason DEALER_TERMINATION, processed in ascending RetailContract.funded_at order, tie-broken by ascending RetailContract.created_at"
          - "cascade link 5 (caused by link 4): each issued demand moves its contract reserve_status ACCRUED -> HELD"
          - "increments Dealer.version by 1"
      - from: SUSPENDED
        to: TERMINATED
        trigger: "POST /lending/dealers/{id}/status with action=TERMINATE"
        actor: PortfolioAdmin
        preconditions:
          - "dealer.status == SUSPENDED"
        side_effects:
          - "identical cascade links 1 through 5 as the ACTIVE -> TERMINATED transition"
          - "increments Dealer.version by 1"

  - entity: DealerAgreement
    initial_state: PENDING_COUNTERSIGN
    terminal_states: [TERMINATED]
    transitions:
      - from: PENDING_COUNTERSIGN
        to: ACTIVE
        trigger: "POST /lending/dealer-agreements/{id}/countersign"
        actor: DealerPrincipal
        preconditions:
          - "agreement.status == PENDING_COUNTERSIGN"
          - "agreement.dealer_id == X-User-ID"
          - "dealer.status in {PROSPECT, ACTIVE, SUSPENDED}"
        side_effects:
          - "agreement.countersigned_at := current clock; agreement.signer_name := signer_name"
          - "when supersedes_agreement_id is not null: that agreement transitions ACTIVE -> SUPERSEDED and its effective_to is truncated to (this.effective_from - 1 day)"
          - "when dealer.status == PROSPECT: dealer.status := ACTIVE"
          - "increments Dealer.version by 1"
      - from: ACTIVE
        to: SUPERSEDED
        trigger: "system: a successor agreement whose supersedes_agreement_id points at this row is countersigned"
        actor: system
        preconditions:
          - "agreement.status == ACTIVE"
          - "successor.dealer_id == agreement.dealer_id"
          - "successor.effective_from > agreement.effective_from"
        side_effects:
          - "agreement.effective_to := successor.effective_from minus 1 day"
        note: "Contracts already booked keep their pinned agreement_id and continue to use this row's chargeback_window_days and max_participation_bps."
      - from: PENDING_COUNTERSIGN
        to: TERMINATED
        trigger: "system: owning dealer transitions to TERMINATED"
        actor: system
        preconditions:
          - "dealer.status == TERMINATED"
        side_effects:
          - "no ledger movement"
      - from: ACTIVE
        to: TERMINATED
        trigger: "system: owning dealer transitions to TERMINATED"
        actor: system
        preconditions:
          - "dealer.status == TERMINATED"
        side_effects:
          - "triggers the withdrawal of applications pinned to this agreement and the issuance of DEALER_TERMINATION buyback demands for its seasoning-eligible funded contracts"

  - entity: RateSheet
    initial_state: DRAFT
    terminal_states: [RETIRED]
    transitions:
      - from: DRAFT
        to: PUBLISHED
        trigger: "POST /lending/rate-sheets/{id}/publish"
        actor: PortfolioAdmin
        preconditions:
          - "rate_sheet.status == DRAFT"
          - "rate_sheet.tier_count >= 1"
          - "no other RateSheet with the same program_code and status == PUBLISHED has a half-open window [effective_from, effective_to) intersecting this sheet's window; intersection means existing.effective_from < this.effective_to AND this.effective_from < existing.effective_to"
        side_effects:
          - "rate_sheet.published_at := current clock"
          - "every other RateSheet with the same program_code, status == PUBLISHED and effective_to <= current clock transitions PUBLISHED -> RETIRED, processed in ascending effective_from order, tie-broken by ascending created_at"
      - from: PUBLISHED
        to: RETIRED
        trigger: "system: a later sheet for the same program_code is published while this sheet's effective_to is at or before the current clock"
        actor: system
        preconditions:
          - "rate_sheet.status == PUBLISHED"
          - "rate_sheet.effective_to <= current clock"
        side_effects:
          - "applications already decisioned keep their pinned rate_sheet_id and assigned_tier_id"

  - entity: CreditApplication
    initial_state: SUBMITTED
    terminal_states: [DECLINED, WITHDRAWN, CONTRACTED]
    transitions:
      - from: SUBMITTED
        to: APPROVED
        trigger: "POST /lending/applications/{id}/decision with outcome=APPROVE"
        actor: CreditAnalyst
        preconditions:
          - "application.status in {SUBMITTED, RESUBMITTED}"
          - "dealer.status == ACTIVE"
          - "dealer.compliance_hold == false"
          - "an in-force DealerAgreement exists: status == ACTIVE and effective_from <= current clock <= effective_to"
          - "an effective RateSheet exists: status == PUBLISHED, program_code == dealer.program_code, effective_from <= current clock < effective_to"
          - "the tier_assignment_and_buy_rate calculation yields a tier and dti_pct <= MAX_DTI_PCT"
        side_effects:
          - "application.agreement_id, rate_sheet_id, assigned_tier_id, base_tier_code, demotion_count, assigned_tier_code, buy_rate_apr_bps, max_contract_apr_bps := outputs of tier_assignment_and_buy_rate"
          - "application.decisioned_by_user_id := X-User-ID; application.decisioned_at := current clock"
      - from: RESUBMITTED
        to: APPROVED
        trigger: "POST /lending/applications/{id}/decision with outcome=APPROVE"
        actor: CreditAnalyst
        preconditions:
          - "identical to the SUBMITTED -> APPROVED preconditions"
        side_effects:
          - "identical to the SUBMITTED -> APPROVED side effects; stipulation_count from the earlier CONDITION decision is retained"
      - from: SUBMITTED
        to: CONDITIONED
        trigger: "POST /lending/applications/{id}/decision with outcome=CONDITION"
        actor: CreditAnalyst
        preconditions:
          - "application.status in {SUBMITTED, RESUBMITTED}"
          - "dealer.status == ACTIVE"
          - "dealer.compliance_hold == false"
          - "an in-force DealerAgreement exists"
        side_effects:
          - "application.stipulation_count := stipulation_count from the request (default 1)"
          - "application.agreement_id := the in-force agreement id"
          - "application.decisioned_by_user_id := X-User-ID; application.decisioned_at := current clock"
      - from: RESUBMITTED
        to: CONDITIONED
        trigger: "POST /lending/applications/{id}/decision with outcome=CONDITION"
        actor: CreditAnalyst
        preconditions:
          - "identical to the SUBMITTED -> CONDITIONED preconditions"
        side_effects:
          - "identical to the SUBMITTED -> CONDITIONED side effects"
        note: "Closes the revision cycle CONDITIONED -> RESUBMITTED -> CONDITIONED."
      - from: CONDITIONED
        to: RESUBMITTED
        trigger: "POST /lending/applications/{id}/resubmit"
        actor: DealerPrincipal
        preconditions:
          - "application.status == CONDITIONED"
          - "application.resubmission_count < MAX_RESUBMISSIONS (2)"
          - "application.dealer_id == X-User-ID"
        side_effects:
          - "supplied fields overwrite credit_score, amount_financed_cents, collateral_value_cents, term_months, requested_apr_bps; omitted fields are left unchanged"
          - "application.resubmission_count += 1"
          - "application.ltv_pct and dti_pct are recomputed from the merged field values"
      - from: SUBMITTED
        to: DECLINED
        trigger: "POST /lending/applications/{id}/decision with outcome=DECLINE"
        actor: CreditAnalyst
        preconditions:
          - "application.status in {SUBMITTED, RESUBMITTED, CONDITIONED}"
          - "dealer.status == ACTIVE"
          - "dealer.compliance_hold == false"
        side_effects:
          - "application.decline_reason := decision_note (or 'ANALYST_DECLINE' when omitted)"
          - "application.decisioned_by_user_id := X-User-ID; application.decisioned_at := current clock"
      - from: RESUBMITTED
        to: DECLINED
        trigger: "POST /lending/applications/{id}/decision with outcome=DECLINE"
        actor: CreditAnalyst
        preconditions:
          - "identical to the SUBMITTED -> DECLINED preconditions"
        side_effects:
          - "identical to the SUBMITTED -> DECLINED side effects"
      - from: CONDITIONED
        to: DECLINED
        trigger: "POST /lending/applications/{id}/decision with outcome=DECLINE"
        actor: CreditAnalyst
        preconditions:
          - "identical to the SUBMITTED -> DECLINED preconditions"
        side_effects:
          - "identical to the SUBMITTED -> DECLINED side effects"
      - from: APPROVED
        to: CONTRACTED
        trigger: "POST /lending/contracts"
        actor: DealerPrincipal
        preconditions:
          - "application.status == APPROVED"
          - "dealer.status == ACTIVE"
          - "dealer.compliance_hold == false"
          - "contract_apr_bps between application.buy_rate_apr_bps and application.max_contract_apr_bps inclusive"
          - "amount_financed_cents <= round_half_up(collateral_value_cents * assigned_tier.advance_rate_pct / 100)"
        side_effects:
          - "a RetailContract is created in funding_status PENDING_DOCS and reserve_status NONE"
      - from: SUBMITTED
        to: ON_HOLD
        trigger: "system: owning dealer transitions ACTIVE -> SUSPENDED"
        actor: system
        preconditions:
          - "application.status in {SUBMITTED, CONDITIONED, RESUBMITTED, APPROVED}"
        side_effects:
          - "application.held_from_status := the status held immediately before this transition"
      - from: ON_HOLD
        to: SUBMITTED
        trigger: "system: owning dealer transitions SUSPENDED -> ACTIVE"
        actor: system
        preconditions:
          - "application.status == ON_HOLD"
        side_effects:
          - "application.status := application.held_from_status; held_from_status := null"
        note: "The restored status is whichever of SUBMITTED, CONDITIONED, RESUBMITTED or APPROVED was captured on hold."
      - from: SUBMITTED
        to: WITHDRAWN
        trigger: "system: owning dealer transitions to TERMINATED (cascade link 3)"
        actor: system
        preconditions:
          - "application.status in {SUBMITTED, CONDITIONED, RESUBMITTED, APPROVED, ON_HOLD}"
        side_effects:
          - "application.held_from_status := null"

  - entity: RetailContract
    initial_state: PENDING_DOCS
    terminal_states: [PAID_OFF, DEFAULTED, REPURCHASED]
    note: "Dimension 1 of 2. funding_status and reserve_status advance independently; a BuybackDemand moves reserve_status without touching funding_status, and a document rejection moves funding_status without touching reserve_status."
    transitions:
      - from: PENDING_DOCS
        to: DOCS_VERIFIED
        trigger: "system: POST /lending/documents/{id}/verify with outcome=VERIFY brings verified_doc_count up to len(required_doc_types)"
        actor: system
        preconditions:
          - "contract.funding_status == PENDING_DOCS"
          - "every doc_type in contract.required_doc_types has a ContractDocument with status == VERIFIED"
        side_effects:
          - "contract.verified_doc_count := len(required_doc_types)"
      - from: DOCS_VERIFIED
        to: PENDING_DOCS
        trigger: "system: POST /lending/documents/{id}/verify with outcome=REJECT on a previously VERIFIED required document"
        actor: system
        preconditions:
          - "contract.funding_status == DOCS_VERIFIED"
        side_effects:
          - "contract.verified_doc_count -= 1; contract.doc_defect_count += 1"
        note: "Revert edge; the contract cannot be funded again until the document is re-verified."
      - from: DOCS_VERIFIED
        to: FUNDED
        trigger: "POST /lending/contracts/{id}/fund"
        actor: FundingSpecialist
        preconditions:
          - "contract.funding_status == DOCS_VERIFIED"
          - "dealer.compliance_hold == false"
          - "X-User-ID != application.decisioned_by_user_id"
          - "dealer.status == ACTIVE"
          - "funding_date - application.decisioned_at <= FUNDING_WINDOW_DAYS (30)"
          - "dealer.outstanding_principal_cents + contract.amount_financed_cents <= dealer.funding_line_cents"
        side_effects:
          - "contract.funded_at := funding_date; contract.funded_by_user_id := X-User-ID"
          - "contract.reserve_accrued_cents and incentive_accrued_cents := dealer_reserve_amount, scheduled_yield variant"
          - "contract.dealer_proceeds_cents := amount_financed_cents - acquisition_fee_cents + reserve_accrued_cents + incentive_accrued_cents"
          - "contract.unpaid_principal_cents := amount_financed_cents"
          - "contract.reserve_status := ACCRUED"
          - "two ReserveEntry rows are posted in this order: PARTICIPATION_ACCRUAL (+reserve_accrued_cents) then INCENTIVE_ACCRUAL (+incentive_accrued_cents)"
          - "dealer.reserve_balance_cents, outstanding_principal_cents and funded_contract_count are recomputed; dealer.total_funded_ever_count += 1"
          - "increments Dealer.version by 1"
      - from: FUNDED
        to: PAID_OFF
        trigger: "POST /lending/contracts/{id}/chargeback-events with event_type=EARLY_PAYOFF"
        actor: PortfolioAdmin
        preconditions:
          - "contract.funding_status == FUNDED"
          - "event_date >= contract.funded_at"
        side_effects:
          - "cascade link 1: contract.months_seasoned and payoff_months_seasoned := floor(days_between(funded_at, event_date) / 30); contract.unpaid_principal_cents is recomputed, consumed by the dealer roll-up, then set to 0"
          - "cascade link 1: when within_window, contract.reserve_status := CHARGED_BACK; otherwise contract.reserve_status := EARNED"
          - "cascade link 2 (caused by link 1's reserve_status transition to CHARGED_BACK): one ReserveEntry of entry_type CHARGEBACK is posted for -chargeback_total_cents, and dealer.reserve_balance_cents, chargeback_count and scorecard_stale are updated"
          - "cascade link 2 (caused by link 1's PAID_OFF transition): when payoff_months_seasoned < EARLY_PAYOFF_SEASONING_MONTHS (12), dealer.early_payoff_count += 1"
          - "cascade link 3 (caused by link 2's early_payoff_count change): dealer.early_payoff_rate_bps is recomputed and, when it crosses PROBATION_EARLY_PAYOFF_RATE_BPS with total_funded_ever_count >= PROBATION_MIN_FUNDED_COUNT, dealer.status ACTIVE -> SUSPENDED"
          - "cascade link 4 (caused by link 3's suspension): every open CreditApplication of the dealer moves to ON_HOLD with held_from_status captured"
          - "dealer.outstanding_principal_cents and funded_contract_count are recomputed"
          - "increments Dealer.version by 1"
      - from: FUNDED
        to: DEFAULTED
        trigger: "POST /lending/contracts/{id}/chargeback-events with event_type=DEFAULT"
        actor: PortfolioAdmin
        preconditions:
          - "contract.funding_status == FUNDED"
          - "event_date >= contract.funded_at"
        side_effects:
          - "contract.months_seasoned := floor(days_between(funded_at, event_date) / 30); payoff_months_seasoned stays null"
          - "when within_window, contract.reserve_status := CHARGED_BACK and a CHARGEBACK ReserveEntry is posted; otherwise contract.reserve_status := EARNED and no entry is posted"
          - "dealer.default_count += 1; dealer.scorecard_stale := true when a chargeback posted"
          - "contract.unpaid_principal_cents is recomputed, consumed by the dealer roll-up, then set to 0; dealer.outstanding_principal_cents and funded_contract_count are recomputed"
          - "increments Dealer.version by 1"
        note: "A DEFAULT never increments early_payoff_count and therefore never triggers the probation suspension."
      - from: FUNDED
        to: REPURCHASED
        trigger: "POST /lending/buyback-demands/{id}/actions with action=SETTLE"
        actor: PortfolioAdmin
        preconditions:
          - "contract.funding_status == FUNDED"
          - "demand.status == ACKNOWLEDGED"
        side_effects:
          - "contract.reserve_status := CHARGED_BACK"
          - "one ReserveEntry of entry_type BUYBACK_OFFSET is posted for -demand.reserve_offset_cents"
          - "contract.unpaid_principal_cents is recomputed, consumed by the dealer roll-up, then set to 0"
          - "dealer.repurchase_count += 1; dealer.reserve_balance_cents, outstanding_principal_cents and funded_contract_count are recomputed"
          - "increments Dealer.version by 1"

  - entity: RetailContract
    initial_state: NONE
    terminal_states: [CHARGED_BACK, EARNED]
    note: "Dimension 2 of 2 - reserve_status. Independent of funding_status except where a transition names both."
    transitions:
      - from: NONE
        to: ACCRUED
        trigger: "POST /lending/contracts/{id}/fund"
        actor: FundingSpecialist
        preconditions:
          - "contract.reserve_status == NONE"
        side_effects:
          - "PARTICIPATION_ACCRUAL and INCENTIVE_ACCRUAL ledger entries are posted"
      - from: ACCRUED
        to: HELD
        trigger: "POST /lending/buyback-demands (issuance), including the system issuance in the dealer-termination cascade"
        actor: PortfolioAdmin
        preconditions:
          - "contract.reserve_status == ACCRUED"
          - "contract.funding_status == FUNDED"
        side_effects:
          - "no ledger movement; the reserve is frozen while the demand is open"
        note: "funding_status stays FUNDED throughout, demonstrating dimension independence."
      - from: HELD
        to: ACCRUED
        trigger: "POST /lending/buyback-demands/{id}/actions with action=WITHDRAW"
        actor: PortfolioAdmin
        preconditions:
          - "contract.reserve_status == HELD"
          - "demand.status in {ISSUED, ACKNOWLEDGED, DISPUTED}"
        side_effects:
          - "no ledger movement"
        note: "Cycle ACCRUED -> HELD -> ACCRUED."
      - from: HELD
        to: CHARGED_BACK
        trigger: "POST /lending/buyback-demands/{id}/actions with action=SETTLE"
        actor: PortfolioAdmin
        preconditions:
          - "contract.reserve_status == HELD"
          - "demand.status == ACKNOWLEDGED"
        side_effects:
          - "BUYBACK_OFFSET ledger entry is posted for -demand.reserve_offset_cents"
      - from: ACCRUED
        to: CHARGED_BACK
        trigger: "POST /lending/contracts/{id}/chargeback-events when within_window is true"
        actor: PortfolioAdmin
        preconditions:
          - "contract.reserve_status == ACCRUED"
          - "event months_seasoned < window_months"
        side_effects:
          - "CHARGEBACK ledger entry is posted for -chargeback_total_cents"
      - from: ACCRUED
        to: EARNED
        trigger: "POST /lending/contracts/{id}/chargeback-events when within_window is false"
        actor: PortfolioAdmin
        preconditions:
          - "contract.reserve_status == ACCRUED"
          - "event months_seasoned >= window_months"
        side_effects:
          - "chargeback_total_cents := 0 and no ReserveEntry is created"

  - entity: ContractDocument
    initial_state: RECEIVED
    terminal_states: []
    transitions:
      - from: RECEIVED
        to: VERIFIED
        trigger: "POST /lending/documents/{id}/verify with outcome=VERIFY"
        actor: FundingSpecialist
        preconditions:
          - "document.status in {RECEIVED, REJECTED}"
          - "contract.funding_status in {PENDING_DOCS, DOCS_VERIFIED}"
        side_effects:
          - "document.defect_code := null; verified_by_user_id := X-User-ID; verified_at := current clock"
          - "contract.verified_doc_count += 1 when doc_type is in required_doc_types"
          - "contract.funding_status PENDING_DOCS -> DOCS_VERIFIED when every required doc_type is now VERIFIED"
      - from: REJECTED
        to: VERIFIED
        trigger: "POST /lending/documents/{id}/verify with outcome=VERIFY (cure after defect)"
        actor: FundingSpecialist
        preconditions:
          - "document.status == REJECTED"
          - "contract.funding_status in {PENDING_DOCS, DOCS_VERIFIED}"
        side_effects:
          - "identical to the RECEIVED -> VERIFIED side effects"
        note: "Cure cycle VERIFIED -> REJECTED -> VERIFIED."
      - from: RECEIVED
        to: REJECTED
        trigger: "POST /lending/documents/{id}/verify with outcome=REJECT"
        actor: FundingSpecialist
        preconditions:
          - "document.status in {RECEIVED, VERIFIED}"
          - "contract.funding_status in {PENDING_DOCS, DOCS_VERIFIED}"
        side_effects:
          - "document.defect_code := defect_code (or 'UNSPECIFIED_DEFECT' when omitted)"
          - "contract.doc_defect_count += 1"
      - from: VERIFIED
        to: REJECTED
        trigger: "POST /lending/documents/{id}/verify with outcome=REJECT"
        actor: FundingSpecialist
        preconditions:
          - "document.status == VERIFIED"
          - "contract.funding_status in {PENDING_DOCS, DOCS_VERIFIED}"
        side_effects:
          - "document.defect_code := defect_code (or 'UNSPECIFIED_DEFECT' when omitted)"
          - "contract.doc_defect_count += 1; contract.verified_doc_count -= 1"
          - "contract.funding_status DOCS_VERIFIED -> PENDING_DOCS when doc_type is in required_doc_types"

  - entity: BuybackDemand
    initial_state: ISSUED
    terminal_states: [SETTLED, WITHDRAWN]
    transitions:
      - from: ISSUED
        to: ACKNOWLEDGED
        trigger: "POST /lending/buyback-demands/{id}/actions with action=ACKNOWLEDGE"
        actor: DealerPrincipal
        preconditions:
          - "demand.status in {ISSUED, DISPUTED}"
          - "demand.dealer_id == X-User-ID"
        side_effects:
          - "no ledger movement"
      - from: DISPUTED
        to: ACKNOWLEDGED
        trigger: "POST /lending/buyback-demands/{id}/actions with action=ACKNOWLEDGE"
        actor: DealerPrincipal
        preconditions:
          - "demand.status == DISPUTED"
          - "demand.dealer_id == X-User-ID"
        side_effects:
          - "no ledger movement"
        note: "Cycle ISSUED -> DISPUTED -> ACKNOWLEDGED -> DISPUTED is permitted until settlement."
      - from: ISSUED
        to: DISPUTED
        trigger: "POST /lending/buyback-demands/{id}/actions with action=DISPUTE"
        actor: DealerPrincipal
        preconditions:
          - "demand.status in {ISSUED, ACKNOWLEDGED}"
          - "demand.dealer_id == X-User-ID"
        side_effects:
          - "demand.dispute_reason := dispute_reason"
      - from: ACKNOWLEDGED
        to: DISPUTED
        trigger: "POST /lending/buyback-demands/{id}/actions with action=DISPUTE"
        actor: DealerPrincipal
        preconditions:
          - "demand.status == ACKNOWLEDGED"
          - "demand.dealer_id == X-User-ID"
        side_effects:
          - "demand.dispute_reason := dispute_reason"
      - from: ACKNOWLEDGED
        to: SETTLED
        trigger: "POST /lending/buyback-demands/{id}/actions with action=SETTLE"
        actor: PortfolioAdmin
        preconditions:
          - "demand.status == ACKNOWLEDGED"
          - "contract.funding_status == FUNDED"
        side_effects:
          - "demand.settled_at := settlement_date"
          - "contract.funding_status := REPURCHASED and reserve_status := CHARGED_BACK"
          - "BUYBACK_OFFSET ledger entry for -reserve_offset_cents is posted and the dealer roll-up runs"
          - "increments Dealer.version by 1"
      - from: ISSUED
        to: WITHDRAWN
        trigger: "POST /lending/buyback-demands/{id}/actions with action=WITHDRAW"
        actor: PortfolioAdmin
        preconditions:
          - "demand.status in {ISSUED, ACKNOWLEDGED, DISPUTED}"
        side_effects:
          - "contract.reserve_status HELD -> ACCRUED"
      - from: ACKNOWLEDGED
        to: WITHDRAWN
        trigger: "POST /lending/buyback-demands/{id}/actions with action=WITHDRAW"
        actor: PortfolioAdmin
        preconditions:
          - "demand.status == ACKNOWLEDGED"
        side_effects:
          - "contract.reserve_status HELD -> ACCRUED"
      - from: DISPUTED
        to: WITHDRAWN
        trigger: "POST /lending/buyback-demands/{id}/actions with action=WITHDRAW"
        actor: PortfolioAdmin
        preconditions:
          - "demand.status == DISPUTED"
        side_effects:
          - "contract.reserve_status HELD -> ACCRUED"

  - entity: DealerScorecard
    initial_state: DRAFT
    terminal_states: [FINALIZED]
    transitions:
      - from: DRAFT
        to: FINALIZED
        trigger: "POST /lending/scorecards/{id}/finalize"
        actor: PortfolioAdmin
        preconditions:
          - "scorecard.status == DRAFT"
        side_effects:
          - "scorecard.finalized_at := current clock"
          - "dealer.latest_scorecard_grade := scorecard.grade; dealer.scorecard_stale := false"
          - "when scorecard.grade == D and dealer.status == ACTIVE: dealer.status := SUSPENDED with suspension_reason 'AUTO_SCORECARD_GRADE_D', and every open CreditApplication of the dealer moves to ON_HOLD"
          - "increments Dealer.version by 1"

  - entity: FairLendingReview
    initial_state: DRAFT
    terminal_states: [CLOSED]
    transitions:
      - from: DRAFT
        to: PUBLISHED
        trigger: "POST /lending/fair-lending-reviews/{id}/transition with action=PUBLISH when finding == WITHIN_TOLERANCE"
        actor: ComplianceOfficer
        preconditions:
          - "review.status == DRAFT"
          - "review.finding == WITHIN_TOLERANCE"
        side_effects:
          - "review.published_at := current clock; no ledger movement and no compliance hold"
      - from: DRAFT
        to: REMEDIATION_ORDERED
        trigger: "POST /lending/fair-lending-reviews/{id}/transition with action=PUBLISH when finding == EXCEEDS_THRESHOLD"
        actor: ComplianceOfficer
        preconditions:
          - "review.status == DRAFT"
          - "review.finding == EXCEEDS_THRESHOLD"
          - "review.remediation_pool_cents <= dealer.reserve_balance_cents"
        side_effects:
          - "review.published_at := current clock"
          - "one ReserveEntry of entry_type REMEDIATION is posted for -remediation_pool_cents with contract_id null"
          - "dealer.compliance_hold := true; dealer.reserve_balance_cents is recomputed"
          - "increments Dealer.version by 1"
        note: "Branch point: the same PUBLISH action forks on the computed finding."
      - from: PUBLISHED
        to: CLOSED
        trigger: "POST /lending/fair-lending-reviews/{id}/transition with action=CLOSE"
        actor: ComplianceOfficer
        preconditions:
          - "review.status in {PUBLISHED, REMEDIATION_ORDERED}"
        side_effects:
          - "review.closed_at := current clock"
      - from: REMEDIATION_ORDERED
        to: CLOSED
        trigger: "POST /lending/fair-lending-reviews/{id}/transition with action=CLOSE"
        actor: ComplianceOfficer
        preconditions:
          - "review.status == REMEDIATION_ORDERED"
        side_effects:
          - "review.closed_at := current clock"
          - "dealer.compliance_hold := false when no other FairLendingReview of this dealer has status == REMEDIATION_ORDERED"
          - "increments Dealer.version by 1"

# =============================================================================
# 1.2.1 Concurrency Rules
# =============================================================================
concurrency_rules:
  - rule_id: agreement-create-stale-dealer
    parent_entity: Dealer
    write_endpoint: "POST /lending/dealer-agreements"
    occ_field: "expected_dealer_version"
    description: |
      Creating a DealerAgreement against a Dealer whose version has advanced since
      the client last read it is rejected as stale. A successor agreement may
      legitimately supersede the prior one, so a later create is not blocked by any
      state precondition; the stale-version check is what keeps a writer working
      from an outdated view of the dealer's program from replacing an agreement it
      never saw.
    error_id: ERR_STALE_DEALER_VERSION
    http_status: 412

  - rule_id: reserve-adjustment-stale-dealer
    parent_entity: Dealer
    write_endpoint: "POST /lending/dealers/{id}/reserve-adjustments"
    occ_field: "expected_dealer_version"
    description: |
      Posting a manual reserve adjustment against a Dealer whose version has advanced
      since the client last read it is rejected as stale. Repeated adjustments of the
      same amount are legitimate ledger activity, so no state precondition rejects the
      second one; the version check is what stops a writer from posting an amount it
      derived from a balance that has since moved.
    error_id: ERR_STALE_DEALER_VERSION
    http_status: 412

# =============================================================================
# 1.3 Calculation Rules Table
# =============================================================================
calculations:

  - name: tier_assignment_and_buy_rate
    trigger: "POST /lending/applications/{id}/decision with outcome=APPROVE (also pins agreement_id on outcome=CONDITION)"
    algorithm: tiered_pricing
    formula: |
      # --- inputs: application fields plus the selected rate sheet and agreement ---
      ltv_pct = round_half_up(amount_financed_cents * 100 / collateral_value_cents, 2)
      dti_pct = round_half_up(monthly_debt_cents * 100 / monthly_income_cents, 2)

      # step 1: candidate sheet selection (deterministic, single row)
      #   eligibility filter: RateSheet.status == PUBLISHED
      #                       AND RateSheet.program_code == dealer.program_code
      #                       AND effective_from <= now < effective_to      (half-open)
      #   ranking:            effective_from DESC
      #   tie-break:          created_at DESC
      #   empty candidate set: raise ERR_NO_EFFECTIVE_RATE_SHEET
      sheet = first(candidates ordered by effective_from DESC, created_at DESC)

      # step 2: agreement selection (deterministic, single row)
      #   eligibility filter: DealerAgreement.dealer_id == application.dealer_id
      #                       AND status == ACTIVE
      #                       AND effective_from <= now <= effective_to     (closed)
      #   ranking:            effective_from DESC
      #   tie-break:          created_at DESC
      #   empty candidate set: raise ERR_NO_INFORCE_AGREEMENT
      agreement = first(candidates ordered by effective_from DESC, created_at DESC)

      # step 3: base tier banding
      tiers = RateSheetTier rows with rate_sheet_id == sheet.id,
              ordered by min_credit_score DESC, tie-broken by tier_code ASC
      base_index = index of the first tier where
                   credit_score >= tier.min_credit_score AND credit_score <= tier.max_credit_score
      if no such tier: raise ERR_NO_ELIGIBLE_TIER

      # step 4: demotion - evaluated ONCE against the BASE tier's caps only.
      #         The demoted tier's own max_ltv_pct / max_term_months are NOT re-checked.
      demotion_count = 0
      if ltv_pct > tiers[base_index].max_ltv_pct:        demotion_count += 1
      if term_months > tiers[base_index].max_term_months: demotion_count += 1
      final_index = base_index + demotion_count
      if final_index > len(tiers) - 1: raise ERR_NO_ELIGIBLE_TIER

      # step 5: affordability gate, evaluated AFTER tier resolution
      if dti_pct > MAX_DTI_PCT: raise ERR_DTI_EXCEEDED

      assigned_tier      = tiers[final_index]
      buy_rate_apr_bps   = assigned_tier.buy_rate_apr_bps
      max_contract_apr_bps = buy_rate_apr_bps
                           + min(agreement.max_participation_bps, PROGRAM_MAX_MARKUP_BPS)
    input_set: "Exactly one RateSheet (status == PUBLISHED, matching program_code, half-open window containing the clock) and its RateSheetTier rows; exactly one DealerAgreement (status == ACTIVE, closed window containing the clock). DRAFT and RETIRED sheets are excluded; PENDING_COUNTERSIGN, SUPERSEDED and TERMINATED agreements are excluded."
    constants:
      MAX_DTI_PCT: 45.00
      PROGRAM_MAX_MARKUP_BPS: 250
    precision: "ltv_pct and dti_pct to 2 decimal places, round_half_up; all bps values are integers"

  - name: dealer_reserve_amount
    trigger: "POST /lending/contracts/{id}/fund (scheduled_yield variant, writes reserve_accrued_cents and incentive_accrued_cents); POST /lending/contracts/{id}/chargeback-events (earned_to_date variant, writes ChargebackEvent.earned_to_date_reserve_cents)"
    algorithm: tiered_pricing
    formula: |
      eligible_markup_bps = min(contract.markup_bps,
                                agreement.max_participation_bps,
                                PROGRAM_MAX_MARKUP_BPS)

      if agreement.participation_method == RATE_PARTICIPATION:
          basis_months = <term_months for scheduled_yield | months_seasoned for earned_to_date>
          gross = round_half_up(amount_financed_cents
                                * eligible_markup_bps / 10000
                                * basis_months / 12
                                * PARTICIPATION_FACTOR)          # ONE rounding, at the end
      else:  # FLAT_FEE
          gross = min(agreement.flat_fee_cap_cents,
                      round_half_up(amount_financed_cents * FLAT_FEE_BPS / 10000))

      reserve_accrued_cents  = min(gross, PROGRAM_RESERVE_CAP_CENTS)
      incentive_accrued_cents = min(round_half_up(amount_financed_cents * INCENTIVE_BPS / 10000),
                                    INCENTIVE_CAP_CENTS)
    input_set: "The single RetailContract being funded (or charged back) and the DealerAgreement pinned on that contract's agreement_id - never the dealer's currently ACTIVE agreement."
    constants:
      PARTICIPATION_FACTOR: 0.55
      FLAT_FEE_BPS: 150
      INCENTIVE_BPS: 25
      INCENTIVE_CAP_CENTS: 15000
      PROGRAM_RESERVE_CAP_CENTS: 250000
    precision: "whole cents, round_half_up, single rounding step per output field"
    variants:
      - name: scheduled_yield
        when: "Runs at funding; basis_months = contract.term_months"
        difference: "Values the participation over the full scheduled term and is the amount actually posted to the ledger as PARTICIPATION_ACCRUAL."
      - name: earned_to_date
        when: "Runs on every chargeback event; basis_months = event.months_seasoned"
        difference: "Values the participation over elapsed seasoning only. It is a disclosure figure: for identical contract inputs it is materially smaller than reserve_accrued_cents minus participation_chargeback_cents, because the chargeback prorates over window_months while this variant prorates over term_months."

  - name: reserve_chargeback_amount
    trigger: "POST /lending/contracts/{id}/chargeback-events"
    algorithm: waterfall_allocation
    formula: |
      window_months  = agreement.chargeback_window_days / 30
      months_seasoned = floor(days_between(contract.funded_at, event_date) / 30)
      within_window   = months_seasoned < window_months        # strict less-than

      if not within_window:
          participation_chargeback_cents = 0
          incentive_chargeback_cents     = 0
          chargeback_total_cents         = 0
      else:
          unearned = (window_months - months_seasoned) / window_months   # exact rational

          # ROUNDING ORDER IS PINNED: round EACH accrual entry on its own,
          # THEN sum. Summing first and rounding once is a different, wrong answer.
          participation_chargeback_cents =
              round_half_up(<the contract's PARTICIPATION_ACCRUAL entry amount_cents> * unearned)
          incentive_chargeback_cents =
              round_half_up(<the contract's INCENTIVE_ACCRUAL entry amount_cents> * unearned)

          chargeback_total_cents = participation_chargeback_cents + incentive_chargeback_cents

          # cap: never claw back more than the contract's net posted reserve
          net_posted = sum(ReserveEntry.amount_cents where contract_id == contract.id)
          chargeback_total_cents = min(chargeback_total_cents, net_posted)
    input_set: "The two positive ReserveEntry rows of entry_type PARTICIPATION_ACCRUAL and INCENTIVE_ACCRUAL whose contract_id equals this contract, processed in that fixed entry_type order; CHARGEBACK, BUYBACK_OFFSET, REMEDIATION and MANUAL_ADJUSTMENT entries are excluded from the proration base but included in the net_posted cap."
    constants:
      EARLY_PAYOFF_SEASONING_MONTHS: 12
    precision: "whole cents, round_half_up, applied per accrual entry before summation"

  - name: buyback_settlement_amount
    trigger: "POST /lending/buyback-demands (issuance snapshot); reused verbatim by action=SETTLE"
    algorithm: aggregation
    formula: |
      months_seasoned = floor(days_between(contract.funded_at, current_clock) / 30)
      capped_months   = min(months_seasoned, contract.term_months)
      unpaid_principal_cents = contract.amount_financed_cents
                             - round_half_up(contract.amount_financed_cents * capped_months
                                             / contract.term_months)
      reserve_offset_cents = sum(ReserveEntry.amount_cents where contract_id == contract.id)
      admin_fee_cents      = BUYBACK_ADMIN_FEE_CENTS
      buyback_amount_cents = unpaid_principal_cents + reserve_offset_cents + admin_fee_cents
    input_set: "Every ReserveEntry whose contract_id equals the contract (all entry_types, signed), evaluated at issuance. The snapshot is frozen on the BuybackDemand and is not recomputed at settlement."
    constants:
      BUYBACK_ADMIN_FEE_CENTS: 25000
    precision: "whole cents, round_half_up on the amortized principal term only"

  - name: dealer_scorecard_composite
    trigger: "POST /lending/dealers/{id}/scorecards"
    algorithm: weighted_scoring
    formula: |
      # population depends on the basis variant; see variants below
      population_count = len(population)
      if population_count == 0:
          default_rate_bps = early_payoff_rate_bps = doc_defect_rate_bps = avg_markup_bps = 0
          composite_score = null
          grade = UNRATED
      else:
          defaulted_count      = count(c in population where c.funding_status == DEFAULTED)
          early_payoff_count   = count(c in population where c.funding_status == PAID_OFF
                                       and c.payoff_months_seasoned < EARLY_PAYOFF_SEASONING_MONTHS)
          defect_contract_count = count(c in population where c.doc_defect_count > 0)

          default_rate_bps     = round_half_up(10000 * defaulted_count / population_count)
          early_payoff_rate_bps = round_half_up(10000 * early_payoff_count / population_count)
          doc_defect_rate_bps  = round_half_up(10000 * defect_contract_count / population_count)
          avg_markup_bps       = round_half_up(sum(c.markup_bps) / population_count)

          # deduction order is pinned; EACH deduction is rounded on its own before subtraction
          d1 = round_half_up(W_DEFAULT * default_rate_bps / 100)
          d2 = round_half_up(W_EARLY   * early_payoff_rate_bps / 100)
          d3 = round_half_up(W_DOC     * doc_defect_rate_bps / 100)
          d4 = round_half_up(W_MARKUP  * max(0, avg_markup_bps - MARKUP_BENCHMARK_BPS) / 10)
          composite_score = max(0, min(1000, 1000 - d1 - d2 - d3 - d4))

          grade = A if composite_score >= 850
             else B if composite_score >= 700
             else C if composite_score >= 550
             else D
    input_set: "RetailContract rows of the scorecard's dealer_id whose funding_status is in {FUNDED, PAID_OFF, DEFAULTED, REPURCHASED}; PENDING_DOCS and DOCS_VERIFIED contracts are excluded from every variant."
    constants:
      W_DEFAULT: 6.0
      W_EARLY: 2.0
      W_DOC: 1.5
      W_MARKUP: 1.0
      MARKUP_BENCHMARK_BPS: 150
      EARLY_PAYOFF_SEASONING_MONTHS: 12
    precision: "rates in whole basis points, round_half_up; each deduction rounded to a whole point before subtraction; composite_score is an integer clamped to [0, 1000]"
    variants:
      - name: trailing_window
        when: "basis == TRAILING_WINDOW"
        difference: "Population is further filtered to contracts whose funded_at lies in the half-open interval [period_start, period_end). Contracts funded before period_start are invisible, so an older default cannot depress the score."
      - name: inception_to_date
        when: "basis == INCEPTION_TO_DATE"
        difference: "Population ignores period_start and period_end entirely and includes every eligible contract ever funded for the dealer. For the same dealer and the same clock this yields a different population_count, a different default_rate_bps and, in general, a different grade than trailing_window."

  - name: fair_lending_markup_disparity
    trigger: "POST /lending/fair-lending-reviews"
    algorithm: aggregation
    formula: |
      # population snapshot, taken ONCE at review creation
      population = RetailContract rows where dealer_id == review.dealer_id
                   AND funding_status in {FUNDED, PAID_OFF, DEFAULTED, REPURCHASED}
                   AND window_start <= funded_at < window_end          # half-open
      population_count = len(population)
      if population_count < MIN_REVIEW_POPULATION: raise ERR_INSUFFICIENT_REVIEW_POPULATION

      # EVALUATION ORDER IS PINNED. The benchmark is dollar-weighted over the WHOLE
      # population, including the MONITORED contracts that are about to be remediated.
      # It is computed first, frozen on the review row, and is never recomputed - not
      # after remediation posts, and not by any later review that re-reads the same
      # contracts. A benchmark recomputed over the post-remediation or control-only
      # subset is a different (wrong) number.
      benchmark_markup_bps = round_half_up(
          sum(c.markup_bps * c.amount_financed_cents for c in population)
          / sum(c.amount_financed_cents for c in population))

      control   = [c for c in population if c.monitoring_cohort == CONTROL]
      monitored = [c for c in population if c.monitoring_cohort == MONITORED]
      control_avg_markup_bps   = round_half_up(sum(c.markup_bps for c in control) / len(control))
                                 if control else 0
      monitored_avg_markup_bps = round_half_up(sum(c.markup_bps for c in monitored) / len(monitored))
                                 if monitored else 0
      disparity_bps = monitored_avg_markup_bps - control_avg_markup_bps

      finding = EXCEEDS_THRESHOLD if disparity_bps > DISPARITY_THRESHOLD_BPS else WITHIN_TOLERANCE

      if finding == WITHIN_TOLERANCE:
          remediation_pool_cents = 0
      else:
          # per-contract rounding, then sum - same discipline as the chargeback rule
          remediation_pool_cents = sum(
              round_half_up(c.amount_financed_cents
                            * max(0, c.markup_bps - benchmark_markup_bps) / 10000
                            * c.term_months / 12
                            * PARTICIPATION_FACTOR)
              for c in monitored
              ordered by c.funded_at ASC, tie-broken by c.created_at ASC)
    input_set: "The frozen population snapshot described above. Contracts in PENDING_DOCS or DOCS_VERIFIED are excluded; contracts funded outside the half-open window are excluded; both cohorts contribute to the benchmark."
    constants:
      MIN_REVIEW_POPULATION: 4
      DISPARITY_THRESHOLD_BPS: 25
      PARTICIPATION_FACTOR: 0.55
    precision: "whole basis points and whole cents, round_half_up; benchmark rounded once before any excess is derived from it"

# =============================================================================
# 1.4 Validation Rules Table (ordered by priority - lowest number wins)
# =============================================================================
validations:
  - priority: 1
    category: auth
    check: "X-User-Role and X-User-ID headers are present, non-empty, and X-User-Role is one of the five declared roles"
    error_id: ERR_UNAUTHENTICATED
    http_status: 401
    applies_to: all

  - priority: 2
    category: auth
    check: "The supplied X-User-Role appears in the endpoint's roles list. For POST /lending/dealers/{id}/status the action is additionally role-gated: SUSPEND, REINSTATE and TERMINATE require PortfolioAdmin; COMPLIANCE_HOLD and RELEASE_HOLD require ComplianceOfficer. For POST /lending/buyback-demands/{id}/actions: ACKNOWLEDGE and DISPUTE require DealerPrincipal; SETTLE and WITHDRAW require PortfolioAdmin."
    error_id: ERR_FORBIDDEN_ROLE
    http_status: 403
    applies_to: all

  - priority: 3
    category: auth
    check: "When X-User-Role == DealerPrincipal, X-User-ID must equal the dealer_id of the addressed resource (Dealer.id, DealerAgreement.dealer_id, CreditApplication.dealer_id, RetailContract.dealer_id, ContractDocument -> contract.dealer_id, BuybackDemand.dealer_id) and must equal any dealer_id supplied in the request body."
    error_id: ERR_DEALER_SCOPE_VIOLATION
    http_status: 403
    applies_to: "every dealer-scoped endpoint"

  - priority: 4
    category: existence
    check: "Every id in the URL path resolves, validated left to right"
    error_id: "ERR_DEALER_NOT_FOUND | ERR_AGREEMENT_NOT_FOUND | ERR_RATE_SHEET_NOT_FOUND | ERR_APPLICATION_NOT_FOUND | ERR_CONTRACT_NOT_FOUND | ERR_DOCUMENT_NOT_FOUND | ERR_BUYBACK_NOT_FOUND | ERR_SCORECARD_NOT_FOUND | ERR_REVIEW_NOT_FOUND | ERR_RESERVE_ENTRY_NOT_FOUND"
    http_status: 404
    applies_to: "all path-parameterised endpoints"

  - priority: 5
    category: business_constraint
    check: "Request body conforms to the endpoint's input schema: required fields present, types correct, enum members valid, numeric ranges within the constraints declared in section 1.1, effective_to > effective_from, period_end > period_start, window_end > window_start, chargeback_window_days a multiple of 30"
    error_id: ERR_INVALID_REQUEST
    http_status: 400
    applies_to: all

  - priority: 6
    category: existence
    check: "Every foreign key supplied in the request body resolves to an existing row"
    error_id: "ERR_DEALER_NOT_FOUND | ERR_AGREEMENT_NOT_FOUND | ERR_APPLICATION_NOT_FOUND | ERR_CONTRACT_NOT_FOUND"
    http_status: 404
    applies_to: "POST /lending/dealer-agreements, POST /lending/applications, POST /lending/contracts, POST /lending/buyback-demands, POST /lending/fair-lending-reviews"

  - priority: 7
    category: state
    check: "The addressed resource is in a state from which the requested transition is declared in section 1.2 (agreement not PENDING_COUNTERSIGN on countersign, application not CONDITIONED on resubmit, demand action not permitted from its current status, review action not permitted from its current status, rate sheet not DRAFT on publish, scorecard not DRAFT on finalize, contract already FUNDED or terminal, document contract already FUNDED)"
    error_id: ERR_INVALID_STATE
    http_status: 409
    applies_to: "every state-transition endpoint"

  - priority: 8
    category: state
    check: "On funding, contract.funding_status == DOCS_VERIFIED - i.e. every doc_type in contract.required_doc_types has a ContractDocument with status == VERIFIED"
    error_id: ERR_DOCS_NOT_VERIFIED
    http_status: 409
    applies_to: "POST /lending/contracts/{id}/fund"

  - priority: 9
    category: state
    check: "On contract creation, application.status == APPROVED"
    error_id: ERR_APPLICATION_NOT_APPROVED
    http_status: 409
    applies_to: "POST /lending/contracts"

  - priority: 10
    category: state
    check: "expected_dealer_version equals the current Dealer.version"
    error_id: ERR_STALE_DEALER_VERSION
    http_status: 412
    applies_to: "POST /lending/dealer-agreements, POST /lending/dealers/{id}/reserve-adjustments"

  - priority: 11
    category: business_safety
    check: "dealer.compliance_hold == false"
    error_id: ERR_DEALER_COMPLIANCE_HOLD
    http_status: 409
    applies_to: "POST /lending/applications/{id}/decision, POST /lending/contracts, POST /lending/contracts/{id}/fund"

  - priority: 12
    category: business_safety
    check: "Segregation of duties: on funding, X-User-ID must differ from application.decisioned_by_user_id"
    error_id: ERR_SEGREGATION_OF_DUTIES
    http_status: 409
    applies_to: "POST /lending/contracts/{id}/fund"

  - priority: 13
    category: business_safety
    check: "dealer.status == ACTIVE"
    error_id: ERR_DEALER_NOT_ACTIVE
    http_status: 409
    applies_to: "POST /lending/applications, POST /lending/applications/{id}/decision, POST /lending/applications/{id}/resubmit, POST /lending/contracts, POST /lending/contracts/{id}/fund"

  - priority: 14
    category: business_referential
    check: "A DealerAgreement exists with dealer_id == application.dealer_id, status == ACTIVE and effective_from <= now <= effective_to (closed interval)"
    error_id: ERR_NO_INFORCE_AGREEMENT
    http_status: 422
    applies_to: "POST /lending/applications/{id}/decision"

  - priority: 15
    category: business_referential
    check: "A RateSheet exists with status == PUBLISHED, program_code == dealer.program_code and effective_from <= now < effective_to (half-open interval)"
    error_id: ERR_NO_EFFECTIVE_RATE_SHEET
    http_status: 422
    applies_to: "POST /lending/applications/{id}/decision"

  - priority: 16
    category: business_referential
    check: "A rate sheet being published carries at least one RateSheetTier"
    error_id: ERR_RATE_SHEET_NO_TIERS
    http_status: 422
    applies_to: "POST /lending/rate-sheets/{id}/publish"

  - priority: 17
    category: business_temporal
    check: "Half-open window semantics: the sheet being published must not intersect any other PUBLISHED RateSheet of the same program_code. Intersection means existing.effective_from < new.effective_to AND new.effective_from < existing.effective_to. Windows that merely touch (new.effective_from == existing.effective_to) do NOT intersect and are accepted."
    error_id: ERR_RATE_SHEET_WINDOW_OVERLAP
    http_status: 409
    applies_to: "POST /lending/rate-sheets/{id}/publish"

  - priority: 18
    category: business_temporal
    check: "Closed-interval plus mandatory buffer semantics: for a new DealerAgreement whose supersedes_agreement_id is null, and for every existing agreement of the same dealer with status in {PENDING_COUNTERSIGN, ACTIVE}, the new agreement's effective_from must be >= existing.effective_to + AGREEMENT_NOTICE_BUFFER_DAYS (30 days). Touching windows are REJECTED because the buffer is mandatory. When supersedes_agreement_id is set, the buffer does not apply and instead new.effective_from must be strictly greater than the superseded agreement's effective_from and strictly less than or equal to its effective_to."
    error_id: ERR_AGREEMENT_WINDOW_CONFLICT
    http_status: 409
    applies_to: "POST /lending/dealer-agreements"

  - priority: 19
    category: business_temporal
    check: "funding_date minus application.decisioned_at is at most FUNDING_WINDOW_DAYS (30 days); funding_date must also be >= contract.contract_date"
    error_id: ERR_FUNDING_WINDOW_EXPIRED
    http_status: 422
    applies_to: "POST /lending/contracts/{id}/fund"

  - priority: 20
    category: business_temporal
    check: "event_date >= contract.funded_at (equality is accepted and yields months_seasoned == 0)"
    error_id: ERR_INVALID_EVENT_DATE
    http_status: 422
    applies_to: "POST /lending/contracts/{id}/chargeback-events"

  - priority: 21
    category: business_constraint
    check: "The tier_assignment_and_buy_rate calculation resolves a base tier band and the demoted index stays inside the tier list"
    error_id: ERR_NO_ELIGIBLE_TIER
    http_status: 422
    applies_to: "POST /lending/applications/{id}/decision with outcome=APPROVE"

  - priority: 22
    category: business_constraint
    check: "dti_pct <= MAX_DTI_PCT (45.00), evaluated after tier resolution"
    error_id: ERR_DTI_EXCEEDED
    http_status: 422
    applies_to: "POST /lending/applications/{id}/decision with outcome=APPROVE"

  - priority: 23
    category: business_constraint
    check: "application.buy_rate_apr_bps <= contract_apr_bps <= application.max_contract_apr_bps"
    error_id: ERR_MARKUP_CAP_EXCEEDED
    http_status: 422
    applies_to: "POST /lending/contracts"

  - priority: 24
    category: business_constraint
    check: "amount_financed_cents <= round_half_up(collateral_value_cents * assigned_tier.advance_rate_pct / 100), using the tier assigned at decision (post-demotion)"
    error_id: ERR_ADVANCE_LIMIT_EXCEEDED
    http_status: 422
    applies_to: "POST /lending/contracts"

  - priority: 25
    category: business_constraint
    check: "application.resubmission_count < MAX_RESUBMISSIONS (2)"
    error_id: ERR_RESUBMISSION_LIMIT
    http_status: 409
    applies_to: "POST /lending/applications/{id}/resubmit"

  - priority: 26
    category: business_constraint
    check: "The review population holds at least MIN_REVIEW_POPULATION (4) contracts"
    error_id: ERR_INSUFFICIENT_REVIEW_POPULATION
    http_status: 422
    applies_to: "POST /lending/fair-lending-reviews"

  - priority: 27
    category: business_referential
    check: "The contract named by a buyback demand has funding_status == FUNDED and has no other BuybackDemand with status in {ISSUED, ACKNOWLEDGED, DISPUTED}"
    error_id: ERR_CONTRACT_NOT_FUNDED
    http_status: 409
    applies_to: "POST /lending/buyback-demands"

  - priority: 28
    category: business_fiscal
    check: "dealer.outstanding_principal_cents + contract.amount_financed_cents <= dealer.funding_line_cents"
    error_id: ERR_DEALER_FUNDING_LINE_EXCEEDED
    http_status: 409
    applies_to: "POST /lending/contracts/{id}/fund"

  - priority: 29
    category: business_fiscal
    check: "A manual reserve adjustment, and a fair-lending remediation posting, must not drive dealer.reserve_balance_cents below zero"
    error_id: ERR_RESERVE_BALANCE_NEGATIVE
    http_status: 409
    applies_to: "POST /lending/dealers/{id}/reserve-adjustments, POST /lending/fair-lending-reviews/{id}/transition with action=PUBLISH"

# =============================================================================
# 1.5 API Endpoint Table
# =============================================================================
endpoints:

  # --- logical clock (test-driving endpoint, /_ namespace) --------------------
  - method: POST
    path: "/lending/_clock/set_current_utc"
    description: "Sets the server's logical clock, which every effective_from / effective_to / seasoning / window computation reads. The clock's startup default is exactly 2026-08-01T00:00:00Z; before any call to this endpoint the logical clock reads that instant and never falls back to real wall-clock time. The clock may be moved forward or backward."
    roles: [PortfolioAdmin]
    code: 200
    input: ["to_iso8601"]
    output: { current_utc: datetime }
    side_effects: ["logical clock repositioned; no entity is mutated"]

  # --- dealers ---------------------------------------------------------------
  - method: POST
    path: "/lending/dealers"
    description: "Onboard a dealership in PROSPECT status."
    roles: [PortfolioAdmin]
    code: 201
    input: ["legal_name", "state_code", "program_code?", "funding_line_cents?"]
    output: Dealer
    side_effects: ["Dealer created with status PROSPECT, version 1, all counters zero"]

  - method: GET
    path: "/lending/dealers/{id}"
    description: "Read a dealer including its derived reserve, exposure and scorecard fields."
    roles: [PortfolioAdmin, CreditAnalyst, FundingSpecialist, DealerPrincipal, ComplianceOfficer]
    code: 200
    input: []
    output: Dealer
    side_effects: []

  - method: POST
    path: "/lending/dealers/{id}/status"
    description: "Drive the dealer lifecycle. action=SUSPEND, REINSTATE or TERMINATE (PortfolioAdmin); action=COMPLIANCE_HOLD or RELEASE_HOLD (ComplianceOfficer) toggles Dealer.compliance_hold without changing Dealer.status."
    roles: [PortfolioAdmin, ComplianceOfficer]
    code: 200
    input: ["action", "reason?"]
    output: Dealer
    side_effects:
      - "SUSPEND / auto-suspension: open applications move to ON_HOLD with held_from_status captured"
      - "REINSTATE: ON_HOLD applications are restored to held_from_status"
      - "TERMINATE: five-link cascade over agreements, applications, buyback demands and contract reserve_status"
      - "COMPLIANCE_HOLD / RELEASE_HOLD: sets or clears Dealer.compliance_hold"
      - "increments Dealer.version by 1"

  - method: POST
    path: "/lending/dealers/{id}/reserve-adjustments"
    description: "Post a manual signed reserve ledger entry for the dealer (dealer-level, contract_id null). Guarded by optimistic concurrency on Dealer.version."
    roles: [PortfolioAdmin]
    code: 201
    input: ["amount_cents", "reason", "expected_dealer_version"]
    output: ReserveEntry
    side_effects:
      - "ReserveEntry of entry_type MANUAL_ADJUSTMENT created with balance_after_cents stamped"
      - "Dealer.reserve_balance_cents recomputed"
      - "increments Dealer.version by 1"

  - method: POST
    path: "/lending/dealers/{id}/scorecards"
    description: "Compute a DRAFT dealer performance scorecard under the requested basis variant."
    roles: [PortfolioAdmin]
    code: 201
    input: ["period_start", "period_end", "basis"]
    output: DealerScorecard
    side_effects: ["dealer_scorecard_composite runs and all metric fields are written; Dealer is not mutated"]

  - method: GET
    path: "/lending/dealers/{id}/scorecards"
    description: "List every scorecard computed for this dealer, newest period_start first."
    roles: [PortfolioAdmin, CreditAnalyst, FundingSpecialist, DealerPrincipal, ComplianceOfficer]
    code: 200
    input: ["basis?", "status?", "limit?", "offset?"]
    output: DealerScorecard[]
    side_effects: []

  - method: POST
    path: "/lending/scorecards/{id}/finalize"
    description: "Finalize a DRAFT scorecard, publishing its grade onto the dealer."
    roles: [PortfolioAdmin]
    code: 200
    input: []
    output: DealerScorecard
    side_effects:
      - "Dealer.latest_scorecard_grade := grade; Dealer.scorecard_stale := false"
      - "grade D auto-suspends an ACTIVE dealer and holds its open applications"
      - "increments Dealer.version by 1"

  # --- dealer agreements -----------------------------------------------------
  - method: POST
    path: "/lending/dealer-agreements"
    description: "Draft a dealer agreement in PENDING_COUNTERSIGN. Guarded by optimistic concurrency on Dealer.version because a successor agreement legitimately supersedes the prior one."
    roles: [PortfolioAdmin]
    code: 201
    input: ["dealer_id", "participation_method", "max_participation_bps", "effective_from", "effective_to", "expected_dealer_version", "flat_fee_cap_cents?", "chargeback_window_days?", "supersedes_agreement_id?"]
    output: DealerAgreement
    side_effects:
      - "DealerAgreement created in PENDING_COUNTERSIGN"
      - "increments Dealer.version by 1"

  - method: GET
    path: "/lending/dealer-agreements/{id}"
    description: "Read a single dealer agreement."
    roles: [PortfolioAdmin, CreditAnalyst, FundingSpecialist, DealerPrincipal, ComplianceOfficer]
    code: 200
    input: []
    output: DealerAgreement
    side_effects: []

  - method: GET
    path: "/lending/dealer-agreements"
    description: "List dealer agreements, filterable by owning dealer, by the agreement they supersede, and by status."
    roles: [PortfolioAdmin, CreditAnalyst, FundingSpecialist, DealerPrincipal, ComplianceOfficer]
    code: 200
    input: ["dealer_id?", "supersedes_agreement_id?", "status?", "limit?", "offset?"]
    output: DealerAgreement[]
    side_effects: []

  - method: POST
    path: "/lending/dealer-agreements/{id}/countersign"
    description: "Dealer principal countersigns; the agreement becomes ACTIVE, a PROSPECT dealer becomes ACTIVE, and any superseded predecessor is truncated."
    roles: [DealerPrincipal]
    code: 200
    input: ["signer_name"]
    output: DealerAgreement
    side_effects:
      - "predecessor agreement ACTIVE -> SUPERSEDED with effective_to truncated to this agreement's effective_from minus one day"
      - "Dealer PROSPECT -> ACTIVE"
      - "increments Dealer.version by 1"

  # --- rate sheets -----------------------------------------------------------
  - method: POST
    path: "/lending/rate-sheets"
    description: "Create a DRAFT rate sheet for a program with a half-open effectivity window."
    roles: [PortfolioAdmin]
    code: 201
    input: ["program_code", "effective_from", "effective_to"]
    output: RateSheet
    side_effects: ["RateSheet created in DRAFT with tier_count 0"]

  - method: POST
    path: "/lending/rate-sheets/{id}/tiers"
    description: "Append an immutable tier row to a DRAFT rate sheet."
    roles: [PortfolioAdmin]
    code: 201
    input: ["tier_code", "min_credit_score", "max_credit_score", "max_ltv_pct", "max_term_months", "buy_rate_apr_bps", "advance_rate_pct", "acquisition_fee_cents"]
    output: RateSheetTier
    side_effects: ["RateSheet.tier_count incremented"]

  - method: GET
    path: "/lending/rate-sheets/{id}/tiers"
    description: "List the tier rows of a rate sheet, ordered by min_credit_score DESC then tier_code ASC - the same order the demotion walk uses."
    roles: [PortfolioAdmin, CreditAnalyst, FundingSpecialist, DealerPrincipal, ComplianceOfficer]
    code: 200
    input: ["limit?", "offset?"]
    output: RateSheetTier[]
    side_effects: []

  - method: GET
    path: "/lending/rate-sheets/{id}"
    description: "Read a single rate sheet."
    roles: [PortfolioAdmin, CreditAnalyst, FundingSpecialist, DealerPrincipal, ComplianceOfficer]
    code: 200
    input: []
    output: RateSheet
    side_effects: []

  - method: POST
    path: "/lending/rate-sheets/{id}/publish"
    description: "Publish a DRAFT rate sheet after the half-open overlap test, retiring any same-program sheet whose window has already ended."
    roles: [PortfolioAdmin]
    code: 200
    input: []
    output: RateSheet
    side_effects:
      - "RateSheet DRAFT -> PUBLISHED with published_at stamped"
      - "same-program PUBLISHED sheets whose effective_to <= now transition to RETIRED"

  # --- credit applications ---------------------------------------------------
  - method: POST
    path: "/lending/applications"
    description: "Dealer submits a retail credit application."
    roles: [DealerPrincipal]
    code: 201
    input: ["dealer_id", "applicant_reference", "monitoring_cohort", "credit_score", "monthly_income_cents", "monthly_debt_cents", "amount_financed_cents", "collateral_value_cents", "term_months", "vehicle_model_year", "requested_apr_bps"]
    output: CreditApplication
    side_effects: ["CreditApplication created in SUBMITTED with ltv_pct and dti_pct computed"]

  - method: GET
    path: "/lending/applications/{id}"
    description: "Read a single credit application including its pinned decision outputs."
    roles: [PortfolioAdmin, CreditAnalyst, FundingSpecialist, DealerPrincipal, ComplianceOfficer]
    code: 200
    input: []
    output: CreditApplication
    side_effects: []

  - method: GET
    path: "/lending/applications"
    description: "List credit applications, filterable by dealer, status, pinned agreement, pinned rate sheet and assigned tier."
    roles: [PortfolioAdmin, CreditAnalyst, FundingSpecialist, DealerPrincipal, ComplianceOfficer]
    code: 200
    input: ["dealer_id?", "status?", "agreement_id?", "rate_sheet_id?", "assigned_tier_id?", "limit?", "offset?"]
    output: CreditApplication[]
    side_effects: []

  - method: POST
    path: "/lending/applications/{id}/decision"
    description: "Credit analyst decisions the application: APPROVE runs tier_assignment_and_buy_rate and pins the buy rate and markup cap; CONDITION attaches stipulations and returns the file to the dealer; DECLINE closes it."
    roles: [CreditAnalyst]
    code: 200
    input: ["outcome", "stipulation_count?", "decision_note?"]
    output: CreditApplication
    side_effects:
      - "APPROVE pins agreement_id, rate_sheet_id, assigned_tier_id, base_tier_code, demotion_count, assigned_tier_code, buy_rate_apr_bps, max_contract_apr_bps"
      - "decisioned_by_user_id and decisioned_at are stamped on every outcome"

  - method: POST
    path: "/lending/applications/{id}/resubmit"
    description: "Dealer returns a CONDITIONED application with revised terms; omitted fields keep their current values."
    roles: [DealerPrincipal]
    code: 200
    input: ["credit_score?", "amount_financed_cents?", "collateral_value_cents?", "term_months?", "requested_apr_bps?"]
    output: CreditApplication
    side_effects: ["resubmission_count incremented; ltv_pct and dti_pct recomputed; status CONDITIONED -> RESUBMITTED"]

  # --- retail contracts ------------------------------------------------------
  - method: POST
    path: "/lending/contracts"
    description: "Dealer books the retail installment contract against an APPROVED application."
    roles: [DealerPrincipal]
    code: 201
    input: ["application_id", "contract_apr_bps", "contract_date"]
    output: RetailContract
    side_effects:
      - "RetailContract created in funding_status PENDING_DOCS and reserve_status NONE"
      - "application status APPROVED -> CONTRACTED"
      - "markup_bps, required_doc_types and acquisition_fee_cents pinned"

  - method: GET
    path: "/lending/contracts/{id}"
    description: "Read a single retail contract with both state dimensions and all reserve figures."
    roles: [PortfolioAdmin, CreditAnalyst, FundingSpecialist, DealerPrincipal, ComplianceOfficer]
    code: 200
    input: []
    output: RetailContract
    side_effects: []

  - method: GET
    path: "/lending/contracts"
    description: "List retail contracts, filterable by dealer, originating application, pinned agreement and either state dimension."
    roles: [PortfolioAdmin, CreditAnalyst, FundingSpecialist, DealerPrincipal, ComplianceOfficer]
    code: 200
    input: ["dealer_id?", "application_id?", "agreement_id?", "funding_status?", "reserve_status?", "limit?", "offset?"]
    output: RetailContract[]
    side_effects: []

  - method: POST
    path: "/lending/contracts/{id}/documents"
    description: "Dealer uploads one funding-package document."
    roles: [DealerPrincipal]
    code: 201
    input: ["doc_type", "document_reference"]
    output: ContractDocument
    side_effects: ["ContractDocument created in RECEIVED"]

  - method: GET
    path: "/lending/contracts/{id}/documents"
    description: "List the documents attached to a contract."
    roles: [PortfolioAdmin, CreditAnalyst, FundingSpecialist, DealerPrincipal, ComplianceOfficer]
    code: 200
    input: ["status?", "doc_type?", "limit?", "offset?"]
    output: ContractDocument[]
    side_effects: []

  - method: POST
    path: "/lending/documents/{id}/verify"
    description: "Funding specialist verifies or rejects a single document; the contract's funding_status bubbles up or reverts as a result."
    roles: [FundingSpecialist]
    code: 200
    input: ["outcome", "defect_code?"]
    output: ContractDocument
    side_effects:
      - "contract.verified_doc_count and doc_defect_count adjusted"
      - "contract.funding_status PENDING_DOCS -> DOCS_VERIFIED when the required set is complete, or DOCS_VERIFIED -> PENDING_DOCS on rejection of a required document"

  - method: POST
    path: "/lending/contracts/{id}/fund"
    description: "Funding specialist funds the contract, accruing dealer participation and the volume incentive."
    roles: [FundingSpecialist]
    code: 200
    input: ["funding_date"]
    output: RetailContract
    side_effects:
      - "dealer_reserve_amount scheduled_yield variant writes reserve_accrued_cents and incentive_accrued_cents"
      - "PARTICIPATION_ACCRUAL then INCENTIVE_ACCRUAL ledger entries posted"
      - "Dealer reserve, exposure and counter fields recomputed; total_funded_ever_count incremented"
      - "increments Dealer.version by 1"

  - method: POST
    path: "/lending/contracts/{id}/chargeback-events"
    description: "Record an early payoff or default on a funded contract and run the reserve chargeback test."
    roles: [PortfolioAdmin]
    code: 201
    input: ["event_type", "event_date"]
    output: ChargebackEvent
    side_effects:
      - "contract funding_status FUNDED -> PAID_OFF or DEFAULTED"
      - "reserve_status ACCRUED -> CHARGED_BACK (within window) or ACCRUED -> EARNED (outside window)"
      - "CHARGEBACK ledger entry posted when within window; dealer counters, early_payoff_rate_bps and scorecard_stale updated"
      - "probation threshold breach auto-suspends the dealer and holds its open applications"
      - "increments Dealer.version by 1"

  - method: GET
    path: "/lending/contracts/{id}/chargeback-events"
    description: "List the chargeback events recorded against a contract."
    roles: [PortfolioAdmin, CreditAnalyst, FundingSpecialist, DealerPrincipal, ComplianceOfficer]
    code: 200
    input: ["event_type?", "limit?", "offset?"]
    output: ChargebackEvent[]
    side_effects: []

  # --- reserve ledger --------------------------------------------------------
  - method: GET
    path: "/lending/reserve-entries"
    description: "List reserve ledger entries, filterable by dealer, by contract and by entry type; ordered by created_at ascending."
    roles: [PortfolioAdmin, CreditAnalyst, FundingSpecialist, DealerPrincipal, ComplianceOfficer]
    code: 200
    input: ["dealer_id?", "contract_id?", "entry_type?", "limit?", "offset?"]
    output: ReserveEntry[]
    side_effects: []

  - method: GET
    path: "/lending/reserve-entries/{id}"
    description: "Read a single reserve ledger entry."
    roles: [PortfolioAdmin, CreditAnalyst, FundingSpecialist, DealerPrincipal, ComplianceOfficer]
    code: 200
    input: []
    output: ReserveEntry
    side_effects: []

  # --- buyback ---------------------------------------------------------------
  - method: POST
    path: "/lending/buyback-demands"
    description: "Issue a repurchase demand against a funded contract; freezes the contract's reserve."
    roles: [PortfolioAdmin]
    code: 201
    input: ["contract_id", "reason"]
    output: BuybackDemand
    side_effects:
      - "buyback_settlement_amount snapshot written to unpaid_principal_cents, reserve_offset_cents, admin_fee_cents and buyback_amount_cents"
      - "contract reserve_status ACCRUED -> HELD"

  - method: GET
    path: "/lending/buyback-demands/{id}"
    description: "Read a single repurchase demand."
    roles: [PortfolioAdmin, CreditAnalyst, FundingSpecialist, DealerPrincipal, ComplianceOfficer]
    code: 200
    input: []
    output: BuybackDemand
    side_effects: []

  - method: GET
    path: "/lending/buyback-demands"
    description: "List repurchase demands, filterable by dealer, contract and status."
    roles: [PortfolioAdmin, CreditAnalyst, FundingSpecialist, DealerPrincipal, ComplianceOfficer]
    code: 200
    input: ["dealer_id?", "contract_id?", "status?", "limit?", "offset?"]
    output: BuybackDemand[]
    side_effects: []

  - method: POST
    path: "/lending/buyback-demands/{id}/actions"
    description: "Drive the demand lifecycle. action=ACKNOWLEDGE or DISPUTE (DealerPrincipal); action=SETTLE or WITHDRAW (PortfolioAdmin)."
    roles: [PortfolioAdmin, DealerPrincipal]
    code: 200
    input: ["action", "dispute_reason?", "settlement_date?"]
    output: BuybackDemand
    side_effects:
      - "SETTLE: contract funding_status -> REPURCHASED, reserve_status HELD -> CHARGED_BACK, BUYBACK_OFFSET ledger entry posted, dealer roll-up recomputed, increments Dealer.version by 1"
      - "WITHDRAW: contract reserve_status HELD -> ACCRUED"

  # --- fair lending ----------------------------------------------------------
  - method: POST
    path: "/lending/fair-lending-reviews"
    description: "Run a markup disparity analysis over a dealer's funded book in a half-open window; freezes the benchmark."
    roles: [ComplianceOfficer]
    code: 201
    input: ["dealer_id", "window_start", "window_end"]
    output: FairLendingReview
    side_effects: ["fair_lending_markup_disparity runs and writes the population snapshot, benchmark, cohort averages, disparity, finding and remediation pool"]

  - method: GET
    path: "/lending/fair-lending-reviews/{id}"
    description: "Read a single fair lending review."
    roles: [PortfolioAdmin, CreditAnalyst, FundingSpecialist, DealerPrincipal, ComplianceOfficer]
    code: 200
    input: []
    output: FairLendingReview
    side_effects: []

  - method: GET
    path: "/lending/fair-lending-reviews"
    description: "List fair lending reviews, filterable by dealer and status."
    roles: [PortfolioAdmin, CreditAnalyst, FundingSpecialist, DealerPrincipal, ComplianceOfficer]
    code: 200
    input: ["dealer_id?", "status?", "limit?", "offset?"]
    output: FairLendingReview[]
    side_effects: []

  - method: POST
    path: "/lending/fair-lending-reviews/{id}/transition"
    description: "action=PUBLISH forks on the computed finding into PUBLISHED or REMEDIATION_ORDERED; action=CLOSE closes the review and releases the compliance hold."
    roles: [ComplianceOfficer]
    code: 200
    input: ["action"]
    output: FairLendingReview
    side_effects:
      - "PUBLISH with EXCEEDS_THRESHOLD: REMEDIATION ledger entry for -remediation_pool_cents, Dealer.compliance_hold := true, increments Dealer.version by 1"
      - "CLOSE from REMEDIATION_ORDERED: Dealer.compliance_hold := false, increments Dealer.version by 1"

# =============================================================================
# 1.6 Error Code Catalog
# =============================================================================
errors:
  - id: ERR_UNAUTHENTICATED
    http: 401
    condition: "X-User-Role or X-User-ID header missing, empty, or naming an unknown role"
  - id: ERR_FORBIDDEN_ROLE
    http: 403
    condition: "The acting role is not listed for the endpoint, or the requested action is reserved for a different role on a multi-action endpoint"
  - id: ERR_DEALER_SCOPE_VIOLATION
    http: 403
    condition: "A DealerPrincipal addresses or names a dealer other than the one their X-User-ID identifies"
  - id: ERR_INVALID_REQUEST
    http: 400
    condition: "Missing required field, wrong type, unknown enum member, out-of-range number, or an interval whose end is not strictly after its start"
  - id: ERR_DEALER_NOT_FOUND
    http: 404
    condition: "No Dealer with the referenced id"
  - id: ERR_AGREEMENT_NOT_FOUND
    http: 404
    condition: "No DealerAgreement with the referenced id"
  - id: ERR_RATE_SHEET_NOT_FOUND
    http: 404
    condition: "No RateSheet with the referenced id"
  - id: ERR_APPLICATION_NOT_FOUND
    http: 404
    condition: "No CreditApplication with the referenced id"
  - id: ERR_CONTRACT_NOT_FOUND
    http: 404
    condition: "No RetailContract with the referenced id"
  - id: ERR_DOCUMENT_NOT_FOUND
    http: 404
    condition: "No ContractDocument with the referenced id"
  - id: ERR_BUYBACK_NOT_FOUND
    http: 404
    condition: "No BuybackDemand with the referenced id"
  - id: ERR_SCORECARD_NOT_FOUND
    http: 404
    condition: "No DealerScorecard with the referenced id"
  - id: ERR_REVIEW_NOT_FOUND
    http: 404
    condition: "No FairLendingReview with the referenced id"
  - id: ERR_RESERVE_ENTRY_NOT_FOUND
    http: 404
    condition: "No ReserveEntry with the referenced id"
  - id: ERR_INVALID_STATE
    http: 409
    condition: "The requested transition is not declared from the resource's current state"
  - id: ERR_DOCS_NOT_VERIFIED
    http: 409
    condition: "Funding attempted while contract.funding_status is not DOCS_VERIFIED"
  - id: ERR_APPLICATION_NOT_APPROVED
    http: 409
    condition: "Contract booking attempted against an application whose status is not APPROVED"
  - id: ERR_STALE_DEALER_VERSION
    http: 412
    condition: "expected_dealer_version does not equal the Dealer's current version"
  - id: ERR_DEALER_COMPLIANCE_HOLD
    http: 409
    condition: "Decisioning, contract booking or funding attempted while Dealer.compliance_hold is true"
  - id: ERR_SEGREGATION_OF_DUTIES
    http: 409
    condition: "The X-User-ID funding the contract equals the X-User-ID that decisioned its application"
  - id: ERR_DEALER_NOT_ACTIVE
    http: 409
    condition: "An origination or funding operation is attempted while Dealer.status is not ACTIVE"
  - id: ERR_NO_INFORCE_AGREEMENT
    http: 422
    condition: "No ACTIVE DealerAgreement whose closed effective window contains the current clock"
  - id: ERR_NO_EFFECTIVE_RATE_SHEET
    http: 422
    condition: "No PUBLISHED RateSheet for the dealer's program_code whose half-open window contains the current clock"
  - id: ERR_RATE_SHEET_NO_TIERS
    http: 422
    condition: "Publish attempted on a rate sheet with tier_count 0"
  - id: ERR_RATE_SHEET_WINDOW_OVERLAP
    http: 409
    condition: "The published window intersects an existing PUBLISHED sheet of the same program_code under half-open semantics"
  - id: ERR_AGREEMENT_WINDOW_CONFLICT
    http: 409
    condition: "A non-superseding agreement starts less than AGREEMENT_NOTICE_BUFFER_DAYS after an existing agreement's effective_to, or a superseding agreement starts outside its predecessor's window"
  - id: ERR_FUNDING_WINDOW_EXPIRED
    http: 422
    condition: "funding_date is more than FUNDING_WINDOW_DAYS after the decision, or precedes the contract_date"
  - id: ERR_INVALID_EVENT_DATE
    http: 422
    condition: "A chargeback event_date precedes the contract's funded_at"
  - id: ERR_NO_ELIGIBLE_TIER
    http: 422
    condition: "The credit score falls in no tier band, or demotion pushes the index past the last tier"
  - id: ERR_DTI_EXCEEDED
    http: 422
    condition: "dti_pct exceeds MAX_DTI_PCT at approval"
  - id: ERR_MARKUP_CAP_EXCEEDED
    http: 422
    condition: "contract_apr_bps is below the pinned buy rate or above the pinned max_contract_apr_bps"
  - id: ERR_ADVANCE_LIMIT_EXCEEDED
    http: 422
    condition: "amount_financed_cents exceeds the assigned tier's advance_rate_pct applied to collateral_value_cents"
  - id: ERR_RESUBMISSION_LIMIT
    http: 409
    condition: "Resubmission attempted after MAX_RESUBMISSIONS successful resubmissions"
  - id: ERR_INSUFFICIENT_REVIEW_POPULATION
    http: 422
    condition: "The fair lending review window holds fewer than MIN_REVIEW_POPULATION funded contracts"
  - id: ERR_CONTRACT_NOT_FUNDED
    http: 409
    condition: "A buyback demand is issued against a contract that is not FUNDED, or that already has an open demand"
  - id: ERR_DEALER_FUNDING_LINE_EXCEEDED
    http: 409
    condition: "Funding would push the dealer's outstanding principal past funding_line_cents"
  - id: ERR_RESERVE_BALANCE_NEGATIVE
    http: 409
    condition: "A manual adjustment or a remediation posting would drive Dealer.reserve_balance_cents below zero"

# =============================================================================
# 1.7 RBAC Matrix
# =============================================================================
roles:
  - name: PortfolioAdmin
    description: "Lender-side program manager: dealer onboarding and lifecycle, agreements, rate sheets, portfolio events, scorecards and repurchase demands."
    identity: opaque
    exclusive_operations:
      - "POST /lending/dealers"
      - "POST /lending/dealers/{id}/status with action in {SUSPEND, REINSTATE, TERMINATE}"
      - "POST /lending/dealers/{id}/reserve-adjustments"
      - "POST /lending/dealers/{id}/scorecards"
      - "POST /lending/scorecards/{id}/finalize"
      - "POST /lending/dealer-agreements"
      - "POST /lending/rate-sheets"
      - "POST /lending/rate-sheets/{id}/tiers"
      - "POST /lending/rate-sheets/{id}/publish"
      - "POST /lending/contracts/{id}/chargeback-events"
      - "POST /lending/buyback-demands"
      - "POST /lending/buyback-demands/{id}/actions with action in {SETTLE, WITHDRAW}"
      - "POST /lending/_clock/set_current_utc"
    shared_operations:
      - "every GET endpoint"

  - name: CreditAnalyst
    description: "Underwriter who decisions applications. Barred by segregation of duties from funding any contract booked on an application they decisioned."
    identity: opaque
    exclusive_operations:
      - "POST /lending/applications/{id}/decision"
    shared_operations:
      - "every GET endpoint"

  - name: FundingSpecialist
    description: "Funding desk that verifies the document package and releases funds."
    identity: opaque
    exclusive_operations:
      - "POST /lending/documents/{id}/verify"
      - "POST /lending/contracts/{id}/fund"
    shared_operations:
      - "every GET endpoint"

  - name: DealerPrincipal
    description: "Dealership owner acting for their own store: countersigns agreements, submits and resubmits applications, books contracts, uploads documents, answers repurchase demands."
    identity: "entity_backed:Dealer"
    exclusive_operations:
      - "POST /lending/dealer-agreements/{id}/countersign"
      - "POST /lending/applications"
      - "POST /lending/applications/{id}/resubmit"
      - "POST /lending/contracts"
      - "POST /lending/contracts/{id}/documents"
      - "POST /lending/buyback-demands/{id}/actions with action in {ACKNOWLEDGE, DISPUTE}"
    shared_operations:
      - "every GET endpoint, restricted to resources whose dealer_id equals X-User-ID"

  - name: ComplianceOfficer
    description: "Fair lending function: runs markup disparity reviews, orders remediation, and places or releases the dealer compliance hold."
    identity: opaque
    exclusive_operations:
      - "POST /lending/fair-lending-reviews"
      - "POST /lending/fair-lending-reviews/{id}/transition"
      - "POST /lending/dealers/{id}/status with action in {COMPLIANCE_HOLD, RELEASE_HOLD}"
    shared_operations:
      - "every GET endpoint"
