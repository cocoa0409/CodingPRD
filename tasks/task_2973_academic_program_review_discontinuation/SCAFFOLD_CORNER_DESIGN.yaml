            - "ExternalReviewer.${ok_rev_id}.visit_count == 1 and travel_buffer_hours == 48 by default"
            - "ReviewCycle.${cycle_id}.state == VISIT_SCHEDULED"

      - name: a_second_team_member_satisfies_all_three_visit_guards
        claim_type: satisfaction_pass
        grounds:
          - validations[priority=21]
          - validations[priority=22]
          - validations[priority=23]
          - state_machines.ReviewCycle.VISIT_SCHEDULED_to_VISIT_SCHEDULED
        distinguishing_aspect: |
          All three visit guards are satisfiable at once on the same days: the
          overlap check at priority 22 is per-reviewer so two different
          reviewers may share a window, and host_capacity_per_day 2 admits
          exactly two visits per calendar day. The cycle self-loops rather than
