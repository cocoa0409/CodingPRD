            - { call: "POST /estimates", payload: { customer_id: "${cust}", job_name: "JB", quantity_ordered: 10002, press_type: "WEB", binding_method: "SADDLE_STITCH", fulfillment_type: "SHIP", signatures: [ { name: "A", pages: 16, up_count: 2, paper_stock_id: "${stock}", make_ready_cents: 150000, rate_per_thousand_cents: 37250 }, { name: "B", pages: 16, up_count: 2, paper_stock_id: "${stock}", make_ready_cents: 150000, rate_per_thousand_cents: 37250 } ], finishing_options: ["PERF", "SCORE"], press_spoilage_pct: 3, bindery_spoilage_pct: 2, included_proof_rounds: 2, quote_valid_days: 30, due_date: "2026-08-20T00:00:00Z" }, as: Estimator, captures: { eb: $.data.id } }
            - { call: "POST /estimates/${ea}/quote", payload: {}, as: Estimator }
            - { call: "POST /estimates/${eb}/quote", payload: {}, as: Estimator }
            - { call: "POST /estimates/${ea}/accept", payload: {}, as: Customer, as_user_id: "${cust}", captures: { ja: $.data.id } }
            - { call: "POST /estimates/${eb}/accept", payload: {}, as: Customer, as_user_id: "${cust}", captures: { jb: $.data.id } }
            - { call: "POST /proofs", payload: { job_id: "${ja}", file_uri: "s3://a.pdf" }, as: PrepressOperator, captures: { pa: $.data.id } }
            - { call: "POST /proofs", payload: { job_id: "${jb}", file_uri: "s3://b.pdf" }, as: PrepressOperator, captures: { pb: $.data.id } }
            - { call: "POST /proofs/${pa}/approve", payload: {}, as: Customer, as_user_id: "${cust}" }
            - { call: "POST /proofs/${pb}/approve", payload: {}, as: Customer, as_user_id: "${cust}" }
            - { call: "POST /presses", payload: { name: "W1", press_type: "WEB", rated_impressions_per_hour: 10000, make_ready_minutes_base: 45, washup_buffer_minutes: 30 }, as: PlantManager, captures: { press: $.data.id, pv: $.data.version } }
            - { call: "POST /press-runs", payload: { press_id: "${press}", job_id: "${ja}", run_quantity: 10002, scheduled_start: "2026-08-10T08:00:00Z", expected_press_version: "${pv}" }, as: PressScheduler, captures: { ra: $.data.id } }
            - { call: "POST /press-runs/${ra}/complete", payload: { gross_impressions: 10002, sheets_used: 10600, waste_sheets: 300 }, as: PressScheduler }
            - { call: "GET /presses/${press}", payload: {}, as: PressScheduler, captures: { pv2: $.data.version } }
            - { call: "POST /press-runs", payload: { press_id: "${press}", job_id: "${jb}", run_quantity: 10002, scheduled_start: "2026-08-11T08:00:00Z", expected_press_version: "${pv2}" }, as: PressScheduler, captures: { rb: $.data.id } }
            - { call: "POST /press-runs/${rb}/complete", payload: { gross_impressions: 10002, sheets_used: 10600, waste_sheets: 300 }, as: PressScheduler }
            - { call: "POST /bindery-tickets", payload: { job_id: "${ja}", operation: "FOLD", sequence_no: 1 }, as: PlantManager, captures: { bta: $.data.id } }
            - { call: "POST /bindery-tickets/${bta}/complete", payload: { pieces_completed: 10502 }, as: PlantManager }
            - { call: "POST /bindery-tickets", payload: { job_id: "${jb}", operation: "FOLD", sequence_no: 1 }, as: PlantManager, captures: { btb: $.data.id } }
            - { call: "POST /bindery-tickets/${btb}/complete", payload: { pieces_completed: 10503 }, as: PlantManager }
          trigger:
            - { call: "POST /jobs/${ja}/record-delivery", payload: { delivered_quantity: 10502 }, as: PlantManager }
            - { call: "POST /jobs/${jb}/record-delivery", payload: { delivered_quantity: 10503 }, as: PlantManager }
            - { call: "POST /invoices", payload: { job_id: "${ja}" }, as: PlantManager, captures: { inva: $.data.id } }
            - { call: "POST /invoices", payload: { job_id: "${jb}" }, as: PlantManager, captures: { invb: $.data.id } }
          assert:
            - "Invoice.${inva}.billable_quantity == 10502 (delivered exactly at inclusive cap bills in full)"
            - "Invoice.${inva}.base_amount_cents == 811923"
            - "Invoice.${invb}.billable_quantity == 10502 (10503 clamps to cap; excess piece is free)"
            - "Invoice.${invb}.base_amount_cents == 811923"
            - "Invoice.${invb}.delivered_quantity == 10503"

      - name: gang_minimum_membership_boundary
        grounds:
