- rule_id: cross_entity_state_dependency
  instances:
  - name: agreement_activation_gated_on_counterparty_approval
    grounds:
    - state_machines.MasterAgreement.DRAFT_to_ACTIVE
    - state_machines.Seller
    - validations[priority=9]
    - errors[ERR_SELLER_NOT_APPROVED]
    distinguishing_aspect: 'Entity pair MasterAgreement -> Seller: activation of the agreement is legal only while the referenced Seller is APPROVED; with the seller still PENDING_APPROVAL the activate
      returns ERR_SELLER_NOT_APPROVED, and the same call succeeds after the seller is approved.'
    test_recipe:
      setup:
      - Clock 2026-09-01. Seller S in PENDING_APPROVAL; Servicer V APPROVED; agreement A DRAFT.
      setup_api_calls:
      - *id006
      - *id007
      - *id008
      - *id010
      - *id011
      trigger:
      - call: POST /gse/master-agreements/${a1}/activate
        payload: {}
        as: GseAdmin
        captures:
          err_ce1: $.data.error_id
      - call: POST /gse/sellers/${s1}/approve
        payload: {}
        as: GseAdmin
      - call: POST /gse/master-agreements/${a1}/activate
        payload: {}
        as: GseAdmin
        captures:
          agr_state: $.data.status
      assert:
      - first activate returns err_ce1 == ERR_SELLER_NOT_APPROVED (http 422) while seller is PENDING_APPROVAL
      - after seller approval the identical activate succeeds and agr_state == ACTIVE
  - name: qc_finding_requires_purchased_loan
    grounds:
    - state_machines.QcAudit.OPEN_to_IN_REVIEW
    - state_machines.Loan
    - errors[ERR_LOAN_NOT_PURCHASED]
    - validations[priority=6]
    distinguishing_aspect: 'Entity pair QcFinding -> Loan: a finding can only cite a loan in PURCHASED status; citing a DRAFT loan returns ERR_LOAN_NOT_PURCHASED while citing the PURCHASED loan succeeds
