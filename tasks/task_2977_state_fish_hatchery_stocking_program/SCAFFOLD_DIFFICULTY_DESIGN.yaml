              as_user_id: "${hatch_id}"
          assert:
            - "HTTP 422 with error_id ERR_HEALTH_CERTIFICATE_EXPIRED"
            - "NOT ERR_LOT_NOT_CERTIFIED — the retained expiry instant is what distinguishes a lapsed lot from a never-certified one"
            - "RearingLot.${lot_id}.health_status == UNSCREENED and certificate_expires_at == 2026-09-24T00:00:00Z (retained)"
            - "HealthInspection.${insp1_id}.status == CERTIFIED (the historical record is untouched)"
            - "StockingEvent.${event3_id}.status == SCHEDULED and TransportUnit.${truck1_id}.status == AVAILABLE"

      - name: warm_water_derate_starts_strictly_above_fifteen_degrees
        grounds:
          - calculations.transport_load_plan
          - entities.StockingEvent.fields.max_fish_allowed
          - validations.transport-capacity
          - endpoints.POST /stocking-events/{id}/load
        distinguishing_aspect: |
          A threshold on a measured float rather than on a clock or a ratio: at
          exactly 15.0 °C the full 0.50 lb/gal density applies, so max_fish_allowed
          is 2500 and a 2400-fish trip loads; the derate belongs to 15.1 °C and
          above, where the same trip would be refused with a ceiling of 2000. The
          stored max_fish_allowed is what makes the accepted side observable.
        test_recipe:
          setup:
            - "The base chain through event creation: E1 SCHEDULED for 2400 fish on TRK-01 (tank 500.0 gal, max_load 300.0 lbs, oxygen 12.0 lpm) drawing from a lot at 45.3592 g"
            - "The clock stands at 2026-09-01T08:00:00Z and the lot is CERTIFIED"
          setup_api_calls:
            - *k_clock_0801
            - *k_hatch
            - *k_water_a
            - *k_truck1
            - *k_brood
            - *k_open
            - *k_spawn1
            - *k_clock_0810
            - *k_take1
            - *k_lot
            - *k_feed1
            - *k_adv_fry
            - *k_adv_fing
            - *k_clock_0820
            - *k_feed2
            - *k_adv_year
            - *k_clock_0825
            - *k_insp1
            - *k_res_neg
            - *k_certify
            - *k_req1
            - *k_plan1
            - *k_attach1
            - *k_plan_v1
            - *k_run1
            - *k_clock_0901
            - *k_lot_v
            - *k_event1
          trigger:
            - call: "POST /stocking-events/${event1_id}/load"
              payload: { loaded_at: "2026-09-01T08:00:00Z", load_water_temp_c: 15.0, measured_load_lbs: 240.0 }
              as: HatcheryManager
              as_user_id: "${hatch_id}"
          assert:
            - "the load returns 201: StockingEvent.${event1_id}.status == IN_TRANSIT"
            - "StockingEvent.${event1_id}.max_fish_allowed == 2500 (un-derated: volume_limit 250.00 lbs, not 200.00)"
            - "StockingEvent.${event1_id}.load_water_temp_c == 15.0 and oxygen_flow_lpm == 3.600"
            - "NOT ERR_TRANSPORT_CAPACITY_EXCEEDED"

  # ===========================================================================
  # RULE 7 — cross_entity_state_dependency
  # ===========================================================================
  - rule_id: cross_entity_state_dependency
    instances:

      - name: spawn_event_creation_requires_brood_stock_in_spawning
        grounds:
          - validations.brood-stock-spawning
          - state_machines.BroodStock.READY_to_SPAWNING
          - errors.ERR_BROOD_STOCK_NOT_SPAWNING
          - endpoints.POST /spawn-events
        distinguishing_aspect: |
          Pair (SpawnEvent, BroodStock): the child cannot be created at all while
          the parent sits in READY, even though every field of the request is valid
          and the station is OPEN with water to spare. Opening the spawning window
          is the only thing that changes, so the test isolates the parent-state gate
          from shape, scope and fiscal checks.
        test_recipe:
          setup:
            - "Hatchery SLVC is OPEN with water_available_af 120.0"
            - "BroodStock SLVC-Hofer exists in status READY — POST /brood-stocks/{id}/open-spawning-window has NOT been called"
            - "The clock stands at 2026-08-01T00:00:00Z, inside the group's spawning window"
          setup_api_calls:
            - *k_clock_0801
            - *k_hatch
            - *k_brood
          trigger:
            - call: "POST /spawn-events"
              payload:
                brood_stock_id: "${brood_id}"
                planned_take_date: "2026-08-10T00:00:00Z"
                females_spawned: 20
                target_release_count: 15000
              as: HatcheryManager
              as_user_id: "${hatch_id}"
          assert:
            - "HTTP 409 with error_id ERR_BROOD_STOCK_NOT_SPAWNING"
            - "BroodStock.${brood_id}.status == READY, females_reserved == 0, females_available == 400"
            - "Hatchery.${hatch_id}.water_reserved_af == 0.0000 and water_available_af == 120.0000"
            - "after POST /brood-stocks/${brood_id}/open-spawning-window the identical call returns 201, proving only the parent's state was blocking"

      - name: release_requires_the_destination_water_active
        grounds:
          - validations.water-active
          - state_machines.Water.ACTIVE_to_CLOSED
          - errors.ERR_WATER_CLOSED
          - endpoints.POST /stocking-events/{id}/release
        distinguishing_aspect: |
          Pair (StockingEvent, Water) reached transitively through the
          StockingRequest: the fish are already on the truck and every temperature
          and tempering figure is legal, but the destination was retired while the
          unit was in transit, so the release is refused and the trip stays
          IN_TRANSIT. The gating row is two hops from the row being written.
        test_recipe:
          setup:
            - "The base chain through loading: E1 is IN_TRANSIT with 2400 fish, loaded at 12.0 degrees C"
            - "The administrator then closes Blue Mesa Reservoir, so Water.status is CLOSED"
            - "The clock stands at 2026-09-01T08:00:00Z"
          setup_api_calls:
            - *k_clock_0801
            - *k_hatch
            - *k_water_a
            - *k_truck1
            - *k_brood
            - *k_open
            - *k_spawn1
            - *k_clock_0810
            - *k_take1
            - *k_lot
            - *k_feed1
            - *k_adv_fry
            - *k_adv_fing
            - *k_clock_0820
            - *k_feed2
            - *k_adv_year
            - *k_clock_0825
            - *k_insp1
            - *k_res_neg
            - *k_certify
            - *k_req1
            - *k_plan1
            - *k_attach1
            - *k_plan_v1
            - *k_run1
            - *k_clock_0901
            - *k_lot_v
            - *k_event1
            - *k_load1
            - call: "POST /waters/${water_a_id}/close"
              payload: {}
              as: ProgramAdmin
          trigger:
            - call: "POST /stocking-events/${event1_id}/release"
              payload: { arrived_at: "2026-09-01T11:00:00Z", site_water_temp_c: 4.5, tempering_minutes: 48, transport_mortality_count: 20 }
              as: HatcheryManager
              as_user_id: "${hatch_id}"
          assert:
            - "HTTP 409 with error_id ERR_WATER_CLOSED"
            - "NOT ERR_TEMP_DELTA_EXCEEDED and NOT ERR_ACCLIMATION_INSUFFICIENT — 7.5 degrees and 48 minutes are both legal"
            - "StockingEvent.${event1_id}.status == IN_TRANSIT, released_count == null, released_at == null"
            - "TransportUnit.${truck1_id}.status == IN_USE and current_event_id == ${event1_id}"
            - "Water.${water_a_id}.status == CLOSED, released_count_ytd == 0, last_release_at == null"
            - "StockingRequest.${req1_id}.status == ALLOCATED and Hatchery.${hatch_id}.budget_spent_cents == 0"

      - name: load_blocked_while_the_station_posture_is_frozen
        grounds:
          - validations.hatchery-not-frozen
          - state_machines.Hatchery.RESTRICTED_to_FROZEN
          - errors.ERR_HATCHERY_FROZEN
          - endpoints.POST /stocking-events/{id}/load
        distinguishing_aspect: |
          Pair (StockingEvent, Hatchery): the gate is the station's DERIVED
          compliance posture rather than a stored status anyone set directly, and it
          is reached from the event through the lot. Two discharge samples flip the
          posture between event creation and loading, so the same load call that
          would have succeeded now reports ERR_HATCHERY_FROZEN while the lot itself
          is still perfectly CERTIFIED.
        test_recipe:
          setup:
            - "The base chain through event creation: E1 is SCHEDULED for 2400 fish and the lot is CERTIFIED to 2026-09-24T00:00:00Z"
            - "Two EXCEEDANCE readings (tss 26.5 then 30.0, flow_af 0.5 each) are logged, so exceedance_count_rolling is 2 and operating_posture is FROZEN"
            - "The clock stands at 2026-09-01T08:00:00Z"
          setup_api_calls:
            - *k_clock_0801
            - *k_hatch
            - *k_water_a
            - *k_truck1
            - *k_brood
            - *k_open
            - *k_spawn1
            - *k_clock_0810
            - *k_take1
            - *k_lot
            - *k_feed1
            - *k_adv_fry
            - *k_adv_fing
            - *k_clock_0820
            - *k_feed2
            - *k_adv_year
            - *k_clock_0825
            - *k_insp1
            - *k_res_neg
            - *k_certify
            - *k_req1
            - *k_plan1
            - *k_attach1
            - *k_plan_v1
            - *k_run1
            - *k_clock_0901
            - *k_lot_v
            - *k_event1
            - call: "POST /effluent-readings"
              payload: { hatchery_id: "${hatch_id}", sampled_at: "2026-09-01T08:00:00Z", tss_mg_l: 26.5, total_phosphorus_mg_l: 0.05, flow_af: 0.5 }
              as: HatcheryManager
              as_user_id: "${hatch_id}"
            - call: "POST /effluent-readings"
              payload: { hatchery_id: "${hatch_id}", sampled_at: "2026-09-01T08:00:00Z", tss_mg_l: 30.0, total_phosphorus_mg_l: 0.05, flow_af: 0.5 }
              as: HatcheryManager
              as_user_id: "${hatch_id}"
          assert:
            - "HTTP 409 with error_id ERR_HATCHERY_FROZEN"
            - "NOT ERR_LOT_NOT_CERTIFIED — RearingLot.${lot_id}.health_status is still CERTIFIED"
            - "Hatchery.${hatch_id}.exceedance_count_rolling == 2 and operating_posture == FROZEN"
            - "Hatchery.${hatch_id}.water_used_af == 2.0000 and water_available_af == 118.0000"
            - "StockingEvent.${event1_id}.status == SCHEDULED and TransportUnit.${truck1_id}.status == AVAILABLE"
            - "BroodStock.${brood_id}.status == SUSPENDED (the freeze cascaded into the brood group, but spawn event S1 was already TAKEN and is untouched)"
            - "SpawnEvent.${spawn1_id}.status == TAKEN"

  # ===========================================================================
  # RULE 8 — resource_temporal_overlap
  # ===========================================================================
  - rule_id: resource_temporal_overlap
    instances:

      - name: touching_trips_on_one_unit_do_not_overlap
        grounds:
          - validations.transport-unit-free
          - entities.StockingEvent.fields.scheduled_depart_at
          - entities.StockingEvent.fields.scheduled_return_at
          - endpoints.POST /stocking-events/{id}/load
        distinguishing_aspect: |
          The half-open edge of the interval predicate on a single TransportUnit:
          trip E2b departs at 14:00:00, exactly when the RELEASED trip E1 returned,
          and must be allowed because intersection requires new.depart <
          existing.return strictly. A closed-interval implementation refuses this
          load.
        test_recipe:
          setup:
            - "The full base chain: E1 ran 08:00–14:00 on TRK-01 and is RELEASED; the trip interval stays on record and the truck is AVAILABLE"
            - "The lot has 13600 fish left and is still CERTIFIED; request R2 is ALLOCATED 2500 by plan P2"
            - "Event E2b is SCHEDULED on the SAME truck for 14:00–20:00 with fish_count 2500"
          setup_api_calls:
            - *k_clock_0801
            - *k_hatch
            - *k_water_a
            - *k_truck1
            - *k_brood
            - *k_open
            - *k_spawn1
            - *k_clock_0810
            - *k_take1
            - *k_lot
            - *k_feed1
            - *k_adv_fry
            - *k_adv_fing
            - *k_clock_0820
            - *k_feed2
            - *k_adv_year
            - *k_clock_0825
            - *k_insp1
            - *k_res_neg
            - *k_certify
            - *k_req1
            - *k_plan1
            - *k_attach1
            - *k_plan_v1
            - *k_run1
            - *k_clock_0901
            - *k_lot_v
            - *k_event1
            - *k_load1
            - *k_release1
            - *k_req2
            - *k_plan3
            - *k_attach2
            - *k_plan3_v1
            - *k_run2
            - *k_lot_v2
            - &k_event2b
              call: "POST /stocking-events"
              payload:
                stocking_request_id: "${req2_id}"
                lot_id: "${lot_id}"
                transport_unit_id: "${truck1_id}"
                fish_count: 2500
                scheduled_depart_at: "2026-09-01T14:00:00Z"
                scheduled_return_at: "2026-09-01T20:00:00Z"
                expected_lot_version: "${lot_v2}"
              as: HatcheryManager
              as_user_id: "${hatch_id}"
              captures: { event2b_id: $.data.id }
          trigger:
            - call: "POST /stocking-events/${event2b_id}/load"
              payload: { loaded_at: "2026-09-01T14:00:00Z", load_water_temp_c: 12.0, measured_load_lbs: 250.0 }
              as: HatcheryManager
              as_user_id: "${hatch_id}"
          assert:
            - "the load returns 201: StockingEvent.${event2b_id}.status == IN_TRANSIT"
            - "StockingEvent.${event2b_id}.max_fish_allowed == 2500 and fish_count 2500 sits exactly on the ceiling"
            - "StockingEvent.${event2b_id}.planned_load_lbs == 250.00, transport_cost_cents == 82500, oxygen_flow_lpm == 3.750"
            - "TransportUnit.${truck1_id}.status == IN_USE and current_event_id == ${event2b_id}"
            - "NOT ERR_TRANSPORT_UNIT_UNAVAILABLE and NOT ERR_OXYGEN_SUPPLY_EXCEEDED (E1 is terminal, so it contributes no oxygen demand)"

      - name: overlapping_trip_on_the_same_unit_is_refused
        grounds:
          - validations.transport-unit-free
          - errors.ERR_TRANSPORT_UNIT_UNAVAILABLE
          - state_machines.TransportUnit.AVAILABLE_to_IN_USE
          - endpoints.POST /stocking-events/{id}/load
        distinguishing_aspect: |
          The refuse side of the same predicate, isolated from every other gate:
          trip E2 departs at 13:00, one hour INSIDE E1's 08:00–14:00 window on the
          same truck, and is loaded at a cold 12.0 degrees C so the capacity ceiling
          is 2500 and cannot fire. The only violated rule is the interval overlap.
        test_recipe:
          setup:
            - "The full base chain with E1 RELEASED after its 08:00–14:00 trip on TRK-01"
            - "Event E2 is SCHEDULED on the SAME truck for 13:00–19:00 with fish_count 2500"
          setup_api_calls:
            - *k_clock_0801
            - *k_hatch
            - *k_water_a
            - *k_truck1
            - *k_brood
            - *k_open
            - *k_spawn1
            - *k_clock_0810
            - *k_take1
            - *k_lot
            - *k_feed1
            - *k_adv_fry
            - *k_adv_fing
            - *k_clock_0820
            - *k_feed2
            - *k_adv_year
            - *k_clock_0825
            - *k_insp1
            - *k_res_neg
            - *k_certify
            - *k_req1
            - *k_plan1
            - *k_attach1
            - *k_plan_v1
            - *k_run1
            - *k_clock_0901
            - *k_lot_v
            - *k_event1
            - *k_load1
            - *k_release1
            - *k_req2
            - *k_plan3
            - *k_attach2
            - *k_plan3_v1
            - *k_run2
            - *k_lot_v2
            - *k_event2
          trigger:
            - call: "POST /stocking-events/${event2_id}/load"
              payload: { loaded_at: "2026-09-01T13:00:00Z", load_water_temp_c: 12.0, measured_load_lbs: 250.0 }
              as: HatcheryManager
              as_user_id: "${hatch_id}"
          assert:
            - "HTTP 409 with error_id ERR_TRANSPORT_UNIT_UNAVAILABLE"
            - "NOT ERR_TRANSPORT_CAPACITY_EXCEEDED (2500 <= 2500 at 12.0 degrees C) and NOT ERR_OXYGEN_SUPPLY_EXCEEDED"
            - "StockingEvent.${event2_id}.status == SCHEDULED, max_fish_allowed == null, loaded_at == null"
            - "TransportUnit.${truck1_id}.status == AVAILABLE and current_event_id == null"
            - "RearingLot.${lot_id}.reserved_count == 2500 (the reservation from event creation is untouched by the failed load)"

      - name: station_oxygen_supply_exceeded_across_two_concurrent_trips
        grounds:
          - validations.oxygen-supply-adequate
          - calculations.transport_load_plan
          - entities.Hatchery.fields.oxygen_supply_lpm
          - errors.ERR_OXYGEN_SUPPLY_EXCEEDED
        distinguishing_aspect: |
          AGGREGATE overlap on a shared station resource rather than on one unit:
          two different trucks are out at the same time, each comfortably inside its
          own diffuser rating (3.600 and 3.750 lpm), but together they ask 7.350 lpm
          of a station rated 6.0. Only the sum over intersecting IN_TRANSIT trips
          detects it, and swapping either truck for the other changes nothing.
        test_recipe:
          setup:
            - "The base chain through loading: E1 is IN_TRANSIT on TRK-01 for 08:00–14:00 with oxygen_flow_lpm 3.600"
            - "Hatchery SLVC has oxygen_supply_lpm 6.0 and a second truck TRK-02 with identical ratings is registered"
            - "Request R2 is ALLOCATED 2500 by plan P2, and event E3b is SCHEDULED on TRK-02 for 13:00–19:00 with fish_count 2500 and oxygen_flow_lpm 3.750 at load time"
