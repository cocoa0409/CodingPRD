      - name: correct_result_campaign_budget_split_across_candidate_stations
        claim_type: correct_result
        grounds:
          - calculations.campaign_station_allocation_cents
        excluded_because:
          difficulty_instance: campaign_allocation_floor_per_station_then_ordered_remainder
          rationale: "The §1.8 instance already asserts the pinned floor-then-ordered-remainder allocation cent by cent across three weighted stations, which subsumes any breadth check that the allocation is simply 'correct'."

      - name: threshold_boundary_surcharge_tier_selected_from_the_subtotal
        claim_type: threshold_boundary
        grounds:
          - calculations.inspection_total_fee_cents
        excluded_because:
          difficulty_instance: inspection_fee_surcharge_tier_from_presurcharge_subtotal
          rationale: "The §1.8 instance already lands the pre-surcharge subtotal exactly on SURCHARGE_TIER_2_THRESHOLD_CENTS and proves the tier is never re-selected from the post-surcharge total, covering both tier boundaries."

      - name: precision_risk_score_clamped_when_credits_exceed_the_points
        claim_type: precision
        grounds:
          - calculations.watercraft_risk_score.formula
          - calculations.watercraft_risk_band
        excluded_because:
          difficulty_instance: risk_score_signed_credits_clamp_with_independent_quarantine_warrant
          rationale: "The §1.8 instance already drives the signed credit terms against the RISK_SCORE_MIN clamp and shows quarantine_warranted staying independent of the clamped band, so a breadth probe of the same clamp would restate it."

      - name: threshold_boundary_treatment_factors_at_their_high_cutoffs
        claim_type: threshold_boundary
        grounds:
          - calculations.decon_treatment_effectiveness.constants
          - calculations.decon_treatment_effectiveness.precision
        excluded_because:
          difficulty_instance: treatment_factors_exactly_at_their_high_thresholds
          rationale: "The §1.8 instance already sits exactly on HIGH_TREATMENT_TEMP_F and HIGH_TREATMENT_PSI and proves both factors resolve to 1.0 there; the corner retained above deliberately probes the other side of both cutoffs instead."

      - name: input_set_filtering_the_two_risk_score_bases_read_different_instants
        claim_type: input_set_filtering
        grounds:
          - calculations.watercraft_risk_score.variants
        excluded_because:
          difficulty_instance: risk_score_arrival_basis_versus_screening_basis
          rationale: "The §1.8 dual-variant instance already separates the two basis instants by more than 24 hours so the dry credits differ, and asserts which variant reaches risk_score and which only advisory_risk_score."

      - name: correct_result_campaign_effectiveness_under_both_methods
        claim_type: correct_result
        grounds:
