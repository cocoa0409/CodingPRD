              as: RecallOperationsManager
              as_user_id: "u-ops-1"
              captures: { dlr1_id: $.data.id }
            - call: "POST /dealers"
              payload: { dealer_code: "D-NE-02", name: "Harbor Motors", region_code: "NE", labor_rate_per_hour: 141.00, monthly_repair_capacity: 40 }
              as: RecallOperationsManager
              as_user_id: "u-ops-1"
              captures: { dlr2_id: $.data.id }
            - call: "POST /parts-allocations"
