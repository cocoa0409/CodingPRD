              payload: {}
              as: MedicalDirector
          assert:
            - "CarePlan.${cpb}.status == ACTIVE"
            - "CarePlan.${cpa}.status == SUPERSEDED"
            - "MedicationOrder.${mo}.status == DISCONTINUED"
            - "Participant.${p}.active_care_plan_id == ${cpb}"

