      - name: segregation_of_duties_is_per_user_not_per_role_on_both_verdicts
        claim_type: segregation_of_duties
        grounds:
          - roles.CertificationApprover.note
          - validations[priority 9]
          - errors[ERR_SOD_APPROVER_IS_SUBMITTER]
          - state_machines.RatingCertification.SUBMITTED_to_APPROVED
          - state_machines.RatingCertification.SUBMITTED_to_REJECTED
          - entities.RatingCertification.fields.submitted_by_user_id
        distinguishing_aspect: >
          The SoD check compares USER IDS, not roles, and it guards BOTH verdicts: the engineer who submitted may
          neither approve nor reject the certification even while wearing the approver role, while any other approver
          may. It also runs at priority 9, i.e. AFTER the state check at priority 8, so a submitter attacking a DRAFT
          certification sees the state error rather than the SoD error - an implementation that checks identity first
          reports the wrong one.
