scaffold_corner_design:
  - section: entities
    instances:
      - name: create_aggregator_success_envelope
        claim_type: Creation
        grounds: [entities.Aggregator, endpoints]
        distinguishing_aspect: "POST /dr/aggregators with all required fields returns 201, response_type object, and a server-minted id; computed balances default to 0."
        test_recipe:
          setup: ["Empty DB."]
          setup_api_calls: []
          trigger:
            - call: "POST /dr/aggregators"
              payload: { name: "Agg", contact_email: "a@x.com" }
              as: ProgramOperator
              captures: { agg_id: $.data.id, bal: $.data.paid_balance_cents }
          assert:
            - "Response is 201 with response_type == object"
            - "Aggregator.paid_balance_cents == 0 and enrolled_committed_kw == 0 at creation"

      - name: create_program_missing_required_name
        claim_type: Required Fields
        grounds: [entities.Program, "errors[ERR_VALIDATION]"]
        distinguishing_aspect: "POST /dr/programs without the required name field returns 422 ERR_VALIDATION."
        test_recipe:
          setup: ["Empty DB."]
          setup_api_calls: []
          trigger:
            - call: "POST /dr/programs"
              payload: { utility_name: "U", incentive_rate_cents_per_kwh: 50, penalty_rate_cents_per_kwh: 80, capacity_incentive_cents_per_kw: 1000, season_start_date: "2026-05-01T00:00:00Z", season_end_date: "2026-09-30T00:00:00Z" }
              as: ProgramOperator
              captures: { err: $.data.error_id }
          assert:
            - "Returns 422 error_id == ERR_VALIDATION"

      - name: program_not_found_returns_404
        claim_type: Not Found
        grounds: [entities.Program, "errors[ERR_PROGRAM_NOT_FOUND]"]
        distinguishing_aspect: "GET /dr/programs/{unknown-uuid} returns 404 ERR_PROGRAM_NOT_FOUND."
        test_recipe:
          setup: ["Empty DB."]
          setup_api_calls: []
          trigger:
            - call: "GET /dr/programs/00000000-0000-4000-8000-000000000000"
              as: ProgramOperator
              captures: { err: $.data.error_id }
          assert:
            - "Returns 404 error_id == ERR_PROGRAM_NOT_FOUND"

      - name: device_customer_fk_not_found
        claim_type: Parent Relationships
        grounds: [entities.Device.fields.customer_id, "errors[ERR_CUSTOMER_NOT_FOUND]"]
        distinguishing_aspect: "POST /dr/devices with a customer_id that does not exist returns 404 ERR_CUSTOMER_NOT_FOUND."
        test_recipe:
          setup: ["An aggregator exists."]
          setup_api_calls:
            - call: "POST /dr/aggregators"
              payload: { name: "Agg", contact_email: "a@x.com" }
              as: ProgramOperator
              captures: { agg_id: $.data.id }
          trigger:
            - call: "POST /dr/devices"
              payload: { customer_id: "00000000-0000-4000-8000-000000000000", device_type: "BATTERY", nameplate_kw: 10, capacity_kwh: 20 }
              as: Aggregator
              as_user_id: "${agg_id}"
              captures: { err: $.data.error_id }
          assert:
            - "Returns 404 error_id == ERR_CUSTOMER_NOT_FOUND"

      - name: invalid_enum_device_type_rejected
        claim_type: Type Constraints
        grounds: [entities.Device.fields.device_type, "errors[ERR_INVALID_ENUM]"]
        distinguishing_aspect: "POST /dr/devices with device_type outside {BATTERY, THERMOSTAT, EV_CHARGER} returns 422 ERR_INVALID_ENUM."
        test_recipe:
          setup: ["An aggregator and a customer exist."]
          setup_api_calls:
            - call: "POST /dr/aggregators"
              payload: { name: "Agg", contact_email: "a@x.com" }
              as: ProgramOperator
              captures: { agg_id: $.data.id }
            - call: "POST /dr/customers"
              payload: { name: "Cust", email: "c@x.com", service_address: "1 St", utility_account_id: "UA1" }
              as: ProgramOperator
              captures: { cust_id: $.data.id }
          trigger:
            - call: "POST /dr/devices"
              payload: { customer_id: "${cust_id}", device_type: "FURNACE", nameplate_kw: 10, capacity_kwh: 20 }
              as: Aggregator
              as_user_id: "${agg_id}"
              captures: { err: $.data.error_id }
          assert:
            - "Returns 422 error_id == ERR_INVALID_ENUM"

      - name: device_aggregator_id_system_assigned
        claim_type: System Fields
        grounds: [entities.Device.fields.aggregator_id]
        distinguishing_aspect: "Device.aggregator_id is set from the acting Aggregator X-User-ID (system source), not supplied by the client."
        test_recipe:
          setup: ["An aggregator and customer exist."]
          setup_api_calls:
            - call: "POST /dr/aggregators"
              payload: { name: "Agg", contact_email: "a@x.com" }
              as: ProgramOperator
              captures: { agg_id: $.data.id }
            - call: "POST /dr/customers"
              payload: { name: "Cust", email: "c@x.com", service_address: "1 St", utility_account_id: "UA1" }
              as: ProgramOperator
              captures: { cust_id: $.data.id }
          trigger:
            - call: "POST /dr/devices"
              payload: { customer_id: "${cust_id}", device_type: "BATTERY", nameplate_kw: 10, capacity_kwh: 20 }
              as: Aggregator
              as_user_id: "${agg_id}"
              captures: { dev_agg: $.data.aggregator_id }
          assert:
            - "Device.aggregator_id == acting aggregator id (${agg_id})"
            - "Device.status == ACTIVE at creation"

  - section: endpoints
    instances:
      - name: list_programs_pagination_envelope
        claim_type: Listing
        grounds: [endpoints, entities.Program]
        distinguishing_aspect: "GET /dr/programs returns response_type array with pagination fields total_count and has_more."
        test_recipe:
          setup: ["Two programs exist."]
          setup_api_calls:
            - call: "POST /dr/programs"
              payload: { name: "P1", utility_name: "U", incentive_rate_cents_per_kwh: 50, penalty_rate_cents_per_kwh: 80, capacity_incentive_cents_per_kw: 1000, season_start_date: "2026-05-01T00:00:00Z", season_end_date: "2026-09-30T00:00:00Z" }
              as: ProgramOperator
            - call: "POST /dr/programs"
              payload: { name: "P2", utility_name: "U", incentive_rate_cents_per_kwh: 50, penalty_rate_cents_per_kwh: 80, capacity_incentive_cents_per_kw: 1000, season_start_date: "2026-05-01T00:00:00Z", season_end_date: "2026-09-30T00:00:00Z" }
              as: ProgramOperator
          trigger:
            - call: "GET /dr/programs"
              as: Auditor
              as_user_id: "aud1"
          assert:
            - "Response response_type == array with total_count == 2 and has_more == false"

  - section: rbac
    instances:
      - name: auditor_cannot_create_program
        claim_type: role_denied
        grounds: [roles.Auditor, "errors[ERR_UNAUTHORIZED]"]
        distinguishing_aspect: "Auditor is read-only; POST /dr/programs as Auditor returns 403 ERR_UNAUTHORIZED."
        test_recipe:
          setup: ["Empty DB."]
          setup_api_calls: []
          trigger:
            - call: "POST /dr/programs"
              payload: { name: "P", utility_name: "U", incentive_rate_cents_per_kwh: 50, penalty_rate_cents_per_kwh: 80, capacity_incentive_cents_per_kw: 1000, season_start_date: "2026-05-01T00:00:00Z", season_end_date: "2026-09-30T00:00:00Z" }
              as: Auditor
              as_user_id: "aud1"
              captures: { err: $.data.error_id }
          assert:
            - "Returns 403 error_id == ERR_UNAUTHORIZED"

      - name: customer_cannot_register_device
        claim_type: role_denied
        grounds: [roles.Customer, endpoints, "errors[ERR_UNAUTHORIZED]"]
        distinguishing_aspect: "Device registration is exclusive to Aggregator; POST /dr/devices as Customer returns 403 ERR_UNAUTHORIZED."
        test_recipe:
          setup: ["A customer exists."]
          setup_api_calls:
            - call: "POST /dr/customers"
              payload: { name: "Cust", email: "c@x.com", service_address: "1 St", utility_account_id: "UA1" }
              as: ProgramOperator
              captures: { cust_id: $.data.id }
          trigger:
            - call: "POST /dr/devices"
              payload: { customer_id: "${cust_id}", device_type: "BATTERY", nameplate_kw: 10, capacity_kwh: 20 }
              as: Customer
              as_user_id: "${cust_id}"
              captures: { err: $.data.error_id }
          assert:
            - "Returns 403 error_id == ERR_UNAUTHORIZED"

      - name: foreign_aggregator_forbidden_device_decommission
        claim_type: ownership_denied
        grounds: [roles.Aggregator, "errors[ERR_FORBIDDEN_OWNERSHIP]"]
        distinguishing_aspect: "An aggregator cannot decommission a device owned by another aggregator; returns 403 ERR_FORBIDDEN_OWNERSHIP."
        test_recipe:
          setup: ["Aggregator A1 owns a device; aggregator A2 also exists."]
          setup_api_calls:
            - call: "POST /dr/aggregators"
              payload: { name: "A1", contact_email: "a1@x.com" }
              as: ProgramOperator
              captures: { a1_id: $.data.id }
            - call: "POST /dr/aggregators"
              payload: { name: "A2", contact_email: "a2@x.com" }
              as: ProgramOperator
              captures: { a2_id: $.data.id }
            - call: "POST /dr/customers"
              payload: { name: "Cust", email: "c@x.com", service_address: "1 St", utility_account_id: "UA1" }
              as: ProgramOperator
              captures: { cust_id: $.data.id }
            - call: "POST /dr/devices"
              payload: { customer_id: "${cust_id}", device_type: "BATTERY", nameplate_kw: 10, capacity_kwh: 20 }
              as: Aggregator
              as_user_id: "${a1_id}"
              captures: { dev_id: $.data.id }
          trigger:
            - call: "POST /dr/devices/${dev_id}/decommission"
              payload: {}
              as: Aggregator
              as_user_id: "${a2_id}"
              captures: { err: $.data.error_id }
          assert:
            - "Returns 403 error_id == ERR_FORBIDDEN_OWNERSHIP"

      - name: missing_headers_returns_unauthenticated
        claim_type: auth_required
        grounds: ["validations[priority=1]", "errors[ERR_UNAUTHENTICATED]"]
        distinguishing_aspect: "A request with no X-User-Role/X-User-ID returns 401 ERR_UNAUTHENTICATED before any other check."
        test_recipe:
          setup: ["Empty DB."]
          setup_api_calls: []
          trigger:
            - call: "POST /dr/aggregators"
              payload: { name: "Agg", contact_email: "a@x.com" }
              as: Anonymous
              captures: { err: $.data.error_id }
          assert:
            - "Returns 401 error_id == ERR_UNAUTHENTICATED"

  - section: state_machines
    instances:
      - name: activate_active_program_rejected
        claim_type: invalid_transition
        grounds: [state_machines.Program.DRAFT_to_ACTIVE, "errors[ERR_INVALID_STATE]"]
        distinguishing_aspect: "Activating an already-ACTIVE program returns 409 ERR_INVALID_STATE (no DRAFT precondition met)."
        test_recipe:
          setup: ["An ACTIVE program."]
          setup_api_calls:
            - call: "POST /dr/programs"
              payload: { name: "P", utility_name: "U", incentive_rate_cents_per_kwh: 50, penalty_rate_cents_per_kwh: 80, capacity_incentive_cents_per_kw: 1000, season_start_date: "2026-05-01T00:00:00Z", season_end_date: "2026-09-30T00:00:00Z" }
              as: ProgramOperator
              captures: { prog_id: $.data.id }
            - call: "POST /dr/programs/${prog_id}/activate"
              payload: {}
              as: ProgramOperator
          trigger:
            - call: "POST /dr/programs/${prog_id}/activate"
              payload: {}
              as: ProgramOperator
              captures: { err: $.data.error_id }
          assert:
            - "Returns 409 error_id == ERR_INVALID_STATE"

      - name: start_before_window_rejected
        claim_type: precondition_enforcement
        grounds: [state_machines.DispatchEvent.NOTIFIED_to_ACTIVE, "errors[ERR_EVENT_NOT_STARTED]"]
        distinguishing_aspect: "Starting a NOTIFIED event while current_utc < window_start returns 409 ERR_EVENT_NOT_STARTED."
        test_recipe:
          setup: ["An ACTIVE program with one active enrollment and a NOTIFIED event (window 14:00-16:00); clock at 13:00."]
          setup_api_calls:
            - call: "POST /dr/aggregators"
              payload: { name: "Agg", contact_email: "a@x.com" }
              as: ProgramOperator
              captures: { agg_id: $.data.id }
            - call: "POST /dr/customers"
              payload: { name: "Cust", email: "c@x.com", service_address: "1 St", utility_account_id: "UA1" }
              as: ProgramOperator
              captures: { cust_id: $.data.id }
            - call: "POST /dr/programs"
              payload: { name: "P", utility_name: "U", incentive_rate_cents_per_kwh: 50, penalty_rate_cents_per_kwh: 80, capacity_incentive_cents_per_kw: 1000, notification_lead_minutes: 60, season_start_date: "2026-05-01T00:00:00Z", season_end_date: "2026-09-30T00:00:00Z" }
              as: ProgramOperator
              captures: { prog_id: $.data.id }
            - call: "POST /dr/programs/${prog_id}/activate"
              payload: {}
              as: ProgramOperator
            - call: "POST /dr/devices"
              payload: { customer_id: "${cust_id}", device_type: "BATTERY", nameplate_kw: 10, capacity_kwh: 20 }
              as: Aggregator
              as_user_id: "${agg_id}"
              captures: { dev_id: $.data.id }
            - call: "POST /dr/enrollments"
              payload: { device_id: "${dev_id}", program_id: "${prog_id}", committed_kw: 5 }
              as: Aggregator
              as_user_id: "${agg_id}"
              captures: { enr_id: $.data.id }
            - call: "POST /dr/enrollments/${enr_id}/activate"
              payload: {}
              as: Aggregator
              as_user_id: "${agg_id}"
            - call: "POST /dr/dispatch-events"
              payload: { program_id: "${prog_id}", window_start: "2026-06-01T14:00:00Z", window_end: "2026-06-01T16:00:00Z", target_reduction_kw: 5 }
              as: ProgramOperator
              captures: { evt_id: $.data.id }
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-06-01T12:00:00Z" }
              as: ProgramOperator
            - call: "POST /dr/dispatch-events/${evt_id}/notify"
              payload: {}
              as: ProgramOperator
              as_user_id: "op1"
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-06-01T13:00:00Z" }
              as: ProgramOperator
          trigger:
            - call: "POST /dr/dispatch-events/${evt_id}/start"
              payload: {}
              as: ProgramOperator
              captures: { err: $.data.error_id }
          assert:
            - "Returns 409 error_id == ERR_EVENT_NOT_STARTED"

      - name: notify_lead_not_met_rejected
        claim_type: violation_to_error
        grounds: ["validations[priority=13]", "errors[ERR_NOTIFY_LEAD_NOT_MET]"]
        distinguishing_aspect: "Notifying only 30 minutes before window_start (< 60-min lead) returns 422 ERR_NOTIFY_LEAD_NOT_MET."
        test_recipe:
          setup: ["An ACTIVE program (lead 60) with one active enrollment and a SCHEDULED event 14:00-16:00; clock 13:30."]
          setup_api_calls:
            - call: "POST /dr/aggregators"
              payload: { name: "Agg", contact_email: "a@x.com" }
              as: ProgramOperator
              captures: { agg_id: $.data.id }
            - call: "POST /dr/customers"
              payload: { name: "Cust", email: "c@x.com", service_address: "1 St", utility_account_id: "UA1" }
              as: ProgramOperator
              captures: { cust_id: $.data.id }
            - call: "POST /dr/programs"
              payload: { name: "P", utility_name: "U", incentive_rate_cents_per_kwh: 50, penalty_rate_cents_per_kwh: 80, capacity_incentive_cents_per_kw: 1000, notification_lead_minutes: 60, season_start_date: "2026-05-01T00:00:00Z", season_end_date: "2026-09-30T00:00:00Z" }
              as: ProgramOperator
              captures: { prog_id: $.data.id }
            - call: "POST /dr/programs/${prog_id}/activate"
              payload: {}
              as: ProgramOperator
            - call: "POST /dr/devices"
              payload: { customer_id: "${cust_id}", device_type: "BATTERY", nameplate_kw: 10, capacity_kwh: 20 }
              as: Aggregator
              as_user_id: "${agg_id}"
              captures: { dev_id: $.data.id }
            - call: "POST /dr/enrollments"
              payload: { device_id: "${dev_id}", program_id: "${prog_id}", committed_kw: 5 }
              as: Aggregator
              as_user_id: "${agg_id}"
              captures: { enr_id: $.data.id }
            - call: "POST /dr/enrollments/${enr_id}/activate"
              payload: {}
              as: Aggregator
              as_user_id: "${agg_id}"
            - call: "POST /dr/dispatch-events"
              payload: { program_id: "${prog_id}", window_start: "2026-06-01T14:00:00Z", window_end: "2026-06-01T16:00:00Z", target_reduction_kw: 5 }
              as: ProgramOperator
              captures: { evt_id: $.data.id }
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-06-01T13:30:00Z" }
              as: ProgramOperator
          trigger:
            - call: "POST /dr/dispatch-events/${evt_id}/notify"
              payload: {}
              as: ProgramOperator
              as_user_id: "op1"
              captures: { err: $.data.error_id }
          assert:
            - "Returns 422 error_id == ERR_NOTIFY_LEAD_NOT_MET"

      - name: notify_no_eligible_enrollments_rejected
        claim_type: precondition_enforcement
        grounds: [state_machines.DispatchEvent.SCHEDULED_to_NOTIFIED, "errors[ERR_NO_ELIGIBLE_ENROLLMENTS]"]
        distinguishing_aspect: "Notifying an event whose program has zero ACTIVE enrollments returns 409 ERR_NO_ELIGIBLE_ENROLLMENTS."
        test_recipe:
          setup: ["An ACTIVE program with NO active enrollments and a SCHEDULED event; clock 12:00."]
          setup_api_calls:
            - call: "POST /dr/programs"
              payload: { name: "P", utility_name: "U", incentive_rate_cents_per_kwh: 50, penalty_rate_cents_per_kwh: 80, capacity_incentive_cents_per_kw: 1000, notification_lead_minutes: 60, season_start_date: "2026-05-01T00:00:00Z", season_end_date: "2026-09-30T00:00:00Z" }
              as: ProgramOperator
              captures: { prog_id: $.data.id }
            - call: "POST /dr/programs/${prog_id}/activate"
              payload: {}
              as: ProgramOperator
            - call: "POST /dr/dispatch-events"
              payload: { program_id: "${prog_id}", window_start: "2026-06-01T14:00:00Z", window_end: "2026-06-01T16:00:00Z", target_reduction_kw: 5 }
              as: ProgramOperator
              captures: { evt_id: $.data.id }
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-06-01T12:00:00Z" }
              as: ProgramOperator
          trigger:
            - call: "POST /dr/dispatch-events/${evt_id}/notify"
              payload: {}
              as: ProgramOperator
              as_user_id: "op1"
              captures: { err: $.data.error_id }
          assert:
            - "Returns 409 error_id == ERR_NO_ELIGIBLE_ENROLLMENTS"

      - name: duplicate_enrollment_rejected
        claim_type: violation_to_error
        grounds: ["validations[priority=11]", "errors[ERR_DUPLICATE_ENROLLMENT]"]
        distinguishing_aspect: "Activating a second enrollment for the same (device, program) while one is already ACTIVE returns 409 ERR_DUPLICATE_ENROLLMENT."
        test_recipe:
          setup: ["An ACTIVE program, a device with one ACTIVE enrollment and a second PENDING enrollment for the same device+program."]
          setup_api_calls:
            - call: "POST /dr/aggregators"
              payload: { name: "Agg", contact_email: "a@x.com" }
              as: ProgramOperator
              captures: { agg_id: $.data.id }
            - call: "POST /dr/customers"
              payload: { name: "Cust", email: "c@x.com", service_address: "1 St", utility_account_id: "UA1" }
              as: ProgramOperator
              captures: { cust_id: $.data.id }
            - call: "POST /dr/programs"
              payload: { name: "P", utility_name: "U", incentive_rate_cents_per_kwh: 50, penalty_rate_cents_per_kwh: 80, capacity_incentive_cents_per_kw: 1000, season_start_date: "2026-05-01T00:00:00Z", season_end_date: "2026-09-30T00:00:00Z" }
              as: ProgramOperator
              captures: { prog_id: $.data.id }
            - call: "POST /dr/programs/${prog_id}/activate"
              payload: {}
              as: ProgramOperator
            - call: "POST /dr/devices"
              payload: { customer_id: "${cust_id}", device_type: "BATTERY", nameplate_kw: 10, capacity_kwh: 20 }
              as: Aggregator
              as_user_id: "${agg_id}"
              captures: { dev_id: $.data.id }
            - call: "POST /dr/enrollments"
              payload: { device_id: "${dev_id}", program_id: "${prog_id}", committed_kw: 5 }
              as: Aggregator
              as_user_id: "${agg_id}"
              captures: { enr1_id: $.data.id }
            - call: "POST /dr/enrollments/${enr1_id}/activate"
              payload: {}
              as: Aggregator
              as_user_id: "${agg_id}"
            - call: "POST /dr/enrollments"
              payload: { device_id: "${dev_id}", program_id: "${prog_id}", committed_kw: 3 }
              as: Aggregator
              as_user_id: "${agg_id}"
              captures: { enr2_id: $.data.id }
          trigger:
            - call: "POST /dr/enrollments/${enr2_id}/activate"
              payload: {}
              as: Aggregator
              as_user_id: "${agg_id}"
              captures: { err: $.data.error_id }
          assert:
            - "Returns 409 error_id == ERR_DUPLICATE_ENROLLMENT"

      - name: decommissioned_device_not_eligible_rejected
        claim_type: precondition_enforcement
        grounds: ["validations[priority=10]", "errors[ERR_DEVICE_NOT_ELIGIBLE]"]
        distinguishing_aspect: "Activating an enrollment whose device has been DECOMMISSIONED returns 409 ERR_DEVICE_NOT_ELIGIBLE."
        test_recipe:
          setup: ["An ACTIVE program, a DECOMMISSIONED device with a PENDING enrollment."]
          setup_api_calls:
            - call: "POST /dr/aggregators"
              payload: { name: "Agg", contact_email: "a@x.com" }
              as: ProgramOperator
              captures: { agg_id: $.data.id }
            - call: "POST /dr/customers"
              payload: { name: "Cust", email: "c@x.com", service_address: "1 St", utility_account_id: "UA1" }
              as: ProgramOperator
              captures: { cust_id: $.data.id }
            - call: "POST /dr/programs"
              payload: { name: "P", utility_name: "U", incentive_rate_cents_per_kwh: 50, penalty_rate_cents_per_kwh: 80, capacity_incentive_cents_per_kw: 1000, season_start_date: "2026-05-01T00:00:00Z", season_end_date: "2026-09-30T00:00:00Z" }
              as: ProgramOperator
              captures: { prog_id: $.data.id }
            - call: "POST /dr/programs/${prog_id}/activate"
              payload: {}
              as: ProgramOperator
            - call: "POST /dr/devices"
              payload: { customer_id: "${cust_id}", device_type: "BATTERY", nameplate_kw: 10, capacity_kwh: 20 }
              as: Aggregator
              as_user_id: "${agg_id}"
              captures: { dev_id: $.data.id }
            - call: "POST /dr/enrollments"
              payload: { device_id: "${dev_id}", program_id: "${prog_id}", committed_kw: 5 }
              as: Aggregator
              as_user_id: "${agg_id}"
              captures: { enr_id: $.data.id }
            - call: "POST /dr/devices/${dev_id}/decommission"
              payload: {}
              as: Aggregator
              as_user_id: "${agg_id}"
          trigger:
            - call: "POST /dr/enrollments/${enr_id}/activate"
              payload: {}
              as: Aggregator
              as_user_id: "${agg_id}"
              captures: { err: $.data.error_id }
          assert:
