  # ===========================================================================
  # Rule 9 — compensating_invariant (different conserved quantities: attempt
  # budget vs credited CE hours)
  # ===========================================================================
  - rule_id: compensating_invariant
    instances:
      - name: attempt_budget_void_restores
        grounds:
          - calculations.retake_eligibility
          - state_machines.CognitiveExamAttempt.SCORED_FAIL_to_VOIDED
          - entities.ProgramCompletionRecord.fields.attempts_consumed
          - entities.ProgramCompletionRecord.fields.attempts_remaining
        distinguishing_aspect: |
          Conserved quantity = attempt budget: forward action (delivering a
          failed exam) consumes 1 of 6; the compensating action (disciplinary
          FINAL voiding that attempt) restores it — attempts_consumed +
          attempts_remaining == 6 holds before and after, with NO_SHOW and
          VOIDED excluded on both sides.
        test_recipe:
          setup:
            - "Candidate failed three attempts (delivered 2026-09-03T12:00Z, 2026-09-18T13:00Z, 2026-10-03T14:00Z; 15-day waits respected): attempts_consumed == 3, attempts_remaining == 3 on the basis record"
          setup_api_calls:
            - { call: "POST /_clock/set_current_utc", payload: { to_iso8601: "2026-09-01T00:00:00Z" }, as: RegistryAdmin }
            - call: "POST /registry/level-definitions"
              payload: { code: "EMT", display_name: "Emergency Medical Technician", scope_summary: "BLS ambulance practice", cognitive_cut_score: 0.66, ce_total_hours: 40, ce_national_min_hours: 20, ce_local_min_hours: 10, ce_individual_min_hours: 10, hourly_model_total_hours: 40, remedial_hours_required: 20, refresher_hours_required: 24, initial_application_fee_cents: 9800, recert_application_fee_cents: 4500 }
              as: RegistryAdmin
              captures: { lv: $.data.id }
            - call: "POST /registry/candidates"
              payload: { full_name: "Ivan Invariant", email: "ivan@example.com" }
              as: Anonymous
              captures: { c: $.data.id }
            - call: "POST /registry/education-programs"
              payload: { name: "County EMT Academy", level_id: "${lv}", director_user_id: "dir-1" }
              as: RegistryAdmin
              captures: { p: $.data.id }
            - call: "POST /registry/program-completion-records"
              payload: { candidate_id: "${c}", program_id: "${p}", completion_date: "2026-09-01" }
              as: ProgramDirector
              as_user_id: "dir-1"
              captures: { rec: $.data.id }
            - { call: "POST /registry/program-completion-records/${rec}/decision", payload: { outcome: "VERIFIED" }, as: RegistryAdmin }
            # --- attempt 1 (fail) ---
            - call: "POST /registry/exam-applications"
              payload: { level_id: "${lv}", completion_record_id: "${rec}" }
              as: Candidate
              as_user_id: "${c}"
              captures: { app1: $.data.id }
            - call: "POST /registry/exam-applications/${app1}/decision"
              payload: { outcome: "APPROVED" }
              as: RegistryAdmin
              captures: { att1: $.data.att_id }
            - call: "POST /registry/cognitive-exam-attempts"
              payload: { att_id: "${att1}", scheduled_start: "2026-09-02T00:00:00Z", scheduled_end: "2026-09-06T00:00:00Z" }
              as: Candidate
              as_user_id: "${c}"
              captures: { at1: $.data.id }
            - { call: "POST /_clock/set_current_utc", payload: { to_iso8601: "2026-09-03T12:00:00Z" }, as: RegistryAdmin }
            - call: "POST /registry/cognitive-exam-attempts/${at1}/responses"
              payload: { responses: [ { item_id: "v1", difficulty_b: 0.5, correct: false }, { item_id: "v2", difficulty_b: 0.5, correct: false }, { item_id: "v3", difficulty_b: 0.5, correct: false }, { item_id: "v4", difficulty_b: 0.5, correct: false }, { item_id: "v5", difficulty_b: 0.5, correct: false }, { item_id: "v6", difficulty_b: 0.5, correct: false } ] }
              as: ExamProctor
            # --- attempt 2 (fail; this one will be voided) ---
            - call: "POST /registry/exam-applications"
              payload: { level_id: "${lv}", completion_record_id: "${rec}" }
              as: Candidate
              as_user_id: "${c}"
              captures: { app2: $.data.id }
            - call: "POST /registry/exam-applications/${app2}/decision"
              payload: { outcome: "APPROVED" }
              as: RegistryAdmin
              captures: { att2: $.data.att_id }
            - call: "POST /registry/cognitive-exam-attempts"
              payload: { att_id: "${att2}", scheduled_start: "2026-09-18T12:00:00Z", scheduled_end: "2026-09-19T00:00:00Z" }
              as: Candidate
              as_user_id: "${c}"
              captures: { at2: $.data.id }
            - { call: "POST /_clock/set_current_utc", payload: { to_iso8601: "2026-09-18T13:00:00Z" }, as: RegistryAdmin }
            - call: "POST /registry/cognitive-exam-attempts/${at2}/responses"
              payload: { responses: [ { item_id: "v1", difficulty_b: 0.5, correct: false }, { item_id: "v2", difficulty_b: 0.5, correct: false }, { item_id: "v3", difficulty_b: 0.5, correct: false }, { item_id: "v4", difficulty_b: 0.5, correct: false }, { item_id: "v5", difficulty_b: 0.5, correct: false }, { item_id: "v6", difficulty_b: 0.5, correct: false } ] }
              as: ExamProctor
            # --- attempt 3 (fail) ---
            - call: "POST /registry/exam-applications"
              payload: { level_id: "${lv}", completion_record_id: "${rec}" }
              as: Candidate
              as_user_id: "${c}"
              captures: { app3: $.data.id }
            - call: "POST /registry/exam-applications/${app3}/decision"
              payload: { outcome: "APPROVED" }
              as: RegistryAdmin
              captures: { att3: $.data.att_id }
            - call: "POST /registry/cognitive-exam-attempts"
              payload: { att_id: "${att3}", scheduled_start: "2026-10-03T13:00:00Z", scheduled_end: "2026-10-04T00:00:00Z" }
              as: Candidate
              as_user_id: "${c}"
              captures: { at3: $.data.id }
            - { call: "POST /_clock/set_current_utc", payload: { to_iso8601: "2026-10-03T14:00:00Z" }, as: RegistryAdmin }
            - call: "POST /registry/cognitive-exam-attempts/${at3}/responses"
              payload: { responses: [ { item_id: "v1", difficulty_b: 0.5, correct: false }, { item_id: "v2", difficulty_b: 0.5, correct: false }, { item_id: "v3", difficulty_b: 0.5, correct: false }, { item_id: "v4", difficulty_b: 0.5, correct: false }, { item_id: "v5", difficulty_b: 0.5, correct: false }, { item_id: "v6", difficulty_b: 0.5, correct: false } ] }
              as: ExamProctor
            - call: "GET /registry/program-completion-records/${rec}"
              payload: {}
              as: RegistryAdmin
              captures: { cons_pre: $.data.attempts_consumed, rem_pre: $.data.attempts_remaining }
            # --- case to FINAL via appeal-deadline sweep ---
            - call: "POST /registry/disciplinary-cases"
              payload: { subject_candidate_id: "${c}", violation_type: "EXAM_SECURITY", description: "Attempt 2 delivered with unauthorized assistance", implicated_attempt_ids: ["${at2}"] }
              as: RegistryAdmin
              as_user_id: "adm-1"
              captures: { dc: $.data.id }
            - { call: "POST /registry/disciplinary-cases/${dc}/issue-notice", payload: {}, as: RegistryAdmin }
            - call: "POST /registry/disciplinary-cases/${dc}/response"
              payload: { response_text: "No comment" }
              as: Candidate
              as_user_id: "${c}"
            - { call: "POST /registry/disciplinary-cases/${dc}/schedule-hearing", payload: {}, as: HearingOfficer, as_user_id: "ho-1" }
            - call: "GET /registry/disciplinary-cases/${dc}"
              payload: {}
              as: RegistryAdmin
              captures: { dcv: $.data.version }
            - { call: "POST /_clock/set_current_utc", payload: { to_iso8601: "2026-10-05T00:00:00Z" }, as: RegistryAdmin }
            - call: "POST /registry/disciplinary-cases/${dc}/decide"
              payload: { sanction_type: "SUSPENSION_12M", findings: "Security violation substantiated", expected_case_version: "${dcv}" }
              as: HearingOfficer
              as_user_id: "ho-1"
          trigger:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-11-05T00:00:00Z" }
              as: RegistryAdmin
              captures: { fin_n: $.data.cases_finalized_count }
            - call: "GET /registry/cognitive-exam-attempts/${at2}"
              payload: {}
              as: RegistryAdmin
              captures: { at2_st: $.data.status }
            - call: "GET /registry/program-completion-records/${rec}"
              payload: {}
              as: RegistryAdmin
              captures: { cons_post: $.data.attempts_consumed, rem_post: $.data.attempts_remaining }
          assert:
            - "Before FINAL: attempts_consumed == 3 and attempts_remaining == 3 (invariant sum == 6)"
            - "Sweep finalizes the case: cases_finalized_count == 1"
            - "Attempt.${at2}.status == VOIDED (compensating action)"
            - "After FINAL: attempts_consumed == 2 and attempts_remaining == 4 — the void restored exactly one unit; invariant sum == 6 holds on both sides"

      - name: ce_audit_reject_restores_credited_total
        grounds:
          - calculations.ce_credit_waterfall
          - state_machines.CECreditEntry.RECORDED_to_REJECTED
          - entities.RecertApplication.fields.total_credited_hours
        distinguishing_aspect: |
          Conserved quantity = credited CE hours (different quantity from the
          attempt budget): recording a 20-hour entry raises the total to 40;
          the compensating audit verdict (REJECTED) removes exactly those
          hours, leaving total_credited_hours == 20 — identical to a portfolio
          that never contained the entry (VERIFIED entries only).
        test_recipe:
          setup:
            - "ACTIVE EMT cert; clock 2027-10-15; NCCP draft with NATIONAL 20 (single provider MegaCE -> audit flag), LOCAL 10, INDIVIDUAL 10; submission selects AUDIT_PENDING"
