# =============================================================================
# §1.9 Scaffold Corner Design — Industrial Safety & LOTO Program
# Breadth coverage of testable claims in §1.1–§1.7 not already covered by §1.8.
# Bootstrap convention (same as §1.8): the first POST /employees registers the
# EHS manager's record under literal operator id
# 00000000-0000-4000-8000-000000000001.
# Sections and claim_type values follow references/claim-extraction-guide.md.
# =============================================================================

scaffold_corner_design:
  # ===========================================================================
  - section: entities
    instances:
      - name: machine_creation_applies_defaults
        claim_type: creation
        grounds: ["entities.Machine", "endpoints[POST /machines]"]
        distinguishing_aspect: "Create with valid input returns 201 plus system defaults: status IN_SERVICE, risk_tier LOW, risk_score 0, open_session_count 0, version 1, server-minted UUID id."
        test_recipe:
          setup: ["Only the manager bootstrap employee exists"]
          setup_api_calls:
            - call: "POST /employees"
              payload: { employee_no: "E-MGR-CD", full_name: "Mgr CD", qualification: "AUTHORIZED" }
              as: EHSManager
              as_user_id: "00000000-0000-4000-8000-000000000001"
              captures: { mgr: $.data.id }
          trigger:
            - call: "POST /machines"
              payload: { asset_tag: "A-CD-1", name: "Lathe", area: "Bay 1", risk_window_policy: "ROLLING_12MO" }
              as: EHSManager
              as_user_id: "${mgr}"
              captures: { m: $.data.id }
          assert:
            - "Machine.${m}.status == IN_SERVICE, risk_tier == LOW, risk_score == 0, open_session_count == 0, version == 1"
            - "Machine.${m}.id is a server-minted UUID; created_at == 2026-08-01T00:00:00Z (default clock)"

      - name: machine_missing_required_field_returns_invalid_request
        claim_type: required_fields
        grounds: ["entities.Machine.fields.asset_tag", "errors[ERR_VALIDATION]"]
        distinguishing_aspect: "Omitting required asset_tag yields 400 ERR_VALIDATION and no machine is persisted."
        test_recipe:
          setup: ["Manager bootstrap employee exists"]
          setup_api_calls:
            - call: "POST /employees"
              payload: { employee_no: "E-MGR-RF", full_name: "Mgr RF", qualification: "AUTHORIZED" }
              as: EHSManager
              as_user_id: "00000000-0000-4000-8000-000000000001"
              captures: { mgr: $.data.id }
          trigger:
            - call: "POST /machines"
              payload: { name: "NoTag", area: "Bay 2", risk_window_policy: "ROLLING_12MO" }
              as: EHSManager
              as_user_id: "${mgr}"
              captures: { err: $.data.error_id }
          assert:
            - "${err} == ERR_VALIDATION (http 400)"
            - "GET /machines returns total_count == 0"

      - name: machine_invalid_enum_returns_invalid_request
        claim_type: type_constraints
        grounds: ["entities.Machine.fields.risk_window_policy", "errors[ERR_VALIDATION]"]
        distinguishing_aspect: "risk_window_policy outside {ROLLING_12MO, SINCE_PROCEDURE_ACTIVATION} is rejected 400 ERR_VALIDATION."
        test_recipe:
          setup: ["Manager bootstrap employee exists"]
          setup_api_calls:
            - call: "POST /employees"
              payload: { employee_no: "E-MGR-EN", full_name: "Mgr EN", qualification: "AUTHORIZED" }
              as: EHSManager
              as_user_id: "00000000-0000-4000-8000-000000000001"
              captures: { mgr: $.data.id }
          trigger:
            - call: "POST /machines"
              payload: { asset_tag: "A-EN-1", name: "BadEnum", area: "Bay 3", risk_window_policy: "MONTHLY" }
              as: EHSManager
              as_user_id: "${mgr}"
              captures: { err: $.data.error_id }
          assert:
            - "${err} == ERR_VALIDATION (http 400)"

      - name: machine_get_not_found_returns_404
        claim_type: not_found
        grounds: ["endpoints[GET /machines/{id}]", "errors[ERR_NOT_FOUND]"]
        distinguishing_aspect: "GET with a well-formed but unknown machine id returns 404 ERR_NOT_FOUND."
        test_recipe:
          setup: ["Manager bootstrap employee exists"]
          setup_api_calls:
            - call: "POST /employees"
              payload: { employee_no: "E-MGR-NF", full_name: "Mgr NF", qualification: "AUTHORIZED" }
              as: EHSManager
              as_user_id: "00000000-0000-4000-8000-000000000001"
              captures: { mgr: $.data.id }
          trigger:
            - call: "GET /machines/8a3e1c0b-2f4d-4a91-9c8b-12e7b6a0f1d2"
              payload: {}
              as: EHSManager
              as_user_id: "${mgr}"
              captures: { err: $.data.error_id }
          assert:
            - "${err} == ERR_NOT_FOUND (http 404)"

      - name: survey_computed_field_input_ignored
        claim_type: computed_fields
        grounds: ["entities.EnergySurvey.fields.isolation_point_count"]
        distinguishing_aspect: "isolation_point_count is computed as len(energy_sources); a client-sent value of 99 is ignored and the response shows 2."
        test_recipe:
          setup: ["Manager and surveyor W1 exist; machine M exists"]
          setup_api_calls:
            - call: "POST /employees"
              payload: { employee_no: "E-MGR-CF", full_name: "Mgr CF", qualification: "AUTHORIZED" }
              as: EHSManager
              as_user_id: "00000000-0000-4000-8000-000000000001"
              captures: { mgr: $.data.id }
            - call: "POST /employees"
              payload: { employee_no: "E-W1-CF", full_name: "W1 CF", qualification: "AUTHORIZED" }
              as: EHSManager
              as_user_id: "${mgr}"
              captures: { w1: $.data.id }
            - call: "POST /machines"
              payload: { asset_tag: "A-CF-1", name: "Mill", area: "Bay 4", risk_window_policy: "ROLLING_12MO" }
              as: EHSManager
              as_user_id: "${mgr}"
              captures: { m: $.data.id }
          trigger:
            - call: "POST /energy-surveys"
              payload: { machine_id: "${m}", isolation_point_count: 99, energy_sources: [{ source_type: "ELECTRICAL", magnitude: "480V", isolation_point: "DP-1", dissipation_method: "none" }, { source_type: "PNEUMATIC", magnitude: "120psi", isolation_point: "VA-2", dissipation_method: "bleed" }] }
              as: AuthorizedEmployee
              as_user_id: "${w1}"
              captures: { sv: $.data.id }
          assert:
            - "EnergySurvey.${sv}.isolation_point_count == 2 (client-supplied 99 ignored)"
            - "EnergySurvey.${sv}.status == DRAFT (initial state)"

      - name: procedure_revision_no_increments_per_machine
        claim_type: computed_fields
        grounds: ["entities.LockoutProcedure.fields.revision_no"]
        distinguishing_aspect: "First revision gets revision_no 1; after a modification drives it UNDER_REVISION, the successor DRAFT for the same machine gets revision_no 2."
        test_recipe:
          setup: ["Machine M with APPROVED survey and ACTIVE procedure P1 (revision 1); manager holds Machine.version"]
          setup_api_calls:
            - call: "POST /employees"
              payload: { employee_no: "E-MGR-RN", full_name: "Mgr RN", qualification: "AUTHORIZED" }
              as: EHSManager
              as_user_id: "00000000-0000-4000-8000-000000000001"
              captures: { mgr: $.data.id }
            - call: "POST /employees"
              payload: { employee_no: "E-W1-RN", full_name: "W1 RN", qualification: "AUTHORIZED" }
              as: EHSManager
              as_user_id: "${mgr}"
              captures: { w1: $.data.id }
            - call: "POST /machines"
              payload: { asset_tag: "A-RN-1", name: "Saw", area: "Bay 5", risk_window_policy: "ROLLING_12MO" }
              as: EHSManager
              as_user_id: "${mgr}"
              captures: { m: $.data.id, m_v: $.data.version }
            - call: "POST /energy-surveys"
              payload: { machine_id: "${m}", energy_sources: [{ source_type: "ELECTRICAL", magnitude: "240V", isolation_point: "DP-1", dissipation_method: "none" }] }
              as: AuthorizedEmployee
              as_user_id: "${w1}"
              captures: { sv: $.data.id }
            - call: "POST /energy-surveys/${sv}/submit"
              payload: {}
              as: AuthorizedEmployee
              as_user_id: "${w1}"
            - call: "POST /energy-surveys/${sv}/approve"
              payload: {}
              as: EHSManager
              as_user_id: "${mgr}"
            - call: "POST /lockout-procedures"
              payload: { machine_id: "${m}", survey_id: "${sv}", steps: [{ step_no: 1, action: "Open disconnect", isolation_point: "DP-1" }] }
              as: EHSManager
              as_user_id: "${mgr}"
              captures: { p1: $.data.id }
            - call: "POST /lockout-procedures/${p1}/activate"
              payload: {}
              as: EHSManager
              as_user_id: "${mgr}"
          trigger:
            - call: "POST /machines/${m}/modifications"
              payload: { description: "Added second feed roller", expected_machine_version: "${m_v}" }
              as: EHSManager
              as_user_id: "${mgr}"
            - call: "POST /lockout-procedures"
              payload: { machine_id: "${m}", survey_id: "${sv}", steps: [{ step_no: 1, action: "Open disconnect", isolation_point: "DP-1" }, { step_no: 2, action: "Block roller", isolation_point: "DP-1" }] }
              as: EHSManager
              as_user_id: "${mgr}"
              captures: { p2: $.data.id }
          assert:
            - "LockoutProcedure.${p1}.revision_no == 1 and status == UNDER_REVISION"
            - "LockoutProcedure.${p2}.revision_no == 2 and status == DRAFT"

      - name: modification_log_entry_created_unreviewed
        claim_type: immutability
        grounds: ["entities.MachineModification", "endpoints[GET /machines/{id}/modifications]"]
        distinguishing_aspect: "MachineModification is an append-only log (common_fields false): creation records review_status UNREVIEWED and the list endpoint returns exactly one entry; no update/delete endpoint exists for it."
        test_recipe:
          setup: ["Machine M exists; manager holds Machine.version from the create response"]
          setup_api_calls:
            - call: "POST /employees"
              payload: { employee_no: "E-MGR-IM", full_name: "Mgr IM", qualification: "AUTHORIZED" }
              as: EHSManager
              as_user_id: "00000000-0000-4000-8000-000000000001"
              captures: { mgr: $.data.id }
            - call: "POST /machines"
              payload: { asset_tag: "A-IM-1", name: "Drill", area: "Bay 6", risk_window_policy: "ROLLING_12MO" }
              as: EHSManager
              as_user_id: "${mgr}"
              captures: { m: $.data.id, m_v: $.data.version }
          trigger:
            - call: "POST /machines/${m}/modifications"
              payload: { description: "Replaced guard interlock", expected_machine_version: "${m_v}" }
              as: EHSManager
              as_user_id: "${mgr}"
              captures: { mod: $.data.id }
            - call: "GET /machines/${m}/modifications"
              payload: {}
              as: EHSManager
              as_user_id: "${mgr}"
          assert:
            - "MachineModification.${mod}.review_status == UNREVIEWED"
            - "GET /machines/${m}/modifications returns total_count == 1 containing ${mod}"
            - "Machine.${m}.version == ${m_v} + 1"

      - name: machines_list_pagination_envelope
        claim_type: listing
        grounds: ["response_envelope", "endpoints[GET /machines]"]
        distinguishing_aspect: "List responses carry limit/offset/total_count/has_more; limit 2 over 3 machines yields has_more true on page 1 and false on page 2."
        test_recipe:
          setup: ["Manager bootstrap employee and three machines exist"]
          setup_api_calls:
            - call: "POST /employees"
              payload: { employee_no: "E-MGR-PG2", full_name: "Mgr PG2", qualification: "AUTHORIZED" }
              as: EHSManager
              as_user_id: "00000000-0000-4000-8000-000000000001"
              captures: { mgr: $.data.id }
            - call: "POST /machines"
              payload: { asset_tag: "A-PG-1", name: "M1", area: "Bay 7", risk_window_policy: "ROLLING_12MO" }
              as: EHSManager
              as_user_id: "${mgr}"
            - call: "POST /machines"
              payload: { asset_tag: "A-PG-2", name: "M2", area: "Bay 7", risk_window_policy: "ROLLING_12MO" }
              as: EHSManager
              as_user_id: "${mgr}"
            - call: "POST /machines"
              payload: { asset_tag: "A-PG-3", name: "M3", area: "Bay 7", risk_window_policy: "ROLLING_12MO" }
              as: EHSManager
              as_user_id: "${mgr}"
          trigger:
            - call: "GET /machines"
              payload: { limit: 2, offset: 0 }
              as: EHSManager
              as_user_id: "${mgr}"
            - call: "GET /machines"
              payload: { limit: 2, offset: 2 }
              as: EHSManager
              as_user_id: "${mgr}"
          assert:
            - "Page 1: 2 items, total_count == 3, has_more == true"
            - "Page 2: 1 item, total_count == 3, has_more == false"
            - "Both responses use the §1.0 envelope with meta.api_request_id present"

  # ===========================================================================
  - section: state_machines
    instances:
      - name: session_lock_from_locked_returns_invalid_state
        claim_type: invalid_transition
        grounds: ["state_machines.LockoutSession", "errors[ERR_INVALID_STATE]"]
        distinguishing_aspect: "LOCKED is not a source state for the lock trigger; a second lock call fails ERR_INVALID_STATE with no side effects."
        test_recipe:
          setup: ["Machine M, ACTIVE procedure P, qualified W1, session S already LOCKED"]
          setup_api_calls:
            - call: "POST /employees"
              payload: { employee_no: "E-MGR-IV1", full_name: "Mgr IV1", qualification: "AUTHORIZED" }
              as: EHSManager
              as_user_id: "00000000-0000-4000-8000-000000000001"
              captures: { mgr: $.data.id }
            - call: "POST /employees"
              payload: { employee_no: "E-W1-IV1", full_name: "W1 IV1", qualification: "AUTHORIZED" }
              as: EHSManager
              as_user_id: "${mgr}"
              captures: { w1: $.data.id }
            - call: "POST /training-records"
              payload: { employee_id: "${w1}", course_code: "LOTO_AUTHORIZED_INITIAL", delivery_mode: "IN_PERSON" }
              as: EHSManager
              as_user_id: "${mgr}"
              captures: { t1: $.data.id }
            - call: "POST /training-records/${t1}/complete"
              payload: {}
              as: EHSManager
              as_user_id: "${mgr}"
            - call: "POST /machines"
              payload: { asset_tag: "A-IV1-1", name: "Press", area: "Bay 8", risk_window_policy: "ROLLING_12MO" }
              as: EHSManager
              as_user_id: "${mgr}"
              captures: { m: $.data.id }
            - call: "POST /energy-surveys"
              payload: { machine_id: "${m}", energy_sources: [{ source_type: "ELECTRICAL", magnitude: "240V", isolation_point: "DP-1", dissipation_method: "none" }] }
              as: AuthorizedEmployee
              as_user_id: "${w1}"
              captures: { sv: $.data.id }
            - call: "POST /energy-surveys/${sv}/submit"
              payload: {}
              as: AuthorizedEmployee
              as_user_id: "${w1}"
            - call: "POST /energy-surveys/${sv}/approve"
              payload: {}
              as: EHSManager
              as_user_id: "${mgr}"
            - call: "POST /lockout-procedures"
              payload: { machine_id: "${m}", survey_id: "${sv}", steps: [{ step_no: 1, action: "Open disconnect", isolation_point: "DP-1" }] }
              as: EHSManager
              as_user_id: "${mgr}"
              captures: { p: $.data.id }
            - call: "POST /lockout-procedures/${p}/activate"
              payload: {}
              as: EHSManager
              as_user_id: "${mgr}"
            - call: "POST /lockout-sessions"
              payload: { machine_id: "${m}", procedure_id: "${p}", session_type: "INDIVIDUAL" }
              as: AuthorizedEmployee
              as_user_id: "${w1}"
              captures: { s: $.data.id }
            - call: "POST /employee-locks"
              payload: { session_id: "${s}", lock_no: "L-IV1-1", tag_no: "T-IV1-1" }
              as: AuthorizedEmployee
              as_user_id: "${w1}"
              captures: { l1: $.data.id }
            - call: "POST /employee-locks/${l1}/apply"
              payload: {}
              as: AuthorizedEmployee
              as_user_id: "${w1}"
            - call: "POST /lockout-sessions/${s}/lock"
              payload: { zero_energy_verified: true }
              as: AuthorizedEmployee
              as_user_id: "${w1}"
          trigger:
            - call: "POST /lockout-sessions/${s}/lock"
              payload: { zero_energy_verified: true }
              as: AuthorizedEmployee
              as_user_id: "${w1}"
              captures: { err: $.data.error_id }
          assert:
            - "${err} == ERR_INVALID_STATE (http 409)"
            - "LockoutSession.${s}.status remains LOCKED and started_at is unchanged"

      - name: session_release_from_locked_returns_invalid_state
        claim_type: invalid_transition
        grounds: ["state_machines.LockoutSession", "errors[ERR_INVALID_STATE]"]
        distinguishing_aspect: "release exists only from CLEARED; calling it from LOCKED (work not cleared) fails ERR_INVALID_STATE."
        test_recipe:
          setup: ["Machine M, ACTIVE procedure P, qualified W1, session S LOCKED with one APPLIED lock"]
          setup_api_calls:
            - call: "POST /employees"
              payload: { employee_no: "E-MGR-IV2", full_name: "Mgr IV2", qualification: "AUTHORIZED" }
              as: EHSManager
              as_user_id: "00000000-0000-4000-8000-000000000001"
              captures: { mgr: $.data.id }
            - call: "POST /employees"
              payload: { employee_no: "E-W1-IV2", full_name: "W1 IV2", qualification: "AUTHORIZED" }
              as: EHSManager
              as_user_id: "${mgr}"
              captures: { w1: $.data.id }
            - call: "POST /training-records"
              payload: { employee_id: "${w1}", course_code: "LOTO_AUTHORIZED_INITIAL", delivery_mode: "IN_PERSON" }
              as: EHSManager
              as_user_id: "${mgr}"
              captures: { t1: $.data.id }
            - call: "POST /training-records/${t1}/complete"
              payload: {}
              as: EHSManager
              as_user_id: "${mgr}"
            - call: "POST /machines"
              payload: { asset_tag: "A-IV2-1", name: "Press", area: "Bay 9", risk_window_policy: "ROLLING_12MO" }
              as: EHSManager
              as_user_id: "${mgr}"
              captures: { m: $.data.id }
            - call: "POST /energy-surveys"
              payload: { machine_id: "${m}", energy_sources: [{ source_type: "ELECTRICAL", magnitude: "240V", isolation_point: "DP-1", dissipation_method: "none" }] }
              as: AuthorizedEmployee
              as_user_id: "${w1}"
              captures: { sv: $.data.id }
            - call: "POST /energy-surveys/${sv}/submit"
              payload: {}
              as: AuthorizedEmployee
              as_user_id: "${w1}"
            - call: "POST /energy-surveys/${sv}/approve"
              payload: {}
              as: EHSManager
              as_user_id: "${mgr}"
            - call: "POST /lockout-procedures"
              payload: { machine_id: "${m}", survey_id: "${sv}", steps: [{ step_no: 1, action: "Open disconnect", isolation_point: "DP-1" }] }
              as: EHSManager
              as_user_id: "${mgr}"
              captures: { p: $.data.id }
            - call: "POST /lockout-procedures/${p}/activate"
              payload: {}
              as: EHSManager
              as_user_id: "${mgr}"
            - call: "POST /lockout-sessions"
              payload: { machine_id: "${m}", procedure_id: "${p}", session_type: "INDIVIDUAL" }
              as: AuthorizedEmployee
              as_user_id: "${w1}"
              captures: { s: $.data.id }
            - call: "POST /employee-locks"
              payload: { session_id: "${s}", lock_no: "L-IV2-1", tag_no: "T-IV2-1" }
              as: AuthorizedEmployee
              as_user_id: "${w1}"
              captures: { l1: $.data.id }
            - call: "POST /employee-locks/${l1}/apply"
              payload: {}
              as: AuthorizedEmployee
              as_user_id: "${w1}"
            - call: "POST /lockout-sessions/${s}/lock"
              payload: { zero_energy_verified: true }
              as: AuthorizedEmployee
              as_user_id: "${w1}"
          trigger:
            - call: "POST /lockout-sessions/${s}/release"
              payload: {}
              as: AuthorizedEmployee
              as_user_id: "${w1}"
              captures: { err: $.data.error_id }
          assert:
            - "${err} == ERR_INVALID_STATE (http 409)"
            - "LockoutSession.${s}.status remains LOCKED; ended_at still null"

      - name: survey_approve_from_draft_returns_invalid_state
        claim_type: invalid_transition
        grounds: ["state_machines.EnergySurvey", "errors[ERR_INVALID_STATE]"]
        distinguishing_aspect: "approve exists only from SUBMITTED; approving a DRAFT survey fails ERR_INVALID_STATE even when the approver is not the surveyor (state check precedes SoD)."
        test_recipe:
          setup: ["Machine M; survey SV in DRAFT created by W1; approver MGR is a different employee"]
          setup_api_calls:
            - call: "POST /employees"
              payload: { employee_no: "E-MGR-IV3", full_name: "Mgr IV3", qualification: "AUTHORIZED" }
              as: EHSManager
              as_user_id: "00000000-0000-4000-8000-000000000001"
              captures: { mgr: $.data.id }
            - call: "POST /employees"
              payload: { employee_no: "E-W1-IV3", full_name: "W1 IV3", qualification: "AUTHORIZED" }
              as: EHSManager
              as_user_id: "${mgr}"
              captures: { w1: $.data.id }
            - call: "POST /machines"
              payload: { asset_tag: "A-IV3-1", name: "Press", area: "Bay 10", risk_window_policy: "ROLLING_12MO" }
              as: EHSManager
              as_user_id: "${mgr}"
              captures: { m: $.data.id }
            - call: "POST /energy-surveys"
              payload: { machine_id: "${m}", energy_sources: [{ source_type: "ELECTRICAL", magnitude: "240V", isolation_point: "DP-1", dissipation_method: "none" }] }
              as: AuthorizedEmployee
              as_user_id: "${w1}"
              captures: { sv: $.data.id }
          trigger:
            - call: "POST /energy-surveys/${sv}/approve"
              payload: {}
              as: EHSManager
              as_user_id: "${mgr}"
              captures: { err: $.data.error_id }
          assert:
            - "${err} == ERR_INVALID_STATE (http 409)"
            - "EnergySurvey.${sv}.status remains DRAFT"

      - name: lock_remove_from_issued_returns_invalid_state
        claim_type: invalid_transition
        grounds: ["state_machines.EmployeeLock", "errors[ERR_INVALID_STATE]"]
        distinguishing_aspect: "remove exists only from APPLIED; removing an ISSUED (never applied) lock fails ERR_INVALID_STATE."
        test_recipe:
          setup: ["Machine M, ACTIVE procedure P, qualified W1, session S SETUP, lock L1 ISSUED but never applied"]
          setup_api_calls:
            - call: "POST /employees"
              payload: { employee_no: "E-MGR-IV4", full_name: "Mgr IV4", qualification: "AUTHORIZED" }
              as: EHSManager
              as_user_id: "00000000-0000-4000-8000-000000000001"
              captures: { mgr: $.data.id }
            - call: "POST /employees"
              payload: { employee_no: "E-W1-IV4", full_name: "W1 IV4", qualification: "AUTHORIZED" }
              as: EHSManager
              as_user_id: "${mgr}"
              captures: { w1: $.data.id }
            - call: "POST /training-records"
              payload: { employee_id: "${w1}", course_code: "LOTO_AUTHORIZED_INITIAL", delivery_mode: "IN_PERSON" }
              as: EHSManager
              as_user_id: "${mgr}"
              captures: { t1: $.data.id }
            - call: "POST /training-records/${t1}/complete"
              payload: {}
              as: EHSManager
              as_user_id: "${mgr}"
            - call: "POST /machines"
              payload: { asset_tag: "A-IV4-1", name: "Press", area: "Bay 11", risk_window_policy: "ROLLING_12MO" }
              as: EHSManager
              as_user_id: "${mgr}"
              captures: { m: $.data.id }
            - call: "POST /energy-surveys"
              payload: { machine_id: "${m}", energy_sources: [{ source_type: "ELECTRICAL", magnitude: "240V", isolation_point: "DP-1", dissipation_method: "none" }] }
              as: AuthorizedEmployee
