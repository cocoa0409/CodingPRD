            - call: "POST /child-support/cases/${casev7}/closure"
              payload: { closed_reason: "ARREARS_SATISFIED" }
              as: SupervisingAttorney
              captures: { cl_st: "$.data.case_status", cl_reason: "$.data.closed_reason", cl_at: "$.data.closed_at" }
