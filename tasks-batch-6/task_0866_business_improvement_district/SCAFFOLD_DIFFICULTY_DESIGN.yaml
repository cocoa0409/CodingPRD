              as: DistrictAdministrator
              captures: { px_id: $.data.id }
            - call: "POST /business-improvement-districts/${bid_id}/activate"
              payload: {}
              as: BoardMember
            - call: "POST /business-improvement-districts/${bid_id}/fiscal-years"
              payload: { year_label: "FY2028", start_date: "2027-07-01T00:00:00Z", end_date: "2028-07-01T00:00:00Z", assessment_due_date: "2027-08-01T00:00:00Z" }
              as: DistrictAdministrator
              captures: { fy_id: $.data.id }
            - call: "POST /fiscal-years/${fy_id}/budget"
              payload: { total_expenditure_cents: 4025000, other_revenue_cents: 0 }
              as: DistrictAdministrator
              captures: { budget_id: $.data.id }
            - call: "POST /budgets/${budget_id}/work-plan-lines"
              payload: { category: "CLEAN", allocated_amount_cents: 4025000 }
              as: DistrictAdministrator
            - call: "POST /budgets/${budget_id}/propose"
              payload: {}
              as: DistrictAdministrator
            - call: "GET /assessments"
              payload: { parcel_id: "${px_id}", fiscal_year_id: "${fy_id}" }
              as: DistrictAdministrator
              captures: { ax_id: "$.data[0].id" }
          trigger:
            - call: "POST /assessments/${ax_id}/disputes"
              payload: { claimed_value_cents: 40000000, requested_amount_cents: 3000000 }
              as: PropertyOwner
              as_user_id: "${px_id}"
              captures: { err: $.data.error_id }
          assert:
            - "response error_id == ERR_ASSESSMENT_NOT_CERTIFIED"

  # ===========================================================================
  - rule_id: resource_temporal_overlap
    instances:
      - name: fiscal_year_halfopen_overlap_vs_adjacency
        grounds:
          - validations[priority=9]
          - errors[ERR_FISCAL_YEAR_OVERLAP]
          - entities.FiscalYear.fields.start_date
          - entities.FiscalYear.fields.end_date
        distinguishing_aspect: "FiscalYear half-open [start,end): a fiscal year [2028-01-01,2028-12-31) overlapping [2027-07-01,2028-07-01) is rejected, but an adjacent [2028-07-01,2029-07-01) (start==prior end) is accepted."
        test_recipe:
          setup:
            - "BID with one fiscal year FY2028 [2027-07-01, 2028-07-01)."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2027-06-01T00:00:00Z" }
              as: DistrictAdministrator
            - call: "POST /business-improvement-districts"
              payload: { name: "FY BID", boundary_description: "b", authorization_expires_at: "2031-05-01T00:00:00Z", assessment_weight_value: 0.0005, assessment_weight_frontage: 2.0, assessment_weight_sqft: 0.01, min_assessment_cents: 50000, max_assessment_cents: 10000000 }
              as: DistrictAdministrator
              captures: { bid_id: $.data.id }
            - call: "POST /business-improvement-districts/${bid_id}/fiscal-years"
              payload: { year_label: "FY2028", start_date: "2027-07-01T00:00:00Z", end_date: "2028-07-01T00:00:00Z", assessment_due_date: "2027-08-01T00:00:00Z" }
              as: DistrictAdministrator
          trigger:
            - call: "POST /business-improvement-districts/${bid_id}/fiscal-years"
              payload: { year_label: "OVERLAP", start_date: "2028-01-01T00:00:00Z", end_date: "2028-12-31T00:00:00Z", assessment_due_date: "2028-02-01T00:00:00Z" }
              as: DistrictAdministrator
              captures: { err: $.data.error_id }
            - call: "POST /business-improvement-districts/${bid_id}/fiscal-years"
              payload: { year_label: "FY2029", start_date: "2028-07-01T00:00:00Z", end_date: "2029-07-01T00:00:00Z", assessment_due_date: "2028-08-01T00:00:00Z" }
              as: DistrictAdministrator
              captures: { adj_id: $.data.id }
          assert:
            - "overlapping fiscal-year create returns error_id == ERR_FISCAL_YEAR_OVERLAP"
            - "adjacent fiscal-year create succeeds: FiscalYear.${adj_id}.start_date == 2028-07-01T00:00:00Z"

      - name: ambassador_shift_buffered_overlap
        grounds:
          - validations[priority=9]
          - errors[ERR_SHIFT_OVERLAP]
          - entities.AmbassadorShift.fields.start_at
          - entities.AmbassadorShift.fields.end_at
        distinguishing_aspect: "AmbassadorShift closed intervals + 30-min buffer (different geometry from FiscalYear): a shift starting 12:20 (20 min after a 08:00-12:00 shift) is rejected, but one starting 12:30 (exactly 30 min = SHIFT_BUFFER_MINUTES) is accepted."
        test_recipe:
          setup:
            - "BID with one ambassador who already has a SCHEDULED shift 2026-06-01T08:00-12:00Z."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-05-15T00:00:00Z" }
              as: DistrictAdministrator
            - call: "POST /business-improvement-districts"
              payload: { name: "Amb BID", boundary_description: "b", authorization_expires_at: "2031-05-01T00:00:00Z", assessment_weight_value: 0.0005, assessment_weight_frontage: 2.0, assessment_weight_sqft: 0.01, min_assessment_cents: 50000, max_assessment_cents: 10000000 }
              as: DistrictAdministrator
              captures: { bid_id: $.data.id }
            - call: "POST /business-improvement-districts/${bid_id}/ambassadors"
              payload: { name: "Amy", service_role: "CLEAN" }
              as: DistrictAdministrator
              captures: { amb_id: $.data.id }
            - call: "POST /ambassadors/${amb_id}/shifts"
              payload: { zone: "Z1", start_at: "2026-06-01T08:00:00Z", end_at: "2026-06-01T12:00:00Z" }
              as: DistrictAdministrator
          trigger:
            - call: "POST /ambassadors/${amb_id}/shifts"
              payload: { zone: "Z2", start_at: "2026-06-01T12:20:00Z", end_at: "2026-06-01T14:00:00Z" }
              as: DistrictAdministrator
              captures: { err: $.data.error_id }
            - call: "POST /ambassadors/${amb_id}/shifts"
              payload: { zone: "Z3", start_at: "2026-06-01T12:30:00Z", end_at: "2026-06-01T14:00:00Z" }
              as: DistrictAdministrator
              captures: { ok_id: $.data.id }
          assert:
            - "shift at 12:20 (20-min gap < 30) returns error_id == ERR_SHIFT_OVERLAP"
            - "shift at 12:30 (exactly 30-min gap) succeeds: AmbassadorShift.${ok_id}.status == SCHEDULED"

  # ===========================================================================
  - rule_id: compensating_invariant
    instances:
      - name: collected_cash_conserved_on_refund
        grounds:
          - state_machines.Dispute.UNDER_REVIEW_to_RESOLVED_ADJUSTED
          - entities.FiscalYear.fields.collected_to_date_cents
          - entities.CollectionAccount.fields.credit_balance_cents
        distinguishing_aspect: "Conserved quantity FiscalYear.collected_to_date_cents == sum(payments) - sum(refunds): after a 4025000 payment and a 1025000 dispute refund it equals exactly 3000000 (no drift)."
        test_recipe:
          setup:
            - "Single-parcel BID certified 4025000; owner paid 4025000 in full (collected_to_date 4025000); dispute filed and reviewed."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2027-06-01T00:00:00Z" }
              as: DistrictAdministrator
            - call: "POST /business-improvement-districts"
              payload: { name: "Inv1 BID", boundary_description: "b", authorization_expires_at: "2031-05-01T00:00:00Z", assessment_weight_value: 0.0005, assessment_weight_frontage: 2.0, assessment_weight_sqft: 0.01, min_assessment_cents: 50000, max_assessment_cents: 10000000 }
              as: DistrictAdministrator
              captures: { bid_id: $.data.id }
            - call: "POST /business-improvement-districts/${bid_id}/parcels"
              payload: { apn: "PX-1", owner_name: "Xavier", use_class: "COMMERCIAL", assessed_value_cents: 100000000, linear_frontage_ft: 50, building_sqft: 10000 }
              as: DistrictAdministrator
              captures: { px_id: $.data.id }
            - call: "POST /business-improvement-districts/${bid_id}/activate"
              payload: {}
              as: BoardMember
            - call: "POST /business-improvement-districts/${bid_id}/fiscal-years"
              payload: { year_label: "FY2028", start_date: "2027-07-01T00:00:00Z", end_date: "2028-07-01T00:00:00Z", assessment_due_date: "2027-08-01T00:00:00Z" }
              as: DistrictAdministrator
              captures: { fy_id: $.data.id }
            - call: "POST /fiscal-years/${fy_id}/budget"
              payload: { total_expenditure_cents: 4025000, other_revenue_cents: 0 }
              as: DistrictAdministrator
              captures: { budget_id: $.data.id }
            - call: "POST /budgets/${budget_id}/work-plan-lines"
              payload: { category: "CLEAN", allocated_amount_cents: 4025000 }
              as: DistrictAdministrator
            - call: "POST /budgets/${budget_id}/propose"
              payload: {}
              as: DistrictAdministrator
            - call: "POST /budgets/${budget_id}/adopt"
              payload: {}
              as: BoardMember
            - call: "GET /assessments"
              payload: { parcel_id: "${px_id}", fiscal_year_id: "${fy_id}" }
              as: DistrictAdministrator
              captures: { ax_id: "$.data[0].id" }
            - call: "GET /assessments/${ax_id}/collection-account"
              payload: {}
              as: TaxCollector
              captures: { acct_id: "$.data[0].id" }
            - call: "POST /collection-accounts/${acct_id}/payments"
              payload: { amount_cents: 4025000 }
              as: PropertyOwner
              as_user_id: "${px_id}"
            - call: "POST /assessments/${ax_id}/disputes"
              payload: { claimed_value_cents: 40000000, requested_amount_cents: 3000000 }
              as: PropertyOwner
              as_user_id: "${px_id}"
              captures: { d_id: $.data.id }
            - call: "POST /disputes/${d_id}/transition"
              payload: { action: "REVIEW" }
              as: DistrictAdministrator
          trigger:
            - call: "POST /disputes/${d_id}/transition"
              payload: { action: "RESOLVE", decision: "ADJUSTED", resolved_amount_cents: 3000000 }
              as: DistrictAdministrator
            - call: "GET /fiscal-years/${fy_id}"
              payload: {}
              as: DistrictAdministrator
          assert:
            - "FiscalYear.${fy_id}.collected_to_date_cents == 3000000 (4025000 paid - 1025000 refunded)"
            - "CollectionAccount.${acct_id}.credit_balance_cents == 1025000"

      - name: budget_allocation_conserved_on_reallocation
        grounds:
          - concurrency_rules[workplan-reallocate-stale-budget]
          - entities.Budget.fields.allocated_total_cents
          - entities.WorkPlanLine.fields.allocated_amount_cents
        distinguishing_aspect: "Conserved quantity Budget.allocated_total_cents: moving 500000 from SAFE to CLEAN leaves allocated_total_cents == total_expenditure_cents == 15800000 unchanged (different conserved quantity: budget allocation, not cash)."
        test_recipe:
          setup:
            - "DRAFT budget with four lines CLEAN 6000000, SAFE 6000000, MARKETING 2000000, ADMIN 1800000 (allocated_total 15800000, total_expenditure 15800000)."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2027-06-01T00:00:00Z" }
              as: DistrictAdministrator
            - call: "POST /business-improvement-districts"
              payload: { name: "Inv2 BID", boundary_description: "b", authorization_expires_at: "2031-05-01T00:00:00Z", assessment_weight_value: 0.0005, assessment_weight_frontage: 2.0, assessment_weight_sqft: 0.01, min_assessment_cents: 50000, max_assessment_cents: 10000000 }
              as: DistrictAdministrator
              captures: { bid_id: $.data.id }
            - call: "POST /business-improvement-districts/${bid_id}/fiscal-years"
              payload: { year_label: "FY2028", start_date: "2027-07-01T00:00:00Z", end_date: "2028-07-01T00:00:00Z", assessment_due_date: "2027-08-01T00:00:00Z" }
              as: DistrictAdministrator
              captures: { fy_id: $.data.id }
            - call: "POST /fiscal-years/${fy_id}/budget"
              payload: { total_expenditure_cents: 15800000, other_revenue_cents: 2000000 }
              as: DistrictAdministrator
              captures: { budget_id: $.data.id }
            - call: "POST /budgets/${budget_id}/work-plan-lines"
              payload: { category: "CLEAN", allocated_amount_cents: 6000000 }
              as: DistrictAdministrator
            - call: "POST /budgets/${budget_id}/work-plan-lines"
              payload: { category: "SAFE", allocated_amount_cents: 6000000 }
              as: DistrictAdministrator
            - call: "POST /budgets/${budget_id}/work-plan-lines"
              payload: { category: "MARKETING", allocated_amount_cents: 2000000 }
              as: DistrictAdministrator
            - call: "POST /budgets/${budget_id}/work-plan-lines"
              payload: { category: "ADMIN", allocated_amount_cents: 1800000 }
              as: DistrictAdministrator
            - call: "GET /budgets/${budget_id}"
              payload: {}
              as: DistrictAdministrator
              captures: { bud_v: $.data.version }
          trigger:
            - call: "POST /budgets/${budget_id}/reallocations"
              payload: { from_category: "SAFE", to_category: "CLEAN", amount_cents: 500000, expected_budget_version: "${bud_v}" }
              as: DistrictAdministrator
          assert:
            - "Budget.${budget_id}.allocated_total_cents == 15800000 (unchanged; == total_expenditure_cents)"
            - "WorkPlanLine CLEAN allocated_amount_cents == 6500000 and SAFE allocated_amount_cents == 5500000"
