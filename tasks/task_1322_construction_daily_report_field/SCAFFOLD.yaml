  - entity: DelayEvent
    initial_state: RECORDED
    terminal_states: [FINAL]
    transitions:
      - from: RECORDED
        to: CLASSIFIED
        trigger: "POST /delay-events/{id}/classify"
        actor: ProjectManager
        preconditions:
          - "status == RECORDED (ERR_DELAY_INVALID_TRANSITION)"
          - "parent DailyReport.status not in {APPROVED, LOCKED} (ERR_DELAY_LOCKED_REPORT)"
          - "if classification == EXCUSABLE_COMPENSABLE: no other DelayEvent with same work_area_id, classification == EXCUSABLE_COMPENSABLE, status in {CLASSIFIED, FINAL} has a window overlapping [start_at, end_at) under half-open semantics — adjacency (end == start) is NOT overlap (ERR_DELAY_OVERLAP_COMPENSABLE)"
        side_effects:
          - "classification set; lost_hours computed (calc_lost_hours)"
          - "report weather_lost_hours / weather_lost_day_calendar / weather_lost_day_fraction recompute (calc_lost_day_classification)"
          - "increments DailyReport.version by 1"
      - from: CLASSIFIED
        to: DISPUTED
        trigger: "POST /delay-events/{id}/dispute"
        actor: OwnerRep
        preconditions: ["status == CLASSIFIED (ERR_DELAY_INVALID_TRANSITION)"]
        side_effects:
          - "dispute_reason set"
          - "event excluded from report weather totals while DISPUTED (input-set filter of calc_lost_day_classification)"
          - "increments DailyReport.version by 1"
      - from: DISPUTED
        to: CLASSIFIED
        trigger: "POST /delay-events/{id}/classify (re-classification cycle)"
        actor: ProjectManager
        preconditions:
          - "status == DISPUTED (ERR_DELAY_INVALID_TRANSITION)"
          - "same EXCUSABLE_COMPENSABLE overlap rule as RECORDED->CLASSIFIED"
        side_effects: ["classification overwritten", "report weather totals recompute", "increments DailyReport.version by 1"]
      - from: CLASSIFIED
        to: FINAL
        trigger: "POST /delay-events/{id}/finalize"
        actor: ProjectManager
        preconditions:
          - "status == CLASSIFIED (ERR_DELAY_INVALID_TRANSITION)"
          - "parent DailyReport.status in {SUBMITTED, UNDER_REVIEW, APPROVED} (ERR_DELAY_FINALIZE_REQUIRES_SUBMITTED_REPORT)"
        side_effects: ["increments DailyReport.version by 1"]

