      - name: disclosure_revision_cycle_is_a_closed_loop
        claim_type: cyclic
        grounds:
          - state_machines.Disclosure.review_status.transitions.RETURNED_FOR_REVISION_to_SUBMITTED
        excluded_because:
          difficulty_instance: disclosure_revision_cycle_gates_reject_until_second_round
          rationale: "That instance drives the full SUBMITTED -> UNDER_REVIEW -> RETURNED_FOR_REVISION -> SUBMITTED loop twice, asserts revision_round 1 then 2, the reviewer_user_id surviving the loop, and the ERR_REJECT_TOO_EARLY gate that only opens on the second round."

      - name: project_award_and_security_are_parallel_dimensions
        claim_type: parallel
        grounds:
          - state_machines.Project.award_status
          - state_machines.Project.security_status
        excluded_because:
          difficulty_instance: project_award_and_security_dimensions_advance_independently
          rationale: "That instance advances award_status to ACTIVATION_PENDING while security_status is still PENDING_CLEARANCE and then clears security without touching award_status, asserting the blocker list shrink at each step."

      - name: incident_finding_bubbles_up_to_project_security
        claim_type: bubble_up
        grounds:
          - state_machines.SecurityIncident.transitions.INVESTIGATING_to_SUBSTANTIATED
          - state_machines.Project.security_status.transitions.CLEARED_to_SUSPENDED
        excluded_because:
          difficulty_instance: critical_incident_cascades_posture_grants_counts_and_project_security
          rationale: "That instance asserts the whole upward chain from a CRITICAL child incident to investigator posture, grant suspension with status_reason INVESTIGATOR_RESTRICTED, active_grant_count, project security_status SUSPENDED with reason INCIDENT_NOTIFICATION and the resulting blocker list."

      - name: grant_headcount_is_conserved_across_suspend_and_restore
        claim_type: compensation
        grounds:
          - state_machines.ControlledAccessGrant.transitions.SUSPENDED_to_ACTIVE
          - calculations.project_controlled_area_posture
        excluded_because:
          difficulty_instance: grant_headcount_returns_to_two_after_suspend_and_conditional_restore
          rationale: "That instance asserts the conserved active_grant_count before, during and after a suspend/restore round trip, which is exactly the compensation claim."

  # ===========================================================================
  - section: calculations
    instances:
      - name: risk_score_adds_paid_surcharge_after_the_designation_multiplier
        claim_type: constants_applied
        grounds:
          - calculations.investigator_risk_score
          - entities.DisclosureItem.fields.item_risk_points
        distinguishing_aspect: "PAID_SURCHARGE is added AFTER the designation multiplier, so a paid FOREIGN_APPOINTMENT on an UNVERIFIED_END_USER organization is 12 * 1.5 + 5 = 23, not (12 + 5) * 1.5 = 26; the second verified item then lifts the total across the inclusive REVIEW_SCORE threshold."
        test_recipe:
          setup:
            - "Logical clock at 2026-08-01T00:00:00Z."
            - "ORG_U designated UNVERIFIED_END_USER and ORG_N undesignated; investigator INV with a SUBMITTED disclosure carrying a paid FOREIGN_APPOINTMENT on ORG_U and an unpaid VISITING_SCHOLAR on ORG_N."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-08-01T00:00:00Z" }
              as: SystemAdmin
            - call: "POST /foreign-organizations"
