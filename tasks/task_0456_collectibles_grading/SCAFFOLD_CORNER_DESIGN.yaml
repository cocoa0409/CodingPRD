scaffold_corner_design:

  # =========================================================================
  # Section: entities
  # =========================================================================
  - section: entities
    instances:

      - name: create_customer_returns_201_with_zero_store_credit
        claim_type: Creation
        grounds:
          - entities.Customer.fields.store_credit_cents
        distinguishing_aspect: "POST /customers with email+full_name returns 201 and store_credit_cents == 0 (system default)."
        test_recipe:
          setup: ["empty DB"]
          setup_api_calls: []
          trigger:
            - call: "POST /customers"
              payload: { email: "e1@x.com", full_name: "E One" }
              as: Anonymous
              captures: { cust_id: $.data.id }
          assert:
            - "response.code == 201"
            - "Customer.${cust_id}.store_credit_cents == 0"

      - name: get_submission_item_nonexistent_returns_not_found
        claim_type: Not Found
        grounds:
          - errors[ERR_NOT_FOUND]
          - entities.SubmissionItem.fields.status
        distinguishing_aspect: "GET /submission-items/{id} with a random UUID returns ERR_NOT_FOUND (404)."
        test_recipe:
          setup: ["empty DB"]
          setup_api_calls:
            - call: "POST /customers"
              payload: { email: "e2@x.com", full_name: "E Two" }
              as: Anonymous
              captures: { cust_id: $.data.id }
          trigger:
            - call: "GET /submission-items/00000000-0000-4000-8000-000000000000"
              payload: {}
              as: Customer
              as_user_id: "${cust_id}"
              captures: { err: $.data.error_id }
          assert:
            - "response.data.error_id == ERR_NOT_FOUND"

      - name: create_item_missing_required_declared_value_returns_invalid_request
        claim_type: Required Fields
        grounds:
          - entities.SubmissionItem.fields.declared_value_cents
          - errors[ERR_INVALID_REQUEST]
        distinguishing_aspect: "POST /submissions/{id}/items omitting declared_value_cents returns ERR_INVALID_REQUEST (400)."
        test_recipe:
          setup: ["DRAFT submission exists"]
          setup_api_calls:
            - call: "POST /customers"
              payload: { email: "e3@x.com", full_name: "E Three" }
              as: Anonymous
              captures: { cust_id: $.data.id }
            - call: "POST /service-levels"
              payload: { code: "EXPRESS", turnaround_business_days: 2, base_fee_cents: 5000, max_declared_value_cents: 50000, insurance_rate_bps: 200 }
              as: LabAdmin
              captures: { sl_id: $.data.id }
            - call: "POST /grading-standards"
              payload: { code: "CARD_10PT", max_grade: 10, authentic_min_grade: 1.0, centering_weight_bps: 2500, corners_weight_bps: 2500, edges_weight_bps: 2500, surface_weight_bps: 2500 }
              as: LabAdmin
              captures: { gs_id: $.data.id }
            - call: "POST /submissions"
              payload: { customer_id: "${cust_id}", service_level_id: "${sl_id}" }
              as: Customer
              as_user_id: "${cust_id}"
              captures: { sub_id: $.data.id }
          trigger:
            - call: "POST /submissions/${sub_id}/items"
              payload: { grading_standard_id: "${gs_id}", title: "No Value" }
              as: Customer
              as_user_id: "${cust_id}"
              captures: { err: $.data.error_id }
          assert:
            - "response.data.error_id == ERR_INVALID_REQUEST"

      - name: service_level_active_default_true_when_omitted
        claim_type: Defaults
        grounds:
          - entities.ServiceLevel.fields.active
        distinguishing_aspect: "POST /service-levels without active applies default active == true."
        test_recipe:
          setup: ["empty DB"]
          setup_api_calls: []
          trigger:
            - call: "POST /service-levels"
              payload: { code: "ECONOMY", turnaround_business_days: 30, base_fee_cents: 1000, max_declared_value_cents: 20000, insurance_rate_bps: 100 }
              as: LabAdmin
              captures: { sl_id: $.data.id }
          assert:
            - "ServiceLevel.${sl_id}.active == true"

      - name: system_fields_id_and_version_minted_on_submission_create
        claim_type: System Fields
        grounds:
          - entities.Submission.fields.status
        distinguishing_aspect: "POST /submissions mints server id and version==1; client cannot set them; status default DRAFT."
        test_recipe:
          setup: ["customer + tier exist"]
          setup_api_calls:
            - call: "POST /customers"
              payload: { email: "e4@x.com", full_name: "E Four" }
              as: Anonymous
              captures: { cust_id: $.data.id }
            - call: "POST /service-levels"
              payload: { code: "EXPRESS", turnaround_business_days: 2, base_fee_cents: 5000, max_declared_value_cents: 50000, insurance_rate_bps: 200 }
              as: LabAdmin
              captures: { sl_id: $.data.id }
          trigger:
            - call: "POST /submissions"
              payload: { customer_id: "${cust_id}", service_level_id: "${sl_id}" }
              as: Customer
              as_user_id: "${cust_id}"
              captures: { sub_id: $.data.id, sub_v: $.data.version }
          assert:
            - "Submission.${sub_id}.status == DRAFT"
            - "Submission.${sub_id}.version == 1"

      - name: list_submissions_paginated_envelope
        claim_type: Listing
        grounds:
          - entities.Submission.fields.status
        distinguishing_aspect: "GET /submissions returns a paginated array envelope with total_count and has_more."
        test_recipe:
          setup: ["one submission exists for the customer"]
          setup_api_calls:
            - call: "POST /customers"
              payload: { email: "e5@x.com", full_name: "E Five" }
              as: Anonymous
              captures: { cust_id: $.data.id }
            - call: "POST /service-levels"
              payload: { code: "EXPRESS", turnaround_business_days: 2, base_fee_cents: 5000, max_declared_value_cents: 50000, insurance_rate_bps: 200 }
              as: LabAdmin
              captures: { sl_id: $.data.id }
            - call: "POST /submissions"
              payload: { customer_id: "${cust_id}", service_level_id: "${sl_id}" }
              as: Customer
              as_user_id: "${cust_id}"
          trigger:
            - call: "GET /submissions"
              payload: { customer_id: "${cust_id}" }
              as: Customer
              as_user_id: "${cust_id}"
          assert:
            - "response.meta has total_count and has_more"
            - "response.data is an array of length 1"

      - name: pagination_limit_over_max_returns_invalid
        claim_type: Type Constraints
        grounds:
          - errors[ERR_PAGINATION_INVALID]
        distinguishing_aspect: "GET /submissions with limit=101 (> max 100) returns ERR_PAGINATION_INVALID (400)."
        test_recipe:
          setup: ["customer exists"]
          setup_api_calls:
            - call: "POST /customers"
              payload: { email: "e6@x.com", full_name: "E Six" }
              as: Anonymous
              captures: { cust_id: $.data.id }
          trigger:
            - call: "GET /submissions"
              payload: { customer_id: "${cust_id}", limit: 101 }
              as: Customer
              as_user_id: "${cust_id}"
              captures: { err: $.data.error_id }
          assert:
            - "response.data.error_id == ERR_PAGINATION_INVALID"

  # =========================================================================
  # Section: state_machines
  # =========================================================================
  - section: state_machines
    instances:

      - name: submit_already_submitted_returns_invalid_state
        claim_type: Invalid Transitions
        grounds:
          - state_machines.Submission.DRAFT_to_SUBMITTED
          - errors[ERR_INVALID_STATE]
        distinguishing_aspect: "Submitting a submission already SUBMITTED returns ERR_INVALID_STATE; no re-estimate fires."
        test_recipe:
          setup: ["submission already SUBMITTED with one valid item"]
          setup_api_calls:
            - call: "POST /customers"
              payload: { email: "e7@x.com", full_name: "E Seven" }
              as: Anonymous
              captures: { cust_id: $.data.id }
            - call: "POST /service-levels"
              payload: { code: "EXPRESS", turnaround_business_days: 2, base_fee_cents: 5000, max_declared_value_cents: 50000, insurance_rate_bps: 200 }
              as: LabAdmin
              captures: { sl_id: $.data.id }
            - call: "POST /grading-standards"
              payload: { code: "CARD_10PT", max_grade: 10, authentic_min_grade: 1.0, centering_weight_bps: 2500, corners_weight_bps: 2500, edges_weight_bps: 2500, surface_weight_bps: 2500 }
              as: LabAdmin
              captures: { gs_id: $.data.id }
            - call: "POST /submissions"
              payload: { customer_id: "${cust_id}", service_level_id: "${sl_id}" }
              as: Customer
              as_user_id: "${cust_id}"
              captures: { sub_id: $.data.id }
            - call: "POST /submissions/${sub_id}/items"
              payload: { grading_standard_id: "${gs_id}", title: "Q", declared_value_cents: 30000 }
              as: Customer
              as_user_id: "${cust_id}"
            - call: "POST /submissions/${sub_id}/submit"
              payload: {}
              as: Customer
              as_user_id: "${cust_id}"
          trigger:
            - call: "POST /submissions/${sub_id}/submit"
              payload: {}
              as: Customer
              as_user_id: "${cust_id}"
              captures: { err: $.data.error_id }
          assert:
            - "response.data.error_id == ERR_INVALID_STATE"

      - name: reject_item_recomputes_coverage_and_excludes_value
        claim_type: Side Effect Execution
        grounds:
          - state_machines.SubmissionItem.INTAKE_LOGGED_to_REJECTED_RETURNED
          - calculations.covered_value
          - entities.InsurancePolicy.fields.covered_value_cents
        distinguishing_aspect: "Rejecting one of two items recomputes InsurancePolicy.covered_value to exclude it: two items 30000+30000 covered 60000 -> after reject 30000."
        test_recipe:
          setup: ["submission submitted with two items 30000 each, both INTAKE_LOGGED, matches_declaration: item2 false"]
          setup_api_calls:
            - call: "POST /customers"
              payload: { email: "e8@x.com", full_name: "E Eight" }
              as: Anonymous
              captures: { cust_id: $.data.id }
            - call: "POST /service-levels"
              payload: { code: "EXPRESS", turnaround_business_days: 2, base_fee_cents: 5000, max_declared_value_cents: 50000, insurance_rate_bps: 200 }
              as: LabAdmin
              captures: { sl_id: $.data.id }
            - call: "POST /grading-standards"
              payload: { code: "CARD_10PT", max_grade: 10, authentic_min_grade: 1.0, centering_weight_bps: 2500, corners_weight_bps: 2500, edges_weight_bps: 2500, surface_weight_bps: 2500 }
              as: LabAdmin
              captures: { gs_id: $.data.id }
            - call: "POST /submissions"
              payload: { customer_id: "${cust_id}", service_level_id: "${sl_id}" }
              as: Customer
              as_user_id: "${cust_id}"
              captures: { sub_id: $.data.id }
            - call: "POST /submissions/${sub_id}/items"
              payload: { grading_standard_id: "${gs_id}", title: "R1", declared_value_cents: 30000 }
              as: Customer
              as_user_id: "${cust_id}"
              captures: { item1: $.data.id }
            - call: "POST /submissions/${sub_id}/items"
              payload: { grading_standard_id: "${gs_id}", title: "R2", declared_value_cents: 30000 }
              as: Customer
              as_user_id: "${cust_id}"
              captures: { item2: $.data.id }
            - call: "POST /submissions/${sub_id}/submit"
              payload: {}
              as: Customer
              as_user_id: "${cust_id}"
            - call: "POST /submission-items/${item1}/intake"
              payload: { condition_note: "ok", matches_declaration: true }
              as: Receiver
            - call: "POST /submission-items/${item2}/intake"
              payload: { condition_note: "mismatch", matches_declaration: false }
              as: Receiver
          trigger:
            - call: "POST /submission-items/${item2}/reject"
              payload: {}
              as: Receiver
          assert:
            - "SubmissionItem.${item2}.status == REJECTED_RETURNED"
            - "InsurancePolicy(submission=${sub_id}).covered_value_cents == 30000"

      - name: terminal_shipped_item_cannot_regrade
        claim_type: Terminal State Lockdown
        grounds:
          - state_machines.SubmissionItem.ENCAPSULATED_to_CRACK_PENDING
          - errors[ERR_SUBMISSION_ALREADY_SHIPPED]
        distinguishing_aspect: "After dispatch (item SHIPPED, submission SHIPPED), a regrade request returns ERR_SUBMISSION_ALREADY_SHIPPED."
        test_recipe:
          setup: ["item encapsulated, submission dispatched (SHIPPED)"]
          setup_api_calls:
            - call: "POST /customers"
              payload: { email: "e9@x.com", full_name: "E Nine" }
              as: Anonymous
              captures: { cust_id: $.data.id }
            - call: "POST /service-levels"
              payload: { code: "EXPRESS", turnaround_business_days: 2, base_fee_cents: 5000, max_declared_value_cents: 50000, insurance_rate_bps: 200 }
              as: LabAdmin
              captures: { sl_id: $.data.id }
            - call: "POST /grading-standards"
              payload: { code: "CARD_10PT", max_grade: 10, authentic_min_grade: 1.0, centering_weight_bps: 2500, corners_weight_bps: 2500, edges_weight_bps: 2500, surface_weight_bps: 2500 }
              as: LabAdmin
              captures: { gs_id: $.data.id }
            - call: "POST /submissions"
              payload: { customer_id: "${cust_id}", service_level_id: "${sl_id}" }
              as: Customer
              as_user_id: "${cust_id}"
              captures: { sub_id: $.data.id }
            - call: "POST /submissions/${sub_id}/items"
              payload: { grading_standard_id: "${gs_id}", title: "S", declared_value_cents: 30000 }
              as: Customer
              as_user_id: "${cust_id}"
              captures: { item_id: $.data.id }
            - call: "POST /submissions/${sub_id}/submit"
              payload: {}
              as: Customer
              as_user_id: "${cust_id}"
            - call: "POST /submission-items/${item_id}/intake"
              payload: { condition_note: "ok", matches_declaration: true }
              as: Receiver
            - call: "POST /submission-items/${item_id}/grade-assessments"
              payload: { grading_standard_id: "${gs_id}", centering_subgrade: 9, corners_subgrade: 9, edges_subgrade: 9, surface_subgrade: 9 }
              as: Grader
              captures: { ga_id: $.data.id }
            - call: "POST /grade-assessments/${ga_id}/finalize"
              payload: {}
              as: Grader
            - call: "POST /submission-items/${item_id}/authentication"
              payload: { verdict: "GENUINE" }
              as: Authenticator
            - call: "POST /submission-items/${item_id}/encapsulate"
              payload: { assessment_id: "${ga_id}" }
              as: Authenticator
              captures: { slab_id: $.data.id }
            - call: "GET /submission-items/${item_id}"
              payload: {}
              as: Customer
              as_user_id: "${cust_id}"
              captures: { item_v: $.data.version }
            - call: "POST /submissions/${sub_id}/shipments"
              payload: { carrier: "USPS", tracking_number: "US333" }
              as: LabAdmin
              captures: { ship_id: $.data.id }
            - call: "POST /shipments/${ship_id}/dispatch"
              payload: {}
              as: LabAdmin
          trigger:
            - call: "POST /submission-items/${item_id}/regrade-requests"
              payload: { prior_slab_id: "${slab_id}", expected_item_version: "${item_v}", reason: "late" }
              as: Customer
              as_user_id: "${cust_id}"
              captures: { err: $.data.error_id }
          assert:
            - "response.data.error_id == ERR_SUBMISSION_ALREADY_SHIPPED"

      - name: bubble_up_all_encapsulated_makes_submission_ready_to_ship
        claim_type: Side Effect Execution
        grounds:
          - state_machines.Submission.IN_GRADING_to_READY_TO_SHIP
          - calculations.finalize_submission_fee
          - entities.Submission.fields.status
        distinguishing_aspect: "When the sole item reaches ENCAPSULATED, Submission auto-bubbles to READY_TO_SHIP and total_final_fee_cents is computed (5600 for 30000@EXPRESS)."
        test_recipe:
          setup: ["one-item submission, item carried to ENCAPSULATED"]
          setup_api_calls:
            - call: "POST /customers"
              payload: { email: "e10@x.com", full_name: "E Ten" }
              as: Anonymous
              captures: { cust_id: $.data.id }
            - call: "POST /service-levels"
              payload: { code: "EXPRESS", turnaround_business_days: 2, base_fee_cents: 5000, max_declared_value_cents: 50000, insurance_rate_bps: 200 }
              as: LabAdmin
              captures: { sl_id: $.data.id }
            - call: "POST /grading-standards"
              payload: { code: "CARD_10PT", max_grade: 10, authentic_min_grade: 1.0, centering_weight_bps: 2500, corners_weight_bps: 2500, edges_weight_bps: 2500, surface_weight_bps: 2500 }
              as: LabAdmin
              captures: { gs_id: $.data.id }
            - call: "POST /submissions"
              payload: { customer_id: "${cust_id}", service_level_id: "${sl_id}" }
              as: Customer
              as_user_id: "${cust_id}"
              captures: { sub_id: $.data.id }
            - call: "POST /submissions/${sub_id}/items"
              payload: { grading_standard_id: "${gs_id}", title: "T", declared_value_cents: 30000 }
              as: Customer
              as_user_id: "${cust_id}"
              captures: { item_id: $.data.id }
            - call: "POST /submissions/${sub_id}/submit"
              payload: {}
              as: Customer
              as_user_id: "${cust_id}"
            - call: "POST /submission-items/${item_id}/intake"
              payload: { condition_note: "ok", matches_declaration: true }
              as: Receiver
            - call: "POST /submission-items/${item_id}/grade-assessments"
              payload: { grading_standard_id: "${gs_id}", centering_subgrade: 9, corners_subgrade: 9, edges_subgrade: 9, surface_subgrade: 9 }
              as: Grader
              captures: { ga_id: $.data.id }
            - call: "POST /grade-assessments/${ga_id}/finalize"
              payload: {}
              as: Grader
            - call: "POST /submission-items/${item_id}/authentication"
              payload: { verdict: "GENUINE" }
              as: Authenticator
          trigger:
            - call: "POST /submission-items/${item_id}/encapsulate"
              payload: { assessment_id: "${ga_id}" }
              as: Authenticator
          assert:
            - "Submission.${sub_id}.status == READY_TO_SHIP"
            - "Submission.${sub_id}.total_final_fee_cents == 5600"

      - name: error_grade_provisional_vs_final_divergence
        claim_type: Side Effect Execution
        grounds:
          - calculations.provisional_overall_grade
          - calculations.final_overall_grade
        excluded_because:
          difficulty_instance: dual_variant_calc / grade_provisional_vs_final_diverge_on_uneven_subgrades
          rationale: "Provisional vs final grade divergence is the asserted outcome of the named §1.8 dual-variant instance."

  # =========================================================================
  # Section: calculations
  # =========================================================================
  - section: calculations
    instances:

      - name: covered_value_premium_sum_then_ceil
        claim_type: Correct Result
        grounds:
          - calculations.covered_value
          - entities.InsurancePolicy.fields.premium_cents
        distinguishing_aspect: "Premium uses sum-then-ceil: two items 30000+30000 covered 60000, premium ceil(60000*200/10000)=1200."
        test_recipe:
          setup: ["submission submitted with two 30000 items"]
          setup_api_calls:
            - call: "POST /customers"
              payload: { email: "e11@x.com", full_name: "E Eleven" }
              as: Anonymous
              captures: { cust_id: $.data.id }
            - call: "POST /service-levels"
              payload: { code: "EXPRESS", turnaround_business_days: 2, base_fee_cents: 5000, max_declared_value_cents: 50000, insurance_rate_bps: 200 }
              as: LabAdmin
              captures: { sl_id: $.data.id }
            - call: "POST /grading-standards"
              payload: { code: "CARD_10PT", max_grade: 10, authentic_min_grade: 1.0, centering_weight_bps: 2500, corners_weight_bps: 2500, edges_weight_bps: 2500, surface_weight_bps: 2500 }
              as: LabAdmin
              captures: { gs_id: $.data.id }
            - call: "POST /submissions"
              payload: { customer_id: "${cust_id}", service_level_id: "${sl_id}" }
              as: Customer
              as_user_id: "${cust_id}"
              captures: { sub_id: $.data.id }
            - call: "POST /submissions/${sub_id}/items"
              payload: { grading_standard_id: "${gs_id}", title: "U1", declared_value_cents: 30000 }
              as: Customer
              as_user_id: "${cust_id}"
            - call: "POST /submissions/${sub_id}/items"
              payload: { grading_standard_id: "${gs_id}", title: "U2", declared_value_cents: 30000 }
              as: Customer
              as_user_id: "${cust_id}"
          trigger:
            - call: "POST /submissions/${sub_id}/submit"
              payload: {}
              as: Customer
              as_user_id: "${cust_id}"
          assert:
            - "InsurancePolicy(submission=${sub_id}).covered_value_cents == 60000"
            - "InsurancePolicy(submission=${sub_id}).premium_cents == 1200"

      - name: subgrade_out_of_range_rejected
        claim_type: Constants Applied
        grounds:
          - validations[priority=9]
          - errors[ERR_SUBGRADE_OUT_OF_RANGE]
          - entities.GradingStandard.fields.max_grade
        distinguishing_aspect: "A subgrade of 11 (> max_grade 10) on POST grade-assessments returns ERR_SUBGRADE_OUT_OF_RANGE (422)."
        test_recipe:
          setup: ["item INTAKE_LOGGED"]
          setup_api_calls:
            - call: "POST /customers"
              payload: { email: "e12@x.com", full_name: "E Twelve" }
              as: Anonymous
              captures: { cust_id: $.data.id }
            - call: "POST /service-levels"
              payload: { code: "EXPRESS", turnaround_business_days: 2, base_fee_cents: 5000, max_declared_value_cents: 50000, insurance_rate_bps: 200 }
              as: LabAdmin
              captures: { sl_id: $.data.id }
            - call: "POST /grading-standards"
              payload: { code: "CARD_10PT", max_grade: 10, authentic_min_grade: 1.0, centering_weight_bps: 2500, corners_weight_bps: 2500, edges_weight_bps: 2500, surface_weight_bps: 2500 }
              as: LabAdmin
              captures: { gs_id: $.data.id }
            - call: "POST /submissions"
              payload: { customer_id: "${cust_id}", service_level_id: "${sl_id}" }
              as: Customer
              as_user_id: "${cust_id}"
              captures: { sub_id: $.data.id }
            - call: "POST /submissions/${sub_id}/items"
              payload: { grading_standard_id: "${gs_id}", title: "V", declared_value_cents: 30000 }
              as: Customer
              as_user_id: "${cust_id}"
              captures: { item_id: $.data.id }
            - call: "POST /submissions/${sub_id}/submit"
              payload: {}
              as: Customer
              as_user_id: "${cust_id}"
            - call: "POST /submission-items/${item_id}/intake"
              payload: { condition_note: "ok", matches_declaration: true }
              as: Receiver
          trigger:
            - call: "POST /submission-items/${item_id}/grade-assessments"
              payload: { grading_standard_id: "${gs_id}", centering_subgrade: 11, corners_subgrade: 9, edges_subgrade: 9, surface_subgrade: 9 }
              as: Grader
              captures: { err: $.data.error_id }
          assert:
            - "response.data.error_id == ERR_SUBGRADE_OUT_OF_RANGE"

      - name: authentic_only_label_below_authentic_min_grade
        claim_type: Correct Result
        grounds:
          - calculations.population_bump
          - entities.Slab.fields.label_grade_text
          - entities.GradingStandard.fields.authentic_min_grade
        distinguishing_aspect: "An item finalized below authentic_min_grade (subgrades 0.5/0.5/0.5/0.5 -> final 0.5 < 1.0) encapsulates with label_grade_text 'AUTHENTIC' and pop bucket grade_value -1."
        test_recipe:
          setup: ["item INTAKE_LOGGED, graded very low (0.5 each), finalized, GENUINE"]
          setup_api_calls:
            - call: "POST /customers"
              payload: { email: "e13@x.com", full_name: "E Thirteen" }
              as: Anonymous
              captures: { cust_id: $.data.id }
            - call: "POST /service-levels"
              payload: { code: "EXPRESS", turnaround_business_days: 2, base_fee_cents: 5000, max_declared_value_cents: 50000, insurance_rate_bps: 200 }
              as: LabAdmin
              captures: { sl_id: $.data.id }
