            - "${t_peak} == 600: the walk is load=600 -> after delivery 0 -> after pickup 500 -> after drop-off 0, and the maximum is the departure load"
            - "${planned_status} == PLANNED and ${planned_peak} == 600 - a peak exactly equal to capacity_cases 600 is accepted (inclusive `<=`), even though 1600 cases were handled"

