  - rule_id: non_linear_state_machine
    instances:
      - name: tank_lot_reline_cycle_returns_to_lined
        grounds:
          - state_machines.TankLot.LINED_to_LINING_REJECTED
          - state_machines.TankLot.LINING_REJECTED_to_RELINE_QUEUED
          - state_machines.TankLot.RELINE_QUEUED_to_LINED
          - calculations.lot_holiday_density
          - calculations.tank_lot_quantity_ledger
          - entities.TankLot.fields.rework_count
          - entities.TankLot.fields.last_scrap_quantity
        distinguishing_aspect: >
          A true cycle, not a forward chain: the lot re-enters LINED - a state it already occupied - by the
          same POST /mfg/tank-lots/{id}/apply-lining trigger that first put it there, after passing through
          LINING_REJECTED and RELINE_QUEUED. Re-entry is NOT a reset: rework_count survives the loop at 1 and
          scrapped_quantity stays 10, so the second lap starts from a strictly different field vector, and the
          MAX_REWORK_CYCLES guard means a third lap is unreachable. Path-independence is thereby falsified.
        test_recipe:
          setup:
            - "Tank lot TL-001 is LINED against fired batch GLB-001 with planned_quantity 120 and wip_quantity 120."
            - "The lot has no inspection records yet and rework_count is 0."
            - "The logical clock is 2026-08-05T06:00:00Z."
          setup_api_calls:
            - call: "POST /mfg/product-models"
              payload: { model_code: "GX50-T", fuel_type: "GAS", nominal_capacity_gallons: 50, channel: "TRADE", insulation_r_value: 20, is_private_label: false }
              as: ComplianceEngineer
              captures: { m1_id: $.data.id }

            - call: "POST /mfg/_clock/set_current_utc"
              payload: { current_utc: "2026-08-05T06:00:00Z" }
              as: PlantAdmin

            - call: "POST /mfg/furnaces"
              payload: { furnace_code: "FURN-A", max_firing_temp_c: 900 }
              as: PlantAdmin
              captures: { furn_id: $.data.id }
            - call: "POST /mfg/glass-lining-batches"
              payload: { furnace_id: "${furn_id}", batch_code: "GLB-001", slurry_mix_code: "SLR-7", firing_temp_c: 840, firing_start: "2026-08-02T06:00:00Z", firing_end: "2026-08-02T10:00:00Z" }
              as: PlantOperator
              captures: { glb_id: $.data.id }
            - call: "POST /mfg/glass-lining-batches/${glb_id}/fire"
              payload: {}
              as: PlantOperator

            - call: "POST /mfg/tank-lots"
              payload: { product_model_id: "${m1_id}", lot_code: "TL-001", planned_quantity: 120 }
              as: PlantOperator
              captures: { tl_id: $.data.id }
            - call: "POST /mfg/tank-lots/${tl_id}/weld"
              payload: {}
              as: PlantOperator
              as_user_id: "op-weld-1"
            - call: "POST /mfg/tank-lots/${tl_id}/apply-lining"
              payload: { glass_lining_batch_id: "${glb_id}" }
              as: PlantOperator
          trigger:
            - call: "GET /mfg/tank-lots/${tl_id}"
              payload: {}
              as: QualityInspector
              captures: { tl_va: $.data.version }
            - call: "POST /mfg/lining-inspections"
              payload: { tank_lot_id: "${tl_id}", inspection_type: "HOLIDAY", sample_size: 6, holiday_count: 4, scrap_quantity: 10, expected_tank_lot_version: "${tl_va}" }
              as: QualityInspector
              as_user_id: "insp-1"
            - call: "POST /mfg/tank-lots/${tl_id}/authorize-reline"
              payload: {}
              as: PlantOperator
            - call: "POST /mfg/tank-lots/${tl_id}/apply-lining"
              payload: { glass_lining_batch_id: "${glb_id}" }
              as: PlantOperator
          assert:
            - "the HOLIDAY inspection response returns holidays_per_tank == 0.6667 and result == FAIL"
            - "immediately after the inspection TankLot.${tl_id}.status == LINING_REJECTED with wip_quantity == 110, scrapped_quantity == 10, rework_count == 1, last_scrap_quantity == 10, cascade_rejected == false"
            - "after authorize-reline TankLot.${tl_id}.status == RELINE_QUEUED and last_scrap_quantity == null and rework_count is still 1"
            - "after the second apply-lining TankLot.${tl_id}.status == LINED and rework_count is still 1 and scrapped_quantity is still 10"
            - "TankLot.${tl_id}.planned_quantity == wip_quantity + good_quantity + scrapped_quantity == 110 + 0 + 10 == 120"
            - "GlassLiningBatch.${glb_id}.rejected_lot_count == 1 and status == FIRED and assigned_lot_count == 1"
      - name: product_model_parallel_dimensions_independent
        grounds:
          - state_machines.ProductModel.note (parallel state dimensions)
          - state_machines.ProductModel.DRAFT_to_RELEASED
          - state_machines.ProductModel.CERTIFIED_to_SUSPENDED
          - entities.ProductModel.fields.certification_status
          - entities.ProductModel.fields.release_status
        distinguishing_aspect: >
          Two orthogonal dimensions live on one row, so the model's state is a PAIR and neither coordinate
          gates the other: release-to-channel moves DRAFT -> RELEASED while certification_status stays
          CERTIFIED, and suspend-certification then moves CERTIFIED -> SUSPENDED while release_status stays
          RELEASED. A single-status implementation must overwrite one coordinate with the other and fails
          both halves; the suspension also deliberately RETAINS uef_rated, distinguishing it from the
          DECERTIFIED transition that clears the published rating.
