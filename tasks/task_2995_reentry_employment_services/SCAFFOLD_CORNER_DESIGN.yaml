    distinguishing_aspect: The 9.0h shift is created FIRST (when cumulative_hours is 0, so it is worth 8325) but its
      starts_at is last; once the nine earlier 8.0h shifts exist it must be re-charged as the straddling shift (7863)
      for a placement total of 74463. An implementation that walks shifts in created_at order reports 74925.
