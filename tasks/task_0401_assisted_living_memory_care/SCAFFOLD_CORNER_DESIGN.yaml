      - name: missing_role_header_returns_context_error
        claim_type: peer_roles
        grounds: ["validations[priority=1]", "errors[ERR_MISSING_OR_INVALID_USER_CONTEXT_HEADER]"]
        distinguishing_aspect: "A request with an unknown X-User-Role returns ERR_MISSING_OR_INVALID_USER_CONTEXT_HEADER (400) before any business logic."
        test_recipe:
