        excluded_because:
          difficulty_instance: "priority_pair_validation_conflict / order_vendor_suspension_outranks_vendor_quantity_cap"
          rationale: >-
            That instance already orders a line whose quantity exceeds the vendor's per-line cap from a
            vendor that has since been suspended, and asserts ERR_VENDOR_SUSPENDED rather than
            ERR_VENDOR_QTY_CAP_EXCEEDED, then lifts the suspension and observes the cap code on the
            retry. Both triggerability claims are therefore already covered, with the stronger ordering
            evidence attached.

      - name: ordering_below_the_vendor_score_floor_is_rejected
        claim_type: triggerability
        grounds:
          - errors.ERR_VENDOR_SCORE_BELOW_FLOOR
          - validations.priority_88
        excluded_because:
          difficulty_instance: "boundary_precision_check / vendor_score_floor_is_inclusive_at_exactly_40_on_order"
          rationale: >-
            That instance drives a vendor's rolling score to exactly 40 and to 39 and shows the order
            accepted at the boundary and refused with ERR_VENDOR_SCORE_BELOW_FLOOR one point below, so a
            plain triggerability probe would repeat the refused half of a strictly stronger check.

      - name: ordering_beyond_the_authorised_exposure_is_rejected
        claim_type: triggerability
        grounds:
          - errors.ERR_AUTHORIZED_AMOUNT_EXCEEDED
          - errors.ERR_AUTHORIZATION_POSTURE_BLOCKED
          - validations.priority_40
          - validations.priority_90
        excluded_because:
          difficulty_instance: "priority_pair_validation_conflict / order_posture_freeze_outranks_customer_exposure_ceiling"
          rationale: >-
            That instance builds an order that breaches the customer exposure ceiling while its posture
            is frozen, asserts the 409 ERR_AUTHORIZATION_POSTURE_BLOCKED, then clears the posture and
            observes the 402 ERR_AUTHORIZED_AMOUNT_EXCEEDED on the same call - so both codes are already
            shown reachable, in the order the priority list demands.

      - name: a_stall_window_inside_the_cleanup_buffer_is_rejected
        claim_type: triggerability
        grounds:
          - errors.ERR_STALL_WINDOW_CONFLICT
          - validations.priority_67
        excluded_because:
          difficulty_instance: "resource_temporal_overlap / stall_booking_refused_at_exactly_the_cleanup_buffer_gap"
          rationale: >-
            That instance books a second window exactly 30 minutes after the first ends and again 29
            minutes after, showing the accepted and the ERR_STALL_WINDOW_CONFLICT cases on the same
            stall; the bare triggerability claim is the weaker half of it.

      - name: a_bay_beyond_its_concurrent_capacity_is_rejected
        claim_type: triggerability
        grounds:
          - errors.ERR_CALIBRATION_BAY_CAPACITY_EXCEEDED
          - validations.priority_68
        excluded_because:
          difficulty_instance: "resource_temporal_overlap / calibration_bay_capacity_counts_only_strictly_overlapping_windows"
          rationale: >-
            That instance fills a capacity-2 bay with two strictly overlapping windows, has the third
            refused with ERR_CALIBRATION_BAY_CAPACITY_EXCEEDED, and shows an abutting window accepted -
            which subsumes the triggerability probe and pins the overlap definition as well.

      - name: qc_without_a_passed_calibration_is_rejected
        claim_type: triggerability
        grounds:
          - errors.ERR_CALIBRATION_NOT_VERIFIED
          - errors.ERR_ADAS_PROCEDURE_RESEARCH_MISSING
          - validations.priority_50
          - validations.priority_54
        excluded_because:
          difficulty_instance: "cross_entity_state_dependency / order_cannot_reach_ready_for_qc_until_the_adas_record_is_passed"
          rationale: >-
            That instance walks the same order through every calibration_status the ADAS record can
            hold and records the refusal at each one, including ERR_CALIBRATION_NOT_VERIFIED, so a
            single-shot triggerability probe adds no distinguishing evidence.

  - section: rbac
    instances:
      - name: calls_with_blank_headers_are_unauthenticated
        claim_type: exclusive_operations_denied
        grounds:
          - validations.priority_1
          - errors.ERR_UNAUTHENTICATED
          - roles.ShopAdmin
        distinguishing_aspect: >-
          Authentication is the first rung of the ladder, so a blank X-Role / X-User-ID pair must answer
          401 even when the request would have failed for a better-known reason - an unknown path id, an
          unusable role, a malformed body. An implementation that validates the body or looks the row up
          before reading the headers leaks 400 or 404 here.
        test_recipe:
          setup:
            - "A Customer, an Insurer and one RepairOrder exist, created by a properly identified ShopAdmin."
          setup_api_calls:
            - call: "POST /customers"
              payload: { full_name: "Fay Orr", phone: "555-1053", email: "fay@example.com" }
              as: ShopAdmin
              captures: { cust_id: $.data.id }
            - call: "POST /insurers"
              payload: { insurer_code: "CRNR-54", name: "Cornerstone Mutual", rate_ceiling_cents: { BODY: 6000, FRAME: 8000, REFINISH: 5800, MECHANICAL: 11000, ALUMINUM_BODY: 8800 } }
              as: ShopAdmin
              captures: { ins_id: $.data.id }
            - call: "POST /repair-orders"
              payload: { customer_id: "${cust_id}", insurer_id: "${ins_id}", claim_number: "CLM-90061", vehicle_vin: "1HGCV1F30LA090061", vehicle_model_year: 2019, vehicle_make_model: "Honda Accord", initial_authorized_cents: 400000, deductible_cents: 25000 }
              as: ShopAdmin
              captures: { ro_id: $.data.id }
          trigger:
            - call: "GET /repair-orders/${ro_id}"
              payload: {}
              as: ""
              as_user_id: ""
              captures: { err: $.data.error_id }
          assert:
            - "HTTP 401 with data.error_id == ERR_UNAUTHENTICATED - both headers are sent as empty strings, not omitted whitespace"
            - "GET /repair-orders/00000000-0000-4000-8000-000000000404 with the same blank headers is also 401, not 404: rule 1 outranks rule 20"
            - "POST /repair-orders with blank headers and a body missing claim_number is 401, not 400"
            - "an unrecognised role string such as Painter returns HTTP 403 ERR_ROLE_NOT_PERMITTED, which distinguishes an absent identity from an unusable one"
            - "the order is untouched: GET /repair-orders/${ro_id} as ShopAdmin still reports stage INTAKE and version 1"

      - name: each_roles_exclusive_writes_are_refused_to_the_other_roles
        claim_type: exclusive_operations_denied
        grounds:
          - validations.priority_2
          - errors.ERR_ROLE_NOT_PERMITTED
          - roles.Estimator
          - roles.PartsManager
          - roles.Technician
          - roles.QcInspector
        distinguishing_aspect: >-
          The seven roles carve the workflow into disjoint exclusive sets, and each stage of the repair
          is written by exactly one of them. Every probe here targets an endpoint the caller's role does
          not hold, on an order in the exact state where the rightful role would succeed - so a 403 is
          the only possible cause and a coarse "any authenticated writer" check fails immediately.
        test_recipe:
          setup:
            - "A RepairOrder with one teardown finding, blueprinted and locked on a BODY 4.5 h line, so that each probed endpoint is state-legal for its rightful role."
          setup_api_calls:
            - call: "POST /customers"
              payload: { full_name: "Gil Roe", phone: "555-1054", email: "gil@example.com" }
              as: ShopAdmin
              captures: { cust_id: $.data.id }
            - call: "POST /insurers"
              payload: { insurer_code: "CRNR-55", name: "Cornerstone Mutual", rate_ceiling_cents: { BODY: 6000, FRAME: 8000, REFINISH: 5800, MECHANICAL: 11000, ALUMINUM_BODY: 8800 } }
              as: ShopAdmin
              captures: { ins_id: $.data.id }
            - call: "POST /repair-orders"
              payload: { customer_id: "${cust_id}", insurer_id: "${ins_id}", claim_number: "CLM-90062", vehicle_vin: "1HGCV1F30LA090062", vehicle_model_year: 2019, vehicle_make_model: "Honda Accord", initial_authorized_cents: 400000, deductible_cents: 25000 }
              as: ShopAdmin
              captures: { ro_id: $.data.id }
            - call: "POST /repair-orders/${ro_id}/teardown-findings"
              payload: { panel_code: "LT-DOOR", severity: "MODERATE" }
              as: Estimator
              as_user_id: "est-100"
              captures: { dl1: $.data.id }
            - call: "POST /repair-orders/${ro_id}/estimate-lines"
              payload: { damage_line_id: "${dl1}", operation_code: "BDY-1", labor_type: "BODY", guide_hours: 4.5 }
              as: Estimator
              as_user_id: "est-100"
              captures: { el1: $.data.id }
            - call: "POST /repair-orders/${ro_id}/blueprint"
              payload: {}
              as: Estimator
              as_user_id: "est-100"
            - call: "POST /repair-orders/${ro_id}/estimate/lock"
              payload: {}
              as: Estimator
              as_user_id: "est-100"
          trigger:
            - call: "POST /estimate-lines/${el1}/parts-lines"
              payload: { part_number: "OEM-9062", part_description: "Door shell", part_type: "OEM", list_price_cents: 30000, qty: 1 }
              as: Estimator
              as_user_id: "est-100"
              captures: { err: $.data.error_id }
          assert:
            - "HTTP 403 with data.error_id == ERR_ROLE_NOT_PERMITTED - parts selection belongs to PartsManager alone"
            - "GET /parts-lines?estimate_line_id=${el1} as PartsManager returns total_count 0, and the identical POST as PartsManager is accepted"
            - "POST /repair-orders/${ro_id}/teardown-findings as PartsManager, POST /repair-orders/${ro_id}/stage-advance as ShopAdmin and POST /repair-orders/${ro_id}/deliver as Technician are each HTTP 403 ERR_ROLE_NOT_PERMITTED"
            - "POST /repair-orders/${ro_id}/qc-inspections as Estimator and POST /repair-orders/${ro_id}/consent-decisions as ShopAdmin are HTTP 403 ERR_ROLE_NOT_PERMITTED, so the role gate answers before the stage gate that would otherwise refuse them"
            - "RepairOrder.${ro_id}.version is unchanged by every refusal and its stage is still ESTIMATE_LOCKED"

      - name: an_adjuster_from_another_program_is_not_the_resource_owner
        claim_type: exclusive_operations_denied
        grounds:
          - validations.priority_3
          - errors.ERR_NOT_RESOURCE_OWNER
          - roles.InsurerAdjuster
        distinguishing_aspect: >-
          InsurerAdjuster is entity-backed: the X-User-ID is an Insurer.id, and holding the role is not
          enough. The foreign adjuster here has the right role and aims at a genuinely open supplement,
          so only the ownership comparison against RepairOrder.insurer_id can refuse it - and the same
          check must also close the read side, or a competitor reads the estimate it is not funding.
        test_recipe:
          setup:
            - "Insurers I1 and I2 both exist. A RepairOrder under I1 is locked on a BODY 4.5 h line and carries one SUBMITTED supplement for 50000."
          setup_api_calls:
            - call: "POST /customers"
              payload: { full_name: "Hal Vex", phone: "555-1055", email: "hal@example.com" }
              as: ShopAdmin
              captures: { cust_id: $.data.id }
            - call: "POST /insurers"
              payload: { insurer_code: "CRNR-56", name: "Cornerstone Mutual", rate_ceiling_cents: { BODY: 6000, FRAME: 8000, REFINISH: 5800, MECHANICAL: 11000, ALUMINUM_BODY: 8800 } }
              as: ShopAdmin
              captures: { ins_1: $.data.id }
            - call: "POST /insurers"
              payload: { insurer_code: "CRNR-57", name: "Rampart Casualty", rate_ceiling_cents: { BODY: 6000, FRAME: 8000, REFINISH: 5800, MECHANICAL: 11000, ALUMINUM_BODY: 8800 } }
              as: ShopAdmin
              captures: { ins_2: $.data.id }
            - call: "POST /repair-orders"
              payload: { customer_id: "${cust_id}", insurer_id: "${ins_1}", claim_number: "CLM-90063", vehicle_vin: "1HGCV1F30LA090063", vehicle_model_year: 2019, vehicle_make_model: "Honda Accord", initial_authorized_cents: 400000, deductible_cents: 25000 }
              as: ShopAdmin
              captures: { ro_id: $.data.id }
            - call: "POST /repair-orders/${ro_id}/teardown-findings"
              payload: { panel_code: "LT-DOOR", severity: "MODERATE" }
              as: Estimator
              as_user_id: "est-100"
              captures: { dl1: $.data.id }
            - call: "POST /repair-orders/${ro_id}/estimate-lines"
              payload: { damage_line_id: "${dl1}", operation_code: "BDY-1", labor_type: "BODY", guide_hours: 4.5 }
              as: Estimator
              as_user_id: "est-100"
            - call: "POST /repair-orders/${ro_id}/blueprint"
              payload: {}
              as: Estimator
              as_user_id: "est-100"
            - call: "POST /repair-orders/${ro_id}/estimate/lock"
              payload: {}
              as: Estimator
              as_user_id: "est-100"
            - call: "GET /repair-orders/${ro_id}"
              payload: {}
              as: Estimator
              as_user_id: "est-100"
              captures: { ro_ver: $.data.version }
            - call: "POST /repair-orders/${ro_id}/supplements"
              payload: { reason_code: "HIDDEN-DAMAGE", requested_amount_cents: 50000, expected_repair_order_version: "${ro_ver}" }
              as: Estimator
              as_user_id: "est-100"
              captures: { sup_id: $.data.id }
          trigger:
            - call: "POST /supplements/${sup_id}/decision"
              payload: { decision: "APPROVE" }
              as: InsurerAdjuster
              as_user_id: "${ins_2}"
              captures: { err: $.data.error_id }
          assert:
            - "HTTP 403 with data.error_id == ERR_NOT_RESOURCE_OWNER"
            - "Supplement.${sup_id} is still SUBMITTED with approved_amount_cents null and decided_at null, and RepairOrder.${ro_id}.approved_supplement_total_cents is 0"
            - "GET /repair-orders/${ro_id} and GET /supplements/${sup_id} as InsurerAdjuster ${ins_2} are both HTTP 403 ERR_NOT_RESOURCE_OWNER, while as ${ins_1} both return HTTP 200"
            - "the same decision as InsurerAdjuster ${ins_1} is accepted and moves the supplement to APPROVED"
            - "a second decision from ${ins_2} against the now-APPROVED supplement is still ERR_NOT_RESOURCE_OWNER, not ERR_SUPPLEMENT_NOT_OPEN: rule 3 outranks rule 41"

      - name: a_customer_may_only_consent_on_their_own_order
        claim_type: exclusive_operations_denied
        grounds:
          - validations.priority_3
          - errors.ERR_NOT_RESOURCE_OWNER
          - roles.Customer
          - concurrency_rules.consent-decision-stale-order
        distinguishing_aspect: >-
          The consent endpoint carries both an ownership check and an OCC field, and their order matters:
          a foreign customer holding a perfectly current version must still be refused for ownership,
          and a foreign customer holding a stale one must be refused for ownership rather than for
          staleness, because rule 3 sits above rule 33.
        test_recipe:
          setup:
            - "Customers C1 and C2 exist; a RepairOrder belongs to C1 and is locked on a BODY 4.5 h line, so customer_pay_cents is the 25000 deductible."
          setup_api_calls:
            - call: "POST /customers"
              payload: { full_name: "Ivy Nash", phone: "555-1056", email: "ivy@example.com" }
              as: ShopAdmin
              captures: { cust_1: $.data.id }
            - call: "POST /customers"
              payload: { full_name: "Jax Poe", phone: "555-1057", email: "jax@example.com" }
              as: ShopAdmin
              captures: { cust_2: $.data.id }
            - call: "POST /insurers"
              payload: { insurer_code: "CRNR-58", name: "Cornerstone Mutual", rate_ceiling_cents: { BODY: 6000, FRAME: 8000, REFINISH: 5800, MECHANICAL: 11000, ALUMINUM_BODY: 8800 } }
              as: ShopAdmin
              captures: { ins_id: $.data.id }
            - call: "POST /repair-orders"
              payload: { customer_id: "${cust_1}", insurer_id: "${ins_id}", claim_number: "CLM-90064", vehicle_vin: "1HGCV1F30LA090064", vehicle_model_year: 2019, vehicle_make_model: "Honda Accord", initial_authorized_cents: 400000, deductible_cents: 25000 }
              as: ShopAdmin
              captures: { ro_id: $.data.id }
            - call: "POST /repair-orders/${ro_id}/teardown-findings"
              payload: { panel_code: "LT-DOOR", severity: "MODERATE" }
              as: Estimator
              as_user_id: "est-100"
              captures: { dl1: $.data.id }
            - call: "POST /repair-orders/${ro_id}/estimate-lines"
              payload: { damage_line_id: "${dl1}", operation_code: "BDY-1", labor_type: "BODY", guide_hours: 4.5 }
              as: Estimator
              as_user_id: "est-100"
            - call: "POST /repair-orders/${ro_id}/blueprint"
              payload: {}
              as: Estimator
              as_user_id: "est-100"
            - call: "POST /repair-orders/${ro_id}/estimate/lock"
              payload: {}
              as: Estimator
              as_user_id: "est-100"
            - call: "GET /repair-orders/${ro_id}"
              payload: {}
              as: ShopAdmin
              captures: { ro_ver: $.data.version }
          trigger:
            - call: "POST /repair-orders/${ro_id}/consent-decisions"
              payload: { decision: "CONSENT", alternate_parts_ok: false, expected_repair_order_version: "${ro_ver}" }
              as: Customer
              as_user_id: "${cust_2}"
              captures: { err: $.data.error_id }
          assert:
            - "HTTP 403 with data.error_id == ERR_NOT_RESOURCE_OWNER even though ${ro_ver} is the order's current version"
            - "RepairOrder.${ro_id}.consent_state is still PENDING with consent_basis_cents null and version still ${ro_ver}"
            - "GET /repair-orders/${ro_id} as Customer ${cust_2} is HTTP 403 ERR_NOT_RESOURCE_OWNER, while as ${cust_1} it returns HTTP 200 with customer_pay_cents 25000"
            - "the same call from ${cust_2} carrying a deliberately stale version is still ERR_NOT_RESOURCE_OWNER (403), not ERR_STALE_REPAIR_ORDER_VERSION (412)"
            - "the identical call from ${cust_1} is accepted: consent_state becomes CONSENTED with consent_basis_cents 25000"

      - name: the_blueprinting_user_cannot_file_the_qc_inspection
        claim_type: segregation_of_duties
        grounds:
          - validations.priority_4
          - errors.ERR_SEGREGATION_OF_DUTIES
          - roles.Estimator
          - roles.QcInspector
          - entities.RepairOrder.fields.blueprint_by_user_id
        distinguishing_aspect: >-
          The refusal keys on the X-User-ID recorded at blueprint time, not on the role: the same person
          wearing the QcInspector role is still refused, while any other inspector is accepted. This is
          the one rule where two requests that are byte-identical except for their user header get
          different answers, and it sits above every stage and content gate.
        test_recipe:
          setup:
            - "The clock is at 2026-08-01T00:00:00Z, with a BODY stall and a PAINT stall."
            - "An order blueprinted by est-100 is walked to READY_FOR_QC on a REPAIR booking 08:00-12:00 and a REFINISH_CALIBRATION booking 13:00-15:00, with no parts lines at all."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-01T00:00:00Z" }
              as: ShopAdmin
            - call: "POST /customers"
              payload: { full_name: "Kim Vale", phone: "555-1058", email: "kim@example.com" }
              as: ShopAdmin
              captures: { cust_id: $.data.id }
            - call: "POST /insurers"
              payload: { insurer_code: "CRNR-59", name: "Cornerstone Mutual", rate_ceiling_cents: { BODY: 6000, FRAME: 8000, REFINISH: 5800, MECHANICAL: 11000, ALUMINUM_BODY: 8800 } }
              as: ShopAdmin
              captures: { ins_id: $.data.id }
            - call: "POST /stalls"
              payload: { name: "Body R", stall_type: "BODY" }
              as: ShopAdmin
              captures: { stall_body: $.data.id }
            - call: "POST /stalls"
              payload: { name: "Paint R", stall_type: "PAINT" }
              as: ShopAdmin
              captures: { stall_paint: $.data.id }
            - call: "POST /repair-orders"
              payload: { customer_id: "${cust_id}", insurer_id: "${ins_id}", claim_number: "CLM-90065", vehicle_vin: "1HGCV1F30LA090065", vehicle_model_year: 2019, vehicle_make_model: "Honda Accord", initial_authorized_cents: 400000, deductible_cents: 25000 }
              as: ShopAdmin
              captures: { ro_id: $.data.id }
            - call: "POST /repair-orders/${ro_id}/teardown-findings"
              payload: { panel_code: "LT-DOOR", severity: "MODERATE" }
              as: Estimator
              as_user_id: "est-100"
              captures: { dl1: $.data.id }
            - call: "POST /repair-orders/${ro_id}/estimate-lines"
              payload: { damage_line_id: "${dl1}", operation_code: "BDY-1", labor_type: "BODY", guide_hours: 4.5 }
              as: Estimator
              as_user_id: "est-100"
            - call: "POST /repair-orders/${ro_id}/blueprint"
              payload: {}
              as: Estimator
              as_user_id: "est-100"
            - call: "POST /repair-orders/${ro_id}/estimate/lock"
              payload: {}
              as: Estimator
              as_user_id: "est-100"
            - call: "POST /repair-orders/${ro_id}/stage-advance"
              payload: { to_stage: "PARTS_STAGED" }
              as: Technician
              as_user_id: "tech-100"
            - call: "POST /repair-orders/${ro_id}/stage-assignments"
              payload: { stall_id: "${stall_body}", stage: "REPAIR", window_start: "2026-08-01T08:00:00Z", window_end: "2026-08-01T12:00:00Z" }
              as: Technician
              as_user_id: "tech-100"
            - call: "POST /repair-orders/${ro_id}/stage-advance"
              payload: { to_stage: "REPAIR" }
              as: Technician
              as_user_id: "tech-100"
            - call: "POST /repair-orders/${ro_id}/stage-assignments"
              payload: { stall_id: "${stall_paint}", stage: "REFINISH_CALIBRATION", window_start: "2026-08-01T13:00:00Z", window_end: "2026-08-01T15:00:00Z" }
              as: Technician
              as_user_id: "tech-100"
            - call: "POST /repair-orders/${ro_id}/stage-advance"
              payload: { to_stage: "REFINISH_CALIBRATION" }
              as: Technician
              as_user_id: "tech-100"
            - call: "POST /repair-orders/${ro_id}/stage-advance"
              payload: { to_stage: "READY_FOR_QC" }
              as: Technician
              as_user_id: "tech-100"
          trigger:
            - call: "POST /repair-orders/${ro_id}/qc-inspections"
              payload: { checklist_passed: true, post_scan_dtc_count: 0, scan_report_ref: "SCAN-9065" }
              as: QcInspector
              as_user_id: "est-100"
              captures: { err: $.data.error_id }
          assert:
            - "HTTP 403 with data.error_id == ERR_SEGREGATION_OF_DUTIES"
            - "RepairOrder.${ro_id}.blueprint_by_user_id == est-100 and GET /repair-orders/${ro_id}/qc-inspections reports total_count 0"
            - "the identical call as QcInspector qc-100 is accepted with result PASS and sequence_number 1"
            - "the refusal still applies when the order would otherwise fail a later gate: at REPAIR the same est-100 inspection is ERR_SEGREGATION_OF_DUTIES, not ERR_STAGE_PRECONDITION"
            - "RepairOrder.${ro_id}.stage is unchanged by the refusal and remains READY_FOR_QC"

      - name: vendor_registration_is_shared_by_shop_admin_and_parts_manager
        claim_type: shared_operations
        grounds:
          - roles.ShopAdmin
          - roles.PartsManager
          - endpoints.POST_/parts-vendors
          - validations.priority_2
        distinguishing_aspect: >-
          POST /parts-vendors is the one write two roles share, and both must reach the same outcome -
          an identical row with the same defaults, not a second-class copy. Everyone else is refused, so
          a permissive "any role may register a vendor" reading is caught by the third assert.
        test_recipe:
          setup:
            - "An empty registry; no vendors exist yet."
          setup_api_calls:
            - call: "POST /parts-vendors"
              payload: { name: "Harbour Honda", vendor_type: "OEM_DEALER", part_types_offered: ["OEM"] }
              as: ShopAdmin
              captures: { ven_admin: $.data.id }
          trigger:
            - call: "POST /parts-vendors"
              payload: { name: "Alt Supply Co", vendor_type: "AFTERMARKET_DISTRIBUTOR", part_types_offered: ["AFTERMARKET", "RECYCLED"] }
              as: PartsManager
              captures: { ven_pm: $.data.id }
          assert:
