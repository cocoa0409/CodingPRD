  # ===========================================================================
  - section: validations
    instances:
      - name: missing_auth_header_returns_400
        claim_type: violation_to_error
        grounds:
          - validations[priority=1]
          - errors[ERR_MISSING_OR_INVALID_USER_CONTEXT_HEADER]
        distinguishing_aspect: "Requests without valid X-User-ID / X-User-Role headers are rejected at priority 1 with ERR_MISSING_OR_INVALID_USER_CONTEXT_HEADER before any role or existence check."
        test_recipe:
          setup: ["empty DB"]
          setup_api_calls: []
          trigger:
            - call: "POST /marketplace/practices"
              payload: { name: "P1", timezone: "America/New_York" }
              as: Anonymous
              captures: { err: $.data.error_id }
          assert:
            - "err == ERR_MISSING_OR_INVALID_USER_CONTEXT_HEADER (400) when the X-User-ID / X-User-Role headers are omitted entirely (the structured `as:` above is for lint binding only; the realized test sends no auth headers)"

      - name: patient_cannot_create_practice_forbidden
        claim_type: violation_to_error
        grounds:
          - validations[priority=2]
          - errors[ERR_FORBIDDEN]
          - roles[OpsAdmin]
        distinguishing_aspect: "POST /marketplace/practices is OpsAdmin-exclusive; a Patient role is denied with ERR_FORBIDDEN (403) at priority 2."
        test_recipe:
          setup: ["empty DB"]
          setup_api_calls: []
          trigger:
            - call: "POST /marketplace/practices"
              payload: { name: "P1", timezone: "America/New_York" }
              as: Patient
              as_user_id: "00000000-0000-0000-0000-000000000000"
              captures: { err: $.data.error_id }
          assert:
            - "err == ERR_FORBIDDEN with http 403"

      - name: patient_cannot_cancel_other_patients_booking
        claim_type: cross_entity_validation
        grounds:
          - validations[priority=4]
          - errors[ERR_OWNERSHIP_MISMATCH]
        distinguishing_aspect: "Ownership scope (priority 4): a patient cancelling another patient's booking is rejected with ERR_OWNERSHIP_MISMATCH before state checks."
        test_recipe:
          setup: ["bookable practice/provider, one slot, booking owned by patient A; patient B registered"]
          setup_api_calls:
            - call: "POST /marketplace/practices"
              payload: { name: "P1", timezone: "America/New_York" }
              as: OpsAdmin
              captures: { p_id: $.data.id }
            - call: "POST /marketplace/practices/${p_id}/activate"
              payload: {}
              as: OpsAdmin
            - call: "POST /marketplace/providers"
              payload: { practice_id: "${p_id}", display_name: "Dr A", specialty: "DERM" }
              as: PracticeStaff
              as_user_id: "${p_id}"
              captures: { prov_id: $.data.id }
            - call: "POST /marketplace/providers/${prov_id}/activate"
              payload: {}
              as: OpsAdmin
            - call: "POST /marketplace/providers/${prov_id}/appointment-types"
              payload: { code: "NEW30", display_name: "New patient 30", duration_minutes: 30, booked_copay_cents: 10000 }
              as: Provider
              as_user_id: "${prov_id}"
              captures: { type_id: $.data.id }
            - call: "POST /marketplace/providers/${prov_id}/slots"
              payload: { start_at: "2026-09-03T10:00:00Z", end_at: "2026-09-03T10:30:00Z" }
              as: Provider
              as_user_id: "${prov_id}"
              captures: { s1: $.data.id }
            - call: "POST /marketplace/patients"
              payload: { full_name: "Pat A", email: "pa@x.com" }
              as: Anonymous
              captures: { patA: $.data.id }
            - call: "POST /marketplace/patients"
              payload: { full_name: "Pat B", email: "pb@x.com" }
              as: Anonymous
              captures: { patB: $.data.id }
            - call: "POST /marketplace/slots/${s1}/bookings"
              payload: { patient_id: "${patA}", appointment_type_id: "${type_id}" }
              as: Patient
              as_user_id: "${patA}"
              captures: { b1: $.data.id }
          trigger:
            - call: "POST /marketplace/bookings/${b1}/cancel"
              payload: {}
              as: Patient
              as_user_id: "${patB}"
              captures: { err: $.data.error_id }
          assert:
            - "err == ERR_OWNERSHIP_MISMATCH and Booking.${b1}.status remains CONFIRMED"

      - name: retired_appointment_type_booking_rejected
        claim_type: violation_to_error
        grounds:
          - validations[priority=8]
