  # ===========================================================================
  - rule_id: resource_temporal_overlap
    instances:
      - name: exclusive_coverage_closed_interval_touch_conflict
        grounds:
          - state_machines.CoverageAssignment.PROPOSED_to_ACTIVE
          - endpoints.POST_/brand-ops/distributors/{distributorId}/coverage-assignments
          - errors.ERR_EXCLUSIVE_OVERLAP
        distinguishing_aspect: "Closed-interval semantics on the coverage-cell resource: an ACTIVE exclusive assignment [2026-08-01, 2027-02-28] conflicts with a new exclusive proposal whose starts_on equals its ends_on (touching endpoints overlap), while a proposal starting the next day is accepted — the opposite adjacency rule from price lists."
        test_recipe:
          setup:
            - "Logical clock at the startup default 2026-09-01T00:00:00Z."
            - "Brand with LAUNCHED core line; distributor D1 APPROVED with ACTIVE exclusive assignment on (US, HARDWARE, CORE) covering 2026-08-01..2027-02-28; distributor D2 APPROVED with no assignments."
          setup_api_calls:
            - *c_brand
            - *c_market
            - *c_mfr1
            - *c_mfr1q
            - *c_mfr2
            - *c_mfr2q
            - *c_line_core
            - *c_form
            - *c_seal
            - *c_g1
            - *c_g1g
            - *c_g1a
            - *c_g2
            - *c_g2g
            - *c_g2a
            - *c_review
            - *c_pack
            - *c_tool
            - *c_price
            - *c_enterprod
            - *c_launch
            - *c_dist
            - *c_dist_app
            - call: "POST /brand-ops/distributors/${dist_id}/coverage-assignments"
              payload: { market_id: "${market_id}", product_line_id: "${line_id}", channel: "HARDWARE", exclusive: true, starts_on: "2026-08-01", ends_on: "2027-02-28", annual_quota_units: 1200, expected_distributor_version: "${dist_v2}" }
              as: ChannelManager
              captures: { asg1_id: $.data.id }
            - call: "POST /brand-ops/coverage-assignments/${asg1_id}/activate"
              payload: {}
              as: ChannelManager
            - call: "POST /brand-ops/distributors"
              payload: { legal_name: "Second Source Trading", home_market_id: "${market_id}", channels_served: ["HARDWARE"], credit_limit_cents: 500000 }
              as: ChannelManager
              captures: { dist2_id: $.data.id }
            - call: "POST /brand-ops/distributors/${dist2_id}/approve"
              payload: {}
              as: ChannelManager
              captures: { dist2_v2: $.data.version }
          trigger:
            - call: "POST /brand-ops/distributors/${dist2_id}/coverage-assignments"
              payload: { market_id: "${market_id}", product_line_id: "${line_id}", channel: "HARDWARE", exclusive: true, starts_on: "2027-02-28", ends_on: "2027-08-31", annual_quota_units: 600, expected_distributor_version: "${dist2_v2}" }
              as: ChannelManager
              captures: { error_id: $.data.error_id }
            - call: "POST /brand-ops/distributors/${dist2_id}/coverage-assignments"
              payload: { market_id: "${market_id}", product_line_id: "${line_id}", channel: "HARDWARE", exclusive: true, starts_on: "2027-03-01", ends_on: "2027-08-31", annual_quota_units: 600, expected_distributor_version: "${dist2_v2}" }
              as: ChannelManager
              captures: { asg2_id: $.data.id, asg2_status: $.data.status, asg2_sup: $.data.supersedes_assignment_id }
          assert:
            - "touching proposal [2027-02-28, 2027-08-31] is rejected: 409 ERR_EXCLUSIVE_OVERLAP (closed intervals share the date 2027-02-28)"
            - "next-day proposal [2027-03-01, 2027-08-31] succeeds: 201 with status PROPOSED"
            - "the failed proposal did not bump the distributor version (the second create reuses ${dist2_v2} and succeeds)"
            - "CoverageAssignment.${asg2_id}.supersedes_assignment_id is null (nothing PROPOSED remained on the cell)"

      - name: price_list_half_open_adjacency_and_clip
        grounds:
          - state_machines.ChannelPriceList
          - calculations.price_resolution
          - errors.ERR_NO_EFFECTIVE_PRICE
        distinguishing_aspect: "Half-open interval semantics on the price-cell resource: a list starting exactly at the incumbent's effective_to coexists (no conflict, no supersede), while a list starting mid-window clips the incumbent's effective_to and supersedes the overlapped SCHEDULED list — a different geometry than coverage's closed intervals."
        test_recipe:
          setup:
            - "Logical clock at the startup default 2026-09-01T00:00:00Z."
            - "Brand with PILOT core line; pack TOOLED; price list L1 499/300 EFFECTIVE over [2026-08-01, 2026-12-01)."
          setup_api_calls:
            - *c_brand
            - *c_line_core
            - *c_form
            - *c_seal
            - *c_review
            - *c_pack
            - *c_tool
            - call: "POST /brand-ops/pack-formats/${pack_id}/price-lists"
              payload: { channel: "HARDWARE", list_price_cents: 499, map_price_cents: 300, effective_from: "2026-08-01T00:00:00Z", effective_to: "2026-12-01T00:00:00Z", expected_pack_format_version: "${pack_v2}" }
              as: PricingAnalyst
              captures: { pl1_id: $.data.id, pl1_status: $.data.status }
            - call: "GET /brand-ops/pack-formats/${pack_id}"
              payload: {}
              as: PricingAnalyst
              captures: { pack_v3: $.data.version }
            - call: "POST /brand-ops/pack-formats/${pack_id}/price-lists"
              payload: { channel: "HARDWARE", list_price_cents: 520, map_price_cents: 300, effective_from: "2026-12-01T00:00:00Z", effective_to: "2027-04-01T00:00:00Z", expected_pack_format_version: "${pack_v3}" }
              as: PricingAnalyst
              captures: { pl2_id: $.data.id, pl2_status: $.data.status }
            - call: "GET /brand-ops/pack-formats/${pack_id}"
              payload: {}
              as: PricingAnalyst
              captures: { pack_v4: $.data.version }
          trigger:
            - call: "POST /brand-ops/pack-formats/${pack_id}/price-lists"
              payload: { channel: "HARDWARE", list_price_cents: 549, map_price_cents: 300, effective_from: "2026-11-15T00:00:00Z", effective_to: "2027-02-01T00:00:00Z", expected_pack_format_version: "${pack_v4}" }
              as: PricingAnalyst
              captures: { pl3_id: $.data.id }
            - call: "GET /brand-ops/price-lists/${pl1_id}"
              payload: {}
              as: PricingAnalyst
              captures: { pl1_to: $.data.effective_to, pl1_status_after: $.data.status }
            - call: "GET /brand-ops/price-lists/${pl2_id}"
              payload: {}
              as: PricingAnalyst
              captures: { pl2_status_after: $.data.status }
            - call: "GET /brand-ops/pack-formats/${pack_id}/effective-price"
              payload: { channel: "HARDWARE", at: "2026-11-20T00:00:00Z" }
              as: PricingAnalyst
              captures: { resolved_list: $.data.price_list_id, resolved_price: $.data.list_price_cents }
          assert:
            - "L1 was EFFECTIVE on creation (window covers 2026-09-01)"
            - "L2 was accepted as SCHEDULED: half-open adjacency at 2026-12-01T00:00:00Z is not an overlap"
            - "after L3 [2026-11-15, 2027-02-01) is created, L1 remains EFFECTIVE but is clipped: effective_to == 2026-11-15T00:00:00Z"
            - "L2 is SUPERSEDED (SCHEDULED lists overlapped by a newcomer are wholly superseded)"
            - "effective-price at 2026-11-20T00:00:00Z resolves to L3 with list_price_cents 549"

  # ===========================================================================
  - rule_id: compensating_invariant
    instances:
      - name: promo_suspend_resume_conserves_funding_headroom
        grounds:
          - state_machines.Promotion.LIVE_to_SUSPENDED
          - state_machines.Promotion.SUSPENDED_to_LIVE
          - state_machines.CounterfeitCase.REPORTED_to_ACTION_TAKEN
          - calculations.brand_protection_posture
        distinguishing_aspect: "Conserved quantity: promotion funding headroom (funding_budget_cents - accrued_funding_cents). The posture-driven suspension and the compensating resume leave accrued_funding_cents at exactly 4500 and headroom at exactly 5500 — no drift across the round trip."
        test_recipe:
          setup:
            - "Logical clock at the startup default 2026-09-01T00:00:00Z."
            - "Brand with LAUNCHED EXT-1; price list 3000/300 EFFECTIVE; promotion 15.00% (unit funding 450) with budget 10000, LIVE; one redemption of 10 units booked (accrued 4500)."
          setup_api_calls:
            - *c_brand
            - *c_market
            - *c_mfr1
            - *c_mfr1q
            - *c_mfr2
            - *c_mfr2q
            - call: "POST /brand-ops/brands/${brand_id}/product-lines"
              payload: { line_code: "EXT-1", name: "Smart Straw Extension", is_core: false, target_channels: ["HARDWARE"] }
              as: BrandManager
              captures: { line_id: $.data.id }
            - *c_form
            - *c_seal
            - *c_g1
            - *c_g1g
            - *c_g1a
            - *c_g2
            - *c_g2g
            - *c_g2a
            - *c_review
            - *c_pack
            - *c_tool
            - call: "POST /brand-ops/pack-formats/${pack_id}/price-lists"
              payload: { channel: "HARDWARE", list_price_cents: 3000, map_price_cents: 300, effective_from: "2026-08-01T00:00:00Z", effective_to: "2027-08-01T00:00:00Z", expected_pack_format_version: "${pack_v2}" }
              as: PricingAnalyst
            - *c_enterprod
            - *c_launch
            - call: "POST /brand-ops/promotions"
              payload: { product_line_id: "${line_id}", channel: "HARDWARE", discount_pct: 15.00, starts_on: "2026-08-01", ends_on: "2027-07-31", funding_budget_cents: 10000 }
              as: PricingAnalyst
              as_user_id: "pa-1"
              captures: { promo_id: $.data.id }
            - call: "POST /brand-ops/promotions/${promo_id}/submit"
              payload: {}
              as: PricingAnalyst
              as_user_id: "pa-1"
            - call: "POST /brand-ops/promotions/${promo_id}/approve"
              payload: {}
              as: MarketingManager
              as_user_id: "mm-1"
            - call: "POST /brand-ops/promotions/${promo_id}/redemptions"
              payload: { pack_format_id: "${pack_id}", units: 10 }
              as: ChannelManager
              captures: { accrued0: $.data.accrued_funding_cents }
          trigger:
            - call: "POST /brand-ops/brands/${brand_id}/counterfeit-cases"
              payload: { market_id: "${market_id}", channel: "HARDWARE", severity: 5, units_seized: 40 }
              as: ComplianceAuditor
              as_user_id: "ca-1"
              captures: { case_id: $.data.id }
            - call: "POST /brand-ops/counterfeit-cases/${case_id}/take-action"
              payload: { units_seized: 40 }
              as: ComplianceAuditor
              as_user_id: "ca-1"
            - call: "POST /brand-ops/counterfeit-cases/${case_id}/close"
              payload: {}
              as: ComplianceAuditor
              as_user_id: "ca-1"
            - call: "POST /brand-ops/promotions/${promo_id}/resume"
              payload: {}
              as: MarketingManager
              as_user_id: "mm-1"
              captures: { promo_status: $.data.status, promo_accrued: $.data.accrued_funding_cents, promo_budget: $.data.funding_budget_cents }
          assert:
            - "the severity-5 case creation flipped Brand.${brand_id}.protection_posture to CRITICAL and cascaded Promotion.${promo_id} to SUSPENDED"
            - "while suspended the promotion's accrued_funding_cents stayed 4500 (no redemption is possible and nothing zeroes it)"
            - "closing the case restored posture NORMAL but did NOT auto-resume the promotion"
            - "after resume: status LIVE, accrued_funding_cents == 4500, funding_budget_cents == 10000, so headroom == 5500 exactly as before the incident"
            - "redemptions_count == 1 (the suspend/resume round trip created no phantom redemptions)"

      - name: grant_activate_revoke_conserves_disclosed_components
        grounds:
          - state_machines.ConfidentialityGrant.GRANTED_to_ACTIVE
          - state_machines.ConfidentialityGrant.ACTIVE_to_REVOKED
          - calculations.component_coverage
          - entities.ContractManufacturer.fields.disclosed_component_count
        distinguishing_aspect: "Conserved quantity: a manufacturer's disclosed component-pair count. An activate followed by a non-cause revoke returns disclosed_component_count to its prior value (0 -> 1 -> 0) and leaves the formulation's COMPARTMENTALIZED coverage untouched — no leakage from the round trip."
        test_recipe:
          setup:
            - "Logical clock at the startup default 2026-09-01T00:00:00Z."
            - "Brand with line CORE; formulation [C1..C4] COMPARTMENTALIZED via mfr1 {C1,C2} and mfr2 {C3,C4}; mfr3 QUALIFIED with zero disclosures."
