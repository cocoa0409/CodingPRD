        grounds: ["validations[priority=6]", "errors[ERR_MOISTURE_PROTOCOL_VIOLATION]"]
        distinguishing_aspect: "Packing a moisture_sensitive formulation without dry_room_id violates the moisture protocol (safety, priority 6)."
