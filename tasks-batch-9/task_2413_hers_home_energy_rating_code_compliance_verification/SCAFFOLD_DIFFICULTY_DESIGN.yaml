          assert:
            - "the 2026-08-15..2026-08-31 request returns HTTP status == 409 with error_id == ERR_SAMPLE_WINDOW_CONFLICT"
            - "the 2026-08-16..2026-08-31 request returns HTTP status == 201"
            - "SampleSet.${ss17b}.window_start_date == 2026-08-16"
            - "SampleSet.${ss17b}.status == FORMING"
