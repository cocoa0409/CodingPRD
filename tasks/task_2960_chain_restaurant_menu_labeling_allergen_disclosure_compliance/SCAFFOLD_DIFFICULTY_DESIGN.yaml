            - "after trigger[0]: Establishment.${est}.outstanding_penalty_cents == 78750 and Jurisdiction.${juris}.assessed_penalty_cents_total == 78750"
            - "after trigger[0]: Brand.${brand}.open_enforcement_escalated_count == 0 and compliance_posture == COMPLIANT, since assessment closes the escalation counter"
            - "trigger[1] response HTTP status == 200 with data.status == RESPONSE_SUBMITTED, penalty_total_cents == 0 and penalty_basis, violation_unit_count, base_penalty_cents, admin_fee_cents all null"
            - "after trigger[1]: Establishment.${est}.outstanding_penalty_cents == 0 and Jurisdiction.${juris}.assessed_penalty_cents_total == 0 - each ledger reduced by exactly 78750, not by base_penalty_cents alone"
            - "after trigger[1]: EnforcementAction.${action}.info_round_count == 1, response_count == 2 and last_response_type == DISPUTED are untouched, so the compensation is scoped to the money fields"
            - "trigger[3] response HTTP status == 200 with data.last_response_type == REPRINT_COMPLETED - the same call issued between trigger[0] and trigger[1] would have returned ERR_OUTSTANDING_PENALTY (402)"
            - "GET /brands/${brand}/compliance-summary reports outstanding_penalty_cents_total == 0 after trigger[1]"
            - "no drift over a second cycle: ESCALATE again after a further REQUEST_INFO/response round, ASSESS_PENALTY with basis PER_ESTABLISHMENT and RESCIND_PENALTY once more, and both ledgers return to exactly 0 while GET /jurisdictions/${juris} reports assessed_penalty_cents_total == 0"
