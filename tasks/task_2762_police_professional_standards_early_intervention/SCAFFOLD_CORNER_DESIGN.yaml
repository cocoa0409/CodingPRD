      - name: the_outcome_report_derives_its_totals_without_writing_anything
        claim_type: Computed read
        grounds:
          - endpoints["GET /reports/complaint-outcomes"]
          - calculations.complaint_outcome_report
          - errors.ERR_INVALID_REPORT_PERIOD
        distinguishing_aspect: |
          The report is a pure computed read over closed and withdrawn complaints: it must derive
          the envelope from the rows in the period, return the same answer when repeated, mutate
          nothing, and reject a reversed period with ERR_INVALID_REPORT_PERIOD before computing
          anything. Suppression boundaries are left to the difficulty instance; here the group is
          exactly at the disclosure minimum so the totals themselves are visible, and a second
          read over a later period must return zero rather than the cached previous answer.
        test_recipe:
          setup:
            - "The logical clock starts at 2026-08-01T00:00:00Z and advances to 2026-08-05T00:00:00Z."
            - "One PATROL_DIVISION unit with intake_enabled true holds Sergeant Doyle."
            - "Three SUPERVISOR-channel complaints are filed on 2026-08-01 and all three are withdrawn on 2026-08-05, so each carries closed_at 2026-08-05T00:00:00Z and sustained_allegation_count 0."
