scaffold_corner_design:
  # =====================================================================
  # Section: entities — creation, defaults, required fields, type
  # constraints, not-found, computed-field suppression.
  # =====================================================================
  - section: entities
    instances:
      - name: student_creation_applies_defaults
        claim_type: defaults
        grounds: [entities.Student.fields.cumulative_attempted_credits, entities.Student.fields.sap_status, entities.Student.fields.max_timeframe_credits]
        distinguishing_aspect: "POST /students omitting all optional numeric fields stores defaults 0/0/180/0 and sap_status NOT_EVALUATED; version starts at 1."
        test_recipe:
          setup: ["Empty DB"]
          setup_api_calls: []
          trigger:
            - call: "POST /api/students"
              payload: { ssn: "555667777", full_name: "Defaulted", email: "def@example.edu", residency: "IN_STATE", dependency_status: "DEPENDENT", enrollment_status: "FULL_TIME", grade_level: 1 }
              as: AidOfficer
              captures: { stu_def: "$.data.id" }
          assert:
            - "Student.${stu_def}.cumulative_attempted_credits == 0"
            - "Student.${stu_def}.cumulative_completed_credits == 0"
            - "Student.${stu_def}.max_timeframe_credits == 180"
            - "Student.${stu_def}.gpa_hundredths == 0"
            - "Student.${stu_def}.sap_status == NOT_EVALUATED"
            - "Student.${stu_def}.version == 1"

      - name: student_missing_required_field_returns_invalid_request
        claim_type: violation_to_error
        grounds: [entities.Student.fields.ssn, "errors[ERR_INVALID_REQUEST]"]
        distinguishing_aspect: "POST /students without ssn fails ERR_INVALID_REQUEST (400) — required input fields enforced at priority 9."
        test_recipe:
          setup: ["Empty DB"]
          setup_api_calls: []
          trigger:
            - call: "POST /api/students"
              payload: { full_name: "No SSN", email: "nossn@example.edu", residency: "IN_STATE", dependency_status: "DEPENDENT", enrollment_status: "FULL_TIME", grade_level: 1 }
              as: AidOfficer
              captures: { err: "$.data.error_id" }
          assert:
            - "err == ERR_INVALID_REQUEST"

      - name: student_invalid_enum_rejected
        claim_type: type_constraint
        grounds: [entities.Student.fields.residency, "errors[ERR_INVALID_REQUEST]"]
        distinguishing_aspect: "residency 'MID_STATE' is not in {IN_STATE, OUT_OF_STATE} -> ERR_INVALID_REQUEST."
        test_recipe:
          setup: ["Empty DB"]
          setup_api_calls: []
          trigger:
            - call: "POST /api/students"
              payload: { ssn: "555667777", full_name: "Bad Enum", email: "be@example.edu", residency: "MID_STATE", dependency_status: "DEPENDENT", enrollment_status: "FULL_TIME", grade_level: 1 }
              as: AidOfficer
              captures: { err: "$.data.error_id" }
          assert:
            - "err == ERR_INVALID_REQUEST"

      - name: student_get_not_found
        claim_type: not_found
        grounds: ["errors[ERR_NOT_FOUND]"]
        distinguishing_aspect: "GET /students/{random-uuid} returns ERR_NOT_FOUND (404)."
        test_recipe:
          setup: ["Empty DB"]
          setup_api_calls: []
          trigger:
            - call: "GET /api/students/00000000-0000-0000-0000-000000000000"
              payload: {}
              as: AidOfficer
              captures: { err: "$.data.error_id" }
          assert:
            - "err == ERR_NOT_FOUND"

      - name: student_duplicate_ssn_rejected
        claim_type: violation_to_error
        grounds: ["validations[priority=11]", "errors[ERR_DUPLICATE]"]
        distinguishing_aspect: "Second POST /students with an existing ssn fails ERR_DUPLICATE (409) even when email differs."
        test_recipe:
          setup: ["Student with ssn 555667777 exists"]
          setup_api_calls:
            - call: "POST /api/students"
              payload: { ssn: "555667777", full_name: "First", email: "first@example.edu", residency: "IN_STATE", dependency_status: "DEPENDENT", enrollment_status: "FULL_TIME", grade_level: 1 }
              as: AidOfficer
          trigger:
            - call: "POST /api/students"
              payload: { ssn: "555667777", full_name: "Second", email: "second@example.edu", residency: "IN_STATE", dependency_status: "DEPENDENT", enrollment_status: "FULL_TIME", grade_level: 1 }
              as: AidOfficer
              captures: { err: "$.data.error_id" }
          assert:
            - "err == ERR_DUPLICATE"

      - name: isir_household_constraint_dependent_minimum
        claim_type: violation_to_error
        grounds: ["validations[priority=10]", "errors[ERR_FIELD_CONSTRAINT]"]
        distinguishing_aspect: "DEPENDENT student with household_size 1 violates the >=2 floor -> ERR_FIELD_CONSTRAINT (422); also number_in_college > household_size is the same error class."
        test_recipe:
          setup:
            - "AidYear OPEN with ACTIVE PELL; Student DEPENDENT exists"
          setup_api_calls:
            - call: "POST /api/_clock/set_current_utc"
              payload: { to_iso8601: "2026-09-01T00:00:00Z" }
              as: AidDirector
            - call: "POST /api/aid-years"
              payload:
                year_code: "2026-2027"
                coa_in_state_cents: 2400000
                coa_out_of_state_cents: 3600000
                priority_deadline: "2026-03-01T00:00:00Z"
                pell_schedule:
                  - { efc_min: 0, efc_max: 150000, award_cents: 739500 }
                  - { efc_min: 150001, efc_max: 300000, award_cents: 500000 }
                  - { efc_min: 300001, efc_max: 500000, award_cents: 250000 }
                  - { efc_min: 500001, efc_max: 99999900, award_cents: 0 }
                verification_tracking_flag_rate: 0.50
              as: AidDirector
              captures: { ay_id: "$.data.id" }
            - call: "POST /api/fund-types"
              payload: { aid_year_id: "${ay_id}", fund_code: "PELL", category: "FEDERAL_TITLE_IV", need_based: true, annual_cap_cents: 739500, pool_budget_cents: 0, packaging_rank: 1, requires_verification_complete: false }
              as: AidDirector
              captures: { f_pell: "$.data.id" }
            - call: "POST /api/fund-types/${f_pell}/activate"
              payload: {}
              as: AidDirector
            - call: "POST /api/aid-years/${ay_id}/open"
              payload: {}
              as: AidDirector
            - call: "POST /api/students"
              payload: { ssn: "555667777", full_name: "Tiny Household", email: "hh@example.edu", residency: "IN_STATE", dependency_status: "DEPENDENT", enrollment_status: "FULL_TIME", grade_level: 1 }
              as: AidOfficer
              captures: { stu_hh: "$.data.id" }
          trigger:
            - call: "POST /api/isir-records"
              payload: { student_id: "${stu_hh}", aid_year_id: "${ay_id}", transaction_number: 1, received_at: "2026-02-01T00:00:00Z", household_size: 1, number_in_college: 1, agi_cents: 2000000, untaxed_income_cents: 0, asset_net_worth_cents: 0, cps_selection_flag: false }
              as: AidOfficer
              captures: { err: "$.data.error_id" }
          assert:
            - "err == ERR_FIELD_CONSTRAINT"

      - name: computed_field_input_ignored_on_isir
        claim_type: computed_fields
        grounds: [entities.ISIRRecord.fields.efc_provisional_cents]
        distinguishing_aspect: "Client-supplied efc_provisional_cents in the import payload is ignored (computed field); response carries the server-computed 742000 for the known fixture."
        test_recipe:
          setup: ["AidYear OPEN with ACTIVE PELL; Student DEPENDENT exists"]
          setup_api_calls:
            - call: "POST /api/_clock/set_current_utc"
              payload: { to_iso8601: "2026-09-01T00:00:00Z" }
              as: AidDirector
            - call: "POST /api/aid-years"
              payload:
                year_code: "2026-2027"
                coa_in_state_cents: 2400000
                coa_out_of_state_cents: 3600000
                priority_deadline: "2026-03-01T00:00:00Z"
                pell_schedule:
                  - { efc_min: 0, efc_max: 150000, award_cents: 739500 }
                  - { efc_min: 150001, efc_max: 300000, award_cents: 500000 }
                  - { efc_min: 300001, efc_max: 500000, award_cents: 250000 }
                  - { efc_min: 500001, efc_max: 99999900, award_cents: 0 }
                verification_tracking_flag_rate: 0.50
              as: AidDirector
              captures: { ay_id: "$.data.id" }
            - call: "POST /api/fund-types"
              payload: { aid_year_id: "${ay_id}", fund_code: "PELL", category: "FEDERAL_TITLE_IV", need_based: true, annual_cap_cents: 739500, pool_budget_cents: 0, packaging_rank: 1, requires_verification_complete: false }
              as: AidDirector
              captures: { f_pell: "$.data.id" }
            - call: "POST /api/fund-types/${f_pell}/activate"
              payload: {}
              as: AidDirector
            - call: "POST /api/aid-years/${ay_id}/open"
              payload: {}
              as: AidDirector
            - call: "POST /api/students"
              payload: { ssn: "555667777", full_name: "Computed", email: "comp@example.edu", residency: "IN_STATE", dependency_status: "DEPENDENT", enrollment_status: "FULL_TIME", grade_level: 1 }
              as: AidOfficer
              captures: { stu_cp: "$.data.id" }
          trigger:
            - call: "POST /api/isir-records"
              payload: { student_id: "${stu_cp}", aid_year_id: "${ay_id}", transaction_number: 1, received_at: "2026-02-01T00:00:00Z", household_size: 4, number_in_college: 1, agi_cents: 4500000, untaxed_income_cents: 0, asset_net_worth_cents: 50000, cps_selection_flag: false, efc_provisional_cents: 1 }
              as: AidOfficer
              captures: { isir_cp: "$.data.id" }
          assert:
            - "ISIRRecord.${isir_cp}.efc_provisional_cents == 742000 (client-supplied 1 ignored)"

      - name: list_pagination_envelope_shape
        claim_type: listing
        grounds: [response_envelope]
        distinguishing_aspect: "GET /students?limit=1&offset=1 returns the fixed envelope with meta.api_request_id, response_type 'array', and pagination fields total_count/has_more consistent with 2 stored students."
        test_recipe:
          setup: ["Two students exist"]
          setup_api_calls:
            - call: "POST /api/students"
              payload: { ssn: "555667777", full_name: "Page One", email: "p1@example.edu", residency: "IN_STATE", dependency_status: "DEPENDENT", enrollment_status: "FULL_TIME", grade_level: 1 }
              as: AidOfficer
            - call: "POST /api/students"
              payload: { ssn: "444556666", full_name: "Page Two", email: "p2@example.edu", residency: "IN_STATE", dependency_status: "DEPENDENT", enrollment_status: "FULL_TIME", grade_level: 1 }
              as: AidOfficer
          trigger:
            - call: "GET /api/students"
              payload: { limit: 1, offset: 1 }
              as: AidOfficer
          assert:
            - "Response envelope contains meta.api_request_id and response_type == 'array'"
            - "Page payload has exactly 1 student; total_count == 2 and has_more == false (offset 1 consumed the second and last row)"

  # =====================================================================
  # Section: state_machines — invalid transitions, terminal lockdown,
  # initial states, idempotency.
  # =====================================================================
  - section: state_machines
    instances:
      - name: invalid_transition_notify_from_draft
        claim_type: invalid_transition
        grounds: [state_machines.AwardPackage, "errors[ERR_INVALID_STATE]"]
        distinguishing_aspect: "notify on a DRAFT package (build never ran) is not a declared transition -> ERR_INVALID_STATE; no notification row is created."
        test_recipe:
          setup: ["AidYear OPEN; Student with current ISIR; package created but not built"]
          setup_api_calls:
            - call: "POST /api/_clock/set_current_utc"
              payload: { to_iso8601: "2026-09-01T00:00:00Z" }
              as: AidDirector
            - call: "POST /api/aid-years"
              payload:
                year_code: "2026-2027"
                coa_in_state_cents: 2400000
                coa_out_of_state_cents: 3600000
                priority_deadline: "2026-03-01T00:00:00Z"
                pell_schedule:
                  - { efc_min: 0, efc_max: 150000, award_cents: 739500 }
                  - { efc_min: 150001, efc_max: 300000, award_cents: 500000 }
                  - { efc_min: 300001, efc_max: 500000, award_cents: 250000 }
                  - { efc_min: 500001, efc_max: 99999900, award_cents: 0 }
                verification_tracking_flag_rate: 0.50
              as: AidDirector
              captures: { ay_id: "$.data.id" }
            - call: "POST /api/fund-types"
              payload: { aid_year_id: "${ay_id}", fund_code: "PELL", category: "FEDERAL_TITLE_IV", need_based: true, annual_cap_cents: 739500, pool_budget_cents: 0, packaging_rank: 1, requires_verification_complete: false }
              as: AidDirector
              captures: { f_pell: "$.data.id" }
            - call: "POST /api/fund-types/${f_pell}/activate"
              payload: {}
              as: AidDirector
            - call: "POST /api/aid-years/${ay_id}/open"
              payload: {}
              as: AidDirector
            - call: "POST /api/students"
              payload: { ssn: "555667777", full_name: "Draft Notify", email: "dn@example.edu", residency: "IN_STATE", dependency_status: "DEPENDENT", enrollment_status: "FULL_TIME", grade_level: 1 }
              as: AidOfficer
              captures: { stu_dn: "$.data.id" }
            - call: "POST /api/isir-records"
              payload: { student_id: "${stu_dn}", aid_year_id: "${ay_id}", transaction_number: 1, received_at: "2026-02-01T00:00:00Z", household_size: 4, number_in_college: 1, agi_cents: 2000000, untaxed_income_cents: 0, asset_net_worth_cents: 0, cps_selection_flag: false }
              as: AidOfficer
            - call: "POST /api/award-packages"
              payload: { student_id: "${stu_dn}", aid_year_id: "${ay_id}" }
              as: AidOfficer
              captures: { pkg_dn: "$.data.id" }
          trigger:
            - call: "POST /api/award-packages/${pkg_dn}/notify"
              payload: {}
              as: AidOfficer
              captures: { err: "$.data.error_id" }
          assert:
            - "err == ERR_INVALID_STATE"
            - "GET /api/award-packages/${pkg_dn}/notifications returns empty list"

      - name: terminal_lockdown_declined_package_rejects_accept
        claim_type: terminal_state_lockdown
        grounds: [state_machines.AwardPackage, "errors[ERR_INVALID_STATE]"]
        distinguishing_aspect: "From terminal DECLINED, every further transition (accept, lock, revision-requests) fails with ERR_INVALID_STATE."
        test_recipe:
          setup: ["AidYear OPEN; PELL ACTIVE; package built, notified, then declined by student"]
          setup_api_calls:
            - call: "POST /api/_clock/set_current_utc"
              payload: { to_iso8601: "2026-09-01T00:00:00Z" }
              as: AidDirector
            - call: "POST /api/aid-years"
              payload:
                year_code: "2026-2027"
                coa_in_state_cents: 2400000
                coa_out_of_state_cents: 3600000
                priority_deadline: "2026-03-01T00:00:00Z"
                pell_schedule:
                  - { efc_min: 0, efc_max: 150000, award_cents: 739500 }
                  - { efc_min: 150001, efc_max: 300000, award_cents: 500000 }
                  - { efc_min: 300001, efc_max: 500000, award_cents: 250000 }
                  - { efc_min: 500001, efc_max: 99999900, award_cents: 0 }
                verification_tracking_flag_rate: 0.50
              as: AidDirector
              captures: { ay_id: "$.data.id" }
            - call: "POST /api/fund-types"
              payload: { aid_year_id: "${ay_id}", fund_code: "PELL", category: "FEDERAL_TITLE_IV", need_based: true, annual_cap_cents: 739500, pool_budget_cents: 0, packaging_rank: 1, requires_verification_complete: false }
              as: AidDirector
              captures: { f_pell: "$.data.id" }
            - call: "POST /api/fund-types/${f_pell}/activate"
              payload: {}
              as: AidDirector
            - call: "POST /api/aid-years/${ay_id}/open"
              payload: {}
              as: AidDirector
            - call: "POST /api/students"
              payload: { ssn: "555667777", full_name: "Terminal", email: "term@example.edu", residency: "IN_STATE", dependency_status: "DEPENDENT", enrollment_status: "FULL_TIME", grade_level: 1 }
              as: AidOfficer
              captures: { stu_tm: "$.data.id" }
            - call: "POST /api/isir-records"
              payload: { student_id: "${stu_tm}", aid_year_id: "${ay_id}", transaction_number: 1, received_at: "2026-02-01T00:00:00Z", household_size: 4, number_in_college: 1, agi_cents: 2000000, untaxed_income_cents: 0, asset_net_worth_cents: 0, cps_selection_flag: false }
              as: AidOfficer
            - call: "POST /api/award-packages"
              payload: { student_id: "${stu_tm}", aid_year_id: "${ay_id}" }
              as: AidOfficer
              captures: { pkg_tm: "$.data.id" }
            - call: "POST /api/award-packages/${pkg_tm}/build"
              payload: {}
              as: AidOfficer
            - call: "POST /api/award-packages/${pkg_tm}/notify"
              payload: {}
              as: AidOfficer
            - call: "POST /api/award-packages/${pkg_tm}/decline"
              payload: {}
              as: Student
              as_user_id: "${stu_tm}"
          trigger:
            - call: "POST /api/award-packages/${pkg_tm}/revision-requests"
              payload: { reason: "APPEAL_AMOUNT" }
              as: Student
              as_user_id: "${stu_tm}"
              captures: { err: "$.data.error_id" }
          assert:
            - "err == ERR_INVALID_STATE"
            - "AwardPackage.${pkg_tm}.status == DECLINED"

      - name: verification_document_initial_state_and_idempotent_receive
        claim_type: initial_state
        grounds: [state_machines.VerificationDocument]
        distinguishing_aspect: "Newly created documents start REQUESTED; a second mark-received after RECEIVED is an invalid transition (ERR_INVALID_STATE) — the trigger is not idempotent."
        test_recipe:
          setup: ["AidYear OPEN; Student SELECTED; case DOCUMENTS_REQUESTED; doc D in REQUESTED"]
          setup_api_calls:
            - call: "POST /api/_clock/set_current_utc"
              payload: { to_iso8601: "2026-09-01T00:00:00Z" }
              as: AidDirector
            - call: "POST /api/aid-years"
              payload:
                year_code: "2026-2027"
                coa_in_state_cents: 2400000
                coa_out_of_state_cents: 3600000
                priority_deadline: "2026-03-01T00:00:00Z"
                pell_schedule:
                  - { efc_min: 0, efc_max: 150000, award_cents: 739500 }
                  - { efc_min: 150001, efc_max: 300000, award_cents: 500000 }
                  - { efc_min: 300001, efc_max: 500000, award_cents: 250000 }
                  - { efc_min: 500001, efc_max: 99999900, award_cents: 0 }
                verification_tracking_flag_rate: 0.50
              as: AidDirector
              captures: { ay_id: "$.data.id" }
            - call: "POST /api/fund-types"
              payload: { aid_year_id: "${ay_id}", fund_code: "PELL", category: "FEDERAL_TITLE_IV", need_based: true, annual_cap_cents: 739500, pool_budget_cents: 0, packaging_rank: 1, requires_verification_complete: false }
              as: AidDirector
              captures: { f_pell: "$.data.id" }
            - call: "POST /api/fund-types/${f_pell}/activate"
              payload: {}
              as: AidDirector
            - call: "POST /api/aid-years/${ay_id}/open"
              payload: {}
              as: AidDirector
            - call: "POST /api/students"
              payload: { ssn: "111223333", full_name: "Doc States", email: "ds@example.edu", residency: "IN_STATE", dependency_status: "DEPENDENT", enrollment_status: "FULL_TIME", grade_level: 1 }
              as: AidOfficer
              captures: { stu_ds: "$.data.id" }
            - call: "POST /api/isir-records"
              payload: { student_id: "${stu_ds}", aid_year_id: "${ay_id}", transaction_number: 1, received_at: "2026-02-01T00:00:00Z", household_size: 4, number_in_college: 1, agi_cents: 4500000, untaxed_income_cents: 0, asset_net_worth_cents: 50000, cps_selection_flag: false }
              as: AidOfficer
            - call: "GET /api/students/${stu_ds}/verification-cases"
              payload: {}
              as: AidOfficer
              captures: { vc_ds: "$.data[0].id" }
            - call: "GET /api/verification-cases/${vc_ds}/documents"
              payload: {}
              as: AidOfficer
              captures: { doc_ds: "$.data[0].id", doc_ds_status: "$.data[0].status" }
            - call: "POST /api/verification-documents/${doc_ds}/mark-received"
              payload: {}
              as: AidOfficer
          trigger:
            - call: "POST /api/verification-documents/${doc_ds}/mark-received"
              payload: {}
              as: AidOfficer
              captures: { err: "$.data.error_id" }
          assert:
            - "doc_ds_status == REQUESTED (initial state)"
            - "err == ERR_INVALID_STATE (second mark-received from RECEIVED)"

      - name: guarded_transition_close_requires_balanced_run
        claim_type: guarded_transition
        grounds: [state_machines.AidYear.RECONCILING_to_CLOSED, "errors[ERR_INVALID_STATE]"]
        distinguishing_aspect: "AidYear close while the latest ReconciliationRun is VARIANCE_FOUND (not BALANCED) fails ERR_INVALID_STATE — the guard reads a child entity's state."
        test_recipe:
          setup: ["AidYear with PELL ACTIVE, opened, packaging locked (no packages exist so the lock precondition passes vacuously), reconciliation begun; run imported with federal 1000 and compared (internal 0 -> variance 1000 -> VARIANCE_FOUND)"]
          setup_api_calls:
            - call: "POST /api/_clock/set_current_utc"
              payload: { to_iso8601: "2026-09-01T00:00:00Z" }
              as: AidDirector
            - call: "POST /api/aid-years"
              payload:
                year_code: "2026-2027"
                coa_in_state_cents: 2400000
                coa_out_of_state_cents: 3600000
                priority_deadline: "2026-03-01T00:00:00Z"
                pell_schedule:
                  - { efc_min: 0, efc_max: 150000, award_cents: 739500 }
                  - { efc_min: 150001, efc_max: 300000, award_cents: 500000 }
                  - { efc_min: 300001, efc_max: 500000, award_cents: 250000 }
                  - { efc_min: 500001, efc_max: 99999900, award_cents: 0 }
                verification_tracking_flag_rate: 0.50
              as: AidDirector
              captures: { ay_id: "$.data.id" }
            - call: "POST /api/fund-types"
              payload: { aid_year_id: "${ay_id}", fund_code: "PELL", category: "FEDERAL_TITLE_IV", need_based: true, annual_cap_cents: 739500, pool_budget_cents: 0, packaging_rank: 1, requires_verification_complete: false }
              as: AidDirector
              captures: { f_pell: "$.data.id" }
            - call: "POST /api/fund-types/${f_pell}/activate"
              payload: {}
              as: AidDirector
            - call: "POST /api/aid-years/${ay_id}/open"
              payload: {}
              as: AidDirector
            - call: "POST /api/aid-years/${ay_id}/lock-packaging"
              payload: {}
              as: AidDirector
            - call: "POST /api/aid-years/${ay_id}/begin-reconciliation"
              payload: {}
              as: AidDirector
            - call: "GET /api/aid-years/${ay_id}/reconciliation-runs"
              payload: {}
              as: AidDirector
              captures: { rr_id: "$.data[0].id" }
            - call: "POST /api/reconciliation-runs/${rr_id}/import-federal"
              payload: { federal_reported_cents: 1000 }
              as: AidDirector
            - call: "POST /api/reconciliation-runs/${rr_id}/compare"
              payload: {}
              as: AidDirector
          trigger:
            - call: "POST /api/aid-years/${ay_id}/close"
              payload: {}
              as: AidDirector
              captures: { err: "$.data.error_id" }
          assert:
            - "err == ERR_INVALID_STATE"
            - "AidYear.${ay_id}.status == RECONCILING"

      - name: side_effect_execution_fund_close_cascade
        claim_type: side_effect_execution
