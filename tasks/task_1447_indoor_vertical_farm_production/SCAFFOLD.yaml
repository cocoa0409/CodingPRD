  - Grower
  - SanitationLead
  - QualityAssurance
  - ContractsManager
  - LaborPlanner
  - Worker
  code: 200
  input:
  - rack_id?
  - tower_status?
  - limit?
  - offset?
  output: Tower[]
  side_effects: []
- method: GET
  path: /farm/towers/{id}
  description: Get a tower
  roles:
  - FarmManager
  - Grower
  - SanitationLead
  - QualityAssurance
  - ContractsManager
  - LaborPlanner
  - Worker
  code: 200
  input: []
  output: Tower
  side_effects: []
- method: GET
  path: /farm/towers/{id}/allocations
  description: List a tower's allocations (current and historical)
  roles:
  - FarmManager
  - Grower
  - SanitationLead
  - QualityAssurance
  - ContractsManager
  - LaborPlanner
  - Worker
  code: 200
  input:
  - limit?
  - offset?
  output: TowerAllocation[]
  side_effects: []
- method: POST
  path: /farm/batches
  description: Create a grow batch on explicit towers; pins the crop's ACTIVE recipe; creates ACTIVE TowerAllocations
  roles:
  - Grower
  code: 201
  input:
  - crop_id
  - tower_ids
  - planned_seed_at?
  output: GrowBatch
  side_effects:
  - production_status=PLANNED, safety_status=PENDING; projected_yield_lb initialized with yield_factor 1.00 (tower_count x pinned recipe expected_yield_lb_per_tower)
  - recipe_id pinned to the crop's ACTIVE recipe
  - 'TowerAllocations created with occupied_from_at = planned_seed_at (default: creation clock) and occupied_to_at = occupied_from_at + days_to_harvest (re-based to actual seeded_at at seed)'
  - tower overlap validated per allocation (half-open)
  - rack occupied_towers += len(tower_ids)
- method: GET
  path: /farm/batches
  description: List batches
  roles:
  - FarmManager
  - Grower
  - SanitationLead
  - QualityAssurance
  - ContractsManager
  - LaborPlanner
  - Worker
  code: 200
  input:
  - crop_id?
  - recipe_id?
  - production_status?
