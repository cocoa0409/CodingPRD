  # ------------------------------------------------------------- rule 8 -----
  - rule_id: resource_temporal_overlap
    instances:
      - name: field_overlap_half_open_adjacency
        grounds:
          - calculations.schedule_overlap_rules
          - errors[ERR_FIELD_TIME_CONFLICT]
          - errors[ERR_APPLICATOR_TIME_CONFLICT]
        distinguishing_aspect: |
          Field resource, plain half-open semantics: a second work order on the
          SAME field starting exactly at the first job's end (11:00 == 11:00)
          is ALLOWED, while a one-minute overlap (13:59 < 14:00) is REJECTED
          with ERR_FIELD_TIME_CONFLICT.
        test_recipe:
          setup:
            - "Base fixture; WO1 SCHEDULED 2026-05-10 08:00-11:00Z on F1 with AP1/EQ1; second applicator AP2 and second calibrated sprayer EQ2 exist so only the field constraint is exercised; WO2/WO3 target the same field F1"
          setup_api_calls:
            - { call: "POST /api/customers", payload: { name: "Green Acres", billing_email: "g1@farm.test", rate_per_acre_cents: 1200, credit_limit_cents: 5000000 }, as: CoopAdmin, captures: { c_id: $.data.id } }
