  # =================================================================
  - rule_id: resource_temporal_overlap
    instances:
      - name: subscription_period_halfopen_overlap
        grounds:
          - validations[priority=10]
          - errors[ERR_SUBSCRIPTION_PERIOD_OVERLAP]
          - state_machines.Subscription.PENDING_PAYMENT_to_ACTIVE
          - entities.Subscription.fields.current_period_end
        distinguishing_aspect: |
          Activating a member's second subscription whose period [2026-06-01, 2027-06-01) overlaps the first's
          identical half-open window is rejected with ERR_SUBSCRIPTION_PERIOD_OVERLAP; half-open semantics on the
          Member's subscription timeline (adjacency start==end would be allowed).
