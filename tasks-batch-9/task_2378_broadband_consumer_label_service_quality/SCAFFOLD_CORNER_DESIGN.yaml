      - name: republishing_a_published_methodology_is_rejected
        claim_type: idempotency
        grounds:
          - validations.priority_40
          - errors.ERR_METHODOLOGY_ALREADY_PUBLISHED
          - state_machines.MethodologyDocument.terminal_states
        distinguishing_aspect: "PUBLISHED is the MethodologyDocument machine's terminal state, so the second publish is not a no-op success — it is a priority-40 rejection that leaves published_at and version untouched."
        test_recipe:
          setup:
            - "Logical clock at 2026-09-01T00:00:00Z; MTH-2026-A is PUBLISHED (version 2, published_at 2026-09-01T00:00:00.000Z)."
          setup_api_calls:
