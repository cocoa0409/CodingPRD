        distinguishing_aspect: "POST /post-orders with an unknown post_id returns 404 ERR_POST_NOT_FOUND — existence (priority 4) is checked before the OCC version check (priority 6), so an arbitrary expected_post_version does not change the error."
        test_recipe:
          setup: ["Empty database (no posts)."]
          setup_api_calls:
            - call: "POST /clients"
              payload: { name: "Ghost Co", margin_floor_pct: 20.0 }
              as: AccountManager
              captures: { client_id: $.data.id }
