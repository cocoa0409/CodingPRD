        excluded_because:
          difficulty_instance: deed_recording_cascades_four_levels_into_project_open_space_acreage
          rationale: |
            That instance asserts next_monitoring_due_date == 2029-08-01 from a 2026-08-01 recording
            anchor as part of the four-level cascade; the cure re-anchoring and the 90-day corrective
            deadline are asserted by the state-machines instance
            deed_restriction_compliance_cycle_ends_in_a_terminated_state_that_locks_out_actions.

      - name: the_two_benefit_cost_ratio_variants_diverge_on_the_same_inputs
        claim_type: variant_divergence
        grounds:
          - calculations.benefit_cost_ratio
          - complexity_profile.complexity_layers
        excluded_because:
          difficulty_instance: bcr_discounted_npv_vs_undiscounted_life_cycle_divergence
          rationale: |
            The divergence claim is that instance's subject: the same annualized loss, useful life and
            mitigation cost produce bcr 1.103 under FEMA_BCA_TOOLKIT and 2.667 under
            PRE_CALCULATED_BENEFIT, with the 70363836-cent NPV delta asserted explicitly.

      - name: the_replacement_housing_variant_is_selected_by_the_declared_method
        claim_type: variant_selection
        grounds:
          - calculations.replacement_housing_payment
          - entities.RelocationCase.fields.rhp_method
        excluded_because:
          difficulty_instance: replacement_housing_comparable_dwelling_vs_actual_replacement_divergence
          rationale: |
            That instance runs both rhp_method values against the same acquisition price and asserts
            the selected variant's literal payment plus the 2000000-cent delta, covering selection and
            divergence together.

      - name: per_record_rounding_precedes_summation_in_the_deduction_sweep
        claim_type: precision
        grounds:
          - calculations.dob_deduction_total
        excluded_because:
          difficulty_instance: dob_deduction_rounds_per_record_before_summation
          rationale: |
            That instance pins the 1500002 versus 1500001 difference between rounding each record and
            rounding the sum, which is the precision claim in its sharpest form.

      - name: the_federal_obligation_aggregate_filters_its_input_set_by_state
        claim_type: input_set_filtering
        grounds:
