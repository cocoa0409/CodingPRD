        grounds: ["concurrency_rules[assessment-create-stale-casualty]", "errors[ERR_STALE_CASUALTY_VERSION]"]
        distinguishing_aspect: "A second assessment creation carrying the casualty version observed before the first creation (1, now 2) is rejected 412 ERR_STALE_CASUALTY_VERSION and supersedes nothing."
