              captures: { su1_id: $.data.id }
            - call: "POST /poct/reagent-lots"
              payload: { site_id: "${site_id}", storage_unit_id: "${su1_id}", device_model: "GlucoMeter-X", lot_number: "LOT-I1", expiration_date: "2027-06-30", received_at: "2026-08-01T00:00:00Z", control_min_level_1: 80.0, control_max_level_1: 120.0, control_min_level_2: 250.0, control_max_level_2: 350.0 }
              as: QualityCoordinator
