              as: OpsAdmin
              captures: { route_id: $.data.id }
            - call: "POST /aircraft"
              payload: { tail_number: "N1", seat_capacity: 4, empty_weight_lb: 1500, empty_moment_lb_in: 82500, max_takeoff_weight_lb: 2600, fuel_arm_inches: 60, seat_arms_inches: [40, 40, 80, 80], cg_forward_limit_in: 52, cg_aft_limit_in: 54.25, noise_class: "QUIET" }
              as: OpsAdmin
