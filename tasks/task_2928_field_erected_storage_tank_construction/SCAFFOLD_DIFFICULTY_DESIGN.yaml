              as_user_id: "ai-1"
              captures: { w2_id: $.data.id }
            - call: "POST /weld-seams"
              payload: { shell_course_id: "${course_id}", seam_type: "VERTICAL", seam_label: "V1", length_in: 96, sequence_index: 1 }
              as: ErectionSuperintendent
              captures: { s1: $.data.id }
            - call: "POST /welders/${w1_id}/qualification-actions"
              payload: { action: "REVOKE", remarks: "failed bend test re-audit" }
              as: AuthorizedInspector
              as_user_id: "ai-1"
          trigger:
            - call: "POST /weld-seams/${s1}/weld-log"
              payload: { welder_id: "${w1_id}", filler_lot: "E7018-A" }
