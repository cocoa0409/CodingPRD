# =============================================================================
# Task 1987 — Tenant Screening Service
# §1.9 Scaffold Corner Design (Coverage Index for Non-Difficulty Tests)
# Enumerative coverage of every other testable claim from SCAFFOLD.yaml §1.1–§1.7
# beyond the nine Difficulty Rules covered in SCAFFOLD_DIFFICULTY_DESIGN.yaml.
# =============================================================================

scaffold_corner_design:
  # ===========================================================================
  - section: entities
    instances:
      - name: landlord_creation_applies_system_defaults
        claim_type: defaults
        grounds: ["entities.Landlord.fields.status", "entities.Landlord.fields.fee_balance_cents"]
        distinguishing_aspect: "A newly created landlord gets system defaults status == ACTIVE, fee_balance_cents == 0, version == 1, and server-minted id/created_at/updated_at."
        test_recipe:
          setup: ["Empty database; logical clock at the startup default 2026-08-01T00:00:00Z"]
          setup_api_calls:
            - { call: "POST /api/_clock/set_current_utc", payload: { to_iso8601: "2026-08-01T00:00:00Z" }, as: ComplianceAdmin }
          trigger:
            - call: "POST /api/landlords"
              payload: { name: "L Defaults", contact_email: "ldef@x.com" }
              as: ComplianceAdmin
              captures: { ll: "$.data.id", st: "$.data.status", bal: "$.data.fee_balance_cents", v: "$.data.version" }
          assert:
            - "captured ${st} == ACTIVE and ${bal} == 0 and ${v} == 1"
            - "response data contains server-minted id (UUID), created_at == 2026-08-01T00:00:00Z, and updated_at"

      - name: criteria_create_missing_required_field_returns_invalid_request
        claim_type: required_fields
        grounds: ["entities.ScreeningCriteria.fields.min_credit_score", "errors[ERR_INVALID_REQUEST]"]
        distinguishing_aspect: "Omitting required input min_credit_score on criteria creation is rejected with ERR_INVALID_REQUEST (400) before any state or business logic runs."
        test_recipe:
          setup: ["Landlord exists"]
          setup_api_calls:
            - call: "POST /api/landlords"
              payload: { name: "L Req", contact_email: "lreq@x.com" }
              as: ComplianceAdmin
              captures: { ll: "$.data.id" }
          trigger:
            - call: "POST /api/criteria"
              payload: { name: "CR-X", disclosure_summary: "missing min score", income_multiplier: 3.0, guarantor_policy: "COMBINED_ALLOWED", guarantor_income_multiplier: 4.0, accepts_portable_reports: true, accepts_voucher_income: true, effective_from: "2026-01-01T00:00:00Z", effective_to: "2026-12-31T00:00:00Z" }
              as: Landlord
              as_user_id: "${ll}"
              captures: { err: "$.data.error_id" }
          assert:
            - "captured ${err} == ERR_INVALID_REQUEST (http 400)"

      - name: get_nonexistent_application_returns_not_found
        claim_type: not_found
        grounds: ["errors[ERR_NOT_FOUND]", "validations[priority=3]"]
        distinguishing_aspect: "GET with a well-formed but nonexistent UUID yields ERR_NOT_FOUND (404)."
        test_recipe:
          setup: ["Empty database"]
          setup_api_calls:
            - { call: "POST /api/_clock/set_current_utc", payload: { to_iso8601: "2026-08-01T00:00:00Z" }, as: ComplianceAdmin }
          trigger:
            - call: "GET /api/applications/00000000-0000-4000-8000-000000000000"
              payload: {}
              as: ComplianceAdmin
              captures: { err: "$.data.error_id" }
          assert:
            - "captured ${err} == ERR_NOT_FOUND (http 404)"

      - name: consent_stamps_logical_clock_time
        claim_type: system_fields
        grounds: ["entities.ScreeningApplication.fields.consent_signed_at", "state_machines.ScreeningApplication.identity_status"]
        distinguishing_aspect: "consent_signed_at is system-stamped from the logical clock (2026-08-05T10:30:00Z), not caller-supplied, and consent does not touch the parallel identity_status dimension (stays UNVERIFIED)."
        test_recipe:
          setup: ["Logical clock at 2026-08-05T10:30:00Z; landlord + applicant + DRAFT application (no criteria needed for consent)"]
          setup_api_calls:
            - { call: "POST /api/_clock/set_current_utc", payload: { to_iso8601: "2026-08-05T10:30:00Z" }, as: ComplianceAdmin }
            - call: "POST /api/landlords"
              payload: { name: "L Consent", contact_email: "lcon@x.com" }
              as: ComplianceAdmin
              captures: { ll: "$.data.id" }
            - call: "POST /api/applicants"
              payload: { full_name: "Ann Con", dob: "1990-01-01T00:00:00Z", email: "acon@x.com", ssn_last4: "1111", residence_state: "TX" }
              as: Screener
              captures: { ap: "$.data.id" }
            - call: "POST /api/applications"
              payload: { applicant_id: "${ap}", unit_state_code: "TX", monthly_rent_cents: 200000, stated_monthly_income_cents: 600000 }
              as: Landlord
              as_user_id: "${ll}"
              captures: { app: "$.data.id" }
          trigger:
            - call: "POST /api/applications/${app}/consent"
              payload: {}
              as: Applicant
              as_user_id: "${ap}"
              captures: { ts: "$.data.consent_signed_at", idst: "$.data.identity_status" }
          assert:
            - "captured ${ts} == 2026-08-05T10:30:00Z (logical clock stamp)"
            - "captured ${idst} == UNVERIFIED (identity dimension untouched by consent)"

      - name: applications_list_paginates_with_envelope_fields
        claim_type: listing
        grounds: ["response_envelope", "endpoints.GET /api/applications"]
        distinguishing_aspect: "List endpoint honors limit/offset with total_count and has_more: page 1 (limit 2) returns 2 items with has_more true, page 2 (offset 2) returns 1 item with has_more false; every response carries the meta envelope."
        test_recipe:
          setup: ["Landlord with three DRAFT applications (three applicants)"]
          setup_api_calls:
            - call: "POST /api/landlords"
              payload: { name: "L Page", contact_email: "lpage@x.com" }
              as: ComplianceAdmin
              captures: { ll: "$.data.id" }
            - call: "POST /api/applicants"
              payload: { full_name: "P One", dob: "1990-01-01T00:00:00Z", email: "p1@x.com", ssn_last4: "0001", residence_state: "TX" }
              as: Screener
              captures: { ap1: "$.data.id" }
            - call: "POST /api/applicants"
              payload: { full_name: "P Two", dob: "1990-01-02T00:00:00Z", email: "p2@x.com", ssn_last4: "0002", residence_state: "TX" }
              as: Screener
              captures: { ap2: "$.data.id" }
            - call: "POST /api/applicants"
              payload: { full_name: "P Three", dob: "1990-01-03T00:00:00Z", email: "p3@x.com", ssn_last4: "0003", residence_state: "TX" }
              as: Screener
              captures: { ap3: "$.data.id" }
            - { call: "POST /api/applications", payload: { applicant_id: "${ap1}", unit_state_code: "TX", monthly_rent_cents: 200000, stated_monthly_income_cents: 600000 }, as: Landlord, as_user_id: "${ll}" }
            - { call: "POST /api/applications", payload: { applicant_id: "${ap2}", unit_state_code: "TX", monthly_rent_cents: 210000, stated_monthly_income_cents: 630000 }, as: Landlord, as_user_id: "${ll}" }
            - { call: "POST /api/applications", payload: { applicant_id: "${ap3}", unit_state_code: "TX", monthly_rent_cents: 220000, stated_monthly_income_cents: 660000 }, as: Landlord, as_user_id: "${ll}" }
          trigger:
            - { call: "GET /api/applications?landlord_id=${ll}&limit=2&offset=0", payload: {}, as: ComplianceAdmin }
            - { call: "GET /api/applications?landlord_id=${ll}&limit=2&offset=2", payload: {}, as: ComplianceAdmin }
          assert:
            - "page 1: response_type == array, data length == 2, total_count == 3, has_more == true, meta.api_request_id present"
            - "page 2: data length == 1, total_count == 3, has_more == false"

      - name: audit_run_has_no_version_or_updated_at
        claim_type: immutability
        grounds: ["entities.ConsistencyAuditRun", "calculations.consistency_audit"]
        distinguishing_aspect: "ConsistencyAuditRun is declared common_fields: false — its response exposes id and created_at but no version/updated_at keys — and the empty-scope aggregation edge yields examined == 0 with deviation_rate == 0 (no division by zero)."
        test_recipe:
          setup: ["Landlord with no decided applications"]
          setup_api_calls:
            - call: "POST /api/landlords"
              payload: { name: "L Audit0", contact_email: "la0@x.com" }
              as: ComplianceAdmin
              captures: { ll: "$.data.id" }
          trigger:
            - call: "POST /api/landlords/${ll}/consistency-audits"
              payload: {}
              as: ComplianceAdmin
              captures: { examined: "$.data.applications_examined", rate: "$.data.deviation_rate" }
          assert:
            - "captured ${examined} == 0 and inconsistencies_found == 0 and ${rate} == 0"
            - "response data contains id and created_at but NO version key and NO updated_at key"

  # ===========================================================================
  - section: state_machines
    instances:
      - name: submit_twice_returns_invalid_application_state
        claim_type: invalid_transition
        grounds: ["state_machines.ScreeningApplication.status.DRAFT_to_SUBMITTED", "errors[ERR_INVALID_APPLICATION_STATE]"]
        distinguishing_aspect: "SUBMITTED is not a valid from-state for submit; the second submit is rejected with ERR_INVALID_APPLICATION_STATE and the application stays SUBMITTED."
        test_recipe:
          setup: ["Landlord with published criteria covering 2026-08-01; one application already SUBMITTED"]
          setup_api_calls:
            - { call: "POST /api/_clock/set_current_utc", payload: { to_iso8601: "2026-08-01T00:00:00Z" }, as: ComplianceAdmin }
            - call: "POST /api/landlords"
              payload: { name: "L Sub", contact_email: "lsub@x.com" }
              as: ComplianceAdmin
              captures: { ll: "$.data.id", ll_v: "$.data.version" }
            - call: "POST /api/criteria"
              payload: { name: "CR1", disclosure_summary: "Standard criteria", min_credit_score: 650, income_multiplier: 3.0, guarantor_policy: "COMBINED_ALLOWED", guarantor_income_multiplier: 4.0, accepts_portable_reports: true, accepts_voucher_income: true, effective_from: "2026-01-01T00:00:00Z", effective_to: "2026-12-31T00:00:00Z" }
              as: Landlord
              as_user_id: "${ll}"
              captures: { cr: "$.data.id" }
            - { call: "POST /api/criteria/${cr}/publish", payload: { expected_landlord_version: "${ll_v}" }, as: Landlord, as_user_id: "${ll}" }
            - call: "POST /api/applicants"
              payload: { full_name: "Ann Sub", dob: "1990-01-01T00:00:00Z", email: "asub@x.com", ssn_last4: "1111", residence_state: "TX" }
              as: Screener
              captures: { ap: "$.data.id" }
            - call: "POST /api/applications"
              payload: { applicant_id: "${ap}", unit_state_code: "TX", monthly_rent_cents: 200000, stated_monthly_income_cents: 600000 }
              as: Landlord
              as_user_id: "${ll}"
              captures: { app: "$.data.id" }
            - { call: "POST /api/applications/${app}/submit", payload: {}, as: Landlord, as_user_id: "${ll}" }
          trigger:
            - call: "POST /api/applications/${app}/submit"
              payload: {}
              as: Landlord
              as_user_id: "${ll}"
              captures: { err: "$.data.error_id" }
          assert:
            - "captured ${err} == ERR_INVALID_APPLICATION_STATE (http 409)"
            - "ScreeningApplication.${app}.status remains SUBMITTED"

      - name: decide_after_withdraw_returns_application_terminal
        claim_type: terminal_state_lockdown
        grounds: ["state_machines.ScreeningApplication.status.SCREENING_to_WITHDRAWN", "errors[ERR_APPLICATION_TERMINAL]"]
        distinguishing_aspect: "A WITHDRAWN (terminal) application rejects decide with ERR_APPLICATION_TERMINAL — terminal states accept no further transitions."
        test_recipe:
          setup: ["Landlord with published criteria; application advanced to SCREENING (searches done) then withdrawn"]
          setup_api_calls:
            - { call: "POST /api/_clock/set_current_utc", payload: { to_iso8601: "2026-08-01T00:00:00Z" }, as: ComplianceAdmin }
            - call: "POST /api/landlords"
              payload: { name: "L Term", contact_email: "lterm@x.com" }
              as: ComplianceAdmin
              captures: { ll: "$.data.id", ll_v: "$.data.version" }
            - call: "POST /api/criteria"
              payload: { name: "CR1", disclosure_summary: "Standard criteria", min_credit_score: 650, income_multiplier: 3.0, guarantor_policy: "COMBINED_ALLOWED", guarantor_income_multiplier: 4.0, accepts_portable_reports: true, accepts_voucher_income: true, effective_from: "2026-01-01T00:00:00Z", effective_to: "2026-12-31T00:00:00Z" }
              as: Landlord
              as_user_id: "${ll}"
              captures: { cr: "$.data.id" }
            - { call: "POST /api/criteria/${cr}/publish", payload: { expected_landlord_version: "${ll_v}" }, as: Landlord, as_user_id: "${ll}" }
            - call: "POST /api/applicants"
              payload: { full_name: "Ann Term", dob: "1990-01-01T00:00:00Z", email: "aterm@x.com", ssn_last4: "1111", residence_state: "TX" }
              as: Screener
              captures: { ap: "$.data.id" }
            - call: "POST /api/applications"
              payload: { applicant_id: "${ap}", unit_state_code: "TX", monthly_rent_cents: 200000, stated_monthly_income_cents: 600000 }
              as: Landlord
              as_user_id: "${ll}"
              captures: { app: "$.data.id" }
            - { call: "POST /api/applications/${app}/consent", payload: {}, as: Applicant, as_user_id: "${ap}" }
            - { call: "POST /api/applications/${app}/verify-identity", payload: { method: "KNOWLEDGE_BASED", evidence_score: 85 }, as: Screener }
            - { call: "POST /api/applications/${app}/submit", payload: {}, as: Landlord, as_user_id: "${ll}" }
            - { call: "POST /api/applications/${app}/record-searches", payload: { credit_score: 700, records: [] }, as: Screener }
            - { call: "POST /api/applications/${app}/withdraw", payload: {}, as: Landlord, as_user_id: "${ll}" }
          trigger:
            - call: "POST /api/applications/${app}/decide"
              payload: { decision: "APPROVE" }
              as: Landlord
              as_user_id: "${ll}"
              captures: { err: "$.data.error_id" }
          assert:
            - "captured ${err} == ERR_APPLICATION_TERMINAL (http 409)"
            - "ScreeningApplication.${app}.status remains WITHDRAWN and decision remains null"

      - name: deliver_twice_returns_invalid_report_state
        claim_type: invalid_transition
        grounds: ["state_machines.ScreeningReport.DRAFT_to_DELIVERED", "errors[ERR_INVALID_REPORT_STATE]"]
        distinguishing_aspect: "DELIVERED is not a valid from-state for deliver (only DRAFT or AMENDED); the second deliver is rejected with ERR_INVALID_REPORT_STATE."
        test_recipe:
          setup: ["Full flow: CA application scored and its report DELIVERED"]
          setup_api_calls:
            - { call: "POST /api/_clock/set_current_utc", payload: { to_iso8601: "2026-08-01T00:00:00Z" }, as: ComplianceAdmin }
            - call: "POST /api/landlords"
              payload: { name: "L Del", contact_email: "ldel@x.com" }
              as: ComplianceAdmin
              captures: { ll: "$.data.id", ll_v: "$.data.version" }
            - call: "POST /api/criteria"
              payload: { name: "CR1", disclosure_summary: "Standard criteria", min_credit_score: 650, income_multiplier: 3.0, guarantor_policy: "COMBINED_ALLOWED", guarantor_income_multiplier: 4.0, accepts_portable_reports: true, accepts_voucher_income: true, effective_from: "2026-01-01T00:00:00Z", effective_to: "2026-12-31T00:00:00Z" }
              as: Landlord
              as_user_id: "${ll}"
              captures: { cr: "$.data.id" }
            - { call: "POST /api/criteria/${cr}/publish", payload: { expected_landlord_version: "${ll_v}" }, as: Landlord, as_user_id: "${ll}" }
            - call: "POST /api/applicants"
              payload: { full_name: "Ann Del", dob: "1990-01-01T00:00:00Z", email: "adel@x.com", ssn_last4: "1111", residence_state: "TX" }
              as: Screener
              captures: { ap: "$.data.id" }
            - call: "POST /api/applications"
              payload: { applicant_id: "${ap}", unit_state_code: "TX", monthly_rent_cents: 200000, stated_monthly_income_cents: 600000 }
              as: Landlord
              as_user_id: "${ll}"
              captures: { app: "$.data.id" }
            - { call: "POST /api/applications/${app}/consent", payload: {}, as: Applicant, as_user_id: "${ap}" }
            - { call: "POST /api/applications/${app}/verify-identity", payload: { method: "KNOWLEDGE_BASED", evidence_score: 85 }, as: Screener }
            - { call: "POST /api/applications/${app}/submit", payload: {}, as: Landlord, as_user_id: "${ll}" }
            - call: "POST /api/applications/${app}/record-searches"
              payload: { credit_score: 700, records: [] }
              as: Screener
              captures: { rp: "$.data.id" }
            - call: "POST /api/applications/${app}/income-verifications"
              payload: { employer_name: "Acme" }
              as: Screener
              captures: { iv: "$.data.id" }
            - { call: "POST /api/income-verifications/${iv}/resolve", payload: { outcome: "VERIFIED", verified_monthly_income_cents: 600000 }, as: Screener }
            - { call: "POST /api/applications/${app}/score", payload: {}, as: Screener }
            - { call: "POST /api/reports/${rp}/deliver", payload: {}, as: Screener }
          trigger:
            - call: "POST /api/reports/${rp}/deliver"
              payload: {}
              as: Screener
              captures: { err: "$.data.error_id" }
          assert:
            - "captured ${err} == ERR_INVALID_REPORT_STATE (http 409)"
            - "ScreeningReport.${rp}.status remains DELIVERED"

      - name: deny_decision_creates_notice_draft_with_derived_reasons
        claim_type: initial_state
        grounds: ["state_machines.ScreeningApplication.status.SCORED_to_DENIED", "state_machines.AdverseActionNotice", "entities.AdverseActionNotice.fields.reason_codes"]
        distinguishing_aspect: "decide(DENY) auto-creates the adverse-action notice in initial state DRAFT with reason codes derived from the scoring factors in pinned order — here exactly [CREDIT_SCORE_BELOW_MINIMUM] because credit 600 < 650 is the only failing factor."
        test_recipe:
          setup: ["Landlord with published criteria (min credit 650); application with credit 600, verified income 600000 (affordability passes), no records; scored RECOMMEND_DENY and report DELIVERED"]
          setup_api_calls:
            - { call: "POST /api/_clock/set_current_utc", payload: { to_iso8601: "2026-08-01T00:00:00Z" }, as: ComplianceAdmin }
            - call: "POST /api/landlords"
              payload: { name: "L Deny", contact_email: "ldeny@x.com" }
              as: ComplianceAdmin
              captures: { ll: "$.data.id", ll_v: "$.data.version" }
            - call: "POST /api/criteria"
              payload: { name: "CR1", disclosure_summary: "Standard criteria", min_credit_score: 650, income_multiplier: 3.0, guarantor_policy: "COMBINED_ALLOWED", guarantor_income_multiplier: 4.0, accepts_portable_reports: true, accepts_voucher_income: true, effective_from: "2026-01-01T00:00:00Z", effective_to: "2026-12-31T00:00:00Z" }
              as: Landlord
              as_user_id: "${ll}"
              captures: { cr: "$.data.id" }
            - { call: "POST /api/criteria/${cr}/publish", payload: { expected_landlord_version: "${ll_v}" }, as: Landlord, as_user_id: "${ll}" }
            - call: "POST /api/applicants"
              payload: { full_name: "Ann Deny", dob: "1990-01-01T00:00:00Z", email: "adeny@x.com", ssn_last4: "1111", residence_state: "TX" }
              as: Screener
              captures: { ap: "$.data.id" }
            - call: "POST /api/applications"
              payload: { applicant_id: "${ap}", unit_state_code: "TX", monthly_rent_cents: 200000, stated_monthly_income_cents: 600000 }
              as: Landlord
              as_user_id: "${ll}"
              captures: { app: "$.data.id" }
            - { call: "POST /api/applications/${app}/consent", payload: {}, as: Applicant, as_user_id: "${ap}" }
            - { call: "POST /api/applications/${app}/verify-identity", payload: { method: "KNOWLEDGE_BASED", evidence_score: 85 }, as: Screener }
            - { call: "POST /api/applications/${app}/submit", payload: {}, as: Landlord, as_user_id: "${ll}" }
            - call: "POST /api/applications/${app}/record-searches"
              payload: { credit_score: 600, records: [] }
              as: Screener
              captures: { rp: "$.data.id" }
            - call: "POST /api/applications/${app}/income-verifications"
              payload: { employer_name: "Acme" }
              as: Screener
              captures: { iv: "$.data.id" }
            - { call: "POST /api/income-verifications/${iv}/resolve", payload: { outcome: "VERIFIED", verified_monthly_income_cents: 600000 }, as: Screener }
            - { call: "POST /api/applications/${app}/score", payload: {}, as: Screener }
            - { call: "POST /api/reports/${rp}/deliver", payload: {}, as: Screener }
          trigger:
            - { call: "POST /api/applications/${app}/decide", payload: { decision: "DENY" }, as: Landlord, as_user_id: "${ll}" }
            - call: "GET /api/adverse-action-notices?application_id=${app}"
              payload: {}
              as: Screener
              captures: { nt_status: "$.data[0].status", nt_reasons: "$.data[0].reason_codes" }
          assert:
            - "ScreeningApplication.${app}.status == DENIED"
            - "captured ${nt_status} == DRAFT (initial state of the auto-created notice)"
            - "captured ${nt_reasons} == [CREDIT_SCORE_BELOW_MINIMUM] (single grounded reason, pinned derivation order)"

      - name: verify_identity_after_verified_returns_invalid_application_state
        claim_type: terminal_state_lockdown
        grounds: ["state_machines.ScreeningApplication.identity_status.UNVERIFIED_to_VERIFIED", "errors[ERR_INVALID_APPLICATION_STATE]"]
        distinguishing_aspect: "VERIFIED is terminal for the identity dimension: any further verify-identity call is rejected with ERR_INVALID_APPLICATION_STATE and identity_attempts does not increment."
        test_recipe:
          setup: ["Landlord + applicant + DRAFT application with identity already VERIFIED (one attempt)"]
          setup_api_calls:
            - call: "POST /api/landlords"
              payload: { name: "L Idv", contact_email: "lidv@x.com" }
              as: ComplianceAdmin
              captures: { ll: "$.data.id" }
            - call: "POST /api/applicants"
              payload: { full_name: "Ann Idv", dob: "1990-01-01T00:00:00Z", email: "aidv@x.com", ssn_last4: "1111", residence_state: "TX" }
              as: Screener
              captures: { ap: "$.data.id" }
            - call: "POST /api/applications"
              payload: { applicant_id: "${ap}", unit_state_code: "TX", monthly_rent_cents: 200000, stated_monthly_income_cents: 600000 }
              as: Landlord
              as_user_id: "${ll}"
              captures: { app: "$.data.id" }
            - { call: "POST /api/applications/${app}/verify-identity", payload: { method: "KNOWLEDGE_BASED", evidence_score: 85 }, as: Screener }
          trigger:
            - call: "POST /api/applications/${app}/verify-identity"
              payload: { method: "DOCUMENT_REVIEW", evidence_score: 90 }
              as: Screener
              captures: { err: "$.data.error_id" }
          assert:
            - "captured ${err} == ERR_INVALID_APPLICATION_STATE (http 409)"
            - "ScreeningApplication.${app}.identity_status remains VERIFIED and identity_attempts remains 1"

      - name: failed_income_verification_retry_returns_to_pending
        claim_type: valid_transition
        grounds: ["state_machines.IncomeVerification.PENDING_to_FAILED", "state_machines.IncomeVerification.FAILED_to_PENDING", "state_machines.IncomeVerification.PENDING_to_VERIFIED"]
        distinguishing_aspect: "The income verification machine has a retry loop: PENDING -> FAILED -> PENDING -> VERIFIED, with failure data cleared on retry and the verified amount recorded on the second resolution."
        test_recipe:
          setup: ["Landlord + applicant + SUBMITTED application with one IncomeVerification already resolved FAILED"]
          setup_api_calls:
            - { call: "POST /api/_clock/set_current_utc", payload: { to_iso8601: "2026-08-01T00:00:00Z" }, as: ComplianceAdmin }
