              payload: { sku: "A15", display_name: "Bouquet15", base_price_cents: 5000 }
              as: CatalogAdmin
              captures: { arr_id: $.data.id }
            - call: "POST /floral/customers"
              payload: { email: "fc@x.com", full_name: "FlorCap C" }
              as: CatalogAdmin
              captures: { cust_id: $.data.id }
            - call: "POST /floral/florists"
              payload: { shop_name: "Shop15", covered_zone_id: "${zone_id}", daily_capacity: 1 }
              as: Dispatcher
              captures: { flor_id: $.data.id }
            - call: "POST /floral/orders"
              payload: { customer_id: "${cust_id}", arrangement_id: "${arr_id}", zone_id: "${zone_id}", delivery_date: "2026-09-10", window_start_minute: 540, window_end_minute: 600 }
              as: Customer
              as_user_id: "${cust_id}"
              captures: { first_oid: $.data.id }
            - call: "POST /floral/orders/${first_oid}/quote"
              payload: {}
              as: Customer
              as_user_id: "${cust_id}"
            - call: "POST /floral/_payments/mark_authorized"
              payload: { order_id: "${first_oid}" }
              as: Dispatcher
              captures: { first_v: $.data.version }
            - call: "POST /floral/orders/${first_oid}/book"
              payload: { expected_order_version: "${first_v}" }
              as: Customer
              as_user_id: "${cust_id}"
            - call: "POST /floral/orders"
              payload: { customer_id: "${cust_id}", arrangement_id: "${arr_id}", zone_id: "${zone_id}", delivery_date: "2026-09-10", window_start_minute: 800, window_end_minute: 900 }
              as: Customer
              as_user_id: "${cust_id}"
              captures: { ord_id: $.data.id }
            - call: "POST /floral/orders/${ord_id}/quote"
              payload: {}
              as: Customer
              as_user_id: "${cust_id}"
            - call: "POST /floral/_payments/mark_authorized"
              payload: { order_id: "${ord_id}" }
              as: Dispatcher
              captures: { ord_v: $.data.version }
          trigger:
            - call: "POST /floral/orders/${ord_id}/book"
              payload: { expected_order_version: "${ord_v}" }
              as: Customer
              as_user_id: "${cust_id}"
              captures: { err: $.data.error_id }
          assert:
            - "response error_id == ERR_NO_FLORIST_AVAILABLE"
            - "Order.${ord_id}.fulfillment_status == QUOTED"

  # =========================================================================
  # Rule 9 — compensating_invariant (>=2, different conserved quantities)
  # =========================================================================
  - rule_id: compensating_invariant
    instances:
      - name: cancel_quoted_conserves_wallet_credit
        grounds:
          - state_machines.Order.QUOTED_to_CANCELLED
          - entities.Customer.fields.wallet_credit_cents
          - calculations.compute_quote_estimate
        distinguishing_aspect: |
          CONSERVED QUANTITY 1 — Customer.wallet_credit_cents: quoting with apply_wallet_credit
          debits the wallet; cancelling from QUOTED refunds the exact debited amount, so the
          named invariant wallet_credit_cents == pre_quote_balance holds (1500 -> 0 -> 1500).
        test_recipe:
          setup:
            - "Customer with wallet_credit_cents=1500 (seeded via an earlier resolved REFUND claim of 1500)."
            - "Order quoted with apply_wallet_credit=true (debits up to 1500), then cancelled from QUOTED."
          setup_api_calls:
            - call: "POST /floral/_clock/set_current_utc"
              payload: { to_iso8601: "2026-10-01T08:00:00Z" }
              as: Dispatcher
            - call: "POST /floral/zones"
              payload: { zone_code: "Z16", base_delivery_fee_cents: 800, same_day_cutoff_hour_utc: 14, window_capacity_per_slot: 5 }
              as: CatalogAdmin
              captures: { zone_id: $.data.id }
            - call: "POST /floral/arrangements"
              payload: { sku: "A16", display_name: "Bouquet16", base_price_cents: 5000 }
              as: CatalogAdmin
              captures: { arr_id: $.data.id }
            - call: "POST /floral/customers"
              payload: { email: "wl@x.com", full_name: "Wallet C" }
              as: CatalogAdmin
              captures: { cust_id: $.data.id }
            - call: "POST /floral/_inject/credit_wallet"
              payload: { customer_id: "${cust_id}", amount_cents: 1500 }
              as: Dispatcher
            - call: "POST /floral/orders"
              payload: { customer_id: "${cust_id}", arrangement_id: "${arr_id}", zone_id: "${zone_id}", delivery_date: "2026-10-05", window_start_minute: 540, window_end_minute: 720, apply_wallet_credit: true }
              as: Customer
              as_user_id: "${cust_id}"
              captures: { ord_id: $.data.id }
            - call: "POST /floral/orders/${ord_id}/quote"
              payload: {}
              as: Customer
              as_user_id: "${cust_id}"
          trigger:
            - call: "POST /floral/orders/${ord_id}/cancel"
              payload: {}
              as: Customer
              as_user_id: "${cust_id}"
          assert:
            - "Order.${ord_id}.fulfillment_status == CANCELLED"
            - "Customer.${cust_id}.wallet_credit_cents == 1500"

      - name: cancel_booked_conserves_florist_daily_capacity
        grounds:
          - state_machines.Order.BOOKED_to_CANCELLED
          - state_machines.WireFulfillment.ACCEPTED_to_RELEASED
          - entities.Florist.fields.daily_capacity
        distinguishing_aspect: |
          CONSERVED QUANTITY 2 — Florist available daily headroom (daily_capacity minus non-released
          fulfillments for the date): booking consumes one unit, cancelling from BOOKED releases the
          WireFulfillment and restores headroom, so a fresh booking that previously failed now
          succeeds — a different conserved quantity than the wallet balance.
        test_recipe:
          setup:
            - "Florist daily_capacity=1; order A booked (headroom 0); A cancelled (headroom restored to 1)."
          setup_api_calls:
            - call: "POST /floral/_clock/set_current_utc"
              payload: { to_iso8601: "2026-10-08T08:00:00Z" }
              as: Dispatcher
            - call: "POST /floral/zones"
              payload: { zone_code: "Z17", base_delivery_fee_cents: 800, same_day_cutoff_hour_utc: 14, window_capacity_per_slot: 5 }
              as: CatalogAdmin
              captures: { zone_id: $.data.id }
            - call: "POST /floral/arrangements"
              payload: { sku: "A17", display_name: "Bouquet17", base_price_cents: 5000 }
              as: CatalogAdmin
              captures: { arr_id: $.data.id }
            - call: "POST /floral/customers"
              payload: { email: "fcap@x.com", full_name: "FCap C" }
              as: CatalogAdmin
              captures: { cust_id: $.data.id }
            - call: "POST /floral/florists"
              payload: { shop_name: "Shop17", covered_zone_id: "${zone_id}", daily_capacity: 1 }
              as: Dispatcher
              captures: { flor_id: $.data.id }
            - call: "POST /floral/orders"
              payload: { customer_id: "${cust_id}", arrangement_id: "${arr_id}", zone_id: "${zone_id}", delivery_date: "2026-10-12", window_start_minute: 540, window_end_minute: 720 }
              as: Customer
              as_user_id: "${cust_id}"
              captures: { a_oid: $.data.id }
            - call: "POST /floral/orders/${a_oid}/quote"
              payload: {}
              as: Customer
              as_user_id: "${cust_id}"
            - call: "POST /floral/_payments/mark_authorized"
              payload: { order_id: "${a_oid}" }
              as: Dispatcher
              captures: { a_v: $.data.version }
            - call: "POST /floral/orders/${a_oid}/book"
              payload: { expected_order_version: "${a_v}" }
              as: Customer
              as_user_id: "${cust_id}"
            - call: "GET /floral/orders/${a_oid}/wire-fulfillments"
              payload: {}
              as: Dispatcher
              captures: { wf_real_id: "$.data[0].id" }
            - call: "POST /floral/wire-fulfillments/${wf_real_id}/accept"
              payload: {}
              as: Dispatcher
            - call: "POST /floral/orders/${a_oid}/cancel"
              payload: {}
              as: Customer
              as_user_id: "${cust_id}"
            - call: "POST /floral/orders"
              payload: { customer_id: "${cust_id}", arrangement_id: "${arr_id}", zone_id: "${zone_id}", delivery_date: "2026-10-12", window_start_minute: 800, window_end_minute: 900 }
              as: Customer
              as_user_id: "${cust_id}"
              captures: { b_oid: $.data.id }
            - call: "POST /floral/orders/${b_oid}/quote"
              payload: {}
              as: Customer
              as_user_id: "${cust_id}"
            - call: "POST /floral/_payments/mark_authorized"
              payload: { order_id: "${b_oid}" }
              as: Dispatcher
              captures: { b_v: $.data.version }
          trigger:
            - call: "POST /floral/orders/${b_oid}/book"
              payload: { expected_order_version: "${b_v}" }
              as: Customer
              as_user_id: "${cust_id}"
              captures: { b_fs: $.data.fulfillment_status }
          assert:
            - "Order.${b_oid}.fulfillment_status == BOOKED"
            - "Florist.${flor_id} non-released fulfillments for 2026-10-12 == 1 (only order B)"
