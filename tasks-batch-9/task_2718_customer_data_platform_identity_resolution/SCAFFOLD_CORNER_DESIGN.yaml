                expected_profile_version: "${subject_v}"
              as: PrivacyOfficer
              as_user_id: "u_privacy"
          trigger:
            - call: "POST /cdp/activations/${act_id}/resume"
              payload: {}
              as: SegmentAnalyst
              as_user_id: "u_analyst"
          assert:
            - "before the trigger Activation.${act_id}.status == PAUSED with paused_reason CONSENT_WITHDRAWN and Destination.${dest_id}.remaining_daily_hash_quota == 300"
            - "the trigger returns status 422"
            - "the response body error_id == ERR_EMPTY_AUDIENCE"
            - "Activation.${act_id}.status is still PAUSED with paused_reason still CONSENT_WITHDRAWN"
            - "Destination.${dest_id}.remaining_daily_hash_quota is still 300 — a refused resume re-consumes nothing"
            - "Segment.${seg_id}.active_activation_count == 0"

  # ===========================================================================
  # SECTION 6 — ERRORS (every one of the 51 catalog entries is triggerable;
  # the eight entries already exercised by §1.8 depth instances are stubbed)
  # ===========================================================================
  - section: errors
    instances:
      - name: request_missing_x_user_role_header_returns_401_unauthenticated
        claim_type: error_triggerable
        grounds:
          - errors[ERR_MISSING_AUTH_HEADERS]
          - validations[priority=1]
          - endpoints[GET /cdp/source-systems]
        distinguishing_aspect: "The header gate is the first rung of the ladder: with X-User-Role omitted the request fails 401 before any role check, any body parse or any existence check can run, even on an endpoint every role may call."
        test_recipe:
          setup:
            - "Logical clock at 2026-08-01T00:00:00Z."
            - "The list endpoint is open to all seven roles, so only the missing header can explain the refusal."
            - "The trigger request is sent with NO X-User-ID and NO X-User-Role header at all."
          setup_api_calls:
            - call: "POST /cdp/_clock/set_current_utc"
              payload: { current_utc: "2026-08-01T00:00:00Z" }
              as: DataPlatformAdmin
              as_user_id: "u_admin"
          trigger:
            - call: "GET /cdp/source-systems"
              payload: {}
              as: OMITTED
              as_user_id: OMITTED
          assert:
            - "the response status is 401"
            - "the response body error_id == ERR_MISSING_AUTH_HEADERS"
            - "the same request WITH X-User-Role DataEngineer and X-User-ID u_eng returns 200 with total_count 0 — the header, not the endpoint, caused the 401"

