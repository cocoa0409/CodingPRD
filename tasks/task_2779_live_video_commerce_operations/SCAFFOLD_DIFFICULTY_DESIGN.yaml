      - name: effective_unit_price_pinned_four_step_order
        grounds:
          - calculations.flash_offer_effective_unit_price
          - calculations.cart_bundle_tier
          - entities.CartItem.fields.effective_unit_price_cents
          - entities.Cart.fields.pre_discount_subtotal_cents
        distinguishing_aspect: |
          Mode (c) — the formula is self-referential unless its evaluation order is
          pinned, and the two orders give different money: with one line of 3 units at
          1700 the undiscounted subtotal 5100 crosses TIER1_FLOOR_CENTS so the line
          prices at 1615 per unit for line_gross_cents 4845, while re-deriving the tier
          from the DISCOUNTED subtotal 4845 (below 5000) would drop the discount and
          yield 5100. The pinned order is subtotal -> tier -> per-unit round_half_up ->
          multiply by qty, never tier-from-discounted-subtotal.
