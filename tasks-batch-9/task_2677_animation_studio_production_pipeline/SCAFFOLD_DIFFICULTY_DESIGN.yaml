              as: ProductionManager
              as_user_id: "u-pm-01"
            - call: "POST /studio/pre-production-gates/${gate_script_id}/review-decision"
              payload: { decision: "APPROVED" }
              as: Director
              as_user_id: "u-dir-01"
            - call: "POST /studio/shots"
              payload: { production_id: "${prod_id}", shot_code: "AD01_010_0010", sequence_code: "010", frame_count: 120, budget_cents: 1000000, planned_start_at: "2026-08-01T00:00:00Z", planned_finish_at: "2026-09-30T00:00:00Z" }
              as: ProductionManager
              captures: { shot_id: "$.data.id" }
            - call: "GET /studio/stage-tasks?shot_id=${shot_id}"
              as: ProductionManager
              captures: { t_layout_id: "$.data[0].id" }
            - call: "POST /studio/stage-tasks/${t_layout_id}/assign"
              payload: { assigned_artist_user_id: "u-artist-01" }
              as: ProductionManager
              as_user_id: "u-pm-01"
            - call: "POST /studio/stage-tasks/${t_layout_id}/submit"
              payload: {}
              as: Artist
              as_user_id: "u-artist-01"
            - call: "POST /studio/stage-tasks/${t_layout_id}/review-decision"
              payload: { decision: "RETAKE", note: "Camera height is wrong." }
              as: Supervisor
              as_user_id: "u-sup-01"
              captures: { rev_after_1: "$.data.revision_count", esc_after_1: "$.data.escalated" }
            - call: "POST /studio/stage-tasks/${t_layout_id}/submit"
              payload: {}
