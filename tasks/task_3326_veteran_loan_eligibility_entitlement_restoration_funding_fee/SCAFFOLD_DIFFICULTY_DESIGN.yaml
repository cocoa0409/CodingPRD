- rule_id: transitive_cascade
  instances:
  - name: coe_denial_cascades_loan_appraisal_appraiser_queue
    grounds:
    - state_machines.CertificateOfEligibility.REQUESTED_to_DENIED
    - state_machines.Loan
    - state_machines.Appraisal.ASSIGNED_to_CANCELLED
    - entities.Appraiser.fields.open_assignment_count
    distinguishing_aspect: 'Depth-4 chain from POST coe-requests/{id}/deny: deny -> loan

      underwriting DENIED -> its ASSIGNED appraisal CANCELLED -> appraiser

      slot freed -> the earliest-created QUEUED appraisal in the same

      region auto-promotes to ASSIGNED. Each link is caused by the previous

      one, not by the original call.

      '
