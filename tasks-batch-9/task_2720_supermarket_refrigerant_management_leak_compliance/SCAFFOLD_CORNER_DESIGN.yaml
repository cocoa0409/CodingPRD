              as: ComplianceManager
              captures: { report3_id: $.data.id }
          assert:
            - "the abutting-on-2026-06-30 create is HTTP 409 with error_id == ERR_REPORT_PERIOD_OVERLAP"
            - "the 2026-07-01 create is HTTP 201 with due_on == 2026-09-29T00:00:00Z"
            - "GET /regulatory-reports?store_id=${store_id} returns total_count 2"
            - "RegulatoryReport.${report1_id}.status == DRAFT (a DRAFT incumbent still blocks)"

      - name: charge_above_nameplate_is_rejected_with_cylinder_contents_to_spare
