            - { call: "POST /compliance/regulators", payload: { code: "REG-AC", name: "AC Regulator", deadline_mode: "CALENDAR", recordkeeping_years: 7 }, as: ComplianceAdmin, captures: { reg_id: "$.data.id" } }
            - { call: "POST /compliance/curricula", payload: { regulator_id: "${reg_id}", code: "CUR-AC", title: "AC Course", passing_score_pct: 80, validity_months: 12, evidence_requirement: "NONE" }, as: ComplianceAdmin, captures: { cur_id: "$.data.id", cur_v: "$.data.version" } }
            - { call: "POST /compliance/curricula/${cur_id}/versions", payload: { version_no: 1, effective_from: "2026-08-01T00:00:00Z", content_uri: "uri://ac-v1" }, as: ComplianceAdmin }
            - { call: "PATCH /compliance/curricula/${cur_id}", payload: { status: "ACTIVE", expected_curriculum_version: "${cur_v}" }, as: ComplianceAdmin }
            - { call: "POST /compliance/roles", payload: { code: "R-ACM", name: "AC Mgr" }, as: ComplianceAdmin, captures: { role_mgr: "$.data.id" } }
            - { call: "POST /compliance/roles", payload: { code: "R-AC", name: "AC Role" }, as: ComplianceAdmin, captures: { role_id: "$.data.id" } }
            - { call: "POST /compliance/roles/${role_id}/requirements", payload: { curriculum_id: "${cur_id}", recurrence: "INITIAL_ONLY", due_in_days: 30, criticality: "SOFT" }, as: ComplianceAdmin }
            - { call: "POST /compliance/employees", payload: { employee_no: "M-AC-1", full_name: "AC Mgr", hired_at: "2026-08-03T09:00:00Z", current_role_id: "${role_mgr}" }, as: HRAdmin, captures: { mgr: "$.data.id" } }
            - { call: "POST /compliance/employees", payload: { employee_no: "E-AC-1", full_name: "AC Emp", hired_at: "2026-08-03T09:00:00Z", current_role_id: "${role_id}", manager_id: "${mgr}" }, as: HRAdmin, captures: { emp: "$.data.id" } }
