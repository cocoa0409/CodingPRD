            - "due == '2026-08-31T09:00:00Z' (link 2: expedite candidate 2026-09-17T12:00:00Z is later, due unchanged)"
            - "clk == 'RESPONSE_BREACH' (link 3: breach re-evaluation after recompute)"
            - "ev_st == 'PENDING_FILING' and ev_tr == 'SUBSTANTIATED_CARE_CONCERN' and ev_esc == ${e1} (link 3: auto-created)"
            - "ev_dl == '2026-09-17T12:00:00Z' (adjudicated_at + 5 business days: 11,14,15,16,17 Sep)"

  # ---------------------------------------------------------------------------
  - rule_id: priority_pair_validation_conflict
    instances:
      - name: withdrawn_case_over_cap_recovery_state_beats_fiscal
        grounds:
          - validations[priority=4]
          - validations[priority=9]
          - errors[ERR_CASE_INVALID_STATE]
          - errors[ERR_RECOVERY_CASE_CAP_EXCEEDED]
        distinguishing_aspect: |
          Category pair {state, business_fiscal}: a recovery issuance that is BOTH on a
          WITHDRAWN case (state) AND 60000 > 50000 over the case cap (fiscal) must surface
          ERR_CASE_INVALID_STATE (priority 4) — never ERR_RECOVERY_CASE_CAP_EXCEEDED (priority 9).
        test_recipe:
          setup:
            - "Advocate adv (ADVOCATE); case in INTAKE then withdrawn"
          setup_api_calls:
            - { call: "POST /_clock/set_current_utc", payload: { to_iso8601: "2026-08-03T10:00:00Z" }, as: SystemAdmin }
            - { call: "POST /api/hospital-units", payload: { name: "ED Main", category: "EMERGENCY" }, as: SystemAdmin, captures: { u1: $.data.id } }
            - { call: "POST /api/staff-members", payload: { full_name: "Ally Advocate", capabilities: ["ADVOCATE"] }, as: SystemAdmin, captures: { adv: $.data.id } }
            - { call: "POST /api/patient-cases", payload: { patient_ref: "P-7001", unit_id: "${u1}", received_at: "2026-08-03T09:00:00Z", channel: "PHONE", description: "Billing shock", grievance_category: "BILLING" }, as: IntakeCoordinator, captures: { c1: $.data.id } }
            - { call: "POST /api/patient-cases/${c1}/withdraw", payload: { withdraw_reason: "Patient withdrew" }, as: IntakeCoordinator }
          trigger:
            - { call: "POST /api/patient-cases/${c1}/recovery-actions", payload: { action_type: "BILL_ADJUSTMENT", value_cents: 60000, justification: "Goodwill adjustment for billing dispute" }, as: PatientAdvocate, as_user_id: "${adv}", captures: { err: $.data.error_id } }
          assert:
            - "err == 'ERR_CASE_INVALID_STATE' (state priority 4 wins over fiscal priority 9)"
            - "err != 'ERR_RECOVERY_CASE_CAP_EXCEEDED' although 60000 > 50000 also holds"

      - name: on_leave_advocate_overlap_safety_beats_constraint
        grounds:
          - validations[priority=5.3]
          - validations[priority=7]
          - errors[ERR_ADVOCATE_ON_LEAVE]
          - errors[ERR_ROUNDING_OVERLAP]
        distinguishing_aspect: |
          Category pair {business_safety, business_constraint} (different pair than the
          state-vs-fiscal instance): an on-leave advocate booking an overlapping session must
          surface ERR_ADVOCATE_ON_LEAVE (5.3), not ERR_ROUNDING_OVERLAP (7).
        test_recipe:
          setup:
            - "Advocate adv has SCHEDULED session 2026-08-03T10:00-12:00; adv then placed on_leave"
          setup_api_calls:
            - { call: "POST /_clock/set_current_utc", payload: { to_iso8601: "2026-08-03T08:00:00Z" }, as: SystemAdmin }
            - { call: "POST /api/hospital-units", payload: { name: "Med-Surg 2", category: "INPATIENT" }, as: SystemAdmin, captures: { u1: $.data.id } }
            - { call: "POST /api/staff-members", payload: { full_name: "Ally Advocate", capabilities: ["ADVOCATE"] }, as: SystemAdmin, captures: { adv: $.data.id } }
            - { call: "POST /api/rounding-sessions", payload: { unit_id: "${u1}", start_at: "2026-08-03T10:00:00Z", end_at: "2026-08-03T12:00:00Z" }, as: PatientAdvocate, as_user_id: "${adv}" }
            - { call: "PATCH /api/staff-members/${adv}", payload: { on_leave: true }, as: SystemAdmin }
          trigger:
            - { call: "POST /api/rounding-sessions", payload: { unit_id: "${u1}", start_at: "2026-08-03T11:00:00Z", end_at: "2026-08-03T13:00:00Z" }, as: PatientAdvocate, as_user_id: "${adv}", captures: { err: $.data.error_id } }
          assert:
            - "err == 'ERR_ADVOCATE_ON_LEAVE' (safety 5.3 wins over constraint 7)"
            - "err != 'ERR_ROUNDING_OVERLAP' although [11:00,13:00) overlaps [10:00,12:00)"

      - name: cancelled_letter_self_approve_state_beats_sod
        grounds:
          - validations[priority=4.1]
          - validations[priority=5]
          - errors[ERR_LETTER_INVALID_STATE]
          - errors[ERR_SEGREGATION_OF_DUTIES]
        distinguishing_aspect: |
          Category pair {state, business_safety} (third distinct pair): the approver IS the
          findings submitter (SoD violation) but the letter was CANCELLED by case withdrawal —
          ERR_LETTER_INVALID_STATE (4.1) must win over ERR_SEGREGATION_OF_DUTIES (5).
        test_recipe:
          setup:
            - "Grievance with findings submitted by inv (who also holds DIRECTOR capability); letter IN_REVIEW; case withdrawn -> letter CANCELLED"
          setup_api_calls:
            - { call: "POST /_clock/set_current_utc", payload: { to_iso8601: "2026-08-03T10:00:00Z" }, as: SystemAdmin }
            - { call: "POST /api/hospital-units", payload: { name: "ICU West", category: "ICU" }, as: SystemAdmin, captures: { u1: $.data.id } }
            - { call: "POST /api/staff-members", payload: { full_name: "Ivy Hybrid", capabilities: ["INVESTIGATOR", "DIRECTOR"] }, as: SystemAdmin, captures: { inv: $.data.id } }
            - { call: "POST /api/patient-cases", payload: { patient_ref: "P-7003", unit_id: "${u1}", received_at: "2026-08-03T09:00:00Z", channel: "PHONE", description: "Restraint concern", grievance_category: "RIGHTS_ABUSE" }, as: IntakeCoordinator, captures: { c1: $.data.id, c1v: $.data.version } }
            - { call: "POST /api/patient-cases/${c1}/classification-decisions", payload: { decision: "GRIEVANCE", rationale_code: "INITIAL_INTAKE", expected_case_version: "${c1v}" }, as: IntakeCoordinator }
            - { call: "GET /api/patient-cases/${c1}", as: IntakeCoordinator, captures: { c1v2: $.data.version } }
            - { call: "POST /api/patient-cases/${c1}/assignments", payload: { investigator_id: "${inv}", expected_case_version: "${c1v2}" }, as: PatientRelationsDirector, as_user_id: "${inv}" }
            - { call: "POST /api/patient-cases/${c1}/investigations", payload: {}, as: DepartmentInvestigator, as_user_id: "${inv}", captures: { iv1: $.data.id } }
            - { call: "POST /api/investigations/${iv1}/notes", payload: { note_type: "INTERVIEW", body: "Interview" }, as: DepartmentInvestigator, as_user_id: "${inv}" }
            - { call: "POST /api/investigations/${iv1}/notes", payload: { note_type: "DOCUMENT_REVIEW", body: "Records" }, as: DepartmentInvestigator, as_user_id: "${inv}" }
            - { call: "POST /api/investigations/${iv1}/submit-findings", payload: { care_concern_flag: false, findings_summary: "Findings" }, as: DepartmentInvestigator, as_user_id: "${inv}" }
            - { call: "POST /api/investigations/${iv1}/accept-findings", payload: {}, as: PatientRelationsDirector, as_user_id: "${inv}" }
            - { call: "POST /api/patient-cases/${c1}/response-letters", payload: { sections: ["PATIENT_SUMMARY", "INVESTIGATION_STEPS", "FINDINGS", "RESOLUTION", "CONTACT_INFO"], body_summary: "Draft response letter content" }, as: DepartmentInvestigator, as_user_id: "${inv}", captures: { l1: $.data.id } }
            - { call: "POST /api/response-letters/${l1}/submit-review", payload: {}, as: DepartmentInvestigator, as_user_id: "${inv}" }
            - { call: "POST /api/patient-cases/${c1}/withdraw", payload: { withdraw_reason: "Patient withdrew the concern" }, as: IntakeCoordinator }
          trigger:
            - { call: "POST /api/response-letters/${l1}/approve", payload: {}, as: PatientRelationsDirector, as_user_id: "${inv}", captures: { err: $.data.error_id } }
          assert:
            - "err == 'ERR_LETTER_INVALID_STATE' (letter CANCELLED by withdraw cascade; state 4.1 wins)"
            - "err != 'ERR_SEGREGATION_OF_DUTIES' although approver == investigation.submitted_by_id"

  # ---------------------------------------------------------------------------
  - rule_id: boundary_precision_check
    instances:
      - name: issue_at_exact_deadline_on_time_one_second_late
        grounds:
          - state_machines.PatientCase.PENDING_CLOSURE_to_CLOSED
          - entities.PatientCase.fields.resolution_timeliness
          - calculations.regulatory_due_dates
        distinguishing_aspect: |
          Metric = deadline timestamp on the letter-issue endpoint: issued_at == due (equality)
          is ON_TIME (<= semantics); issued_at = due + 1 second is LATE. Two otherwise identical
          cases diverge on a one-second delta.
        test_recipe:
          setup:
            - "Two STANDARD grievances received 2026-08-03T10:00:00Z -> due 2026-09-02T10:00:00Z, both at APPROVED letter stage"
          setup_api_calls:
            - { call: "POST /_clock/set_current_utc", payload: { to_iso8601: "2026-08-03T12:00:00Z" }, as: SystemAdmin }
            - { call: "POST /api/hospital-units", payload: { name: "ED North", category: "EMERGENCY" }, as: SystemAdmin, captures: { u1: $.data.id } }
            - { call: "POST /api/staff-members", payload: { full_name: "Ivy Investigator", capabilities: ["INVESTIGATOR"] }, as: SystemAdmin, captures: { inv: $.data.id } }
            - { call: "POST /api/staff-members", payload: { full_name: "Dana Director", capabilities: ["DIRECTOR"] }, as: SystemAdmin, captures: { dir: $.data.id } }
            - { call: "POST /api/patient-cases", payload: { patient_ref: "P-8001", unit_id: "${u1}", received_at: "2026-08-03T10:00:00Z", channel: "PHONE", description: "Case X noise complaint", grievance_category: "OTHER" }, as: IntakeCoordinator, captures: { cx: $.data.id, cxv: $.data.version } }
            - { call: "POST /api/patient-cases/${cx}/classification-decisions", payload: { decision: "GRIEVANCE", rationale_code: "INITIAL_INTAKE", expected_case_version: "${cxv}" }, as: IntakeCoordinator }
            - { call: "GET /api/patient-cases/${cx}", as: PatientRelationsDirector, as_user_id: "${dir}", captures: { cxv2: $.data.version } }
            - { call: "POST /api/patient-cases/${cx}/assignments", payload: { investigator_id: "${inv}", expected_case_version: "${cxv2}" }, as: PatientRelationsDirector, as_user_id: "${dir}" }
            - { call: "POST /api/patient-cases/${cx}/investigations", payload: {}, as: DepartmentInvestigator, as_user_id: "${inv}", captures: { ivx: $.data.id } }
            - { call: "POST /api/investigations/${ivx}/notes", payload: { note_type: "INTERVIEW", body: "Interview X" }, as: DepartmentInvestigator, as_user_id: "${inv}" }
            - { call: "POST /api/investigations/${ivx}/notes", payload: { note_type: "DOCUMENT_REVIEW", body: "Review X" }, as: DepartmentInvestigator, as_user_id: "${inv}" }
            - { call: "POST /api/investigations/${ivx}/submit-findings", payload: { care_concern_flag: false, findings_summary: "Findings X" }, as: DepartmentInvestigator, as_user_id: "${inv}" }
            - { call: "POST /api/investigations/${ivx}/accept-findings", payload: {}, as: PatientRelationsDirector, as_user_id: "${dir}" }
            - { call: "POST /api/patient-cases/${cx}/response-letters", payload: { sections: ["PATIENT_SUMMARY", "INVESTIGATION_STEPS", "FINDINGS", "RESOLUTION", "CONTACT_INFO"], body_summary: "Letter X body content here" }, as: DepartmentInvestigator, as_user_id: "${inv}", captures: { lx: $.data.id } }
            - { call: "POST /api/response-letters/${lx}/submit-review", payload: {}, as: DepartmentInvestigator, as_user_id: "${inv}" }
            - { call: "POST /api/response-letters/${lx}/approve", payload: {}, as: PatientRelationsDirector, as_user_id: "${dir}" }
            - { call: "POST /api/patient-cases", payload: { patient_ref: "P-8002", unit_id: "${u1}", received_at: "2026-08-03T10:00:00Z", channel: "EMAIL", description: "Case Y food quality", grievance_category: "OTHER" }, as: IntakeCoordinator, captures: { cy: $.data.id, cyv: $.data.version } }
            - { call: "POST /api/patient-cases/${cy}/classification-decisions", payload: { decision: "GRIEVANCE", rationale_code: "INITIAL_INTAKE", expected_case_version: "${cyv}" }, as: IntakeCoordinator }
            - { call: "GET /api/patient-cases/${cy}", as: PatientRelationsDirector, as_user_id: "${dir}", captures: { cyv2: $.data.version } }
            - { call: "POST /api/patient-cases/${cy}/assignments", payload: { investigator_id: "${inv}", expected_case_version: "${cyv2}" }, as: PatientRelationsDirector, as_user_id: "${dir}" }
            - { call: "POST /api/patient-cases/${cy}/investigations", payload: {}, as: DepartmentInvestigator, as_user_id: "${inv}", captures: { ivy: $.data.id } }
            - { call: "POST /api/investigations/${ivy}/notes", payload: { note_type: "INTERVIEW", body: "Interview Y" }, as: DepartmentInvestigator, as_user_id: "${inv}" }
            - { call: "POST /api/investigations/${ivy}/notes", payload: { note_type: "DOCUMENT_REVIEW", body: "Review Y" }, as: DepartmentInvestigator, as_user_id: "${inv}" }
