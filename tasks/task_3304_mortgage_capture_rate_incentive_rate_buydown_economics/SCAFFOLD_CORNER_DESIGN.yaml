scaffold_corner_design:
  - section: entities
    instances:
      - name: community_create_derives_zeroed_aggregate_fields
        claim_type: computed_fields
        grounds:
          - entities.Community.fields.affiliated_units
          - entities.Community.fields.funded_units
          - entities.Community.fields.capture_rate_bps
          - entities.Community.fields.incentive_spend_cents
          - entities.Community.fields.forward_units_committed
          - entities.Community.fields.program_status
        distinguishing_aspect: "A freshly created Community reports 0 for every derived aggregate and ACTIVE posture; the derived fields are computed, not client-settable."
        test_recipe:
          setup: ["empty database"]
          setup_api_calls:
            - call: "POST /housing/_clock/set_current_utc"
              payload: { to_iso8601: "2026-09-01T00:00:00Z" }
              as: PlatformAdmin
          trigger:
            - call: "POST /housing/communities"
              payload: { name: "C1", state_code: "TX", incentive_policy_code: "STANDARD", price_reduction_cap_cents: 3000000, closing_cost_cap_cents: 2000000, rate_buydown_cap_cents: 6000000 }
              as: PlatformAdmin
              captures: { cm1: $.data.id, st: $.data.program_status, au: $.data.affiliated_units, fu: $.data.funded_units }
          assert:
            - "Community.${cm1}.program_status == ACTIVE"
            - "Community.${cm1}.affiliated_units == 0"
            - "Community.${cm1}.funded_units == 0"
            - "Community.${cm1}.capture_rate_bps == 0"
            - "Community.${cm1}.incentive_spend_cents == 0"
            - "Community.${cm1}.forward_units_committed == 0"
            - "Community.${cm1}.version == 1"

      - name: community_capture_rate_target_defaults_to_8500_bps
        claim_type: defaults
        grounds:
          - entities.Community.fields.capture_rate_target_bps
          - calculations.capture_rate_realization
        distinguishing_aspect: "Omitting capture_rate_target_bps applies the declared default of 8500 basis points rather than rejecting the request."
        test_recipe:
          setup: ["empty database"]
          setup_api_calls:
            - call: "POST /housing/_clock/set_current_utc"
              payload: { to_iso8601: "2026-09-01T00:00:00Z" }
              as: PlatformAdmin
          trigger:
            - call: "POST /housing/communities"
              payload: { name: "C1", state_code: "TX", incentive_policy_code: "PREMIUM", price_reduction_cap_cents: 4000000, closing_cost_cap_cents: 2500000, rate_buydown_cap_cents: 8000000 }
              as: PlatformAdmin
              captures: { cm1: $.data.id, tgt: $.data.capture_rate_target_bps }
          assert:
            - "Community.${cm1}.capture_rate_target_bps == 8500"
            - "Community.${cm1}.incentive_policy_code == PREMIUM"

      - name: community_missing_required_field_returns_invalid_request
        claim_type: required_fields
        grounds:
          - validations[priority=24]
          - errors[ERR_INVALID_REQUEST]
          - endpoints.POST /housing/communities
        distinguishing_aspect: "Creating a Community without the rate_buydown_cap_cents field is rejected with ERR_INVALID_REQUEST rather than silently defaulting it to zero."
        test_recipe:
          setup: ["the acting role holds a valid PlatformAdmin header"]
          setup_api_calls:
            - call: "POST /housing/_clock/set_current_utc"
              payload: { to_iso8601: "2026-09-01T00:00:00Z" }
              as: PlatformAdmin
          trigger:
            - call: "POST /housing/communities"
              payload: { name: "C1", state_code: "TX", incentive_policy_code: "STANDARD", price_reduction_cap_cents: 3000000, closing_cost_cap_cents: 2000000 }
              as: PlatformAdmin
              captures: { e_req: $.data.error_id }
          assert:
            - "the create is rejected with http 400 and error_id ERR_INVALID_REQUEST"
            - "no Community row exists"

      - name: community_not_found_on_get_by_unknown_uuid
        claim_type: not_found
        grounds:
          - validations[priority=3]
          - errors[ERR_RESOURCE_NOT_FOUND]
          - endpoints.GET /housing/communities/{id}
        distinguishing_aspect: "Reading a Community by a well-formed but unknown UUID returns ERR_RESOURCE_NOT_FOUND (404), not an empty object."
        test_recipe:
          setup: ["empty database"]
          setup_api_calls:
            - call: "POST /housing/_clock/set_current_utc"
              payload: { to_iso8601: "2026-09-01T00:00:00Z" }
              as: PlatformAdmin
          trigger:
            - call: "GET /housing/communities/8a3e1c0b-2f4d-4a91-9c8b-12e7b6a0f1d2"
              payload: {}
              as: PlatformAdmin
              captures: { e_nf: $.data.error_id }
          assert:
            - "the read is rejected with http 404 and error_id ERR_RESOURCE_NOT_FOUND"

      - name: community_list_pagination_envelope_fields
        claim_type: listing
        grounds:
          - response_envelope.pagination_fields
          - endpoints.GET /housing/communities
        distinguishing_aspect: "The community catalogue list honours the pagination envelope, returning total_count and has_more with the declared default limit of 10."
        test_recipe:
          setup: ["two communities exist"]
          setup_api_calls:
            - call: "POST /housing/_clock/set_current_utc"
              payload: { to_iso8601: "2026-09-01T00:00:00Z" }
              as: PlatformAdmin
            - call: "POST /housing/communities"
              payload: { name: "C1", state_code: "TX", incentive_policy_code: "STANDARD", price_reduction_cap_cents: 3000000, closing_cost_cap_cents: 2000000, rate_buydown_cap_cents: 6000000 }
              as: PlatformAdmin
            - call: "POST /housing/communities"
              payload: { name: "C2", state_code: "FL", incentive_policy_code: "PREMIUM", price_reduction_cap_cents: 4000000, closing_cost_cap_cents: 2500000, rate_buydown_cap_cents: 8000000 }
              as: PlatformAdmin
          trigger:
            - call: "GET /housing/communities"
              payload: {}
              as: Anonymous
              captures: { first_name: "$.data[0].name", second_name: "$.data[1].name" }
          assert:
            - "GET /housing/communities returns response_type array"
            - "the envelope carries limit == 10, offset == 0 and total_count == 2"
            - "has_more == false for two rows under the default limit"
            - "the payload contains exactly 2 Community objects"

      - name: home_site_invalid_construction_stage_enum_rejected
        claim_type: type_constraints
        grounds:
          - validations[priority=25]
          - errors[ERR_INVALID_ENUM_VALUE]
          - entities.HomeSite.fields.construction_stage
        distinguishing_aspect: "A construction_stage outside the declared enum set is rejected with ERR_INVALID_ENUM_VALUE rather than being stored verbatim."
        test_recipe:
          setup: ["a community exists"]
          setup_api_calls:
            - call: "POST /housing/_clock/set_current_utc"
              payload: { to_iso8601: "2026-09-01T00:00:00Z" }
              as: PlatformAdmin
            - call: "POST /housing/communities"
              payload: { name: "C1", state_code: "TX", incentive_policy_code: "STANDARD", price_reduction_cap_cents: 3000000, closing_cost_cap_cents: 2000000, rate_buydown_cap_cents: 6000000 }
              as: PlatformAdmin
              captures: { cm1: $.data.id }
          trigger:
            - call: "POST /housing/communities/${cm1}/home-sites"
              payload: { lot_number: "L1", address: "1 Elm", base_price_cents: 50000000, construction_stage: "ROOFING", estimated_completion_iso: "2026-10-01T00:00:00Z", advertised_rate_bps: 499, advertised_rate_expires_iso: "2027-01-01T00:00:00Z" }
              as: SalesCounselor
              captures: { e_enum: $.data.error_id }
          assert:
            - "the create is rejected with http 400 and error_id ERR_INVALID_ENUM_VALUE"
            - "no HomeSite row exists for Community.${cm1}"

      - name: home_site_creation_requires_existing_parent_community
        claim_type: parent_relationships
        grounds:
          - validations[priority=3]
          - errors[ERR_RESOURCE_NOT_FOUND]
          - entities.HomeSite.fields.community_id
        distinguishing_aspect: "Creating a HomeSite under an unknown community id is rejected with ERR_RESOURCE_NOT_FOUND because the FK is validated before the body is accepted."
        test_recipe:
          setup: ["empty database"]
          setup_api_calls:
            - call: "POST /housing/_clock/set_current_utc"
              payload: { to_iso8601: "2026-09-01T00:00:00Z" }
              as: PlatformAdmin
          trigger:
            - call: "POST /housing/communities/8a3e1c0b-2f4d-4a91-9c8b-12e7b6a0f1d2/home-sites"
              payload: { lot_number: "L1", address: "1 Elm", base_price_cents: 50000000, construction_stage: "DRYWALL", estimated_completion_iso: "2026-10-01T00:00:00Z", advertised_rate_bps: 499, advertised_rate_expires_iso: "2027-01-01T00:00:00Z" }
              as: SalesCounselor
              captures: { e_parent: $.data.error_id }
          assert:
            - "the create is rejected with http 404 and error_id ERR_RESOURCE_NOT_FOUND"
            - "no HomeSite row exists"

      - name: buyer_duplicate_email_uniqueness_constraint
        claim_type: type_constraints
        grounds:
          - entities.Buyer.fields.email
          - errors[ERR_INVALID_REQUEST]
        distinguishing_aspect: "The buyer email is the natural unique key, so a second registration with the same email is rejected rather than creating a second Buyer."
        test_recipe:
          setup: ["one buyer already registered under ada@x.com"]
          setup_api_calls:
            - call: "POST /housing/_clock/set_current_utc"
              payload: { to_iso8601: "2026-09-01T00:00:00Z" }
              as: PlatformAdmin
            - call: "POST /housing/buyers"
              payload: { full_name: "Ada", email: "ada@x.com", state_code: "TX" }
              as: SalesCounselor
              captures: { b1: $.data.id }
          trigger:
            - call: "POST /housing/buyers"
              payload: { full_name: "Ada Two", email: "ada@x.com", state_code: "TX" }
              as: SalesCounselor
              captures: { e_dup: $.data.error_id }
          assert:
            - "the second registration is rejected with http 400 and error_id ERR_INVALID_REQUEST"
            - "exactly one Buyer row exists with email ada@x.com"

      - name: contract_creation_derives_incentive_budget_from_community_policy
        claim_type: computed_fields
        grounds:
          - entities.HomeSaleContract.fields.incentive_budget_cents
          - entities.Community.fields.price_reduction_cap_cents
          - entities.Community.fields.closing_cost_cap_cents
          - entities.Community.fields.rate_buydown_cap_cents
        distinguishing_aspect: "A new contract's incentive_budget_cents is the sum of the three community caps, computed from cross-entity data rather than supplied."
        test_recipe:
          setup: ["a community under the STANDARD policy with caps 3000000 / 2000000 / 6000000"]
          setup_api_calls:
            - call: "POST /housing/_clock/set_current_utc"
              payload: { to_iso8601: "2026-09-01T00:00:00Z" }
              as: PlatformAdmin
            - call: "POST /housing/communities"
              payload: { name: "C1", state_code: "TX", incentive_policy_code: "STANDARD", price_reduction_cap_cents: 3000000, closing_cost_cap_cents: 2000000, rate_buydown_cap_cents: 6000000 }
              as: PlatformAdmin
              captures: { cm1: $.data.id }
            - call: "POST /housing/buyers"
              payload: { full_name: "Ada", email: "ada@x.com", state_code: "TX" }
              as: SalesCounselor
              captures: { b1: $.data.id }
            - call: "POST /housing/communities/${cm1}/home-sites"
              payload: { lot_number: "L1", address: "1 Elm", base_price_cents: 50000000, construction_stage: "DRYWALL", estimated_completion_iso: "2026-10-01T00:00:00Z", advertised_rate_bps: 499, advertised_rate_expires_iso: "2027-01-01T00:00:00Z" }
              as: SalesCounselor
              captures: { hs1: $.data.id }
          trigger:
            - call: "POST /housing/home-sites/${hs1}/contracts"
              payload: { buyer_id: "${b1}", purchase_price_cents: 50000000, earnest_money_cents: 2000000 }
              as: SalesCounselor
              captures: { ct1: $.data.id, bud: $.data.incentive_budget_cents, alloc: $.data.incentive_allocated_cents }
          assert:
            - "HomeSaleContract.${ct1}.incentive_budget_cents == 11000000"
            - "HomeSaleContract.${ct1}.incentive_allocated_cents == 0"
            - "HomeSaleContract.${ct1}.contract_status == PENDING"
            - "HomeSaleContract.${ct1}.deposit_held_cents == 0"

      - name: home_site_and_forward_commitment_system_fields_are_server_minted
        claim_type: system_fields
        grounds:
          - entities.HomeSite.fields.home_site_status
          - entities.ForwardCommitment.fields.commitment_status
          - entities.ForwardCommitment.fields.units_drawn
          - entities.ForwardCommitment.fields.units_released
        distinguishing_aspect: "home_site_status and the commitment's draw ledger are system-sourced: client-supplied values for them are ignored and the server defaults are applied."
        test_recipe:
          setup: ["a community exists"]
          setup_api_calls:
            - call: "POST /housing/_clock/set_current_utc"
              payload: { to_iso8601: "2026-09-01T00:00:00Z" }
              as: PlatformAdmin
            - call: "POST /housing/communities"
              payload: { name: "C1", state_code: "TX", incentive_policy_code: "STANDARD", price_reduction_cap_cents: 3000000, closing_cost_cap_cents: 2000000, rate_buydown_cap_cents: 6000000 }
              as: PlatformAdmin
              captures: { cm1: $.data.id }
          trigger:
            - call: "POST /housing/communities/${cm1}/forward-commitments"
              payload: { commitment_code: "FC1", investor_name: "Fannie", committed_rate_bps: 499, committed_units: 10, commitment_start_iso: "2026-09-01T00:00:00Z", commitment_end_iso: "2030-01-01T00:00:00Z" }
              as: MortgageBanker
              captures: { fc1: $.data.id, avail: $.data.units_available, drawn: $.data.units_drawn }
          assert:
            - "ForwardCommitment.${fc1}.units_available == 10"
            - "ForwardCommitment.${fc1}.units_drawn == 0"
            - "ForwardCommitment.${fc1}.units_released == 0"
            - "ForwardCommitment.${fc1}.commitment_status == OPEN"
            - "ForwardCommitment.${fc1}.version == 1"

  - section: state_machines
    instances:
      - name: home_site_starts_available_on_creation
        claim_type: initial_state
        grounds:
          - state_machines.HomeSite.initial_state
          - entities.HomeSite.fields.home_site_status
        distinguishing_aspect: "A newly created HomeSite starts in AVAILABLE, the declared initial state, with no reserve call needed."
        test_recipe:
          setup: ["a community exists"]
          setup_api_calls:
            - call: "POST /housing/_clock/set_current_utc"
              payload: { to_iso8601: "2026-09-01T00:00:00Z" }
              as: PlatformAdmin
            - call: "POST /housing/communities"
              payload: { name: "C1", state_code: "TX", incentive_policy_code: "STANDARD", price_reduction_cap_cents: 3000000, closing_cost_cap_cents: 2000000, rate_buydown_cap_cents: 6000000 }
              as: PlatformAdmin
              captures: { cm1: $.data.id }
          trigger:
            - call: "POST /housing/communities/${cm1}/home-sites"
              payload: { lot_number: "L1", address: "1 Elm", base_price_cents: 50000000, construction_stage: "DRYWALL", estimated_completion_iso: "2026-10-01T00:00:00Z", advertised_rate_bps: 499, advertised_rate_expires_iso: "2027-01-01T00:00:00Z" }
              as: SalesCounselor
              captures: { hs1: $.data.id, st: $.data.home_site_status }
          assert:
            - "HomeSite.${hs1}.home_site_status == AVAILABLE"

      - name: community_suspended_is_terminal_and_refuses_further_posture_changes
        claim_type: terminal_state_lockdown
        grounds:
          - state_machines.Community.terminal_states
          - state_machines.Community.ACTIVE_to_SUSPENDED
          - errors[ERR_INVALID_STATE]
        distinguishing_aspect: "SUSPENDED is declared terminal for Community, so any posture change out of SUSPENDED is refused with ERR_INVALID_STATE."
        test_recipe:
          setup: ["a community suspended by the disposal of an unacknowledged disclosure"]
          setup_api_calls:
            - call: "POST /housing/_clock/set_current_utc"
              payload: { to_iso8601: "2026-09-01T00:00:00Z" }
              as: PlatformAdmin
            - call: "POST /housing/communities"
              payload: { name: "C1", state_code: "TX", incentive_policy_code: "STANDARD", price_reduction_cap_cents: 3000000, closing_cost_cap_cents: 2000000, rate_buydown_cap_cents: 6000000 }
              as: PlatformAdmin
              captures: { cm1: $.data.id }
            - call: "POST /housing/buyers"
              payload: { full_name: "Ada", email: "ada@x.com", state_code: "TX" }
              as: SalesCounselor
              captures: { b1: $.data.id }
            - call: "POST /housing/communities/${cm1}/home-sites"
              payload: { lot_number: "L1", address: "1 Elm", base_price_cents: 50000000, construction_stage: "DRYWALL", estimated_completion_iso: "2026-10-01T00:00:00Z", advertised_rate_bps: 499, advertised_rate_expires_iso: "2027-01-01T00:00:00Z" }
              as: SalesCounselor
              captures: { hs1: $.data.id }
            - call: "POST /housing/home-sites/${hs1}/contracts"
              payload: { buyer_id: "${b1}", purchase_price_cents: 50000000, earnest_money_cents: 2000000 }
              as: SalesCounselor
              captures: { ct1: $.data.id }
            - call: "POST /housing/contracts/${ct1}/disclosures"
              payload: { disclosure_type: "AFFILIATED_BUSINESS_ARRANGEMENT" }
              as: ComplianceOfficer
              captures: { d1: $.data.id }
            - call: "POST /housing/_clock/set_current_utc"
              payload: { to_iso8601: "2026-09-05T00:00:00Z" }
              as: PlatformAdmin
          trigger:
            - call: "POST /housing/communities/${cm1}/posture"
              payload: { target_status: "ACTIVE" }
              as: ComplianceOfficer
              captures: { e_term: $.data.error_id }
          assert:
            - "the posture change is rejected with http 409 and error_id ERR_INVALID_STATE"
            - "Community.${cm1}.program_status == SUSPENDED"
            - "ABADisclosure.${d1}.disclosure_status == CURING"

      - name: contract_double_close_second_call_rejected
        claim_type: idempotency
        grounds:
          - state_machines.HomeSaleContract.terminal_states
          - errors[ERR_INVALID_STATE]
          - state_machines.HomeSite.UNDER_CONTRACT_to_SOLD
        distinguishing_aspect: "CLOSED is terminal for HomeSaleContract, so a second close on the same contract is rejected with ERR_INVALID_STATE and fires no second draw on the commitment."
        test_recipe:
          setup: ["an approved contract ct1 with one qualified application and one active lock"]
          setup_api_calls:
            - call: "POST /housing/_clock/set_current_utc"
              payload: { to_iso8601: "2026-09-01T00:00:00Z" }
              as: PlatformAdmin
            - call: "POST /housing/communities"
              payload: { name: "C1", state_code: "TX", incentive_policy_code: "STANDARD", price_reduction_cap_cents: 3000000, closing_cost_cap_cents: 2000000, rate_buydown_cap_cents: 6000000 }
              as: PlatformAdmin
              captures: { cm1: $.data.id }
            - call: "POST /housing/buyers"
              payload: { full_name: "Ada", email: "ada@x.com", state_code: "TX" }
              as: SalesCounselor
              captures: { b1: $.data.id }
            - call: "POST /housing/communities/${cm1}/home-sites"
              payload: { lot_number: "L1", address: "1 Elm", base_price_cents: 50000000, construction_stage: "FINISH", estimated_completion_iso: "2026-10-01T00:00:00Z", advertised_rate_bps: 499, advertised_rate_expires_iso: "2027-01-01T00:00:00Z" }
              as: SalesCounselor
              captures: { hs1: $.data.id }
            - call: "POST /housing/communities/${cm1}/forward-commitments"
              payload: { commitment_code: "FC1", investor_name: "Fannie", committed_rate_bps: 499, committed_units: 5, commitment_start_iso: "2026-09-01T00:00:00Z", commitment_end_iso: "2030-01-01T00:00:00Z" }
              as: MortgageBanker
              captures: { fc1: $.data.id }
            - call: "POST /housing/home-sites/${hs1}/contracts"
              payload: { buyer_id: "${b1}", purchase_price_cents: 50000000, earnest_money_cents: 2000000 }
              as: SalesCounselor
              captures: { ct1: $.data.id }
            - call: "POST /housing/contracts/${ct1}/loan-applications"
              payload: { lender_entity_code: "AFFILIATED_LENDER", application_number: "APP-1", qualifying_income_cents: 2000000, monthly_debt_cents: 100000 }
              as: MortgageBanker
              captures: { la1: $.data.id }
            - call: "POST /housing/loan-applications/${la1}/qualify"
              payload: {}
              as: MortgageBanker
              captures: { la1_v: $.data.version }
            - call: "POST /housing/loan-applications/${la1}/rate-locks"
              payload: { commitment_id: "${fc1}", lock_rate_bps: 499, lock_days: 180, expected_application_version: "${la1_v}" }
              as: MortgageBanker
              captures: { lk1: $.data.id }
            - call: "POST /housing/contracts/${ct1}/lock"
              payload: {}
              as: MortgageBanker
            - call: "POST /housing/contracts/${ct1}/approve"
              payload: {}
              as: ComplianceOfficer
            - call: "POST /housing/contracts/${ct1}/close"
              payload: {}
              as: ClosingOfficer
          trigger:
            - call: "POST /housing/contracts/${ct1}/close"
              payload: {}
              as: ClosingOfficer
              captures: { e_again: $.data.error_id }
          assert:
            - "the second close is rejected with http 409 and error_id ERR_INVALID_STATE"
            - "HomeSaleContract.${ct1}.contract_status == CLOSED"
            - "ForwardCommitment.${fc1}.units_drawn == 1, so the rejected call drew nothing"
            - "ForwardCommitment.${fc1}.units_available == 4"

      - name: disclosure_cure_expiry_side_effect_chain_to_community_suspension
        claim_type: side_effect_execution
        grounds:
          - state_machines.ABADisclosure.ISSUED_to_CURING
          - state_machines.Community.RESTRICTED_to_SUSPENDED
          - entities.Buyer.fields.steering_protection_flag
          - errors[ERR_ABA_DISCLOSURE_CURE_EXPIRED]
        distinguishing_aspect: "The cure expiry side effects fire together: the disclosure enters CURING, the buyer's steering_protection_flag drops to false, and the owning community suspends."
        test_recipe:
          setup: ["an ISSUED disclosure d1 whose cure deadline is 2026-09-04T00:00:00Z, with a contract in the community"]
          setup_api_calls:
            - call: "POST /housing/_clock/set_current_utc"
              payload: { to_iso8601: "2026-09-01T00:00:00Z" }
              as: PlatformAdmin
            - call: "POST /housing/communities"
              payload: { name: "C1", state_code: "TX", incentive_policy_code: "STANDARD", price_reduction_cap_cents: 3000000, closing_cost_cap_cents: 2000000, rate_buydown_cap_cents: 6000000 }
              as: PlatformAdmin
              captures: { cm1: $.data.id }
            - call: "POST /housing/buyers"
              payload: { full_name: "Ada", email: "ada@x.com", state_code: "TX" }
              as: SalesCounselor
              captures: { b1: $.data.id }
            - call: "POST /housing/communities/${cm1}/home-sites"
              payload: { lot_number: "L1", address: "1 Elm", base_price_cents: 50000000, construction_stage: "DRYWALL", estimated_completion_iso: "2026-10-01T00:00:00Z", advertised_rate_bps: 499, advertised_rate_expires_iso: "2027-01-01T00:00:00Z" }
              as: SalesCounselor
              captures: { hs1: $.data.id }
            - call: "POST /housing/home-sites/${hs1}/contracts"
              payload: { buyer_id: "${b1}", purchase_price_cents: 50000000, earnest_money_cents: 2000000 }
              as: SalesCounselor
              captures: { ct1: $.data.id }
            - call: "POST /housing/contracts/${ct1}/disclosures"
              payload: { disclosure_type: "AFFILIATED_BUSINESS_ARRANGEMENT" }
              as: ComplianceOfficer
              captures: { d1: $.data.id }
          trigger:
            - call: "POST /housing/_clock/set_current_utc"
              payload: { to_iso8601: "2026-09-05T00:00:00Z" }
              as: PlatformAdmin
          assert:
            - "ABADisclosure.${d1}.disclosure_status == CURING"
            - "Buyer.${b1}.steering_protection_flag == false"
            - "Community.${cm1}.program_status == SUSPENDED"
