      - name: stock_check_rounds_half_up_once_at_the_final_division
        claim_type: Precision
        grounds:
          - calculations.primary_source_cost
          - calculations.primary_source_cost.variants.overview_weighted_average
          - endpoints.GET_/formularies/{id}/stock-check
        distinguishing_aspect: >
