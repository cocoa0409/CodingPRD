            - call: "POST /observation/staff"
              payload: { home_unit_id: "${u18}", full_name: "Corner Outgoing Eighteen", source_pool: "INTERNAL_FLOAT", hourly_rate_cents: 2000, competency_level: "ADVANCED", deescalation_cert_expires_on: "2027-01-01T00:00:00Z" }
              as: StaffingCoordinator
              captures: { out18: $.data.id }
            - call: "POST /observation/staff"
              payload: { home_unit_id: "${u18}", full_name: "Corner Incoming Eighteen", source_pool: "INTERNAL_FLOAT", hourly_rate_cents: 2000, competency_level: "ADVANCED", deescalation_cert_expires_on: "2027-01-01T00:00:00Z" }
              as: StaffingCoordinator
              captures: { in18: $.data.id }
            - call: "POST /observation/orders"
              payload: { patient_id: "${pt18}", ordering_provider_user_id: "prov-1", risk_categories: ["FALL"], required_modality: "ONE_TO_ONE_SITTER", clinical_rationale: "Continuous fall precautions" }
              as: AttendingProvider
              as_user_id: "prov-1"
              captures: { o18c: $.data.id, o18c_v1: $.data.version }
            - call: "POST /observation/sitter-assignments"
              payload: { order_id: "${o18c}", staff_id: "${out18}", shift_start_at: "2026-08-01T08:00:00Z", shift_end_at: "2026-08-01T16:00:00Z", expected_order_version: "${o18c_v1}" }
              as: StaffingCoordinator
              captures: { a18out: $.data.id }
            - call: "GET /observation/orders/${o18c}"
              payload: {}
              as: StaffingCoordinator
              captures: { o18c_v2: $.data.version }
            - call: "POST /observation/sitter-assignments"
              payload: { order_id: "${o18c}", staff_id: "${in18}", shift_start_at: "2026-08-01T16:00:00Z", shift_end_at: "2026-08-02T00:00:00Z", expected_order_version: "${o18c_v2}" }
