      - name: outlet_cost_escalator_applies_to_hauling_before_tier_lookup
        mode: c_pinned_evaluation_order
        grounds:
          - calculations.outlet_cost_comparison
          - entities.DiversionOrder.fields.subtotal_cost
          - entities.DiversionOrder.fields.surcharge_pct
          - entities.DiversionOrder.fields.total_cost
          - entities.DiversionOrder.fields.cost_per_dry_ton
          - endpoints.GET_/diversion-orders/{orderId}/cost-comparison
        distinguishing_aspect: |
          The surcharge tier is keyed on the subtotal that the surcharge then feeds, so only the
          pinned six-step order is well-defined: processing 1200.00, hauling 777.60 (escalator on
          hauling only), subtotal 1977.60 which sits 2.40 BELOW the 2000.00 tier-1 floor, so
          surcharge_pct 0.00 and total 1977.60. Applying the 1.08 escalator to the gate fee as
          well pushes the subtotal to 2016.00, trips the 3% tier and yields 2076.48 / 103.82.
