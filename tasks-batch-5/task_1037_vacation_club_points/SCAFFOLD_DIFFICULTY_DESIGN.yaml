# =============================================================================
# task_1037 — Vacation-Club & Points Travel
# SCAFFOLD_DIFFICULTY_DESIGN.yaml (§1.8 Test Targeting Index)
# 9 difficulty rules x >=2 instances = 18 instances.
# =============================================================================
scaffold_difficulty_design:

  # ===========================================================================
  - rule_id: dual_variant_calc
    instances:
      - name: dv_cancellation_refund_partial_on_reservation
        grounds:
          - calculations.reservation_cancellation_refund
          - state_machines.Reservation.HELD_to_CANCELLED
          - entities.Reservation.fields.refunded_points
        distinguishing_aspect: |
          The SAME 1000-point reservation refunds 500 (PARTIAL, days_out=40) here but
          would refund 1000 (FULL) if cancelled >=60 days out — two divergent variants
          of one calc on the Reservation domain.
        test_recipe:
          setup:
            - "Clock at default 2026-07-01. Member A (owned 5000) with OPEN bucket. UnitType (2BR, total_units 2, chart 150/200/250/350). A holds a HELD reservation Aug 10-14 (HIGH, 4 weekday nights) costing 1000; bucket points_used=1000."
          setup_api_calls:
            - { call: "POST /_clock/set_current_utc", payload: { to_iso8601: "2026-07-01T00:00:00Z" }, as: ClubAdmin }
            - { call: "POST /club/members", payload: { full_name: "A", email: "a@x.com", owned_points: 5000 }, as: ClubAdmin, captures: { m_a: "$.data.id" } }
            - { call: "GET /club/members/${m_a}/points-buckets", payload: {}, as: ClubAdmin, captures: { b_a: "$.data[0].id" } }
            - { call: "POST /club/resorts", payload: { name: "R1", region: "FL" }, as: ClubAdmin, captures: { r1: "$.data.id" } }
            - { call: "POST /club/resorts/${r1}/unit-types", payload: { name: "2BR", total_units: 2, points_weekday_low: 150, points_weekend_low: 200, points_weekday_high: 250, points_weekend_high: 350 }, as: ClubAdmin, captures: { ut: "$.data.id" } }
            - { call: "POST /club/reservations", payload: { member_id: "${m_a}", unit_type_id: "${ut}", points_bucket_id: "${b_a}", check_in: "2026-08-10", check_out: "2026-08-14" }, as: Member, as_user_id: "${m_a}", captures: { res: "$.data.id" } }
          trigger:
            - { call: "POST /club/reservations/${res}/cancel", payload: {}, as: Member, as_user_id: "${m_a}" }
          assert:
            - "Reservation.${res}.status == CANCELLED"
            - "Reservation.${res}.refunded_points == 500"
            - "PointsBucket.${b_a}.points_used == 500"
            - "PointsBucket.${b_a}.points_available == 4500"

      - name: dv_banking_standard_par_on_pointsbucket
        grounds:
          - calculations.banking_transfer_value
          - state_machines.PointsBucket.OPEN_to_CLOSED
          - entities.PointsBucket.fields.banked_out
        distinguishing_aspect: |
          Banking 1000 points on-time (now 2026-07-01 <= deadline 2026-10-01) credits the
          next-year bucket 1000 at par; the LATE variant would credit only floor(1000*0.5)=500
          — dual-variant on the PointsBucket domain (distinct from the Reservation refund calc).
        test_recipe:
          setup:
            - "Clock 2026-07-01. Member (owned 5000) with OPEN 2026 bucket (available 5000). Bank cap = floor(0.5*5000)=2500 >= 1000."
          setup_api_calls:
            - { call: "POST /_clock/set_current_utc", payload: { to_iso8601: "2026-07-01T00:00:00Z" }, as: ClubAdmin }
            - { call: "POST /club/members", payload: { full_name: "Bk", email: "bk@x.com", owned_points: 5000 }, as: ClubAdmin, captures: { m: "$.data.id" } }
            - { call: "GET /club/members/${m}/points-buckets", payload: {}, as: ClubAdmin, captures: { b26: "$.data[0].id" } }
          trigger:
            - { call: "POST /club/points-buckets/${b26}/bank", payload: { points: 1000 }, as: Member, as_user_id: "${m}" }
          assert:
            - "PointsBucket.${b26}.banked_out == 1000"
            - "PointsBucket.${b26}.points_available == 4000"
            - "The 2027 PointsBucket for this member has banked_in == 1000 (par credit, NOT 500)"

  # ===========================================================================
  - rule_id: combinatorial_formula
    instances:
      - name: cf_reservation_point_chart_mode_a
        grounds:
          - calculations.reservation_point_cost
          - entities.UnitType.fields.points_weekend_low
          - entities.Reservation.fields.points_cost
        distinguishing_aspect: |
          Mode (a): cost is the per-night sum over >=3 interacting inputs (nights x season x
          day-class), selecting 1 of 4 chart cells per night — Mar 2-7 LOW = 4 weekday(150)
          + 1 weekend Fri(200) = 800, not a flat nights*rate.
        test_recipe:
          setup:
            - "Clock 2026-02-01 so Mar 2-7 is future & in window. Member (owned 5000). UnitType chart 150/200/250/350, total_units 1. Booking Mar 2 (Mon) -> Mar 7: nights Mon,Tue,Wed,Thu (weekday LOW 150) + Fri (weekend LOW 200)."
          setup_api_calls:
            - { call: "POST /_clock/set_current_utc", payload: { to_iso8601: "2026-02-01T00:00:00Z" }, as: ClubAdmin }
            - { call: "POST /club/members", payload: { full_name: "C", email: "c@x.com", owned_points: 5000 }, as: ClubAdmin, captures: { m: "$.data.id" } }
            - { call: "GET /club/members/${m}/points-buckets", payload: {}, as: ClubAdmin, captures: { b: "$.data[0].id" } }
            - { call: "POST /club/resorts", payload: { name: "R", region: "AZ" }, as: ClubAdmin, captures: { r: "$.data.id" } }
            - { call: "POST /club/resorts/${r}/unit-types", payload: { name: "1BR", total_units: 1, points_weekday_low: 150, points_weekend_low: 200, points_weekday_high: 250, points_weekend_high: 350 }, as: ClubAdmin, captures: { ut: "$.data.id" } }
          trigger:
            - { call: "POST /club/reservations", payload: { member_id: "${m}", unit_type_id: "${ut}", points_bucket_id: "${b}", check_in: "2026-03-02", check_out: "2026-03-07" }, as: Member, as_user_id: "${m}", captures: { res: "$.data.id" } }
          assert:
            - "Reservation.${res}.nights == 5"
            - "Reservation.${res}.points_cost == 800"
            - "PointsBucket.${b}.points_used == 800"

      - name: cf_statement_total_nested_rounding_mode_b
        grounds:
          - calculations.maintenance_statement_total
          - entities.Statement.fields.total_due_cents
          - concurrency_rules[statement-generate-stale-member]
        distinguishing_aspect: |
          Mode (b): rounding order matters. owned 4750 -> maintenance round(4750*0.0653*100)=31018,
          club_dues round(4750*0.0089*100)=4228; per-line-then-sum + special 25000 = 60246, whereas
          round((0.0653+0.0089)*4750*100)=60245. The scaffold pins per-line rounding.
        test_recipe:
          setup:
            - "Clock 2026-07-01. Member (owned 4750, tier SILVER), version 1. Generate a statement with special_assessment_cents 25000."
          setup_api_calls:
            - { call: "POST /_clock/set_current_utc", payload: { to_iso8601: "2026-07-01T00:00:00Z" }, as: ClubAdmin }
            - { call: "POST /club/members", payload: { full_name: "D", email: "d@x.com", owned_points: 4750 }, as: ClubAdmin, captures: { m: "$.data.id", mv: "$.data.version" } }
          trigger:
            - { call: "POST /club/members/${m}/statements", payload: { expected_member_version: "${mv}", special_assessment_cents: 25000 }, as: ClubAdmin, captures: { st: "$.data.id" } }
          assert:
            - "Statement.${st}.maintenance_fee_cents == 31018"
            - "Statement.${st}.club_dues_cents == 4228"
            - "Statement.${st}.total_due_cents == 60246"

  # ===========================================================================
  - rule_id: non_linear_state_machine
    instances:
      - name: nlsm_member_active_suspended_active_cycle
        grounds:
          - state_machines.Member.ACTIVE_to_SUSPENDED
          - state_machines.Member.SUSPENDED_to_ACTIVE
          - state_machines.Statement.CURRENT_to_PAST_DUE
        distinguishing_aspect: |
          Member is cyclic: setup drives ACTIVE->SUSPENDED (delinquency), the trigger drives
          SUSPENDED->ACTIVE (payoff) — a return edge no linear pipeline has. On Member entity.
        test_recipe:
          setup:
            - "Member (owned 5000) with a generated statement total 37100c. Clock advanced to 2026-08-16 (> due 2026-07-31 + grace 15). run_billing_cycle has set the statement PAST_DUE and the member SUSPENDED."
          setup_api_calls:
            - { call: "POST /_clock/set_current_utc", payload: { to_iso8601: "2026-07-01T00:00:00Z" }, as: ClubAdmin }
            - { call: "POST /club/members", payload: { full_name: "E", email: "e@x.com", owned_points: 5000 }, as: ClubAdmin, captures: { m: "$.data.id", mv: "$.data.version" } }
            - { call: "POST /club/members/${m}/statements", payload: { expected_member_version: "${mv}" }, as: ClubAdmin, captures: { st: "$.data.id" } }
            - { call: "POST /_clock/set_current_utc", payload: { to_iso8601: "2026-08-16T00:00:00Z" }, as: ClubAdmin }
            - { call: "POST /_ops/run_billing_cycle", payload: {}, as: ClubAdmin }
          trigger:
            - { call: "POST /club/statements/${st}/pay", payload: { amount_cents: 37100 }, as: Member, as_user_id: "${m}" }
          assert:
            - "Statement.${st}.payment_status == PAID"
            - "Statement.${st}.aging_status == CURRENT"
            - "Member.${m}.account_status == ACTIVE"

      - name: nlsm_statement_parallel_payment_vs_aging
        grounds:
          - state_machines.Statement.UNPAID_to_PARTIALLY_PAID
          - state_machines.Statement.CURRENT_to_PAST_DUE
          - entities.Statement.fields.aging_status
        distinguishing_aspect: |
          Statement carries two independent axes: a partial payment moves payment_status to
          PARTIALLY_PAID while aging_status stays PAST_DUE — the two dimensions evolve
          independently on the same row (parallel, not linear).
        test_recipe:
          setup:
            - "Member (owned 5000) with statement total 37100c that is PAST_DUE (clock 2026-08-16, run_billing_cycle) and still UNPAID."
          setup_api_calls:
            - { call: "POST /_clock/set_current_utc", payload: { to_iso8601: "2026-07-01T00:00:00Z" }, as: ClubAdmin }
            - { call: "POST /club/members", payload: { full_name: "F", email: "f@x.com", owned_points: 5000 }, as: ClubAdmin, captures: { m: "$.data.id", mv: "$.data.version" } }
            - { call: "POST /club/members/${m}/statements", payload: { expected_member_version: "${mv}" }, as: ClubAdmin, captures: { st: "$.data.id" } }
            - { call: "POST /_clock/set_current_utc", payload: { to_iso8601: "2026-08-16T00:00:00Z" }, as: ClubAdmin }
            - { call: "POST /_ops/run_billing_cycle", payload: {} , as: ClubAdmin }
          trigger:
            - { call: "POST /club/statements/${st}/pay", payload: { amount_cents: 100 }, as: Member, as_user_id: "${m}" }
          assert:
            - "Statement.${st}.payment_status == PARTIALLY_PAID"
            - "Statement.${st}.aging_status == PAST_DUE"
            - "Statement.${st}.amount_paid_cents == 100"

  # ===========================================================================
  - rule_id: transitive_cascade
    instances:
      - name: tc_suspension_cascade_depth3_statement_member_reservation_waitlist
        grounds:
          - state_machines.Member.ACTIVE_to_SUSPENDED
          - state_machines.Reservation.HELD_to_CANCELLED
          - state_machines.Waitlist.ACTIVE_to_PROMOTED
        distinguishing_aspect: |
          Depth-3 chain from run_billing_cycle: Statement->PAST_DUE (link1) CAUSES
          Member->SUSPENDED (link2) which CAUSES the member's HELD reservation->CANCELLED
          (link3) which frees capacity and CAUSES the waitlist entry->PROMOTED (link4).
        test_recipe:
          setup:
            - "Member A (owned 5000) with statement total 37100c; A holds a HELD reservation on UT (total_units 1) Oct 10-14 (cost 650). Member B (owned 5000) has an ACTIVE waitlist entry on UT for Oct 12-16. Clock at 2026-08-16 (past due+grace)."
          setup_api_calls:
            - { call: "POST /_clock/set_current_utc", payload: { to_iso8601: "2026-07-01T00:00:00Z" }, as: ClubAdmin }
            - { call: "POST /club/members", payload: { full_name: "A", email: "a2@x.com", owned_points: 5000 }, as: ClubAdmin, captures: { m_a: "$.data.id", mav: "$.data.version" } }
            - { call: "GET /club/members/${m_a}/points-buckets", payload: {}, as: ClubAdmin, captures: { b_a: "$.data[0].id" } }
            - { call: "POST /club/members", payload: { full_name: "B", email: "b2@x.com", owned_points: 5000 }, as: ClubAdmin, captures: { m_b: "$.data.id" } }
            - { call: "GET /club/members/${m_b}/points-buckets", payload: {}, as: ClubAdmin, captures: { b_b: "$.data[0].id" } }
            - { call: "POST /club/resorts", payload: { name: "R", region: "HI" }, as: ClubAdmin, captures: { r: "$.data.id" } }
            - { call: "POST /club/resorts/${r}/unit-types", payload: { name: "2BR", total_units: 1, points_weekday_low: 150, points_weekend_low: 200, points_weekday_high: 250, points_weekend_high: 350 }, as: ClubAdmin, captures: { ut: "$.data.id" } }
            - { call: "POST /club/reservations", payload: { member_id: "${m_a}", unit_type_id: "${ut}", points_bucket_id: "${b_a}", check_in: "2026-10-10", check_out: "2026-10-14" }, as: Member, as_user_id: "${m_a}", captures: { res_a: "$.data.id" } }
            - { call: "POST /club/waitlist-entries", payload: { member_id: "${m_b}", unit_type_id: "${ut}", points_bucket_id: "${b_b}", check_in: "2026-10-12", check_out: "2026-10-16" }, as: Member, as_user_id: "${m_b}", captures: { wl_b: "$.data.id" } }
            - { call: "POST /club/members/${m_a}/statements", payload: { expected_member_version: "${mav}" }, as: ClubAdmin, captures: { st: "$.data.id" } }
            - { call: "POST /_clock/set_current_utc", payload: { to_iso8601: "2026-08-16T00:00:00Z" }, as: ClubAdmin }
          trigger:
            - { call: "POST /_ops/run_billing_cycle", payload: {}, as: ClubAdmin }
          assert:
            - "Statement.${st}.aging_status == PAST_DUE"
            - "Member.${m_a}.account_status == SUSPENDED"
            - "Reservation.${res_a}.status == CANCELLED"
            - "Reservation.${res_a}.refunded_points == 650"
            - "Waitlist.${wl_b}.status == PROMOTED"
            - "Waitlist.${wl_b}.promoted_reservation_id is non-null and that Reservation.status == HELD with points_cost 600"
            - "PointsBucket.${b_b}.points_used == 600"

      - name: tc_cancel_cascade_refund_freecapacity_promote
        grounds:
          - state_machines.Reservation.HELD_to_CANCELLED
          - state_machines.Waitlist.ACTIVE_to_PROMOTED
          - calculations.reservation_cancellation_refund
        distinguishing_aspect: |
          Depth-2+ chain from a DIFFERENT trigger (member cancel): cancel refunds the bucket &
          frees capacity (link1) which CAUSES the waitlist->PROMOTED creating a new HELD
          reservation reserving the promoted member's points (link2/3).
        test_recipe:
          setup:
            - "Clock 2026-07-01. Member A (owned 5000) holds Aug 10-14 (cost 1000) on UT total_units 1. Member B (owned 5000) has ACTIVE waitlist for Aug 12-16 (would cost 1200)."
          setup_api_calls:
            - { call: "POST /_clock/set_current_utc", payload: { to_iso8601: "2026-07-01T00:00:00Z" }, as: ClubAdmin }
            - { call: "POST /club/members", payload: { full_name: "A", email: "a3@x.com", owned_points: 5000 }, as: ClubAdmin, captures: { m_a: "$.data.id" } }
            - { call: "GET /club/members/${m_a}/points-buckets", payload: {}, as: ClubAdmin, captures: { b_a: "$.data[0].id" } }
            - { call: "POST /club/members", payload: { full_name: "B", email: "b3@x.com", owned_points: 5000 }, as: ClubAdmin, captures: { m_b: "$.data.id" } }
            - { call: "GET /club/members/${m_b}/points-buckets", payload: {}, as: ClubAdmin, captures: { b_b: "$.data[0].id" } }
            - { call: "POST /club/resorts", payload: { name: "R", region: "CA" }, as: ClubAdmin, captures: { r: "$.data.id" } }
            - { call: "POST /club/resorts/${r}/unit-types", payload: { name: "2BR", total_units: 1, points_weekday_low: 150, points_weekend_low: 200, points_weekday_high: 250, points_weekend_high: 350 }, as: ClubAdmin, captures: { ut: "$.data.id" } }
            - { call: "POST /club/reservations", payload: { member_id: "${m_a}", unit_type_id: "${ut}", points_bucket_id: "${b_a}", check_in: "2026-08-10", check_out: "2026-08-14" }, as: Member, as_user_id: "${m_a}", captures: { res_a: "$.data.id" } }
            - { call: "POST /club/waitlist-entries", payload: { member_id: "${m_b}", unit_type_id: "${ut}", points_bucket_id: "${b_b}", check_in: "2026-08-12", check_out: "2026-08-16" }, as: Member, as_user_id: "${m_b}", captures: { wl_b: "$.data.id" } }
          trigger:
            - { call: "POST /club/reservations/${res_a}/cancel", payload: {}, as: Member, as_user_id: "${m_a}" }
          assert:
            - "Reservation.${res_a}.status == CANCELLED"
            - "Reservation.${res_a}.refunded_points == 500"
            - "Waitlist.${wl_b}.status == PROMOTED"
            - "Waitlist.${wl_b}.promoted_reservation_id is non-null and that Reservation.status == HELD with points_cost 1200"
            - "PointsBucket.${b_b}.points_used == 1200"

  # ===========================================================================
  - rule_id: priority_pair_validation_conflict
    instances:
      - name: ppvc_state_beats_fiscal_on_reservation_create
        grounds:
          - validations[priority=6]
          - validations[priority=9]
          - errors[ERR_MEMBER_SUSPENDED]
        distinguishing_aspect: |
          A SUSPENDED member (state, priority 6) with a bucket too poor for the cost (fiscal,
          priority 9) gets ERR_MEMBER_SUSPENDED, not ERR_INSUFFICIENT_POINTS — state category
          outranks fiscal category.
        test_recipe:
          setup:
            - "Member A (owned 100) SUSPENDED via delinquency. UnitType chart makes an Aug 10-14 booking cost 1000 > available 100 (fiscal would also fail). Both violations present on one create."
          setup_api_calls:
            - { call: "POST /_clock/set_current_utc", payload: { to_iso8601: "2026-07-01T00:00:00Z" }, as: ClubAdmin }
            - { call: "POST /club/members", payload: { full_name: "A", email: "a4@x.com", owned_points: 100 }, as: ClubAdmin, captures: { m_a: "$.data.id", mav: "$.data.version" } }
            - { call: "GET /club/members/${m_a}/points-buckets", payload: {}, as: ClubAdmin, captures: { b_a: "$.data[0].id" } }
            - { call: "POST /club/resorts", payload: { name: "R", region: "NV" }, as: ClubAdmin, captures: { r: "$.data.id" } }
            - { call: "POST /club/resorts/${r}/unit-types", payload: { name: "2BR", total_units: 2, points_weekday_low: 150, points_weekend_low: 200, points_weekday_high: 250, points_weekend_high: 350 }, as: ClubAdmin, captures: { ut: "$.data.id" } }
            - { call: "POST /club/members/${m_a}/statements", payload: { expected_member_version: "${mav}", special_assessment_cents: 500 }, as: ClubAdmin, captures: { st: "$.data.id" } }
            - { call: "POST /_clock/set_current_utc", payload: { to_iso8601: "2026-08-16T00:00:00Z" }, as: ClubAdmin }
            - { call: "POST /_ops/run_billing_cycle", payload: {}, as: ClubAdmin }
          trigger:
            - { call: "POST /club/reservations", payload: { member_id: "${m_a}", unit_type_id: "${ut}", points_bucket_id: "${b_a}", check_in: "2026-09-10", check_out: "2026-09-14" }, as: Member, as_user_id: "${m_a}", captures: { err: "$.data.error_id" } }
          assert:
            - "HTTP status == 409"
            - "response.data.error_id == ERR_MEMBER_SUSPENDED"

      - name: ppvc_temporal_beats_constraint_on_reservation_create
        grounds:
          - validations[priority=7]
          - validations[priority=8]
          - errors[ERR_OUTSIDE_BOOKING_WINDOW]
        distinguishing_aspect: |
          A STANDARD member books dates 380 days out (outside 366-day window, temporal p7) on a
          unit already full for those dates (constraint p8) and gets ERR_OUTSIDE_BOOKING_WINDOW,
          not ERR_NO_INVENTORY — a different category pair than the state/fiscal conflict.
        test_recipe:
          setup:
            - "Clock 2026-07-01. UnitType total_units 1. PLATINUM member P (owned 13000, window 396) has booked 2027-07-16..18 (within 396d), filling the single unit. STANDARD member S (owned 3000, window 366) attempts the same dates (380d out => outside window AND no inventory)."
          setup_api_calls:
            - { call: "POST /_clock/set_current_utc", payload: { to_iso8601: "2026-07-01T00:00:00Z" }, as: ClubAdmin }
            - { call: "POST /club/members", payload: { full_name: "P", email: "p@x.com", owned_points: 13000 }, as: ClubAdmin, captures: { m_p: "$.data.id" } }
            - { call: "GET /club/members/${m_p}/points-buckets", payload: {}, as: ClubAdmin, captures: { b_p: "$.data[0].id" } }
            - { call: "POST /club/members", payload: { full_name: "S", email: "s@x.com", owned_points: 3000 }, as: ClubAdmin, captures: { m_s: "$.data.id" } }
            - { call: "GET /club/members/${m_s}/points-buckets", payload: {}, as: ClubAdmin, captures: { b_s: "$.data[0].id" } }
            - { call: "POST /club/resorts", payload: { name: "R", region: "SC" }, as: ClubAdmin, captures: { r: "$.data.id" } }
            - { call: "POST /club/resorts/${r}/unit-types", payload: { name: "STU", total_units: 1, points_weekday_low: 150, points_weekend_low: 200, points_weekday_high: 250, points_weekend_high: 350 }, as: ClubAdmin, captures: { ut: "$.data.id" } }
            - { call: "POST /club/reservations", payload: { member_id: "${m_p}", unit_type_id: "${ut}", points_bucket_id: "${b_p}", check_in: "2027-07-16", check_out: "2027-07-18" }, as: Member, as_user_id: "${m_p}", captures: { res_p: "$.data.id" } }
          trigger:
            - { call: "POST /club/reservations", payload: { member_id: "${m_s}", unit_type_id: "${ut}", points_bucket_id: "${b_s}", check_in: "2027-07-16", check_out: "2027-07-18" }, as: Member, as_user_id: "${m_s}", captures: { err: "$.data.error_id" } }
          assert:
            - "HTTP status == 422"
            - "response.data.error_id == ERR_OUTSIDE_BOOKING_WINDOW"

  # ===========================================================================
  - rule_id: boundary_precision_check
    instances:
      - name: bpc_booking_window_inclusive_boundary
        grounds:
          - validations[priority=7]
          - entities.Member.fields.tier
          - errors[ERR_OUTSIDE_BOOKING_WINDOW]
        distinguishing_aspect: |
          A STANDARD member booking check_in exactly now+366 (2027-07-02) SUCCEEDS (inclusive
          boundary); now+367 would be ERR_OUTSIDE_BOOKING_WINDOW. Metric: days-to-check-in on
          POST /club/reservations.
        test_recipe:
          setup:
            - "Clock 2026-07-01. STANDARD member (owned 3000). UnitType total_units 1. Book 1 night check_in 2027-07-02 (=now+366), a Fri HIGH night costing 350."
          setup_api_calls:
            - { call: "POST /_clock/set_current_utc", payload: { to_iso8601: "2026-07-01T00:00:00Z" }, as: ClubAdmin }
            - { call: "POST /club/members", payload: { full_name: "W", email: "w@x.com", owned_points: 3000 }, as: ClubAdmin, captures: { m: "$.data.id" } }
            - { call: "GET /club/members/${m}/points-buckets", payload: {}, as: ClubAdmin, captures: { b: "$.data[0].id" } }
            - { call: "POST /club/resorts", payload: { name: "R", region: "TX" }, as: ClubAdmin, captures: { r: "$.data.id" } }
            - { call: "POST /club/resorts/${r}/unit-types", payload: { name: "1BR", total_units: 1, points_weekday_low: 150, points_weekend_low: 200, points_weekday_high: 250, points_weekend_high: 350 }, as: ClubAdmin, captures: { ut: "$.data.id" } }
          trigger:
            - { call: "POST /club/reservations", payload: { member_id: "${m}", unit_type_id: "${ut}", points_bucket_id: "${b}", check_in: "2027-07-02", check_out: "2027-07-03" }, as: Member, as_user_id: "${m}", captures: { res: "$.data.id" } }
          assert:
            - "HTTP status == 201"
            - "Reservation.${res}.status == HELD"
            - "Reservation.${res}.points_cost == 350"

      - name: bpc_full_refund_days_out_boundary
        grounds:
          - calculations.reservation_cancellation_refund
          - state_machines.Reservation.HELD_to_CANCELLED
          - entities.Reservation.fields.refunded_points
        distinguishing_aspect: |
          days_out exactly 60 (clock 2026-06-11, check_in 2026-08-10) yields FULL refund 1000; 59
          would be PARTIAL 500. Different metric (days_out) and different endpoint (cancel) than
          the window boundary.
        test_recipe:
          setup:
            - "Member (owned 5000) holds Aug 10-14 (cost 1000). Clock set to 2026-06-11 so days_out == 60 exactly."
          setup_api_calls:
            - { call: "POST /_clock/set_current_utc", payload: { to_iso8601: "2026-06-01T00:00:00Z" }, as: ClubAdmin }
            - { call: "POST /club/members", payload: { full_name: "G", email: "g@x.com", owned_points: 5000 }, as: ClubAdmin, captures: { m: "$.data.id" } }
            - { call: "GET /club/members/${m}/points-buckets", payload: {}, as: ClubAdmin, captures: { b: "$.data[0].id" } }
            - { call: "POST /club/resorts", payload: { name: "R", region: "FL" }, as: ClubAdmin, captures: { r: "$.data.id" } }
            - { call: "POST /club/resorts/${r}/unit-types", payload: { name: "2BR", total_units: 1, points_weekday_low: 150, points_weekend_low: 200, points_weekday_high: 250, points_weekend_high: 350 }, as: ClubAdmin, captures: { ut: "$.data.id" } }
            - { call: "POST /club/reservations", payload: { member_id: "${m}", unit_type_id: "${ut}", points_bucket_id: "${b}", check_in: "2026-08-10", check_out: "2026-08-14" }, as: Member, as_user_id: "${m}", captures: { res: "$.data.id" } }
            - { call: "POST /_clock/set_current_utc", payload: { to_iso8601: "2026-06-11T00:00:00Z" }, as: ClubAdmin }
          trigger:
            - { call: "POST /club/reservations/${res}/cancel", payload: {}, as: Member, as_user_id: "${m}" }
          assert:
            - "Reservation.${res}.refunded_points == 1000"
            - "PointsBucket.${b}.points_used == 0"

  # ===========================================================================
  - rule_id: cross_entity_state_dependency
    instances:
      - name: cesd_transfer_accept_blocked_by_suspended_receiver
        grounds:
          - state_machines.Transfer.PENDING_to_COMPLETED
          - state_machines.Member.ACTIVE_to_SUSPENDED
          - errors[ERR_MEMBER_SUSPENDED]
        distinguishing_aspect: |
          A PENDING transfer is legal to accept, yet accept is rejected purely because the
          receiving Member.account_status == SUSPENDED — entity pair (Transfer -> Member),
          distinct from (Listing -> Reservation) below.
        test_recipe:
          setup:
            - "Member A (owned 5000) initiated a 500-point Transfer to Member B while both ACTIVE (Transfer PENDING, escrow on A). B then becomes SUSPENDED via delinquency (statement PAST_DUE + grace, run_billing_cycle at 2026-08-16). The PENDING transfer survives (suspension cascade only cancels HELD reservations)."
          setup_api_calls:
            - { call: "POST /_clock/set_current_utc", payload: { to_iso8601: "2026-07-01T00:00:00Z" }, as: ClubAdmin }
            - { call: "POST /club/members", payload: { full_name: "A", email: "a5@x.com", owned_points: 5000 }, as: ClubAdmin, captures: { m_a: "$.data.id" } }
            - { call: "POST /club/members", payload: { full_name: "B", email: "b5@x.com", owned_points: 5000 }, as: ClubAdmin, captures: { m_b: "$.data.id", mbv: "$.data.version" } }
            - { call: "POST /club/transfers", payload: { from_member_id: "${m_a}", to_member_id: "${m_b}", points: 500 }, as: Member, as_user_id: "${m_a}", captures: { tr: "$.data.id" } }
            - { call: "POST /club/members/${m_b}/statements", payload: { expected_member_version: "${mbv}" }, as: ClubAdmin, captures: { st: "$.data.id" } }
            - { call: "POST /_clock/set_current_utc", payload: { to_iso8601: "2026-08-16T00:00:00Z" }, as: ClubAdmin }
            - { call: "POST /_ops/run_billing_cycle", payload: {}, as: ClubAdmin }
          trigger:
            - { call: "POST /club/transfers/${tr}/accept", payload: { outcome: "ACCEPT" }, as: Member, as_user_id: "${m_b}", captures: { err: "$.data.error_id" } }
          assert:
            - "HTTP status == 409"
            - "response.data.error_id == ERR_MEMBER_SUSPENDED"
            - "Transfer.${tr}.status == PENDING (unchanged)"

      - name: cesd_listing_requires_confirmed_reservation
        grounds:
          - state_machines.Listing.LISTED_to_WITHDRAWN
          - state_machines.Reservation.HELD_to_CONFIRMED
          - errors[ERR_INVALID_STATE]
        distinguishing_aspect: |
          Creating a Listing on a HELD (not CONFIRMED) reservation is rejected with
          ERR_INVALID_STATE — the listing's legality is gated by a DIFFERENT entity's state,
          pair (Listing -> Reservation), distinct from (Reservation -> Member).
        test_recipe:
          setup:
            - "Member (owned 5000) holds a HELD reservation Aug 10-14 (not confirmed)."
          setup_api_calls:
            - { call: "POST /_clock/set_current_utc", payload: { to_iso8601: "2026-07-01T00:00:00Z" }, as: ClubAdmin }
            - { call: "POST /club/members", payload: { full_name: "L", email: "l@x.com", owned_points: 5000 }, as: ClubAdmin, captures: { m: "$.data.id" } }
            - { call: "GET /club/members/${m}/points-buckets", payload: {}, as: ClubAdmin, captures: { b: "$.data[0].id" } }
            - { call: "POST /club/resorts", payload: { name: "R", region: "FL" }, as: ClubAdmin, captures: { r: "$.data.id" } }
            - { call: "POST /club/resorts/${r}/unit-types", payload: { name: "2BR", total_units: 1, points_weekday_low: 150, points_weekend_low: 200, points_weekday_high: 250, points_weekend_high: 350 }, as: ClubAdmin, captures: { ut: "$.data.id" } }
            - { call: "POST /club/reservations", payload: { member_id: "${m}", unit_type_id: "${ut}", points_bucket_id: "${b}", check_in: "2026-08-10", check_out: "2026-08-14" }, as: Member, as_user_id: "${m}", captures: { res: "$.data.id" } }
          trigger:
            - { call: "POST /club/reservations/${res}/listings", payload: { listing_type: "RENTAL", ask_amount_cents: 50000 }, as: Member, as_user_id: "${m}", captures: { err: "$.data.error_id" } }
          assert:
            - "HTTP status == 409"
            - "response.data.error_id == ERR_INVALID_STATE"

  # ===========================================================================
  - rule_id: resource_temporal_overlap
    instances:
      - name: rto_unittype_aggregate_capacity_overlap
        grounds:
          - calculations.unit_type_night_occupancy
          - validations[priority=8]
          - errors[ERR_NO_INVENTORY]
        distinguishing_aspect: |
          UnitType interval semantics = aggregate per-night capacity: with total_units 1 a
          second booking overlapping nights Aug 12-13 is rejected ERR_NO_INVENTORY, though an
          adjacent booking (check_in == prior check_out) would be allowed. Resource = UnitType.
        test_recipe:
          setup:
            - "UnitType total_units 1. Member A holds Aug 10-14. Member B (owned 5000) attempts Aug 12-16 (overlaps nights 12,13)."
          setup_api_calls:
            - { call: "POST /_clock/set_current_utc", payload: { to_iso8601: "2026-07-01T00:00:00Z" }, as: ClubAdmin }
            - { call: "POST /club/members", payload: { full_name: "A", email: "a6@x.com", owned_points: 5000 }, as: ClubAdmin, captures: { m_a: "$.data.id" } }
            - { call: "GET /club/members/${m_a}/points-buckets", payload: {}, as: ClubAdmin, captures: { b_a: "$.data[0].id" } }
            - { call: "POST /club/members", payload: { full_name: "B", email: "b6@x.com", owned_points: 5000 }, as: ClubAdmin, captures: { m_b: "$.data.id" } }
            - { call: "GET /club/members/${m_b}/points-buckets", payload: {}, as: ClubAdmin, captures: { b_b: "$.data[0].id" } }
            - { call: "POST /club/resorts", payload: { name: "R", region: "CA" }, as: ClubAdmin, captures: { r: "$.data.id" } }
            - { call: "POST /club/resorts/${r}/unit-types", payload: { name: "2BR", total_units: 1, points_weekday_low: 150, points_weekend_low: 200, points_weekday_high: 250, points_weekend_high: 350 }, as: ClubAdmin, captures: { ut: "$.data.id" } }
            - { call: "POST /club/reservations", payload: { member_id: "${m_a}", unit_type_id: "${ut}", points_bucket_id: "${b_a}", check_in: "2026-08-10", check_out: "2026-08-14" }, as: Member, as_user_id: "${m_a}", captures: { res_a: "$.data.id" } }
          trigger:
            - { call: "POST /club/reservations", payload: { member_id: "${m_b}", unit_type_id: "${ut}", points_bucket_id: "${b_b}", check_in: "2026-08-12", check_out: "2026-08-16" }, as: Member, as_user_id: "${m_b}", captures: { err: "$.data.error_id" } }
          assert:
            - "HTTP status == 409"
            - "response.data.error_id == ERR_NO_INVENTORY"

      - name: rto_member_calendar_single_occupancy_overlap
        grounds:
          - validations[priority=8]
          - entities.Reservation.fields.member_id
          - errors[ERR_MEMBER_DATE_OVERLAP]
        distinguishing_aspect: |
          Member interval semantics = single-occupancy regardless of unit: the same member
          booking a DIFFERENT unit-type (capacity free) for overlapping dates is rejected
          ERR_MEMBER_DATE_OVERLAP. Resource = Member, distinct semantics from UnitType capacity.
        test_recipe:
          setup:
            - "Member A (owned 5000) holds Aug 10-14 on UT1. UT2 (different unit type, total_units 5, capacity free) exists. A attempts Aug 12-16 on UT2."
          setup_api_calls:
            - { call: "POST /_clock/set_current_utc", payload: { to_iso8601: "2026-07-01T00:00:00Z" }, as: ClubAdmin }
            - { call: "POST /club/members", payload: { full_name: "A", email: "a7@x.com", owned_points: 5000 }, as: ClubAdmin, captures: { m_a: "$.data.id" } }
            - { call: "GET /club/members/${m_a}/points-buckets", payload: {}, as: ClubAdmin, captures: { b_a: "$.data[0].id" } }
            - { call: "POST /club/resorts", payload: { name: "R", region: "CO" }, as: ClubAdmin, captures: { r: "$.data.id" } }
            - { call: "POST /club/resorts/${r}/unit-types", payload: { name: "UT1", total_units: 1, points_weekday_low: 150, points_weekend_low: 200, points_weekday_high: 250, points_weekend_high: 350 }, as: ClubAdmin, captures: { ut1: "$.data.id" } }
            - { call: "POST /club/resorts/${r}/unit-types", payload: { name: "UT2", total_units: 5, points_weekday_low: 150, points_weekend_low: 200, points_weekday_high: 250, points_weekend_high: 350 }, as: ClubAdmin, captures: { ut2: "$.data.id" } }
            - { call: "POST /club/reservations", payload: { member_id: "${m_a}", unit_type_id: "${ut1}", points_bucket_id: "${b_a}", check_in: "2026-08-10", check_out: "2026-08-14" }, as: Member, as_user_id: "${m_a}", captures: { res_a: "$.data.id" } }
          trigger:
            - { call: "POST /club/reservations", payload: { member_id: "${m_a}", unit_type_id: "${ut2}", points_bucket_id: "${b_a}", check_in: "2026-08-12", check_out: "2026-08-16" }, as: Member, as_user_id: "${m_a}", captures: { err: "$.data.error_id" } }
          assert:
            - "HTTP status == 409"
            - "response.data.error_id == ERR_MEMBER_DATE_OVERLAP"

  # ===========================================================================
  - rule_id: compensating_invariant
    instances:
      - name: ci_points_conserved_bank_then_borrow
        grounds:
          - calculations.banking_transfer_value
          - calculations.bucket_available_points
          - state_machines.PointsBucket.OPEN_to_CLOSED
        distinguishing_aspect: |
          Conserved quantity = member total available points. Bank 1000 (2026 -> 2027, par) then
          borrow 1000 back restores BOTH buckets to 5000 available each; member_total_available
          == 10000 unchanged.
        test_recipe:
          setup:
            - "Clock 2026-07-01. Member (owned 5000), 2026 bucket available 5000. Bank cap 2500 and borrow cap 2500 both >= 1000."
          setup_api_calls:
            - { call: "POST /_clock/set_current_utc", payload: { to_iso8601: "2026-07-01T00:00:00Z" }, as: ClubAdmin }
            - { call: "POST /club/members", payload: { full_name: "Inv", email: "inv@x.com", owned_points: 5000 }, as: ClubAdmin, captures: { m: "$.data.id" } }
            - { call: "GET /club/members/${m}/points-buckets", payload: {}, as: ClubAdmin, captures: { b26: "$.data[0].id" } }
            - { call: "POST /club/points-buckets/${b26}/bank", payload: { points: 1000 }, as: Member, as_user_id: "${m}" }
          trigger:
            - { call: "POST /club/points-buckets/${b26}/borrow", payload: { points: 1000 }, as: Member, as_user_id: "${m}" }
          assert:
            - "PointsBucket.${b26}.points_available == 5000"
            - "PointsBucket.${b26}.banked_out == 1000 and borrowed_in == 1000"
            - "The 2027 bucket has banked_in == 1000 and borrowed_out == 1000 and points_available == 5000 (member total available == 10000, unchanged)"

      - name: ci_unit_nights_conserved_book_then_full_cancel
        grounds:
          - calculations.unit_type_night_occupancy
          - state_machines.Reservation.HELD_to_CANCELLED
          - calculations.reservation_cancellation_refund
        distinguishing_aspect: |
          Conserved quantity = UnitType nightly occupancy (a DIFFERENT quantity than points).
          Book Aug 10-14 then FULL-cancel (days_out 60) returns per-night occupancy to 0, so a
          fresh booking of the same nights on total_units 1 succeeds again.
        test_recipe:
          setup:
            - "Clock 2026-06-11. Member A (owned 5000) books Aug 10-14 on UT total_units 1 (occupies nights 10-13). days_out 60 => full cancel refunds 1000."
          setup_api_calls:
            - { call: "POST /_clock/set_current_utc", payload: { to_iso8601: "2026-06-11T00:00:00Z" }, as: ClubAdmin }
            - { call: "POST /club/members", payload: { full_name: "A", email: "a8@x.com", owned_points: 5000 }, as: ClubAdmin, captures: { m_a: "$.data.id" } }
            - { call: "GET /club/members/${m_a}/points-buckets", payload: {}, as: ClubAdmin, captures: { b_a: "$.data[0].id" } }
            - { call: "POST /club/members", payload: { full_name: "C", email: "c8@x.com", owned_points: 5000 }, as: ClubAdmin, captures: { m_c: "$.data.id" } }
            - { call: "GET /club/members/${m_c}/points-buckets", payload: {}, as: ClubAdmin, captures: { b_c: "$.data[0].id" } }
            - { call: "POST /club/resorts", payload: { name: "R", region: "FL" }, as: ClubAdmin, captures: { r: "$.data.id" } }
            - { call: "POST /club/resorts/${r}/unit-types", payload: { name: "2BR", total_units: 1, points_weekday_low: 150, points_weekend_low: 200, points_weekday_high: 250, points_weekend_high: 350 }, as: ClubAdmin, captures: { ut: "$.data.id" } }
            - { call: "POST /club/reservations", payload: { member_id: "${m_a}", unit_type_id: "${ut}", points_bucket_id: "${b_a}", check_in: "2026-08-10", check_out: "2026-08-14" }, as: Member, as_user_id: "${m_a}", captures: { res_a: "$.data.id" } }
            - { call: "POST /club/reservations/${res_a}/cancel", payload: {}, as: Member, as_user_id: "${m_a}" }
          trigger:
            - { call: "POST /club/reservations", payload: { member_id: "${m_c}", unit_type_id: "${ut}", points_bucket_id: "${b_c}", check_in: "2026-08-10", check_out: "2026-08-14" }, as: Member, as_user_id: "${m_c}", captures: { res_c: "$.data.id" } }
          assert:
            - "Reservation.${res_a}.refunded_points == 1000 (full)"
            - "HTTP status == 201 for the re-booking"
            - "Reservation.${res_c}.status == HELD and points_cost == 1000 (capacity was conserved/freed)"
