        claim_type: required_field
        grounds:
          - entities.Student.fields.grade_level
          - validations[priority=29]
        distinguishing_aspect: "grade_level is an input-sourced field with no default, so omitting it is a required-field failure (400 ERR_INVALID_REQUEST) and no Student row is minted — a different code path from a bad enum member or an unresolvable FK."
