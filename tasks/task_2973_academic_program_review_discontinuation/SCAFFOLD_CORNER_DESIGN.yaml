            - "after the WAIVE the plan read shows guaranteed_seat_total back to 5, waived_guarantee_count 1, substituted_guarantee_count 0 and seat_shortfall 0 — the waived row left the supply aggregate, and it is counted as WAIVED rather than as SUBSTITUTED"
            - "the guarantee list still returns total_count == 2: g2 is readable with status WAIVED, seats_guaranteed 4, substitute_course_code HIST-405 and waived_reason_code NO-DEMAND — leaving an aggregate is not deletion"
