      - name: upgrade_request_admissibility_bounds
        claim_type: Violation → Error
        grounds:
          - errors.ERR_UPGRADE_NOT_AN_INCREASE
          - errors.ERR_TIER_CEILING_REACHED
          - errors.ERR_NO_PENDING_UPGRADE_REQUESTS
          - validations.priority_51_upgrade_not_an_increase
          - validations.priority_54_tier_ceiling_reached
          - calculations.upgrade_allocation_waterfall
        distinguishing_aspect: >-
          A STANDARD assignment provisioned at 450 rpm has a ceiling of 2 x 600 = 1200, so a
          request for exactly 1200 is admissible and the waterfall grants the whole 750 delta.
          Once the assignment sits AT its ceiling the next request is refused by the ceiling
          rule, while a request naming the current value is refused earlier by the
          not-an-increase rule — the two must not be swapped. Re-running the allocation with no
          PENDING rows left is a 409, not a no-op success.
        test_recipe:
          setup:
            - "developer D1 is uncertified (trust 56, multiplier 0.75) and holds an ACTIVE STANDARD assignment: floor(600 * 0.75 * 1.0) = 450 sustained, 900 burst"
            - "product P1 has ample pool (20000 sustained), so the waterfall is never pool-bound"
