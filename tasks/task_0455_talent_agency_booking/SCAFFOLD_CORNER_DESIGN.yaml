  # ===========================================================================
  # Stubs: corners already exercised by §1.8 difficulty instances.
  # ===========================================================================
  - section: calculations
    instances:
      - name: provisional_commission_correct_result
        claim_type: Correct Result
        grounds: [calculations.provisional_commission]
        excluded_because:
          difficulty_instance: dual_variant_calc / commission_provisional_vs_final_diverges
          rationale: "Provisional commission == 100000 is asserted directly in that §1.8 instance."

      - name: availability_summary_committed_days_correct
        claim_type: Correct Result
        grounds: [calculations.talent_committed_days]
        excluded_because:
          difficulty_instance: dual_variant_calc / availability_projection_vs_committed_diverges
          rationale: "committed_days == 5 is asserted in that §1.8 instance."

      - name: sag_residual_period_tier_correct
        claim_type: Constants Applied
        grounds: [calculations.sag_residual]
        excluded_because:
          difficulty_instance: combinatorial_formula / sag_residual_tiered_media_period_nonlinear
          rationale: "Residual literals 150000 (period 1) and 75000 (period 3) asserted there."

      - name: payment_net_rounding_precision
        claim_type: Precision
        grounds: [calculations.payment_net_to_talent]
        excluded_because:
          difficulty_instance: combinatorial_formula / payment_net_rounding_order_pinned
          rationale: "net_to_talent_cents == 71502 (per-component rounding) asserted there."

  - section: state_machines
    instances:
      - name: deal_memo_cycle_round_count
        claim_type: cyclic
        grounds: [state_machines.DealMemo.COUNTERED_to_OFFERED]
        excluded_because:
          difficulty_instance: non_linear_state_machine / deal_memo_negotiation_cycle
          rationale: "OFFERED->COUNTERED->OFFERED loop and round_count==3 asserted there."

      - name: booking_cancel_cascade_release
        claim_type: Compensation
        grounds: [state_machines.Booking.CONFIRMED_to_CANCELLED]
        excluded_because:
          difficulty_instance: transitive_cascade / booking_cancel_depth4_cascade
          rationale: "Hold RELEASED, deal VOIDED, commission REVERSED, escrow 0 asserted there."

      - name: casting_call_close_cascade
        claim_type: Cascade down
        grounds: [state_machines.CastingCall.OPEN_to_CLOSED]
        excluded_because:
          difficulty_instance: transitive_cascade / casting_call_close_depth2_cascade
          rationale: "Submission WITHDRAWN and slot RELEASED asserted there."

  - section: validations
    instances:
      - name: slot_overlap_violation
        claim_type: Temporal validation
        grounds: ["validations[priority=9]"]
        excluded_because:
          difficulty_instance: resource_temporal_overlap / audition_slot_buffered_overlap_rejected
          rationale: "ERR_SLOT_OVERLAP asserted there."

      - name: hold_overlap_violation
        claim_type: Temporal validation
        grounds: ["validations[priority=10]"]
        excluded_because:
          difficulty_instance: resource_temporal_overlap / availability_hold_same_kind_overlap_rejected
          rationale: "ERR_HOLD_OVERLAP asserted there."

      - name: escrow_insufficient_priority
        claim_type: Priority conflict
        grounds: ["validations[priority=13]"]
        excluded_because:
          difficulty_instance: priority_pair_validation_conflict / payment_referential_beats_fiscal
          rationale: "Escrow check ordering relative to ERR_TALENT_MISMATCH asserted there."

  - section: consistency_model
    instances:
      - name: immediate_visibility_on_confirm
        claim_type: immediate
        grounds: [state_machines.Booking.PENDING_to_CONFIRMED]
        excluded_because:
          difficulty_instance: compensating_invariant / escrow_money_conserved_confirm_then_cancel
          rationale: "Escrow change is visible in the same request's response chain there."
