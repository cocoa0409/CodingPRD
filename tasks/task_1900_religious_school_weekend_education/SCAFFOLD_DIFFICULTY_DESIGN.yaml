            - { call: "POST /school/teachers/${t_id}/vet", payload: {}, as: SchoolAdmin }
            - { call: "POST /school/teachers/${t_id}/hire", payload: {}, as: SchoolAdmin }
            - { call: "POST /school/school-years/${y_id}/sections", payload: { grade: "G2", hebrew_level: "BEGINNER", capacity: 2, room: "R1", day_of_week: "SUN", start_time: "10:00", end_time: "11:30", teacher_id: "${t_id}" }, as: SchoolAdmin, captures: { sec_id: $.data.id, sv: $.data.version } }
            - { call: "POST /school/families", payload: { family_name: "Fam E", primary_email: "e@x.org", membership_status: "MEMBER" }, as: SchoolAdmin, captures: { fam_id: $.data.id } }
            - { call: "POST /school/families/${fam_id}/students", payload: { full_name: "E1", grade: "G2", hebrew_level: "BEGINNER" }, as: SchoolAdmin, captures: { st1: $.data.id } }
            - { call: "POST /school/families/${fam_id}/students", payload: { full_name: "E2", grade: "G2", hebrew_level: "BEGINNER" }, as: SchoolAdmin, captures: { st2: $.data.id } }
            - { call: "POST /school/families/${fam_id}/students", payload: { full_name: "E3", grade: "G2", hebrew_level: "BEGINNER" }, as: SchoolAdmin, captures: { st3: $.data.id } }
            - { call: "POST /school/sections/${sec_id}/enrollments", payload: { student_id: "${st1}", expected_section_version: "${sv}" }, as: SchoolAdmin }
            - { call: "GET /school/sections/${sec_id}", payload: {}, as: SchoolAdmin, captures: { sv: $.data.version } }
            - { call: "POST /school/sections/${sec_id}/enrollments", payload: { student_id: "${st2}", expected_section_version: "${sv}" }, as: SchoolAdmin }
            - { call: "GET /school/sections/${sec_id}", payload: {}, as: SchoolAdmin, captures: { sv: $.data.version, full_count: $.data.enrolled_count, full_status: $.data.status } }
