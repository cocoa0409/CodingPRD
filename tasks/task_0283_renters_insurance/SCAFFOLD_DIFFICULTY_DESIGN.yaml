# =============================================================================
# §1.8 Scaffold Difficulty Design (Test Targeting Index) — Renters Insurance
# 9 Difficulty Rules x >=2 instances = 18 instances.
# Every grounds[] ref resolves into SCAFFOLD.yaml §1.1–§1.7.
# All formula-derived asserts are pre-computed literals.
# =============================================================================
scaffold_difficulty_design:

  # ===========================================================================
  - rule_id: dual_variant_calc
    instances:
      - name: claim_settlement_rcv_vs_acv_same_items_diverge
        grounds:
          - calculations.claim_settlement
          - state_machines.Claim.UNDER_REVIEW_to_APPROVED
          - entities.Claim.fields.valuation_method
          - entities.ClaimItem.fields.covered_item_cents
        distinguishing_aspect: |
          On the Claim entity domain, two valid valuations of the SAME two claim
          items produce different settlements: RCV pays 175000, ACV pays 67000
          (delta 108000) — depreciation is the only difference.
        test_recipe:
          setup:
            - "Two ACTIVE standard policies for one policyholder, one with pp_valuation_method=RCV and one with pp_valuation_method=ACV; each holds identical PERSONAL_PROPERTY coverage (limit 3000000) and deductible 25000."
            - "Each policy has a FILED PERSONAL_PROPERTY claim with the SAME two items: rc=120000/age=24/life=60 and rc=80000/age=90/life=120."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-06-01T00:00:00Z" }
              as: Underwriter
            - call: "POST /policyholders"
              payload: { email: "dv1@x.com", full_name: "DV One", mailing_address: "1 A St" }
              as: Underwriter
              captures: { ph_id: $.data.id }
            # --- RCV policy ---
            - call: "POST /policies"
              payload: { policyholder_id: "${ph_id}", insured_address: "10 R St", territory_code: "STANDARD", effective_date: "2026-01-01T00:00:00Z", expiry_date: "2027-01-01T00:00:00Z", deductible_cents: 25000, pp_valuation_method: "RCV", billing_mode: "ANNUAL" }
              as: Underwriter
              captures: { rcv_pol: $.data.id, rcv_v0: $.data.version }
            - call: "POST /policies/${rcv_pol}/coverage-lines"
              payload: { coverage_type: "PERSONAL_PROPERTY", limit_cents: 3000000, expected_policy_version: "${rcv_v0}" }
              as: Underwriter
              captures: { rcv_cl_pp: $.data.id, rcv_v1: $.data.version }
            - call: "POST /policies/${rcv_pol}/coverage-lines"
              payload: { coverage_type: "LIABILITY", limit_cents: 10000000, expected_policy_version: "${rcv_v1}" }
              as: Underwriter
              captures: { rcv_v2: $.data.version }
            - call: "POST /policies/${rcv_pol}/coverage-lines"
              payload: { coverage_type: "LOSS_OF_USE", limit_cents: 900000, expected_policy_version: "${rcv_v2}" }
              as: Underwriter
            - call: "POST /policies/${rcv_pol}/issue"
              payload: {}
              as: Underwriter
            - call: "POST /policies/${rcv_pol}/claims"
              payload: { loss_type: "PERSONAL_PROPERTY", loss_date: "2026-03-01T00:00:00Z" }
              as: Policyholder
              as_user_id: "${ph_id}"
              captures: { rcv_claim: $.data.id }
            - call: "POST /claims/${rcv_claim}/items"
              payload: { coverage_line_id: "${rcv_cl_pp}", replacement_cost_cents: 120000, age_months: 24, useful_life_months: 60 }
              as: Policyholder
              as_user_id: "${ph_id}"
            - call: "POST /claims/${rcv_claim}/items"
              payload: { coverage_line_id: "${rcv_cl_pp}", replacement_cost_cents: 80000, age_months: 90, useful_life_months: 120 }
              as: Policyholder
              as_user_id: "${ph_id}"
            # --- ACV policy ---
            - call: "POST /policies"
              payload: { policyholder_id: "${ph_id}", insured_address: "20 R St", territory_code: "STANDARD", effective_date: "2026-01-01T00:00:00Z", expiry_date: "2027-01-01T00:00:00Z", deductible_cents: 25000, pp_valuation_method: "ACV", billing_mode: "ANNUAL" }
              as: Underwriter
              captures: { acv_pol: $.data.id, acv_v0: $.data.version }
            - call: "POST /policies/${acv_pol}/coverage-lines"
              payload: { coverage_type: "PERSONAL_PROPERTY", limit_cents: 3000000, expected_policy_version: "${acv_v0}" }
              as: Underwriter
              captures: { acv_cl_pp: $.data.id, acv_v1: $.data.version }
            - call: "POST /policies/${acv_pol}/coverage-lines"
              payload: { coverage_type: "LIABILITY", limit_cents: 10000000, expected_policy_version: "${acv_v1}" }
              as: Underwriter
              captures: { acv_v2: $.data.version }
            - call: "POST /policies/${acv_pol}/coverage-lines"
              payload: { coverage_type: "LOSS_OF_USE", limit_cents: 900000, expected_policy_version: "${acv_v2}" }
              as: Underwriter
            - call: "POST /policies/${acv_pol}/issue"
              payload: {}
              as: Underwriter
            - call: "POST /policies/${acv_pol}/claims"
              payload: { loss_type: "PERSONAL_PROPERTY", loss_date: "2026-03-01T00:00:00Z" }
              as: Policyholder
              as_user_id: "${ph_id}"
              captures: { acv_claim: $.data.id }
            - call: "POST /claims/${acv_claim}/items"
              payload: { coverage_line_id: "${acv_cl_pp}", replacement_cost_cents: 120000, age_months: 24, useful_life_months: 60 }
              as: Policyholder
              as_user_id: "${ph_id}"
            - call: "POST /claims/${acv_claim}/items"
              payload: { coverage_line_id: "${acv_cl_pp}", replacement_cost_cents: 80000, age_months: 90, useful_life_months: 120 }
              as: Policyholder
              as_user_id: "${ph_id}"
          trigger:
            - call: "POST /claims/${rcv_claim}/start-review"
              payload: {}
              as: ClaimsAdjuster
            - call: "POST /claims/${acv_claim}/start-review"
              payload: {}
              as: ClaimsAdjuster
          assert:
            - "Claim.${rcv_claim}.covered_loss_cents == 200000"
            - "Claim.${rcv_claim}.settlement_cents == 175000"
            - "Claim.${acv_claim}.covered_loss_cents == 92000"
            - "Claim.${acv_claim}.settlement_cents == 67000"

      - name: cancellation_refund_pro_rata_vs_short_rate_diverge
        grounds:
          - calculations.cancellation_refund
          - state_machines.Policy.ACTIVE_to_CANCELLED
          - entities.Policy.fields.refund_method
          - entities.Policy.fields.refund_amount_cents
        distinguishing_aspect: |
          On the Policy entity domain, two valid refund algorithms over the SAME
          paid premium (33350) cancelled at the same instant (73 days elapsed)
          diverge: PRO_RATA refunds 26680, SHORT_RATE refunds 23345 (10% penalty 3335).
        test_recipe:
          setup:
            - "Two ACTIVE standard policies for one policyholder, each with annual premium 33350 fully paid; clock advanced to 73 days after the 2026-01-01 effective date."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-01-01T00:00:00Z" }
              as: Underwriter
            - call: "POST /policyholders"
              payload: { email: "ref@x.com", full_name: "Ref Holder", mailing_address: "2 B St" }
              as: Underwriter
              captures: { ph_id: $.data.id }
            # policy P (pro-rata)
            - call: "POST /policies"
              payload: { policyholder_id: "${ph_id}", insured_address: "11 P St", territory_code: "STANDARD", effective_date: "2026-01-01T00:00:00Z", expiry_date: "2027-01-01T00:00:00Z", deductible_cents: 25000, pp_valuation_method: "RCV", billing_mode: "ANNUAL" }
              as: Underwriter
              captures: { polp: $.data.id, polp_v0: $.data.version }
            - call: "POST /policies/${polp}/coverage-lines"
              payload: { coverage_type: "PERSONAL_PROPERTY", limit_cents: 3000000, expected_policy_version: "${polp_v0}" }
              as: Underwriter
              captures: { polp_v1: $.data.version }
            - call: "POST /policies/${polp}/coverage-lines"
              payload: { coverage_type: "LIABILITY", limit_cents: 10000000, expected_policy_version: "${polp_v1}" }
              as: Underwriter
              captures: { polp_v2: $.data.version }
            - call: "POST /policies/${polp}/coverage-lines"
              payload: { coverage_type: "LOSS_OF_USE", limit_cents: 900000, expected_policy_version: "${polp_v2}" }
              as: Underwriter
            - call: "POST /policies/${polp}/issue"
              payload: {}
              as: Underwriter
            - call: "GET /premium-invoices?policy_id=${polp}"
              payload: {}
              as: Underwriter
              captures: { polp_inv: "$.data[0].id" }
            - call: "POST /premium-invoices/${polp_inv}/payments"
              payload: { amount_cents: 33350, method: "CARD" }
              as: Policyholder
              as_user_id: "${ph_id}"
            # policy Q (short-rate) — identical
            - call: "POST /policies"
              payload: { policyholder_id: "${ph_id}", insured_address: "12 Q St", territory_code: "STANDARD", effective_date: "2026-01-01T00:00:00Z", expiry_date: "2027-01-01T00:00:00Z", deductible_cents: 25000, pp_valuation_method: "RCV", billing_mode: "ANNUAL" }
              as: Underwriter
              captures: { polq: $.data.id, polq_v0: $.data.version }
            - call: "POST /policies/${polq}/coverage-lines"
              payload: { coverage_type: "PERSONAL_PROPERTY", limit_cents: 3000000, expected_policy_version: "${polq_v0}" }
              as: Underwriter
              captures: { polq_v1: $.data.version }
            - call: "POST /policies/${polq}/coverage-lines"
              payload: { coverage_type: "LIABILITY", limit_cents: 10000000, expected_policy_version: "${polq_v1}" }
              as: Underwriter
              captures: { polq_v2: $.data.version }
            - call: "POST /policies/${polq}/coverage-lines"
              payload: { coverage_type: "LOSS_OF_USE", limit_cents: 900000, expected_policy_version: "${polq_v2}" }
              as: Underwriter
            - call: "POST /policies/${polq}/issue"
              payload: {}
              as: Underwriter
            - call: "GET /premium-invoices?policy_id=${polq}"
              payload: {}
              as: Underwriter
              captures: { polq_inv: "$.data[0].id" }
            - call: "POST /premium-invoices/${polq_inv}/payments"
              payload: { amount_cents: 33350, method: "CARD" }
              as: Policyholder
              as_user_id: "${ph_id}"
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-03-15T00:00:00Z" }
              as: Underwriter
          trigger:
            - call: "POST /policies/${polp}/cancel"
              payload: { refund_method: "PRO_RATA" }
              as: Underwriter
            - call: "POST /policies/${polq}/cancel"
              payload: { refund_method: "SHORT_RATE" }
              as: Underwriter
          assert:
            - "Policy.${polp}.refund_amount_cents == 26680"
            - "Policy.${polq}.refund_amount_cents == 23345"

  # ===========================================================================
  - rule_id: combinatorial_formula
    instances:
      - name: premium_tiered_territory_times_bundle_with_scheduled_surcharge
        claim_note: "Rule 2 mode (a): >=3 inputs, tiered selection x multiplier"
        grounds:
          - calculations.premium_calculation
          - state_machines.Policy.QUOTED_to_ACTIVE
          - entities.Policy.fields.annual_premium_cents
          - entities.Policy.fields.territory_code
        distinguishing_aspect: |
          mode (a): premium combines >=3 inputs non-linearly — base fee + four
          per-component rounded rate products, then a tiered TERRITORY_FACTORS
          selection (HIGH=1.25) multiplied by the bundle factor; a STANDARD
          policy with one 500000 scheduled item issues at annual_premium_cents 42350.
        test_recipe:
          setup:
            - "A QUOTED standard policy (STANDARD territory, no bundle) with all three coverage lines (pp 3000000, liab 10000000, lou 900000) and one scheduled item appraised 500000, then issued."
          setup_api_calls:
            - call: "POST /policyholders"
              payload: { email: "prem@x.com", full_name: "Prem H", mailing_address: "3 C St" }
              as: Underwriter
              captures: { ph_id: $.data.id }
            - call: "POST /policies"
              payload: { policyholder_id: "${ph_id}", insured_address: "13 S St", territory_code: "STANDARD", effective_date: "2026-01-01T00:00:00Z", expiry_date: "2027-01-01T00:00:00Z", deductible_cents: 25000, pp_valuation_method: "RCV", billing_mode: "ANNUAL" }
              as: Underwriter
              captures: { pol: $.data.id, v0: $.data.version }
            - call: "POST /policies/${pol}/coverage-lines"
              payload: { coverage_type: "PERSONAL_PROPERTY", limit_cents: 3000000, expected_policy_version: "${v0}" }
              as: Underwriter
              captures: { v1: $.data.version }
            - call: "POST /policies/${pol}/coverage-lines"
              payload: { coverage_type: "LIABILITY", limit_cents: 10000000, expected_policy_version: "${v1}" }
              as: Underwriter
              captures: { v2: $.data.version }
            - call: "POST /policies/${pol}/coverage-lines"
              payload: { coverage_type: "LOSS_OF_USE", limit_cents: 900000, expected_policy_version: "${v2}" }
              as: Underwriter
              captures: { v3: $.data.version }
            - call: "POST /policies/${pol}/scheduled-items"
              payload: { description: "ring", appraised_value_cents: 500000, deductible_waived: true, expected_policy_version: "${v3}" }
              as: Underwriter
          trigger:
            - call: "POST /policies/${pol}/issue"
              payload: {}
              as: Underwriter
              captures: { final_premium: $.data.annual_premium_cents }
          assert:
            - "Policy.${pol}.annual_premium_cents == 42350"
            - "Policy.${pol}.status == ACTIVE"

      - name: claim_settlement_round_per_item_then_sum_order_pinned
        claim_note: "Rule 2 mode (b): nested rounding where order matters"
        grounds:
          - calculations.claim_settlement
          - entities.ClaimItem.fields.covered_item_cents
          - entities.Claim.fields.covered_loss_cents
          - state_machines.Claim.FILED_to_UNDER_REVIEW
        distinguishing_aspect: |
          mode (b): two ACV items each value to 5000.5 cents (rc 10001, dep 0.5);
          the PINNED order rounds each item first (5001 each) then sums to
          covered_loss_cents 10002 — sum-then-round would give 10001. The 1-cent
          gap proves the order is enforced.
        test_recipe:
          setup:
            - "An ACTIVE ACV policy with a FILED PERSONAL_PROPERTY claim holding two items, each rc=10001 age=30 life=60 (depreciation 0.5)."
          setup_api_calls:
            - call: "POST /policyholders"
              payload: { email: "rnd@x.com", full_name: "Rnd H", mailing_address: "4 D St" }
              as: Underwriter
              captures: { ph_id: $.data.id }
            - call: "POST /policies"
              payload: { policyholder_id: "${ph_id}", insured_address: "14 T St", territory_code: "STANDARD", effective_date: "2026-01-01T00:00:00Z", expiry_date: "2027-01-01T00:00:00Z", deductible_cents: 0, pp_valuation_method: "ACV", billing_mode: "ANNUAL" }
              as: Underwriter
              captures: { pol: $.data.id, v0: $.data.version }
            - call: "POST /policies/${pol}/coverage-lines"
              payload: { coverage_type: "PERSONAL_PROPERTY", limit_cents: 3000000, expected_policy_version: "${v0}" }
              as: Underwriter
              captures: { cl_pp: $.data.id, v1: $.data.version }
            - call: "POST /policies/${pol}/coverage-lines"
              payload: { coverage_type: "LIABILITY", limit_cents: 10000000, expected_policy_version: "${v1}" }
              as: Underwriter
              captures: { v2: $.data.version }
            - call: "POST /policies/${pol}/coverage-lines"
              payload: { coverage_type: "LOSS_OF_USE", limit_cents: 900000, expected_policy_version: "${v2}" }
              as: Underwriter
            - call: "POST /policies/${pol}/issue"
              payload: {}
              as: Underwriter
            - call: "POST /policies/${pol}/claims"
              payload: { loss_type: "PERSONAL_PROPERTY", loss_date: "2026-03-01T00:00:00Z" }
              as: Policyholder
              as_user_id: "${ph_id}"
              captures: { claim: $.data.id }
            - call: "POST /claims/${claim}/items"
              payload: { coverage_line_id: "${cl_pp}", replacement_cost_cents: 10001, age_months: 30, useful_life_months: 60 }
              as: Policyholder
              as_user_id: "${ph_id}"
            - call: "POST /claims/${claim}/items"
              payload: { coverage_line_id: "${cl_pp}", replacement_cost_cents: 10001, age_months: 30, useful_life_months: 60 }
              as: Policyholder
              as_user_id: "${ph_id}"
          trigger:
            - call: "POST /claims/${claim}/start-review"
              payload: {}
              as: ClaimsAdjuster
              captures: { loss: $.data.covered_loss_cents }
          assert:
            - "Claim.${claim}.covered_loss_cents == 10002"
            - "Claim.${claim}.settlement_cents == 10002"

  # ===========================================================================
  - rule_id: non_linear_state_machine
    instances:
      - name: policy_lapse_reinstate_cycle
        grounds:
          - state_machines.Policy.ACTIVE_to_LAPSED
          - state_machines.Policy.LAPSED_to_ACTIVE
          - entities.Policy.fields.reinstatement_count
        distinguishing_aspect: |
          Policy is a CYCLE: ACTIVE -> LAPSED -> ACTIVE on the same row;
          reinstatement_count increments to 1 after the loop closes, proving the
          back-edge exists (not a linear pipeline).
        test_recipe:
          setup:
            - "An ACTIVE standard policy with an unpaid annual invoice; clock advanced past due_date+GRACE_DAYS so process-billing lapses it; then overdue premium + reinstatement fee paid."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-01-01T00:00:00Z" }
              as: Underwriter
            - call: "POST /policyholders"
              payload: { email: "cyc@x.com", full_name: "Cyc H", mailing_address: "5 E St" }
              as: Underwriter
              captures: { ph_id: $.data.id }
            - call: "POST /policies"
              payload: { policyholder_id: "${ph_id}", insured_address: "15 U St", territory_code: "STANDARD", effective_date: "2026-01-01T00:00:00Z", expiry_date: "2027-01-01T00:00:00Z", deductible_cents: 25000, pp_valuation_method: "RCV", billing_mode: "ANNUAL" }
              as: Underwriter
              captures: { pol: $.data.id, v0: $.data.version }
            - call: "POST /policies/${pol}/coverage-lines"
              payload: { coverage_type: "PERSONAL_PROPERTY", limit_cents: 3000000, expected_policy_version: "${v0}" }
              as: Underwriter
              captures: { v1: $.data.version }
            - call: "POST /policies/${pol}/coverage-lines"
              payload: { coverage_type: "LIABILITY", limit_cents: 10000000, expected_policy_version: "${v1}" }
              as: Underwriter
              captures: { v2: $.data.version }
            - call: "POST /policies/${pol}/coverage-lines"
              payload: { coverage_type: "LOSS_OF_USE", limit_cents: 900000, expected_policy_version: "${v2}" }
              as: Underwriter
            - call: "POST /policies/${pol}/issue"
              payload: {}
              as: Underwriter
            - call: "GET /premium-invoices?policy_id=${pol}"
              payload: {}
              as: Underwriter
              captures: { inv: "$.data[0].id" }
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-01-20T00:00:00Z" }
              as: Underwriter
            - call: "POST /policies/${pol}/process-billing"
              payload: {}
              as: Underwriter
            - call: "POST /premium-invoices/${inv}/payments"
              payload: { amount_cents: 33350, method: "CARD" }
              as: Policyholder
              as_user_id: "${ph_id}"
          trigger:
            - call: "POST /policies/${pol}/reinstate"
              payload: { reinstatement_fee_paid: true }
              as: Underwriter
              captures: { rc: $.data.reinstatement_count }
          assert:
            - "Policy.${pol}.status == ACTIVE"
            - "Policy.${pol}.reinstatement_count == 1"
            - "Policy.${pol}.lapse_reason == null"

      - name: claim_branch_deny_then_appeal_then_approve_forkjoin
        grounds:
          - state_machines.Claim.UNDER_REVIEW_to_DENIED
          - state_machines.Claim.DENIED_to_UNDER_REVIEW
          - state_machines.Claim.UNDER_REVIEW_to_APPROVED
          - entities.Claim.fields.appeal_count
        distinguishing_aspect: |
          Claim is BRANCHING with a back-edge on a DIFFERENT entity than Policy:
          UNDER_REVIEW forks to DENIED, the DENIED->UNDER_REVIEW appeal closes the
          loop (appeal_count 1), and the second review approves — divergent
          side-effect sets per branch (deny zeroes settlement, approve debits limit).
        test_recipe:
          setup:
            - "An ACTIVE RCV policy with a FILED PERSONAL_PROPERTY claim (one item rc=120000) moved to UNDER_REVIEW then DENIED."
          setup_api_calls:
            - call: "POST /policyholders"
              payload: { email: "brn@x.com", full_name: "Brn H", mailing_address: "6 F St" }
              as: Underwriter
              captures: { ph_id: $.data.id }
            - call: "POST /policies"
              payload: { policyholder_id: "${ph_id}", insured_address: "16 V St", territory_code: "STANDARD", effective_date: "2026-01-01T00:00:00Z", expiry_date: "2027-01-01T00:00:00Z", deductible_cents: 25000, pp_valuation_method: "RCV", billing_mode: "ANNUAL" }
              as: Underwriter
              captures: { pol: $.data.id, v0: $.data.version }
            - call: "POST /policies/${pol}/coverage-lines"
              payload: { coverage_type: "PERSONAL_PROPERTY", limit_cents: 3000000, expected_policy_version: "${v0}" }
              as: Underwriter
              captures: { cl_pp: $.data.id, v1: $.data.version }
            - call: "POST /policies/${pol}/coverage-lines"
              payload: { coverage_type: "LIABILITY", limit_cents: 10000000, expected_policy_version: "${v1}" }
              as: Underwriter
              captures: { v2: $.data.version }
            - call: "POST /policies/${pol}/coverage-lines"
              payload: { coverage_type: "LOSS_OF_USE", limit_cents: 900000, expected_policy_version: "${v2}" }
              as: Underwriter
            - call: "POST /policies/${pol}/issue"
              payload: {}
              as: Underwriter
            - call: "POST /policies/${pol}/claims"
              payload: { loss_type: "PERSONAL_PROPERTY", loss_date: "2026-03-01T00:00:00Z" }
              as: Policyholder
              as_user_id: "${ph_id}"
              captures: { claim: $.data.id }
            - call: "POST /claims/${claim}/items"
              payload: { coverage_line_id: "${cl_pp}", replacement_cost_cents: 120000, age_months: 0, useful_life_months: 60 }
              as: Policyholder
              as_user_id: "${ph_id}"
            - call: "POST /claims/${claim}/start-review"
              payload: {}
              as: ClaimsAdjuster
            - call: "POST /claims/${claim}/deny"
              payload: { denial_reason: "insufficient documentation" }
              as: ClaimsAdjuster
          trigger:
            - call: "POST /claims/${claim}/appeal"
              payload: {}
              as: ClaimsAdjuster
              captures: { ac: $.data.appeal_count }
            - call: "POST /claims/${claim}/approve"
              payload: {}
              as: ClaimsAdjuster
          assert:
            - "Claim.${claim}.appeal_count == 1"
            - "Claim.${claim}.status == APPROVED"
            - "Claim.${claim}.settlement_cents == 95000"

  # ===========================================================================
  - rule_id: transitive_cascade
    instances:
      - name: payment_overdue_lapse_suspends_claims_and_coverage_depth4
        grounds:
          - state_machines.Policy.ACTIVE_to_LAPSED
          - entities.CoverageLine.fields.status
          - entities.ScheduledItem.fields.status
          - entities.Claim.fields.status
        distinguishing_aspect: |
          Depth-4 chain from ONE trigger (process-billing): now>=due+grace flips
          the invoice OVERDUE -> that drives Policy ACTIVE->LAPSED -> the lapse
          suspends every OPEN CoverageLine -> and suspends the FILED Claim; each
          hop is caused by the prior hop, not by process-billing directly.
        test_recipe:
