# =============================================================================
# SCAFFOLD.yaml — Veterinary Diagnostic Instrument Placement & Reagent
# Subscription (task_3448)
#
# Seed tables §1.0–§1.7. §1.8 lives in SCAFFOLD_DIFFICULTY_DESIGN.yaml and
# §1.9 in SCAFFOLD_CORNER_DESIGN.yaml (neither key appears here).
# =============================================================================

scenario: |
  Veterinary Diagnostic Instrument Placement & Reagent Subscription (IDEXX
  Laboratories): analyzer placement in veterinary clinics through purchase,
  lease or reagent-commitment programs with multi-year terms, consumable
  pull-through modeling where slide and cartridge volume determines program
  economics, minimum purchase commitments with shortfall billing and
  renegotiation when a clinic's caseload changes, reference laboratory
  send-out integration where in-clinic and laboratory results appear in one
  record, instrument connectivity for result delivery into practice
  management software with interface maintenance, service and calibration
  programs with loaner instruments and uptime commitments, quality control
  material distribution and proficiency verification for clinic-run testing,
  corporate group and buying group pricing agreements layered over individual
  clinic contracts.

domain_name: veterinary-diagnostics-placement
api_prefix: /api

# =============================================================================
# Step 0: Complexity Profile
# =============================================================================
complexity_profile:
  primary_archetype: pricing_engine
  # Layered price resolution (agreement override -> corporate group discount ->
  # buying group discount -> list) plus minimum-commitment shortfall billing.
  secondary_archetype: temporal_windowing
  # Group pricing agreements and placement terms are half-open / closed
  # interval occupations with overlap rejection; a logical clock drives all
  # deferred activations, expiries, QC lapses and term completions.
  complexity_layers:
    - dual_variant_calculation
    - cascading_side_effects
    - optimistic_concurrency
    - scheduled_actions
  entity_topology: flat
  # All resources are flat collections keyed by UUID; FKs travel in request
  # bodies and filter parameters. Two sub-resource GETs exist only where a
  # child is system-created and needs a discovery channel.
  state_machine_shape: cyclic
  # Signature machine is the PlacementAgreement renegotiation loop
  # ACTIVE <-> RENEGOTIATION; Analyzer and CommitmentPeriod additionally carry
  # parallel state dimensions; LabTestOrder forks on origin.
  relationship_patterns:
    - one_to_many
    - cross_aggregate
    - self_referential   # ServiceCase.loaner_analyzer_id -> Analyzer.id
  role_model: segregation_of_duties
  # PlacementAgreement: ClinicManager drafts -> FinanceReviewer approves ->
  # PlatformAdmin activates; renegotiation is requested by ClinicManager and
  # resolved by FinanceReviewer. No role performs its neighbor's step.
  consistency_model: immediate
  # Every mutation (including cascades and computed-field recomputes) is
  # visible in the same request's response.

# =============================================================================
# §1.0 Response Envelope (FIXED — verbatim)
# =============================================================================
response_envelope:
  success: |
    { "meta": { "api_request_id": "req_xxx", "api_request_timestamp": "ISO8601" },
      "response_type": "object" | "array", "data": {} }
  error: |
    { "meta": { ... }, "response_type": "error",
      "data": { "error_id": "ERR_XXX", "message": "..." } }
  pagination_fields: ["limit", "offset", "total_count", "has_more"]
  pagination_defaults: { limit: 10, min: 1, max: 100, offset: 0 }

# =============================================================================
# §1.1 Entity-Relationship Table (9 entities, flat topology)
# =============================================================================
entities:
  - name: GroupPricingAgreement
    parent: null
    common_fields: true
    fields:
      - { name: group_type, type: enum, source: input, description: "CORPORATE | BUYING — which kind of group organization this agreement prices for" }
      - { name: group_code, type: string, source: input, description: "Free-form group identifier matched against Clinic.corporate_group_code / Clinic.buying_group_code" }
      - { name: effective_from, type: datetime, source: input, description: "Inclusive start of the pricing window (ISO 8601 UTC)" }
      - { name: effective_to, type: datetime, source: input, description: "Exclusive end of the pricing window; must be strictly greater than effective_from and strictly greater than the logical clock at creation" }
      - { name: discount_pct, type: number, source: input, description: "Fractional discount applied to list unit prices, 0 <= discount_pct <= 0.40 (MAX_DISCOUNT_PCT)" }
      - { name: sku_overrides, type: array, source: input, default: [], description: "Array of { sku, unit_price_cents } overriding list price for specific SKUs; each sku must exist in PRICE_TABLE" }
      - { name: status, type: enum, source: system, description: "ACTIVE if effective_from <= clock at creation else DRAFT; DRAFT -> ACTIVE and ACTIVE -> EXPIRED are applied by the logical-clock sweep; EXPIRED is terminal" }

  - name: Clinic
    parent: null
    common_fields: true
    fields:
      - { name: name, type: string, source: input, description: "Clinic display name" }
      - { name: corporate_group_code, type: string, source: input, default: null, description: "Optional corporate group membership code; when set, ONLY corporate GroupPricingAgreements with this code apply to this clinic's pricing (corporate precedence)" }
      - { name: buying_group_code, type: string, source: input, default: null, description: "Optional buying-group membership code; consulted only when corporate_group_code is null" }
      - { name: caseload_baseline_tests, type: integer, source: input, description: "Contracted baseline monthly test volume declared at onboarding; must be > 0" }
      - { name: caseload_current_tests, type: integer, source: input, description: "Current monthly test volume; initialized to caseload_baseline_tests at creation; mutable via PATCH while clinic is ACTIVE; drives the renegotiation gate" }
      - { name: status, type: enum, source: system, description: "ACTIVE (initial) <-> SUSPENDED -> TERMINATED; TERMINATED is terminal; SUSPENDED is also applied by the PlacementAgreement breach cascade" }

  - name: PlacementAgreement
    parent: null
    common_fields: true
    fields:
      - { name: clinic_id, type: string, source: input, description: "FK -> Clinic.id; owning clinic" }
      - { name: model, type: enum, source: input, description: "VETCHEM_300 | VETHEMAT_500 | VETURINE_200 — analyzer model placed under this agreement" }
      - { name: program_type, type: enum, source: input, description: "PURCHASE | LEASE | REAGENT_COMMITMENT" }
      - { name: term_months, type: integer, source: input, description: "Contract length; must be one of ALLOWED_TERM_MONTHS {24, 36, 48, 60}" }
      - { name: start_date, type: datetime, source: input, description: "Inclusive contractual start (ISO 8601 UTC)" }
      - { name: end_date, type: datetime, source: computed, description: "Read-only = start_date + term_months calendar months (same day-of-month); computed at creation" }
      - { name: monthly_minimum_cents, type: integer, source: input, description: "Required iff program_type == REAGENT_COMMITMENT; >= MIN_MONTHLY_MINIMUM_CENTS (50000); mutated by renegotiation resolution" }
      - { name: lease_rate_cents, type: integer, source: input, description: "Required iff program_type == LEASE; monthly lease charge; null otherwise" }
      - { name: purchase_price_cents, type: integer, source: input, description: "Required iff program_type == PURCHASE; one-time instrument price; null otherwise" }
      - { name: baseline_caseload_snapshot, type: integer, source: system, description: "Clinic.caseload_current_tests captured at activation; the fixed reference for the renegotiation caseload gate" }
      - { name: proposed_minimum_cents, type: integer, source: computed, description: "Renegotiation proposal computed at request-renegotiation: max(MIN_MONTHLY_MINIMUM_CENTS, round_half_up(monthly_minimum_cents * caseload_current_tests / baseline_caseload_snapshot)); null outside RENEGOTIATION" }
      - { name: cumulative_billed_cents, type: integer, source: computed, default: 0, description: "Sum of billed_cents over ALL CLOSED CommitmentPeriods of this agreement (regardless of billing_status); maintained on close/waive" }
      - { name: cumulative_unpaid_billed_cents, type: integer, source: computed, default: 0, description: "Sum of billed_cents over CLOSED CommitmentPeriods with billing_status == ISSUED; debited at close, credited by record-payment and waive" }
      - { name: service_credit_cents, type: integer, source: computed, default: 0, description: "Accumulated uptime-breach service credits (UPTIME_SERVICE_CREDIT_CENTS per qualifying ServiceCase resolve)" }
      - { name: status, type: enum, source: system, description: "DRAFT -> APPROVED -> ACTIVE <-> RENEGOTIATION -> COMPLETED | BREACHED -> ACTIVE | COMPLETED (recovery); COMPLETED is the only terminal state" }

  - name: Analyzer
    parent: null
    common_fields: true
    fields:
      - { name: clinic_id, type: string, source: input, description: "FK -> Clinic.id; clinic where the instrument is installed" }
      - { name: agreement_id, type: string, source: input, description: "FK -> PlacementAgreement.id; placement agreement this unit is installed under; the agreement must be ACTIVE and its model is copied onto this analyzer" }
      - { name: model, type: enum, source: system, description: "Copied from PlacementAgreement.model at creation (VETCHEM_300 | VETHEMAT_500 | VETURINE_200)" }
      - { name: serial_number, type: string, source: input, description: "Manufacturer serial; unique across all analyzers" }
      - { name: is_loaner_unit, type: boolean, source: input, default: false, description: "True marks a service-fleet loaner eligible for ServiceCase.loaner_analyzer_id assignment" }
      - { name: operational_status, type: enum, source: system, description: "INSTALLED (initial) -> IN_SERVICE <-> UNDER_SERVICE; IN_SERVICE <-> ON_LOAN (loaner assignment/return); INSTALLED | IN_SERVICE -> DECOMMISSIONED (terminal)" }
      - { name: connectivity_status, type: enum, source: system, description: "Independent PIMS-interface dimension: NOT_CONFIGURED (initial) -> ACTIVE <-> DEGRADED; frozen while DECOMMISSIONED" }
      - { name: proficiency_standing, type: enum, source: system, description: "LAPSED (initial) -> CURRENT on proficiency PASS; CURRENT -> LAPSED on proficiency FAIL or when the clock passes qc_valid_until" }
      - { name: qc_valid_until, type: datetime, source: computed, description: "Set to resulted_at + QC_VALIDITY_DAYS (30 days) on each proficiency PASS; null until the first PASS" }
      - { name: total_downtime_hours, type: integer, source: computed, default: 0, description: "Cumulative downtime_hours from RESOLVED ServiceCases (all time)" }
      - { name: reported_uptime_pct, type: number, source: computed, default: 1.0, description: "Reporting variant of uptime over the trailing UPTIME_WINDOW_HOURS (2160h): excludes up to CALIBRATION_FREE_HOURS_PER_YEAR (16h) of PREVENTIVE_CALIBRATION downtime; 4 decimal places, round_half_up" }
      - { name: breach_uptime_pct, type: number, source: computed, default: 1.0, description: "Breach variant of uptime over the trailing window: counts ALL downtime; a ServiceCase resolve that leaves breach_uptime_pct < UPTIME_BREACH_THRESHOLD_PCT (0.985) credits the agreement" }

  - name: ReagentOrder
    parent: null
    common_fields: true
    fields:
      - { name: clinic_id, type: string, source: input, description: "FK -> Clinic.id; ordering clinic" }
      - { name: agreement_id, type: string, source: input, description: "FK -> PlacementAgreement.id; the agreement this order bills against" }
      - { name: order_month, type: string, source: input, description: "Commitment attribution month, format YYYY-MM; must fall within the agreement term months" }
      - { name: lines, type: array, source: input, description: "Non-empty array of { sku, quantity }; sku must exist in PRICE_TABLE; quantity integer > 0" }
      - { name: pricing_detail, type: object, source: computed, description: "Immutable per-line snapshot: resolved unit_price_cents, price_source (OVERRIDE | CORPORATE_DISCOUNT | BUYING_DISCOUNT | LIST | PROGRAM_INCLUDED), line_total_cents" }
      - { name: list_total_cents, type: integer, source: computed, description: "Sum of list_price_cents * quantity over lines (no discounts)" }
      - { name: final_total_cents, type: integer, source: computed, description: "Sum of per-line round_half_up(effective_unit_price_cents) * quantity after layered price resolution; computed and locked at creation" }
      - { name: fulfilled_at, type: datetime, source: system, description: "Logical-clock timestamp of fulfillment; null while SUBMITTED or CANCELLED" }
      - { name: status, type: enum, source: system, description: "SUBMITTED (initial) -> FULFILLED | CANCELLED; both terminal" }

  - name: CommitmentPeriod
    parent: null
    common_fields: true
    fields:
      - { name: agreement_id, type: string, source: system, description: "FK -> PlacementAgreement.id; owning agreement" }
      - { name: period_month, type: string, source: system, description: "YYYY-MM; one row per term month, created at agreement activation" }
      - { name: minimum_cents, type: integer, source: computed, description: "Commitment for this month; initialized from PlacementAgreement.monthly_minimum_cents at activation; renegotiation resolution rewrites OPEN periods only" }
      - { name: provisional_fulfilled_cents, type: integer, source: computed, description: "Read-time fulfillment-attribution total while OPEN: sum of final_total_cents over FULFILLED orders whose fulfilled_at month == period_month; null after close" }
      - { name: fulfilled_cents, type: integer, source: computed, description: "Final order-month-attribution total locked at close: sum of final_total_cents over FULFILLED orders whose order_month == period_month; null while OPEN" }
      - { name: shortfall_cents, type: integer, source: computed, description: "max(0, minimum_cents - fulfilled_cents), locked at close; null while OPEN" }
      - { name: billed_cents, type: integer, source: computed, description: "round_half_up(shortfall_cents * SHORTFALL_BILLING_RATE 0.80) locked at close; 0 when shortfall is 0; null while OPEN" }
      - { name: period_status, type: enum, source: system, description: "OPEN (initial) -> CLOSED; CLOSED is terminal" }
      - { name: billing_status, type: enum, source: system, description: "NONE (initial) -> ISSUED (at close when billed_cents > 0) -> PAID (record-payment) | WAIVED (renegotiation resolution); NONE is terminal when billed_cents == 0" }

  - name: LabTestOrder
    parent: null
    common_fields: true
    fields:
      - { name: clinic_id, type: string, source: input, description: "FK -> Clinic.id; ordering clinic" }
      - { name: analyzer_id, type: string, source: input, description: "FK -> Analyzer.id; required iff origin == IN_CLINIC; must be null for SEND_OUT; the analyzer must belong to clinic_id" }
      - { name: origin, type: enum, source: input, description: "IN_CLINIC | SEND_OUT; selects the pipeline branch" }
      - { name: order_kind, type: enum, source: input, description: "PATIENT | PROFICIENCY; PROFICIENCY requires origin == IN_CLINIC" }
      - { name: test_code, type: string, source: input, description: "Free-form panel/test code (e.g. CBC, CHEM17)" }
      - { name: expected_result, type: number, source: input, description: "Required iff order_kind == PROFICIENCY; the known assay value of the proficiency material; null for PATIENT" }
      - { name: status, type: enum, source: system, description: "ORDERED -> [SEND_OUT only: RECEIVED] -> RESULT_RECORDED -> DELIVERED; ORDERED | RECEIVED -> CANCELLED; DELIVERED and CANCELLED terminal" }
      - { name: delivery_status, type: enum, source: system, description: "NOT_READY (initial) -> PENDING (when result recorded) -> DELIVERED (PIMS push accepted)" }

  - name: LabResult
    parent: null
    common_fields: false
    fields:
      - { name: test_order_id, type: string, source: system, description: "FK -> LabTestOrder.id; 1:1 — exactly one result per test order" }
      - { name: source, type: enum, source: system, description: "IN_CLINIC | REFERENCE_LAB; copied from the order's origin so both pipelines land in this one record shape" }
      - { name: result_value, type: number, source: system, description: "Reported result, captured from the RECORD_RESULT action" }
      - { name: expected_value, type: number, source: system, description: "Copied from LabTestOrder.expected_result for proficiency orders; null for PATIENT" }
      - { name: verdict, type: enum, source: computed, description: "PROFICIENCY only: PASS iff |result_value - expected_value| <= PROFICIENCY_TOLERANCE_PCT (0.05) * expected_value (boundary inclusive); FAIL otherwise; null for PATIENT" }
      - { name: resulted_at, type: datetime, source: system, description: "Logical-clock timestamp of the RECORD_RESULT action" }

  - name: ServiceCase
    parent: null
    common_fields: true
    fields:
      - { name: analyzer_id, type: string, source: input, description: "FK -> Analyzer.id; instrument under service" }
      - { name: case_type, type: enum, source: input, description: "REPAIR | PREVENTIVE_CALIBRATION via API; PROFICIENCY_REMEDIATION is system-created only (proficiency FAIL cascade)" }
      - { name: loaner_analyzer_id, type: string, source: input, default: null, description: "FK -> Analyzer.id; optional loaner unit; must be is_loaner_unit == true and operational_status == IN_SERVICE; assigning it flips the loaner to ON_LOAN" }
      - { name: status, type: enum, source: system, description: "OPEN (initial) -> DISPATCHED -> RESOLVED; OPEN | DISPATCHED -> CANCELLED; RESOLVED and CANCELLED terminal" }
      - { name: opened_at, type: datetime, source: system, description: "Logical-clock timestamp at creation" }
      - { name: response_due_at, type: datetime, source: computed, description: "opened_at + RESPONSE_SLA_HOURS (24h)" }
      - { name: resolved_at, type: datetime, source: system, description: "Logical-clock timestamp at RESOLVE; null until resolved" }
      - { name: downtime_hours, type: integer, source: computed, description: "round_half_up((resolved_at - opened_at) in hours), computed at RESOLVE; null until resolved" }
      - { name: sla_met, type: boolean, source: computed, description: "resolved_at <= response_due_at, computed at RESOLVE; null until resolved" }
      - { name: resolution_note, type: string, source: input, default: null, description: "Optional technician note captured at RESOLVE" }

# =============================================================================
# §1.2 State Machine Table (8 machines; Analyzer and CommitmentPeriod carry
# parallel dimensions; PlacementAgreement is cyclic; LabTestOrder branches
# on origin)
# =============================================================================
state_machines:
  - entity: GroupPricingAgreement
    initial_state: DRAFT
    terminal_states: [EXPIRED]
    transitions:
      - from: DRAFT
        to: ACTIVE
        trigger: "system — logical-clock sweep: POST /api/_clock/set_current_utc with to_iso8601 >= effective_from; also applied at creation when effective_from <= clock"
        actor: system
        preconditions:
          - "logical clock >= effective_from"
        side_effects:
          - "status -> ACTIVE; increments GroupPricingAgreement.version by 1"
      - from: ACTIVE
        to: EXPIRED
        trigger: "system — logical-clock sweep: POST /api/_clock/set_current_utc with to_iso8601 >= effective_to"
        actor: system
        preconditions:
          - "logical clock >= effective_to"
        side_effects:
          - "status -> EXPIRED; increments GroupPricingAgreement.version by 1"

  - entity: Clinic
    initial_state: ACTIVE
    terminal_states: [TERMINATED]
    transitions:
      - from: ACTIVE
        to: SUSPENDED
        trigger: "PATCH /api/clinics/{id} with status SUSPENDED, or system — PlacementAgreement breach cascade"
        actor: PlatformAdmin | system
        preconditions:
          - "manual transition: actor role PlatformAdmin (status is admin-only; see §1.4 priority 2 field rule)"
        side_effects:
          - "status -> SUSPENDED; increments Clinic.version by 1"
      - from: SUSPENDED
        to: ACTIVE
        trigger: "PATCH /api/clinics/{id} with status ACTIVE"
        actor: PlatformAdmin
        preconditions:
          - "no PlacementAgreement of this clinic in BREACHED with cumulative_unpaid_billed_cents > 0 (ERR_AGREEMENT_INVALID_STATE)"
        side_effects:
          - "status -> ACTIVE; increments Clinic.version by 1"
      - from: ACTIVE
        to: TERMINATED
        trigger: "PATCH /api/clinics/{id} with status TERMINATED"
        actor: PlatformAdmin
        preconditions:
          - "every PlacementAgreement of this clinic in COMPLETED (ERR_AGREEMENT_INVALID_STATE)"
          - "no PlacementAgreement with cumulative_unpaid_billed_cents > 0 (ERR_OUTSTANDING_SHORTFALL_UNPAID)"
        side_effects:
          - "status -> TERMINATED; increments Clinic.version by 1"
      - from: SUSPENDED
        to: TERMINATED
        trigger: "PATCH /api/clinics/{id} with status TERMINATED"
        actor: PlatformAdmin
        preconditions:
          - "same two preconditions as ACTIVE -> TERMINATED"
        side_effects:
          - "status -> TERMINATED; increments Clinic.version by 1"

  - entity: PlacementAgreement
    initial_state: DRAFT
    terminal_states: [COMPLETED]
    transitions:
      - from: DRAFT
        to: APPROVED
        trigger: "POST /api/placement-agreements/{id}/approve"
        actor: FinanceReviewer
        preconditions:
          - "status == DRAFT (ERR_AGREEMENT_INVALID_STATE)"
        side_effects:
          - "status -> APPROVED; increments PlacementAgreement.version by 1"
      - from: APPROVED
        to: ACTIVE
        trigger: "POST /api/placement-agreements/{id}/activate"
        actor: PlatformAdmin
        preconditions:
          - "status == APPROVED (ERR_AGREEMENT_INVALID_STATE)"
          - "Clinic.status == ACTIVE (ERR_CLINIC_NOT_ACTIVE)"
          - "Clinic.caseload_current_tests > 0 (ERR_INVALID_REQUEST)"
          - "no other PlacementAgreement with same clinic_id + model and status IN {APPROVED, ACTIVE, RENEGOTIATION} whose CLOSED interval [start_date, end_date] overlaps this one — both endpoints inclusive (ERR_PLACEMENT_TERM_OVERLAP)"
        side_effects:
          - "status -> ACTIVE; baseline_caseload_snapshot := Clinic.caseload_current_tests"
          - "creates one CommitmentPeriod per term month (period_status OPEN, billing_status NONE, minimum_cents := monthly_minimum_cents)"
          - "increments PlacementAgreement.version by 1"
      - from: ACTIVE
        to: RENEGOTIATION
        trigger: "POST /api/placement-agreements/{id}/request-renegotiation"
        actor: ClinicManager
        preconditions:
          - "status == ACTIVE (ERR_AGREEMENT_INVALID_STATE)"
          - "ownership: X-User-ID == PlacementAgreement.clinic_id (ERR_CLINIC_OWNERSHIP_MISMATCH)"
          - "abs(Clinic.caseload_current_tests - baseline_caseload_snapshot) >= RENEGOTIATION_CASELOAD_DELTA_PCT (0.30) * baseline_caseload_snapshot — boundary inclusive (ERR_RENEGOTIATION_CASELOAD_DELTA_INSUFFICIENT)"
        side_effects:
          - "status -> RENEGOTIATION; proposed_minimum_cents := max(50000, round_half_up(monthly_minimum_cents * Clinic.caseload_current_tests / baseline_caseload_snapshot))"
          - "increments PlacementAgreement.version by 1"
      - from: RENEGOTIATION
        to: ACTIVE
        trigger: "POST /api/placement-agreements/{id}/resolve-renegotiation (accept true or false)"
        actor: FinanceReviewer
        preconditions:
          - "status == RENEGOTIATION (ERR_AGREEMENT_INVALID_STATE)"
          - "expected_agreement_version == current version (ERR_STALE_AGREEMENT_VERSION)"
          - "accept == true requires new_minimum_cents present and >= MIN_MONTHLY_MINIMUM_CENTS 50000 (ERR_INVALID_REQUEST)"
          - "every id in waive_period_ids must reference a CLOSED CommitmentPeriod of this agreement with billing_status == ISSUED (ERR_PERIOD_INVALID_STATE)"
        side_effects:
          - "accept == true: monthly_minimum_cents := new_minimum_cents; every OPEN CommitmentPeriod.minimum_cents := new_minimum_cents (CLOSED periods immutable)"
          - "waive_period_ids: each listed period billing_status ISSUED -> WAIVED; cumulative_unpaid_billed_cents -= its billed_cents (cumulative_billed_cents unchanged)"
          - "accept == false: no term changes and no waivers (proposed_minimum_cents cleared either way)"
          - "status -> ACTIVE; increments PlacementAgreement.version by 1"
      - from: ACTIVE
        to: BREACHED
        trigger: "system — close-commitment-period cascade when the close leaves cumulative_unpaid_billed_cents >= SHORTFALL_BREACH_THRESHOLD_CENTS (250000)"
        actor: system
        preconditions:
          - "cumulative_unpaid_billed_cents >= 250000 after the period close"
        side_effects:
          - "status -> BREACHED; increments PlacementAgreement.version by 1"
          - "Clinic.status ACTIVE -> SUSPENDED (cascade; increments Clinic.version by 1)"
      - from: BREACHED
        to: ACTIVE
        trigger: "system — record-payment recovery when cumulative_unpaid_billed_cents drops below 250000 and logical clock <= end_date"
        actor: system
        preconditions:
          - "cumulative_unpaid_billed_cents < 250000 after the payment"
          - "logical clock <= end_date (else recover to COMPLETED instead)"
        side_effects:
          - "status -> ACTIVE; increments PlacementAgreement.version by 1"
      - from: BREACHED
        to: COMPLETED
        trigger: "system — record-payment recovery when unpaid drops below 250000 and logical clock > end_date"
        actor: system
        preconditions:
          - "cumulative_unpaid_billed_cents < 250000 after the payment"
          - "logical clock > end_date"
        side_effects:
          - "status -> COMPLETED; increments PlacementAgreement.version by 1"
      - from: ACTIVE
        to: COMPLETED
        trigger: "system — logical-clock sweep when clock > end_date (strict) and cumulative_unpaid_billed_cents == 0"
        actor: system
        preconditions:
          - "logical clock > end_date"
          - "cumulative_unpaid_billed_cents == 0"
        side_effects:
          - "status -> COMPLETED; increments PlacementAgreement.version by 1"
      - from: RENEGOTIATION
        to: COMPLETED
        trigger: "system — logical-clock sweep when clock > end_date and cumulative_unpaid_billed_cents == 0"
        actor: system
        preconditions:
          - "logical clock > end_date"
          - "cumulative_unpaid_billed_cents == 0"
        side_effects:
          - "proposed_minimum_cents cleared; status -> COMPLETED; increments PlacementAgreement.version by 1"
      - from: ACTIVE
        to: BREACHED
        trigger: "system — logical-clock sweep when clock > end_date and cumulative_unpaid_billed_cents > 0"
        actor: system
        preconditions:
          - "logical clock > end_date"
          - "cumulative_unpaid_billed_cents > 0"
        side_effects:
          - "status -> BREACHED; increments PlacementAgreement.version by 1"
          - "Clinic.status ACTIVE -> SUSPENDED (cascade)"

  - entity: Analyzer
    initial_state: INSTALLED
    terminal_states: [DECOMMISSIONED]
    note: "Three independent dimensions evolve on one row: operational_status, connectivity_status, proficiency_standing. Transitions below are grouped by dimension."
    transitions:
      - from: INSTALLED
        to: IN_SERVICE
        trigger: "PATCH /api/analyzers/{id} with operational_status IN_SERVICE"
        actor: FieldServiceEngineer
        preconditions:
          - "operational_status == INSTALLED (ERR_ANALYZER_INVALID_STATE)"
          - "PlacementAgreement(agreement_id).status IN {ACTIVE, RENEGOTIATION, BREACHED} (ERR_AGREEMENT_INVALID_STATE)"
        side_effects:
          - "operational_status -> IN_SERVICE; increments Analyzer.version by 1"
      - from: IN_SERVICE
        to: UNDER_SERVICE
        trigger: "system — POST /api/service-cases with case_type REPAIR or PREVENTIVE_CALIBRATION for this analyzer"
        actor: system
        preconditions:
          - "operational_status == IN_SERVICE"
        side_effects:
          - "operational_status -> UNDER_SERVICE; increments Analyzer.version by 1"
      - from: UNDER_SERVICE
        to: IN_SERVICE
        trigger: "system — ServiceCase RESOLVE or CANCELLED for the case that moved it"
        actor: system
        preconditions: []
        side_effects:
          - "operational_status -> IN_SERVICE; increments Analyzer.version by 1"
      - from: IN_SERVICE
        to: ON_LOAN
        trigger: "system — assigned as loaner_analyzer_id on ServiceCase creation"
        actor: system
        preconditions:
          - "is_loaner_unit == true (ERR_ANALYZER_INVALID_STATE)"
          - "operational_status == IN_SERVICE (ERR_ANALYZER_INVALID_STATE)"
        side_effects:
          - "operational_status -> ON_LOAN; increments Analyzer.version by 1"
      - from: ON_LOAN
        to: IN_SERVICE
        trigger: "system — the borrowing ServiceCase RESOLVE or CANCELLED returns the loaner"
        actor: system
        preconditions: []
        side_effects:
          - "operational_status -> IN_SERVICE; increments Analyzer.version by 1"
      - from: INSTALLED
        to: DECOMMISSIONED
        trigger: "PATCH /api/analyzers/{id} with operational_status DECOMMISSIONED"
        actor: FieldServiceEngineer
        preconditions:
          - "no ServiceCase for this analyzer in OPEN or DISPATCHED (ERR_SERVICE_CASE_INVALID_STATE)"
        side_effects:
          - "operational_status -> DECOMMISSIONED; increments Analyzer.version by 1"
      - from: IN_SERVICE
        to: DECOMMISSIONED
        trigger: "PATCH /api/analyzers/{id} with operational_status DECOMMISSIONED"
        actor: FieldServiceEngineer
        preconditions:
          - "no ServiceCase for this analyzer in OPEN or DISPATCHED (ERR_SERVICE_CASE_INVALID_STATE)"
        side_effects:
          - "operational_status -> DECOMMISSIONED; increments Analyzer.version by 1"
      - from: NOT_CONFIGURED
        to: ACTIVE
        trigger: "PATCH /api/analyzers/{id} with connectivity_status ACTIVE"
        actor: FieldServiceEngineer
        preconditions:
          - "operational_status != DECOMMISSIONED (ERR_ANALYZER_INVALID_STATE)"
        side_effects:
          - "connectivity_status -> ACTIVE; increments Analyzer.version by 1"
      - from: ACTIVE
        to: DEGRADED
        trigger: "PATCH /api/analyzers/{id} with connectivity_status DEGRADED"
        actor: FieldServiceEngineer
        preconditions:
          - "operational_status != DECOMMISSIONED (ERR_ANALYZER_INVALID_STATE)"
        side_effects:
          - "connectivity_status -> DEGRADED; increments Analyzer.version by 1"
      - from: DEGRADED
        to: ACTIVE
        trigger: "PATCH /api/analyzers/{id} with connectivity_status ACTIVE"
        actor: FieldServiceEngineer
        preconditions:
          - "operational_status != DECOMMISSIONED (ERR_ANALYZER_INVALID_STATE)"
        side_effects:
          - "connectivity_status -> ACTIVE; increments Analyzer.version by 1"
      - from: LAPSED
        to: CURRENT
        trigger: "system — proficiency LabTestOrder RECORD_RESULT with verdict PASS"
        actor: system
        preconditions: []
        side_effects:
          - "proficiency_standing -> CURRENT; qc_valid_until := resulted_at + 30 days; increments Analyzer.version by 1"
      - from: CURRENT
        to: LAPSED
        trigger: "system — proficiency LabTestOrder RECORD_RESULT with verdict FAIL, or logical-clock sweep when clock > qc_valid_until (strict)"
        actor: system
        preconditions: []
        side_effects:
          - "proficiency_standing -> LAPSED; increments Analyzer.version by 1"
          - "on FAIL: system creates a ServiceCase(case_type PROFICIENCY_REMEDIATION, status OPEN) for this analyzer"

  - entity: ReagentOrder
    initial_state: SUBMITTED
    terminal_states: [FULFILLED, CANCELLED]
    transitions:
      - from: SUBMITTED
        to: FULFILLED
        trigger: "PATCH /api/reagent-orders/{id} with status FULFILLED"
        actor: ClinicManager
        preconditions:
          - "status == SUBMITTED (ERR_ORDER_INVALID_STATE)"
          - "ownership: X-User-ID == ReagentOrder.clinic_id (ERR_CLINIC_OWNERSHIP_MISMATCH)"
          - "Clinic.status == ACTIVE (ERR_CLINIC_NOT_ACTIVE)"
          - "PlacementAgreement.status IN {ACTIVE, RENEGOTIATION} (ERR_AGREEMENT_INVALID_STATE)"
        side_effects:
          - "status -> FULFILLED; fulfilled_at := logical clock; increments ReagentOrder.version by 1"
          - "order now counts toward commitment attribution (calculations.commitment_fulfillment)"
      - from: SUBMITTED
        to: CANCELLED
        trigger: "PATCH /api/reagent-orders/{id} with status CANCELLED"
        actor: ClinicManager
        preconditions:
          - "status == SUBMITTED (ERR_ORDER_INVALID_STATE)"
          - "ownership: X-User-ID == ReagentOrder.clinic_id (ERR_CLINIC_OWNERSHIP_MISMATCH)"
        side_effects:
          - "status -> CANCELLED; increments ReagentOrder.version by 1"
          - "no commitment attribution ever applies: the order was never FULFILLED, so every commitment total is unchanged (compensating invariant)"

  - entity: CommitmentPeriod
    initial_state: OPEN
    terminal_states: [CLOSED]
    note: "Two parallel dimensions on one row: period_status (OPEN -> CLOSED) and billing_status (NONE -> ISSUED -> PAID | WAIVED). billing_status moves only while/after the period closes."
    transitions:
      - from: OPEN
        to: CLOSED
        trigger: "POST /api/placement-agreements/{id}/close-commitment-period with this period_month"
        actor: PlatformAdmin
        preconditions:
          - "PlacementAgreement.status IN {ACTIVE, RENEGOTIATION, BREACHED} (ERR_AGREEMENT_INVALID_STATE)"
          - "expected_agreement_version == PlacementAgreement.version (ERR_STALE_AGREEMENT_VERSION)"
          - "period_month is one of the agreement's term months (ERR_PERIOD_INVALID_STATE)"
          - "period_month is strictly before the logical clock's current month (ERR_PERIOD_INVALID_STATE)"
          - "every earlier term month is already CLOSED (chronological close order; ERR_PERIOD_INVALID_STATE)"
          - "this period still OPEN (ERR_PERIOD_INVALID_STATE)"
        side_effects:
          - "final attribution: fulfilled_cents := sum of final_total_cents over FULFILLED ReagentOrders of this agreement with order_month == period_month"
          - "shortfall_cents := max(0, minimum_cents - fulfilled_cents); billed_cents := round_half_up(shortfall_cents * 0.80)"
          - "period_status -> CLOSED; increments CommitmentPeriod.version by 1"
          - "billed_cents > 0: billing_status NONE -> ISSUED; PlacementAgreement.cumulative_billed_cents += billed_cents and cumulative_unpaid_billed_cents += billed_cents; increments PlacementAgreement.version by 1"
          - "cascade: if cumulative_unpaid_billed_cents >= 250000 the PlacementAgreement ACTIVE -> BREACHED, and its Clinic ACTIVE -> SUSPENDED"
      - from: NONE
        to: ISSUED
        trigger: "system — same close when billed_cents > 0"
        actor: system
        preconditions:
          - "billed_cents > 0"
        side_effects:
          - "billing_status -> ISSUED (same mutation event as the close: the period's version moves exactly once per close request, OPEN+NONE -> CLOSED+ISSUED in a single +1)"
      - from: ISSUED
        to: PAID
        trigger: "POST /api/commitment-periods/{id}/record-payment"
        actor: FinanceReviewer
        preconditions:
          - "billing_status == ISSUED (ERR_PERIOD_INVALID_STATE)"
          - "amount_cents == billed_cents exactly (ERR_PAYMENT_AMOUNT_MISMATCH)"
        side_effects:
          - "billing_status -> PAID; PlacementAgreement.cumulative_unpaid_billed_cents -= amount_cents"
          - "recovery cascade: if PlacementAgreement.status == BREACHED and cumulative_unpaid_billed_cents < 250000, PlacementAgreement -> ACTIVE (clock <= end_date) or -> COMPLETED (clock > end_date)"
          - "increments CommitmentPeriod.version by 1 and PlacementAgreement.version by 1"
      - from: ISSUED
        to: WAIVED
        trigger: "system — PlacementAgreement resolve-renegotiation listing this period in waive_period_ids"
        actor: system
        preconditions:
          - "billing_status == ISSUED"
        side_effects:
          - "billing_status -> WAIVED; PlacementAgreement.cumulative_unpaid_billed_cents -= billed_cents; increments CommitmentPeriod.version by 1"

  - entity: LabTestOrder
    initial_state: ORDERED
    terminal_states: [DELIVERED, CANCELLED]
    note: "Branching on origin: SEND_OUT inserts a RECEIVED stage before results; IN_CLINIC goes straight from ORDERED to RESULT_RECORDED behind the analyzer safety gates."
    transitions:
      - from: ORDERED
        to: RECEIVED
        trigger: "PATCH /api/lab-test-orders/{id} with action RECEIVE (SEND_OUT branch only)"
        actor: LaboratoryTechnician
        preconditions:
          - "status == ORDERED (ERR_TEST_ORDER_INVALID_STATE)"
          - "origin == SEND_OUT (ERR_TEST_ORDER_INVALID_STATE)"
        side_effects:
          - "status -> RECEIVED; increments LabTestOrder.version by 1"
      - from: ORDERED
        to: RESULT_RECORDED
        trigger: "PATCH /api/lab-test-orders/{id} with action RECORD_RESULT (IN_CLINIC branch)"
        actor: ClinicManager
        preconditions:
          - "status == ORDERED (ERR_TEST_ORDER_INVALID_STATE)"
          - "origin == IN_CLINIC (ERR_TEST_ORDER_INVALID_STATE)"
          - "ownership: X-User-ID == LabTestOrder.clinic_id (ERR_CLINIC_OWNERSHIP_MISMATCH)"
          - "result_value present (ERR_INVALID_REQUEST)"
          - "Analyzer.operational_status == IN_SERVICE (ERR_ANALYZER_INVALID_STATE)"
          - "order_kind == PATIENT additionally requires Analyzer.connectivity_status == ACTIVE (ERR_CONNECTIVITY_NOT_ACTIVE) and Analyzer.proficiency_standing == CURRENT (ERR_PROFICIENCY_LAPSED)"
        side_effects:
          - "creates the 1:1 LabResult (source IN_CLINIC, verdict computed for PROFICIENCY)"
          - "status -> RESULT_RECORDED; delivery_status NOT_READY -> PENDING; increments LabTestOrder.version by 1"
          - "PROFICIENCY PASS: Analyzer.proficiency_standing -> CURRENT, qc_valid_until := resulted_at + 30 days"
          - "PROFICIENCY FAIL: Analyzer.proficiency_standing -> LAPSED and system creates ServiceCase(case_type PROFICIENCY_REMEDIATION, status OPEN) for that analyzer"
      - from: RECEIVED
        to: RESULT_RECORDED
        trigger: "PATCH /api/lab-test-orders/{id} with action RECORD_RESULT (SEND_OUT branch)"
        actor: LaboratoryTechnician
        preconditions:
          - "status == RECEIVED (ERR_TEST_ORDER_INVALID_STATE)"
          - "origin == SEND_OUT (ERR_TEST_ORDER_INVALID_STATE)"
          - "result_value present (ERR_INVALID_REQUEST)"
        side_effects:
          - "creates the 1:1 LabResult (source REFERENCE_LAB; verdict null because PROFICIENCY requires IN_CLINIC)"
          - "status -> RESULT_RECORDED; delivery_status NOT_READY -> PENDING; increments LabTestOrder.version by 1"
      - from: RESULT_RECORDED
        to: DELIVERED
        trigger: "PATCH /api/lab-test-orders/{id} with action DELIVER"
        actor: ClinicManager
        preconditions:
          - "status == RESULT_RECORDED (ERR_TEST_ORDER_INVALID_STATE)"
          - "ownership: X-User-ID == LabTestOrder.clinic_id (ERR_CLINIC_OWNERSHIP_MISMATCH)"
          - "origin == IN_CLINIC additionally requires Analyzer.connectivity_status == ACTIVE (ERR_CONNECTIVITY_NOT_ACTIVE); SEND_OUT delivery has no connectivity gate"
        side_effects:
          - "status -> DELIVERED; delivery_status PENDING -> DELIVERED; increments LabTestOrder.version by 1"
      - from: ORDERED
        to: CANCELLED
        trigger: "PATCH /api/lab-test-orders/{id} with action CANCEL"
        actor: ClinicManager
        preconditions:
          - "status IN {ORDERED, RECEIVED} (ERR_TEST_ORDER_INVALID_STATE)"
          - "ownership: X-User-ID == LabTestOrder.clinic_id (ERR_CLINIC_OWNERSHIP_MISMATCH)"
        side_effects:
          - "status -> CANCELLED; increments LabTestOrder.version by 1"
      - from: RECEIVED
        to: CANCELLED
        trigger: "PATCH /api/lab-test-orders/{id} with action CANCEL"
        actor: ClinicManager
        preconditions:
          - "status IN {ORDERED, RECEIVED} (ERR_TEST_ORDER_INVALID_STATE)"
          - "ownership: X-User-ID == LabTestOrder.clinic_id (ERR_CLINIC_OWNERSHIP_MISMATCH)"
        side_effects:
          - "status -> CANCELLED; increments LabTestOrder.version by 1"

  - entity: ServiceCase
    initial_state: OPEN
    terminal_states: [RESOLVED, CANCELLED]
    transitions:
      - from: OPEN
        to: DISPATCHED
        trigger: "PATCH /api/service-cases/{id} with action DISPATCH"
        actor: FieldServiceEngineer
        preconditions:
          - "status == OPEN (ERR_SERVICE_CASE_INVALID_STATE)"
        side_effects:
          - "status -> DISPATCHED; increments ServiceCase.version by 1"
      - from: DISPATCHED
        to: RESOLVED
        trigger: "PATCH /api/service-cases/{id} with action RESOLVE"
        actor: FieldServiceEngineer
        preconditions:
          - "status == DISPATCHED (ERR_SERVICE_CASE_INVALID_STATE)"
        side_effects:
          - "status -> RESOLVED; resolved_at := logical clock"
          - "downtime_hours := round_half_up((resolved_at - opened_at) in hours); sla_met := resolved_at <= response_due_at"
          - "Analyzer UNDER_SERVICE -> IN_SERVICE (the case's analyzer); loaner_analyzer_id unit ON_LOAN -> IN_SERVICE"
          - "Analyzer.total_downtime_hours += downtime_hours; uptime recompute (calculations.uptime_and_service_credit)"
          - "credit cascade: if Analyzer.breach_uptime_pct < 0.985 after this resolve, PlacementAgreement(Analyzer.agreement_id).service_credit_cents += 25000 (at most one credit per case)"
          - "increments ServiceCase.version by 1, Analyzer.version by 1, and on credit PlacementAgreement.version by 1"
      - from: OPEN
        to: CANCELLED
        trigger: "PATCH /api/service-cases/{id} with action CANCEL"
        actor: FieldServiceEngineer
        preconditions:
          - "status IN {OPEN, DISPATCHED} (ERR_SERVICE_CASE_INVALID_STATE)"
        side_effects:
          - "status -> CANCELLED; compensation: Analyzer UNDER_SERVICE -> IN_SERVICE and loaner ON_LOAN -> IN_SERVICE (no downtime accrued)"
          - "increments ServiceCase.version by 1 and Analyzer.version by 1"
      - from: DISPATCHED
        to: CANCELLED
        trigger: "PATCH /api/service-cases/{id} with action CANCEL"
        actor: FieldServiceEngineer
        preconditions:
          - "status IN {OPEN, DISPATCHED} (ERR_SERVICE_CASE_INVALID_STATE)"
        side_effects:
          - "status -> CANCELLED; same compensation as OPEN -> CANCELLED"
          - "increments ServiceCase.version by 1 and Analyzer.version by 1"

# =============================================================================
# §1.2.1 Concurrency Rules — true races only, resolved by OCC on the parent's
# version. Both rules guard writes whose second sequential attempt would
# otherwise legitimately succeed on identical visible state.
# =============================================================================
concurrency_rules:
  - rule_id: occ-resolve-renegotiation-stale
    parent_entity: PlacementAgreement
    write_endpoint: "POST /api/placement-agreements/{id}/resolve-renegotiation"
    occ_field: expected_agreement_version
    description: |
      Resolving a renegotiation against a PlacementAgreement whose version has
      advanced since the client last observed it is rejected. A second
      resolution submitted after another writer already resolved (or otherwise
      mutated) the agreement applies terms derived from a stale baseline.
    error_id: ERR_STALE_AGREEMENT_VERSION
    http_status: 412
  - rule_id: occ-close-period-stale
    parent_entity: PlacementAgreement
    write_endpoint: "POST /api/placement-agreements/{id}/close-commitment-period"
    occ_field: expected_agreement_version
    description: |
      Closing a commitment period against a PlacementAgreement whose version
      has advanced since the client last observed it is rejected, because the
      close mutates cumulative_billed_cents / cumulative_unpaid_billed_cents
      on the agreement and must serialize against other writers of those
      fields.
    error_id: ERR_STALE_AGREEMENT_VERSION
    http_status: 412

# =============================================================================
# §1.3 Calculation Rules Table (7 rules; every constant pinned)
# =============================================================================
calculations:
  - name: reagent_order_pricing
    trigger: "POST /api/reagent-orders — computed once at creation and locked into pricing_detail / final_total_cents (immutable afterwards)"
    algorithm: tiered_pricing
    formula: |
      Resolution order per line (evaluation order pinned, no stacking):
      1. Candidate GPA selection by clinic membership:
         a. If Clinic.corporate_group_code is set: consider ONLY
            GroupPricingAgreements with group_type CORPORATE and that
            group_code (corporate precedence — buying-group agreements are
            never consulted for this clinic).
         b. Else if Clinic.buying_group_code is set: consider only BUYING
            agreements with that group_code.
         c. Else: no candidate.
         A candidate applies only if status == ACTIVE and
         effective_from <= order.created_at < effective_to (half-open).
         If the membership's agreement does not cover the order timestamp,
         fall through to LIST (never to the other group type).
      2. effective_unit_price_cents:
         - family QC_MATERIAL AND agreement.program_type == REAGENT_COMMITMENT
           -> 0, price_source PROGRAM_INCLUDED (QC material is bundled);
         - else if applying GPA has sku_overrides entry for sku
           -> that unit_price_cents, price_source OVERRIDE;
         - else if GPA applies
           -> round_half_up(list_price_cents * (1 - discount_pct)),
              price_source CORPORATE_DISCOUNT or BUYING_DISCOUNT;
         - else -> list_price_cents from PRICE_TABLE, price_source LIST.
      3. line_total_cents = effective_unit_price_cents * quantity
         (integer arithmetic, no further rounding).
      4. final_total_cents = SUM(line_total_cents) over lines.
         Rounding order pinned: round per unit price first, then multiply,
         then sum. Never sum-then-round.
      5. list_total_cents = SUM(list_price_cents * quantity) over lines.
    input_set: "lines of the new order; Clinic memberships; ACTIVE GroupPricingAgreements whose window covers the logical clock at creation; PRICE_TABLE"
    constants:
      MAX_DISCOUNT_PCT: 0.40
      PRICE_TABLE:
        VC300_CHEM_SLIDE:  { family: SLIDE,        list_price_cents: 420 }
        VC300_LYTE_CART:   { family: CARTRIDGE,    list_price_cents: 760 }
        VH500_CBC_CART:    { family: CARTRIDGE,    list_price_cents: 890 }
        VH500_DIFF_SLIDE:  { family: SLIDE,        list_price_cents: 385 }
        VU200_URINE_STRIP: { family: SLIDE,        list_price_cents: 153 }
        QC_LEVEL_1:        { family: QC_MATERIAL,  list_price_cents: 3000 }
        QC_LEVEL_2:        { family: QC_MATERIAL,  list_price_cents: 3000 }
        CAL_KIT_STANDARD:  { family: CALIBRATOR,   list_price_cents: 12500 }
    precision: "integer cents; round_half_up applied per unit price only"

  - name: commitment_fulfillment
    trigger: "provisional variant: on every read of an OPEN CommitmentPeriod (provisional_fulfilled_cents); final variant: at close-commitment-period (fulfilled_cents, locked)"
    algorithm: aggregation
    formula: |
      Two attribution variants over the SAME set of FULFILLED ReagentOrders
      of the agreement (SUBMITTED and CANCELLED orders never count):
      - provisional (OPEN period, computed on read):
          SUM(final_total_cents) where fulfilled_at's calendar month == period_month
      - final (at close, locked):
          SUM(final_total_cents) where order_month == period_month
      The variants diverge whenever an order's fulfillment month differs from
      its declared order_month. Lines priced 0 (PROGRAM_INCLUDED QC material)
      contribute 0 to both variants.
    input_set: "ReagentOrders with agreement_id == period.agreement_id AND status == FULFILLED only"
    constants:
      SHORTFALL_BILLING_RATE: 0.80
    precision: "integer cents (sums of integer line totals)"
    variants:
      - name: provisional_fulfillment_attribution
        when: "period_status == OPEN; surfaced as provisional_fulfilled_cents"
        difference: "attributes orders by fulfilled_at month (fulfillment-date attribution)"
      - name: final_fulfillment_attribution
        when: "at close-commitment-period; locked into fulfilled_cents"
        difference: "attributes orders by declared order_month (order-month attribution)"

  - name: shortfall_billing
    trigger: "at close-commitment-period, after commitment_fulfillment final variant"
    algorithm: threshold
    formula: |
      shortfall_cents = max(0, minimum_cents - fulfilled_cents)
      billed_cents    = round_half_up(shortfall_cents * SHORTFALL_BILLING_RATE)
      billing_status  = ISSUED if billed_cents > 0 else NONE
      Agreement-level totals: cumulative_billed_cents and
      cumulative_unpaid_billed_cents are sums of PER-PERIOD billed_cents that
      were each rounded at close time (sum-of-rounds). Never recompute an
      agreement total as round(SUM(shortfall) * rate) — round-of-sum differs
      from sum-of-rounds and is forbidden.
    input_set: "the single CommitmentPeriod being closed"
    constants:
      SHORTFALL_BILLING_RATE: 0.80
      SHORTFALL_BREACH_THRESHOLD_CENTS: 250000
    precision: "integer cents; round_half_up per period"

  - name: renegotiation_terms
    trigger: "POST /api/placement-agreements/{id}/request-renegotiation computes proposed_minimum_cents; resolve-renegotiation applies terms"
    algorithm: constraint_propagation
    formula: |
      Evaluation order pinned (circular-looking chain made explicit):
      1. Snapshot read: r = Clinic.caseload_current_tests / PlacementAgreement.baseline_caseload_snapshot
         (both read at request time; baseline was frozen at activation).
      2. proposed_minimum_cents = max(MIN_MONTHLY_MINIMUM_CENTS,
            round_half_up(monthly_minimum_cents * r)).
      3. At resolve with accept == true: monthly_minimum_cents :=
         new_minimum_cents supplied by FinanceReviewer (>= 50000), then every
         OPEN CommitmentPeriod.minimum_cents := new_minimum_cents.
      4. CLOSED periods are immutable: their minimum_cents, fulfilled_cents,
         shortfall_cents and billed_cents never change retroactively, so
         cumulative_billed_cents is unaffected by renegotiation.
      proposed_minimum_cents is advisory; the applied value is the supplied
      new_minimum_cents. Clearing: proposed_minimum_cents is null outside
      RENEGOTIATION.
    input_set: "the PlacementAgreement, its Clinic, its CommitmentPeriods"
    constants:
      RENEGOTIATION_CASELOAD_DELTA_PCT: 0.30
      MIN_MONTHLY_MINIMUM_CENTS: 50000
    precision: "integer cents; round_half_up"

  - name: proficiency_verdict
    trigger: "LabTestOrder RECORD_RESULT when order_kind == PROFICIENCY"
    algorithm: threshold
    formula: |
      verdict = PASS iff abs(result_value - expected_value)
                <= PROFICIENCY_TOLERANCE_PCT * expected_value
      The boundary is inclusive: a deviation of exactly 5% passes.
      Comparison is exact decimal arithmetic (no intermediate rounding).
      PASS: Analyzer.proficiency_standing -> CURRENT,
            qc_valid_until := resulted_at + QC_VALIDITY_DAYS.
      FAIL: Analyzer.proficiency_standing -> LAPSED,
            qc_valid_until unchanged,
            system creates ServiceCase(case_type PROFICIENCY_REMEDIATION).
    input_set: "the recorded result_value and the order's expected_result"
    constants:
      PROFICIENCY_TOLERANCE_PCT: 0.05
      QC_VALIDITY_DAYS: 30
    precision: "exact decimal comparison"

  - name: uptime_and_service_credit
    trigger: "ServiceCase RESOLVE (recompute and possible credit); fields read on Analyzer"
    algorithm: aggregation
    formula: |
      Let W = RESOLVED ServiceCases of this analyzer with
      resolved_at >= (logical clock - UPTIME_WINDOW_DAYS days).
      qualifying_downtime = SUM(downtime_hours) over W (all case types).
      calibration_downtime = SUM(downtime_hours) over W where
      case_type == PREVENTIVE_CALIBRATION.
      breach_uptime_pct = round_half_up(
          (UPTIME_WINDOW_HOURS - min(qualifying_downtime, UPTIME_WINDOW_HOURS))
          / UPTIME_WINDOW_HOURS, 4)
      reported_uptime_pct = round_half_up(
          (UPTIME_WINDOW_HOURS - min(max(0, qualifying_downtime
              - min(calibration_downtime, CALIBRATION_FREE_HOURS_PER_YEAR)),
              UPTIME_WINDOW_HOURS)) / UPTIME_WINDOW_HOURS, 4)
      The two variants diverge whenever calibration downtime in the window is
      nonzero. On RESOLVE: if breach_uptime_pct < UPTIME_BREACH_THRESHOLD_PCT
      (strict), credit PlacementAgreement(Analyzer.agreement_id)
      .service_credit_cents += UPTIME_SERVICE_CREDIT_CENTS; at most one
      credit per ServiceCase.
    input_set: "RESOLVED ServiceCases of the analyzer within the trailing 90-day window (by resolved_at, boundary inclusive)"
    constants:
      UPTIME_WINDOW_DAYS: 90
      UPTIME_WINDOW_HOURS: 2160
      UPTIME_BREACH_THRESHOLD_PCT: 0.985
      CALIBRATION_FREE_HOURS_PER_YEAR: 16
      UPTIME_SERVICE_CREDIT_CENTS: 25000
      RESPONSE_SLA_HOURS: 24
    precision: "4 decimal places, round_half_up"
    variants:
      - name: reported_uptime
        when: "customer-facing uptime commitment reporting (Analyzer.reported_uptime_pct)"
        difference: "excludes up to 16h per rolling year of PREVENTIVE_CALIBRATION downtime"
      - name: breach_uptime
        when: "service-credit determination at ServiceCase RESOLVE (Analyzer.breach_uptime_pct)"
        difference: "counts ALL downtime including calibration"

  - name: term_and_window_intervals
    trigger: "PlacementAgreement activation overlap check; GroupPricingAgreement creation overlap check; coverage test inside reagent_order_pricing"
    algorithm: interval_merge
    formula: |
      Two DIFFERENT interval semantics, pinned per resource:
      (1) GroupPricingAgreement windows are HALF-OPEN [effective_from,
          effective_to): a new agreement for the same (group_type, group_code)
          with status not EXPIRED conflicts iff
          new.effective_from < existing.effective_to AND
          existing.effective_from < new.effective_to.
          Adjacency (new.effective_from == existing.effective_to) is allowed.
      (2) PlacementAgreement terms are CLOSED [start_date, end_date] (both
          ends inclusive): at activation, another agreement with same
          clinic_id + model and status IN {APPROVED, ACTIVE, RENEGOTIATION}
          conflicts iff new.start_date <= existing.end_date AND
          existing.start_date <= new.end_date.
          Touching endpoints (new.start_date == existing.end_date) CONFLICT.
      end_date = start_date + term_months calendar months (same day-of-month).
    input_set: "agreements of the same group key (GPA) or same clinic+model (PA)"
    constants:
      ALLOWED_TERM_MONTHS: [24, 36, 48, 60]
    precision: "ISO 8601 timestamps compared exactly"

# =============================================================================
# §1.4 Validation Rules Table (ordered by priority; lower number wins when a
# request fails multiple checks)
# =============================================================================
validations:
  - priority: 1
    category: auth
    check: "X-User-ID and X-User-Role headers must both be present and X-User-Role must be one of the five declared roles"
    error_id: ERR_MISSING_OR_INVALID_USER_CONTEXT_HEADER
    http_status: 400
    applies_to: "all endpoints"
  - priority: 2
    category: auth
    check: "Role must be permitted for this endpoint per §1.5 roles; field-level rule: PATCH /api/clinics/{id} carrying a status field requires PlatformAdmin; PATCH /api/lab-test-orders/{id} action role matrix (RECEIVE LaboratoryTechnician; RECORD_RESULT ClinicManager for IN_CLINIC, LaboratoryTechnician for SEND_OUT; DELIVER and CANCEL ClinicManager)"
    error_id: ERR_INSUFFICIENT_PERMISSIONS
    http_status: 403
    applies_to: "all endpoints"
  - priority: 3
    category: auth
    check: "Ownership: when role is ClinicManager, X-User-ID must equal the clinic_id of the target resource (body clinic_id on creation; the owning clinic of the addressed entity otherwise)"
    error_id: ERR_CLINIC_OWNERSHIP_MISMATCH
    http_status: 403
    applies_to: "ClinicManager-invoked endpoints: POST /api/placement-agreements, POST /api/placement-agreements/{id}/request-renegotiation, PATCH /api/clinics/{id} (caseload only), POST /api/reagent-orders, PATCH /api/reagent-orders/{id}, POST /api/lab-test-orders, PATCH /api/lab-test-orders/{id}"
  - priority: 4
    category: existence
    check: "Path ids must exist, validated left-to-right; body foreign keys must exist in the order the endpoint's input list declares them (clinic_id before agreement_id before analyzer_id)"
    error_id: "ERR_CLINIC_NOT_FOUND | ERR_AGREEMENT_NOT_FOUND | ERR_ANALYZER_NOT_FOUND | ERR_ORDER_NOT_FOUND | ERR_PERIOD_NOT_FOUND | ERR_TEST_ORDER_NOT_FOUND | ERR_SERVICE_CASE_NOT_FOUND"
    http_status: 404
    applies_to: "all endpoints with path ids or body FKs"
  - priority: 5
    category: business_referential
    check: "Input shape and referential integrity: required fields present; enum membership; term_months in {24,36,48,60}; program-type conditional fields (monthly_minimum_cents / lease_rate_cents / purchase_price_cents per program_type); discount_pct <= 0.40; every sku in lines and sku_overrides exists in PRICE_TABLE; expected_result present iff order_kind PROFICIENCY; analyzer_id present iff origin IN_CLINIC and null for SEND_OUT; order_month within agreement term; case_type PROFICIENCY_REMEDIATION rejected from the API"
    error_id: "ERR_INVALID_REQUEST | ERR_INVALID_PROGRAM_TERMS | ERR_UNKNOWN_SKU"
    http_status: 400
    applies_to: "creation and PATCH endpoints"
  - priority: 6
    category: state
    check: "Target resource in a legal state for the requested transition (every from-state precondition in §1.2)"
    error_id: "ERR_CLINIC_NOT_ACTIVE | ERR_AGREEMENT_INVALID_STATE | ERR_ANALYZER_INVALID_STATE | ERR_ORDER_INVALID_STATE | ERR_PERIOD_INVALID_STATE | ERR_TEST_ORDER_INVALID_STATE | ERR_SERVICE_CASE_INVALID_STATE"
    http_status: 409
    applies_to: "all action and PATCH endpoints"
  - priority: 7
    category: business_safety
    check: "In-clinic PATIENT testing safety gate: Analyzer operational IN_SERVICE, connectivity ACTIVE, proficiency CURRENT (in this order); RECORD_RESULT for PROFICIENCY orders requires only operational IN_SERVICE"
    error_id: "ERR_ANALYZER_INVALID_STATE | ERR_CONNECTIVITY_NOT_ACTIVE | ERR_PROFICIENCY_LAPSED"
    http_status: 409
    applies_to: "PATCH /api/lab-test-orders/{id} action RECORD_RESULT"
  - priority: 8
    category: business_temporal
    check: "Interval occupations: GroupPricingAgreement half-open window overlap per (group_type, group_code); PlacementAgreement closed-interval term overlap per (clinic_id, model) at activation; effective_to > effective_from and > clock; period_month strictly before the clock's current month; clock-set must advance strictly forward"
    error_id: "ERR_PRICING_AGREEMENT_WINDOW_OVERLAP | ERR_PLACEMENT_TERM_OVERLAP | ERR_WINDOW_INVALID | ERR_PERIOD_INVALID_STATE | ERR_INVALID_REQUEST"
    http_status: 409
    applies_to: "POST /api/group-pricing-agreements, POST /api/placement-agreements/{id}/activate, POST /api/placement-agreements/{id}/close-commitment-period, POST /api/_clock/set_current_utc"
  - priority: 9
    category: business_constraint
    check: "Derived-structure constraints: renegotiation caseload delta >= 0.30 of baseline snapshot; loaner unit must be is_loaner_unit and IN_SERVICE; decommission requires no OPEN/DISPATCHED service cases; reactivation of a SUSPENDED clinic requires no BREACHED agreement with unpaid balance; chronological close order of commitment periods"
    error_id: "ERR_RENEGOTIATION_CASELOAD_DELTA_INSUFFICIENT | ERR_ANALYZER_INVALID_STATE | ERR_SERVICE_CASE_INVALID_STATE | ERR_AGREEMENT_INVALID_STATE | ERR_PERIOD_INVALID_STATE"
    http_status: 422
    applies_to: "POST /api/placement-agreements/{id}/request-renegotiation, POST /api/service-cases, PATCH /api/analyzers/{id}, PATCH /api/clinics/{id}, POST /api/placement-agreements/{id}/close-commitment-period"
  - priority: 10
    category: business_fiscal
    check: "Fiscal gates: clinic TERMINATED requires no agreement with cumulative_unpaid_billed_cents > 0; record-payment amount must equal billed_cents exactly"
    error_id: "ERR_OUTSTANDING_SHORTFALL_UNPAID | ERR_PAYMENT_AMOUNT_MISMATCH"
    http_status: 402
    applies_to: "PATCH /api/clinics/{id}, POST /api/commitment-periods/{id}/record-payment"
  - priority: 11
    category: state
    check: "OCC: expected_agreement_version must equal the PlacementAgreement's current version (checked after all state preconditions of the transition pass, before applying mutations)"
    error_id: ERR_STALE_AGREEMENT_VERSION
    http_status: 412
    applies_to: "POST /api/placement-agreements/{id}/resolve-renegotiation, POST /api/placement-agreements/{id}/close-commitment-period"

# =============================================================================
# §1.5 API Endpoint Table (32 endpoints, all under /api)
# =============================================================================
endpoints:
  - method: POST
    path: "/api/_clock/set_current_utc"
    description: "Test-driving logical clock. Server startup default is exactly 2026-09-01T00:00:00Z (never wall-clock); to_iso8601 must be strictly greater than the current logical time. After advancing, the sweep runs in pinned order: (1) GroupPricingAgreement DRAFT->ACTIVE / ACTIVE->EXPIRED, (2) PlacementAgreement term completion/breach, (3) Analyzer QC lapse."
    roles: [PlatformAdmin]
    code: 200
    input: [to_iso8601]
    output: { current_utc: string }
    side_effects: ["clock sweeps per description; each swept entity's version increments by 1"]

  - method: POST
    path: "/api/group-pricing-agreements"
    description: "Create a group pricing agreement (window half-open [effective_from, effective_to); overlap with a non-EXPIRED agreement of the same group_type+group_code rejected; initial status ACTIVE iff effective_from <= clock < effective_to else DRAFT)"
    roles: [PlatformAdmin]
    code: 201
    input: [group_type, group_code, effective_from, effective_to, discount_pct, "sku_overrides?"]
    output: GroupPricingAgreement
    side_effects: ["status computed from logical clock at creation"]

  - method: GET
    path: "/api/group-pricing-agreements"
    description: "List group pricing agreements; ordered by created_at ASC, ties broken by insertion order"
    roles: [PlatformAdmin, FinanceReviewer, ClinicManager, FieldServiceEngineer, LaboratoryTechnician]
    code: 200
    input: ["group_code?", "status?", "limit?", "offset?"]
    output: "GroupPricingAgreement[]"
    side_effects: []

  - method: POST
    path: "/api/clinics"
    description: "Create a clinic (status ACTIVE; caseload_current_tests initialized to caseload_baseline_tests)"
    roles: [PlatformAdmin]
    code: 201
    input: [name, caseload_baseline_tests, "corporate_group_code?", "buying_group_code?"]
    output: Clinic
    side_effects: []

  - method: GET
    path: "/api/clinics/{id}"
    description: "Get one clinic"
    roles: [PlatformAdmin, FinanceReviewer, ClinicManager, FieldServiceEngineer, LaboratoryTechnician]
    code: 200
    input: []
    output: Clinic
    side_effects: []

  - method: PATCH
    path: "/api/clinics/{id}"
    description: "Update caseload_current_tests (ClinicManager owner or PlatformAdmin; only while ACTIVE) and/or drive status transitions ACTIVE<->SUSPENDED->TERMINATED (status field requires PlatformAdmin)"
    roles: [PlatformAdmin, ClinicManager]
    code: 200
    input: ["caseload_current_tests?", "status?"]
    output: Clinic
    side_effects: ["per §1.2 Clinic transitions; increments Clinic.version by 1"]

  - method: POST
    path: "/api/placement-agreements"
    description: "Draft a placement agreement (ClinicManager, own clinic only, clinic must be ACTIVE; program-type conditional fields enforced; term overlap NOT checked here — checked at activation)"
    roles: [ClinicManager]
    code: 201
    input: [clinic_id, model, program_type, term_months, start_date, "monthly_minimum_cents?", "lease_rate_cents?", "purchase_price_cents?"]
    output: PlacementAgreement
    side_effects: ["status = DRAFT; end_date computed = start_date + term_months months"]

  - method: GET
    path: "/api/placement-agreements/{id}"
    description: "Get one placement agreement"
    roles: [PlatformAdmin, FinanceReviewer, ClinicManager, FieldServiceEngineer, LaboratoryTechnician]
    code: 200
    input: []
    output: PlacementAgreement
    side_effects: []

  - method: GET
    path: "/api/placement-agreements"
    description: "List placement agreements (covers FK PlacementAgreement.clinic_id via clinic_id filter); ordered by created_at ASC, ties by insertion order"
    roles: [PlatformAdmin, FinanceReviewer, ClinicManager, FieldServiceEngineer, LaboratoryTechnician]
    code: 200
    input: ["clinic_id?", "status?", "limit?", "offset?"]
    output: "PlacementAgreement[]"
    side_effects: []

  - method: POST
    path: "/api/placement-agreements/{id}/approve"
    description: "Finance approval of a draft agreement (segregation of duties: not the drafting role)"
    roles: [FinanceReviewer]
    code: 200
    input: []
    output: PlacementAgreement
    side_effects: ["DRAFT -> APPROVED; increments PlacementAgreement.version by 1"]

  - method: POST
    path: "/api/placement-agreements/{id}/activate"
    description: "Activate an approved agreement: clinic ACTIVE + caseload > 0 + closed-interval term-overlap check; snapshots baseline caseload; creates one OPEN CommitmentPeriod per term month"
    roles: [PlatformAdmin]
    code: 200
    input: []
    output: PlacementAgreement
    side_effects: ["APPROVED -> ACTIVE; baseline_caseload_snapshot := Clinic.caseload_current_tests; CommitmentPeriods created; increments PlacementAgreement.version by 1"]

  - method: POST
    path: "/api/placement-agreements/{id}/request-renegotiation"
    description: "Clinic requests renegotiation when its current caseload deviates from the activation snapshot by >= 30% (boundary inclusive); computes proposed_minimum_cents"
    roles: [ClinicManager]
    code: 200
    input: []
    output: PlacementAgreement
    side_effects: ["ACTIVE -> RENEGOTIATION; proposed_minimum_cents computed; increments PlacementAgreement.version by 1"]

  - method: POST
    path: "/api/placement-agreements/{id}/resolve-renegotiation"
    description: "Finance resolves a renegotiation (OCC-guarded). accept=true applies new_minimum_cents to the agreement and all OPEN periods; waive_period_ids waive listed ISSUED shortfall bills; accept=false restores terms unchanged"
    roles: [FinanceReviewer]
    code: 200
    input: [accept, expected_agreement_version, "new_minimum_cents?", "waive_period_ids?"]
    output: PlacementAgreement
    side_effects: ["RENEGOTIATION -> ACTIVE; per-transition side effects in §1.2; increments PlacementAgreement.version by 1"]

  - method: POST
    path: "/api/placement-agreements/{id}/close-commitment-period"
    description: "Ops-run checkpoint (OCC-guarded): closes the named period in strict chronological order, locks final order-month attribution, computes shortfall and per-period billed_cents, issues billing, and runs the breach cascade"
    roles: [PlatformAdmin]
    code: 200
    input: [period_month, expected_agreement_version]
    output: CommitmentPeriod
    side_effects: ["period OPEN -> CLOSED (+ NONE -> ISSUED when billed_cents > 0); agreement cumulative fields debited; breach cascade to PlacementAgreement and Clinic; increments PlacementAgreement.version by 1"]

  - method: GET
    path: "/api/placement-agreements/{id}/commitment-periods"
    description: "List commitment periods of an agreement (covers FK CommitmentPeriod.agreement_id); ordered by period_month ASC"
    roles: [PlatformAdmin, FinanceReviewer, ClinicManager, FieldServiceEngineer, LaboratoryTechnician]
    code: 200
    input: ["period_status?", "limit?", "offset?"]
    output: "CommitmentPeriod[]"
    side_effects: []

  - method: POST
    path: "/api/commitment-periods/{id}/record-payment"
    description: "Record exact payment of an ISSUED shortfall bill; triggers breach-recovery cascade on the agreement when unpaid drops below threshold"
    roles: [FinanceReviewer]
    code: 200
    input: [amount_cents]
    output: CommitmentPeriod
    side_effects: ["billing_status ISSUED -> PAID; cumulative_unpaid_billed_cents -= amount_cents; recovery cascade per §1.2"]

  - method: POST
    path: "/api/analyzers"
    description: "Install an analyzer under an ACTIVE (or RENEGOTIATION/BREACHED) agreement; model copied from the agreement; serial_number unique; initial dimensions INSTALLED / NOT_CONFIGURED / LAPSED"
    roles: [FieldServiceEngineer]
    code: 201
    input: [clinic_id, agreement_id, serial_number, "is_loaner_unit?"]
    output: Analyzer
    side_effects: ["initial proficiency_standing = LAPSED until first proficiency PASS"]

  - method: GET
    path: "/api/analyzers/{id}"
    description: "Get one analyzer"
    roles: [PlatformAdmin, FinanceReviewer, ClinicManager, FieldServiceEngineer, LaboratoryTechnician]
    code: 200
    input: []
    output: Analyzer
    side_effects: []

  - method: GET
    path: "/api/analyzers"
    description: "List analyzers (covers FKs Analyzer.clinic_id and Analyzer.agreement_id via filters); ordered by created_at ASC, ties by insertion order"
    roles: [PlatformAdmin, FinanceReviewer, ClinicManager, FieldServiceEngineer, LaboratoryTechnician]
    code: 200
    input: ["clinic_id?", "agreement_id?", "operational_status?", "limit?", "offset?"]
    output: "Analyzer[]"
    side_effects: []

  - method: PATCH
    path: "/api/analyzers/{id}"
    description: "Drive Analyzer dimensions: operational INSTALLED->IN_SERVICE or ->DECOMMISSIONED; connectivity NOT_CONFIGURED->ACTIVE, ACTIVE<->DEGRADED (both fields may appear in one call; UNDER_SERVICE / ON_LOAN are system-driven only)"
    roles: [FieldServiceEngineer]
    code: 200
    input: ["operational_status?", "connectivity_status?"]
    output: Analyzer
    side_effects: ["per §1.2 Analyzer transitions; increments Analyzer.version by 1"]

  - method: POST
    path: "/api/service-cases"
    description: "Open a REPAIR or PREVENTIVE_CALIBRATION case (PROFICIENCY_REMEDIATION is system-created only); moves the analyzer to UNDER_SERVICE; optional loaner assignment flips the loaner to ON_LOAN"
    roles: [FieldServiceEngineer]
    code: 201
    input: [analyzer_id, case_type, "loaner_analyzer_id?"]
    output: ServiceCase
    side_effects: ["Analyzer IN_SERVICE -> UNDER_SERVICE; loaner IN_SERVICE -> ON_LOAN; opened_at := clock; response_due_at := opened_at + 24h"]

  - method: GET
    path: "/api/analyzers/{id}/service-cases"
    description: "List service cases involving an analyzer, either as serviced unit or as loaner (covers FKs ServiceCase.analyzer_id and ServiceCase.loaner_analyzer_id); ordered by created_at ASC, ties by insertion order"
    roles: [PlatformAdmin, FinanceReviewer, ClinicManager, FieldServiceEngineer, LaboratoryTechnician]
    code: 200
    input: ["status?", "limit?", "offset?"]
    output: "ServiceCase[]"
    side_effects: []

  - method: PATCH
    path: "/api/service-cases/{id}"
    description: "Drive a service case: action DISPATCH (OPEN->DISPATCHED) | RESOLVE (DISPATCHED->RESOLVED; downtime/sla computed, analyzer and loaner returned, uptime recompute + service-credit cascade) | CANCEL (OPEN|DISPATCHED->CANCELLED with compensation)"
    roles: [FieldServiceEngineer]
    code: 200
    input: [action, "resolution_note?"]
    output: ServiceCase
    side_effects: ["per §1.2 ServiceCase transitions incl. Analyzer and PlacementAgreement cascades"]

  - method: POST
    path: "/api/reagent-orders"
    description: "Submit a reagent order (ClinicManager, own clinic; clinic ACTIVE; agreement ACTIVE or RENEGOTIATION); layered pricing computed and locked at creation (status SUBMITTED)"
    roles: [ClinicManager]
    code: 201
    input: [clinic_id, agreement_id, order_month, lines]
    output: ReagentOrder
    side_effects: ["reagent_order_pricing computed and locked into pricing_detail / final_total_cents"]

  - method: GET
    path: "/api/reagent-orders/{id}"
    description: "Get one reagent order"
    roles: [PlatformAdmin, FinanceReviewer, ClinicManager, FieldServiceEngineer, LaboratoryTechnician]
    code: 200
    input: []
    output: ReagentOrder
    side_effects: []

  - method: GET
    path: "/api/reagent-orders"
    description: "List reagent orders (covers FKs ReagentOrder.clinic_id and ReagentOrder.agreement_id via filters); ordered by created_at ASC, ties by insertion order"
    roles: [PlatformAdmin, FinanceReviewer, ClinicManager, FieldServiceEngineer, LaboratoryTechnician]
    code: 200
    input: ["clinic_id?", "agreement_id?", "status?", "limit?", "offset?"]
    output: "ReagentOrder[]"
    side_effects: []

  - method: PATCH
    path: "/api/reagent-orders/{id}"
    description: "Drive an order: status FULFILLED (from SUBMITTED; sets fulfilled_at; clinic ACTIVE; agreement ACTIVE or RENEGOTIATION) | CANCELLED (from SUBMITTED; conserves all commitment totals)"
    roles: [ClinicManager]
    code: 200
    input: [status]
    output: ReagentOrder
    side_effects: ["per §1.2 ReagentOrder transitions; increments ReagentOrder.version by 1"]

  - method: POST
    path: "/api/lab-test-orders"
    description: "Order a diagnostic test (ClinicManager, own clinic, clinic ACTIVE). origin selects the pipeline branch; PROFICIENCY requires origin IN_CLINIC and expected_result"
    roles: [ClinicManager]
    code: 201
    input: [clinic_id, origin, order_kind, test_code, "analyzer_id?", "expected_result?"]
    output: LabTestOrder
    side_effects: ["status = ORDERED; delivery_status = NOT_READY"]

  - method: GET
    path: "/api/lab-test-orders/{id}"
    description: "Get one lab test order"
    roles: [PlatformAdmin, FinanceReviewer, ClinicManager, FieldServiceEngineer, LaboratoryTechnician]
    code: 200
    input: []
    output: LabTestOrder
    side_effects: []

  - method: GET
    path: "/api/lab-test-orders"
    description: "List lab test orders (covers FKs LabTestOrder.clinic_id and LabTestOrder.analyzer_id via filters); ordered by created_at ASC, ties by insertion order"
    roles: [PlatformAdmin, FinanceReviewer, ClinicManager, FieldServiceEngineer, LaboratoryTechnician]
    code: 200
    input: ["clinic_id?", "analyzer_id?", "status?", "limit?", "offset?"]
    output: "LabTestOrder[]"
    side_effects: []

  - method: PATCH
    path: "/api/lab-test-orders/{id}"
    description: "Drive the pipeline: action RECEIVE (SEND_OUT ORDERED->RECEIVED, LaboratoryTechnician) | RECORD_RESULT (IN_CLINIC from ORDERED by ClinicManager behind analyzer safety gates; SEND_OUT from RECEIVED by LaboratoryTechnician; creates the 1:1 LabResult) | DELIVER (RESULT_RECORDED->DELIVERED; IN_CLINIC requires connectivity ACTIVE) | CANCEL (ORDERED|RECEIVED->CANCELLED)"
    roles: [ClinicManager, LaboratoryTechnician]
    code: 200
    input: [action, "result_value?"]
    output: LabTestOrder
    side_effects: ["per §1.2 LabTestOrder transitions incl. LabResult creation and proficiency cascades"]

  - method: GET
    path: "/api/lab-test-orders/{id}/results"
    description: "Get the unified result record of a test order (covers FK LabResult.test_order_id); 1:1 — array of length 0 or 1, same shape for IN_CLINIC and REFERENCE_LAB sources"
    roles: [PlatformAdmin, FinanceReviewer, ClinicManager, FieldServiceEngineer, LaboratoryTechnician]
    code: 200
    input: []
    output: "LabResult[]"
    side_effects: []

# =============================================================================
# §1.6 Error Code Catalog (29 codes; every code wired to a validation or
# transition precondition)
# =============================================================================
errors:
  - { id: ERR_MISSING_OR_INVALID_USER_CONTEXT_HEADER, http: 400, condition: "X-User-ID or X-User-Role header missing, or X-User-Role not one of the five declared roles" }
  - { id: ERR_INSUFFICIENT_PERMISSIONS, http: 403, condition: "Role not permitted for this endpoint or for this field/action within the endpoint (PATCH clinics status field; PATCH lab-test-orders action-role matrix)" }
  - { id: ERR_CLINIC_OWNERSHIP_MISMATCH, http: 403, condition: "ClinicManager X-User-ID does not equal the clinic_id of the target resource" }
  - { id: ERR_INVALID_REQUEST, http: 400, condition: "Malformed input: missing required field, invalid enum value, term_months not in {24,36,48,60}, discount_pct out of range, order_month outside agreement term, missing result_value on RECORD_RESULT, missing/invalid new_minimum_cents on accept, non-monotonic clock-set, caseload_baseline_tests <= 0" }
  - { id: ERR_INVALID_PROGRAM_TERMS, http: 400, condition: "program_type conditional fields violated: REAGENT_COMMITMENT requires monthly_minimum_cents >= 50000; LEASE requires lease_rate_cents; PURCHASE requires purchase_price_cents; fields of other program types must be absent" }
  - { id: ERR_UNKNOWN_SKU, http: 400, condition: "A sku in lines or sku_overrides is not present in PRICE_TABLE" }
  - { id: ERR_WINDOW_INVALID, http: 400, condition: "GroupPricingAgreement window invalid: effective_to <= effective_from, or effective_to not strictly after the logical clock at creation" }
  - { id: ERR_CLINIC_NOT_FOUND, http: 404, condition: "clinic_id or clinic path id does not exist" }
  - { id: ERR_AGREEMENT_NOT_FOUND, http: 404, condition: "agreement_id or placement-agreement path id does not exist" }
  - { id: ERR_ANALYZER_NOT_FOUND, http: 404, condition: "analyzer path id, analyzer_id, or loaner_analyzer_id does not exist" }
  - { id: ERR_ORDER_NOT_FOUND, http: 404, condition: "reagent-order path id does not exist" }
  - { id: ERR_PERIOD_NOT_FOUND, http: 404, condition: "commitment-period path id does not exist" }
  - { id: ERR_TEST_ORDER_NOT_FOUND, http: 404, condition: "lab-test-order path id does not exist" }
  - { id: ERR_SERVICE_CASE_NOT_FOUND, http: 404, condition: "service-case path id does not exist" }
  - { id: ERR_CLINIC_NOT_ACTIVE, http: 409, condition: "Operation requires Clinic.status == ACTIVE (agreement creation/activation, caseload update, order creation/fulfillment, test-order creation)" }
  - { id: ERR_AGREEMENT_INVALID_STATE, http: 409, condition: "PlacementAgreement not in the required state for the transition (approve/activate/request/resolve/close; analyzer install; order fulfillment; clinic reactivation blocked by BREACHED agreement)" }
  - { id: ERR_ANALYZER_INVALID_STATE, http: 409, condition: "Analyzer not in the required operational state (enter service, service-case creation, loaner eligibility, decommission with open cases, connectivity change while DECOMMISSIONED)" }
  - { id: ERR_CONNECTIVITY_NOT_ACTIVE, http: 409, condition: "In-clinic PATIENT result recording or PIMS delivery requires Analyzer.connectivity_status == ACTIVE" }
  - { id: ERR_PROFICIENCY_LAPSED, http: 409, condition: "In-clinic PATIENT result recording requires Analyzer.proficiency_standing == CURRENT" }
  - { id: ERR_ORDER_INVALID_STATE, http: 409, condition: "ReagentOrder transition requires status == SUBMITTED" }
  - { id: ERR_PERIOD_INVALID_STATE, http: 409, condition: "CommitmentPeriod not OPEN for closing (unknown month for agreement, month not yet elapsed, out-of-sequence close, already CLOSED) or billing_status not ISSUED for payment/waive" }
  - { id: ERR_TEST_ORDER_INVALID_STATE, http: 409, condition: "LabTestOrder transition not legal from current status or for the order's origin (RECEIVE on IN_CLINIC, RECORD_RESULT before RECEIVE on SEND_OUT, CANCEL after result, DELIVER before result)" }
  - { id: ERR_SERVICE_CASE_INVALID_STATE, http: 409, condition: "ServiceCase transition requires OPEN (DISPATCH) or DISPATCHED (RESOLVE), or decommission blocked by OPEN/DISPATCHED case" }
  - { id: ERR_PRICING_AGREEMENT_WINDOW_OVERLAP, http: 409, condition: "New GroupPricingAgreement half-open window overlaps a non-EXPIRED agreement with the same group_type + group_code" }
  - { id: ERR_PLACEMENT_TERM_OVERLAP, http: 409, condition: "Activation would create a second agreement with overlapping CLOSED [start_date, end_date] term for the same clinic_id + model" }
  - { id: ERR_RENEGOTIATION_CASELOAD_DELTA_INSUFFICIENT, http: 422, condition: "abs(caseload_current_tests - baseline_caseload_snapshot) < 0.30 * baseline_caseload_snapshot" }
  - { id: ERR_OUTSTANDING_SHORTFALL_UNPAID, http: 402, condition: "Clinic termination blocked: a PlacementAgreement has cumulative_unpaid_billed_cents > 0" }
  - { id: ERR_PAYMENT_AMOUNT_MISMATCH, http: 402, condition: "record-payment amount_cents does not equal the period's billed_cents exactly" }
  - { id: ERR_STALE_AGREEMENT_VERSION, http: 412, condition: "expected_agreement_version does not match the PlacementAgreement's current version (OCC)" }

# =============================================================================
# §1.7 RBAC Matrix (5 roles; segregation-of-duties model)
# =============================================================================
roles:
  - name: PlatformAdmin
    description: "IDEXX operations administrator: logical clock, group pricing agreements, clinic onboarding and status, agreement activation, commitment-period closes"
    identity: opaque
    exclusive_operations:
      - "POST /api/_clock/set_current_utc"
      - "POST /api/group-pricing-agreements"
      - "POST /api/clinics"
      - "POST /api/placement-agreements/{id}/activate"
      - "POST /api/placement-agreements/{id}/close-commitment-period"
      - "PATCH /api/clinics/{id} — status field only"
    shared_operations:
      - "all GET endpoints"
      - "PATCH /api/clinics/{id} — caseload_current_tests field (shared with ClinicManager)"
  - name: FinanceReviewer
    description: "IDEXX finance: approves drafted agreements, resolves renegotiations, records shortfall payments"
    identity: opaque
    exclusive_operations:
      - "POST /api/placement-agreements/{id}/approve"
      - "POST /api/placement-agreements/{id}/resolve-renegotiation"
      - "POST /api/commitment-periods/{id}/record-payment"
    shared_operations:
      - "all GET endpoints"
  - name: ClinicManager
    description: "Clinic-side operator acting for exactly one clinic: drafts agreements, requests renegotiation, orders reagents, runs in-clinic tests, receives results into the PIMS-facing record"
    identity: "entity_backed:Clinic"
    exclusive_operations:
      - "POST /api/placement-agreements"
      - "POST /api/placement-agreements/{id}/request-renegotiation"
      - "POST /api/reagent-orders"
      - "PATCH /api/reagent-orders/{id}"
      - "POST /api/lab-test-orders"
      - "PATCH /api/lab-test-orders/{id} — actions RECORD_RESULT (IN_CLINIC), DELIVER, CANCEL"
    shared_operations:
      - "all GET endpoints"
      - "PATCH /api/clinics/{id} — caseload_current_tests field, own clinic only"
  - name: FieldServiceEngineer
    description: "IDEXX field service: installs and configures analyzers, manages connectivity, dispatches and resolves service and calibration cases, assigns loaners"
    identity: opaque
    exclusive_operations:
      - "POST /api/analyzers"
      - "PATCH /api/analyzers/{id}"
      - "POST /api/service-cases"
      - "PATCH /api/service-cases/{id}"
    shared_operations:
      - "all GET endpoints"
  - name: LaboratoryTechnician
    description: "Reference-laboratory operator: receives send-out samples and records reference-lab results"
    identity: opaque
    exclusive_operations:
      - "PATCH /api/lab-test-orders/{id} — actions RECEIVE and RECORD_RESULT (SEND_OUT)"
    shared_operations:
      - "all GET endpoints"
