              payload: { lender_id: "${lender_id}", age: 75, expected_rate_bps: 500, factor_micros: 523000 }
              as: ServicerOps
            - call: "POST /loans/_clock/set"
              payload: { lender_id: "${lender_id}", to_iso8601: "2024-01-01T00:00:00.000Z" }
              as: ServicerOps
            - call: "POST /borrowers"
              payload: { lender_id: "${lender_id}", full_name: "Jo Borrower", birthdate: "1948-06-01" }
              as: ServicerOps
              captures: { borrower_id: $.data.id }
            - call: "POST /borrowers"
              payload: { lender_id: "${lender_id}", full_name: "Jay Spouse", birthdate: "1956-08-01", is_non_borrowing_spouse: true, nbs_qualifies: false }
              as: ServicerOps
              captures: { nbs_id: $.data.id }
            - call: "POST /loans"
              payload: { lender_id: "${lender_id}", borrower_id: "${borrower_id}", non_borrowing_spouse_id: "${nbs_id}", appraised_value_cents: 30000000, expected_rate_bps: 500, draw_type: "LINE_OF_CREDIT", initial_financed_costs_cents: 1000000 }
              as: ServicerOps
              captures: { loan_id: $.data.id }
            - call: "POST /loans/${loan_id}/originate"
              payload: {}
              as: ServicerOps
            - call: "POST /maturity-events"
              payload: { loan_id: "${loan_id}", event_type: "PERMANENT_VACANCY", event_date: "2025-02-15" }
              as: ComplianceOfficer
              captures: { event_id: $.data.id }
          trigger:
            - call: "POST /nbs-deferrals"
              payload: { loan_id: "${loan_id}", borrower_id: "${nbs_id}", maturity_event_id: "${event_id}" }
              as: ComplianceOfficer
              captures: { err: $.data.error_id }
          assert:
            - "HTTP status == 422"
            - "data.error_id == ERR_NBS_NOT_QUALIFIED (referential p9 beats temporal p10)"

  # ===========================================================================
  - rule_id: boundary_precision_check
    instances:
      - name: borrower_age_exactly_62_allowed_61_rejected
        grounds:
          - validations[priority=6]
          - calculations.principal_limit
          - errors[ERR_BORROWER_UNDER_AGE]
          - endpoints["POST /loans/{loanId}/originate"]
        distinguishing_aspect: |
          Numeric age threshold (>= vs >) on the origination endpoint: a borrower turning exactly 62
          on the origination clock date originates successfully, while a borrower one day short of 62
          is rejected with ERR_BORROWER_UNDER_AGE. Distinct metric (age) reached via originate.
        test_recipe:
          setup:
            - "Clock 2024-01-01. PLF row for age 62, 500bps exists. Two loans: borrower born 2002-01-01 (exactly 62) and borrower born 2002-01-02 (61y364d)."
