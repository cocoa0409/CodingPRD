      - name: window_conflict_temporal_beats_daily_limit_constraint
        grounds:
          - validations[priority=66]
          - validations[priority=70]
          - errors[ERR_INSPECTOR_WINDOW_CONFLICT]
          - errors[ERR_INSPECTOR_DAILY_LIMIT]
          - calculations.inspector_window_occupancy
        distinguishing_aspect: |
          Error-category pair (business_temporal, business_constraint), a different pairing from the
          state-versus-fiscal conflict: the same schedule request both overlaps an existing window
          and exhausts max_daily_assignments 1, and priority 66 must win with 409
          ERR_INSPECTOR_WINDOW_CONFLICT rather than 409 ERR_INSPECTOR_DAILY_LIMIT.
        test_recipe:
          setup:
            - "District T-BUSY with one inspector whose max_daily_assignments is 1."
            - "Order 1 is SCHEDULED on that inspector for 2026-08-10T09:00:00Z to 2026-08-10T11:00:00Z in T-BUSY, so the inspector's version is 2 and the 2026-08-10 day count is 1."
