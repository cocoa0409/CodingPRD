  # Rule 7 — cross_entity_state_dependency (different entity pairs)
  # ------------------------------------------------------------------
  - rule_id: cross_entity_state_dependency
    instances:
      - name: takeoff_submit_blocked_when_account_suspended
        grounds:
          - state_machines.Takeoff.DRAFT_to_SUBMITTED
          - state_machines.ContractorAccount.ACTIVE_to_SUSPENDED
          - errors[ERR_ACCOUNT_SUSPENDED]
        distinguishing_aspect: |
          Pair = (Takeoff, ContractorAccount). A takeoff on a project whose
          account transitions ACTIVE → SUSPENDED after the takeoff was drafted
          cannot be submitted; the DRAFT → SUBMITTED transition is gated on the
          parent's parent state, not on the takeoff itself.
        test_recipe:
          setup:
            - "Account with project, product, draft takeoff"
            - "Account is then suspended by CreditManager"
          setup_api_calls:
            - call: "POST /supply/contractor-accounts"
              payload: { company_name: "Susp Co", credit_limit_cents: 5000000, default_waste_pct_bp: 0 }
              as: CreditManager
              captures: { acct_id: $.data.id }
            - call: "POST /supply/products"
              payload: { sku: "REG-4x8-1/2", board_kind: "REGULAR", length_ft: 8, width_ft: 4, thickness_in: "1/2", sheets_per_bundle: 20, unit_price_cents_per_sheet: 1500, lead_time_days: 0 }
              as: WarehouseManager
              captures: { prod_id: $.data.id }
            - call: "POST /supply/projects"
              payload: { account_id: "${acct_id}", jobsite_name: "P", distance_miles: 10, framing_pct_complete: 60 }
              as: EstimatorUser
              captures: { proj_id: $.data.id }
            - call: "POST /supply/takeoffs"
              payload: { project_id: "${proj_id}" }
              as: EstimatorUser
              captures: { tk_id: $.data.id }
            - call: "POST /supply/takeoffs/${tk_id}/lines"
              payload: { product_id: "${prod_id}", sheet_count: 20 }
              as: EstimatorUser
            - call: "POST /supply/contractor-accounts/${acct_id}/suspend"
              payload: {}
              as: CreditManager
          trigger:
            - call: "POST /supply/takeoffs/${tk_id}/submit"
              payload: {}
              as: EstimatorUser
              captures: { err_id: $.data.error_id }
          assert:
            - "captured err_id == ERR_ACCOUNT_SUSPENDED"

      - name: stocking_order_schedule_blocked_when_project_not_open
        grounds:
          - state_machines.StockingOrder.DRAFT_to_SCHEDULED
          - state_machines.Project.PLANNING_to_STOCKING_OPEN
          - errors[ERR_PROJECT_NOT_STOCKING_OPEN]
        distinguishing_aspect: |
          Pair = (StockingOrder, Project) — distinct from (Takeoff,
          ContractorAccount). A stocking order cannot transition DRAFT →
          SCHEDULED while its parent Project is still in PLANNING, even though
          the order itself is otherwise well-formed.
        test_recipe:
          setup:
            - "Account ACTIVE, project framing_pct_complete=60 (could open, but Foreman has not called open-stocking)"
            - "Locked takeoff on the project"
            - "BoomTruck and StockingOrder with one drop created"
          setup_api_calls:
            - call: "POST /supply/_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-01T00:00:00Z" }
              as: CreditManager
            - call: "POST /supply/contractor-accounts"
              payload: { company_name: "Gate Co", credit_limit_cents: 5000000, default_waste_pct_bp: 0 }
              as: CreditManager
              captures: { acct_id: $.data.id }
            - call: "POST /supply/products"
              payload: { sku: "REG-4x8-1/2", board_kind: "REGULAR", length_ft: 8, width_ft: 4, thickness_in: "1/2", sheets_per_bundle: 20, unit_price_cents_per_sheet: 1500, lead_time_days: 0 }
              as: WarehouseManager
              captures: { prod_id: $.data.id }
            - call: "POST /supply/projects"
              payload: { account_id: "${acct_id}", jobsite_name: "P", distance_miles: 10, framing_pct_complete: 60 }
              as: EstimatorUser
              captures: { proj_id: $.data.id }
            - call: "POST /supply/takeoffs"
              payload: { project_id: "${proj_id}" }
              as: EstimatorUser
              captures: { tk_id: $.data.id }
            - call: "POST /supply/takeoffs/${tk_id}/lines"
              payload: { product_id: "${prod_id}", sheet_count: 20 }
              as: EstimatorUser
            - call: "POST /supply/takeoffs/${tk_id}/submit"
              payload: {}
              as: EstimatorUser
            - call: "GET /supply/takeoffs/${tk_id}"
              payload: {}
              as: EstimatorUser
              captures: { tk_v: $.data.version }
            - call: "POST /supply/takeoffs/${tk_id}/lock"
              payload: { expected_takeoff_version: "${tk_v}" }
              as: EstimatorUser
            - call: "POST /supply/boom-trucks"
              payload: { truck_code: "BT-01", max_bundle_capacity: 100, max_weight_lbs: 100000 }
              as: DispatcherUser
              captures: { truck_id: $.data.id }
            - call: "POST /supply/stocking-orders"
              payload: { project_id: "${proj_id}", takeoff_id: "${tk_id}", scheduled_date: "2026-08-02", shift_window: "AM", boom_truck_id: "${truck_id}" }
              as: DispatcherUser
              captures: { ord_id: $.data.id }
            - call: "POST /supply/stocking-orders/${ord_id}/drops"
              payload: { floor_label: "L1", room_label: "101", product_id: "${prod_id}", bundle_count: 1 }
              as: DispatcherUser
          trigger:
            - call: "POST /supply/stocking-orders/${ord_id}/schedule"
              payload: {}
              as: DispatcherUser
              captures: { err_id: $.data.error_id }
          assert:
            - "captured err_id == ERR_PROJECT_NOT_STOCKING_OPEN"

  # ------------------------------------------------------------------
  # Rule 8 — resource_temporal_overlap (different interval semantics)
  # ------------------------------------------------------------------
  - rule_id: resource_temporal_overlap
    instances:
      - name: same_truck_same_shift_rejected
        grounds:
          - validations[priority=8]
          - errors[ERR_SHIFT_DOUBLE_BOOKED]
        distinguishing_aspect: |
          Resource = BoomTruck; interval semantics = half-open half-day slot
          [shift_start, shift_end) keyed by (boom_truck_id, scheduled_date,
          shift_window). A second order on the same truck+date+shift is
          rejected; the same truck on the PM shift or the next day is allowed.
        test_recipe:
          setup:
            - "Account, project STOCKING_OPEN, locked takeoff"
            - "One boom truck BT-01"
            - "Order O1 scheduled on (BT-01, 2026-08-02, AM)"
            - "Order O2 also asks (BT-01, 2026-08-02, AM) — must be rejected"
            - "Order O3 asks (BT-01, 2026-08-02, PM) — must succeed"
          setup_api_calls:
            - call: "POST /supply/_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-01T00:00:00Z" }
              as: CreditManager
            - call: "POST /supply/contractor-accounts"
              payload: { company_name: "Overlap Co", credit_limit_cents: 9000000, default_waste_pct_bp: 0 }
              as: CreditManager
              captures: { acct_id: $.data.id }
            - call: "POST /supply/products"
              payload: { sku: "REG-4x8-1/2", board_kind: "REGULAR", length_ft: 8, width_ft: 4, thickness_in: "1/2", sheets_per_bundle: 20, unit_price_cents_per_sheet: 1500, lead_time_days: 0 }
              as: WarehouseManager
              captures: { prod_id: $.data.id }
            - call: "POST /supply/projects"
              payload: { account_id: "${acct_id}", jobsite_name: "P", distance_miles: 10, framing_pct_complete: 60 }
              as: EstimatorUser
              captures: { proj_id: $.data.id }
            - call: "POST /supply/takeoffs"
              payload: { project_id: "${proj_id}" }
              as: EstimatorUser
              captures: { tk_id: $.data.id }
            - call: "POST /supply/takeoffs/${tk_id}/lines"
              payload: { product_id: "${prod_id}", sheet_count: 20 }
              as: EstimatorUser
            - call: "POST /supply/takeoffs/${tk_id}/submit"
              payload: {}
              as: EstimatorUser
            - call: "GET /supply/takeoffs/${tk_id}"
              payload: {}
              as: EstimatorUser
              captures: { tk_v: $.data.version }
            - call: "POST /supply/takeoffs/${tk_id}/lock"
              payload: { expected_takeoff_version: "${tk_v}" }
              as: EstimatorUser
            - call: "POST /supply/projects/${proj_id}/open-stocking"
              payload: {}
              as: Foreman
            - call: "POST /supply/boom-trucks"
              payload: { truck_code: "BT-01", max_bundle_capacity: 100, max_weight_lbs: 100000 }
              as: DispatcherUser
              captures: { truck_id: $.data.id }
            - call: "POST /supply/stocking-orders"
              payload: { project_id: "${proj_id}", takeoff_id: "${tk_id}", scheduled_date: "2026-08-02", shift_window: "AM", boom_truck_id: "${truck_id}" }
              as: DispatcherUser
              captures: { ord1: $.data.id }
            - call: "POST /supply/stocking-orders/${ord1}/drops"
              payload: { floor_label: "L1", room_label: "101", product_id: "${prod_id}", bundle_count: 1 }
              as: DispatcherUser
            - call: "POST /supply/stocking-orders/${ord1}/schedule"
              payload: {}
              as: DispatcherUser
            - call: "POST /supply/stocking-orders"
              payload: { project_id: "${proj_id}", takeoff_id: "${tk_id}", scheduled_date: "2026-08-02", shift_window: "AM", boom_truck_id: "${truck_id}" }
              as: DispatcherUser
              captures: { ord2: $.data.id }
            - call: "POST /supply/stocking-orders/${ord2}/drops"
              payload: { floor_label: "L1", room_label: "102", product_id: "${prod_id}", bundle_count: 1 }
              as: DispatcherUser
            - call: "POST /supply/stocking-orders"
              payload: { project_id: "${proj_id}", takeoff_id: "${tk_id}", scheduled_date: "2026-08-02", shift_window: "PM", boom_truck_id: "${truck_id}" }
              as: DispatcherUser
              captures: { ord3: $.data.id }
            - call: "POST /supply/stocking-orders/${ord3}/drops"
              payload: { floor_label: "L1", room_label: "103", product_id: "${prod_id}", bundle_count: 1 }
              as: DispatcherUser
          trigger:
            - call: "POST /supply/stocking-orders/${ord2}/schedule"
              payload: {}
              as: DispatcherUser
              captures: { err_am: $.data.error_id }
            - call: "POST /supply/stocking-orders/${ord3}/schedule"
              payload: {}
              as: DispatcherUser
              captures: { status_pm: $.data.status }
          assert:
            - "captured err_am == ERR_SHIFT_DOUBLE_BOOKED"
            - "captured status_pm == SCHEDULED"

      - name: lead_time_window_blocks_early_schedule_for_rated_product
        grounds:
          - validations[priority=7]
          - errors[ERR_LEAD_TIME_VIOLATION]
        distinguishing_aspect: |
          Resource = calendar window relative to today; interval semantics =
          minimum-offset window [today + max_lead_time, infinity) computed from
          a Product.lead_time_days attribute — different from the half-day slot
          arithmetic of the first instance. Scheduling a FIRE_RATED order with
          scheduled_date < today + 7 violates the lead-time window.
        test_recipe:
          setup:
            - "Account ACTIVE, project STOCKING_OPEN, framing=60"
            - "FIRE_RATED product with lead_time_days=7"
            - "Locked takeoff with the rated line (framing >= 30 allows submit)"
            - "BoomTruck"
            - "Order O1 scheduled for today + 5 days (too soon); Order O2 scheduled for today + 7 days (boundary, allowed)"
          setup_api_calls:
            - call: "POST /supply/_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-01T00:00:00Z" }
              as: CreditManager
            - call: "POST /supply/contractor-accounts"
              payload: { company_name: "Lead Co", credit_limit_cents: 9000000, default_waste_pct_bp: 0 }
              as: CreditManager
              captures: { acct_id: $.data.id }
            - call: "POST /supply/products"
              payload: { sku: "FIRE-4x8-5/8", board_kind: "FIRE_RATED", length_ft: 8, width_ft: 4, thickness_in: "5/8", sheets_per_bundle: 16, unit_price_cents_per_sheet: 2400, lead_time_days: 7 }
              as: WarehouseManager
              captures: { prod_id: $.data.id }
            - call: "POST /supply/projects"
              payload: { account_id: "${acct_id}", jobsite_name: "P", distance_miles: 10, framing_pct_complete: 60 }
              as: EstimatorUser
              captures: { proj_id: $.data.id }
            - call: "POST /supply/takeoffs"
              payload: { project_id: "${proj_id}" }
              as: EstimatorUser
              captures: { tk_id: $.data.id }
            - call: "POST /supply/takeoffs/${tk_id}/lines"
              payload: { product_id: "${prod_id}", sheet_count: 32 }
              as: EstimatorUser
            - call: "POST /supply/takeoffs/${tk_id}/submit"
              payload: {}
              as: EstimatorUser
            - call: "GET /supply/takeoffs/${tk_id}"
              payload: {}
              as: EstimatorUser
              captures: { tk_v: $.data.version }
            - call: "POST /supply/takeoffs/${tk_id}/lock"
              payload: { expected_takeoff_version: "${tk_v}" }
              as: EstimatorUser
            - call: "POST /supply/projects/${proj_id}/open-stocking"
              payload: {}
              as: Foreman
            - call: "POST /supply/boom-trucks"
              payload: { truck_code: "BT-01", max_bundle_capacity: 100, max_weight_lbs: 100000 }
              as: DispatcherUser
              captures: { truck_id: $.data.id }
            - call: "POST /supply/stocking-orders"
              payload: { project_id: "${proj_id}", takeoff_id: "${tk_id}", scheduled_date: "2026-08-06", shift_window: "AM", boom_truck_id: "${truck_id}" }
              as: DispatcherUser
              captures: { ord_early: $.data.id }
            - call: "POST /supply/stocking-orders/${ord_early}/drops"
              payload: { floor_label: "L1", room_label: "101", product_id: "${prod_id}", bundle_count: 2 }
              as: DispatcherUser
            - call: "POST /supply/stocking-orders"
              payload: { project_id: "${proj_id}", takeoff_id: "${tk_id}", scheduled_date: "2026-08-08", shift_window: "AM", boom_truck_id: "${truck_id}" }
              as: DispatcherUser
              captures: { ord_ok: $.data.id }
            - call: "POST /supply/stocking-orders/${ord_ok}/drops"
              payload: { floor_label: "L1", room_label: "102", product_id: "${prod_id}", bundle_count: 2 }
              as: DispatcherUser
          trigger:
            - call: "POST /supply/stocking-orders/${ord_early}/schedule"
              payload: {}
              as: DispatcherUser
              captures: { err_early: $.data.error_id }
            - call: "POST /supply/stocking-orders/${ord_ok}/schedule"
              payload: {}
              as: DispatcherUser
              captures: { status_ok: $.data.status }
          assert:
            - "captured err_early == ERR_LEAD_TIME_VIOLATION"
            - "captured status_ok == SCHEDULED"

  # ------------------------------------------------------------------
  # Rule 9 — compensating_invariant (different conserved quantities)
  # ------------------------------------------------------------------
  - rule_id: compensating_invariant
    instances:
      - name: payment_application_conserves_draw_balance
        grounds:
          - state_machines.DrawRequest
          - calculations.draw_amount
          - entities.DrawRequest.fields.paid_cents
          - entities.DrawRequest.fields.requested_cents
        distinguishing_aspect: |
          Conserved quantity = draw-request monetary balance. Invariant: for
          every DrawRequest, paid_cents + (sum of outstanding) ==
          requested_cents; the forward action (issue) and its compensating
          action (payment application) preserve paid_cents <= requested_cents
          and Account.ar_outstanding_cents == sum over non-VOIDED draws of
          (requested_cents - paid_cents).
        test_recipe:
          setup:
            - "Stocked order producing a draw of 112213 (as in cascade instance 1)"
            - "Apply partial payment 50000, then another 62213 (the exact remainder)"
          setup_api_calls:
            - call: "POST /supply/_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-01T00:00:00Z" }
              as: CreditManager
            - call: "POST /supply/contractor-accounts"
              payload: { company_name: "Inv Co", credit_limit_cents: 5000000, default_waste_pct_bp: 1000 }
              as: CreditManager
              captures: { acct_id: $.data.id }
            - call: "POST /supply/products"
              payload: { sku: "REG-4x8-1/2", board_kind: "REGULAR", length_ft: 8, width_ft: 4, thickness_in: "1/2", sheets_per_bundle: 20, unit_price_cents_per_sheet: 1500, lead_time_days: 0 }
              as: WarehouseManager
              captures: { prod_id: $.data.id }
            - call: "POST /supply/projects"
              payload: { account_id: "${acct_id}", jobsite_name: "P", distance_miles: 10, framing_pct_complete: 60 }
              as: EstimatorUser
              captures: { proj_id: $.data.id }
            - call: "POST /supply/takeoffs"
              payload: { project_id: "${proj_id}" }
              as: EstimatorUser
              captures: { tk_id: $.data.id }
            - call: "POST /supply/takeoffs/${tk_id}/lines"
              payload: { product_id: "${prod_id}", sheet_count: 50 }
              as: EstimatorUser
            - call: "POST /supply/takeoffs/${tk_id}/submit"
              payload: {}
              as: EstimatorUser
            - call: "PATCH /supply/products/${prod_id}"
              payload: { unit_price_cents_per_sheet: 1700 }
              as: WarehouseManager
            - call: "GET /supply/takeoffs/${tk_id}"
              payload: {}
              as: EstimatorUser
              captures: { tk_v: $.data.version }
            - call: "POST /supply/takeoffs/${tk_id}/lock"
              payload: { expected_takeoff_version: "${tk_v}" }
              as: EstimatorUser
            - call: "POST /supply/projects/${proj_id}/open-stocking"
              payload: {}
              as: Foreman
            - call: "POST /supply/boom-trucks"
              payload: { truck_code: "BT-01", max_bundle_capacity: 100, max_weight_lbs: 100000 }
              as: DispatcherUser
              captures: { truck_id: $.data.id }
            - call: "POST /supply/stocking-orders"
              payload: { project_id: "${proj_id}", takeoff_id: "${tk_id}", scheduled_date: "2026-08-02", shift_window: "AM", boom_truck_id: "${truck_id}" }
              as: DispatcherUser
              captures: { ord_id: $.data.id }
            - call: "POST /supply/stocking-orders/${ord_id}/drops"
              payload: { floor_label: "L1", room_label: "101", product_id: "${prod_id}", bundle_count: 3 }
              as: DispatcherUser
            - call: "POST /supply/stocking-orders/${ord_id}/schedule"
              payload: {}
              as: DispatcherUser
            - call: "POST /supply/_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-02T08:00:00Z" }
              as: CreditManager
            - call: "POST /supply/stocking-orders/${ord_id}/dispatch"
              payload: {}
              as: DispatcherUser
            - call: "POST /supply/stocking-orders/${ord_id}/mark-stocked"
              payload: {}
              as: Foreman
            - call: "GET /supply/draw-requests"
              payload: { project_id: "${proj_id}" }
              as: CreditManager
              captures: { draw_id: "$.data[0].id" }
          trigger:
            - call: "POST /supply/draw-requests/${draw_id}/payments"
              payload: { amount_cents: 50000, method: "ACH", received_at: "2026-08-03T00:00:00Z" }
              as: AccountsReceivableUser
            - call: "POST /supply/draw-requests/${draw_id}/payments"
              payload: { amount_cents: 62213, method: "ACH", received_at: "2026-08-04T00:00:00Z" }
              as: AccountsReceivableUser
            - call: "GET /supply/draw-requests/${draw_id}"
              payload: {}
              as: CreditManager
              captures: { draw_status: $.data.status, draw_paid: $.data.paid_cents, draw_requested: $.data.requested_cents }
            - call: "GET /supply/contractor-accounts/${acct_id}"
              payload: {}
              as: CreditManager
              captures: { acct_ar: $.data.ar_outstanding_cents }
          assert:
            - "captured draw_requested == 112213"
            - "captured draw_paid == 112213"
            - "captured draw_status == PAID"
            - "captured acct_ar == 0"

      - name: bundle_return_accept_conserves_account_ar
        grounds:
          - state_machines.BundleReturn.PENDING_INSPECTION_to_ACCEPTED
          - calculations.restock_fee
          - entities.ContractorAccount.fields.ar_outstanding_cents
