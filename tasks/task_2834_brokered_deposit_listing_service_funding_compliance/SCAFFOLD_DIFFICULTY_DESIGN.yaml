              payload: { agreement_ref: "AGR-2834-07-H", fee_structure: "FLAT_FEE", fee_flat_cents: 25000, termination_notice_days: 30, effective_date: "2026-07-01", aml_program_score: 80, financial_condition_score: 75, insurance_coverage_score: 70, recordkeeping_score: 65 }
