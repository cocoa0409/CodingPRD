            - "GeofenceCampaign.${camp_id}.state == PLANNED"
            - "GeofenceZone.${zone_id}.last_campaign_activated_at == null"

      - name: error_collection_consent_required_on_share_grant
        claim_type: error_triggerability
        grounds: ["errors[ERR_COLLECTION_CONSENT_REQUIRED]", "validations[priority=15]"]
        distinguishing_aspect: "A single-axis SHARE grant on a record whose collection_state is NOT_REQUESTED is refused with ERR_COLLECTION_CONSENT_REQUIRED and leaves active_share_consent_count at 0."
