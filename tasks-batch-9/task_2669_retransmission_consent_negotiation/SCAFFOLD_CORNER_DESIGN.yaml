          rationale: "Both decision branches and their effect on the execution dimension are asserted there."

  # =========================================================================
  - section: errors
    instances:
      - name: corner_unknown_path_ids_return_their_own_not_found_error
        claim_type: Not Found
        grounds:
          - validations[priority=4]
          - errors.ERR_DISTRIBUTOR_NOT_FOUND
          - errors.ERR_ELECTION_NOT_FOUND
          - errors.ERR_NEGOTIATION_NOT_FOUND
          - errors.ERR_OFFER_NOT_FOUND
          - errors.ERR_AGREEMENT_NOT_FOUND
          - errors.ERR_AUDIT_FINDING_NOT_FOUND
          - errors.ERR_DISPUTE_NOT_FOUND
          - errors.ERR_SETTLEMENT_NOT_FOUND
        distinguishing_aspect: "Every path id resolves to its own 404 identifier rather than a shared generic one, and the priority-4 path lookup runs before any state or body check, so even the action endpoints answer with the resource's own NOT_FOUND error."
        test_recipe:
          setup:
            - "An empty database: no station, distributor, election, negotiation, offer, agreement, finding, dispute or settlement exists"
          setup_api_calls: []
          trigger:
            - call: "GET /retrans/distributors/00000000-0000-4000-8000-000000000000"
              payload: {}
              as: CarriageAdmin
              as_user_id: "admin-1"
              captures: { e_dist: "$.data.error_id" }
            - call: "GET /retrans/elections/00000000-0000-4000-8000-000000000000"
              payload: {}
              as: CarriageAdmin
              as_user_id: "admin-1"
              captures: { e_el: "$.data.error_id" }
            - call: "GET /retrans/negotiations/00000000-0000-4000-8000-000000000000"
              payload: {}
              as: CarriageAdmin
              as_user_id: "admin-1"
              captures: { e_neg: "$.data.error_id" }
            - call: "GET /retrans/offers/00000000-0000-4000-8000-000000000000"
              payload: {}
              as: CarriageAdmin
              as_user_id: "admin-1"
              captures: { e_off: "$.data.error_id" }
            - call: "GET /retrans/agreements/00000000-0000-4000-8000-000000000000"
              payload: {}
              as: CarriageAdmin
              as_user_id: "admin-1"
              captures: { e_agr: "$.data.error_id" }
            - call: "POST /retrans/audit-findings/00000000-0000-4000-8000-000000000000/resolve"
              payload: { resolution: "SUBSTANTIATED", resolution_note: "No such finding" }
              as: ComplianceOfficer
              as_user_id: "compliance-1"
              captures: { e_find: "$.data.error_id" }
            - call: "POST /retrans/rights-disputes/00000000-0000-4000-8000-000000000000/resolve"
              payload: { resolution: "INCLUDED", resolution_note: "No such dispute" }
              as: ComplianceOfficer
              as_user_id: "compliance-1"
              captures: { e_disp: "$.data.error_id" }
            - call: "POST /retrans/fee-settlements/00000000-0000-4000-8000-000000000000/void"
              payload: { void_reason: "No such settlement" }
              as: GroupCounsel
              as_user_id: "counsel-1"
              captures: { e_set: "$.data.error_id" }
          assert:
            - "All eight calls return HTTP 404"
            - "${e_dist} == \"ERR_DISTRIBUTOR_NOT_FOUND\" and ${e_el} == \"ERR_ELECTION_NOT_FOUND\""
            - "${e_neg} == \"ERR_NEGOTIATION_NOT_FOUND\" and ${e_off} == \"ERR_OFFER_NOT_FOUND\""
            - "${e_agr} == \"ERR_AGREEMENT_NOT_FOUND\""
            - "${e_find} == \"ERR_AUDIT_FINDING_NOT_FOUND\" and ${e_disp} == \"ERR_DISPUTE_NOT_FOUND\""
            - "${e_set} == \"ERR_SETTLEMENT_NOT_FOUND\""

      - name: corner_body_foreign_key_and_pagination_errors_are_rejected
        claim_type: Not Found
        grounds:
          - validations[priority=3]
          - validations[priority=5]
          - errors.ERR_DISTRIBUTOR_NOT_FOUND
          - errors.ERR_INVALID_REQUEST
          - response_envelope.pagination_defaults
        distinguishing_aspect: "Shape validation at priority 3 precedes the body foreign-key lookup at priority 5: limit 200 is a 400 ERR_INVALID_REQUEST because the ceiling is 100, while a well-formed election body naming an unknown distributor_id is a 404 ERR_DISTRIBUTOR_NOT_FOUND."
        test_recipe:
          setup:
            - "One CBS station and no distributors at all"
          setup_api_calls:
            - call: "POST /retrans/stations"
              payload: { call_sign: "WXYZ", market_code: "SEA", dma_rank: 12, market_tv_households: 1800000, network_affiliation: "CBS" }
              as: CarriageAdmin
              as_user_id: "admin-1"
              captures: { st_id: "$.data.id" }
          trigger:
            - call: "POST /retrans/elections"
              payload: { station_id: "${st_id}", distributor_id: "00000000-0000-4000-8000-000000000000", cycle_label: "2027-2029", election_type: "RETRANS_CONSENT", requested_tier: "EXPANDED_BASIC", incumbent_expiry_utc: "2027-01-01T00:00:00Z", incumbent_rate_per_sub_cents: 220 }
              as: StationGroupNegotiator
              as_user_id: "${st_id}"
              captures: { e_fk: "$.data.error_id" }
            - call: "GET /retrans/elections"
              payload: { limit: 200, offset: 0 }
              as: CarriageAdmin
              as_user_id: "admin-1"
              captures: { e_page: "$.data.error_id" }
            - call: "GET /retrans/elections"
              payload: { limit: 100, offset: 0 }
              as: CarriageAdmin
              as_user_id: "admin-1"
          assert:
            - "${e_fk} == \"ERR_DISTRIBUTOR_NOT_FOUND\" with HTTP 404"
            - "${e_page} == \"ERR_INVALID_REQUEST\" with HTTP 400"
            - "The limit 100 request returns HTTP 200 with total_count == 0 and has_more == false"
            - "No CarriageElection row was created by the refused call"

  # =========================================================================
  - section: rbac
    instances:
      - name: corner_missing_auth_headers_are_unauthenticated
        claim_type: RBAC role
        grounds:
          - validations[priority=1]
          - errors.ERR_UNAUTHENTICATED
          - roles
        distinguishing_aspect: "Priority 1 demands BOTH headers and a role drawn from the six declared roles, so an omitted X-User-Role, an omitted X-User-ID and an unknown role name all yield 401 ERR_UNAUTHENTICATED rather than the 403 ERR_ROLE_NOT_PERMITTED of priority 2."
        test_recipe:
          setup:
            - "No rows are required; authentication is checked before any lookup"
          setup_api_calls: []
          trigger:
            - call: "GET /retrans/elections"
              payload: {}
              as: "(X-User-Role header omitted)"
              as_user_id: "admin-1"
              captures: { e_norole: "$.data.error_id" }
            - call: "GET /retrans/elections"
              payload: {}
              as: CarriageAdmin
              as_user_id: "(X-User-ID header omitted)"
              captures: { e_noid: "$.data.error_id" }
            - call: "GET /retrans/elections"
              payload: {}
              as: "SalesPlanner"
              as_user_id: "sales-1"
              captures: { e_badrole: "$.data.error_id" }
          assert:
            - "All three calls return HTTP 401"
            - "${e_norole} == \"ERR_UNAUTHENTICATED\" and ${e_noid} == \"ERR_UNAUTHENTICATED\""
            - "${e_badrole} == \"ERR_UNAUTHENTICATED\" because SalesPlanner is not one of the six declared roles, not 403"

      - name: corner_other_roles_exclusive_operations_are_rejected
        claim_type: RBAC role
        grounds:
          - validations[priority=2]
          - validations[priority=4]
          - errors.ERR_ROLE_NOT_PERMITTED
          - endpoints["GET /retrans/agreements/{id}/fee-settlements"]
          - endpoints["GET /retrans/subscriber-reports/{id}"]
          - endpoints["POST /retrans/agreements/{id}/fee-settlements"]
          - roles
        distinguishing_aspect: "The role gate at priority 2 fires before the path lookup at priority 4, so all three calls answer 403 ERR_ROLE_NOT_PERMITTED even though the ids do not exist; this also pins the two deliberate role gaps (DistributorRep is barred from the agreement fee-settlement ledger, NetworkRepresentative from every subscriber-report read) and the GroupCounsel-only settlement authority."
        test_recipe:
          setup:
            - "No rows are required; the role gate precedes existence checks"
          setup_api_calls: []
          trigger:
            - call: "GET /retrans/agreements/00000000-0000-4000-8000-000000000000/fee-settlements"
              payload: {}
              as: DistributorRep
              as_user_id: "00000000-0000-4000-8000-000000000001"
              captures: { e_rep: "$.data.error_id" }
            - call: "GET /retrans/subscriber-reports/00000000-0000-4000-8000-000000000000"
              payload: {}
              as: NetworkRepresentative
              as_user_id: "netrep-1"
              captures: { e_net: "$.data.error_id" }
            - call: "POST /retrans/agreements/00000000-0000-4000-8000-000000000000/fee-settlements"
              payload: { period_label: "2027-01", period_start_utc: "2027-01-01T00:00:00Z", period_end_utc: "2027-02-01T00:00:00Z", subscriber_report_id: "00000000-0000-4000-8000-000000000003" }
              as: StationGroupNegotiator
              as_user_id: "00000000-0000-4000-8000-000000000002"
              captures: { e_neg: "$.data.error_id" }
          assert:
            - "All three calls return HTTP 403"
            - "${e_rep} == \"ERR_ROLE_NOT_PERMITTED\" — DistributorRep is absent from that endpoint's roles list"
            - "${e_net} == \"ERR_ROLE_NOT_PERMITTED\" — NetworkRepresentative may read no subscriber report"
            - "${e_neg} == \"ERR_ROLE_NOT_PERMITTED\" — only GroupCounsel may issue a fee settlement"
            - "None of the three responses is 404, proving the role check outranks the existence check"

      - name: corner_peer_roles_cannot_reach_the_other_slots_rows
        claim_type: peer_roles
        grounds:
          - validations[priority=6]
          - errors.ERR_NOT_COUNTERPARTY
          - roles.StationGroupNegotiator
          - roles.DistributorRep
          - complexity_profile.role_model
        distinguishing_aspect: "Both entity-backed roles are scoped by X-User-ID rather than by role name: a second station group holding the identical role cannot amend another station's DRAFT election, and a second distributor cannot file a subscriber report against a station it has no election with — while the two peers on the real slot both retain the shared read."
        test_recipe:
          setup:
            - "Two stations (WXYZ / CBS and WQRS / FOX) and two CABLE distributors"
            - "Station WXYZ has a DRAFT 2027-2029 election with Cascade Cable and a filed 2030-2032 election with the same distributor"
          setup_api_calls:
            - call: "POST /retrans/stations"
              payload: { call_sign: "WXYZ", market_code: "SEA", dma_rank: 12, market_tv_households: 1800000, network_affiliation: "CBS" }
              as: CarriageAdmin
              as_user_id: "admin-1"
              captures: { st_a: "$.data.id" }
            - call: "POST /retrans/stations"
              payload: { call_sign: "WQRS", market_code: "PDX", dma_rank: 22, market_tv_households: 1200000, network_affiliation: "FOX" }
              as: CarriageAdmin
              as_user_id: "admin-1"
              captures: { st_b: "$.data.id" }
            - call: "POST /retrans/distributors"
              payload: { name: "Cascade Cable", distributor_type: "CABLE", subscriber_measurement_method: "BILLED_HOUSEHOLDS", video_household_count: 240000 }
              as: CarriageAdmin
              as_user_id: "admin-1"
              captures: { dist_a: "$.data.id" }
            - call: "POST /retrans/distributors"
              payload: { name: "Rainier Telco", distributor_type: "TELCO", subscriber_measurement_method: "BILLED_HOUSEHOLDS", video_household_count: 90000 }
              as: CarriageAdmin
              as_user_id: "admin-1"
              captures: { dist_b: "$.data.id" }
            - call: "POST /retrans/elections"
              payload: { station_id: "${st_a}", distributor_id: "${dist_a}", cycle_label: "2027-2029", election_type: "RETRANS_CONSENT", requested_tier: "EXPANDED_BASIC", incumbent_expiry_utc: "2027-01-01T00:00:00Z", incumbent_rate_per_sub_cents: 220 }
              as: StationGroupNegotiator
              as_user_id: "${st_a}"
              captures: { el_a: "$.data.id" }
          trigger:
            - call: "PATCH /retrans/elections/${el_a}"
              payload: { incumbent_rate_per_sub_cents: 300 }
              as: StationGroupNegotiator
              as_user_id: "${st_b}"
              captures: { e_station: "$.data.error_id" }
            - call: "POST /retrans/subscriber-reports"
              payload: { station_id: "${st_a}", period_label: "2027-01", period_start_utc: "2027-01-01T00:00:00Z", period_end_utc: "2027-02-01T00:00:00Z", reported_subscriber_count: 100000, excluded_free_trial_count: 0 }
              as: DistributorRep
              as_user_id: "${dist_b}"
              captures: { e_dist: "$.data.error_id" }
            - call: "PATCH /retrans/elections/${el_a}"
              payload: { incumbent_rate_per_sub_cents: 300 }
              as: StationGroupNegotiator
              as_user_id: "${st_a}"
              captures: { rate_after: "$.data.incumbent_rate_per_sub_cents" }
            - call: "GET /retrans/elections/${el_a}"
              payload: {}
              as: DistributorRep
              as_user_id: "${dist_a}"
              captures: { seen_status: "$.data.status" }
          assert:
            - "${e_station} == \"ERR_NOT_COUNTERPARTY\" with HTTP 403 — the role matched but X-User-ID is a different station"
            - "${e_dist} == \"ERR_NOT_COUNTERPARTY\" with HTTP 403 — Rainier Telco has no election with WXYZ"
            - "${rate_after} == 300 — the station that owns the election may amend it"
            - "${seen_status} == \"DRAFT\" — the counterparty distributor keeps the shared read on the slot it is party to"
            - "No SubscriberReport row exists for Rainier Telco"

      - name: corner_segregation_of_duties_blocks_the_same_user_on_both_steps
        claim_type: Segregation of duties
        grounds:
          - validations[priority=7]
          - errors.ERR_SEGREGATION_OF_DUTIES
          - endpoints["POST /retrans/agreements/{id}/execute"]
