              payload: { crop_year: 2026, n_cap_lbs_per_acre: 300, valid_from: "2026-01-01T00:00:00Z", valid_to: "2026-12-31T00:00:00Z" }
              as: Agronomist
              captures: { nmp_id: $.data.id }
