            - "Patient.${rp_id}.patient_balance_cents == 0"

  # ===========================================================================
  - rule_id: non_linear_state_machine
    instances:

      - name: scope_change_request_revision_cycle_capped_at_three_rounds
        grounds:
          - state_machines.ScopeChangeRequest.UNDER_REVIEW_to_REVISION_REQUESTED
          - state_machines.ScopeChangeRequest.REVISION_REQUESTED_to_SUBMITTED
          - entities.ScopeChangeRequest.fields.revision_round
          - entities.ScopeChangeRequest.fields.reviewed_by_user_id
          - validations[priority=12]
          - validations[priority=11]
          - errors.ERR_LOOP_LIMIT_EXCEEDED
          - errors.ERR_INVALID_STATE_TRANSITION
        distinguishing_aspect: |
          ScopeChangeRequest is genuinely cyclic: UNDER_REVIEW -> REVISION_REQUESTED -> SUBMITTED
          -> UNDER_REVIEW can be walked repeatedly, revision_round increments only on the
          REVISION_REQUESTED -> SUBMITTED edge (not on the DRAFT -> SUBMITTED edge), and the fourth
          re-submission is refused with ERR_LOOP_LIMIT_EXCEEDED because the cap is
          revision_round < 3. From REVISION_REQUESTED the begin-review edge does not exist at all,
          so the same state answers two different errors depending on which edge is attempted.
        test_recipe:
          setup:
            - "BOOT_FS for 'Riverbend Community Health'"
            - "The Notice-of-Award baseline is locked, so new sites are created PROPOSED"
            - "A PROPOSED site 'Eastside Annex' exists and an ADD_SITE ScopeChangeRequest targeting it was prepared by co-1"
            - "The request has already been walked around the revision cycle three times, so revision_round == 3 and status == REVISION_REQUESTED"
          setup_api_calls:
            - *s_pg25
            - *s_pg26
            - *s_hc
            - *s_site
            - *s_svc
            - *s_chair
            - *s_fs
            - *s_t1
            - *s_t2
            - *s_t3
            - *s_t4
            - *s_t5
            - *s_hcv
            - *s_adopt
            - &s_lock
              call: "POST /health-centers/${hc_id}/lock-scope-baseline"
              payload: {}
              as: PlatformAdmin
              as_user_id: "admin-1"
            - &s_site2
              call: "POST /health-centers/${hc_id}/service-sites"
              payload: { site_name: "Eastside Annex", site_type: "SERVICE_DELIVERY", address_line: "88 East Ave", weekly_service_hours: 20 }
              as: PlatformAdmin
              as_user_id: "admin-1"
              captures: { site2_id: $.data.id }
            - &s_scr_add
              call: "POST /health-centers/${hc_id}/scope-change-requests"
              payload: { request_type: "ADD_SITE", target_site_id: "${site2_id}", justification: "expand access on the east side" }
              as: ComplianceOfficer
              as_user_id: "co-1"
              captures: { scr_id: $.data.id }
            - call: "POST /scope-change-requests/${scr_id}/submit"
              payload: {}
              as: ComplianceOfficer
              as_user_id: "co-1"
            - call: "POST /scope-change-requests/${scr_id}/begin-review"
              payload: {}
              as: BoardChair
              as_user_id: "${chair_id}"
            - call: "POST /scope-change-requests/${scr_id}/decide"
              payload: { decision: "REQUEST_REVISION", decision_note: "round 1: attach the site lease" }
              as: BoardChair
              as_user_id: "${chair_id}"
            - call: "POST /scope-change-requests/${scr_id}/submit"
              payload: {}
              as: ComplianceOfficer
              as_user_id: "co-1"
              captures: { round_after_1: $.data.revision_round }
            - call: "POST /scope-change-requests/${scr_id}/begin-review"
              payload: {}
              as: BoardChair
              as_user_id: "${chair_id}"
            - call: "POST /scope-change-requests/${scr_id}/decide"
              payload: { decision: "REQUEST_REVISION", decision_note: "round 2: hours of operation missing" }
              as: BoardChair
              as_user_id: "${chair_id}"
            - call: "POST /scope-change-requests/${scr_id}/submit"
              payload: {}
              as: ComplianceOfficer
              as_user_id: "co-1"
              captures: { round_after_2: $.data.revision_round }
            - call: "POST /scope-change-requests/${scr_id}/begin-review"
              payload: {}
              as: BoardChair
              as_user_id: "${chair_id}"
            - call: "POST /scope-change-requests/${scr_id}/decide"
              payload: { decision: "REQUEST_REVISION", decision_note: "round 3: still incomplete" }
              as: BoardChair
              as_user_id: "${chair_id}"
            - call: "POST /scope-change-requests/${scr_id}/submit"
              payload: {}
              as: ComplianceOfficer
              as_user_id: "co-1"
              captures: { round_after_3: $.data.revision_round }
            - call: "POST /scope-change-requests/${scr_id}/begin-review"
              payload: {}
              as: BoardChair
              as_user_id: "${chair_id}"
            - call: "POST /scope-change-requests/${scr_id}/decide"
              payload: { decision: "REQUEST_REVISION", decision_note: "round 4 refused downstream" }
              as: BoardChair
              as_user_id: "${chair_id}"
          trigger:
            - call: "POST /scope-change-requests/${scr_id}/submit"
              payload: {}
              as: ComplianceOfficer
              as_user_id: "co-1"
            - call: "POST /scope-change-requests/${scr_id}/begin-review"
              payload: {}
              as: BoardChair
              as_user_id: "${chair_id}"
          assert:
            - "${round_after_1} == 1 and ${round_after_2} == 2 and ${round_after_3} == 3  # the DRAFT -> SUBMITTED edge did NOT increment"
            - "first trigger response status == 409 with data.error_id == ERR_LOOP_LIMIT_EXCEEDED"
            - "second trigger response status == 409 with data.error_id == ERR_INVALID_STATE_TRANSITION"
            - "ScopeChangeRequest.${scr_id}.status == REVISION_REQUESTED"
            - "ScopeChangeRequest.${scr_id}.revision_round == 3"
            - "ScopeChangeRequest.${scr_id}.reviewed_by_user_id == null  # cleared by the last successful re-submission"
            - "ServiceSite.${site2_id}.status == PROPOSED"
            - "HealthCenter.${hc_id}.in_scope_site_count == 1"

      - name: corrective_action_plan_reject_resubmit_cycle_capped_at_two_rounds
        grounds:
          - state_machines.CorrectiveActionPlan.SUBMITTED_to_REJECTED
          - state_machines.CorrectiveActionPlan.REJECTED_to_SUBMITTED
          - state_machines.SiteVisitFinding.CAP_SUBMITTED_to_OPEN
          - entities.CorrectiveActionPlan.fields.submit_round
          - entities.SiteVisitFinding.fields.escalated_at
          - validations[priority=12]
          - validations[priority=26]
        distinguishing_aspect: |
          A different entity with a different cap: CorrectiveActionPlan cycles
          SUBMITTED -> REJECTED -> SUBMITTED with submit_round < 2, so the third re-submission is
          refused while the ScopeChangeRequest cycle allows three. Every lap also ping-pongs the
          PARENT SiteVisitFinding between CAP_SUBMITTED and OPEN, and the parent only returns to
          OPEN because escalated_at is still null — a finding that had escalated would stay
          ESCALATED instead.
        test_recipe:
          setup:
            - "BOOT_FS for 'Riverbend Community Health'"
            - "A PROGRESS_REPORT_ONLY SiteVisitFinding 'GOV-014' with cap_due_days 30 is OPEN (cap_due_at 2026-08-31)"
            - "A CorrectiveActionPlan prepared by co-1 with target_completion_date 2026-08-20 has been submitted and rejected three times, so submit_round == 2 and status == REJECTED"
          setup_api_calls:
            - *s_pg25
            - *s_pg26
            - *s_hc
            - *s_site
            - *s_svc
            - *s_chair
            - *s_fs
            - *s_t1
            - *s_t2
            - *s_t3
            - *s_t4
            - *s_t5
            - *s_hcv
            - *s_adopt
            - call: "POST /health-centers/${hc_id}/site-visit-findings"
              payload: { requirement_code: "GOV-014", severity: "PROGRESS_REPORT_ONLY", finding_summary: "board minutes incomplete", cap_due_days: 30 }
              as: ProjectOfficer
              as_user_id: "po-1"
              captures: { f2_id: $.data.id, f2_due: $.data.cap_due_at }
            - call: "POST /site-visit-findings/${f2_id}/corrective-action-plans"
              payload: { narrative: "adopt a minutes template", milestone_count: 3, target_completion_date: "2026-08-20T00:00:00Z" }
              as: ComplianceOfficer
              as_user_id: "co-1"
              captures: { cap2_id: $.data.id }
            - call: "POST /corrective-action-plans/${cap2_id}/submit"
              payload: {}
              as: ComplianceOfficer
              as_user_id: "co-1"
              captures: { cap2_round_0: $.data.submit_round }
            - call: "POST /corrective-action-plans/${cap2_id}/adjudicate"
              payload: { decision: "REJECT", rejection_reason: "no owner named" }
              as: ProjectOfficer
              as_user_id: "po-1"
            - call: "POST /corrective-action-plans/${cap2_id}/submit"
              payload: {}
              as: ComplianceOfficer
              as_user_id: "co-1"
              captures: { cap2_round_1: $.data.submit_round }
            - call: "POST /corrective-action-plans/${cap2_id}/adjudicate"
              payload: { decision: "REJECT", rejection_reason: "milestones not dated" }
              as: ProjectOfficer
              as_user_id: "po-1"
            - call: "POST /corrective-action-plans/${cap2_id}/submit"
              payload: {}
              as: ComplianceOfficer
              as_user_id: "co-1"
              captures: { cap2_round_2: $.data.submit_round }
            - call: "POST /corrective-action-plans/${cap2_id}/adjudicate"
              payload: { decision: "REJECT", rejection_reason: "still unacceptable" }
              as: ProjectOfficer
              as_user_id: "po-1"
              captures: { cap2_status_final: $.data.status }
          trigger:
            - call: "POST /corrective-action-plans/${cap2_id}/submit"
              payload: {}
              as: ComplianceOfficer
              as_user_id: "co-1"
          assert:
            - "${f2_due} == 2026-08-31T00:00:00Z  # created_at + 30 days on the logical clock"
            - "${cap2_round_0} == 0  # the DRAFT -> SUBMITTED edge does not count as a re-submission"
            - "${cap2_round_1} == 1 and ${cap2_round_2} == 2"
            - "${cap2_status_final} == REJECTED"
            - "trigger response status == 409 with data.error_id == ERR_LOOP_LIMIT_EXCEEDED"
            - "CorrectiveActionPlan.${cap2_id}.status == REJECTED and submit_round == 2"
            - "SiteVisitFinding.${f2_id}.status == OPEN  # ping-ponged back because escalated_at is null"
            - "SiteVisitFinding.${f2_id}.escalated_at == null"
            - "HealthCenter.${hc_id}.open_condition_count == 0"
            - "HealthCenter.${hc_id}.operational_status == ACTIVE and scope_posture == OPEN"

  # ===========================================================================
  - rule_id: transitive_cascade
    instances:

      - name: finding_escalation_freezes_scope_and_holds_target_site_depth_five
        grounds:
          - state_machines.SiteVisitFinding.OPEN_to_ESCALATED
          - state_machines.ScopeChangeRequest.SUBMITTED_to_HELD
          - state_machines.ServiceSite.PROPOSED_to_ON_HOLD
          - calculations.compliance_sweep_epoch
          - calculations.scope_listing_invariant
          - entities.HealthCenter.fields.open_condition_count
          - entities.HealthCenter.fields.operational_status
          - entities.HealthCenter.fields.scope_posture
          - entities.ScopeChangeRequest.fields.held_from_status
          - entities.ServiceSite.fields.hold_reason
        distinguishing_aspect: |
          DEPTH 5 from one system trigger. Sweep step S2 escalates the finding (hop 1 sets
          escalated_at and open_condition_count 0 -> 1), which flips operational_status to
          CONDITIONS_IMPOSED (hop 2), which flips scope_posture to CHANGE_FROZEN (hop 3), which
          drives the SUBMITTED ScopeChangeRequest to HELD recording held_from_status (hop 4), which
          drives its PROPOSED target site to ON_HOLD with hold_reason SCOPE_FROZEN (hop 5). Nothing
          in the request or the site was addressed by the caller.
        test_recipe:
          setup:
            - "BOOT_FS for 'Riverbend Community Health', baseline locked"
            - "A PROPOSED site 'Eastside Annex' and an ADD_SITE ScopeChangeRequest targeting it are SUBMITTED"
            - "A CONDITION-severity SiteVisitFinding 'CLIN-002' with cap_due_days 30 is OPEN with cap_due_at 2026-08-31 and no CorrectiveActionPlan"
