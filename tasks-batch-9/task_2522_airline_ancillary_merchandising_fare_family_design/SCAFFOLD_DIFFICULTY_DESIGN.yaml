              payload: { ancillary_product_id: "${p_bag_id}", inclusion: "INCLUDED", included_quantity: 1 }
              as: MerchandisingAnalyst
              as_user_id: "ma-001"
            - call: "POST /fare-families"
              payload: { code: "EDGE_OVER", name: "Edge Over", cabin_class: "ECONOMY", base_fare_cents: 10000, bundle_price_cents: 13501, refundability: "NON_REFUNDABLE", change_fee_cents: 5000, boarding_priority_tier: 4 }
              as: MerchandisingAnalyst
