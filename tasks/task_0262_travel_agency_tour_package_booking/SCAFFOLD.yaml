# =============================================================================
# Travel Agency & Tour Package Booking — benchmark seed tables (Expert)
# =============================================================================

scenario: |
  Travel Agency & Tour Package Booking: package/itinerary builder, component
  reservation (flight/hotel/activity), per-person pricing & deposit, payment
  milestones, supplier confirmation, change/cancellation penalty,
  travel-insurance add-on, group booking

domain_name: travel-agency-tour-booking
api_prefix: /agencies

complexity_profile:
  primary_archetype: workflow_orchestration
  secondary_archetype: pricing_engine
  complexity_layers:
    - cascading_side_effects
    - dual_variant_calculation
    - rate_threshold_triggers
    - optimistic_concurrency
    - scheduled_actions
  entity_topology: flat
  # Single shared root prefix /agencies; every entity is a flat collection
  # (/agencies/customers/{id}, /agencies/bookings/{id}, ...) linked by foreign
  # keys in the body, NOT by URL nesting. Agency itself lives at
  # /agencies/{agencyId} as the tenant scope. Reverse-reachability for every FK
  # is provided by filtered-list endpoints (/agencies/<children>?<fk>=...).
  state_machine_shape: compound
  # Booking.status is gated by its BookingComponent children (all mandatory
  # CONFIRMED) and its PaymentMilestone ledger (DEPOSIT settled); BookingComponent
  # itself branches REQUESTED -> {CONFIRMED, REJECTED}; Booking carries a parallel
  # payment_status dimension and a RESERVED -> DRAFT -> RESERVED revision cycle.
  relationship_patterns:
    - one_to_many        # Booking has many Traveler / BookingComponent / PaymentMilestone
    - cross_aggregate    # BookingComponent -> Supplier; Payment -> PaymentMilestone
  role_model: peer_roles
  # Customer owns Bookings; Supplier confirms its own components; TravelAgent
  # builds packages and operates bookings; AgencyAdmin provisions and runs the clock.
  consistency_model: immediate

# =============================================================================
# Table 1.0: Response Envelope (FIXED)
# =============================================================================
response_envelope:
  success: |
    { "meta": { "api_request_id": "req_xxx", "api_request_timestamp": "ISO8601" },
      "response_type": "object" | "array", "data": {} }
  error: |
    { "meta": { ... }, "response_type": "error",
      "data": { "error_id": "ERR_XXX", "message": "..." } }
  pagination_fields: ["limit", "offset", "total_count", "has_more"]
  pagination_defaults: { limit: 10, min: 1, max: 100, offset: 0 }

# =============================================================================
# Table 1.1: Entity-Relationship Table
# =============================================================================
entities:
  - name: Agency
    parent: null
    common_fields: true
    fields:
      - { name: name, type: string, source: input, description: "Agency display name" }
      - { name: currency, type: string, source: input, default: "USD", description: "ISO currency code; all money fields are integer cents in this currency" }
      - { name: now_utc, type: datetime, source: system, description: "Agency simulation clock; set via /_clock/set; drives milestone due dates and cancellation penalty tiers" }

  - name: Customer
    parent: null
    common_fields: true
    fields:
      - { name: agency_id, type: string, source: input, description: "FK -> Agency.id; owning agency scope" }
      - { name: email, type: string, source: input, description: "Customer email; unique per agency" }
      - { name: full_name, type: string, source: input, description: "Customer full name" }
      - { name: wallet_credit_cents, type: integer, source: computed, default: 0, description: "Refund credits held for this customer; increased by cancellation refunds destined to WALLET, never negative" }

  - name: Supplier
    parent: null
    common_fields: true
    fields:
      - { name: agency_id, type: string, source: input, description: "FK -> Agency.id; owning agency scope" }
      - { name: name, type: string, source: input, description: "Supplier name" }
      - { name: kind, type: enum, source: input, description: "FLIGHT | HOTEL | ACTIVITY; a component may only be served by a Supplier whose kind equals the component kind" }
      - { name: auto_confirm, type: boolean, source: input, default: false, description: "When true, a component requested against this supplier is CONFIRMED immediately at request time instead of waiting in REQUESTED" }

  - name: TourPackage
    parent: null
    common_fields: true
    fields:
      - { name: agency_id, type: string, source: input, description: "FK -> Agency.id; owning agency scope" }
      - { name: title, type: string, source: input, description: "Package title" }
      - { name: base_price_per_person_cents, type: integer, source: input, description: "List price per traveler before group discount; > 0" }
      - { name: deposit_pct, type: integer, source: input, default: 20, description: "Deposit percentage of grand total, integer 1..100; drives the DEPOSIT milestone amount" }
      - { name: balance_due_days_before_departure, type: integer, source: input, default: 30, description: "Days before departure_date that the BALANCE milestone is due; >= 0" }
      - { name: min_group_size_for_discount, type: integer, source: input, default: 5, description: "Traveler count at or above which group discount tiers apply" }
      - { name: status, type: enum, source: system, description: "DRAFT | PUBLISHED | RETIRED; bookings may only be opened against PUBLISHED packages" }

  - name: Booking
    parent: null
    common_fields: true
    fields:
      - { name: agency_id, type: string, source: input, description: "FK -> Agency.id; owning agency scope" }
      - { name: customer_id, type: string, source: input, description: "FK -> Customer.id; the owning customer" }
      - { name: tour_package_id, type: string, source: input, description: "FK -> TourPackage.id; the package this booking instantiates" }
      - { name: departure_date, type: datetime, source: input, description: "Tour departure timestamp (ISO 8601 UTC); cancellation penalty tier is a function of (departure_date - agency.now_utc)" }
      - { name: traveler_count, type: integer, source: computed, default: 0, description: "Count of Traveler children; recomputed on every traveler add" }
      - { name: subtotal_cents, type: integer, source: computed, default: 0, description: "Per-person price after group discount times traveler_count; recomputed by group_discount_price_per_person on every traveler add while DRAFT, frozen at reserve" }
      - { name: insurance_premium_cents, type: integer, source: computed, default: 0, description: "Sum of ACTIVE InsurancePolicy.premium_cents on this booking" }
      - { name: grand_total_cents, type: integer, source: computed, default: 0, description: "subtotal_cents + insurance_premium_cents; the amount the payment milestones must cover" }
      - { name: paid_cents, type: integer, source: computed, default: 0, description: "Sum of APPLIED Payment.amount_cents on this booking" }
      - { name: status, type: enum, source: system, description: "DRAFT | RESERVED | CONFIRMED | CANCELLED; lifecycle dimension" }
      - { name: payment_status, type: enum, source: computed, description: "UNPAID | DEPOSIT_PAID | PAID_IN_FULL; parallel dimension derived from milestone settlement, evolves independently of status" }

  - name: Traveler
    parent: null
    common_fields: true
    fields:
      - { name: booking_id, type: string, source: input, description: "FK -> Booking.id; the booking this traveler belongs to" }
      - { name: full_name, type: string, source: input, description: "Traveler full name" }
      - { name: is_lead, type: boolean, source: system, default: false, description: "The first traveler added to a booking is forced is_lead=true; all later travelers is_lead=false" }
      - { name: passport_no, type: string, source: input, required: false, description: "Optional passport number" }

  - name: BookingComponent
    parent: null
    common_fields: true
    fields:
      - { name: booking_id, type: string, source: input, description: "FK -> Booking.id; the booking this component belongs to" }
      - { name: supplier_id, type: string, source: input, description: "FK -> Supplier.id; supplier.kind must equal this component's kind" }
      - { name: kind, type: enum, source: input, description: "FLIGHT | HOTEL | ACTIVITY" }
      - { name: starts_at, type: datetime, source: input, description: "Component start timestamp (ISO 8601 UTC)" }
      - { name: ends_at, type: datetime, source: input, description: "Component end timestamp (ISO 8601 UTC); must be > starts_at" }
      - { name: is_mandatory, type: boolean, source: input, default: true, description: "When true the booking cannot be CONFIRMED until this component is CONFIRMED; an optional component may remain REJECTED" }
      - { name: status, type: enum, source: system, description: "REQUESTED | CONFIRMED | REJECTED | RELEASED; supplier confirmation lifecycle" }

  - name: PaymentMilestone
    parent: null
    common_fields: true
    fields:
      - { name: booking_id, type: string, source: input, description: "FK -> Booking.id; the booking this milestone belongs to" }
      - { name: kind, type: enum, source: system, description: "DEPOSIT | BALANCE; exactly one of each is generated when the booking is RESERVED" }
      - { name: amount_due_cents, type: integer, source: computed, description: "Amount this milestone must collect; DEPOSIT = round_half_up(grand_total_cents * deposit_pct / 100); BALANCE = grand_total_cents - DEPOSIT.amount_due_cents" }
      - { name: due_date, type: datetime, source: computed, description: "DEPOSIT due at the booking RESERVED timestamp (agency.now_utc); BALANCE due departure_date minus balance_due_days_before_departure days" }
      - { name: settled_amount_cents, type: integer, source: computed, default: 0, description: "Sum of APPLIED Payment.amount_cents allocated to this milestone" }
      - { name: status, type: enum, source: computed, description: "OPEN | SETTLED | WAIVED; SETTLED when settled_amount_cents >= amount_due_cents; WAIVED only via cancellation/reopen void" }

  - name: Payment
    parent: null
    common_fields: true
    fields:
      - { name: booking_id, type: string, source: input, description: "FK -> Booking.id; the booking this payment belongs to" }
      - { name: milestone_id, type: string, source: input, description: "FK -> PaymentMilestone.id; the milestone this payment is allocated against" }
      - { name: amount_cents, type: integer, source: input, description: "Payment amount in cents; > 0" }
      - { name: method, type: enum, source: input, default: "CARD", description: "CARD | WALLET | BANK_TRANSFER" }
      - { name: status, type: enum, source: system, description: "APPLIED | REFUNDED; a refunded payment no longer counts toward paid_cents or milestone settlement" }

  - name: InsurancePolicy
    parent: null
    common_fields: true
    fields:
      - { name: booking_id, type: string, source: input, description: "FK -> Booking.id; the booking this policy is attached to" }
      - { name: coverage_tier, type: enum, source: input, description: "BASIC | PREMIUM; premium_cents = traveler_count * per-tier rate at attach time" }
      - { name: premium_cents, type: integer, source: computed, description: "Computed premium at attach time; frozen thereafter" }
      - { name: refundable, type: boolean, source: computed, description: "BASIC is non-refundable on cancellation; PREMIUM is refundable" }
      - { name: status, type: enum, source: system, description: "ACTIVE | VOIDED; VOIDED only via booking cancellation" }

  - name: CancellationRecord
    parent: null
    common_fields: true
    fields:
      - { name: booking_id, type: string, source: input, description: "FK -> Booking.id; at most one CancellationRecord per booking" }
      - { name: cancelled_at, type: datetime, source: system, description: "= agency.now_utc at cancellation" }
      - { name: penalty_tier, type: enum, source: computed, description: "TIER_FREE | TIER_LOW | TIER_HIGH | TIER_FULL; chosen by days_to_departure thresholds" }
      - { name: penalty_pct, type: integer, source: computed, description: "Penalty percentage applied to refundable_base_cents for the chosen tier" }
      - { name: refundable_base_cents, type: integer, source: computed, description: "grand_total_cents minus non-refundable (BASIC) ACTIVE insurance premiums (the base the penalty is taken from)" }
      - { name: penalty_cents, type: integer, source: computed, description: "round_half_up(refundable_base_cents * penalty_pct / 100)" }
      - { name: refund_cents, type: integer, source: computed, description: "max(0, paid_cents - penalty_cents); never negative" }
      - { name: refund_destination, type: enum, source: input, default: "ORIGINAL", description: "WALLET | ORIGINAL; WALLET credits Customer.wallet_credit_cents by refund_cents" }

# =============================================================================
# Table 1.2: State Machine Table
# =============================================================================
state_machines:
  - entity: TourPackage
    initial_state: DRAFT
    terminal_states: [RETIRED]
    transitions:
      - from: DRAFT
        to: PUBLISHED
        trigger: "POST /agencies/tour-packages/{packageId}/publish"
        actor: TravelAgent
        preconditions:
          - "base_price_per_person_cents > 0 (else ERR_INVALID_REQUEST)"
        side_effects: ["status -> PUBLISHED", "increments TourPackage.version by 1"]
      - from: PUBLISHED
        to: RETIRED
        trigger: "POST /agencies/tour-packages/{packageId}/retire"
        actor: TravelAgent
        preconditions:
          - "No Booking with status in {DRAFT, RESERVED} references this package (else ERR_PACKAGE_HAS_OPEN_BOOKINGS)"
        side_effects: ["status -> RETIRED", "increments TourPackage.version by 1"]

  - entity: BookingComponent
    initial_state: REQUESTED
    terminal_states: [RELEASED]
    transitions:
      - from: REQUESTED
        to: CONFIRMED
        trigger: "POST /agencies/components/{componentId}/confirm OR system (auto_confirm supplier at request time)"
        actor: Supplier | system
        preconditions:
          - "Acting Supplier owns this component (supplier_id == X-User-ID) unless actor is system (ERR_FORBIDDEN_FOR_ROLE)"
          - "Parent Booking.status in {DRAFT, RESERVED} (ERR_INVALID_STATE)"
        side_effects:
          - "status -> CONFIRMED"
      - from: REQUESTED
        to: REJECTED
        trigger: "POST /agencies/components/{componentId}/reject"
        actor: Supplier
        preconditions:
          - "Acting Supplier owns this component (ERR_FORBIDDEN_FOR_ROLE)"
          - "Parent Booking.status in {DRAFT, RESERVED} (ERR_INVALID_STATE)"
        side_effects:
          - "status -> REJECTED"
          - "If is_mandatory AND parent Booking.status == RESERVED: parent Booking forced back to DRAFT for re-sourcing; its OPEN PaymentMilestones WAIVED; Booking.payment_status recomputed to UNPAID (cascade — see booking_reopen_on_mandatory_reject)"
      - from: CONFIRMED
        to: RELEASED
        trigger: "system (parent Booking cancellation)"
        actor: system
        preconditions: []
        side_effects: ["status -> RELEASED"]
      - from: REQUESTED
        to: RELEASED
        trigger: "system (parent Booking cancellation)"
        actor: system
        preconditions: []
        side_effects: ["status -> RELEASED"]
      - from: REJECTED
        to: RELEASED
        trigger: "system (parent Booking cancellation)"
        actor: system
        preconditions: []
        side_effects: ["status -> RELEASED"]

  - entity: Booking
    initial_state: DRAFT
    terminal_states: [CANCELLED]
    transitions:
      - from: DRAFT
        to: RESERVED
        trigger: "POST /agencies/bookings/{bookingId}/reserve"
        actor: TravelAgent
        preconditions:
          - "expected_booking_version matches current Booking.version (ERR_STALE_VERSION)"
          - "TourPackage.status == PUBLISHED (ERR_PACKAGE_NOT_PUBLISHED)"
          - "traveler_count >= 1 (ERR_NO_TRAVELERS)"
          - "At least one is_mandatory BookingComponent exists with status in {REQUESTED, CONFIRMED} (ERR_NO_COMPONENTS)"
        side_effects:
          - "status -> RESERVED"
          - "price frozen: subtotal_cents, insurance_premium_cents, grand_total_cents finalized from current travelers/policies (finalized_quote variant)"
          - "Generate DEPOSIT milestone (due_date = agency.now_utc) and BALANCE milestone (due_date = departure_date - balance_due_days_before_departure days) — see milestone_generation"
          - "payment_status recomputed to UNPAID"
          - "increments Booking.version by 1"
      - from: RESERVED
        to: DRAFT
        trigger: "system (mandatory BookingComponent rejected)"
        actor: system
        preconditions: []
        side_effects:
          - "status -> DRAFT"
          - "All OPEN PaymentMilestones of the booking -> WAIVED"
          - "payment_status recomputed (no OPEN/SETTLED milestones -> UNPAID)"
          - "increments Booking.version by 1"
        note: "Bubble-up revision cycle: a mandatory child component REJECTED re-opens the parent booking to DRAFT."
      - from: RESERVED
        to: CONFIRMED
        trigger: "POST /agencies/bookings/{bookingId}/confirm"
        actor: TravelAgent
        preconditions:
          - "expected_booking_version matches current Booking.version (ERR_STALE_VERSION)"
          - "Every is_mandatory BookingComponent is CONFIRMED (ERR_COMPONENTS_NOT_CONFIRMED)"
          - "DEPOSIT milestone.status == SETTLED (ERR_DEPOSIT_NOT_SETTLED)"
        side_effects:
          - "status -> CONFIRMED"
          - "increments Booking.version by 1"
      - from: DRAFT
        to: CANCELLED
        trigger: "POST /agencies/bookings/{bookingId}/cancel"
        actor: Customer | TravelAgent
        preconditions:
          - "expected_booking_version matches current Booking.version (ERR_STALE_VERSION)"
          - "Acting Customer owns booking when actor is Customer (ERR_FORBIDDEN_FOR_ROLE)"
        side_effects:
          - "status -> CANCELLED"
          - "Create CancellationRecord: penalty_tier=TIER_FREE, penalty_pct=0, penalty_cents=0, refundable_base_cents=grand_total_cents, paid_cents=0, refund_cents=0 (no milestones/payments exist in DRAFT)"
          - "All ACTIVE InsurancePolicies -> VOIDED; all non-RELEASED BookingComponents -> RELEASED"
          - "increments Booking.version by 1"
      - from: RESERVED
        to: CANCELLED
        trigger: "POST /agencies/bookings/{bookingId}/cancel"
        actor: Customer | TravelAgent
        preconditions:
          - "expected_booking_version matches current Booking.version (ERR_STALE_VERSION)"
          - "Acting Customer owns booking when actor is Customer (ERR_FORBIDDEN_FOR_ROLE)"
        side_effects:
          - "status -> CANCELLED"
          - "Create CancellationRecord: penalty_tier/penalty_pct from cancellation_penalty; refundable_base_cents, penalty_cents, refund_cents from cancellation_refund"
          - "All APPLIED Payments of the booking -> REFUNDED (each reverses its milestone.settled_amount_cents); all OPEN PaymentMilestones -> WAIVED; Booking.paid_cents recomputed to 0"
          - "If refund_destination == WALLET: Customer.wallet_credit_cents += refund_cents (cascade — see cancel_refund_to_wallet)"
          - "All ACTIVE InsurancePolicies -> VOIDED; all non-RELEASED BookingComponents -> RELEASED"
          - "increments Booking.version by 1"
      - from: CONFIRMED
        to: CANCELLED
        trigger: "POST /agencies/bookings/{bookingId}/cancel"
        actor: Customer | TravelAgent
        preconditions:
          - "expected_booking_version matches current Booking.version (ERR_STALE_VERSION)"
          - "Acting Customer owns booking when actor is Customer (ERR_FORBIDDEN_FOR_ROLE)"
        side_effects:
          - "status -> CANCELLED"
          - "Create CancellationRecord: penalty/refund from cancellation_penalty/cancellation_refund"
          - "All APPLIED Payments -> REFUNDED; all OPEN PaymentMilestones -> WAIVED; Booking.paid_cents recomputed to 0"
          - "If refund_destination == WALLET: Customer.wallet_credit_cents += refund_cents (cascade — see cancel_refund_to_wallet)"
          - "All ACTIVE InsurancePolicies -> VOIDED; all non-RELEASED BookingComponents -> RELEASED"
          - "increments Booking.version by 1"

  - entity: Payment
    initial_state: APPLIED
    terminal_states: [REFUNDED]
    transitions:
      - from: APPLIED
        to: REFUNDED
        trigger: "system (parent Booking cancellation)"
        actor: system
        preconditions: []
        side_effects:
          - "status -> REFUNDED"
          - "milestone.settled_amount_cents decreases by amount_cents; milestone may revert SETTLED -> OPEN, then WAIVED by the cancel sweep"
          - "Booking.paid_cents recomputed"

  - entity: InsurancePolicy
    initial_state: ACTIVE
    terminal_states: [VOIDED]
    transitions:
      - from: ACTIVE
        to: VOIDED
        trigger: "system (parent Booking cancellation)"
        actor: system
        preconditions: []
        side_effects:
          - "status -> VOIDED"

# =============================================================================
# Table 1.2.1: Concurrency Rules
# =============================================================================
concurrency_rules:
  - rule_id: traveler-add-stale-booking
    parent_entity: Booking
    write_endpoint: "POST /agencies/bookings/{bookingId}/travelers"
    occ_field: "expected_booking_version"
    description: |
      Adding a Traveler to a Booking whose version has advanced since the client
      last observed it is rejected as stale. Each traveler add legitimately mutates
      the booking (recomputes traveler_count and re-quotes subtotal via the group
      discount tiers), so a second add carrying the pre-add version observes a
      booking whose price basis already shifted underneath it and is rejected on the
      stale-version check rather than silently re-quoting against an outdated subtotal.
    error_id: ERR_STALE_VERSION
    http_status: 412

# =============================================================================
# Table 1.3: Calculation Rules Table
# =============================================================================
calculations:
  - name: group_discount_price_per_person
    trigger: "traveler add (DRAFT); booking reserve (finalized_quote)"
    algorithm: tiered_pricing
    formula: |
      n = traveler_count (count of Traveler children)
      base = tour_package.base_price_per_person_cents
      if n < tour_package.min_group_size_for_discount:
        discount_pct = 0
      elif n < TIER_MID_MIN:        # [min_group_size, 8)
        discount_pct = TIER_SMALL_PCT   # 5
      elif n < TIER_LARGE_MIN:      # [8, 15)
        discount_pct = TIER_MID_PCT     # 10
      else:                          # [15, +inf)
        discount_pct = TIER_LARGE_PCT   # 15
      # PINNED ORDER: round per-person price (round_half_up) FIRST, THEN multiply by n
      per_person_cents = round_half_up(base * (100 - discount_pct) / 100)
      subtotal_cents   = per_person_cents * n
    input_set: "All Traveler children of the booking; min_group_size_for_discount from the booking's TourPackage."
    constants:
      TIER_SMALL_PCT: 5
      TIER_MID_PCT: 10
      TIER_LARGE_PCT: 15
      TIER_MID_MIN: 8
      TIER_LARGE_MIN: 15
    precision: "round_half_up to whole cents on per_person_cents BEFORE multiplying by n (round-then-multiply, pinned)"

  - name: insurance_premium
    trigger: "InsurancePolicy attach (POST /agencies/insurance-policies)"
    algorithm: weighted_scoring
    formula: |
      n = traveler_count at attach time
      rate = BASIC_RATE_CENTS if coverage_tier == BASIC else PREMIUM_RATE_CENTS
      premium_cents = n * rate
      refundable = (coverage_tier == PREMIUM)
    input_set: "Traveler children at attach time; premium frozen on InsurancePolicy thereafter."
    constants:
      BASIC_RATE_CENTS: 1500       # $15 per traveler, non-refundable
      PREMIUM_RATE_CENTS: 4000     # $40 per traveler, refundable
    precision: "exact integer cents; no rounding (linear multiply)"

  - name: milestone_generation
    trigger: "booking reserve (DRAFT -> RESERVED)"
    algorithm: waterfall_allocation
    formula: |
      G = grand_total_cents (frozen at reserve)
      deposit_amount = round_half_up(G * tour_package.deposit_pct / 100)
      balance_amount  = G - deposit_amount         # remainder, NOT independently rounded
      DEPOSIT.amount_due_cents = deposit_amount
      DEPOSIT.due_date         = agency.now_utc (at reserve)
      BALANCE.amount_due_cents = balance_amount
      BALANCE.due_date         = departure_date - (balance_due_days_before_departure days)
    input_set: "Single booking; deposit_pct and balance_due_days_before_departure from its TourPackage."
    constants: {}
    precision: "DEPOSIT round_half_up; BALANCE is the EXACT remainder (G - DEPOSIT), so DEPOSIT + BALANCE == G with zero cent drift (round-one-then-remainder, pinned)"
    variants:
      - name: provisional_quote
        when: "booking is DRAFT — grand_total_cents recomputed on every traveler add and insurance attach"
        difference: "subtotal/grand_total track live traveler/policy edits; no milestones exist yet"
      - name: finalized_quote
        when: "at reserve — grand_total_cents frozen and milestones generated from the frozen value"
        difference: "later traveler adds are blocked (booking no longer DRAFT), so milestone amounts cannot drift from the frozen grand_total"

  - name: cancellation_penalty
    trigger: "booking cancel (RESERVED/CONFIRMED -> CANCELLED)"
    algorithm: threshold
    formula: |
      days_to_departure = floor((departure_date - agency.now_utc) / 86400 seconds)   # whole calendar days, floor
      if days_to_departure >= TIER_FREE_MIN_DAYS:        # >= 60
        penalty_tier = TIER_FREE; penalty_pct = 0
      elif days_to_departure >= TIER_LOW_MIN_DAYS:       # [30, 60)
        penalty_tier = TIER_LOW;  penalty_pct = TIER_LOW_PCT    # 25
      elif days_to_departure >= TIER_HIGH_MIN_DAYS:      # [7, 30)
        penalty_tier = TIER_HIGH; penalty_pct = TIER_HIGH_PCT   # 50
      else:                                               # < 7 (includes past departure)
        penalty_tier = TIER_FULL; penalty_pct = TIER_FULL_PCT   # 100
    input_set: "Single booking; departure_date and agency.now_utc."
    constants:
      TIER_FREE_MIN_DAYS: 60
      TIER_LOW_MIN_DAYS: 30
      TIER_HIGH_MIN_DAYS: 7
      TIER_LOW_PCT: 25
      TIER_HIGH_PCT: 50
      TIER_FULL_PCT: 100
    precision: "days_to_departure uses floor of whole 86400-second days; boundary is >= (exactly 30 days out is TIER_LOW; 29 days is TIER_HIGH)"

  - name: cancellation_refund
    trigger: "booking cancel (RESERVED/CONFIRMED -> CANCELLED)"
    algorithm: aggregation
    formula: |
      non_refundable_insurance = sum(InsurancePolicy.premium_cents
                                     for p in booking.insurance_policies
                                     where p.status == ACTIVE and p.refundable == false)
      refundable_base_cents = grand_total_cents - non_refundable_insurance
      penalty_cents = round_half_up(refundable_base_cents * penalty_pct / 100)
      refund_cents  = max(0, paid_cents - penalty_cents)
    input_set: "paid_cents = sum of APPLIED Payment.amount_cents measured BEFORE this cancellation refunds them; ACTIVE InsurancePolicy children; penalty_pct from cancellation_penalty."
    constants: {}
    precision: "round_half_up on penalty_cents; refund floored at 0"
    variants:
      - name: refund_to_original
        when: "refund_destination == ORIGINAL"
        difference: "refund_cents reported on the CancellationRecord; Customer.wallet_credit_cents is NOT touched"
      - name: refund_to_wallet
        when: "refund_destination == WALLET"
        difference: "Customer.wallet_credit_cents += refund_cents (the conserved-quantity cascade)"

  - name: payment_status_derivation
    trigger: "payment apply, booking cancel/reopen (refund + milestone waive), booking reserve"
    algorithm: aggregation
    formula: |
      deposit = booking's DEPOSIT milestone (if any)
      balance = booking's BALANCE milestone (if any)
      if no PaymentMilestone in {OPEN, SETTLED} exists (none generated, or all WAIVED):
        payment_status = UNPAID
      elif balance is not None and balance.status == SETTLED:
        payment_status = PAID_IN_FULL
      elif deposit is not None and deposit.status == SETTLED:
        payment_status = DEPOSIT_PAID
      else:
        payment_status = UNPAID
    input_set: "The booking's DEPOSIT and BALANCE PaymentMilestone children and their settled_amount_cents."
    constants: {}
    precision: "milestone.status SETTLED iff settled_amount_cents >= amount_due_cents (>=, not >)"

  - name: component_overlap_detection
    trigger: "component request (POST /agencies/components)"
    algorithm: interval_merge
    formula: |
      # Two overlap rules with DIFFERENT interval geometry on DIFFERENT resources.
      # (1) HOTEL — within-booking, half-open semantics on the Booking's schedule:
      #     candidates = HOTEL components of THIS booking, same supplier_id,
      #                  status in {REQUESTED, CONFIRMED}
      #     collide(new, ex) := (new.starts_at < ex.ends_at) AND (ex.starts_at < new.ends_at)
      #     # strict '<' both sides => touching boundaries (new.starts_at == ex.ends_at) do NOT collide
      #     if any candidate collides: ERR_COMPONENT_OVERLAP
      # (2) FLIGHT/ACTIVITY — cross-booking, buffered aggregate capacity on the Supplier:
      #     candidates = components of the SAME supplier_id on ANY booking, same kind,
      #                  status in {REQUESTED, CONFIRMED} (exclude RELEASED, REJECTED)
      #     collide(new, ex) := (new.starts_at < ex.ends_at + BUFFER_SECONDS)
      #                          AND (ex.starts_at < new.ends_at + BUFFER_SECONDS)
      #     # the +BUFFER inflation makes adjacent/touching intervals collide
      #     if any candidate collides: ERR_SUPPLIER_CAPACITY_CONFLICT
    input_set: "(1) same-booking same-supplier HOTEL components; (2) same-supplier same-kind FLIGHT/ACTIVITY components across all bookings, excluding RELEASED/REJECTED."
    constants:
      BUFFER_SECONDS: 7200   # 2-hour turnaround buffer for FLIGHT/ACTIVITY suppliers
    precision: "HOTEL: strict '<' both sides (half-open, touching allowed); FLIGHT/ACTIVITY: '<' against ends_at + BUFFER_SECONDS (touching collides)"

# =============================================================================
# Table 1.4: Validation Rules Table (ordered by priority)
# =============================================================================
validations:
  - priority: 1
    category: auth
    check: "X-User-ID and X-User-Role headers present and X-User-Role is a known role"
    error_id: ERR_MISSING_OR_INVALID_USER_CONTEXT_HEADER
    http_status: 400
    applies_to: all endpoints

  - priority: 2
    category: auth
    check: "Role permitted for this endpoint per §1.7 (includes Customer-owns-booking and Supplier-owns-component ownership checks)"
    error_id: ERR_FORBIDDEN_FOR_ROLE
    http_status: 403
    applies_to: all endpoints

  - priority: 3
    category: existence
    check: "Path-referenced resources exist within the agency, validated left-to-right"
    error_id: ERR_NOT_FOUND
    http_status: 404
    applies_to: all resource endpoints

  - priority: 4
    category: business_referential
    check: "Body FK references (agency_id, customer_id, tour_package_id, supplier_id, booking_id, milestone_id) resolve within the agency; supplier.kind must equal component.kind on component request"
    error_id: ERR_INVALID_REFERENCE
    http_status: 422
    applies_to: "POST customers, suppliers, tour-packages, bookings, travelers, components, insurance-policies, payments"

  - priority: 5
    category: state
    check: "OCC: expected_booking_version equals current Booking.version on guarded booking writes"
    error_id: ERR_STALE_VERSION
    http_status: 412
    applies_to: "POST .../travelers, POST .../bookings/{id}/reserve, /confirm, /cancel"

  - priority: 6
    category: state
    check: "Target resource is in a state where the requested transition is defined in §1.2"
    error_id: ERR_INVALID_STATE
    http_status: 409
    applies_to: "all state-transition endpoints (reserve/confirm/cancel, component confirm/reject, traveler/insurance add, payment)"

  - priority: 7
    category: business_temporal
    check: "Component interval valid: ends_at > starts_at"
    error_id: ERR_INVALID_INTERVAL
    http_status: 422
    applies_to: "POST components"

  - priority: 8
    category: business_safety
    check: "A booking confirm requires every is_mandatory BookingComponent to be CONFIRMED (sourcing complete before money complete)"
    error_id: ERR_COMPONENTS_NOT_CONFIRMED
    http_status: 409
    applies_to: "POST .../bookings/{id}/confirm"

  - priority: 9
    category: business_constraint
    check: "Within-booking itinerary overlap (resource = the Booking's HOTEL schedule for one supplier): two HOTEL components of the same supplier on the same booking may not overlap under HALF-OPEN [starts_at, ends_at) semantics — back-to-back stays where one's ends_at == the next's starts_at are ALLOWED (no buffer)"
    error_id: ERR_COMPONENT_OVERLAP
    http_status: 409
    applies_to: "POST components (kind=HOTEL)"

  - priority: 10
    category: business_constraint
    check: "Cross-booking supplier-capacity overlap (resource = the Supplier, aggregate capacity 1): a new FLIGHT/ACTIVITY component cannot be requested against a supplier that already has a non-RELEASED/REJECTED component of the same kind on ANY booking whose interval collides INCLUSIVE of a turnaround buffer — intervals collide when starts_at_new < ends_at_existing + BUFFER and starts_at_existing < ends_at_new + BUFFER, so even adjacent (touching) intervals collide"
    error_id: ERR_SUPPLIER_CAPACITY_CONFLICT
    http_status: 409
    applies_to: "POST components (kind=FLIGHT or kind=ACTIVITY)"

  - priority: 11
    category: business_fiscal
    check: "A Payment.amount_cents allocated to a milestone may not exceed that milestone's remaining due (amount_due_cents - settled_amount_cents)"
    error_id: ERR_OVERPAYMENT
    http_status: 422
    applies_to: "POST payments"

  - priority: 12
    category: business_fiscal
    check: "Payment milestone ordering: the BALANCE milestone cannot be paid until the DEPOSIT milestone is SETTLED"
    error_id: ERR_DEPOSIT_NOT_SETTLED
    http_status: 409
    applies_to: "POST payments (against the BALANCE milestone)"

  - priority: 13
    category: business_constraint
    check: "Booking reserve requires traveler_count >= 1 and at least one is_mandatory component"
    error_id: "ERR_NO_TRAVELERS / ERR_NO_COMPONENTS"
    http_status: 409
    applies_to: "POST .../bookings/{id}/reserve"

# =============================================================================
# Table 1.5: API Endpoint Table  (flat topology under /agencies)
# =============================================================================
endpoints:
  # --- Agency ---
  - method: POST
    path: "/agencies"
    description: "Create an Agency"
    roles: [AgencyAdmin]
    code: 201
    input: [name, "currency?"]
    output: Agency
    side_effects: ["now_utc initialized to 1970-01-01T00:00:00.000Z until /_clock/set is called"]

  - method: GET
    path: "/agencies/{agencyId}"
    description: "Get an Agency"
    roles: [AgencyAdmin, TravelAgent, Customer, Supplier]
    code: 200
    input: []
    output: Agency
    side_effects: []

  - method: POST
    path: "/agencies/{agencyId}/_clock/set"
    description: "Test-driving: set the agency simulation clock"
    roles: [AgencyAdmin]
    code: 200
    input: [now_utc]
    output: Agency
    side_effects: ["agency.now_utc = now_utc"]

  # --- Customer ---
  - method: POST
    path: "/agencies/customers"
    description: "Create a Customer"
    roles: [AgencyAdmin, TravelAgent]
    code: 201
    input: [agency_id, email, full_name]
    output: Customer
    side_effects: ["wallet_credit_cents=0; ERR_DUPLICATE_EMAIL if email already used in agency"]

  - method: GET
    path: "/agencies/customers/{customerId}"
    description: "Get a Customer"
    roles: [AgencyAdmin, TravelAgent, Customer]
    code: 200
    input: []
    output: Customer
    side_effects: []

  - method: GET
    path: "/agencies/customers"
    description: "List Customers (filterable; reverse-reachability for Customer.agency_id)"
    roles: [AgencyAdmin, TravelAgent]
    code: 200
    input: ["agency_id?", "email?", "limit?", "offset?"]
    output: "Customer[]"
    side_effects: []

  # --- Supplier ---
  - method: POST
    path: "/agencies/suppliers"
    description: "Create a Supplier"
    roles: [AgencyAdmin]
    code: 201
    input: [agency_id, name, kind, "auto_confirm?"]
    output: Supplier
    side_effects: []

  - method: GET
    path: "/agencies/suppliers/{supplierId}"
    description: "Get a Supplier"
    roles: [AgencyAdmin, TravelAgent, Supplier]
    code: 200
    input: []
    output: Supplier
    side_effects: []

  - method: GET
    path: "/agencies/suppliers"
    description: "List Suppliers (filterable; reverse-reachability for Supplier.agency_id)"
    roles: [AgencyAdmin, TravelAgent]
    code: 200
    input: ["agency_id?", "kind?", "limit?", "offset?"]
    output: "Supplier[]"
    side_effects: []

  # --- Tour Package ---
  - method: POST
    path: "/agencies/tour-packages"
    description: "Create a TourPackage (DRAFT)"
    roles: [TravelAgent]
    code: 201
    input: [agency_id, title, base_price_per_person_cents, "deposit_pct?", "balance_due_days_before_departure?", "min_group_size_for_discount?"]
    output: TourPackage
    side_effects: ["status=DRAFT"]

  - method: GET
    path: "/agencies/tour-packages/{packageId}"
    description: "Get a TourPackage"
    roles: [AgencyAdmin, TravelAgent, Customer]
    code: 200
    input: []
    output: TourPackage
    side_effects: []

  - method: GET
    path: "/agencies/tour-packages"
    description: "List TourPackages (filterable; reverse-reachability for TourPackage.agency_id)"
    roles: [AgencyAdmin, TravelAgent, Customer]
    code: 200
    input: ["agency_id?", "status?", "limit?", "offset?"]
    output: "TourPackage[]"
    side_effects: []

  - method: POST
    path: "/agencies/tour-packages/{packageId}/publish"
    description: "Publish a TourPackage"
    roles: [TravelAgent]
    code: 200
    input: []
    output: TourPackage
    side_effects: ["status -> PUBLISHED", "increments TourPackage.version by 1"]

  - method: POST
    path: "/agencies/tour-packages/{packageId}/retire"
    description: "Retire a TourPackage"
    roles: [TravelAgent]
    code: 200
    input: []
    output: TourPackage
    side_effects: ["status -> RETIRED (ERR_PACKAGE_HAS_OPEN_BOOKINGS if DRAFT/RESERVED bookings reference it)", "increments TourPackage.version by 1"]

  # --- Booking ---
  - method: POST
    path: "/agencies/bookings"
    description: "Open a DRAFT Booking against a PUBLISHED package"
    roles: [AgencyAdmin, TravelAgent]
    code: 201
    input: [agency_id, customer_id, tour_package_id, departure_date]
    output: Booking
    side_effects:
      - "status=DRAFT; traveler_count=0; subtotal_cents=0; insurance_premium_cents=0; grand_total_cents=0; paid_cents=0; payment_status=UNPAID"
      - "ERR_PACKAGE_NOT_PUBLISHED if package not PUBLISHED; ERR_INVALID_REFERENCE if customer/package not in agency"

  - method: GET
    path: "/agencies/bookings/{bookingId}"
    description: "Get a Booking (with computed totals)"
    roles: [AgencyAdmin, TravelAgent, Customer]
    code: 200
    input: []
    output: Booking
    side_effects: []

  - method: GET
    path: "/agencies/bookings"
    description: "List Bookings (filterable; reverse-reachability for Booking.agency_id, customer_id, tour_package_id)"
    roles: [AgencyAdmin, TravelAgent, Customer]
    code: 200
    input: ["agency_id?", "customer_id?", "tour_package_id?", "status?", "limit?", "offset?"]
    output: "Booking[]"
    side_effects: []

  - method: POST
    path: "/agencies/bookings/{bookingId}/reserve"
    description: "Reserve a Booking (freeze price, generate milestones)"
    roles: [TravelAgent]
    code: 200
    input: [expected_booking_version]
    output: Booking
    side_effects:
      - "status -> RESERVED; subtotal/insurance/grand_total frozen; DEPOSIT + BALANCE milestones generated; payment_status=UNPAID"
      - "increments Booking.version by 1"

  - method: POST
    path: "/agencies/bookings/{bookingId}/confirm"
    description: "Confirm a Booking (all mandatory components CONFIRMED + DEPOSIT settled)"
    roles: [TravelAgent]
    code: 200
    input: [expected_booking_version]
    output: Booking
    side_effects:
      - "status -> CONFIRMED"
      - "increments Booking.version by 1"

  - method: POST
    path: "/agencies/bookings/{bookingId}/cancel"
    description: "Cancel a Booking (compute penalty + refund, compensate)"
    roles: [Customer, TravelAgent]
    code: 200
    input: [expected_booking_version, "refund_destination?"]
    output: Booking
    side_effects:
      - "status -> CANCELLED; CancellationRecord created; APPLIED payments REFUNDED; OPEN milestones WAIVED; non-RELEASED components RELEASED; ACTIVE insurance VOIDED; paid_cents -> 0"
      - "If refund_destination=WALLET: customer.wallet_credit_cents += refund_cents"
      - "increments Booking.version by 1"

  # --- Traveler ---
  - method: POST
    path: "/agencies/bookings/{bookingId}/travelers"
    description: "Add a Traveler to a DRAFT Booking (re-quotes subtotal)"
    roles: [AgencyAdmin, TravelAgent]
    code: 201
    input: [full_name, "passport_no?", expected_booking_version]
    output: Traveler
    side_effects:
      - "Booking must be DRAFT (ERR_INVALID_STATE)"
      - "First traveler forced is_lead=true; later travelers is_lead=false"
      - "traveler_count += 1; subtotal_cents/grand_total_cents re-quoted via group_discount_price_per_person"
      - "increments Booking.version by 1"

  - method: GET
    path: "/agencies/travelers/{travelerId}"
    description: "Get a Traveler"
    roles: [AgencyAdmin, TravelAgent, Customer]
    code: 200
    input: []
    output: Traveler
    side_effects: []

  - method: GET
    path: "/agencies/travelers"
    description: "List Travelers (filterable; reverse-reachability for Traveler.booking_id)"
    roles: [AgencyAdmin, TravelAgent, Customer]
    code: 200
    input: ["booking_id?", "limit?", "offset?"]
    output: "Traveler[]"
    side_effects: []

  # --- Booking Component ---
  - method: POST
    path: "/agencies/components"
    description: "Request a BookingComponent (flight/hotel/activity) from a Supplier"
    roles: [AgencyAdmin, TravelAgent]
    code: 201
    input: [booking_id, supplier_id, kind, starts_at, ends_at, "is_mandatory?"]
    output: BookingComponent
    side_effects:
      - "Booking must be DRAFT or RESERVED (ERR_INVALID_STATE)"
      - "supplier.kind must equal kind (ERR_INVALID_REFERENCE)"
      - "ends_at > starts_at (ERR_INVALID_INTERVAL)"
      - "HOTEL: within-booking half-open overlap check (ERR_COMPONENT_OVERLAP); FLIGHT/ACTIVITY: cross-booking supplier-capacity buffer check (ERR_SUPPLIER_CAPACITY_CONFLICT)"
      - "status=REQUESTED, or CONFIRMED immediately if supplier.auto_confirm"

  - method: GET
    path: "/agencies/components/{componentId}"
    description: "Get a BookingComponent"
    roles: [AgencyAdmin, TravelAgent, Customer, Supplier]
    code: 200
    input: []
    output: BookingComponent
    side_effects: []

  - method: GET
    path: "/agencies/components"
    description: "List BookingComponents (filterable; reverse-reachability for booking_id and supplier_id)"
    roles: [AgencyAdmin, TravelAgent, Customer, Supplier]
    code: 200
    input: ["booking_id?", "supplier_id?", "status?", "kind?", "limit?", "offset?"]
    output: "BookingComponent[]"
    side_effects: []

  - method: POST
    path: "/agencies/components/{componentId}/confirm"
    description: "Supplier confirms a requested component"
    roles: [Supplier]
    code: 200
    input: []
    output: BookingComponent
    side_effects: ["status -> CONFIRMED"]

  - method: POST
    path: "/agencies/components/{componentId}/reject"
    description: "Supplier rejects a requested component"
    roles: [Supplier]
    code: 200
    input: []
    output: BookingComponent
    side_effects:
      - "status -> REJECTED"
      - "If is_mandatory and booking RESERVED: booking -> DRAFT, OPEN milestones WAIVED, payment_status recomputed (cascade)"

  # --- Insurance ---
  - method: POST
    path: "/agencies/insurance-policies"
    description: "Attach a travel-insurance add-on to a DRAFT Booking"
    roles: [AgencyAdmin, TravelAgent]
    code: 201
    input: [booking_id, coverage_tier]
    output: InsurancePolicy
    side_effects:
      - "Booking must be DRAFT (ERR_INVALID_STATE)"
      - "premium_cents = traveler_count * tier rate; refundable set by tier"
      - "insurance_premium_cents/grand_total_cents on booking re-quoted"

  - method: GET
    path: "/agencies/insurance-policies/{policyId}"
    description: "Get an InsurancePolicy"
    roles: [AgencyAdmin, TravelAgent, Customer]
    code: 200
    input: []
    output: InsurancePolicy
    side_effects: []

  - method: GET
    path: "/agencies/insurance-policies"
    description: "List InsurancePolicies (filterable; reverse-reachability for InsurancePolicy.booking_id)"
    roles: [AgencyAdmin, TravelAgent, Customer]
    code: 200
    input: ["booking_id?", "status?", "limit?", "offset?"]
    output: "InsurancePolicy[]"
    side_effects: []

  # --- Payment Milestones ---
  - method: GET
    path: "/agencies/milestones/{milestoneId}"
    description: "Get a PaymentMilestone"
    roles: [AgencyAdmin, TravelAgent, Customer]
    code: 200
    input: []
    output: PaymentMilestone
    side_effects: []

  - method: GET
    path: "/agencies/milestones"
    description: "List PaymentMilestones (filterable; reverse-reachability for PaymentMilestone.booking_id)"
    roles: [AgencyAdmin, TravelAgent, Customer]
    code: 200
    input: ["booking_id?", "kind?", "status?", "limit?", "offset?"]
    output: "PaymentMilestone[]"
    side_effects: []

  # --- Payments ---
  - method: POST
    path: "/agencies/payments"
    description: "Record a Payment against a milestone"
    roles: [AgencyAdmin, TravelAgent, Customer]
    code: 201
    input: [booking_id, milestone_id, amount_cents, "method?"]
    output: Payment
    side_effects:
      - "Booking must be RESERVED or CONFIRMED (ERR_INVALID_STATE)"
      - "Overpayment check (ERR_OVERPAYMENT); BALANCE requires DEPOSIT SETTLED (ERR_DEPOSIT_NOT_SETTLED)"
      - "status=APPLIED; milestone.settled_amount_cents += amount_cents; Booking.paid_cents recomputed; payment_status recomputed"

  - method: GET
    path: "/agencies/payments/{paymentId}"
    description: "Get a Payment"
    roles: [AgencyAdmin, TravelAgent, Customer]
    code: 200
    input: []
    output: Payment
    side_effects: []

  - method: GET
    path: "/agencies/payments"
    description: "List Payments (filterable; reverse-reachability for Payment.booking_id and Payment.milestone_id)"
    roles: [AgencyAdmin, TravelAgent, Customer]
    code: 200
    input: ["booking_id?", "milestone_id?", "status?", "limit?", "offset?"]
    output: "Payment[]"
    side_effects: []

  # --- Cancellation Records ---
  - method: GET
    path: "/agencies/cancellation-records/{recordId}"
    description: "Get a CancellationRecord"
    roles: [AgencyAdmin, TravelAgent, Customer]
    code: 200
    input: []
    output: CancellationRecord
    side_effects: []

  - method: GET
    path: "/agencies/cancellation-records"
    description: "List CancellationRecords (filterable; reverse-reachability for CancellationRecord.booking_id)"
    roles: [AgencyAdmin, TravelAgent, Customer]
    code: 200
    input: ["booking_id?", "limit?", "offset?"]
    output: "CancellationRecord[]"
    side_effects: []

# =============================================================================
# Table 1.6: Error Code Catalog
# =============================================================================
errors:
  - id: ERR_MISSING_OR_INVALID_USER_CONTEXT_HEADER
    http: 400
    condition: "X-User-ID or X-User-Role header missing or X-User-Role not a known role"
  - id: ERR_FORBIDDEN_FOR_ROLE
    http: 403
    condition: "Role valid but not permitted for endpoint, or ownership check failed (Customer not owner of booking / Supplier not owner of component)"
  - id: ERR_NOT_FOUND
    http: 404
    condition: "Path-referenced resource does not exist in the agency"
  - id: ERR_INVALID_REQUEST
    http: 400
    condition: "Malformed body, missing required field, non-positive amount/price, invalid enum, deposit_pct out of 1..100"
  - id: ERR_INVALID_REFERENCE
    http: 422
    condition: "Body FK (agency_id/customer_id/tour_package_id/supplier_id/booking_id/milestone_id) not in agency, or supplier.kind != component.kind"
  - id: ERR_DUPLICATE_EMAIL
    http: 409
    condition: "Customer email already used within the agency"
  - id: ERR_STALE_VERSION
    http: 412
    condition: "expected_booking_version does not match current Booking.version"
  - id: ERR_INVALID_STATE
    http: 409
    condition: "Target resource not in a state where the requested transition is defined"
  - id: ERR_INVALID_INTERVAL
    http: 422
    condition: "Component ends_at <= starts_at"
  - id: ERR_COMPONENT_OVERLAP
    http: 409
    condition: "New HOTEL component overlaps another HOTEL component of the same supplier on the same booking under half-open [starts_at, ends_at) semantics (touching boundaries allowed)"
  - id: ERR_SUPPLIER_CAPACITY_CONFLICT
    http: 409
    condition: "New FLIGHT/ACTIVITY component collides with a non-RELEASED/REJECTED component of the same supplier and kind on any booking within the turnaround buffer (touching intervals collide)"
  - id: ERR_PACKAGE_NOT_PUBLISHED
    http: 409
    condition: "Booking opened or reserved against a package that is not PUBLISHED"
  - id: ERR_PACKAGE_HAS_OPEN_BOOKINGS
    http: 409
    condition: "Retire attempted while DRAFT/RESERVED bookings reference the package"
  - id: ERR_NO_TRAVELERS
    http: 409
    condition: "Reserve attempted with traveler_count == 0"
  - id: ERR_NO_COMPONENTS
    http: 409
    condition: "Reserve attempted with no is_mandatory BookingComponent in {REQUESTED, CONFIRMED}"
  - id: ERR_COMPONENTS_NOT_CONFIRMED
    http: 409
    condition: "Confirm attempted while some is_mandatory component is not CONFIRMED"
  - id: ERR_DEPOSIT_NOT_SETTLED
    http: 409
    condition: "Confirm attempted before DEPOSIT milestone SETTLED, or BALANCE payment attempted before DEPOSIT SETTLED"
  - id: ERR_OVERPAYMENT
    http: 422
    condition: "Payment amount exceeds milestone remaining due (amount_due_cents - settled_amount_cents)"

# =============================================================================
# Table 1.7: RBAC Matrix
# =============================================================================
roles:
  - name: AgencyAdmin
    description: "Agency operator: provisions agencies, suppliers, customers, opens bookings, runs the clock, records payments"
    identity: "opaque"
    exclusive_operations:
      - "POST /agencies — Create agency"
      - "POST /agencies/{id}/_clock/set — Set simulation clock"
      - "POST /agencies/suppliers — Create supplier"
    shared_operations:
      - "POST /agencies/customers — Create customer (with TravelAgent)"
      - "POST /agencies/bookings — Open booking (with TravelAgent)"
      - "POST /agencies/bookings/{id}/travelers — Add traveler (with TravelAgent)"
      - "POST /agencies/components — Request component (with TravelAgent)"
      - "POST /agencies/insurance-policies — Attach insurance (with TravelAgent)"
      - "POST /agencies/payments — Record payment (with TravelAgent, Customer)"

  - name: TravelAgent
    description: "Agency staff: builds/publishes/retires packages, opens and operates bookings, reserves and confirms, cancels"
    identity: "opaque"
    exclusive_operations:
      - "POST /agencies/tour-packages — Create package"
      - "POST /agencies/tour-packages/{id}/publish — Publish package"
      - "POST /agencies/tour-packages/{id}/retire — Retire package"
      - "POST /agencies/bookings/{id}/reserve — Reserve booking"
      - "POST /agencies/bookings/{id}/confirm — Confirm booking"
    shared_operations:
      - "POST /agencies/customers — Create customer (with AgencyAdmin)"
      - "POST /agencies/bookings — Open booking (with AgencyAdmin)"
      - "POST /agencies/bookings/{id}/travelers — Add traveler (with AgencyAdmin)"
      - "POST /agencies/components — Request component (with AgencyAdmin)"
      - "POST /agencies/insurance-policies — Attach insurance (with AgencyAdmin)"
      - "POST /agencies/payments — Record payment (with AgencyAdmin, Customer)"
      - "POST /agencies/bookings/{id}/cancel — Cancel booking (with Customer)"

  - name: Customer
    description: "Booking owner: pays milestones for own bookings, cancels own bookings, reads own resources"
    identity: "entity_backed:Customer"
    exclusive_operations: []
    shared_operations:
      - "POST /agencies/payments — Record payment on own booking (with AgencyAdmin, TravelAgent)"
      - "POST /agencies/bookings/{id}/cancel — Cancel own booking (with TravelAgent)"
      - "GET /agencies/bookings/{id} — Read own booking and its sub-resources"

  - name: Supplier
    description: "Component fulfiller: confirms or rejects components routed to it"
    identity: "entity_backed:Supplier"
    exclusive_operations:
      - "POST /agencies/components/{id}/confirm — Confirm own component"
      - "POST /agencies/components/{id}/reject — Reject own component"
    shared_operations:
      - "GET /agencies/components — List own components"
