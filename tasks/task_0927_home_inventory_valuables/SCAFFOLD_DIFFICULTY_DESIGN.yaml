            - call: "POST /vault/subscriptions"
              payload: { household_id: "${hh_id}", tier: "PLUS" }
              as: Homeowner
              as_user_id: "${owner_id}"
              captures: { sub_id: $.data.id }
            - call: "POST /vault/subscriptions/${sub_id}/billing-event"
              payload: { outcome: "PAYMENT_SUCCEEDED" }
              as: PlatformAdmin
            - call: "POST /vault/share-grants"
              payload: { household_id: "${hh_id}", scope_kind: "HOUSEHOLD", recipient_ref: "agent@carrier.example", redaction_level: "SERIALS_HIDDEN", starts_at: "2026-05-01T00:00:00Z", expires_at: "2026-06-01T00:00:00Z", access_cap: 10 }
              as: Homeowner
              as_user_id: "${owner_id}"
              captures: { grant_1: $.data.id }
          trigger:
            - call: "POST /vault/share-grants"
              payload: { household_id: "${hh_id}", scope_kind: "HOUSEHOLD", recipient_ref: "agent@carrier.example", redaction_level: "SERIALS_HIDDEN", starts_at: "2026-05-15T00:00:00Z", expires_at: "2026-06-15T00:00:00Z", access_cap: 10 }
              as: Homeowner
              as_user_id: "${owner_id}"
              captures: { err_overlap: $.data.error_id }
            - call: "POST /vault/share-grants"
              payload: { household_id: "${hh_id}", scope_kind: "HOUSEHOLD", recipient_ref: "agent@carrier.example", redaction_level: "SERIALS_HIDDEN", starts_at: "2026-06-01T00:00:00Z", expires_at: "2026-07-01T00:00:00Z", access_cap: 10 }
              as: Homeowner
              as_user_id: "${owner_id}"
              captures: { grant_3: $.data.id }
          assert:
            - "${err_overlap} == ERR_SHARE_WINDOW_OVERLAP"
            - "the 2026-05-15 request returns HTTP 409"
            - "the 2026-06-01 request returns HTTP 201"
            - "ShareGrant.${grant_1}.status == ACTIVE"
            - "ShareGrant.${grant_3}.status == ACTIVE"
            - "ShareGrant.${grant_3}.access_count == 0"
            - "Household.${hh_id}.active_share_count == 2"

  - rule_id: compensating_invariant
    instances:
      - name: schedule_unschedule_roundtrip_conserves_policy_allowance_cents
        grounds:
          - calculations.scheduled_allowance_ledger
          - entities.Policy.fields.scheduled_consumed_cents
          - entities.Policy.fields.scheduled_remaining_cents
          - endpoints.POST /vault/items/{item_id}/unschedule
        distinguishing_aspect: |
          Conserved quantity: allowance CENTS on one Policy, pinned as
          scheduled_consumed_cents == sum of scheduled_value_cents over that policy's
          SCHEDULED items and scheduled_remaining_cents == allowance - consumed. After
          schedule(600000), schedule(300000), unschedule(600000), schedule(600000) the
          ledger returns to exactly 900000 / 100000 with zero drift, even though an
          unrelated rider was created between the forward and compensating actions.
