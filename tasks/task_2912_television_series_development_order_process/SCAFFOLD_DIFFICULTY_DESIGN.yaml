            - "TestScreening.${scr1_id}.status == INVALIDATED after the second screening is fielded"
            - "TestScreening.${scr2_id}.status == FIELDED"

  - rule_id: non_linear_state_machine
    instances:
      - name: deal_step_notes_cycle_returns_to_delivered_then_exhausts_at_two_rounds
        grounds:
          - state_machines.DealStep
          - entities.DealStep.fields.notes_round
          - validations[priority=35]
          - endpoints["POST /script-deals/{id}/steps/{step_id}/review"]
          - endpoints["POST /script-deals/{id}/steps/{step_id}/deliver"]
        distinguishing_aspect: |
          Backward cycle inside a single entity's own lifecycle:
          DELIVERED -> NOTES_ISSUED -> DELIVERED is re-enterable and the loop is
          bounded by a counter carried on the looping row itself (notes_round vs
          MAX_NOTES_ROUNDS = 2). The state pair revisited is (DELIVERED), and the
          escape hatch is the ACCEPT branch out of the same source state.
        test_recipe:
          setup:
            - "logical clock at its 2026-08-01T00:00:00Z default"
            - "one ScriptDeal with guaranteed_step_count 1 whose first step has been exercised and delivered"
          setup_api_calls:
            - call: "POST /agencies"
              payload: { name: "Halcyon Talent Partners", agency_code: "HAL", relationship_tier: "STANDARD", packaging_allowed: true, annual_submission_cap: 5 }
              as: PlatformAdmin
              captures: { ag_id: $.data.id }
            - call: "POST /slates"
              payload: { platform: "STREAMING", season_year: 2027, total_dev_budget_cents: 400000000, pattern_budget_per_episode_cents: 32000000, license_fee_cap_per_episode_cents: 30000000, max_deficit_per_episode_cents: 7000000, episode_capacity: 20, default_episode_count: 10, max_backend_points_bps: 2000, max_concurrent_pilot_shoots: 2 }
              as: PlatformAdmin
              captures: { slate_id: $.data.id }
