      - name: consultant_review_desk_closed_interval_capacity_rejects_touching_windows
        grounds:
          - validations[priority=14]
          - errors[ERR_CONSULTANT_REVIEW_CAPACITY]
          - entities.ConsultantFirm.fields.concurrent_review_capacity
          - entities.Submittal.fields.review_started_at
          - entities.Submittal.fields.review_due_at
          - state_machines.Submittal.RECEIVED_to_UNDER_REVIEW
        distinguishing_aspect: |
          Interval semantics #2, on a DIFFERENT resource entity (ConsultantFirm) with DIFFERENT
          geometry: the review window is a CLOSED interval [review_started_at, review_due_at]
          measured against an AGGREGATE capacity N. With capacity 1 and an in-flight window
          [2026-06-01T09:00:00Z, 2026-06-15T09:00:00Z], a second review starting at exactly
          2026-06-15T09:00:00Z TOUCHES the first at its endpoint and is REJECTED with
          ERR_CONSULTANT_REVIEW_CAPACITY — the opposite outcome to the half-open timesheet rule.
