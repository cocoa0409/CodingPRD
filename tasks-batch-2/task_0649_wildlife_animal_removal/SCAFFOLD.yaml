scenario: |
  649. Wildlife & Nuisance-Animal Removal (Critter Control style): inspection &
  species/entry-point assessment, trap/exclusion plan & quote, humane removal &
  relocation compliance, exclusion/repair (sealing) & sanitation, recurring
  monitoring & re-set, permit/regulated-species, warranty/callback, emergency

domain_name: wildlife-animal-removal
api_prefix: ""

complexity_profile:
  primary_archetype: workflow_orchestration
  secondary_archetype: compliance_audit
  complexity_layers:
    - dual_variant_calculation
    - cascading_side_effects
    - optimistic_concurrency
    - rate_threshold_triggers
    - derived_field_reconciliation

  entity_topology: hybrid
  # Properties own Inspections (tree); WorkOrders, Permits, TrapPlacements,
  # ExclusionRepairs, MonitoringVisits, WarrantyClaims hang off WorkOrder
  # (tree) but reference SpeciesProfile and Technician as flat cross-cutting
  # FKs (graph-ish). EntryPoint is a child of Inspection but is also referenced
  # by ExclusionRepair across the tree — a hybrid cross-cutting association.

  state_machine_shape: compound
  # Quote is cyclic (revision loop); WorkOrder carries parallel removal_status x
  # exclusion_status dimensions; Permit is branching (REQUESTED -> APPROVED|DENIED);
  # WorkOrder also auto-derives lifecycle from the two parallel dimensions
  # (compound). The package as a whole is non-linear on multiple entities.

  relationship_patterns:
    - one_to_many        # Property->Inspection, WorkOrder->TrapPlacement, etc.
    - cross_aggregate    # ExclusionRepair.entry_point_id crosses into Inspection's subtree
    - polymorphic        # (not used)

  role_model: peer_roles
  # FieldTechnician owns trap/removal/exclusion execution; ComplianceOfficer owns
  # permit + relocation sign-off; Dispatcher owns scheduling/quoting; PropertyOwner
  # owns acceptance + warranty claims. Non-overlapping resource ownership.

  consistency_model: immediate

# =============================================================================
# §1.0 Response Envelope (FIXED — emitted verbatim)
# =============================================================================
response_envelope:
  success: |
    { "meta": { "api_request_id": "req_xxx", "api_request_timestamp": "ISO8601" },
      "response_type": "object" | "array", "data": {} }
  error: |
    { "meta": { ... }, "response_type": "error",
      "data": { "error_id": "ERR_XXX", "message": "..." } }
  pagination_fields: ["limit", "offset", "total_count", "has_more"]
  pagination_defaults: { limit: 10, min: 1, max: 100, offset: 0 }

# =============================================================================
# §1.1 Entity-Relationship Table
# =============================================================================
entities:
  - name: SpeciesProfile
    parent: null
    common_fields: true
    fields:
      - name: common_name
        type: string
        source: input
        description: "Display name, e.g. 'Eastern Gray Squirrel'."
      - name: code
        type: string
        source: input
        description: "Short unique code, e.g. 'GRAY_SQUIRREL'."
        constraints: "Unique across all SpeciesProfile (case-sensitive exact match)."
      - name: is_regulated
        type: boolean
        source: input
        description: "True if a Permit is legally required before any trap may be SET for this species."
        default: false
      - name: relocation_min_miles
        type: number
        source: input
        description: "Minimum lawful straight-line release distance from the capture property, in miles."
        default: 0
        constraints: ">= 0; must be <= relocation_max_miles."
      - name: relocation_max_miles
        type: number
        source: input
        description: "Maximum lawful straight-line release distance, in miles. Beyond this is unlawful dumping."
        default: 25
        constraints: ">= relocation_min_miles."
      - name: humane_check_interval_hours
        type: integer
        source: input
        description: "Maximum hours a live trap may go unchecked before the trap is non-compliant; drives monitoring cadence."
        default: 24
        constraints: ">= 1."
      - name: base_trap_fee_cents
        type: integer
        source: input
        description: "Per-trap placement fee in cents used by quote line-item pricing for this species."
        constraints: ">= 0."
      - name: risk_weight
        type: number
        source: input
        description: "Per-individual contribution to the infestation risk score for this species."
        default: 1.0
        constraints: ">= 0."

  - name: Technician
    parent: null
    common_fields: true
    fields:
      - name: full_name
        type: string
        source: input
        description: "Technician display name."
      - name: license_tier
        type: enum
        source: input
        description: "Capability tier. BASIC may run non-regulated removals only; CERTIFIED may run regulated-species removals."
        constraints: "one of {BASIC, CERTIFIED}."
        default: BASIC
      - name: kit_trap_capacity
        type: integer
        source: input
        description: "Total traps in this technician's physical kit (the conserved trap pool)."
        constraints: ">= 0."
      - name: traps_deployed
        type: integer
        source: computed
        description: "Count of this technician's TrapPlacements currently in SET state. Invariant: traps_deployed + traps_available == kit_trap_capacity."
        default: 0
      - name: traps_available
        type: integer
        source: computed
        description: "kit_trap_capacity - traps_deployed. Never negative; a SET that would drive it below 0 is rejected."
        default: 0

  - name: ServiceAccount
    parent: null
    common_fields: true
    fields:
      - name: account_name
        type: string
        source: input
        description: "Billing account / property-owner name."
      - name: contact_email
        type: string
        source: input
        description: "Primary contact email."

  - name: Property
    parent: null
    common_fields: true
    fields:
      - name: account_id
        type: string
        source: input
        description: "FK -> ServiceAccount.id; the billing owner of this property."
      - name: latitude
        type: number
        source: input
        description: "Property latitude in decimal degrees; origin point for relocation-distance compliance."
        constraints: "-90 <= latitude <= 90."
      - name: longitude
        type: number
        source: input
        description: "Property longitude in decimal degrees."
        constraints: "-180 <= longitude <= 180."
      - name: posture
        type: enum
        source: computed
        description: "Derived operational posture. OPEN before any active work; ACTIVE_REMEDIATION while a WorkOrder is in progress; REGULATORY_HOLD while a regulated-species Permit on an active WorkOrder is still REQUESTED (blocks new inspections)."
        default: OPEN
        constraints: "one of {OPEN, ACTIVE_REMEDIATION, REGULATORY_HOLD}."

  - name: Inspection
    parent: Property
    common_fields: true
    fields:
      - name: property_id
        type: string
        source: input
        description: "FK -> Property.id; the site inspected."
      - name: scheduled_for
        type: datetime
        source: input
        description: "ISO 8601 UTC time the inspection visit is scheduled."
      - name: is_emergency
        type: boolean
        source: input
        description: "True for after-hours/emergency dispatch; raises quote line-item pricing via the EMERGENCY_SURCHARGE_PCT multiplier."
        default: false
      - name: status
        type: enum
        source: computed
        description: "DRAFT on create; COMPLETED once entry-point findings are committed and the inspection is closed; quotes may only be created from a COMPLETED inspection."
        default: DRAFT
        constraints: "one of {DRAFT, COMPLETED, CANCELLED}."
      - name: detected_individual_count
        type: integer
        source: computed
        description: "Sum of EntryPoint.estimated_individuals across this inspection's EntryPoints; refreshed whenever an EntryPoint is added."
        default: 0

  - name: EntryPoint
    parent: Inspection
    common_fields: true
    fields:
      - name: inspection_id
        type: string
        source: input
        description: "FK -> Inspection.id; the inspection that found this entry point."
      - name: species_id
        type: string
        source: input
        description: "FK -> SpeciesProfile.id; the species using this entry point."
      - name: location_label
        type: string
        source: input
        description: "Human-readable location, e.g. 'NE soffit gap'."
      - name: severity
        type: enum
        source: input
        description: "Access severity tier driving the risk multiplier."
        constraints: "one of {MINOR, MODERATE, MAJOR}."
        default: MODERATE
      - name: estimated_individuals
        type: integer
        source: input
        description: "Estimated number of animals using this entry point."
        constraints: ">= 0."
      - name: seal_status
        type: enum
        source: computed
        description: "OPEN until an ExclusionRepair for this entry point completes; SEALED afterward. Residual risk only counts OPEN entry points."
        default: OPEN
        constraints: "one of {OPEN, SEALED}."

  - name: Quote
    parent: Inspection
    common_fields: true
    fields:
      - name: inspection_id
        type: string
        source: input
        description: "FK -> Inspection.id; the inspection this quote prices."
      - name: status
        type: enum
        source: computed
        description: "Lifecycle of the quote (cyclic with a revision loop)."
        default: DRAFT
        constraints: "one of {DRAFT, SENT, REVISION_REQUESTED, ACCEPTED, DECLINED, SUPERSEDED}."
      - name: provisional_total_cents
        type: integer
        source: computed
        description: "Forward-looking estimate: per-line-item price rounded to the cent then summed over ALL line items. Set when the quote is SENT."
        default: 0
      - name: final_total_cents
        type: integer
        source: computed
        description: "Chronological actual: per-line-item price rounded to the cent then summed over only line items whose work was performed (TrapPlacement SET or ExclusionRepair COMPLETED). Set when the WorkOrder closes."
        default: 0
      - name: emergency_flag
        type: boolean
        source: computed
        description: "Copied from the parent Inspection.is_emergency at quote creation; pins the surcharge basis even if the inspection later changes."
        default: false

  - name: QuoteLineItem
    parent: Quote
    common_fields: true
    fields:
      - name: quote_id
        type: string
        source: input
        description: "FK -> Quote.id; the quote this line belongs to."
      - name: species_id
        type: string
        source: input
        description: "FK -> SpeciesProfile.id; species priced on this line."
      - name: line_type
        type: enum
        source: input
        description: "TRAP lines price trap placements; EXCLUSION lines price sealing/sanitation of entry points."
        constraints: "one of {TRAP, EXCLUSION}."
      - name: quantity
        type: integer
        source: input
        description: "Number of traps (TRAP) or entry points to seal (EXCLUSION)."
        constraints: ">= 1."
      - name: unit_price_cents
        type: integer
        source: input
        description: "Pre-surcharge per-unit price in cents for this line."
        constraints: ">= 0."
      - name: performed
        type: boolean
        source: computed
        description: "Set true once the corresponding work (a SET TrapPlacement for TRAP, a COMPLETED ExclusionRepair for EXCLUSION) is recorded; gates inclusion in the final total."
        default: false

  - name: WorkOrder
    parent: Quote
    common_fields: true
    fields:
      - name: quote_id
        type: string
        source: input
        description: "FK -> Quote.id; the accepted quote that spawned this work order."
      - name: property_id
        type: string
        source: input
        description: "FK -> Property.id; denormalized site for convenience filtering."
      - name: assigned_technician_id
        type: string
        source: input
        description: "FK -> Technician.id; the technician executing this work order."
      - name: lifecycle
        type: enum
        source: computed
        description: "Compound lifecycle derived from the two parallel dimensions: OPEN until both reach terminal sub-states, then CLOSED; CANCELLED on cancellation."
        default: OPEN
        constraints: "one of {OPEN, CLOSED, CANCELLED}."
      - name: removal_status
        type: enum
        source: computed
        description: "Parallel dimension A. PENDING -> TRAPPING (first trap SET) -> CLEARED (all SET traps resolved to SPENT/EMPTY and at least one trap existed)."
        default: PENDING
        constraints: "one of {PENDING, TRAPPING, CLEARED}."
      - name: exclusion_status
        type: enum
        source: computed
        description: "Parallel dimension B. PENDING -> SEALING (first ExclusionRepair started) -> SEALED (all targeted OPEN entry points SEALED)."
        default: PENDING
        constraints: "one of {PENDING, SEALING, SEALED}."
      - name: net_charged_cents
        type: integer
        source: computed
        description: "Conserved money quantity: total charged minus total refunded. After close equals Quote.final_total_cents; after a cancellation refund equals the performed-work subtotal. Invariant pinned in calc workorder_net_charge."
        default: 0
      - name: initial_risk_score
        type: number
        source: computed
        description: "Infestation risk computed at acceptance over ALL entry points of the inspection (forward-looking variant)."
        default: 0
      - name: residual_risk_score
        type: number
        source: computed
        description: "Infestation risk recomputed at close over only OPEN (unsealed) entry points (chronological/residual variant)."
        default: 0

  - name: Permit
    parent: WorkOrder
    common_fields: true
    fields:
      - name: work_order_id
        type: string
        source: input
        description: "FK -> WorkOrder.id; the work order requiring this permit."
      - name: species_id
        type: string
        source: input
        description: "FK -> SpeciesProfile.id; the regulated species this permit authorizes."
      - name: status
        type: enum
        source: computed
        description: "Branching lifecycle: REQUESTED -> APPROVED | DENIED."
        default: REQUESTED
        constraints: "one of {REQUESTED, APPROVED, DENIED}."
      - name: permit_number
        type: string
        source: input
        description: "Regulator-issued permit number, supplied at approval time."
        default: null

  - name: TrapPlacement
    parent: WorkOrder
    common_fields: true
    fields:
      - name: work_order_id
        type: string
        source: input
        description: "FK -> WorkOrder.id; the work order this trap belongs to."
      - name: species_id
        type: string
        source: input
        description: "FK -> SpeciesProfile.id; target species for this trap."
      - name: technician_id
        type: string
        source: input
        description: "FK -> Technician.id; the technician whose kit supplies this trap (decremented on SET, restored on close)."
      - name: window_start
        type: datetime
        source: input
        description: "ISO 8601 UTC start of the on-site set/check visit window for this trap (used in technician overlap detection)."
      - name: window_end
        type: datetime
        source: input
        description: "ISO 8601 UTC end of the visit window. Must be strictly after window_start."
      - name: status
        type: enum
        source: computed
        description: "SET when armed; SPENT after a CaptureEvent is relocated; EMPTY when pulled with no capture; CANCELLED if voided before set."
        default: SET
        constraints: "one of {SET, SPENT, EMPTY, CANCELLED}."

  - name: CaptureEvent
    parent: TrapPlacement
    common_fields: true
    fields:
      - name: trap_placement_id
        type: string
        source: input
        description: "FK -> TrapPlacement.id; the trap that made this capture."
      - name: captured_at
        type: datetime
        source: input
        description: "ISO 8601 UTC time the animal was found in the trap."
      - name: release_latitude
        type: number
        source: input
        description: "Decimal-degree latitude of the relocation/release site."
        constraints: "-90 <= release_latitude <= 90."
      - name: release_longitude
        type: number
        source: input
        description: "Decimal-degree longitude of the release site."
        constraints: "-180 <= release_longitude <= 180."
      - name: release_distance_miles
        type: number
        source: computed
        description: "Great-circle distance from the property to the release site, in miles; checked against the species relocation band."
        default: 0
      - name: disposition
        type: enum
        source: computed
        description: "RELOCATED on a compliant release; the create is rejected outright if the distance is out of band, so only RELOCATED ever persists."
        default: RELOCATED
        constraints: "one of {RELOCATED}."

  - name: ExclusionRepair
    parent: WorkOrder
    common_fields: true
    fields:
      - name: work_order_id
        type: string
        source: input
        description: "FK -> WorkOrder.id; the work order this repair belongs to."
      - name: entry_point_id
        type: string
        source: input
        description: "FK -> EntryPoint.id; the entry point being sealed (cross-aggregate reference into the Inspection subtree)."
      - name: sanitation_included
        type: boolean
        source: input
        description: "True if sanitation/decontamination is bundled with the seal; adds SANITATION_FEE_CENTS to the performed subtotal."
        default: false
      - name: status
        type: enum
        source: computed
        description: "STARTED on create; COMPLETED on completion (seals the entry point); only COMPLETED counts toward exclusion_status."
        default: STARTED
        constraints: "one of {STARTED, COMPLETED}."

  - name: MonitoringVisit
    parent: WorkOrder
    common_fields: true
    fields:
      - name: work_order_id
        type: string
        source: input
        description: "FK -> WorkOrder.id; the closed work order under warranty monitoring."
      - name: property_id
        type: string
        source: input
        description: "FK -> Property.id; the property visited (overlap detection resource)."
      - name: visit_start
        type: datetime
        source: input
        description: "ISO 8601 UTC start of the monitoring visit window."
      - name: visit_end
        type: datetime
        source: input
        description: "ISO 8601 UTC end of the monitoring visit window. Must be strictly after visit_start."
      - name: traps_reset
        type: integer
        source: input
        description: "Count of traps re-set during this visit (informational)."
        default: 0

  - name: WarrantyClaim
    parent: WorkOrder
    common_fields: true
    fields:
      - name: work_order_id
        type: string
        source: input
        description: "FK -> WorkOrder.id; the closed work order the claim is filed against."
      - name: reported_at
        type: datetime
        source: input
        description: "ISO 8601 UTC time the recurrence was reported (used for warranty-window eligibility)."
      - name: description
        type: string
        source: input
        description: "Owner's description of the recurrence."
      - name: status
        type: enum
        source: computed
        description: "FILED on create; ACCEPTED if within the warranty window and the work order qualified; REJECTED otherwise."
        default: FILED
        constraints: "one of {FILED, ACCEPTED, REJECTED}."

# =============================================================================
# §1.2 State Machine Table
# =============================================================================
state_machines:
  - entity: Inspection
    initial_state: DRAFT
    terminal_states: [CANCELLED]
    transitions:
      - from: DRAFT
        to: COMPLETED
        trigger: "POST /properties/{id}/inspections/{inspection_id}/complete"
        actor: Dispatcher
        preconditions:
          - "Inspection.status == DRAFT."
          - "Inspection has at least one EntryPoint (detected_individual_count basis exists)."
          - "Property.posture != REGULATORY_HOLD."
        side_effects:
          - "Inspection.status -> COMPLETED."
          - "detected_individual_count refreshed = sum of EntryPoint.estimated_individuals."
      - from: DRAFT
        to: CANCELLED
        trigger: "POST /properties/{id}/inspections/{inspection_id}/cancel"
        actor: Dispatcher
        preconditions:
          - "Inspection.status == DRAFT."
        side_effects:
          - "Inspection.status -> CANCELLED."

  - entity: Quote
    initial_state: DRAFT
    terminal_states: [ACCEPTED, DECLINED, SUPERSEDED]
    transitions:
      - from: DRAFT
        to: SENT
        trigger: "POST /quotes/{id}/send"
        actor: Dispatcher
        preconditions:
          - "Quote.status == DRAFT."
          - "Quote has at least one QuoteLineItem (empty quote cannot be sent)."
        side_effects:
          - "Quote.status -> SENT."
          - "provisional_total_cents computed via calc quote_provisional_total."
      - from: SENT
        to: REVISION_REQUESTED
        trigger: "POST /quotes/{id}/request-revision"
        actor: PropertyOwner
        preconditions:
          - "Quote.status == SENT."
        side_effects:
          - "Quote.status -> REVISION_REQUESTED."
      - from: REVISION_REQUESTED
        to: DRAFT
        trigger: "POST /quotes/{id}/reopen"
        actor: Dispatcher
        preconditions:
          - "Quote.status == REVISION_REQUESTED."
        side_effects:
          - "Quote.status -> DRAFT (revision loop; line items may now be edited again)."
        note: "Cyclic edge — closes the DRAFT->SENT->REVISION_REQUESTED->DRAFT loop."
      - from: SENT
        to: ACCEPTED
        trigger: "POST /quotes/{id}/accept"
        actor: PropertyOwner
        preconditions:
          - "Quote.status == SENT."
          - "Acting PropertyOwner owns the Property of the parent Inspection."
        side_effects:
          - "Quote.status -> ACCEPTED."
          - "CASCADE L1: create WorkOrder(lifecycle=OPEN, removal_status=PENDING, exclusion_status=PENDING) from this quote (assigned_technician_id supplied in body)."
          - "CASCADE L2 (caused by WorkOrder create): initial_risk_score computed via calc infestation_risk_score (initial variant); net_charged_cents initialized to provisional_total_cents."
          - "CASCADE L3 (caused by WorkOrder create): for each distinct regulated species among the inspection's EntryPoints, create a Permit(status=REQUESTED) on the WorkOrder."
          - "CASCADE L4 (caused by Permit create): if any Permit was created, set parent Property.posture = REGULATORY_HOLD; else Property.posture = ACTIVE_REMEDIATION."
      - from: SENT
        to: DECLINED
        trigger: "POST /quotes/{id}/decline"
        actor: PropertyOwner
        preconditions:
          - "Quote.status == SENT."
        side_effects:
          - "Quote.status -> DECLINED."

  - entity: Permit
    initial_state: REQUESTED
    terminal_states: [APPROVED, DENIED]
    transitions:
      - from: REQUESTED
        to: APPROVED
        trigger: "POST /permits/{id}/approve"
        actor: ComplianceOfficer
        preconditions:
          - "Permit.status == REQUESTED."
          - "permit_number supplied in request body."
        side_effects:
          - "Permit.status -> APPROVED; permit_number stored."
          - "BUBBLE: if all Permits on the WorkOrder are now APPROVED, set parent Property.posture = ACTIVE_REMEDIATION."
        note: "Branching fork — APPROVE vs DENY have divergent side-effect sets."
      - from: REQUESTED
        to: DENIED
        trigger: "POST /permits/{id}/deny"
        actor: ComplianceOfficer
        preconditions:
          - "Permit.status == REQUESTED."
        side_effects:
          - "Permit.status -> DENIED."
          - "CASCADE: WorkOrder.lifecycle -> CANCELLED (a denied permit blocks the regulated removal); Property.posture -> OPEN; all SET TrapPlacements on the WorkOrder -> CANCELLED with kit restoration."

  - entity: WorkOrder
    initial_state: OPEN
    terminal_states: [CLOSED, CANCELLED]
    transitions:
      - from: OPEN
        to: OPEN
        trigger: "POST /work-orders/{id}/trap-placements (removal dimension)"
        actor: FieldTechnician
        preconditions:
          - "WorkOrder.lifecycle == OPEN."
          - "If the trap's species is_regulated, a Permit for that species on this WorkOrder is APPROVED (cross-entity: TrapPlacement depends on Permit)."
          - "assigned technician.traps_available >= 1."
          - "No SET/active TrapPlacement on the same technician overlaps this trap's [window_start, window_end] closed interval inflated by TRAP_VISIT_BUFFER_MINUTES on each side."
        side_effects:
          - "removal_status: PENDING -> TRAPPING on the first SET trap."
          - "technician.traps_deployed += 1; technician.traps_available -= 1 (conserved kit pool)."
      - from: OPEN
        to: OPEN
        trigger: "POST /work-orders/{id}/exclusion-repairs/{repair_id}/complete (exclusion dimension)"
        actor: FieldTechnician
        preconditions:
          - "WorkOrder.lifecycle == OPEN."
          - "WorkOrder.removal_status == CLEARED (cross-entity: ExclusionRepair completion depends on removal dimension being cleared)."
          - "ExclusionRepair.status == STARTED."
        side_effects:
          - "ExclusionRepair.status -> COMPLETED; EntryPoint.seal_status -> SEALED; matching EXCLUSION QuoteLineItem.performed -> true."
          - "exclusion_status: SEALING -> SEALED when all OPEN entry points targeted by repairs are SEALED."
          - "AUTO-CLOSE: if removal_status==CLEARED and exclusion_status==SEALED, fire WorkOrder OPEN->CLOSED."
      - from: OPEN
        to: CLOSED
        trigger: "system: both parallel dimensions terminal (removal_status==CLEARED AND exclusion_status==SEALED)"
        actor: system
        preconditions:
          - "WorkOrder.removal_status == CLEARED."
          - "WorkOrder.exclusion_status == SEALED."
        side_effects:
          - "WorkOrder.lifecycle -> CLOSED."
          - "final_total_cents computed via calc quote_final_total over performed line items; Quote.final_total_cents set; net_charged_cents reconciled to final_total_cents."
          - "residual_risk_score computed via calc infestation_risk_score (residual variant) over OPEN entry points."
          - "Property.posture -> OPEN."
      - from: OPEN
        to: CANCELLED
        trigger: "POST /work-orders/{id}/cancel"
        actor: Dispatcher
        preconditions:
          - "WorkOrder.lifecycle == OPEN."
          - "expected_work_order_version matches WorkOrder.version (OCC)."
        side_effects:
          - "WorkOrder.lifecycle -> CANCELLED."
          - "COMPENSATION: refund = net_charged_cents - performed_subtotal (calc workorder_net_charge); net_charged_cents -> performed_subtotal; conserved-money invariant holds."
          - "all SET TrapPlacements -> CANCELLED; for each, technician.traps_deployed -= 1, traps_available += 1 (kit pool restored, conserved)."
          - "Property.posture -> OPEN."
          - "increments WorkOrder.version by 1."

  - entity: TrapPlacement
    initial_state: SET
    terminal_states: [SPENT, EMPTY, CANCELLED]
    transitions:
      - from: SET
        to: SPENT
        trigger: "POST /trap-placements/{id}/captures"
        actor: FieldTechnician
        preconditions:
          - "TrapPlacement.status == SET."
          - "WorkOrder.lifecycle == OPEN."
          - "release_distance_miles within [species.relocation_min_miles, species.relocation_max_miles] (calc relocation_distance)."
        side_effects:
          - "create CaptureEvent(disposition=RELOCATED); compute release_distance_miles."
          - "CASCADE L1: TrapPlacement.status -> SPENT."
          - "CASCADE L2 (caused by trap becoming SPENT): if no TrapPlacement on the WorkOrder remains SET, removal_status TRAPPING -> CLEARED; matching TRAP QuoteLineItem.performed -> true; technician.traps_deployed -= 1, traps_available += 1."
      - from: SET
        to: EMPTY
        trigger: "POST /trap-placements/{id}/pull"
        actor: FieldTechnician
        preconditions:
          - "TrapPlacement.status == SET."
          - "WorkOrder.lifecycle == OPEN."
        side_effects:
          - "TrapPlacement.status -> EMPTY; technician.traps_deployed -= 1, traps_available += 1."
          - "if no TrapPlacement on the WorkOrder remains SET and at least one trap was ever SET, removal_status -> CLEARED; matching TRAP QuoteLineItem.performed -> true."

  - entity: WarrantyClaim
    initial_state: FILED
    terminal_states: [ACCEPTED, REJECTED]
    transitions:
      - from: FILED
        to: ACCEPTED
        trigger: "POST /warranty-claims/{id}/adjudicate (within window)"
        actor: ComplianceOfficer
        preconditions:
          - "WarrantyClaim.status == FILED."
          - "WorkOrder.lifecycle == CLOSED."
          - "reported_at <= WorkOrder.closed warranty deadline (calc warranty_window, inclusive boundary)."
        side_effects:
          - "WarrantyClaim.status -> ACCEPTED."
      - from: FILED
        to: REJECTED
        trigger: "POST /warranty-claims/{id}/adjudicate (out of window)"
        actor: ComplianceOfficer
        preconditions:
          - "WarrantyClaim.status == FILED."
          - "reported_at > warranty deadline OR WorkOrder.lifecycle != CLOSED."
        side_effects:
          - "WarrantyClaim.status -> REJECTED."

# =============================================================================
# §1.2.1 Concurrency Rules
# =============================================================================
concurrency_rules:
  - rule_id: cancel-stale-work-order
    parent_entity: WorkOrder
    write_endpoint: "POST /work-orders/{id}/cancel"
    occ_field: "expected_work_order_version"
    description: |
      Cancelling a WorkOrder whose version has advanced since the client last
      observed it is rejected. A WorkOrder's version is silently bumped by trap
      SETs, capture relocations, and exclusion completions (each a §1.2 side
      effect). A cancel that still carries the stale version the client read
      before any of those mutations landed is rejected with a precondition
      failure, because the refund/restoration math the cancel performs would
      otherwise be computed against an out-of-date performed_subtotal.
    error_id: ERR_STALE_VERSION
    http_status: 412

# =============================================================================
# §1.3 Calculation Rules Table
# =============================================================================
calculations:
  - name: quote_provisional_total
    trigger: "Quote DRAFT->SENT (POST /quotes/{id}/send)"
    algorithm: aggregation
    formula: |
      # Forward-looking estimate over ALL line items.
      # ROUNDING ORDER IS PINNED: round each line to the cent FIRST, then sum.
      surcharge = 1 + (EMERGENCY_SURCHARGE_PCT if Quote.emergency_flag else 0)
      provisional = 0
      for li in QuoteLineItem where li.quote_id == Quote.id:        # ALL lines
          raw_line = li.quantity * li.unit_price_cents * surcharge
          line_rounded = round_half_up(raw_line)                    # to integer cents, per line
          provisional += line_rounded
      Quote.provisional_total_cents = provisional                   # sum of rounded lines
    input_set: "All QuoteLineItem rows whose quote_id == Quote.id, regardless of performed flag."
    constants:
      EMERGENCY_SURCHARGE_PCT: 0.15
    precision: "round_half_up to integer cents, applied PER LINE before summation (round-then-sum)."
    variants:
      - name: provisional
        when: "Quote is SENT; estimate of the whole proposed scope."
        difference: "Includes every line item; uses round-then-sum order."

  - name: quote_final_total
    trigger: "WorkOrder OPEN->CLOSED (system auto-close)"
    algorithm: chronological
    formula: |
      # Chronological actual: only line items whose work was performed.
      # SAME pinned rounding order: round each performed line to the cent, then sum.
      surcharge = 1 + (EMERGENCY_SURCHARGE_PCT if Quote.emergency_flag else 0)
      final = 0
      for li in QuoteLineItem where li.quote_id == Quote.id AND li.performed == true:
          raw_line = li.quantity * li.unit_price_cents * surcharge
          final += round_half_up(raw_line)
      Quote.final_total_cents = final
    input_set: "QuoteLineItem rows with performed == true only."
    constants:
      EMERGENCY_SURCHARGE_PCT: 0.15
    precision: "round_half_up to integer cents, applied PER LINE before summation (round-then-sum)."
    variants:
      - name: final
        when: "WorkOrder closes; actual billable work."
        difference: "Restricts the input set to performed==true line items (chronological completion order); diverges from provisional whenever any line went unperformed."

  - name: infestation_risk_score
    trigger: "WorkOrder created at quote accept (initial); WorkOrder OPEN->CLOSED (residual)."
    algorithm: weighted_scoring
    formula: |
      # >=3 inputs with non-linear interaction: per-entry-point weighted score with
      # a severity multiplier, a regulated-species bump, and a global cap.
      SEV = { MINOR: 1.0, MODERATE: 2.0, MAJOR: 3.5 }
      score = 0.0
      for ep in input_entry_points:                     # variant-dependent set
          sp = SpeciesProfile of ep.species_id
          base = ep.estimated_individuals * sp.risk_weight * SEV[ep.severity]
          if sp.is_regulated:
              base = base * REGULATED_MULTIPLIER
          score += base
      score = min(score, RISK_SCORE_CAP)                # non-linear cap
      result = round_half_up(score, 2)
    input_set: "Initial variant: all EntryPoints of the inspection. Residual variant: only EntryPoints with seal_status == OPEN."
    constants:
      REGULATED_MULTIPLIER: 1.5
      RISK_SCORE_CAP: 1000.0
    precision: "2 decimal places, round_half_up."
    variants:
      - name: initial
        when: "Computed at WorkOrder creation (quote accept)."
        difference: "Forward-looking — sums over ALL entry points of the inspection (none sealed yet)."
      - name: residual
        when: "Computed at WorkOrder close."
        difference: "Sums over only seal_status==OPEN entry points; diverges from initial by the contribution of every sealed entry point."

  - name: relocation_distance
    trigger: "POST /trap-placements/{id}/captures"
    algorithm: threshold
    formula: |
      # Great-circle (haversine) distance, property -> release site, in miles.
      d = haversine_miles(Property.latitude, Property.longitude,
                          release_latitude, release_longitude)
      release_distance_miles = round_half_up(d, 2)
      # Compliance band uses INCLUSIVE lower and upper bounds:
      compliant = (release_distance_miles >= sp.relocation_min_miles)
                  AND (release_distance_miles <= sp.relocation_max_miles)
      if not compliant: reject (ERR_RELOCATION_DISTANCE)
    input_set: "Single CaptureEvent against its TrapPlacement's species relocation band."
    constants:
      EARTH_RADIUS_MILES: 3958.8
    precision: "distance rounded to 2 decimals, round_half_up; comparison after rounding."
    variants:
      - name: standard
        when: "Every capture."
        difference: "Inclusive at both band edges (>= min AND <= max)."

  - name: warranty_window
    trigger: "POST /warranty-claims/{id}/adjudicate"
    algorithm: threshold
    formula: |
      # Warranty deadline measured from the WorkOrder close time.
      deadline = WorkOrder.updated_at_at_close + WARRANTY_DAYS days
      eligible = (WarrantyClaim.reported_at <= deadline)             # INCLUSIVE
      # The work order must have actually sealed something to qualify:
      qualified = (WorkOrder had >= 1 EXCLUSION line performed)
      accept iff eligible AND qualified
    input_set: "Single WorkOrder close timestamp and the claim's reported_at."
    constants:
      WARRANTY_DAYS: 30
    precision: "datetime comparison; deadline inclusive (reported_at == deadline accepts)."
    variants:
      - name: standard
        when: "Adjudication."
        difference: "Inclusive deadline boundary."

  - name: workorder_net_charge
    trigger: "WorkOrder cancel (compensation) and WorkOrder close (reconcile)"
    algorithm: waterfall_allocation
    formula: |
      # Conserved-money invariant. performed_subtotal is the round-then-sum of
      # performed lines (TRAP lines whose trap was SET, EXCLUSION lines whose
      # repair COMPLETED) plus SANITATION_FEE_CENTS per sanitation-included repair.
      surcharge = 1 + (EMERGENCY_SURCHARGE_PCT if Quote.emergency_flag else 0)
      performed_subtotal = 0
      for li in QuoteLineItem where li.performed == true:
          performed_subtotal += round_half_up(li.quantity * li.unit_price_cents * surcharge)
      performed_subtotal += SANITATION_FEE_CENTS * (count of COMPLETED ExclusionRepair with sanitation_included==true)
      # On cancel: refund the difference, leave net at performed_subtotal.
      refund = WorkOrder.net_charged_cents - performed_subtotal
      WorkOrder.net_charged_cents = performed_subtotal
      # INVARIANT: net_charged_cents + refund == provisional_total_cents (no money created/destroyed)
    input_set: "Performed QuoteLineItems and sanitation-included COMPLETED ExclusionRepairs of the WorkOrder."
    constants:
      EMERGENCY_SURCHARGE_PCT: 0.15
      SANITATION_FEE_CENTS: 7500
    precision: "round_half_up per line to integer cents; sanitation fee added as a flat integer."
    variants:
      - name: cancel_refund
        when: "WorkOrder OPEN->CANCELLED."
        difference: "Computes refund = net_charged_cents - performed_subtotal; net settles to performed_subtotal."
      - name: close_reconcile
        when: "WorkOrder OPEN->CLOSED."
        difference: "net_charged_cents reconciled to final_total_cents (== performed_subtotal at close)."

# =============================================================================
# §1.4 Validation Rules Table (ordered by priority)
# =============================================================================
validations:
  - priority: 1
    category: auth
    check: "X-User-Role and X-User-ID headers present and X-User-Role is a known role."
    error_id: ERR_UNAUTHENTICATED
    http_status: 401
    applies_to: "all"

  - priority: 2
    category: auth
    check: "Acting role is permitted for this endpoint per §1.7 RBAC."
    error_id: ERR_FORBIDDEN_ROLE
    http_status: 403
    applies_to: "all"

  - priority: 3
    category: existence
    check: "Every path/body referenced resource exists, validated left-to-right in the path then body FKs."
    error_id: ERR_NOT_FOUND
    http_status: 404
    applies_to: "all"

  - priority: 4
    category: state
    check: "Target resource is in a state from which the requested transition is defined (else invalid-from)."
    error_id: ERR_INVALID_STATE
    http_status: 409
    applies_to: "all transition endpoints"

  - priority: 5
    category: state
    check: "OCC: expected_work_order_version equals WorkOrder.version on POST /work-orders/{id}/cancel."
    error_id: ERR_STALE_VERSION
    http_status: 412
    applies_to: "POST /work-orders/{id}/cancel"

  - priority: 6
    category: business_safety
    check: "A trap for a regulated species may not be SET unless a Permit for that species on the WorkOrder is APPROVED (permit/regulated-species safety gate)."
    error_id: ERR_PERMIT_REQUIRED
    http_status: 409
    applies_to: "POST /work-orders/{id}/trap-placements"

  - priority: 7
    category: business_safety
    check: "A BASIC-tier technician may not be assigned to / set traps for a regulated species; requires CERTIFIED."
    error_id: ERR_TECH_NOT_CERTIFIED
    http_status: 409
    applies_to: "POST /work-orders/{id}/trap-placements"

  - priority: 8
    category: business_referential
    check: "Capture release_distance_miles must fall within the species relocation band [min, max] inclusive (humane relocation compliance)."
    error_id: ERR_RELOCATION_DISTANCE
    http_status: 422
    applies_to: "POST /trap-placements/{id}/captures"

  - priority: 9
    category: business_referential
    check: "An ExclusionRepair may only target an EntryPoint whose inspection_id matches the WorkOrder's quote's inspection_id, and whose seal_status == OPEN."
    error_id: ERR_ENTRY_POINT_MISMATCH
    http_status: 409
    applies_to: "POST /work-orders/{id}/exclusion-repairs"

  - priority: 10
    category: business_temporal
    check: "A trap's [window_start, window_end] (buffered by TRAP_VISIT_BUFFER_MINUTES) must not overlap another SET trap on the same technician (closed-interval + buffer)."
    error_id: ERR_TECH_WINDOW_CONFLICT
    http_status: 409
    applies_to: "POST /work-orders/{id}/trap-placements"

  - priority: 11
    category: business_temporal
    check: "A monitoring visit's [visit_start, visit_end) must not overlap another MonitoringVisit on the same property (half-open interval, no buffer)."
    error_id: ERR_VISIT_OVERLAP
    http_status: 409
    applies_to: "POST /work-orders/{id}/monitoring-visits"

  - priority: 12
    category: business_constraint
    check: "window_end strictly after window_start (trap) / visit_end strictly after visit_start (monitoring)."
    error_id: ERR_INVALID_WINDOW
    http_status: 422
    applies_to: "POST /work-orders/{id}/trap-placements, POST /work-orders/{id}/monitoring-visits"

  - priority: 13
    category: business_constraint
    check: "Cannot SEND a quote with zero line items; cannot mark removal CLEARED via pull when no trap was ever SET (empty-set guards)."
    error_id: ERR_EMPTY_SET
    http_status: 409
    applies_to: "POST /quotes/{id}/send, POST /trap-placements/{id}/pull"

  - priority: 14
    category: business_fiscal
    check: "A trap SET that would drive the assigned technician's traps_available below 0 is rejected (kit capacity)."
    error_id: ERR_KIT_EXHAUSTED
    http_status: 409
    applies_to: "POST /work-orders/{id}/trap-placements"

  - priority: 15
    category: business_constraint
    check: "Request body field types/enums/ranges valid (e.g. severity enum, non-negative quantities, lat/long ranges)."
    error_id: ERR_INVALID_REQUEST
    http_status: 422
    applies_to: "all writes"

