      - name: genealogy_lookup_empty_result_set
        claim_type: Listing
        grounds: [endpoints, errors]
        distinguishing_aspect: "GET /decedents?death_year=1899 with no matching records returns 200 with an empty array and total_count 0 (empty-set edge)."
        test_recipe:
          setup: ["One decedent who died in 2026 (won't match 1899)."]
          setup_api_calls:
            - { call: "POST /cemetery-mgmt/decedents", payload: { full_name: "Modern Person", date_of_death: "2026-01-02" }, as: Registrar }
