      - name: booking_with_out_of_order_event_dates_rejected
        claim_type: violation_to_error
        grounds:
          - validations[priority=36]
          - errors[ERR_INVALID_REQUEST]
        distinguishing_aspect: |
          The date chain move_in_start_date through move_out_end_date must be
          non-decreasing. Three separate breaks are probed: show_end before show_start,
          move_in after show_start, and move_out before show_end. Each is 400
          ERR_INVALID_REQUEST at priority 36, ahead of any window or blackout reasoning,
          so no negative billable_units figure can ever be computed.
        test_recipe:
          setup:
            - "the CONSUMER_SHOW window, Ballroom B and one client exist"
          setup_api_calls:
            - call: "POST /convention-center/policy-windows"
              payload: { event_class: "CONSUMER_SHOW", priority_rank: 3, open_months_before: 18, close_months_before: 2, max_holds_per_booking: 2, challenge_response_hours: 48, rental_discount_pct: 0.0, max_challenge_rounds: 1 }
              as: VenueAdmin
            - call: "POST /convention-center/spaces"
              payload: { name: "Ballroom B", space_class: "BALLROOM", rentable_sqft: 40000, daily_base_rate_cents: 1200000 }
