              captures: { line_eq: $.data.id }
            - call: "GET /power-rental/rental-contracts/${con_id}"
              payload: {}
              as: SalesEngineer
              captures: { con_v3: $.data.version }
            - call: "POST /power-rental/rental-contracts/${con_id}/lines"
