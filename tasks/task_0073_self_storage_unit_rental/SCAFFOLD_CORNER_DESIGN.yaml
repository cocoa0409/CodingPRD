# =============================================================================
# §1.9 Scaffold Corner Design (breadth probe)
# Self-Storage Unit Rental — Expert band. Enumerates testable claims in §1.1-§1.7
# not already covered by §1.8; excluded_because stubs cite the §1.8 instance.
# =============================================================================
scaffold_corner_design:

  # ===========================================================================
  - section: entities
    instances:
      - name: create_facility_returns_defaults_and_zero_count
        claim_type: Creation
        grounds:
          - "entities.Facility.fields.occupied_unit_count"
          - 'endpoints["POST /facilities"]'
        distinguishing_aspect: "POST /facilities with name+state_code only applies climate_premium_pct=0.20, lien_default_days=90, late_fee_grace_days=5, late_fee_cents=2000; occupied_unit_count==0, version==1."
        test_recipe:
          setup: ["Empty DB."]
          setup_api_calls: []
          trigger:
            - call: "POST /facilities"
              payload: { name: "FC", state_code: "CA" }
              as: FacilityManager
              captures: { fc: $.data.id }
          assert:
            - "response 201; Facility.climate_premium_pct == 0.20; lien_default_days == 90; late_fee_grace_days == 5; late_fee_cents == 2000"
            - "Facility.occupied_unit_count == 0; version == 1"

      - name: create_unit_defaults_climate_false_and_available
        claim_type: Defaults
        grounds:
          - "entities.Unit.fields.climate_controlled"
          - "entities.Unit.fields.status"
          - 'endpoints["POST /units"]'
        distinguishing_aspect: "POST /units omitting climate_controlled defaults it to false; status==AVAILABLE; current_lease_id==null."
        test_recipe:
          setup: ["Facility exists."]
          setup_api_calls:
            - call: "POST /facilities"
              payload: { name: "FU", state_code: "CA" }
              as: FacilityManager
              captures: { fc: $.data.id }
          trigger:
            - call: "POST /units"
              payload: { facility_id: "${fc}", unit_number: "Z-1", size_class: "SIZE_5X5", monthly_rate_cents: 5000 }
              as: FacilityManager
              captures: { u: $.data.id }
          assert:
            - "Unit.climate_controlled == false; Unit.status == AVAILABLE; Unit.current_lease_id == null"

      - name: get_lease_not_found_returns_404
        claim_type: Not Found
        grounds:
          - 'endpoints["GET /leases/{lease_id}"]'
          - "errors[ERR_NOT_FOUND]"
        distinguishing_aspect: "GET /leases/{random-uuid} returns ERR_NOT_FOUND (404) for a non-existent lease."
        test_recipe:
          setup: ["Empty DB."]
          setup_api_calls: []
          trigger:
            - call: "GET /leases/00000000-0000-4000-8000-000000000000"
              payload: {}
              as: FacilityManager
              captures: { err: $.data.error_id }
          assert:
            - "response 404; error_id == ERR_NOT_FOUND"

      - name: create_unit_missing_required_field_rejected
        claim_type: Required Fields
        grounds:
          - "entities.Unit.fields.monthly_rate_cents"
          - "errors[ERR_INVALID_REQUEST]"
          - 'endpoints["POST /units"]'
        distinguishing_aspect: "POST /units missing monthly_rate_cents (required, no default) returns ERR_INVALID_REQUEST (422)."
        test_recipe:
          setup: ["Facility exists."]
          setup_api_calls:
            - call: "POST /facilities"
              payload: { name: "FR", state_code: "CA" }
              as: FacilityManager
              captures: { fc: $.data.id }
          trigger:
            - call: "POST /units"
              payload: { facility_id: "${fc}", unit_number: "Z-2", size_class: "SIZE_5X5" }
              as: FacilityManager
              captures: { err: $.data.error_id }
          assert:
            - "response 422; error_id == ERR_INVALID_REQUEST"

      - name: create_lease_billing_day_out_of_range_rejected
        claim_type: Type Constraints
        grounds:
          - "entities.Lease.fields.billing_day"
          - "errors[ERR_INVALID_REQUEST]"
          - 'endpoints["POST /leases"]'
        distinguishing_aspect: "billing_day must be 1-28; billing_day=31 returns ERR_INVALID_REQUEST (422)."
        test_recipe:
          setup: ["Facility, unit, tenant exist."]
          setup_api_calls:
            - call: "POST /facilities"
              payload: { name: "FB", state_code: "CA" }
              as: FacilityManager
              captures: { fc: $.data.id }
            - call: "POST /units"
              payload: { facility_id: "${fc}", unit_number: "Z-3", size_class: "SIZE_5X5", monthly_rate_cents: 5000 }
              as: FacilityManager
              captures: { u: $.data.id }
            - call: "POST /tenants"
              payload: { email: "rb@x.com", full_name: "R B", state_code: "CA" }
              as: FacilityManager
              captures: { t: $.data.id }
          trigger:
            - call: "POST /leases"
              payload: { unit_id: "${u}", tenant_id: "${t}", start_date: "2026-04-01T00:00:00Z", billing_day: 31, insurance_required: false }
              as: FacilityManager
              captures: { err: $.data.error_id }
          assert:
            - "response 422; error_id == ERR_INVALID_REQUEST"

      - name: ledgerentry_immutable_no_version_field
        claim_type: Immutability
        grounds:
          - "entities.LedgerEntry"
          - 'endpoints["GET /ledger-entries"]'
        distinguishing_aspect: "LedgerEntry has common_fields:false; it is append-only with only id/created_at, no update endpoint and no version field."
        test_recipe:
          setup: ["Activated climate lease 2026-04-01 produces a CHARGE LedgerEntry."]
          setup_api_calls:
            - call: "POST /facilities"
              payload: { name: "FL", state_code: "CA", climate_premium_pct: 0.20 }
              as: FacilityManager
              captures: { fc: $.data.id }
            - call: "POST /units"
              payload: { facility_id: "${fc}", unit_number: "Z-4", size_class: "SIZE_10X10", monthly_rate_cents: 10000, climate_controlled: true }
              as: FacilityManager
              captures: { u: $.data.id }
            - call: "POST /tenants"
              payload: { email: "fl@x.com", full_name: "F L", state_code: "CA" }
              as: FacilityManager
              captures: { t: $.data.id }
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-04-01T00:00:00Z" }
              as: FacilityManager
            - call: "POST /leases"
              payload: { unit_id: "${u}", tenant_id: "${t}", start_date: "2026-04-01T00:00:00Z", billing_day: 1, insurance_required: false }
              as: FacilityManager
              captures: { lease_id: $.data.id }
            - call: "POST /leases/${lease_id}/activate"
              payload: {}
              as: FacilityManager
          trigger:
            - call: "GET /ledger-entries?lease_id=${lease_id}"
              payload: {}
              as: FacilityManager
              captures: { e0_type: "$.data[0].entry_type", e0_amt: "$.data[0].amount_cents" }
          assert:
            - "exactly one LedgerEntry with entry_type==CHARGE, amount_cents==12000; no version field present"

  # ===========================================================================
  - section: state_machines
    instances:
      - name: activate_lease_from_active_returns_invalid_state
        claim_type: invalid_transition
        grounds:
          - "state_machines.Lease.PENDING_to_ACTIVE"
          - "errors[ERR_INVALID_STATE]"
          - 'endpoints["POST /leases/{lease_id}/activate"]'
        distinguishing_aspect: "Activating an already-ACTIVE lease (not PENDING) returns ERR_INVALID_STATE (409); idempotency rejected on second activate."
        test_recipe:
          setup: ["Lease activated once already."]
          setup_api_calls:
            - call: "POST /facilities"
              payload: { name: "FS1", state_code: "CA", climate_premium_pct: 0.20 }
              as: FacilityManager
              captures: { fc: $.data.id }
            - call: "POST /units"
              payload: { facility_id: "${fc}", unit_number: "Z-5", size_class: "SIZE_10X10", monthly_rate_cents: 10000 }
              as: FacilityManager
              captures: { u: $.data.id }
            - call: "POST /tenants"
              payload: { email: "fs1@x.com", full_name: "F S1", state_code: "CA" }
              as: FacilityManager
              captures: { t: $.data.id }
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-04-01T00:00:00Z" }
              as: FacilityManager
            - call: "POST /leases"
              payload: { unit_id: "${u}", tenant_id: "${t}", start_date: "2026-04-01T00:00:00Z", billing_day: 1, insurance_required: false }
              as: FacilityManager
              captures: { lease_id: $.data.id }
            - call: "POST /leases/${lease_id}/activate"
              payload: {}
              as: FacilityManager
          trigger:
            - call: "POST /leases/${lease_id}/activate"
              payload: {}
              as: FacilityManager
              captures: { err: $.data.error_id }
          assert:
            - "response 409; error_id == ERR_INVALID_STATE; Lease.status remains ACTIVE"

      - name: file_lien_before_notice_window_returns_window_not_elapsed
        claim_type: Precondition Enforcement
        grounds:
          - "state_machines.AuctionProceeding.NOTICE_SENT_to_LIEN_FILED"
          - "errors[ERR_WINDOW_NOT_ELAPSED]"
          - 'endpoints["POST /auction-proceedings/{auction_id}/file-lien"]'
        distinguishing_aspect: "file-lien before notice_sent_date+14 days returns ERR_WINDOW_NOT_ELAPSED (409); proceeding stays NOTICE_SENT."
        test_recipe:
          setup: ["Auction opened (NOTICE_SENT) at clock 2026-06-30; file-lien attempted at 2026-07-05 (only 5 days, < 14)."]
          setup_api_calls:
            - call: "POST /facilities"
              payload: { name: "FS2", state_code: "CA", climate_premium_pct: 0.20, lien_default_days: 90, late_fee_grace_days: 5, late_fee_cents: 2000 }
              as: FacilityManager
              captures: { fc: $.data.id }
            - call: "POST /units"
              payload: { facility_id: "${fc}", unit_number: "Z-6", size_class: "SIZE_10X10", monthly_rate_cents: 10000, climate_controlled: true }
              as: FacilityManager
              captures: { u: $.data.id }
            - call: "POST /tenants"
              payload: { email: "fs2@x.com", full_name: "F S2", state_code: "CA" }
              as: FacilityManager
              captures: { t: $.data.id }
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-04-01T00:00:00Z" }
              as: FacilityManager
            - call: "POST /leases"
              payload: { unit_id: "${u}", tenant_id: "${t}", start_date: "2026-04-01T00:00:00Z", billing_day: 1, insurance_required: false }
              as: FacilityManager
              captures: { lease_id: $.data.id }
            - call: "POST /leases/${lease_id}/activate"
              payload: {}
              as: FacilityManager
              captures: { lease_v: $.data.version }
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-06-30T00:00:00Z" }
              as: FacilityManager
            - call: "POST /facilities/${fc}/billing-cycles"
              payload: {}
              as: FacilityManager
            - call: "POST /auction-proceedings"
              payload: { lease_id: "${lease_id}", expected_lease_version: "${lease_v}" }
              as: LienAdministrator
              captures: { auction_id: $.data.id }
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-07-05T00:00:00Z" }
              as: FacilityManager
          trigger:
            - call: "POST /auction-proceedings/${auction_id}/file-lien"
              payload: {}
              as: LienAdministrator
              captures: { err: $.data.error_id }
          assert:
            - "response 409; error_id == ERR_WINDOW_NOT_ELAPSED; AuctionProceeding.status remains NOTICE_SENT"

      - name: schedule_before_cooling_off_returns_window_not_elapsed
        claim_type: Precondition Enforcement
        grounds:
          - "state_machines.AuctionProceeding.LIEN_FILED_to_SCHEDULED"
          - "errors[ERR_WINDOW_NOT_ELAPSED]"
          - 'endpoints["POST /auction-proceedings/{auction_id}/schedule"]'
        distinguishing_aspect: "schedule with scheduled_sale_date < lien_filed_date+14 days returns ERR_WINDOW_NOT_ELAPSED (409)."
        test_recipe:
          setup: ["Auction lien filed at 2026-07-16; schedule attempted with sale date 2026-07-20 (4 days < 14)."]
          setup_api_calls:
            - call: "POST /facilities"
              payload: { name: "FS3", state_code: "CA", climate_premium_pct: 0.20, lien_default_days: 90, late_fee_grace_days: 5, late_fee_cents: 2000 }
              as: FacilityManager
              captures: { fc: $.data.id }
            - call: "POST /units"
              payload: { facility_id: "${fc}", unit_number: "Z-7", size_class: "SIZE_10X10", monthly_rate_cents: 10000, climate_controlled: true }
              as: FacilityManager
              captures: { u: $.data.id }
            - call: "POST /tenants"
              payload: { email: "fs3@x.com", full_name: "F S3", state_code: "CA" }
              as: FacilityManager
              captures: { t: $.data.id }
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-04-01T00:00:00Z" }
              as: FacilityManager
            - call: "POST /leases"
              payload: { unit_id: "${u}", tenant_id: "${t}", start_date: "2026-04-01T00:00:00Z", billing_day: 1, insurance_required: false }
              as: FacilityManager
              captures: { lease_id: $.data.id }
            - call: "POST /leases/${lease_id}/activate"
              payload: {}
              as: FacilityManager
              captures: { lease_v: $.data.version }
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-07-02T00:00:00Z" }
              as: FacilityManager
            - call: "POST /facilities/${fc}/billing-cycles"
              payload: {}
              as: FacilityManager
            - call: "POST /auction-proceedings"
              payload: { lease_id: "${lease_id}", expected_lease_version: "${lease_v}" }
              as: LienAdministrator
              captures: { auction_id: $.data.id }
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-07-16T00:00:00Z" }
              as: FacilityManager
            - call: "POST /auction-proceedings/${auction_id}/file-lien"
              payload: {}
              as: LienAdministrator
          trigger:
            - call: "POST /auction-proceedings/${auction_id}/schedule"
              payload: { scheduled_sale_date: "2026-07-20T00:00:00Z" }
              as: LienAdministrator
              captures: { err: $.data.error_id }
          assert:
            - "response 409; error_id == ERR_WINDOW_NOT_ELAPSED; AuctionProceeding.status remains LIEN_FILED"

      - name: terminal_lease_closed_cannot_transition
        claim_type: Terminal State Lockdown
        grounds:
          - "state_machines.Lease"
          - "errors[ERR_INVALID_STATE]"
          - 'endpoints["POST /leases/{lease_id}/close"]'
        distinguishing_aspect: "A CLOSED lease (terminal) rejects close again with ERR_INVALID_STATE (409)."
        test_recipe:
          setup: ["Lease activated then closed with zero balance (paid first invoice)."]
          setup_api_calls:
            - call: "POST /facilities"
              payload: { name: "FS4", state_code: "CA", climate_premium_pct: 0.20 }
              as: FacilityManager
              captures: { fc: $.data.id }
            - call: "POST /units"
              payload: { facility_id: "${fc}", unit_number: "Z-8", size_class: "SIZE_10X10", monthly_rate_cents: 10000, climate_controlled: true }
              as: FacilityManager
              captures: { u: $.data.id }
            - call: "POST /tenants"
              payload: { email: "fs4@x.com", full_name: "F S4", state_code: "CA" }
              as: FacilityManager
              captures: { t: $.data.id }
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-04-01T00:00:00Z" }
              as: FacilityManager
            - call: "POST /leases"
              payload: { unit_id: "${u}", tenant_id: "${t}", start_date: "2026-04-01T00:00:00Z", billing_day: 1, insurance_required: false }
              as: FacilityManager
              captures: { lease_id: $.data.id }
            - call: "POST /leases/${lease_id}/activate"
              payload: {}
              as: FacilityManager
            - call: "POST /payments"
              payload: { lease_id: "${lease_id}", amount_cents: 12000 }
              as: Tenant
              as_user_id: "${t}"
            - call: "POST /leases/${lease_id}/close"
              payload: {}
              as: FacilityManager
          trigger:
            - call: "POST /leases/${lease_id}/close"
              payload: {}
              as: FacilityManager
              captures: { err: $.data.error_id }
          assert:
            - "response 409; error_id == ERR_INVALID_STATE; Lease.status remains CLOSED"

      - name: waive_invoice_credits_remainder_and_reduces_balance
        claim_type: Side Effect Execution
        grounds:
          - "state_machines.Invoice.OPEN_to_WAIVED"
          - "entities.LedgerEntry.fields.entry_type"
          - 'endpoints["POST /invoices/{invoice_id}/waive"]'
        distinguishing_aspect: "Waiving an OPEN 12000 invoice appends a CREDIT LedgerEntry for 12000 and drops Lease.balance_cents to 0; invoice -> WAIVED."
        test_recipe:
          setup: ["Activated climate lease, first invoice 12000 unpaid (balance 12000)."]
          setup_api_calls:
            - call: "POST /facilities"
              payload: { name: "FS5", state_code: "CA", climate_premium_pct: 0.20 }
              as: FacilityManager
              captures: { fc: $.data.id }
            - call: "POST /units"
              payload: { facility_id: "${fc}", unit_number: "Z-9", size_class: "SIZE_10X10", monthly_rate_cents: 10000, climate_controlled: true }
              as: FacilityManager
              captures: { u: $.data.id }
            - call: "POST /tenants"
              payload: { email: "fs5@x.com", full_name: "F S5", state_code: "CA" }
              as: FacilityManager
              captures: { t: $.data.id }
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-04-01T00:00:00Z" }
              as: FacilityManager
            - call: "POST /leases"
              payload: { unit_id: "${u}", tenant_id: "${t}", start_date: "2026-04-01T00:00:00Z", billing_day: 1, insurance_required: false }
              as: FacilityManager
              captures: { lease_id: $.data.id }
            - call: "POST /leases/${lease_id}/activate"
              payload: {}
              as: FacilityManager
            - call: "GET /invoices?lease_id=${lease_id}"
              payload: {}
              as: FacilityManager
              captures: { inv0_id: "$.data[0].id" }
          trigger:
            - call: "POST /invoices/${inv0_id}/waive"
              payload: {}
              as: FacilityManager
              captures: { ist: $.data.status }
            - call: "GET /leases/${lease_id}"
              payload: {}
              as: FacilityManager
              captures: { bal: $.data.balance_cents }
          assert:
            - "Invoice.${inv0_id}.status == WAIVED"
            - "Lease.${lease_id}.balance_cents == 0; a CREDIT LedgerEntry of -12000 was appended"

      - name: insurance_lapse_and_reactivate_on_cure
        claim_type: cyclic
        grounds:
          - "state_machines.InsurancePolicy.ACTIVE_to_LAPSED"
          - "state_machines.InsurancePolicy.LAPSED_to_ACTIVE"
          - 'endpoints["POST /facilities/{facility_id}/billing-cycles"]'
        distinguishing_aspect: "An ACTIVE policy on an OVERDUE invoice -> LAPSED via billing-cycle, then -> ACTIVE again when the tenant cures balance to 0."
        test_recipe:
          setup: ["Lease with STANDARD policy ACTIVE; its premium invoice driven OVERDUE so the policy LAPSES."]
          setup_api_calls:
            - call: "POST /facilities"
              payload: { name: "FS6", state_code: "CA", climate_premium_pct: 0.20, late_fee_grace_days: 5, late_fee_cents: 2000 }
              as: FacilityManager
              captures: { fc: $.data.id }
            - call: "POST /units"
              payload: { facility_id: "${fc}", unit_number: "Z-10", size_class: "SIZE_10X10", monthly_rate_cents: 10000, climate_controlled: true }
              as: FacilityManager
              captures: { u: $.data.id }
            - call: "POST /tenants"
              payload: { email: "fs6@x.com", full_name: "F S6", state_code: "CA" }
              as: FacilityManager
              captures: { t: $.data.id }
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-04-01T00:00:00Z" }
              as: FacilityManager
            - call: "POST /leases"
              payload: { unit_id: "${u}", tenant_id: "${t}", start_date: "2026-04-01T00:00:00Z", billing_day: 1, insurance_required: true }
              as: FacilityManager
              captures: { lease_id: $.data.id }
            - call: "POST /insurance-policies"
              payload: { lease_id: "${lease_id}", coverage_tier: "STANDARD", coverage_start: "2026-04-01T00:00:00Z" }
              as: FacilityManager
              captures: { policy_id: $.data.id }
            - call: "POST /leases/${lease_id}/activate"
              payload: {}
              as: FacilityManager
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-04-20T00:00:00Z" }
              as: FacilityManager
            - call: "POST /facilities/${fc}/billing-cycles"
              payload: {}
              as: FacilityManager
            - call: "GET /insurance-policies/${policy_id}"
              payload: {}
              as: FacilityManager
              captures: { lapsed_st: $.data.status }
            - call: "GET /leases/${lease_id}"
              payload: {}
              as: FacilityManager
              captures: { bal_due: $.data.balance_cents }
          trigger:
            - call: "POST /payments"
              payload: { lease_id: "${lease_id}", amount_cents: 15500 }
              as: Tenant
              as_user_id: "${t}"
            - call: "GET /insurance-policies/${policy_id}"
              payload: {}
              as: FacilityManager
              captures: { st_after: $.data.status }
          assert:
            - "After billing-cycle InsurancePolicy.${policy_id}.status == LAPSED (premium invoice OVERDUE)"
            - "After full payment (13500 invoice + 2000 late = 15500) InsurancePolicy.${policy_id}.status == ACTIVE"

  # ===========================================================================
  - section: calculations
    instances:
      - name: insurance_premium_by_tier_lookup_correct
        claim_type: Constants Applied
        grounds:
          - "calculations.insurance_premium_by_tier"
          - "entities.InsurancePolicy.fields.monthly_premium_cents"
          - 'endpoints["POST /insurance-policies"]'
        distinguishing_aspect: "PREMIUM tier yields monthly_premium_cents==2500 and coverage_limit_cents==1500000 (input ignored for these computed fields)."
        test_recipe:
          setup: ["Lease exists (no insurance yet)."]
          setup_api_calls:
            - call: "POST /facilities"
              payload: { name: "FC1", state_code: "CA", climate_premium_pct: 0.20 }
              as: FacilityManager
              captures: { fc: $.data.id }
            - call: "POST /units"
              payload: { facility_id: "${fc}", unit_number: "Z-11", size_class: "SIZE_10X10", monthly_rate_cents: 10000 }
              as: FacilityManager
              captures: { u: $.data.id }
            - call: "POST /tenants"
              payload: { email: "fc1@x.com", full_name: "F C1", state_code: "CA" }
              as: FacilityManager
              captures: { t: $.data.id }
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-04-01T00:00:00Z" }
              as: FacilityManager
            - call: "POST /leases"
              payload: { unit_id: "${u}", tenant_id: "${t}", start_date: "2026-04-01T00:00:00Z", billing_day: 1, insurance_required: false }
              as: FacilityManager
              captures: { lease_id: $.data.id }
          trigger:
            - call: "POST /insurance-policies"
              payload: { lease_id: "${lease_id}", coverage_tier: "PREMIUM", coverage_start: "2026-04-01T00:00:00Z" }
              as: FacilityManager
              captures: { prem: $.data.monthly_premium_cents, lim: $.data.coverage_limit_cents }
          assert:
            - "InsurancePolicy.monthly_premium_cents == 2500; coverage_limit_cents == 1500000; status == ACTIVE"

      - name: payment_waterfall_oldest_due_first_allocation
        claim_type: Correct Result
        grounds:
          - "calculations.payment_waterfall_allocation"
          - "entities.Payment.fields.allocation"
