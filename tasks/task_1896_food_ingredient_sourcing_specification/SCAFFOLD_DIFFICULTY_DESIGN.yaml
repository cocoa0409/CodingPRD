              as: SupplierQualityEngineer
              as_user_id: sqe-1
              captures: { coa2: $.data.id }
            - call: "POST /sourcing/approved-sources/${src_id}/coas/${coa2}/start-review"
              payload: {}
              as: QualityManager
              as_user_id: qm-1
            - call: "POST /sourcing/approved-sources/${src_id}/coas/${coa2}/close-review"
              payload: { outcome: "ACCEPT" }
              as: QualityManager
              as_user_id: qm-1
            - call: "POST /sourcing/approved-sources/${src_id}/coas"
              payload: { contract_id: "${ctr_id}", lot_number: "P3", shipped_qty_kg: 26000, received_at: "2026-07-04T00:00:00Z", measured_values: [ { parameter_name: "moisture", observed_value: 5 } ] }
              as: SupplierQualityEngineer
              as_user_id: sqe-1
              captures: { coa3: $.data.id }
            - call: "POST /sourcing/approved-sources/${src_id}/coas/${coa3}/start-review"
              payload: {}
