          trigger:
            - call: "POST /licenses/${lk_id}/submit"
              payload: {}
              as: Owner
              as_user_id: "${ok_id}"
              captures: { err: $.data.error_id }
          assert:
            - "response.status == 422"
            - "response.data.error_id == ERR_LICENSE_KIND_MISMATCH"
            - "Kennel.${kk_id}.status == SUSPENDED"

  # ===========================================================================
  - rule_id: resource_temporal_overlap
    instances:
      - name: pet_license_period_half_open_overlap_rejected
        grounds:
          - validations[priority=10]
          - state_machines.License.APPROVED_to_ACTIVE
          - errors[ERR_LICENSE_PERIOD_OVERLAP]
          - entities.License.fields.issued_on
          - entities.License.fields.expires_on
        distinguishing_aspect: |
          Interval semantics = half-open time intervals on a Pet: a pet already holds an ACTIVE license
          with validity [2026-01-01, 2027-01-01); issuing a SECOND license at 2026-06-01 (interval
          [2026-06-01, 2027-06-01)) overlaps and is rejected ERR_LICENSE_PERIOD_OVERLAP; the geometry
          is temporal interval intersection, distinct from the Kennel aggregate-capacity overlap below.
        test_recipe:
          setup:
            - "Owner OL pet PL holds ACTIVE INDIVIDUAL license LL1 issued 2026-01-01 term 1yr (expires 2027-01-01)"
            - "A second INDIVIDUAL license LL2 for the same pet is APPROVED, clock at 2026-06-01 so its issuance interval would overlap LL1"
          setup_api_calls:
            - call: "POST /_clock/set"
              payload: { to_iso8601: "2026-01-01T00:00:00Z" }
              as: LicensingClerk
            - call: "POST /owners"
              payload: { full_name: "Owner L", email: "ol@x.com", address_zip: "13001" }
              as: LicensingClerk
              captures: { ol_id: $.data.id }
            - call: "POST /pets"
