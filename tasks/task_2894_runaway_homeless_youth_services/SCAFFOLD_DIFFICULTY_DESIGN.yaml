            - call: "POST /ryhs/guardian-notifications/${lena_gn_id}/attempt"
              payload: { attempt_channel: "PHONE" }
              as: ShelterCaseManager
              as_user_id: "cm-1"
            - call: "GET /ryhs/youths/${lena_id}"
              payload: {}
              as: ReunificationSpecialist
              as_user_id: "rs-1"
              captures: { lena_v: $.data.version }
            - call: "POST /ryhs/reunification-cases"
              payload: { youth_id: "${lena_id}", guardian_household_label: "Ortiz household - mother", expected_youth_version: "${lena_v}" }
              as: ReunificationSpecialist
              as_user_id: "rs-1"
              captures: { lena_case_id: $.data.id }
            - call: "POST /ryhs/reunification-cases/${lena_case_id}/mediation-sessions"
              payload: { scheduled_start_at: "2026-08-03T14:00:00Z", scheduled_end_at: "2026-08-03T15:00:00Z" }
              as: ReunificationSpecialist
