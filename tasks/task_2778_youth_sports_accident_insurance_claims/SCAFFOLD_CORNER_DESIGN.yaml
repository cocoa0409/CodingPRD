          - entities.SanctionedActivity.fields.ends_at
        distinguishing_aspect: "The covered-activity window is CLOSED and unbuffered for injury eligibility: an injury at exactly ends_at is covered, one minute later is not. The travel buffer that widens the participant-conflict window deliberately does not widen this window, so a server that reuses the buffered interval here wrongly accepts 20:01."
