# =============================================================================
# §1.9 Scaffold Corner Design — Bird & Aviary Supply (Expert)
# Breadth probe over §1.1-§1.7 claims not already covered by §1.8.
# =============================================================================
scaffold_corner_design:

  # ---------------------------------------------------------------- entities
  - section: entities
    instances:
      - name: customer_create_returns_defaults
        claim_type: Creation
        grounds: [entities.Customer.fields.wallet_credit_cents, entities.Customer.fields.club_tier, entities.Customer.fields.status]
        distinguishing_aspect: "POST /customers returns 201 with club_tier=NONE, wallet_credit_cents=0, status=ACTIVE and system id/version=1."
        test_recipe:
          setup: ["Empty DB."]
          setup_api_calls: []
          trigger:
            - call: "POST /customers"
              payload: { full_name: "Def Ault", email: "def@x.com" }
              as: StoreManager
              captures: { cust_id: $.data.id, v: $.data.version }
          assert:
            - "response code 201; Customer.${cust_id}.club_tier == NONE"
            - "Customer.${cust_id}.wallet_credit_cents == 0"
            - "Customer.${cust_id}.status == ACTIVE and version == 1"

      - name: customer_get_nonexistent_returns_not_found
        claim_type: Not Found
        grounds:
          - errors[ERR_CUSTOMER_NOT_FOUND]
        distinguishing_aspect: "GET /customers/{id} for an unknown UUID returns ERR_CUSTOMER_NOT_FOUND (404)."
        test_recipe:
          setup: ["Empty DB."]
          setup_api_calls: []
          trigger:
            - call: "GET /customers/00000000-0000-0000-0000-000000000000"
              payload: {}
              as: StoreManager
              captures: { err: $.data.error_id }
          assert:
            - "response data.error_id == ERR_CUSTOMER_NOT_FOUND (404)"

      - name: species_permit_required_computed_from_appendix
        claim_type: Computed Fields
        grounds: [entities.Species.fields.permit_required, entities.Species.fields.cites_appendix]
        distinguishing_aspect: "Creating a Species with cites_appendix I sets permit_required=true (computed, input ignored)."
        test_recipe:
          setup: ["Empty DB."]
          setup_api_calls: []
          trigger:
            - call: "POST /species"
              payload: { common_name: "Hyacinth Macaw", scientific_name: "Anodorhynchus hyacinthinus", cites_appendix: "I" }
              as: ComplianceOfficer
              captures: { sp_id: $.data.id, pr: $.data.permit_required }
          assert:
            - "Species.${sp_id}.permit_required == true"
            - "Species.${sp_id}.status == ACTIVE and listed_bird_count == 0"

      - name: inventory_create_missing_required_sku
        claim_type: Required Fields
        grounds:
          - errors[ERR_INVALID_REQUEST]
          - entities.InventoryItem.fields.sku
        distinguishing_aspect: "POST /inventory-items omitting the required sku field returns ERR_INVALID_REQUEST (400)."
        test_recipe:
          setup: ["Empty DB."]
          setup_api_calls: []
          trigger:
            - call: "POST /inventory-items"
              payload: { feed_kind: "DRY", quantity_on_hand: 5 }
              as: StoreManager
              captures: { err: $.data.error_id }
          assert:
            - "response data.error_id == ERR_INVALID_REQUEST (400)"

  # ---------------------------------------------------------- state_machines
  - section: state_machines
    instances:
      - name: cancel_already_cancelled_reservation_invalid_state
        claim_type: Invalid Transitions
        grounds:
          - state_machines.BoardingReservation.RESERVED_to_CANCELLED
          - errors[ERR_INVALID_STATE]
        distinguishing_aspect: "Cancelling a reservation already in CANCELLED returns ERR_INVALID_STATE (terminal lockdown)."
        test_recipe:
          setup: ["A BOARDING cage and a RESERVED reservation that is then cancelled; clock 07-01."]
          setup_api_calls:
            - call: "POST /customers"
              payload: { full_name: "Term Ted", email: "term@x.com" }
              as: StoreManager
              captures: { cust_id: $.data.id }
            - call: "POST /cage-units"
              payload: { label: "B5", cage_class: "BOARDING", capacity: 1, nightly_rate_cents: 3000 }
              as: StoreManager
              captures: { cage_id: $.data.id }
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-07-01T00:00:00Z" }
              as: StoreManager
            - call: "POST /boarding-reservations"
              payload: { customer_id: "${cust_id}", cage_id: "${cage_id}", planned_check_in: "2026-07-03T00:00:00Z", planned_check_out: "2026-07-05T00:00:00Z" }
              as: Customer
              as_user_id: "${cust_id}"
              captures: { res_id: $.data.id }
            - call: "POST /boarding-reservations/${res_id}/cancel"
              payload: {}
              as: Customer
              as_user_id: "${cust_id}"
          trigger:
            - call: "POST /boarding-reservations/${res_id}/cancel"
              payload: {}
              as: Customer
              as_user_id: "${cust_id}"
              captures: { err: $.data.error_id }
          assert:
            - "response data.error_id == ERR_INVALID_STATE"
            - "BoardingReservation.${res_id}.status == CANCELLED (unchanged)"

      - name: deliver_unpaid_order_rejected
        claim_type: Precondition Enforcement
        grounds:
          - state_machines.SpecialOrder.BUILT_to_DELIVERED
          - errors[ERR_ORDER_NOT_PAID]
        distinguishing_aspect: "deliver on a BUILT but UNPAID order returns ERR_ORDER_NOT_PAID (cross-axis guard)."
        test_recipe:
          setup: ["SpecialOrder built to BUILT but never paid; DRY inventory 5 on hand."]
          setup_api_calls:
            - call: "POST /customers"
              payload: { full_name: "Del Dan", email: "del@x.com" }
              as: StoreManager
              captures: { cust_id: $.data.id }
            - call: "POST /inventory-items"
              payload: { sku: "KIT-5", feed_kind: "DRY", quantity_on_hand: 5 }
              as: StoreManager
              captures: { inv_id: $.data.id }
            - call: "POST /special-orders"
              payload: { customer_id: "${cust_id}", cage_item_id: "${inv_id}", build_qty: 1, line_items: [ { unit_price_cents: 1000, quantity: 1, tax_rate: 0.0 } ] }
              as: Customer
              as_user_id: "${cust_id}"
              captures: { ord_id: $.data.id }
            - call: "POST /special-orders/${ord_id}/start-build"
              payload: {}
              as: StoreManager
            - call: "POST /special-orders/${ord_id}/mark-built"
              payload: {}
              as: StoreManager
          trigger:
            - call: "POST /special-orders/${ord_id}/deliver"
              payload: {}
              as: StoreManager
              captures: { err: $.data.error_id }
          assert:
            - "response data.error_id == ERR_ORDER_NOT_PAID"
            - "SpecialOrder.${ord_id}.build_status == BUILT (unchanged)"

      - name: pay_already_paid_order_rejected
        claim_type: Idempotency
        grounds:
          - state_machines.SpecialOrder.UNPAID_to_PAID
          - errors[ERR_ORDER_ALREADY_PAID]
        distinguishing_aspect: "Second pay on an already-PAID order returns ERR_ORDER_ALREADY_PAID; wallet debited only once."
        test_recipe:
          setup: ["Customer with 5000 wallet; SpecialOrder invoice 1000 already PAID."]
          setup_api_calls:
            - call: "POST /customers"
              payload: { full_name: "Pay Pam", email: "pay@x.com" }
              as: StoreManager
              captures: { cust_id: $.data.id }
            - call: "POST /customers/${cust_id}/wallet/adjustments"
              payload: { amount_cents: 5000 }
              as: StoreManager
            - call: "POST /inventory-items"
              payload: { sku: "KIT-6", feed_kind: "DRY", quantity_on_hand: 5 }
              as: StoreManager
              captures: { inv_id: $.data.id }
            - call: "POST /special-orders"
              payload: { customer_id: "${cust_id}", cage_item_id: "${inv_id}", build_qty: 1, line_items: [ { unit_price_cents: 1000, quantity: 1, tax_rate: 0.0 } ] }
              as: Customer
              as_user_id: "${cust_id}"
              captures: { ord_id: $.data.id }
            - call: "POST /special-orders/${ord_id}/pay"
              payload: {}
              as: Customer
              as_user_id: "${cust_id}"
          trigger:
            - call: "POST /special-orders/${ord_id}/pay"
              payload: {}
              as: Customer
              as_user_id: "${cust_id}"
              captures: { err: $.data.error_id }
          assert:
            - "response data.error_id == ERR_ORDER_ALREADY_PAID"
            - "Customer.${cust_id}.wallet_credit_cents == 4000 (debited once)"

      - name: clear_before_min_days_rejected
        claim_type: Precondition Enforcement
        grounds:
          - state_machines.QuarantineRecord.OPEN_to_CLEARED
          - errors[ERR_QUARANTINE_TOO_EARLY]
        distinguishing_aspect: "clear before clock reaches min_clear_at returns ERR_QUARANTINE_TOO_EARLY (risk not the blocker: species NONE)."
        test_recipe:
          setup: ["Bird (species NONE) IN_QUARANTINE opened at 07-01 (min_clear_at 07-15); clock still 07-01."]
          setup_api_calls:
            - call: "POST /species"
              payload: { common_name: "Canary", scientific_name: "Serinus canaria", cites_appendix: "NONE" }
              as: ComplianceOfficer
              captures: { sp_id: $.data.id }
            - call: "POST /cage-units"
              payload: { label: "H7", cage_class: "HOUSING", capacity: 1 }
              as: StoreManager
              captures: { cage_id: $.data.id }
            - call: "POST /birds"
              payload: { species_id: "${sp_id}", band_code: "B-008", list_price_cents: 4000 }
              as: AviaryStaff
              captures: { bird_id: $.data.id }
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-07-01T00:00:00Z" }
              as: StoreManager
            - call: "POST /birds/${bird_id}/start-quarantine"
              payload: { cage_id: "${cage_id}" }
              as: AviaryStaff
            - call: "GET /birds/${bird_id}/quarantine-records"
              payload: {}
              as: AviaryStaff
              captures: { qr_id: "$.data[0].id" }
          trigger:
            - call: "POST /quarantine-records/${qr_id}/clear"
              payload: {}
              as: AviaryStaff
              captures: { err: $.data.error_id }
          assert:
            - "response data.error_id == ERR_QUARANTINE_TOO_EARLY"
            - "QuarantineRecord.${qr_id}.status == OPEN (unchanged)"

      - name: permit_approve_with_expired_valid_until_rejected
        claim_type: Precondition Enforcement
        grounds:
          - state_machines.CitesPermit.SUBMITTED_to_APPROVED
          - errors[ERR_PERMIT_EXPIRED_INPUT]
        distinguishing_aspect: "Approving a SUBMITTED permit whose valid_until (2026-06-01) is before the clock (default 07-01) returns ERR_PERMIT_EXPIRED_INPUT."
        test_recipe:
          setup: ["Species and a SUBMITTED permit with valid_until 2026-06-01; clock at startup default 2026-07-01."]
          setup_api_calls:
            - call: "POST /species"
              payload: { common_name: "Lovebird", scientific_name: "Agapornis roseicollis", cites_appendix: "III" }
              as: ComplianceOfficer
              captures: { sp_id: $.data.id }
            - call: "POST /cites-permits"
              payload: { species_id: "${sp_id}", permit_number: "CITES-400", valid_until: "2026-06-01T00:00:00Z" }
              as: ComplianceOfficer
              captures: { perm_id: $.data.id }
            - call: "POST /cites-permits/${perm_id}/submit"
              payload: {}
              as: ComplianceOfficer
          trigger:
            - call: "POST /cites-permits/${perm_id}/approve"
              payload: {}
              as: ComplianceOfficer
              captures: { err: $.data.error_id }
          assert:
            - "response data.error_id == ERR_PERMIT_EXPIRED_INPUT (400)"
            - "CitesPermit.${perm_id}.status == SUBMITTED (unchanged)"

      - name: record_test_result_requires_under_test
        claim_type: Invalid Transitions
        grounds:
          - state_machines.QuarantineRecord.OPEN_to_UNDER_TEST
          - errors[ERR_QUARANTINE_NOT_OPEN]
        distinguishing_aspect: "record-test-result on an OPEN (not UNDER_TEST) record returns ERR_QUARANTINE_NOT_OPEN."
        test_recipe:
          setup: ["Bird IN_QUARANTINE with an OPEN record (no start-test yet); clock 07-01."]
          setup_api_calls:
            - call: "POST /species"
              payload: { common_name: "Parakeet", scientific_name: "Psittacula krameri", cites_appendix: "NONE" }
              as: ComplianceOfficer
              captures: { sp_id: $.data.id }
            - call: "POST /cage-units"
              payload: { label: "H8", cage_class: "HOUSING", capacity: 1 }
              as: StoreManager
              captures: { cage_id: $.data.id }
            - call: "POST /birds"
              payload: { species_id: "${sp_id}", band_code: "B-009", list_price_cents: 5000 }
              as: AviaryStaff
              captures: { bird_id: $.data.id }
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-07-01T00:00:00Z" }
              as: StoreManager
            - call: "POST /birds/${bird_id}/start-quarantine"
              payload: { cage_id: "${cage_id}" }
              as: AviaryStaff
            - call: "GET /birds/${bird_id}/quarantine-records"
              payload: {}
              as: AviaryStaff
              captures: { qr_id: "$.data[0].id" }
          trigger:
            - call: "POST /quarantine-records/${qr_id}/record-test-result"
              payload: { result: "FAIL" }
              as: AviaryStaff
              captures: { err: $.data.error_id }
          assert:
            - "response data.error_id == ERR_QUARANTINE_NOT_OPEN"
            - "QuarantineRecord.${qr_id}.status == OPEN and failed_test_count == 0"

  # ------------------------------------------------------------- calculations
  - section: calculations
    instances:
      - name: subscription_standard_no_club_discount
        claim_type: Correct Result
        grounds: [calculations.subscription_monthly_charge]
        distinguishing_aspect: "STANDARD tier, 1 bird, no fresh, NONE club: 4000 + 1500 = 5500 (no discount)."
        test_recipe:
          setup: ["NONE-club Customer with 6000 wallet."]
          setup_api_calls:
            - call: "POST /customers"
              payload: { full_name: "Std Sue", email: "std@x.com" }
              as: StoreManager
              captures: { cust_id: $.data.id }
            - call: "POST /customers/${cust_id}/wallet/adjustments"
              payload: { amount_cents: 6000 }
              as: StoreManager
          trigger:
            - call: "POST /feed-subscriptions"
              payload: { customer_id: "${cust_id}", tier: "STANDARD", bird_count: 1 }
              as: Customer
              as_user_id: "${cust_id}"
              captures: { sub_id: $.data.id }
          assert:
            - "FeedSubscription.${sub_id}.monthly_charge_cents == 5500"
            - "Customer.${cust_id}.wallet_credit_cents == 500"

      - name: boarding_provisional_min_one_night
        claim_type: Correct Result
        grounds: [calculations.boarding_cost, entities.BoardingReservation.fields.provisional_cost_cents]
        distinguishing_aspect: "A sub-24h planned window (07-03T00:00 -> 07-03T06:00) ceils to 1 night: provisional == nightly_rate 3000."
        test_recipe:
          setup: ["BOARDING cage nightly 3000; clock 07-01."]
          setup_api_calls:
            - call: "POST /customers"
              payload: { full_name: "One Night", email: "one@x.com" }
              as: StoreManager
              captures: { cust_id: $.data.id }
            - call: "POST /cage-units"
              payload: { label: "B6", cage_class: "BOARDING", capacity: 1, nightly_rate_cents: 3000 }
              as: StoreManager
              captures: { cage_id: $.data.id }
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-07-01T00:00:00Z" }
              as: StoreManager
          trigger:
            - call: "POST /boarding-reservations"
              payload: { customer_id: "${cust_id}", cage_id: "${cage_id}", planned_check_in: "2026-07-03T00:00:00Z", planned_check_out: "2026-07-03T06:00:00Z" }
              as: Customer
              as_user_id: "${cust_id}"
              captures: { res_id: $.data.id }
          assert:
            - "BoardingReservation.${res_id}.provisional_cost_cents == 3000"

  # -------------------------------------------------------------- validations
  - section: validations
    instances:
      - name: customer_context_header_required
        claim_type: Violation → Error
        grounds:
          - validations[priority=1]
          - errors[ERR_MISSING_USER_CONTEXT]
        distinguishing_aspect: "A request issued with no X-User-Role / X-User-ID header returns ERR_MISSING_USER_CONTEXT (400) before any other check."
        test_recipe:
          setup: ["Empty DB; the trigger call is sent WITHOUT authentication headers."]
          setup_api_calls: []
          trigger:
            - call: "GET /customers"
              payload: {}
              as: StoreManager
              captures: { err: $.data.error_id }
          assert:
            - "When headers are omitted, response data.error_id == ERR_MISSING_USER_CONTEXT (400)"

      - name: customer_cannot_create_species_forbidden
        claim_type: Priority Ordering
        grounds:
          - validations[priority=2]
          - errors[ERR_FORBIDDEN_ROLE]
        distinguishing_aspect: "A Customer calling POST /species (a ComplianceOfficer-only op) returns ERR_FORBIDDEN_ROLE (403)."
        test_recipe:
          setup: ["Empty DB."]
          setup_api_calls: []
          trigger:
            - call: "POST /species"
              payload: { common_name: "Cockatiel", scientific_name: "Nymphicus hollandicus", cites_appendix: "NONE" }
              as: Customer
              as_user_id: "unused"
              captures: { err: $.data.error_id }
          assert:
            - "response data.error_id == ERR_FORBIDDEN_ROLE (403)"

      - name: pause_others_subscription_not_owner
        claim_type: Cross-entity validation
        grounds:
          - validations[priority=3]
          - errors[ERR_NOT_RESOURCE_OWNER]
        distinguishing_aspect: "Customer B pausing Customer A's subscription returns ERR_NOT_RESOURCE_OWNER (403)."
        test_recipe:
          setup: ["Customer A with an ACTIVE STANDARD subscription; Customer B distinct."]
          setup_api_calls:
            - call: "POST /customers"
              payload: { full_name: "Owner A", email: "a@x.com" }
              as: StoreManager
              captures: { a_id: $.data.id }
            - call: "POST /customers/${a_id}/wallet/adjustments"
              payload: { amount_cents: 6000 }
              as: StoreManager
            - call: "POST /feed-subscriptions"
              payload: { customer_id: "${a_id}", tier: "STANDARD", bird_count: 1 }
              as: Customer
              as_user_id: "${a_id}"
              captures: { sub_id: $.data.id }
            - call: "POST /customers"
              payload: { full_name: "Other B", email: "b@x.com" }
              as: StoreManager
              captures: { b_id: $.data.id }
          trigger:
            - call: "POST /feed-subscriptions/${sub_id}/pause"
              payload: {}
              as: Customer
              as_user_id: "${b_id}"
              captures: { err: $.data.error_id }
          assert:
            - "response data.error_id == ERR_NOT_RESOURCE_OWNER (403)"
            - "FeedSubscription.${sub_id}.status == ACTIVE (unchanged)"

      - name: grooming_service_not_offered_rejected
        claim_type: Conditional validation
        grounds:
          - validations[priority=12]
          - errors[ERR_SERVICE_NOT_OFFERED]
        distinguishing_aspect: "Booking NAIL_TRIM at a station whose service_types is [WING_TRIM] returns ERR_SERVICE_NOT_OFFERED."
        test_recipe:
          setup: ["GroomingStation offering only WING_TRIM."]
          setup_api_calls:
            - call: "POST /customers"
              payload: { full_name: "Nail Ned", email: "nail@x.com" }
              as: StoreManager
              captures: { cust_id: $.data.id }
            - call: "POST /grooming-stations"
              payload: { label: "G2", service_types: [ "WING_TRIM" ] }
              as: StoreManager
              captures: { st_id: $.data.id }
          trigger:
            - call: "POST /grooming-appointments"
              payload: { customer_id: "${cust_id}", grooming_station_id: "${st_id}", service_type: "NAIL_TRIM", slot_start: "2026-07-10T09:00:00Z", slot_end: "2026-07-10T09:30:00Z", fee_cents: 1200 }
              as: Customer
              as_user_id: "${cust_id}"
              captures: { err: $.data.error_id }
          assert:
            - "response data.error_id == ERR_SERVICE_NOT_OFFERED"

      - name: suspended_customer_cannot_open_subscription
        claim_type: Cross-entity validation
        grounds:
          - validations[priority=15]
          - errors[ERR_CUSTOMER_SUSPENDED]
          - entities.Customer.fields.status
        distinguishing_aspect: "A SUSPENDED customer opening a subscription returns ERR_CUSTOMER_SUSPENDED (409)."
        test_recipe:
          setup: ["Customer suspended via POST /customers/{id}/suspend."]
          setup_api_calls:
            - call: "POST /customers"
              payload: { full_name: "Sus Sam", email: "sus@x.com" }
              as: StoreManager
              captures: { cust_id: $.data.id }
            - call: "POST /customers/${cust_id}/wallet/adjustments"
              payload: { amount_cents: 6000 }
              as: StoreManager
            - call: "POST /customers/${cust_id}/suspend"
              payload: {}
              as: StoreManager
          trigger:
            - call: "POST /feed-subscriptions"
              payload: { customer_id: "${cust_id}", tier: "STANDARD", bird_count: 1 }
              as: Customer
              as_user_id: "${cust_id}"
              captures: { err: $.data.error_id }
          assert:
            - "response data.error_id == ERR_CUSTOMER_SUSPENDED"

      - name: pay_insufficient_wallet_rejected
        claim_type: Violation → Error
        grounds:
          - validations[priority=14]
          - errors[ERR_INSUFFICIENT_WALLET]
        distinguishing_aspect: "pay on an order invoice 1000 with 0 wallet returns ERR_INSUFFICIENT_WALLET (402); no debit."
        test_recipe:
          setup: ["Customer 0 wallet; UNPAID order invoice_total 1000."]
          setup_api_calls:
            - call: "POST /customers"
              payload: { full_name: "Broke Bo", email: "broke@x.com" }
              as: StoreManager
              captures: { cust_id: $.data.id }
            - call: "POST /inventory-items"
              payload: { sku: "KIT-7", feed_kind: "DRY", quantity_on_hand: 5 }
              as: StoreManager
              captures: { inv_id: $.data.id }
            - call: "POST /special-orders"
              payload: { customer_id: "${cust_id}", cage_item_id: "${inv_id}", build_qty: 1, line_items: [ { unit_price_cents: 1000, quantity: 1, tax_rate: 0.0 } ] }
              as: Customer
              as_user_id: "${cust_id}"
              captures: { ord_id: $.data.id }
          trigger:
            - call: "POST /special-orders/${ord_id}/pay"
              payload: {}
              as: Customer
              as_user_id: "${cust_id}"
              captures: { err: $.data.error_id }
          assert:
            - "response data.error_id == ERR_INSUFFICIENT_WALLET (402)"
            - "Customer.${cust_id}.wallet_credit_cents == 0 and SpecialOrder.${ord_id}.payment_status == UNPAID"

  # ---------------------------------------------------------------- endpoints
  - section: endpoints
    instances:
      - name: feed_subscriptions_reverse_reachability_by_customer
        claim_type: Computed read
        grounds: [entities.FeedSubscription.fields.customer_id]
        distinguishing_aspect: "GET /feed-subscriptions?customer_id returns the customer's subscriptions (FK reverse-reachability)."
        test_recipe:
          setup: ["Customer with one ACTIVE STANDARD subscription."]
          setup_api_calls:
            - call: "POST /customers"
              payload: { full_name: "List Liz", email: "list@x.com" }
              as: StoreManager
              captures: { cust_id: $.data.id }
            - call: "POST /customers/${cust_id}/wallet/adjustments"
              payload: { amount_cents: 6000 }
              as: StoreManager
            - call: "POST /feed-subscriptions"
              payload: { customer_id: "${cust_id}", tier: "STANDARD", bird_count: 1 }
              as: Customer
              as_user_id: "${cust_id}"
              captures: { sub_id: $.data.id }
          trigger:
            - call: "GET /feed-subscriptions?customer_id=${cust_id}"
              payload: {}
              as: StoreManager
              captures: { first_id: "$.data[0].id" }
          assert:
            - "response is an array; the first element's id == ${sub_id}"

      - name: birds_filtered_by_species
        claim_type: Computed read
        grounds: [entities.Bird.fields.species_id]
        distinguishing_aspect: "GET /birds?species_id returns only birds of that species (FK reverse-reachability)."
        test_recipe:
          setup: ["Species with one registered Bird."]
          setup_api_calls:
            - call: "POST /species"
              payload: { common_name: "Eclectus", scientific_name: "Eclectus roratus", cites_appendix: "NONE" }
              as: ComplianceOfficer
              captures: { sp_id: $.data.id }
            - call: "POST /birds"
              payload: { species_id: "${sp_id}", band_code: "B-010", list_price_cents: 7000 }
              as: AviaryStaff
              captures: { bird_id: $.data.id }
          trigger:
            - call: "GET /birds?species_id=${sp_id}"
              payload: {}
              as: AviaryStaff
              captures: { first_id: "$.data[0].id" }
          assert:
            - "response is an array containing Bird ${bird_id}"

  # ---------------------------------------------------------------------- rbac
  - section: roles
    instances:
      - name: compliance_cannot_create_cage_unit
        claim_type: Cannot perform other roles' ops
        grounds:
          - roles.StoreManager
          - errors[ERR_FORBIDDEN_ROLE]
        distinguishing_aspect: "ComplianceOfficer calling POST /cage-units (StoreManager-only) returns ERR_FORBIDDEN_ROLE."
        test_recipe:
          setup: ["Empty DB."]
          setup_api_calls: []
          trigger:
            - call: "POST /cage-units"
              payload: { label: "X", cage_class: "HOUSING", capacity: 1 }
              as: ComplianceOfficer
              captures: { err: $.data.error_id }
          assert:
            - "response data.error_id == ERR_FORBIDDEN_ROLE (403)"

  # -------------------------------------------------- cross-cutting (OCC)
  - section: cross_cutting_complexity_layers
    instances:
      - name: cage_update_stale_version_conflict
        claim_type: optimistic_concurrency
        grounds:
          - concurrency_rules[cage-config-update-stale]
          - errors[ERR_STALE_CAGE_VERSION]
        distinguishing_aspect: "A PATCH /cage-units/{id} carrying a stale expected_cage_version (the pre-update value, after one successful update already bumped it) returns ERR_STALE_CAGE_VERSION (412)."
        test_recipe:
          setup: ["A BOARDING cage; one successful PATCH already advanced its version from 1 to 2."]
          setup_api_calls:
            - call: "POST /cage-units"
              payload: { label: "B7", cage_class: "BOARDING", capacity: 1, nightly_rate_cents: 3000 }
              as: StoreManager
              captures: { cage_id: $.data.id, cage_v1: $.data.version }
            - call: "PATCH /cage-units/${cage_id}"
              payload: { expected_cage_version: "${cage_v1}", nightly_rate_cents: 4000 }
              as: StoreManager
              captures: { cage_v2: $.data.version }
          trigger:
            - call: "PATCH /cage-units/${cage_id}"
              payload: { expected_cage_version: "${cage_v1}", nightly_rate_cents: 5000 }
              as: StoreManager
              captures: { err: $.data.error_id }
          assert:
            - "response data.error_id == ERR_STALE_CAGE_VERSION (412)"
            - "CageUnit.${cage_id}.nightly_rate_cents == 4000 (stale write rejected)"

      - name: cage_update_correct_version_succeeds
        claim_type: optimistic_concurrency
        grounds:
          - concurrency_rules[cage-config-update-stale]
          - entities.CageUnit.fields.version
        distinguishing_aspect: "A PATCH /cage-units/{id} carrying the current expected_cage_version succeeds and increments version by 1."
        test_recipe:
          setup: ["A freshly created HOUSING cage at version 1."]
          setup_api_calls:
            - call: "POST /cage-units"
              payload: { label: "H9", cage_class: "HOUSING", capacity: 2 }
              as: StoreManager
              captures: { cage_id: $.data.id, cage_v1: $.data.version }
          trigger:
            - call: "PATCH /cage-units/${cage_id}"
              payload: { expected_cage_version: "${cage_v1}", capacity: 3 }
              as: StoreManager
              captures: { cage_v2: $.data.version }
          assert:
            - "CageUnit.${cage_id}.capacity == 3"
            - "CageUnit.${cage_id}.version == 2 (incremented from 1)"

  # --------------------------------------------------------- consistency model
  - section: consistency_model
    instances:
      - name: subscription_creation_immediate_visibility
        claim_type: immediate
        grounds: [entities.FeedSubscription.fields.monthly_charge_cents, entities.Customer.fields.wallet_credit_cents]
        distinguishing_aspect: "The wallet debit from subscription creation is visible immediately in the same creation response and on a follow-up GET."
        test_recipe:
          setup: ["Customer with 6000 wallet."]
          setup_api_calls:
            - call: "POST /customers"
              payload: { full_name: "Imm Ida", email: "imm@x.com" }
              as: StoreManager
              captures: { cust_id: $.data.id }
            - call: "POST /customers/${cust_id}/wallet/adjustments"
              payload: { amount_cents: 6000 }
              as: StoreManager
            - call: "POST /feed-subscriptions"
              payload: { customer_id: "${cust_id}", tier: "STANDARD", bird_count: 1 }
              as: Customer
              as_user_id: "${cust_id}"
              captures: { sub_id: $.data.id }
          trigger:
            - call: "GET /customers/${cust_id}"
              payload: {}
              as: StoreManager
              captures: { bal: $.data.wallet_credit_cents }
          assert:
            - "Customer.${cust_id}.wallet_credit_cents == 500 immediately after creation (6000 - 5500)"

