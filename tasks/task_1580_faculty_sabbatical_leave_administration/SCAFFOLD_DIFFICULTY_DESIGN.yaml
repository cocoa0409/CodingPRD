        distinguishing_aspect: |
          Entity pair = LeaveApplication -> LeaveCycle: the application's DRAFT->UNDER_REVIEW
          transition is gated on the CYCLE's state (must be OPEN). While the cycle is DRAFT the
          submit fails with ERR_CYCLE_NOT_OPEN; after open, the identical submit succeeds.
