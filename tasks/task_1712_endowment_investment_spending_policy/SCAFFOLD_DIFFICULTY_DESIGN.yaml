            - { call: "POST /endowment/valuations", payload: { pool_id: "${pc_pool}", estimated_pool_market_value_cents: 10000000 }, as: InvestmentOfficer, captures: { pc_v1: $.data.id } }
            - { call: "GET /endowment/pools/${pc_pool}", as: InvestmentOfficer, captures: { pc_pv1: $.data.version } }
            - { call: "POST /endowment/valuations/${pc_v1}/finalize", payload: { final_pool_market_value_cents: 10000000, expected_pool_version: "${pc_pv1}" }, as: InvestmentOfficer }
            - { call: "POST /endowment/manager-quarter-reports", payload: { manager_id: "${pc_mgr}", quarter_index: 2, beginning_mv_cents: 10000000, ending_mv_cents: 4000000, flows: [], benchmark_return_bps: 0 }, as: InvestmentOfficer }
