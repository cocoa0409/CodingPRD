              as: Registrar
            - call: "POST /cohorts"
              payload: { name: "PM-X", level: "B1", track: "GENERAL", capacity: 5, weekly_hours: 9, term_start: "2026-05-04T00:00:00Z", term_end: "2026-08-01T00:00:00Z", total_sessions: 40, base_tuition_cents: 100000, schedule_block: "EVENING" }
              as: Registrar
              captures: { cohort2: $.data.id, cohort2_v: $.data.version }
            - call: "POST /enrollments"
              payload: { student_id: "${stu_id}", cohort_id: "${cohort2}" }
              as: Registrar
              captures: { enr2: $.data.id }
          trigger:
            - call: "POST /enrollments/${enr2}/confirm"
              payload: { expected_cohort_version: "${cohort2_v}", require_seat: true }
              as: Registrar
              captures: { st2: $.data.status }
          assert:
            - "Enrollment.${enr2}.status == ENROLLED   # different schedule_block => no conflict despite overlapping term"

  # =================================================================
  # Rule 9 — Compensating-action invariants across different conserved quantities
  # =================================================================
  - rule_id: compensating_invariant
    instances:
      - name: cohort_seat_conservation_enroll_then_withdraw
        grounds:
          - state_machines.Enrollment.PLACEMENT_PENDING_to_ENROLLED
          - state_machines.Enrollment.ENROLLED_to_WITHDRAWN
          - entities.Cohort.fields.seats_taken
          - entities.Cohort.fields.capacity
        distinguishing_aspect: "Conserved quantity = cohort free seats: INVARIANT (Cohort.seats_taken + free_seats == Cohort.capacity) holds; confirm consumes a seat and the compensating withdraw releases it, leaving seats_taken back at its pre-enroll value 0 with no drift."
        test_recipe:
          setup:
            - "Capacity-3 B1/GENERAL cohort, seats_taken 0; one student is confirmed ENROLLED then withdrawn."
          setup_api_calls:
            - call: "POST /cohorts"
              payload: { name: "B1-Inv", level: "B1", track: "GENERAL", capacity: 3, weekly_hours: 18, term_start: "2026-05-04T00:00:00Z", term_end: "2026-08-01T00:00:00Z", total_sessions: 40, base_tuition_cents: 100000, schedule_block: "MORNING" }
              as: Registrar
              captures: { cohort_id: $.data.id, cohort_v: $.data.version }
            - call: "POST /students"
              payload: { full_name: "S Inv", email: "sinv@x.com", track: "GENERAL" }
              as: Registrar
              captures: { stu_id: $.data.id }
            - call: "POST /placement-tests"
              payload: { student_id: "${stu_id}" }
              as: Registrar
              captures: { pt_id: $.data.id }
            - call: "POST /placement-tests/${pt_id}/score"
              payload: { raw_score: 50 }
              as: Instructor
            - call: "POST /enrollments"
              payload: { student_id: "${stu_id}", cohort_id: "${cohort_id}" }
              as: Registrar
              captures: { enr_id: $.data.id }
            - call: "POST /enrollments/${enr_id}/confirm"
              payload: { expected_cohort_version: "${cohort_v}", require_seat: true }
              as: Registrar
          trigger:
            - call: "POST /enrollments/${enr_id}/withdraw"
              payload: {}
              as: Registrar
            - call: "GET /cohorts/${cohort_id}"
              payload: {}
              as: Registrar
              captures: { seats: $.data.seats_taken, cap: $.data.capacity }
          assert:
            - "Cohort.${cohort_id}.seats_taken == 0   # released, no drift"
            - "Cohort.${cohort_id}.capacity == 3   # capacity unchanged; seats_taken + free == capacity invariant holds"

      - name: contract_seat_conservation_enroll_then_terminate
        grounds:
          - state_machines.Enrollment.PLACEMENT_PENDING_to_ENROLLED
          - state_machines.Enrollment.ENROLLED_to_TERMINATED
          - entities.CorporateContract.fields.seats_consumed
          - entities.CorporateContract.fields.contracted_seats
        distinguishing_aspect: "DIFFERENT conserved quantity = contract sponsored seats: INVARIANT (CorporateContract.seats_consumed + remaining == contracted_seats) holds; a sponsored confirm draws a contract seat and the compensating terminate releases it, returning seats_consumed to 0 with no drift — distinct quantity from cohort seats."
        test_recipe:
          setup:
            - "2-seat BRONZE contract, seats_consumed 0; one sponsored student confirmed ENROLLED then DSO-terminated (ATTENDANCE_FAILURE)."
          setup_api_calls:
            - call: "POST /corporate-contracts"
              payload: { company_name: "Inv2", contracted_seats: 2, discount_tier: "BRONZE" }
              as: Registrar
              captures: { contract_id: $.data.id }
            - call: "POST /students"
              payload: { full_name: "S CInv", email: "scinv@x.com", track: "GENERAL", corporate_contract_id: "${contract_id}" }
              as: Registrar
              captures: { stu_id: $.data.id }
            - call: "POST /placement-tests"
              payload: { student_id: "${stu_id}" }
              as: Registrar
              captures: { pt_id: $.data.id }
            - call: "POST /placement-tests/${pt_id}/score"
              payload: { raw_score: 50 }
              as: Instructor
            - call: "POST /cohorts"
              payload: { name: "B1-CInv", level: "B1", track: "GENERAL", capacity: 5, weekly_hours: 18, term_start: "2026-05-04T00:00:00Z", term_end: "2026-08-01T00:00:00Z", total_sessions: 40, base_tuition_cents: 100000, schedule_block: "MORNING" }
              as: Registrar
              captures: { cohort_id: $.data.id, cohort_v: $.data.version }
            - call: "POST /enrollments"
              payload: { student_id: "${stu_id}", cohort_id: "${cohort_id}" }
              as: Registrar
              captures: { enr_id: $.data.id }
            - call: "POST /enrollments/${enr_id}/confirm"
              payload: { expected_cohort_version: "${cohort_v}", require_seat: true }
              as: Registrar
          trigger:
            - call: "POST /enrollments/${enr_id}/terminate"
              payload: { termination_reason: "ATTENDANCE_FAILURE" }
              as: DSO
            - call: "GET /corporate-contracts/${contract_id}"
              payload: {}
              as: Registrar
              captures: { consumed: $.data.seats_consumed, total: $.data.contracted_seats }
          assert:
            - "CorporateContract.${contract_id}.seats_consumed == 0   # released, no drift"
            - "CorporateContract.${contract_id}.contracted_seats == 2   # seats_consumed + remaining == contracted_seats invariant holds"
            - "Enrollment.${enr_id}.refund_cents == 0   # termination yields no refund"
