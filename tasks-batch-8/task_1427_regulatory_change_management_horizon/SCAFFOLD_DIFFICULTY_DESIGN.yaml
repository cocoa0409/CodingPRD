  - rule_id: non_linear_state_machine
    instances:
      - name: nsm_change_retriage_cycle
        grounds:
          - state_machines.RegulatoryChange.PENDING_TRIAGE_to_TRIAGED_NOT_APPLICABLE
          - state_machines.RegulatoryChange.TRIAGED_NOT_APPLICABLE_to_PENDING_TRIAGE
          - entities.RegulatoryChange.fields.triage_round
        distinguishing_aspect: |
          Cyclic machine on RegulatoryChange: PENDING_TRIAGE -> TRIAGED_NOT_APPLICABLE ->
          PENDING_TRIAGE -> TRIAGED_APPLICABLE loops with triage_round accumulating (2),
          unlike the parallel-dimensions shape of nsm_plan_parallel_dimensions.
        test_recipe:
          setup:
            - "One ingested change in PENDING_TRIAGE (created by officer-a)"
          setup_api_calls:
            - call: "POST /compliance/regulatory-changes"
              payload: { citation: "RT-1", title: "Ambiguous bulletin", summary: "s", feed_source: "STATE_BULLETIN", jurisdiction: "US-NY", regulator: "NYDFS", published_at: "2026-07-10T00:00:00Z", effective_date: "2026-11-01T00:00:00Z", severity_hint: "LOW" }
              as: ComplianceOfficer
              as_user_id: "officer-a"
              captures: { ch_id: $.data.id }
            - call: "POST /compliance/regulatory-changes/${ch_id}/triage"
              payload: { verdict: "NOT_APPLICABLE", rationale: "No NY footprint" }
              as: ComplianceOfficer
              as_user_id: "officer-b"
              captures: { st1: $.data.status, round1: $.data.triage_round }
            - call: "POST /compliance/regulatory-changes/${ch_id}/retriage"
              payload: { rationale: "Legal flagged for re-review" }
              as: ComplianceOfficer
              as_user_id: "officer-b"
              captures: { st2: $.data.status }
          trigger:
            - call: "POST /compliance/regulatory-changes/${ch_id}/triage"
              payload: { verdict: "APPLICABLE", rationale: "Applies after revised interpretation" }
              as: ComplianceOfficer
              as_user_id: "officer-b"
              captures: { st3: $.data.status, round3: $.data.triage_round, app3: $.data.applicability }
          assert:
            - "After first triage: status == TRIAGED_NOT_APPLICABLE, triage_round == 1"
            - "After retriage: status == PENDING_TRIAGE, applicability == UNDETERMINED"
            - "After second triage: status == TRIAGED_APPLICABLE, triage_round == 2 (cycle accumulates rounds, not resets)"

      - name: nsm_plan_parallel_dimensions
        grounds:
          - state_machines.ImplementationPlan.ON_TRACK_to_AT_RISK
          - state_machines.ImplementationPlan.AT_RISK_to_OVERDUE
          - state_machines.ImplementationPlan.OVERDUE_to_AT_RISK
          - calculations.deadline_posture
        distinguishing_aspect: |
          Parallel state dimensions on ImplementationPlan (different entity and different
          non-linear shape from nsm_change_retriage_cycle): execution_status advances
          DRAFT -> SUBMITTED -> APPROVED -> IN_EXECUTION while deadline_posture
          independently walks ON_TRACK -> AT_RISK -> OVERDUE -> AT_RISK via clock moves and
          one extension; the axes never block each other.
        test_recipe:
          setup:
            - "Full pipeline: TRIAGED_APPLICABLE change with ACTIVE CRITICAL obligation, ACCEPTED assessment, CONFIRMED gap"
            - "Plan targeting 2026-08-16 (CRITICAL mandate boundary) approved and in execution at clock 2026-08-01"
