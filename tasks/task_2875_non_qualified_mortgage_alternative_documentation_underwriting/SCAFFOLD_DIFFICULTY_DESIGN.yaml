              as: LoanOfficer
              captures: { bor_rb_id: "$.data.id" }
            - call: "POST /loan-files"
              payload: { borrower_id: "${bor_rb_id}", program_id: "${prog_rb_id}", investor_code: "INV-ATLAS", loan_amount_cents: 40000000, property_value_cents: 55000000, occupancy: "INVESTMENT", purpose: "RATE_TERM_REFI", lien_position: "FIRST", note_rate_pct: 9.250, apor_pct: 6.100, term_months: 360, amortization_type: "INTEREST_ONLY", monthly_taxes_cents: 60000, monthly_insurance_cents: 18000, monthly_hoa_cents: 15000, gross_market_rent_cents: 420000, lease_rent_cents: 480000 }
              as: LoanOfficer
              captures: { lf_rb_id: "$.data.id" }
            - call: "POST /loan-files/${lf_rb_id}/doc-type-selection"
              payload: { doc_type: "DSCR" }
              as: Underwriter
              as_user_id: "uw-16"
            - call: "POST /loan-files/${lf_rb_id}/submit-to-underwriting"
              payload: {}
              as: LoanOfficer
            - call: "POST /valuation-orders"
              payload: { loan_file_id: "${lf_rb_id}", valuation_type: "PRIMARY_APPRAISAL", vendor_code: "VND-ALPHA", effective_date: "2026-07-01T00:00:00Z" }
              as: AppraisalReviewer
              captures: { vo_rb_1_id: "$.data.id" }
          trigger:
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-07-31T00:00:00Z" }
              as: AppraisalReviewer
            - call: "POST /valuation-orders"
              payload: { loan_file_id: "${lf_rb_id}", valuation_type: "PRIMARY_APPRAISAL", vendor_code: "VND-GAMMA", effective_date: "2026-07-31T00:00:00Z" }
              as: AppraisalReviewer
            - call: "POST /valuation-orders"
              payload: { loan_file_id: "${lf_rb_id}", valuation_type: "DESK_REVIEW", vendor_code: "VND-DESK", effective_date: "2026-07-31T00:00:00Z" }
              as: AppraisalReviewer
              captures: { vo_rb_2_id: "$.data.id" }
            - call: "POST /valuation-orders/${vo_rb_2_id}/receive"
              payload: { appraised_value_cents: 54000000 }
              as: AppraisalReviewer
            - call: "POST /valuation-orders/${vo_rb_2_id}/decision"
              payload: { decision: "REJECTED", rejection_reason: "Unsupported adjustments" }
              as: AppraisalReviewer
            - call: "POST /valuation-orders"
              payload: { loan_file_id: "${lf_rb_id}", valuation_type: "DESK_REVIEW", vendor_code: "VND-DESK2", effective_date: "2026-07-31T00:00:00Z" }
              as: AppraisalReviewer
              captures: { vo_rb_3_id: "$.data.id" }
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-08-01T00:00:00Z" }
              as: AppraisalReviewer
            - call: "POST /valuation-orders"
              payload: { loan_file_id: "${lf_rb_id}", valuation_type: "PRIMARY_APPRAISAL", vendor_code: "VND-GAMMA", effective_date: "2026-08-01T00:00:00Z" }
              as: AppraisalReviewer
              captures: { vo_rb_4_id: "$.data.id" }
          assert:
            - "setup order: ValuationOrder.${vo_rb_1_id}.validity_expires_date == 2026-10-29T00:00:00Z (effective_date plus exactly 120 days)"
            - "trigger call 2 -> 422 ERR_VALUATION_REORDER_TOO_SOON: the clock is 2026-07-31, exactly 30 whole days after the 2026-07-01 effective_date, and the buffer is a closed interval so day 30 is still inside it"
            - "trigger call 3 -> 201: the buffer is scoped per valuation_type, so a DESK_REVIEW is unaffected by the PRIMARY_APPRAISAL buffer"
            - "trigger call 5 -> 200, ValuationOrder.${vo_rb_2_id}.status == REJECTED; a rejected desk review publishes no value, so the AppraisalReview keeps primary_review_status PRIMARY_NOT_ORDERED (the setup PRIMARY order was never received) and reconciled_value_cents null"
            - "trigger call 6 -> 201 on the same clock day as call 3: a REJECTED order vacates its type's slot immediately, so the 30-day buffer does not apply to it"
            - "trigger call 8 -> 201: the clock is 2026-08-01, day 31 after the 2026-07-01 effective_date, one day outside the closed buffer; ValuationOrder.${vo_rb_4_id}.validity_expires_date == 2026-11-29T00:00:00Z"
            - "the loan file ends with four ValuationOrder rows: two PRIMARY_APPRAISAL (one ORDERED from setup, one ORDERED from call 8) and two DESK_REVIEW (one REJECTED, one ORDERED)"

  - rule_id: compensating_invariant
    instances:
      - name: pool_balance_and_weighted_coupon_restored_exactly_after_removal
        grounds:
          - calculations.pool_metrics_recompute
          - entities.SecuritizationPool.fields.aggregate_scheduled_balance_cents
          - entities.SecuritizationPool.fields.weighted_avg_coupon_pct
          - endpoints.POST_securitization_pools_id_removals
          - concurrency_rules.expected_pool_version
        distinguishing_aspect: |
          Conserved quantities: the pool's aggregate_scheduled_balance_cents and its 4-decimal
          weighted_avg_coupon_pct. Assigning a second loan moves the WAC from 8.7500 to 8.9500;
          removing that loan must restore 8.7500 to the last decimal place, which is only true
          if the implementation recomputes the WAC from the surviving member set instead of
          unwinding an incremental delta.
        test_recipe:
          setup:
            - "A DSCR program, an OPEN pool PL-2026A with target_balance_cents 200000000, and two CLOSED investment loans."
            - "Loan A: 60000000 cents at note_rate_pct 8.750, interest-only, 80000000-cent property (LTV 75.00)."
            - "Loan B: 40000000 cents at note_rate_pct 9.250, interest-only, 55000000-cent property (LTV 72.73)."
            - "Neither loan requires a second valuation (the program's LTV trigger is 90.00 and its loan-amount trigger is 150000000)."
          setup_api_calls:
            - call: "POST /documentation-programs"
              payload: { program_code: "DSCR", name: "Investor DSCR", min_dscr: 1.1000, max_ltv_pct: 85.00, min_fico: 660, min_reserves_months: 6, min_residual_income_cents: 0, second_valuation_ltv_threshold_pct: 90.00, second_valuation_loan_amount_threshold_cents: 150000000, atr_exempt_flag: true, seasoning_matrix: { FORECLOSURE: 36, SHORT_SALE: 24, DEED_IN_LIEU: 24, BK_CH7: 24, BK_CH13: 12, MODIFICATION: 12, MORTGAGE_LATE_60: 12 } }
              as: ProgramAdmin
              captures: { prog_ci_id: "$.data.id" }
            - call: "POST /borrowers"
              payload: { legal_name: "Quarry Bend Estates LLC", fico_score: 748, self_employed_flag: false, entity_ownership_pct: 100.0, monthly_debt_obligations_cents: 0, verified_liquid_assets_cents: 5000000, age_years: 57 }
              as: LoanOfficer
              captures: { bor_ci_id: "$.data.id" }
            - call: "POST /securitization-pools"
              payload: { pool_code: "PL-2026A", investor_code: "INV-ATLAS", target_balance_cents: 200000000 }
              as: SecuritizationAnalyst
              captures: { pool_ci_id: "$.data.id", pool_ci_v0: "$.data.version" }
            - call: "POST /loan-files"
              payload: { borrower_id: "${bor_ci_id}", program_id: "${prog_ci_id}", investor_code: "INV-ATLAS", loan_amount_cents: 60000000, purchase_price_cents: 80000000, property_value_cents: 80000000, occupancy: "INVESTMENT", purpose: "PURCHASE", lien_position: "FIRST", note_rate_pct: 8.750, apor_pct: 6.100, term_months: 360, amortization_type: "INTEREST_ONLY", monthly_taxes_cents: 60000, monthly_insurance_cents: 20000, monthly_hoa_cents: 0, gross_market_rent_cents: 620000, lease_rent_cents: 640000 }
              as: LoanOfficer
              captures: { lf_ci_a_id: "$.data.id" }
            - call: "POST /loan-files/${lf_ci_a_id}/doc-type-selection"
              payload: { doc_type: "DSCR" }
              as: Underwriter
              as_user_id: "uw-17"
            - call: "POST /loan-files/${lf_ci_a_id}/submit-to-underwriting"
              payload: {}
              as: LoanOfficer
            - call: "POST /valuation-orders"
              payload: { loan_file_id: "${lf_ci_a_id}", valuation_type: "PRIMARY_APPRAISAL", vendor_code: "VND-ALPHA", effective_date: "2026-05-01T00:00:00Z" }
              as: AppraisalReviewer
              captures: { vo_ci_a_id: "$.data.id" }
            - call: "POST /valuation-orders/${vo_ci_a_id}/receive"
              payload: { appraised_value_cents: 80000000 }
              as: AppraisalReviewer
            - call: "POST /valuation-orders/${vo_ci_a_id}/decision"
              payload: { decision: "ACCEPTED" }
              as: AppraisalReviewer
            - call: "POST /loan-files/${lf_ci_a_id}/points-and-fees-test"
              payload: {}
              as: Underwriter
              as_user_id: "uw-17"
            - call: "POST /loan-files/${lf_ci_a_id}/atr-determination"
              payload: {}
              as: Underwriter
              as_user_id: "uw-17"
            - call: "POST /loan-files/${lf_ci_a_id}/approve"
              payload: {}
              as: Underwriter
              as_user_id: "uw-17"
            - call: "POST /loan-files/${lf_ci_a_id}/close"
              payload: {}
              as: LoanOfficer
            - call: "POST /loan-files"
              payload: { borrower_id: "${bor_ci_id}", program_id: "${prog_ci_id}", investor_code: "INV-ATLAS", loan_amount_cents: 40000000, property_value_cents: 55000000, occupancy: "INVESTMENT", purpose: "RATE_TERM_REFI", lien_position: "FIRST", note_rate_pct: 9.250, apor_pct: 6.100, term_months: 360, amortization_type: "INTEREST_ONLY", monthly_taxes_cents: 60000, monthly_insurance_cents: 18000, monthly_hoa_cents: 15000, gross_market_rent_cents: 420000, lease_rent_cents: 480000 }
              as: LoanOfficer
              captures: { lf_ci_b_id: "$.data.id" }
            - call: "POST /loan-files/${lf_ci_b_id}/doc-type-selection"
              payload: { doc_type: "DSCR" }
              as: Underwriter
              as_user_id: "uw-18"
            - call: "POST /loan-files/${lf_ci_b_id}/submit-to-underwriting"
              payload: {}
              as: LoanOfficer
            - call: "POST /valuation-orders"
              payload: { loan_file_id: "${lf_ci_b_id}", valuation_type: "PRIMARY_APPRAISAL", vendor_code: "VND-ALPHA", effective_date: "2026-05-01T00:00:00Z" }
              as: AppraisalReviewer
              captures: { vo_ci_b_id: "$.data.id" }
            - call: "POST /valuation-orders/${vo_ci_b_id}/receive"
              payload: { appraised_value_cents: 55000000 }
              as: AppraisalReviewer
            - call: "POST /valuation-orders/${vo_ci_b_id}/decision"
              payload: { decision: "ACCEPTED" }
              as: AppraisalReviewer
            - call: "POST /loan-files/${lf_ci_b_id}/points-and-fees-test"
              payload: {}
              as: Underwriter
              as_user_id: "uw-18"
            - call: "POST /loan-files/${lf_ci_b_id}/atr-determination"
              payload: {}
              as: Underwriter
              as_user_id: "uw-18"
            - call: "POST /loan-files/${lf_ci_b_id}/approve"
              payload: {}
              as: Underwriter
              as_user_id: "uw-18"
            - call: "POST /loan-files/${lf_ci_b_id}/close"
              payload: {}
              as: LoanOfficer
          trigger:
            - call: "POST /securitization-pools/${pool_ci_id}/loans"
              payload: { loan_file_id: "${lf_ci_a_id}", expected_pool_version: "${pool_ci_v0}" }
              as: SecuritizationAnalyst
              captures: { pool_ci_v1: "$.data.version" }
            - call: "POST /securitization-pools/${pool_ci_id}/loans"
              payload: { loan_file_id: "${lf_ci_b_id}", expected_pool_version: "${pool_ci_v1}" }
              as: SecuritizationAnalyst
              captures: { pool_ci_v2: "$.data.version" }
            - call: "POST /securitization-pools/${pool_ci_id}/removals"
              payload: { removal_reason: "LOAN_INELIGIBLE", loan_file_id: "${lf_ci_b_id}", expected_pool_version: "${pool_ci_v2}" }
              as: SecuritizationAnalyst
          assert:
            - "after trigger call 1: aggregate_scheduled_balance_cents == 60000000, weighted_avg_coupon_pct == 8.7500, member_loan_count == 1"
            - "after trigger call 2: aggregate_scheduled_balance_cents == 100000000, weighted_avg_coupon_pct == 8.9500, member_loan_count == 2"
            - "after trigger call 3: aggregate_scheduled_balance_cents == 60000000, weighted_avg_coupon_pct == 8.7500, member_loan_count == 1 - byte-identical to the post-call-1 snapshot, with no 8.7499 or 8.7501 drift"
            - "LoanFile.${lf_ci_b_id}.pool_id == null after the removal while LoanFile.${lf_ci_a_id}.pool_id still == ${pool_ci_id}"
            - "both loans keep status CLOSED throughout; removal is a membership operation, not a loan-state operation"
            - "SecuritizationPool.${pool_ci_id}.status == OPEN after all three calls, and its version strictly increased on each of the three writes"

      - name: points_and_fees_totals_and_cap_restored_exactly_after_fee_void
        grounds:
          - calculations.points_and_fees_test
          - entities.LoanFile.fields.points_and_fees_total_cents
          - entities.LoanFile.fields.total_loan_amount_cents
          - entities.LoanFile.fields.points_and_fees_cap_cents
          - endpoints.POST_points_and_fees_items_id_void
        distinguishing_aspect: |
          Different conserved quantities on a different aggregate: the loan file's
          points_and_fees_total_cents AND its total_loan_amount_cents, from which the cap is
          re-derived. The added charge is a prepaid finance charge, so it perturbs both sums at
          once (total up, total_loan_amount down, cap down) and flips the result to FAIL;
          voiding it must restore all three numbers exactly and flip the result back, which is
          only possible if steps 1-5 are re-run from scratch over the surviving ACTIVE items.
        test_recipe:
          setup:
            - "A BANK_STATEMENT_12MO program and a self-employed borrower."
            - "A 60000000-cent fully amortizing first lien at 8.750 on a 75000000-cent primary residence, submitted to underwriting."
            - "A five-line fee schedule: 600000 ORIGINATION_POINTS flagged prepaid (INCLUDED), 250000 AFFILIATE_TITLE (INCLUDED), 180000 ESCROW_TAXES (always EXCLUDED), 300000 THIRD_PARTY_UNAFFILIATED not paid to an affiliate (EXCLUDED), 500000 DISCOUNT_POINTS flagged bona fide (EXCLUDED)."
            - "The points-and-fees test is run once, establishing the baseline."
          setup_api_calls:
            - call: "POST /documentation-programs"
              payload: { program_code: "BANK_STATEMENT_12MO", name: "12-Month Bank Statement", statement_period_months: 12, default_expense_factor_pct: 50.00, min_expense_factor_pct: 25.00, max_ltv_pct: 80.00, min_fico: 660, min_reserves_months: 6, max_dti_pct: 50.00, min_residual_income_cents: 250000, second_valuation_ltv_threshold_pct: 85.00, second_valuation_loan_amount_threshold_cents: 150000000, atr_exempt_flag: false, seasoning_matrix: { FORECLOSURE: 36, SHORT_SALE: 24, DEED_IN_LIEU: 24, BK_CH7: 24, BK_CH13: 12, MODIFICATION: 12, MORTGAGE_LATE_60: 12 } }
              as: ProgramAdmin
              captures: { prog_fc_id: "$.data.id" }
            - call: "POST /borrowers"
              payload: { legal_name: "Roswitha Klemm", fico_score: 712, self_employed_flag: true, entity_ownership_pct: 100.0, monthly_debt_obligations_cents: 120000, verified_liquid_assets_cents: 4000000, age_years: 46 }
              as: LoanOfficer
              captures: { bor_fc_id: "$.data.id" }
            - call: "POST /loan-files"
              payload: { borrower_id: "${bor_fc_id}", program_id: "${prog_fc_id}", investor_code: "INV-ATLAS", loan_amount_cents: 60000000, property_value_cents: 75000000, occupancy: "PRIMARY", purpose: "RATE_TERM_REFI", lien_position: "FIRST", note_rate_pct: 8.750, apor_pct: 6.100, term_months: 360, amortization_type: "FULLY_AMORTIZING", monthly_taxes_cents: 78000, monthly_insurance_cents: 22000, monthly_hoa_cents: 0 }
              as: LoanOfficer
              captures: { lf_fc_id: "$.data.id" }
            - call: "POST /loan-files/${lf_fc_id}/doc-type-selection"
              payload: { doc_type: "BANK_STATEMENT" }
              as: Underwriter
              as_user_id: "uw-19"
            - call: "POST /loan-files/${lf_fc_id}/submit-to-underwriting"
              payload: {}
              as: LoanOfficer
            - call: "POST /points-and-fees-items"
              payload: { loan_file_id: "${lf_fc_id}", fee_code: "ORIG-1PT", fee_category: "ORIGINATION_POINTS", amount_cents: 600000, prepaid_finance_charge_flag: true }
              as: LoanOfficer
            - call: "POST /points-and-fees-items"
              payload: { loan_file_id: "${lf_fc_id}", fee_code: "TITLE-AFF", fee_category: "AFFILIATE_TITLE", amount_cents: 250000, paid_to_affiliate_flag: true }
              as: LoanOfficer
            - call: "POST /points-and-fees-items"
              payload: { loan_file_id: "${lf_fc_id}", fee_code: "ESCROW-TAX", fee_category: "ESCROW_TAXES", amount_cents: 180000 }
              as: LoanOfficer
            - call: "POST /points-and-fees-items"
              payload: { loan_file_id: "${lf_fc_id}", fee_code: "APPR-FEE", fee_category: "THIRD_PARTY_UNAFFILIATED", amount_cents: 300000, paid_to_affiliate_flag: false }
              as: LoanOfficer
            - call: "POST /points-and-fees-items"
              payload: { loan_file_id: "${lf_fc_id}", fee_code: "DISC-BONA", fee_category: "DISCOUNT_POINTS", amount_cents: 500000, bona_fide_discount_flag: true }
              as: LoanOfficer
            - call: "POST /loan-files/${lf_fc_id}/points-and-fees-test"
              payload: {}
              as: Underwriter
              as_user_id: "uw-19"
          trigger:
            - call: "POST /points-and-fees-items"
              payload: { loan_file_id: "${lf_fc_id}", fee_code: "LLPA-CASHOUT", fee_category: "LOAN_LEVEL_PRICE_ADJUSTMENT", amount_cents: 2200000, prepaid_finance_charge_flag: true }
              as: Underwriter
              as_user_id: "uw-19"
              captures: { fee_fc_id: "$.data.id" }
            - call: "POST /points-and-fees-items/${fee_fc_id}/void"
              payload: { void_reason: "LLPA repriced and re-disclosed" }
              as: Underwriter
              as_user_id: "uw-19"
          assert:
            - "baseline after setup: points_and_fees_total_cents == 850000, total_loan_amount_cents == 59400000, points_and_fees_cap_cents == 2970000, points_and_fees_test_result == PASS"
            - "after trigger call 1: points_and_fees_total_cents == 3050000, total_loan_amount_cents == 57200000, points_and_fees_cap_cents == 2860000, points_and_fees_test_result == FAIL - the single charge perturbs the total upward and the cap downward at the same time"
            - "after trigger call 2: points_and_fees_total_cents == 850000, total_loan_amount_cents == 59400000, points_and_fees_cap_cents == 2970000, points_and_fees_test_result == PASS - every one of the three numbers is restored exactly"
            - "PointsAndFeesItem.${fee_fc_id}.status == VOIDED and its inclusion_in_test classification is irrelevant once voided"
            - "the four surviving classifications are unchanged across all three snapshots: ORIGINATION_POINTS INCLUDED, AFFILIATE_TITLE INCLUDED, ESCROW_TAXES EXCLUDED, THIRD_PARTY_UNAFFILIATED EXCLUDED, DISCOUNT_POINTS EXCLUDED"
            - "LoanFile.${lf_fc_id}.pitia_monthly_cents == 572020 throughout; fee items never touch the payment"
