              as: DesignEngineer
              as_user_id: "${e1}"
              captures: { err: $.data.error_id }
            - call: "POST /auxiliary-systems"
              payload: { project_id: "${p1}", system_type: "COOKING", label: "Hood with no appliance count", water_wash_enabled: true, agent_type: "WET_CHEMICAL" }
              as: DesignEngineer
              as_user_id: "${e1}"
              captures: { err: $.data.error_id }
            - call: "POST /auxiliary-systems"
              payload: { project_id: "${p1}", system_type: "IN_RACK", label: "Rack with no head count", hazard_area_id: "${ha1}" }
              as: DesignEngineer
              as_user_id: "${e1}"
              captures: { err: $.data.error_id }
            - call: "POST /auxiliary-systems"
              payload: { project_id: "${p1}", system_type: "IN_RACK", label: "Rack with no hazard area", in_rack_head_count: 10 }
              as: DesignEngineer
