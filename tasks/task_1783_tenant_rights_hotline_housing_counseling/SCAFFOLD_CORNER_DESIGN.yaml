        claim_type: priority_ordering
        grounds: ["validations[priority=4]", "validations[priority=7]", "errors[ERR_NOT_FOUND]"]
        distinguishing_aspect: "Existence (priority 4) outranks state: PATCH on a non-existent case id returns 404, never a state error."
        test_recipe:
          setup: ["Empty DB"]
