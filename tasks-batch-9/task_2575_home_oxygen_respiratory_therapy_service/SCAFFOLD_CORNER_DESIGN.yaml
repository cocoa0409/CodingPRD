              as: BranchManager
              captures: { r2: $.data.id }
          trigger:
            - call: "POST /home-oxygen/route-stops"
              payload: { route_id: "${r2}", contract_id: "${c_id}", stop_type: "TANK_EXCHANGE", window_start_utc: "2026-08-02T13:00:00Z", window_end_utc: "2026-08-02T14:00:00Z", service_minutes: 45, cylinders_requested: 3 }
              as: BranchManager
              captures: { s_tank: $.data.id, tank_liters: $.data.liters_committed, tank_seq: $.data.sequence_index }
            - call: "POST /home-oxygen/route-stops"
              payload: { route_id: "${r2}", contract_id: "${c_id}", stop_type: "PORTABLE_REFILL", window_start_utc: "2026-08-02T15:00:00Z", window_end_utc: "2026-08-02T16:00:00Z", service_minutes: 30 }
              as: BranchManager
              captures: { s_refill: $.data.id, refill_liters: $.data.liters_committed, refill_seq: $.data.sequence_index }
            - call: "POST /home-oxygen/route-stops"
              payload: { route_id: "${r2}", contract_id: "${c_id}", stop_type: "PICKUP", window_start_utc: "2026-08-02T17:00:00Z", window_end_utc: "2026-08-02T18:00:00Z", service_minutes: 30 }
              as: BranchManager
              captures: { s_pickup: $.data.id, pickup_liters: $.data.liters_committed, pickup_seq: $.data.sequence_index }
            - call: "GET /home-oxygen/delivery-routes/${r2}"
              payload: {}
              as: BranchManager
              captures: { r2_total: $.data.total_o2_liters_committed, r2_refills: $.data.refill_slots_used, r2_planned: $.data.planned_stop_count }
            - call: "GET /home-oxygen/delivery-routes/${r2}/manifest"
              payload: {}
              as: BranchManager
              captures: { m_total: $.data.total_o2_liters_committed, m_refills: $.data.refill_slots_used, m_planned: $.data.planned_stop_count, m_cap: $.data.refill_capacity_per_day }
          assert:
            - "${tank_liters} == 2040: 3 cylinders x 680 L, the multiplicative branch"
            - "${refill_liters} == 1085: the flat LIQUID_PORTABLE_CAPACITY_LITERS, with cylinders_requested omitted and defaulted to 0 — the flat rule does not consult it"
            - "${pickup_liters} == 0: a PICKUP moves equipment out, so it commits no oxygen"
            - "${r2_total} == 3125 (2040 + 1085 + 0) and ${m_total} == 3125: the persisted roll-up and the recomputed manifest agree"
            - "${r2_refills} == 1 and ${m_refills} == 1 against ${m_cap} == 4: only the PORTABLE_REFILL stop consumes a refill slot"
            - "${r2_planned} == 3 and ${m_planned} == 3; sequence indices ${tank_seq}, ${refill_seq}, ${pickup_seq} are 1, 2, 3 in window_start_utc order"
            - "${s_setup_liters} == 1360 and ${r1_total} == 1360 on the other route: a SETUP_DELIVERY takes the same cylinder branch as a TANK_EXCHANGE, and roll-ups never cross route boundaries"
            - "RentalContract.${c_id}.service_status == PICKUP_SCHEDULED after ${s_pickup} is created, since creating a PICKUP stop drives IN_SERVICE -> PICKUP_SCHEDULED"

