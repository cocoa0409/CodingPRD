      - name: xc_envelope_and_meta_are_uniform_across_object_array_and_error
        claim_type: envelope_contract
        grounds:
          - endpoints[POST /innovation-projects]
          - endpoints[GET /innovation-projects]
          - errors[ERR_INVALID_REQUEST]
        distinguishing_aspect: |
          Success and failure share one envelope: meta always carries api_request_id and
          api_request_timestamp, response_type is object for a single row, array for a list and
          error for a refusal, and the error body puts error_id and message inside data rather than
          at the top level, so a client parses one shape for all three.
        test_recipe:
          setup:
            - "Empty database, logical clock at 2026-08-03T00:00:00Z."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-03T00:00:00Z" }
              as: PortfolioAdmin
          trigger:
            - call: "POST /innovation-projects"
              payload: { name: "Envelope Probe", brand: "GrainWell", category: "SNACK", project_type: "LINE_EXTENSION", strategic_fit_score: 8, consumer_need_score: 7, target_gross_margin_pct: 36, category_attractiveness_score: 7, development_budget_cap_usd: 300000.00 }
              as: InnovationLead
              as_user_id: "lead-ev"
              captures: { ev_p_id: $.data.id }
            - call: "GET /innovation-projects/${ev_p_id}"
              as: InnovationLead
            - call: "GET /innovation-projects"
              as: InnovationLead
            - call: "GET /innovation-projects/00000000-0000-0000-0000-0000000000ff"
              as: InnovationLead
          assert:
            - "the create answers 201 with response_type object and data holding the whole project row"
            - "the single read answers 200 with response_type object and the same id ${ev_p_id}"
            - "the list answers 200 with response_type array, data as a JSON array and limit, offset, total_count and has_more all present"
            - "the unknown id answers 404 with response_type error and data.error_id == ERR_PROJECT_NOT_FOUND alongside a human readable data.message"
            - "all four responses carry meta.api_request_id and meta.api_request_timestamp, including the 404"
            - "no response places error_id at the top level and no success response carries an error_id at all"

      - name: xc_the_logical_clock_is_the_only_source_of_now
        claim_type: clock_contract
        grounds:
          - endpoints[POST /_clock/set_current_utc]
          - entities[InnovationProject]
          - calculations[launch_readiness_pct]
        distinguishing_aspect: |
          Stored timestamps are stamped from the logical clock at write time and never re-derived, so
          moving the clock forward changes updated_at on the next mutation while leaving created_at
          alone, moving it backward leaves both alone, and only clock-reading derived fields such as
          earliest_lockable_date move with it.
        test_recipe:
          setup:
            - "Empty database, logical clock at 2026-08-03T00:00:00Z, one IDEA project created at that instant."
            - "A SNACK gate 2 so the project can be screened later."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-03T00:00:00Z" }
              as: PortfolioAdmin
            - call: "POST /stage-gates"
              payload: { gate_number: 2, category: "SNACK", stage_from: "SCREENED", stage_to: "PILOT_QUALIFIED", required_deliverable_types: [], quorum_size: 1, veto_functions: [], npv_hurdle_usd: 0.00, payback_months_max: 24, gross_margin_floor_pct: 0.00, readiness_floor_index: 0.00 }
              as: PortfolioAdmin
            - call: "POST /innovation-projects"
              payload: { name: "Clock Probe", brand: "GrainWell", category: "SNACK", project_type: "LINE_EXTENSION", strategic_fit_score: 8, consumer_need_score: 7, target_gross_margin_pct: 36, category_attractiveness_score: 7, development_budget_cap_usd: 300000.00 }
              as: InnovationLead
              as_user_id: "lead-ck"
              captures: { ck_p_id: $.data.id }
          trigger:
            - call: "GET /innovation-projects/${ck_p_id}/launch-readiness"
              as: GateChair
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-09-01T12:00:00Z" }
              as: PortfolioAdmin
            - call: "GET /innovation-projects/${ck_p_id}"
              as: GateChair
            - call: "GET /innovation-projects/${ck_p_id}/launch-readiness"
              as: GateChair
            - call: "POST /innovation-projects/${ck_p_id}/screen"
              payload: { screening_notes: "Screened a month later." }
              as: GateChair
              as_user_id: "chair-ck"
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-10T00:00:00Z" }
              as: PortfolioAdmin
            - call: "GET /innovation-projects/${ck_p_id}"
              as: GateChair
          assert:
            - "at the first read earliest_lockable_date is 2026-09-17T00:00:00Z, being the clock plus the 45 day lock lead time"
            - "after the clock moves to 2026-09-01T12:00:00Z the project still reports created_at 2026-08-03T00:00:00Z and the same updated_at, because a clock move is not a write to the project"
            - "the second launch-readiness read reports earliest_lockable_date 2026-10-16T12:00:00Z, since that field is derived from the clock on every read"
            - "the screen sets updated_at to 2026-09-01T12:00:00Z while created_at stays 2026-08-03T00:00:00Z, and dev_status becomes SCREENED"
            - "after the clock is moved backward to 2026-08-10T00:00:00Z the stored created_at and updated_at are unchanged, so no timestamp is ever recomputed from the current clock"
            - "InnovationProject.${ck_p_id}.version incremented exactly once across the whole recipe, at the screen"

      - name: xc_child_lists_are_scoped_to_their_parent
        claim_type: scoping_contract
        grounds:
          - endpoints[GET /innovation-projects/{id}/concept-tests]
          - endpoints[GET /gate-reviews]
          - errors[ERR_PROJECT_NOT_FOUND]
        distinguishing_aspect: |
          A nested list is scoped by its path parent and a flat list by its filter, so neighbouring
          projects never bleed into each other's collections, and a nested list under an unknown
          parent is a 404 rather than an empty page, which is the opposite of an unmatched filter.
        test_recipe:
          setup:
            - "Empty database, logical clock at 2026-08-03T00:00:00Z."
