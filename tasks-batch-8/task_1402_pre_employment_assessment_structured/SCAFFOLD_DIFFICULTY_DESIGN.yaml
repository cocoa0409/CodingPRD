            - { call: "POST /talent/cycles/${cy}/invitations", payload: { candidate_id: "${cA}" }, as: HiringManager, as_user_id: hm-1, captures: { aA: $.data.id } }
            - { call: "POST /talent/cycles/${cy}/invitations", payload: { candidate_id: "${cB}" }, as: HiringManager, as_user_id: hm-1, captures: { aB: $.data.id } }
            - { call: "POST /talent/cycles/${cy}/invitations", payload: { candidate_id: "${cC}" }, as: HiringManager, as_user_id: hm-1, captures: { aC: $.data.id } }
