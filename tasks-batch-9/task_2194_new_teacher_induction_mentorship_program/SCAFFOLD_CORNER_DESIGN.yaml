      - name: late_attendance_applies_ten_minute_penalty
        claim_type: constants_applied
        grounds: [calculations.seminar_attendance_credit, entities.SeminarAttendance.fields.credit_ratio, entities.SeminarAttendance.fields.credited]
        distinguishing_aspect: "Both rows are LATE on a 90-minute session, straddling the threshold only because LATE_PENALTY_MINUTES=10 is subtracted first: 80 minutes becomes 70/90 = 0.7778 and earns credit, while 75 minutes becomes 65/90 = 0.7222 and does not. Without the penalty both raw ratios (0.8889 and 0.8333) would clear 0.75."
        test_recipe:
          setup: ["Cohort NORTH-2026 owns two SCHEDULED 90-minute seminar sessions in ISO week 2026-W32 (180 scheduled minutes in total, within the 240-minute weekly cap) and one enrolled novice with no attendance rows yet. The logical clock is at its startup default 2026-08-01T00:00:00Z."]
          setup_api_calls:
            - call: "POST /sites"
              payload: { name: "Northgate High", site_code: "NG-001", region_code: "NORTH", mentor_slot_cap: 6 }
              as: ProgramAdmin
