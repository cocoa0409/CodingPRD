              as: HRBusinessPartner
              as_user_id: "hrbp-1"
              captures: { e_flag: $.data.id }
            - call: "POST /employees"
              payload: { team_id: "${t_a}", employee_number: "E-PLAIN", work_email: "eplain@corp.example", home_timezone: "America/New_York", tenure_start_date: "2024-03-04", demographic_band: "BAND_A", manager_user_id: "mgr-1", hr_partner_user_id: "hrbp-1" }
              as: HRBusinessPartner
              as_user_id: "hrbp-1"
              captures: { e_plain: $.data.id }
            - call: "POST /exception-requests"
              payload: { employee_id: "${e_flag}", category: "CAREGIVING", requested_relief_days: 2, start_date: "2026-09-07", end_date: "2026-09-08", rationale: "eldercare coverage Monday and Tuesday" }
              as: HRBusinessPartner
              as_user_id: "hrbp-1"
              captures: { req_flag: $.data.id }
            - call: "POST /exception-requests"
              payload: { employee_id: "${e_plain}", category: "CAREGIVING", requested_relief_days: 2, start_date: "2026-09-07", end_date: "2026-09-08", rationale: "eldercare coverage Monday and Tuesday" }
              as: HRBusinessPartner
              as_user_id: "hrbp-1"
              captures: { req_plain: $.data.id }
          trigger:
            - call: "POST /exception-requests/${req_plain}/adjudicate"
              payload: { decision: "APPROVE", granted_relief_days: 2 }
