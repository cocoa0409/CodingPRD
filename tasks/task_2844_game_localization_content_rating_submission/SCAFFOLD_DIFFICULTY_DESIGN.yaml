  - rule_id: compensating_invariant
    instances:
      - name: contract_committed_fee_returns_exactly_to_buyout_after_cancel
        grounds:
          - calculations.talent_commitment_ledger
          - calculations.market_localization_cost_cents
          - state_machines.VoiceSession.RECORDED_to_CANCELLED
        distinguishing_aspect: |
          The conserved quantity is MONEY on TalentContract.committed_fee_cents, and the compensated
          path is the long one SCHEDULED -> IN_PROGRESS -> RECORDED -> CANCELLED, so the reversal
          has to undo a line fee that was already booked into two derived ledgers (the contract and
          the market's cost). 750000 -> 765400 -> 750000 exactly, with no proration and no
          cancellation fee, and MarketPlan.localization_cost_cents 756 -> 16156 -> 756.
        test_recipe:
          setup:
            - "Logical clock at 2026-09-10T09:00:00Z so the session may be started."
            - "Title NOVA-28, one MENU string key at tm_match_pct 96, DE market plan FULL_VOICE, budget_cap 9000000, required_voice_line_count 0, at IN_LOCALIZATION."
            - "text_effort_units 0.10 -> text_cost round_half_up(0.10 * 4200 * 1.80) == 756, so the pre-session cost is 756."
            - "Booth BER-J, talent Dora, contract buyout 750000 and per_line_rate_cents 175, SIGNED."
            - "Session of 88 planned lines on 2026-09-10T09:00:00Z-12:00:00Z."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-09-10T09:00:00Z" }
              as: PlatformAdmin
            - call: "POST /titles"
              payload: { title_code: "NOVA-28", name: "Nova Drift 28", source_language: "EN", target_release_utc: "2026-12-01T00:00:00Z", release_mode: "STAGGERED" }
              as: LocalizationProducer
              captures: { title_id: "$.data.id" }
            - call: "POST /string-keys"
              payload: { title_id: "${title_id}", key_name: "menu.start", source_text: "Start Game", source_char_count: 125, ui_surface: "MENU", display_char_limit: 140, tm_match_pct: 96 }
              as: LocalizationProducer
              captures: { k_menu: "$.data.id" }
            - call: "POST /market-plans"
              payload: { title_id: "${title_id}", market_code: "DE", rating_board: "USK", target_rating: "MATURE_15", scope_tier: "FULL_VOICE", cultural_adaptation_required: false, budget_cap_cents: 9000000, required_voice_line_count: 0 }
              as: LocalizationProducer
              captures: { mp_de: "$.data.id" }
            - call: "POST /titles/${title_id}/lock-strings"
              payload: {}
              as: LocalizationProducer
            - call: "POST /market-plans/${mp_de}/scope"
              payload: {}
              as: LocalizationProducer
              captures: { cost_before: "$.data.localization_cost_cents" }
            - call: "POST /market-plans/${mp_de}/start-localization"
              payload: {}
              as: LocalizationProducer
            - call: "POST /booths"
              payload: { booth_code: "BER-J", studio_city: "Berlin", turnaround_buffer_minutes: 30 }
              as: LocalizationProducer
              captures: { booth_j: "$.data.id" }
            - call: "POST /voice-talents"
              payload: { talent_name: "Dora Vogt", language_code: "DE", union_flag: true }
              as: LocalizationProducer
              captures: { talent_dora: "$.data.id", dora_v: "$.data.version" }
            - call: "POST /talent-contracts"
              payload: { voice_talent_id: "${talent_dora}", title_id: "${title_id}", territory_scope: ["DE"], media_scope: "ALL_MEDIA", buyout_fee_cents: 750000, per_line_rate_cents: 175, rights_start_utc: "2026-08-01T00:00:00Z", rights_end_utc: "2026-12-31T00:00:00Z", expected_voice_talent_version: "${dora_v}" }
              as: LocalizationProducer
              captures: { contract_dora: "$.data.id" }
            - call: "POST /talent-contracts/${contract_dora}/sign"
              payload: {}
              as: TalentAgent
              as_user_id: "${talent_dora}"
              captures: { committed_after_sign: "$.data.committed_fee_cents" }
            - call: "POST /voice-sessions"
              payload: { market_plan_id: "${mp_de}", voice_talent_id: "${talent_dora}", recording_booth_id: "${booth_j}", talent_contract_id: "${contract_dora}", start_utc: "2026-09-10T09:00:00Z", end_utc: "2026-09-10T12:00:00Z", planned_line_count: 88 }
              as: LocalizationProducer
              captures: { sess_id: "$.data.id" }
          trigger:
            - call: "POST /voice-sessions/${sess_id}/start"
              payload: {}
              as: LocalizationProducer
            - call: "POST /voice-sessions/${sess_id}/complete"
              payload: { recorded_line_count: 88 }
              as: LocalizationProducer
              captures: { line_fee: "$.data.line_fee_cents" }
            - call: "GET /talent-contracts/${contract_dora}"
              payload: {}
              as: LocalizationProducer
              captures: { committed_peak: "$.data.committed_fee_cents" }
            - call: "GET /market-plans/${mp_de}"
              payload: {}
              as: LocalizationProducer
              captures: { cost_peak: "$.data.localization_cost_cents" }
            - call: "POST /voice-sessions/${sess_id}/cancel"
              payload: {}
              as: LocalizationProducer
              captures: { line_fee_after: "$.data.line_fee_cents" }
            - call: "GET /talent-contracts/${contract_dora}"
              payload: {}
              as: LocalizationProducer
              captures: { committed_restored: "$.data.committed_fee_cents" }
            - call: "POST /voice-sessions/${sess_id}/cancel"
              payload: {}
              as: LocalizationProducer
              captures: { second_cancel_error: "$.data.error_id" }
          assert:
            - "after sign: TalentContract.${contract_dora}.committed_fee_cents == 750000 and MarketPlan.${mp_de}.localization_cost_cents == 756"
            - "after complete: VoiceSession.${sess_id}.line_fee_cents == 15400 (88 * 175), TalentContract.${contract_dora}.committed_fee_cents == 765400, MarketPlan.${mp_de}.voice_recorded_line_count == 88 and localization_cost_cents == 16156"
            - "after cancel: VoiceSession.${sess_id}.line_fee_cents == 0, TalentContract.${contract_dora}.committed_fee_cents == 750000 exactly, MarketPlan.${mp_de}.voice_recorded_line_count == 0 and localization_cost_cents == 756"
            - "MarketPlan.${mp_de}.overage_cents == 0 at every step and the plan stays IN_LOCALIZATION (no LQA revert, since required_voice_line_count is 0)"
            - "the second cancel returns HTTP 409 with error_id == ERR_SESSION_STATE_INVALID and leaves committed_fee_cents at 750000 - the compensation is not applied twice"

      - name: booth_capacity_minutes_return_to_zero_and_free_the_refused_booking
        grounds:
          - calculations.booth_reserved_minutes_total
          - state_machines.VoiceSession.SCHEDULED_to_CANCELLED
          - validations[priority=62]
        distinguishing_aspect: |
          The conserved quantity is CAPACITY MINUTES rather than money, the buffer is 45 (so the
          contribution 135 is not a round multiple of anything in the money instance), and the
          compensated path is the short SCHEDULED -> CANCELLED one that never books a line fee at
          all. Crucially the invariant is proven behaviourally, not just by reading the field: the
          exact 15:00-16:00 booking that is refused before the cancel is accepted after it.
