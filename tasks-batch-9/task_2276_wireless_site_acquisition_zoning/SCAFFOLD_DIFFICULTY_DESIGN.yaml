  # =========================================================================
  # Rule 4 — transitive cascade chains from different triggers
  # =========================================================================
  - rule_id: transitive_cascade
    instances:
      - name: structural_fail_cascades_to_backhaul_cancellation_and_crew_ledger
        grounds:
          - state_machines.StructuralAnalysis.IN_PROGRESS_to_COMPLETED
          - state_machines.Candidate.STRUCTURAL_HOLD_to_DISQUALIFIED
          - state_machines.ZoningApplication.HEARING_SCHEDULED_to_WITHDRAWN
          - state_machines.UtilityBackhaulOrder.SCHEDULED_to_CANCELLED
          - calculations.provider_crew_day_ledger
        distinguishing_aspect: |
          Depth-4 cascade triggered by POST /structural-analyses/{id}/complete with result FAIL: the FAIL
          disqualifies the Candidate, the disqualification withdraws that candidate's UNDER_REVIEW
          ZoningApplication, the withdrawal cancels the candidate's REQUESTED backhaul order, and the
          cancellation drives UtilityProvider.committed_crew_days from 4 back to 0. Each hop is caused by
          the previous hop, not by the triggering call.
        test_recipe:
          setup:
            - "logical clock at 2026-08-01T00:00:00Z"
            - "a candidate with an EXECUTED lease, a PASS analysis (STRUCTURALLY_CLEARED), an UNDER_REVIEW CONDITIONAL_USE application and one REQUESTED backhaul order of 4 crew days"
            - "the provider has concurrent_crew_capacity 2 and committed_crew_days 4"
            - "a superseding analysis with FAIL inputs (existing 88, 8 appurtenances, 120 mph, 1.0 in ice) is IN_PROGRESS"
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-01T00:00:00Z" }
              as: ProgramDirector
            - call: "POST /jurisdictions"
              payload: { name: "Northeast Township", market_code: "MKT-NE-01", by_right_review_days: 60, conditional_use_review_days: 90, variance_review_days: 150, hearing_cadence_days: 14, requires_visual_simulation: true, min_visual_simulations: 2, max_continuances: 2, historic_district_flag: false, tribal_consultation_required: false, historical_delay_factor: 1.20, appeal_window_days: 30 }
              as: ZoningPlanner
