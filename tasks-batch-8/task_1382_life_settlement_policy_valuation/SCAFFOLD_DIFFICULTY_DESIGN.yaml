          suspension flips hold_status to COMPLIANCE_HOLD (blocking accept) and
          reinstatement flips it back to CLEAR (accept then succeeds).
        test_recipe:
          setup:
            - "Canonical TX chain to MARKETED with disclosures delivered and offer 6000000 PENDING"
          setup_api_calls:
            - { call: "POST /api/licenses", payload: { state_code: "TX", license_number: "LIC-TX-1", effective_date: "2026-01-01", expiry_date: "2027-12-31" }, as: PlatformAdmin, captures: { lic: "$.data.id" } }
