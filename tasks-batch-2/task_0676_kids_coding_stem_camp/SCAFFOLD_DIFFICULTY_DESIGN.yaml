      - name: showcase_entry_deadline_inclusive_instant_boundary
        grounds:
          - validations[priority=11]
          - errors[ERR_ENTRY_DEADLINE_PASSED]
          - entities.Showcase.fields.entry_deadline_at
        distinguishing_aspect: "Temporal-instant boundary on POST /showcase-entries reachable through a different endpoint: an entry submitted exactly AT entry_deadline_at succeeds (inclusive), while one submitted one second after is rejected ERR_ENTRY_DEADLINE_PASSED — a clock-instant boundary distinct from the seat-count threshold above."
        test_recipe:
          setup:
            - "Center, program, guardian, member on the program; an OPEN showcase with entry_deadline_at 2026-05-10T12:00:00Z, starts_at 2026-05-11T09:00:00Z."
