  # ===========================================================================
  - section: rbac
    instances:
      - name: sales_agent_cannot_make_finance_decision
        claim_type: peer_roles
        grounds:
          - 'roles.SalesAgent'
          - 'roles.DealerManager'
          - 'errors[ERR_FORBIDDEN_ROLE]'
          - 'endpoints["POST /deals/{dealId}/finance-decision"]'
        distinguishing_aspect: "finance-decision is DealerManager-exclusive; SalesAgent gets ERR_FORBIDDEN_ROLE (403)."
        test_recipe:
          setup: ["a deal with finance requested"]
          setup_api_calls:
            - call: "POST /dealerships"
              payload: { name: "Rb1 RV", state_code: "TX", doc_fee_cents: 0, sales_tax_rate_bps: 0 }
              as: DealerManager
              captures: { did: $.data.id }
            - call: "POST /customers"
              payload: { dealership_id: "${did}", full_name: "Rb Buyer", email: "rb@x.com", credit_tier: "PRIME" }
              as: SalesAgent
              captures: { cust: $.data.id }
            - call: "POST /units"
              payload: { dealership_id: "${did}", vin: "VIN-RB-1", model_year: 2024, class_type: "CLASS_C", acquisition: "STOCK", list_price_cents: 8000000 }
              as: SalesAgent
              captures: { unit: $.data.id, unit_v: $.data.version }
            - call: "POST /deals"
              payload: { dealership_id: "${did}", unit_id: "${unit}", customer_id: "${cust}", sale_price_cents: 6000000, expected_unit_version: "${unit_v}", term_months: 60 }
              as: SalesAgent
              captures: { deal: $.data.id }
            - call: "POST /deals/${deal}/quote"
              payload: {}
              as: SalesAgent
            - call: "POST /deals/${deal}/request-finance"
              payload: {}
              as: SalesAgent
          trigger:
            - call: "POST /deals/${deal}/finance-decision"
              payload: { decision: "APPROVE" }
              as: SalesAgent
              captures: { err: $.data.error_id }
          assert:
            - "response code == 403 and error_id == ERR_FORBIDDEN_ROLE"

      - name: customer_cannot_create_deal
        claim_type: peer_roles
        grounds:
          - 'roles.Customer'
          - 'roles.SalesAgent'
          - 'errors[ERR_FORBIDDEN_ROLE]'
          - 'endpoints["POST /deals"]'
        distinguishing_aspect: "Customer is read-only; POST /deals as Customer returns ERR_FORBIDDEN_ROLE (403)."
        test_recipe:
          setup: ["an available unit and a customer"]
          setup_api_calls:
            - call: "POST /dealerships"
              payload: { name: "Rb2 RV", state_code: "TX", doc_fee_cents: 0, sales_tax_rate_bps: 0 }
              as: DealerManager
              captures: { did: $.data.id }
            - call: "POST /customers"
              payload: { dealership_id: "${did}", full_name: "Self Buyer", email: "self@x.com" }
              as: SalesAgent
              captures: { cust: $.data.id }
            - call: "POST /units"
              payload: { dealership_id: "${did}", vin: "VIN-SF-1", model_year: 2024, class_type: "CLASS_C", acquisition: "STOCK", list_price_cents: 7000000 }
              as: SalesAgent
              captures: { unit: $.data.id, unit_v: $.data.version }
          trigger:
            - call: "POST /deals"
              payload: { dealership_id: "${did}", unit_id: "${unit}", customer_id: "${cust}", sale_price_cents: 7000000, expected_unit_version: "${unit_v}" }
              as: Customer
              as_user_id: "${cust}"
              captures: { err: $.data.error_id }
          assert:
            - "response code == 403 and error_id == ERR_FORBIDDEN_ROLE"

      - name: sales_agent_cannot_open_recall_campaign
        claim_type: peer_roles
        grounds:
          - 'roles.SalesAgent'
          - 'roles.DealerManager'
          - 'errors[ERR_FORBIDDEN_ROLE]'
          - 'endpoints["POST /recall-campaigns"]'
        distinguishing_aspect: "Opening a recall campaign is DealerManager-exclusive; SalesAgent gets ERR_FORBIDDEN_ROLE (403)."
        test_recipe:
          setup: ["a dealership"]
          setup_api_calls:
