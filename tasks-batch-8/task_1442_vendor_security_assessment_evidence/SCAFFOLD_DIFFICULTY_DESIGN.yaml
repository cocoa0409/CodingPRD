              payload: {}
              as: RiskAnalyst
          assert:
            - "EvidenceArtifact.${e_fresh}.coverage_gap_days == 0 (period_end == issued_at day)"
            - "zero-gap artifact completes cleanly; a 577-day-gap artifact would exceed the 180-day ceiling and be rejectable"

      - name: risk_acceptance_expiry_window_vs_clock
        grounds:
          - state_machines.RiskAcceptance.APPROVED_to_EXPIRED
          - calculations.escalation_pull_forward
          - calculations.vendor_risk_score
        distinguishing_aspect: |
          Interval semantics (b) — a forward-looking expiry window on the
          RiskAcceptance resource: an APPROVED acceptance occupies the
          half-open interval [approval, expires_at); the vendor_risk_score
          'imminent expiry' modifier (+8) applies only when expires_at falls
          inside (now, now+30d], and the auto-EXPIRED sweep fires strictly
          after expires_at. This window-vs-point semantics differs from the
          backward-looking coverage gap.
        test_recipe:
          setup:
            - "APPROVED RiskAcceptance with expires_at 2026-08-20 while clock is 2026-08-01 (inside the 30-day window) vs a second with expires_at 2026-12-01 (outside)"
