            - call: "POST /field-ops/distribution-stops/${st2}/transitions"
              payload: { to_state: "DELIVERED", delivered_meals: 60 }
              as: SiteCoordinator
              as_user_id: "${s2}"
          trigger:
            - call: "POST /field-ops/distribution-stops/${st2}/transitions"
              payload: { to_state: "FAILED", failure_reason: "SITE_CLOSED_BEFORE_HANDOVER" }
              as: LogisticsCoordinator
          assert:
            - "DistributionRun.${run_id}.loaded_meals == 100"
            - "DistributionRun.${run_id}.delivered_meals == 40"
            - "DistributionRun.${run_id}.returned_meals == 60"
            - "DistributionRun.${run_id}.loaded_meals == DistributionRun.${run_id}.delivered_meals + DistributionRun.${run_id}.returned_meals"
            - "DistributionSite.${s1}.received_meals_total == 40"
            - "DistributionSite.${s2}.received_meals_total == 0"

      - name: supplier_cash_reversal_restores_pre_payment_balance
        grounds:
          - state_machines.IngredientPurchase.PAID_to_DISPUTED
          - entities.Supplier.fields.cash_flow_received_cents
          - entities.Incident.fields.spent_cents
          - calculations.incident_local_sourcing_ratio
        distinguishing_aspect: |
          The compensating PAID -> DISPUTED reversal returns exactly amount_cents to the producer's
          unreceived balance: cash_flow_received_cents reads 300000 after the payment and returns to
          exactly 0 after the reversal, and the incident's spent_cents returns to its pre-payment value
          because DISPUTED rows leave the numerator of the local sourcing ratio.
        test_recipe:
          setup:
            - "Incident ${inc_id} is ACTIVE with spent_cents 300000 because IngredientPurchase ${p1} is DELIVERED"
            - "Supplier ${sup_id} has cash_flow_received_cents 0"
            - "PartnerKitchen ${pk_id} is CONTRACTED"
          setup_api_calls:
            - call: "POST /field-ops/incidents"
              payload: { name: "Central Valley Floods", country_code: "US", disaster_type: "FLOOD", severity_level: 4, target_daily_meals: 12000, funding_ceiling_cents: 5000000 }
              as: PlatformAdmin
              captures: { inc_id: "$.data.id" }
            - call: "POST /field-ops/assessments"
              payload: { incident_id: "${inc_id}", assessed_at: "2026-09-01T06:00:00Z", population_affected: 40000, estimated_daily_meal_need: 9000, access_constraint: "LIMITED", water_available: false, power_available: true, partner_kitchens_identified: 2 }
              as: FieldCoordinator
              captures: { asmt_id: "$.data.id" }
            - call: "POST /field-ops/incidents/${inc_id}/transitions"
              payload: { to_state: "ACTIVE" }
              as: FieldCoordinator
            - call: "POST /field-ops/partner-kitchens"
              payload: { incident_id: "${inc_id}", business_name: "Casa Rosa", owner_name: "Rosa Delgado", cuisine_tags: ["LOCAL"], daily_capacity_meals: 1200, per_meal_price_cents: 1500, bank_verified: true }
              as: PartnershipLead
              captures: { pk_id: "$.data.id" }
            - call: "POST /field-ops/partner-kitchens/${pk_id}/transitions"
              payload: { dimension: "CONTRACT", to_state: "VETTING" }
              as: PartnershipLead
            - call: "POST /field-ops/partner-kitchens/${pk_id}/transitions"
              payload: { dimension: "CONTRACT", to_state: "CONTRACTED", vetting_score: 72 }
              as: PartnershipLead
            - call: "POST /field-ops/suppliers"
              payload: { incident_id: "${inc_id}", producer_name: "Valle Verde Cooperative", locality: "San Joaquin", product_categories: ["PRODUCE"], payment_terms_days: 7 }
              as: SourcingOfficer
              captures: { sup_id: "$.data.id" }
            - call: "POST /field-ops/ingredient-purchases"
              payload: { incident_id: "${inc_id}", supplier_id: "${sup_id}", partner_kitchen_id: "${pk_id}", item_description: "maize flour", quantity_kg: 1000, unit_price_cents_per_kg: 300 }
              as: SourcingOfficer
              captures: { p1: "$.data.id" }
            - call: "POST /field-ops/ingredient-purchases/${p1}/transitions"
              payload: { to_state: "CONFIRMED" }
              as: SourcingOfficer
            - call: "POST /field-ops/ingredient-purchases/${p1}/transitions"
              payload: { to_state: "DELIVERED" }
              as: SourcingOfficer
          trigger:
            - call: "POST /field-ops/ingredient-purchases/${p1}/transitions"
              payload: { to_state: "PAID" }
              as: SourcingOfficer
            - call: "GET /field-ops/incidents/${inc_id}/suppliers"
              as: SourcingOfficer
              captures: { cash_after_paid: "$.data[0].cash_flow_received_cents" }
            - call: "POST /field-ops/ingredient-purchases/${p1}/transitions"
              payload: { to_state: "DISPUTED", dispute_reason: "QUANTITY_SHORTFALL" }
              as: SourcingOfficer
            - call: "GET /field-ops/incidents/${inc_id}/suppliers"
              as: SourcingOfficer
              captures: { cash_after_reversal: "$.data[0].cash_flow_received_cents" }
          assert:
            - "${cash_after_paid} == 300000"
            - "${cash_after_reversal} == 0"
            - "Supplier.${sup_id}.cash_flow_received_cents == 0"
            - "IngredientPurchase.${p1}.amount_cents == 300000"
            - "Incident.${inc_id}.spent_cents == 0"
