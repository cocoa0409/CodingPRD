# ===========================================================================
# §1.8 Scaffold Difficulty Design (Test Targeting Index)
# task_2923 — Crash Preventability Review & Liability Claim Handling
#
# Nine §0.5 rule_id blocks, two differentiated instances each (18 total).
# Every grounds ref resolves into SCAFFOLD.yaml §1.1-§1.6; every numeric
# assert literal below was produced by executing the relevant §1.3 formula.
#
# Actor ids used throughout (X-User-ID):
#   sa-001   SafetyAdmin       disp-001  Dispatcher
#   sm-001   SafetyManager (chairs / decides)
#   sm-002   SafetyManager (grants appeals — segregation of duties)
#   cm-001 / cm-002 / cm-003  CommitteeMember
#   adj-001  ClaimsAdjuster    cmgr-001  ClaimsManager
# The logical clock starts at its mandatory default 2026-08-01T00:00:00Z and
# is only moved by instances that say so.
# ===========================================================================
scaffold_difficulty_design:

  # =========================================================================
  - rule_id: dual_variant_calc
    instances:

      - name: preventability_variant_divergence_weighted_vs_majority
        grounds:
          - calculations.preventability_determination
          - calculations.crash_evidence_posture
          - entities.Crash.fields.evidence_posture
          - entities.ReviewCase.fields.decision_basis
          - entities.ReviewCase.fields.committee_score
          - entities.CommitteeVote.fields.weighted_member_score
          - state_machines.ReviewCase.DELIBERATION_to_DECIDED
          - state_machines.ReviewCase.DECIDED_to_DELIBERATION
          - state_machines.ReviewCase.DELIBERATION_to_CLOSED_FINAL
          - state_machines.EvidenceItem.REQUESTED_to_PURGED_BEFORE_HOLD
        distinguishing_aspect: |
          This instance's dual variant lives in the safety-review entity domain
          (ReviewCase + CommitteeVote ballots): the SAME three ballots yield
          NON_PREVENTABLE under unweighted_majority and PREVENTABLE under
          weighted_criteria, with an identical committee_score of 2.73, because
          purging one never-preserved EvidenceItem flips Crash.evidence_posture
          from COMPLETE to COMPROMISED and therefore flips the variant selector.
        test_recipe:
          setup:
            - "One Terminal ASH01 with annual_miles_millions 4.0 and one Driver hired 2019-03-04 (tenure_band OVER_36_MONTHS)."
            - "One SEVERE crash on 2026-07-30T14:00:00Z with mechanical_factor true, so the vehicle_condition_precheck criterion is applicable and the weighted denominator is 1.00."
            - "Four EvidenceItems on that crash: TELEMATICS_SNAPSHOT, FORWARD_CAMERA and ELD_LOG all PRESERVED with windows bracketing the crash instant, plus one SCENE_PHOTO left in REQUESTED."
            - "Crash.evidence_posture is therefore COMPLETE (all three required kinds for SEVERE satisfied, nothing spoliated)."
            - "One ReviewCase in DELIBERATION carrying exactly three non-superseded ballots: 2.75 NON_PREVENTABLE, 2.50 NON_PREVENTABLE, 2.95 PREVENTABLE."
            - "Clock left at 2026-08-01T00:00:00Z."
          setup_api_calls:
            - call: "POST /terminals"
              payload: { name: "Ashland Terminal", terminal_code: "ASH01", region_code: "OH", annual_miles_millions: 4.0 }
              as: SafetyAdmin
              as_user_id: "sa-001"
              captures: { t_id: $.data.id }
            - call: "POST /drivers"
              payload: { terminal_id: "${t_id}", employee_code: "D-1001", full_name: "Ray Vance", cdl_number: "OH-CDL-1001", hire_date: "2019-03-04" }
              as: SafetyAdmin
              as_user_id: "sa-001"
              captures: { d_id: $.data.id }
            - call: "POST /crashes"
              payload: { driver_id: "${d_id}", terminal_id: "${t_id}", occurred_at: "2026-07-30T14:00:00Z", notified_at: "2026-07-30T15:00:00Z", location_text: "I-71 MM 128 northbound", severity: "SEVERE", route_class: "LINEHAUL", tow_away: true, tow_reason: "DISABLING_DAMAGE", injury_transported_count: 1, fatality_count: 0, hazmat_release: false, mechanical_factor: true, third_party_at_fault: true }
              as: Dispatcher
              as_user_id: "disp-001"
              captures: { c_id: $.data.id }
            - call: "POST /crashes/${c_id}/evidence-items"
              payload: { kind: "TELEMATICS_SNAPSHOT", source_device_id: "ELD-77120", window_start_at: "2026-07-30T13:00:00Z", window_end_at: "2026-07-30T15:00:00Z", retention_deadline_at: "2026-09-30T00:00:00Z" }
              as: Dispatcher
              as_user_id: "disp-001"
              captures: { e_tel_id: $.data.id }
            - call: "POST /crashes/${c_id}/evidence-items"
              payload: { kind: "FORWARD_CAMERA", source_device_id: "CAM-F-77120", window_start_at: "2026-07-30T13:00:00Z", window_end_at: "2026-07-30T15:00:00Z", retention_deadline_at: "2026-09-30T00:00:00Z" }
              as: Dispatcher
              as_user_id: "disp-001"
              captures: { e_cam_id: $.data.id }
            - call: "POST /crashes/${c_id}/evidence-items"
              payload: { kind: "ELD_LOG", source_device_id: "ELD-77120", window_start_at: "2026-07-30T13:00:00Z", window_end_at: "2026-07-30T15:00:00Z", retention_deadline_at: "2026-09-30T00:00:00Z" }
              as: Dispatcher
              as_user_id: "disp-001"
              captures: { e_eld_id: $.data.id }
            - call: "POST /crashes/${c_id}/evidence-items"
              payload: { kind: "SCENE_PHOTO", source_device_id: "PHONE-DISP-01", window_start_at: "2026-07-30T15:30:00Z", window_end_at: "2026-07-30T16:00:00Z", retention_deadline_at: "2026-09-30T00:00:00Z" }
              as: Dispatcher
              as_user_id: "disp-001"
              captures: { e_photo_id: $.data.id }
            - call: "POST /evidence-items/${e_tel_id}/preserve"
              payload: { preserved_copy_uri: "s3://evidence/2923/tel-77120.json", evidence_hash: "a1f0c3d5e7b90112" }
              as: SafetyAdmin
              as_user_id: "sa-001"
            - call: "POST /evidence-items/${e_cam_id}/preserve"
              payload: { preserved_copy_uri: "s3://evidence/2923/cam-f-77120.mp4", evidence_hash: "b2e1d4c6f8a01223" }
              as: SafetyAdmin
              as_user_id: "sa-001"
            - call: "POST /evidence-items/${e_eld_id}/preserve"
              payload: { preserved_copy_uri: "s3://evidence/2923/eld-77120.csv", evidence_hash: "c3d2e5b7a9f01334" }
              as: SafetyAdmin
              as_user_id: "sa-001"
            - call: "POST /review-cases"
              payload: { crash_id: "${c_id}", committee_name: "Ashland Preventability Committee", statement_waiver_reason: "driver hospitalised at intake; statement waived by the safety manager" }
              as: SafetyManager
              as_user_id: "sm-001"
              captures: { rc_id: $.data.id }
            - call: "POST /review-cases/${rc_id}/open-deliberation"
              payload: {}
              as: SafetyManager
              as_user_id: "sm-001"
              captures: { rc_v1: $.data.version }
            - call: "POST /review-cases/${rc_id}/votes"
              payload: { expected_review_case_version: "${rc_v1}", vote: "NON_PREVENTABLE", criterion_scores: { speed_and_spacing: 3, hazard_recognition: 3, vehicle_condition_precheck: 2, regulatory_compliance: 3, evasive_action: 2 }, comment: "following distance adequate for the load" }
              as: CommitteeMember
              as_user_id: "cm-001"
              captures: { rc_v2: $.data.version }
            - call: "POST /review-cases/${rc_id}/votes"
              payload: { expected_review_case_version: "${rc_v2}", vote: "NON_PREVENTABLE", criterion_scores: { speed_and_spacing: 2, hazard_recognition: 3, vehicle_condition_precheck: 3, regulatory_compliance: 2, evasive_action: 3 }, comment: "brake wear within spec" }
              as: CommitteeMember
              as_user_id: "cm-002"
              captures: { rc_v3: $.data.version }
            - call: "POST /review-cases/${rc_id}/votes"
              payload: { expected_review_case_version: "${rc_v3}", vote: "PREVENTABLE", criterion_scores: { speed_and_spacing: 4, hazard_recognition: 3, vehicle_condition_precheck: 2, regulatory_compliance: 3, evasive_action: 1 }, comment: "no evasive input recorded in the telematics" }
              as: CommitteeMember
              as_user_id: "cm-003"
              captures: { rc_v4: $.data.version }
          trigger:
            - call: "POST /review-cases/${rc_id}/decide"
              payload: {}
              as: SafetyManager
              as_user_id: "sm-001"
              captures: { det_1: $.data.determination, basis_1: $.data.decision_basis, score_1: $.data.committee_score, status_1: $.data.status }
            - call: "POST /review-cases/${rc_id}/appeal"
              payload: { appeal_grounds: "the committee was not given the reconstruction memo before voting", appeal_grounds_code: "PROCEDURAL" }
              as: SafetyManager
              as_user_id: "sm-002"
            - call: "POST /evidence-items/${e_photo_id}/purge"
              payload: { purge_reason: "scene photos auto-expired from the dispatcher handset before the hold letter issued" }
              as: SafetyAdmin
              as_user_id: "sa-001"
            - call: "POST /review-cases/${rc_id}/decide"
              payload: {}
              as: SafetyManager
              as_user_id: "sm-001"
              captures: { det_2: $.data.determination, basis_2: $.data.decision_basis, score_2: $.data.committee_score, status_2: $.data.status }
          assert:
            - "${basis_1} == UNWEIGHTED_MAJORITY (Crash.evidence_posture was COMPLETE at the first decide, selecting the unweighted_majority variant)"
            - "${det_1} == NON_PREVENTABLE (1 PREVENTABLE ballot against 2 NON_PREVENTABLE ballots)"
            - "${score_1} == 2.73"
            - "${status_1} == DECIDED and ReviewCase.${rc_id}.appeal_round was 0 at that moment"
            - "EvidenceItem.${e_photo_id}.preservation_state == PURGED_BEFORE_HOLD"
            - "Crash.${c_id}.evidence_posture == COMPROMISED (spoliation outranks the three still-preserved required kinds)"
            - "${basis_2} == WEIGHTED_CRITERIA"
            - "${det_2} == PREVENTABLE (committee_score 2.73 >= PREVENTABILITY_THRESHOLD 2.50)"
            - "${score_2} == 2.73 — byte-identical arithmetic to ${score_1} on the very same three ballots, so the divergence is caused only by the variant selector"
            - "${det_2} != ${det_1}"
            - "${status_2} == CLOSED_FINAL and Crash.${c_id}.appeals_exhausted == true (appeal_round 1 >= APPEAL_MAX_ROUNDS 1)"
            - "Crash.${c_id}.preventability_status == PREVENTABLE"
            - "GET /review-cases/${rc_id}/votes returns exactly 3 rows, every one with superseded == false, and weighted_member_score 2.75, 2.50, 2.95 in ascending sequence_number order"
            - "Driver.${d_id}.preventable_points == 8.0 and Driver.${d_id}.required_action_tier == SUSPENSION"

      - name: claim_reserve_provisional_refresh_vs_demand_based
        grounds:
          - calculations.claim_reserve
          - calculations.litigation_risk_score
          - entities.Claim.fields.provisional_reserve_cents
          - entities.Claim.fields.revised_reserve_cents
          - entities.Claim.fields.outstanding_reserve_cents
          - entities.Claim.fields.reserve_status
          - state_machines.Claim.PROVISIONAL_to_REVISED
          - state_machines.Claim.REVISED_to_REVISED
          - state_machines.Claim.SETUP_to_NEGOTIATION
          - validations[priority=64]
          - concurrency_rules[reserve-revision-stale-claim]
        distinguishing_aspect: |
          This instance's dual variant lives in the claims-financial entity
          domain (Claim + Demand money), not the safety-review domain: the
          provisional_at_setup variant reads the Crash severity ladder and
          returns 2,500,000 cents while the demand_weighted variant reads the
          Demand rows and returns 20,000,000 cents on exactly the same claim,
          a 17,500,000-cent delta produced only by the basis switch.
        test_recipe:
          setup:
            - "One Terminal, one long-tenure Driver, one MODERATE crash on 2026-07-30 with 0 transported injuries and 0 fatalities."
            - "No EvidenceItem at all, so Crash.evidence_posture is PARTIAL and litigation_risk_score is REPORTED(5) + PARTIAL(5) = 10, multiplier 1.00, counsel_required false."
            - "One Claim in handling_status SETUP / reserve_status PROVISIONAL whose provisional_reserve_cents was frozen at 2,500,000."
            - "Clock left at 2026-08-01T00:00:00Z."
          setup_api_calls:
            - call: "POST /terminals"
              payload: { name: "Brookville Terminal", terminal_code: "BRK01", region_code: "OH", annual_miles_millions: 4.0 }
              as: SafetyAdmin
              as_user_id: "sa-001"
              captures: { t_id: $.data.id }
            - call: "POST /drivers"
              payload: { terminal_id: "${t_id}", employee_code: "D-2001", full_name: "Ines Ruiz", cdl_number: "OH-CDL-2001", hire_date: "2018-06-11" }
              as: SafetyAdmin
              as_user_id: "sa-001"
              captures: { d_id: $.data.id }
            - call: "POST /crashes"
              payload: { driver_id: "${d_id}", terminal_id: "${t_id}", occurred_at: "2026-07-30T09:00:00Z", notified_at: "2026-07-30T09:45:00Z", location_text: "US-42 at Diamond Mill Rd", severity: "MODERATE", route_class: "REGIONAL", tow_away: false, tow_reason: "NONE", injury_transported_count: 0, fatality_count: 0, hazmat_release: false, mechanical_factor: false, third_party_at_fault: false }
              as: Dispatcher
              as_user_id: "disp-001"
              captures: { c_id: $.data.id }
            - call: "POST /claims"
              payload: { crash_id: "${c_id}", claimant_notice_date: "2026-07-31", adjuster_note: "third-party fence and gate damage reported by the property owner" }
              as: ClaimsAdjuster
              as_user_id: "adj-001"
              captures: { cl_id: $.data.id, cl_v1: $.data.version, prov_reserve: $.data.provisional_reserve_cents }
          trigger:
            - call: "POST /claims/${cl_id}/reserve-revisions"
              payload: { expected_claim_version: "${cl_v1}", basis: "PROVISIONAL_REFRESH", revision_note: "45-day file review, no new information" }
              as: ClaimsAdjuster
              as_user_id: "adj-001"
              captures: { rev_1: $.data.revised_reserve_cents, out_1: $.data.outstanding_reserve_cents, cl_v2: $.data.version }
            - call: "POST /claims/${cl_id}/demands"
              payload: { claimant_name: "Marcia Odell", claimant_type: "THIRD_PARTY_PROPERTY", demand_amount_cents: 20000000, represented_by_counsel: false, demand_received_at: "2026-07-31T12:00:00Z" }
              as: ClaimsAdjuster
              as_user_id: "adj-001"
              captures: { dm_id: $.data.id }
            - call: "GET /claims/${cl_id}"
              payload: {}
              as: ClaimsAdjuster
              as_user_id: "adj-001"
              captures: { cl_v3: $.data.version }
            - call: "POST /claims/${cl_id}/reserve-revisions"
              payload: { expected_claim_version: "${cl_v3}", basis: "DEMAND_BASED", revision_note: "written demand received, re-reserving to the demand" }
              as: ClaimsAdjuster
              as_user_id: "adj-001"
              captures: { rev_2: $.data.revised_reserve_cents, out_2: $.data.outstanding_reserve_cents, rs_2: $.data.reserve_status }
          assert:
            - "${prov_reserve} == 2500000 (SEVERITY_BASE_MODERATE_CENTS 2,500,000 + 0 injuries + 0 fatalities, x multiplier 1.00, no counsel loading, above PROVISIONAL_FLOOR_CENTS)"
            - "${rev_1} == 2500000 — the PROVISIONAL_REFRESH basis re-runs provisional_at_setup and reproduces the setup figure exactly"
            - "${out_1} == 2500000"
            - "${rev_2} == 20000000 — the DEMAND_BASED basis runs demand_weighted, which replaces the severity proxy with the single unsettled Demand's demand_amount_cents of 20,000,000 at multiplier 1.00"
            - "${out_2} == 20000000"
            - "${rev_2} - ${rev_1} == 17500000, a delta caused only by the variant switch: no crash field, no demand amount and no risk input changed between the two calls"
            - "Claim.${cl_id}.provisional_reserve_cents == 2500000 — frozen at setup and untouched by either revision"
            - "${rs_2} == REVISED and Claim.${cl_id}.handling_status == NEGOTIATION"
            - "Claim.${cl_id}.litigation_risk_score == 10 and Claim.${cl_id}.litigation_risk_multiplier == 1.00 and Claim.${cl_id}.counsel_required == false"
            - "Claim.${cl_id}.claim_exposure_cents == 20000000 (a reserve revision is the only operation that moves the conserved exposure)"

  # =========================================================================
  - rule_id: combinatorial_formula
    instances:

      - name: member_score_round_then_mean_ordering
        grounds:
          - calculations.preventability_determination
          - entities.CommitteeVote.fields.criterion_scores
          - entities.CommitteeVote.fields.weighted_member_score
          - entities.ReviewCase.fields.committee_score
          - entities.Crash.fields.mechanical_factor
          - validations[priority=6]
          - state_machines.ReviewCase.DELIBERATION_to_DELIBERATION
          - state_machines.ReviewCase.DELIBERATION_to_DECIDED
        distinguishing_aspect: |
          Mode (b) — nested rounding where the order of the two roundings
          changes the answer: rounding each of the three ballots to 2 decimals
          BEFORE averaging gives committee_score 2.72, averaging the unrounded
          raw scores and rounding once gives 2.73, and failing to renormalise
          the inapplicable vehicle_condition_precheck weight gives 2.32, so the
          three orderings are three distinguishable literals on one dataset.
        test_recipe:
          setup:
            - "One Terminal, one Driver, one SEVERE crash on 2026-07-30T14:00:00Z with mechanical_factor FALSE, so vehicle_condition_precheck is inapplicable and the weighted denominator is 0.85, not 1.00."
            - "All three SEVERE-required EvidenceItem kinds (TELEMATICS_SNAPSHOT, FORWARD_CAMERA, ELD_LOG) PRESERVED with windows bracketing the crash instant, so Crash.evidence_posture is COMPLETE."
            - "One ReviewCase in DELIBERATION with three non-superseded PREVENTABLE ballots whose criterion_scores all carry vehicle_condition_precheck 0: (0,3,0,2,4), (2,3,0,3,4) and (4,3,0,4,3) in speed / hazard / vehicle / regulatory / evasive order."
            - "Clock left at 2026-08-01T00:00:00Z."
          setup_api_calls:
            - call: "POST /terminals"
              payload: { name: "Corydon Terminal", terminal_code: "CRY01", region_code: "IN", annual_miles_millions: 4.0 }
              as: SafetyAdmin
              as_user_id: "sa-001"
              captures: { t_id: $.data.id }
            - call: "POST /drivers"
              payload: { terminal_id: "${t_id}", employee_code: "D-3001", full_name: "Owen Marsh", cdl_number: "IN-CDL-3001", hire_date: "2017-02-20" }
              as: SafetyAdmin
              as_user_id: "sa-001"
              captures: { d_id: $.data.id }
            - call: "POST /crashes"
              payload: { driver_id: "${d_id}", terminal_id: "${t_id}", occurred_at: "2026-07-30T14:00:00Z", notified_at: "2026-07-30T14:20:00Z", location_text: "I-64 MM 105 westbound", severity: "SEVERE", route_class: "LINEHAUL", tow_away: true, tow_reason: "DISABLING_DAMAGE", injury_transported_count: 1, fatality_count: 0, hazmat_release: false, mechanical_factor: false, third_party_at_fault: false }
              as: Dispatcher
              as_user_id: "disp-001"
              captures: { c_id: $.data.id }
            - call: "POST /crashes/${c_id}/evidence-items"
              payload: { kind: "TELEMATICS_SNAPSHOT", source_device_id: "ELD-30110", window_start_at: "2026-07-30T13:30:00Z", window_end_at: "2026-07-30T14:30:00Z", retention_deadline_at: "2026-09-30T00:00:00Z" }
              as: Dispatcher
              as_user_id: "disp-001"
              captures: { e_tel_id: $.data.id }
            - call: "POST /crashes/${c_id}/evidence-items"
              payload: { kind: "FORWARD_CAMERA", source_device_id: "CAM-F-30110", window_start_at: "2026-07-30T13:30:00Z", window_end_at: "2026-07-30T14:30:00Z", retention_deadline_at: "2026-09-30T00:00:00Z" }
              as: Dispatcher
              as_user_id: "disp-001"
              captures: { e_cam_id: $.data.id }
            - call: "POST /crashes/${c_id}/evidence-items"
              payload: { kind: "ELD_LOG", source_device_id: "ELD-30110", window_start_at: "2026-07-30T13:30:00Z", window_end_at: "2026-07-30T14:30:00Z", retention_deadline_at: "2026-09-30T00:00:00Z" }
              as: Dispatcher
              as_user_id: "disp-001"
              captures: { e_eld_id: $.data.id }
            - call: "POST /evidence-items/${e_tel_id}/preserve"
              payload: { preserved_copy_uri: "s3://evidence/2923b/tel-30110.json", evidence_hash: "1122334455667788" }
              as: SafetyAdmin
              as_user_id: "sa-001"
            - call: "POST /evidence-items/${e_cam_id}/preserve"
              payload: { preserved_copy_uri: "s3://evidence/2923b/cam-30110.mp4", evidence_hash: "223344556677889a" }
              as: SafetyAdmin
              as_user_id: "sa-001"
            - call: "POST /evidence-items/${e_eld_id}/preserve"
              payload: { preserved_copy_uri: "s3://evidence/2923b/eld-30110.csv", evidence_hash: "33445566778899ab" }
              as: SafetyAdmin
              as_user_id: "sa-001"
            - call: "POST /review-cases"
              payload: { crash_id: "${c_id}", committee_name: "Corydon Preventability Committee", statement_waiver_reason: "driver on FMLA leave; statement waived" }
              as: SafetyManager
              as_user_id: "sm-001"
              captures: { rc_id: $.data.id }
            - call: "POST /review-cases/${rc_id}/open-deliberation"
              payload: {}
              as: SafetyManager
              as_user_id: "sm-001"
              captures: { rc_v1: $.data.version }
            - call: "POST /review-cases/${rc_id}/votes"
              payload: { expected_review_case_version: "${rc_v1}", vote: "PREVENTABLE", criterion_scores: { speed_and_spacing: 0, hazard_recognition: 3, vehicle_condition_precheck: 0, regulatory_compliance: 2, evasive_action: 4 }, comment: "speed was not a factor at all" }
              as: CommitteeMember
              as_user_id: "cm-001"
              captures: { rc_v2: $.data.version }
            - call: "POST /review-cases/${rc_id}/votes"
              payload: { expected_review_case_version: "${rc_v2}", vote: "PREVENTABLE", criterion_scores: { speed_and_spacing: 2, hazard_recognition: 3, vehicle_condition_precheck: 0, regulatory_compliance: 3, evasive_action: 4 }, comment: "moderate speed contribution" }
              as: CommitteeMember
              as_user_id: "cm-002"
              captures: { rc_v3: $.data.version }
            - call: "POST /review-cases/${rc_id}/votes"
              payload: { expected_review_case_version: "${rc_v3}", vote: "PREVENTABLE", criterion_scores: { speed_and_spacing: 4, hazard_recognition: 3, vehicle_condition_precheck: 0, regulatory_compliance: 4, evasive_action: 3 }, comment: "clear overdriving of the conditions" }
              as: CommitteeMember
              as_user_id: "cm-003"
              captures: { rc_v4: $.data.version }
          trigger:
            - call: "POST /review-cases/${rc_id}/decide"
              payload: {}
              as: SafetyManager
              as_user_id: "sm-001"
              captures: { score: $.data.committee_score, basis: $.data.decision_basis, det: $.data.determination }
          assert:
            - "GET /review-cases/${rc_id}/votes returns three rows whose weighted_member_score values are exactly 1.82, 2.76 and 3.59 in ascending sequence_number order (raw 1.82352941, 2.76470588 and 3.58823529, each rounded half-up to 2 decimals at vote time)"
            - "${score} == 2.72 — round_half_up((1.82 + 2.76 + 3.59) / 3, 2)"
            - "${score} != 2.73, which is what averaging the unrounded raw scores (8.17647.../3 = 2.72549...) would have produced"
            - "${score} != 2.32, which is what scoring vehicle_condition_precheck as 0 against its full 0.15 weight instead of renormalising the denominator to 0.85 would have produced (1.55, 2.35, 3.05 -> 2.3166... -> 2.32)"
            - "${basis} == UNWEIGHTED_MAJORITY and ${det} == PREVENTABLE (3 PREVENTABLE ballots, 0 against)"
            - "Crash.${c_id}.preventability_status == PREVENTABLE and Crash.${c_id}.evidence_posture == COMPLETE"

      - name: alae_tier_keyed_on_indemnity_then_total
        grounds:
          - calculations.settlement_layer_waterfall
          - calculations.claim_reserve
          - entities.Demand.fields.alae_cents
          - entities.Demand.fields.settlement_total_cents
          - entities.Claim.fields.sir_eroded_cents
          - entities.Claim.fields.layer_allocations
          - entities.PolicyLayer.fields.limit_cents
          - state_machines.Demand.OFFER_OUTSTANDING_to_SETTLED
          - state_machines.Claim.NEGOTIATION_to_SETTLEMENT_COMPLETE
          - validations[priority=53]
        distinguishing_aspect: |
          Mode (c) — a circular-looking dependency with a pinned evaluation
          order: settlement_total_cents depends on alae_cents while the ALAE
          rate tier looks like it depends on the total, and the scaffold pins
          the tier to the INDEMNITY ALONE, so an offer of 4,900,000 sits in the
          0.08 tier for ALAE 392,000 and a total of 5,292,000, whereas keying
          the tier on the resulting total (5,292,000 >= 5,000,000) would
          self-fulfillingly yield 0.12, ALAE 588,000 and a total of 5,488,000.
        test_recipe:
          setup:
            - "One Terminal, one Driver, one MODERATE crash on 2026-07-30 (program year 2026)."
            - "A well-formed single-layer 2026 tower: layer_index 1, layer_type SIR, attachment_point_cents 0, limit_cents 10,000,000."
