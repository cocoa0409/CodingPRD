scaffold_difficulty_design:

  # ---------------------------------------------------------------------------
  # Rule 1 - dual-variant calculations across different entity domains
  # ---------------------------------------------------------------------------
  - rule_id: dual_variant_calc
    instances:
      - name: catalog_variant_divergence_on_degree_audit
        grounds:
          - calculations.degree_applicable_credit_audit
          - calculations.progress_benchmark_evaluation
          - entities.DegreeApplicabilityRule.fields.effective_catalog_year
          - entities.StudentAthlete.fields.degree_applicable_credits
        distinguishing_aspect: |
          This variant pair lives on the coursework/credit-accounting domain
          (Enrollment x DegreeApplicabilityRule): the same two completed enrollments
          yield degree_applicable_credits 12.00 under CATALOG_AT_ENTRY and 6.00 under
          CATALOG_AT_CERTIFICATION, a different entity domain from the risk-scoring
          variant pair, which is computed on StudentAthlete academic-risk fields.
        test_recipe:
          setup:
            - "Terms 2026FA (term_index 1, catalog_year 2026) and 2027SP (term_index 2, catalog_year 2027) exist with apr_status OPEN."
            - "DegreeProgram BSKINE has catalog_year 2026 and total_required_credits 60.00, min_progress_gpa 2.00 (default)."
            - "KINE-101 (12 credit hours) is CORE for effective_catalog_year 2026 and NOT_APPLICABLE for 2027; HIST-210 (6 credit hours) is NOT_APPLICABLE for 2026 and CORE for 2027."
            - "Student S1 has entry_term_index 1, entry_catalog_year 2026, declared_program_id = BSKINE."
            - "S1 completed KINE-101 with grade B in 2026FA and HIST-210 with grade B in 2027SP, so cumulative_gpa == 3.00 and completed_full_time_terms == 1 (only 2026FA reaches the 12-credit full-time minimum)."
          setup_api_calls:
            - call: "POST /athletics/_clock/set_current_utc"
              payload: { current_utc: "2026-09-01T00:00:00Z" }
              as: Registrar
            - call: "POST /athletics/terms"
              payload: { code: "2026FA", term_index: 1, term_type: "FALL", catalog_year: 2026, start_date: "2026-08-24T00:00:00Z", end_date: "2026-12-18T00:00:00Z" }
              as: Registrar
              captures: { term1_id: $.data.id }
            - call: "POST /athletics/terms"
              payload: { code: "2027SP", term_index: 2, term_type: "SPRING", catalog_year: 2027, start_date: "2027-01-11T00:00:00Z", end_date: "2027-05-14T00:00:00Z" }
              as: Registrar
              captures: { term2_id: $.data.id }
            - call: "POST /athletics/degree-programs"
              payload: { code: "BSKINE", name: "BS Kinesiology", catalog_year: 2026, total_required_credits: 60.00 }
              as: Registrar
              captures: { prog_id: $.data.id }
            - call: "POST /athletics/courses"
              payload: { subject_code: "KINE", course_number: "101", title: "Foundations of Kinesiology", credit_hours: 12.00, instructor_user_id: "instr_kine_1" }
              as: Registrar
              captures: { kine_id: $.data.id }
            - call: "POST /athletics/courses"
              payload: { subject_code: "HIST", course_number: "210", title: "Modern World History", credit_hours: 6.00, instructor_user_id: "instr_hist_1" }
              as: Registrar
              captures: { hist_id: $.data.id }
            - call: "POST /athletics/degree-applicability-rules"
              payload: { degree_program_id: "${prog_id}", course_id: "${kine_id}", effective_catalog_year: 2026, applicability: "CORE" }
              as: Registrar
            - call: "POST /athletics/degree-applicability-rules"
              payload: { degree_program_id: "${prog_id}", course_id: "${kine_id}", effective_catalog_year: 2027, applicability: "NOT_APPLICABLE" }
              as: Registrar
            - call: "POST /athletics/degree-applicability-rules"
              payload: { degree_program_id: "${prog_id}", course_id: "${hist_id}", effective_catalog_year: 2026, applicability: "NOT_APPLICABLE" }
              as: Registrar
            - call: "POST /athletics/degree-applicability-rules"
              payload: { degree_program_id: "${prog_id}", course_id: "${hist_id}", effective_catalog_year: 2027, applicability: "CORE" }
              as: Registrar
            - call: "POST /athletics/student-athletes"
              payload: { full_name: "Sam One", sport_code: "MBB", entry_term_index: 1, entry_catalog_year: 2026 }
              as: Registrar
              captures: { s1_id: $.data.id }
            - call: "POST /athletics/student-athletes/${s1_id}/major-declaration"
              payload: { declared_program_id: "${prog_id}", term_id: "${term1_id}" }
              as: Registrar
            - call: "POST /athletics/enrollments"
              payload: { student_athlete_id: "${s1_id}", course_id: "${kine_id}", term_id: "${term1_id}" }
              as: Registrar
              captures: { e_kine_id: $.data.id }
            - call: "POST /athletics/enrollments/${e_kine_id}/outcome"
              payload: { action: "RECORD_GRADE", grade: "B" }
              as: Registrar
            - call: "POST /athletics/_clock/set_current_utc"
              payload: { current_utc: "2027-02-01T00:00:00Z" }
              as: Registrar
            - call: "POST /athletics/enrollments"
              payload: { student_athlete_id: "${s1_id}", course_id: "${hist_id}", term_id: "${term2_id}" }
              as: Registrar
              captures: { e_hist_id: $.data.id }
            - call: "POST /athletics/enrollments/${e_hist_id}/outcome"
              payload: { action: "RECORD_GRADE", grade: "B" }
              as: Registrar
          trigger:
            - call: "GET /athletics/student-athletes/${s1_id}/eligibility-summary"
              payload: { audit_variant: "CATALOG_AT_ENTRY" }
              as: CertificationOfficer
            - call: "GET /athletics/student-athletes/${s1_id}/eligibility-summary"
              payload: { audit_variant: "CATALOG_AT_CERTIFICATION" }
              as: CertificationOfficer
          assert:
            - "The CATALOG_AT_ENTRY eligibility-summary response has degree_applicable_credits == 12.00 and progress_pct == 0.2000"
            - "The CATALOG_AT_CERTIFICATION eligibility-summary response has degree_applicable_credits == 6.00 and progress_pct == 0.1000"
            - "Both responses have cumulative_gpa == 3.00"
            - "Both responses have completed_full_time_terms == 1, required_progress_pct == 0.0000 and benchmark_result == PASS"
            - "The two responses differ: CATALOG_AT_ENTRY degree_applicable_credits (12.00) != CATALOG_AT_CERTIFICATION degree_applicable_credits (6.00)"

      - name: risk_score_variant_divergence_term_snapshot_vs_cumulative
        grounds:
          - calculations.academic_risk_score
          - calculations.academic_standing_rollup
          - entities.StudentAthlete.fields.risk_score
          - entities.StudentAthlete.fields.risk_tier
        distinguishing_aspect: |
          This variant pair lives on the StudentAthlete academic-risk domain, not on the
          credit audit: with cumulative_gpa 0.80 but a 4.00 latest-term GPA, TERM_SNAPSHOT
          scores risk_score 0.00 / TIER_1 while CUMULATIVE scores 26.09 / TIER_2 from the
          identical enrollment set.
        test_recipe:
          setup:
            - "Terms 2026FA (term_index 1) and 2027SP (term_index 2) exist and are OPEN with full_time_credit_minimum 12."
            - "Student S2 has no declared_program_id, so progress_pct and required_progress_pct are both 0.0000 and contribute no risk points."
            - "S2 completed two 12-credit courses with grade F in 2026FA and one 6-credit course with grade A in 2027SP."
            - "S2.cumulative_gpa == 0.80 (24.00 quality points over 30.00 attempted credits) and S2.completed_full_time_terms == 1, which is below RISK_CUMULATIVE_MIN_TERMS (2), so TERM_SNAPSHOT is the default variant and CUMULATIVE must be requested explicitly."
            - "S2 has missed_class_units_charged 0.00 and no ComplianceIncident rows."
          setup_api_calls:
            - call: "POST /athletics/_clock/set_current_utc"
              payload: { current_utc: "2026-09-01T00:00:00Z" }
              as: Registrar
            - call: "POST /athletics/terms"
              payload: { code: "2026FA", term_index: 1, term_type: "FALL", catalog_year: 2026, start_date: "2026-08-24T00:00:00Z", end_date: "2026-12-18T00:00:00Z" }
              as: Registrar
              captures: { term1_id: $.data.id }
            - call: "POST /athletics/terms"
              payload: { code: "2027SP", term_index: 2, term_type: "SPRING", catalog_year: 2027, start_date: "2027-01-11T00:00:00Z", end_date: "2027-05-14T00:00:00Z" }
              as: Registrar
              captures: { term2_id: $.data.id }
            - call: "POST /athletics/courses"
              payload: { subject_code: "MATH", course_number: "110", title: "College Algebra", credit_hours: 12.00, instructor_user_id: "instr_math_1" }
              as: Registrar
              captures: { math_id: $.data.id }
            - call: "POST /athletics/courses"
              payload: { subject_code: "CHEM", course_number: "120", title: "General Chemistry", credit_hours: 12.00, instructor_user_id: "instr_chem_1" }
              as: Registrar
              captures: { chem_id: $.data.id }
            - call: "POST /athletics/courses"
              payload: { subject_code: "ARTS", course_number: "130", title: "Studio Drawing", credit_hours: 6.00, instructor_user_id: "instr_arts_1" }
              as: Registrar
              captures: { arts_id: $.data.id }
            - call: "POST /athletics/student-athletes"
              payload: { full_name: "Sam Two", sport_code: "WBB", entry_term_index: 1, entry_catalog_year: 2026 }
              as: Registrar
              captures: { s2_id: $.data.id }
            - call: "POST /athletics/enrollments"
              payload: { student_athlete_id: "${s2_id}", course_id: "${math_id}", term_id: "${term1_id}" }
              as: Registrar
              captures: { e_math_id: $.data.id }
            - call: "POST /athletics/enrollments/${e_math_id}/outcome"
              payload: { action: "RECORD_GRADE", grade: "F" }
              as: Registrar
            - call: "POST /athletics/enrollments"
              payload: { student_athlete_id: "${s2_id}", course_id: "${chem_id}", term_id: "${term1_id}" }
              as: Registrar
              captures: { e_chem_id: $.data.id }
            - call: "POST /athletics/enrollments/${e_chem_id}/outcome"
              payload: { action: "RECORD_GRADE", grade: "F" }
              as: Registrar
            - call: "POST /athletics/_clock/set_current_utc"
              payload: { current_utc: "2027-02-01T00:00:00Z" }
              as: Registrar
            - call: "POST /athletics/enrollments"
              payload: { student_athlete_id: "${s2_id}", course_id: "${arts_id}", term_id: "${term2_id}" }
              as: Registrar
              captures: { e_arts_id: $.data.id }
            - call: "POST /athletics/enrollments/${e_arts_id}/outcome"
              payload: { action: "RECORD_GRADE", grade: "A" }
              as: Registrar
          trigger:
            - call: "GET /athletics/student-athletes/${s2_id}/eligibility-summary"
              payload: { risk_variant: "TERM_SNAPSHOT" }
              as: LearningSpecialist
            - call: "GET /athletics/student-athletes/${s2_id}/eligibility-summary"
              payload: { risk_variant: "CUMULATIVE" }
              as: LearningSpecialist
          assert:
            - "The TERM_SNAPSHOT eligibility-summary response has risk_score == 0.00 and risk_tier == TIER_1"
            - "The CUMULATIVE eligibility-summary response has risk_score == 26.09 and risk_tier == TIER_2"
            - "Both responses have cumulative_gpa == 0.80 and completed_full_time_terms == 1"
            - "Both responses have required_progress_pct == 0.0000 and progress_pct == 0.0000"
            - "The two responses differ: TERM_SNAPSHOT risk_score (0.00) != CUMULATIVE risk_score (26.09)"

  # ---------------------------------------------------------------------------
  # Rule 2 - combinatorial formulas across different modes
  # ---------------------------------------------------------------------------
  - rule_id: combinatorial_formula
    instances:
      - name: missed_units_round_per_meeting_then_sum
        grounds:
          - calculations.missed_class_units
          - entities.MissedClassRequest.fields.missed_units_gross
          - entities.MissedClassRequest.fields.missed_units
          - entities.Course.fields.meeting_duration_minutes
        distinguishing_aspect: |
          Mode (b) nested-rounding order: three 50-minute meetings round to 0.83 units each
          and then sum to missed_units_gross 2.49, whereas summing the 150 raw overlap
          minutes first and rounding once yields 2.50 - the scaffold pins per-occurrence
          rounding, so 2.49 is the only correct answer.
        test_recipe:
          setup:
            - "Term 2026FA (term_index 1) runs 2026-08-24T00:00:00Z to 2026-12-18T00:00:00Z and is OPEN."
            - "Course SOCI-150 meets on ISO weekdays [1, 3, 5] starting at minute 600 UTC for 50 minutes, instructor_user_id instr_soc_1."
            - "Student S3 is enrolled in SOCI-150 in 2026FA with status ENROLLED and has missed_class_units_allowance 9.00 with 0.00 charged."
            - "CompetitionEvent EV1 is a REGULAR_SEASON event (missed_class_unit_multiplier 1.0) travelling 2026-09-14T08:00:00Z to 2026-09-19T00:00:00Z and is in status TRAVEL_APPROVED."
            - "The travel window covers exactly the Monday 2026-09-14, Wednesday 2026-09-16 and Friday 2026-09-18 meetings, each fully overlapped for 50 minutes."
            - "The logical clock is 2026-09-01T00:00:00Z."
          setup_api_calls:
            - call: "POST /athletics/_clock/set_current_utc"
              payload: { current_utc: "2026-09-01T00:00:00Z" }
              as: Registrar
            - call: "POST /athletics/terms"
              payload: { code: "2026FA", term_index: 1, term_type: "FALL", catalog_year: 2026, start_date: "2026-08-24T00:00:00Z", end_date: "2026-12-18T00:00:00Z" }
              as: Registrar
              captures: { term1_id: $.data.id }
            - call: "POST /athletics/courses"
              payload: { subject_code: "SOCI", course_number: "150", title: "Introduction to Sociology", credit_hours: 3.00, instructor_user_id: "instr_soc_1", meeting_days: [1, 3, 5], meeting_start_minute_utc: 600, meeting_duration_minutes: 50 }
              as: Registrar
              captures: { soci_id: $.data.id }
            - call: "POST /athletics/student-athletes"
              payload: { full_name: "Sam Three", sport_code: "MBB", entry_term_index: 1, entry_catalog_year: 2026 }
              as: Registrar
              captures: { s3_id: $.data.id }
            - call: "POST /athletics/enrollments"
              payload: { student_athlete_id: "${s3_id}", course_id: "${soci_id}", term_id: "${term1_id}" }
              as: Registrar
              captures: { e3_id: $.data.id }
            - call: "POST /athletics/competition-events"
              payload: { sport_code: "MBB", term_id: "${term1_id}", event_type: "REGULAR_SEASON", departure_at: "2026-09-14T08:00:00Z", return_at: "2026-09-19T00:00:00Z" }
              as: AthleticsOperations
              captures: { ev1_id: $.data.id }
            - call: "POST /athletics/competition-events/${ev1_id}/status"
              payload: { action: "APPROVE_TRAVEL" }
              as: AthleticsOperations
          trigger:
            - call: "POST /athletics/missed-class-requests"
              payload: { competition_event_id: "${ev1_id}", enrollment_id: "${e3_id}" }
              as: AcademicAdvisor
              captures: { req1_id: $.data.id }
          assert:
            - "MissedClassRequest.${req1_id}.missed_meeting_count == 3"
            - "MissedClassRequest.${req1_id}.missed_units_gross == 2.49"
            - "MissedClassRequest.${req1_id}.missed_units == 2.49"
            - "MissedClassRequest.${req1_id}.missed_units != 2.50 (the sum-then-round order is wrong)"
            - "MissedClassRequest.${req1_id}.status == DRAFT"
            - "StudentAthlete.${s3_id}.missed_class_units_charged == 2.49"
            - "StudentAthlete.${s3_id}.missed_class_units_remaining == 6.51"
            - "CompetitionEvent.${ev1_id}.charged_units_total == 2.49"

      - name: study_hall_tutor_credit_cap_from_gross_bracket
        grounds:
          - calculations.support_requirement_hours
          - calculations.academic_risk_score
          - state_machines.TutorAssignment.transitions.PROPOSED_to_ACTIVE
          - entities.StudentAthlete.fields.required_study_hall_hours
        distinguishing_aspect: |
          Mode (a) non-linear interaction of four inputs with a nested min/max and a
          bracket selection: base_hours 8.0 (TIER_3) plus travel_offset 2 gives gross_hours
          10.0, which selects TUTOR_CREDIT_CAP_HIGH 4.0 from the GROSS bracket, so
          required_study_hall_hours == 6.0; selecting the bracket after the tutor credit
          would pick the LOW cap 2.0 and wrongly yield 8.0.
        test_recipe:
          setup:
            - "Term 2026FA (term_index 1) runs 2026-08-24T00:00:00Z to 2026-12-18T00:00:00Z and is OPEN."
            - "Course SOCI-150 meets on ISO weekdays [1, 3, 5] at minute 600 UTC for 180 minutes, instructor_user_id instr_soc_1."
            - "Student S4 has no declared_program_id and no COMPLETED enrollment, so cumulative_gpa is 0.00 and progress contributes 0 risk points."
            - "S4 has one MissedClassRequest charging 6.00 units (two 180-minute meetings at 3.00 units each) against a 9.00 allowance, so risk_score == 53.33 and risk_tier == TIER_3 and support_status == SUPPORT_MANDATED."
            - "Tutor T1 has subject_codes [\"SOCI\"], max_weekly_hours 20.00 (default) and status TRAINED."
            - "TutorAssignment A1 links T1 to S4's SOCI-150 enrollment with weekly_hours 8.00, exactly at TIER_WEEKLY_HOUR_CAP[TIER_3], and is still PROPOSED."
          setup_api_calls:
            - call: "POST /athletics/_clock/set_current_utc"
              payload: { current_utc: "2026-09-01T00:00:00Z" }
              as: Registrar
            - call: "POST /athletics/terms"
              payload: { code: "2026FA", term_index: 1, term_type: "FALL", catalog_year: 2026, start_date: "2026-08-24T00:00:00Z", end_date: "2026-12-18T00:00:00Z" }
              as: Registrar
              captures: { term1_id: $.data.id }
            - call: "POST /athletics/courses"
              payload: { subject_code: "SOCI", course_number: "150", title: "Introduction to Sociology", credit_hours: 3.00, instructor_user_id: "instr_soc_1", meeting_days: [1, 3, 5], meeting_start_minute_utc: 600, meeting_duration_minutes: 180 }
              as: Registrar
              captures: { soci_id: $.data.id }
            - call: "POST /athletics/student-athletes"
              payload: { full_name: "Sam Four", sport_code: "FB", entry_term_index: 1, entry_catalog_year: 2026 }
              as: Registrar
              captures: { s4_id: $.data.id }
            - call: "POST /athletics/enrollments"
              payload: { student_athlete_id: "${s4_id}", course_id: "${soci_id}", term_id: "${term1_id}" }
              as: Registrar
              captures: { e4_id: $.data.id }
            - call: "POST /athletics/competition-events"
              payload: { sport_code: "FB", term_id: "${term1_id}", event_type: "REGULAR_SEASON", departure_at: "2026-09-14T08:00:00Z", return_at: "2026-09-17T00:00:00Z" }
              as: AthleticsOperations
              captures: { ev2_id: $.data.id }
            - call: "POST /athletics/competition-events/${ev2_id}/status"
              payload: { action: "APPROVE_TRAVEL" }
              as: AthleticsOperations
            - call: "POST /athletics/missed-class-requests"
              payload: { competition_event_id: "${ev2_id}", enrollment_id: "${e4_id}" }
              as: AcademicAdvisor
              captures: { req2_id: $.data.id }
            - call: "POST /athletics/tutors"
              payload: { full_name: "Tia Tutor", subject_codes: ["SOCI"] }
              as: LearningSpecialist
              captures: { t1_id: $.data.id }
            - call: "POST /athletics/tutors/${t1_id}/status"
              payload: { action: "COMPLETE_TRAINING", term_id: "${term1_id}" }
              as: LearningSpecialist
            - call: "POST /athletics/tutor-assignments"
              payload: { tutor_id: "${t1_id}", enrollment_id: "${e4_id}", weekly_hours: 8.00 }
              as: LearningSpecialist
              captures: { a1_id: $.data.id }
          trigger:
            - call: "POST /athletics/tutor-assignments/${a1_id}/status"
              payload: { action: "ACTIVATE" }
              as: LearningSpecialist
          assert:
            - "TutorAssignment.${a1_id}.status == ACTIVE"
            - "Tutor.${t1_id}.assigned_weekly_hours == 8.00"
            - "StudentAthlete.${s4_id}.missed_class_units_charged == 6.00"
            - "StudentAthlete.${s4_id}.risk_score == 53.33 and StudentAthlete.${s4_id}.risk_tier == TIER_3"
            - "StudentAthlete.${s4_id}.required_study_hall_hours == 6.0"
            - "StudentAthlete.${s4_id}.required_study_hall_hours != 8.0 (the post-credit bracket selection is wrong)"
            - "StudentAthlete.${s4_id}.support_status == SUPPORT_MANDATED"

  # ---------------------------------------------------------------------------
  # Rule 3 - non-linear state-machine shapes on different entities
  # ---------------------------------------------------------------------------
  - rule_id: non_linear_state_machine
    instances:
      - name: certification_revoke_restore_cycle
        grounds:
          - state_machines.EligibilityCertification.transitions.CERTIFIED_to_REVOKED
          - state_machines.EligibilityCertification.transitions.REVOKED_to_RESTORED
          - state_machines.EligibilityCertification.transitions.RESTORED_to_REVOKED
          - state_machines.EligibilityAppeal.transitions.COMMITTEE_REVIEW_to_GRANTED
        distinguishing_aspect: |
          The cycle sits on EligibilityCertification: one row visits REVOKED twice
          (CERTIFIED -> REVOKED -> RESTORED -> REVOKED), which no linear pipeline can
          produce; this is a different entity from the EligibilityAppeal revision loop
          and from the StudentAthlete parallel-dimension instance.
        test_recipe:
          setup:
            - "Term 2026FA (term_index 1, catalog_year 2026) is OPEN; DegreeProgram BSKINE has total_required_credits 60.00 and min_progress_gpa 2.00."
            - "KINE-101 (12 credit hours) is CORE for effective_catalog_year 2026."
            - "Student S5 entered at term_index 1 under catalog 2026, declared BSKINE in 2026FA, and completed KINE-101 with grade B, so cumulative_gpa == 3.00, completed_full_time_terms == 1 and degree_applicable_credits == 12.00."
            - "Certification C5 (INITIAL, 2026FA) was requested by user co_requester, submitted by adv_1, certified by co_decider (benchmark_result PASS) and then revoked, so C5.status == REVOKED and S5.eligibility_state == INELIGIBLE."
            - "Appeal AP5 (PROGRESS_WAIVER, requested_credit_relief 0.00) was submitted by adv_1 and is in status COMMITTEE_REVIEW."
          setup_api_calls:
            - call: "POST /athletics/_clock/set_current_utc"
              payload: { current_utc: "2026-09-01T00:00:00Z" }
              as: Registrar
            - call: "POST /athletics/terms"
              payload: { code: "2026FA", term_index: 1, term_type: "FALL", catalog_year: 2026, start_date: "2026-08-24T00:00:00Z", end_date: "2026-12-18T00:00:00Z" }
              as: Registrar
              captures: { term1_id: $.data.id }
            - call: "POST /athletics/degree-programs"
              payload: { code: "BSKINE", name: "BS Kinesiology", catalog_year: 2026, total_required_credits: 60.00 }
              as: Registrar
              captures: { prog_id: $.data.id }
            - call: "POST /athletics/courses"
              payload: { subject_code: "KINE", course_number: "101", title: "Foundations of Kinesiology", credit_hours: 12.00, instructor_user_id: "instr_kine_1" }
              as: Registrar
              captures: { kine_id: $.data.id }
            - call: "POST /athletics/degree-applicability-rules"
              payload: { degree_program_id: "${prog_id}", course_id: "${kine_id}", effective_catalog_year: 2026, applicability: "CORE" }
              as: Registrar
            - call: "POST /athletics/student-athletes"
              payload: { full_name: "Sam Five", sport_code: "MBB", entry_term_index: 1, entry_catalog_year: 2026 }
