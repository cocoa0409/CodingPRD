              captures: { e_unsigned: $.data.error_id }
            - call: "POST /outing-ops/contracts/${c1_id}/lifecycle"
              payload: { action: "SIGN" }
              as: CourseOperations
            - call: "POST /outing-ops/outings/${o1_id}/play-transition"
              payload: { action: "OPEN_REGISTRATION" }
              as: TournamentDirector
              captures: { e_no_tier: $.data.error_id }
            - call: "POST /outing-ops/package-tiers"
