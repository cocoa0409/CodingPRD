            - "RegrindPool.${pool_fd}.cumulative_in_kg == 587.920"
            - "RegrindPool.${pool_fd}.available_kg == 587.920"
            - "RegrindPool.${pool_fd}.embedded_pcr_pct == 0.000"
            - "GET /bag-lots/${bl1} -> the four seal_specimens rows carry attempt 1,1,1,2 with is_retest false,false,false,true"
  - rule_id: combinatorial_formula
    instances:
      - name: strength_index_min_of_family_and_regrind_factors_neither_binds
        grounds:
          - calculations.blend_property_indices
          - entities.BlendRecipe.fields.strength_index
          - entities.BlendRecipe.fields.clarity_index
          - entities.BlendRecipe.fields.slip_index
        distinguishing_aspect: |
          Mode (a): the strength formula multiplies dart_base by min(family_factor, regrind_factor)
          and by additive_boost; on R-FD-1 hdpe_pct is 0.000 and regrind_pct is 0.000 so BOTH
          factors sit at their unpenalised 1.000 and the only surviving term is the single-additive
          boost of 1.020, giving 36.9 x 1.000 x 1.020 = 37.64 -- a scaffold that multiplied the two
          penalties instead of taking the binding one would still land here, which is exactly why
          the companion instance drives the other branch of the same min().
        test_recipe:
          setup:
            - "food-contact product P-FD-1 (required_layer_count 3, min_strength_index 30.0)"
            - "resin grades LL-1001, EV-4004 (barrier), TI-5005 (tie) and additive masterbatch AD-6006 registered"
            - "DRAFT recipe R-FD-1 already carrying layer 1 = 30 % LL-1001, layer 2 = 2.5 % EV-4004 + 7.5 % TI-5005, layer 3 = 50 % LL-1001"
          setup_api_calls:
            - *a_clock_d1_0600
            - *a_p_fd
            - *a_g_ll
            - *a_g_ev
            - *a_g_ti
            - *a_g_ad
            - *a_r1_new
            - *a_r1_c1
            - *a_r1_c2
            - *a_r1_c3
            - *a_r1_c4
          trigger:
