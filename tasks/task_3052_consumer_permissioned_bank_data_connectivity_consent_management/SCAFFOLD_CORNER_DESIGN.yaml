            - call: "POST /connections/${conn_id}/refresh"
              payload: { kind: "FULL" }
              as: Consumer
              as_user_id: cons_y
            - call: "POST /connections/${conn_id}/refresh"
              payload: { kind: "FULL" }
              as: Consumer
              as_user_id: cons_y
            - call: "POST /connections/${conn_id}/refresh"
              payload: { kind: "FULL" }
              as: Consumer
              as_user_id: cons_y
