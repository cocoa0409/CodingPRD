              as: Court
              captures: { err: $.data.error_id }
          assert:
            - "${err} == ERR_DUPLICATE_CASE_NUMBER"

      - name: second_same_role_engagement_rejected
        claim_type: violation_to_error
        grounds: ["validations[priority=10]", "errors[ERR_ENGAGEMENT_ALREADY_ACTIVE]"]
        distinguishing_aspect: "At most one PROPOSED-or-APPROVED engagement per (case_id, role_type): a second COUNSEL engagement is rejected, while an ACCOUNTANT engagement for the same case succeeds."
        test_recipe:
          setup: ["Case ACTIVE; one COUNSEL engagement PROPOSED"]
          setup_api_calls:
            - call: "POST /v1/cases"
              payload: { case_number: "2026-CV-3024", court_jurisdiction: "S.D.N.Y.", debtor_name: "Acme Widgets LLC", appointed_receiver_name: "R. Receiver", appointment_effective_at: "2026-08-01T00:00:00Z", authority_limit_cents: 500000, business_operation_authorized: true, bar_date: "2026-09-01T00:00:00Z", reporting_interval_days: 30, operating_reserve_cents: 100000 }
              as: Court
              captures: { case_id: $.data.id }
            - call: "POST /v1/engagements"
              payload: { case_id: "${case_id}", professional_name: "L. Lawyer", firm_name: "Law LLP", role_type: COUNSEL, fee_arrangement: HOURLY, hourly_rate_cents: 20000, fee_cap_cents: 1000000 }
              as: Receiver
          trigger:
            - call: "POST /v1/engagements"
              payload: { case_id: "${case_id}", professional_name: "M. Morelaw", firm_name: "More Law PC", role_type: COUNSEL, fee_arrangement: HOURLY, hourly_rate_cents: 25000, fee_cap_cents: 1000000 }
              as: Receiver
              captures: { err1: $.data.error_id }
            - call: "POST /v1/engagements"
