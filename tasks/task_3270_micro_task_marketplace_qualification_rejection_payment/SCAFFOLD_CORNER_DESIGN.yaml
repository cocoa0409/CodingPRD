              as: Anonymous
              captures: { w1: $.data.id }
            - call: "POST /mkt/workers"
              payload: { display_name: "W2 Spent", country: "US" }
              as: Anonymous
              captures: { w2: $.data.id }
            - call: "POST /mkt/hits/${hit1}/assignments"
              payload: { worker_id: "${w1}" }
              as: Worker
              as_user_id: "${w1}"
