  - rule_id: resource_temporal_overlap
    instances:
      - name: negotiation_period_closed_closed_boundary_day_collision
        grounds:
          - validations[priority=52]
          - errors[ERR_NEGOTIATION_PERIOD_OVERLAP]
          - entities.ExclusiveNegotiationPeriod.fields.start_date
          - entities.ExclusiveNegotiationPeriod.fields.end_date
        distinguishing_aspect: |
          The occupied resource is the AgencySite and the interval semantics are CLOSED-CLOSED on whole dates:
          a second period starting exactly on the incumbent's end_date 2026-10-15 collides and is refused,
          while starting one day later on 2026-10-16 is accepted — sharing a single boundary day IS a conflict
          here.
