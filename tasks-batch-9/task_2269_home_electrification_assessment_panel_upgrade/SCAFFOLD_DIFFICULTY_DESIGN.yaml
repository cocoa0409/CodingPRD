      - name: sweep_expiry_cascade_depth_three_voids_measures_and_cancels_inspection
        grounds:
          - state_machines.Reservation.RESERVED_to_EXPIRED
          - state_machines.RebateProject.RESERVED_to_EXPIRED
          - state_machines.Inspection.SCHEDULED_to_CANCELLED
          - calculations.reservation_expiry_sweep
          - endpoints.POST_/programs/{id}/sweep
        distinguishing_aspect: |
          Depth 3 and a different triggering transition — Reservation
          RESERVED -> EXPIRED driven by the logical clock through
          POST /programs/{id}/sweep rather than by an inspection result. Hop 1
          expires the Reservation and restores the two ledgers; hop 2 exists
          only because hop 1 expired that reservation — the project moves
          RESERVED -> EXPIRED; hop 3 exists only because hop 2 moved the
          project — its ProjectMeasures become VOID and its SCHEDULED
          inspection is CANCELLED, which also frees the inspector's window.
          The chain starts from a time-based sweep, so no user acted on the
          project at all.
