  - name: business_rule_priority_conflict_on_confirmation
    claim_type: priority_conflict
    grounds:
    - §1.4 priority 11 ERR_REGISTRATION_STATE_INVALID
    - §1.4 priority 30 ERR_BUDGET_HEADROOM_EXCEEDED
    - §0.5 priority_pair_validation_conflict
    distinguishing_aspect: |
      A priority_conflict recipe needs one request that violates a rule at priority P and another
      at priority P+N and asserts P wins. The confirmation endpoint is where the widest such gap
      exists in this scaffold (11 versus 30), and it is already designed as a §1.8 instance,
      including the mirror case where only the lower-priority rule is violated so the other error
      appears.
    excluded_because:
      difficulty_instance: registration_state_check_precedes_budget_headroom_check_on_confirm
      rationale: |
        That §1.8 instance confirms a registration that is both in the wrong attendance_status and over the remaining budget headroom, asserts ERR_REGISTRATION_STATE_INVALID, then repairs the
        state and asserts ERR_BUDGET_HEADROOM_EXCEEDED from the same request — both halves of the
        priority-conflict claim.
  - name: cross_entity_validation_on_tax_draft_creation
    claim_type: cross_entity_validation
    grounds:
    - §1.4 priority 12 (cross-entity state guards)
    - §1.5 POST /tax-award-reports
    - §0.5 cross_entity_state_dependency
    distinguishing_aspect: |
      The cross-entity validation claim asks for a rule whose verdict depends on another entity's
      state, tested from both the valid and the invalid side. Tax-report drafting is the purest
      such rule here because POST /tax-award-reports is deliberately NOT gated on Program.status,
      leaving the referenced Qualifier's award_status as the only lifecycle gate — and that is
      exactly the §1.8 instance.
    excluded_because:
      difficulty_instance: tax_report_draft_gated_on_qualifier_award_status_travelled
      rationale: |
        That §1.8 instance drafts against a NOTIFIED qualifier and asserts ERR_QUALIFIER_STATE_INVALID, then advances only the qualifier's own state and drafts again
        successfully, covering both the invalid and the valid side of the dependency.
  - name: temporal_gates_reject_deviation_overrun_stay_window_and_degenerate_ranges
    claim_type: temporal_validation
    grounds:
    - §1.4 priority 23 ERR_INVALID_DATE_RANGE
    - §1.4 priority 25 ERR_DEVIATION_LIMIT_EXCEEDED
    - §1.4 priority 26 ERR_STAY_WINDOW_VIOLATION
    - §1.2 Registration air_status TICKETED -> CHANGE_PENDING preconditions
    - §1.5 POST /registrations/{registration_id}/air, POST /registrations/{registration_id}/confirm
    distinguishing_aspect: |
      The temporal-validation pattern asks for an operation that is legal at the moment it is
      accepted yet creates a conflict that must be detected later. Registration creation is
      exactly that: arrival and departure dates are only checked against each other at creation
      (priority 23), and the stay window of the EXECUTED hotel contract is not consulted until
      confirmation (priority 26), so a registration can sit happily in ACCEPTED for its whole life
      and still be unconfirmable. The instance also pins the re-check on the revised values of an
      air CHANGE, which is the one place a previously accepted deviation total can be invalidated
      by a later request, and it sweeps all three date pairs guarded by priority 23.
    test_recipe:
      setup: Empty database. The canonical 5000000-cent program is at REGISTRATION_OPEN with an EXECUTED
        hotel contract whose stay window is 2026-11-08T00:00:00Z to 2026-11-13T00:00:00Z. Ben Ortiz holds
        an ACCEPTED WINNER registration created with arrival_date 2026-11-07 and departure_date 2026-11-14
        — strictly increasing, so creation succeeded, but one day outside the window on each side.
      setup_api_calls:
      - call: POST /programs
        payload:
