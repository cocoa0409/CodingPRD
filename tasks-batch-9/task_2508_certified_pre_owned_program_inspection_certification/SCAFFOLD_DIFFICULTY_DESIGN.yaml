          setup:
            - "One dealer, one technician (credential valid to 2029-01-01), the published MPI-172 template."
            - "Vehicle V1 (in_service_date 2022-02-01, 62000 miles) is certified at the default clock 2026-08-01, giving the retained half-open interval [2026-08-01, 2027-08-01)."
            - "A RETAIL_SOLD event decertifies that certification with reason RETAIL_SOLD — which keeps the interval reserved — and a RETURNED_TO_INVENTORY event brings the vehicle back."
            - "At clock 2027-07-01 a new inspection is passed and certification C2 is submitted, whose candidate interval would be [2027-07-01, 2028-07-01)."
