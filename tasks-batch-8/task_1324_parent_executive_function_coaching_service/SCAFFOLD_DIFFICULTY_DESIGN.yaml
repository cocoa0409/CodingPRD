      - name: money_conservation_under_enroll_and_workshop_cancel
        grounds:
          - entities.Family.fields.outstanding_balance_cents
          - calculations.delinquency_evaluation
          - state_machines.Workshop.OPEN_to_CANCELLED
          - state_machines.WorkshopEnrollment.ENROLLED_to_REFUNDED
        distinguishing_aspect: |
          Different conserved quantity than credits: family money. INV-MONEY
          (outstanding == charged - refunded - paid) holds at both observation
          points, and the enroll-charge (15000) paired with the workshop-cancel
          refund (15000) leaves outstanding_balance_cents unchanged at 0.
        test_recipe:
          setup:
            - "Family with one HYBRID client in an ACTIVE plan; workshop capacity 5, price_cents 15000, window 2026-09-05, status OPEN"
            - "Client ENROLLED with billing_source MONEY (no GROUP package exists)"
          setup_api_calls:
            - { call: "POST /api/families", payload: { account_name: "Fam MC", primary_email: "mc@x.com" }, as: PracticeAdmin, captures: { fam_id: "$.data.id" } }
            - { call: "POST /api/families/${fam_id}/clients", payload: { full_name: "Kid MC", date_of_birth: "2013-10-01", track: "HYBRID" }, as: PracticeAdmin, captures: { cl_id: "$.data.id", cl_v: "$.data.version" } }
            - { call: "POST /api/families/${fam_id}/transition", payload: { to_state: "ACTIVE" }, as: PracticeAdmin }
            - { call: "POST /api/coaches", payload: { full_name: "Coach MC", credential_level: "CERTIFIED" }, as: PracticeAdmin, captures: { co_id: "$.data.id" } }
            - { call: "POST /api/clients/${cl_id}/intakes", payload: { presenting_concerns: "mc", baseline_score: 55 }, as: PracticeAdmin, captures: { in_id: "$.data.id" } }
            - { call: "POST /api/intakes/${in_id}/transition", payload: { to_state: "SUBMITTED" }, as: FamilyMember, as_user_id: "${fam_id}" }
            - { call: "POST /api/intakes/${in_id}/transition", payload: { to_state: "UNDER_REVIEW" }, as: Coach, as_user_id: "${co_id}" }
            - { call: "POST /api/intakes/${in_id}/transition", payload: { to_state: "APPROVED" }, as: Coach, as_user_id: "${co_id}" }
            - { call: "POST /api/clients/${cl_id}/plans", payload: { coach_id: "${co_id}", intake_id: "${in_id}", cadence: "WEEKLY", expected_client_version: "${cl_v}" }, as: Coach, as_user_id: "${co_id}", captures: { pl_id: "$.data.id" } }
            - { call: "POST /api/plans/${pl_id}/goals", payload: { title: "G", target_date: "2026-09-01" }, as: Coach, as_user_id: "${co_id}" }
            - { call: "POST /api/plans/${pl_id}/transition", payload: { to_state: "PROPOSED" }, as: Coach, as_user_id: "${co_id}" }
            - { call: "POST /api/plans/${pl_id}/transition", payload: { to_state: "ACTIVE" }, as: FamilyMember, as_user_id: "${fam_id}" }
            - { call: "POST /api/workshops", payload: { title: "Money Lab", coach_id: "${co_id}", capacity: 5, window_start: "2026-09-05T17:00:00Z", window_end: "2026-09-05T20:00:00Z", price_cents: 15000 }, as: PracticeAdmin, captures: { ws_id: "$.data.id" } }
            - { call: "POST /api/workshops/${ws_id}/transition", payload: { to_state: "OPEN" }, as: PracticeAdmin }
            - { call: "POST /api/workshops/${ws_id}/enrollments", payload: { client_id: "${cl_id}" }, as: FamilyMember, as_user_id: "${fam_id}", captures: { en_id: "$.data.id", en_billing: "$.data.billing_source" } }
            - { call: "GET /api/families/${fam_id}", as: PracticeAdmin, captures: { fam_out_mid: "$.data.outstanding_balance_cents", fam_charged_mid: "$.data.total_charged_cents" } }
          trigger:
            - { call: "POST /api/workshops/${ws_id}/transition", payload: { to_state: "CANCELLED" }, as: PracticeAdmin, captures: { ws_status: "$.data.status" } }
            - { call: "GET /api/families/${fam_id}", as: PracticeAdmin, captures: { fam_out_end: "$.data.outstanding_balance_cents", fam_charged_end: "$.data.total_charged_cents", fam_refunded_end: "$.data.total_refunded_cents", fam_paid_end: "$.data.total_paid_cents" } }
            - { call: "GET /api/workshops/${ws_id}/enrollments", as: PracticeAdmin, captures: { en_after: "$.data[0].status" } }
          assert:
            - "en_billing == MONEY"
            - "fam_out_mid == 15000 and fam_charged_mid == 15000 (INV-MONEY: 15000 == 15000 - 0 - 0)"
            - "ws_status == CANCELLED"
            - "en_after == REFUNDED"
            - "fam_charged_end == 15000 (charges are immutable)"
            - "fam_refunded_end == 15000"
            - "fam_out_end == 0 (INV-MONEY: 0 == 15000 - 15000 - 0; enroll+cancel pair nets zero)"
