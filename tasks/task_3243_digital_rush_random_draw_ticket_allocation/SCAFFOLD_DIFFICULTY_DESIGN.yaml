- rule_id: priority_pair_validation_conflict
  instances:
  - name: priority_conflict_state_before_business_temporal
    grounds:
    - validations[priority=5]
    - validations[priority=8]
    - validations[priority=13]
    - errors[ERR_INVALID_STATE, ERR_DUPLICATE_DRAW_ENTRY]
    distinguishing_aspect: "The trigger violates two rules at once \u2014 the draw entry window has closed (priority 13, business_temporal, ERR_DRAW_WINDOW_CLOSED) and the patron already holds a non-CANCELLED entry for the allocation (priority 8, business_temporal, ERR_DUPLICATE_DRAW_ENTRY); because the window rule sits at a lower priority number than the duplicate rule, inside the business_temporal band the window error wins."
    test_recipe:
      setup:
      - Logical clock at 2026-09-12T09:00:00Z. A MOBILE_PUSH market, an ACTIVE production and an ONSALE performance.
      - A SCHEDULED DRAW allocation with daily_quantity 2, claim_window_minutes 30 and per_order_limit 1, whose draw window closes at entries_close_at 2026-09-12T08:00:00Z, so the window is already shut at the clock's position.
      - The patron already holds one ENTERED entry for that allocation from before the window shut.
      setup_api_calls:
      - *id001
      - *id002
      - *id003
      - call: POST /productions/${prod_id}/status-transitions
        payload:
          to_status: ACTIVE
          expected_production_version: ${prod_v}
        as: OpsManager
        captures:
          prod_v: $.data.version
      - call: POST /performances
        payload:
          production_id: ${prod_id}
          market_code: NYC
          venue_name: Priority Theatre
          starts_at: '2026-10-05T19:00:00Z'
          face_value_cents: 10000
          total_seat_capacity: 30
        as: OpsManager
        captures:
          perf_id: $.data.id
          perf_v: $.data.version
      - call: POST /performances/${perf_id}/status-transitions
        payload:
          to_status: ONSALE
          expected_performance_version: ${perf_v}
        as: OpsManager
        captures:
          perf_v: $.data.version
      - call: POST /performances/${perf_id}/allocations
        payload:
          ticket_type: DRAW
          daily_quantity: 2
          discount_pct: 0.5
          release_time_local: 07:00
          refundable: true
          claim_window_minutes: 30
          winner_basis_points: 5000
          waitlist_multiplier: 1
          per_order_limit: 1
        as: AllocationsCoordinator
        captures:
          draw_id: $.data.id
          alloc_v: $.data.version
      - call: POST /allocations/${draw_id}/scheduling
        payload:
          expected_allocation_version: ${alloc_v}
        as: AllocationsCoordinator
        captures:
          alloc_v: $.data.version
      - call: POST /allocations/${draw_id}/releases/2026-09-12
        payload:
          expected_production_version: ${prod_v}
          expected_performance_version: ${perf_v}
          expected_allocation_version: ${alloc_v}
        as: OpsManager
        captures:
          alloc_v: $.data.version
      - call: POST /patrons/registrations
        payload:
          email: priority_patron@x.com
          display_name: Priority Patron
          market_code: NYC
        as: Anonymous
        captures:
          pat_id: $.data.id
          patron_v: $.data.version
      - call: POST /_clock/set_current_utc
        payload:
          to_iso8601: '2026-09-12T07:30:00Z'
        as: PlatformAdmin
      - call: POST /performances/${perf_id}/draw-entries
        payload:
          allocation_id: ${draw_id}
          declaration_text: I would like to attend
        as: Patron
        as_user_id: ${pat_id}
        captures:
          e1_id: $.data.id
          entry_v: $.data.version
      trigger:
      - call: POST /performances/${perf_id}/draw-entries
        payload:
          allocation_id: ${draw_id}
          declaration_text: I would like to attend
        as: Patron
        as_user_id: ${pat_id}
        captures:
          err: $.data.error_id
          entry_v: $.data.version
      assert:
      - the response status is 409
      - the response reported ${err} == ERR_DRAW_WINDOW_CLOSED
      - the response did not report ERR_DUPLICATE_DRAW_ENTRY, even though a non-CANCELLED entry exists for the same allocation
      - the lower priority number inside the business_temporal band is what settled the conflict, not the more specific-sounding duplicate rule
      - GET /performances/${perf_id}/draw-entries?allocation_id=${draw_id} still returns exactly 1 entry
  - name: priority_conflict_auth_before_existence
    grounds:
    - validations[priority=1]
    - validations[priority=3]
    - errors[ERR_UNAUTHENTICATED, ERR_PERFORMANCE_NOT_FOUND]
    distinguishing_aspect: The trigger omits the identity headers and also targets a performance id that does not exist; because the identity check sits at priority 1 and every existence check at priority 3, the request is rejected with ERR_UNAUTHENTICATED rather than leaking whether the performance exists.
    test_recipe:
      setup:
      - Logical clock at 2026-09-12T09:00:00Z. A MOBILE_PUSH market and an ACTIVE production exist; no performance has been created.
      setup_api_calls:
      - *id001
      - *id002
      - *id003
      - call: POST /productions/${prod_id}/status-transitions
        payload:
          to_status: ACTIVE
          expected_production_version: ${prod_v}
        as: OpsManager
        captures:
          prod_v: $.data.version
      trigger:
      - call: GET /performances/00000000-0000-4000-8000-000000000000
        payload: {}
        as: Patron
        captures:
          err: $.data.error_id
          perf_v: $.data.version
      assert:
      - the response status is 401
      - the response reported ${err} == ERR_UNAUTHENTICATED
      - the response did not report ERR_PERFORMANCE_NOT_FOUND, so existence was never evaluated
      - the same path requested with valid headers reports ERR_PERFORMANCE_NOT_FOUND at status 404
- rule_id: boundary_precision_check
  instances:
  - name: boundary_carry_forward_exact_consumption_yields_zero_cap
    grounds:
    - calculations.rush_daily_release_cap
    - entities.RushAllocation.fields.daily_quantity
    - validations[priority=15]
    distinguishing_aspect: 'The carry-forward operand is daily_quantity minus quantity_carried_forward with no epsilon: when the previous epoch consumed exactly as many seats as were released, the operand is exactly 0 and the release cap for the next epoch is 0, so the release endpoint must still succeed and stamp a zero quantity rather than reject.'
    test_recipe:
      setup:
      - Logical clock at 2026-09-12T09:00:00Z. A MOBILE_PUSH market, an ACTIVE production and an ONSALE performance with total_seat_capacity 30.
      - A SCHEDULED RUSH allocation with daily_quantity 2, discount_pct 0.5, refundable true and per_order_limit 2.
      - Epoch 2026-09-11 was released for 2 seats and both seats were sold, so quantity_carried_forward for epoch 2026-09-12 is 2 - 1 = 1 from the settlement counter and daily_quantity minus that remainder is 1; the clock has now moved to 2026-09-12.
      setup_api_calls:
      - call: POST /_clock/set_current_utc
        payload:
          to_iso8601: '2026-09-11T09:00:00Z'
        as: PlatformAdmin
      - *id002
      - *id003
      - call: POST /productions/${prod_id}/status-transitions
        payload:
          to_status: ACTIVE
          expected_production_version: ${prod_v}
        as: OpsManager
        captures:
          prod_v: $.data.version
      - call: POST /performances
        payload:
          production_id: ${prod_id}
          market_code: NYC
          venue_name: Boundary Theatre
          starts_at: '2026-10-05T19:00:00Z'
          face_value_cents: 10000
          total_seat_capacity: 30
        as: OpsManager
        captures:
