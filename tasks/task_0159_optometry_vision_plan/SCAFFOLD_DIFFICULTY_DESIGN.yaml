              captures: { rx2_id: $.data.id }
          assert:
            - "Prescription.${rx1_id}.status == SUPERSEDED"
            - "Prescription.${rx2_id}.status == ACTIVE"

      - name: benefit_period_overlap_single_exam_slot_eligibility
        grounds:
          - state_machines.Claim.DRAFT_to_ADJUDICATED
          - entities.Eligibility.fields.benefit_period_end
          - entities.BenefitPool.fields.allotted_cents
        distinguishing_aspect: |
          Interval semantics B (different from instance 1) — the EXAM BenefitPool models a single
          aggregate-capacity slot over the 12-month benefit_period interval on the Eligibility
          resource: two routine exams whose dates both fall inside one benefit_period_end window
          contend for one exam slot (aggregate capacity = 1), unlike the type-exclusion window of
          instance 1. The second contending adjudication is blocked.
        test_recipe:
          setup:
            - "VSP patient; benefit period 2026-01-01..2026-12-31; first routine exam adjudicated (slot consumed); second routine encounter inside the same period finalized with a DRAFT claim"
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-03-01T00:00:00Z" }
              as: FrontDesk
            - call: "POST /providers"
              payload: { full_name: "Dr OD", role: "OPTOMETRIST", npi: "1234567890" }
              as: FrontDesk
              captures: { od_id: $.data.id }
            - call: "POST /patients"
              payload: { full_name: "Pat 8b", date_of_birth: "1990-01-01", plan_carrier: "VSP" }
              as: FrontDesk
              captures: { pat_id: $.data.id }
            - call: "POST /eligibilities"
              payload: { patient_id: "${pat_id}", carrier: "VSP", benefit_period_start: "2026-01-01", exam_copay_cents: 2500, materials_allowance_cents: 40000 }
              as: FrontDesk
              captures: { elig_id: $.data.id }
            - call: "POST /encounters"
              payload: { patient_id: "${pat_id}", provider_id: "${od_id}", encounter_type: "ROUTINE_VISION", exam_fee_cents: 12000, refraction_fee_cents: 3000 }
              as: FrontDesk
              captures: { enc1_id: $.data.id }
            - call: "POST /patients/${pat_id}/prescriptions"
              payload: { encounter_id: "${enc1_id}", rx_type: "EYEGLASS", sphere_od: -1.25, sphere_os: -1.00, issue_date: "2026-03-01" }
              as: Optometrist
              as_user_id: "${od_id}"
            - call: "POST /encounters/${enc1_id}/finalize"
              payload: {}
              as: Optometrist
              as_user_id: "${od_id}"
            - call: "POST /claims"
              payload: { encounter_id: "${enc1_id}", eligibility_id: "${elig_id}" }
              as: Biller
              captures: { claim1_id: $.data.id }
            - call: "POST /claims/${claim1_id}/adjudicate"
              payload: {}
              as: Biller
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-09-01T00:00:00Z" }
              as: FrontDesk
            - call: "POST /encounters"
              payload: { patient_id: "${pat_id}", provider_id: "${od_id}", encounter_type: "ROUTINE_VISION", exam_fee_cents: 12000, refraction_fee_cents: 3000 }
              as: FrontDesk
              captures: { enc2_id: $.data.id }
            - call: "POST /patients/${pat_id}/prescriptions"
              payload: { encounter_id: "${enc2_id}", rx_type: "EYEGLASS", sphere_od: -1.50, sphere_os: -1.25, issue_date: "2026-09-01" }
              as: Optometrist
              as_user_id: "${od_id}"
            - call: "POST /encounters/${enc2_id}/finalize"
              payload: {}
              as: Optometrist
              as_user_id: "${od_id}"
            - call: "POST /claims"
              payload: { encounter_id: "${enc2_id}", eligibility_id: "${elig_id}" }
              as: Biller
              captures: { claim2_id: $.data.id }
          trigger:
            - call: "POST /claims/${claim2_id}/adjudicate"
              payload: {}
              as: Biller
              captures: { err: $.data.error_id }
          assert:
            - "response error_id == ERR_BENEFIT_PERIOD_CLOSED"
            - "HTTP status == 409"

  # =========================================================================
  # Rule 9 — Compensating-action invariants across different conserved quantities
  # =========================================================================
  - rule_id: compensating_invariant
    instances:
      - name: claim_void_restores_exam_benefit_conserved_exam_slot
        grounds:
          - state_machines.Claim.ADJUDICATED_to_VOIDED
          - state_machines.Claim.DRAFT_to_ADJUDICATED
          - entities.Eligibility.fields.exam_benefit_available
        distinguishing_aspect: |
          Conserved quantity = the exam benefit slot (Eligibility.exam_benefit_available + EXAM pool
          consumed_cents). Adjudicate consumes the slot (available=false, consumed=allotted); void
          (compensating) restores it (available=true, consumed=0). Invariant: after the forward+void
          pair, exam_benefit_available == true and EXAM pool consumed_cents == 0, exactly the
          pre-adjudication state.
        test_recipe:
          setup:
            - "VSP patient; one ROUTINE claim adjudicated against the eligibility (exam slot consumed)"
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-06-01T00:00:00Z" }
              as: FrontDesk
            - call: "POST /providers"
              payload: { full_name: "Dr OD", role: "OPTOMETRIST", npi: "1234567890" }
              as: FrontDesk
              captures: { od_id: $.data.id }
            - call: "POST /patients"
              payload: { full_name: "Pat 9", date_of_birth: "1990-01-01", plan_carrier: "VSP" }
              as: FrontDesk
              captures: { pat_id: $.data.id }
            - call: "POST /eligibilities"
              payload: { patient_id: "${pat_id}", carrier: "VSP", benefit_period_start: "2026-01-01", exam_copay_cents: 2500, materials_allowance_cents: 40000 }
              as: FrontDesk
              captures: { elig_id: $.data.id }
            - call: "POST /encounters"
              payload: { patient_id: "${pat_id}", provider_id: "${od_id}", encounter_type: "ROUTINE_VISION", exam_fee_cents: 12000, refraction_fee_cents: 3000 }
              as: FrontDesk
              captures: { enc_id: $.data.id }
            - call: "POST /patients/${pat_id}/prescriptions"
              payload: { encounter_id: "${enc_id}", rx_type: "EYEGLASS", sphere_od: -1.25, sphere_os: -1.00, issue_date: "2026-06-01" }
              as: Optometrist
              as_user_id: "${od_id}"
            - call: "POST /encounters/${enc_id}/finalize"
              payload: {}
              as: Optometrist
              as_user_id: "${od_id}"
            - call: "POST /claims"
              payload: { encounter_id: "${enc_id}", eligibility_id: "${elig_id}" }
              as: Biller
              captures: { claim_id: $.data.id }
            - call: "POST /claims/${claim_id}/adjudicate"
              payload: {}
              as: Biller
          trigger:
            - call: "POST /claims/${claim_id}/void"
              payload: {}
              as: Biller
              captures: { cs: $.data.claim_status }
          assert:
            - "Claim.${claim_id}.claim_status == VOIDED"
            - "Eligibility.${elig_id}.exam_benefit_available == true"
            - "BenefitPool of type EXAM for ${elig_id} has consumed_cents == 0"

      - name: laborder_cancel_restores_materials_pool_conserved_materials_dollars
        grounds:
          - state_machines.LabOrder.PLACED_to_CANCELLED
          - entities.BenefitPool.fields.consumed_cents
          - entities.LabOrder.fields.materials_draw_cents
        distinguishing_aspect: |
          Different conserved quantity from instance 1 (materials dollars, not the exam slot):
          place draws materials_draw_cents from the MATERIALS pool; cancel (compensating) releases
          exactly that amount. Invariant: MATERIALS pool consumed_cents + sum of remaining draws is
          conserved — after place+cancel, consumed_cents == 0 and remaining_cents == allotted_cents.
        test_recipe:
          setup:
            - "VSP patient, allowance 40000; one PLACED benefit LabOrder that drew 21000 (pool remaining 19000)"
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-06-01T00:00:00Z" }
              as: FrontDesk
            - call: "POST /providers"
              payload: { full_name: "Dr OD", role: "OPTOMETRIST", npi: "1234567890" }
              as: FrontDesk
              captures: { od_id: $.data.id }
            - call: "POST /providers"
              payload: { full_name: "Op Tician", role: "OPTICIAN", npi: "2222222222" }
              as: FrontDesk
              captures: { opt_id: $.data.id }
            - call: "POST /patients"
              payload: { full_name: "Pat 9b", date_of_birth: "1990-01-01", plan_carrier: "VSP" }
              as: FrontDesk
              captures: { pat_id: $.data.id }
            - call: "POST /eligibilities"
              payload: { patient_id: "${pat_id}", carrier: "VSP", benefit_period_start: "2026-01-01", exam_copay_cents: 2500, materials_allowance_cents: 40000 }
              as: FrontDesk
              captures: { elig_id: $.data.id, elig_v0: $.data.version }
            - call: "POST /encounters"
              payload: { patient_id: "${pat_id}", provider_id: "${od_id}", encounter_type: "ROUTINE_VISION", exam_fee_cents: 12000, refraction_fee_cents: 3000 }
              as: FrontDesk
              captures: { enc_id: $.data.id }
            - call: "POST /patients/${pat_id}/prescriptions"
              payload: { encounter_id: "${enc_id}", rx_type: "EYEGLASS", sphere_od: -1.25, sphere_os: -1.00, issue_date: "2026-06-01" }
              as: Optometrist
              as_user_id: "${od_id}"
              captures: { rx_id: $.data.id }
            - call: "POST /lab-orders"
              payload: { prescription_id: "${rx_id}", eligibility_id: "${elig_id}", expected_eligibility_version: "${elig_v0}", frame_charge_cents: 15000, lens_charge_cents: 8000, frame_brand_tier: "STANDARD" }
              as: Optician
              as_user_id: "${opt_id}"
              captures: { order_id: $.data.id }
          trigger:
            - call: "POST /lab-orders/${order_id}/cancel"
              payload: {}
              as: Optician
              as_user_id: "${opt_id}"
              captures: { st: $.data.status }
          assert:
            - "LabOrder.${order_id}.status == CANCELLED"
            - "BenefitPool of type MATERIALS for ${elig_id} has consumed_cents == 0 and remaining_cents == 40000"
