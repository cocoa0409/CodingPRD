# =============================================================================
# SCAFFOLD_DIFFICULTY_DESIGN.yaml — §1.8 Test Targeting Index
# Therapy Animal Certification & Visit Scheduling
# =============================================================================
scaffold_difficulty_design:
  # ---------------------------------------------------------------------------
  # Rule 1 — dual_variant_calc (different entity domains)
  # ---------------------------------------------------------------------------
  - rule_id: dual_variant_calc
    instances:
      - name: visit_credit_provisional_vs_final_reconciliation
        grounds:
          - calculations.visit_credit_minutes
          - state_machines.VisitVerification.UNVERIFIED_to_VERIFIED
          - entities.HourCredit.fields.kind
        distinguishing_aspect: |
          Hours domain (Handler.lifetime_minutes): the SAME visit yields 60
          under the PROVISIONAL variant (scheduled minutes, unrounded) but 45
          under the FINAL variant (min(actual 45, scheduled 60, cap 60) rounded
          to 15-minute units); verification must reconcile to exactly the FINAL
          value with zero provisional residue.
        test_recipe:
          setup:
            - "Certified team (handler h, animal a, team t, cert c ACTIVE) and ACTIVE facility f with agreement, orientation COMPLETED, waiver SIGNED v1"
            - "Visit v scheduled 2026-08-03T10:00:00Z-11:00:00Z (60 min); facility max_visit_minutes=60, agreement agreed_max_visit_minutes=90"
          setup_api_calls:
            - { call: "POST /v1/handlers", payload: { full_name: "H One", email: "h1@x.com", region_code: "WA", volunteer_since: "2024-08-01" }, as: Anonymous, captures: { h: $.data.id } }
            - { call: "POST /v1/handlers/${h}/approve", payload: {}, as: ProgramAdmin }
            - { call: "POST /v1/animals", payload: { name: "Rex", species: "DOG", breed: "Labrador", date_of_birth: "2022-03-01" }, as: Handler, as_user_id: "${h}", captures: { a: $.data.id } }
            - { call: "POST /v1/teams", payload: { animal_id: "${a}", team_name: "Rex Team" }, as: Handler, as_user_id: "${h}", captures: { t: $.data.id } }
            - { call: "POST /v1/evaluations", payload: { team_id: "${t}" }, as: Handler, as_user_id: "${h}", captures: { e: $.data.id } }
            - { call: "POST /v1/evaluators", payload: { full_name: "Ev One", email: "ev1@x.com", region_code: "WA", specializations: ["DOG", "CAT"] }, as: ProgramAdmin, captures: { ev: $.data.id } }
            - { call: "POST /v1/evaluations/${e}/schedule", payload: { evaluator_id: "${ev}", scheduled_start: "2026-08-02T10:00:00Z", scheduled_end: "2026-08-02T11:00:00Z" }, as: ProgramAdmin }
            - { call: "POST /v1/_clock/set_current_utc", payload: { to_iso8601: "2026-08-02T11:00:00Z" }, as: ProgramAdmin }
            - { call: "POST /v1/evaluations/${e}/score", payload: { aptitude_score: 80, obedience_score: 70 }, as: Evaluator, as_user_id: "${ev}" }
            - { call: "POST /v1/vaccination-records", payload: { animal_id: "${a}", vaccine_type: "RABIES", administered_on: "2026-07-01", valid_until: "2029-12-31", veterinarian_name: "Dr V" }, as: Handler, as_user_id: "${h}" }
            - { call: "POST /v1/insurance-policies", payload: { insurer_name: "INS", policy_number: "P-1", coverage_cents: 200000000, effective_from: "2026-01-01", effective_until: "2029-12-31" }, as: Handler, as_user_id: "${h}", captures: { p: $.data.id } }
            - { call: "POST /v1/insurance-policies/${p}/verify", payload: {}, as: ProgramAdmin }
            - { call: "POST /v1/certifications", payload: { team_id: "${t}", evaluation_id: "${e}" }, as: ProgramAdmin, captures: { c: $.data.id } }
            - { call: "POST /v1/certifications/${c}/activate", payload: {}, as: ProgramAdmin }
            - { call: "POST /v1/facilities", payload: { name: "School A", facility_type: "SCHOOL", region_code: "WA", max_visit_minutes: 60, allowed_species: ["DOG", "CAT"], min_liability_coverage_cents: 100000000, max_overlapping_teams: 2, visits_per_week_cap: 5 }, as: ProgramAdmin, captures: { f: $.data.id } }
            - { call: "POST /v1/facility-agreements", payload: { facility_id: "${f}", start_on: "2026-07-01", end_on: "2027-06-30", agreed_max_visit_minutes: 90, insurance_minimum_cents: 100000000, terms_version: "t1" }, as: ProgramAdmin, captures: { ag: $.data.id } }
            - { call: "POST /v1/facility-agreements/${ag}/submit", payload: {}, as: ProgramAdmin }
            - { call: "POST /v1/facility-agreements/${ag}/sign-facility", payload: {}, as: FacilityCoordinator, as_user_id: "${f}" }
            - { call: "POST /v1/facility-agreements/${ag}/sign-program", payload: {}, as: ProgramAdmin }
            - { call: "POST /v1/orientation-records", payload: { team_id: "${t}" }, as: FacilityCoordinator, as_user_id: "${f}", captures: { o: $.data.id } }
            - { call: "POST /v1/orientation-records/${o}/complete", payload: { attended_on: "2026-08-02" }, as: FacilityCoordinator, as_user_id: "${f}" }
            - { call: "POST /v1/liability-waivers", payload: { team_id: "${t}", facility_id: "${f}", waiver_version: "v1", signed_on: "2026-08-02" }, as: Handler, as_user_id: "${h}" }
            - { call: "GET /v1/teams/${t}", payload: {}, as: ProgramAdmin, captures: { t_v: $.data.version } }
            - { call: "POST /v1/visits", payload: { team_id: "${t}", facility_id: "${f}", scheduled_start: "2026-08-03T10:00:00Z", scheduled_end: "2026-08-03T11:00:00Z", expected_team_version: "${t_v}" }, as: ProgramAdmin, captures: { v: $.data.id } }
          trigger:
            - { call: "POST /v1/_clock/set_current_utc", payload: { to_iso8601: "2026-08-03T10:00:00Z" }, as: ProgramAdmin }
            - { call: "POST /v1/visits/${v}/check-in", payload: {}, as: Handler, as_user_id: "${h}" }
            - { call: "POST /v1/_clock/set_current_utc", payload: { to_iso8601: "2026-08-03T10:45:00Z" }, as: ProgramAdmin }
            - { call: "POST /v1/visits/${v}/check-out", payload: {}, as: Handler, as_user_id: "${h}" }
            - { call: "GET /v1/handlers/${h}", payload: {}, as: ProgramAdmin, captures: { lt_prov: $.data.lifetime_minutes } }
            - { call: "POST /v1/visits/${v}/verify", payload: {}, as: FacilityCoordinator, as_user_id: "${f}" }
            - { call: "GET /v1/handlers/${h}", payload: {}, as: ProgramAdmin, captures: { lt_final: $.data.lifetime_minutes } }
            - { call: "GET /v1/hour-credits?visit_id=${v}", payload: {}, as: ProgramAdmin }
          assert:
            - "After check-out (PROVISIONAL variant): lt_prov == 60 (scheduled minutes, unrounded, actual 45 ignored)"
            - "Visit.${v}.actual_minutes == 45"
            - "After verify (FINAL variant): lt_final == 45 (REVERSAL -60 then FINAL round_half_up(45/15)*15 = 45)"
            - "HourCredits for ${v} are exactly kinds [PROVISIONAL, REVERSAL, FINAL] with minutes [60, -60, 45]"
            - "Visit.${v}.verification_status == VERIFIED"

      - name: workload_forward_vs_audit_divergence
        grounds:
          - calculations.welfare_workload_minutes
          - entities.Animal.fields.forward_workload_minutes
          - entities.Animal.fields.audit_workload_minutes
        distinguishing_aspect: |
          Animal-welfare domain (distinct from the Handler-hours domain of
          visit_credit_provisional_vs_final_reconciliation): with one SCHEDULED
          60-minute visit the FORWARD_LOOKING variant (includes SCHEDULED at
          scheduled minutes over [now-7d, now+7d)) reads 60 while the AUDIT
          variant (COMPLETED only, actual minutes, [now-7d, now)) reads 0 for
          the same animal at the same instant.
        test_recipe:
          setup:
            - "Certified team + ACTIVE facility (same canonical chain as visit_credit_provisional_vs_final_reconciliation)"
            - "Visit v SCHEDULED 2026-08-03T10:00:00Z-11:00:00Z; no other visits for animal a"
          setup_api_calls:
            - { call: "POST /v1/handlers", payload: { full_name: "H Two", email: "h2@x.com", region_code: "WA", volunteer_since: "2024-08-01" }, as: Anonymous, captures: { h: $.data.id } }
            - { call: "POST /v1/handlers/${h}/approve", payload: {}, as: ProgramAdmin }
            - { call: "POST /v1/animals", payload: { name: "Mog", species: "CAT", breed: "Ragdoll", date_of_birth: "2021-05-01" }, as: Handler, as_user_id: "${h}", captures: { a: $.data.id } }
            - { call: "POST /v1/teams", payload: { animal_id: "${a}", team_name: "Mog Team" }, as: Handler, as_user_id: "${h}", captures: { t: $.data.id } }
            - { call: "POST /v1/evaluations", payload: { team_id: "${t}" }, as: Handler, as_user_id: "${h}", captures: { e: $.data.id } }
            - { call: "POST /v1/evaluators", payload: { full_name: "Ev Two", email: "ev2@x.com", region_code: "WA", specializations: ["CAT"] }, as: ProgramAdmin, captures: { ev: $.data.id } }
            - { call: "POST /v1/evaluations/${e}/schedule", payload: { evaluator_id: "${ev}", scheduled_start: "2026-08-02T10:00:00Z", scheduled_end: "2026-08-02T11:00:00Z" }, as: ProgramAdmin }
            - { call: "POST /v1/_clock/set_current_utc", payload: { to_iso8601: "2026-08-02T11:00:00Z" }, as: ProgramAdmin }
            - { call: "POST /v1/evaluations/${e}/score", payload: { aptitude_score: 80, obedience_score: 70 }, as: Evaluator, as_user_id: "${ev}" }
            - { call: "POST /v1/vaccination-records", payload: { animal_id: "${a}", vaccine_type: "RABIES", administered_on: "2026-07-01", valid_until: "2029-12-31", veterinarian_name: "Dr V" }, as: Handler, as_user_id: "${h}" }
            - { call: "POST /v1/insurance-policies", payload: { insurer_name: "INS", policy_number: "P-2", coverage_cents: 200000000, effective_from: "2026-01-01", effective_until: "2029-12-31" }, as: Handler, as_user_id: "${h}", captures: { p: $.data.id } }
            - { call: "POST /v1/insurance-policies/${p}/verify", payload: {}, as: ProgramAdmin }
            - { call: "POST /v1/certifications", payload: { team_id: "${t}", evaluation_id: "${e}" }, as: ProgramAdmin, captures: { c: $.data.id } }
            - { call: "POST /v1/certifications/${c}/activate", payload: {}, as: ProgramAdmin }
            - { call: "POST /v1/facilities", payload: { name: "School B", facility_type: "SCHOOL", region_code: "WA", max_visit_minutes: 60, allowed_species: ["DOG", "CAT"], min_liability_coverage_cents: 100000000, max_overlapping_teams: 2, visits_per_week_cap: 5 }, as: ProgramAdmin, captures: { f: $.data.id } }
            - { call: "POST /v1/facility-agreements", payload: { facility_id: "${f}", start_on: "2026-07-01", end_on: "2027-06-30", agreed_max_visit_minutes: 90, insurance_minimum_cents: 100000000, terms_version: "t1" }, as: ProgramAdmin, captures: { ag: $.data.id } }
            - { call: "POST /v1/facility-agreements/${ag}/submit", payload: {}, as: ProgramAdmin }
            - { call: "POST /v1/facility-agreements/${ag}/sign-facility", payload: {}, as: FacilityCoordinator, as_user_id: "${f}" }
            - { call: "POST /v1/facility-agreements/${ag}/sign-program", payload: {}, as: ProgramAdmin }
            - { call: "POST /v1/orientation-records", payload: { team_id: "${t}" }, as: FacilityCoordinator, as_user_id: "${f}", captures: { o: $.data.id } }
            - { call: "POST /v1/orientation-records/${o}/complete", payload: { attended_on: "2026-08-02" }, as: FacilityCoordinator, as_user_id: "${f}" }
            - { call: "POST /v1/liability-waivers", payload: { team_id: "${t}", facility_id: "${f}", waiver_version: "v1", signed_on: "2026-08-02" }, as: Handler, as_user_id: "${h}" }
            - { call: "GET /v1/teams/${t}", payload: {}, as: ProgramAdmin, captures: { t_v: $.data.version } }
            - { call: "POST /v1/visits", payload: { team_id: "${t}", facility_id: "${f}", scheduled_start: "2026-08-03T10:00:00Z", scheduled_end: "2026-08-03T11:00:00Z", expected_team_version: "${t_v}" }, as: ProgramAdmin, captures: { v: $.data.id } }
          trigger:
            - { call: "GET /v1/animals/${a}", payload: {}, as: ProgramAdmin, captures: { fwd_pre: $.data.forward_workload_minutes, aud_pre: $.data.audit_workload_minutes } }
            - { call: "POST /v1/_clock/set_current_utc", payload: { to_iso8601: "2026-08-03T10:00:00Z" }, as: ProgramAdmin }
            - { call: "POST /v1/visits/${v}/check-in", payload: {}, as: Handler, as_user_id: "${h}" }
            - { call: "POST /v1/_clock/set_current_utc", payload: { to_iso8601: "2026-08-03T11:00:00Z" }, as: ProgramAdmin }
            - { call: "POST /v1/visits/${v}/check-out", payload: {}, as: Handler, as_user_id: "${h}" }
            - { call: "GET /v1/animals/${a}", payload: {}, as: ProgramAdmin, captures: { fwd_post: $.data.forward_workload_minutes, aud_post: $.data.audit_workload_minutes } }
          assert:
            - "Pre-completion: fwd_pre == 60 AND aud_pre == 0 (SCHEDULED visit counted only by the FORWARD_LOOKING variant)"
            - "Post-completion: fwd_post == 60 AND aud_post == 60 (COMPLETED visit at actual 60 counted by both)"

  # ---------------------------------------------------------------------------
  # Rule 2 — combinatorial_formula (modes a, b, c)
  # ---------------------------------------------------------------------------
  - rule_id: combinatorial_formula
    instances:
      - name: match_score_nested_minmax_branch
        grounds:
          - calculations.team_match_score
          - endpoints.GET_/v1/visit-requests/{id}/candidate-teams
        distinguishing_aspect: |
          Mode (a): >= 3 inputs with non-linear interaction — nested
          min()/max() (experience capped at 40, recency clamped [0,20], penalty
          capped at 30), a conditional multiplier on request.priority, and an
          exclusion branch on facility_type. Pinned inputs yield T1=67.5 and
          T2=30.0, so T1 must rank first.
        test_recipe:
          setup:
            - "Two certified teams: T1 (handler volunteer_since 2024-08-01, DOG, one VERIFIED visit at facility f on 2026-07-22, forward workload 60) and T2 (volunteer_since 2022-08-01, CAT, never visited f, workload 0)"
            - "Facility f is SCHOOL; request r: species_preference DOG, priority URGENT, window 2026-08-10T14:00:00Z-15:00:00Z; clock at 2026-08-05T00:00:00Z"
          setup_api_calls:
            - { call: "POST /v1/handlers", payload: { full_name: "H T1", email: "ht1@x.com", region_code: "WA", volunteer_since: "2024-08-01" }, as: Anonymous, captures: { h1: $.data.id } }
            - { call: "POST /v1/handlers/${h1}/approve", payload: {}, as: ProgramAdmin }
            - { call: "POST /v1/animals", payload: { name: "D1", species: "DOG", breed: "Poodle", date_of_birth: "2021-01-01" }, as: Handler, as_user_id: "${h1}", captures: { a1: $.data.id } }
            - { call: "POST /v1/teams", payload: { animal_id: "${a1}", team_name: "T1" }, as: Handler, as_user_id: "${h1}", captures: { t1: $.data.id } }
            - { call: "POST /v1/evaluations", payload: { team_id: "${t1}" }, as: Handler, as_user_id: "${h1}", captures: { e1: $.data.id } }
            - { call: "POST /v1/evaluators", payload: { full_name: "Ev A", email: "eva@x.com", region_code: "WA", specializations: ["DOG", "CAT"] }, as: ProgramAdmin, captures: { ev: $.data.id } }
            - { call: "POST /v1/evaluations/${e1}/schedule", payload: { evaluator_id: "${ev}", scheduled_start: "2026-08-02T09:00:00Z", scheduled_end: "2026-08-02T10:00:00Z" }, as: ProgramAdmin }
            - { call: "POST /v1/_clock/set_current_utc", payload: { to_iso8601: "2026-08-02T10:00:00Z" }, as: ProgramAdmin }
            - { call: "POST /v1/evaluations/${e1}/score", payload: { aptitude_score: 80, obedience_score: 70 }, as: Evaluator, as_user_id: "${ev}" }
            - { call: "POST /v1/vaccination-records", payload: { animal_id: "${a1}", vaccine_type: "RABIES", administered_on: "2026-07-01", valid_until: "2029-12-31", veterinarian_name: "Dr V" }, as: Handler, as_user_id: "${h1}" }
            - { call: "POST /v1/insurance-policies", payload: { insurer_name: "INS", policy_number: "P-T1", coverage_cents: 200000000, effective_from: "2026-01-01", effective_until: "2029-12-31" }, as: Handler, as_user_id: "${h1}", captures: { p1: $.data.id } }
            - { call: "POST /v1/insurance-policies/${p1}/verify", payload: {}, as: ProgramAdmin }
            - { call: "POST /v1/certifications", payload: { team_id: "${t1}", evaluation_id: "${e1}" }, as: ProgramAdmin, captures: { c1: $.data.id } }
            - { call: "POST /v1/certifications/${c1}/activate", payload: {}, as: ProgramAdmin }
            - { call: "POST /v1/handlers", payload: { full_name: "H T2", email: "ht2@x.com", region_code: "WA", volunteer_since: "2022-08-01" }, as: Anonymous, captures: { h2: $.data.id } }
            - { call: "POST /v1/handlers/${h2}/approve", payload: {}, as: ProgramAdmin }
            - { call: "POST /v1/animals", payload: { name: "C2", species: "CAT", breed: "Siamese", date_of_birth: "2020-01-01" }, as: Handler, as_user_id: "${h2}", captures: { a2: $.data.id } }
            - { call: "POST /v1/teams", payload: { animal_id: "${a2}", team_name: "T2" }, as: Handler, as_user_id: "${h2}", captures: { t2: $.data.id } }
            - { call: "POST /v1/evaluations", payload: { team_id: "${t2}" }, as: Handler, as_user_id: "${h2}", captures: { e2: $.data.id } }
            - { call: "POST /v1/evaluations/${e2}/schedule", payload: { evaluator_id: "${ev}", scheduled_start: "2026-08-02T11:00:00Z", scheduled_end: "2026-08-02T12:00:00Z" }, as: ProgramAdmin }
            - { call: "POST /v1/_clock/set_current_utc", payload: { to_iso8601: "2026-08-02T12:00:00Z" }, as: ProgramAdmin }
            - { call: "POST /v1/evaluations/${e2}/score", payload: { aptitude_score: 80, obedience_score: 70 }, as: Evaluator, as_user_id: "${ev}" }
            - { call: "POST /v1/vaccination-records", payload: { animal_id: "${a2}", vaccine_type: "RABIES", administered_on: "2026-07-01", valid_until: "2029-12-31", veterinarian_name: "Dr V" }, as: Handler, as_user_id: "${h2}" }
            - { call: "POST /v1/insurance-policies", payload: { insurer_name: "INS", policy_number: "P-T2", coverage_cents: 200000000, effective_from: "2026-01-01", effective_until: "2029-12-31" }, as: Handler, as_user_id: "${h2}", captures: { p2: $.data.id } }
            - { call: "POST /v1/insurance-policies/${p2}/verify", payload: {}, as: ProgramAdmin }
            - { call: "POST /v1/certifications", payload: { team_id: "${t2}", evaluation_id: "${e2}" }, as: ProgramAdmin, captures: { c2: $.data.id } }
            - { call: "POST /v1/certifications/${c2}/activate", payload: {}, as: ProgramAdmin }
            - { call: "POST /v1/facilities", payload: { name: "School C", facility_type: "SCHOOL", region_code: "WA", max_visit_minutes: 60, allowed_species: ["DOG", "CAT"], min_liability_coverage_cents: 100000000, max_overlapping_teams: 2, visits_per_week_cap: 10 }, as: ProgramAdmin, captures: { f: $.data.id } }
            - { call: "POST /v1/facility-agreements", payload: { facility_id: "${f}", start_on: "2026-07-01", end_on: "2027-06-30", agreed_max_visit_minutes: 90, insurance_minimum_cents: 100000000, terms_version: "t1" }, as: ProgramAdmin, captures: { ag: $.data.id } }
            - { call: "POST /v1/facility-agreements/${ag}/submit", payload: {}, as: ProgramAdmin }
            - { call: "POST /v1/facility-agreements/${ag}/sign-facility", payload: {}, as: FacilityCoordinator, as_user_id: "${f}" }
            - { call: "POST /v1/facility-agreements/${ag}/sign-program", payload: {}, as: ProgramAdmin }
            - { call: "POST /v1/orientation-records", payload: { team_id: "${t1}" }, as: FacilityCoordinator, as_user_id: "${f}", captures: { o1: $.data.id } }
            - { call: "POST /v1/orientation-records/${o1}/complete", payload: { attended_on: "2026-07-20" }, as: FacilityCoordinator, as_user_id: "${f}" }
            - { call: "POST /v1/orientation-records", payload: { team_id: "${t2}" }, as: FacilityCoordinator, as_user_id: "${f}", captures: { o2: $.data.id } }
            - { call: "POST /v1/orientation-records/${o2}/complete", payload: { attended_on: "2026-07-20" }, as: FacilityCoordinator, as_user_id: "${f}" }
            - { call: "POST /v1/liability-waivers", payload: { team_id: "${t1}", facility_id: "${f}", waiver_version: "v1", signed_on: "2026-07-20" }, as: Handler, as_user_id: "${h1}" }
            - { call: "POST /v1/liability-waivers", payload: { team_id: "${t2}", facility_id: "${f}", waiver_version: "v1", signed_on: "2026-07-20" }, as: Handler, as_user_id: "${h2}" }
            - { call: "POST /v1/_clock/set_current_utc", payload: { to_iso8601: "2026-07-20T00:00:00Z" }, as: ProgramAdmin }
            - { call: "GET /v1/teams/${t1}", payload: {}, as: ProgramAdmin, captures: { t1_v: $.data.version } }
            - { call: "POST /v1/visits", payload: { team_id: "${t1}", facility_id: "${f}", scheduled_start: "2026-07-22T10:00:00Z", scheduled_end: "2026-07-22T11:00:00Z", expected_team_version: "${t1_v}" }, as: ProgramAdmin, captures: { v_past: $.data.id } }
            - { call: "POST /v1/_clock/set_current_utc", payload: { to_iso8601: "2026-07-22T10:00:00Z" }, as: ProgramAdmin }
            - { call: "POST /v1/visits/${v_past}/check-in", payload: {}, as: Handler, as_user_id: "${h1}" }
            - { call: "POST /v1/_clock/set_current_utc", payload: { to_iso8601: "2026-07-22T11:00:00Z" }, as: ProgramAdmin }
            - { call: "POST /v1/visits/${v_past}/check-out", payload: {}, as: Handler, as_user_id: "${h1}" }
            - { call: "POST /v1/visits/${v_past}/verify", payload: {}, as: FacilityCoordinator, as_user_id: "${f}" }
            - { call: "GET /v1/teams/${t1}", payload: {}, as: ProgramAdmin, captures: { t1_v2: $.data.version } }
            - { call: "POST /v1/visits", payload: { team_id: "${t1}", facility_id: "${f}", scheduled_start: "2026-08-06T10:00:00Z", scheduled_end: "2026-08-06T11:00:00Z", expected_team_version: "${t1_v2}" }, as: ProgramAdmin }
            - { call: "POST /v1/_clock/set_current_utc", payload: { to_iso8601: "2026-08-05T00:00:00Z" }, as: ProgramAdmin }
            - { call: "POST /v1/visit-requests", payload: { requested_start: "2026-08-10T14:00:00Z", requested_end: "2026-08-10T15:00:00Z", species_preference: "DOG", visit_program: "GENERAL", priority: "URGENT" }, as: FacilityCoordinator, as_user_id: "${f}", captures: { r: $.data.id } }
          trigger:
            - { call: "GET /v1/visit-requests/${r}/candidate-teams", payload: {}, as: ProgramAdmin, captures: { first_team: "$.data[0].id", second_team: "$.data[1].id" } }
          assert:
            - "first_team == t1 id (score 67.5 = (min(2*5,40) + 25 + max(0, 20-2*2) - min(60/10, 30)) * 1.5 = 45 * 1.5)"
            - "second_team == t2 id (score 30.0 = (min(4*5,40) + 0 + 0 - 0) * 1.5)"
            - "Exactly 2 candidates returned (both teams eligible; species mismatch lowers score but does NOT exclude)"

      - name: recognition_per_credit_rounding_pinned
        grounds:
          - calculations.recognition_lifetime_and_tier
          - calculations.visit_credit_minutes
