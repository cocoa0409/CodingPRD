      - name: announce_already_announced_defense_rejected
        claim_type: idempotency
        grounds:
          - state_machines.DefenseEvent.transitions.DRAFT_to_ANNOUNCED
          - validations.priority_13
          - errors[ERR_DEFENSE_STATE_INVALID]
        excluded_because:
          difficulty_instance: state_priority_beats_business_temporal_priority_on_reannounce
          rationale: "That §1.8 instance re-announces an already ANNOUNCED event and asserts ERR_DEFENSE_STATE_INVALID wins over the announcement-lead error, which subsumes the plain second-attempt claim."

      - name: format_review_superseded_when_next_cycle_opens
        claim_type: side_effect_execution
        grounds:
          - state_machines.FormatReview.transitions.REVISIONS_REQUIRED_to_SUPERSEDED
          - entities.Thesis.fields.format_cycle_count
        excluded_because:
          difficulty_instance: format_review_cycle_loops_and_increments_cycle_number
          rationale: "That §1.8 instance drives three review cycles and asserts each prior REVISIONS_REQUIRED row becomes SUPERSEDED as cycle_number increments."

      - name: committee_dissolved_when_defense_outcome_is_fail
        claim_type: side_effect_execution
        grounds:
          - state_machines.Committee.transitions.APPROVED_to_DISSOLVED
          - state_machines.Thesis.transitions.DEFENSE_ANNOUNCED_to_DEFENSE_FAILED
        excluded_because:
          difficulty_instance: defense_fail_branch_dissolves_committee_unlike_pass_branches
          rationale: "That §1.8 instance contrasts the FAIL branch's dissolve-and-release side effects against the two PASS branches on the same state machine."

