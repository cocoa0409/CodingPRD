  - rule_id: transitive_cascade
    instances:
      - name: biologic_control_failure_cascades_device_session_order_run_lot
        grounds:
          - calculations.biologic_control_deviation
          - state_machines.Device.AVAILABLE_to_QUARANTINED
          - state_machines.TestSession.IN_PROGRESS_to_ABORTED
          - state_machines.TestOrder.IN_TESTING_to_READY
          - state_machines.ChallengeRun.IN_PROGRESS_to_ABORTED_SAFETY
          - calculations.challenge_pc20_and_rescue_ledger
        distinguishing_aspect: |
          One BIOLOGIC_CONTROL event with measured_fev1_l 3.599 propagates four hops along the
          device-to-consumable spine (DeviceQualityEvent FAIL -> Device QUARANTINED -> TestSession ABORTED
          -> {TestOrder back to READY, ChallengeRun ABORTED_SAFETY -> RescueMedicationLot ledger debit}),
          and the terminal hop is a numeric ledger effect (doses_remaining 10 -> 6, doses_reserved 4 -> 0),
          not another status flip.
        test_recipe:
          setup:
            - "logical clock is 2026-08-03T08:00:00Z"
            - "biologic-control subject T-090 has baseline_fev1_l 4.000 established 2026-05-01, so the ABSOLUTE_BASELINE variant applies and 3.599 computes deviation_pct 10.03, above BCS_WARN_PCT"
            - "device SPIRO-1 is AVAILABLE with a same-day PASS calibration, a PASS biologic control, a fresh filter and a completed disinfection"
            - "order ORD-1 is ASTHMA_DIAGNOSIS / ROUTINE_CLINICAL with challenge_type METHACHOLINE and is IN_TESTING"
            - "session SESS-1 is IN_PROGRESS with three ACCEPTABLE PRE_BD maneuvers, best_fev1_l 2.400 and fev1_pct_predicted 60.0, exactly at CHALLENGE_MIN_FEV1_PCT"
            - "rescue lot L-2026-08 was received with 10 doses and expires 2026-12-31"
