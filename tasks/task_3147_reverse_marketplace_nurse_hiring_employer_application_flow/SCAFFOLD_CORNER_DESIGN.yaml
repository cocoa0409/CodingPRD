        claim_type: violation_to_error
        grounds:
          - validations[priority=9]
          - errors.ERR_INTERVIEW_CONFLICT
        excluded_because:
          difficulty_instance: resource_temporal_overlap / nurse_interview_buffered_half_open_overlap
          rationale: "ERR_INTERVIEW_CONFLICT is triggered and asserted in the named §1.8 instance."

      - name: offer_accept_without_approved_contract_rejected
        claim_type: violation_to_error
        grounds:
          - validations[priority=7]
          - errors.ERR_CREDENTIALS_INCOMPLETE
        distinguishing_aspect: "Offer acceptance with screening COMPLETE but the SIGNED_CONTRACT document still in RECEIVED (not APPROVED) fails ERR_CREDENTIALS_INCOMPLETE — both credential gates must hold."
        test_recipe:
          setup:
            - "Application OFFER_EXTENDED; screening COMPLETE; SIGNED_CONTRACT uploaded but not yet approved."
          setup_api_calls:
