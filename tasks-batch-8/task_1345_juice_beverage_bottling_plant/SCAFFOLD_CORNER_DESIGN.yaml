            - { call: "POST /v1/container-lots", payload: { container_type: "PET_473", quantity_received: 5000, supplier_lot_code: "SUP-EX" }, as: WarehouseLead, captures: { clot_id: $.data.id } }
            - { call: "POST /v1/container-lots/${clot_id}/qc-verdict", payload: { verdict: "PASS" }, as: QAInspector, as_user_id: "qa-1" }
            - { call: "POST /v1/warehouse-zones", payload: { zone_code: "Z-EX", temperature_class: "AMBIENT", pallet_capacity: 50 }, as: PlantManager, captures: { zone_id: $.data.id } }
            - { call: "POST /v1/production-runs", payload: { customer_id: "${cust_id}", formula_id: "${form_id}", container_type: "PET_473", planned_units: 1000, unit_price_cents: 150 }, as: ProductionPlanner, captures: { run_id: $.data.id, run_v: $.data.version } }
            - { call: "POST /v1/production-runs/${run_id}/confirm", payload: {}, as: ProductionPlanner, captures: { run_v: $.data.version } }
            - { call: "POST /v1/production-runs/${run_id}/schedule", payload: { batch_id: "${batch_id}", line_id: "${line_id}", scheduled_start_at: "2026-08-11T08:00:00Z", scheduled_end_at: "2026-08-11T12:00:00Z", expected_production_run_version: "${run_v}" }, as: ProductionPlanner }
            - { call: "POST /v1/_clock/set_current_utc", payload: { to_iso8601: "2026-08-11T09:00:00Z" }, as: PlantManager }
            - { call: "POST /v1/production-runs/${run_id}/start", payload: {}, as: ProductionPlanner }
            - { call: "POST /v1/production-runs/${run_id}/complete", payload: { actual_units_filled: 1000, avg_fill_ml: 473, warehouse_zone_id: "${zone_id}" }, as: ProductionPlanner }
            - { call: "GET /v1/production-runs/${run_id}/finished-good-lots", payload: {}, as: Any, captures: { lot_id: "$.data[0].id", lot_label: "$.data[0].expiry_label_date" } }
          trigger:
            - { call: "POST /v1/_clock/set_current_utc", payload: { to_iso8601: "2026-09-09T00:00:00Z" }, as: PlantManager }
            - { call: "POST /v1/ops-runs", payload: {}, as: PlantManager, captures: { s1_exp: $.data.lots_expired_count } }
            - { call: "GET /v1/finished-good-lots/${lot_id}", payload: {}, as: Any, captures: { l_mid: $.data.status } }
            - { call: "POST /v1/_clock/set_current_utc", payload: { to_iso8601: "2026-09-10T00:00:00Z" }, as: PlantManager }
            - { call: "POST /v1/ops-runs", payload: {}, as: PlantManager, captures: { s2_exp: $.data.lots_expired_count, s2_bo: $.data.orders_backordered_count, s2_cx: $.data.orders_cancelled_count, s2_su: $.data.customers_suspended_count, s2_pa: $.data.pallets_converted_count } }
            - { call: "GET /v1/finished-good-lots/${lot_id}", payload: {}, as: Any, captures: { l_end: $.data.status } }
            - { call: "POST /v1/finished-good-lots/${lot_id}/recall", payload: {}, as: QAInspector, as_user_id: "qa-1", captures: { l_rec: $.data.status } }
          assert:
            - "lot_label == 2026-09-10 (production 2026-08-11 + 30 days)"
            - "s1_exp == 0 and l_mid == AVAILABLE (2026-09-09 < expiry)"
            - "s2_exp == 1 and l_end == EXPIRED (equality to expiry_label_date expires)"
            - "s2_bo == 0 and s2_cx == 0 and s2_su == 0 and s2_pa == 0 (no open orders, no credit breach, no aged pallets)"
            - "l_rec == RECALLED (EXPIRED -> RECALLED is a valid transition)"

      - name: ops_run_stale_order_boundary
        claim_type: epoch_sweep
        grounds:
          - calculations.credit_sweep
          - state_machines.ShipmentOrder.PLACED_to_CANCELLED
        distinguishing_aspect: |
          The stale-order sweep cancels PLACED/BACKORDERED orders only when
          requested_delivery_date + 7 days is STRICTLY before the current
          logical date: at exactly +7 the order survives; one day later it is
          cancelled.
        test_recipe:
          setup:
            - "ACTIVE customer with DRAFT formula; order PLACED with requested_delivery_date 2026-08-20 (never allocated)"
          setup_api_calls:
            - { call: "POST /v1/customer-accounts", payload: { name: "StaleCo", credit_limit_cents: 500000, minimum_run_units: 100, pallet_deposit_cents: 2000 }, as: PlantManager, captures: { cust_id: $.data.id } }
            - { call: "POST /v1/customer-accounts/${cust_id}/approve-credit", payload: {}, as: FinanceClerk }
            - { call: "POST /v1/formulas", payload: { customer_id: "${cust_id}", formula_code: "SL-473", name: "Stale Juice", target_brix: 12.0, brix_tolerance: 0.3, process_type: "PASTEURIZATION", container_fill_ml: 473, concentrate_brix: 65.0, allergen_group: "NONE", shelf_life_days: 120, claims: ["ORGANIC"] }, as: ProductDeveloper, as_user_id: "dev-1", captures: { form_id: $.data.id } }
            - { call: "POST /v1/shipment-orders", payload: { customer_id: "${cust_id}", formula_id: "${form_id}", channel: "DIRECT_RETAIL", requested_delivery_date: "2026-08-20", units_requested: 100 }, as: CustomerServiceRep, captures: { ord_id: $.data.id } }
          trigger:
            - { call: "POST /v1/_clock/set_current_utc", payload: { to_iso8601: "2026-08-27T00:00:00Z" }, as: PlantManager }
            - { call: "POST /v1/ops-runs", payload: {}, as: PlantManager, captures: { s1_cx: $.data.orders_cancelled_count } }
            - { call: "GET /v1/shipment-orders/${ord_id}", payload: {}, as: Any, captures: { o_mid: $.data.status } }
            - { call: "POST /v1/_clock/set_current_utc", payload: { to_iso8601: "2026-08-28T00:00:00Z" }, as: PlantManager }
            - { call: "POST /v1/ops-runs", payload: {}, as: PlantManager, captures: { s2_cx: $.data.orders_cancelled_count } }
            - { call: "GET /v1/shipment-orders/${ord_id}", payload: {}, as: Any, captures: { o_end: $.data.status } }
          assert:
            - "s1_cx == 0 and o_mid == PLACED (2026-08-20 + 7 = 2026-08-27 is NOT strictly before 2026-08-27; equality keeps)"
            - "s2_cx == 1 and o_end == CANCELLED (2026-08-27 < 2026-08-28, strictly)"

  # ===========================================================================
  # Section: consistency_model (claim-extraction-guide, immediate)
  # ===========================================================================
  - section: consistency_model
    instances:
      - name: immediate_visibility_in_mutation_responses
        claim_type: immediate_visibility
        grounds:
          - complexity_profile.consistency_model
          - state_machines.CustomerAccount.PENDING_CREDIT_to_ACTIVE
          - state_machines.Batch.BLENDING_to_AWAITING_QA
        distinguishing_aspect: |
          Consistency model is immediate: the approve-credit RESPONSE already
          shows status ACTIVE with version 2, and the record-blend response
          already shows AWAITING_QA with measured_brix and blended_by_user_id
          stamped — no re-read is needed to observe either mutation.
        test_recipe:
          setup:
            - "Customer (PENDING_CREDIT); DRAFT formula; tank with a BLENDING batch"
          setup_api_calls:
            - { call: "POST /v1/customer-accounts", payload: { name: "ImmVis", credit_limit_cents: 500000, minimum_run_units: 100, pallet_deposit_cents: 2000 }, as: PlantManager, captures: { cust_id: $.data.id } }
            - { call: "POST /v1/formulas", payload: { customer_id: "${cust_id}", formula_code: "IV-1", name: "Imm Juice", target_brix: 12.0, brix_tolerance: 0.3, process_type: "PASTEURIZATION", container_fill_ml: 473, concentrate_brix: 65.0, allergen_group: "NONE", shelf_life_days: 90, claims: ["ORGANIC"] }, as: ProductDeveloper, as_user_id: "dev-1", captures: { form_id: $.data.id } }
            - { call: "POST /v1/blending-tanks", payload: { tank_code: "T-IV", capacity_liters: 5000 }, as: PlantManager, captures: { tank_id: $.data.id } }
            - { call: "POST /v1/batches", payload: { formula_id: "${form_id}", tank_id: "${tank_id}", planned_start_at: "2026-08-10T08:00:00Z", planned_end_at: "2026-08-10T12:00:00Z", quantity_liters: 1000 }, as: BlendOperator, captures: { batch_id: $.data.id } }
            - { call: "POST /v1/batches/${batch_id}/start-blend", payload: {}, as: BlendOperator, as_user_id: "op-1" }
          trigger:
            - { call: "POST /v1/customer-accounts/${cust_id}/approve-credit", payload: {}, as: FinanceClerk, captures: { resp_status: $.data.status, resp_v: $.data.version } }
            - { call: "POST /v1/batches/${batch_id}/record-blend", payload: { measured_brix: 12.1 }, as: BlendOperator, as_user_id: "op-1", captures: { resp_bstatus: $.data.status, resp_brix: $.data.measured_brix, resp_blender: $.data.blended_by_user_id } }
          assert:
            - "resp_status == ACTIVE and resp_v == 2 (mutation visible in the same response)"
            - "resp_bstatus == AWAITING_QA and resp_brix == 12.1 and resp_blender == op-1 (side effects stamped atomically)"
