        side_effects: ["charge_cents = score.replacement_cost_cents posted to member.ledger_balance_cents; score.copies_lost += 1; copies_available recomputed"]
      - from: OVERDUE
        to: LOST
        trigger: "POST /v1/score-checkouts/{id}/mark-lost or system (member DROP/RESIGN cascade)"
        actor: "Librarian | system"
        preconditions: []
