            - "NO_ACTION close then succeeds; audit_status == CLOSED_NO_ACTION and penalty_cents == 0"

      - name: reinstate_company_blocked_by_open_disputes
        claim_type: Cross-entity validation
        grounds:
          - state_machines.FundCompany.SUSPENDED_to_ACTIVE
          - errors[ERR_OPEN_DISPUTES_REMAIN]
        distinguishing_aspect: "A suspended company with open_dispute_count > 0 cannot be reinstated until every dispute resolves."
        test_recipe:
          setup:
