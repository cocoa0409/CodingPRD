            - { call: "GET /fair-lending/findings", payload: { analysis_run_id: "${r1}" }, as: FairLendingAnalyst, captures: { f_kind: "$.data[0].kind", f_metric: "$.data[0].metric_value", f_thresh: "$.data[0].threshold_value", f_source: "$.data[0].source", f_status: "$.data[0].status" } }
