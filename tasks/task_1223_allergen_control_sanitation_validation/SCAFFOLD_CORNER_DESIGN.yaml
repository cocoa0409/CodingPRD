  # ===========================================================================
  # Section: cross_cutting_layers — OCC, cascading side effects, threshold
  # triggers (rate_threshold_triggers layer), derived-field reconciliation.
  # ===========================================================================
  - section: cross_cutting_layers
    instances:
      - name: occ_stale_line_version_on_schedule
        claim_type: occ_stale_version
        grounds: ["concurrency_rules[run-schedule-stale-line\"]", "errors[ERR_STALE_LINE_VERSION]"]
        distinguishing_aspect: "Scheduling run A bumps line.version; a second run B scheduled with the pre-bump expected_line_version is rejected with ERR_STALE_LINE_VERSION (412)."
        test_recipe:
          setup: ["Line ALLERGEN_DEDICATED; two DRAFT runs; line version captured before first schedule"]
          setup_api_calls:
            - call: "POST /qa/production-lines"
              payload: { line_code: "LINE-OCC1", description: "t", sanitation_class: "ALLERGEN_DEDICATED" }
              as: QaManager
              captures: { line: $.data.id, line_v: $.data.version }
            - call: "POST /qa/products"
              payload: { sku: "P-OCC1", product_name: "t", allergen_set: [], rework_class: "NO_REWORK" }
              as: QaManager
              captures: { prod: $.data.id }
            - call: "POST /qa/production-runs"
              payload: { line_id: "${line}", product_id: "${prod}", planned_start_utc: "2026-06-01T08:00:00Z", planned_end_utc: "2026-06-01T09:00:00Z" }
              as: QaSupervisor
              captures: { runA: $.data.id }
            - call: "POST /qa/production-runs"
              payload: { line_id: "${line}", product_id: "${prod}", planned_start_utc: "2026-06-01T10:00:00Z", planned_end_utc: "2026-06-01T11:00:00Z" }
              as: QaSupervisor
              captures: { runB: $.data.id }
            - call: "POST /qa/production-runs/${runA}/schedule"
              payload: { expected_line_version: "${line_v}" }
              as: QaSupervisor
          trigger:
            - call: "POST /qa/production-runs/${runB}/schedule"
              payload: { expected_line_version: "${line_v}" }
              as: QaSupervisor
              captures: { err: $.data.error_id }
          assert:
            - "error_id == ERR_STALE_LINE_VERSION (line.version advanced by run A's schedule)"

      - name: occ_stale_procedure_version_on_approve
        claim_type: occ_stale_version
        grounds: ["concurrency_rules[procedure-approve-stale-family\"]", "errors[ERR_STALE_PROCEDURE_VERSION]"]
        distinguishing_aspect: "Two DRAFT procedures in the same family; approving the first bumps family state; approving the second with a stale expected_procedure_version is rejected with ERR_STALE_PROCEDURE_VERSION."
        test_recipe:
          setup: ["Two DRAFT procedures with same procedure_code (versions 1 and 2)"]
          setup_api_calls:
            - call: "POST /qa/allergens"
              payload: { code: "MILK", display_name: "Milk", regulatory_class: "MAJOR_9" }
              as: QaManager
              captures: { al: $.data.id }
            - call: "POST /qa/changeover-procedures"
              payload: { procedure_code: "COP-OCC2", target_allergen_id: "${al}", method: "FULL_WET_WASH", min_swab_zones: 1, atp_action_level_rlu: 150, allergen_action_level_ppm: 2.0 }
              as: QaManager
              captures: { p1: $.data.id, p1_v: $.data.version }
            - call: "POST /qa/changeover-procedures"
              payload: { procedure_code: "COP-OCC2", target_allergen_id: "${al}", method: "DRY_SCRAPE", min_swab_zones: 2, atp_action_level_rlu: 100, allergen_action_level_ppm: 1.0 }
              as: QaManager
              captures: { p2: $.data.id, p2_v: $.data.version }
            - call: "POST /qa/changeover-procedures/${p1}/approve"
              payload: { expected_procedure_version: "${p1_v}" }
              as: QaManager
          trigger:
            - call: "POST /qa/changeover-procedures/${p2}/approve"
              payload: { expected_procedure_version: "${p2_v}" }
              as: QaManager
              captures: { err: $.data.error_id }
            - call: "GET /qa/changeover-procedures/${p2}"
              as: QaManager
              captures: { p2_v_fresh: $.data.version }
            - call: "POST /qa/changeover-procedures/${p2}/approve"
              payload: { expected_procedure_version: "${p2_v_fresh}" }
              as: QaManager
              captures: { p2_status: $.data.status, p1_status_after: $.data.is_current }
            - call: "GET /qa/changeover-procedures/${p1}"
              as: QaManager
              captures: { p1_status: $.data.status, p1_current: $.data.is_current }
          assert:
            - "Approving p2 with stale version yields ERR_STALE_PROCEDURE_VERSION"
            - "Retrying with fresh version succeeds; p2.status == APPROVED, is_current == true"
            - "p1 auto-superseeded: status == SUPERSEDED, is_current == false"

      - name: suspension_threshold_auto_transition
        claim_type: rate_threshold_trigger
        grounds: ["calculations.training_score", "state_machines.QaTechnician.ACTIVE_to_SUSPENDED"]
        distinguishing_aspect: "Cumulative deductions crossing the 60-point suspension threshold auto-transition ACTIVE -> SUSPENDED at exactly score < 60 (score 60 stays ACTIVE; 59 suspends)."
        test_recipe:
          setup: ["Tech with 8 MAJOR findings (8*5=40 -> score 60, still ACTIVE); then one MINOR (score 58 -> SUSPENDED)"]
          setup_api_calls:
            - call: "POST /qa/allergens"
              payload: { code: "MILK", display_name: "Milk", regulatory_class: "MAJOR_9" }
              as: QaManager
              captures: { al: $.data.id }
            - call: "POST /qa/technicians"
              payload: { tech_code: "TECH-TH", full_name: "t", certified_allergen_ids: ["${al}"], certification_expiry_utc: "2027-01-01T00:00:00Z" }
              as: QaManager
              captures: { t1: $.data.id }
            - call: "POST /qa/technicians"
              payload: { tech_code: "TECH-TH-A", full_name: "a", certified_allergen_ids: ["${al}"], certification_expiry_utc: "2027-01-01T00:00:00Z" }
              as: QaManager
              captures: { t2: $.data.id }
            - call: "POST /qa/audit-findings"
              payload: { technician_id: "${t1}", auditor_id: "${t2}", finding_type: "PROCEDURE_DEVIATION", severity: "MAJOR", corrective_action_due_utc: "2026-12-01T00:00:00Z" }
              as: Auditor
              as_user_id: "${t2}"
            - call: "POST /qa/audit-findings"
              payload: { technician_id: "${t1}", auditor_id: "${t2}", finding_type: "PROCEDURE_DEVIATION", severity: "MAJOR", corrective_action_due_utc: "2026-12-01T00:00:00Z" }
              as: Auditor
              as_user_id: "${t2}"
            - call: "POST /qa/audit-findings"
              payload: { technician_id: "${t1}", auditor_id: "${t2}", finding_type: "DOCUMENTATION_GAP", severity: "MAJOR", corrective_action_due_utc: "2026-12-01T00:00:00Z" }
              as: Auditor
              as_user_id: "${t2}"
            - call: "POST /qa/audit-findings"
              payload: { technician_id: "${t1}", auditor_id: "${t2}", finding_type: "DOCUMENTATION_GAP", severity: "MAJOR", corrective_action_due_utc: "2026-12-01T00:00:00Z" }
              as: Auditor
              as_user_id: "${t2}"
            - call: "POST /qa/audit-findings"
              payload: { technician_id: "${t1}", auditor_id: "${t2}", finding_type: "SWAB_TECHNIQUE", severity: "MAJOR", corrective_action_due_utc: "2026-12-01T00:00:00Z" }
              as: Auditor
              as_user_id: "${t2}"
            - call: "POST /qa/audit-findings"
              payload: { technician_id: "${t1}", auditor_id: "${t2}", finding_type: "SWAB_TECHNIQUE", severity: "MAJOR", corrective_action_due_utc: "2026-12-01T00:00:00Z" }
              as: Auditor
              as_user_id: "${t2}"
            - call: "POST /qa/audit-findings"
              payload: { technician_id: "${t1}", auditor_id: "${t2}", finding_type: "TRAINING_DEFICIENCY", severity: "MAJOR", corrective_action_due_utc: "2026-12-01T00:00:00Z" }
              as: Auditor
              as_user_id: "${t2}"
            - call: "POST /qa/audit-findings"
              payload: { technician_id: "${t1}", auditor_id: "${t2}", finding_type: "TRAINING_DEFICIENCY", severity: "MAJOR", corrective_action_due_utc: "2026-12-01T00:00:00Z" }
              as: Auditor
              as_user_id: "${t2}"
          trigger:
            - call: "GET /qa/technicians/${t1}"
              as: QaManager
              captures: { st60: $.data.status, sc60: $.data.training_score }
            - call: "POST /qa/audit-findings"
              payload: { technician_id: "${t1}", auditor_id: "${t2}", finding_type: "LABEL_CONTROL", severity: "MINOR", corrective_action_due_utc: "2026-12-01T00:00:00Z" }
              as: Auditor
              as_user_id: "${t2}"
            - call: "GET /qa/technicians/${t1}"
              as: QaManager
              captures: { st58: $.data.status, sc58: $.data.training_score }
          assert:
            - "After 8 MAJOR findings: score == 60 and status == ACTIVE (threshold is strict < 60)"
            - "After additional MINOR: score == 58 and status == SUSPENDED (auto)"

      - name: supplier_allergen_change_creates_incident_and_stale_pins
        claim_type: derived_field_reconciliation
        grounds: ["endpoints[POST /qa/products/{productId}/supplier-allergen-change\"]", "calculations.label_reconciliation_verdict"]
        distinguishing_aspect: "Supplier change bumps Product.label_revision; existing runs keep label_revision_snapshot (stale-pin); new reconciliations against those runs flag REVISION_MISMATCH when printed with the NEW revision."
