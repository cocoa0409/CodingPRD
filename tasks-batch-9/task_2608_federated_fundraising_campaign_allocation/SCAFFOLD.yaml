scenario: |
  Generate task harder than expert level!

  2608. Federated Fundraising Campaign & Allocation (united fundraising organization): workplace
  campaign organization with employer partnerships, campaign coordinators and giving methods
  including payroll deduction, pledge processing with designation options to specific agencies and
  undesignated pool contributions, pledge loss estimation and shrinkage accounting for uncollected
  payroll pledges, agency membership standards with financial review, governance requirements and
  program eligibility, allocation process with volunteer review panels evaluating agency requests
  against community priorities, outcome reporting requirements from funded agencies with site
  visits, donor designation honoring with fees and processing rules, community impact fund strategy
  balancing designations against strategic priorities

domain_name: federated-fundraising-campaign-allocation
api_prefix: "/fundraising"

response_envelope:
  success: |
    { "meta": { "api_request_id": "req_xxx", "api_request_timestamp": "ISO8601" },
      "response_type": "object" | "array", "data": {} }
  error: |
    { "meta": { ... }, "response_type": "error",
      "data": { "error_id": "ERR_XXX", "message": "..." } }
  pagination_fields: ["limit", "offset", "total_count", "has_more"]
  pagination_defaults: { limit: 10, min: 1, max: 100, offset: 0 }

complexity_profile:
  primary_archetype: "Quota / allocation"
  secondary_archetype: "Multi-party negotiation"
  complexity_layers:
    - dual_variant_calculation
    - cascading_side_effects
    - optimistic_concurrency
    - rate_threshold_triggers

  entity_topology: graph
  # Pledges fan out to Agencies through the PledgeDesignation junction; Panelists fan out to
  # AllocationCycles through PanelAssignment and to AllocationRequests through PanelScore; an
  # OutcomeReport points back at both an AllocationRequest and a Panelist. Money therefore flows
  # along a many-to-many graph (Employer -> Campaign -> Pledge -> Designation -> Agency) that is
  # re-entered from the opposite direction by the allocation graph
  # (AllocationCycle -> AllocationRequest -> Agency), and the two directions meet on Agency.

  state_machine_shape: parallel
  # Pledge carries two independent state axes on one row: `designation_status`
  # (DRAFT -> CONFIRMED -> AMENDED -> CONFIRMED, cyclic) and `collection_status`
  # (PENDING -> PARTIAL -> COLLECTED | WRITTEN_OFF). Campaign and AllocationRequest add
  # branching fork shapes, OutcomeReport adds a revision cycle, AllocationCycle adds a
  # posture cycle (OPEN <-> RESTRICTED).

  relationship_patterns:
    - one_to_many        # Employer -> Campaign -> Pledge; AllocationCycle -> AllocationRequest
    - many_to_many       # Pledge <-> Agency via PledgeDesignation; Panelist <-> AllocationCycle via PanelAssignment
    - cross_aggregate    # Agency.designated_passthrough_ytd is fed by the Campaign aggregate and consumed by the AllocationCycle aggregate

  role_model: segregation_of_duties
  # FinanceReviewer certifies agency financial reviews and writes off pledges but may never issue
  # an award; AllocationsDirector issues awards but may never certify a financial review; a
  # VolunteerPanelist who scored an AllocationRequest may never conduct the site visit on that
  # same request's OutcomeReport (ERR_SEGREGATION_OF_DUTIES).

  consistency_model: immediate

# =============================================================================
# 1.1 Entity-Relationship Table
# =============================================================================
entities:
  - name: Employer
    parent: null
    common_fields: true
    fields:
      - name: legal_name
        type: string
        source: input
        description: Registered name of the workplace campaign partner.
        constraints: "1..200 chars, non-blank"
      - name: employee_count
        type: integer
        source: input
        description: Headcount used as the solicitation universe for the campaign.
        constraints: ">= 1"
      - name: payroll_periods_per_year
        type: integer
        source: input
        description: Number of payroll runs per year; 0 means the employer cannot host payroll deduction.
        default: 26
        constraints: "0..52"
      - name: historical_shrinkage_rate_bps
        type: integer
        source: input
        description: Employer-specific historical payroll-pledge loss rate in basis points, used by the PROVISIONAL variant of campaign_pledge_loss_estimate.
        default: 800
        constraints: "0..10000"
      - name: partnership_signed
        type: boolean
        source: input
        description: Whether the workplace partnership agreement was countersigned at creation time.
        default: false
      - name: status
        type: enum
        source: computed
        description: "Partnership lifecycle. Set to ACTIVE at creation when partnership_signed is true, else PROSPECT; PROSPECT -> ACTIVE via POST /employers/{id}/activate; forced to SUSPENDED by the campaign_escrow_hold cascade."
        default: PROSPECT
        constraints: "one of {PROSPECT, ACTIVE, SUSPENDED}"
      - name: suspended_reason
        type: string
        source: system
        description: Reason code stamped when status becomes SUSPENDED; null otherwise.
        default: null
        constraints: "null or one of {ESCROW_HOLD_SHRINKAGE}"
      - name: active_campaign_count
        type: integer
        source: computed
        description: "Count of Campaign rows with employer_id == this.id and posture IN {OPEN, SOLICITATION_CLOSED}."
        default: 0

  - name: CampaignCoordinator
    parent: Employer
    common_fields: true
    fields:
      - name: employer_id
        type: string
        source: input
        description: "FK -> Employer.id; the workplace this coordinator solicits inside."
      - name: full_name
        type: string
        source: input
        description: Coordinator's name as printed on campaign materials.
        constraints: "1..120 chars"
      - name: email
        type: string
        source: input
        description: Coordinator contact address; unique across all CampaignCoordinator rows.
        constraints: "must contain '@'; globally unique"
      - name: coordinator_role
        type: enum
        source: input
        description: LEAD coordinators may record pledges for any department; DEPARTMENT coordinators are informational only for this API.
        default: DEPARTMENT
        constraints: "one of {LEAD, DEPARTMENT}"
      - name: status
        type: enum
        source: computed
        description: "ACTIVE at creation; forced to INACTIVE by the campaign_escrow_hold cascade when the parent Employer becomes SUSPENDED."
        default: ACTIVE
        constraints: "one of {ACTIVE, INACTIVE}"
      - name: recorded_pledge_count
        type: integer
        source: computed
        description: "Count of Pledge rows with recorded_by_coordinator_id == this.id and designation_status IN {CONFIRMED, AMENDED, LOCKED}."
        default: 0

  - name: Campaign
    parent: Employer
    common_fields: true
    fields:
      - name: employer_id
        type: string
        source: input
        description: "FK -> Employer.id; the workplace hosting this annual campaign."
      - name: campaign_year
        type: integer
        source: input
        description: Fundraising year label for the campaign.
        constraints: "2020..2100"
      - name: solicitation_start_date
        type: string
        source: input
        description: Inclusive first date of the solicitation window (ISO date, YYYY-MM-DD).
        constraints: "valid ISO date"
      - name: solicitation_end_date
        type: string
        source: input
        description: Exclusive last date of the solicitation window (ISO date). The window is half-open [start, end).
        constraints: "valid ISO date, strictly greater than solicitation_start_date"
      - name: loss_reserve_amount
        type: number
        source: input
        description: Campaign-level reserve that absorbs whole uncollected pledges during the FINAL variant of campaign_pledge_loss_estimate.
        default: 0.00
        constraints: ">= 0, 2 decimal places"
      - name: posture
        type: enum
        source: computed
        description: "Aggregate campaign posture gating all child Pledge writes. PLANNED at creation."
        default: PLANNED
        constraints: "one of {PLANNED, OPEN, SOLICITATION_CLOSED, RECONCILED, ESCROW_HOLD}"
      - name: confirmed_gross_total
        type: number
        source: computed
        description: "Sum of Pledge.gross_amount over pledges of this campaign with designation_status IN {CONFIRMED, AMENDED, LOCKED}."
        default: 0.00
      - name: designated_gross_total
        type: number
        source: computed
        description: "Sum of PledgeDesignation.designated_amount over ACTIVE designations whose parent Pledge belongs to this campaign and has designation_status IN {CONFIRMED, AMENDED, LOCKED}."
        default: 0.00
      - name: undesignated_gross_total
        type: number
        source: computed
        description: "Sum of Pledge.undesignated_amount over pledges of this campaign with designation_status IN {CONFIRMED, AMENDED, LOCKED}; the community impact (undesignated) pool contribution."
        default: 0.00
      - name: designation_fee_total
        type: number
        source: computed
        description: "Sum of Pledge.designation_fee_total over pledges of this campaign with designation_status IN {CONFIRMED, AMENDED, LOCKED}."
        default: 0.00
      - name: projected_payroll_pledge_total
        type: number
        source: computed
        description: "Sum of Pledge.gross_amount over pledges of this campaign with giving_method == PAYROLL_DEDUCTION, designation_status IN {CONFIRMED, AMENDED} and collection_status IN {PENDING, PARTIAL}."
        default: 0.00
      - name: provisional_estimated_loss
        type: number
        source: computed
        description: Output of campaign_pledge_loss_estimate variant PROVISIONAL; null until POST /campaigns/{id}/close-solicitation runs.
        default: null
      - name: provisional_net_expected_revenue
        type: number
        source: computed
        description: confirmed_gross_total minus provisional_estimated_loss; null until close-solicitation.
        default: null
      - name: reserve_absorbed_amount
        type: number
        source: computed
        description: Portion of uncollected pledge value absorbed whole by loss_reserve_amount during reconcile; null until POST /campaigns/{id}/reconcile runs.
        default: null
      - name: final_actual_loss
        type: number
        source: computed
        description: Output of campaign_pledge_loss_estimate variant FINAL; null until reconcile.
        default: null
      - name: final_net_expected_revenue
        type: number
        source: computed
        description: confirmed_gross_total minus final_actual_loss; null until reconcile.
        default: null
      - name: realized_shrinkage_rate_bps
        type: integer
        source: computed
        description: final_actual_loss expressed in basis points of confirmed_gross_total, rounded to 0 decimals half-up; null until reconcile.
        default: null
      - name: solicitation_closed_at
        type: datetime
        source: system
        description: Logical-clock timestamp when posture became SOLICITATION_CLOSED; null before.
        default: null
      - name: reconciled_at
        type: datetime
        source: system
        description: Logical-clock timestamp when posture became RECONCILED or ESCROW_HOLD; null before.
        default: null

  - name: Pledge
    parent: Campaign
    common_fields: true
    fields:
      - name: campaign_id
        type: string
        source: input
        description: "FK -> Campaign.id; the campaign this pledge was solicited inside."
      - name: recorded_by_coordinator_id
        type: string
        source: system
        description: "FK -> CampaignCoordinator.id; copied from the X-User-ID header of the CampaignCoordinator who called POST /campaigns/{id}/pledges."
      - name: donor_reference
        type: string
        source: input
        description: Employer-side donor identifier; unique within the campaign and used as the final deterministic tie-break in chronological loss absorption.
        constraints: "1..40 chars; unique per campaign_id"
      - name: giving_method
        type: enum
        source: input
        description: How the donor funds the pledge. PAYROLL_DEDUCTION requires Employer.payroll_periods_per_year > 0.
        constraints: "one of {PAYROLL_DEDUCTION, ONE_TIME_CHECK, CREDIT_CARD, STOCK_GIFT}"
      - name: gross_amount
        type: number
        source: input
        description: Total pledged amount before designation fees.
        constraints: "> 0, 2 decimal places"
      - name: designation_status
        type: enum
        source: computed
        description: "Designation axis of the parallel state machine. DRAFT at creation; CONFIRMED by confirm; AMENDED by designations:amend; back to CONFIRMED by confirm; LOCKED by the reconcile cascade."
        default: DRAFT
        constraints: "one of {DRAFT, CONFIRMED, AMENDED, LOCKED}"
      - name: collection_status
        type: enum
        source: computed
        description: "Collection axis of the parallel state machine, independent of designation_status. PENDING at creation; PARTIAL / COLLECTED by collections; WRITTEN_OFF by write-off."
        default: PENDING
        constraints: "one of {PENDING, PARTIAL, COLLECTED, WRITTEN_OFF}"
      - name: designated_amount_total
        type: number
        source: computed
        description: "Sum of PledgeDesignation.designated_amount over this pledge's designations with status == ACTIVE."
        default: 0.00
      - name: undesignated_amount
        type: number
        source: computed
        description: gross_amount minus designated_amount_total; the donor's contribution to the community impact (undesignated) pool.
        default: 0.00
      - name: designation_fee_total
        type: number
        source: computed
        description: Output of pledge_designation_fee_allocation; sum of the per-line processing_fee values, each already rounded to cents.
        default: 0.00
      - name: net_designated_total
        type: number
        source: computed
        description: designated_amount_total minus designation_fee_total.
        default: 0.00
      - name: collected_amount
        type: number
        source: computed
        description: Sum of remittance amounts accepted by POST /pledges/{id}/collections.
        default: 0.00
      - name: uncollected_amount
        type: number
        source: computed
        description: gross_amount minus collected_amount; the shrinkage exposure of this pledge.
        default: 0.00
      - name: amend_count
        type: integer
        source: computed
        description: Number of successful POST /pledges/{id}/designations:amend calls against this pledge.
        default: 0
      - name: write_off_reason_code
        type: string
        source: system
        description: Reason code recorded when collection_status becomes WRITTEN_OFF; null otherwise.
        default: null
        constraints: "null or one of {TERMINATION, LEAVE_OF_ABSENCE, DONOR_REVOKED, EMPLOYER_DEFAULT}"

  - name: PledgeDesignation
    parent: Pledge
    common_fields: true
    fields:
      - name: pledge_id
        type: string
        source: input
        description: "FK -> Pledge.id; the pledge this designation line splits."
      - name: agency_id
        type: string
        source: input
        description: "FK -> Agency.id; the member agency the donor designated this line to."
      - name: designation_sequence
        type: integer
        source: system
        description: 1-based position of this line inside the designations array of the creating request; pins the deterministic order of per-line fee rounding.
        constraints: ">= 1, unique per (pledge_id, status == ACTIVE)"
      - name: designated_amount
        type: number
        source: input
        description: Gross amount the donor directed to this agency.
        constraints: ">= 25.00 (MIN_DESIGNATION_AMOUNT), 2 decimal places"
      - name: processing_fee
        type: number
        source: computed
        description: Per-line donor-designation processing fee from pledge_designation_fee_allocation.
        default: 0.00
      - name: net_designated_amount
        type: number
        source: computed
        description: designated_amount minus processing_fee; the amount actually honored to the agency.
        default: 0.00
      - name: collected_designated_amount
        type: number
        source: computed
        description: net_designated_amount scaled by the parent pledge's collection ratio, rounded to cents half-up.
        default: 0.00
      - name: status
        type: enum
        source: computed
        description: "ACTIVE at creation; SUPERSEDED when designations:amend replaces the line set; UNCOLLECTED when the pledge_write_off cascade reaches this line."
        default: ACTIVE
        constraints: "one of {ACTIVE, SUPERSEDED, UNCOLLECTED}"

  - name: Agency
    parent: null
    common_fields: true
    fields:
      - name: legal_name
        type: string
        source: input
        description: Registered name of the member agency.
        constraints: "1..200 chars"
      - name: ein
        type: string
        source: input
        description: Employer identification number of the agency; globally unique.
        constraints: "exactly 9 digits; globally unique"
      - name: primary_priority_area
        type: enum
        source: input
        description: The community priority area the agency's core programs serve.
        constraints: "one of {BASIC_NEEDS, EDUCATION, HEALTH, FINANCIAL_STABILITY}"
      - name: membership_status
        type: enum
        source: computed
        description: "Membership standing. APPLICANT at creation; UNDER_FINANCIAL_REVIEW once a PENDING AgencyReview exists; GOOD_STANDING / PROBATION / SUSPENDED_MEMBERSHIP set by certify; PROBATION -> GOOD_STANDING via reinstate."
        default: APPLICANT
        constraints: "one of {APPLICANT, UNDER_FINANCIAL_REVIEW, GOOD_STANDING, PROBATION, SUSPENDED_MEMBERSHIP}"
      - name: latest_standing_score
        type: number
        source: computed
        description: "certified_score of the CERTIFIED AgencyReview for this agency ordered by fiscal_year DESC, then created_at DESC, taking the first row; null when no review is CERTIFIED."
        default: null
      - name: designated_passthrough_ytd
        type: number
        source: computed
        description: "Sum of PledgeDesignation.collected_designated_amount over designations with agency_id == this.id and status == ACTIVE; caps the designation_offset in community_impact_fund_allocation."
        default: 0.00
      - name: open_review_count
        type: integer
        source: computed
        description: "Count of AgencyReview rows for this agency with status == PENDING."
        default: 0
      - name: probation_count
        type: integer
        source: computed
        description: Number of times membership_status has entered PROBATION.
        default: 0
      - name: outcome_report_delinquent
        type: boolean
        source: computed
        description: "True when at least one AllocationRequest of this agency has status IN {AWARDED, REPORTING} and the logical clock is strictly past its outcome-report due date with no ACCEPTED OutcomeReport."
        default: false

  - name: AgencyReview
    parent: Agency
    common_fields: true
    fields:
      - name: agency_id
        type: string
        source: input
        description: "FK -> Agency.id; the agency under financial and governance review."
      - name: fiscal_year
        type: integer
        source: input
        description: Fiscal year the reviewed financial statements cover.
        constraints: "2020..2100; unique per (agency_id, fiscal_year)"
      - name: program_expense_ratio
        type: number
        source: input
        description: Self-reported program expense over total expense.
        constraints: "0.0000..1.0000, 4 decimal places"
      - name: admin_expense_ratio
        type: number
        source: input
        description: Self-reported management-and-general plus fundraising expense over total expense.
        constraints: "0.0000..1.0000, 4 decimal places"
      - name: months_operating_reserve
        type: number
        source: input
        description: Self-reported unrestricted net assets expressed in months of operating expense.
        constraints: ">= 0, <= 60, 2 decimal places"
      - name: governance_checklist_passed_count
        type: integer
        source: input
        description: Number of the 10 mandatory governance requirements the agency satisfies (independent board, conflict policy, audit committee, and so on).
        constraints: "0..10"
      - name: audit_opinion
        type: enum
        source: input
        description: Opinion on the submitted audited financial statements.
        constraints: "one of {UNQUALIFIED, QUALIFIED, ADVERSE, NONE}"
      - name: audited_program_expense_ratio
        type: number
        source: system
        description: Audited program expense ratio supplied at certify time; null while status == PENDING.
        default: null
      - name: audited_admin_expense_ratio
        type: number
        source: system
        description: Audited administrative expense ratio supplied at certify time; null while status == PENDING.
        default: null
      - name: audited_months_operating_reserve
        type: number
        source: system
        description: Audited months of operating reserve supplied at certify time; null while status == PENDING.
        default: null
      - name: preliminary_score
        type: number
        source: computed
        description: Output of agency_financial_standing_score variant PRELIMINARY, computed at review creation from the self-reported inputs.
        default: 0.00
      - name: certified_score
        type: number
        source: computed
        description: Output of agency_financial_standing_score variant CERTIFIED, computed at certify time from the audited inputs; null while status == PENDING.
        default: null
      - name: restatement_penalty_applied
        type: boolean
        source: computed
        description: True when the audited program expense ratio fell more than RESTATEMENT_TOLERANCE below the self-reported figure, triggering the restatement penalty in the CERTIFIED variant.
        default: false
      - name: standards_met
        type: boolean
        source: computed
        description: True when certified_score >= STANDARDS_PASS_SCORE; null while status == PENDING.
        default: null
      - name: review_basis
        type: enum
        source: computed
        description: "SELF_REPORTED at creation; AUDITED after certify."
        default: SELF_REPORTED
        constraints: "one of {SELF_REPORTED, AUDITED}"
      - name: status
        type: enum
        source: computed
        description: "PENDING at creation; CERTIFIED after POST /agencies/{id}/reviews/{review_id}/certify."
        default: PENDING
        constraints: "one of {PENDING, CERTIFIED}"

  - name: AllocationCycle
    parent: null
    common_fields: true
    fields:
      - name: cycle_year
        type: integer
        source: input
        description: Allocation year the cycle distributes.
        constraints: "2020..2100; unique"
      - name: focus_priority_area
        type: enum
        source: input
        description: Community priority area the volunteer panels are told to weight upward this cycle.
        constraints: "one of {BASIC_NEEDS, EDUCATION, HEALTH, FINANCIAL_STABILITY}"
      - name: opening_undesignated_pool
        type: number
        source: input
        description: Community impact fund available for undesignated awards when the cycle opens.
        constraints: "> 0, 2 decimal places"
      - name: max_award_per_agency
        type: number
        source: input
        description: Hard per-agency ceiling applied before scoring scales the request down.
        constraints: "> 0, 2 decimal places"
      - name: request_window_start
        type: string
        source: input
        description: Inclusive first date on which agencies may submit allocation requests (ISO date).
        constraints: "valid ISO date"
      - name: request_window_end
        type: string
        source: input
        description: Exclusive last date of the request window (ISO date); the window is half-open [start, end).
        constraints: "valid ISO date, strictly greater than request_window_start"
      - name: posture
        type: enum
        source: computed
        description: "Aggregate cycle posture gating panel scoring and awards. DRAFT at creation; OPEN via open; OPEN <-> RESTRICTED by the agency_probation cascade and its reinstate reversal; FROZEN via freeze."
        default: DRAFT
        constraints: "one of {DRAFT, OPEN, RESTRICTED, FROZEN}"
      - name: available_undesignated_pool
        type: number
        source: computed
        description: "opening_undesignated_pool minus the sum of AllocationRequest.total_award over requests of this cycle with status IN {AWARDED, REPORTING, CLOSED_SATISFIED}."
        default: 0.00
      - name: awarded_total
        type: number
        source: computed
        description: "Sum of AllocationRequest.total_award over requests of this cycle with status IN {AWARDED, REPORTING, CLOSED_SATISFIED}."
        default: 0.00
      - name: submitted_request_count
        type: integer
        source: computed
        description: "Count of AllocationRequest rows of this cycle with status IN {SUBMITTED, UNDER_PANEL_REVIEW, SUSPENDED_REVIEW, PANEL_APPROVED, PANEL_DECLINED, AWARDED, REPORTING, CLOSED_SATISFIED} (that is, every request that has ever been submitted)."
        default: 0
      - name: suspended_request_count
        type: integer
        source: computed
        description: "Count of AllocationRequest rows of this cycle with status == SUSPENDED_REVIEW."
        default: 0
      - name: suspended_request_ratio
        type: number
        source: computed
        description: "suspended_request_count divided by submitted_request_count, rounded to 4 decimals half-up; 0.0000 when submitted_request_count == 0."
        default: 0.0000
      - name: awards_blocked
        type: boolean
        source: computed
        description: "True whenever posture is RESTRICTED or FROZEN; set by the agency_probation cascade link 4 and by freeze, cleared only by the reinstate reversal returning RESTRICTED -> OPEN."
        default: false

  - name: AllocationRequest
    parent: AllocationCycle
    common_fields: true
    fields:
      - name: cycle_id
        type: string
        source: input
        description: "FK -> AllocationCycle.id; the allocation cycle this request competes in."
      - name: agency_id
        type: string
        source: input
        description: "FK -> Agency.id; the member agency requesting community impact funds."
      - name: requested_amount
        type: number
        source: input
        description: Amount the agency asks the volunteer panel to fund.
        constraints: "> 0, 2 decimal places"
      - name: priority_area
        type: enum
        source: input
        description: Community priority area this specific request serves; a match against the cycle's focus_priority_area earns the panel multiplier.
        constraints: "one of {BASIC_NEEDS, EDUCATION, HEALTH, FINANCIAL_STABILITY}"
      - name: narrative_summary
        type: string
        source: input
        description: Program narrative the panel reads before scoring.
        constraints: "1..2000 chars"
      - name: status
        type: enum
        source: computed
        description: "DRAFT at creation; SUBMITTED via submit; UNDER_PANEL_REVIEW automatically on the first eligible PanelScore; SUSPENDED_REVIEW / back by the agency_probation cascade; PANEL_APPROVED or PANEL_DECLINED via finalize-review; AWARDED via awards; PANEL_APPROVED again via rescind-award; REPORTING on outcome-report creation; CLOSED_SATISFIED when the report is ACCEPTED."
        default: DRAFT
        constraints: "one of {DRAFT, SUBMITTED, UNDER_PANEL_REVIEW, SUSPENDED_REVIEW, PANEL_APPROVED, PANEL_DECLINED, AWARDED, REPORTING, CLOSED_SATISFIED}"
      - name: status_before_suspension
        type: enum
        source: system
        description: "Status captured when the agency_probation cascade forced SUSPENDED_REVIEW, restored by the reinstate reversal; null otherwise."
        default: null
        constraints: "null or one of {SUBMITTED, UNDER_PANEL_REVIEW}"
      - name: eligible_score_count
        type: integer
        source: computed
        description: "Count of PanelScore rows for this request whose scoring panelist holds a PanelAssignment on this request's cycle with conflict_declared == false."
        default: 0
      - name: composite_score
        type: number
        source: computed
        description: Output of request_panel_composite_score; null until finalize-review succeeds.
        default: null
      - name: base_award
        type: number
        source: computed
        description: Step 3 output of community_impact_fund_allocation; null until an award is issued, and reset to null by rescind-award.
        default: null
      - name: designation_offset
        type: number
        source: computed
        description: Step 4 output of community_impact_fund_allocation - the designation-honoring offset that keeps the community impact fund balanced against what the agency already received in designations; null until an award is issued.
        default: null
      - name: strategic_supplement
        type: number
        source: computed
        description: Step 5 output of community_impact_fund_allocation - the strategic-priority top-up; null until an award is issued.
        default: null
      - name: total_award
        type: number
        source: computed
        description: Step 7 output of community_impact_fund_allocation; null until an award is issued, and reset to null by rescind-award.
        default: null
      - name: submitted_at
        type: datetime
        source: system
        description: Logical-clock timestamp of the successful submit call; null before.
        default: null
      - name: awarded_at
        type: datetime
        source: system
        description: Logical-clock timestamp of the successful award call; reset to null by rescind-award.
        default: null
      - name: outcome_report_due_date
        type: string
        source: computed
        description: awarded_at date plus OUTCOME_REPORT_DUE_DAYS calendar days (ISO date); null until an award is issued and reset to null by rescind-award.
        default: null

  - name: Panelist
    parent: null
    common_fields: true
    fields:
      - name: full_name
        type: string
        source: input
        description: Volunteer reviewer's name.
        constraints: "1..120 chars"
      - name: email
        type: string
        source: input
        description: Volunteer reviewer's contact address; globally unique.
        constraints: "must contain '@'; globally unique"
      - name: expertise_area
        type: enum
        source: input
        description: Subject-matter lane the volunteer is recruited for.
        constraints: "one of {BASIC_NEEDS, EDUCATION, HEALTH, FINANCIAL_STABILITY, FINANCE}"
      - name: submitted_score_count
        type: integer
        source: computed
        description: "Count of PanelScore rows with panelist_id == this.id."
        default: 0
      - name: site_visit_count
        type: integer
        source: computed
        description: "Count of OutcomeReport rows with site_visit_panelist_id == this.id."
        default: 0

  - name: PanelAssignment
    parent: AllocationCycle
    common_fields: true
    fields:
      - name: cycle_id
        type: string
        source: input
        description: "FK -> AllocationCycle.id; the cycle whose review panel the volunteer sits on."
      - name: panelist_id
        type: string
        source: input
        description: "FK -> Panelist.id; the volunteer seated on this cycle's panel."
      - name: conflict_declared
        type: boolean
        source: input
        description: Whether the volunteer declared a conflict of interest covering this cycle; when true every score they file is ineligible and scoring is refused outright.
        default: false
      - name: assignment_role
        type: enum
        source: input
        description: CHAIR volunteers convene the panel; SCORER volunteers only score. Both may file scores.
        default: SCORER
        constraints: "one of {SCORER, CHAIR}"
      - name: submitted_score_count
        type: integer
        source: computed
        description: "Count of PanelScore rows filed by this assignment's panelist against requests of this assignment's cycle."
        default: 0

  - name: PanelScore
    parent: AllocationRequest
    common_fields: true
    fields:
      - name: request_id
        type: string
        source: input
        description: "FK -> AllocationRequest.id; the request being scored."
      - name: panelist_id
        type: string
        source: system
        description: "FK -> Panelist.id; copied from the X-User-ID header of the VolunteerPanelist who filed the score."
      - name: priority_alignment_score
        type: integer
        source: input
        description: How well the request aligns with community priorities.
        constraints: "0..100"
      - name: outcome_evidence_score
        type: integer
        source: input
        description: Strength of the agency's evidence that the program produces outcomes.
        constraints: "0..100"
      - name: capacity_score
        type: integer
        source: input
        description: Organizational capacity to deliver the proposed program.
        constraints: "0..100"
      - name: weighted_score
        type: number
        source: computed
        description: Per-score weighted blend from request_panel_composite_score step 1, rounded to 2 decimals half-up before any averaging.
        default: 0.00
      - name: eligible
        type: boolean
        source: computed
        description: "True at creation - only conflict-free assigned panelists may file at all, per validation priority 22 - and flipped to false by step 3 of request_panel_composite_score when this row is the trimmed high or low of a pool of TRIM_MIN_COUNT or more scores. Only eligible == true rows enter the mean."
        default: true

  - name: OutcomeReport
    parent: AllocationRequest
    common_fields: true
    fields:
      - name: request_id
        type: string
        source: input
        description: "FK -> AllocationRequest.id; the funded request this report accounts for."
      - name: reporting_period_end
        type: string
        source: input
        description: Last date of the outcome reporting period (ISO date).
        constraints: "valid ISO date"
      - name: persons_served
        type: integer
        source: input
        description: Unduplicated individuals served with the award.
        constraints: ">= 0"
      - name: outcome_metric_name
        type: string
        source: input
        description: Name of the outcome measure the agency committed to.
        constraints: "1..120 chars"
      - name: outcome_metric_value
        type: number
        source: input
        description: Achieved value of the committed outcome measure.
        constraints: ">= 0"
      - name: funds_expended
        type: number
        source: input
        description: Award dollars actually spent in the reporting period.
        constraints: ">= 0, 2 decimal places"
      - name: status
        type: enum
        source: computed
        description: "SUBMITTED at creation and after resubmit; SITE_VISIT_SCHEDULED via site-visit; SITE_VISIT_COMPLETED via site-visit/complete; REVISION_REQUESTED via request-revision; back to SUBMITTED via resubmit; ACCEPTED via accept."
        default: SUBMITTED
        constraints: "one of {SUBMITTED, SITE_VISIT_SCHEDULED, SITE_VISIT_COMPLETED, REVISION_REQUESTED, ACCEPTED}"
      - name: revision_round_count
        type: integer
        source: computed
        description: Number of times request-revision has fired on this report; capped by MAX_REVISION_ROUNDS.
        default: 0
      - name: site_visit_panelist_id
        type: string
        source: system
        description: "FK -> Panelist.id; copied from the X-User-ID header of the VolunteerPanelist who scheduled the site visit. Null until scheduled."
        default: null
      - name: site_visit_window_start
        type: string
        source: system
        description: Inclusive first date of the scheduled site-visit window (ISO date); null until scheduled.
        default: null
      - name: site_visit_window_end
        type: string
        source: system
        description: Inclusive last date of the scheduled site-visit window (ISO date). The window is a CLOSED interval and carries a SITE_VISIT_BUFFER_DAYS spacing requirement against the same panelist's other windows.
        default: null
      - name: site_visit_findings
        type: string
        source: system
        description: Narrative recorded when the site visit is completed; null before.
        default: null
      - name: expenditure_variance_pct
        type: number
        source: computed
        description: "funds_expended minus AllocationRequest.total_award, divided by AllocationRequest.total_award, expressed as a percentage rounded to 2 decimals half-up; 0.00 when total_award is null."
        default: 0.00
      - name: submitted_at
        type: datetime
        source: system
        description: Logical-clock timestamp of the most recent creation or resubmit.

# =============================================================================
# 1.2 State Machine Table
# =============================================================================
state_machines:
  - entity: Employer
    state_field: status
    initial_state: PROSPECT
    terminal_states: [SUSPENDED]
    transitions:
      - from: PROSPECT
        to: ACTIVE
        trigger: "POST /fundraising/employers/{id}/activate"
        actor: UnitedFundAdmin
        preconditions:
          - "employer.status == PROSPECT"
        side_effects:
          - "sets Employer.status = ACTIVE"
          - "increments Employer.version by 1"
        note: "Employers created with partnership_signed == true are already ACTIVE and this call is refused with ERR_EMPLOYER_INVALID_STATE."
      - from: ACTIVE
        to: SUSPENDED
        trigger: "system event: campaign_escrow_hold cascade link 2 (a Campaign of this employer entered ESCROW_HOLD)"
        actor: system
        preconditions:
          - "employer.status == ACTIVE"
        side_effects:
          - "sets Employer.status = SUSPENDED and Employer.suspended_reason = 'ESCROW_HOLD_SHRINKAGE'"
          - "sets status = INACTIVE on every CampaignCoordinator with employer_id == this employer (fan-out, not part of the cascade chain)"
          - "increments Employer.version by 1"

  - entity: Campaign
    state_field: posture
    initial_state: PLANNED
    terminal_states: [RECONCILED, ESCROW_HOLD]
    transitions:
      - from: PLANNED
        to: OPEN
        trigger: "POST /fundraising/campaigns/{id}/open"
        actor: UnitedFundAdmin
        preconditions:
          - "campaign.posture == PLANNED"
          - "Employer.status == ACTIVE for campaign.employer_id (cross-entity guard; else ERR_EMPLOYER_NOT_ACTIVE)"
        side_effects:
          - "sets Campaign.posture = OPEN"
          - "recomputes Employer.active_campaign_count"
          - "increments Campaign.version by 1"
      - from: OPEN
        to: SOLICITATION_CLOSED
        trigger: "POST /fundraising/campaigns/{id}/close-solicitation"
        actor: UnitedFundAdmin
        preconditions:
          - "campaign.posture == OPEN"
        side_effects:
          - "recomputes Campaign.projected_payroll_pledge_total"
          - "runs calculations.campaign_pledge_loss_estimate variant PROVISIONAL, writing Campaign.provisional_estimated_loss and Campaign.provisional_net_expected_revenue"
          - "sets Campaign.posture = SOLICITATION_CLOSED and Campaign.solicitation_closed_at = logical clock now"
          - "increments Campaign.version by 1"
        note: "After this transition no new Pledge may be recorded and no designation may be amended (ERR_CAMPAIGN_NOT_OPEN); collections and write-offs remain legal."
      - from: SOLICITATION_CLOSED
        to: RECONCILED
        trigger: "POST /fundraising/campaigns/{id}/reconcile"
        actor: FinanceReviewer
        preconditions:
          - "campaign.posture == SOLICITATION_CLOSED"
          - "no Pledge of this campaign with designation_status IN {CONFIRMED, AMENDED} has collection_status == PENDING (else ERR_CAMPAIGN_NOT_FULLY_REMITTED)"
          - "calculations.campaign_pledge_loss_estimate variant FINAL yields realized_shrinkage_rate_bps < SHRINKAGE_ESCROW_THRESHOLD_BPS"
        side_effects:
          - "runs calculations.campaign_pledge_loss_estimate variant FINAL, writing Campaign.reserve_absorbed_amount, Campaign.final_actual_loss, Campaign.final_net_expected_revenue and Campaign.realized_shrinkage_rate_bps"
          - "sets designation_status = LOCKED on every Pledge of this campaign whose designation_status IN {CONFIRMED, AMENDED}"
          - "sets Campaign.posture = RECONCILED and Campaign.reconciled_at = logical clock now"
          - "increments Campaign.version by 1"
      - from: SOLICITATION_CLOSED
        to: ESCROW_HOLD
        trigger: "POST /fundraising/campaigns/{id}/reconcile"
        actor: FinanceReviewer
        preconditions:
          - "campaign.posture == SOLICITATION_CLOSED"
          - "no Pledge of this campaign with designation_status IN {CONFIRMED, AMENDED} has collection_status == PENDING (else ERR_CAMPAIGN_NOT_FULLY_REMITTED)"
          - "calculations.campaign_pledge_loss_estimate variant FINAL yields realized_shrinkage_rate_bps >= SHRINKAGE_ESCROW_THRESHOLD_BPS"
        side_effects:
          - "runs calculations.campaign_pledge_loss_estimate variant FINAL, writing Campaign.reserve_absorbed_amount, Campaign.final_actual_loss, Campaign.final_net_expected_revenue and Campaign.realized_shrinkage_rate_bps"
          - "sets designation_status = LOCKED on every Pledge of this campaign whose designation_status IN {CONFIRMED, AMENDED}"
          - "sets Campaign.posture = ESCROW_HOLD and Campaign.reconciled_at = logical clock now"
          - "cascade campaign_escrow_hold link 2: forces Employer.status = SUSPENDED with suspended_reason = 'ESCROW_HOLD_SHRINKAGE' (which in turn flips every CampaignCoordinator of that employer to INACTIVE)"
          - "increments Campaign.version by 1"
        note: "Same endpoint as the RECONCILED branch; the two branches differ only by the boundary test realized_shrinkage_rate_bps >= 1500 and carry divergent side-effect sets."

  - entity: Pledge
    state_field: designation_status
    initial_state: DRAFT
    terminal_states: [LOCKED]
    transitions:
      - from: DRAFT
        to: CONFIRMED
        trigger: "POST /fundraising/pledges/{id}/confirm"
        actor: CampaignCoordinator
        preconditions:
          - "pledge.designation_status == DRAFT"
          - "Campaign.posture == OPEN for pledge.campaign_id (cross-entity guard; else ERR_CAMPAIGN_NOT_OPEN)"
        side_effects:
          - "recomputes Campaign.confirmed_gross_total, Campaign.designated_gross_total, Campaign.undesignated_gross_total and Campaign.designation_fee_total"
          - "recomputes CampaignCoordinator.recorded_pledge_count"
          - "increments Pledge.version by 1"
      - from: CONFIRMED
        to: AMENDED
        trigger: "POST /fundraising/pledges/{id}/designations:amend"
        actor: CampaignCoordinator
        preconditions:
          - "pledge.designation_status == CONFIRMED"
          - "Campaign.posture == OPEN for pledge.campaign_id"
          - "expected_pledge_version == pledge.version (concurrency_rules.designation-amend-stale-pledge)"
        side_effects:
          - "sets status = SUPERSEDED on every PledgeDesignation of this pledge with status == ACTIVE"
          - "creates one ACTIVE PledgeDesignation per element of the request's designations array, numbering designation_sequence 1..N in array order"
          - "reruns calculations.pledge_designation_fee_allocation, rewriting Pledge.designated_amount_total, Pledge.undesignated_amount, Pledge.designation_fee_total and Pledge.net_designated_total"
          - "recomputes Agency.designated_passthrough_ytd for every agency losing or gaining an ACTIVE line"
          - "increments Pledge.amend_count by 1"
          - "sets Pledge.designation_status = AMENDED"
          - "increments Pledge.version by 1"
      - from: AMENDED
        to: CONFIRMED
        trigger: "POST /fundraising/pledges/{id}/confirm"
        actor: CampaignCoordinator
        preconditions:
          - "pledge.designation_status == AMENDED"
          - "Campaign.posture == OPEN for pledge.campaign_id"
        side_effects:
          - "recomputes Campaign.confirmed_gross_total, Campaign.designated_gross_total, Campaign.undesignated_gross_total and Campaign.designation_fee_total"
          - "increments Pledge.version by 1"
        note: "Closes the CONFIRMED -> AMENDED -> CONFIRMED revision cycle; a pledge may traverse it any number of times while the campaign is OPEN."
      - from: CONFIRMED
        to: LOCKED
        trigger: "system event: Campaign reconcile (either branch)"
        actor: system
        preconditions:
          - "pledge.designation_status == CONFIRMED"
        side_effects:
          - "sets Pledge.designation_status = LOCKED"
          - "increments Pledge.version by 1"
      - from: AMENDED
        to: LOCKED
        trigger: "system event: Campaign reconcile (either branch)"
        actor: system
        preconditions:
          - "pledge.designation_status == AMENDED"
        side_effects:
          - "sets Pledge.designation_status = LOCKED"
          - "increments Pledge.version by 1"

  - entity: Pledge
    state_field: collection_status
    initial_state: PENDING
    terminal_states: [COLLECTED, WRITTEN_OFF]
    transitions:
      - from: PENDING
        to: PARTIAL
        trigger: "POST /fundraising/pledges/{id}/collections"
        actor: FinanceReviewer
        preconditions:
          - "pledge.collection_status == PENDING"
          - "pledge.designation_status IN {CONFIRMED, AMENDED} (else ERR_PLEDGE_NOT_CONFIRMED)"
          - "amount <= pledge.gross_amount - pledge.collected_amount (else ERR_COLLECTION_EXCEEDS_OUTSTANDING)"
          - "amount < pledge.gross_amount - pledge.collected_amount, i.e. the remittance does not close the pledge"
        side_effects:
          - "increases Pledge.collected_amount by amount and recomputes Pledge.uncollected_amount"
          - "recomputes PledgeDesignation.collected_designated_amount on every ACTIVE line of this pledge"
          - "recomputes Agency.designated_passthrough_ytd for every agency holding an ACTIVE line of this pledge"
          - "sets Pledge.collection_status = PARTIAL"
          - "increments Pledge.version by 1"
        note: "This axis evolves independently of designation_status; a pledge may be PARTIAL while AMENDED."
      - from: PARTIAL
        to: PARTIAL
        trigger: "POST /fundraising/pledges/{id}/collections"
        actor: FinanceReviewer
        preconditions:
          - "pledge.collection_status == PARTIAL"
          - "amount < pledge.gross_amount - pledge.collected_amount"
        side_effects:
          - "increases Pledge.collected_amount by amount and recomputes Pledge.uncollected_amount"
          - "recomputes PledgeDesignation.collected_designated_amount and Agency.designated_passthrough_ytd"
          - "increments Pledge.version by 1"
      - from: PENDING
        to: COLLECTED
        trigger: "POST /fundraising/pledges/{id}/collections"
        actor: FinanceReviewer
        preconditions:
          - "pledge.collection_status == PENDING"
          - "pledge.designation_status IN {CONFIRMED, AMENDED}"
          - "amount == pledge.gross_amount - pledge.collected_amount"
        side_effects:
          - "sets Pledge.collected_amount = Pledge.gross_amount and Pledge.uncollected_amount = 0.00"
          - "recomputes PledgeDesignation.collected_designated_amount and Agency.designated_passthrough_ytd"
          - "sets Pledge.collection_status = COLLECTED"
          - "increments Pledge.version by 1"
      - from: PARTIAL
        to: COLLECTED
        trigger: "POST /fundraising/pledges/{id}/collections"
        actor: FinanceReviewer
        preconditions:
          - "pledge.collection_status == PARTIAL"
          - "amount == pledge.gross_amount - pledge.collected_amount"
        side_effects:
          - "sets Pledge.collected_amount = Pledge.gross_amount and Pledge.uncollected_amount = 0.00"
          - "recomputes PledgeDesignation.collected_designated_amount and Agency.designated_passthrough_ytd"
          - "sets Pledge.collection_status = COLLECTED"
          - "increments Pledge.version by 1"
      - from: PENDING
        to: WRITTEN_OFF
        trigger: "POST /fundraising/pledges/{id}/write-off"
        actor: FinanceReviewer
        preconditions:
          - "pledge.collection_status == PENDING"
          - "pledge.designation_status IN {CONFIRMED, AMENDED} (else ERR_PLEDGE_NOT_CONFIRMED)"
          - "Campaign.posture IN {OPEN, SOLICITATION_CLOSED} for pledge.campaign_id (else ERR_CAMPAIGN_INVALID_STATE)"
        side_effects:
          - "cascade pledge_write_off link 1: sets Pledge.collection_status = WRITTEN_OFF, Pledge.write_off_reason_code = reason_code and Pledge.uncollected_amount = gross_amount - collected_amount"
          - "cascade pledge_write_off link 2 (caused by link 1): sets status = UNCOLLECTED on every PledgeDesignation of this pledge with status == ACTIVE and recomputes each line's collected_designated_amount"
          - "cascade pledge_write_off link 3 (caused by link 2): recomputes Agency.designated_passthrough_ytd for every agency that held one of those lines, dropping the now-UNCOLLECTED lines out of the sum"
          - "increments Pledge.version by 1"
      - from: PARTIAL
        to: WRITTEN_OFF
        trigger: "POST /fundraising/pledges/{id}/write-off"
        actor: FinanceReviewer
        preconditions:
          - "pledge.collection_status == PARTIAL"
          - "pledge.designation_status IN {CONFIRMED, AMENDED}"
          - "Campaign.posture IN {OPEN, SOLICITATION_CLOSED} for pledge.campaign_id (else ERR_CAMPAIGN_INVALID_STATE)"
        side_effects:
          - "cascade pledge_write_off link 1: sets Pledge.collection_status = WRITTEN_OFF, Pledge.write_off_reason_code = reason_code and Pledge.uncollected_amount = gross_amount - collected_amount"
          - "cascade pledge_write_off link 2 (caused by link 1): sets status = UNCOLLECTED on every ACTIVE PledgeDesignation of this pledge and recomputes each line's collected_designated_amount"
          - "cascade pledge_write_off link 3 (caused by link 2): recomputes Agency.designated_passthrough_ytd for every affected agency"
          - "increments Pledge.version by 1"

  - entity: PledgeDesignation
    state_field: status
    initial_state: ACTIVE
    terminal_states: [SUPERSEDED, UNCOLLECTED]
    transitions:
      - from: ACTIVE
        to: SUPERSEDED
        trigger: "system event: POST /fundraising/pledges/{id}/designations:amend replaced the line set"
        actor: system
        preconditions:
          - "designation.status == ACTIVE"
        side_effects:
          - "sets PledgeDesignation.status = SUPERSEDED"
          - "drops the line out of Pledge.designated_amount_total and Agency.designated_passthrough_ytd"
          - "increments PledgeDesignation.version by 1"
      - from: ACTIVE
        to: UNCOLLECTED
        trigger: "system event: pledge_write_off cascade link 2"
        actor: system
        preconditions:
          - "designation.status == ACTIVE"
        side_effects:
          - "sets PledgeDesignation.status = UNCOLLECTED"
          - "drops the line out of Agency.designated_passthrough_ytd"
          - "increments PledgeDesignation.version by 1"

  - entity: Agency
    state_field: membership_status
    initial_state: APPLICANT
    terminal_states: [SUSPENDED_MEMBERSHIP]
    transitions:
      - from: APPLICANT
        to: UNDER_FINANCIAL_REVIEW
        trigger: "system event: POST /fundraising/agencies/{id}/reviews created a PENDING AgencyReview"
        actor: system
        preconditions:
          - "agency.membership_status == APPLICANT"
        side_effects:
          - "sets Agency.membership_status = UNDER_FINANCIAL_REVIEW"
          - "recomputes Agency.open_review_count"
          - "increments Agency.version by 1"
      - from: GOOD_STANDING
        to: UNDER_FINANCIAL_REVIEW
        trigger: "system event: POST /fundraising/agencies/{id}/reviews created a PENDING AgencyReview (annual re-review of a member agency)"
        actor: system
        preconditions:
          - "agency.membership_status == GOOD_STANDING"
        side_effects:
          - "sets Agency.membership_status = UNDER_FINANCIAL_REVIEW"
          - "recomputes Agency.open_review_count"
          - "leaves Agency.latest_standing_score at the previously certified value until the new review is certified"
          - "increments Agency.version by 1"
        note: "A member agency under re-review cannot submit new allocation requests (validation priority 24) until the re-review is certified; this is the entry hop of the agency_probation cascade."
      - from: UNDER_FINANCIAL_REVIEW
        to: GOOD_STANDING
        trigger: "system event: certify produced certified_score >= STANDARDS_PASS_SCORE"
        actor: system
        preconditions:
          - "agency.membership_status == UNDER_FINANCIAL_REVIEW"
          - "AgencyReview.certified_score >= 70.00"
        side_effects:
          - "sets Agency.membership_status = GOOD_STANDING"
          - "sets Agency.latest_standing_score = AgencyReview.certified_score"
          - "recomputes Agency.open_review_count"
          - "increments Agency.version by 1"
      - from: UNDER_FINANCIAL_REVIEW
        to: PROBATION
        trigger: "system event: certify produced PROBATION_FLOOR_SCORE <= certified_score < STANDARDS_PASS_SCORE"
        actor: system
        preconditions:
          - "agency.membership_status == UNDER_FINANCIAL_REVIEW"
          - "55.00 <= AgencyReview.certified_score < 70.00"
        side_effects:
          - "cascade agency_probation link 2: sets Agency.membership_status = PROBATION, Agency.latest_standing_score = certified_score, increments Agency.probation_count by 1 and recomputes Agency.open_review_count"
          - "cascade agency_probation link 3 (caused by link 2): for every AllocationRequest of this agency whose cycle has posture IN {OPEN, RESTRICTED} and whose status IN {SUBMITTED, UNDER_PANEL_REVIEW}, stores status into status_before_suspension and sets status = SUSPENDED_REVIEW"
          - "cascade agency_probation link 4 (caused by link 3): recomputes AllocationCycle.suspended_request_count and AllocationCycle.suspended_request_ratio on each touched cycle, and when suspended_request_ratio >= CYCLE_RESTRICT_RATIO the cycle moves OPEN -> RESTRICTED with awards_blocked = true"
          - "increments Agency.version by 1"
      - from: UNDER_FINANCIAL_REVIEW
        to: SUSPENDED_MEMBERSHIP
        trigger: "system event: certify produced certified_score < PROBATION_FLOOR_SCORE"
        actor: system
        preconditions:
          - "agency.membership_status == UNDER_FINANCIAL_REVIEW"
          - "AgencyReview.certified_score < 55.00"
        side_effects:
          - "sets Agency.membership_status = SUSPENDED_MEMBERSHIP, Agency.latest_standing_score = certified_score and recomputes Agency.open_review_count"
          - "sets status = SUSPENDED_REVIEW on every AllocationRequest of this agency whose status IN {SUBMITTED, UNDER_PANEL_REVIEW}, storing status_before_suspension"
          - "increments Agency.version by 1"
      - from: PROBATION
        to: GOOD_STANDING
        trigger: "POST /fundraising/agencies/{id}/reinstate"
        actor: FinanceReviewer
        preconditions:
          - "agency.membership_status == PROBATION"
          - "agency.latest_standing_score >= PROBATION_FLOOR_SCORE"
          - "agency.open_review_count == 0"
        side_effects:
          - "sets Agency.membership_status = GOOD_STANDING"
          - "restores status = status_before_suspension and clears status_before_suspension on every AllocationRequest of this agency with status == SUSPENDED_REVIEW"
          - "recomputes AllocationCycle.suspended_request_count / suspended_request_ratio on each touched cycle and, when suspended_request_ratio < CYCLE_RESTRICT_RATIO, moves the cycle RESTRICTED -> OPEN with awards_blocked = false"
          - "increments Agency.version by 1"
        note: "Closes the PROBATION -> GOOD_STANDING -> (certify) -> PROBATION membership cycle and reverses every mutation of the agency_probation cascade."
      - from: PROBATION
        to: SUSPENDED_MEMBERSHIP
        trigger: "system event: a later certify on the same agency produced certified_score < PROBATION_FLOOR_SCORE"
        actor: system
        preconditions:
          - "agency.membership_status == PROBATION"
          - "AgencyReview.certified_score < 55.00"
        side_effects:
          - "sets Agency.membership_status = SUSPENDED_MEMBERSHIP and Agency.latest_standing_score = certified_score"
          - "increments Agency.version by 1"
      - from: PROBATION
        to: PROBATION
        trigger: "system event: a later certify on the same agency produced 55.00 <= certified_score < 70.00"
        actor: system
        preconditions:
          - "agency.membership_status == PROBATION"
        side_effects:
          - "sets Agency.latest_standing_score = certified_score and increments Agency.probation_count by 1"
          - "re-runs cascade agency_probation links 3 and 4"
          - "increments Agency.version by 1"

  - entity: AgencyReview
    state_field: status
    initial_state: PENDING
    terminal_states: [CERTIFIED]
    transitions:
      - from: PENDING
        to: CERTIFIED
        trigger: "POST /fundraising/agencies/{id}/reviews/{review_id}/certify"
        actor: FinanceReviewer
        preconditions:
          - "review.status == PENDING (else ERR_REVIEW_ALREADY_CERTIFIED)"
          - "review.agency_id == the {id} path segment (else ERR_REVIEW_AGENCY_MISMATCH)"
          - "agency.membership_status != SUSPENDED_MEMBERSHIP (else ERR_AGENCY_MEMBERSHIP_TERMINAL)"
        side_effects:
          - "cascade agency_probation link 1: stores the three audited_* figures, sets review_basis = AUDITED, runs calculations.agency_financial_standing_score variant CERTIFIED writing certified_score, restatement_penalty_applied and standards_met, and sets AgencyReview.status = CERTIFIED"
          - "cascade agency_probation link 2 (caused by link 1): drives the Agency membership_status transition selected by certified_score"
          - "increments AgencyReview.version by 1"

  - entity: AllocationCycle
    state_field: posture
    initial_state: DRAFT
    terminal_states: [FROZEN]
    transitions:
      - from: DRAFT
        to: OPEN
        trigger: "POST /fundraising/allocation-cycles/{id}/open"
        actor: AllocationsDirector
        preconditions:
          - "cycle.posture == DRAFT"
          - "at least one PanelAssignment exists for this cycle with conflict_declared == false"
        side_effects:
          - "sets AllocationCycle.posture = OPEN and AllocationCycle.available_undesignated_pool = opening_undesignated_pool"
          - "increments AllocationCycle.version by 1"
      - from: OPEN
        to: RESTRICTED
        trigger: "system event: agency_probation cascade link 4 pushed suspended_request_ratio >= CYCLE_RESTRICT_RATIO"
        actor: system
        preconditions:
          - "cycle.posture == OPEN"
          - "cycle.suspended_request_ratio >= 0.34"
        side_effects:
          - "sets AllocationCycle.posture = RESTRICTED and AllocationCycle.awards_blocked = true"
          - "increments AllocationCycle.version by 1"
      - from: RESTRICTED
        to: OPEN
        trigger: "system event: reinstate reversal pushed suspended_request_ratio < CYCLE_RESTRICT_RATIO"
        actor: system
        preconditions:
          - "cycle.posture == RESTRICTED"
          - "cycle.suspended_request_ratio < 0.34"
        side_effects:
          - "sets AllocationCycle.posture = OPEN and AllocationCycle.awards_blocked = false"
          - "increments AllocationCycle.version by 1"
        note: "Closes the OPEN <-> RESTRICTED posture cycle."
      - from: OPEN
        to: FROZEN
        trigger: "POST /fundraising/allocation-cycles/{id}/freeze"
        actor: AllocationsDirector
        preconditions:
          - "cycle.posture == OPEN"
        side_effects:
          - "sets AllocationCycle.posture = FROZEN"
          - "increments AllocationCycle.version by 1"
      - from: RESTRICTED
        to: FROZEN
        trigger: "POST /fundraising/allocation-cycles/{id}/freeze"
        actor: AllocationsDirector
        preconditions:
          - "cycle.posture == RESTRICTED"
        side_effects:
          - "sets AllocationCycle.posture = FROZEN and AllocationCycle.awards_blocked = true"
          - "increments AllocationCycle.version by 1"

  - entity: AllocationRequest
    state_field: status
    initial_state: DRAFT
    terminal_states: [PANEL_DECLINED, CLOSED_SATISFIED]
    transitions:
      - from: DRAFT
        to: SUBMITTED
        trigger: "POST /fundraising/allocation-requests/{id}/submit"
        actor: AgencyRepresentative
        preconditions:
          - "request.status == DRAFT"
          - "AllocationCycle.posture == OPEN for request.cycle_id (else ERR_CYCLE_NOT_OPEN)"
          - "Agency.membership_status == GOOD_STANDING for request.agency_id (cross-entity guard; else ERR_AGENCY_NOT_IN_GOOD_STANDING)"
          - "Agency.outcome_report_delinquent == false (else ERR_OUTCOME_REPORT_DELINQUENT)"
          - "the logical clock date falls inside [cycle.request_window_start, cycle.request_window_end)"
        side_effects:
          - "sets AllocationRequest.status = SUBMITTED and submitted_at = logical clock now"
          - "recomputes AllocationCycle.submitted_request_count and AllocationCycle.suspended_request_ratio"
          - "increments AllocationRequest.version by 1"
      - from: SUBMITTED
        to: UNDER_PANEL_REVIEW
        trigger: "system event: the first PanelScore was filed against this request"
        actor: system
        preconditions:
          - "request.status == SUBMITTED"
        side_effects:
          - "sets AllocationRequest.status = UNDER_PANEL_REVIEW"
          - "recomputes AllocationRequest.eligible_score_count"
          - "increments AllocationRequest.version by 1"
      - from: SUBMITTED
        to: SUSPENDED_REVIEW
        trigger: "system event: agency_probation cascade link 3"
        actor: system
        preconditions:
          - "request.status == SUBMITTED"
        side_effects:
          - "sets status_before_suspension = SUBMITTED and AllocationRequest.status = SUSPENDED_REVIEW"
          - "increments AllocationRequest.version by 1"
      - from: UNDER_PANEL_REVIEW
        to: SUSPENDED_REVIEW
        trigger: "system event: agency_probation cascade link 3"
        actor: system
        preconditions:
          - "request.status == UNDER_PANEL_REVIEW"
        side_effects:
          - "sets status_before_suspension = UNDER_PANEL_REVIEW and AllocationRequest.status = SUSPENDED_REVIEW"
          - "increments AllocationRequest.version by 1"
      - from: SUSPENDED_REVIEW
        to: UNDER_PANEL_REVIEW
        trigger: "system event: POST /fundraising/agencies/{id}/reinstate restored status_before_suspension == UNDER_PANEL_REVIEW"
        actor: system
        preconditions:
          - "request.status == SUSPENDED_REVIEW"
          - "request.status_before_suspension == UNDER_PANEL_REVIEW"
        side_effects:
          - "sets AllocationRequest.status = UNDER_PANEL_REVIEW and clears status_before_suspension"
          - "increments AllocationRequest.version by 1"
      - from: SUSPENDED_REVIEW
        to: SUBMITTED
        trigger: "system event: POST /fundraising/agencies/{id}/reinstate restored status_before_suspension == SUBMITTED"
        actor: system
        preconditions:
          - "request.status == SUSPENDED_REVIEW"
          - "request.status_before_suspension == SUBMITTED"
        side_effects:
          - "sets AllocationRequest.status = SUBMITTED and clears status_before_suspension"
          - "increments AllocationRequest.version by 1"
      - from: UNDER_PANEL_REVIEW
        to: PANEL_APPROVED
        trigger: "POST /fundraising/allocation-requests/{id}/finalize-review"
        actor: AllocationsDirector
        preconditions:
          - "request.status == UNDER_PANEL_REVIEW"
          - "AllocationCycle.posture IN {OPEN, RESTRICTED} for request.cycle_id"
          - "request.eligible_score_count >= PANEL_QUORUM (3); zero eligible scores raise ERR_NO_ELIGIBLE_SCORES and 1..2 raise ERR_PANEL_QUORUM_NOT_MET"
          - "calculations.request_panel_composite_score yields composite_score >= PANEL_APPROVAL_THRESHOLD"
        side_effects:
          - "runs calculations.request_panel_composite_score writing AllocationRequest.composite_score"
          - "sets AllocationRequest.status = PANEL_APPROVED"
          - "increments AllocationRequest.version by 1"
      - from: UNDER_PANEL_REVIEW
        to: PANEL_DECLINED
        trigger: "POST /fundraising/allocation-requests/{id}/finalize-review"
        actor: AllocationsDirector
        preconditions:
          - "request.status == UNDER_PANEL_REVIEW"
          - "AllocationCycle.posture IN {OPEN, RESTRICTED} for request.cycle_id"
          - "request.eligible_score_count >= PANEL_QUORUM (3)"
          - "calculations.request_panel_composite_score yields composite_score < PANEL_APPROVAL_THRESHOLD"
        side_effects:
          - "runs calculations.request_panel_composite_score writing AllocationRequest.composite_score"
          - "sets AllocationRequest.status = PANEL_DECLINED"
          - "increments AllocationRequest.version by 1"
        note: "Fork branch of the same endpoint as PANEL_APPROVED; the branch is chosen by the 72.00 composite threshold and the declined branch never touches the cycle pool."
      - from: PANEL_APPROVED
        to: AWARDED
        trigger: "POST /fundraising/allocation-cycles/{id}/awards"
        actor: AllocationsDirector
        preconditions:
          - "request.status == PANEL_APPROVED"
          - "cycle.posture == OPEN (FROZEN raises ERR_CYCLE_FROZEN, RESTRICTED raises ERR_CYCLE_RESTRICTED)"
          - "expected_allocation_cycle_version == cycle.version (concurrency_rules.award-create-stale-cycle)"
          - "cycle.available_undesignated_pool > 0 and the step-6 total_award_unclamped <= cycle.available_undesignated_pool (else ERR_POOL_INSUFFICIENT)"
        side_effects:
          - "runs calculations.community_impact_fund_allocation writing base_award, designation_offset, strategic_supplement and total_award"
          - "sets AllocationRequest.status = AWARDED, awarded_at = logical clock now and outcome_report_due_date = awarded_at date + OUTCOME_REPORT_DUE_DAYS"
          - "recomputes AllocationCycle.awarded_total and AllocationCycle.available_undesignated_pool"
          - "increments AllocationCycle.version by 1"
          - "increments AllocationRequest.version by 1"
      - from: AWARDED
        to: PANEL_APPROVED
        trigger: "POST /fundraising/allocation-requests/{id}/rescind-award"
        actor: AllocationsDirector
        preconditions:
          - "request.status == AWARDED"
          - "no OutcomeReport exists for this request"
        side_effects:
          - "sets base_award, designation_offset, strategic_supplement, total_award, awarded_at and outcome_report_due_date back to null"
          - "sets AllocationRequest.status = PANEL_APPROVED"
          - "recomputes AllocationCycle.awarded_total and AllocationCycle.available_undesignated_pool, restoring the pool exactly"
          - "increments AllocationCycle.version by 1"
          - "increments AllocationRequest.version by 1"
        note: "Compensating action for the AWARDED transition; the cycle_pool_conservation invariant must hold before and after with zero drift."
      - from: AWARDED
        to: REPORTING
        trigger: "system event: POST /fundraising/allocation-requests/{id}/outcome-reports created the report"
        actor: system
        preconditions:
          - "request.status == AWARDED"
        side_effects:
          - "sets AllocationRequest.status = REPORTING"
          - "recomputes Agency.outcome_report_delinquent"
          - "increments AllocationRequest.version by 1"
      - from: REPORTING
        to: CLOSED_SATISFIED
        trigger: "system event: POST /fundraising/outcome-reports/{id}/accept accepted the report"
        actor: system
        preconditions:
          - "request.status == REPORTING"
        side_effects:
          - "sets AllocationRequest.status = CLOSED_SATISFIED"
          - "recomputes Agency.outcome_report_delinquent"
          - "increments AllocationRequest.version by 1"

  - entity: OutcomeReport
    state_field: status
    initial_state: SUBMITTED
    terminal_states: [ACCEPTED]
    transitions:
      - from: SUBMITTED
        to: SITE_VISIT_SCHEDULED
        trigger: "POST /fundraising/outcome-reports/{id}/site-visit"
        actor: VolunteerPanelist
        preconditions:
          - "report.status == SUBMITTED"
          - "the acting panelist filed no PanelScore against report.request_id (else ERR_SEGREGATION_OF_DUTIES)"
          - "the acting panelist holds a PanelAssignment on the request's cycle (else ERR_PANELIST_NOT_ASSIGNED)"
          - "site_visit_window_start >= the date part of report.submitted_at and site_visit_window_end >= site_visit_window_start and site_visit_window_end <= report.submitted_at date + SITE_VISIT_MAX_LEAD_DAYS (else ERR_SITE_VISIT_WINDOW_INVALID)"
          - "no other OutcomeReport with the same site_visit_panelist_id and status IN {SITE_VISIT_SCHEDULED, SITE_VISIT_COMPLETED, REVISION_REQUESTED, ACCEPTED} collides under the closed-interval-plus-buffer rule (else ERR_SITE_VISIT_BUFFER_CONFLICT)"
        side_effects:
          - "sets site_visit_panelist_id, site_visit_window_start, site_visit_window_end and OutcomeReport.status = SITE_VISIT_SCHEDULED"
          - "recomputes Panelist.site_visit_count"
          - "increments OutcomeReport.version by 1"
      - from: SITE_VISIT_SCHEDULED
        to: SITE_VISIT_COMPLETED
        trigger: "POST /fundraising/outcome-reports/{id}/site-visit/complete"
        actor: VolunteerPanelist
        preconditions:
          - "report.status == SITE_VISIT_SCHEDULED"
          - "the acting panelist's X-User-ID == report.site_visit_panelist_id (else ERR_OWNERSHIP_VIOLATION)"
        side_effects:
          - "sets site_visit_findings and OutcomeReport.status = SITE_VISIT_COMPLETED"
          - "increments OutcomeReport.version by 1"
      - from: SITE_VISIT_COMPLETED
        to: ACCEPTED
        trigger: "POST /fundraising/outcome-reports/{id}/accept"
        actor: AllocationsDirector
        preconditions:
          - "report.status == SITE_VISIT_COMPLETED"
        side_effects:
          - "sets OutcomeReport.status = ACCEPTED"
          - "drives AllocationRequest REPORTING -> CLOSED_SATISFIED"
          - "recomputes Agency.outcome_report_delinquent"
          - "increments OutcomeReport.version by 1"
      - from: SITE_VISIT_COMPLETED
        to: REVISION_REQUESTED
        trigger: "POST /fundraising/outcome-reports/{id}/request-revision"
        actor: AllocationsDirector
        preconditions:
          - "report.status == SITE_VISIT_COMPLETED"
          - "report.revision_round_count < MAX_REVISION_ROUNDS (else ERR_REVISION_LIMIT_REACHED)"
        side_effects:
          - "increments OutcomeReport.revision_round_count by 1 and sets OutcomeReport.status = REVISION_REQUESTED"
          - "increments OutcomeReport.version by 1"
      - from: REVISION_REQUESTED
        to: SUBMITTED
        trigger: "POST /fundraising/outcome-reports/{id}/resubmit"
        actor: AgencyRepresentative
        preconditions:
          - "report.status == REVISION_REQUESTED"
          - "the acting agency's X-User-ID == the agency_id of report.request_id"
        side_effects:
          - "overwrites persons_served, outcome_metric_value and funds_expended, recomputes expenditure_variance_pct, refreshes submitted_at and sets OutcomeReport.status = SUBMITTED"
          - "clears site_visit_findings but KEEPS site_visit_panelist_id, site_visit_window_start and site_visit_window_end so the buffer rule still sees the historic window"
          - "increments OutcomeReport.version by 1"
        note: "Closes the SUBMITTED -> SITE_VISIT_SCHEDULED -> SITE_VISIT_COMPLETED -> REVISION_REQUESTED -> SUBMITTED revision cycle; MAX_REVISION_ROUNDS caps the number of laps."

# =============================================================================
# 1.2.1 Concurrency Rules (OCC on the parent's `version` only)
# =============================================================================
concurrency_rules:
  - rule_id: designation-amend-stale-pledge
    parent_entity: Pledge
    write_endpoint: "POST /fundraising/pledges/{id}/designations:amend"
    occ_field: "expected_pledge_version"
    description: |
      Replacing a pledge's designation line set is a create-with-supersede: the new lines
      legitimately supersede the prior ACTIVE lines, so a second amend carrying the version the
      client last read is not covered by any state precondition (the pledge is CONFIRMED again
      after each confirm, and AMENDED accepts no second amend but CONFIRMED does). The write is
      therefore rejected when expected_pledge_version does not equal the pledge's current version,
      which is the case whenever a prior amend, confirm, collection or write-off advanced it.
    error_id: ERR_STALE_VERSION
    http_status: 412

  - rule_id: award-create-stale-cycle
    parent_entity: AllocationCycle
    write_endpoint: "POST /fundraising/allocation-cycles/{id}/awards"
    occ_field: "expected_allocation_cycle_version"
    description: |
      Issuing an award draws from the shared community impact fund. A second award against a
      different PANEL_APPROVED request in the same cycle would legitimately succeed on its own
      merits, so nothing in the cycle's state machine rejects it - the only thing that changed is
      the pool the client based its decision on. The write is rejected when
      expected_allocation_cycle_version does not equal AllocationCycle.version, which any prior
      award, rescind, posture change or pool recompute has already advanced.
    error_id: ERR_STALE_VERSION
    http_status: 412

# =============================================================================
# 1.3 Calculation Rules Table
# =============================================================================
calculations:
  - name: pledge_designation_fee_allocation
    trigger: "On POST /fundraising/campaigns/{id}/pledges (pledge creation with a designations array) and on every POST /fundraising/pledges/{id}/designations:amend that replaces the ACTIVE line set."
    algorithm: aggregation
    formula: |
      # ROUNDING ORDER IS PINNED: round EVERY per-line fee to cents FIRST, then sum the
      # already-rounded per-line fees. Summing the raw products and rounding once at the end is
      # WRONG and produces a different `designation_fee_total` (see the 4 x 25.00 case below).
      #
      # Lines are processed in ascending `designation_sequence`, which is assigned 1..N from the
      # position of each element inside the request's `designations` array. No property of `id`
      # participates.
      for line in designations ordered by designation_sequence ASC:
          raw_fee            = line.designated_amount * DESIGNATION_FEE_RATE
          line.processing_fee        = max( round_half_up(raw_fee, 2), MIN_LINE_FEE )
          line.net_designated_amount = line.designated_amount - line.processing_fee

      pledge.designated_amount_total = sum(line.designated_amount for ACTIVE lines)      # exact, inputs are already 2dp
      pledge.undesignated_amount     = pledge.gross_amount - pledge.designated_amount_total
      pledge.designation_fee_total   = sum(line.processing_fee for ACTIVE lines)         # sum of ROUNDED values
      pledge.net_designated_total    = pledge.designated_amount_total - pledge.designation_fee_total

      # Collection ratio scaling, recomputed on every collections / write-off event:
      for line in ACTIVE lines:
          line.collected_designated_amount =
              round_half_up( line.net_designated_amount * (pledge.collected_amount / pledge.gross_amount), 2 )
      # SUPERSEDED and UNCOLLECTED lines are frozen at collected_designated_amount = 0.00.

      # Worked divergence (this is the pinned answer):
      #   gross 150.00 with two lines of 25.00 each
      #     per-line:      round(25.00*0.0725) = 1.81 each  -> designation_fee_total = 3.62
      #     sum-then-round: round(50.00*0.0725) = 3.63       -> WRONG
    input_set: "Only PledgeDesignation rows with status == ACTIVE on the target pledge. SUPERSEDED and UNCOLLECTED lines never re-enter any total."
    constants:
      DESIGNATION_FEE_RATE: 0.0725
      MIN_LINE_FEE: 1.50
      MIN_DESIGNATION_AMOUNT: 25.00
    precision: "All money fields 2 decimal places, round_half_up. Per-line rounding happens before summation; totals are never re-rounded."

  - name: campaign_pledge_loss_estimate
    trigger: "Variant PROVISIONAL runs on POST /fundraising/campaigns/{id}/close-solicitation (Campaign OPEN -> SOLICITATION_CLOSED). Variant FINAL runs on POST /fundraising/campaigns/{id}/reconcile (Campaign SOLICITATION_CLOSED -> RECONCILED or -> ESCROW_HOLD)."
    algorithm: forward_looking
    formula: |
      # ---- Shared base ----
      campaign.confirmed_gross_total =
          sum(pledge.gross_amount for pledges of this campaign
              where pledge.designation_status IN {CONFIRMED, AMENDED, LOCKED})

      # ---- Variant PROVISIONAL (forward-looking, employer history) ----
      campaign.projected_payroll_pledge_total =
          sum(pledge.gross_amount for pledges of this campaign
              where pledge.giving_method == PAYROLL_DEDUCTION
                and pledge.designation_status IN {CONFIRMED, AMENDED}
                and pledge.collection_status IN {PENDING, PARTIAL})
      campaign.provisional_estimated_loss =
          round_half_up( campaign.projected_payroll_pledge_total
                         * employer.historical_shrinkage_rate_bps / 10000 , 2 )
      campaign.provisional_net_expected_revenue =
          campaign.confirmed_gross_total - campaign.provisional_estimated_loss

      # ---- Variant FINAL (chronological, all-or-nothing reserve absorption) ----
      # Candidate set: pledges of this campaign with designation_status IN {CONFIRMED, AMENDED,
      # LOCKED} AND collection_status IN {PARTIAL, WRITTEN_OFF} AND uncollected_amount > 0.
      # PROCESSING ORDER IS PINNED and it changes the answer:
      #   created_at ASC, then gross_amount DESC, then donor_reference ASC.
      # (`donor_reference` is unique per campaign, so the order is total. `id` is never consulted.)
      remaining_reserve = campaign.loss_reserve_amount
      absorbed          = 0.00
      for pledge in candidate_set ordered by (created_at ASC, gross_amount DESC, donor_reference ASC):
          if pledge.uncollected_amount <= remaining_reserve:      # ALL-OR-NOTHING: no partial draw
              remaining_reserve = remaining_reserve - pledge.uncollected_amount
              absorbed          = absorbed + pledge.uncollected_amount
          # else: the pledge is skipped entirely and a LATER, smaller pledge may still be absorbed
      campaign.reserve_absorbed_amount = absorbed
      campaign.final_actual_loss =
          sum(pledge.uncollected_amount for pledge in candidate_set) - absorbed
      campaign.final_net_expected_revenue =
          campaign.confirmed_gross_total - campaign.final_actual_loss
      campaign.realized_shrinkage_rate_bps =
          0 if campaign.confirmed_gross_total == 0
            else round_half_up( campaign.final_actual_loss / campaign.confirmed_gross_total * 10000 , 0 )

      # Threshold branch selecting the reconcile fork:
      if campaign.realized_shrinkage_rate_bps >= SHRINKAGE_ESCROW_THRESHOLD_BPS:  # >= , not >
          posture = ESCROW_HOLD   (and the campaign_escrow_hold cascade fires)
      else:
          posture = RECONCILED
    input_set: "PROVISIONAL sees only PAYROLL_DEDUCTION pledges still open to loss (collection_status IN {PENDING, PARTIAL}); FINAL sees every giving method but only pledges that actually fell short (collection_status IN {PARTIAL, WRITTEN_OFF} with uncollected_amount > 0). The two input sets deliberately differ, which is why the two variants disagree on identical data."
    constants:
      SHRINKAGE_ESCROW_THRESHOLD_BPS: 1500
    precision: "Money 2 decimal places round_half_up; realized_shrinkage_rate_bps 0 decimal places round_half_up."
    variants:
      - name: PROVISIONAL
        when: "POST /campaigns/{id}/close-solicitation - before any remittance is known for certain."
        difference: "Applies employer.historical_shrinkage_rate_bps to projected_payroll_pledge_total and ignores loss_reserve_amount entirely. Writes provisional_estimated_loss / provisional_net_expected_revenue."
      - name: FINAL
        when: "POST /campaigns/{id}/reconcile - after collections and write-offs are recorded."
        difference: "Ignores the employer's historical rate, walks the actually-short pledges in the pinned chronological order and absorbs whole uncollected amounts against loss_reserve_amount, so the remaining loss can be strictly smaller AND ordered differently than the provisional figure. Writes reserve_absorbed_amount / final_actual_loss / final_net_expected_revenue / realized_shrinkage_rate_bps and selects the reconcile fork."

  - name: agency_financial_standing_score
    trigger: "Variant PRELIMINARY runs on POST /fundraising/agencies/{id}/reviews (writes preliminary_score). Variant CERTIFIED runs on POST /fundraising/agencies/{id}/reviews/{review_id}/certify (writes certified_score, restatement_penalty_applied, standards_met) and selects the Agency membership transition."
    algorithm: weighted_scoring
    formula: |
      # `prog`, `admin`, `res` are the ratio inputs of the selected variant (see variants below).
      program_points    = min( 40, round_half_up( max(0, prog - PROGRAM_RATIO_FLOOR) * 400 , 2 ) )
      reserve_points    = min( 25, round_half_up( res * RESERVE_POINTS_PER_MONTH , 2 ) )
      governance_points = round_half_up( governance_checklist_passed_count * GOVERNANCE_POINTS_EACH , 2 )   # 0..25
      audit_points      = AUDIT_POINTS[audit_opinion]            # PRELIMINARY forces 0
      raw               = program_points + reserve_points + governance_points + audit_points
      admin_penalty     = 0.00 if admin <= ADMIN_RATIO_FREE_CEILING
                          else round_half_up( (admin - ADMIN_RATIO_FREE_CEILING) * 200 , 2 )
      restatement_penalty = RESTATEMENT_PENALTY if (variant == CERTIFIED and
                              audited_program_expense_ratio < program_expense_ratio - RESTATEMENT_TOLERANCE)
                            else 0.00
      # CLAMP ORDER IS PINNED: subtract BOTH penalties first, clamp to [0, 100] second, round last.
      score = round_half_up( max(0, min(100, raw - admin_penalty - restatement_penalty)) , 2 )

      standards_met = (score >= STANDARDS_PASS_SCORE)            # only written by CERTIFIED

      # Membership outcome selected by the CERTIFIED score (thresholds are inclusive lower bounds):
      #   score >= 70.00                  -> GOOD_STANDING
      #   55.00 <= score < 70.00          -> PROBATION  (fires the agency_probation cascade)
      #   score <  55.00                  -> SUSPENDED_MEMBERSHIP
      #
      # Worked divergence (this is the pinned answer) for
      #   submitted: prog 0.7800 admin 0.1900 res 4.00 gov 8 audit UNQUALIFIED
      #   audited:   prog 0.7400 admin 0.2700 res 3.00
      #   PRELIMINARY: 40 + 20.00 + 20.00 + 0  = 80.00, penalty 0.00              -> 80.00 (would pass)
      #   CERTIFIED:   36.00 + 15.00 + 20.00 + 10 = 81.00, admin 4.00, restate 7.50 -> 69.50 (PROBATION)
    input_set: "One AgencyReview row. PRELIMINARY reads the self-reported program_expense_ratio / admin_expense_ratio / months_operating_reserve. CERTIFIED reads audited_program_expense_ratio / audited_admin_expense_ratio / audited_months_operating_reserve and compares the audited program ratio against the self-reported one for the restatement test. governance_checklist_passed_count and audit_opinion are shared inputs."
    constants:
      PROGRAM_RATIO_FLOOR: 0.65
      RESERVE_POINTS_PER_MONTH: 5
      GOVERNANCE_POINTS_EACH: 2.5
      ADMIN_RATIO_FREE_CEILING: 0.25
      RESTATEMENT_TOLERANCE: 0.02
      RESTATEMENT_PENALTY: 7.5
      STANDARDS_PASS_SCORE: 70.00
      PROBATION_FLOOR_SCORE: 55.00
      AUDIT_POINTS: { UNQUALIFIED: 10, QUALIFIED: 5, ADVERSE: 0, NONE: 0 }
    precision: "Points and scores 2 decimal places, round_half_up. Ratios are 4-decimal inputs and are never rounded before use."
    variants:
      - name: PRELIMINARY
        when: "Review creation, while status == PENDING and review_basis == SELF_REPORTED."
        difference: "Uses the self-reported ratios, FORCES audit_points to 0 no matter what audit_opinion says, and never applies the restatement penalty. Writes preliminary_score only; standards_met stays null."
      - name: CERTIFIED
        when: "Certify, when review_basis flips to AUDITED."
        difference: "Uses the audited ratios, credits AUDIT_POINTS[audit_opinion], and subtracts RESTATEMENT_PENALTY when the audited program ratio came in more than RESTATEMENT_TOLERANCE below the self-reported one. Writes certified_score / restatement_penalty_applied / standards_met and drives the Agency membership fork."

  - name: request_panel_composite_score
    trigger: "POST /fundraising/allocation-requests/{id}/finalize-review (AllocationRequest UNDER_PANEL_REVIEW -> PANEL_APPROVED or -> PANEL_DECLINED)."
    algorithm: weighted_scoring
    formula: |
      # Step 1 - per-score blend, ROUNDED TO CENTS BEFORE ANY AVERAGING (pinned order):
      score.weighted_score = round_half_up( W_PRIORITY * priority_alignment_score
                                          + W_OUTCOME  * outcome_evidence_score
                                          + W_CAPACITY * capacity_score , 2 )

      # Step 2 - eligibility filter (the empty-set boundary lives here):
      eligible = [ s for s in PanelScore rows with request_id == request.id
                   if the PanelAssignment of (s.panelist_id, request.cycle_id) has
                      conflict_declared == false ]
      request.eligible_score_count = len(eligible)
      if len(eligible) == 0:  -> ERR_NO_ELIGIBLE_SCORES        # empty collection, distinct error
      if 0 < len(eligible) < PANEL_QUORUM: -> ERR_PANEL_QUORUM_NOT_MET

      # Step 3 - non-linear aggregation branch on the eligible COUNT:
      if len(eligible) >= TRIM_MIN_COUNT:                      # 5 or more -> trimmed mean
          drop exactly one row holding max(weighted_score) and exactly one row holding
          min(weighted_score); when several rows tie at an extreme, drop the one with the
          earliest created_at (never `id`)
          pool = the remaining rows
      else:
          pool = eligible                                     # plain mean
      base = round_half_up( sum(s.weighted_score for s in pool) / len(pool) , 2 )

      # Step 4 - community-priority multiplier, then clamp, then round (pinned order):
      multiplier = FOCUS_MULTIPLIER if request.priority_area == cycle.focus_priority_area else 1.00
      request.composite_score = round_half_up( min(100, base * multiplier) , 2 )

      # Step 5 - fork:
      PANEL_APPROVED if request.composite_score >= PANEL_APPROVAL_THRESHOLD else PANEL_DECLINED
      # Worked answer: eligible weighted_scores [81.50, 76.50, 71.50] (count 3 -> plain mean)
      #   base 76.50, focus match -> 76.50 * 1.15 = 87.975 -> composite 87.98 -> PANEL_APPROVED
    input_set: "PanelScore rows for the target request with eligible == true. Validation priority 22 already refuses any score from a panelist whose PanelAssignment on the cycle carries conflict_declared == true, so the only way a row leaves the pool is step 3 flipping PanelScore.eligible to false as the trimmed high or low. A request still in SUBMITTED has an empty pool by construction."
    constants:
      W_PRIORITY: 0.40
      W_OUTCOME: 0.35
      W_CAPACITY: 0.25
      PANEL_QUORUM: 3
      TRIM_MIN_COUNT: 5
      FOCUS_MULTIPLIER: 1.15
      PANEL_APPROVAL_THRESHOLD: 72.00
    precision: "weighted_score and composite_score 2 decimal places, round_half_up. Rounding happens twice on purpose: once per score before averaging, once after the multiplier."

  - name: community_impact_fund_allocation
    trigger: "POST /fundraising/allocation-cycles/{id}/awards (AllocationRequest PANEL_APPROVED -> AWARDED). Reversed field-by-field by POST /fundraising/allocation-requests/{id}/rescind-award."
    algorithm: waterfall_allocation
    formula: |
      # EVALUATION ORDER IS PINNED. The dependency LOOKS circular - the offset rate is keyed on an
      # award figure and the supplement rate is keyed on a net award figure that the offset itself
      # produces - so the scaffold fixes exactly which figure keys which tier:
      #   * OFFSET_RATE   is keyed on  base_award            (step 3 output)
      #   * SUPPLEMENT_RATE is keyed on base_award - designation_offset  (step 4 output)
      #   * the pool clamp is applied LAST (step 7), never before the supplement
      # Keying either rate on total_award, or clamping before step 5, yields a different number.

      # step 1 - hard per-agency ceiling
      eligible_request_amount = min( request.requested_amount , cycle.max_award_per_agency )
      # step 2 - panel score scales the ask
      score_scaled            = round_half_up( eligible_request_amount * (request.composite_score / 100) , 2 )
      # step 3 - pool-bounded base
      base_award              = min( score_scaled , cycle.available_undesignated_pool )
      # step 4 - designation-honoring offset: agencies already carried by donor designations draw
      #          less from the undesignated community impact fund. Rate keyed on base_award.
      offset_rate             = 0.00  if base_award <  OFFSET_TIER_1_FLOOR                       # < 50000
                                0.15  if OFFSET_TIER_1_FLOOR <= base_award < OFFSET_TIER_2_FLOOR # 50000..149999.99
                                0.35  if base_award >= OFFSET_TIER_2_FLOOR                       # >= 150000
      designation_offset      = min( round_half_up( base_award * offset_rate , 2 ) ,
                                     agency.designated_passthrough_ytd )
      # step 5 - strategic supplement: rate keyed on the NET figure produced by step 4
      net_after_offset        = base_award - designation_offset
      supplement_rate         = 0.06  if net_after_offset <  SUPPLEMENT_TIER_1_CEILING            # < 50000
                                0.03  if SUPPLEMENT_TIER_1_CEILING <= net_after_offset < SUPPLEMENT_TIER_2_CEILING  # 50000..119999.99
                                0.01  if net_after_offset >= SUPPLEMENT_TIER_2_CEILING            # >= 120000
      strategic_supplement    = round_half_up( net_after_offset * supplement_rate , 2 )
      # step 6 - assemble
      total_award_unclamped   = net_after_offset + strategic_supplement
      # step 7 - final pool clamp (LAST)
      total_award             = min( total_award_unclamped , cycle.available_undesignated_pool )

      # Ledger, recomputed after every award and every rescind:
      cycle.awarded_total              = sum(r.total_award for requests of this cycle
                                             with status IN {AWARDED, REPORTING, CLOSED_SATISFIED})
      cycle.available_undesignated_pool = cycle.opening_undesignated_pool - cycle.awarded_total
      # INVARIANT (cycle_pool_conservation):
      #   cycle.available_undesignated_pool + cycle.awarded_total == cycle.opening_undesignated_pool

      # Worked answer (this is the pinned arithmetic):
      #   requested 250000.00, cap 200000.00, composite 87.98, pool 500000.00,
      #   agency.designated_passthrough_ytd 92750.00
      #   step1 200000.00 | step2 175960.00 | step3 175960.00
      #   step4 rate 0.35 -> 61586.00, cap 92750.00 -> 61586.00
      #   step5 net 114374.00 -> rate 0.03 -> 3431.22
      #   step6/7 total_award 117805.22 ; available pool 382194.78
    input_set: "One PANEL_APPROVED AllocationRequest plus its Agency (for designated_passthrough_ytd, itself the sum of collected_designated_amount over that agency's ACTIVE designation lines) plus its AllocationCycle (for max_award_per_agency and available_undesignated_pool). Requests with status PANEL_DECLINED or SUSPENDED_REVIEW never enter."
    constants:
      OFFSET_TIER_1_FLOOR: 50000.00
      OFFSET_TIER_2_FLOOR: 150000.00
      SUPPLEMENT_TIER_1_CEILING: 50000.00
      SUPPLEMENT_TIER_2_CEILING: 120000.00
      OUTCOME_REPORT_DUE_DAYS: 180
      REQUEST_CAP_MULTIPLE: 2.0
      CYCLE_RESTRICT_RATIO: 0.34
    precision: "All money 2 decimal places, round_half_up; each of steps 2, 4 and 5 rounds independently and the rounded value is what the next step consumes."

  - name: outcome_report_expenditure_variance
    trigger: "On POST /fundraising/allocation-requests/{id}/outcome-reports and on every POST /fundraising/outcome-reports/{id}/resubmit."
    algorithm: aggregation
    formula: |
      if request.total_award is null or request.total_award == 0:
          report.expenditure_variance_pct = 0.00
      else:
          report.expenditure_variance_pct =
              round_half_up( (report.funds_expended - request.total_award) / request.total_award * 100 , 2 )
      # Delinquency (feeds Agency.outcome_report_delinquent and validations priority 22):
      agency.outcome_report_delinquent =
          any( r for AllocationRequest rows of this agency
               where r.status IN {AWARDED, REPORTING}
                 and r.outcome_report_due_date is not null
                 and date(logical_clock_now) > r.outcome_report_due_date
                 and no OutcomeReport of r has status == ACCEPTED )
    input_set: "One OutcomeReport and its parent AllocationRequest for the variance; every AWARDED/REPORTING request of the agency for the delinquency flag."
    constants:
      MAX_REVISION_ROUNDS: 2
      SITE_VISIT_BUFFER_DAYS: 3
      SITE_VISIT_MAX_LEAD_DAYS: 90
    precision: "expenditure_variance_pct 2 decimal places, round_half_up (can be negative)."

# =============================================================================
# 1.4 Validation Rules Table (evaluated strictly in ascending `priority`)
# =============================================================================
validations:
  - priority: 1
    category: auth
    check: "X-User-Role header present and equal to one of the six declared roles; X-User-ID header present for every entity_backed role."
    error_id: ERR_UNAUTHENTICATED
    http_status: 401
    applies_to: all

  - priority: 2
    category: auth
    check: "The X-User-Role is listed in the endpoint's `roles:` set."
    error_id: ERR_ROLE_NOT_PERMITTED
    http_status: 403
    applies_to: all

  - priority: 3
    category: business_constraint
    check: "Request body carries every required field of the endpoint's `input:` schema, every value matches its declared type / enum member / numeric range, money fields carry at most 2 decimals, and ratio fields at most 4."
    error_id: ERR_INVALID_REQUEST
    http_status: 400
    applies_to: "all writes"

  - priority: 4
    category: existence
    check: "Every path-segment resource exists, validated left to right: employer, campaign, pledge, agency, review, cycle, allocation request, panelist, outcome report."
    error_id: "ERR_EMPLOYER_NOT_FOUND | ERR_CAMPAIGN_NOT_FOUND | ERR_PLEDGE_NOT_FOUND | ERR_AGENCY_NOT_FOUND | ERR_AGENCY_REVIEW_NOT_FOUND | ERR_CYCLE_NOT_FOUND | ERR_REQUEST_NOT_FOUND | ERR_PANELIST_NOT_FOUND | ERR_OUTCOME_REPORT_NOT_FOUND"
    http_status: 404
    applies_to: "all endpoints with path parameters"

  - priority: 5
    category: existence
    check: "Every foreign key supplied in the request body resolves: employer_id, campaign_id, agency_id, cycle_id, panelist_id, request_id, and each designations[].agency_id."
    error_id: "ERR_EMPLOYER_NOT_FOUND | ERR_CAMPAIGN_NOT_FOUND | ERR_AGENCY_NOT_FOUND | ERR_CYCLE_NOT_FOUND | ERR_PANELIST_NOT_FOUND | ERR_REQUEST_NOT_FOUND"
    http_status: 404
    applies_to: "POST /campaigns, POST /allocation-requests, POST /allocation-cycles/{id}/panel-assignments, POST /allocation-cycles/{id}/awards, POST /campaigns/{id}/pledges, POST /pledges/{id}/designations:amend"

  - priority: 6
    category: auth
    check: "Ownership for entity_backed roles: a CampaignCoordinator's X-User-ID must be a coordinator of the campaign's employer (and must equal pledge.recorded_by_coordinator_id for pledge writes); an AgencyRepresentative's X-User-ID must equal the agency_id of the target request or report; a VolunteerPanelist's X-User-ID must equal report.site_visit_panelist_id for site-visit completion."
    error_id: ERR_OWNERSHIP_VIOLATION
    http_status: 403
    applies_to: "POST /campaigns/{id}/pledges, POST /pledges/{id}/confirm, POST /pledges/{id}/designations:amend, POST /allocation-requests, POST /allocation-requests/{id}/submit, POST /allocation-requests/{id}/outcome-reports, POST /outcome-reports/{id}/site-visit/complete, POST /outcome-reports/{id}/resubmit"

  - priority: 7
    category: state
    check: "Nested path integrity: {review_id} must belong to the {id} agency of the same path."
    error_id: ERR_REVIEW_AGENCY_MISMATCH
    http_status: 409
    applies_to: "POST /agencies/{id}/reviews/{review_id}/certify"

  - priority: 8
    category: state
    check: "Optimistic concurrency: the supplied expected_pledge_version / expected_allocation_cycle_version equals the current `version` of the named parent."
    error_id: ERR_STALE_VERSION
    http_status: 412
    applies_to: "POST /pledges/{id}/designations:amend, POST /allocation-cycles/{id}/awards"

  - priority: 9
    category: state
    check: "Employer status precondition: activate requires PROSPECT."
    error_id: ERR_EMPLOYER_INVALID_STATE
    http_status: 409
    applies_to: "POST /employers/{id}/activate"

  - priority: 10
    category: state
    check: "Employer must be ACTIVE before a campaign of that employer may open."
    error_id: ERR_EMPLOYER_NOT_ACTIVE
    http_status: 409
    applies_to: "POST /campaigns/{id}/open"

  - priority: 11
    category: state
    check: "Campaign posture must be OPEN for pledge recording, pledge confirmation and designation amendment."
    error_id: ERR_CAMPAIGN_NOT_OPEN
    http_status: 409
    applies_to: "POST /campaigns/{id}/pledges, POST /pledges/{id}/confirm, POST /pledges/{id}/designations:amend"

  - priority: 12
    category: state
    check: "Campaign posture must be exactly the posture the requested campaign transition starts from: PLANNED for open, OPEN for close-solicitation, SOLICITATION_CLOSED for reconcile, and IN {OPEN, SOLICITATION_CLOSED} for collections and write-offs."
    error_id: ERR_CAMPAIGN_INVALID_STATE
    http_status: 409
    applies_to: "POST /campaigns/{id}/open, POST /campaigns/{id}/close-solicitation, POST /campaigns/{id}/reconcile, POST /pledges/{id}/collections, POST /pledges/{id}/write-off"

  - priority: 13
    category: state
    check: "Pledge designation_status must be DRAFT or AMENDED for confirm, CONFIRMED for amend, and IN {CONFIRMED, AMENDED} for collections and write-offs."
    error_id: ERR_PLEDGE_NOT_CONFIRMED
    http_status: 409
    applies_to: "POST /pledges/{id}/confirm, POST /pledges/{id}/designations:amend, POST /pledges/{id}/collections, POST /pledges/{id}/write-off"

  - priority: 14
    category: state
    check: "Pledge collection_status must not already be terminal (COLLECTED or WRITTEN_OFF)."
    error_id: ERR_PLEDGE_COLLECTION_TERMINAL
    http_status: 409
    applies_to: "POST /pledges/{id}/collections, POST /pledges/{id}/write-off"

  - priority: 15
    category: state
    check: "AgencyReview must still be PENDING to be certified."
    error_id: ERR_REVIEW_ALREADY_CERTIFIED
    http_status: 409
    applies_to: "POST /agencies/{id}/reviews/{review_id}/certify"

  - priority: 16
    category: state
    check: "Agency membership_status must not be SUSPENDED_MEMBERSHIP (terminal) for certify, reinstate or new review creation; reinstate additionally requires PROBATION with open_review_count == 0."
    error_id: ERR_AGENCY_MEMBERSHIP_TERMINAL
    http_status: 409
    applies_to: "POST /agencies/{id}/reviews, POST /agencies/{id}/reviews/{review_id}/certify, POST /agencies/{id}/reinstate"

  - priority: 17
    category: state
    check: "AllocationCycle posture must be FROZEN-free: awards require OPEN; panel assignments and cycle open require DRAFT/OPEN as declared per transition."
    error_id: ERR_CYCLE_FROZEN
    http_status: 409
    applies_to: "POST /allocation-cycles/{id}/awards, POST /allocation-cycles/{id}/panel-assignments, POST /allocation-requests/{id}/submit, POST /allocation-requests/{id}/scores, POST /allocation-requests/{id}/finalize-review"

  - priority: 18
    category: state
    check: "AllocationCycle posture must be OPEN for request submission and for panel scoring; DRAFT or FROZEN cycles are refused with ERR_CYCLE_NOT_OPEN."
    error_id: ERR_CYCLE_NOT_OPEN
    http_status: 409
    applies_to: "POST /allocation-requests/{id}/submit, POST /allocation-requests/{id}/scores, POST /allocation-cycles/{id}/open"

  - priority: 19
    category: state
    check: "AllocationCycle posture RESTRICTED blocks awards only (awards_blocked == true); scoring and finalize-review remain legal while RESTRICTED."
    error_id: ERR_CYCLE_RESTRICTED
    http_status: 409
    applies_to: "POST /allocation-cycles/{id}/awards"

  - priority: 20
    category: state
    check: "AllocationRequest status must be one of the statuses the requested operation accepts: DRAFT for submit, IN {SUBMITTED, UNDER_PANEL_REVIEW} for finalize-review (a still-SUBMITTED request is accepted here and then fails at priority 36 with ERR_NO_ELIGIBLE_SCORES), PANEL_APPROVED for awards, IN {AWARDED, REPORTING} for rescind-award (a REPORTING request is admitted here only so that priority 41 can refuse it with ERR_AWARD_ALREADY_REPORTED), AWARDED for outcome-report creation, and IN {SUBMITTED, UNDER_PANEL_REVIEW} for scoring."
    error_id: ERR_REQUEST_INVALID_STATE
    http_status: 409
    applies_to: "POST /allocation-requests/{id}/submit, POST /allocation-requests/{id}/scores, POST /allocation-requests/{id}/finalize-review, POST /allocation-cycles/{id}/awards, POST /allocation-requests/{id}/rescind-award, POST /allocation-requests/{id}/outcome-reports"

  - priority: 21
    category: state
    check: "OutcomeReport status must be exactly the status the requested transition starts from: SUBMITTED for site-visit, SITE_VISIT_SCHEDULED for site-visit/complete, SITE_VISIT_COMPLETED for accept and request-revision, REVISION_REQUESTED for resubmit."
    error_id: ERR_REPORT_INVALID_STATE
    http_status: 409
    applies_to: "POST /outcome-reports/{id}/site-visit, POST /outcome-reports/{id}/site-visit/complete, POST /outcome-reports/{id}/accept, POST /outcome-reports/{id}/request-revision, POST /outcome-reports/{id}/resubmit"

  - priority: 22
    category: business_safety
    check: "A VolunteerPanelist who declared a conflict of interest on the cycle (PanelAssignment.conflict_declared == true) may not file a score on any request of that cycle."
    error_id: ERR_PANELIST_CONFLICT_DECLARED
    http_status: 422
    applies_to: "POST /allocation-requests/{id}/scores"

  - priority: 23
    category: business_safety
    check: "Segregation of duties: the VolunteerPanelist scheduling a site visit must have filed no PanelScore against that report's AllocationRequest."
    error_id: ERR_SEGREGATION_OF_DUTIES
    http_status: 403
    applies_to: "POST /outcome-reports/{id}/site-visit"

  - priority: 24
    category: business_safety
    check: "Agency membership standards: the requesting agency must be in GOOD_STANDING at submission time."
    error_id: ERR_AGENCY_NOT_IN_GOOD_STANDING
    http_status: 422
    applies_to: "POST /allocation-requests/{id}/submit"

  - priority: 25
    category: business_safety
    check: "Outcome reporting compliance: an agency carrying an overdue outcome report (outcome_report_delinquent == true) may not submit a new allocation request."
    error_id: ERR_OUTCOME_REPORT_DELINQUENT
    http_status: 422
    applies_to: "POST /allocation-requests/{id}/submit"

  - priority: 26
    category: business_referential
    check: "Donor designation honoring: every designations[].agency_id must resolve to an Agency with membership_status IN {GOOD_STANDING, PROBATION}; APPLICANT, UNDER_FINANCIAL_REVIEW and SUSPENDED_MEMBERSHIP agencies may not receive designations."
    error_id: ERR_DESIGNATION_TARGET_INELIGIBLE
    http_status: 422
    applies_to: "POST /campaigns/{id}/pledges, POST /pledges/{id}/designations:amend"

  - priority: 27
    category: business_temporal
    check: "Campaign window exclusivity on the Employer resource: the half-open interval [solicitation_start_date, solicitation_end_date) must not intersect the interval of any other Campaign of the same employer whose posture is not ESCROW_HOLD. Intersection means new.start < existing.end AND existing.start < new.end, so touching endpoints (new.start == existing.end) are allowed."
    error_id: ERR_CAMPAIGN_WINDOW_OVERLAP
    http_status: 409
    applies_to: "POST /campaigns"

  - priority: 28
    category: business_temporal
    check: "Site-visit spacing on the Panelist resource: the CLOSED interval [site_visit_window_start, site_visit_window_end] must be separated from every other window already held by the same panelist by more than SITE_VISIT_BUFFER_DAYS (3) calendar days. Collision means new.start <= existing.end + 3 days AND existing.start <= new.end + 3 days."
    error_id: ERR_SITE_VISIT_BUFFER_CONFLICT
    http_status: 409
    applies_to: "POST /outcome-reports/{id}/site-visit"

  - priority: 29
    category: business_temporal
    check: "Site-visit window sanity: site_visit_window_start >= date(report.submitted_at), site_visit_window_end >= site_visit_window_start, and site_visit_window_end <= date(report.submitted_at) + SITE_VISIT_MAX_LEAD_DAYS (90)."
    error_id: ERR_SITE_VISIT_WINDOW_INVALID
    http_status: 422
    applies_to: "POST /outcome-reports/{id}/site-visit"

  - priority: 30
    category: business_temporal
    check: "Allocation request submission must fall inside the cycle's half-open request window [request_window_start, request_window_end) measured against the logical clock date."
    error_id: ERR_REQUEST_WINDOW_CLOSED
    http_status: 422
    applies_to: "POST /allocation-requests/{id}/submit"

  - priority: 31
    category: business_constraint
    check: "Each designations[].designated_amount must be >= MIN_DESIGNATION_AMOUNT (25.00)."
    error_id: ERR_DESIGNATION_BELOW_MINIMUM
    http_status: 422
    applies_to: "POST /campaigns/{id}/pledges, POST /pledges/{id}/designations:amend"

  - priority: 32
    category: business_constraint
    check: "The sum of designations[].designated_amount must not exceed the pledge's gross_amount; the remainder becomes the undesignated pool contribution."
    error_id: ERR_DESIGNATION_EXCEEDS_GROSS
    http_status: 422
    applies_to: "POST /campaigns/{id}/pledges, POST /pledges/{id}/designations:amend"

  - priority: 33
    category: business_constraint
    check: "donor_reference must be unique within the campaign."
    error_id: ERR_DUPLICATE_DONOR_REFERENCE
    http_status: 409
    applies_to: "POST /campaigns/{id}/pledges"

  - priority: 34
    category: business_constraint
    check: "A VolunteerPanelist must hold a PanelAssignment on the request's cycle before filing a score or scheduling a site visit."
    error_id: ERR_PANELIST_NOT_ASSIGNED
    http_status: 422
    applies_to: "POST /allocation-requests/{id}/scores, POST /outcome-reports/{id}/site-visit"

  - priority: 35
    category: business_constraint
    check: "A panelist may file at most one PanelScore per AllocationRequest, and a panelist may hold at most one PanelAssignment per cycle."
    error_id: ERR_DUPLICATE_PANEL_SCORE
    http_status: 409
    applies_to: "POST /allocation-requests/{id}/scores, POST /allocation-cycles/{id}/panel-assignments"

  - priority: 36
    category: business_constraint
    check: "finalize-review requires at least one eligible PanelScore; an entirely empty eligible set is its own failure mode."
    error_id: ERR_NO_ELIGIBLE_SCORES
    http_status: 422
    applies_to: "POST /allocation-requests/{id}/finalize-review"

  - priority: 37
    category: business_constraint
    check: "finalize-review requires eligible_score_count >= PANEL_QUORUM (3) once the eligible set is non-empty."
    error_id: ERR_PANEL_QUORUM_NOT_MET
    http_status: 422
    applies_to: "POST /allocation-requests/{id}/finalize-review"

  - priority: 38
    category: business_constraint
    check: "An agency may hold at most one AllocationRequest per AllocationCycle in any status other than PANEL_DECLINED."
    error_id: ERR_DUPLICATE_REQUEST_FOR_CYCLE
    http_status: 409
    applies_to: "POST /allocation-requests"

  - priority: 39
    category: business_constraint
    check: "request-revision is refused once revision_round_count has reached MAX_REVISION_ROUNDS (2)."
    error_id: ERR_REVISION_LIMIT_REACHED
    http_status: 409
    applies_to: "POST /outcome-reports/{id}/request-revision"

  - priority: 40
    category: business_constraint
    check: "A cycle may not open until at least one PanelAssignment with conflict_declared == false exists on it."
    error_id: ERR_PANEL_NOT_SEATED
    http_status: 422
    applies_to: "POST /allocation-cycles/{id}/open"

  - priority: 41
    category: business_constraint
    check: "rescind-award is refused once any OutcomeReport exists for the request; this is the only reason a REPORTING request is let past priority 20."
    error_id: ERR_AWARD_ALREADY_REPORTED
    http_status: 409
    applies_to: "POST /allocation-requests/{id}/rescind-award"

  - priority: 42
    category: business_fiscal
    check: "PAYROLL_DEDUCTION pledges require Employer.payroll_periods_per_year > 0."
    error_id: ERR_PAYROLL_METHOD_UNAVAILABLE
    http_status: 422
    applies_to: "POST /campaigns/{id}/pledges"

  - priority: 43
    category: business_fiscal
    check: "A remittance amount must not exceed the pledge's outstanding balance (gross_amount - collected_amount)."
    error_id: ERR_COLLECTION_EXCEEDS_OUTSTANDING
    http_status: 422
    applies_to: "POST /pledges/{id}/collections"

  - priority: 44
    category: business_fiscal
    check: "reconcile requires every CONFIRMED or AMENDED pledge of the campaign to have left collection_status PENDING."
    error_id: ERR_CAMPAIGN_NOT_FULLY_REMITTED
    http_status: 422
    applies_to: "POST /campaigns/{id}/reconcile"

  - priority: 45
    category: business_fiscal
    check: "requested_amount must not exceed cycle.max_award_per_agency * REQUEST_CAP_MULTIPLE (2.0) at submission time."
    error_id: ERR_AWARD_EXCEEDS_AGENCY_CAP
    http_status: 422
    applies_to: "POST /allocation-requests/{id}/submit"

  - priority: 46
    category: business_fiscal
    check: "The step-6 total_award_unclamped of community_impact_fund_allocation must not exceed cycle.available_undesignated_pool."
    error_id: ERR_POOL_INSUFFICIENT
    http_status: 422
    applies_to: "POST /allocation-cycles/{id}/awards"

