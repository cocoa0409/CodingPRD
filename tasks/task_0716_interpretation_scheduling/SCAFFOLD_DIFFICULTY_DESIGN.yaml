scaffold_difficulty_design:
  # =================================================================
  - rule_id: dual_variant_calc
    instances:
      - name: session_billing_per_minute_vs_per_hour_diverge
        grounds:
          - calculations.session_billing
          - state_machines.Session.ACTIVE_to_ENDED
          - entities.Session.fields.billed_amount_cents
        distinguishing_aspect: "Same 2h45m connected duration on a Session bills 40500c under a PER_HOUR onsite plan (ceil-hours+travel) but a different amount under a PER_MINUTE plan; the divergence is on the Session entity's billing variant."
        test_recipe:
          setup:
            - "A COURT client with an active PER_HOUR LEGAL/ONSITE rate plan (12000c/hr, min 2, travel 4500c)."
            - "An interpreter holding a valid LEGAL certification and the en-es pair, accepted and connected for an ONSITE session."
            - "Clock advanced so connected->ended spans 2h45m (09:00:00 -> 11:45:00)."
          setup_api_calls:
            - call: "POST /interpretation/clients"
              payload: { org_name: "County Court", org_type: "COURT", contact_email: "court@x.com" }
              as: PlatformAdmin
              captures: { court_id: $.data.id }
            - call: "POST /interpretation/rate-plans"
              payload: { client_id: "${court_id}", certification_tier: "LEGAL", modality: "ONSITE", billing_mode: "PER_HOUR", rate_cents: 12000, min_block_units: 2, travel_surcharge_cents: 4500 }
              as: PlatformAdmin
            - call: "POST /interpretation/language-pairs"
              payload: { source_lang: "en", target_lang: "es" }
              as: PlatformAdmin
              captures: { lp_id: $.data.id }
            - call: "POST /interpretation/interpreters"
              payload: { full_name: "Lex T", max_concurrent_load: 1 }
              as: PlatformAdmin
              captures: { itp_id: $.data.id }
            - call: "POST /interpretation/interpreters/${itp_id}/certifications"
              payload: { tier: "LEGAL", expires_at: "2027-01-01T00:00:00Z" }
              as: PlatformAdmin
            - call: "POST /interpretation/interpreters/${itp_id}/languages"
              payload: { language_pair_id: "${lp_id}" }
              as: PlatformAdmin
            - call: "POST /interpretation/_clock/set_current_utc"
              payload: { to_iso8601: "2026-03-10T08:50:00Z" }
              as: PlatformAdmin
            - call: "POST /interpretation/requests"
              payload: { client_id: "${court_id}", language_pair_id: "${lp_id}", modality: "ONSITE", required_tier: "LEGAL", scheduling_mode: "ON_DEMAND" }
              as: ClientAccount
              as_user_id: "${court_id}"
              captures: { req_id: $.data.id, req_v: $.data.version }
            - call: "POST /interpretation/requests/${req_id}/dispatch"
              payload: { expected_request_version: "${req_v}" }
              as: CoordinatorOps
              captures: { asg_id: $.data.id }
            - call: "POST /interpretation/assignments/${asg_id}/accept"
              payload: {}
              as: Interpreter
              as_user_id: "${itp_id}"
            - call: "POST /interpretation/assignments/${asg_id}/start-session"
              payload: {}
              as: Interpreter
              as_user_id: "${itp_id}"
              captures: { sess_id: $.data.id }
            - call: "POST /interpretation/_clock/set_current_utc"
              payload: { to_iso8601: "2026-03-10T09:00:00Z" }
              as: PlatformAdmin
            - call: "POST /interpretation/sessions/${sess_id}/connect"
              payload: {}
              as: Interpreter
              as_user_id: "${itp_id}"
            - call: "POST /interpretation/_clock/set_current_utc"
              payload: { to_iso8601: "2026-03-10T11:45:00Z" }
              as: PlatformAdmin
          trigger:
            - call: "POST /interpretation/sessions/${sess_id}/end"
              payload: {}
              as: Interpreter
              as_user_id: "${itp_id}"
              captures: { final_amt: $.data.billed_amount_cents }
          assert:
            - "Session.${sess_id}.billed_units == 3"
            - "Session.${sess_id}.billed_amount_cents == 40500"
            - "A PER_MINUTE plan over the identical 9900s would yield billed_units == 165 (not 3), a different number — confirming variant divergence on the same Session."
      - name: cancellation_fee_ondemand_vs_scheduled_diverge
        grounds:
          - calculations.cancellation_fee
          - state_machines.InterpretationRequest.ASSIGNED_to_CANCELLED
          - entities.InterpretationRequest.fields.cancellation_fee_cents
        distinguishing_aspect: "On the InterpretationRequest entity, an ON_DEMAND cancel yields fee 0 while a SCHEDULED cancel inside the late window yields 14250c — divergent results on a different entity domain (Request) than session_billing (Session)."
        test_recipe:
          setup:
            - "A COURT client with an active PER_HOUR LEGAL/ONSITE plan (12000c/hr, min 2, travel 4500c)."
            - "A SCHEDULED request whose window_start is 1 hour ahead of the clock (inside the 2h late window)."
            - "The request has been dispatched (ASSIGNED) but no session has connected."
          setup_api_calls:
            - call: "POST /interpretation/clients"
              payload: { org_name: "County Court", org_type: "COURT", contact_email: "court@x.com" }
              as: PlatformAdmin
              captures: { court_id: $.data.id }
            - call: "POST /interpretation/rate-plans"
              payload: { client_id: "${court_id}", certification_tier: "LEGAL", modality: "ONSITE", billing_mode: "PER_HOUR", rate_cents: 12000, min_block_units: 2, travel_surcharge_cents: 4500 }
              as: PlatformAdmin
            - call: "POST /interpretation/language-pairs"
              payload: { source_lang: "en", target_lang: "es" }
              as: PlatformAdmin
              captures: { lp_id: $.data.id }
            - call: "POST /interpretation/interpreters"
              payload: { full_name: "Lex T" }
              as: PlatformAdmin
              captures: { itp_id: $.data.id }
            - call: "POST /interpretation/interpreters/${itp_id}/certifications"
              payload: { tier: "LEGAL", expires_at: "2027-01-01T00:00:00Z" }
              as: PlatformAdmin
            - call: "POST /interpretation/interpreters/${itp_id}/languages"
              payload: { language_pair_id: "${lp_id}" }
              as: PlatformAdmin
            - call: "POST /interpretation/_clock/set_current_utc"
              payload: { to_iso8601: "2026-03-10T10:00:00Z" }
              as: PlatformAdmin
            - call: "POST /interpretation/requests"
              payload: { client_id: "${court_id}", language_pair_id: "${lp_id}", modality: "ONSITE", required_tier: "LEGAL", scheduling_mode: "SCHEDULED", window_start: "2026-03-10T11:00:00Z", window_end: "2026-03-10T12:00:00Z" }
              as: ClientAccount
              as_user_id: "${court_id}"
              captures: { req_id: $.data.id, req_v: $.data.version }
            - call: "POST /interpretation/requests/${req_id}/dispatch"
              payload: { expected_request_version: "${req_v}" }
              as: CoordinatorOps
          trigger:
            - call: "POST /interpretation/requests/${req_id}/cancel"
              payload: {}
              as: ClientAccount
              as_user_id: "${court_id}"
              captures: { fee: $.data.cancellation_fee_cents }
          assert:
            - "InterpretationRequest.${req_id}.cancellation_fee_cents == 14250"
            - "InterpretationRequest.${req_id}.status == CANCELLED"
            - "An identical ON_DEMAND request cancelled before any session connects yields cancellation_fee_cents == 0, a different result on the same Request entity."

  # =================================================================
  - rule_id: combinatorial_formula
    instances:
      - name: session_billing_ceil_before_multiply_then_surcharge_order
        grounds:
          - calculations.session_billing
          - entities.RatePlan.fields.travel_surcharge_cents
          - entities.Session.fields.billed_amount_cents
        distinguishing_aspect: "Mode (b): the order ceil(time->units) THEN multiply THEN add flat travel surcharge is pinned; computing surcharge-then-ceil or multiply-before-ceil produces different cents (40500 vs alternatives)."
        test_recipe:
          setup:
            - "COURT client, active PER_HOUR LEGAL/ONSITE plan (12000c/hr, min 2, travel 4500c)."
            - "Connected ONSITE session spanning 2h45m (9900s) for that plan."
          setup_api_calls:
            - call: "POST /interpretation/clients"
              payload: { org_name: "County Court", org_type: "COURT", contact_email: "court@x.com" }
              as: PlatformAdmin
              captures: { court_id: $.data.id }
            - call: "POST /interpretation/rate-plans"
              payload: { client_id: "${court_id}", certification_tier: "LEGAL", modality: "ONSITE", billing_mode: "PER_HOUR", rate_cents: 12000, min_block_units: 2, travel_surcharge_cents: 4500 }
              as: PlatformAdmin
            - call: "POST /interpretation/language-pairs"
              payload: { source_lang: "en", target_lang: "es" }
              as: PlatformAdmin
              captures: { lp_id: $.data.id }
            - call: "POST /interpretation/interpreters"
              payload: { full_name: "Lex T" }
              as: PlatformAdmin
              captures: { itp_id: $.data.id }
            - call: "POST /interpretation/interpreters/${itp_id}/certifications"
              payload: { tier: "LEGAL", expires_at: "2027-01-01T00:00:00Z" }
              as: PlatformAdmin
            - call: "POST /interpretation/interpreters/${itp_id}/languages"
              payload: { language_pair_id: "${lp_id}" }
              as: PlatformAdmin
            - call: "POST /interpretation/_clock/set_current_utc"
              payload: { to_iso8601: "2026-03-10T08:50:00Z" }
              as: PlatformAdmin
            - call: "POST /interpretation/requests"
              payload: { client_id: "${court_id}", language_pair_id: "${lp_id}", modality: "ONSITE", required_tier: "LEGAL", scheduling_mode: "ON_DEMAND" }
              as: ClientAccount
              as_user_id: "${court_id}"
              captures: { req_id: $.data.id, req_v: $.data.version }
            - call: "POST /interpretation/requests/${req_id}/dispatch"
              payload: { expected_request_version: "${req_v}" }
              as: CoordinatorOps
              captures: { asg_id: $.data.id }
            - call: "POST /interpretation/assignments/${asg_id}/accept"
              payload: {}
              as: Interpreter
              as_user_id: "${itp_id}"
            - call: "POST /interpretation/assignments/${asg_id}/start-session"
              payload: {}
              as: Interpreter
              as_user_id: "${itp_id}"
              captures: { sess_id: $.data.id }
            - call: "POST /interpretation/_clock/set_current_utc"
              payload: { to_iso8601: "2026-03-10T09:00:00Z" }
              as: PlatformAdmin
            - call: "POST /interpretation/sessions/${sess_id}/connect"
              payload: {}
              as: Interpreter
              as_user_id: "${itp_id}"
            - call: "POST /interpretation/_clock/set_current_utc"
              payload: { to_iso8601: "2026-03-10T11:45:00Z" }
              as: PlatformAdmin
          trigger:
            - call: "POST /interpretation/sessions/${sess_id}/end"
              payload: {}
              as: Interpreter
              as_user_id: "${itp_id}"
          assert:
            - "Session.${sess_id}.billed_units == 3"
            - "Session.${sess_id}.billed_amount_cents == 40500"
            - "3*12000 + 4500 == 40500; adding surcharge before the ceil/multiply or rounding hours down would not yield 40500."
      - name: interpreter_selection_three_factor_nonlinear_score
        grounds:
          - calculations.interpreter_selection
          - entities.Interpreter.fields.rating_avg
          - entities.Interpreter.fields.acceptance_pct
          - entities.Interpreter.fields.active_load
        distinguishing_aspect: "Mode (a): selection score combines >=3 inputs (rating, acceptance_pct, normalized load) with weights and a load-ratio term (1 - load/max), a non-linear interaction distinct from the rounding-order mode."
        test_recipe:
          setup:
            - "Two eligible interpreters for the same en-es MEDICAL request: itpA unrated (default 4.0, score 250) and itpB rated 5.0 (score 300)."
            - "Both AVAILABLE, load 0, both hold valid MEDICAL cert and the pair."
          setup_api_calls:
            - call: "POST /interpretation/clients"
              payload: { org_name: "Mercy Hosp", org_type: "HOSPITAL", contact_email: "h@x.com" }
              as: PlatformAdmin
              captures: { hosp_id: $.data.id }
            - call: "POST /interpretation/rate-plans"
              payload: { client_id: "${hosp_id}", certification_tier: "MEDICAL", modality: "PHONE", billing_mode: "PER_MINUTE", rate_cents: 195, min_block_units: 10 }
              as: PlatformAdmin
            - call: "POST /interpretation/language-pairs"
              payload: { source_lang: "en", target_lang: "es" }
              as: PlatformAdmin
              captures: { lp_id: $.data.id }
            - call: "POST /interpretation/interpreters"
              payload: { full_name: "B Star" }
              as: PlatformAdmin
              captures: { itpB_id: $.data.id }
            - call: "POST /interpretation/interpreters/${itpB_id}/certifications"
              payload: { tier: "MEDICAL", expires_at: "2027-01-01T00:00:00Z" }
              as: PlatformAdmin
            - call: "POST /interpretation/interpreters/${itpB_id}/languages"
              payload: { language_pair_id: "${lp_id}" }
              as: PlatformAdmin
            - call: "POST /interpretation/_clock/set_current_utc"
              payload: { to_iso8601: "2026-03-10T09:00:00Z" }
              as: PlatformAdmin
            - call: "POST /interpretation/requests"
              payload: { client_id: "${hosp_id}", language_pair_id: "${lp_id}", modality: "PHONE", required_tier: "MEDICAL", scheduling_mode: "ON_DEMAND" }
              as: ClientAccount
              as_user_id: "${hosp_id}"
              captures: { rseed_id: $.data.id, rseed_v: $.data.version }
            - call: "POST /interpretation/requests/${rseed_id}/dispatch"
              payload: { expected_request_version: "${rseed_v}" }
              as: CoordinatorOps
              captures: { aseed_id: $.data.id }
              note: "itpB is the ONLY qualified interpreter at this point, so selection deterministically picks itpB; itpA is onboarded after the seed rating below."
            - call: "POST /interpretation/assignments/${aseed_id}/accept"
              payload: {}
              as: Interpreter
              as_user_id: "${itpB_id}"
            - call: "POST /interpretation/assignments/${aseed_id}/start-session"
              payload: {}
              as: Interpreter
              as_user_id: "${itpB_id}"
              captures: { sseed_id: $.data.id }
            - call: "POST /interpretation/sessions/${sseed_id}/connect"
              payload: {}
              as: Interpreter
              as_user_id: "${itpB_id}"
            - call: "POST /interpretation/_clock/set_current_utc"
              payload: { to_iso8601: "2026-03-10T09:30:00Z" }
              as: PlatformAdmin
            - call: "POST /interpretation/sessions/${sseed_id}/end"
              payload: {}
              as: Interpreter
              as_user_id: "${itpB_id}"
            - call: "POST /interpretation/sessions/${sseed_id}/rating"
              payload: { score: 5 }
              as: ClientAccount
              as_user_id: "${hosp_id}"
            - call: "POST /interpretation/interpreters"
              payload: { full_name: "A New" }
              as: PlatformAdmin
              captures: { itpA_id: $.data.id }
            - call: "POST /interpretation/interpreters/${itpA_id}/certifications"
              payload: { tier: "MEDICAL", expires_at: "2027-01-01T00:00:00Z" }
              as: PlatformAdmin
            - call: "POST /interpretation/interpreters/${itpA_id}/languages"
              payload: { language_pair_id: "${lp_id}" }
              as: PlatformAdmin
            - call: "POST /interpretation/requests"
              payload: { client_id: "${hosp_id}", language_pair_id: "${lp_id}", modality: "PHONE", required_tier: "MEDICAL", scheduling_mode: "ON_DEMAND" }
              as: ClientAccount
              as_user_id: "${hosp_id}"
              captures: { req_id: $.data.id, req_v: $.data.version }
          trigger:
            - call: "POST /interpretation/requests/${req_id}/dispatch"
              payload: { expected_request_version: "${req_v}" }
              as: CoordinatorOps
              captures: { picked_itp: $.data.interpreter_id }
          assert:
            - "Assignment.interpreter_id == ${itpB_id} (score 5.0*50 + 100*0.3 + 100*0.2 = 300 > itpA's 4.0*50+30+20 = 250)"
            - "itpA was NOT selected despite being available, proving the three-factor weighted score, not first-come, decides."

  # =================================================================
  - rule_id: non_linear_state_machine
    instances:
      - name: session_dispute_reopen_cycle
        grounds:
          - state_machines.Session.ENDED_to_DISPUTED
          - state_machines.Session.DISPUTED_to_ACTIVE
          - state_machines.Session.ACTIVE_to_ENDED
        distinguishing_aspect: "Session exhibits a cycle ACTIVE->ENDED->DISPUTED->ACTIVE->ENDED; each ACTIVE->ENDED re-runs session_billing, so the same row re-enters a prior state."
        test_recipe:
          setup:
            - "Mercy hospital, PER_MINUTE MEDICAL/PHONE plan (195c/min, min 10)."
            - "A session ended once at 20 min (3900c), then disputed and reopened."
          setup_api_calls:
            - call: "POST /interpretation/clients"
              payload: { org_name: "Mercy Hosp", org_type: "HOSPITAL", contact_email: "h@x.com" }
              as: PlatformAdmin
              captures: { hosp_id: $.data.id }
            - call: "POST /interpretation/rate-plans"
              payload: { client_id: "${hosp_id}", certification_tier: "MEDICAL", modality: "PHONE", billing_mode: "PER_MINUTE", rate_cents: 195, min_block_units: 10 }
              as: PlatformAdmin
            - call: "POST /interpretation/language-pairs"
