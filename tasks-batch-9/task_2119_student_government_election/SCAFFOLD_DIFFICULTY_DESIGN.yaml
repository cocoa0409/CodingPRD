# =============================================================================
# §1.8 Scaffold Difficulty Design — Test Targeting Index
# Every instance grounds only in elements declared in SCAFFOLD.yaml §1.1–§1.7.
# Logical clock default before any /_clock call: 2026-08-01T00:00:00Z.
# =============================================================================
scaffold_difficulty_design:

  - rule_id: dual_variant_calc
    instances:

      - name: slate_spend_provisional_versus_final_on_candidacy
        grounds:
          - calculations.campaign_spend_assessment
          - calculations.slate_expense_allocation
          - calculations.certification_evaluation_order
          - entities.Candidacy.fields.spending_committed_cents
          - entities.Candidacy.fields.spending_final_cents
          - state_machines.Election.VOTING_CLOSED_to_TALLYING
        distinguishing_aspect: |
          The dual-variant subject is campaign money on the Candidacy entity: the same five
          CampaignExpense rows yield spending_committed_cents == 27500 under the PROVISIONAL
          joint-and-several variant and spending_final_cents == 7666 under the FINAL pro-rata
          variant for the same candidacy, a divergence of 19834 cents.
        test_recipe:
          setup:
            - "One election with spending_cap_cents 500000 and poster_cap 100, petition deadline 2026-09-01T00:00:00Z."
            - "One office 'Student Senate' with seat_count 3 and required_signature_count 0, so approval needs no signatures."
            - "Three candidacies on that office forming one slate: the leader c_l (created first, therefore the earliest created_at member), then c_m1 and c_m2, both pointing at c_l."
            - "Five expenses: c_l 10000 POSTER shared, c_l 10000 DIGITAL shared, c_l 2500 MERCH solo, c_m1 4000 MERCH solo, c_m2 1000 DIGITAL solo. Every line except c_m1's 4000 is APPROVED."
            - "The ballot is locked and published with all three candidacies ON_BALLOT, the voting window has opened and closed, and no vote was cast."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-01T00:00:00Z" }
              as: ElectionCommissioner
              as_user_id: "commissioner-1"
            - call: "POST /elections"
              payload: { title: "Fall 2026 SGA General", academic_year: "2026-2027", petition_deadline: "2026-09-01T00:00:00Z", spending_cap_cents: 500000, poster_cap: 100, quorum_pct: 25.00, runoff_threshold_pct: 50.00 }
              as: ElectionCommissioner
              as_user_id: "commissioner-1"
              captures: { e_id: $.data.id }
            - call: "POST /offices"
              payload: { election_id: "${e_id}", name: "Student Senate", eligible_class_years: ["JUNIOR", "SENIOR"], required_signature_count: 0, term_start_date: "2026-10-01T00:00:00Z", term_end_date: "2027-05-31T00:00:00Z", seat_count: 3, required_training_modules: 3 }
              as: ElectionCommissioner
              as_user_id: "commissioner-1"
              captures: { o_id: $.data.id }
            - call: "POST /students"
              payload: { full_name: "Lena Ortiz", student_number: "S-1001", class_year: "SENIOR", gpa: 3.40, credits_completed: 90 }
              as: Registrar
              as_user_id: "registrar-1"
              captures: { s_l_id: $.data.id }
            - call: "POST /students"
              payload: { full_name: "Marco Reyes", student_number: "S-1002", class_year: "JUNIOR", gpa: 3.10, credits_completed: 62 }
              as: Registrar
              as_user_id: "registrar-1"
              captures: { s_m1_id: $.data.id }
            - call: "POST /students"
              payload: { full_name: "Nia Kwan", student_number: "S-1003", class_year: "JUNIOR", gpa: 3.00, credits_completed: 60 }
              as: Registrar
              as_user_id: "registrar-1"
              captures: { s_m2_id: $.data.id }
            - call: "POST /elections/${e_id}/open-petitioning"
              payload: {}
              as: ElectionCommissioner
              as_user_id: "commissioner-1"
            - call: "POST /candidacies"
              payload: { election_id: "${e_id}", office_id: "${o_id}", student_id: "${s_l_id}", statement: "Slate leader" }
              as: Candidate
              as_user_id: "${s_l_id}"
              captures: { c_l_id: $.data.id }
            - call: "POST /candidacies"
              payload: { election_id: "${e_id}", office_id: "${o_id}", student_id: "${s_m1_id}", slate_leader_candidacy_id: "${c_l_id}" }
              as: Candidate
              as_user_id: "${s_m1_id}"
              captures: { c_m1_id: $.data.id }
            - call: "POST /candidacies"
              payload: { election_id: "${e_id}", office_id: "${o_id}", student_id: "${s_m2_id}", slate_leader_candidacy_id: "${c_l_id}" }
              as: Candidate
              as_user_id: "${s_m2_id}"
              captures: { c_m2_id: $.data.id }
            - call: "POST /candidacies/${c_l_id}/submit-petition"
              payload: {}
              as: Candidate
              as_user_id: "${s_l_id}"
            - call: "POST /candidacies/${c_m1_id}/submit-petition"
              payload: {}
              as: Candidate
              as_user_id: "${s_m1_id}"
            - call: "POST /candidacies/${c_m2_id}/submit-petition"
              payload: {}
              as: Candidate
              as_user_id: "${s_m2_id}"
            - call: "POST /candidacies/${c_l_id}/approve"
              payload: {}
              as: ElectionCommissioner
              as_user_id: "commissioner-1"
            - call: "POST /candidacies/${c_m1_id}/approve"
              payload: {}
              as: ElectionCommissioner
              as_user_id: "commissioner-1"
            - call: "POST /candidacies/${c_m2_id}/approve"
              payload: {}
              as: ElectionCommissioner
              as_user_id: "commissioner-1"
            - call: "POST /campaign-expenses"
              payload: { candidacy_id: "${c_l_id}", category: "POSTER", amount_cents: 10000, incurred_at: "2026-08-10T00:00:00Z", quantity: 40, shared_with_slate: true }
              as: Candidate
              as_user_id: "${s_l_id}"
              captures: { x1_id: $.data.id }
            - call: "POST /campaign-expenses"
              payload: { candidacy_id: "${c_l_id}", category: "DIGITAL", amount_cents: 10000, incurred_at: "2026-08-11T00:00:00Z", shared_with_slate: true }
              as: Candidate
              as_user_id: "${s_l_id}"
              captures: { x2_id: $.data.id }
            - call: "POST /campaign-expenses"
              payload: { candidacy_id: "${c_l_id}", category: "MERCH", amount_cents: 2500, incurred_at: "2026-08-12T00:00:00Z" }
              as: Candidate
              as_user_id: "${s_l_id}"
              captures: { x3_id: $.data.id }
            - call: "POST /campaign-expenses"
              payload: { candidacy_id: "${c_m1_id}", category: "MERCH", amount_cents: 4000, incurred_at: "2026-08-13T00:00:00Z" }
              as: Candidate
              as_user_id: "${s_m1_id}"
              captures: { x4_id: $.data.id }
            - call: "POST /campaign-expenses"
              payload: { candidacy_id: "${c_m2_id}", category: "DIGITAL", amount_cents: 1000, incurred_at: "2026-08-14T00:00:00Z" }
              as: Candidate
              as_user_id: "${s_m2_id}"
              captures: { x5_id: $.data.id }
            - call: "POST /campaign-expenses/${x1_id}/approve"
              payload: {}
              as: ElectionCommissioner
              as_user_id: "commissioner-1"
            - call: "POST /campaign-expenses/${x2_id}/approve"
              payload: {}
              as: ElectionCommissioner
              as_user_id: "commissioner-1"
            - call: "POST /campaign-expenses/${x3_id}/approve"
              payload: {}
              as: ElectionCommissioner
              as_user_id: "commissioner-1"
            - call: "POST /campaign-expenses/${x5_id}/approve"
              payload: {}
              as: ElectionCommissioner
              as_user_id: "commissioner-1"
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-09-01T00:00:00Z" }
              as: ElectionCommissioner
              as_user_id: "commissioner-1"
            - call: "GET /elections/${e_id}"
              payload: {}
              as: ElectionCommissioner
              as_user_id: "commissioner-1"
              captures: { e_v: $.data.version }
            - call: "POST /ballots"
              payload: { election_id: "${e_id}", round: 1, expected_election_version: "${e_v}" }
              as: ElectionCommissioner
              as_user_id: "commissioner-1"
              captures: { b_id: $.data.id }
            - call: "POST /ballots/${b_id}/lines"
              payload: { line_type: "CANDIDATE", office_id: "${o_id}", candidacy_id: "${c_l_id}" }
              as: ElectionCommissioner
              as_user_id: "commissioner-1"
            - call: "POST /ballots/${b_id}/lines"
              payload: { line_type: "CANDIDATE", office_id: "${o_id}", candidacy_id: "${c_m1_id}" }
              as: ElectionCommissioner
              as_user_id: "commissioner-1"
            - call: "POST /ballots/${b_id}/lines"
              payload: { line_type: "CANDIDATE", office_id: "${o_id}", candidacy_id: "${c_m2_id}" }
              as: ElectionCommissioner
              as_user_id: "commissioner-1"
            - call: "POST /ballots/${b_id}/lock"
              payload: {}
              as: ElectionCommissioner
              as_user_id: "commissioner-1"
            - call: "POST /ballots/${b_id}/publish"
              payload: {}
              as: ElectionCommissioner
              as_user_id: "commissioner-1"
            - call: "POST /elections/${e_id}/open-voting"
              payload: { round: 1, voting_opens_at: "2026-09-15T09:00:00Z", voting_closes_at: "2026-09-16T17:00:00Z" }
              as: ElectionCommissioner
              as_user_id: "commissioner-1"
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-09-16T18:00:00Z" }
              as: ElectionCommissioner
              as_user_id: "commissioner-1"
            - call: "POST /elections/${e_id}/close-voting"
              payload: {}
              as: ElectionCommissioner
              as_user_id: "commissioner-1"
          trigger:
            - call: "POST /elections/${e_id}/tally"
              payload: {}
              as: ElectionCommissioner
              as_user_id: "commissioner-1"
          assert:
            - "Candidacy.${c_l_id}.spending_committed_cents == 27500"
            - "Candidacy.${c_m1_id}.spending_committed_cents == 27500"
            - "Candidacy.${c_m2_id}.spending_committed_cents == 27500"
            - "Candidacy.${c_l_id}.spending_final_cents == 9168"
            - "Candidacy.${c_m1_id}.spending_final_cents == 6666"
            - "Candidacy.${c_m2_id}.spending_final_cents == 7666"
            - "Candidacy.${c_l_id}.spending_final_cents + Candidacy.${c_m1_id}.spending_final_cents + Candidacy.${c_m2_id}.spending_final_cents == 23500"
            - "Candidacy.${c_m2_id}.spending_committed_cents != Candidacy.${c_m2_id}.spending_final_cents"
            - "Candidacy.${c_m1_id}.spending_reported_cents == 4000"

      - name: office_share_provisional_versus_certified_denominator
        grounds:
          - calculations.office_result_share
          - calculations.certification_evaluation_order
          - entities.Candidacy.fields.provisional_share_pct
          - entities.Candidacy.fields.certified_share_pct
          - entities.Office.fields.valid_votes_count
          - entities.Office.fields.invalidated_votes_count
        distinguishing_aspect: |
          The dual-variant subject is vote share on the Office entity, a different domain from the
          Candidacy money variant: the same five ballots give the leader provisional_share_pct
          40.00 (which is below runoff_threshold_pct 50.00 and would force a runoff) and
          certified_share_pct 66.67 (which decides the office outright).
        test_recipe:
          setup:
            - "One election with runoff_threshold_pct 50.00 and quorum_pct 25.00."
            - "One office 'President' with seat_count 1 and required_signature_count 0, open to all four undergraduate class years."
            - "Three candidacies c_a, c_b, c_d, all ON_BALLOT on a published round-1 ballot."
            - "Eight enrolled students, so the frozen eligible_voter_count is 8; five of them cast: two for c_a, one for c_b, one for c_d and one explicit abstention on the office."
            - "After the window closes, two compliance cases against c_d are upheld (15 then 60 points, total 75), so c_d is DISQUALIFIED before the tally runs."
