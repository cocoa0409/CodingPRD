              as: BoardAdmin
              captures: { c_ok: $.data.id }
            - call: "POST /cle/attorneys"
              payload: { bar_number: "BAR-2141", full_name: "Twenty Nine Minute Attendee", admission_date: "2004-01-01T00:00:00Z", compliance_group: "GROUP_1", principal_office_jurisdiction: "ST" }
              as: BoardAdmin
              captures: { a_no: $.data.id }
            - call: "POST /cle/attorneys/${a_no}/compliance-cycles"
