          assert:
            - "HTTP 422; data.error_id == ERR_POSITION_HOLDER_INVALID - a DISTRIBUTOR may buy at the rack but may not hold the position"
            - "GET /mft/rack-removals returns total_count == 0, and the same body naming ${sup_id} as position_holder_licensee_id returns HTTP 201 with basis_used == NET and imposition_point == TERMINAL_RACK"
            - "POST /mft/returns/${ret_id}/schedules with schedule_code SCH_2_RECEIVED_TAX_UNPAID and product_code DYED_DIESEL returns HTTP 422 ERR_SCHEDULE_PRODUCT_NOT_ALLOWED, and so does SCH_10_DYED_SALES with product_code GASOLINE"
            - "POST /mft/exemption-certificates for purchaser ${farm_id} with exemption_type AGRICULTURE, document_number AG-9500-001, valid_from 2026-09-30 and valid_to 2026-09-01 returns HTTP 422 ERR_DATE_RANGE_INVALID, and GET /mft/exemption-certificates returns total_count == 0"
            - "POST /mft/audit-cases with period_start_month 2026-08 and period_end_month 2026-07 returns HTTP 422 ERR_DATE_RANGE_INVALID, and a bond whose effective_date is 2026-08-15 (after the 2026-08-01 clock) returns the same code, so the rule covers both ordering and the future"

  - section: rbac
    instances:
      - name: each_operator_role_can_perform_its_own_exclusive_operations
        claim_type: exclusive_operations
        grounds:
          - roles.LicensingOfficer.exclusive_operations
          - roles.FieldInspector.exclusive_operations
          - roles.AuditManager.exclusive_operations
          - roles.TaxSupervisor.exclusive_operations
        distinguishing_aspect: "Four roles each drive their own verb on one shared subject licensee and each stamps its own user id where the scaffold says it should - opened_by_user_id from AuditManager, the dismissal from TaxSupervisor - so no role needs another's permission to do its own job."
        test_recipe:
          setup:
            - "Empty database; clock at its startup default 2026-08-01T00:00:00Z."
          setup_api_calls:
            - call: "POST /mft/licensees"
              payload: { legal_name: "Roles Retail Stops LLC", fein: "41-8400001", license_type: "RETAILER", mailing_state: "MN", retail_channel: "HIGHWAY" }
              as: LicensingOfficer
              captures: { ret_id: $.data.id }
            - call: "POST /mft/terminals"
              payload: { terminal_control_number: "T-MN-8400", name: "Roles River Terminal", state_code: "MN" }
              as: LicensingOfficer
              captures: { term_id: $.data.id }
          trigger:
            - call: "POST /mft/roadside-inspections"
              payload: { inspected_licensee_id: "${ret_id}", inspection_date: "2026-07-27", dye_test_result: "POSITIVE", gallons_in_tank: 40.00, vehicle_identifier: "MN-TRK-8400" }
              as: FieldInspector
              captures: { insp_id: $.data.id }
            - call: "POST /mft/audit-cases"
              payload: { subject_licensee_id: "${ret_id}", selection_method: "ROADSIDE_REFERRAL", period_start_month: "2026-07", period_end_month: "2026-07" }
              as: AuditManager
              as_user_id: "aud-01"
              captures: { case_id: $.data.id }
            - call: "POST /mft/audit-cases/${case_id}/advance"
              payload: { to_status: "FIELDWORK" }
              as: AuditManager
              as_user_id: "aud-01"
            - call: "POST /mft/roadside-inspections/${insp_id}/dismiss"
              payload: { dismissal_reason: "Sample chain of custody was broken" }
              as: TaxSupervisor
              as_user_id: "sup-01"
          assert:
            - "the licensee and terminal creations returned HTTP 201 for LicensingOfficer"
            - "the inspection returned HTTP 201 with status == PENALTY_ASSESSED and penalty_cents == 100000 for FieldInspector"
            - "the audit case returned HTTP 201 with case_status == OPEN and opened_by_user_id == aud-01, and the advance returned HTTP 200 with case_status == FIELDWORK"
            - "the dismissal returned HTTP 200 with status == DISMISSED, and GET /mft/licensees/${ret_id} reports dyed_violation_count == 0 and balance_cents == 0"

      - name: no_role_may_invoke_another_roles_exclusive_operation
        claim_type: unauthorized_denial
        grounds:
          - validations[priority=20]
          - errors[ERR_UNAUTHORIZED]
          - roles.TaxSupervisor.exclusive_operations
          - roles.ReturnsExaminer.exclusive_operations
        distinguishing_aspect: "The denial is a 403 decided from the role alone, before any existence or state check, so a FieldInspector reaching for licence registration and an AuditManager reaching for the money verbs are both refused even against ids that do exist."
        test_recipe:
          setup:
            - "One DISTRIBUTOR and one OPEN audit case on it opened by AuditManager aud-01, so every id named below exists."
            - "Clock at its startup default 2026-08-01T00:00:00Z."
          setup_api_calls:
            - call: "POST /mft/licensees"
              payload: { legal_name: "Denial Distribution Inc", fein: "41-8500001", license_type: "DISTRIBUTOR", mailing_state: "MN" }
              as: LicensingOfficer
              captures: { dist_id: $.data.id }
            - call: "POST /mft/audit-cases"
              payload: { subject_licensee_id: "${dist_id}", selection_method: "MANUAL_REFERRAL", period_start_month: "2026-07", period_end_month: "2026-07" }
              as: AuditManager
              as_user_id: "aud-01"
              captures: { case_id: $.data.id }
          trigger:
            - call: "POST /mft/licensees"
              payload: { legal_name: "Inspector Overreach LLC", fein: "41-8500002", license_type: "RETAILER", mailing_state: "MN" }
              as: FieldInspector
              captures: { err: $.data.error_id }
          assert:
            - "HTTP 403; data.error_id == ERR_UNAUTHORIZED, and GET /mft/licensees reports total_count == 1"
            - "POST /mft/audit-cases/${case_id}/assessments as AuditManager aud-01 returns HTTP 403 ERR_UNAUTHORIZED - the case's own manager still has no money authority"
            - "POST /mft/licensees/${dist_id}/payments as ReturnsExaminer exam-01 returns HTTP 403 ERR_UNAUTHORIZED, and POST /mft/audit-cases as TaxSupervisor sup-01 returns HTTP 403 ERR_UNAUTHORIZED"
            - "GET /mft/audit-cases/${case_id} still reports case_status == OPEN with assessment_status == NONE, so no refused call left a trace"

      - name: suspend_and_cross_match_are_open_to_both_of_their_holders
        claim_type: shared_operations
        grounds:
          - roles.LicensingOfficer.shared_operations
          - roles.TaxSupervisor.shared_operations
          - roles.ReturnsExaminer.shared_operations
        distinguishing_aspect: "Two shared verbs are shared by different pairs: suspend answers to LicensingOfficer and TaxSupervisor, cross-match answers to ReturnsExaminer and TaxSupervisor, and in each case the second holder is refused only by the state rule that the first call created, never by ERR_UNAUTHORIZED."
        test_recipe:
          setup:
            - "Two ACTIVE SUPPLIERs, each behind a 1500000-cent bond; clock at 2026-09-05T00:00:00Z so that the 2026-08 period is closed."
          setup_api_calls:
            - call: "POST /mft/licensees"
              payload: { legal_name: "Shared One Fuel Supply LLC", fein: "41-8600001", license_type: "SUPPLIER", mailing_state: "MN" }
              as: LicensingOfficer
              captures: { s1_id: $.data.id, s1_v0: $.data.version }
            - call: "POST /mft/licensees/${s1_id}/bonds"
              payload: { amount_cents: 1500000, surety_name: "Granite Surety Co", effective_date: "2026-07-01", expected_licensee_version: "${s1_v0}" }
              as: LicensingOfficer
            - call: "POST /mft/licensees/${s1_id}/activate"
              payload: {}
              as: LicensingOfficer
            - call: "POST /mft/licensees"
              payload: { legal_name: "Shared Two Fuel Supply LLC", fein: "41-8600002", license_type: "SUPPLIER", mailing_state: "MN" }
              as: LicensingOfficer
              captures: { s2_id: $.data.id, s2_v0: $.data.version }
            - call: "POST /mft/licensees/${s2_id}/bonds"
              payload: { amount_cents: 1500000, surety_name: "Granite Surety Co", effective_date: "2026-07-01", expected_licensee_version: "${s2_v0}" }
              as: LicensingOfficer
            - call: "POST /mft/licensees/${s2_id}/activate"
              payload: {}
              as: LicensingOfficer
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-09-05T00:00:00Z" }
              as: TaxSupervisor
              as_user_id: "sup-01"
          trigger:
            - call: "POST /mft/licensees/${s1_id}/suspend"
              payload: { reason: "Bond surety withdrew its guarantee" }
              as: LicensingOfficer
            - call: "POST /mft/licensees/${s2_id}/suspend"
              payload: { reason: "Repeated schedule irregularities" }
              as: TaxSupervisor
              as_user_id: "sup-01"
            - call: "POST /mft/cross-match-runs"
              payload: { period_month: "2026-08" }
              as: ReturnsExaminer
              captures: { run_id: $.data.id }
          assert:
            - "both suspends returned HTTP 200 with status == SUSPENDED; neither returned ERR_UNAUTHORIZED"
            - "the cross-match run returned HTTP 201 with run_status == COMPLETED, matched_cells_count == 0 and discrepancy_count == 0 for ReturnsExaminer"
            - "a second POST /mft/cross-match-runs for 2026-08 as TaxSupervisor sup-01 returns HTTP 409 ERR_DUPLICATE_MATCH_RUN - the uniqueness rule, not a permission rule"
            - "a second suspend of ${s1_id} as TaxSupervisor sup-01 returns HTTP 409 ERR_LICENSEE_STATE_INVALID, again a state rule rather than ERR_UNAUTHORIZED"

      - name: licensee_agent_cannot_read_another_licensee_and_its_lists_are_narrowed
        claim_type: unauthorized_denial
        grounds:
          - validations[priority=25]
          - errors[ERR_LICENSEE_SCOPE_VIOLATION]
          - roles.LicenseeAgent.note
        distinguishing_aspect: "The scope rule has two shapes on purpose: addressing another licensee's resource by id is a 403, while a list read is silently narrowed to the agent's own licensee_id and returns 200 with a smaller total_count."
        test_recipe:
          setup:
            - "Two DISTRIBUTORs, each holding one DRAFT 2026-08 return; clock at 2026-09-05T00:00:00Z."
          setup_api_calls:
            - call: "POST /mft/licensees"
              payload: { legal_name: "Scope One Distribution Inc", fein: "41-8700001", license_type: "DISTRIBUTOR", mailing_state: "MN" }
              as: LicensingOfficer
              captures: { d1_id: $.data.id }
            - call: "POST /mft/licensees"
              payload: { legal_name: "Scope Two Distribution Inc", fein: "41-8700002", license_type: "DISTRIBUTOR", mailing_state: "MN" }
              as: LicensingOfficer
              captures: { d2_id: $.data.id }
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-09-05T00:00:00Z" }
              as: ReturnsExaminer
            - call: "POST /mft/returns"
              payload: { licensee_id: "${d1_id}", period_month: "2026-08" }
              as: ReturnsExaminer
              captures: { r1_id: $.data.id }
            - call: "POST /mft/returns"
              payload: { licensee_id: "${d2_id}", period_month: "2026-08" }
              as: ReturnsExaminer
              captures: { r2_id: $.data.id }
          trigger:
            - call: "GET /mft/licensees/${d2_id}"
              payload: {}
              as: LicenseeAgent
              as_user_id: "${d1_id}"
              captures: { err: $.data.error_id }
          assert:
            - "HTTP 403; data.error_id == ERR_LICENSEE_SCOPE_VIOLATION"
            - "GET /mft/returns/${r2_id} as LicenseeAgent ${d1_id} also returns HTTP 403 ERR_LICENSEE_SCOPE_VIOLATION, the scope walking through MonthlyReturn.licensee_id"
            - "GET /mft/returns as LicenseeAgent ${d1_id} returns HTTP 200 with total_count == 1 and that row's id == ${r1_id} - narrowed, not refused"
            - "the same GET /mft/returns as ReturnsExaminer exam-01 returns total_count == 2, proving the narrowing is a per-role view and not a filter on the data"
            - "POST /mft/returns naming licensee_id ${d2_id} as LicenseeAgent ${d1_id} returns HTTP 403 ERR_LICENSEE_SCOPE_VIOLATION before any duplicate-period check runs"

      - name: requests_missing_auth_headers_are_unauthenticated
        claim_type: unauthorized_denial
        grounds:
          - validations[priority=10]
          - errors[ERR_UNAUTHENTICATED]
        distinguishing_aspect: "Priority 10 sits above every other check, so a request with no X-Role (or, for LicenseeAgent, no X-User-ID) is a 401 even when its body is perfectly valid and its target exists - it never reaches the 403 role check or the 404 existence check."
        test_recipe:
          setup:
            - "One DISTRIBUTOR exists so the target of the unauthenticated read is real."
            - "The trigger call sends neither an X-Role header nor an X-User-ID header."
            - "Clock at its startup default 2026-08-01T00:00:00Z."
          setup_api_calls:
            - call: "POST /mft/licensees"
              payload: { legal_name: "Anonymous Distribution Inc", fein: "41-8800001", license_type: "DISTRIBUTOR", mailing_state: "MN" }
              as: LicensingOfficer
              captures: { dist_id: $.data.id }
          trigger:
            - call: "GET /mft/licensees/${dist_id}"
              payload: {}
              as: none
              captures: { err: $.data.error_id }
          assert:
            - "HTTP 401; data.error_id == ERR_UNAUTHENTICATED"
            - "the same read with a well-formed X-Role of LicensingOfficer returns HTTP 200"
            - "a GET of an unused licensee UUID with no headers also returns HTTP 401 and NOT ERR_LICENSEE_NOT_FOUND, so authentication outranks existence"
            - "a POST /mft/licensees carrying a valid body but no X-Role returns HTTP 401 and creates nothing: GET /mft/licensees as LicensingOfficer still reports total_count == 1"

      - name: the_case_opener_cannot_issue_its_own_assessment_and_the_assessor_cannot_abate_it
        claim_type: segregation_of_duties
        grounds:
          - validations[priority=107]
          - errors[ERR_ASSESSMENT_SEGREGATION_VIOLATION]
          - complexity_profile.role_model
        distinguishing_aspect: "Two independent user-identity bars sit on one case: the opener aud-01 may not issue the assessment even holding TaxSupervisor, and the issuer sup-01 may not abate what it issued - so three distinct users are needed to walk open, assess and abate."
        test_recipe:
          setup:
            - "One DISTRIBUTOR subject with no returns; AuditManager aud-01 opened a MANUAL_REFERRAL case over 2026-08..2026-08 and advanced it to PRELIM_FINDINGS."
            - "Clock at 2026-09-25T00:00:00Z, 4 whole days past the 2026-09-20T23:59:59Z due instant."
          setup_api_calls:
            - call: "POST /mft/licensees"
              payload: { legal_name: "Duties Audit Distribution Inc", fein: "41-8900001", license_type: "DISTRIBUTOR", mailing_state: "MN" }
              as: LicensingOfficer
              captures: { dist_id: $.data.id }
            - call: "POST /mft/audit-cases"
              payload: { subject_licensee_id: "${dist_id}", selection_method: "MANUAL_REFERRAL", period_start_month: "2026-08", period_end_month: "2026-08" }
              as: AuditManager
              as_user_id: "aud-01"
              captures: { case_id: $.data.id }
            - call: "POST /mft/audit-cases/${case_id}/advance"
              payload: { to_status: "FIELDWORK" }
              as: AuditManager
              as_user_id: "aud-01"
            - call: "POST /mft/audit-cases/${case_id}/advance"
              payload: { to_status: "PRELIM_FINDINGS" }
              as: AuditManager
              as_user_id: "aud-01"
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-09-25T00:00:00Z" }
              as: TaxSupervisor
              as_user_id: "sup-01"
          trigger:
            - call: "POST /mft/audit-cases/${case_id}/assessments"
              payload: { additional_tax_cents: 250000, evasion_indicator: false }
              as: TaxSupervisor
              as_user_id: "aud-01"
              captures: { err: $.data.error_id }
          assert:
            - "HTTP 422; data.error_id == ERR_ASSESSMENT_SEGREGATION_VIOLATION (the acting user opened the case, whatever role it now presents)"
            - "GET /mft/audit-cases/${case_id} still reports assessment_status == NONE and GET /mft/licensees/${dist_id}/ledger-entries returns total_count == 0"
            - "the identical assessment as TaxSupervisor sup-01 returns HTTP 200 with assessed_by_user_id == sup-01 and assessed_total_cents == 275250"
            - "POST /mft/audit-cases/${case_id}/abate as TaxSupervisor sup-01 then returns HTTP 422 ERR_ASSESSMENT_SEGREGATION_VIOLATION, while the same abate as sup-02 returns HTTP 200 with assessment_status == ABATED"

  - section: cross-cutting complexity layers
    instances:
      - name: a_second_bond_post_carrying_the_pre_activation_licensee_version_returns_412
        claim_type: optimistic_concurrency
        grounds:
          - concurrency_rules[bond-post-stale-licensee]
          - validations[priority=60]
          - errors[ERR_STALE_LICENSEE_VERSION]
          - endpoints[POST /mft/licensees/{id}/bonds].side_effects
        distinguishing_aspect: "Bond posting is a create-with-supersede write, so the guard protects a bond the stale client never saw: the refused post would have released the 2000000-cent rider and left the licensee holding only its own 1500000, and the guard fires on a version bumped by an unrelated write (the activate) rather than by another bond."
        test_recipe:
          setup:
            - "One SUPPLIER licensee, whose required_bond_cents is the 1500000 type minimum because it has no filed returns to average."
            - "Clock at its startup default 2026-08-01T00:00:00Z."
          setup_api_calls:
            - call: "POST /mft/licensees"
              payload: { legal_name: "Version Guard Fuel Supply LLC", fein: "41-9000001", license_type: "SUPPLIER", mailing_state: "MN" }
              as: LicensingOfficer
              captures: { sup_id: $.data.id, v0: $.data.version }
            - call: "POST /mft/licensees/${sup_id}/bonds"
              payload: { amount_cents: 1500000, surety_name: "Granite Surety Co", effective_date: "2026-07-01", expected_licensee_version: "${v0}" }
              as: LicensingOfficer
              captures: { bond_a: $.data.id }
            - call: "POST /mft/licensees/${sup_id}/activate"
              payload: {}
              as: LicensingOfficer
              captures: { v2: $.data.version }
            - call: "POST /mft/licensees/${sup_id}/bonds"
              payload: { amount_cents: 2000000, surety_name: "Basalt Indemnity Co", effective_date: "2026-07-15", expected_licensee_version: "${v2}" }
              as: LicensingOfficer
              captures: { bond_b: $.data.id }
          trigger:
            - call: "POST /mft/licensees/${sup_id}/bonds"
              payload: { amount_cents: 900000, surety_name: "Stale View Surety Co", effective_date: "2026-07-20", expected_licensee_version: "${v0}" }
              as: LicensingOfficer
              captures: { err: $.data.error_id }
          assert:
            - "HTTP 412; data.error_id == ERR_STALE_LICENSEE_VERSION"
            - "GET /mft/licensees/${sup_id}/bonds returns total_count == 2 - the refused post created no BondInstrument at all"
            - "GET /mft/bonds is not needed: GET /mft/licensees/${sup_id}/bonds shows ${bond_a} with status RELEASED and release_reason SUPERSEDED_BY_NEW_BOND (from the accepted second post) and ${bond_b} still ACTIVE"
            - "GET /mft/licensees/${sup_id} reports posted_bond_cents == 2000000, bond_deficiency_cents == 0 and status ACTIVE - the 900000 stale rider never touched the derived fields"
            - "the licensee's version advanced on every accepted write (create, bond A, activate, bond B) and did NOT advance on the refused one, so re-posting the 900000 bond with that current version returns HTTP 201 and only then does ${bond_b} become RELEASED / SUPERSEDED_BY_NEW_BOND, leaving posted_bond_cents == 900000 and bond_deficiency_cents == 600000"

      - name: a_second_amendment_carrying_the_pre_amendment_return_version_returns_412
        claim_type: optimistic_concurrency
        grounds:
          - concurrency_rules[amendment-create-stale-return]
          - validations[priority=61]
          - validations[priority=204]
          - errors[ERR_STALE_RETURN_VERSION]
          - endpoints[POST /mft/returns/{id}/amendments].side_effects
        distinguishing_aspect: "The version guard at priority 61 runs ahead of the chain rule at 204, so a client holding a pre-amendment view of the return is told its view is stale (412) rather than that its target is wrong (422) - and once the client refreshes, the 422 it then receives proves the 412 was really about the version."
        test_recipe:
          setup:
            - "One SUPPLIER counterparty and one DISTRIBUTOR filer; clock at 2026-09-05T00:00:00Z."
            - "The filer's 2026-08 return is FILED with one SCH_2_RECEIVED_TAX_UNPAID UNDYED_DIESEL schedule declaring 1000.00 gallons against a single 1000.00 line, and one DRAFT amendment of it already exists."
          setup_api_calls:
            - call: "POST /mft/licensees"
              payload: { legal_name: "Amend Guard Fuel Supply LLC", fein: "41-9100001", license_type: "SUPPLIER", mailing_state: "MN" }
              as: LicensingOfficer
              captures: { sup_id: $.data.id }
            - call: "POST /mft/licensees"
              payload: { legal_name: "Amend Guard Distribution Inc", fein: "41-9100002", license_type: "DISTRIBUTOR", mailing_state: "MN" }
              as: LicensingOfficer
              captures: { dist_id: $.data.id }
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-09-05T00:00:00Z" }
              as: ReturnsExaminer
            - call: "POST /mft/returns"
              payload: { licensee_id: "${dist_id}", period_month: "2026-08" }
              as: ReturnsExaminer
              captures: { ret_id: $.data.id }
            - call: "POST /mft/returns/${ret_id}/schedules"
              payload: { schedule_code: "SCH_2_RECEIVED_TAX_UNPAID", product_code: "UNDYED_DIESEL", total_gallons: 1000.00 }
              as: ReturnsExaminer
              captures: { sch_id: $.data.id }
            - call: "POST /mft/schedules/${sch_id}/lines"
              payload: { counterparty_licensee_id: "${sup_id}", transaction_type: "PURCHASE", gallons: 1000.00, document_date: "2026-08-08", bill_of_lading_number: "BOL-AG-9100" }
              as: ReturnsExaminer
            - call: "POST /mft/returns/${ret_id}/file"
              payload: { attest_name: "A. Guard" }
              as: ReturnsExaminer
              captures: { filed_v: $.data.version }
            - call: "POST /mft/returns/${ret_id}/amendments"
              payload: { expected_return_version: "${filed_v}", reason: "Two August loads were reported under the wrong product" }
              as: ReturnsExaminer
              captures: { amd_id: $.data.id }
          trigger:
            - call: "POST /mft/returns/${ret_id}/amendments"
              payload: { expected_return_version: "${filed_v}", reason: "A third look at the same August loads" }
              as: ReturnsExaminer
              captures: { err: $.data.error_id }
          assert:
            - "HTTP 412; data.error_id == ERR_STALE_RETURN_VERSION"
            - "GET /mft/returns/${ret_id} reports filing_status == FILED, tax_due_cents == 30900, amendment_count == 1 and a version one higher than ${filed_v}, so the refused call bumped nothing"
            - "GET /mft/returns with payload { licensee_id: ${dist_id} } returns total_count == 2 (the original and ${amd_id}), proving no third row was created"
            - "repeating the same call with the return's CURRENT version returns HTTP 422 ERR_AMENDMENT_TARGET_INVALID (priority 204: ${amd_id} is now the newest row of the chain), which is exactly the error the 412 was standing in front of"
            - "the accepted setup amendment shows the happy path of the same guard: with the correct ${filed_v} it returned HTTP 201 with amends_return_id == ${ret_id}, amendment_sequence == 1 and filing_status DRAFT"

      - name: an_audit_case_stores_the_default_variance_weighting_when_the_flag_is_omitted
        claim_type: conditional_feature_flags
        grounds:
          - entities.AuditCase.fields.risk_score_variant
          - validations[priority=408]
          - errors[ERR_RISK_SCORE_BELOW_THRESHOLD]
          - endpoints[GET /mft/licensees/{id}/risk-profile]
        distinguishing_aspect: "The flag has two independent effects and this instance pins the pair that §1.8 does not: absent, it materialises as VARIANCE_WEIGHTED on the stored row, and it is only consulted at all when selection_method == RISK_SCORE - a MANUAL_REFERRAL case on a zero-score subject is opened without the gate ever running."
        test_recipe:
          setup:
            - "Two freshly created DISTRIBUTORs with no returns, no discrepancies and no dyed violations, so every risk input is zero under both weightings."
            - "Clock at its startup default 2026-08-01T00:00:00Z."
          setup_api_calls:
            - call: "POST /mft/licensees"
              payload: { legal_name: "Flag Default Distribution Inc", fein: "41-9200001", license_type: "DISTRIBUTOR", mailing_state: "MN" }
              as: LicensingOfficer
              captures: { d1_id: $.data.id }
            - call: "POST /mft/licensees"
              payload: { legal_name: "Flag Gate Distribution Inc", fein: "41-9200002", license_type: "DISTRIBUTOR", mailing_state: "MN" }
              as: LicensingOfficer
              captures: { d2_id: $.data.id }
          trigger:
            - call: "POST /mft/audit-cases"
              payload: { subject_licensee_id: "${d1_id}", selection_method: "MANUAL_REFERRAL", period_start_month: "2026-06", period_end_month: "2026-07" }
              as: AuditManager
              as_user_id: "aud-01"
              captures: { case_id: $.data.id }
          assert:
            - "HTTP 201; risk_score_variant == VARIANCE_WEIGHTED even though the request omitted it, and case_status == OPEN despite a zero risk score - the gate is conditional on selection_method"
            - "the identical body with selection_method RISK_SCORE against ${d2_id} and the flag still omitted returns HTTP 422 ERR_RISK_SCORE_BELOW_THRESHOLD, because the defaulted VARIANCE_WEIGHTED score 0 is under AUDIT_SELECTION_THRESHOLD 60"
            - "the same RISK_SCORE body with risk_score_variant explicitly FREQUENCY_WEIGHTED against ${d2_id} also returns HTTP 422 ERR_RISK_SCORE_BELOW_THRESHOLD, so the refusal is the score and not the flag's spelling"
            - "GET /mft/licensees/${d2_id}/risk-profile returns HTTP 200 with risk_score_variance_weighted == 0, risk_score_frequency_weighted == 0 and the threshold constant 60 reported alongside them"
            - "an explicit risk_score_variant of FREQUENCY_WEIGHTED on a MANUAL_REFERRAL case is stored verbatim, so the omitted case's VARIANCE_WEIGHTED really is a default and not a hard-coded value"

      - name: cascading_side_effects_layer_end_to_end_chain
        claim_type: cascading_side_effects
        grounds:
          - complexity_profile.complexity_layers[cascading_side_effects]
        excluded_because:
          difficulty_instance: "transitive_cascade / second_dyed_positive_cascades_penalty_to_suspension_to_bond_to_refund_hold"
          rationale: "That instance already walks a four-level chain end to end (inspection penalty -> ledger and dyed_violation_count -> automatic suspension -> bond requirement re-derivation -> refund claim held) and asserts the ordering sensitivity, and its sibling transitive_cascade instance covers the discrepancy -> audit case -> open_discrepancy_count -> refund hold chain. A separate layer-level cascade instance would restate them."

      - name: dual_variant_calculation_layer_both_variants_and_delta
        claim_type: dual_variant_calculation
        grounds:
          - complexity_profile.complexity_layers[dual_variant_calculation]
        excluded_because:
          difficulty_instance: "dual_variant_calc / rack_basis_net_vs_gross_diverges_on_deferred_tax"
          rationale: "Both declared variant families are already covered by the two dual_variant_calc instances - the NET vs GROSS rack basis with its computed delta, and the VARIANCE_WEIGHTED vs FREQUENCY_WEIGHTED risk score - so the layer's 'both variants produce expected results, delta on switch is correct' claim is discharged there."

      - name: rate_threshold_triggers_layer_boundary_and_reset
        claim_type: rate_threshold_triggers
        grounds:
          - complexity_profile.complexity_layers[rate_threshold_triggers]
        excluded_because:
          difficulty_instance: "combinatorial_formula / late_filing_interest_then_penalty_tier_then_floor"
          rationale: "The threshold boundaries of this scaffold are already pinned instance by instance: the penalty tier boundaries and the PENALTY_FLOOR_CENTS clamp there, the exact 5.00-gallon cross-match tolerance in cross_match_tolerance_exact_five_gallons_creates_nothing, the inclusive 2000-cent refund minimum in refund_minimum_payable_amount_inclusive_at_two_thousand_cents, and the 60-point audit gate in risk_score_variance_vs_frequency_weighted_flips_audit_selectability."

  - section: consistency model
    instances:
      - name: every_cascade_of_a_write_is_already_visible_in_that_writes_own_response
        claim_type: immediate
        grounds:
          - complexity_profile.consistency_model
          - endpoints[POST /mft/returns/{id}/file].side_effects
          - calculations.licensee_bond_requirement
        distinguishing_aspect: "The filing response is the strictest case of the immediate model in this scaffold: one call computes tax, then interest, then penalty, posts up to three ledger rows and re-derives four licensee fields, and every one of those values must be readable from that same response body - a follow-up GET may confirm them but must not be required to see them."
        test_recipe:
          setup:
            - "One SUPPLIER counterparty and one ACTIVE DISTRIBUTOR filer bonded at 1500000 cents."
            - "The filer's DRAFT 2026-08 return carries one SCH_2_RECEIVED_TAX_UNPAID UNDYED_DIESEL schedule declaring 1000.00 gallons against a single 1000.00 line."
            - "Clock at 2026-09-24T00:00:00Z, which is 3 days and 1 second past the 2026-09-20T23:59:59Z due instant, so days_late ceils to 4 and the filing is late."
          setup_api_calls:
            - call: "POST /mft/licensees"
              payload: { legal_name: "Immediate Fuel Supply LLC", fein: "41-9300001", license_type: "SUPPLIER", mailing_state: "MN" }
              as: LicensingOfficer
              captures: { sup_id: $.data.id }
            - call: "POST /mft/licensees"
              payload: { legal_name: "Immediate Distribution Inc", fein: "41-9300002", license_type: "DISTRIBUTOR", mailing_state: "MN" }
              as: LicensingOfficer
              captures: { dist_id: $.data.id, d_v0: $.data.version }
            - call: "POST /mft/licensees/${dist_id}/bonds"
              payload: { amount_cents: 1500000, surety_name: "Granite Surety Co", effective_date: "2026-07-01", expected_licensee_version: "${d_v0}" }
              as: LicensingOfficer
            - call: "POST /mft/licensees/${dist_id}/activate"
              payload: {}
              as: LicensingOfficer
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-09-24T00:00:00Z" }
              as: ReturnsExaminer
            - call: "POST /mft/returns"
              payload: { licensee_id: "${dist_id}", period_month: "2026-08" }
              as: ReturnsExaminer
              captures: { ret_id: $.data.id }
            - call: "POST /mft/returns/${ret_id}/schedules"
              payload: { schedule_code: "SCH_2_RECEIVED_TAX_UNPAID", product_code: "UNDYED_DIESEL", total_gallons: 1000.00 }
              as: ReturnsExaminer
              captures: { sch_id: $.data.id }
            - call: "POST /mft/schedules/${sch_id}/lines"
              payload: { counterparty_licensee_id: "${sup_id}", transaction_type: "PURCHASE", gallons: 1000.00, document_date: "2026-08-11", bill_of_lading_number: "BOL-IM-9300" }
              as: ReturnsExaminer
          trigger:
            - call: "POST /mft/returns/${ret_id}/file"
              payload: { attest_name: "I. Immediate" }
              as: ReturnsExaminer
              captures: { filed_v: $.data.version }
          assert:
            - "HTTP 200, and the file response body itself already carries filing_status == FILED, filed_at == 2026-09-24T00:00:00Z, taxable_gallons_total == 1000.00, tax_due_cents == 30900, days_late == 4, interest_cents == 31 (round_half_up(30900 x 0.00025 x 4) == round_half_up(30.9)), penalty_cents == 5000 (the LATE_FILING_MIN_PENALTY_CENTS floor beats 5 percent of the 30931 subtotal) and total_remittance_cents == 35931"
            - "GET /mft/licensees/${dist_id}/ledger-entries immediately reports total_count == 3 with a RETURN_TAX row of +30900, an INTEREST row of +31 and a PENALTY row of +5000, all stamped at the same filed_at"
            - "GET /mft/licensees/${dist_id} immediately reports balance_cents == 35931, late_filing_count == 1 and effective_taxable_gallons_ytd == 1000.00 - no second read or delay is needed for the derived fields to settle"
            - "the same GET repeated a second time returns byte-identical derived values, so nothing is being lazily recomputed on read"
