      - name: cost_projection_run_rate_diverges_from_contracted_encumbrance
        claim_type: forward_looking
        grounds:
          - "calculations.placement_cost_projection"
          - "endpoints.GET_placements_id_cost_projection"
          - "entities.TuitionInvoice.fields.payment_status"
        distinguishing_aspect: |
          placement_cost_projection is forward-looking: CONTRACTED_ENCUMBRANCE reports the
          committed total (5760000 contract + 792000 addendum = 6552000) while ACTUAL_RUN_RATE
          annualises the PAID invoices only, at BILLING_PERIODS_PER_YEAR 13. After exactly one
          654400-cent settlement the run rate is round_half_up(654400 / 1 * 13) = 8507200, so the
          two variants disagree by 1955200 cents and their variance_cents figures have opposite
          sign relative to the 5760000 contract. remaining_commitment_cents is the same under both
          because it reads the placement's own encumbrance_cents, which the payment moved from
          6552000 to max(0, 5760000 - 654400) + 792000 = 5897600.
