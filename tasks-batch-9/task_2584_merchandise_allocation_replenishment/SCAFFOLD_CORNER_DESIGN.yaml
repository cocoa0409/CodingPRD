            - "With the program LOCKED the same stale call returns 409 ERR_PROGRAM_LOCKED: rung 9 is evaluated before rung 11, so a locked program hides a stale token"
            - "After unlocking and re-reading the receipt, the same call with ${rcpt_v2} returns 201 with status DRAFT, and the receipt moves STAGED -> ALLOCATING"
            - "Immediately repeating that create with the SAME ${rcpt_v2} returns 412 ERR_STALE_RECEIPT_VERSION - the successful creation incremented Receipt.version to 3 and invalidated the token that authorised it"
            - "A third re-read gives ${rcpt_v3} = 3; a create carrying it but method MIN_MAX_TOPUP returns 422 ERR_METHOD_MODEL_MISMATCH (SKU-1001 is SEASONAL -> DEMAND_DRIVEN), proving rung 11 passed before the rung 20 check ran"
            - "The same ${rcpt_v3} then succeeds with DEMAND_DRIVEN / HISTORICAL_SELL_THROUGH, and the FIRST run is now CANCELLED with the new run's supersedes_run_id pointing at it - exactly the silent-discard hazard the OCC rule exists to make deterministic"
            - "PATCH min_units on position 0102 returns 200 and its version becomes 2, invalidating ${p2_v1}"
            - "Creating a transfer 0102 -> 0101 with expected_from_position_version = ${p2_v1} returns 412 ERR_STALE_POSITION_VERSION - a different error id from the receipt rule at the same rung 11 and the same 412 status"
            - "A transfer whose from_store_id and to_store_id are BOTH 0102 and whose token is the stale ${p2_v1} also returns 412 ERR_STALE_POSITION_VERSION, not 422 ERR_SAME_STORE_TRANSFER: rung 11 precedes rung 21"
            - "Re-reading the position gives ${p2_v2}; the same self-transfer with the FRESH token now returns 422 ERR_SAME_STORE_TRANSFER, which is the only way to show the two rungs were ordered rather than merged"
            - "The transfer 0102 -> 0101 with ${p2_v2} returns 201 PROPOSED with size_split S 4 / XL 2, landed_cost_usd 50.40 and benefit_ratio_bp 15536"
            - "The final receipt read shows version 3 and status ALLOCATING with units_committed 0: five rejected writes across both OCC rules left the ledger untouched"
      - name: the_deepest_cascade_runs_four_levels_and_is_verified_end_to_end
        claim_type: cascading_side_effects
        grounds:
          - state_machines.TransferRecommendation.DISPATCHED->RECEIVED
          - state_machines.AllocationRun.PROPOSED->COMMITTED
          - calculations.assortment_health_derivation
        excluded_because:
          difficulty_instance: transfer_receive_cascades_position_then_item_then_assortment_action
          rationale: "That instance walks the whole recommendation -> position -> item lifecycle -> assortment action chain in one call and asserts every level, including the SUPERSEDED action; run_commit_cascades_lines_then_receipt_ledger_then_program_reserve and store_closed_cascades_position_exit_then_item_lifecycle cover the other two multi-level chains and their ordering sensitivity."
      - name: the_two_variant_pairs_diverge_on_the_same_data
        claim_type: dual_variant_calculation
        grounds:
          - calculations.store_need_units.variants
          - calculations.cluster_scorecard.variants
        excluded_because:
          difficulty_instance: store_need_forward_looking_vs_historical_sell_through
          rationale: "Both variant pairs are already driven from a single shared fixture there and in cluster_scorecard_simple_average_vs_unit_weighted: the same positions are read under both need bases and both scorecard bases, and the per-variant deltas (rounding placement, on-order visibility, promo lift, floor placement) are asserted number by number."
  # immediate consistency: the write response is the truth
  - section: consistency_model
    instances:
      - name: every_write_response_already_carries_its_own_cascade_with_no_re_read_needed
        claim_type: immediate
        grounds:
          - complexity_profile.consistency_model
          - response_envelope
          - calculations.assortment_health_derivation
          - calculations.receipt_unit_ledger_invariant
        distinguishing_aspect: |
          consistency_model is immediate, which is a claim about the response body of the write itself, not
          just about a later GET. Every derived field on this surface - stock_status, assortment_status,
          available_units, the receipt ledger, the program reserve, the item lifecycle - must already carry
          its new value in the body of the call that caused the change, and the following GET must be
          byte-identical to that body rather than a correction of it. There is no accepted-for-processing
          state anywhere in §1.2 and no field is allowed to converge later, so the test brackets four
          different writes - a PATCH that re-derives one dimension, a propose that computes need and splits
          sizes, a commit that moves three entities' ledgers, and a confirm-receipt that runs the deepest
          cascade - and after each one compares the write's own response to an immediate re-read.
        test_recipe:
          setup:
            - "Program FA26 ACTIVE with store 0101 (capacity 48, presentation minimum 6) and store 0102 (capacity 24, minimum 2)"
            - "SKU-1001 SEASONAL on TOP-4SZ, all four sizes core; position 0101 holds 6 units (M 4 / L 2) with min 12 / max 48 / forecast 9 -> LOW and BROKEN; position 0102 holds 30 units of every size -> COMPLETE"
            - "Receipt ASN-R501 carries 30 units and a DEMAND_DRIVEN / FORWARD_LOOKING run is DRAFT"
            - "Need at 0101 is 9 x 4 - 6 = 30 and need at 0102 is 5 x 4 - 30 = 0, so the spread is exact-fill with a single line"
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-08-01T00:00:00Z" }
              as: PlanningAdmin
              as_user_id: "u-plan-1"
            - call: "POST /allocation/programs"
              payload: { name: "FA26 Core Tops", season_code: "FA26", banner_code: "NORTH" }
              as: PlanningAdmin
              as_user_id: "u-plan-1"
              captures: { prog_id: $.data.id }
            - call: "POST /allocation/stores"
              payload: { program_id: "${prog_id}", store_code: "0101", grade: "A", grade_index_bp: 13000, cluster_code: "URBAN", freight_flat_usd: 41.00, historical_sell_through_bp: 6500 }
              as: PlanningAdmin
              as_user_id: "u-plan-1"
              captures: { s1_id: $.data.id }
            - call: "POST /allocation/stores"
              payload: { program_id: "${prog_id}", store_code: "0102", grade: "B", grade_index_bp: 10000, cluster_code: "URBAN", freight_flat_usd: 38.00, historical_sell_through_bp: 5800 }
              as: PlanningAdmin
              as_user_id: "u-plan-1"
              captures: { s2_id: $.data.id }
            - call: "POST /allocation/fixture-plans"
              payload: { store_id: "${s1_id}", item_class: "APPAREL_TOP", effective_from: "2026-07-01T00:00:00Z", fixture_count: 4, facings_per_fixture: 3, units_per_facing: 4, presentation_min_units: 6 }
              as: PlanningAdmin
              as_user_id: "u-plan-1"
            - call: "POST /allocation/fixture-plans"
              payload: { store_id: "${s2_id}", item_class: "APPAREL_TOP", effective_from: "2026-07-01T00:00:00Z", fixture_count: 2, facings_per_fixture: 3, units_per_facing: 4, presentation_min_units: 2 }
              as: PlanningAdmin
              as_user_id: "u-plan-1"
            - call: "POST /allocation/size-profiles"
              payload: { program_id: "${prog_id}", profile_code: "TOP-4SZ", item_class: "APPAREL_TOP", size_curve: [{ size_code: "S", share_bp: 2000 }, { size_code: "M", share_bp: 3500 }, { size_code: "L", share_bp: 3000 }, { size_code: "XL", share_bp: 1500 }] }
              as: PlanningAdmin
              as_user_id: "u-plan-1"
              captures: { sp_id: $.data.id }
            - call: "POST /allocation/items"
              payload: { program_id: "${prog_id}", sku_code: "SKU-1001", style_code: "ST-100", item_class: "APPAREL_TOP", item_type: "SEASONAL", size_profile_id: "${sp_id}", unit_cost_usd: 14.20, retail_price_usd: 36.50 }
              as: PlanningAdmin
              as_user_id: "u-plan-1"
              captures: { item_id: $.data.id }
            - call: "POST /allocation/programs/${prog_id}/activate"
              payload: {}
              as: PlanningAdmin
              as_user_id: "u-plan-1"
            - call: "POST /allocation/store-positions"
              payload: { store_id: "${s1_id}", item_id: "${item_id}", on_hand_units: 6, size_on_hand: [{ size_code: "M", units: 4 }, { size_code: "L", units: 2 }], min_units: 12, max_units: 48, weekly_forecast_units: 9, trailing_4wk_sales_units: 30 }
              as: Allocator
              as_user_id: "u-alloc-1"
              captures: { p1_id: $.data.id }
            - call: "POST /allocation/store-positions"
              payload: { store_id: "${s2_id}", item_id: "${item_id}", on_hand_units: 30, size_on_hand: [{ size_code: "S", units: 8 }, { size_code: "M", units: 10 }, { size_code: "L", units: 8 }, { size_code: "XL", units: 4 }], min_units: 8, max_units: 24, weekly_forecast_units: 5, trailing_4wk_sales_units: 16 }
              as: Allocator
              as_user_id: "u-alloc-1"
              captures: { p2_id: $.data.id }
            - call: "POST /allocation/receipts"
              payload: { program_id: "${prog_id}", item_id: "${item_id}", reference: "ASN-R501", units_received: 30, size_received: [{ size_code: "S", units: 6 }, { size_code: "M", units: 11 }, { size_code: "L", units: 9 }, { size_code: "XL", units: 4 }], receipt_date: "2026-08-01T00:00:00Z" }
              as: Allocator
              as_user_id: "u-alloc-1"
              captures: { rcpt_id: $.data.id, rcpt_v1: $.data.version }
            - call: "POST /allocation/receipts/${rcpt_id}/allocation-runs"
              payload: { method: "DEMAND_DRIVEN", need_basis: "FORWARD_LOOKING", expected_receipt_version: "${rcpt_v1}" }
              as: Allocator
              as_user_id: "u-alloc-1"
              captures: { run_id: $.data.id }
          trigger:
            - call: "PATCH /allocation/store-positions/${p1_id}"
              payload: { min_units: 5 }
              as: Allocator
              as_user_id: "u-alloc-1"
            - call: "GET /allocation/store-positions/${p1_id}"
              payload: {}
              as: Allocator
            - call: "POST /allocation/allocation-runs/${run_id}/propose"
              payload: {}
              as: Allocator
              as_user_id: "u-alloc-1"
            - call: "GET /allocation/allocation-lines"
              payload: { run_id: "${run_id}", store_id: "${s1_id}" }
              as: Allocator
              captures: { l1_id: "$.data[0].id" }
            - call: "GET /allocation/allocation-lines/${l1_id}"
              payload: {}
              as: Allocator
            - call: "POST /allocation/allocation-runs/${run_id}/commit"
              payload: {}
              as: AllocationManager
              as_user_id: "u-mgr-1"
            - call: "GET /allocation/receipts/${rcpt_id}"
              payload: {}
              as: Allocator
            - call: "GET /allocation/programs/${prog_id}"
              payload: {}
              as: PlanningAdmin
            - call: "POST /allocation/allocation-lines/${l1_id}/ship"
              payload: {}
              as: AllocationManager
              as_user_id: "u-mgr-1"
            - call: "GET /allocation/store-positions/${p1_id}"
              payload: {}
              as: Allocator
            - call: "POST /allocation/allocation-lines/${l1_id}/confirm-receipt"
              payload: {}
              as: StoreOperator
              as_user_id: "${s1_id}"
            - call: "GET /allocation/store-positions/${p1_id}"
              payload: {}
              as: Allocator
            - call: "GET /allocation/items/${item_id}"
              payload: {}
              as: PlanningAdmin
            - call: "GET /allocation/store-positions/${p1_id}"
              payload: {}
              as: StoreOperator
              as_user_id: "${s1_id}"
            - call: "GET /allocation/store-positions"
              payload: { item_id: "${item_id}" }
              as: Allocator
          assert:
            - "The PATCH response body ITSELF reports stock_status IN_STOCK and version 2 - the client never has to re-read to learn that lowering min_units from 12 to 5 re-banded the position"
            - "The immediate GET of the same position returns a body identical to the PATCH response: same version, same stock_status, same available_units 6, same assortment_status BROKEN"
            - "The propose response already carries units_proposed 30, eligible_store_count 1 and unallocated_remainder_units 0, and the line it created already carries size_breakdown S 6 / M 11 / L 9 / XL 4 and presentation_gap_units 0"
            - "The commit response already reports status COMMITTED, and the very next reads show receipt units_committed 30 / units_unallocated 0 / status ALLOCATED and program total_units_committed 30 / open_reserve_units 0 - three entities settled inside one request"
            - "The ship response reports fulfillment_status SHIPPED, and the immediate position read already shows in_transit_units 30 while available_units is still 6: the derivation is instant but it is not the derivation a naive implementation would write"
            - "The confirm-receipt response is the deepest case: by the time it returns, position 0101 is on_hand 36 with size_on_hand S 6 / M 15 / L 11 / XL 4, in_transit 0, stock_status IN_STOCK and assortment_status COMPLETE"
            - "The item read taken immediately after that same call already reports broken_size_count 0 across the network and lifecycle_state re-derived from BROKEN to ACTIVE - a cascade three entities deep with no lag"
            - "Re-reading the position a third time, as a different role, returns identical values: nothing converges, drifts or settles between reads"
            - "No response body anywhere in the sequence carries a PENDING, PROCESSING or ACCEPTED status, and no assertion in this recipe needs a retry or a delay to hold"
            - "The list read GET /allocation/store-positions?item_id=${item_id} agrees with both single reads on every computed field, so the collection projection is derived from the same state and not from a lagging copy"
