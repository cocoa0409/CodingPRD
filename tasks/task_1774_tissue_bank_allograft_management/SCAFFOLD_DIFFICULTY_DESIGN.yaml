  - rule_id: transitive_cascade
    instances:
      - name: excursion_reading_cascade_releases_reservation_and_recomputes_par
        grounds:
          - state_machines.Freezer.OPERATIONAL_to_EXCURSION_ACTIVE
          - state_machines.TissueUnit.RESERVED_to_QUARANTINED
          - state_machines.Reservation.ACTIVE_to_RELEASED
          - calculations.par_level_deficit
        distinguishing_aspect: |
          Depth-4 chain from a single POST /readings: reading -> TemperatureExcursion
          opened + Freezer EXCURSION_ACTIVE (link 1) -> RESERVED and AVAILABLE units
          QUARANTINED with hold_reason EXCURSION (link 2) -> the ACTIVE reservation on
          the reserved unit RELEASED with release_reason EXCURSION (link 3) ->
          ParLevelPolicy.on_hand_available drops 2 -> 0 so deficit = 2 and
          needs_reorder flips true (link 4). Each link is caused by the previous one.
        test_recipe:
          setup:
            - "Supplier qualified; freezer [-80.0, -60.0] capacity 50; ParLevelPolicy BONE par_quantity = 2"
            - "2 BONE units U-001/U-002 (lot L1) ACCEPTED and released AVAILABLE"
            - "Case C1 (2026-08-10) with ACTIVE reservation R1 on U-001 (U-001 RESERVED)"
            - "Before trigger: on_hand_available == 1 (the RESERVED unit is already outside the AVAILABLE inclusion set), deficit == 1, needs_reorder == true — the cascade must drive availability to 0 and deficit to 2"
          setup_api_calls:
            - { call: "POST /tissue-bank/suppliers", payload: { legal_name: "Acme Tissue Source", license_number: "LIC-001" }, as: QualityManager, as_user_id: "qm-1", captures: { sup: $.data.id } }
