            - "L2 — MammographyUnit.${unit_id}.accreditation_status == PROBATION"
            - "L2 — MammographyUnit.${unit_id}.operational_state == OUT_OF_SERVICE"
            - "L3 — Facility.${fac_id}.compliance_posture == SUSPENDED"
            - "L4 — SupplementalScreeningOrder.${casc_order_id}.status == REFERRED_OUT and external_referral_note != null"
            - "L5 — Exam.${casc_exam_id}.follow_up_status == PENDING_EXTERNAL"
            - "MammographyUnit.${unit_id}.last_passed_survey_end == null (a failing decision records no passing window)"

      - name: amendment_cascades_three_levels_and_reopens_a_completed_obligation
        grounds:
          - state_machines.Exam.report_status.INTERPRETED_FINAL_to_AMENDED
          - state_machines.NotificationLetter.status.DELIVERED_ASSUMED_to_SUPERSEDED
          - state_machines.Exam.notification_status.COMPLETE_to_PENDING
          - entities.Facility.fields.open_notice_obligations
          - calculations.report_turnaround_and_followup_clock
        distinguishing_aspect: |
          DEPTH 3 cascade triggered by POST /exams/{id}/amend — a different
