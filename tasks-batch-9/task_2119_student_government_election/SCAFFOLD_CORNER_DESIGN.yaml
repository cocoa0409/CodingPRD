              captures: { e_v_final: $.data.version }
          assert:
            - "${e_v_create} == 1"
            - "${e_v_after_office} == 1"
            - "${e_v_after_open} == 2"
            - "${e_v_final} == 3"
            - "Election.${e_id}.status == BALLOT_BUILDING"

      - name: dual_variant_calculation_layer
        claim_type: dual_variant_calculation
        grounds:
          - calculations.campaign_spend_assessment
          - calculations.office_result_share
        excluded_because:
          difficulty_instance: dual_variant_calc / slate_spend_provisional_versus_final_on_candidacy
          rationale: "Both variant pairs and their divergent literals are asserted by the two §1.8 dual_variant_calc instances."

      - name: cascading_side_effects_layer
        claim_type: cascading_side_effects
        grounds:
          - state_machines.ComplianceCase.FILED_to_UPHELD
          - state_machines.Candidacy.PENDING_to_LAPSED
        excluded_because:
          difficulty_instance: transitive_cascade / uphold_to_disqualify_to_line_void_to_recount_flag
          rationale: "The four-hop and three-hop chains are asserted end to end by the two §1.8 transitive_cascade instances."

      - name: rate_threshold_triggers_layer
        claim_type: rate_threshold_triggers
        grounds:
          - calculations.compliance_penalty_points
          - calculations.office_result_share
        excluded_because:
          difficulty_instance: boundary_precision_check / penalty_total_exactly_sixty_disqualifies
          rationale: "The exact-threshold crossing at 60 points and the 59-point non-crossing are asserted by the §1.8 boundary and combinatorial instances."

  - section: consistency_model
    instances:

      - name: cascade_effects_are_visible_in_the_same_request
        claim_type: immediate
        grounds:
          - complexity_profile.consistency_model
          - calculations.petition_signature_valid_count
          - state_machines.PetitionSignature.SUBMITTED_to_VERIFIED
        distinguishing_aspect: "The adjudicate response already reports the new signature status, and a read issued immediately afterwards shows petition_signature_valid_count 1 with no intermediate state — nothing is reconciled lazily."
        test_recipe:
          setup:
            - "One election in PETITIONING with one office requiring 1 valid signature, one UNDER_REVIEW candidacy and one SUBMITTED signature."
          setup_api_calls:
            - call: "POST /elections"
              payload: { title: "Fall 2026 SGA General", academic_year: "2026-2027", petition_deadline: "2026-09-01T00:00:00Z", spending_cap_cents: 50000, poster_cap: 50, quorum_pct: 25.00, runoff_threshold_pct: 50.00 }
              as: ElectionCommissioner
              as_user_id: "commissioner-1"
              captures: { e_id: $.data.id }
            - call: "POST /offices"
              payload: { election_id: "${e_id}", name: "President", eligible_class_years: ["JUNIOR", "SENIOR"], required_signature_count: 1, term_start_date: "2026-10-01T00:00:00Z", term_end_date: "2027-05-31T00:00:00Z" }
              as: ElectionCommissioner
              as_user_id: "commissioner-1"
              captures: { o_id: $.data.id }
            - call: "POST /students"
              payload: { full_name: "Ava Stone", student_number: "S-9901", class_year: "SENIOR", gpa: 3.50, credits_completed: 95 }
              as: Registrar
              as_user_id: "registrar-1"
              captures: { s_a_id: $.data.id }
            - call: "POST /students"
              payload: { full_name: "Signer One", student_number: "S-9902", class_year: "JUNIOR", gpa: 3.00, credits_completed: 60 }
              as: Registrar
              as_user_id: "registrar-1"
              captures: { s_g_id: $.data.id }
            - call: "POST /elections/${e_id}/open-petitioning"
              payload: {}
              as: ElectionCommissioner
              as_user_id: "commissioner-1"
            - call: "POST /candidacies"
              payload: { election_id: "${e_id}", office_id: "${o_id}", student_id: "${s_a_id}" }
              as: Candidate
              as_user_id: "${s_a_id}"
              captures: { c_a_id: $.data.id }
            - call: "POST /candidacies/${c_a_id}/submit-petition"
              payload: {}
              as: Candidate
              as_user_id: "${s_a_id}"
            - call: "POST /petition-signatures"
              payload: { candidacy_id: "${c_a_id}", signer_student_id: "${s_g_id}", signed_at: "2026-08-05T00:00:00Z" }
              as: StudentVoter
              as_user_id: "${s_g_id}"
              captures: { sig_id: $.data.id }
          trigger:
            - call: "POST /petition-signatures/${sig_id}/adjudicate"
              payload: { outcome: "VERIFIED" }
              as: ElectionCommissioner
              as_user_id: "commissioner-1"
              captures: { sig_status: $.data.status, sig_eligibility: $.data.eligibility_result }
            - call: "GET /candidacies/${c_a_id}"
              payload: {}
              as: ElectionCommissioner
              as_user_id: "commissioner-1"
              captures: { valid_after: $.data.petition_signature_valid_count }
          assert:
            - "${sig_status} == VERIFIED"
            - "${sig_eligibility} == ELIGIBLE"
            - "${valid_after} == 1"
            - "Candidacy.${c_a_id}.petition_signature_pending_count == 0"
            - "Candidacy.${c_a_id}.petition_signature_total_count == 1"
            - "PetitionSignature.${sig_id}.verified_by_user_id == commissioner-1"
