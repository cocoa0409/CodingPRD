      - name: room_power_ledger_sums_across_two_racks_and_admits_exact_capacity
        claim_type: aggregation
        grounds:
          - calculations.room_power_ledger
          - validations[priority=195]
          - errors[ERR_POWER_CAPACITY_EXCEEDED]
        distinguishing_aspect: "The room ledger is a two-level sum: 1200 VA in rack A plus 1500 VA in rack B give power_load_va 2700 and power_headroom_va 300 against a 3000 VA UPS, a 301 VA assignment is refused with 422 and consumes nothing, and 300 VA is admitted at exactly zero headroom."
        test_recipe:
          setup: ["Project RVT1 with room TR01 (ups_capacity_va 3000) holding racks A and B, each of total_ru 42"]
          setup_api_calls:
            - call: "POST /cabling/projects"
              payload: { name: "Riverside Tower Cabling", site_code: "RVT1", plenum_ceiling: true, identifier_scheme: "TIA_606_CLASS_1" }
              as: ProjectManager
              captures: { proj: $.data.id }
