          assert:
            - "the unknown-parent call is HTTP 404 with ${err_parent} == ERR_LIFEGUARD_NOT_FOUND, not ERR_VALIDATION and not ERR_CERTIFICATION_NOT_FOUND"
            - "the real-parent call is HTTP 201 with ${cert_status} == VALID and data.revoked_reason == null"
            - "the filtered child list returns exactly 1 row with total_count == 1, so the child is reachable from the parent id"
            - "${lg_has_lg} == false before and ${lg_has_lg_2} == true after: the parent's derived flag is recomputed by the child write"
            - "${lg_has_cpr} == false, because only the LIFEGUARD cert_type was recorded"

      - name: parent_relationships_volunteer_assignment_is_a_many_to_many_junction
        claim_type: parent_relationships
        grounds:
