              as: AssetManager
              as_user_id: "${am2_id}"
              captures: { lid: $.data.id }
            - call: "POST /portfolios/${pid}/leases/${lid}/activate"
              payload: {}
              as: AssetManager
              as_user_id: "${am2_id}"
              captures: { l_ver2: $.data.version }
            - call: "POST /portfolios/${pid}/leases/${lid}/amendments"
              payload: { kind: "RENEWAL_TERM", new_expiration_date: "2032-12-31T00:00:00Z", new_base_rent_cents_per_rsf_year: 5500 }
              as: AssetManager
              as_user_id: "${am2_id}"
              captures: { aid: $.data.id }
            - call: "POST /portfolios/${pid}/leases/${lid}/amendments/${aid}/propose"
              payload: { expected_lease_version: "${l_ver2}" }
              as: AssetManager
              as_user_id: "${am2_id}"
            - call: "GET /portfolios/${pid}/leases/${lid}"
              payload: {}
              as: AssetManager
              as_user_id: "${am2_id}"
              captures: { l_ver3: $.data.version }
            - call: "POST /portfolios/${pid}/leases/${lid}/amendments/${aid}/agree"
              payload: {}
              as: LandlordCounsel
              as_user_id: "${dual_id}"
            - call: "POST /portfolios/${pid}/leases/${lid}/options"
              payload: { option_type: "ROFR", notice_window_open_date: "2026-09-01T00:00:00Z", notice_window_close_date: "2026-12-01T00:00:00Z", target_commencement_date: "2027-06-01T00:00:00Z", rate_determination: "FIXED", fixed_rent_cents_per_rsf_year: 4000 }
              as: AssetManager
              as_user_id: "${am2_id}"
              captures: { dummy_oid: $.data.id }
            - call: "POST /portfolios/${pid}/leases/${lid}/options/${dummy_oid}/withdraw"
              payload: { expected_lease_version: "${l_ver3}" }
              as: AssetManager
              as_user_id: "${am2_id}"
          trigger:
            - call: "POST /portfolios/${pid}/leases/${lid}/amendments/${aid}/execute"
              payload: { expected_lease_version: "${l_ver3}" }
              as: AssetManager
              as_user_id: "${dual_id}"
              captures: { err: $.data.error_id }
          assert:
            - "response.error_id == ERR_SOD_VIOLATION (business_safety priority 9 beats business_fiscal priority 14)"
            - "http_status == 403, not 412"
            - "Amendment.${aid}.status remains AGREED"

  # ===========================================================================
  # Rule 6 — Boundary-precision checks on different metrics/endpoints
  # ===========================================================================
  - rule_id: boundary_precision_check
    instances:
      - name: ladder_exposure_exactly_at_cap_does_not_trip
        grounds:
          - calculations.portfolio_expiration_ladder
