# ==============================================================================
# SCAFFOLD.yaml — §1.0–§1.7 seed tables
# Task 2607 — Fire Apparatus & Ambulance Body Manufacturing
# Difficulty band: EXPERT+ (deliberately above the §0.4 Expert envelope:
#   12 entities / 61 endpoints / 63 error codes / 11 calculations / 10 state
#   machines / 53 ordered validations, with two parallel state dimensions on
#   UnitOrder, three multi-hop cascades and two compensating-invariant
#   quantities)
# ==============================================================================

scenario: |
  Generate task harder than expert level!

  2607. Fire Apparatus & Ambulance Body Manufacturing (emergency vehicle manufacturer): specification development with the purchasing department including bid specification writing and compliance matrices, chassis selection and body engineering with weight distribution and axle loading calculations, pump, aerial or patient compartment system integration with certification testing, pre-construction and mid-construction inspection trips by customer committees with change orders, standards compliance certification for apparatus and ambulance construction with third-party testing, long lead component procurement including chassis and aerial devices with slot reservations, final inspection, delivery, training and warranty startup, multi-year contract pricing with escalation and options for additional units

domain_name: fire-apparatus-body-manufacturing

# Flat topology: every collection is a peer at the API root and children carry
# explicit foreign keys in the request body. There is no nesting-based ownership
# chain, so api_prefix is the root itself.
api_prefix: "/"

complexity_profile:
  primary_archetype: compliance_audit
  secondary_archetype: multi_party_negotiation
  complexity_layers:
    - cascading_side_effects
    - dual_variant_calculation
    - rate_threshold_triggers
    - optimistic_concurrency

  entity_topology: flat
  # Peer collections (/programs, /specifications, /unit-orders, /slot-lines,
  # /chassis-reservations, /inspection-trips, /change-orders,
  # /certification-tests, /warranty-startups, /compliance-entries) linked by FK
  # fields in bodies. Only two sub-resource routes exist
  # (/specifications/{id}/clauses, /unit-orders/{id}/warranty-startups) because
  # SpecClause and WarrantyStartup are never created standalone.

  state_machine_shape: parallel
  # UnitOrder carries two independent dimensions — build_status (physical
  # progress) and certification_status (third-party testing) — that advance on
  # different triggers and couple at exactly two points (final-inspection
  # requires CERTIFIED; a weight-changing change order resets CERTIFIED and
  # reverts FINAL_INSPECTED). ChangeOrder is cyclic
  # (SUBMITTED -> IN_NEGOTIATION -> SUBMITTED), BidSpecification is cyclic
  # (DRAFT -> UNDER_REVIEW -> DRAFT) with a branch to RELEASED, and
  # ApparatusProgram cycles ACTIVE <-> SUSPENDED.

  relationship_patterns:
    - one_to_many          # ApparatusProgram -> BidSpecification / UnitOrder / ChassisReservation
    - many_to_many         # ComplianceMatrixEntry joins BidSpecification x SpecClause
    - self_referential     # BidSpecification.supersedes_spec_id -> BidSpecification.id
    - cross_aggregate      # ChangeOrder (negotiation aggregate) mutates UnitOrder + CertificationTest + InspectionTrip

  role_model: segregation_of_duties
  # The PurchasingOfficer who authored a bid specification may not release it,
  # and the ThirdPartyTester who signs a certification result may not be the
  # BodyEngineer who owns that unit's weight calculation.

  consistency_model: immediate

response_envelope:
  success: |
    { "meta": { "api_request_id": "req_xxx", "api_request_timestamp": "ISO8601" },
      "response_type": "object" | "array", "data": {} }
  error: |
    { "meta": { ... }, "response_type": "error",
      "data": { "error_id": "ERR_XXX", "message": "..." } }
  pagination_fields: ["limit", "offset", "total_count", "has_more"]
  pagination_defaults: { limit: 10, min: 1, max: 100, offset: 0 }

# ==============================================================================
# §1.1 Entity-Relationship Table
# ==============================================================================
entities:

  - name: ApparatusProgram
    parent: null
    common_fields: true
    fields:
      - name: name
        type: string
        source: input
        description: program label, e.g. "Metro FD 2024-2029 Pumper Program"
        constraints: 1..120 chars
      - name: agency_name
        type: string
        source: input
        description: purchasing fire department / EMS agency name
        constraints: 1..120 chars
      - name: base_year
        type: integer
        source: input
        description: contract base year; all escalation is measured from Jan 1 of this year
        constraints: 2020..2030
      - name: base_unit_price_cents
        type: integer
        source: input
        description: base-year price of one non-option unit, in integer cents
        constraints: ">= 1000000"
      - name: escalation_index_pct_per_year
        type: number
        source: input
        description: annual contract escalation index in percent, one decimal place
        constraints: 0.0..15.0
      - name: max_option_units
        type: integer
        source: input
        description: contractual cap on additional option units beyond the base award
        constraints: 0..20
      - name: options_exercised_count
        type: integer
        source: system
        description: count of UnitOrder rows for this program with option_unit == true and build_status != CANCELLED
        default: 0
      - name: contract_ceiling_cents
        type: integer
        source: input
        description: hard not-to-exceed contract value in integer cents
        constraints: ">= base_unit_price_cents"
      - name: committed_cents
        type: integer
        source: computed
        description: "conserved money quantity; output of calculations.program_committed_cents"
        default: 0
      - name: status
        type: enum
        source: system
        description: program posture gating all child unit operations
        default: DRAFT
        constraints: DRAFT | ACTIVE | SUSPENDED | CLOSED
      - name: suspension_reason
        type: enum
        source: system
        description: why the program is SUSPENDED; reset to null on reactivate
        default: null
        constraints: "null | MANUAL | SOFT_CEILING_BREACH"

  - name: BidSpecification
    parent: null
    common_fields: true
    fields:
      - name: program_id
        type: string
        source: input
        description: FK -> ApparatusProgram.id; owning program
      - name: supersedes_spec_id
        type: string
        source: input
        description: "FK -> BidSpecification.id; the RELEASED predecessor revision this specification replaces when released; null on the first revision"
        default: null
      - name: title
        type: string
        source: input
        description: specification document title
        constraints: 1..160 chars
      - name: revision_number
        type: integer
        source: system
        description: 1 when supersedes_spec_id is null, otherwise predecessor.revision_number + 1
        default: 1
      - name: authored_by_user_id
        type: string
        source: system
        description: X-User-ID of the PurchasingOfficer that created this specification; segregation-of-duties anchor for release
      - name: released_by_user_id
        type: string
        source: system
        description: X-User-ID of the PurchasingOfficer that released it; null until RELEASED
        default: null
      - name: status
        type: enum
        source: system
        description: specification lifecycle state
        default: DRAFT
        constraints: DRAFT | UNDER_REVIEW | RELEASED | SUPERSEDED
      - name: clause_count
        type: integer
        source: computed
        description: count of SpecClause rows with specification_id == this.id
        default: 0
      - name: mandatory_clause_count
        type: integer
        source: computed
        description: count of SpecClause rows with specification_id == this.id AND mandatory == true
        default: 0
      - name: compliance_score_strict
        type: number
        source: computed
        description: "output of calculations.compliance_readiness_score variant `strict`, 2 decimal places"
        default: 0.00
      - name: compliance_score_provisional
        type: number
        source: computed
        description: "output of calculations.compliance_readiness_score variant `provisional`, 2 decimal places"
        default: 0.00
      - name: restrictive_clause_ratio_pct
        type: number
        source: computed
        description: "output of calculations.restrictive_clause_ratio, 2 decimal places; competitive-bidding gate on release"
        default: 0.00
      - name: released_at
        type: datetime
        source: system
        description: logical-clock instant of the RELEASED transition; null before release
        default: null

  - name: SpecClause
    parent: null
    common_fields: false
    fields:
      - name: specification_id
        type: string
        source: input
        description: FK -> BidSpecification.id; owning specification (path-scoped)
      - name: clause_code
        type: string
        source: input
        description: human clause identifier, unique within the specification
        constraints: 1..24 chars
      - name: category
        type: enum
        source: input
        description: apparatus subsystem this clause governs
        constraints: CHASSIS | PUMP | AERIAL | PATIENT_COMPARTMENT | ELECTRICAL | PAINT
      - name: requirement_text
        type: string
        source: input
        description: the written requirement the manufacturer must respond to
        constraints: 1..500 chars
      - name: mandatory
        type: boolean
        source: input
        description: mandatory clauses carry scoring weight 3, optional clauses weight 1
        default: true
      - name: is_restrictive
        type: boolean
        source: input
        description: true when the clause names a proprietary/brand-specific requirement that narrows competition
        default: false

  - name: ComplianceMatrixEntry
    parent: null
    common_fields: true
    fields:
      - name: specification_id
        type: string
        source: input
        description: FK -> BidSpecification.id; the specification being responded to
      - name: clause_id
        type: string
        source: input
        description: FK -> SpecClause.id; the clause being responded to
      - name: response
        type: enum
        source: input
        description: manufacturer response to the clause
        constraints: COMPLY | EXCEPTION | ALTERNATE
      - name: exception_text
        type: string
        source: input
        description: narrative required when response is EXCEPTION or ALTERNATE
        default: null
      - name: disposition
        type: enum
        source: system
        description: purchasing department's ruling on the response
        default: PENDING
        constraints: PENDING | ACCEPTED | REJECTED | VOID
      - name: disposition_note
        type: string
        source: system
        description: note recorded with the disposition
        default: null
      - name: responded_by_user_id
        type: string
        source: system
        description: X-User-ID of the BodyEngineer that filed the response

  - name: UnitOrder
    parent: null
    common_fields: true
    fields:
      - name: program_id
        type: string
        source: input
        description: FK -> ApparatusProgram.id; owning multi-year program
      - name: specification_id
        type: string
        source: input
        description: "FK -> BidSpecification.id; the RELEASED specification revision pinned at award; never re-pointed after creation"
      - name: chassis_reservation_id
        type: string
        source: system
        description: "FK -> ChassisReservation.id; set when a long-lead reservation names this unit, cleared when that reservation is RELEASED or EXPIRED"
        default: null
      - name: unit_type
        type: enum
        source: input
        description: body/apparatus family being built
        constraints: PUMPER | AERIAL | AMBULANCE
      - name: option_unit
        type: boolean
        source: input
        description: true when this unit is an exercised contract option rather than a base-award unit
        default: false
      - name: award_year
        type: integer
        source: input
        description: calendar year the unit is awarded; drives the escalation exponent
        constraints: "program.base_year <= award_year <= program.base_year + 5"
      - name: gvwr_kg
        type: integer
        source: input
        description: chassis gross vehicle weight rating in kilograms
        constraints: 4000..40000
      - name: front_axle_rating_kg
        type: integer
        source: input
        description: front axle capacity in kilograms
        constraints: 1500..12000
      - name: rear_axle_rating_kg
        type: integer
        source: input
        description: rear axle capacity in kilograms
        constraints: 2000..30000
      - name: base_curb_front_kg
        type: integer
        source: input
        description: dry body curb weight carried by the front axle
        constraints: ">= 500"
      - name: base_curb_rear_kg
        type: integer
        source: input
        description: dry body curb weight carried by the rear axle
        constraints: ">= 500"
      - name: crew_seat_count
        type: integer
        source: input
        description: seated crew positions; first two seats load the front axle, the rest load the rear
        constraints: 0..8
      - name: weight_calc_engineer_user_id
        type: string
        source: input
        description: X-User-ID of the BodyEngineer who owns this unit's weight distribution calculation; segregation-of-duties anchor for certification sign-off
      - name: front_axle_load_kg
        type: integer
        source: computed
        description: "output of calculations.axle_load_distribution (front leg)"
        default: 0
      - name: rear_axle_load_kg
        type: integer
        source: computed
        description: "output of calculations.axle_load_distribution (rear leg)"
        default: 0
      - name: gross_weight_kg
        type: integer
        source: computed
        description: front_axle_load_kg + rear_axle_load_kg
        default: 0
      - name: weight_status
        type: enum
        source: computed
        description: "output of calculations.axle_load_distribution (verdict leg); safety gate on final inspection and delivery"
        default: WITHIN_LIMITS
        constraints: WITHIN_LIMITS | OVER_FRONT | OVER_REAR | OVER_GVWR
      - name: price_cents
        type: integer
        source: computed
        description: "output of calculations.unit_award_price variant `award_year_locked`, fixed at creation"
        default: 0
      - name: change_order_total_cents
        type: integer
        source: computed
        description: "output of calculations.unit_change_order_total; sum of APPROVED ChangeOrder.price_delta_cents for this unit"
        default: 0
      - name: open_change_order_count
        type: integer
        source: computed
        description: count of ChangeOrder rows for this unit with status IN {DRAFT, SUBMITTED, IN_NEGOTIATION}
        default: 0
      - name: build_status
        type: enum
        source: system
        description: physical build dimension of the parallel state machine
        default: SPEC_LOCKED
        constraints: SPEC_LOCKED | PRE_CON_HELD | IN_PRODUCTION | MID_CON_HELD | FINAL_INSPECTED | DELIVERED | WARRANTY_ACTIVE | CANCELLED
      - name: certification_status
        type: enum
        source: system
        description: third-party certification dimension of the parallel state machine
        default: NOT_SUBMITTED
        constraints: NOT_SUBMITTED | IN_TESTING | CERTIFIED | REJECTED_TESTING
      - name: long_lead_status
        type: enum
        source: system
        description: long-lead chassis/aerial procurement posture for this unit
        default: NOT_RESERVED
        constraints: NOT_RESERVED | RESERVED | CONFIRMED | AT_RISK
      - name: spec_drift_flag
        type: boolean
        source: system
        description: set true when the pinned specification revision is superseded while the unit is still in flight
        default: false
      - name: delivered_at
        type: datetime
        source: system
        description: logical-clock instant of the DELIVERED transition
        default: null

  - name: SupplierSlotLine
    parent: null
    common_fields: true
    fields:
      - name: supplier_name
        type: string
        source: input
        description: long-lead component supplier (chassis OEM, aerial device builder, module builder)
        constraints: 1..120 chars
      - name: component_type
        type: enum
        source: input
        description: component family whose build slots this line sells
        constraints: CHASSIS | AERIAL_DEVICE | PATIENT_MODULE
      - name: total_slot_count
        type: integer
        source: input
        description: conserved capacity quantity; total build slots the supplier has committed on this line
        constraints: 1..50
      - name: changeover_buffer_days
        type: integer
        source: input
        description: mandatory line-changeover gap enforced between two occupied slot windows on this line
        default: 7
        constraints: 0..30
      - name: reserved_slot_count
        type: integer
        source: computed
        description: "output of calculations.slot_line_utilization (occupied leg)"
        default: 0
      - name: available_slot_count
        type: integer
        source: computed
        description: "output of calculations.slot_line_utilization (free leg); total_slot_count - reserved_slot_count"
        default: 0

  - name: ChassisReservation
    parent: null
    common_fields: true
    fields:
      - name: program_id
        type: string
        source: input
        description: FK -> ApparatusProgram.id; program the reservation is held for
      - name: slot_line_id
        type: string
        source: input
        description: FK -> SupplierSlotLine.id; the supplier line whose slot window is occupied
      - name: unit_order_id
        type: string
        source: input
        description: "FK -> UnitOrder.id; the unit this slot is earmarked for; null for an unassigned speculative hold"
        default: null
      - name: slot_start_date
        type: datetime
        source: input
        description: inclusive start of the occupied slot window
      - name: slot_end_date
        type: datetime
        source: input
        description: exclusive end of the occupied slot window
        constraints: "slot_end_date > slot_start_date"
      - name: reserved_price_cents
        type: integer
        source: input
        description: quoted component price held by the reservation, integer cents
        constraints: ">= 0"
      - name: expiry_at
        type: datetime
        source: input
        description: instant after which a still-RESERVED hold is expired by the next ops-run
      - name: status
        type: enum
        source: system
        description: reservation lifecycle
        default: RESERVED
        constraints: RESERVED | CONFIRMED | CONSUMED | RELEASED | EXPIRED
      - name: confirmed_at
        type: datetime
        source: system
        description: logical-clock instant of the CONFIRMED transition
        default: null

  - name: PlantBay
    parent: null
    common_fields: false
    fields:
      - name: name
        type: string
        source: input
        description: inspection bay label on the plant floor
        constraints: 1..80 chars
      - name: max_concurrent_visitors
        type: integer
        source: input
        description: aggregate visitor capacity of the bay at any instant; committee sizes of overlapping trips are summed against it
        constraints: 1..60

  - name: InspectionTrip
    parent: null
    common_fields: true
    fields:
      - name: unit_order_id
        type: string
        source: input
        description: FK -> UnitOrder.id; unit being inspected
      - name: plant_bay_id
        type: string
        source: input
        description: FK -> PlantBay.id; bay the committee occupies
      - name: trip_type
        type: enum
        source: input
        description: contractual inspection milestone
        constraints: PRE_CONSTRUCTION | MID_CONSTRUCTION | FINAL
      - name: scheduled_start
        type: datetime
        source: input
        description: inclusive start of the bay occupation window
      - name: scheduled_end
        type: datetime
        source: input
        description: inclusive end of the bay occupation window
        constraints: "scheduled_end > scheduled_start"
      - name: committee_size
        type: integer
        source: input
        description: number of customer committee visitors counted against the bay's aggregate capacity
        constraints: 1..40
      - name: status
        type: enum
        source: system
        description: trip lifecycle
        default: SCHEDULED
        constraints: SCHEDULED | HELD | CANCELLED
      - name: held_at
        type: datetime
        source: system
        description: logical-clock instant of the HELD transition
        default: null

  - name: ChangeOrder
    parent: null
    common_fields: true
    fields:
      - name: unit_order_id
        type: string
        source: input
        description: FK -> UnitOrder.id; unit whose price and weight the change order amends
      - name: inspection_trip_id
        type: string
        source: input
        description: "FK -> InspectionTrip.id; the HELD committee trip the change order was raised at; its unit_order_id must equal this row's unit_order_id"
      - name: line_items
        type: array
        source: input
        description: "ordered array of objects { description: string, quantity: integer >= 1, unit_cost_cents: integer >= 0, markup_pct: number 0.0..22.0, is_taxable: boolean }; evaluation order is array order"
        constraints: 1..12 items
      - name: weight_delta_front_kg
        type: integer
        source: input
        description: signed front-axle weight change this change order introduces
        constraints: -2000..2000
      - name: weight_delta_rear_kg
        type: integer
        source: input
        description: signed rear-axle weight change this change order introduces
        constraints: -2000..2000
      - name: price_delta_cents
        type: integer
        source: computed
        description: "output of calculations.change_order_price_delta; recomputed on create and on every revise"
        default: 0
      - name: revision_count
        type: integer
        source: system
        description: number of times this change order has been revised out of IN_NEGOTIATION
        default: 0
      - name: raised_by_user_id
        type: string
        source: system
        description: "X-User-ID of the CustomerCommitteeRep that created the change order (equals the ApparatusProgram.id it represents, per §1.7 identity)"
      - name: approved_by_user_id
        type: string
        source: system
        description: X-User-ID of the PurchasingOfficer that approved it; null until APPROVED
        default: null
      - name: status
        type: enum
        source: system
        description: negotiation lifecycle with a revision cycle
        default: DRAFT
        constraints: DRAFT | SUBMITTED | IN_NEGOTIATION | APPROVED | REJECTED | RESCINDED
      - name: applied_at
        type: datetime
        source: system
        description: logical-clock instant the approved delta was applied to the unit
        default: null

  - name: CertificationTest
    parent: null
    common_fields: true
    fields:
      - name: unit_order_id
        type: string
        source: input
        description: FK -> UnitOrder.id; unit under third-party test
      - name: test_standard
        type: enum
        source: input
        description: "standard the third party tests against; must match unit_type per validations[priority=24]"
        constraints: NFPA_1901 | NFPA_1911 | NFPA_1917 | AMD_STD_003
      - name: submitted_by_user_id
        type: string
        source: system
        description: X-User-ID of the BodyEngineer that submitted the unit for testing
      - name: signed_by_user_id
        type: string
        source: input
        description: identifier of the third-party inspector signing the result; must differ from the unit's weight_calc_engineer_user_id
        default: null
      - name: result
        type: enum
        source: system
        description: recorded test outcome; null until a result is recorded
        default: null
        constraints: "null | PASS | FAIL"
      - name: status
        type: enum
        source: system
        description: test lifecycle
        default: SUBMITTED
        constraints: SUBMITTED | PASSED | FAILED | INVALIDATED
      - name: tested_at
        type: datetime
        source: input
        description: instant the third party performed the test
        default: null
      - name: invalidated_reason
        type: enum
        source: system
        description: why a PASSED certificate was torn up by a cascade
        default: null
        constraints: "null | WEIGHT_STATUS_CHANGE | SPEC_SUPERSEDED"

  - name: WarrantyStartup
    parent: null
    common_fields: true
    fields:
      - name: unit_order_id
        type: string
        source: input
        description: FK -> UnitOrder.id; the delivered unit this warranty record covers
      - name: delivery_date
        type: datetime
        source: input
        description: contractual delivery instant recorded at the deliver call
      - name: training_hours
        type: number
        source: input
        description: hours of operator/maintainer training delivered at handover
        constraints: 0.0..200.0
      - name: warranty_months
        type: integer
        source: input
        description: warranty duration in whole months
        constraints: 12..120
      - name: warranty_start_date
        type: datetime
        source: computed
        description: "output of calculations.warranty_activation_window (start leg)"
      - name: warranty_end_date
        type: datetime
        source: computed
        description: "output of calculations.warranty_activation_window (end leg)"
      - name: final_price_cents
        type: integer
        source: computed
        description: "output of calculations.unit_award_price variant `delivery_year_actual`"
        default: 0
      - name: price_variance_cents
        type: integer
        source: computed
        description: final_price_cents - UnitOrder.price_cents; the escalation reconciliation delta, excluded from ApparatusProgram.committed_cents
        default: 0
      - name: status
        type: enum
        source: system
        description: warranty record lifecycle
        default: PENDING_TRAINING
        constraints: PENDING_TRAINING | ACTIVE | EXPIRED

# ==============================================================================
# §1.2 State Machine Table
# Ten machines. UnitOrder carries two independent dimensions (build_status,
# certification_status) declared as two blocks on the same entity.
# ==============================================================================
state_machines:

  - entity: ApparatusProgram
    dimension: status
    initial_state: DRAFT
    terminal_states: [CLOSED]
    transitions:
      - from: DRAFT
        to: ACTIVE
        trigger: "POST /programs/{program_id}/activate"
        actor: ProgramAdmin
        preconditions:
          - "program.status == DRAFT"
        side_effects:
          - "sets ApparatusProgram.suspension_reason = null"
          - "increments ApparatusProgram.version by 1"
        note: "UnitOrder creation is permitted only while the program is ACTIVE."

      - from: ACTIVE
        to: SUSPENDED
        trigger: "POST /programs/{program_id}/suspend"
        actor: ProgramAdmin
        preconditions:
          - "program.status == ACTIVE"
        side_effects:
          - "sets ApparatusProgram.suspension_reason = MANUAL"
          - "increments ApparatusProgram.version by 1"

      - from: ACTIVE
        to: SUSPENDED
        trigger: "system: soft-ceiling breach detected while recomputing calculations.program_committed_cents (POST /unit-orders, POST /change-orders/{change_order_id}/approve, POST /unit-orders/{unit_order_id}/cancel, POST /change-orders/{change_order_id}/rescind, POST /programs/{program_id}/ops-run)"
        actor: system
        preconditions:
          - "program.status == ACTIVE"
          - "committed_cents > round_half_up(contract_ceiling_cents * 90 / 100)"
          - "committed_cents <= contract_ceiling_cents  (a strict ceiling breach is rejected by validations[priority=27] instead, leaving status untouched)"
        side_effects:
          - "sets ApparatusProgram.suspension_reason = SOFT_CEILING_BREACH"
          - "increments ApparatusProgram.version by 1"
        note: "Auto-transition fires inside the same request that pushed committed_cents past the soft ceiling; the triggering write still succeeds."

      - from: SUSPENDED
        to: ACTIVE
        trigger: "POST /programs/{program_id}/reactivate"
        actor: ProgramAdmin
        preconditions:
          - "program.status == SUSPENDED"
          - "committed_cents <= round_half_up(contract_ceiling_cents * 90 / 100)"
        side_effects:
          - "sets ApparatusProgram.suspension_reason = null"
          - "increments ApparatusProgram.version by 1"
        note: "Reactivating while still above the soft ceiling is rejected with ERR_SOFT_CEILING_STILL_BREACHED."

      - from: ACTIVE
        to: CLOSED
        trigger: "POST /programs/{program_id}/close"
        actor: ProgramAdmin
        preconditions:
          - "program.status == ACTIVE"
          - "every UnitOrder with program_id == program.id has build_status IN {WARRANTY_ACTIVE, CANCELLED}"
        side_effects:
          - "increments ApparatusProgram.version by 1"
        note: "Compound/aggregate guard: the parent may close only when every child unit is terminal."

  - entity: BidSpecification
    dimension: status
    initial_state: DRAFT
    terminal_states: [SUPERSEDED]
    transitions:
      - from: DRAFT
        to: UNDER_REVIEW
        trigger: "POST /specifications/{specification_id}/submit-review"
        actor: PurchasingOfficer
        preconditions:
          - "specification.status == DRAFT"
          - "specification.clause_count >= 1"
        side_effects:
          - "recomputes compliance_score_strict, compliance_score_provisional, restrictive_clause_ratio_pct"
          - "increments BidSpecification.version by 1"

      - from: UNDER_REVIEW
        to: DRAFT
        trigger: "POST /specifications/{specification_id}/rework"
        actor: PurchasingOfficer
        preconditions:
          - "specification.status == UNDER_REVIEW"
        side_effects:
          - "increments BidSpecification.version by 1"
        note: "Revision cycle: clauses and compliance responses may only be written while the specification is DRAFT."

      - from: UNDER_REVIEW
        to: RELEASED
        trigger: "POST /specifications/{specification_id}/release"
        actor: PurchasingOfficer
        preconditions:
          - "specification.status == UNDER_REVIEW"
          - "specification.clause_count >= 1"
          - "specification.compliance_score_strict >= 75.00"
          - "specification.restrictive_clause_ratio_pct <= 40.00"
          - "X-User-ID != specification.authored_by_user_id  (segregation of duties)"
          - "if supersedes_spec_id is not null: that predecessor has status == RELEASED AND program_id == this.program_id"
        side_effects:
          - "sets released_at = current logical clock, released_by_user_id = X-User-ID"
          - "CASCADE B hop 1: if supersedes_spec_id is not null, the predecessor BidSpecification transitions RELEASED -> SUPERSEDED"
          - "increments BidSpecification.version by 1"

      - from: RELEASED
        to: SUPERSEDED
        trigger: "system: CASCADE B hop 1 — a successor specification naming this row in supersedes_spec_id completed its UNDER_REVIEW -> RELEASED transition"
        actor: system
        preconditions:
          - "predecessor.status == RELEASED"
        side_effects:
          - "every ComplianceMatrixEntry with specification_id == predecessor.id AND disposition == PENDING transitions PENDING -> VOID, processed in created_at ASC order"
          - "CASCADE B hop 2: every UnitOrder with specification_id == predecessor.id AND build_status NOT IN {DELIVERED, WARRANTY_ACTIVE, CANCELLED} has spec_drift_flag set to true (processed in created_at ASC order)"
          - "increments BidSpecification.version by 1"
        note: "Hop 2's spec_drift_flag change is itself the cause of hop 3 on UnitOrder.certification_status."

  - entity: ComplianceMatrixEntry
    dimension: disposition
    initial_state: PENDING
    terminal_states: [ACCEPTED, REJECTED, VOID]
    transitions:
      - from: PENDING
        to: ACCEPTED
        trigger: "POST /compliance-entries/{compliance_entry_id}/dispose with disposition == ACCEPTED"
        actor: PurchasingOfficer
        preconditions:
          - "entry.disposition == PENDING"
          - "the parent BidSpecification (entry.specification_id) has status == DRAFT"
        side_effects:
          - "recomputes BidSpecification.compliance_score_strict and compliance_score_provisional for entry.specification_id"
          - "increments ComplianceMatrixEntry.version by 1 and BidSpecification.version by 1"
        note: "Accepting an EXCEPTION/ALTERNATE response is the only way the strict variant can count that clause as compliant."

      - from: PENDING
        to: REJECTED
        trigger: "POST /compliance-entries/{compliance_entry_id}/dispose with disposition == REJECTED"
        actor: PurchasingOfficer
        preconditions:
          - "entry.disposition == PENDING"
          - "the parent BidSpecification (entry.specification_id) has status == DRAFT"
        side_effects:
          - "recomputes BidSpecification.compliance_score_strict and compliance_score_provisional for entry.specification_id"
          - "increments ComplianceMatrixEntry.version by 1 and BidSpecification.version by 1"
        note: "Rejection removes the clause from BOTH variants' compliant sets."

      - from: PENDING
        to: VOID
        trigger: "system: the parent specification transitioned RELEASED -> SUPERSEDED (CASCADE B hop 1)"
        actor: system
        preconditions:
          - "entry.disposition == PENDING"
          - "parent specification status == SUPERSEDED"
        side_effects:
          - "sets disposition_note = 'voided by supersede'"
          - "increments ComplianceMatrixEntry.version by 1"

  - entity: UnitOrder
    dimension: build_status
    initial_state: SPEC_LOCKED
    terminal_states: [WARRANTY_ACTIVE, CANCELLED]
    transitions:
      - from: SPEC_LOCKED
        to: PRE_CON_HELD
        trigger: "system: an InspectionTrip with this unit_order_id and trip_type == PRE_CONSTRUCTION transitioned SCHEDULED -> HELD"
        actor: system
        preconditions:
          - "unit.build_status == SPEC_LOCKED"
        side_effects:
          - "increments UnitOrder.version by 1"
        note: "Independent of the certification_status dimension, which stays NOT_SUBMITTED."

      - from: PRE_CON_HELD
        to: IN_PRODUCTION
        trigger: "POST /unit-orders/{unit_order_id}/start-production"
        actor: PurchasingOfficer
        preconditions:
          - "unit.build_status == PRE_CON_HELD"
          - "the owning ApparatusProgram (unit.program_id) has status == ACTIVE"
          - "unit.chassis_reservation_id is not null AND that ChassisReservation.status == CONFIRMED"
        side_effects:
          - "the linked ChassisReservation transitions CONFIRMED -> CONSUMED"
          - "recomputes SupplierSlotLine.reserved_slot_count / available_slot_count for that reservation's slot_line_id (CONSUMED still occupies the slot, so both counts are unchanged) and increments SupplierSlotLine.version by 1"
          - "increments UnitOrder.version by 1"
        note: "Cross-entity guard on two different partners: ApparatusProgram.status and ChassisReservation.status."

      - from: IN_PRODUCTION
        to: MID_CON_HELD
        trigger: "system: an InspectionTrip with this unit_order_id and trip_type == MID_CONSTRUCTION transitioned SCHEDULED -> HELD"
        actor: system
        preconditions:
          - "unit.build_status == IN_PRODUCTION"
        side_effects:
          - "increments UnitOrder.version by 1"

      - from: MID_CON_HELD
        to: FINAL_INSPECTED
        trigger: "POST /unit-orders/{unit_order_id}/final-inspection"
        actor: PurchasingOfficer
        preconditions:
          - "unit.build_status == MID_CON_HELD"
          - "unit.certification_status == CERTIFIED"
          - "unit.weight_status == WITHIN_LIMITS"
          - "unit.open_change_order_count == 0"
        side_effects:
          - "increments UnitOrder.version by 1"
        note: "First of exactly two coupling points between the two dimensions."

      - from: FINAL_INSPECTED
        to: IN_PRODUCTION
        trigger: "system: CASCADE A hop 3 — this unit's certification_status was reset CERTIFIED -> NOT_SUBMITTED by hop 2"
        actor: system
        preconditions:
          - "unit.build_status == FINAL_INSPECTED"
          - "certification_status just transitioned CERTIFIED -> NOT_SUBMITTED in this same request"
        side_effects:
          - "CASCADE A hop 4: every InspectionTrip with this unit_order_id, trip_type == FINAL and status == SCHEDULED transitions SCHEDULED -> CANCELLED (processed in created_at ASC order), releasing its committee_size from the PlantBay aggregate"
          - "increments UnitOrder.version by 1"
        note: "Second coupling point, in the reverse direction: a certification reset drags the build dimension backwards."

      - from: FINAL_INSPECTED
        to: DELIVERED
        trigger: "POST /unit-orders/{unit_order_id}/deliver"
        actor: ProgramAdmin
        preconditions:
          - "unit.build_status == FINAL_INSPECTED"
          - "unit.weight_status == WITHIN_LIMITS"
          - "delivery_date >= the scheduled_end of this unit's MID_CONSTRUCTION InspectionTrip with status == HELD"
        side_effects:
          - "creates one WarrantyStartup row with unit_order_id == unit.id (status PENDING_TRAINING or ACTIVE per calculations.warranty_activation_window)"
          - "computes WarrantyStartup.final_price_cents via calculations.unit_award_price variant delivery_year_actual and WarrantyStartup.price_variance_cents"
          - "sets UnitOrder.delivered_at = current logical clock"
          - "increments UnitOrder.version by 1"

      - from: DELIVERED
        to: WARRANTY_ACTIVE
        trigger: "system: POST /programs/{program_id}/ops-run observes the unit's WarrantyStartup with status == ACTIVE and warranty_start_date <= current logical clock"
        actor: system
        preconditions:
          - "unit.build_status == DELIVERED"
          - "the unit's WarrantyStartup.status == ACTIVE"
        side_effects:
          - "increments UnitOrder.version by 1"

      - from: SPEC_LOCKED
        to: CANCELLED
        trigger: "POST /unit-orders/{unit_order_id}/cancel"
        actor: PurchasingOfficer
        preconditions:
          - "unit.build_status IN {SPEC_LOCKED, PRE_CON_HELD}"
          - "unit.open_change_order_count == 0"
        side_effects:
          - "if unit.chassis_reservation_id is not null and that ChassisReservation.status IN {RESERVED, CONFIRMED}: that reservation transitions to RELEASED, which recomputes SupplierSlotLine.reserved_slot_count / available_slot_count and clears unit.chassis_reservation_id"
          - "if unit.option_unit == true: decrements ApparatusProgram.options_exercised_count by 1"
          - "recomputes ApparatusProgram.committed_cents (the CANCELLED unit leaves the input set)"
          - "increments UnitOrder.version by 1 and ApparatusProgram.version by 1"

      - from: PRE_CON_HELD
        to: CANCELLED
        trigger: "POST /unit-orders/{unit_order_id}/cancel"
        actor: PurchasingOfficer
        preconditions:
          - "unit.build_status IN {SPEC_LOCKED, PRE_CON_HELD}"
          - "unit.open_change_order_count == 0"
        side_effects:
          - "identical side-effect set to the SPEC_LOCKED -> CANCELLED transition"
          - "increments UnitOrder.version by 1 and ApparatusProgram.version by 1"

  - entity: UnitOrder
    dimension: certification_status
    initial_state: NOT_SUBMITTED
    terminal_states: []
    transitions:
      - from: NOT_SUBMITTED
        to: IN_TESTING
        trigger: "POST /certification-tests"
        actor: BodyEngineer
        preconditions:
          - "unit.certification_status IN {NOT_SUBMITTED, REJECTED_TESTING}"
          - "an InspectionTrip with this unit_order_id, trip_type == MID_CONSTRUCTION and status == HELD exists"
          - "test_standard matches unit_type per validations[priority=24]"
        side_effects:
          - "creates a CertificationTest row with status SUBMITTED"
          - "increments UnitOrder.version by 1"
        note: "Cross-entity guard on the CertificationTest <-> InspectionTrip pair."

      - from: IN_TESTING
        to: CERTIFIED
        trigger: "POST /certification-tests/{certification_test_id}/record-result with result == PASS"
        actor: ThirdPartyTester
        preconditions:
          - "test.status == SUBMITTED"
          - "unit.certification_status == IN_TESTING"
          - "signed_by_user_id != unit.weight_calc_engineer_user_id  (segregation of duties)"
        side_effects:
          - "the CertificationTest transitions SUBMITTED -> PASSED with result = PASS"
          - "increments UnitOrder.version by 1"

      - from: IN_TESTING
        to: REJECTED_TESTING
        trigger: "POST /certification-tests/{certification_test_id}/record-result with result == FAIL"
        actor: ThirdPartyTester
        preconditions:
          - "test.status == SUBMITTED"
          - "unit.certification_status == IN_TESTING"
          - "signed_by_user_id != unit.weight_calc_engineer_user_id  (segregation of duties)"
        side_effects:
          - "the CertificationTest transitions SUBMITTED -> FAILED with result = FAIL"
          - "increments UnitOrder.version by 1"

      - from: REJECTED_TESTING
        to: IN_TESTING
        trigger: "POST /certification-tests (a fresh test after a failure)"
        actor: BodyEngineer
        preconditions:
          - "unit.certification_status == REJECTED_TESTING"
          - "an InspectionTrip with this unit_order_id, trip_type == MID_CONSTRUCTION and status == HELD exists"
        side_effects:
          - "creates another CertificationTest row with status SUBMITTED"
          - "increments UnitOrder.version by 1"
        note: "Retest cycle inside the certification dimension; build_status is untouched throughout."

      - from: CERTIFIED
        to: NOT_SUBMITTED
        trigger: "system: CASCADE A hop 2 (weight_status left WITHIN_LIMITS) or CASCADE B hop 3 (spec_drift_flag became true)"
        actor: system
        preconditions:
          - "unit.certification_status == CERTIFIED"
          - "either the unit's weight_status transitioned away from WITHIN_LIMITS in this request, or spec_drift_flag became true in this request"
        side_effects:
          - "every CertificationTest with this unit_order_id and status == PASSED transitions PASSED -> INVALIDATED (processed in created_at ASC order) with invalidated_reason = WEIGHT_STATUS_CHANGE (CASCADE A) or SPEC_SUPERSEDED (CASCADE B)"
          - "CASCADE A hop 3 only: if build_status == FINAL_INSPECTED it reverts to IN_PRODUCTION"
          - "increments UnitOrder.version by 1"

  - entity: ChassisReservation
    dimension: status
    initial_state: RESERVED
    terminal_states: [CONSUMED, RELEASED, EXPIRED]
    transitions:
      - from: RESERVED
        to: CONFIRMED
        trigger: "POST /chassis-reservations/{reservation_id}/confirm"
        actor: PurchasingOfficer
        preconditions:
          - "reservation.status == RESERVED"
          - "reservation.unit_order_id is not null"
        side_effects:
          - "sets confirmed_at = current logical clock"
          - "sets the linked UnitOrder.long_lead_status = CONFIRMED and increments UnitOrder.version by 1"
          - "increments ChassisReservation.version by 1"
        note: "reserved_slot_count is unchanged — RESERVED and CONFIRMED both occupy a slot."

      - from: CONFIRMED
        to: CONSUMED
        trigger: "system: the linked UnitOrder transitioned PRE_CON_HELD -> IN_PRODUCTION"
        actor: system
        preconditions:
          - "reservation.status == CONFIRMED"
        side_effects:
          - "increments ChassisReservation.version by 1"

      - from: RESERVED
        to: RELEASED
        trigger: "POST /chassis-reservations/{reservation_id}/release"
        actor: PurchasingOfficer
        preconditions:
          - "reservation.status IN {RESERVED, CONFIRMED}"
        side_effects:
          - "CASCADE C hop 1: recomputes SupplierSlotLine.reserved_slot_count and available_slot_count for reservation.slot_line_id and increments SupplierSlotLine.version by 1"
          - "CASCADE C hop 2 (caused by the freed slot): if reservation.unit_order_id is not null and that UnitOrder.build_status IN {SPEC_LOCKED, PRE_CON_HELD}, the unit's chassis_reservation_id is cleared and long_lead_status becomes AT_RISK"
          - "CASCADE C hop 3 (caused by long_lead_status becoming AT_RISK): every InspectionTrip for that unit with trip_type == PRE_CONSTRUCTION and status == SCHEDULED transitions SCHEDULED -> CANCELLED (created_at ASC), freeing its committee_size from the PlantBay aggregate"
          - "increments ChassisReservation.version by 1"

      - from: CONFIRMED
        to: RELEASED
        trigger: "POST /chassis-reservations/{reservation_id}/release"
        actor: PurchasingOfficer
        preconditions:
          - "reservation.status IN {RESERVED, CONFIRMED}"
        side_effects:
          - "identical CASCADE C hop 1 / hop 2 / hop 3 side-effect set as the RESERVED -> RELEASED transition"
          - "increments ChassisReservation.version by 1"

      - from: RESERVED
        to: EXPIRED
        trigger: "system: POST /programs/{program_id}/ops-run observes reservation.status == RESERVED AND expiry_at <= current logical clock"
        actor: system
        preconditions:
          - "reservation.status == RESERVED"
          - "reservation.program_id == the ops-run program"
        side_effects:
          - "recomputes SupplierSlotLine.reserved_slot_count / available_slot_count for reservation.slot_line_id and increments SupplierSlotLine.version by 1"
          - "if reservation.unit_order_id is not null and that UnitOrder.build_status IN {SPEC_LOCKED, PRE_CON_HELD}: clears the unit's chassis_reservation_id and sets long_lead_status = AT_RISK"
          - "increments ChassisReservation.version by 1"
        note: "Expired reservations are processed in created_at ASC order within the ops-run."

  - entity: InspectionTrip
    dimension: status
    initial_state: SCHEDULED
    terminal_states: [HELD, CANCELLED]
    transitions:
      - from: SCHEDULED
        to: HELD
        trigger: "POST /inspection-trips/{inspection_trip_id}/hold"
        actor: CustomerCommitteeRep
        preconditions:
          - "trip.status == SCHEDULED"
          - "X-User-ID == the program_id of trip.unit_order_id's UnitOrder"
          - "no other InspectionTrip for the same unit_order_id with the same trip_type already has status == HELD"
          - "for trip_type == MID_CONSTRUCTION: the unit's build_status == IN_PRODUCTION"
          - "for trip_type == FINAL: the unit's build_status == FINAL_INSPECTED"
        side_effects:
          - "sets held_at = current logical clock"
          - "if trip_type == PRE_CONSTRUCTION and unit.build_status == SPEC_LOCKED: the unit transitions SPEC_LOCKED -> PRE_CON_HELD"
          - "if trip_type == MID_CONSTRUCTION and unit.build_status == IN_PRODUCTION: the unit transitions IN_PRODUCTION -> MID_CON_HELD"
          - "increments InspectionTrip.version by 1"

      - from: SCHEDULED
        to: CANCELLED
        trigger: "POST /inspection-trips/{inspection_trip_id}/cancel"
        actor: PurchasingOfficer | CustomerCommitteeRep
        preconditions:
          - "trip.status == SCHEDULED"
        side_effects:
          - "the trip's committee_size stops counting against the PlantBay aggregate capacity (input set of calculations.bay_concurrent_load excludes CANCELLED)"
          - "increments InspectionTrip.version by 1"

      - from: SCHEDULED
        to: CANCELLED
        trigger: "system: CASCADE A hop 4 (a FINAL trip on a unit whose build_status reverted FINAL_INSPECTED -> IN_PRODUCTION) or CASCADE C hop 3 (a PRE_CONSTRUCTION trip on a unit whose long_lead_status became AT_RISK)"
        actor: system
        preconditions:
          - "trip.status == SCHEDULED"
        side_effects:
          - "the trip's committee_size stops counting against the PlantBay aggregate capacity"
          - "increments InspectionTrip.version by 1"

  - entity: ChangeOrder
    dimension: status
    initial_state: DRAFT
    terminal_states: [REJECTED, RESCINDED]
    transitions:
      - from: DRAFT
        to: SUBMITTED
        trigger: "POST /change-orders/{change_order_id}/submit"
        actor: CustomerCommitteeRep
        preconditions:
          - "change_order.status == DRAFT"
          - "the InspectionTrip (change_order.inspection_trip_id) has status == HELD"
          - "X-User-ID == the program_id of change_order.unit_order_id's UnitOrder"
        side_effects:
          - "increments ChangeOrder.version by 1"

      - from: SUBMITTED
        to: IN_NEGOTIATION
        trigger: "POST /change-orders/{change_order_id}/negotiate"
        actor: PurchasingOfficer
        preconditions:
          - "change_order.status == SUBMITTED"
        side_effects:
          - "increments ChangeOrder.version by 1"

      - from: IN_NEGOTIATION
        to: SUBMITTED
        trigger: "POST /change-orders/{change_order_id}/revise"
        actor: CustomerCommitteeRep
        preconditions:
          - "change_order.status == IN_NEGOTIATION"
          - "X-User-ID == the program_id of change_order.unit_order_id's UnitOrder"
          - "every line item satisfies markup_pct <= 22.0"
        side_effects:
          - "replaces line_items, weight_delta_front_kg and weight_delta_rear_kg with the request values"
          - "recomputes price_delta_cents via calculations.change_order_price_delta"
          - "increments revision_count by 1"
          - "increments ChangeOrder.version by 1"
        note: "Negotiation cycle: SUBMITTED -> IN_NEGOTIATION -> SUBMITTED may repeat without bound; revision_count records the loop count."

      - from: SUBMITTED
        to: APPROVED
        trigger: "POST /change-orders/{change_order_id}/approve"
        actor: PurchasingOfficer
        preconditions:
          - "change_order.status == SUBMITTED"
          - "the UnitOrder build_status NOT IN {DELIVERED, WARRANTY_ACTIVE, CANCELLED}"
          - "the resulting ApparatusProgram.committed_cents <= contract_ceiling_cents"
        side_effects:
          - "sets approved_by_user_id = X-User-ID and applied_at = current logical clock"
          - "CASCADE A hop 1: the UnitOrder recomputes change_order_total_cents (calculations.unit_change_order_total), open_change_order_count, and re-runs calculations.axle_load_distribution with the cumulative APPROVED weight deltas, refreshing front_axle_load_kg / rear_axle_load_kg / gross_weight_kg / weight_status; UnitOrder.version increments by 1"
          - "CASCADE A hop 2 (caused by hop 1's weight_status leaving WITHIN_LIMITS): certification_status CERTIFIED -> NOT_SUBMITTED and every PASSED CertificationTest for the unit -> INVALIDATED with invalidated_reason = WEIGHT_STATUS_CHANGE"
          - "CASCADE A hop 3 (caused by hop 2's certification reset): build_status FINAL_INSPECTED -> IN_PRODUCTION"
          - "CASCADE A hop 4 (caused by hop 3's build_status revert): every SCHEDULED FINAL InspectionTrip for the unit -> CANCELLED"
          - "LEDGER SYNC (caused by hop 1's change_order_total_cents): ApparatusProgram.committed_cents recomputed; if it now exceeds the 90% soft ceiling and status == ACTIVE, the program auto-transitions ACTIVE -> SUSPENDED with suspension_reason = SOFT_CEILING_BREACH; ApparatusProgram.version increments by 1"
          - "increments ChangeOrder.version by 1"

      - from: SUBMITTED
        to: REJECTED
        trigger: "POST /change-orders/{change_order_id}/reject"
        actor: PurchasingOfficer
        preconditions:
          - "change_order.status == SUBMITTED"
        side_effects:
          - "recomputes UnitOrder.open_change_order_count and increments UnitOrder.version by 1"
          - "increments ChangeOrder.version by 1"
        note: "No price or weight effect: a rejected change order never entered change_order_total_cents."

      - from: APPROVED
        to: RESCINDED
        trigger: "POST /change-orders/{change_order_id}/rescind"
        actor: PurchasingOfficer
        preconditions:
          - "change_order.status == APPROVED"
          - "the UnitOrder build_status NOT IN {DELIVERED, WARRANTY_ACTIVE, CANCELLED}"
        side_effects:
          - "COMPENSATION of CASCADE A hop 1: the UnitOrder recomputes change_order_total_cents and re-runs calculations.axle_load_distribution over the remaining APPROVED change orders, so both the money and the axle loads return to their pre-approval values"
          - "COMPENSATION LEDGER SYNC: ApparatusProgram.committed_cents recomputed to exactly its pre-approval value; if it falls back to or below the 90% soft ceiling the program stays SUSPENDED (reactivation is an explicit ProgramAdmin action)"
          - "clears approved_by_user_id and applied_at"
          - "increments ChangeOrder.version by 1, UnitOrder.version by 1 and ApparatusProgram.version by 1"
        note: "Rescission never restores an INVALIDATED CertificationTest — certification must be re-earned; only the money and weight quantities are conserved."

  - entity: CertificationTest
    dimension: status
    initial_state: SUBMITTED
    terminal_states: [FAILED, INVALIDATED]
    transitions:
      - from: SUBMITTED
        to: PASSED
        trigger: "POST /certification-tests/{certification_test_id}/record-result with result == PASS"
        actor: ThirdPartyTester
        preconditions:
          - "test.status == SUBMITTED"
          - "signed_by_user_id != the UnitOrder.weight_calc_engineer_user_id"
        side_effects:
          - "sets result = PASS, signed_by_user_id, tested_at"
          - "the UnitOrder certification_status transitions IN_TESTING -> CERTIFIED"
          - "increments CertificationTest.version by 1"

      - from: SUBMITTED
        to: FAILED
        trigger: "POST /certification-tests/{certification_test_id}/record-result with result == FAIL"
        actor: ThirdPartyTester
        preconditions:
          - "test.status == SUBMITTED"
          - "signed_by_user_id != the UnitOrder.weight_calc_engineer_user_id"
        side_effects:
          - "sets result = FAIL, signed_by_user_id, tested_at"
          - "the UnitOrder certification_status transitions IN_TESTING -> REJECTED_TESTING"
          - "increments CertificationTest.version by 1"

      - from: PASSED
        to: INVALIDATED
        trigger: "system: CASCADE A hop 2 (weight_status left WITHIN_LIMITS) or CASCADE B hop 3 (spec_drift_flag became true)"
        actor: system
        preconditions:
          - "test.status == PASSED"
        side_effects:
          - "sets invalidated_reason = WEIGHT_STATUS_CHANGE or SPEC_SUPERSEDED"
          - "increments CertificationTest.version by 1"

  - entity: WarrantyStartup
    dimension: status
    initial_state: PENDING_TRAINING
    terminal_states: [EXPIRED]
    transitions:
      - from: PENDING_TRAINING
        to: ACTIVE
        trigger: "POST /warranty-startups/{warranty_startup_id}/complete-training"
        actor: ProgramAdmin
        preconditions:
          - "warranty.status == PENDING_TRAINING"
          - "training_hours + additional_training_hours >= 16.0"
        side_effects:
          - "sets training_hours = training_hours + additional_training_hours"
          - "recomputes warranty_start_date and warranty_end_date via calculations.warranty_activation_window with the deferral removed"
          - "increments WarrantyStartup.version by 1"
        note: "Delivery ALWAYS creates the row in PENDING_TRAINING with the 30-day deferred start, whatever training_hours were booked at handover (see calculations.warranty_activation_window); complete-training is the only path to ACTIVE, and exactly 16.0 cumulative hours activates."

      - from: ACTIVE
        to: EXPIRED
        trigger: "system: POST /programs/{program_id}/ops-run observes current logical clock > warranty_end_date"
        actor: system
        preconditions:
          - "warranty.status == ACTIVE"
        side_effects:
          - "increments WarrantyStartup.version by 1"

# ==============================================================================
# §1.2.1 Concurrency Rules — OCC on the parent's `version` only
# ==============================================================================
concurrency_rules:
  - rule_id: change-order-create-stale-unit
    parent_entity: UnitOrder
    write_endpoint: "POST /change-orders"
    occ_field: "expected_unit_order_version"
    description: |
      Creating a ChangeOrder against a UnitOrder whose version has advanced
      since the client last read it is rejected. A committee rep drafts a
      change order from a weight and price baseline it observed; if an earlier
      change order was approved in the meantime (legitimately superseding that
      baseline via CASCADE A hop 1), the new draft would be priced and weighed
      against a stale unit, so the write is refused on the stale version.
    error_id: ERR_STALE_UNIT_ORDER_VERSION
    http_status: 412

  - rule_id: reservation-create-stale-slot-line
    parent_entity: SupplierSlotLine
    write_endpoint: "POST /chassis-reservations"
    occ_field: "expected_slot_line_version"
    description: |
      Creating a ChassisReservation against a SupplierSlotLine whose version
      has advanced since the client last read its available_slot_count is
      rejected. Long-lead slot holds are booked against an observed free-slot
      picture; once another reservation, release or expiry has changed that
      picture the booking decision rests on stale capacity and is refused.
    error_id: ERR_STALE_SLOT_LINE_VERSION
    http_status: 412

# ==============================================================================
# §1.3 Calculation Rules Table
# All money is integer cents. round_half_up(x) means "quantize to the stated
# unit with ROUND_HALF_UP". No calculation, selector, ordering or tie-break in
# this scaffold reads `id`; every order-sensitive rule sorts on created_at ASC.
# ==============================================================================
calculations:

  - name: unit_award_price
    trigger: "POST /unit-orders (variant award_year_locked -> UnitOrder.price_cents); POST /unit-orders/{unit_order_id}/deliver (variant delivery_year_actual -> WarrantyStartup.final_price_cents and price_variance_cents)"
    algorithm: tiered_pricing
    formula: |
      # ---- PINNED EVALUATION ORDER (the dependency only LOOKS circular) ----
      # The performance-bond rate is keyed on the SUBTOTAL, never on the total,
      # even though the fee is a component of the total. Steps run 1..7 exactly.
      #
      # 1. years_elapsed = award_year - program.base_year            # integer, >= 0
      # 2. escalated_base_cents =
      #      round_half_up( program.base_unit_price_cents
      #                     * (1 + program.escalation_index_pct_per_year / 100) ** years_elapsed )
      # 3. option_premium_cents =
      #      round_half_up(escalated_base_cents * OPTION_UNIT_PREMIUM_PCT / 100) if unit.option_unit
      #      else 0
      # 4. subtotal_cents = escalated_base_cents + option_premium_cents
      # 5. bond_rate_pct = BOND_TIER_1_RATE_PCT if subtotal_cents <= BOND_TIER_1_MAX_CENTS
      #                    else BOND_TIER_2_RATE_PCT if subtotal_cents <= BOND_TIER_2_MAX_CENTS
      #                    else BOND_TIER_3_RATE_PCT
      # 6. performance_bond_fee_cents = round_half_up(subtotal_cents * bond_rate_pct / 100)
      # 7. price_cents = subtotal_cents + performance_bond_fee_cents
      #
      # Worked reference (base_unit_price_cents=62500000, index=4.0, base_year=2024,
      # award_year=2026, option_unit=false):
      #   years=2 -> escalated=67600000 -> subtotal=67600000 -> tier 2 (1.00%)
      #   -> fee=676000 -> price_cents=68276000
      # Worked reference, same program, option_unit=true:
      #   premium=2366000 -> subtotal=69966000 -> tier 2 -> fee=699660
      #   -> price_cents=70665660
      # Boundary reference (base 50000000, index 4.0, base_year=award_year=2026):
      #   subtotal=50000000 -> tier 1 (1.25%) -> fee=625000 -> price_cents=50625000
      #   Keying the tier on the TOTAL instead would pick tier 2 and yield
      #   50500000 — a 125000-cent divergence from the pinned order.
    input_set: "exactly one UnitOrder plus its owning ApparatusProgram's base_year / base_unit_price_cents / escalation_index_pct_per_year; no sibling units participate"
    constants:
      OPTION_UNIT_PREMIUM_PCT: 3.5
      BOND_TIER_1_MAX_CENTS: 50000000
      BOND_TIER_1_RATE_PCT: 1.25
      BOND_TIER_2_MAX_CENTS: 90000000
      BOND_TIER_2_RATE_PCT: 1.00
      BOND_TIER_3_RATE_PCT: 0.75
    precision: "integer cents; round_half_up at steps 2, 3 and 6 only — never round the subtotal or the total"
    variants:
      - name: award_year_locked
        when: "at POST /unit-orders; written to UnitOrder.price_cents and frozen for the life of the unit"
        difference: "years_elapsed is the WHOLE-year difference award_year - base_year and escalation COMPOUNDS: (1 + i/100) ** years_elapsed"
      - name: delivery_year_actual
        when: "at POST /unit-orders/{unit_order_id}/deliver; written to WarrantyStartup.final_price_cents, with price_variance_cents = final_price_cents - UnitOrder.price_cents"
        difference: |
          Escalation is SIMPLE and PRO-RATA over whole months, not compounded over
          whole years: step 2 becomes
            months_elapsed = (delivery_date.year - base_year) * 12 + (delivery_date.month - 1)
            escalated_base_cents = round_half_up(base_unit_price_cents
                                   * (1 + index/100 * months_elapsed / 12))
          Steps 3..7 are unchanged. Same unit, same program: award-locked
          price_cents=68276000 vs delivery_year_actual final_price_cents=70279166
          for delivery_date 2026-11-01 (months_elapsed=34), i.e.
          price_variance_cents=2003166.

  - name: change_order_price_delta
    trigger: "POST /change-orders and POST /change-orders/{change_order_id}/revise -> ChangeOrder.price_delta_cents"
    algorithm: aggregation
    formula: |
      # ---- PINNED ROUNDING ORDER: round PER LINE ITEM, THEN SUM ----
      # Summing unrounded line values and rounding once at the end is WRONG and
      # produces a different cents figure (see worked reference below).
      #
      # price_delta_cents = 0
      # for line in line_items (iterated in request array order):
      #     line_base_cents   = line.quantity * line.unit_cost_cents
      #     line_marked_cents = round_half_up(line_base_cents * (1 + line.markup_pct / 100))
      #     line_tax_cents    = round_half_up(line_marked_cents * TAX_RATE_PCT / 100)
      #                         if line.is_taxable else 0
      #     price_delta_cents += line_marked_cents + line_tax_cents
      #
      # Worked reference (3 lines):
      #   L1 qty=3  unit=133333   markup=12.5 taxable=true
      #      base=399999   marked=449999   tax=29250  -> 479249
      #   L2 qty=7  unit=45555    markup=7.5  taxable=false
      #      base=318885   marked=342801   tax=0      -> 342801
      #   L3 qty=1  unit=1250005  markup=22.0 taxable=true
      #      base=1250005  marked=1525006  tax=99125  -> 1624131
      #   price_delta_cents = 2446181
      #   sum-then-round would give 2446182 (one cent high).
    input_set: "the line_items array of exactly this ChangeOrder, in array order; no other change order contributes"
    constants:
      TAX_RATE_PCT: 6.5
      MARKUP_CAP_PCT: 22.0
    precision: "integer cents; round_half_up twice per line item (markup, then tax) and never again"

  - name: axle_load_distribution
    trigger: "POST /unit-orders (initial computation); POST /change-orders/{change_order_id}/approve and POST /change-orders/{change_order_id}/rescind (recomputation over the cumulative APPROVED weight deltas)"
    algorithm: constraint_propagation
    formula: |
      # payload capacity is the smaller of a fixed tank/module cap and a
      # percentage of the chassis rating, with the percentage leg FLOORED:
      # payload_kg =
      #   PUMPER    : min(PUMPER_PAYLOAD_CAP_KG,    floor(gvwr_kg * PUMPER_PAYLOAD_PCT    / 100))
      #   AERIAL    : min(AERIAL_PAYLOAD_CAP_KG,    floor(gvwr_kg * AERIAL_PAYLOAD_PCT    / 100))
      #   AMBULANCE : min(AMBULANCE_PAYLOAD_CAP_KG, floor(gvwr_kg * AMBULANCE_PAYLOAD_PCT / 100))
      #
      # front_payload_kg = min(FRONT_PAYLOAD_CAP_KG,
      #                        round_half_up(payload_kg * FRONT_PAYLOAD_SHARE))
      # rear_payload_kg  = payload_kg - front_payload_kg
      #
      # co_front_kg = sum(ChangeOrder.weight_delta_front_kg
      #                   where unit_order_id == unit.id AND status == APPROVED)
      # co_rear_kg  = sum(ChangeOrder.weight_delta_rear_kg  ... same filter)
      #
      # front_axle_load_kg = base_curb_front_kg + front_payload_kg
      #                      + min(crew_seat_count, FRONT_CREW_SEAT_CAP) * CREW_MASS_KG
      #                      + co_front_kg
      # rear_axle_load_kg  = base_curb_rear_kg + rear_payload_kg
      #                      + max(crew_seat_count - FRONT_CREW_SEAT_CAP, 0) * CREW_MASS_KG
      #                      + co_rear_kg
      # gross_weight_kg    = front_axle_load_kg + rear_axle_load_kg
      #
      # ---- VERDICT, evaluated in this exact order, all comparisons STRICT ----
      # weight_status =
      #   OVER_GVWR      if gross_weight_kg      >  gvwr_kg
      #   OVER_FRONT     elif front_axle_load_kg >  front_axle_rating_kg
      #   OVER_REAR      elif rear_axle_load_kg  >  rear_axle_rating_kg
      #   WITHIN_LIMITS  otherwise
      # A load exactly EQUAL to its rating is WITHIN_LIMITS.
      #
      # Worked reference (PUMPER, gvwr=17000, curb 5200/7000, crew_seat_count=4,
      # ratings front=6800 rear=10110, no approved change orders):
      #   payload=min(3400, floor(17000*28/100)=4760)=3400
      #   front_payload=min(450, round_half_up(3400*0.25)=850)=450 ; rear_payload=2950
      #   front=5200+450+2*80=5810 ; rear=7000+2950+2*80=10110 ; gross=15920
      #   rear_axle_load_kg == rear_axle_rating_kg exactly -> WITHIN_LIMITS
      #   With one APPROVED change order carrying weight_delta_rear_kg=+1:
      #   rear=10111 > 10110 -> OVER_REAR (gross 15921 still <= gvwr)
    input_set: "the UnitOrder's own input fields plus ChangeOrder rows for that unit with status == APPROVED only; DRAFT, SUBMITTED, IN_NEGOTIATION, REJECTED and RESCINDED change orders are excluded"
    constants:
      PUMPER_PAYLOAD_CAP_KG: 3400
      PUMPER_PAYLOAD_PCT: 28
      AERIAL_PAYLOAD_CAP_KG: 1800
      AERIAL_PAYLOAD_PCT: 12
      AMBULANCE_PAYLOAD_CAP_KG: 900
      AMBULANCE_PAYLOAD_PCT: 20
      FRONT_PAYLOAD_CAP_KG: 450
      FRONT_PAYLOAD_SHARE: 0.25
      CREW_MASS_KG: 80
      FRONT_CREW_SEAT_CAP: 2
    precision: "whole kilograms; floor on the percentage leg, round_half_up on the front payload share, no other rounding"

  - name: unit_change_order_total
    trigger: "POST /change-orders/{change_order_id}/approve and POST /change-orders/{change_order_id}/rescind -> UnitOrder.change_order_total_cents"
    algorithm: aggregation
    formula: |
      # change_order_total_cents =
      #   sum(ChangeOrder.price_delta_cents
      #       where unit_order_id == unit.id AND status == APPROVED)
      # Empty set -> 0. Integer cents, no rounding (all addends are already cents).
    input_set: "ChangeOrder rows for the unit with status == APPROVED only; RESCINDED rows leave the set, which is what makes rescission exactly compensating"
    constants: {}
    precision: "integer cents, order-insensitive integer addition"

  - name: program_committed_cents
    trigger: "POST /unit-orders, POST /unit-orders/{unit_order_id}/cancel, POST /change-orders/{change_order_id}/approve, POST /change-orders/{change_order_id}/rescind, POST /programs/{program_id}/ops-run -> ApparatusProgram.committed_cents"
    algorithm: aggregation
    formula: |
      # committed_cents =
      #   sum(unit.price_cents + unit.change_order_total_cents
      #       for unit in UnitOrder
      #       where unit.program_id == program.id
      #         AND unit.build_status IN {SPEC_LOCKED, PRE_CON_HELD, IN_PRODUCTION,
      #                                  MID_CON_HELD, FINAL_INSPECTED, DELIVERED,
      #                                  WARRANTY_ACTIVE})
      # CANCELLED units are the only excluded status. Empty set -> 0.
      # WarrantyStartup.price_variance_cents is deliberately NOT part of this sum.
      #
      # soft_ceiling_cents = round_half_up(contract_ceiling_cents * CEILING_SOFT_PCT / 100)
      # committed_cents >  soft_ceiling_cents  -> auto ACTIVE -> SUSPENDED
      # committed_cents >  contract_ceiling_cents -> the triggering write is
      #                     rejected with ERR_CONTRACT_CEILING_EXCEEDED and
      #                     nothing is persisted
      # committed_cents == soft_ceiling_cents exactly -> NO suspension (strict >)
    input_set: "all UnitOrder rows of the program except build_status == CANCELLED; window is 'as of the end of the current request', boundary inclusive of rows created earlier in the same request"
    constants:
      CEILING_SOFT_PCT: 90
    precision: "integer cents; round_half_up only when deriving soft_ceiling_cents"

  - name: slot_line_utilization
    trigger: "POST /chassis-reservations, POST /chassis-reservations/{reservation_id}/release, POST /unit-orders/{unit_order_id}/start-production, POST /unit-orders/{unit_order_id}/cancel, POST /programs/{program_id}/ops-run -> SupplierSlotLine.reserved_slot_count and available_slot_count"
    algorithm: aggregation
    formula: |
      # reserved_slot_count =
      #   count(ChassisReservation
      #         where slot_line_id == line.id
      #           AND status IN {RESERVED, CONFIRMED, CONSUMED})
      # available_slot_count = total_slot_count - reserved_slot_count
      # RELEASED and EXPIRED reservations leave the occupied set, which is what
      # makes release/expiry exactly compensating against reserve.
      # available_slot_count is a conserved quantity and MUST never go negative:
      # a create attempt while available_slot_count == 0 is rejected with
      # ERR_SLOT_LINE_EXHAUSTED (strict zero boundary).
    input_set: "ChassisReservation rows on this slot line with status IN {RESERVED, CONFIRMED, CONSUMED}; all other statuses excluded"
    constants: {}
    precision: "whole slots, integer counting"

  - name: bay_concurrent_load
    trigger: "POST /inspection-trips (capacity admission check on PlantBay)"
    algorithm: interval_merge
    formula: |
      # ---- CLOSED intervals, AGGREGATE capacity ----
      # Two trips collide when their CLOSED windows intersect; touching
      # endpoints DO intersect (existing.scheduled_end == new.scheduled_start
      # is a collision):
      #   intersects(a, b) := a.scheduled_start <= b.scheduled_end
      #                       AND b.scheduled_start <= a.scheduled_end
      #
      # occupied = sum(t.committee_size
      #                for t in InspectionTrip
      #                where t.plant_bay_id == new.plant_bay_id
      #                  AND t.status IN {SCHEDULED, HELD}
      #                  AND intersects(t, new))
      # admitted  iff  occupied + new.committee_size <= bay.max_concurrent_visitors
      # otherwise -> ERR_BAY_CAPACITY_EXCEEDED
      # Pairwise overlap alone is NOT a conflict — only the aggregate sum is.
      # Exact equality with max_concurrent_visitors is admitted (<=).
    input_set: "InspectionTrip rows on the same plant_bay_id with status IN {SCHEDULED, HELD}; CANCELLED trips are excluded, which is why cancelling a trip frees capacity"
    constants: {}
    precision: "whole visitors; datetimes compared at second resolution in UTC"

  - name: slot_window_conflict
    trigger: "POST /chassis-reservations (window admission check on SupplierSlotLine)"
    algorithm: interval_merge
    formula: |
      # ---- HALF-OPEN intervals, PAIRWISE, with a changeover BUFFER ----
      # The existing window is inflated by the line's changeover_buffer_days on
      # BOTH sides before the half-open comparison:
      #   inflated_start = existing.slot_start_date - changeover_buffer_days days
      #   inflated_end   = existing.slot_end_date   + changeover_buffer_days days
      #   conflict := new.slot_start_date < inflated_end
      #               AND inflated_start < new.slot_end_date
      # Any conflict with ANY single existing reservation whose status IN
      # {RESERVED, CONFIRMED, CONSUMED} on the same slot_line_id rejects the
      # write with ERR_SLOT_WINDOW_CONFLICT. Aggregate capacity is irrelevant
      # here; a single geometric collision is fatal.
      # With the default changeover_buffer_days = 7, back-to-back windows
      # (new.slot_start_date == existing.slot_end_date) DO conflict; the first
      # admissible start is existing.slot_end_date + 7 days.
    input_set: "ChassisReservation rows on the same slot_line_id with status IN {RESERVED, CONFIRMED, CONSUMED}; RELEASED and EXPIRED windows impose no buffer"
    constants: {}
    precision: "day-resolution arithmetic on UTC datetimes; buffer added as whole days"

  - name: compliance_readiness_score
    trigger: "POST /compliance-entries, POST /compliance-entries/{compliance_entry_id}/dispose, POST /specifications/{specification_id}/clauses, POST /specifications/{specification_id}/submit-review -> BidSpecification.compliance_score_strict and compliance_score_provisional"
    algorithm: weighted_scoring
    formula: |
      # weight(clause) = MANDATORY_CLAUSE_WEIGHT if clause.mandatory
      #                  else OPTIONAL_CLAUSE_WEIGHT
      # total_weight = sum(weight(c) for c in SpecClause where specification_id == spec.id)
      # For each clause, entry = the single ComplianceMatrixEntry with
      #   (specification_id == spec.id AND clause_id == c.id); a clause with no
      #   entry is NON-COMPLIANT in both variants.
      # compliant_weight = sum(weight(c) for c where compliant(entry) is true)
      # score = round_half_up(100 * compliant_weight / total_weight, 2)
      # total_weight == 0  ->  score = 0.00 (pinned; never divide by zero)
      #
      # Worked reference (C1 mandatory COMPLY, C2 mandatory EXCEPTION/PENDING,
      # C3 optional ALTERNATE/ACCEPTED, C4 optional with no entry):
      #   total_weight = 3+3+1+1 = 8
      #   strict      : C1 + C3 = 4  -> 50.00
      #   provisional : C1 + C2 + C3 = 7 -> 87.50
    input_set: "every SpecClause of the specification (no status filter — clauses have no lifecycle) and, per clause, its at-most-one ComplianceMatrixEntry with disposition IN {PENDING, ACCEPTED, REJECTED, VOID}; a VOID entry counts as non-compliant in both variants"
    constants:
      MANDATORY_CLAUSE_WEIGHT: 3
      OPTIONAL_CLAUSE_WEIGHT: 1
      RELEASE_MIN_STRICT_SCORE: 75.00
    precision: "2 decimal places, round_half_up"
    variants:
      - name: strict
        when: "always recomputed into compliance_score_strict; this is the ONLY variant the release gate reads (>= 75.00)"
        difference: "compliant(entry) := entry.response == COMPLY OR (entry.response IN {EXCEPTION, ALTERNATE} AND entry.disposition == ACCEPTED). A PENDING exception counts as NON-compliant."
      - name: provisional
        when: "always recomputed into compliance_score_provisional; reported to the purchasing department as the optimistic view and never gates anything"
        difference: "compliant(entry) := entry.response == COMPLY OR (entry.response IN {EXCEPTION, ALTERNATE} AND entry.disposition IN {PENDING, ACCEPTED}). A PENDING exception counts as compliant, so provisional >= strict always, and the two diverge by exactly the weight of the PENDING exception clauses."

  - name: restrictive_clause_ratio
    trigger: "POST /specifications/{specification_id}/clauses and POST /specifications/{specification_id}/submit-review -> BidSpecification.restrictive_clause_ratio_pct"
    algorithm: threshold
    formula: |
      # mandatory_clauses  = [c for c in SpecClause where specification_id == spec.id
      #                       AND c.mandatory == true]
      # restrictive_count  = count(c in mandatory_clauses where c.is_restrictive == true)
      # if len(mandatory_clauses) == 0:
      #     restrictive_clause_ratio_pct = 0.00          # PINNED empty-set value
      # else:
      #     restrictive_clause_ratio_pct =
      #         round_half_up(100 * restrictive_count / len(mandatory_clauses), 2)
      # Release gate: ratio > RESTRICTIVE_RATIO_MAX_PCT rejects with
      # ERR_RESTRICTIVE_CLAUSE_RATIO_EXCEEDED. Exactly 40.00 is ADMITTED.
      # Optional clauses never enter either numerator or denominator, even when
      # is_restrictive is true.
    input_set: "SpecClause rows of the specification with mandatory == true only"
    constants:
      RESTRICTIVE_RATIO_MAX_PCT: 40.00
    precision: "2 decimal places, round_half_up"

  - name: warranty_activation_window
    trigger: "POST /unit-orders/{unit_order_id}/deliver and POST /warranty-startups/{warranty_startup_id}/complete-training -> WarrantyStartup.status, warranty_start_date, warranty_end_date"
    algorithm: threshold
    formula: |
      # ---- the status branch is reachable only from complete-training ----
      # At POST /unit-orders/{unit_order_id}/deliver the row is ALWAYS created
      # in PENDING_TRAINING with the deferred start, whatever training_hours
      # were booked at handover:
      #     status              = PENDING_TRAINING
      #     warranty_start_date = delivery_date + WARRANTY_DEFERRAL_DAYS days
      # At POST /warranty-startups/{warranty_startup_id}/complete-training,
      # evaluated AFTER training_hours += additional_training_hours:
      #     if training_hours >= REQUIRED_TRAINING_HOURS:  # inclusive boundary
      #         status              = ACTIVE
      #         warranty_start_date = delivery_date
      #     else:
      #         the call is rejected with ERR_TRAINING_HOURS_NOT_MET and the
      #         row keeps status PENDING_TRAINING and its deferred start
      # warranty_end_date = warranty_start_date + warranty_months calendar months
      #                     (same day-of-month; day clamped to the last day of the
      #                      target month when it does not exist)
      # complete-training re-runs this rule with the accumulated training_hours,
      # so a record that crosses the threshold gets warranty_start_date pulled
      # back to delivery_date and warranty_end_date recomputed from it.
      # Exactly 16.0 cumulative hours activates and pulls the start back to
      # delivery_date; 15.9 is rejected and the start stays deferred 30 days.
    input_set: "the single WarrantyStartup row being created or updated"
    constants:
      REQUIRED_TRAINING_HOURS: 16.0
      WARRANTY_DEFERRAL_DAYS: 30
    precision: "whole days on date arithmetic; training_hours compared as a decimal with one fractional digit"

# ==============================================================================
# §1.4 Validation Rules Table (evaluated in ascending priority; first failure
# wins and nothing is persisted). Domain ordering: identity -> request shape ->
# existence -> scope -> optimistic concurrency -> own state -> cross-entity
# state -> referential integrity -> SAFETY/compliance -> temporal -> capacity
# and constraint -> FISCAL last.
# ==============================================================================
validations:

  - priority: 1
    category: auth
    check: "X-User-Role and X-User-ID headers are both present and X-User-Role is one of the five §1.7 roles"
    error_id: ERR_MISSING_AUTH_HEADERS
    http_status: 401
    applies_to: all

  - priority: 2
    category: auth
    check: "the acting role appears in the endpoint's roles list in §1.5"
    error_id: ERR_ROLE_NOT_PERMITTED
    http_status: 403
    applies_to: all

  - priority: 3
    category: business_constraint
    check: "request body shape: every required input field present, types correct, enum members valid, numeric fields inside their §1.1 constraints, line_items has 1..12 elements with quantity >= 1 and unit_cost_cents >= 0, limit in 1..100 and offset >= 0"
    error_id: ERR_INVALID_REQUEST
    http_status: 400
    applies_to: "all write endpoints and all list endpoints with pagination parameters"

  - priority: 4
    category: existence
    check: "every path id resolves, validated left to right"
    error_id: "ERR_PROGRAM_NOT_FOUND | ERR_SPECIFICATION_NOT_FOUND | ERR_COMPLIANCE_ENTRY_NOT_FOUND | ERR_UNIT_ORDER_NOT_FOUND | ERR_SLOT_LINE_NOT_FOUND | ERR_RESERVATION_NOT_FOUND | ERR_INSPECTION_TRIP_NOT_FOUND | ERR_CHANGE_ORDER_NOT_FOUND | ERR_CERTIFICATION_TEST_NOT_FOUND | ERR_WARRANTY_STARTUP_NOT_FOUND"
    http_status: 404
    applies_to: "all endpoints with path parameters"

  - priority: 5
    category: existence
    check: "every foreign key in the request body resolves: program_id, specification_id, supersedes_spec_id, clause_id, unit_order_id, slot_line_id, plant_bay_id, inspection_trip_id"
    error_id: "ERR_PROGRAM_NOT_FOUND | ERR_SPECIFICATION_NOT_FOUND | ERR_CLAUSE_NOT_FOUND | ERR_UNIT_ORDER_NOT_FOUND | ERR_SLOT_LINE_NOT_FOUND | ERR_PLANT_BAY_NOT_FOUND | ERR_INSPECTION_TRIP_NOT_FOUND"
    http_status: 404
    applies_to: "POST /specifications, POST /compliance-entries, POST /unit-orders, POST /chassis-reservations, POST /inspection-trips, POST /change-orders, POST /certification-tests"

  - priority: 6
    category: auth
    check: "when X-User-Role == CustomerCommitteeRep, X-User-ID equals the ApparatusProgram.id reached from the target resource (InspectionTrip -> UnitOrder.program_id, ChangeOrder -> UnitOrder.program_id, UnitOrder.program_id directly)"
    error_id: ERR_COMMITTEE_SCOPE_VIOLATION
    http_status: 403
    applies_to: "POST /inspection-trips/{inspection_trip_id}/hold, POST /inspection-trips/{inspection_trip_id}/cancel, POST /change-orders, POST /change-orders/{change_order_id}/submit, POST /change-orders/{change_order_id}/revise"

  - priority: 7
    category: state
    check: "expected_unit_order_version equals the current UnitOrder.version"
    error_id: ERR_STALE_UNIT_ORDER_VERSION
    http_status: 412
    applies_to: "POST /change-orders"

  - priority: 8
    category: state
    check: "expected_slot_line_version equals the current SupplierSlotLine.version"
    error_id: ERR_STALE_SLOT_LINE_VERSION
    http_status: 412
    applies_to: "POST /chassis-reservations"

  - priority: 9
    category: state
    check: "the ApparatusProgram is in the state the requested transition allows (activate: DRAFT, suspend: ACTIVE, reactivate: SUSPENDED, close: ACTIVE, ops-run: ACTIVE or SUSPENDED)"
    error_id: ERR_INVALID_PROGRAM_STATE
    http_status: 409
    applies_to: "POST /programs/{program_id}/activate, /suspend, /reactivate, /close, /ops-run"

  - priority: 10
    category: state
    check: "the BidSpecification is in the state the operation allows (add clause: DRAFT, submit-review: DRAFT, rework: UNDER_REVIEW, release: UNDER_REVIEW)"
    error_id: ERR_INVALID_SPEC_STATE
    http_status: 409
    applies_to: "POST /specifications/{specification_id}/clauses, /submit-review, /rework, /release, POST /compliance-entries"

  - priority: 11
    category: state
    check: "the ComplianceMatrixEntry has disposition == PENDING and its parent specification is DRAFT"
    error_id: ERR_INVALID_ENTRY_STATE
    http_status: 409
    applies_to: "POST /compliance-entries/{compliance_entry_id}/dispose"

  - priority: 12
    category: state
    check: "the UnitOrder build_status permits the operation (start-production: PRE_CON_HELD, final-inspection: MID_CON_HELD, deliver: FINAL_INSPECTED, cancel: SPEC_LOCKED or PRE_CON_HELD)"
    error_id: ERR_INVALID_BUILD_STATE
    http_status: 409
    applies_to: "POST /unit-orders/{unit_order_id}/start-production, /final-inspection, /deliver, /cancel"

  - priority: 13
    category: state
    check: "the UnitOrder is still amendable: build_status NOT IN {DELIVERED, WARRANTY_ACTIVE, CANCELLED}"
    error_id: ERR_UNIT_NOT_AMENDABLE
    http_status: 409
    applies_to: "POST /change-orders, POST /change-orders/{change_order_id}/submit, /negotiate, /revise, /approve, /rescind"

  - priority: 14
    category: state
    check: "the UnitOrder certification_status permits submitting a new test: NOT_SUBMITTED or REJECTED_TESTING"
    error_id: ERR_INVALID_CERTIFICATION_STATE
    http_status: 409
    applies_to: "POST /certification-tests"

  - priority: 15
    category: state
    check: "the CertificationTest has status == SUBMITTED"
    error_id: ERR_INVALID_TEST_STATE
    http_status: 409
    applies_to: "POST /certification-tests/{certification_test_id}/record-result"

  - priority: 16
    category: state
    check: "the ChassisReservation status permits the operation (confirm: RESERVED, release: RESERVED or CONFIRMED)"
    error_id: ERR_INVALID_RESERVATION_STATE
    http_status: 409
    applies_to: "POST /chassis-reservations/{reservation_id}/confirm, /release"

  - priority: 17
    category: state
    check: "the ChassisReservation has a non-null unit_order_id before it can be confirmed"
    error_id: ERR_RESERVATION_UNASSIGNED
    http_status: 409
    applies_to: "POST /chassis-reservations/{reservation_id}/confirm"

  - priority: 18
    category: state
    check: "the InspectionTrip has status == SCHEDULED"
    error_id: ERR_INVALID_TRIP_STATE
    http_status: 409
    applies_to: "POST /inspection-trips/{inspection_trip_id}/hold, /cancel"

  - priority: 19
    category: state
    check: "the ChangeOrder is in the state the transition allows (submit: DRAFT, negotiate: SUBMITTED, revise: IN_NEGOTIATION, approve: SUBMITTED, reject: SUBMITTED, rescind: APPROVED)"
    error_id: ERR_INVALID_CHANGE_ORDER_STATE
    http_status: 409
    applies_to: "POST /change-orders/{change_order_id}/submit, /negotiate, /revise, /approve, /reject, /rescind"

  - priority: 20
    category: state
    check: "the WarrantyStartup has status == PENDING_TRAINING"
    error_id: ERR_INVALID_WARRANTY_STATE
    http_status: 409
    applies_to: "POST /warranty-startups/{warranty_startup_id}/complete-training"

  - priority: 21
    category: state
    check: "CROSS-ENTITY (UnitOrder -> ApparatusProgram): the owning program has status == ACTIVE"
    error_id: ERR_PROGRAM_NOT_ACTIVE
    http_status: 409
    applies_to: "POST /unit-orders, POST /unit-orders/{unit_order_id}/start-production"

  - priority: 22
    category: state
    check: "CROSS-ENTITY (UnitOrder -> ChassisReservation): unit.chassis_reservation_id is not null and that reservation has status == CONFIRMED"
    error_id: ERR_CHASSIS_NOT_CONFIRMED
    http_status: 409
    applies_to: "POST /unit-orders/{unit_order_id}/start-production"

  - priority: 23
    category: state
    check: "CROSS-ENTITY (CertificationTest -> InspectionTrip): an InspectionTrip exists for the unit with trip_type == MID_CONSTRUCTION and status == HELD"
    error_id: ERR_MID_CON_INSPECTION_NOT_HELD
    http_status: 409
    applies_to: "POST /certification-tests"

  - priority: 24
    category: business_referential
    check: "test_standard matches unit_type: PUMPER -> NFPA_1901, AERIAL -> NFPA_1911, AMBULANCE -> NFPA_1917 or AMD_STD_003"
    error_id: ERR_TEST_STANDARD_MISMATCH
    http_status: 422
    applies_to: "POST /certification-tests"

  - priority: 25
    category: state
    check: "CROSS-ENTITY (ChangeOrder -> InspectionTrip): the referenced InspectionTrip has status == HELD"
    error_id: ERR_INSPECTION_TRIP_NOT_HELD
    http_status: 409
    applies_to: "POST /change-orders/{change_order_id}/submit"

  - priority: 26
    category: business_referential
    check: "the referenced InspectionTrip.unit_order_id equals the request's unit_order_id"
    error_id: ERR_TRIP_UNIT_MISMATCH
    http_status: 422
    applies_to: "POST /change-orders"

  - priority: 27
    category: business_referential
    check: "the pinned BidSpecification has status == RELEASED"
    error_id: ERR_SPEC_NOT_RELEASED
    http_status: 409
    applies_to: "POST /unit-orders"

  - priority: 28
    category: business_referential
    check: "the referenced specification's program_id equals the request program_id (POST /unit-orders) or the predecessor's program_id equals the successor's (POST /specifications/{specification_id}/release)"
    error_id: ERR_SPEC_PROGRAM_MISMATCH
    http_status: 422
    applies_to: "POST /unit-orders, POST /specifications/{specification_id}/release"

  - priority: 29
    category: business_referential
    check: "when supersedes_spec_id is not null, that predecessor has status == RELEASED"
    error_id: ERR_PREDECESSOR_NOT_RELEASED
    http_status: 409
    applies_to: "POST /specifications/{specification_id}/release"

  - priority: 30
    category: business_referential
    check: "when unit_order_id is supplied, that UnitOrder.program_id equals the reservation's program_id"
    error_id: ERR_RESERVATION_UNIT_MISMATCH
    http_status: 422
    applies_to: "POST /chassis-reservations"

  - priority: 31
    category: business_safety
    check: "SAFETY: the unit's weight_status == WITHIN_LIMITS (no axle or GVWR overload may leave the plant or pass final inspection)"
    error_id: ERR_AXLE_LOAD_EXCEEDED
    http_status: 422
    applies_to: "POST /unit-orders/{unit_order_id}/final-inspection, POST /unit-orders/{unit_order_id}/deliver"

  - priority: 32
    category: business_safety
    check: "SAFETY: the unit's certification_status == CERTIFIED"
    error_id: ERR_CERTIFICATION_NOT_PASSED
    http_status: 409
    applies_to: "POST /unit-orders/{unit_order_id}/final-inspection"

  - priority: 33
    category: business_safety
    check: "SEGREGATION OF DUTIES: on release, X-User-ID != specification.authored_by_user_id; on record-result, signed_by_user_id != the UnitOrder.weight_calc_engineer_user_id"
    error_id: ERR_SEGREGATION_OF_DUTIES
    http_status: 403
    applies_to: "POST /specifications/{specification_id}/release, POST /certification-tests/{certification_test_id}/record-result"

  - priority: 34
    category: business_constraint
    check: "the unit has open_change_order_count == 0 (no DRAFT / SUBMITTED / IN_NEGOTIATION change order may be outstanding)"
    error_id: ERR_OPEN_CHANGE_ORDERS
    http_status: 409
    applies_to: "POST /unit-orders/{unit_order_id}/final-inspection, POST /unit-orders/{unit_order_id}/cancel"

  - priority: 35
    category: business_temporal
    check: "slot_end_date > slot_start_date and expiry_at > slot_start_date"
    error_id: ERR_INVALID_SLOT_WINDOW
    http_status: 422
    applies_to: "POST /chassis-reservations"

  - priority: 36
    category: business_temporal
    check: "scheduled_end > scheduled_start"
    error_id: ERR_INVALID_TRIP_WINDOW
    http_status: 422
    applies_to: "POST /inspection-trips"

  - priority: 37
    category: business_temporal
    check: "delivery_date >= the scheduled_end of this unit's HELD MID_CONSTRUCTION InspectionTrip"
    error_id: ERR_DELIVERY_BEFORE_MID_CON
    http_status: 422
    applies_to: "POST /unit-orders/{unit_order_id}/deliver"

  - priority: 38
    category: business_constraint
    check: "calculations.slot_window_conflict finds no colliding reservation on the slot line (half-open windows inflated by changeover_buffer_days)"
    error_id: ERR_SLOT_WINDOW_CONFLICT
    http_status: 409
    applies_to: "POST /chassis-reservations"

  - priority: 39
    category: business_constraint
    check: "calculations.slot_line_utilization leaves available_slot_count >= 1 before the new reservation is written"
    error_id: ERR_SLOT_LINE_EXHAUSTED
    http_status: 409
    applies_to: "POST /chassis-reservations"

  - priority: 40
    category: business_constraint
    check: "calculations.bay_concurrent_load admits the trip: occupied + committee_size <= bay.max_concurrent_visitors over closed intersecting windows"
    error_id: ERR_BAY_CAPACITY_EXCEEDED
    http_status: 409
    applies_to: "POST /inspection-trips"

  - priority: 41
    category: business_constraint
    check: "no other InspectionTrip for the same unit_order_id with the same trip_type already has status == HELD"
    error_id: ERR_TRIP_TYPE_ALREADY_HELD
    http_status: 409
    applies_to: "POST /inspection-trips/{inspection_trip_id}/hold"

  - priority: 42
    category: business_constraint
    check: "clause_code is unique within the specification"
    error_id: ERR_DUPLICATE_CLAUSE_CODE
    http_status: 409
    applies_to: "POST /specifications/{specification_id}/clauses"

  - priority: 43
    category: business_constraint
    check: "at most one ComplianceMatrixEntry per (specification_id, clause_id) pair, and the clause belongs to that specification"
    error_id: ERR_DUPLICATE_COMPLIANCE_ENTRY
    http_status: 409
    applies_to: "POST /compliance-entries"

  - priority: 44
    category: business_constraint
    check: "specification.clause_count >= 1 (an empty specification can neither enter review nor be released)"
    error_id: ERR_SPEC_HAS_NO_CLAUSES
    http_status: 422
    applies_to: "POST /specifications/{specification_id}/submit-review, POST /specifications/{specification_id}/release"

  - priority: 45
    category: business_constraint
    check: "specification.restrictive_clause_ratio_pct <= 40.00 (competitive-bidding gate; exactly 40.00 passes)"
    error_id: ERR_RESTRICTIVE_CLAUSE_RATIO_EXCEEDED
    http_status: 422
    applies_to: "POST /specifications/{specification_id}/release"

  - priority: 46
    category: business_constraint
    check: "specification.compliance_score_strict >= 75.00 (exactly 75.00 passes; the provisional score is never consulted)"
    error_id: ERR_SPEC_COMPLIANCE_BELOW_THRESHOLD
    http_status: 422
    applies_to: "POST /specifications/{specification_id}/release"

  - priority: 47
    category: business_constraint
    check: "every line item has markup_pct <= 22.0"
    error_id: ERR_MARKUP_CAP_EXCEEDED
    http_status: 422
    applies_to: "POST /change-orders, POST /change-orders/{change_order_id}/revise"

  - priority: 48
    category: business_constraint
    check: "when option_unit == true, program.options_exercised_count < program.max_option_units"
    error_id: ERR_OPTION_LIMIT_EXCEEDED
    http_status: 409
    applies_to: "POST /unit-orders"

  - priority: 49
    category: business_constraint
    check: "training_hours + additional_training_hours >= 16.0"
    error_id: ERR_TRAINING_HOURS_NOT_MET
    http_status: 422
    applies_to: "POST /warranty-startups/{warranty_startup_id}/complete-training"

  - priority: 50
    category: business_constraint
    check: "every UnitOrder of the program has build_status IN {WARRANTY_ACTIVE, CANCELLED}"
    error_id: ERR_UNITS_NOT_TERMINAL
    http_status: 409
    applies_to: "POST /programs/{program_id}/close"

  - priority: 51
    category: business_constraint
    check: "committed_cents <= round_half_up(contract_ceiling_cents * 90 / 100) before a program may leave SUSPENDED"
    error_id: ERR_SOFT_CEILING_STILL_BREACHED
    http_status: 409
    applies_to: "POST /programs/{program_id}/reactivate"

  - priority: 52
    category: business_fiscal
    check: "FISCAL (last): the resulting ApparatusProgram.committed_cents <= contract_ceiling_cents"
    error_id: ERR_CONTRACT_CEILING_EXCEEDED
    http_status: 409
    applies_to: "POST /unit-orders, POST /change-orders/{change_order_id}/approve"

  - priority: 53
    category: business_fiscal
    check: "program.base_year <= award_year <= program.base_year + 5"
    error_id: ERR_ESCALATION_YEAR_OUT_OF_RANGE
    http_status: 422
    applies_to: "POST /unit-orders"

# ==============================================================================
# §1.5 API Endpoint Table. Flat collection surface (api_prefix "/"): every
# entity owns a root collection, so every FK is reverse-reachable through its
# child's filtered list. Reads are shared by all five roles; every write is
# gated by §1.7. `POST /programs/{program_id}/ops-run` is the only clock-driven
# batch and `POST /_clock/set_current_utc` is the only test-driving endpoint.
# ==============================================================================
endpoints:

  # ---- test-driving: logical clock -----------------------------------------
  - method: POST
    path: "/_clock/set_current_utc"
    description: "Sets the server's logical clock, which every deadline, expiry and window rule reads instead of wall-clock time. Before the first call the logical clock reads exactly 2026-08-01T00:00:00Z (the mandatory startup default) and MUST NOT fall back to real wall-clock time. Moving the clock never itself transitions anything: expiry and warranty sweeps only occur when POST /programs/{program_id}/ops-run runs."
    roles: [ProgramAdmin, PurchasingOfficer, BodyEngineer, ThirdPartyTester, CustomerCommitteeRep]
    code: 200
    input: [current_utc]
    output: { current_utc: datetime }
    side_effects:
      - "replaces the logical clock value used by calculations.warranty_activation_window, reservation expiry and ops-run sweeps"

  # ---- ApparatusProgram ----------------------------------------------------
  - method: POST
    path: "/programs"
    description: "Opens a multi-year apparatus program in DRAFT with its escalation basis and contract ceiling."
    roles: [ProgramAdmin]
    code: 201
    input: [name, agency_name, base_year, base_unit_price_cents, escalation_index_pct_per_year, max_option_units, contract_ceiling_cents]
    output: ApparatusProgram
    side_effects:
      - "status = DRAFT, options_exercised_count = 0, committed_cents = 0, suspension_reason = null"

  - method: GET
    path: "/programs"
    description: "Lists programs, newest last (created_at ASC), with optional status filter."
    roles: [ProgramAdmin, PurchasingOfficer, BodyEngineer, ThirdPartyTester, CustomerCommitteeRep]
    code: 200
    input: ["status?", "limit?", "offset?"]
    output: ApparatusProgram[]
    side_effects: []

  - method: GET
    path: "/programs/{program_id}"
    description: "Reads one program including its live committed_cents ledger field."
    roles: [ProgramAdmin, PurchasingOfficer, BodyEngineer, ThirdPartyTester, CustomerCommitteeRep]
    code: 200
    input: []
    output: ApparatusProgram
    side_effects: []

  - method: POST
    path: "/programs/{program_id}/activate"
    description: "DRAFT -> ACTIVE. Only an ACTIVE program may take unit orders or start production."
    roles: [ProgramAdmin]
    code: 200
    input: []
    output: ApparatusProgram
    side_effects:
      - "status = ACTIVE"
      - "increments ApparatusProgram.version by 1"

  - method: POST
    path: "/programs/{program_id}/suspend"
    description: "ACTIVE -> SUSPENDED by an administrator; suspension_reason = MANUAL."
    roles: [ProgramAdmin]
    code: 200
    input: []
    output: ApparatusProgram
    side_effects:
      - "status = SUSPENDED, suspension_reason = MANUAL"
      - "increments ApparatusProgram.version by 1"

  - method: POST
    path: "/programs/{program_id}/reactivate"
    description: "SUSPENDED -> ACTIVE. Rejected while committed_cents still exceeds the soft ceiling (90% of contract_ceiling_cents), regardless of why the program was suspended."
    roles: [ProgramAdmin]
    code: 200
    input: []
    output: ApparatusProgram
    side_effects:
      - "status = ACTIVE, suspension_reason = null"
      - "increments ApparatusProgram.version by 1"

  - method: POST
    path: "/programs/{program_id}/close"
    description: "ACTIVE -> CLOSED (terminal). Requires every UnitOrder of the program to be WARRANTY_ACTIVE or CANCELLED."
    roles: [ProgramAdmin]
    code: 200
    input: []
    output: ApparatusProgram
    side_effects:
      - "status = CLOSED"
      - "increments ApparatusProgram.version by 1"

  - method: POST
    path: "/programs/{program_id}/ops-run"
    description: "Deterministic clock sweep for one program, processing rows in created_at ASC order: (1) ChassisReservation RESERVED -> EXPIRED where expiry_at <= now, applying the same slot-count and long-lead side effects as a release; (2) WarrantyStartup ACTIVE with warranty_start_date <= now drives its UnitOrder DELIVERED -> WARRANTY_ACTIVE; (3) WarrantyStartup ACTIVE -> EXPIRED where now > warranty_end_date; (4) recomputes calculations.program_committed_cents and applies the soft-ceiling auto-suspension."
    roles: [ProgramAdmin]
    code: 200
    input: []
    output: { program_id: string, expired_reservation_count: integer, warranty_activated_count: integer, warranty_expired_count: integer, committed_cents: integer, program_status: string }
    side_effects:
      - "ChassisReservation RESERVED -> EXPIRED for expired rows; SupplierSlotLine.reserved_slot_count / available_slot_count recomputed"
      - "UnitOrder.long_lead_status = AT_RISK and chassis_reservation_id = null for units whose reservation expired; their SCHEDULED PRE_CONSTRUCTION trips are CANCELLED"
      - "UnitOrder DELIVERED -> WARRANTY_ACTIVE once its WarrantyStartup is ACTIVE and started"
      - "WarrantyStartup ACTIVE -> EXPIRED past warranty_end_date"
      - "ApparatusProgram.committed_cents recomputed; ACTIVE -> SUSPENDED with suspension_reason = SOFT_CEILING_BREACH when the soft ceiling is exceeded"
      - "increments ApparatusProgram.version by 1"

  # ---- BidSpecification ----------------------------------------------------
  - method: POST
    path: "/specifications"
    description: "Drafts a bid specification for a program. authored_by_user_id is pinned to X-User-ID and is the identity the segregation-of-duties gate on release compares against. supersedes_spec_id names the RELEASED revision this draft is intended to replace."
    roles: [PurchasingOfficer]
    code: 201
    input: [program_id, title, "supersedes_spec_id?"]
    output: BidSpecification
    side_effects:
      - "status = DRAFT, revision_number = 1, authored_by_user_id = X-User-ID"
      - "clause_count = 0, mandatory_clause_count = 0, compliance_score_strict = 0.00, compliance_score_provisional = 0.00, restrictive_clause_ratio_pct = 0.00"

  - method: GET
    path: "/specifications"
    description: "Lists bid specifications in created_at ASC order. supersedes_spec_id filters to the successors of one revision."
    roles: [ProgramAdmin, PurchasingOfficer, BodyEngineer, ThirdPartyTester, CustomerCommitteeRep]
    code: 200
    input: ["program_id?", "supersedes_spec_id?", "status?", "limit?", "offset?"]
    output: BidSpecification[]
    side_effects: []

  - method: GET
    path: "/specifications/{specification_id}"
    description: "Reads one bid specification with its live compliance-matrix scores and restrictive-clause ratio."
    roles: [ProgramAdmin, PurchasingOfficer, BodyEngineer, ThirdPartyTester, CustomerCommitteeRep]
    code: 200
    input: []
    output: BidSpecification
    side_effects: []

  - method: POST
    path: "/specifications/{specification_id}/submit-review"
    description: "DRAFT -> UNDER_REVIEW. Requires at least one clause."
    roles: [PurchasingOfficer]
    code: 200
    input: []
    output: BidSpecification
    side_effects:
      - "status = UNDER_REVIEW"
      - "increments BidSpecification.version by 1"

  - method: POST
    path: "/specifications/{specification_id}/rework"
    description: "UNDER_REVIEW -> DRAFT, incrementing revision_number so the specification can take further clauses and compliance responses."
    roles: [PurchasingOfficer]
    code: 200
    input: []
    output: BidSpecification
    side_effects:
      - "status = DRAFT, revision_number += 1"
      - "increments BidSpecification.version by 1"

  - method: POST
    path: "/specifications/{specification_id}/release"
    description: "UNDER_REVIEW -> RELEASED. Gated on clause_count >= 1, restrictive_clause_ratio_pct <= 40.00 and compliance_score_strict >= 75.00, and on the releaser differing from authored_by_user_id. When supersedes_spec_id is set, releasing drives CASCADE B: the predecessor goes RELEASED -> SUPERSEDED, its PENDING compliance entries VOID, every UnitOrder still pinned to the predecessor gets spec_drift_flag = true, and each such unit's certification is invalidated."
    roles: [PurchasingOfficer]
    code: 200
    input: []
    output: BidSpecification
    side_effects:
      - "status = RELEASED, released_by_user_id = X-User-ID, released_at = logical clock"
      - "CASCADE B hop 1: predecessor BidSpecification RELEASED -> SUPERSEDED; its PENDING ComplianceMatrixEntry rows -> VOID"
      - "CASCADE B hop 2: every UnitOrder with specification_id = predecessor and build_status not in {DELIVERED, WARRANTY_ACTIVE, CANCELLED} gets spec_drift_flag = true"
      - "CASCADE B hop 3: those units' certification_status CERTIFIED -> NOT_SUBMITTED and their PASSED CertificationTest rows -> INVALIDATED with invalidated_reason = SPEC_SUPERSEDED"
      - "increments BidSpecification.version by 1"

  # ---- SpecClause (immutable) ----------------------------------------------
  - method: POST
    path: "/specifications/{specification_id}/clauses"
    description: "Appends an immutable clause to a DRAFT specification. clause_code is unique within the specification."
    roles: [PurchasingOfficer]
    code: 201
    input: [clause_code, category, requirement_text, "mandatory?", "is_restrictive?"]
    output: SpecClause
    side_effects:
      - "BidSpecification.clause_count and mandatory_clause_count recomputed"
      - "calculations.compliance_readiness_score and calculations.restrictive_clause_ratio recomputed on the specification"
      - "increments BidSpecification.version by 1"

  - method: GET
    path: "/clauses"
    description: "Lists clauses in created_at ASC order; specification_id scopes the list to one specification."
    roles: [ProgramAdmin, PurchasingOfficer, BodyEngineer, ThirdPartyTester, CustomerCommitteeRep]
    code: 200
    input: ["specification_id?", "category?", "limit?", "offset?"]
    output: SpecClause[]
    side_effects: []

  - method: GET
    path: "/clauses/{clause_id}"
    description: "Reads one immutable clause."
    roles: [ProgramAdmin, PurchasingOfficer, BodyEngineer, ThirdPartyTester, CustomerCommitteeRep]
    code: 200
    input: []
    output: SpecClause
    side_effects: []

  # ---- ComplianceMatrixEntry ----------------------------------------------
  - method: POST
    path: "/compliance-entries"
    description: "Records the builder's compliance-matrix response to one clause of a DRAFT specification. At most one entry per (specification_id, clause_id)."
    roles: [BodyEngineer]
    code: 201
    input: [specification_id, clause_id, response, "exception_text?"]
    output: ComplianceMatrixEntry
    side_effects:
      - "disposition = PENDING, responded_by_user_id = X-User-ID"
      - "calculations.compliance_readiness_score recomputed on the specification (both variants)"
      - "increments BidSpecification.version by 1"

  - method: GET
    path: "/compliance-entries"
    description: "Lists compliance-matrix entries in created_at ASC order, filterable by specification, clause or disposition."
    roles: [ProgramAdmin, PurchasingOfficer, BodyEngineer, ThirdPartyTester, CustomerCommitteeRep]
    code: 200
    input: ["specification_id?", "clause_id?", "disposition?", "limit?", "offset?"]
    output: ComplianceMatrixEntry[]
    side_effects: []

  - method: GET
    path: "/compliance-entries/{compliance_entry_id}"
    description: "Reads one compliance-matrix entry."
    roles: [ProgramAdmin, PurchasingOfficer, BodyEngineer, ThirdPartyTester, CustomerCommitteeRep]
    code: 200
    input: []
    output: ComplianceMatrixEntry
    side_effects: []

  - method: POST
    path: "/compliance-entries/{compliance_entry_id}/dispose"
    description: "Purchasing disposes a PENDING entry as ACCEPTED or REJECTED, which is what turns an EXCEPTION or ALTERNATE response into a scored (strict) response."
    roles: [PurchasingOfficer]
    code: 200
    input: [disposition, "disposition_note?"]
    output: ComplianceMatrixEntry
    side_effects:
      - "disposition = ACCEPTED | REJECTED, disposition_note stored"
      - "calculations.compliance_readiness_score recomputed on the specification (both variants)"
      - "increments ComplianceMatrixEntry.version and BidSpecification.version by 1"

  # ---- UnitOrder -----------------------------------------------------------
  - method: POST
    path: "/unit-orders"
    description: "Awards one apparatus or ambulance against a RELEASED specification of an ACTIVE program. The award price is computed by calculations.unit_award_price under the award_year_locked variant and immediately charged to the program ledger; the axle loads are computed by calculations.axle_load_distribution from the chassis ratings and body curb weights supplied here."
    roles: [PurchasingOfficer]
    code: 201
    input: [program_id, specification_id, unit_type, award_year, gvwr_kg, front_axle_rating_kg, rear_axle_rating_kg, base_curb_front_kg, base_curb_rear_kg, crew_seat_count, weight_calc_engineer_user_id, "option_unit?"]
    output: UnitOrder
    side_effects:
      - "price_cents = calculations.unit_award_price (award_year_locked variant); change_order_total_cents = 0"
      - "front_axle_load_kg, rear_axle_load_kg, gross_weight_kg and weight_status = calculations.axle_load_distribution"
      - "build_status = SPEC_LOCKED, certification_status = NOT_SUBMITTED, long_lead_status = NOT_RESERVED, spec_drift_flag = false, open_change_order_count = 0"
      - "when option_unit = true, ApparatusProgram.options_exercised_count += 1"
      - "ApparatusProgram.committed_cents recomputed by calculations.program_committed_cents; soft-ceiling breach may drive ACTIVE -> SUSPENDED"
      - "increments ApparatusProgram.version by 1"

  - method: GET
    path: "/unit-orders"
    description: "Lists unit orders in created_at ASC order, filterable by program, pinned specification, reserved chassis slot or build status."
    roles: [ProgramAdmin, PurchasingOfficer, BodyEngineer, ThirdPartyTester, CustomerCommitteeRep]
    code: 200
    input: ["program_id?", "specification_id?", "chassis_reservation_id?", "build_status?", "limit?", "offset?"]
    output: UnitOrder[]
    side_effects: []

  - method: GET
    path: "/unit-orders/{unit_order_id}"
    description: "Reads one unit order including its computed price, axle loads, weight_status, open_change_order_count, the three status dimensions and the version a change-order writer must echo back."
    roles: [ProgramAdmin, PurchasingOfficer, BodyEngineer, ThirdPartyTester, CustomerCommitteeRep]
    code: 200
    input: []
    output: UnitOrder
    side_effects: []

  - method: POST
    path: "/unit-orders/{unit_order_id}/start-production"
    description: "PRE_CON_HELD -> IN_PRODUCTION. Requires an ACTIVE program and a CONFIRMED chassis reservation, which is consumed by this call."
    roles: [ProgramAdmin]
    code: 200
    input: []
    output: UnitOrder
    side_effects:
      - "build_status = IN_PRODUCTION"
      - "the linked ChassisReservation CONFIRMED -> CONSUMED"
      - "increments UnitOrder.version and ChassisReservation.version by 1"

  - method: POST
    path: "/unit-orders/{unit_order_id}/final-inspection"
    description: "MID_CON_HELD -> FINAL_INSPECTED. Requires certification_status = CERTIFIED, weight_status = WITHIN_LIMITS and open_change_order_count = 0."
    roles: [ProgramAdmin]
    code: 200
    input: []
    output: UnitOrder
    side_effects:
      - "build_status = FINAL_INSPECTED"
      - "increments UnitOrder.version by 1"

  - method: POST
    path: "/unit-orders/{unit_order_id}/deliver"
    description: "FINAL_INSPECTED -> DELIVERED and creates the unit's WarrantyStartup in PENDING_TRAINING. delivery_date must not precede the scheduled_end of the unit's HELD MID_CONSTRUCTION trip; the startup's warranty window and final price variance come from calculations.warranty_activation_window."
    roles: [ProgramAdmin]
    code: 200
    input: [delivery_date, training_hours, warranty_months]
    output: UnitOrder
    side_effects:
      - "build_status = DELIVERED, delivered_at = logical clock"
      - "creates a WarrantyStartup with status = PENDING_TRAINING, warranty_start_date / warranty_end_date / final_price_cents / price_variance_cents from calculations.warranty_activation_window (discoverable via GET /warranty-startups?unit_order_id=...)"
      - "increments UnitOrder.version by 1"

  - method: POST
    path: "/unit-orders/{unit_order_id}/cancel"
    description: "SPEC_LOCKED or PRE_CON_HELD -> CANCELLED (terminal). Requires open_change_order_count = 0; releases the unit's chassis reservation and decommits its price from the program ledger."
    roles: [ProgramAdmin]
    code: 200
    input: []
    output: UnitOrder
    side_effects:
      - "build_status = CANCELLED"
      - "any RESERVED or CONFIRMED ChassisReservation linked to the unit -> RELEASED with SupplierSlotLine counts recomputed"
      - "ApparatusProgram.committed_cents recomputed (a CANCELLED unit contributes nothing); if the program was SUSPENDED for a soft-ceiling breach it stays SUSPENDED until reactivated"
      - "increments UnitOrder.version and ApparatusProgram.version by 1"

  # ---- SupplierSlotLine ----------------------------------------------------
  - method: POST
    path: "/slot-lines"
    description: "Registers a long-lead supplier build line (chassis, aerial device or patient module) with a fixed number of slots and a changeover buffer applied on both sides of every reservation window."
    roles: [ProgramAdmin]
    code: 201
    input: [supplier_name, component_type, total_slot_count, "changeover_buffer_days?"]
    output: SupplierSlotLine
    side_effects:
      - "reserved_slot_count = 0, available_slot_count = total_slot_count"

  - method: GET
    path: "/slot-lines"
    description: "Lists supplier slot lines in created_at ASC order with their live occupancy counts."
    roles: [ProgramAdmin, PurchasingOfficer, BodyEngineer, ThirdPartyTester, CustomerCommitteeRep]
    code: 200
    input: ["component_type?", "limit?", "offset?"]
    output: SupplierSlotLine[]
    side_effects: []

  - method: GET
    path: "/slot-lines/{slot_line_id}"
    description: "Reads one supplier slot line, including the version a reservation writer must echo back in expected_slot_line_version."
    roles: [ProgramAdmin, PurchasingOfficer, BodyEngineer, ThirdPartyTester, CustomerCommitteeRep]
    code: 200
    input: []
    output: SupplierSlotLine
    side_effects: []

  # ---- ChassisReservation --------------------------------------------------
  - method: POST
    path: "/chassis-reservations"
    description: "Reserves one production slot on a supplier line for a program, optionally already tied to a unit order. The requested window must not collide with any occupying reservation once both windows are inflated by changeover_buffer_days, and the line must still have an available slot. expected_slot_line_version is the version the client last read from GET /slot-lines/{slot_line_id}."
    roles: [ProgramAdmin]
    code: 201
    input: [program_id, slot_line_id, slot_start_date, slot_end_date, reserved_price_cents, expiry_at, expected_slot_line_version, "unit_order_id?"]
    output: ChassisReservation
    side_effects:
      - "status = RESERVED, confirmed_at = null"
      - "SupplierSlotLine.reserved_slot_count and available_slot_count recomputed by calculations.slot_line_utilization"
      - "when unit_order_id is supplied: UnitOrder.chassis_reservation_id = this reservation and long_lead_status = RESERVED"
      - "increments SupplierSlotLine.version by 1"

  - method: GET
    path: "/chassis-reservations"
    description: "Lists chassis and long-lead reservations in created_at ASC order, filterable by program, slot line, unit order or status."
    roles: [ProgramAdmin, PurchasingOfficer, BodyEngineer, ThirdPartyTester, CustomerCommitteeRep]
    code: 200
    input: ["program_id?", "slot_line_id?", "unit_order_id?", "status?", "limit?", "offset?"]
    output: ChassisReservation[]
    side_effects: []

  - method: GET
    path: "/chassis-reservations/{reservation_id}"
    description: "Reads one reservation with its window, expiry and status."
    roles: [ProgramAdmin, PurchasingOfficer, BodyEngineer, ThirdPartyTester, CustomerCommitteeRep]
    code: 200
    input: []
    output: ChassisReservation
    side_effects: []

  - method: POST
    path: "/chassis-reservations/{reservation_id}/confirm"
    description: "RESERVED -> CONFIRMED, locking the supplier slot and the reserved component price. Requires a non-null unit_order_id."
    roles: [ProgramAdmin]
    code: 200
    input: []
    output: ChassisReservation
    side_effects:
      - "status = CONFIRMED, confirmed_at = logical clock"
      - "the linked UnitOrder.long_lead_status = CONFIRMED"
      - "increments ChassisReservation.version and UnitOrder.version by 1"

  - method: POST
    path: "/chassis-reservations/{reservation_id}/release"
    description: "RESERVED or CONFIRMED -> RELEASED (terminal), driving CASCADE C: the slot line's counts are recomputed, the linked unit loses its slot and goes long_lead_status = AT_RISK, and that unit's SCHEDULED PRE_CONSTRUCTION trips are cancelled."
    roles: [ProgramAdmin]
    code: 200
    input: []
    output: ChassisReservation
    side_effects:
      - "status = RELEASED"
      - "CASCADE C hop 1: SupplierSlotLine.reserved_slot_count and available_slot_count recomputed"
      - "CASCADE C hop 2: linked UnitOrder.chassis_reservation_id = null and long_lead_status = AT_RISK"
      - "CASCADE C hop 3: that unit's SCHEDULED PRE_CONSTRUCTION InspectionTrip rows -> CANCELLED"
      - "increments ChassisReservation.version, SupplierSlotLine.version and UnitOrder.version by 1"

  # ---- PlantBay (immutable) ------------------------------------------------
  - method: POST
    path: "/plant-bays"
    description: "Registers an immutable inspection bay with a hard simultaneous-visitor capacity used by calculations.bay_concurrent_load."
    roles: [ProgramAdmin]
    code: 201
    input: [name, max_concurrent_visitors]
    output: PlantBay
    side_effects: []

  - method: GET
    path: "/plant-bays"
    description: "Lists inspection bays in created_at ASC order."
    roles: [ProgramAdmin, PurchasingOfficer, BodyEngineer, ThirdPartyTester, CustomerCommitteeRep]
    code: 200
    input: ["limit?", "offset?"]
    output: PlantBay[]
    side_effects: []

  - method: GET
    path: "/plant-bays/{plant_bay_id}"
    description: "Reads one immutable inspection bay."
    roles: [ProgramAdmin, PurchasingOfficer, BodyEngineer, ThirdPartyTester, CustomerCommitteeRep]
    code: 200
    input: []
    output: PlantBay
    side_effects: []

  # ---- InspectionTrip ------------------------------------------------------
  - method: POST
    path: "/inspection-trips"
    description: "Schedules a customer-committee inspection trip in a bay. Admission is decided by calculations.bay_concurrent_load over closed windows: the sum of committee sizes already booked in that bay over any intersecting window plus this committee_size must not exceed the bay's max_concurrent_visitors."
    roles: [ProgramAdmin]
    code: 201
    input: [unit_order_id, plant_bay_id, trip_type, scheduled_start, scheduled_end, committee_size]
    output: InspectionTrip
    side_effects:
      - "status = SCHEDULED, held_at = null"

  - method: GET
    path: "/inspection-trips"
    description: "Lists inspection trips in created_at ASC order, filterable by unit order, bay, trip type or status."
    roles: [ProgramAdmin, PurchasingOfficer, BodyEngineer, ThirdPartyTester, CustomerCommitteeRep]
    code: 200
    input: ["unit_order_id?", "plant_bay_id?", "trip_type?", "status?", "limit?", "offset?"]
    output: InspectionTrip[]
    side_effects: []

  - method: GET
    path: "/inspection-trips/{inspection_trip_id}"
    description: "Reads one inspection trip."
    roles: [ProgramAdmin, PurchasingOfficer, BodyEngineer, ThirdPartyTester, CustomerCommitteeRep]
    code: 200
    input: []
    output: InspectionTrip
    side_effects: []

  - method: POST
    path: "/inspection-trips/{inspection_trip_id}/hold"
    description: "SCHEDULED -> HELD (terminal). A PRE_CONSTRUCTION trip requires build_status = SPEC_LOCKED and advances the unit to PRE_CON_HELD; a MID_CONSTRUCTION trip requires IN_PRODUCTION and advances it to MID_CON_HELD; a FINAL trip requires FINAL_INSPECTED and advances nothing. At most one HELD trip per (unit_order_id, trip_type). A CustomerCommitteeRep may only hold trips on units of the program it represents."
    roles: [ProgramAdmin, CustomerCommitteeRep]
    code: 200
    input: []
    output: InspectionTrip
    side_effects:
      - "status = HELD, held_at = logical clock"
      - "PRE_CONSTRUCTION: UnitOrder build_status SPEC_LOCKED -> PRE_CON_HELD"
      - "MID_CONSTRUCTION: UnitOrder build_status IN_PRODUCTION -> MID_CON_HELD"
      - "increments InspectionTrip.version and UnitOrder.version by 1"

  - method: POST
    path: "/inspection-trips/{inspection_trip_id}/cancel"
    description: "SCHEDULED -> CANCELLED (terminal), freeing the bay window. A CustomerCommitteeRep may only cancel trips on units of the program it represents."
    roles: [ProgramAdmin, CustomerCommitteeRep]
    code: 200
    input: []
    output: InspectionTrip
    side_effects:
      - "status = CANCELLED"
      - "the trip stops occupying its bay window for calculations.bay_concurrent_load"
      - "increments InspectionTrip.version by 1"

  # ---- ChangeOrder ---------------------------------------------------------
  - method: POST
    path: "/change-orders"
    description: "Raises a change order in DRAFT against a unit, citing the inspection trip that produced it. price_delta_cents is computed by calculations.change_order_price_delta (per-line rounding). expected_unit_order_version is the version the client last read from GET /unit-orders/{unit_order_id}; a stale value is rejected with 412 because an intervening approved change order or cascade has already moved the unit."
    roles: [CustomerCommitteeRep]
    code: 201
    input: [unit_order_id, inspection_trip_id, line_items, weight_delta_front_kg, weight_delta_rear_kg, expected_unit_order_version]
    output: ChangeOrder
    side_effects:
      - "status = DRAFT, revision_count = 0, raised_by_user_id = X-User-ID, applied_at = null"
      - "price_delta_cents = calculations.change_order_price_delta"
      - "UnitOrder.open_change_order_count += 1"
      - "increments UnitOrder.version by 1"

  - method: GET
    path: "/change-orders"
    description: "Lists change orders in created_at ASC order, filterable by unit order, citing trip or status."
    roles: [ProgramAdmin, PurchasingOfficer, BodyEngineer, ThirdPartyTester, CustomerCommitteeRep]
    code: 200
    input: ["unit_order_id?", "inspection_trip_id?", "status?", "limit?", "offset?"]
    output: ChangeOrder[]
    side_effects: []

  - method: GET
    path: "/change-orders/{change_order_id}"
    description: "Reads one change order with its computed price delta, revision count and status."
    roles: [ProgramAdmin, PurchasingOfficer, BodyEngineer, ThirdPartyTester, CustomerCommitteeRep]
    code: 200
    input: []
    output: ChangeOrder
    side_effects: []

  - method: POST
    path: "/change-orders/{change_order_id}/submit"
    description: "DRAFT -> SUBMITTED. Requires the cited InspectionTrip to be HELD."
    roles: [CustomerCommitteeRep]
    code: 200
    input: []
    output: ChangeOrder
    side_effects:
      - "status = SUBMITTED"
      - "increments ChangeOrder.version by 1"

  - method: POST
    path: "/change-orders/{change_order_id}/negotiate"
    description: "SUBMITTED -> IN_NEGOTIATION, returning the change order to the committee for repricing."
    roles: [PurchasingOfficer]
    code: 200
    input: []
    output: ChangeOrder
    side_effects:
      - "status = IN_NEGOTIATION"
      - "increments ChangeOrder.version by 1"

  - method: POST
    path: "/change-orders/{change_order_id}/revise"
    description: "IN_NEGOTIATION -> SUBMITTED with a fresh set of line items and weight deltas, incrementing revision_count and recomputing price_delta_cents."
    roles: [CustomerCommitteeRep]
    code: 200
    input: [line_items, weight_delta_front_kg, weight_delta_rear_kg]
    output: ChangeOrder
    side_effects:
      - "status = SUBMITTED, revision_count += 1"
      - "price_delta_cents recomputed by calculations.change_order_price_delta"
      - "increments ChangeOrder.version by 1"

  - method: POST
    path: "/change-orders/{change_order_id}/approve"
    description: "SUBMITTED -> APPROVED, driving CASCADE A: the unit's change-order total is rebuilt, its axle loads are recomputed from the accumulated weight deltas, a weight_status that leaves WITHIN_LIMITS invalidates the unit's certification, a certification reset drags build_status FINAL_INSPECTED back to IN_PRODUCTION, and a reverted unit's SCHEDULED FINAL trips are cancelled. The program ledger is resynchronised last and the contract ceiling is the final gate."
    roles: [PurchasingOfficer]
    code: 200
    input: []
    output: ChangeOrder
    side_effects:
      - "status = APPROVED, approved_by_user_id = X-User-ID, applied_at = logical clock"
      - "CASCADE A hop 1: UnitOrder.change_order_total_cents = calculations.unit_change_order_total; open_change_order_count -= 1; axle loads and weight_status recomputed by calculations.axle_load_distribution"
      - "CASCADE A hop 2: when weight_status != WITHIN_LIMITS, certification_status CERTIFIED -> NOT_SUBMITTED and PASSED CertificationTest rows -> INVALIDATED with invalidated_reason = WEIGHT_STATUS_CHANGE"
      - "CASCADE A hop 3: a unit whose certification was reset while FINAL_INSPECTED goes build_status FINAL_INSPECTED -> IN_PRODUCTION"
      - "CASCADE A hop 4: that unit's SCHEDULED FINAL InspectionTrip rows -> CANCELLED"
      - "LEDGER SYNC: ApparatusProgram.committed_cents recomputed by calculations.program_committed_cents; soft-ceiling breach may drive ACTIVE -> SUSPENDED"
      - "increments ChangeOrder.version, UnitOrder.version and ApparatusProgram.version by 1"

  - method: POST
    path: "/change-orders/{change_order_id}/reject"
    description: "SUBMITTED -> REJECTED (terminal). The unit's price and weights are untouched; only the open-change-order count drops."
    roles: [PurchasingOfficer]
    code: 200
    input: []
    output: ChangeOrder
    side_effects:
      - "status = REJECTED"
      - "UnitOrder.open_change_order_count -= 1"
      - "increments ChangeOrder.version and UnitOrder.version by 1"

  - method: POST
    path: "/change-orders/{change_order_id}/rescind"
    description: "APPROVED -> RESCINDED (terminal) — the compensating transition. Every fiscal and weight effect of the approval is reversed: the unit's change-order total, axle loads and weight_status are rebuilt from the remaining APPROVED change orders and the program ledger is resynchronised. Certification and build_status resets performed by the original approval are NOT undone."
    roles: [PurchasingOfficer]
    code: 200
    input: []
    output: ChangeOrder
    side_effects:
      - "status = RESCINDED, applied_at = null"
      - "UnitOrder.change_order_total_cents = calculations.unit_change_order_total over the remaining APPROVED change orders; price_cents is untouched because the award price is frozen for the life of the unit"
      - "axle loads and weight_status recomputed by calculations.axle_load_distribution over the remaining APPROVED deltas"
      - "ApparatusProgram.committed_cents recomputed by calculations.program_committed_cents"
      - "increments ChangeOrder.version, UnitOrder.version and ApparatusProgram.version by 1"

  # ---- CertificationTest ---------------------------------------------------
  - method: POST
    path: "/certification-tests"
    description: "Submits the unit to third-party standards testing, moving certification_status to IN_TESTING. Requires a HELD MID_CONSTRUCTION inspection trip on the unit and a test_standard matching the unit_type."
    roles: [ThirdPartyTester]
    code: 201
    input: [unit_order_id, test_standard, "tested_at?"]
    output: CertificationTest
    side_effects:
      - "status = SUBMITTED, result = null, submitted_by_user_id = X-User-ID, invalidated_reason = null"
      - "UnitOrder.certification_status = IN_TESTING"
      - "increments UnitOrder.version by 1"

  - method: GET
    path: "/certification-tests"
    description: "Lists certification tests in created_at ASC order, filterable by unit order or status."
    roles: [ProgramAdmin, PurchasingOfficer, BodyEngineer, ThirdPartyTester, CustomerCommitteeRep]
    code: 200
    input: ["unit_order_id?", "status?", "limit?", "offset?"]
    output: CertificationTest[]
    side_effects: []

  - method: GET
    path: "/certification-tests/{certification_test_id}"
    description: "Reads one certification test including result, signer and invalidated_reason."
    roles: [ProgramAdmin, PurchasingOfficer, BodyEngineer, ThirdPartyTester, CustomerCommitteeRep]
    code: 200
    input: []
    output: CertificationTest
    side_effects: []

  - method: POST
    path: "/certification-tests/{certification_test_id}/record-result"
    description: "SUBMITTED -> PASSED or FAILED. signed_by_user_id is the engineer signing the certificate and MUST differ from the unit's weight_calc_engineer_user_id — the same engineer may not both compute the weight distribution and sign off its certification."
    roles: [ThirdPartyTester]
    code: 200
    input: [result, signed_by_user_id]
    output: CertificationTest
    side_effects:
      - "status = PASSED | FAILED, result = PASS | FAIL, signed_by_user_id stored"
      - "UnitOrder.certification_status IN_TESTING -> CERTIFIED (PASS) or REJECTED_TESTING (FAIL)"
      - "increments CertificationTest.version and UnitOrder.version by 1"

  # ---- WarrantyStartup -----------------------------------------------------
  - method: GET
    path: "/warranty-startups"
    description: "Lists warranty startups in created_at ASC order; unit_order_id is the discovery channel for the row created by POST /unit-orders/{unit_order_id}/deliver."
    roles: [ProgramAdmin, PurchasingOfficer, BodyEngineer, ThirdPartyTester, CustomerCommitteeRep]
    code: 200
    input: ["unit_order_id?", "status?", "limit?", "offset?"]
    output: WarrantyStartup[]
    side_effects: []

  - method: GET
    path: "/warranty-startups/{warranty_startup_id}"
    description: "Reads one warranty startup with its training hours, warranty window and price variance."
    roles: [ProgramAdmin, PurchasingOfficer, BodyEngineer, ThirdPartyTester, CustomerCommitteeRep]
    code: 200
    input: []
    output: WarrantyStartup
    side_effects: []

  - method: POST
    path: "/warranty-startups/{warranty_startup_id}/complete-training"
    description: "PENDING_TRAINING -> ACTIVE once cumulative delivered training reaches REQUIRED_TRAINING_HOURS (16.0, inclusive). Adds additional_training_hours to training_hours and recomputes the warranty window by calculations.warranty_activation_window."
    roles: [ProgramAdmin]
    code: 200
    input: [additional_training_hours]
    output: WarrantyStartup
    side_effects:
      - "training_hours += additional_training_hours; status = ACTIVE"
      - "warranty_start_date and warranty_end_date recomputed by calculations.warranty_activation_window"
      - "increments WarrantyStartup.version by 1"

# ==============================================================================
# §1.6 Error Code Catalog. Every id is reachable from at least one §1.5 endpoint
# and every §1.4 rule names one of these ids.
# ==============================================================================
errors:

  # -- identity and authorization -------------------------------------------
  - id: ERR_MISSING_AUTH_HEADERS
    http: 401
    condition: "X-User-Role or X-User-ID absent, or X-User-Role not one of the five declared roles"
  - id: ERR_ROLE_NOT_PERMITTED
    http: 403
    condition: "the acting role is not listed in the endpoint's roles"
  - id: ERR_COMMITTEE_SCOPE_VIOLATION
    http: 403
    condition: "a CustomerCommitteeRep acts on a unit order, trip or change order belonging to a program other than the one its X-User-ID identifies"
  - id: ERR_SEGREGATION_OF_DUTIES
    http: 403
    condition: "the specification releaser equals authored_by_user_id, or a certification signer equals the unit's weight_calc_engineer_user_id"

  # -- request shape ---------------------------------------------------------
  - id: ERR_INVALID_REQUEST
    http: 400
    condition: "missing required field, wrong type, unknown enum member, out-of-range number, line_items outside 1..12 elements, or pagination outside limit 1..100 / offset >= 0"

  # -- existence -------------------------------------------------------------
  - id: ERR_PROGRAM_NOT_FOUND
    http: 404
    condition: "no ApparatusProgram with the given id"
  - id: ERR_SPECIFICATION_NOT_FOUND
    http: 404
    condition: "no BidSpecification with the given id (path id, specification_id or supersedes_spec_id)"
  - id: ERR_CLAUSE_NOT_FOUND
    http: 404
    condition: "no SpecClause with the given id"
  - id: ERR_COMPLIANCE_ENTRY_NOT_FOUND
    http: 404
    condition: "no ComplianceMatrixEntry with the given id"
  - id: ERR_UNIT_ORDER_NOT_FOUND
    http: 404
    condition: "no UnitOrder with the given id"
  - id: ERR_SLOT_LINE_NOT_FOUND
    http: 404
    condition: "no SupplierSlotLine with the given id"
  - id: ERR_RESERVATION_NOT_FOUND
    http: 404
    condition: "no ChassisReservation with the given id"
  - id: ERR_PLANT_BAY_NOT_FOUND
    http: 404
    condition: "no PlantBay with the given id"
  - id: ERR_INSPECTION_TRIP_NOT_FOUND
    http: 404
    condition: "no InspectionTrip with the given id"
  - id: ERR_CHANGE_ORDER_NOT_FOUND
    http: 404
    condition: "no ChangeOrder with the given id"
  - id: ERR_CERTIFICATION_TEST_NOT_FOUND
    http: 404
    condition: "no CertificationTest with the given id"
  - id: ERR_WARRANTY_STARTUP_NOT_FOUND
    http: 404
    condition: "no WarrantyStartup with the given id"

  # -- optimistic concurrency ------------------------------------------------
  - id: ERR_STALE_UNIT_ORDER_VERSION
    http: 412
    condition: "expected_unit_order_version does not equal the current UnitOrder.version on POST /change-orders"
  - id: ERR_STALE_SLOT_LINE_VERSION
    http: 412
    condition: "expected_slot_line_version does not equal the current SupplierSlotLine.version on POST /chassis-reservations"

  # -- own-state preconditions ----------------------------------------------
  - id: ERR_INVALID_PROGRAM_STATE
    http: 409
    condition: "the program's status does not allow the requested lifecycle transition or sweep"
  - id: ERR_INVALID_SPEC_STATE
    http: 409
    condition: "the specification's status does not allow clause addition, compliance responses, review submission, rework or release"
  - id: ERR_INVALID_ENTRY_STATE
    http: 409
    condition: "the compliance entry is no longer PENDING, or its specification has left DRAFT"
  - id: ERR_INVALID_BUILD_STATE
    http: 409
    condition: "the unit's build_status does not allow start-production, final-inspection, delivery or cancellation"
  - id: ERR_UNIT_NOT_AMENDABLE
    http: 409
    condition: "a change-order operation targets a unit whose build_status is DELIVERED, WARRANTY_ACTIVE or CANCELLED"
  - id: ERR_INVALID_CERTIFICATION_STATE
    http: 409
    condition: "a new certification test is submitted while the unit's certification_status is IN_TESTING or CERTIFIED"
  - id: ERR_INVALID_TEST_STATE
    http: 409
    condition: "record-result targets a certification test that is not SUBMITTED"
  - id: ERR_INVALID_RESERVATION_STATE
    http: 409
    condition: "confirm targets a reservation that is not RESERVED, or release targets one that is not RESERVED or CONFIRMED"
  - id: ERR_RESERVATION_UNASSIGNED
    http: 409
    condition: "confirm targets a reservation whose unit_order_id is null"
  - id: ERR_INVALID_TRIP_STATE
    http: 409
    condition: "hold or cancel targets an inspection trip that is not SCHEDULED"
  - id: ERR_INVALID_CHANGE_ORDER_STATE
    http: 409
    condition: "the change order's status does not allow the requested transition"
  - id: ERR_INVALID_WARRANTY_STATE
    http: 409
    condition: "complete-training targets a warranty startup that is not PENDING_TRAINING"

  # -- cross-entity state ----------------------------------------------------
  - id: ERR_PROGRAM_NOT_ACTIVE
    http: 409
    condition: "the owning program is not ACTIVE when a unit is awarded or production starts"
  - id: ERR_CHASSIS_NOT_CONFIRMED
    http: 409
    condition: "production start attempted with no chassis reservation, or one that is not CONFIRMED"
  - id: ERR_MID_CON_INSPECTION_NOT_HELD
    http: 409
    condition: "certification testing submitted before the unit's MID_CONSTRUCTION inspection trip has been HELD"
  - id: ERR_INSPECTION_TRIP_NOT_HELD
    http: 409
    condition: "a change order is submitted while the trip it cites is still SCHEDULED or was CANCELLED"

  # -- referential integrity -------------------------------------------------
  - id: ERR_TEST_STANDARD_MISMATCH
    http: 422
    condition: "test_standard does not match unit_type (PUMPER->NFPA_1901, AERIAL->NFPA_1911, AMBULANCE->NFPA_1917 or AMD_STD_003)"
  - id: ERR_TRIP_UNIT_MISMATCH
    http: 422
    condition: "the cited inspection trip belongs to a different unit order"
  - id: ERR_SPEC_NOT_RELEASED
    http: 409
    condition: "a unit order pins a specification whose status is not RELEASED"
  - id: ERR_SPEC_PROGRAM_MISMATCH
    http: 422
    condition: "the specification belongs to a different program than the unit order, or a superseded predecessor belongs to a different program than its successor"
  - id: ERR_PREDECESSOR_NOT_RELEASED
    http: 409
    condition: "release names a supersedes_spec_id whose specification is not RELEASED"
  - id: ERR_RESERVATION_UNIT_MISMATCH
    http: 422
    condition: "the reservation's unit order belongs to a different program than the reservation"

  # -- safety and compliance -------------------------------------------------
  - id: ERR_AXLE_LOAD_EXCEEDED
    http: 422
    condition: "final inspection or delivery attempted while weight_status is OVER_FRONT, OVER_REAR or OVER_GVWR"
  - id: ERR_CERTIFICATION_NOT_PASSED
    http: 409
    condition: "final inspection attempted while certification_status is not CERTIFIED"
  - id: ERR_SPEC_HAS_NO_CLAUSES
    http: 422
    condition: "review submission or release attempted on a specification with clause_count = 0"
  - id: ERR_RESTRICTIVE_CLAUSE_RATIO_EXCEEDED
    http: 422
    condition: "release attempted with restrictive_clause_ratio_pct above 40.00"
  - id: ERR_SPEC_COMPLIANCE_BELOW_THRESHOLD
    http: 422
    condition: "release attempted with compliance_score_strict below 75.00"

  # -- temporal --------------------------------------------------------------
  - id: ERR_INVALID_SLOT_WINDOW
    http: 422
    condition: "slot_end_date not after slot_start_date, or expiry_at not after slot_start_date"
  - id: ERR_INVALID_TRIP_WINDOW
    http: 422
    condition: "scheduled_end not after scheduled_start"
  - id: ERR_DELIVERY_BEFORE_MID_CON
    http: 422
    condition: "delivery_date precedes the scheduled_end of the unit's HELD MID_CONSTRUCTION trip"

  # -- capacity, uniqueness and constraint ----------------------------------
  - id: ERR_SLOT_WINDOW_CONFLICT
    http: 409
    condition: "the requested slot window collides with an occupying reservation on the same line once both windows are inflated by changeover_buffer_days"
  - id: ERR_SLOT_LINE_EXHAUSTED
    http: 409
    condition: "the supplier line has available_slot_count = 0"
  - id: ERR_BAY_CAPACITY_EXCEEDED
    http: 409
    condition: "the bay's max_concurrent_visitors would be exceeded over an intersecting inspection window"
  - id: ERR_TRIP_TYPE_ALREADY_HELD
    http: 409
    condition: "a trip of the same trip_type on the same unit order has already been HELD"
  - id: ERR_DUPLICATE_CLAUSE_CODE
    http: 409
    condition: "clause_code already exists on the specification"
  - id: ERR_DUPLICATE_COMPLIANCE_ENTRY
    http: 409
    condition: "a compliance entry already exists for the (specification_id, clause_id) pair, or the clause belongs to another specification"
  - id: ERR_OPEN_CHANGE_ORDERS
    http: 409
    condition: "final inspection or cancellation attempted while open_change_order_count > 0"
  - id: ERR_MARKUP_CAP_EXCEEDED
    http: 422
    condition: "a change-order line carries markup_pct above 22.0"
  - id: ERR_OPTION_LIMIT_EXCEEDED
    http: 409
    condition: "an option unit is awarded when options_exercised_count already equals max_option_units"
  - id: ERR_TRAINING_HOURS_NOT_MET
    http: 422
    condition: "cumulative training after the call would stay below 16.0 hours"
  - id: ERR_UNITS_NOT_TERMINAL
    http: 409
    condition: "program closure attempted while a unit order is neither WARRANTY_ACTIVE nor CANCELLED"
  - id: ERR_SOFT_CEILING_STILL_BREACHED
    http: 409
    condition: "reactivation attempted while committed_cents still exceeds 90% of contract_ceiling_cents"

  # -- fiscal ----------------------------------------------------------------
  - id: ERR_CONTRACT_CEILING_EXCEEDED
    http: 409
    condition: "the resulting committed_cents would exceed contract_ceiling_cents"
  - id: ERR_ESCALATION_YEAR_OUT_OF_RANGE
    http: 422
    condition: "award_year is outside base_year .. base_year + 5"

# ==============================================================================
# §1.7 RBAC Matrix. Segregation of duties: the four opaque operator roles own
# disjoint slices of the lifecycle, and two named separations bind identities —
# a specification's author may not release it, and the engineer who computed a
# unit's weight distribution may not sign its certification.
# ==============================================================================
roles:

  - name: ProgramAdmin
    description: "Plant program administration: opens and suspends programs, registers supplier slot lines, bays and reservations, schedules inspection trips, and drives production, final inspection, delivery, warranty startup and the deterministic clock sweep."
    identity: "opaque"
    exclusive_operations:
      - "POST /programs"
      - "POST /programs/{program_id}/activate"
      - "POST /programs/{program_id}/suspend"
      - "POST /programs/{program_id}/reactivate"
      - "POST /programs/{program_id}/close"
      - "POST /programs/{program_id}/ops-run"
      - "POST /slot-lines"
      - "POST /plant-bays"
      - "POST /inspection-trips"
      - "POST /chassis-reservations"
      - "POST /chassis-reservations/{reservation_id}/confirm"
      - "POST /chassis-reservations/{reservation_id}/release"
      - "POST /unit-orders/{unit_order_id}/start-production"
      - "POST /unit-orders/{unit_order_id}/final-inspection"
      - "POST /unit-orders/{unit_order_id}/deliver"
      - "POST /unit-orders/{unit_order_id}/cancel"
      - "POST /warranty-startups/{warranty_startup_id}/complete-training"
    shared_operations:
      - "POST /inspection-trips/{inspection_trip_id}/hold"
      - "POST /inspection-trips/{inspection_trip_id}/cancel"
      - "POST /_clock/set_current_utc"
      - "all GET endpoints"

  - name: PurchasingOfficer
    description: "The purchasing department: writes and releases bid specifications, disposes compliance-matrix exceptions, awards unit orders against released specifications, and negotiates, approves, rejects or rescinds change orders."
    identity: "opaque"
    exclusive_operations:
      - "POST /specifications"
      - "POST /specifications/{specification_id}/clauses"
      - "POST /specifications/{specification_id}/submit-review"
      - "POST /specifications/{specification_id}/rework"
      - "POST /specifications/{specification_id}/release"
      - "POST /compliance-entries/{compliance_entry_id}/dispose"
      - "POST /unit-orders"
      - "POST /change-orders/{change_order_id}/negotiate"
      - "POST /change-orders/{change_order_id}/approve"
      - "POST /change-orders/{change_order_id}/reject"
      - "POST /change-orders/{change_order_id}/rescind"
    shared_operations:
      - "POST /_clock/set_current_utc"
      - "all GET endpoints"

  - name: BodyEngineer
    description: "Body engineering: answers the bid specification clause by clause in the compliance matrix. A BodyEngineer's opaque id is also recorded on unit orders as weight_calc_engineer_user_id, which the certification-signing separation checks against."
    identity: "opaque"
    exclusive_operations:
      - "POST /compliance-entries"
    shared_operations:
      - "POST /_clock/set_current_utc"
      - "all GET endpoints"

  - name: ThirdPartyTester
    description: "Independent standards-testing house: submits apparatus and ambulance units for NFPA or AMD certification testing and records the signed result."
    identity: "opaque"
    exclusive_operations:
      - "POST /certification-tests"
      - "POST /certification-tests/{certification_test_id}/record-result"
    shared_operations:
      - "POST /_clock/set_current_utc"
      - "all GET endpoints"

  - name: CustomerCommitteeRep
    description: "The purchasing agency's apparatus committee. X-User-ID is the id of the ApparatusProgram the committee represents, so every write is scoped to that program's units: the committee holds or cancels its own inspection trips and raises, submits and revises change orders arising from them."
    identity: "entity_backed:ApparatusProgram"
    exclusive_operations:
      - "POST /change-orders"
      - "POST /change-orders/{change_order_id}/submit"
      - "POST /change-orders/{change_order_id}/revise"
    shared_operations:
      - "POST /inspection-trips/{inspection_trip_id}/hold"
      - "POST /inspection-trips/{inspection_trip_id}/cancel"
      - "POST /_clock/set_current_utc"
      - "all GET endpoints"
