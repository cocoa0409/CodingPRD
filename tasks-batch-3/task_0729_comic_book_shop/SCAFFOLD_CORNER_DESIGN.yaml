  # =========================================================================
  # Cross-Cutting Complexity Layers
  # =========================================================================
  - section: cross_cutting_complexity_layers
    instances:
      - name: reservation_create_correct_version_succeeds_and_bumps
        claim_type: optimistic_concurrency
        grounds: ["concurrency_rules[reserve-stale-issue]", entities.ComicIssue.fields.version]
        distinguishing_aspect: "A reservation create carrying the current expected_comic_issue_version succeeds (201) and increments ComicIssue.version by 1."
        test_recipe:
          setup: ["One ComicIssue just created (version 1)."]
          setup_api_calls:
            - call: "POST /api/comic-series"
              payload: { title: "Occ", publisher: "Acme" }
              as: Clerk
              captures: { series: $.data.id }
            - call: "POST /api/comic-issues"
              payload: { series_id: "${series}", issue_number: "1", cover_price_cents: 400, on_sale_date: "2026-04-01T00:00:00Z", order_cutoff_date: "2026-03-15T00:00:00Z", copies_ordered: 5 }
              as: Clerk
              captures: { issue: $.data.id, iss_v: $.data.version }
            - call: "POST /api/customers"
              payload: { email: "occ@x.com", full_name: "Occ" }
              as: Clerk
              captures: { cust: $.data.id }
          trigger:
            - call: "POST /api/reservations"
              payload: { customer_id: "${cust}", issue_id: "${issue}", requested_qty: 1, expected_comic_issue_version: "${iss_v}" }
              as: Clerk
              captures: { res: $.data.id }
          assert:
            - "Reservation.${res}.status == RESERVED"
            - "ComicIssue.${issue}.version == 2"
            - "ComicIssue.${issue}.copies_reserved == 1"

      - name: reservation_create_stale_version_conflict
        claim_type: optimistic_concurrency
        grounds: ["concurrency_rules[reserve-stale-issue]", "errors[ERR_STALE_VERSION]"]
        distinguishing_aspect: "A second reservation create still carrying the pre-first-create version (${iss_v} while the issue has advanced) is rejected with ERR_STALE_VERSION (412)."
        test_recipe:
          setup: ["One ComicIssue (version 1); one reservation already created against it (version now 2)."]
          setup_api_calls:
            - call: "POST /api/comic-series"
              payload: { title: "Stale", publisher: "Acme" }
              as: Clerk
              captures: { series: $.data.id }
            - call: "POST /api/comic-issues"
              payload: { series_id: "${series}", issue_number: "1", cover_price_cents: 400, on_sale_date: "2026-04-01T00:00:00Z", order_cutoff_date: "2026-03-15T00:00:00Z", copies_ordered: 5 }
              as: Clerk
              captures: { issue: $.data.id, iss_v: $.data.version }
            - call: "POST /api/customers"
              payload: { email: "st1@x.com", full_name: "St1" }
              as: Clerk
              captures: { c1: $.data.id }
            - call: "POST /api/customers"
              payload: { email: "st2@x.com", full_name: "St2" }
              as: Clerk
              captures: { c2: $.data.id }
            - call: "POST /api/reservations"
              payload: { customer_id: "${c1}", issue_id: "${issue}", requested_qty: 1, expected_comic_issue_version: "${iss_v}" }
              as: Clerk
              captures: { r1: $.data.id }
          trigger:
            - call: "POST /api/reservations"
              payload: { customer_id: "${c2}", issue_id: "${issue}", requested_qty: 1, expected_comic_issue_version: "${iss_v}" }
              as: Clerk
              captures: { err: $.data.error_id }
          assert:
            - "response.data.error_id == ERR_STALE_VERSION"

      - name: consignment_paid_out_cascades_store_credit_and_txn
        claim_type: cascading_side_effects
        grounds: [state_machines.Consignment.SOLD_to_PAID_OUT, entities.CreditTransaction, entities.Customer.fields.store_credit_cents]
        distinguishing_aspect: "PAID_OUT on a SOLD consignment (final_payout_cents=7000) credits consignor store_credit_cents to 7000 and creates a CONSIGNMENT_PAYOUT CreditTransaction of +7000."
        test_recipe:
          setup: ["Consignment SOLD at sale_price_cents=10000, commission_pct=0.30 (final_payout 7000); consignor store_credit_cents=0."]
          setup_api_calls:
            - call: "POST /api/customers"
              payload: { email: "cas@x.com", full_name: "Cas" }
              as: Clerk
              captures: { cust: $.data.id }
            - call: "POST /api/consignments"
              payload: { consignor_id: "${cust}", description: "cas", asking_price_cents: 9000, commission_pct: 0.30 }
              as: Clerk
              captures: { cons: $.data.id }
            - call: "POST /api/consignments/${cons}/transition"
              payload: { to_status: "LISTED" }
              as: Clerk
            - call: "POST /api/consignments/${cons}/transition"
              payload: { to_status: "SOLD", sale_price_cents: 10000 }
              as: Clerk
          trigger:
            - call: "POST /api/consignments/${cons}/transition"
              payload: { to_status: "PAID_OUT" }
              as: Manager
          assert:
            - "Consignment.${cons}.final_payout_cents == 7000"
            - "Customer.${cust}.store_credit_cents == 7000"

      - name: loyalty_tier_recomputes_on_preorder_cancel
        claim_type: derived_field_reconciliation
        grounds: [state_machines.PreOrder.CONFIRMED_to_CANCELLED, calculations.loyalty_tier_assignment, entities.Customer.fields.loyalty_tier]
        distinguishing_aspect: "Cancelling the CONFIRMED pre-order that had lifted the customer to SILVER drops loyalty_tier back to BRONZE (forward_spend loses the 60000 estimated_total)."
        test_recipe:
          setup: ["Customer at SILVER solely due to a CONFIRMED pre-order estimated_total_cents=60000 (lifetime_spend_cents=0)."]
          setup_api_calls:
            - call: "POST /api/customers"
              payload: { email: "rec@x.com", full_name: "Rec" }
              as: Clerk
              captures: { cust: $.data.id }
            - call: "POST /api/comic-series"
              payload: { title: "Rec", publisher: "Acme" }
              as: Clerk
              captures: { series: $.data.id }
            - call: "POST /api/comic-issues"
              payload: { series_id: "${series}", issue_number: "1", cover_price_cents: 60000, on_sale_date: "2026-04-01T00:00:00Z", order_cutoff_date: "2026-03-15T00:00:00Z", copies_ordered: 5 }
              as: Clerk
              captures: { issue: $.data.id }
            - call: "POST /api/pre-orders"
              payload: { customer_id: "${cust}", issue_id: "${issue}", quantity: 1 }
              as: Clerk
              captures: { po: $.data.id }
            - call: "POST /api/pre-orders/${po}/transition"
              payload: { to_status: "CONFIRMED" }
              as: Clerk
          trigger:
            - call: "POST /api/pre-orders/${po}/transition"
              payload: { to_status: "CANCELLED" }
              as: Customer
              as_user_id: "${cust}"
          assert:
            - "PreOrder.${po}.status == CANCELLED"
            - "Customer.${cust}.loyalty_tier == BRONZE"

