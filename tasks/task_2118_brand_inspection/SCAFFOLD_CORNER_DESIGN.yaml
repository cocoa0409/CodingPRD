              as: BoardAdmin
          trigger:
            - call: "POST /brand-inspection/estray-cases/${est_1}/record-sale"
              payload: { gross_proceeds_cents: 90000 }
              as: BoardAdmin
              captures: { care: "$.data.care_cost_cents", handling: "$.data.handling_fee_cents", resid: "$.data.claimant_residual_cents", variant: "$.data.distribution_variant" }
          assert:
            - "${variant} == FINAL"
            - "${care} == 102300"
            - "${handling} == 0"
            - "${resid} == 0"
            - "EstrayCase.${est_1}.status == SOLD"

  # ===========================================================================
  - section: validations
    instances:
      - name: corner_missing_role_header_returns_unauthenticated
        claim_type: Violation to Error
        grounds: ['validations[priority=10]', 'errors[ERR_UNAUTHENTICATED]']
        distinguishing_aspect: "A request sent with no X-User-Role header at all is refused at priority 10 with 401 ERR_UNAUTHENTICATED before any body validation runs, even though the body is well formed."
        test_recipe:
          setup: ["Empty database. The trigger request is issued with the X-User-Role and X-User-ID headers omitted entirely."]
          setup_api_calls:
            - call: "POST /brand-inspection/_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-01T00:00:00Z" }
              as: BoardAdmin
          trigger:
            - call: "POST /brand-inspection/owners"
              payload: { legal_name: "No Header Ranch", mailing_state: "MT", contact_email: "nohdr@example.test" }
              as: BoardAdmin
              captures: { err_id: "$.data.error_id" }
          assert:
            - "the trigger is sent with no X-User-Role and no X-User-ID header"
            - "HTTP 401 and ${err_id} == ERR_UNAUTHENTICATED"

      - name: corner_segregation_of_duties_same_recorder_cannot_record
        claim_type: Violation to Error
        grounds: ['validations[priority=52]', 'errors[ERR_SEGREGATION_OF_DUTIES]', entities.BrandApplication.fields.examined_by_user_id]
        distinguishing_aspect: "The operator id that examined the filing is refused at recording with 403 ERR_SEGREGATION_OF_DUTIES, and a different recorder id then succeeds on the identical request."
        test_recipe:
          setup: ["One brand application UNDER_EXAMINATION whose examined_by_user_id is 'recorder-01'."]
          setup_api_calls:
            - call: "POST /brand-inspection/owners"
              payload: { legal_name: "SoD Ranch", mailing_state: "MT", contact_email: "sod@example.test" }
              as: BoardAdmin
              captures: { own_a: "$.data.id" }
            - call: "POST /brand-inspection/brand-applications"
              payload: { owner_id: "${own_a}", application_type: "NEW", brand_symbol: "SD", position_code: "RIGHT_SHOULDER", species_class: "CATTLE", state_code: "MT" }
              as: LivestockOwner
              as_user_id: "${own_a}"
              captures: { app_a: "$.data.id" }
            - call: "POST /brand-inspection/brand-applications/${app_a}/begin-examination"
              payload: {}
              as: BrandRecorder
              as_user_id: "recorder-01"
              captures: { examiner: "$.data.examined_by_user_id" }
          trigger:
            - call: "POST /brand-inspection/brand-applications/${app_a}/record"
              payload: {}
              as: BrandRecorder
              as_user_id: "recorder-01"
              captures: { err_id: "$.data.error_id" }
            - call: "POST /brand-inspection/brand-applications/${app_a}/record"
              payload: {}
              as: BrandRecorder
              as_user_id: "recorder-02"
              captures: { reg_a: "$.data.id", reg_status: "$.data.status" }
          assert:
            - "${examiner} == recorder-01"
            - "the first trigger call responds HTTP 403 and ${err_id} == ERR_SEGREGATION_OF_DUTIES"
            - "${reg_status} == ACTIVE"
            - "BrandApplication.${app_a}.status == RECORDED and BrandApplication.${app_a}.recorded_by_user_id == recorder-02"

      - name: corner_owner_cannot_file_application_for_another_owner
        claim_type: Violation to Error
        grounds: ['validations[priority=50]', 'errors[ERR_NOT_RESOURCE_OWNER]', roles.LivestockOwner]
        distinguishing_aspect: "LivestockOwner is entity_backed on Owner, so an X-User-ID that does not equal the payload owner_id is refused with 403 ERR_NOT_RESOURCE_OWNER and no application row is written."
        test_recipe:
          setup: ["Two Owners enrolled, A and B."]
          setup_api_calls:
            - call: "POST /brand-inspection/owners"
              payload: { legal_name: "Owner A Ranch", mailing_state: "MT", contact_email: "a@example.test" }
              as: BoardAdmin
              captures: { own_a: "$.data.id" }
            - call: "POST /brand-inspection/owners"
              payload: { legal_name: "Owner B Ranch", mailing_state: "MT", contact_email: "b@example.test" }
              as: BoardAdmin
              captures: { own_b: "$.data.id" }
          trigger:
            - call: "POST /brand-inspection/brand-applications"
              payload: { owner_id: "${own_a}", application_type: "NEW", brand_symbol: "XA", position_code: "LEFT_RIB", species_class: "CATTLE", state_code: "MT" }
              as: LivestockOwner
              as_user_id: "${own_b}"
              captures: { err_id: "$.data.error_id" }
          assert:
            - "HTTP 403 and ${err_id} == ERR_NOT_RESOURCE_OWNER"
            - "GET /brand-inspection/brand-applications?owner_id=${own_a} returns total_count 0"

      - name: corner_scheduled_window_outside_requested_window_rejected
        claim_type: Violation to Error
        grounds: ['validations[priority=30]', 'errors[ERR_INVALID_REQUEST]', entities.InspectionOrder.fields.requested_window_end_at]
        distinguishing_aspect: "The scheduled window must sit inside the requested window: an end at 18:00Z against a requested end of 17:00Z is refused with 400 ERR_INVALID_REQUEST and the inspector's version is untouched."
        test_recipe:
          setup: ["One REQUESTED order in district T-WIN with a requested window of 2026-08-10T08:00:00Z to 2026-08-10T17:00:00Z and one free inspector at version 1."]
          setup_api_calls:
            - call: "POST /brand-inspection/owners"
              payload: { legal_name: "Window Ranch", mailing_state: "MT", contact_email: "win@example.test" }
              as: BoardAdmin
              captures: { own_a: "$.data.id" }
            - call: "POST /brand-inspection/territories"
              payload: { territory_code: "T-WIN", state_code: "MT", travel_surcharge_cents: 2500, impound_capacity_head: 100 }
              as: BoardAdmin
              captures: { terr_w: "$.data.id" }
            - call: "POST /brand-inspection/inspectors"
              payload: { badge_number: "WN-001", home_territory_id: "${terr_w}", certification_expires_on: "2027-12-31T00:00:00Z" }
              as: BoardAdmin
              captures: { insp_1: "$.data.id", insp_1_v: "$.data.version" }
            - call: "POST /brand-inspection/inspection-orders"
              payload: { owner_id: "${own_a}", territory_id: "${terr_w}", inspection_purpose: "SALE", requested_window_start_at: "2026-08-10T08:00:00Z", requested_window_end_at: "2026-08-10T17:00:00Z" }
              as: LivestockOwner
              as_user_id: "${own_a}"
              captures: { ord_1: "$.data.id" }
          trigger:
            - call: "POST /brand-inspection/inspection-orders/${ord_1}/schedule"
              payload: { inspector_id: "${insp_1}", scheduled_start_at: "2026-08-10T16:00:00Z", scheduled_end_at: "2026-08-10T18:00:00Z", expected_inspector_version: "${insp_1_v}" }
              as: BoardAdmin
              captures: { err_id: "$.data.error_id" }
          assert:
            - "HTTP 400 and ${err_id} == ERR_INVALID_REQUEST"
            - "InspectionOrder.${ord_1}.schedule_status == REQUESTED"
            - "Inspector.${insp_1}.version == 1"

      - name: corner_cross_state_inspector_assignment_rejected
        claim_type: Cross-entity validation
        grounds: ['validations[priority=76]', 'errors[ERR_TERRITORY_MISMATCH]']
        distinguishing_aspect: "An inspector homed in a WY district cannot be assigned to an MT order: the state_code comparison fails with 422 ERR_TERRITORY_MISMATCH even though the window is free and the commission is ACTIVE."
        test_recipe:
          setup: ["District T-MT in state MT and district T-WY in state WY; one inspector homed in T-WY at version 1; one REQUESTED order in T-MT."]
          setup_api_calls:
            - call: "POST /brand-inspection/owners"
              payload: { legal_name: "Border Ranch", mailing_state: "MT", contact_email: "border@example.test" }
              as: BoardAdmin
              captures: { own_a: "$.data.id" }
            - call: "POST /brand-inspection/territories"
              payload: { territory_code: "T-MT", state_code: "MT", travel_surcharge_cents: 2500, impound_capacity_head: 100 }
              as: BoardAdmin
              captures: { terr_mt: "$.data.id" }
            - call: "POST /brand-inspection/territories"
              payload: { territory_code: "T-WY", state_code: "WY", travel_surcharge_cents: 2500, impound_capacity_head: 100 }
              as: BoardAdmin
              captures: { terr_wy: "$.data.id" }
            - call: "POST /brand-inspection/inspectors"
              payload: { badge_number: "BD-001", home_territory_id: "${terr_wy}", certification_expires_on: "2027-12-31T00:00:00Z" }
              as: BoardAdmin
              captures: { insp_wy: "$.data.id", insp_wy_v: "$.data.version" }
            - call: "POST /brand-inspection/inspection-orders"
              payload: { owner_id: "${own_a}", territory_id: "${terr_mt}", inspection_purpose: "SALE", requested_window_start_at: "2026-08-10T08:00:00Z", requested_window_end_at: "2026-08-10T17:00:00Z" }
              as: LivestockOwner
              as_user_id: "${own_a}"
              captures: { ord_1: "$.data.id" }
          trigger:
            - call: "POST /brand-inspection/inspection-orders/${ord_1}/schedule"
              payload: { inspector_id: "${insp_wy}", scheduled_start_at: "2026-08-10T09:00:00Z", scheduled_end_at: "2026-08-10T11:00:00Z", expected_inspector_version: "${insp_wy_v}" }
              as: BoardAdmin
              captures: { err_id: "$.data.error_id" }
          assert:
            - "HTTP 422 and ${err_id} == ERR_TERRITORY_MISMATCH"
            - "InspectionOrder.${ord_1}.schedule_status == REQUESTED and InspectionOrder.${ord_1}.inspector_id == null"
            - "Inspector.${insp_wy}.version == 1"

      - name: corner_duplicate_document_number_rejected
        claim_type: Violation to Error
        grounds: ['validations[priority=72]', 'errors[ERR_DUPLICATE_DOCUMENT_NUMBER]']
        distinguishing_aspect: "BillOfSale.document_number is unique across all rows, so a second instrument numbered BOS-DUP is refused with 409 ERR_DUPLICATE_DOCUMENT_NUMBER."
        test_recipe:
          setup: ["Two Owners and one BillOfSale already recorded with document_number BOS-DUP."]
          setup_api_calls:
            - call: "POST /brand-inspection/owners"
              payload: { legal_name: "Dup Seller", mailing_state: "MT", contact_email: "dseller@example.test" }
              as: BoardAdmin
              captures: { own_s: "$.data.id" }
            - call: "POST /brand-inspection/owners"
              payload: { legal_name: "Dup Buyer", mailing_state: "MT", contact_email: "dbuyer@example.test" }
              as: BoardAdmin
