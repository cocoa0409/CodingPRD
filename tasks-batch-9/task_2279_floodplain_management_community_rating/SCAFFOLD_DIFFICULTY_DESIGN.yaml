            - "RepetitiveLossArea.${rla_id}.outreach_crs_cycle_id == null"
            - "RepetitiveLossArea.${rla_id}.target_property_count == 0"
            - "RepetitiveLossArea.${rla_id}.status == DESIGNATED"
            - "RepetitiveLossArea.${rla_id}.analysis_status == ANALYZED"
            - "RepetitiveLossArea.${rla_id}.property_count == 1"

      - name: permit_approval_requires_resolved_determination_case
        grounds:
