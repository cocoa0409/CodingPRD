          GuestAccount is the only entity in the API with a PATCH, and the API has no DELETE at all -
          every other entity mutates through action endpoints and retires into a terminal state. It is
          also the only entity with no collection GET, so the account is reachable by id or through
          GET /ticket-orders?guest_account_id= and nowhere else. The PATCH is the merge-semantics
          corner: three optional fields, so an implementation that overwrites the whole row wipes the
