# =====================================================================
# §1.8 Scaffold Difficulty Design (Test Targeting Index)
# Task 2380 — Commercial Tire Program & Retread Management
#
# Every instance grounds in elements already declared in SCAFFOLD.yaml
# §1.1–§1.7. Deleting this file leaves the declared behaviour identical.
#
# Shared fixture conventions used by the setup chains below:
#   - the logical clock starts at 2026-08-01T00:00:00Z and is only moved by
#     instances that explicitly need it;
#   - the DRIVE tire policy is min_tread_depth_32nds=4, pull_point_32nds=6,
#     new_tire_tread_depth_32nds=24, target_pressure_psi=100,
#     pressure_tolerance_pct=0.10, max_retread_count=3;
#   - every asserted numeric literal below was produced by executing the
#     corresponding §1.3 formula against its declared constants.
# =====================================================================
scaffold_difficulty_design:

  # ===================================================================
  # RULE 1 — Dual-variant calculations across different entity domains
  # ===================================================================
  - rule_id: dual_variant_calc
    instances:

      - name: casing_credit_provisional_vs_production_verified
        grounds:
          - calculations.casing_credit_accrual
          - entities.Casing.fields.provisional_credit_cents
          - entities.CasingCreditEntry.fields.entry_type
          - entities.RetreadJob.fields.retread_count_at_scheduling
          - state_machines.Casing.IN_RETREAD_to_RETREADED
        distinguishing_aspect: |
          This dual-variant calculation lives in the casing-credit LEDGER domain: the
          same casing yields 8925 cents under variant GRADE_PROVISIONAL and 9818 cents
          under variant PRODUCTION_VERIFIED, and the system posts only the 893-cent
          DELTA as an ADJUSTMENT entry rather than re-posting the gross figure.
        test_recipe:
          setup:
            - "one service location, one national-account fleet, and an ACTIVE agreement effective 2026-07-01..2026-12-31 whose casing_credit_rate_cents is 15000"
            - "a DRIVE tire policy for that fleet with max_retread_count 3"
            - "a casing already carrying retread_count 1, collected and graded B (so decay_factor = 1 - 0.15*1 = 0.85)"
            - "one available retread line and a retread job scheduled, started and ready to complete"
            - "the logical clock is left at its 2026-08-01T00:00:00Z default so the ACTIVE agreement window covers the accrual"
          setup_api_calls:
            - call: "POST /service-locations"
              payload: { name: "Northgate Commercial", location_code: "NGC", state_code: "OH", road_service_response_minutes_committed: 120, scrap_permit_number: "OH-SCRAP-8811", scrap_permit_expires_on: "2027-12-31", is_retread_plant: true }
              as: DealerAdmin
              captures: { loc_id: $.data.id }
            - call: "POST /fleet-accounts"
              payload: { name: "Ridgeline Freight", account_type: "NATIONAL_ACCOUNT", home_location_id: "${loc_id}", billing_mode: "CROSS_LOCATION" }
              as: DealerAdmin
              captures: { fleet_id: $.data.id }
            - call: "POST /national-agreements"
              payload: { fleet_account_id: "${fleet_id}", agreement_code: "RID-2026", effective_from: "2026-07-01", effective_to: "2026-12-31", tier_discount_pct: 0.125, casing_credit_rate_cents: 15000, emergency_response_minutes: 90, emergency_labor_rate_cents_per_hour: 13000 }
              as: DealerAdmin
              captures: { agr_id: $.data.id }
            - call: "POST /national-agreements/${agr_id}/activate"
              payload: {}
              as: DealerAdmin
            - call: "POST /fleet-accounts/${fleet_id}/tire-policies"
              payload: { position: "DRIVE", target_pressure_psi: 100, pressure_tolerance_pct: 0.10, min_tread_depth_32nds: 4, pull_point_32nds: 6, max_retread_count: 3, approved_brands: ["Bridgestone", "Michelin"], new_tire_tread_depth_32nds: 24, casing_spec_code: "ANY" }
              as: DealerAdmin
            - call: "POST /service-locations/${loc_id}/retread-lines"
              payload: { line_code: "L1", cure_cooldown_minutes: 30 }
              as: DealerAdmin
              captures: { line_id: $.data.id }
            - call: "POST /casings"
              payload: { fleet_account_id: "${fleet_id}", casing_serial: "CS-0001", brand: "Bridgestone", casing_spec_code: "ANY", intended_position: "DRIVE", scrap_weight_lbs: 125, retread_count: 1 }
              as: DealerAdmin
              captures: { casing_id: $.data.id }
            - call: "POST /casings/${casing_id}/collect"
              payload: { collected_at_location_id: "${loc_id}" }
              as: TireTechnician
              captures: { casing_v2: $.data.version }
            - call: "POST /casings/${casing_id}/inspect"
              payload: { grade: "B", expected_casing_version: "${casing_v2}" }
              as: CasingInspector
              as_user_id: "inspector-1"
            - call: "POST /retread-jobs"
              payload: { casing_id: "${casing_id}", retread_line_id: "${line_id}", tread_design_code: "TD-DRIVE-A", scheduled_start_at: "2026-08-20T08:00:00Z", scheduled_end_at: "2026-08-20T12:00:00Z" }
              as: PlantScheduler
              captures: { job_id: $.data.id }
            - call: "POST /retread-jobs/${job_id}/start"
              payload: { started_at: "2026-08-20T08:00:00Z" }
              as: PlantScheduler
          trigger:
            - call: "POST /retread-jobs/${job_id}/complete"
              payload: { completed_at: "2026-08-20T10:00:00Z", cost_basis_cents: 32000 }
              as: PlantScheduler
          assert:
            - "the CasingCreditEntry with entry_type ACCRUAL for Casing.${casing_id} has amount_cents == 8925 (GRADE_PROVISIONAL: 15000 * 0.70 * 0.85)"
            - "exactly one CasingCreditEntry with entry_type ADJUSTMENT exists for Casing.${casing_id} and its amount_cents == 893 (9818 - 8925), NOT 9818"
            - "Casing.${casing_id}.provisional_credit_cents == 9818"
            - "FleetAccount.${fleet_id}.casing_credit_balance_cents == 9818"
            - "RetreadJob.${job_id}.warranty_months == 18 and RetreadJob.${job_id}.warranty_expires_on == \"2028-02-20\""
            - "Casing.${casing_id}.retread_count == 2 and Casing.${casing_id}.inspection_grade == null"

      - name: cost_per_mile_historical_actual_vs_forward_projected
        grounds:
          - calculations.cost_per_mile
          - entities.TireAsset.fields.odometer_at_mount
          - entities.TireAsset.fields.tread_depth_at_mount_32nds
          - entities.TireSurvey.fields.odometer_miles
          - entities.TirePolicy.fields.pull_point_32nds
        distinguishing_aspect: |
          This dual-variant calculation lives in the FLEET ASSET ANALYTICS domain (TireAsset
          plus TireSurvey plus Vehicle), not the ledger: the identical asset set returns
          0.8333 cents/mile under HISTORICAL_ACTUAL and 0.4167 cents/mile under
          FORWARD_PROJECTED, because the denominator switches from miles actually run
          (60000) to projected life to the policy pull point (120000).
        test_recipe:
          setup:
            - "one location, one fleet, and a DRIVE tire policy with pull_point_32nds 6"
            - "a TRACTOR unit whose odometer read 100000 at mount"
            - "one Bridgestone tire asset with cost_basis_cents 50000 mounted at DRIVE with odometer_at_mount 100000 and tread_depth_at_mount_32nds 24"
            - "one compliant survey at odometer 160000 with tread_depth_32nds 15 (miles_run 60000, tread_consumed 9, usable_32nds 18)"
            - "no national agreement is needed: cost-per-mile never reads pricing terms"
          setup_api_calls:
            - call: "POST /service-locations"
              payload: { name: "Southline Commercial", location_code: "SLC", state_code: "IN", road_service_response_minutes_committed: 120, scrap_permit_number: "IN-SCRAP-2201", scrap_permit_expires_on: "2027-12-31" }
              as: DealerAdmin
              captures: { loc_id: $.data.id }
            - call: "POST /fleet-accounts"
              payload: { name: "Corvus Logistics", account_type: "SINGLE_LOCATION", home_location_id: "${loc_id}", billing_mode: "DIRECT" }
              as: DealerAdmin
              captures: { fleet_id: $.data.id }
            - call: "POST /fleet-accounts/${fleet_id}/tire-policies"
              payload: { position: "DRIVE", target_pressure_psi: 100, pressure_tolerance_pct: 0.10, min_tread_depth_32nds: 4, pull_point_32nds: 6, max_retread_count: 3, approved_brands: ["Bridgestone"], new_tire_tread_depth_32nds: 24, casing_spec_code: "ANY" }
              as: DealerAdmin
            - call: "POST /fleet-accounts/${fleet_id}/vehicles"
              payload: { unit_number: "T-410", vehicle_type: "TRACTOR", current_odometer_miles: 100000 }
              as: DealerAdmin
              captures: { veh_id: $.data.id }
            - call: "POST /casings"
              payload: { fleet_account_id: "${fleet_id}", casing_serial: "CS-1100", brand: "Bridgestone", casing_spec_code: "ANY", intended_position: "DRIVE", scrap_weight_lbs: 125 }
              as: DealerAdmin
              captures: { casing_id: $.data.id }
            - call: "POST /tire-assets"
              payload: { fleet_account_id: "${fleet_id}", casing_id: "${casing_id}", brand: "Bridgestone", cost_basis_cents: 50000 }
              as: DealerAdmin
              captures: { asset_id: $.data.id }
            - call: "POST /tire-assets/${asset_id}/mount"
              payload: { vehicle_id: "${veh_id}", position: "DRIVE", mounted_at: "2026-08-02T09:00:00Z", odometer_at_mount: 100000, tread_depth_at_mount_32nds: 24 }
              as: TireTechnician
            - call: "POST /tire-assets/${asset_id}/surveys"
              payload: { surveyed_at: "2026-08-20T09:00:00Z", pressure_psi: 100, tread_depth_32nds: 15, odometer_miles: 160000 }
              as: TireTechnician
          trigger:
            - call: "GET /fleet-accounts/${fleet_id}/cost-per-mile"
              payload: { variant: "HISTORICAL_ACTUAL" }
              as: DealerAdmin
            - call: "GET /fleet-accounts/${fleet_id}/cost-per-mile"
              payload: { variant: "FORWARD_PROJECTED" }
              as: DealerAdmin
          assert:
            - "the HISTORICAL_ACTUAL response has group_count == 1, excluded_asset_count == 0, and its single group (brand \"Bridgestone\", position DRIVE, vehicle_type TRACTOR) has cpm_cents == 0.8333"
            - "the FORWARD_PROJECTED response has group_count == 1 and its single group has cpm_cents == 0.4167"
            - "the two variants read the identical asset set, so the difference is attributable only to the denominator (60000 miles run vs 120000 projected life miles)"

  # ===================================================================
  # RULE 2 — Combinatorial formulas across different modes
  # ===================================================================
  - rule_id: combinatorial_formula
    instances:

      - name: road_service_pricing_nested_max_min_with_cap
        grounds:
          - calculations.road_service_response_and_pricing
          - entities.RoadServiceCall.fields.gross_cents
          - entities.RoadServiceCall.fields.sla_credit_cents
          - entities.NationalAgreement.fields.emergency_labor_rate_cents_per_hour
          - state_machines.RoadServiceCall.ON_SITE_to_COMPLETED
        distinguishing_aspect: |
          MODE (a): five interacting inputs (priority, dispatch hour, agreement labour rate,
          labour hours, dispatch miles) combine through a nested max() over two multipliers
          that deliberately do NOT stack, then a min() cap that BINDS at 40000 (the
          uncapped surcharge would have been 92550), then a conditional SLA-miss credit —
          producing gross_cents 163400 and invoice_total_cents 130720.
        test_recipe:
          setup:
            - "location with road_service_response_minutes_committed 120"
            - "ACTIVE agreement with emergency_response_minutes 90 and emergency_labor_rate_cents_per_hour 13000"
            - "an EMERGENCY call reported at 2026-08-10T04:00:00Z, dispatched at 04:30Z (UTC hour 4, so after-hours), 240 dispatch miles"
            - "the technician arrives at 06:00Z — 120 actual minutes against a 90-minute commitment, so the SLA is missed"
            - "labour is 3.5 hours"
          setup_api_calls:
            - call: "POST /service-locations"
              payload: { name: "Eastyard Commercial", location_code: "EYC", state_code: "OH", road_service_response_minutes_committed: 120, scrap_permit_number: "OH-SCRAP-4400", scrap_permit_expires_on: "2027-12-31" }
              as: DealerAdmin
              captures: { loc_id: $.data.id }
            - call: "POST /fleet-accounts"
              payload: { name: "Vanguard Haul", account_type: "NATIONAL_ACCOUNT", home_location_id: "${loc_id}", billing_mode: "CROSS_LOCATION" }
              as: DealerAdmin
              captures: { fleet_id: $.data.id }
            - call: "POST /national-agreements"
              payload: { fleet_account_id: "${fleet_id}", agreement_code: "VAN-2026", effective_from: "2026-07-01", effective_to: "2026-12-31", tier_discount_pct: 0.125, casing_credit_rate_cents: 15000, emergency_response_minutes: 90, emergency_labor_rate_cents_per_hour: 13000 }
              as: DealerAdmin
              captures: { agr_id: $.data.id }
            - call: "POST /national-agreements/${agr_id}/activate"
              payload: {}
              as: DealerAdmin
            - call: "POST /fleet-accounts/${fleet_id}/vehicles"
              payload: { unit_number: "T-77", vehicle_type: "TRACTOR", current_odometer_miles: 250000 }
              as: DealerAdmin
              captures: { veh_id: $.data.id }
            - call: "POST /service-locations/${loc_id}/technicians"
              payload: { name: "Dale R", certification_level: "TIA_CERTIFIED" }
              as: DealerAdmin
              captures: { tech_id: $.data.id }
            - call: "POST /road-service-calls"
              payload: { fleet_account_id: "${fleet_id}", vehicle_id: "${veh_id}", service_location_id: "${loc_id}", priority: "EMERGENCY", complaint: "Drive tire blowout", reported_at: "2026-08-10T04:00:00Z" }
              as: DispatchCoordinator
              captures: { call_id: $.data.id }
            - call: "POST /road-service-calls/${call_id}/dispatch"
              payload: { dispatched_at: "2026-08-10T04:30:00Z", dispatch_miles: 240, technician_id: "${tech_id}" }
              as: DispatchCoordinator
            - call: "POST /road-service-calls/${call_id}/arrive"
              payload: { arrived_at: "2026-08-10T06:00:00Z" }
              as: TireTechnician
              as_user_id: "${tech_id}"
          trigger:
            - call: "POST /road-service-calls/${call_id}/complete"
              payload: { closed_at: "2026-08-10T07:30:00Z", labor_hours: 3.5 }
              as: TireTechnician
              as_user_id: "${tech_id}"
          assert:
            - "RoadServiceCall.${call_id}.committed_response_minutes == 90 (min(120, 90); the NORMAL grace is not applied)"
            - "RoadServiceCall.${call_id}.actual_response_minutes == 120 and sla_met == false"
            - "RoadServiceCall.${call_id}.gross_cents == 163400 (9500 + 45500 labour + 68400 mileage + 40000 capped surcharge)"
            - "the surcharge component is exactly 40000, not 92550 — the min() cap binds"
            - "the multipliers do not stack: the surcharge is computed from 1.75, never from 1.75 * 1.35"
            - "RoadServiceCall.${call_id}.sla_credit_cents == 32680 and invoice_total_cents == 130720"

      - name: invoice_discount_per_line_rounding_order
        grounds:
          - calculations.cross_location_invoice_rollup
          - entities.CrossLocationInvoice.fields.discount_cents
          - entities.NationalAgreement.fields.tier_discount_pct
          - entities.RoadServiceCall.fields.invoice_total_cents
        distinguishing_aspect: |
          MODE (b): nested rounding where the order changes the cents. Two lines of 12820
          and 16140 cents at tier_discount_pct 0.125 each produce a .5 remainder, so
          rounding per line then summing yields discount_cents 3621 while the forbidden
          sum-then-round yields 3620 — a one-cent divergence on the same inputs.
        test_recipe:
          setup:
            - "ACTIVE agreement with tier_discount_pct 0.125 covering 2026-07-01..2026-12-31"
            - "two COMPLETED, UNBILLED NORMAL-priority calls whose invoice_total_cents are exactly 12820 (0.25 h, 2 miles) and 16140 (0.5 h, 4 miles), both closed inside the billing period and both SLA-met so no credit is deducted"
            - "the fleet's casing_credit_balance_cents is 0, so the credit step contributes nothing and the discount is observed in isolation"
          setup_api_calls:
            - call: "POST /service-locations"
              payload: { name: "Westgate Commercial", location_code: "WGC", state_code: "OH", road_service_response_minutes_committed: 120, scrap_permit_number: "OH-SCRAP-5500", scrap_permit_expires_on: "2027-12-31" }
              as: DealerAdmin
              captures: { loc_id: $.data.id }
            - call: "POST /fleet-accounts"
              payload: { name: "Meridian Transit", account_type: "NATIONAL_ACCOUNT", home_location_id: "${loc_id}", billing_mode: "CROSS_LOCATION" }
              as: DealerAdmin
              captures: { fleet_id: $.data.id }
            - call: "POST /national-agreements"
              payload: { fleet_account_id: "${fleet_id}", agreement_code: "MER-2026", effective_from: "2026-07-01", effective_to: "2026-12-31", tier_discount_pct: 0.125, casing_credit_rate_cents: 15000, emergency_response_minutes: 90, emergency_labor_rate_cents_per_hour: 13000 }
              as: DealerAdmin
              captures: { agr_id: $.data.id }
            - call: "POST /national-agreements/${agr_id}/activate"
              payload: {}
              as: DealerAdmin
            - call: "POST /fleet-accounts/${fleet_id}/vehicles"
              payload: { unit_number: "T-1", vehicle_type: "TRACTOR", current_odometer_miles: 10000 }
              as: DealerAdmin
              captures: { veh1_id: $.data.id }
            - call: "POST /fleet-accounts/${fleet_id}/vehicles"
              payload: { unit_number: "T-2", vehicle_type: "TRACTOR", current_odometer_miles: 20000 }
              as: DealerAdmin
              captures: { veh2_id: $.data.id }
            - call: "POST /service-locations/${loc_id}/technicians"
              payload: { name: "Pat K", certification_level: "LEVEL_2" }
              as: DealerAdmin
              captures: { tech_id: $.data.id }
            - call: "POST /road-service-calls"
              payload: { fleet_account_id: "${fleet_id}", vehicle_id: "${veh1_id}", service_location_id: "${loc_id}", priority: "NORMAL", complaint: "Slow leak", reported_at: "2026-08-05T13:00:00Z" }
              as: DispatchCoordinator
              captures: { call1_id: $.data.id }
            - call: "POST /road-service-calls/${call1_id}/dispatch"
              payload: { dispatched_at: "2026-08-05T13:05:00Z", dispatch_miles: 2, technician_id: "${tech_id}" }
              as: DispatchCoordinator
            - call: "POST /road-service-calls/${call1_id}/arrive"
              payload: { arrived_at: "2026-08-05T13:30:00Z" }
              as: TireTechnician
              as_user_id: "${tech_id}"
            - call: "POST /road-service-calls/${call1_id}/complete"
              payload: { closed_at: "2026-08-05T14:00:00Z", labor_hours: 0.25 }
              as: TireTechnician
              as_user_id: "${tech_id}"
            - call: "POST /road-service-calls"
              payload: { fleet_account_id: "${fleet_id}", vehicle_id: "${veh2_id}", service_location_id: "${loc_id}", priority: "NORMAL", complaint: "Trailer tire down", reported_at: "2026-08-06T13:00:00Z" }
              as: DispatchCoordinator
              captures: { call2_id: $.data.id }
            - call: "POST /road-service-calls/${call2_id}/dispatch"
              payload: { dispatched_at: "2026-08-06T13:05:00Z", dispatch_miles: 4, technician_id: "${tech_id}" }
              as: DispatchCoordinator
            - call: "POST /road-service-calls/${call2_id}/arrive"
              payload: { arrived_at: "2026-08-06T13:30:00Z" }
              as: TireTechnician
              as_user_id: "${tech_id}"
            - call: "POST /road-service-calls/${call2_id}/complete"
              payload: { closed_at: "2026-08-06T14:00:00Z", labor_hours: 0.5 }
              as: TireTechnician
              as_user_id: "${tech_id}"
            - call: "GET /fleet-accounts/${fleet_id}"
              payload: {}
              as: DealerAdmin
              captures: { fleet_v: $.data.version }
          trigger:
            - call: "POST /cross-location-invoices"
              payload: { fleet_account_id: "${fleet_id}", billing_period_start: "2026-08-01", billing_period_end: "2026-08-31", expected_fleet_account_version: "${fleet_v}" }
              as: BillingClerk
              captures: { inv_id: $.data.id }
          assert:
            - "RoadServiceCall.${call1_id}.invoice_total_cents == 12820 and RoadServiceCall.${call2_id}.invoice_total_cents == 16140"
            - "CrossLocationInvoice.${inv_id}.subtotal_cents == 28960"
            - "CrossLocationInvoice.${inv_id}.discount_cents == 3621 (1603 + 2018), NOT 3620"
            - "CrossLocationInvoice.${inv_id}.net_before_credit_cents == 25339"
            - "CrossLocationInvoice.${inv_id}.credit_applied_cents == 0 and total_cents == 25339"
            - "CrossLocationInvoice.${inv_id}.line_count == 2 and both calls have billing_status INVOICED"

      - name: invoice_credit_cap_evaluation_order
        grounds:
          - calculations.cross_location_invoice_rollup
          - entities.CrossLocationInvoice.fields.credit_applied_cents
          - entities.CrossLocationInvoice.fields.total_cents
          - entities.FleetAccount.fields.casing_credit_balance_cents
        distinguishing_aspect: |
          MODE (c): the apparent circularity total = net - credit where credit is capped by
          a percentage is broken by pinning the cap to net_before_credit_cents. With
          net 25339 the cap is floor(0.25 * 25339) = 6334, so an available balance of 8925
          is clipped to 6334 and total_cents lands on 19005; a cap keyed on total_cents
          would have no well-defined value at all.
        test_recipe:
          setup:
            - "the same two-line fleet as invoice_discount_per_line_rounding_order (subtotal 28960, discount 3621, net 25339)"
            - "additionally, one casing graded B with retread_count 0 under a 15000-cent agreement rate, giving the fleet a casing_credit_balance_cents of 10500 before any application"
            - "the balance available for the cap comparison is therefore 10500, which exceeds the 6334 cap, so the cap is the binding term"
          setup_api_calls:
            - call: "POST /service-locations"
              payload: { name: "Capline Commercial", location_code: "CLC", state_code: "OH", road_service_response_minutes_committed: 120, scrap_permit_number: "OH-SCRAP-6600", scrap_permit_expires_on: "2027-12-31" }
              as: DealerAdmin
              captures: { loc_id: $.data.id }
            - call: "POST /fleet-accounts"
              payload: { name: "Cap Freight", account_type: "NATIONAL_ACCOUNT", home_location_id: "${loc_id}", billing_mode: "CROSS_LOCATION" }
              as: DealerAdmin
              captures: { fleet_id: $.data.id }
            - call: "POST /national-agreements"
              payload: { fleet_account_id: "${fleet_id}", agreement_code: "CAP-2026", effective_from: "2026-07-01", effective_to: "2026-12-31", tier_discount_pct: 0.125, casing_credit_rate_cents: 15000, emergency_response_minutes: 90, emergency_labor_rate_cents_per_hour: 13000 }
              as: DealerAdmin
              captures: { agr_id: $.data.id }
            - call: "POST /national-agreements/${agr_id}/activate"
              payload: {}
              as: DealerAdmin
            - call: "POST /fleet-accounts/${fleet_id}/tire-policies"
              payload: { position: "DRIVE", target_pressure_psi: 100, pressure_tolerance_pct: 0.10, min_tread_depth_32nds: 4, pull_point_32nds: 6, max_retread_count: 3, approved_brands: ["Bridgestone"], new_tire_tread_depth_32nds: 24, casing_spec_code: "ANY" }
              as: DealerAdmin
            - call: "POST /fleet-accounts/${fleet_id}/vehicles"
              payload: { unit_number: "T-1", vehicle_type: "TRACTOR", current_odometer_miles: 10000 }
              as: DealerAdmin
              captures: { veh1_id: $.data.id }
            - call: "POST /fleet-accounts/${fleet_id}/vehicles"
              payload: { unit_number: "T-2", vehicle_type: "TRACTOR", current_odometer_miles: 20000 }
              as: DealerAdmin
              captures: { veh2_id: $.data.id }
            - call: "POST /service-locations/${loc_id}/technicians"
              payload: { name: "Jo M", certification_level: "LEVEL_2" }
              as: DealerAdmin
              captures: { tech_id: $.data.id }
            - call: "POST /road-service-calls"
