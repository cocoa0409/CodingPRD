  # ---- project and owner administration --------------------------------------
  - method: POST
    path: /uro/projects
    description: Register a highway project with its construction window, right-of-way acquisition year and reimbursement authority
    roles: [ProgramAdmin]
    code: 201
    input: [name, route_designation, letting_date, construction_start_date, construction_end_date, row_acquisition_year, reimbursement_authority_cents, contract_daily_overhead_cents]
    output: Project
    side_effects: ["status = PLANNING", "clearance_posture = CLEARANCE_PENDING per calculations.project_clearance_posture rule 3 (no conflicts yet)", "open_conflict_count, estimated_state_liability_cents, total_committed_reimbursement_cents and aggregate_compensable_delay_days initialised to 0"]
  - method: PATCH
    path: /uro/projects/{id}
    description: Revise a project's programmed authority, daily overhead ceiling or letting date
    roles: [ProgramAdmin]
    code: 200
    input: ["reimbursement_authority_cents?", "contract_daily_overhead_cents?", "letting_date?"]
    output: Project
    side_effects: ["recompute clearance_posture (calculations.project_clearance_posture) — lowering reimbursement_authority_cents below either money figure flips the posture to FUNDING_BLOCKED", "increment Project.version by 1"]
  - method: POST
    path: /uro/projects/{id}/close
    description: Close a project once every conflict is cleared and every agreement is settled or voided out
    roles: [ProgramAdmin]
    code: 200
    input: ["closure_note?"]
    output: Project
    side_effects: ["status -> CLOSED", "increment Project.version by 1"]
  - method: POST
    path: /uro/utility-owners
    description: Register a utility owner with its audited indirect cost rate
    roles: [ProgramAdmin]
    code: 201
    input: [legal_name, utility_type, "is_public_agency?", indirect_cost_rate_pct]
    output: UtilityOwner
    side_effects: ["delinquency_strikes = 0, reimbursement_hold = false, open_commitment_days = 0, assessed_delay_liability_cents = 0"]
  - method: POST
    path: /uro/utility-owners/{id}/release-hold
    description: Release a utility owner's reimbursement hold after a delinquency conference, reversing the hold cascade
    roles: [ProgramAdmin]
    code: 200
    input: [release_note]
    output: UtilityOwner
    side_effects:
      - "reimbursement_hold -> false and delinquency_strikes reset to 0"
      - "every ReimbursementAgreement of this owner in settlement_status HELD returns to PENDING_FINAL_INVOICE"
      - "every CostDocument of those agreements in review_status HELD returns to SUBMITTED"
      - "increment UtilityOwner.version by 1"
  - method: POST
    path: /uro/facilities
    description: Record a utility facility of record with its occupancy basis, depth and installation year
    roles: [ProgramAdmin, UtilityCoordinator]
    code: 201
    input: [owner_id, facility_type, station_begin, station_end, offset_ft, depth_in, material, installed_year, occupancy_basis, record_source]
    output: UtilityFacility
    side_effects: []
  - method: POST
    path: /uro/investigations
    description: Record an immutable subsurface investigation result (test hole, geophysics, surface marking or record research)
    roles: [UtilityCoordinator]
    code: 201
    input: [project_id, facility_id, quality_level, method, measured_depth_in, station_at_investigation]
    output: SubsurfaceInvestigation
    side_effects:
      - "performed_at stamped from the logical clock"
      - "contradicts_record computed as abs(measured_depth_in - facility.depth_in) > DEPTH_TOLERANCE_IN (calculations.prior_rights_state_share step 0)"
      - "no version field and no update endpoint: the record is immutable once written"

  # ---- conflict identification and prior rights -------------------------------
  - method: POST
    path: /uro/conflicts
    description: Open a utility conflict between the design and a facility of record, optionally sequenced behind another conflict
    roles: [UtilityCoordinator]
    code: 201
    input: [project_id, facility_id, conflict_station, clearance_deficiency_in, "depends_on_conflict_id?"]
    output: UtilityConflict
    side_effects:
      - "status = IDENTIFIED and state_share_pct = null"
      - "recompute Project.open_conflict_count"
      - "recompute Project.clearance_posture, which becomes AT_RISK because an IDENTIFIED conflict exists (rule 2)"
  - method: POST
    path: /uro/conflicts/{id}/set-resolution
    description: Select the engineering resolution for a conflict (relocate, protect in place, abandon, or no conflict)
    roles: [UtilityCoordinator]
    code: 200
    input: [resolution_type]
    output: UtilityConflict
    side_effects:
      - "status IDENTIFIED -> RESOLUTION_SELECTED for every resolution_type; a non-relocation resolution still has to be certified with POST /uro/conflicts/{id}/certify-cleared before it counts as CLEARED"
      - "on a non-relocation resolution_type no PriorRightsDetermination is required, so state_share_pct stays null and the conflict contributes 0 to calculations.project_state_liability_estimate"
      - "recompute Project.clearance_posture"
      - "increment UtilityConflict.version by 1"
  - method: POST
    path: /uro/conflicts/{id}/certify-cleared
    description: Certify a relocated conflict as cleared once its work is complete and any predecessor conflict is cleared
    roles: [UtilityCoordinator]
    code: 200
    input: ["certification_note?"]
    output: UtilityConflict
    side_effects:
      - "status RELOCATION_SCHEDULED -> CLEARED on the RELOCATE branch, or RESOLUTION_SELECTED -> CLEARED on the non-relocation branch"
      - "on the RELOCATE branch, lock the conflict's PriorRightsDetermination: status ISSUED -> FINAL"
      - "recompute Project.open_conflict_count"
      - "recompute Project.estimated_state_liability_cents, which drops this conflict's contribution (calculations.project_state_liability_estimate step 1)"
      - "recompute Project.clearance_posture; a resulting CLEAR posture bubbles Project.status CLEARANCE_ACTIVE -> LETTING_READY"
      - "increment UtilityConflict.version by 1"
  - method: POST
    path: /uro/prior-rights
    description: Open a prior-rights determination on a conflict, asserting the occupancy basis claimed by the owner
    roles: [RightOfWayAdjudicator]
    code: 201
    input: [conflict_id, claimed_basis, narrative]
    output: PriorRightsDetermination
    side_effects:
      - "status = DRAFT and appeal_round = 0"
      - "evidence_variant and provisional_state_share_pct computed (calculations.prior_rights_state_share steps 1-4)"
      - "final_state_share_pct stays null until issue"
  - method: POST
    path: /uro/prior-rights/{id}/submit-for-review
    description: Move a drafted determination into adjudicative review
    roles: [RightOfWayAdjudicator]
    code: 200
    input: []
    output: PriorRightsDetermination
    side_effects: ["status DRAFT -> UNDER_REVIEW", "increment PriorRightsDetermination.version by 1"]
  - method: POST
    path: /uro/prior-rights/{id}/return-for-revision
    description: Return a determination under review for revision of its claimed basis or narrative
    roles: [RightOfWayAdjudicator]
    code: 200
    input: [revision_note]
    output: PriorRightsDetermination
    side_effects: ["status UNDER_REVIEW -> RETURNED_FOR_REVISION", "increment PriorRightsDetermination.version by 1"]
  - method: POST
    path: /uro/prior-rights/{id}/revise
    description: Revise a returned determination and send it back into review
    roles: [RightOfWayAdjudicator]
    code: 200
    input: ["claimed_basis?", "narrative?"]
    output: PriorRightsDetermination
    side_effects:
      - "status RETURNED_FOR_REVISION -> DRAFT, and APPEALED -> DRAFT when the owner appealed an issued determination"
      - "recompute evidence_variant and provisional_state_share_pct"
      - "increment PriorRightsDetermination.version by 1"
  - method: POST
    path: /uro/prior-rights/{id}/issue
    description: Issue the determination, freezing the state share the conflict will carry
    roles: [RightOfWayAdjudicator]
    code: 200
    input: []
    output: PriorRightsDetermination
    side_effects:
      - "status UNDER_REVIEW -> ISSUED, both on the first issue and on a re-issue that followed an appeal-and-revise cycle"
      - "final_state_share_pct recomputed from current evidence (calculations.prior_rights_state_share) — a QL_A investigation recorded after the provisional figure changes the answer"
      - "first_issued_by_user_id stamped with X-User-ID on the first issue only, and enforced against re-issue by validation priority 7"
      - "cascade link 1: UtilityConflict.state_share_pct = final_state_share_pct and status RESOLUTION_SELECTED -> RESPONSIBILITY_SET"
      - "cascade link 2: recompute Project.estimated_state_liability_cents (calculations.project_state_liability_estimate)"
      - "cascade link 3: recompute Project.clearance_posture, which becomes FUNDING_BLOCKED when the new estimate exceeds Project.reimbursement_authority_cents"
      - "increment PriorRightsDetermination.version by 1"
  - method: POST
    path: /uro/prior-rights/{id}/appeal
    description: Owner appeal of an issued determination, reopening it for one further round of adjudication
    roles: [UtilityOwnerRep]
    code: 200
    input: [appeal_note]
    output: PriorRightsDetermination
    side_effects:
      - "status ISSUED -> APPEALED and appeal_round incremented by 1"
      - "increment PriorRightsDetermination.version by 1"

  # ---- permitting, easements and joint trench --------------------------------
  - method: POST
    path: /uro/permits
    description: Open a permit, easement acquisition, railroad crossing or environmental clearance record against a conflict
    roles: [UtilityCoordinator]
    code: 201
    input: [conflict_id, permit_type, expires_on]
    output: PermitRecord
    side_effects: ["status = APPLIED and applied_on stamped from the logical clock"]
  - method: POST
    path: /uro/permits/{id}/decide
    description: Record the granting or denial of a permit or easement acquisition
    roles: [UtilityCoordinator]
    code: 200
    input: [decision, "decision_note?"]
    output: PermitRecord
    side_effects:
      - "status APPLIED -> GRANTED when decision == GRANT, with granted_on stamped from the logical clock; APPLIED -> DENIED when decision == DENY"
      - "increment PermitRecord.version by 1"
  - method: POST
    path: /uro/joint-trench-slots
    description: Declare a joint trench opening on a project that several owners may share
    roles: [ConstructionEngineer]
    code: 201
    input: [project_id, segment_code, trench_open_start, trench_open_end, max_occupants]
    output: JointTrenchSlot
    side_effects: ["occupant_count = 0 and status = OPEN"]

  # ---- relocation plan review -------------------------------------------------
  - method: POST
    path: /uro/relocation-plans
    description: Submit a relocation plan for a conflict, superseding any earlier non-superseded plan on the same conflict; requires the conflict version the submitter last observed
    roles: [UtilityCoordinator, UtilityOwnerRep]
    code: 201
    input: [conflict_id, expected_conflict_version, estimated_cost_cents, replacement_in_kind_cost_cents, proposed_capacity_ratio, work_days, "joint_trench_requested?"]
    output: RelocationPlan
    side_effects:
      - "status = SUBMITTED and revision_round = 0"
      - "betterment_ratio and betterment_amount_cents computed (calculations.betterment_credit steps 1-4)"
      - "every earlier RelocationPlan of the same conflict moves to status SUPERSEDED, and its DRAFT or PENDING_OWNER_SIGNATURE agreements move to execution_status VOIDED with settlement_status VOIDED_OUT"
      - "recompute Project.estimated_state_liability_cents from the new governing plan"
      - "recompute Project.clearance_posture"
      - "increment UtilityConflict.version by 1 (the OCC parent)"
  - method: POST
    path: /uro/relocation-plans/{id}/start-review
    description: Take a submitted plan into utility-coordination review
    roles: [UtilityCoordinator]
    code: 200
    input: []
    output: RelocationPlan
    side_effects: ["status SUBMITTED -> UNDER_REVIEW", "increment RelocationPlan.version by 1"]
  - method: POST
    path: /uro/relocation-plans/{id}/request-revision
    description: Return a plan under review to the owner for revision
    roles: [UtilityCoordinator]
    code: 200
    input: [revision_note]
    output: RelocationPlan
    side_effects: ["status UNDER_REVIEW -> REVISION_REQUESTED", "increment RelocationPlan.version by 1"]
  - method: POST
    path: /uro/relocation-plans/{id}/resubmit
    description: Resubmit a revised plan with new cost and capacity figures, up to 3 times
    roles: [UtilityOwnerRep, UtilityCoordinator]
    code: 200
    input: [estimated_cost_cents, replacement_in_kind_cost_cents, proposed_capacity_ratio, work_days]
    output: RelocationPlan
    side_effects:
      - "status REVISION_REQUESTED -> SUBMITTED and revision_round incremented by 1"
      - "recompute betterment_ratio and betterment_amount_cents"
      - "recompute Project.estimated_state_liability_cents and Project.clearance_posture"
      - "increment RelocationPlan.version by 1"
  - method: POST
    path: /uro/relocation-plans/{id}/approve
    description: Approve a plan for scheduling, once prior rights are issued and every permit of the conflict is granted
    roles: [UtilityCoordinator]
    code: 200
    input: []
    output: RelocationPlan
    side_effects:
      - "status UNDER_REVIEW -> APPROVED"
      - "UtilityConflict.status RESPONSIBILITY_SET -> RELOCATION_PLANNED"
      - "recompute Project.estimated_state_liability_cents and Project.clearance_posture"
      - "increment RelocationPlan.version by 1"

  # ---- schedule commitments ---------------------------------------------------
  - method: POST
    path: /uro/commitments
    description: Commit a relocation work window against an approved plan, optionally occupying a joint trench slot
    roles: [UtilityOwnerRep, UtilityCoordinator]
    code: 201
    input: [plan_id, window_start, window_end, committed_work_days, phase_dependency, "joint_trench_slot_id?"]
    output: ScheduleCommitment
    side_effects:
      - "status = COMMITTED, late_days = 0, actual_complete_at = null"
      - "project_id, facility_id and owner_id denormalised from plan.conflict_id"
      - "UtilityConflict.status RELOCATION_PLANNED -> RELOCATION_SCHEDULED"
      - "recompute UtilityOwner.open_commitment_days (calculations.owner_open_commitment_days)"
      - "when joint_trench_slot_id is supplied, increment JointTrenchSlot.occupant_count and set its status to FULL once occupant_count == max_occupants"
      - "recompute Project.clearance_posture"
  - method: POST
    path: /uro/commitments/{id}/start-work
    description: Report that relocation work has started on a committed window
    roles: [UtilityOwnerRep]
    code: 200
    input: []
    output: ScheduleCommitment
    side_effects:
      - "status COMMITTED -> IN_PROGRESS"
      - "Project.status CLEARANCE_ACTIVE or LETTING_READY -> UNDER_CONSTRUCTION on the project's first started commitment"
      - "increment ScheduleCommitment.version by 1"
  - method: POST
    path: /uro/commitments/{id}/report-complete
    description: Report relocation completion; completion after window_end breaches the commitment and starts the delinquency cascade
    roles: [UtilityOwnerRep]
    code: 200
    input: ["completion_note?"]
    output: ScheduleCommitment
    side_effects:
      - "actual_complete_at stamped from the logical clock"
      - "on time (clock <= window_end): status -> COMPLETE and late_days = 0"
      - "late (clock > window_end): status -> BREACHED and late_days = ceil((actual_complete_at - window_end) / 1 day)"
      - "cascade link 1 (late only): increment UtilityOwner.delinquency_strikes by 1"
      - "cascade link 2 (late only): UtilityOwner.reimbursement_hold -> true once delinquency_strikes >= 2 (the delinquency hold threshold)"
      - "cascade link 3 (late only): every ReimbursementAgreement of that owner in settlement_status PENDING_FINAL_INVOICE -> HELD"
      - "cascade link 4 (late only): every CostDocument of those agreements in review_status SUBMITTED -> HELD"
      - "recompute UtilityOwner.open_commitment_days and, when occupying a slot, JointTrenchSlot.occupant_count and status"
      - "recompute Project.clearance_posture"
      - "increment ScheduleCommitment.version by 1"
  - method: POST
    path: /uro/commitments/{id}/cancel
    description: Cancel a commitment that has not completed, releasing its window and trench occupancy
    roles: [UtilityOwnerRep, UtilityCoordinator]
    code: 200
    input: [cancellation_reason]
    output: ScheduleCommitment
    side_effects:
      - "status COMMITTED or IN_PROGRESS -> CANCELLED"
      - "compensating link 1: recompute UtilityOwner.open_commitment_days back to its pre-creation value"
      - "compensating link 2: decrement JointTrenchSlot.occupant_count and return its status to OPEN when it was FULL"
      - "compensating link 3: UtilityConflict.status RELOCATION_SCHEDULED -> RELOCATION_PLANNED when the conflict has no remaining COMMITTED or IN_PROGRESS commitment"
      - "recompute Project.clearance_posture"
      - "increment ScheduleCommitment.version by 1"

  # ---- reimbursement agreements, cost documentation and audit -----------------
  - method: POST
    path: /uro/agreements
    description: Draft a reimbursement agreement against an approved plan on an estimate basis; requires the plan version the drafter last observed
    roles: [AgreementOfficer]
    code: 201
    input: [plan_id, expected_plan_version, not_to_exceed_cents]
    output: ReimbursementAgreement
    side_effects:
      - "execution_status = DRAFT, settlement_status = NOT_STARTED, cost_basis = ESTIMATE_BASIS"
      - "project_id and owner_id denormalised from plan.conflict_id"
      - "all nine settlement figures computed on ESTIMATE_BASIS (calculations.agreement_state_share_settlement steps 1-9)"
      - "increment RelocationPlan.version by 1 (the OCC parent)"
  - method: POST
    path: /uro/agreements/{id}/circulate
    description: Circulate a drafted agreement for owner signature
    roles: [AgreementOfficer]
    code: 200
    input: []
    output: ReimbursementAgreement
    side_effects: ["execution_status DRAFT -> PENDING_OWNER_SIGNATURE", "increment ReimbursementAgreement.version by 1"]
  - method: POST
    path: /uro/agreements/{id}/execute
    description: Execute a circulated agreement, committing its state share against the project's programmed authority
    roles: [AgreementOfficer]
    code: 200
    input: []
    output: ReimbursementAgreement
    side_effects:
      - "execution_status PENDING_OWNER_SIGNATURE -> EXECUTED"
      - "executed_by_user_id stamped with X-User-ID, which validation priority 7 later bars from raising audit findings"
      - "recompute Project.total_committed_reimbursement_cents (calculations.project_committed_reimbursement_ledger)"
      - "recompute Project.clearance_posture"
      - "increment ReimbursementAgreement.version by 1"
  - method: POST
    path: /uro/agreements/{id}/void
    description: Void an agreement, reversing any ledger commitment it made
    roles: [AgreementOfficer]
    code: 200
    input: [void_reason]
    output: ReimbursementAgreement
    side_effects:
      - "execution_status -> VOIDED and settlement_status -> VOIDED_OUT"
      - "compensating link 1: recompute Project.total_committed_reimbursement_cents, which returns exactly to its pre-execution value"
      - "compensating link 2: recompute Project.clearance_posture from the restored ledger"
      - "increment ReimbursementAgreement.version by 1"
  - method: POST
    path: /uro/agreements/{id}/open-final-billing
    description: Open final billing on an executed agreement so the owner may submit cost documentation
    roles: [AgreementOfficer]
    code: 200
    input: []
    output: ReimbursementAgreement
    side_effects: ["settlement_status NOT_STARTED -> PENDING_FINAL_INVOICE", "increment ReimbursementAgreement.version by 1"]
  - method: POST
    path: /uro/agreements/{id}/final-settlement
    description: Settle the agreement on an actual cost basis against the as-built documentation
    roles: [AgreementOfficer]
    code: 200
    input: [as_built_reference]
    output: ReimbursementAgreement
    side_effects:
      - "settlement_status PENDING_FINAL_INVOICE -> SETTLED and as_built_reference stamped"
      - "cost_basis ESTIMATE_BASIS -> ACTUAL_BASIS"
      - "all nine settlement figures recomputed on ACTUAL_BASIS (calculations.agreement_eligible_cost variant ACTUAL_BASIS plus calculations.betterment_credit step 5)"
      - "each ACCEPTED CostDocument dropped by the chronological ceiling moves to review_status DISALLOWED with exclusion_reason EXCEEDS_NOT_TO_EXCEED_CAP and disallowed_amount_cents = amount_cents"
      - "recompute Project.total_committed_reimbursement_cents by the revision delta"
      - "recompute Project.clearance_posture"
      - "increment ReimbursementAgreement.version by 1"
  - method: POST
    path: /uro/cost-documents
    description: Submit a cost document (labor, material, equipment, contract, indirect or salvage credit) under an agreement in final billing
    roles: [UtilityOwnerRep]
    code: 201
    input: [agreement_id, doc_type, amount_cents, incurred_on, support_reference]
    output: CostDocument
    side_effects: ["review_status = SUBMITTED, disallowed_amount_cents = 0, exclusion_reason = null"]
  - method: POST
    path: /uro/cost-documents/{id}/review
    description: Accept or disallow a submitted cost document
    roles: [AgreementOfficer]
    code: 200
    input: [disposition, "exclusion_reason?"]
    output: CostDocument
    side_effects:
      - "review_status SUBMITTED -> ACCEPTED when disposition == ACCEPT; SUBMITTED -> DISALLOWED when disposition == DISALLOW, with disallowed_amount_cents = amount_cents and the supplied exclusion_reason"
      - "recompute the agreement's nine settlement figures on the current cost_basis"
      - "increment CostDocument.version by 1"
  - method: POST
    path: /uro/audit-findings
    description: Raise an audit finding questioning costs on an agreement, which suspends its settlement
    roles: [ExternalAuditor]
    code: 201
    input: [agreement_id, finding_type, questioned_cost_cents]
    output: AuditFinding
    side_effects:
      - "status = OPEN and auditor_user_id stamped with X-User-ID"
      - "ReimbursementAgreement.settlement_status PENDING_FINAL_INVOICE -> AUDIT_IN_PROGRESS"
      - "increment ReimbursementAgreement.version by 1"
  - method: POST
    path: /uro/audit-findings/{id}/resolve
    description: Resolve an audit finding as sustained or withdrawn
    roles: [ExternalAuditor]
    code: 200
    input: [disposition]
    output: AuditFinding
    side_effects:
      - "status OPEN -> RESOLVED with the supplied disposition"
      - "ReimbursementAgreement.settlement_status AUDIT_IN_PROGRESS -> PENDING_FINAL_INVOICE once no finding of the agreement remains OPEN"
      - "increment AuditFinding.version by 1"

  # ---- contractor delay claims ------------------------------------------------
  - method: POST
    path: /uro/delay-claims
    description: Lodge a contractor delay claim against a commitment whose relocation ran late
    roles: [ConstructionEngineer]
    code: 201
    input: [project_id, commitment_id, contractor_name, claimed_days, claimed_amount_cents]
    output: DelayClaim
    side_effects: ["status = SUBMITTED, compensable_days = 0, daily_rate_cents = 0, allocated_to_owner_cents = 0, allocated_to_state_cents = 0"]
  - method: POST
    path: /uro/delay-claims/{id}/analyze
    description: Analyse a claim, adjudicating its delay cause and computing compensable days and the daily rate
    roles: [ConstructionEngineer]
    code: 200
    input: [delay_cause]
    output: DelayClaim
    side_effects:
      - "status SUBMITTED -> UNDER_ANALYSIS and delay_cause stamped"
      - "compensable_days and daily_rate_cents computed (calculations.delay_claim_allocation steps 1-3)"
      - "increment DelayClaim.version by 1"
  - method: POST
    path: /uro/delay-claims/{id}/allocate
    description: Allocate an analysed claim between the utility owner and the State
    roles: [ConstructionEngineer]
    code: 200
    input: []
    output: DelayClaim
    side_effects:
      - "status UNDER_ANALYSIS -> ALLOCATED"
      - "allocated_to_owner_cents and allocated_to_state_cents computed (calculations.delay_claim_allocation steps 4-6)"
      - "recompute UtilityOwner.assessed_delay_liability_cents and Project.aggregate_compensable_delay_days (calculations.project_aggregate_compensable_delay)"
      - "increment DelayClaim.version by 1"
  - method: POST
    path: /uro/delay-claims/{id}/withdraw-allocation
    description: Withdraw an allocation and return the claim to analysis, reversing both conserved figures
    roles: [ConstructionEngineer]
    code: 200
    input: [withdrawal_reason]
    output: DelayClaim
    side_effects:
      - "status ALLOCATED -> UNDER_ANALYSIS"
      - "allocated_to_owner_cents and allocated_to_state_cents reset to 0"
      - "recompute UtilityOwner.assessed_delay_liability_cents and Project.aggregate_compensable_delay_days back to their pre-allocation values"
      - "increment DelayClaim.version by 1"
  - method: POST
    path: /uro/delay-claims/{id}/deny
    description: Deny a claim outright
    roles: [ConstructionEngineer]
    code: 200
    input: [denial_reason]
    output: DelayClaim
    side_effects: ["status SUBMITTED or UNDER_ANALYSIS -> DENIED", "increment DelayClaim.version by 1"]

  # ---- test-driving surface ---------------------------------------------------
  - method: POST
    path: /_clock/set_current_utc
    description: "Set the logical clock used for applied_on, granted_on, performed_at, actual_complete_at, lateness arithmetic and the clearance look-ahead. The server's startup default is exactly 2026-08-01T00:00:00Z: before any call to this endpoint the logical clock reads that instant and never falls back to real wall-clock time."
    roles: [ProgramAdmin]
    code: 200
    input: [current_utc]
    output: { current_utc: string }
    side_effects: ["the logical clock is set to current_utc; no stored row changes, but every later posture read re-evaluates calculations.project_clearance_posture rule 2 against the new instant"]

# =============================================================================
# 1.6 Error Code Catalog
# =============================================================================
errors:
  # --- authentication and authorization ---------------------------------------
  - id: ERR_UNAUTHENTICATED
    http: 401
    condition: "X-User-Role or X-User-ID header missing, or X-User-Role is not one of the seven declared roles"
  - id: ERR_UNAUTHORIZED
    http: 403
    condition: "X-User-Role is valid but absent from the target endpoint's roles list"
  - id: ERR_OWNER_SCOPE_VIOLATION
    http: 403
    condition: "Acting as UtilityOwnerRep on a row belonging to a different UtilityOwner than X-User-ID"
  - id: ERR_SEGREGATION_OF_DUTIES
    http: 403
    condition: "The acting X-User-ID both executed an agreement and now raises an audit finding on it, or both first issued a determination and now re-issues it after appeal"
  # --- request shape -----------------------------------------------------------
  - id: ERR_INVALID_REQUEST
    http: 400
    condition: "Missing required field, wrong type, enum value out of range, negative amount, inverted interval, replacement_in_kind_cost_cents above estimated_cost_cents, proposed_capacity_ratio below 1.0 or with more than 2 decimals, indirect_cost_rate_pct outside 0..35, or pagination limit outside 1..100"
  # --- existence ---------------------------------------------------------------
  - id: ERR_PROJECT_NOT_FOUND
    http: 404
    condition: "No Project row matches the supplied project id, in the path or in the body"
  - id: ERR_OWNER_NOT_FOUND
    http: 404
    condition: "No UtilityOwner row matches the supplied owner id"
  - id: ERR_FACILITY_NOT_FOUND
    http: 404
    condition: "No UtilityFacility row matches the supplied facility id"
  - id: ERR_INVESTIGATION_NOT_FOUND
    http: 404
    condition: "No SubsurfaceInvestigation row matches the supplied investigation id"
  - id: ERR_CONFLICT_NOT_FOUND
    http: 404
    condition: "No UtilityConflict row matches the supplied conflict id, including depends_on_conflict_id"
  - id: ERR_DETERMINATION_NOT_FOUND
    http: 404
    condition: "No PriorRightsDetermination row matches the supplied determination id"
  - id: ERR_PLAN_NOT_FOUND
    http: 404
    condition: "No RelocationPlan row matches the supplied plan id"
  - id: ERR_PERMIT_NOT_FOUND
    http: 404
    condition: "No PermitRecord row matches the supplied permit id"
  - id: ERR_SLOT_NOT_FOUND
    http: 404
    condition: "No JointTrenchSlot row matches the supplied joint_trench_slot_id"
  - id: ERR_COMMITMENT_NOT_FOUND
    http: 404
    condition: "No ScheduleCommitment row matches the supplied commitment id"
  - id: ERR_AGREEMENT_NOT_FOUND
    http: 404
    condition: "No ReimbursementAgreement row matches the supplied agreement id"
  - id: ERR_DOCUMENT_NOT_FOUND
    http: 404
    condition: "No CostDocument row matches the supplied cost document id"
  - id: ERR_FINDING_NOT_FOUND
    http: 404
    condition: "No AuditFinding row matches the supplied finding id"
  - id: ERR_CLAIM_NOT_FOUND
    http: 404
    condition: "No DelayClaim row matches the supplied claim id"
  # --- state -------------------------------------------------------------------
  - id: ERR_INVALID_STATE_TRANSITION
    http: 409
    condition: "The requested transition is not declared from the row's current state, including a repeat of a trigger already applied and any action on a terminal state (CLEARED conflict, FINAL determination, SUPERSEDED plan, DENIED claim, RESOLVED finding, CANCELLED or COMPLETE commitment)"
  - id: ERR_AGREEMENT_NOT_EXECUTABLE
    http: 409
    condition: "The agreement's execution_status does not permit the requested execution-dimension action (circulate outside DRAFT, execute outside PENDING_OWNER_SIGNATURE, or a settlement action on an agreement that is not EXECUTED)"
  - id: ERR_SETTLEMENT_STATE_INVALID
    http: 409
    condition: "The agreement's settlement_status does not permit the requested settlement-dimension action, including cost-document submission or review outside PENDING_FINAL_INVOICE and any void of a SETTLED agreement"
  - id: ERR_COMMITMENT_STATE_INVALID
    http: 409
    condition: "The referenced ScheduleCommitment is not in a state that permits the action: not COMPLETE or BREACHED when a delay claim is analysed, or not COMMITTED or IN_PROGRESS when work is started, completed or cancelled"
  - id: ERR_PROJECT_CLOSED
    http: 409
    condition: "The owning Project.status is CLOSED, so no further relocation activity may be recorded against it"
  - id: ERR_STALE_VERSION
    http: 412
    condition: "expected_conflict_version does not match UtilityConflict.version on plan submittal, or expected_plan_version does not match RelocationPlan.version on agreement drafting"
  # --- safety and compliance ---------------------------------------------------
  - id: ERR_CLEARANCE_POSTURE_BLOCKED
    http: 409
    condition: "The owning Project.clearance_posture is FUNDING_BLOCKED, so no agreement may be executed, no commitment created and the project may not be closed"
  - id: ERR_OWNER_ON_REIMBURSEMENT_HOLD
    http: 409
    condition: "The counterparty UtilityOwner.reimbursement_hold is true after 2 breached commitments"
  # --- referential and dependency ---------------------------------------------
  - id: ERR_PRIOR_RIGHTS_NOT_ISSUED
    http: 409
    condition: "The conflict behind the plan has no PriorRightsDetermination in status ISSUED or FINAL, so cost responsibility is undetermined"
  - id: ERR_PERMIT_NOT_GRANTED
    http: 409
    condition: "The conflict has no PermitRecord, or at least one of its permits is not in status GRANTED"
  - id: ERR_DEPENDENCY_NOT_CLEARED
    http: 409
    condition: "UtilityConflict.depends_on_conflict_id references a conflict that is not yet CLEARED"
  - id: ERR_EXECUTED_AGREEMENT_BLOCKS_SUPERSEDE
    http: 409
    condition: "A new relocation plan would supersede a plan whose ReimbursementAgreement is already EXECUTED"
  - id: ERR_OPEN_AUDIT_FINDING
    http: 409
    condition: "The agreement still carries an AuditFinding in status OPEN at final settlement"
  - id: ERR_NO_ELIGIBLE_COST_DOCUMENTATION
    http: 422
    condition: "No CostDocument of the agreement is in review_status ACCEPTED with a doc_type other than CREDIT_SALVAGE and INDIRECT at final settlement"
  # --- temporal ----------------------------------------------------------------
  - id: ERR_WINDOW_OUTSIDE_CONSTRUCTION
    http: 422
    condition: "The commitment window starts before Project.construction_start_date or ends after Project.construction_end_date"
  - id: ERR_FACILITY_WINDOW_CONFLICT
    http: 409
    condition: "The commitment window overlaps another COMMITTED or IN_PROGRESS commitment on the same UtilityFacility once MOBILIZATION_BUFFER_DAYS is added to each end"
  - id: ERR_TRENCH_WINDOW_NOT_CONTAINED
    http: 422
    condition: "The commitment window is not fully inside the requested joint trench slot's opening, tested inclusively at both ends"
  # --- constraint and limits ---------------------------------------------------
  - id: ERR_TRENCH_SLOT_AT_CAPACITY
    http: 409
    condition: "The requested JointTrenchSlot already has occupant_count == max_occupants"
  - id: ERR_REVISION_LIMIT_EXCEEDED
    http: 409
    condition: "RelocationPlan.revision_round has already reached 3"
  - id: ERR_APPEAL_LIMIT_EXCEEDED
    http: 409
    condition: "PriorRightsDetermination.appeal_round has already reached 1"
  # --- fiscal ------------------------------------------------------------------
  - id: ERR_NOT_TO_EXCEED_TOO_LOW
    http: 422
    condition: "not_to_exceed_cents is below the plan estimate loaded with the owner's audited indirect rate"
  - id: ERR_AUTHORITY_EXCEEDED
    http: 409
    condition: "Committing this agreement's state share would push Project.total_committed_reimbursement_cents above Project.reimbursement_authority_cents"
  - id: ERR_DELAY_NOT_COMPENSABLE
    http: 422
    condition: "The analysed DelayClaim has compensable_days == 0 after contractual float is deducted"
  - id: ERR_PROJECT_CLOSE_BLOCKED
    http: 409
    condition: "The project still has a conflict that is not CLEARED, or an agreement whose settlement_status is neither SETTLED nor VOIDED_OUT"

# =============================================================================
# 1.7 RBAC Matrix
# =============================================================================
roles:
  - name: ProgramAdmin
    description: "Utility coordination office program administrator; owns project and owner registration, delinquency relief and the logical clock"
    identity: opaque
    exclusive_operations:
      - "POST /uro/projects"
      - "PATCH /uro/projects/{id}"
      - "POST /uro/projects/{id}/close"
      - "POST /uro/utility-owners"
      - "POST /uro/utility-owners/{id}/release-hold"
      - "POST /_clock/set_current_utc"
    shared_operations:
      - "POST /uro/facilities"
      - "every GET under /uro is also open to ProgramAdmin; the per-endpoint roles lists in table 5 are authoritative for reads"
  - name: UtilityCoordinator
    description: "State utility coordinator who identifies conflicts, orders subsurface investigation, tracks permits and reviews relocation plans"
    identity: opaque
    exclusive_operations:
      - "POST /uro/investigations"
      - "POST /uro/conflicts"
      - "POST /uro/conflicts/{id}/set-resolution"
      - "POST /uro/conflicts/{id}/certify-cleared"
      - "POST /uro/permits"
      - "POST /uro/permits/{id}/decide"
      - "POST /uro/relocation-plans/{id}/start-review"
      - "POST /uro/relocation-plans/{id}/request-revision"
      - "POST /uro/relocation-plans/{id}/approve"
    shared_operations:
      - "POST /uro/facilities"
      - "POST /uro/relocation-plans"
      - "POST /uro/relocation-plans/{id}/resubmit"
      - "POST /uro/commitments"
      - "POST /uro/commitments/{id}/cancel"
  - name: RightOfWayAdjudicator
    description: "Right-of-way adjudicator who determines prior rights and therefore who bears relocation cost"
    identity: opaque
    exclusive_operations:
      - "POST /uro/prior-rights"
      - "POST /uro/prior-rights/{id}/submit-for-review"
      - "POST /uro/prior-rights/{id}/return-for-revision"
      - "POST /uro/prior-rights/{id}/revise"
      - "POST /uro/prior-rights/{id}/issue"
    shared_operations:
      - "GET /uro/investigations"
      - "GET /uro/conflicts/{id}/prior-rights"
  - name: AgreementOfficer
    description: "Reimbursement agreement officer who drafts, executes and settles agreements and dispositions cost documentation"
    identity: opaque
    exclusive_operations:
      - "POST /uro/agreements"
      - "POST /uro/agreements/{id}/circulate"
      - "POST /uro/agreements/{id}/execute"
      - "POST /uro/agreements/{id}/void"
      - "POST /uro/agreements/{id}/open-final-billing"
      - "POST /uro/agreements/{id}/final-settlement"
      - "POST /uro/cost-documents/{id}/review"
    shared_operations:
      - "GET /uro/agreements/{id}/settlement-preview"
      - "GET /uro/agreements/{id}/cost-documents"
      - "GET /uro/agreements/{id}/audit-findings"
  - name: ExternalAuditor
    description: "External auditor exercising the audit rights reserved in the reimbursement agreement; may question costs but never disposition or settle them"
    identity: opaque
    exclusive_operations:
      - "POST /uro/audit-findings"
      - "POST /uro/audit-findings/{id}/resolve"
    shared_operations:
      - "GET /uro/agreements/{id}/settlement-preview"
      - "GET /uro/agreements/{id}/cost-documents"
      - "GET /uro/agreements/{id}/audit-findings"
  - name: ConstructionEngineer
    description: "Project construction engineer who declares joint trench openings and adjudicates contractor delay claims"
    identity: opaque
    exclusive_operations:
      - "POST /uro/joint-trench-slots"
      - "POST /uro/delay-claims"
      - "POST /uro/delay-claims/{id}/analyze"
      - "POST /uro/delay-claims/{id}/allocate"
      - "POST /uro/delay-claims/{id}/withdraw-allocation"
      - "POST /uro/delay-claims/{id}/deny"
    shared_operations:
      - "GET /uro/projects/{id}/clearance-summary"
      - "GET /uro/commitments"
      - "GET /uro/investigations"
  - name: UtilityOwnerRep
    description: "Representative of one utility owner; X-User-ID is that UtilityOwner's id, and every write is scoped to rows belonging to it"
    identity: "entity_backed:UtilityOwner"
    exclusive_operations:
      - "POST /uro/prior-rights/{id}/appeal"
      - "POST /uro/commitments/{id}/start-work"
      - "POST /uro/commitments/{id}/report-complete"
      - "POST /uro/cost-documents"
    shared_operations:
      - "POST /uro/relocation-plans"
      - "POST /uro/relocation-plans/{id}/resubmit"
      - "POST /uro/commitments"
      - "POST /uro/commitments/{id}/cancel"
