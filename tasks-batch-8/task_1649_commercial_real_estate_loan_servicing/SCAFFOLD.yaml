scenario: |
  Commercial Real Estate Loan Servicing & Covenant Monitoring (CRE loan servicer): rent roll & operating statement collection cadence, DSCR/LTV covenant calculation & breach notification, reserve accounts (TI/LC, replacement) funding & disbursement, lease approval & estoppel requirements, property inspection & insurance compliance, loan assumption & transfer requests, watchlist criteria & special servicing transfer, maturity & extension option tracking

domain_name: cre-loan-servicing
api_prefix: ""

complexity_profile:
  primary_archetype: compliance_audit
  secondary_archetype: posture_driven_gating
  complexity_layers:
    - rate_threshold_triggers
    - cascading_side_effects
    - derived_field_reconciliation
    - optimistic_concurrency
  entity_topology: hybrid
  state_machine_shape: parallel
  relationship_patterns:
    - one_to_many
    - cross_aggregate
  role_model: segregation_of_duties
  consistency_model: immediate
  rationale: |
    The scenario spans 8 servicing subsystems (statements, covenants, reserves,
    leases/estoppels, inspections/insurance, assumptions, watchlist, extensions),
    so the entity/endpoint surface sits above the Expert band; difficulty is
    carried by coupling, not volume: a compound Loan servicing posture derived
    from children gates every money movement, dual-basis DSCR/LTV math decides
    breach-vs-conform at exact thresholds, force-placement capitalization is an
    evaluation-order trap, and SoD/ownership scoping constrains every action.

response_envelope:
  success: |
    { "meta": { "api_request_id": "req_xxx", "api_request_timestamp": "ISO8601" },
      "response_type": "object" | "array", "data": {} }
  error: |
    { "meta": { ... }, "response_type": "error",
      "data": { "error_id": "ERR_XXX", "message": "..." } }
  pagination_fields: ["limit", "offset", "total_count", "has_more"]
  pagination_defaults: { limit: 10, min: 1, max: 100, offset: 0 }

# =============================================================================
# §1.1 Entity-Relationship Table
# =============================================================================
entities:
  - name: Borrower
    parent: null
    common_fields: true
    fields:
      - { name: legal_name, type: string, source: input, description: "Legal name of the borrowing entity" }
      - { name: tax_id, type: string, source: input, description: "Tax identifier; unique across Borrowers", constraints: "unique" }
      - { name: contact_email, type: string, source: input, description: "Primary notice email" }

  - name: Loan
    parent: null
    common_fields: true
    fields:
      - { name: borrower_id, type: string, source: input, description: "FK -> Borrower.id; owning borrower (ownership scope root)" }
      - { name: loan_number, type: string, source: input, description: "Servicer loan number", constraints: "unique" }
      - { name: original_principal_cents, type: integer, source: input, description: "Original principal in cents", constraints: "> 0" }
      - { name: current_balance_cents, type: integer, source: input, description: "Current UPB in cents at boarding", default: "original_principal_cents", constraints: ">= 0" }
      - { name: note_rate, type: number, source: input, description: "Annual interest rate (e.g. 0.06); interest-only debt service basis", constraints: "> 0, < 1" }
      - { name: origination_date, type: datetime, source: input, description: "Origination date (date semantics, UTC midnight)" }
      - { name: maturity_date, type: datetime, source: input, description: "Current maturity date; moved by exercised ExtensionOption" }
      - { name: payment_status, type: enum, source: system, description: "Payment dimension state", constraints: "enum {CURRENT, DELINQUENT, DEFAULT, MATURITY_DEFAULT}", default: CURRENT }
      - { name: servicing_status, type: enum, source: computed, description: "Servicing posture derived from child CovenantAssessment/WatchlistEntry states plus explicit escalate/reinstate actions", constraints: "enum {PERFORMING, WATCHLIST, SPECIAL_SERVICING}", default: PERFORMING }
      - { name: delinquent_since, type: datetime, source: system, description: "Clock time when DELINQUENT began; null when CURRENT" }
      - { name: days_delinquent, type: integer, source: computed, description: "floor((clock - delinquent_since)/86400s); 0 when not DELINQUENT/DEFAULT" }
      - { name: dscr_covenant_threshold, type: number, source: input, description: "DSCR covenant; breach iff computed DSCR < threshold", constraints: "> 0" }
      - { name: ltv_covenant_threshold, type: number, source: input, description: "LTV covenant; breach iff computed LTV > threshold", constraints: "> 0, < 1" }
      - { name: dscr_basis, type: enum, source: input, description: "Which DSCR variant this loan is covenanted under", constraints: "enum {TTM, T3_ANNUALIZED}" }
      - { name: assumption_fee_basis, type: enum, source: input, description: "Which assumption-fee variant applies", constraints: "enum {OUTSTANDING, ORIGINAL}" }
      - { name: current_dscr, type: number, source: computed, description: "Most recent computed DSCR (4dp round_half_up); null if never computed" }
      - { name: current_ltv, type: number, source: computed, description: "Most recent computed LTV (4dp round_half_up); null if never computed" }
      - { name: capitalized_advances_cents, type: integer, source: system, description: "Outstanding capitalized protective advances (force-placed insurance premiums)", default: 0 }

  - name: Property
    parent: Loan
    common_fields: true
    fields:
      - { name: loan_id, type: string, source: input, description: "FK -> Loan.id; collateral owner" }
      - { name: address, type: string, source: input, description: "Property address" }
      - { name: property_type, type: enum, source: input, description: "Collateral type", constraints: "enum {OFFICE, RETAIL, INDUSTRIAL, MULTIFAMILY, HOTEL}" }
      - { name: appraised_value_cents, type: integer, source: input, description: "Latest appraised value in cents", constraints: "> 0" }
      - { name: appraisal_date, type: datetime, source: input, description: "Date of latest appraisal; stale after 24 months" }
      - { name: appraised_by_user_id, type: string, source: system, description: "X-User-ID recorded at appraise time (SoD anchor for LTV waivers)" }

  - name: FinancialStatement
    parent: Loan
    common_fields: true
    fields:
      - { name: loan_id, type: string, source: input, description: "FK -> Loan.id" }
      - { name: statement_type, type: enum, source: input, description: "Cadence type", constraints: "enum {RENT_ROLL, OPERATING_STATEMENT}" }
      - { name: period_start, type: datetime, source: input, description: "Period start; must be a calendar-quarter first day" }
      - { name: period_end, type: datetime, source: input, description: "Period end; must be that quarter's last day (inclusive)" }
      - { name: net_operating_income_cents, type: integer, source: input, description: "Quarterly NOI in cents; required iff statement_type == OPERATING_STATEMENT" }
      - { name: occupancy_pct, type: number, source: input, description: "Occupancy percent; required iff statement_type == RENT_ROLL", constraints: "0 <= x <= 100" }
      - { name: due_date, type: datetime, source: computed, description: "period_end + 15d (RENT_ROLL) or + 45d (OPERATING_STATEMENT)" }
      - { name: submitted_late, type: boolean, source: computed, description: "true iff submission clock time > due_date" }
      - { name: status, type: enum, source: system, description: "Review state", constraints: "enum {SUBMITTED, ACCEPTED, REJECTED}", default: SUBMITTED }
      - { name: rejection_reason, type: string, source: input, description: "Required when review decision == REJECT" }
      - { name: reviewed_by_user_id, type: string, source: system, description: "X-User-ID of the reviewing MasterServicer (SoD anchor for DSCR waivers)" }

  - name: CovenantAssessment
    parent: Loan
    common_fields: true
    fields:
      - { name: loan_id, type: string, source: input, description: "FK -> Loan.id" }
      - { name: statement_id, type: string, source: system, description: "FK -> FinancialStatement.id; source statement for DSCR assessments, null for LTV" , constraints: "nullable" }
      - { name: assessment_type, type: enum, source: system, description: "Covenant under test", constraints: "enum {DSCR, LTV}" }
      - { name: basis, type: enum, source: system, description: "DSCR basis used (copies Loan.dscr_basis); null for LTV", constraints: "enum {TTM, T3_ANNUALIZED}, nullable" }
      - { name: computed_value, type: number, source: computed, description: "Computed covenant value, 4dp round_half_up; null when LTV uncomputable (no in-date appraisal)" }
      - { name: threshold_value, type: number, source: system, description: "Snapshot of the covenant threshold at assessment time" }
      - { name: breach, type: boolean, source: computed, description: "DSCR: value < threshold. LTV: value > threshold, or value null" }
      - { name: status, type: enum, source: system, description: "OPEN (breach, uncured) | CONFORMING (no breach) | CURED (auto, superseded by conforming same-type assessment) | WAIVED (SpecialServicer)", constraints: "enum {OPEN, CONFORMING, CURED, WAIVED}" }
      - { name: assessed_at, type: datetime, source: system, description: "Clock time of assessment" }
      - { name: waived_by_user_id, type: string, source: system, description: "X-User-ID of waiving SpecialServicer; null unless WAIVED" }

  - name: ReserveAccount
    parent: Loan
    common_fields: true
    fields:
      - { name: loan_id, type: string, source: input, description: "FK -> Loan.id" }
      - { name: account_type, type: enum, source: input, description: "Reserve purpose; one account per type per loan", constraints: "enum {TI_LC, REPLACEMENT}; unique per (loan_id, account_type)" }
      - { name: balance_cents, type: integer, source: system, description: "Cash held; deposits minus funded/released outflows", default: 0 }
      - { name: held_cents, type: integer, source: system, description: "Sum of amount_cents of APPROVED (unfunded, uncancelled) DisbursementRequests", default: 0 }
      - { name: retained_cents, type: integer, source: system, description: "Retainage withheld on funded draws, pending release", default: 0 }
      - { name: target_balance_cents, type: integer, source: input, description: "Required funding level; reinstatement gate", constraints: ">= 0" }
      - { name: elevated_retainage, type: boolean, source: system, description: "true while loan.servicing_status != PERFORMING; floors effective retainage at 0.20", default: false }
      - { name: disbursement_frozen, type: boolean, source: system, description: "true while loan.servicing_status == SPECIAL_SERVICING", default: false }
      - { name: available_cents, type: integer, source: computed, description: "balance_cents - held_cents" }

  - name: DisbursementRequest
    parent: ReserveAccount
    common_fields: true
    fields:
      - { name: reserve_account_id, type: string, source: input, description: "FK -> ReserveAccount.id" }
      - { name: purpose, type: enum, source: input, description: "Draw purpose", constraints: "enum {TENANT_IMPROVEMENT, LEASING_COMMISSION, CAPITAL_REPAIR}" }
      - { name: line_items, type: array, source: input, description: "Array of {description, amount_cents}; each amount_cents > 0; at least one item" }
      - { name: amount_cents, type: integer, source: computed, description: "sum(line_items[].amount_cents)" }
      - { name: retainage_pct, type: number, source: input, description: "Requested retainage fraction", default: 0.10, constraints: "0 <= x <= 1" }
      - { name: status, type: enum, source: system, description: "SUBMITTED -> APPROVED -> FUNDED; SUBMITTED -> REJECTED; SUBMITTED|APPROVED -> CANCELLED", constraints: "enum {SUBMITTED, APPROVED, FUNDED, REJECTED, CANCELLED}", default: SUBMITTED }
      - { name: funded_cents, type: integer, source: system, description: "Net cash disbursed at funding (per-line retainage withheld)", default: 0 }
      - { name: retained_cents, type: integer, source: system, description: "Retainage withheld at funding, releasable via release-retainage", default: 0 }
      - { name: funded_at, type: datetime, source: system, description: "Clock time of funding; null until FUNDED" }

  - name: Lease
    parent: Property
    common_fields: true
    fields:
      - { name: property_id, type: string, source: input, description: "FK -> Property.id" }
      - { name: tenant_name, type: string, source: input, description: "Tenant legal name" }
      - { name: suite_ref, type: string, source: input, description: "Suite identifier; occupancy uniqueness scope within property" }
      - { name: commencement_date, type: datetime, source: input, description: "Occupancy start (inclusive)" }
      - { name: expiry_date, type: datetime, source: input, description: "Occupancy end (inclusive); must be >= commencement_date" }
      - { name: base_rent_cents_monthly, type: integer, source: input, description: "Monthly base rent in cents", constraints: "> 0" }
      - { name: sqft, type: integer, source: input, description: "Leased square footage", constraints: "> 0" }
      - { name: term_months, type: integer, source: input, description: "Lease term in months", constraints: "> 0" }
      - { name: status, type: enum, source: system, description: "DRAFT -> SUBMITTED -> APPROVED | CONDITIONALLY_APPROVED | REJECTED; CONDITIONALLY_APPROVED -> APPROVED | REJECTED; REJECTED -> DRAFT (revise)", constraints: "enum {DRAFT, SUBMITTED, APPROVED, CONDITIONALLY_APPROVED, REJECTED}", default: DRAFT }
      - { name: lender_approval_required, type: boolean, source: computed, description: "true iff base_rent_cents_monthly > 500000 OR sqft > 5000 OR term_months > 60" }
      - { name: estoppel_required, type: boolean, source: computed, description: "true iff lender_approval_required" }
      - { name: conditions, type: string, source: input, description: "Servicer conditions text; required iff decision == CONDITIONAL" }

  - name: EstoppelCertificate
    parent: Lease
    common_fields: true
    fields:
      - { name: lease_id, type: string, source: input, description: "FK -> Lease.id" }
      - { name: status, type: enum, source: system, description: "PENDING -> EXECUTED; PENDING|EXECUTED -> EXPIRED (clock sweep); EXPIRED terminal (re-request creates a new record)", constraints: "enum {PENDING, EXECUTED, EXPIRED}", default: PENDING }
      - { name: due_date, type: datetime, source: input, description: "Tenant execution deadline; PENDING past due -> EXPIRED" }
      - { name: executed_at, type: datetime, source: system, description: "Clock time of execution; null until EXECUTED" }
      - { name: expires_at, type: datetime, source: system, description: "executed_at + 90 days; EXECUTED past expiry -> EXPIRED" }

  - name: Inspector
    parent: null
    common_fields: true
    fields:
      - { name: full_name, type: string, source: input, description: "Inspector name" }
      - { name: license_no, type: string, source: input, description: "License number", constraints: "unique" }
      - { name: active, type: boolean, source: input, description: "Schedulable flag", default: true }

  - name: PropertyInspection
    parent: Property
    common_fields: true
    fields:
      - { name: property_id, type: string, source: input, description: "FK -> Property.id" }
      - { name: inspector_id, type: string, source: input, description: "FK -> Inspector.id; assigned inspector (completion ownership anchor)" }
      - { name: scheduled_start, type: datetime, source: input, description: "Window start (inclusive); half-open interval semantics [start, end)" }
      - { name: scheduled_end, type: datetime, source: input, description: "Window end (exclusive); must be > scheduled_start" }
      - { name: status, type: enum, source: system, description: "SCHEDULED -> COMPLETED | CANCELLED", constraints: "enum {SCHEDULED, COMPLETED, CANCELLED}", default: SCHEDULED }
      - { name: condition_rating, type: enum, source: input, description: "Required iff close outcome == COMPLETED", constraints: "enum {GOOD, FAIR, POOR, CRITICAL}, nullable" }
      - { name: findings, type: string, source: input, description: "Free-text findings", constraints: "nullable" }
      - { name: completed_at, type: datetime, source: system, description: "Clock time of completion; null until COMPLETED" }

  - name: InsurancePolicy
    parent: Property
    common_fields: true
    fields:
      - { name: property_id, type: string, source: input, description: "FK -> Property.id" }
      - { name: coverage_type, type: enum, source: input, description: "Coverage class; overlap scope is (property_id, coverage_type)", constraints: "enum {PROPERTY, LIABILITY, FLOOD}" }
      - { name: coverage_amount_cents, type: integer, source: input, description: "Coverage limit; PROPERTY policies must be >= loan.current_balance_cents", constraints: "> 0" }
      - { name: start_date, type: datetime, source: input, description: "Coverage start (inclusive; closed-interval semantics)" }
      - { name: end_date, type: datetime, source: input, description: "Coverage end (inclusive); must be >= start_date" }
      - { name: force_placed, type: boolean, source: system, description: "true when created by force-place-insurance", default: false }
      - { name: premium_advance_cents, type: integer, source: system, description: "Protective advance capitalized at force-placement; reversed on cancel of a force-placed policy", default: 0 }
      - { name: status, type: enum, source: system, description: "ACTIVE -> EXPIRED (clock sweep past end_date) | CANCELLED", constraints: "enum {ACTIVE, EXPIRED, CANCELLED}", default: ACTIVE }

  - name: AssumptionRequest
    parent: Loan
    common_fields: true
    fields:
      - { name: loan_id, type: string, source: input, description: "FK -> Loan.id" }
      - { name: proposed_assumptor_name, type: string, source: input, description: "Proposed new borrower legal name" }
      - { name: proposed_assumptor_tax_id, type: string, source: input, description: "Proposed new borrower tax id" }
      - { name: proposed_net_worth_cents, type: integer, source: input, description: "Assumptor net worth in cents", constraints: ">= 0" }
      - { name: status, type: enum, source: system, description: "SUBMITTED -> UNDER_REVIEW -> APPROVED -> EXECUTED; SUBMITTED|UNDER_REVIEW -> WITHDRAWN; UNDER_REVIEW -> REJECTED", constraints: "enum {SUBMITTED, UNDER_REVIEW, APPROVED, REJECTED, EXECUTED, WITHDRAWN}", default: SUBMITTED }
      - { name: fee_cents, type: integer, source: computed, description: "Assumption fee computed at approval per Loan.assumption_fee_basis; null until APPROVED" }
      - { name: decided_at, type: datetime, source: system, description: "Clock time of approve/reject decision" }
      - { name: approval_expires_at, type: datetime, source: system, description: "decided_at + 60 days; APPROVED requests expire for execution" }
      - { name: rejection_reason, type: string, source: input, description: "Required when decision == REJECT" }

  - name: ExtensionOption
    parent: Loan
    common_fields: true
    fields:
      - { name: loan_id, type: string, source: input, description: "FK -> Loan.id" }
      - { name: option_seq, type: integer, source: input, description: "Sequence number; unique per loan; at most 2 options per loan (ERR_MAX_OPTIONS_REACHED beyond); seq N exercisable only after seq N-1 EXERCISED", constraints: ">= 1; unique per loan" }
      - { name: exercise_window_start, type: datetime, source: input, description: "Exercise window start (inclusive; closed-interval semantics)" }
      - { name: exercise_window_end, type: datetime, source: input, description: "Exercise window end (inclusive); must be >= start and < loan.maturity_date at creation" }
      - { name: extension_months, type: integer, source: input, description: "Maturity extension length", constraints: "> 0" }
      - { name: fee_pct, type: number, source: input, description: "Exercise fee fraction of current_balance_cents", constraints: ">= 0" }
      - { name: status, type: enum, source: system, description: "AVAILABLE -> EXERCISED | EXPIRED (clock sweep) | SUSPENDED (loan enters SPECIAL_SERVICING); SUSPENDED -> AVAILABLE (reinstate, window still open) | EXPIRED (reinstate, window passed)", constraints: "enum {AVAILABLE, EXERCISED, EXPIRED, SUSPENDED}", default: AVAILABLE }
      - { name: exercised_fee_cents, type: integer, source: system, description: "Fee recorded at exercise; null until EXERCISED" }

  - name: WatchlistEntry
    parent: Loan
    common_fields: true
    fields:
      - { name: loan_id, type: string, source: input, description: "FK -> Loan.id" }
      - { name: criterion, type: enum, source: system, description: "Why the loan is watched", constraints: "enum {REPORTING_DELINQUENCY, POOR_INSPECTION, INSURANCE_LAPSE, MATURITY_RISK, RISK_SCORE}" }
      - { name: status, type: enum, source: system, description: "ACTIVE -> RESOLVED | ESCALATED", constraints: "enum {ACTIVE, RESOLVED, ESCALATED}", default: ACTIVE }
      - { name: risk_score_at_creation, type: integer, source: system, description: "Risk score when created; set only for criterion RISK_SCORE", constraints: "nullable" }
      - { name: escalation_review, type: boolean, source: system, description: "true when risk_score_at_creation >= 85", default: false }
      - { name: source_ref, type: string, source: system, description: "Human-readable source pointer (e.g. 'period 2026Q2 OPERATING_STATEMENT', inspection id)", constraints: "nullable" }
      - { name: resolved_at, type: datetime, source: system, description: "Clock time of resolution; null while ACTIVE" }

# =============================================================================
# §1.2 State Machine Table
# =============================================================================
state_machines:
  - entity: Loan
    dimension: payment_status
    initial_state: CURRENT
    terminal_states: [DEFAULT, MATURITY_DEFAULT]
    transitions:
      - from: CURRENT
        to: DELINQUENT
        trigger: "POST /loans/{id}/payment-status {to_status: DELINQUENT}"
        actor: MasterServicer | SpecialServicer
        preconditions: ["loan.payment_status == CURRENT"]
        side_effects:
          - "delinquent_since := clock now; days_delinquent recomputed on read"
          - "risk score re-evaluated (calculations.watchlist_risk_score); may create RISK_SCORE WatchlistEntry -> loan servicing re-eval"
      - from: DELINQUENT
        to: CURRENT
        trigger: "POST /loans/{id}/payment-status {to_status: CURRENT}"
        actor: MasterServicer | SpecialServicer
        preconditions: ["loan.payment_status == DELINQUENT"]
        side_effects:
          - "delinquent_since := null"
          - "risk score re-evaluated"
      - from: DELINQUENT
        to: DEFAULT
        trigger: "POST /loans/{id}/payment-status {to_status: DEFAULT}"
        actor: MasterServicer | SpecialServicer
        preconditions: ["loan.payment_status == DELINQUENT", "days_delinquent >= 60 (ERR_DELINQUENCY_THRESHOLD otherwise)"]
        side_effects:
          - "risk score re-evaluated (delinquency component uses >=60 band)"
      - from: CURRENT
        to: MATURITY_DEFAULT
        trigger: "system clock sweep: clock >= maturity_date AND current_balance_cents > 0"
        actor: system
        preconditions: ["payment_status == CURRENT", "clock >= maturity_date", "current_balance_cents > 0"]
        side_effects: ["maturity default recorded; loan remains in its servicing_status dimension"]
      - from: DELINQUENT
        to: MATURITY_DEFAULT
        trigger: "system clock sweep: clock >= maturity_date AND current_balance_cents > 0"
        actor: system
        preconditions: ["payment_status == DELINQUENT", "clock >= maturity_date", "current_balance_cents > 0"]
        side_effects: []
      - from: MATURITY_DEFAULT
        to: CURRENT
        trigger: "never (terminal)"
        actor: system
        preconditions: ["unreachable — terminal"]
        side_effects: []

  - entity: Loan
    dimension: servicing_status
    initial_state: PERFORMING
    terminal_states: []
    transitions:
      - from: PERFORMING
        to: WATCHLIST
        trigger: "system re-eval: a CovenantAssessment becomes OPEN OR a WatchlistEntry becomes ACTIVE"
        actor: system
        preconditions: ["servicing_status == PERFORMING", "exists OPEN CovenantAssessment OR ACTIVE WatchlistEntry for loan"]
        side_effects:
          - "all ReserveAccounts of loan: elevated_retainage := true (bumps each reserve's version)"
      - from: WATCHLIST
        to: PERFORMING
        trigger: "system re-eval: last OPEN CovenantAssessment CURED/WAIVED and last ACTIVE WatchlistEntry RESOLVED"
        actor: system
        preconditions: ["servicing_status == WATCHLIST", "no OPEN CovenantAssessment for loan", "no ACTIVE WatchlistEntry for loan"]
        side_effects:
          - "all ReserveAccounts of loan: elevated_retainage := false (bumps each reserve's version)"
      - from: WATCHLIST
        to: SPECIAL_SERVICING
        trigger: "POST /watchlist-entries/{id}/escalate on an ACTIVE entry of this loan"
        actor: MasterServicer
        preconditions: ["entry.status == ACTIVE", "loan.servicing_status == WATCHLIST"]
        side_effects:
          - "entry.status := ESCALATED"
          - "all ReserveAccounts of loan: disbursement_frozen := true (elevated_retainage stays true)"
          - "all SUBMITTED DisbursementRequests on loan reserves -> REJECTED (compensation: none held)"
          - "all APPROVED DisbursementRequests on loan reserves -> CANCELLED (compensation: held_cents released)"
          - "all AVAILABLE ExtensionOptions of loan -> SUSPENDED"
      - from: SPECIAL_SERVICING
        to: PERFORMING
        trigger: "POST /loans/{id}/reinstate"
        actor: SpecialServicer
        preconditions:
          - "loan.servicing_status == SPECIAL_SERVICING"
          - "loan.payment_status == CURRENT (else ERR_LOAN_NOT_CURRENT)"
          - "no OPEN CovenantAssessment (else ERR_OPEN_COVENANT_BREACH)"
          - "no ACTIVE WatchlistEntry (else ERR_ACTIVE_WATCHLIST_ENTRIES)"
          - "every ReserveAccount of loan: balance_cents >= target_balance_cents (else ERR_RESERVE_TARGET_SHORTFALL)"
        side_effects:
          - "all ReserveAccounts: disbursement_frozen := false; elevated_retainage := false"
          - "all SUSPENDED ExtensionOptions: -> AVAILABLE if exercise_window_end >= clock, else -> EXPIRED"
      - from: PERFORMING
        to: SPECIAL_SERVICING
        trigger: "never directly (escalation requires WATCHLIST posture first)"
        actor: system
        preconditions: ["unreachable"]
        side_effects: []

  - entity: FinancialStatement
    initial_state: SUBMITTED
    terminal_states: [ACCEPTED, REJECTED]
    transitions:
      - from: SUBMITTED
        to: ACCEPTED
        trigger: "POST /financial-statements/{id}/review {decision: ACCEPT}"
        actor: MasterServicer
        preconditions: ["statement.status == SUBMITTED (else ERR_STATEMENT_ALREADY_REVIEWED)"]
        side_effects:
          - "reviewed_by_user_id := X-User-ID"
          - "if statement_type == OPERATING_STATEMENT: run calculations.dscr_calculation; if computable create CovenantAssessment (DSCR) with status OPEN or CONFORMING; loan.current_dscr updated (bumps loan.version)"
          - "conforming new DSCR assessment auto-CUREs all prior OPEN DSCR assessments of the loan"
          - "loan servicing_status re-evaluated (PERFORMING->WATCHLIST on OPEN; WATCHLIST->PERFORMING when nothing open/active)"
      - from: SUBMITTED
        to: REJECTED
        trigger: "POST /financial-statements/{id}/review {decision: REJECT, rejection_reason}"
        actor: MasterServicer
        preconditions: ["statement.status == SUBMITTED (else ERR_STATEMENT_ALREADY_REVIEWED)"]
        side_effects:
          - "reviewed_by_user_id := X-User-ID; rejection_reason recorded"
          - "no covenant assessment created; a resubmission for the same period is permitted (duplicate rule only blocks while a SUBMITTED or ACCEPTED row exists)"

  - entity: CovenantAssessment
    initial_state: OPEN
    terminal_states: [CONFORMING, CURED, WAIVED]
    transitions:
      - from: OPEN
        to: CURED
        trigger: "system: a newer same-type CovenantAssessment for the same loan is created with breach == false"
        actor: system
        preconditions: ["assessment.status == OPEN", "newer same-type assessment breach == false"]
        side_effects: ["loan servicing_status re-evaluated"]
      - from: OPEN
        to: WAIVED
        trigger: "POST /covenant-assessments/{id}/waive {waiver_reason}"
        actor: SpecialServicer
        preconditions:
          - "assessment.status == OPEN (else ERR_INVALID_STATE)"
          - "SoD: X-User-ID != source statement's reviewed_by_user_id (DSCR) or property's appraised_by_user_id (LTV) (else ERR_SEGREGATION_OF_DUTIES)"
        side_effects:
          - "waived_by_user_id := X-User-ID"
          - "loan servicing_status re-evaluated (may return WATCHLIST -> PERFORMING, de-elevating reserves)"

  - entity: ReserveAccount
    initial_state: ACTIVE
    terminal_states: []
    note: "No status enum transitions; balance/held/retained/frozen/elevated fields mutate via deposits, disbursement lifecycle, force-placement cascades, and loan posture changes. available_cents = balance_cents - held_cents >= 0 invariant."
    transitions:
      - from: ACTIVE
        to: ACTIVE
        trigger: "POST /reserve-accounts/{id}/deposits"
        actor: Borrower | MasterServicer
        preconditions: ["amount_cents > 0"]
        side_effects: ["balance_cents += amount_cents", "reserve.version += 1"]

  - entity: DisbursementRequest
    initial_state: SUBMITTED
    terminal_states: [FUNDED, REJECTED, CANCELLED]
    transitions:
      - from: SUBMITTED
        to: APPROVED
        trigger: "POST /disbursement-requests/{id}/review {decision: APPROVE}"
        actor: MasterServicer | SpecialServicer
        preconditions:
          - "request.status == SUBMITTED (else ERR_INVALID_STATE)"
          - "reserve.disbursement_frozen == false (else ERR_RESERVE_DISBURSEMENTS_FROZEN)"
          - "amount_cents <= reserve.available_cents (else ERR_INSUFFICIENT_RESERVE_FUNDS)"
        side_effects: ["reserve.held_cents += amount_cents", "reserve.version += 1"]
      - from: SUBMITTED
        to: REJECTED
        trigger: "POST /disbursement-requests/{id}/review {decision: REJECT}"
        actor: MasterServicer | SpecialServicer
        preconditions: ["request.status == SUBMITTED (else ERR_INVALID_STATE)"]
        side_effects: []
        note: "No funds check on REJECT — fiscal validation only applies to APPROVE."
      - from: SUBMITTED
        to: CANCELLED
        trigger: "POST /disbursement-requests/{id}/cancel"
        actor: Borrower
        preconditions: ["request.status == SUBMITTED", "acting borrower owns the loan (else ERR_OWNERSHIP_MISMATCH)"]
        side_effects: []
      - from: APPROVED
        to: FUNDED
        trigger: "POST /disbursement-requests/{id}/fund"
        actor: MasterServicer | SpecialServicer
        preconditions:
          - "request.status == APPROVED (else ERR_INVALID_STATE)"
          - "reserve.disbursement_frozen == false (else ERR_RESERVE_DISBURSEMENTS_FROZEN)"
          - "amount_cents <= reserve.available_cents + amount_cents (its own hold counts as available to itself; re-check balance sufficiency)"
        side_effects:
          - "run calculations.disbursement_waterfall: effective_retainage = max(request.retainage_pct, 0.20 if reserve.elevated_retainage else request.retainage_pct); per-line retain_i = round_half_up(line_i * effective_retainage, 0); funded_cents = sum(line_i - retain_i); retained_cents = sum(retain_i)"
          - "reserve.held_cents -= amount_cents; reserve.balance_cents -= funded_cents; reserve.retained_cents += retained_cents; reserve.version += 1"
          - "funded_at := clock now"
      - from: APPROVED
        to: CANCELLED
        trigger: "POST /disbursement-requests/{id}/cancel (or system cascade on SPECIAL_SERVICING transfer)"
        actor: Borrower | system
        preconditions: ["request.status == APPROVED", "borrower actor owns the loan (system cascade exempt)"]
        side_effects: ["reserve.held_cents -= amount_cents (hold released)", "reserve.version += 1"]
      - from: FUNDED
        to: FUNDED
        trigger: "POST /disbursement-requests/{id}/release-retainage"
        actor: MasterServicer
        preconditions:
          - "request.status == FUNDED AND retained_cents > 0 (else ERR_INVALID_STATE)"
          - "exists a COMPLETED PropertyInspection on any Property of the same loan with completed_at >= funded_at (else ERR_RETAINAGE_RELEASE_BLOCKED)"
        side_effects: ["reserve.balance_cents -= retained_cents", "reserve.retained_cents -= request.retained_cents", "request.retained_cents := 0", "reserve.version += 1"]

  - entity: Lease
    initial_state: DRAFT
    terminal_states: [APPROVED]
    transitions:
      - from: DRAFT
        to: SUBMITTED
        trigger: "POST /leases/{id}/submit"
        actor: Borrower
        preconditions:
          - "lease.status == DRAFT (else ERR_INVALID_STATE)"
          - "no closed-interval overlap on (property_id, suite_ref) with leases in {SUBMITTED, APPROVED, CONDITIONALLY_APPROVED} (else ERR_LEASE_SUITE_OVERLAP)"
          - "borrower owns the loan (else ERR_OWNERSHIP_MISMATCH)"
        side_effects: []
      - from: SUBMITTED
        to: APPROVED
        trigger: "POST /leases/{id}/decide {decision: APPROVE}"
        actor: MasterServicer | SpecialServicer
        preconditions:
          - "lease.status == SUBMITTED or CONDITIONALLY_APPROVED (else ERR_INVALID_STATE)"
          - "if estoppel_required: an EXECUTED EstoppelCertificate with expires_at > clock exists for the lease (else ERR_ESTOPPEL_REQUIRED)"
        side_effects: []
      - from: SUBMITTED
        to: CONDITIONALLY_APPROVED
        trigger: "POST /leases/{id}/decide {decision: CONDITIONAL, conditions}"
        actor: MasterServicer | SpecialServicer
        preconditions: ["lease.status == SUBMITTED (else ERR_INVALID_STATE)"]
        side_effects: ["conditions recorded"]
      - from: CONDITIONALLY_APPROVED
        to: APPROVED
        trigger: "POST /leases/{id}/decide {decision: APPROVE}"
        actor: MasterServicer | SpecialServicer
        preconditions: ["estoppel gate as above"]
        side_effects: []
      - from: CONDITIONALLY_APPROVED
        to: REJECTED
        trigger: "POST /leases/{id}/decide {decision: REJECT}"
        actor: MasterServicer | SpecialServicer
        preconditions: ["lease.status == CONDITIONALLY_APPROVED"]
        side_effects: []
      - from: SUBMITTED
        to: REJECTED
        trigger: "POST /leases/{id}/decide {decision: REJECT}"
        actor: MasterServicer | SpecialServicer
        preconditions: ["lease.status == SUBMITTED"]
        side_effects: []
      - from: REJECTED
        to: DRAFT
        trigger: "POST /leases/{id}/revise"
        actor: Borrower
        preconditions: ["lease.status == REJECTED (else ERR_INVALID_STATE)"]
        side_effects: ["optional field edits applied; conditions cleared"]

  - entity: EstoppelCertificate
    initial_state: PENDING
    terminal_states: [EXECUTED, EXPIRED]
    transitions:
      - from: PENDING
        to: EXECUTED
        trigger: "POST /estoppels/{id}/execute"
        actor: Borrower
        preconditions:
          - "estoppel.status == PENDING (else ERR_INVALID_STATE)"
          - "borrower owns the lease's loan (else ERR_OWNERSHIP_MISMATCH)"
        side_effects: ["executed_at := clock now", "expires_at := clock now + 90 days"]
      - from: PENDING
        to: EXPIRED
        trigger: "system clock sweep: clock > due_date"
        actor: system
        preconditions: ["estoppel.status == PENDING", "clock > due_date"]
        side_effects: []
      - from: EXECUTED
        to: EXPIRED
        trigger: "system clock sweep: clock > expires_at"
        actor: system
        preconditions: ["estoppel.status == EXECUTED", "clock > expires_at"]
        side_effects: ["a previously satisfied lease estoppel gate may now block (gates evaluate at decide time)"]

  - entity: PropertyInspection
    initial_state: SCHEDULED
    terminal_states: [COMPLETED, CANCELLED]
    transitions:
      - from: SCHEDULED
        to: COMPLETED
        trigger: "POST /inspections/{id}/close {outcome: COMPLETED, condition_rating, findings?}"
        actor: Inspector
        preconditions:
          - "inspection.status == SCHEDULED (else ERR_INVALID_STATE)"
          - "X-User-ID == inspection.inspector_id (else ERR_OWNERSHIP_MISMATCH)"
        side_effects:
          - "completed_at := clock now"
          - "if condition_rating in {POOR, CRITICAL}: create WatchlistEntry (criterion POOR_INSPECTION, source_ref = inspection id) -> loan servicing re-eval -> possible PERFORMING->WATCHLIST -> reserves elevated_retainage := true"
          - "risk score re-evaluated (inspection component refreshes); may create RISK_SCORE entry"
      - from: SCHEDULED
        to: CANCELLED
        trigger: "POST /inspections/{id}/close {outcome: CANCELLED}"
        actor: MasterServicer
        preconditions: ["inspection.status == SCHEDULED (else ERR_INVALID_STATE)"]
        side_effects: []

  - entity: InsurancePolicy
    initial_state: ACTIVE
    terminal_states: [EXPIRED, CANCELLED]
    transitions:
      - from: ACTIVE
        to: EXPIRED
        trigger: "system clock sweep: clock > end_date"
        actor: system
        preconditions: ["policy.status == ACTIVE", "clock > end_date"]
        side_effects:
          - "if no other ACTIVE policy of same (property_id, coverage_type) covers clock: create WatchlistEntry (criterion INSURANCE_LAPSE) -> loan servicing re-eval -> possible WATCHLIST -> reserves elevated"
      - from: ACTIVE
        to: CANCELLED
        trigger: "POST /insurance-policies/{id}/cancel"
        actor: Borrower | SpecialServicer
        preconditions:
          - "policy.status == ACTIVE (else ERR_INVALID_STATE)"
          - "if policy.force_placed: another ACTIVE non-force-placed policy of same coverage_type exists with start_date <= policy.start_date (else ERR_FORCE_PLACED_CANCEL_BLOCKED)"
          - "borrower actor owns the loan (else ERR_OWNERSHIP_MISMATCH)"
        side_effects:
          - "if force_placed and premium_advance_cents > 0: reverse advance — loan.current_balance_cents -= premium_advance_cents; loan.capitalized_advances_cents -= premium_advance_cents; loan.version += 1"
          - "LTV recomputed (calculations.ltv_calculation); conforming LTV auto-CUREs OPEN LTV assessments; loan servicing re-evaluated"
          - "if cancelling a non-force-placed policy leaves no ACTIVE coverage of that type: create WatchlistEntry (INSURANCE_LAPSE) -> servicing re-eval"

  - entity: AssumptionRequest
    initial_state: SUBMITTED
    terminal_states: [REJECTED, EXECUTED, WITHDRAWN]
    transitions:
      - from: SUBMITTED
        to: UNDER_REVIEW
        trigger: "POST /assumption-requests/{id}/start-review"
        actor: MasterServicer | SpecialServicer
        preconditions: ["request.status == SUBMITTED (else ERR_INVALID_STATE)"]
        side_effects: []
      - from: UNDER_REVIEW
        to: APPROVED
        trigger: "POST /assumption-requests/{id}/decide {decision: APPROVE}"
        actor: MasterServicer | SpecialServicer
        preconditions:
          - "request.status == UNDER_REVIEW (else ERR_INVALID_STATE)"
          - "no OPEN CovenantAssessment on loan (else ERR_OPEN_COVENANT_BREACH)"
          - "loan.payment_status == CURRENT (else ERR_LOAN_NOT_CURRENT)"
          - "every Property of the loan has a COMPLETED inspection with completed_at within 12 months of clock and rating != CRITICAL (else ERR_INSPECTION_STALE)"
          - "every Lease with estoppel_required == true has an EXECUTED, unexpired estoppel (else ERR_ESTOPPEL_REQUIRED)"
        side_effects:
          - "fee_cents := calculations.assumption_fee_calculation per loan.assumption_fee_basis"
          - "decided_at := clock now; approval_expires_at := decided_at + 60 days"
      - from: UNDER_REVIEW
        to: REJECTED
        trigger: "POST /assumption-requests/{id}/decide {decision: REJECT, rejection_reason}"
        actor: MasterServicer | SpecialServicer
        preconditions: ["request.status == UNDER_REVIEW (else ERR_INVALID_STATE)"]
        side_effects: ["decided_at := clock now"]
      - from: APPROVED
        to: EXECUTED
        trigger: "POST /assumption-requests/{id}/execute"
        actor: MasterServicer | SpecialServicer
        preconditions:
          - "request.status == APPROVED (else ERR_INVALID_STATE)"
          - "clock <= approval_expires_at (else ERR_ASSUMPTION_APPROVAL_EXPIRED)"
          - "no OPEN CovenantAssessment on loan (re-checked; else ERR_OPEN_COVENANT_BREACH)"
          - "loan.payment_status == CURRENT (else ERR_LOAN_NOT_CURRENT)"
        side_effects:
          - "create new Borrower (proposed_assumptor_name/tax_id); loan.borrower_id := new borrower id; loan.version += 1"
          - "fee_cents deemed collected (recorded; no cash entity)"
      - from: SUBMITTED
        to: WITHDRAWN
        trigger: "POST /assumption-requests/{id}/withdraw"
        actor: Borrower
        preconditions: ["request.status in {SUBMITTED, UNDER_REVIEW} (else ERR_INVALID_STATE)", "borrower owns the loan (else ERR_OWNERSHIP_MISMATCH)"]
        side_effects: []
      - from: UNDER_REVIEW
        to: WITHDRAWN
        trigger: "POST /assumption-requests/{id}/withdraw"
        actor: Borrower
        preconditions: ["borrower owns the loan"]
        side_effects: []

  - entity: ExtensionOption
    initial_state: AVAILABLE
    terminal_states: [EXERCISED, EXPIRED]
    transitions:
      - from: AVAILABLE
        to: EXERCISED
        trigger: "POST /extension-options/{id}/exercise"
        actor: Borrower
        preconditions:
          - "option.status == AVAILABLE (else ERR_INVALID_STATE)"
          - "no OPEN CovenantAssessment on loan (else ERR_OPEN_COVENANT_BREACH)"
          - "loan.payment_status == CURRENT (else ERR_LOAN_NOT_CURRENT)"
          - "borrower owns the loan (else ERR_OWNERSHIP_MISMATCH)"
          - "exercise_window_start <= clock <= exercise_window_end (else ERR_EXTENSION_WINDOW_CLOSED)"
          - "option_seq == 1 OR the seq-1 option of the same loan is EXERCISED (else ERR_EXTENSION_SEQUENCE_VIOLATION)"
        side_effects:
          - "exercised_fee_cents := round_half_up(loan.current_balance_cents * fee_pct, 0)"
          - "loan.maturity_date := maturity_date + extension_months (calendar months, day clamped to target month end); loan.version += 1"
      - from: AVAILABLE
        to: EXPIRED
        trigger: "system clock sweep: clock > exercise_window_end"
        actor: system
        preconditions: ["option.status == AVAILABLE", "clock > exercise_window_end"]
        side_effects: []
      - from: AVAILABLE
        to: SUSPENDED
        trigger: "system cascade: loan enters SPECIAL_SERVICING"
        actor: system
        preconditions: ["option.status == AVAILABLE"]
        side_effects: []
      - from: SUSPENDED
        to: AVAILABLE
        trigger: "system cascade: loan reinstated to PERFORMING and exercise_window_end >= clock"
        actor: system
        preconditions: ["option.status == SUSPENDED", "exercise_window_end >= clock"]
        side_effects: []
      - from: SUSPENDED
        to: EXPIRED
        trigger: "system cascade: loan reinstated and exercise_window_end < clock"
        actor: system
        preconditions: ["option.status == SUSPENDED", "exercise_window_end < clock"]
        side_effects: []

  - entity: WatchlistEntry
    initial_state: ACTIVE
    terminal_states: [RESOLVED, ESCALATED]
    transitions:
      - from: ACTIVE
        to: RESOLVED
        trigger: "POST /watchlist-entries/{id}/resolve"
        actor: MasterServicer | SpecialServicer
        preconditions:
          - "entry.status == ACTIVE (else ERR_INVALID_STATE)"
          - "if criterion == REPORTING_DELINQUENCY: an ACCEPTED statement exists for the entry's period+type (else ERR_RESOLUTION_BLOCKED)"
        side_effects: ["resolved_at := clock now", "loan servicing re-evaluated (WATCHLIST -> PERFORMING when last open/active item clears)"]
      - from: ACTIVE
        to: ESCALATED
        trigger: "POST /watchlist-entries/{id}/escalate"
        actor: MasterServicer
        preconditions: ["entry.status == ACTIVE (else ERR_INVALID_STATE)", "loan.servicing_status == WATCHLIST"]
        side_effects: ["loan WATCHLIST -> SPECIAL_SERVICING cascade (see Loan.servicing_status)"]

# =============================================================================
# §1.2.1 Concurrency Rules (true races only, OCC-resolved)
# =============================================================================
concurrency_rules:
  - rule_id: assumption-create-stale-loan
    parent_entity: Loan
    write_endpoint: "POST /loans/{loan_id}/assumption-requests"
    occ_field: "expected_loan_version"
    description: |
      Creating an AssumptionRequest against a Loan whose version has advanced
      since the client last observed it is rejected. The client computed its
      view of assumability (fee estimate, covenant posture) from a stale
      snapshot; a fresh read would observe the mutated loan.
    error_id: ERR_STALE_VERSION
    http_status: 412
  - rule_id: disbursement-create-stale-reserve
    parent_entity: ReserveAccount
    write_endpoint: "POST /reserve-accounts/{reserve_account_id}/disbursement-requests"
    occ_field: "expected_reserve_account_version"
    description: |
      Creating a DisbursementRequest against a ReserveAccount whose version
      has advanced since the client last observed it (e.g. a deposit or a
      funded draw changed balance/held) is rejected; the client's funds view
      is stale.
    error_id: ERR_STALE_VERSION
    http_status: 412

# =============================================================================
# §1.3 Calculation Rules Table
# =============================================================================
calculations:
  - name: dscr_calculation
    trigger: "FinancialStatement (OPERATING_STATEMENT) reviewed to ACCEPTED"
    algorithm: aggregation
    formula: |
      annual_debt_service_cents = round_half_up(loan.original_principal_cents * loan.note_rate, 0)
      Let Q = accepted statement's quarter. Eligible set: ACCEPTED OPERATING_STATEMENTs
      of the same loan, distinct quarters, period_start >= loan.origination_date.
      Variant TTM: require the 4 consecutive quarters ending at Q (inclusive) all
      present in eligible set, else NOT COMPUTABLE (no assessment row created).
        noi_annualized = sum(noi of those 4 quarters)
      Variant T3_ANNUALIZED: require Q itself present (it is), else not computable.
        noi_annualized = noi(Q) * 4
      dscr = round_half_up(noi_annualized / annual_debt_service_cents, 4)
      breach iff dscr < loan.dscr_covenant_threshold
    input_set: "ACCEPTED OPERATING_STATEMENTs of the loan with period_start >= origination_date; REJECTED statements excluded"
    constants:
      DSCR_DECIMAL_PLACES: 4
    precision: "ratio 4 decimal places, round_half_up; money integer cents"
    variants:
      - name: TTM
        when: "loan.dscr_basis == TTM"
        difference: "Uses 4-quarter trailing sum; not computable until 4 consecutive accepted quarters exist"
      - name: T3_ANNUALIZED
        when: "loan.dscr_basis == T3_ANNUALIZED"
        difference: "Uses latest quarter NOI x 4; computable from the first accepted quarter, reacts faster to recent performance"

  - name: ltv_calculation
    trigger: "property appraised; protective advance capitalized or reversed; on-demand via those events only"
    algorithm: aggregation
    formula: |
      collateral_value = sum(appraised_value_cents of Properties of the loan whose
                             appraisal_date is within 24 months of clock)
      if collateral_value == 0 (no in-date appraisal): computed_value := null, breach := true
      else:
        ltv = round_half_up(loan.current_balance_cents / collateral_value, 4)
        breach iff ltv > loan.ltv_covenant_threshold
    input_set: "Properties of the loan with appraisal_date >= clock - 24 months (stale appraisals excluded)"
    constants:
      APPRAISAL_VALIDITY_MONTHS: 24
    precision: "ratio 4 decimal places, round_half_up; money integer cents"

  - name: watchlist_risk_score
    trigger: "after any CovenantAssessment creation, any PropertyInspection completion, any loan payment_status transition, and during each clock sweep"
    algorithm: weighted_scoring
    formula: |
      dscr_component: dscr >= 1.25 -> 0; [1.10, 1.25) -> 15; [1.00, 1.10) -> 30; < 1.00 -> 45; null -> 10
      delinquency_component: days_delinquent 0 -> 0; [1,29] -> 10; [30,59] -> 20; >= 60 -> 35
      inspection_component: latest COMPLETED inspection rating GOOD -> 0; FAIR -> 5; POOR -> 15; CRITICAL -> 25; none -> 5
      ltv_component: ltv < 0.65 -> 0; [0.65, 0.75) -> 10; [0.75, 0.85) -> 20; >= 0.85 -> 30; null -> 10
      synergy: if loan.days_delinquent >= 30 AND loan.current_dscr < 1.00 -> +10, else +0
      score = min(100, dscr_component + delinquency_component + inspection_component + ltv_component + synergy)
      if score >= 70 and no ACTIVE RISK_SCORE WatchlistEntry exists for loan:
          create WatchlistEntry(criterion=RISK_SCORE, risk_score_at_creation=score,
                                escalation_review = (score >= 85))
    input_set: "loan.current_dscr, loan.days_delinquent, latest COMPLETED PropertyInspection per loan's properties, loan.current_ltv, loan.payment_status"
    constants:
      RISK_ENTRY_THRESHOLD: 70
      ESCALATION_REVIEW_THRESHOLD: 85
    precision: "integer score 0..100"

  - name: disbursement_waterfall
    trigger: "DisbursementRequest APPROVED -> FUNDED"
    algorithm: waterfall_allocation
    formula: |
      effective_retainage = reserve.elevated_retainage ? max(request.retainage_pct, 0.20) : request.retainage_pct
      ROUNDING ORDER PINNED: round per line, then sum.
      for each line i: retain_i = round_half_up(line_i.amount_cents * effective_retainage, 0)
                       disb_i  = line_i.amount_cents - retain_i
      funded_cents   = sum(disb_i)
      retained_cents = sum(retain_i)
      reserve.balance_cents -= funded_cents; reserve.retained_cents += retained_cents; reserve.held_cents -= amount_cents
    input_set: "request.line_items, request.retainage_pct, reserve.elevated_retainage"
    constants:
      ELEVATED_RETAINAGE_FLOOR: 0.20
    precision: "integer cents; per-line round_half_up then sum (sum-then-round is WRONG)"

  - name: protective_advance_capitalization
    trigger: "POST /properties/{id}/force-place-insurance succeeds"
    algorithm: constraint_propagation
    formula: |
      EVALUATION ORDER PINNED (circular-looking dependency: premium depends on
      balance, balance depends on premium; single pass, no fixed-point iteration):
        1. balance_pre = loan.current_balance_cents
        2. premium = round_half_up(balance_pre * FORCE_PLACED_PREMIUM_PCT, 0)
        3. loan.current_balance_cents = balance_pre + premium
        4. loan.capitalized_advances_cents += premium
        5. policy.coverage_amount_cents = balance_pre; policy.premium_advance_cents = premium
        6. recompute ltv_calculation once (creates LTV assessment; may open breach)
      Reversal (cancel of force-placed policy) subtracts exactly premium_advance_cents
      once — never recomputed.
    input_set: "loan.current_balance_cents at force-placement time"
    constants:
      FORCE_PLACED_PREMIUM_PCT: 0.02
      FORCE_PLACED_TERM_DAYS: 365
    precision: "integer cents, round_half_up"

  - name: assumption_fee_calculation
    trigger: "AssumptionRequest UNDER_REVIEW -> APPROVED"
    algorithm: tiered_pricing
    formula: |
      Variant OUTSTANDING:
        fee = round_half_up(loan.current_balance_cents * 0.01, 0)
        fee = clamp(fee, ASSUMPTION_FEE_MIN_CENTS, ASSUMPTION_FEE_MAX_CENTS)
      Variant ORIGINAL:
        fee = round_half_up(loan.original_principal_cents * 0.005, 0) + ASSUMPTION_FLAT_CENTS
      (No clamp on ORIGINAL.)
    input_set: "loan.current_balance_cents, loan.original_principal_cents, loan.assumption_fee_basis"
    constants:
      ASSUMPTION_OUTSTANDING_PCT: 0.01
      ASSUMPTION_ORIGINAL_PCT: 0.005
      ASSUMPTION_FLAT_CENTS: 25000
      ASSUMPTION_FEE_MIN_CENTS: 1000000
      ASSUMPTION_FEE_MAX_CENTS: 25000000
    precision: "integer cents, round_half_up"
    variants:
      - name: OUTSTANDING
        when: "loan.assumption_fee_basis == OUTSTANDING"
        difference: "1% of current UPB, clamped to [1,000,000, 25,000,000] cents"
      - name: ORIGINAL
        when: "loan.assumption_fee_basis == ORIGINAL"
        difference: "0.5% of original principal + 25,000 cents flat, unclamped"

  - name: collection_cadence
    trigger: "statement creation (due_date computation) and clock sweep (delinquency detection)"
    algorithm: chronological
    formula: |
      Quarter alignment: period must equal a full calendar quarter [Qstart, Qend] inclusive.
      due_date = period_end + 15 days (RENT_ROLL) or + 45 days (OPERATING_STATEMENT).
      Expected quarters: all quarters with period_start >= loan.origination_date and due_date < clock.
      Clock sweep (deterministic, runs in this exact order on every set_current_utc):
        1. InsurancePolicy expiry (clock > end_date -> EXPIRED; INSURANCE_LAPSE entries where coverage gap at now)
        2. EstoppelCertificate expiry (PENDING past due_date; EXECUTED past expires_at -> EXPIRED)
        3. ExtensionOption expiry (AVAILABLE past exercise_window_end -> EXPIRED)
        4. Reporting delinquency: for each expected (loan, quarter, statement_type) with no
           ACCEPTED statement and no existing ACTIVE REPORTING_DELINQUENCY entry for that
           (loan, quarter, type): create WatchlistEntry(REPORTING_DELINQUENCY)
        5. Maturity risk: loans with 0 <= maturity_date - clock <= 180 days and
           current_balance_cents > 0 and no EXERCISED ExtensionOption and no ACTIVE
           MATURITY_RISK entry: create WatchlistEntry(MATURITY_RISK)
        6. Maturity default: payment_status -> MATURITY_DEFAULT where clock >= maturity_date
           and current_balance_cents > 0 and payment_status in {CURRENT, DELINQUENT}
        7. Risk score re-evaluation for all loans; servicing_status re-evaluation for all loans
      All WatchlistEntry creation is idempotent per (loan, criterion, source identity).
    input_set: "all loans, their statements/policies/estoppels/options/entries"
    constants:
      RENT_ROLL_DUE_OFFSET_DAYS: 15
      OP_STMT_DUE_OFFSET_DAYS: 45
      MATURITY_RISK_WINDOW_DAYS: 180
      DEFAULT_DAYS_DELINQUENT: 60
    precision: "date arithmetic in whole days, UTC"

# =============================================================================
# §1.4 Validation Rules Table (ordered by priority)
# =============================================================================
validations:
  - { priority: 1, category: auth, check: "X-User-Role header present and a declared role; X-User-ID present and non-empty (and for entity_backed roles, an existing entity id)", error_id: ERR_UNAUTHENTICATED, http_status: 401, applies_to: "all" }
  - { priority: 2, category: auth, check: "acting role is in the endpoint's roles list", error_id: ERR_UNAUTHORIZED, http_status: 403, applies_to: "all" }
  - { priority: 3, category: auth, check: "ownership/scope: Borrower's loan-chain ownership for writes (ERR_OWNERSHIP_MISMATCH); Inspector self-assignment for completion; reads of out-of-scope resources return ERR_NOT_FOUND instead", error_id: ERR_OWNERSHIP_MISMATCH, http_status: 403, applies_to: "borrower/inspector write endpoints" }
  - { priority: 4, category: existence, check: "path ids exist, validated left-to-right (loan -> child -> grandchild); FK bodies reference existing entities", error_id: ERR_NOT_FOUND, http_status: 404, applies_to: "all" }
  - { priority: 5, category: existence, check: "request body schema: required fields present, types valid, enum members valid, ranges valid (amounts > 0, pct 0..1, end >= start)", error_id: ERR_INVALID_REQUEST, http_status: 400, applies_to: "all" }
  - { priority: 6, category: state, check: "OCC: expected_<parent>_version equals parent.version", error_id: ERR_STALE_VERSION, http_status: 412, applies_to: ["POST /loans/{loan_id}/assumption-requests", "POST /reserve-accounts/{id}/disbursement-requests"] }
  - { priority: 7, category: state, check: "state-machine precondition for the requested transition (generic)", error_id: ERR_INVALID_STATE, http_status: 409, applies_to: "all action endpoints" }
  - { priority: 8, category: state, check: "statement already reviewed (ACCEPTED/REJECTED) on review", error_id: ERR_STATEMENT_ALREADY_REVIEWED, http_status: 409, applies_to: ["POST /financial-statements/{id}/review"] }
  - { priority: 9, category: business_safety, check: "no OPEN CovenantAssessment blocks covenant-sensitive actions (extension exercise, assumption approve/execute, reinstate)", error_id: ERR_OPEN_COVENANT_BREACH, http_status: 409, applies_to: ["POST /extension-options/{id}/exercise", "POST /assumption-requests/{id}/decide", "POST /assumption-requests/{id}/execute", "POST /loans/{id}/reinstate"] }
  - { priority: 10, category: business_safety, check: "loan.payment_status == CURRENT for credit-sensitive actions", error_id: ERR_LOAN_NOT_CURRENT, http_status: 409, applies_to: ["POST /extension-options/{id}/exercise", "POST /assumption-requests/{id}/decide", "POST /assumption-requests/{id}/execute", "POST /loans/{id}/reinstate"] }
  - { priority: 11, category: business_safety, check: "reserve disbursements frozen under SPECIAL_SERVICING", error_id: ERR_RESERVE_DISBURSEMENTS_FROZEN, http_status: 409, applies_to: ["POST /disbursement-requests/{id}/review", "POST /disbursement-requests/{id}/fund"] }
  - { priority: 12, category: business_safety, check: "segregation of duties: waiver user != original reviewer/appraiser user", error_id: ERR_SEGREGATION_OF_DUTIES, http_status: 403, applies_to: ["POST /covenant-assessments/{id}/waive"] }
  - { priority: 13, category: business_safety, check: "no ACTIVE WatchlistEntry at reinstatement", error_id: ERR_ACTIVE_WATCHLIST_ENTRIES, http_status: 409, applies_to: ["POST /loans/{id}/reinstate"] }
  - { priority: 14, category: business_referential, check: "major lease approval requires EXECUTED unexpired estoppel; assumption approval requires estoppels for all estoppel-required leases", error_id: ERR_ESTOPPEL_REQUIRED, http_status: 409, applies_to: ["POST /leases/{id}/decide", "POST /assumption-requests/{id}/decide"] }
  - { priority: 15, category: business_referential, check: "retainage release requires a COMPLETED inspection with completed_at >= funded_at on the loan's properties", error_id: ERR_RETAINAGE_RELEASE_BLOCKED, http_status: 409, applies_to: ["POST /disbursement-requests/{id}/release-retainage"] }
  - { priority: 16, category: business_referential, check: "REPORTING_DELINQUENCY entry resolvable only after ACCEPTED statement for its period+type exists", error_id: ERR_RESOLUTION_BLOCKED, http_status: 409, applies_to: ["POST /watchlist-entries/{id}/resolve"] }
  - { priority: 17, category: business_constraint, check: "no duplicate statement (loan, type, period) while one SUBMITTED/ACCEPTED exists", error_id: ERR_DUPLICATE_STATEMENT_PERIOD, http_status: 409, applies_to: ["POST /loans/{id}/financial-statements"] }
  - { priority: 18, category: business_constraint, check: "statement period must equal a full calendar quarter", error_id: ERR_STATEMENT_PERIOD_MISALIGNED, http_status: 422, applies_to: ["POST /loans/{id}/financial-statements"] }
  - { priority: 19, category: business_constraint, check: "lease suite occupancy closed-interval overlap per (property_id, suite_ref) among {SUBMITTED, APPROVED, CONDITIONALLY_APPROVED}", error_id: ERR_LEASE_SUITE_OVERLAP, http_status: 409, applies_to: ["POST /leases/{id}/submit"] }
  - { priority: 20, category: business_constraint, check: "insurance closed-interval overlap per (property_id, coverage_type) among ACTIVE, non-force-placed policies; touching dates count as overlap; force-placed policies never block borrower replacements", error_id: ERR_COVERAGE_WINDOW_OVERLAP, http_status: 409, applies_to: ["POST /properties/{id}/insurance-policies"] }
  - { priority: 21, category: business_constraint, check: "inspector half-open [start,end) scheduling conflict among SCHEDULED inspections; adjacency allowed", error_id: ERR_INSPECTOR_SCHEDULE_CONFLICT, http_status: 409, applies_to: ["POST /properties/{id}/inspections"] }
  - { priority: 22, category: business_constraint, check: "one ReserveAccount per (loan_id, account_type)", error_id: ERR_DUPLICATE_RESERVE_ACCOUNT, http_status: 409, applies_to: ["POST /loans/{id}/reserve-accounts"] }
  - { priority: 23, category: business_constraint, check: "extension option windows (closed intervals) must not overlap on same loan; option_seq unique; <= 2 options per loan", error_id: ERR_EXTENSION_WINDOW_OVERLAP, http_status: 409, applies_to: ["POST /loans/{id}/extension-options"] }
  - { priority: 24, category: business_constraint, check: "more than 2 extension options per loan", error_id: ERR_MAX_OPTIONS_REACHED, http_status: 422, applies_to: ["POST /loans/{id}/extension-options"] }
  - { priority: 25, category: business_constraint, check: "another non-terminal AssumptionRequest (SUBMITTED/UNDER_REVIEW/APPROVED) exists for the loan", error_id: ERR_ASSUMPTION_IN_PROGRESS, http_status: 409, applies_to: ["POST /loans/{id}/assumption-requests"] }
  - { priority: 26, category: business_constraint, check: "an unexpired PENDING or EXECUTED estoppel already exists for the lease", error_id: ERR_DUPLICATE_ACTIVE_ESTOPPEL, http_status: 409, applies_to: ["POST /leases/{id}/estoppels"] }
  - { priority: 27, category: business_constraint, check: "extension option_seq 2 exercised before seq 1 EXERCISED", error_id: ERR_EXTENSION_SEQUENCE_VIOLATION, http_status: 409, applies_to: ["POST /extension-options/{id}/exercise"] }
  - { priority: 28, category: business_constraint, check: "force-placement refused while ACTIVE non-force-placed same-type coverage exists at now", error_id: ERR_FORCE_PLACEMENT_NOT_NEEDED, http_status: 409, applies_to: ["POST /properties/{id}/force-place-insurance"] }
  - { priority: 29, category: business_constraint, check: "force-placed policy cannot be cancelled without replacement coverage starting on/before its start_date", error_id: ERR_FORCE_PLACED_CANCEL_BLOCKED, http_status: 409, applies_to: ["POST /insurance-policies/{id}/cancel"] }
  - { priority: 30, category: business_temporal, check: "exercise within [exercise_window_start, exercise_window_end] inclusive per clock", error_id: ERR_EXTENSION_WINDOW_CLOSED, http_status: 409, applies_to: ["POST /extension-options/{id}/exercise"] }
  - { priority: 31, category: business_temporal, check: "DEFAULT requires days_delinquent >= 60", error_id: ERR_DELINQUENCY_THRESHOLD, http_status: 422, applies_to: ["POST /loans/{id}/payment-status"] }
  - { priority: 32, category: business_temporal, check: "assumption approval requires COMPLETED inspection within 12 months, rating != CRITICAL, on every property", error_id: ERR_INSPECTION_STALE, http_status: 409, applies_to: ["POST /assumption-requests/{id}/decide"] }
  - { priority: 33, category: business_temporal, check: "assumption execution within approval validity (decided_at + 60 days)", error_id: ERR_ASSUMPTION_APPROVAL_EXPIRED, http_status: 409, applies_to: ["POST /assumption-requests/{id}/execute"] }
  - { priority: 34, category: business_fiscal, check: "disbursement APPROVE requires amount_cents <= available_cents (inclusive)", error_id: ERR_INSUFFICIENT_RESERVE_FUNDS, http_status: 422, applies_to: ["POST /disbursement-requests/{id}/review", "POST /disbursement-requests/{id}/fund"] }
  - { priority: 35, category: business_fiscal, check: "PROPERTY coverage_amount_cents >= loan.current_balance_cents", error_id: ERR_COVERAGE_BELOW_MINIMUM, http_status: 422, applies_to: ["POST /properties/{id}/insurance-policies"] }
  - { priority: 36, category: business_fiscal, check: "reinstatement requires every reserve balance_cents >= target_balance_cents", error_id: ERR_RESERVE_TARGET_SHORTFALL, http_status: 422, applies_to: ["POST /loans/{id}/reinstate"] }

# =============================================================================
# §1.5 API Endpoint Table
# =============================================================================
endpoints:
  - { method: POST, path: "/borrowers", description: "Onboard a borrower", roles: [MasterServicer], code: 201, input: [legal_name, tax_id, contact_email], output: Borrower, side_effects: [] }
  - { method: GET, path: "/borrowers/{id}", description: "Fetch borrower", roles: [MasterServicer, SpecialServicer, Borrower], code: 200, input: [], output: Borrower, side_effects: [] }
  - { method: POST, path: "/loans", description: "Board a loan", roles: [MasterServicer], code: 201, input: [borrower_id, loan_number, original_principal_cents, note_rate, origination_date, maturity_date, dscr_covenant_threshold, ltv_covenant_threshold, dscr_basis, assumption_fee_basis, "current_balance_cents?"], output: Loan, side_effects: [] }
  - { method: GET, path: "/loans", description: "List loans (newest created_at first); Borrower sees own only", roles: [MasterServicer, SpecialServicer, Borrower], code: 200, input: ["borrower_id?", "servicing_status?", "payment_status?", "limit?", "offset?"], output: "Loan[]", side_effects: [] }
  - { method: GET, path: "/loans/{id}", description: "Fetch loan incl. computed current_dscr/current_ltv/days_delinquent", roles: [MasterServicer, SpecialServicer, Borrower], code: 200, input: [], output: Loan, side_effects: [] }
  - { method: POST, path: "/loans/{id}/payment-status", description: "Transition payment dimension (DELINQUENT/CURRENT/DEFAULT)", roles: [MasterServicer, SpecialServicer], code: 200, input: [to_status], output: Loan, side_effects: ["payment_status transition", "loan.version += 1", "risk score re-eval"] }
  - { method: POST, path: "/loans/{id}/reinstate", description: "Return loan from SPECIAL_SERVICING to PERFORMING", roles: [SpecialServicer], code: 200, input: [], output: Loan, side_effects: ["reserve unfreeze/de-elevate", "SUSPENDED options -> AVAILABLE or EXPIRED", "loan.version += 1"] }
  - { method: POST, path: "/loans/{id}/properties", description: "Add collateral property (does not bump loan.version)", roles: [MasterServicer], code: 201, input: [address, property_type, appraised_value_cents, appraisal_date], output: Property, side_effects: [] }
  - { method: GET, path: "/loans/{id}/properties", description: "List properties of a loan", roles: [MasterServicer, SpecialServicer, Borrower], code: 200, input: ["limit?", "offset?"], output: "Property[]", side_effects: [] }
  - { method: GET, path: "/properties/{id}", description: "Fetch property", roles: [MasterServicer, SpecialServicer, Borrower], code: 200, input: [], output: Property, side_effects: [] }
  - { method: POST, path: "/properties/{id}/appraise", description: "Record new appraisal; triggers LTV reassessment", roles: [MasterServicer], code: 200, input: [appraised_value_cents, appraisal_date], output: Property, side_effects: ["appraised_by_user_id := X-User-ID", "ltv_calculation -> CovenantAssessment (LTV) if computable", "cure/servicing re-eval cascade", "risk score re-eval"] }
  - { method: POST, path: "/loans/{id}/financial-statements", description: "Borrower submits a quarterly statement", roles: [Borrower], code: 201, input: [statement_type, period_start, period_end, "net_operating_income_cents?", "occupancy_pct?"], output: FinancialStatement, side_effects: ["due_date + submitted_late computed"] }
  - { method: GET, path: "/loans/{id}/financial-statements", description: "List statements of a loan (newest created_at first)", roles: [MasterServicer, SpecialServicer, Borrower], code: 200, input: ["statement_type?", "status?", "limit?", "offset?"], output: "FinancialStatement[]", side_effects: [] }
  - { method: GET, path: "/financial-statements/{id}", description: "Fetch statement", roles: [MasterServicer, SpecialServicer, Borrower], code: 200, input: [], output: FinancialStatement, side_effects: [] }
  - { method: POST, path: "/financial-statements/{id}/review", description: "Accept or reject a submitted statement", roles: [MasterServicer], code: 200, input: [decision, "rejection_reason?"], output: FinancialStatement, side_effects: ["status transition", "DSCR assessment on ACCEPT of OPERATING_STATEMENT", "cure/servicing re-eval cascade", "risk score re-eval"] }
  - { method: GET, path: "/financial-statements/{id}/covenant-assessments", description: "Assessments sourced from this statement", roles: [MasterServicer, SpecialServicer, Borrower], code: 200, input: ["limit?", "offset?"], output: "CovenantAssessment[]", side_effects: [] }
  - { method: GET, path: "/loans/{id}/covenant-assessments", description: "List assessments of a loan (newest assessed_at first)", roles: [MasterServicer, SpecialServicer, Borrower], code: 200, input: ["assessment_type?", "status?", "limit?", "offset?"], output: "CovenantAssessment[]", side_effects: [] }
