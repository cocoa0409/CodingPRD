      - name: draw_disburse_blocked_while_covenant_breached
        grounds:
          - validations[priority=45].ERR_DRAW_BLOCKED_BY_COVENANT_BREACH
          - state_machines.DrawRequest.transitions["APPROVED -> DISBURSED"]
          - state_machines.Covenant.transitions["BREACH_PENDING_CURE -> COMPLIANT"]
          - state_machines.WorkoutPlan.transitions["PROPOSED -> APPROVED"]
          - calculations.draw_net_disbursement
          - endpoints["POST /draw-requests/{draw_request_id}/disburse"]
        distinguishing_aspect: |
          The disbursement guard reads the COVENANT dimension, not the loan's posture: with
          the draw APPROVED and the loan in PENDING_FIRST_DRAW, disbursement is refused with
          ERR_DRAW_BLOCKED_BY_COVENANT_BREACH purely because a covenant sits in
          BREACH_PENDING_CURE. An approved TERM_EXTENSION workout then cuts
