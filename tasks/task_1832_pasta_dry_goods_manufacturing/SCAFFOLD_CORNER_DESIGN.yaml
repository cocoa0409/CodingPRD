              as: ProcurementManager
              captures: { c3: $.data.id }
            - call: "POST /ingredient-contracts/${c3}/activate"
              payload: {}
              as: PlantManager
          trigger:
            - call: "POST /semolina-lots"
              payload: { contract_id: "${c1}", delivery_date: "2026-08-01", received_weight_kg: 100.0, cert_protein_pct: 13.0, cert_moisture_pct: 14.5, cert_gluten_index: 80, cert_falling_number_s: 300 }
              as: ProcurementManager
              captures: { e1: $.data.error_id }
            - call: "POST /ingredient-contracts/${c2}/activate"
              payload: {}
              as: PlantManager
              captures: { e2: $.data.error_id }
            - call: "POST /semolina-lots"
              payload: { contract_id: "${c3}", delivery_date: "2026-08-31", received_weight_kg: 100.0, cert_protein_pct: 13.0, cert_moisture_pct: 14.5, cert_gluten_index: 80, cert_falling_number_s: 300 }
              as: ProcurementManager
              captures: { lot_ok: $.data.id }
            - call: "POST /semolina-lots"
              payload: { contract_id: "${c3}", delivery_date: "2026-09-01", received_weight_kg: 100.0, cert_protein_pct: 13.0, cert_moisture_pct: 14.5, cert_gluten_index: 80, cert_falling_number_s: 300 }
              as: ProcurementManager
              captures: { e3: $.data.error_id }
          assert:
            - "e1 == ERR_CONTRACT_NOT_ACTIVE (DRAFT contract)"
            - "e2 == ERR_INVALID_REQUEST (window already lapsed at activation time)"
            - "lot_ok created (delivery_date == effective_end is inclusive)"
            - "e3 == ERR_CONTRACT_WINDOW_INVALID (delivery 2026-09-01 outside window)"

      - name: insufficient_lot_weight_fiscal_error
        claim_type: violation_to_error
        grounds: ["validations[priority=12]", "errors[ERR_INSUFFICIENT_LOT_WEIGHT]"]
        distinguishing_aspect: "With the temporal gate satisfied (clock inside the changeover window), the fiscal check fires: planned 500 kg against 100 kg remaining -> ERR_INSUFFICIENT_LOT_WEIGHT 402."
