# =============================================================================
# §1.9 Scaffold Corner Design — Coverage Index for Non-Difficulty Tests
# Task 1169: Affordable Housing Waitlist & Lottery Administration
# Enumerative walk of the claim-extraction-guide taxonomy over §1.1–§1.7.
# Corners already exercised by a §1.8 difficulty instance appear as
# excluded_because stubs. Clock default: 2026-05-01T00:00:00Z.
# =============================================================================
scaffold_corner_design:
  # ===========================================================================
  # Section: entities (Table 1 claims)
  # ===========================================================================
  - section: entities
    instances:
      - name: property_creation_initializes_counters
        claim_type: creation
        grounds:
          - entities.Property
        distinguishing_aspect: "A new Property starts with all five derived unit counters at 0 and version 1."
        test_recipe:
          setup: ["empty database"]
          setup_api_calls:
            - call: "POST /properties"
              payload: { name: "Maple Court", address_line: "1 Main St", city: "Springfield", state_code: "IL" }
              as: HousingDeveloper
              captures: { p: "$.data.id", total: "$.data.units_total", ver: "$.data.version" }
          trigger:
            - call: "GET /properties/${p}"
              as: HousingDeveloper
              captures: { avail: "$.data.units_available_count", res: "$.data.units_reserved_count", leased: "$.data.units_leased_count", oos: "$.data.units_out_of_service_count" }
          assert:
            - "create response: units_total == 0 and version == 1"
            - "GET /properties/${p}: units_available_count == 0, units_reserved_count == 0, units_leased_count == 0, units_out_of_service_count == 0"

      - name: unit_create_invalid_bedroom_enum_returns_invalid_request
        claim_type: type_constraints
        grounds:
          - entities.Unit.fields.bedroom_count
          - errors[ERR_INVALID_REQUEST]
        distinguishing_aspect: "bedroom_count outside {STUDIO, ONE_BR, TWO_BR, THREE_BR} is rejected at shape validation with ERR_INVALID_REQUEST (400)."
        test_recipe:
          setup: ["one property exists"]
          setup_api_calls:
            - call: "POST /properties"
              payload: { name: "Maple Court", address_line: "1 Main St", city: "Springfield", state_code: "IL" }
              as: HousingDeveloper
              captures: { p: "$.data.id" }
          trigger:
            - call: "POST /units"
              payload: { property_id: "${p}", unit_number: "X9", bedroom_count: "FIVE_BR", ami_tier: "AMI_50" }
              as: HousingDeveloper
              captures: { err: "$.data.error_id" }
          assert:
            - "response error_id == ERR_INVALID_REQUEST and http status 400; no Unit row created"

      - name: campaign_get_unknown_id_returns_not_found
        claim_type: not_found
        grounds:
          - errors[ERR_NOT_FOUND]
        distinguishing_aspect: "GET on a well-formed but nonexistent campaign id returns ERR_NOT_FOUND (404), exercising the existence validation tier."
        test_recipe:
          setup: ["one property exists so the database is non-empty"]
          setup_api_calls:
            - call: "POST /properties"
              payload: { name: "Maple Court", address_line: "1 Main St", city: "Springfield", state_code: "IL" }
              as: HousingDeveloper
          trigger:
            - call: "GET /campaigns/00000000-0000-0000-0000-000000000000"
              as: HousingDeveloper
              captures: { err: "$.data.error_id" }
          assert:
            - "response error_id == ERR_NOT_FOUND and http status 404"

      - name: applicant_register_returns_system_minted_fields
        claim_type: system_fields
        grounds:
          - entities.Applicant
          - roles.Anonymous
        distinguishing_aspect: "Anonymous registration returns server-minted id and created_at; the client supplies neither."
        test_recipe:
          setup: ["empty database"]
          setup_api_calls:
            - call: "POST /properties"
              payload: { name: "Maple Court", address_line: "1 Main St", city: "Springfield", state_code: "IL" }
              as: HousingDeveloper
          trigger:
            - call: "POST /applicants"
              payload: { full_name: "Sam S", email: "s@x.com" }
              as: Anonymous
              captures: { ap: "$.data.id", created: "$.data.created_at", ver: "$.data.version" }
          assert:
            - "response data.id is a server-minted UUID (absent from the request payload)"
            - "created_at == 2026-05-01T00:00:00.000Z (the startup default logical clock)"
            - "version == 1"

      - name: application_create_mints_confirmation_code_and_provisional
        claim_type: computed_fields
        grounds:
          - entities.Application.fields.confirmation_code
          - entities.Application.fields.provisional_determination
          - calculations.provisional_eligibility_screen
        distinguishing_aspect: "Submit response itself carries the minted confirmation_code and the provisional_determination computed from the AmiLimit row (3000000 <= 4000000 -> PROVISIONALLY_ELIGIBLE); initial status is SUBMITTED."
        test_recipe:
          setup: ["property with AmiLimit(hh=2, AMI_50, 4000000); campaign OPEN at 2026-06-10"]
          setup_api_calls:
            - call: "POST /properties"
              payload: { name: "Maple Court", address_line: "1 Main St", city: "Springfield", state_code: "IL" }
              as: HousingDeveloper
              captures: { p: "$.data.id" }
            - call: "POST /ami-limits"
              payload: { property_id: "${p}", household_size: 2, ami_tier: "AMI_50", annual_limit_cents: 4000000 }
              as: HousingDeveloper
            - call: "POST /campaigns"
              payload: { property_id: "${p}", name: "June 2026", application_open_at: "2026-06-01T00:00:00Z", application_close_at: "2026-06-30T00:00:00Z", marketing_channels: ["LOCAL_NEWSPAPER", "HOUSING_AUTHORITY_WEBSITE"], marketing_plan_summary: "press and web outreach", target_ami_tier: "AMI_50" }
              as: HousingDeveloper
              captures: { c: "$.data.id" }
            - call: "POST /campaigns/${c}/transition"
              payload: { action: "ANNOUNCE" }
              as: MarketingCoordinator
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-06-10T00:00:00Z" }
              as: HousingDeveloper
            - call: "POST /campaigns/${c}/transition"
              payload: { action: "OPEN" }
              as: HousingDeveloper
            - call: "POST /applicants"
              payload: { full_name: "Tia T", email: "t@x.com" }
              as: Anonymous
              captures: { ap: "$.data.id" }
          trigger:
            - call: "POST /applications"
              payload: { applicant_id: "${ap}", campaign_id: "${c}", household_size: 2, self_reported_annual_income_cents: 3000000 }
              as: Applicant
              as_user_id: "${ap}"
              captures: { app: "$.data.id", code: "$.data.confirmation_code", prov: "$.data.provisional_determination", st: "$.data.status" }
          assert:
            - "Application.${app}.confirmation_code is non-empty and server-minted (not a request field)"
            - "provisional_determination == PROVISIONALLY_ELIGIBLE (3000000 <= 4000000, inclusive)"
            - "status == SUBMITTED (initial_state)"
            - "ApplicationCampaign.${c}.applications_received_count == 1 on a subsequent GET"

      - name: unit_list_filtered_by_property
        claim_type: listing
        grounds:
          - entities.Unit.fields.property_id
        distinguishing_aspect: "GET /units?property_id= returns only that property's units; total_count reflects the filtered set, not the global one."
        test_recipe:
          setup: ["two properties; P1 has units 101 and 102; P2 has unit 201"]
          setup_api_calls:
            - call: "POST /properties"
              payload: { name: "Maple Court", address_line: "1 Main St", city: "Springfield", state_code: "IL" }
              as: HousingDeveloper
              captures: { p1: "$.data.id" }
            - call: "POST /properties"
              payload: { name: "Oak Court", address_line: "2 Oak St", city: "Springfield", state_code: "IL" }
              as: HousingDeveloper
              captures: { p2: "$.data.id" }
            - call: "POST /units"
              payload: { property_id: "${p1}", unit_number: "101", bedroom_count: "ONE_BR", ami_tier: "AMI_50" }
              as: HousingDeveloper
            - call: "POST /units"
              payload: { property_id: "${p1}", unit_number: "102", bedroom_count: "TWO_BR", ami_tier: "AMI_60" }
              as: HousingDeveloper
            - call: "POST /units"
              payload: { property_id: "${p2}", unit_number: "201", bedroom_count: "STUDIO", ami_tier: "AMI_30" }
              as: HousingDeveloper
          trigger:
            - call: "GET /units?property_id=${p1}"
              as: HousingDeveloper
          assert:
            - "response_type == 'array'; total_count == 2; has_more == false; every returned unit has property_id == ${p1}"
            - "GET /units?property_id=${p1}&bedroom_count=TWO_BR returns exactly the 102 unit"

  # ===========================================================================
  # Section: state_machines (Table 2 claims)
  # ===========================================================================
  - section: state_machines
    instances:
      - name: announce_with_single_channel_returns_marketing_insufficient
        claim_type: precondition_enforcement
        grounds:
          - state_machines.ApplicationCampaign.DRAFT_to_ANNOUNCED
          - errors[ERR_MARKETING_PLAN_INSUFFICIENT]
        distinguishing_aspect: "ANNOUNCE with only one marketing channel violates the >= 2 precondition and is rejected; the campaign stays DRAFT."
        test_recipe:
          setup: ["campaign in DRAFT with marketing_channels of length 1"]
          setup_api_calls:
            - call: "POST /properties"
              payload: { name: "Maple Court", address_line: "1 Main St", city: "Springfield", state_code: "IL" }
              as: HousingDeveloper
              captures: { p: "$.data.id" }
            - call: "POST /campaigns"
              payload: { property_id: "${p}", name: "June 2026", application_open_at: "2026-06-01T00:00:00Z", application_close_at: "2026-06-30T00:00:00Z", marketing_channels: ["LOCAL_NEWSPAPER"], marketing_plan_summary: "thin plan", target_ami_tier: "AMI_50" }
              as: HousingDeveloper
              captures: { c: "$.data.id" }
          trigger:
            - call: "POST /campaigns/${c}/transition"
              payload: { action: "ANNOUNCE" }
              as: MarketingCoordinator
              captures: { err: "$.data.error_id" }
          assert:
            - "response error_id == ERR_MARKETING_PLAN_INSUFFICIENT (422)"
            - "GET /campaigns/${c} still shows status DRAFT"

      - name: open_before_window_returns_window_not_open
        claim_type: precondition_enforcement
        grounds:
          - state_machines.ApplicationCampaign.ANNOUNCED_to_OPEN
          - errors[ERR_APPLICATION_WINDOW_NOT_OPEN]
        distinguishing_aspect: "OPEN at the startup default clock 2026-05-01, before application_open_at 2026-06-01, is rejected; the campaign stays ANNOUNCED."
        test_recipe:
          setup: ["ANNOUNCED campaign with open_at 2026-06-01; clock left at the startup default 2026-05-01"]
          setup_api_calls:
            - call: "POST /properties"
              payload: { name: "Maple Court", address_line: "1 Main St", city: "Springfield", state_code: "IL" }
              as: HousingDeveloper
              captures: { p: "$.data.id" }
            - call: "POST /campaigns"
              payload: { property_id: "${p}", name: "June 2026", application_open_at: "2026-06-01T00:00:00Z", application_close_at: "2026-06-30T00:00:00Z", marketing_channels: ["LOCAL_NEWSPAPER", "MAILERS"], marketing_plan_summary: "press and mailers", target_ami_tier: "AMI_50" }
              as: HousingDeveloper
              captures: { c: "$.data.id" }
            - call: "POST /campaigns/${c}/transition"
              payload: { action: "ANNOUNCE" }
              as: MarketingCoordinator
          trigger:
            - call: "POST /campaigns/${c}/transition"
              payload: { action: "OPEN" }
              as: HousingDeveloper
              captures: { err: "$.data.error_id" }
          assert:
            - "response error_id == ERR_APPLICATION_WINDOW_NOT_OPEN (422); campaign remains ANNOUNCED"

      - name: close_before_close_at_returns_invalid_state
        claim_type: invalid_transition
        grounds:
          - state_machines.ApplicationCampaign.OPEN_to_CLOSED
          - errors[ERR_INVALID_STATE]
        distinguishing_aspect: "CLOSE while the clock (2026-06-15) is still before application_close_at (2026-06-30) is rejected with ERR_INVALID_STATE."
        test_recipe:
          setup: ["OPEN campaign; clock 2026-06-15"]
          setup_api_calls:
            - call: "POST /properties"
              payload: { name: "Maple Court", address_line: "1 Main St", city: "Springfield", state_code: "IL" }
              as: HousingDeveloper
              captures: { p: "$.data.id" }
            - call: "POST /campaigns"
              payload: { property_id: "${p}", name: "June 2026", application_open_at: "2026-06-01T00:00:00Z", application_close_at: "2026-06-30T00:00:00Z", marketing_channels: ["LOCAL_NEWSPAPER", "MAILERS"], marketing_plan_summary: "press and mailers", target_ami_tier: "AMI_50" }
              as: HousingDeveloper
              captures: { c: "$.data.id" }
            - call: "POST /campaigns/${c}/transition"
              payload: { action: "ANNOUNCE" }
              as: MarketingCoordinator
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-06-15T00:00:00Z" }
              as: HousingDeveloper
            - call: "POST /campaigns/${c}/transition"
              payload: { action: "OPEN" }
              as: HousingDeveloper
          trigger:
            - call: "POST /campaigns/${c}/transition"
              payload: { action: "CLOSE" }
              as: HousingDeveloper
              captures: { err: "$.data.error_id" }
          assert:
            - "response error_id == ERR_INVALID_STATE (409); campaign remains OPEN"

      - name: lottery_create_requires_closed_campaign
        claim_type: precondition_enforcement
        grounds:
          - state_machines.LotteryRun
          - errors[ERR_INVALID_STATE]
          - concurrency_rules[lottery-run-create-stale-campaign]
        distinguishing_aspect: "POST /lottery-runs against an OPEN campaign (correct current version, so OCC passes) is rejected purely on campaign state."
        test_recipe:
          setup: ["OPEN campaign; caller has read the current campaign version"]
          setup_api_calls:
            - call: "POST /properties"
              payload: { name: "Maple Court", address_line: "1 Main St", city: "Springfield", state_code: "IL" }
              as: HousingDeveloper
              captures: { p: "$.data.id" }
            - call: "POST /campaigns"
              payload: { property_id: "${p}", name: "June 2026", application_open_at: "2026-06-01T00:00:00Z", application_close_at: "2026-06-30T00:00:00Z", marketing_channels: ["LOCAL_NEWSPAPER", "MAILERS"], marketing_plan_summary: "press and mailers", target_ami_tier: "AMI_50" }
              as: HousingDeveloper
              captures: { c: "$.data.id" }
            - call: "POST /campaigns/${c}/transition"
              payload: { action: "ANNOUNCE" }
              as: MarketingCoordinator
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-06-10T00:00:00Z" }
              as: HousingDeveloper
            - call: "POST /campaigns/${c}/transition"
              payload: { action: "OPEN" }
              as: HousingDeveloper
            - call: "GET /campaigns/${c}"
              as: HousingDeveloper
              captures: { cv: "$.data.version" }
          trigger:
            - call: "POST /lottery-runs"
              payload: { campaign_id: "${c}", seed: "SEED-EARLY", expected_campaign_version: "${cv}" }
              as: LotteryAdministrator
              as_user_id: "lot-1"
              captures: { err: "$.data.error_id" }
          assert:
            - "response error_id == ERR_INVALID_STATE (409): campaign must be CLOSED; OCC passed because ${cv} was fresh"

      - name: seal_snapshot_excludes_late_verified_application
        claim_type: side_effect_execution
        grounds:
          - state_machines.LotteryRun.DRAFT_to_SEALED
          - state_machines.LotteryRun.SEALED_to_EXECUTED
          - entities.LotteryRun.fields.eligible_application_count
        distinguishing_aspect: "SEAL freezes the eligible set: an application verified AFTER the seal but BEFORE execute is excluded; entries_generated == 1 and PUBLISH flips the campaign to LOTTERY_COMPLETED."
        test_recipe:
          setup: ["campaign CLOSED; application A VERIFIED before close; application B still UNDER_REVIEW at seal time, verified afterwards"]
          setup_api_calls:
            - call: "POST /properties"
              payload: { name: "Maple Court", address_line: "1 Main St", city: "Springfield", state_code: "IL" }
              as: HousingDeveloper
              captures: { p: "$.data.id" }
            - call: "POST /campaigns"
              payload: { property_id: "${p}", name: "June 2026", application_open_at: "2026-06-01T00:00:00Z", application_close_at: "2026-06-30T00:00:00Z", marketing_channels: ["LOCAL_NEWSPAPER", "MAILERS"], marketing_plan_summary: "press and mailers", target_ami_tier: "AMI_50" }
              as: HousingDeveloper
              captures: { c: "$.data.id" }
            - call: "POST /campaigns/${c}/transition"
              payload: { action: "ANNOUNCE" }
              as: MarketingCoordinator
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-06-10T00:00:00Z" }
              as: HousingDeveloper
            - call: "POST /campaigns/${c}/transition"
              payload: { action: "OPEN" }
              as: HousingDeveloper
            - call: "POST /applicants"
              payload: { full_name: "Uma U", email: "u@x.com" }
              as: Anonymous
              captures: { apu: "$.data.id" }
            - call: "POST /applications"
              payload: { applicant_id: "${apu}", campaign_id: "${c}", household_size: 2, self_reported_annual_income_cents: 3000000 }
              as: Applicant
              as_user_id: "${apu}"
              captures: { appa: "$.data.id" }
            - call: "POST /applications/${appa}/review"
              payload: { action: "BEGIN_REVIEW" }
              as: ApplicationClerk
            - call: "POST /applications/${appa}/review"
              payload: { action: "COMPLETE_VERIFICATION" }
              as: ApplicationClerk
            - call: "POST /applicants"
              payload: { full_name: "Vic V", email: "v@x.com" }
              as: Anonymous
              captures: { apv: "$.data.id" }
            - call: "POST /applications"
              payload: { applicant_id: "${apv}", campaign_id: "${c}", household_size: 1, self_reported_annual_income_cents: 2500000 }
              as: Applicant
              as_user_id: "${apv}"
              captures: { appb: "$.data.id" }
            - call: "POST /applications/${appb}/review"
              payload: { action: "BEGIN_REVIEW" }
              as: ApplicationClerk
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-06-30T00:00:00Z" }
              as: HousingDeveloper
            - call: "POST /campaigns/${c}/transition"
              payload: { action: "CLOSE" }
              as: HousingDeveloper
            - call: "GET /campaigns/${c}"
              as: HousingDeveloper
              captures: { cv: "$.data.version" }
            - call: "POST /lottery-runs"
              payload: { campaign_id: "${c}", seed: "SEED-SNAP", expected_campaign_version: "${cv}" }
              as: LotteryAdministrator
              as_user_id: "lot-1"
              captures: { run: "$.data.id" }
            - call: "POST /lottery-runs/${run}/transition"
              payload: { action: "SEAL" }
              as: LotteryAdministrator
              as_user_id: "lot-1"
              captures: { snap: "$.data.eligible_application_count" }
            - call: "POST /applications/${appb}/review"
              payload: { action: "COMPLETE_VERIFICATION" }
              as: ApplicationClerk
          trigger:
            - call: "POST /lottery-runs/${run}/transition"
              payload: { action: "EXECUTE" }
              as: LotteryAdministrator
              as_user_id: "lot-1"
              captures: { gen: "$.data.entries_generated" }
            - call: "POST /lottery-runs/${run}/transition"
              payload: { action: "PUBLISH" }
              as: LotteryAdministrator
              as_user_id: "lot-1"
            - call: "GET /campaigns/${c}"
              as: HousingDeveloper
              captures: { cst: "$.data.status" }
            - call: "GET /waitlist-entries?lottery_run_id=${run}"
              as: LotteryAdministrator
              captures: { only_app: "$.data[0].application_id" }
          assert:
            - "LotteryRun.${run}.eligible_application_count == 1 at SEAL (${snap})"
            - "entries_generated == 1 (${gen}): application ${appb} verified after SEAL is excluded from the snapshot"
            - "the single entry belongs to application ${appa} (${only_app})"
            - "after PUBLISH, campaign status == LOTTERY_COMPLETED (${cst})"

      - name: void_published_run_cascades_without_refusal_increment
        claim_type: side_effect_execution
        grounds:
          - state_machines.LotteryRun.PUBLISHED_to_VOIDED
          - state_machines.UnitOffer.PENDING_to_VOIDED
          - state_machines.WaitlistEntry.OFFERED_to_REMOVED
        distinguishing_aspect: "VOIDING a PUBLISHED run removes its OFFERED entry with reason LOTTERY_VOIDED, voids the PENDING offer WITHOUT bumping refusal_count, releases the unit to AVAILABLE, and reverts the campaign to CLOSED."
        test_recipe:
          setup: ["full pipeline: one CERTIFIED entry holding a PENDING offer on unit 101; campaign LEASING"]
          setup_api_calls:
            - call: "POST /properties"
              payload: { name: "Maple Court", address_line: "1 Main St", city: "Springfield", state_code: "IL" }
              as: HousingDeveloper
              captures: { p: "$.data.id" }
            - call: "POST /occupancy-standards"
              payload: { property_id: "${p}", bedroom_count: "ONE_BR", min_occupants: 1, max_occupants: 3 }
              as: HousingDeveloper
            - call: "POST /ami-limits"
              payload: { property_id: "${p}", household_size: 2, ami_tier: "AMI_50", annual_limit_cents: 4000000 }
              as: HousingDeveloper
            - call: "POST /units"
              payload: { property_id: "${p}", unit_number: "101", bedroom_count: "ONE_BR", ami_tier: "AMI_50" }
              as: HousingDeveloper
              captures: { u1: "$.data.id" }
            - call: "POST /campaigns"
              payload: { property_id: "${p}", name: "June 2026", application_open_at: "2026-06-01T00:00:00Z", application_close_at: "2026-06-30T00:00:00Z", marketing_channels: ["LOCAL_NEWSPAPER", "MAILERS"], marketing_plan_summary: "press and mailers", target_ami_tier: "AMI_50" }
              as: HousingDeveloper
              captures: { c: "$.data.id" }
            - call: "POST /campaigns/${c}/transition"
              payload: { action: "ANNOUNCE" }
              as: MarketingCoordinator
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-06-10T00:00:00Z" }
              as: HousingDeveloper
            - call: "POST /campaigns/${c}/transition"
              payload: { action: "OPEN" }
              as: HousingDeveloper
            - call: "POST /applicants"
              payload: { full_name: "Wes W", email: "w@x.com" }
              as: Anonymous
              captures: { ap: "$.data.id" }
            - call: "POST /applications"
              payload: { applicant_id: "${ap}", campaign_id: "${c}", household_size: 2, self_reported_annual_income_cents: 3000000 }
              as: Applicant
              as_user_id: "${ap}"
              captures: { app: "$.data.id" }
            - call: "POST /applications/${app}/review"
              payload: { action: "BEGIN_REVIEW" }
              as: ApplicationClerk
            - call: "POST /applications/${app}/review"
              payload: { action: "COMPLETE_VERIFICATION" }
              as: ApplicationClerk
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-06-30T00:00:00Z" }
              as: HousingDeveloper
            - call: "POST /campaigns/${c}/transition"
              payload: { action: "CLOSE" }
              as: HousingDeveloper
            - call: "GET /campaigns/${c}"
              as: HousingDeveloper
              captures: { cv: "$.data.version" }
            - call: "POST /lottery-runs"
              payload: { campaign_id: "${c}", seed: "SEED-VOID", expected_campaign_version: "${cv}" }
              as: LotteryAdministrator
              as_user_id: "lot-1"
              captures: { run: "$.data.id" }
            - call: "POST /lottery-runs/${run}/transition"
              payload: { action: "SEAL" }
              as: LotteryAdministrator
              as_user_id: "lot-1"
            - call: "POST /lottery-runs/${run}/transition"
              payload: { action: "EXECUTE" }
              as: LotteryAdministrator
              as_user_id: "lot-1"
            - call: "POST /lottery-runs/${run}/transition"
              payload: { action: "PUBLISH" }
              as: LotteryAdministrator
              as_user_id: "lot-1"
            - call: "POST /income-certifications"
              payload: { application_id: "${app}" }
              as: ComplianceOfficer
              captures: { cert: "$.data.id" }
            - call: "POST /income-certifications/${cert}/advance"
              payload: { action: "REQUEST_DOCS", required_docs: ["SALARY"] }
