            - call: "POST /engagements"
              as: RentalManager
              payload: { engagement_type: "RENTAL", space_id: "${space_id}", rental_client_id: "${client_id}", title: "Parent Probe", load_in_start_utc: "2026-10-01T08:00:00Z", performance_start_utc: "2026-10-02T19:00:00Z", performance_end_utc: "2026-10-02T22:00:00Z", load_out_end_utc: "2026-10-03T02:00:00Z", performance_day_count: 1, load_in_day_count: 1 }
              captures: { engagement_id: "$.data.id" }
          trigger:
            - call: "POST /engagements/${engagement_id}/labor-calls"
              as: TechnicalDirector
              payload: { union_department_id: "8f2a1c34-0000-4000-8000-0000000000aa", crew_size: 4, call_start_utc: "2026-10-01T08:00:00Z", call_end_utc: "2026-10-01T12:00:00Z" }
              captures: { err_body: "$.data.error_id" }
            - call: "POST /engagements/8f2a1c34-0000-4000-8000-0000000000bb/labor-calls"
              as: TechnicalDirector
