              as: StoreManager
            - call: "GET /stores/${store_id}"
              payload: {}
              as: StoreManager
              captures: { st_v: $.data.version }
            - call: "POST /stores/${store_id}/staffing-plans"
              payload: { service_date: "2026-08-01", daypart: "LUNCH", forecast_txn_count: 300, mto_share_bp: 5000, expected_store_version: "${st_v}" }
              as: StoreManager
              captures: { plan_id: $.data.id }
            - call: "POST /staffing-plans/${plan_id}/publish"
              payload: {}
              as: StoreManager
            - call: "POST /menu-items"
              payload: { sku: "COFFEE-LG", name: "Large Coffee", station: "BEVERAGE", fulfillment_mode: "MADE_TO_ORDER", base_price_cents: 249, unit_food_cost_cents: 40, prep_seconds: 45, valid_dayparts: ["BREAKFAST", "LUNCH", "DINNER", "OVERNIGHT"], included_premium_count: 0, is_catering_eligible: true }
              as: ChainAdmin
              captures: { coffee_id: $.data.id }
            - call: "POST /orders"
              payload: { store_id: "${store_id}", channel: "MOBILE_PREORDER", pickup_window_start: "2026-08-01T13:00:00Z", pickup_window_end: "2026-08-01T13:30:00Z" }
              as: StoreTerminal
              captures: { order_id: $.data.id }
            - call: "POST /orders/${order_id}/lines"
              payload: { menu_item_id: "${coffee_id}", qty: 1 }
              as: StoreTerminal
            - call: "POST /orders/${order_id}/place"
              payload: {}
              as: StoreTerminal
            - call: "POST /orders/${order_id}/authorize"
              payload: { tender_type: "APP_WALLET" }
              as: StoreTerminal
            - call: "GET /kitchen-tickets"
              payload: { order_id: "${order_id}" }
              as: KitchenAssociate
              captures: { tk: "$.data[0].id" }
            - call: "POST /kitchen-tickets/${tk}/start"
              payload: {}
              as: KitchenAssociate
              as_user_id: "assoc-1"
            - call: "POST /kitchen-tickets/${tk}/complete"
              payload: {}
              as: KitchenAssociate
              as_user_id: "assoc-1"
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-01T11:05:00Z" }
              as: ChainAdmin
