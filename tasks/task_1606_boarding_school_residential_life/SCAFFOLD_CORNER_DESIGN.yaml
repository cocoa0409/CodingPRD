  - section: errors
    instances:
      - name: error_invalid_state_covered_by_difficulty
        claim_type: violation_to_error
        grounds: ["errors[ERR_INVALID_STATE]"]
        excluded_because:
          difficulty_instance: night_check_requires_shift_scheduled
          rationale: "Asserted as the failure of a night check on a COMPLETED shift; also the winning error in state_beats_fiscal_on_cancelled_leave_dorm_decision."
      - name: error_medication_on_hold_covered_by_difficulty
        claim_type: violation_to_error
        grounds: ["errors[ERR_MEDICATION_ON_HOLD]"]
        excluded_because:
          difficulty_instance: safety_beats_referential_on_held_order_administration
          rationale: "Asserted as the winning safety error over ERR_DOSE_ALREADY_LOGGED."
      - name: error_order_not_active_covered_by_difficulty
        claim_type: violation_to_error
        grounds: ["errors[ERR_ORDER_NOT_ACTIVE]"]
        excluded_because:
          difficulty_instance: medication_zero_doses_auto_complete_and_reject
          rationale: "Asserted on the 3rd administration against the auto-COMPLETED order."
      - name: error_no_confirmed_residency_covered_by_difficulty
        claim_type: violation_to_error
        grounds: ["errors[ERR_NO_CONFIRMED_RESIDENCY]"]
        excluded_because:
          difficulty_instance: leave_dorm_decision_requires_confirmed_assignment
          rationale: "Asserted on dorm-decision while the assignment is still PROPOSED."
      - name: error_leave_window_overlap_covered_by_difficulty
        claim_type: violation_to_error
        grounds: ["errors[ERR_LEAVE_WINDOW_OVERLAP]"]
        excluded_because:
          difficulty_instance: leave_window_half_open_adjacency_allowed_overlap_rejected
          rationale: "Asserted on the 18:59 overlapping departure."
      - name: error_storage_capacity_covered_by_difficulty
        claim_type: violation_to_error
        grounds: ["errors[ERR_STORAGE_CAPACITY_EXCEEDED]"]
        excluded_because:
          difficulty_instance: storage_aggregate_capacity_boundary
          rationale: "Asserted on the reservation pushing the unit to 11 > 10."
      - name: error_appeal_limit_covered_by_difficulty
        claim_type: violation_to_error
        grounds: ["errors[ERR_APPEAL_LIMIT_REACHED]"]
        excluded_because:
          difficulty_instance: discipline_case_appeal_cycle_with_cap
          rationale: "Asserted on the second appeal attempt after UPHOLD."
      - name: error_leave_allowance_exhausted_covered_by_difficulty
        claim_type: violation_to_error
        grounds: ["errors[ERR_LEAVE_ALLOWANCE_EXHAUSTED]"]
        excluded_because:
          difficulty_instance: state_beats_fiscal_on_cancelled_leave_dorm_decision
          rationale: "The losing fiscal branch of the priority pair: allowance is 0 for the SUSPENDED student, but the state error wins; the assertion documents that ERR_LEAVE_ALLOWANCE_EXHAUSTED is the suppressed alternative."

  - section: rbac
    instances:
      - name: student_cannot_create_dorm_forbidden
        claim_type: violation_to_error
        grounds: ["roles[SchoolAdmin].exclusive_operations", "errors[ERR_FORBIDDEN]"]
        distinguishing_aspect: "Peer-role isolation: the Student role is not in POST /reslife/dorms roles, so even a valid student identity gets ERR_FORBIDDEN."
        test_recipe:
          setup: ["one student exists"]
          setup_api_calls:
            - { call: "POST /reslife/parents", payload: { full_name: "Pat AF", email: "paf@x.com" }, as: SchoolAdmin, captures: { par: "$.data.id" } }
            - { call: "POST /reslife/students", payload: { legal_name: "Stu AF", grade: 10, gender: "MALE", is_international: false, parent_id: "${par}", sleep_schedule: 3, cleanliness: 3, noise_tolerance: 3, guests_comfort: 3 }, as: SchoolAdmin, captures: { stu: "$.data.id" } }
          trigger:
            - { call: "POST /reslife/dorms", payload: { name: "Rogue Hall", gender_policy: "ANY", curfew_weekday: "22:30", curfew_weekend: "23:30" }, as: Student, as_user_id: "${stu}", captures: { err: "$.data.error_id" } }
          assert:
            - "captured err == ERR_FORBIDDEN"
      - name: dean_cannot_administer_medication_forbidden
        claim_type: violation_to_error
        grounds: ["roles[Nurse].exclusive_operations", "errors[ERR_FORBIDDEN]"]
        distinguishing_aspect: "Segregated medication authority: Dean is a privileged role elsewhere but is not in the administrations endpoint roles — ERR_FORBIDDEN."
        test_recipe:
          setup: ["ENROLLED student with an ACTIVE order"]
          setup_api_calls:
            - { call: "POST /reslife/parents", payload: { full_name: "Pat AG", email: "pag@x.com" }, as: SchoolAdmin, captures: { par: "$.data.id" } }
            - { call: "POST /reslife/students", payload: { legal_name: "Stu AG", grade: 9, gender: "FEMALE", is_international: false, parent_id: "${par}", sleep_schedule: 3, cleanliness: 3, noise_tolerance: 3, guests_comfort: 3 }, as: SchoolAdmin, captures: { stu: "$.data.id" } }
            - { call: "POST /reslife/staff", payload: { full_name: "Nurse One", staff_role: "NURSE" }, as: SchoolAdmin, captures: { nurse: "$.data.id" } }
            - { call: "POST /reslife/staff", payload: { full_name: "Dean One", staff_role: "DEAN" }, as: SchoolAdmin, captures: { dean1: "$.data.id" } }
            - { call: "POST /reslife/medication-orders", payload: { student_id: "${stu}", medication_name: "Ibuprofen", dose_mg: 200, slot: "NOON", doses_total: 10, is_controlled: false, prescriber_name: "Dr H" }, as: Nurse, as_user_id: "${nurse}", captures: { order: "$.data.id" } }
          trigger:
            - { call: "POST /reslife/medication-orders/${order}/administrations", payload: { scheduled_date: "2026-09-01", outcome: "ADMINISTERED" }, as: Dean, as_user_id: "${dean1}", captures: { err: "$.data.error_id" } }
          assert:
            - "captured err == ERR_FORBIDDEN"
      - name: appeal_decision_by_reporter_rejected
        claim_type: violation_to_error
        grounds: ["validations[priority=24]", "errors[ERR_REPORTER_CANNOT_ADJUDICATE]"]
        distinguishing_aspect: "Segregation of duties extends into the appeal loop: the dean who reported the case cannot decide its appeal — ERR_REPORTER_CANNOT_ADJUDICATE; another dean can."
        test_recipe:
          setup: ["MINOR case SANCTIONED (reporter dean1, outcome by dean2); appeal filed by the student"]
          setup_api_calls:
            - { call: "POST /reslife/parents", payload: { full_name: "Pat AH", email: "pah@x.com" }, as: SchoolAdmin, captures: { par: "$.data.id" } }
            - { call: "POST /reslife/students", payload: { legal_name: "Stu AH", grade: 10, gender: "MALE", is_international: false, parent_id: "${par}", sleep_schedule: 3, cleanliness: 3, noise_tolerance: 3, guests_comfort: 3 }, as: SchoolAdmin, captures: { stu: "$.data.id" } }
            - { call: "POST /reslife/staff", payload: { full_name: "Dean One", staff_role: "DEAN" }, as: SchoolAdmin, captures: { dean1: "$.data.id" } }
            - { call: "POST /reslife/staff", payload: { full_name: "Dean Two", staff_role: "DEAN" }, as: SchoolAdmin, captures: { dean2: "$.data.id" } }
            - { call: "POST /reslife/discipline-cases", payload: { student_id: "${stu}", category: "MINOR", description: "Dorm damage", points_proposed: 6 }, as: Dean, as_user_id: "${dean1}", captures: { case1: "$.data.id" } }
            - { call: "POST /reslife/discipline-cases/${case1}/begin-review", payload: {}, as: Dean, as_user_id: "${dean1}" }
            - { call: "POST /reslife/discipline-cases/${case1}/record-outcome", payload: { outcome: "SANCTIONED", sanction_type: "WARNING", points_assessed: 6 }, as: Dean, as_user_id: "${dean2}" }
            - { call: "POST /reslife/discipline-cases/${case1}/appeal", payload: {}, as: Student, as_user_id: "${stu}" }
          trigger:
            - { call: "POST /reslife/discipline-cases/${case1}/appeal-decision", payload: { decision: "UPHOLD" }, as: Dean, as_user_id: "${dean1}", captures: { err: "$.data.error_id" } }
            - { call: "POST /reslife/discipline-cases/${case1}/appeal-decision", payload: { decision: "UPHOLD" }, as: Dean, as_user_id: "${dean2}", captures: { ok_status: "$.data.status" } }
          assert:
            - "captured err == ERR_REPORTER_CANNOT_ADJUDICATE"
            - "captured ok_status == SANCTIONED (non-reporter dean decides fine)"

  - section: cross_cutting
    instances:
      - name: assignment_create_stale_student_version_occ
        claim_type: optimistic_concurrency
        grounds: ["concurrency_rules[assignment-create-stale-student]", "errors[ERR_STALE_VERSION]"]
        distinguishing_aspect: "OCC on Student.version: after a first assignment create advances the student's version, a second create carrying the stale expected_student_version is rejected with 412 ERR_STALE_VERSION; the same create with the fresh version succeeds and SUPERSEDES the first proposal."
        test_recipe:
          setup: ["term ACTIVE; dorm with 2-bed room; student at version 1"]
          setup_api_calls:
            - { call: "POST /reslife/dorms", payload: { name: "Winslow House", gender_policy: "ANY", curfew_weekday: "22:30", curfew_weekend: "23:30" }, as: SchoolAdmin, captures: { dorm_id: "$.data.id" } }
            - { call: "POST /reslife/rooms", payload: { dorm_id: "${dorm_id}", room_number: "W-101", beds: 2 }, as: SchoolAdmin, captures: { room_id: "$.data.id" } }
            - { call: "POST /reslife/terms", payload: { name: "FALL_2026", starts_on: "2026-08-24", ends_on: "2026-12-18" }, as: SchoolAdmin, captures: { term_id: "$.data.id" } }
            - { call: "POST /reslife/terms/${term_id}/activate", payload: {}, as: SchoolAdmin }
            - { call: "POST /reslife/parents", payload: { full_name: "Pat AI", email: "pai@x.com" }, as: SchoolAdmin, captures: { par: "$.data.id" } }
            - { call: "POST /reslife/students", payload: { legal_name: "Stu AI", grade: 10, gender: "MALE", is_international: false, parent_id: "${par}", sleep_schedule: 3, cleanliness: 3, noise_tolerance: 3, guests_comfort: 3 }, as: SchoolAdmin, captures: { stu: "$.data.id", stu_v: "$.data.version" } }
            - { call: "POST /reslife/dorm-assignments", payload: { student_id: "${stu}", room_id: "${room_id}", term_id: "${term_id}", expected_student_version: "${stu_v}" }, as: SchoolAdmin, captures: { asg_a: "$.data.id" } }
          trigger:
            - { call: "POST /reslife/dorm-assignments", payload: { student_id: "${stu}", room_id: "${room_id}", term_id: "${term_id}", expected_student_version: "${stu_v}" }, as: SchoolAdmin, captures: { err: "$.data.error_id" } }
            - { call: "GET /reslife/students/${stu}", payload: {}, as: SchoolAdmin, captures: { stu_v2: "$.data.version" } }
            - { call: "POST /reslife/dorm-assignments", payload: { student_id: "${stu}", room_id: "${room_id}", term_id: "${term_id}", expected_student_version: "${stu_v2}" }, as: SchoolAdmin, captures: { asg_b: "$.data.id" } }
            - { call: "GET /reslife/dorm-assignments/${asg_a}", payload: {}, as: SchoolAdmin, captures: { a_status: "$.data.status" } }
          assert:
            - "captured err == ERR_STALE_VERSION (412)"
            - "DormAssignment.${asg_b} created with status PROPOSED"
            - "captured a_status == SUPERSEDED"
      - name: duty_shift_create_stale_dorm_version_occ
        claim_type: optimistic_concurrency
        grounds: ["concurrency_rules[duty-shift-create-stale-dorm]", "errors[ERR_STALE_VERSION]"]
        distinguishing_aspect: "OCC on Dorm.version for a different parent entity: a shift create with the pre-supersede dorm version is rejected with 412; with the fresh version it succeeds and the prior SCHEDULED shift for the same dorm+date+slot is CANCELLED with cancel_reason SUPERSEDED."
        test_recipe:
          setup: ["dorm at version 1; shift1 SCHEDULED for 2026-09-07 WEEKDAY_NIGHT (dorm version now 2)"]
          setup_api_calls:
            - { call: "POST /reslife/dorms", payload: { name: "Winslow House", gender_policy: "ANY", curfew_weekday: "22:30", curfew_weekend: "23:30" }, as: SchoolAdmin, captures: { dorm_id: "$.data.id", dorm_v: "$.data.version" } }
            - { call: "POST /reslife/staff", payload: { full_name: "DP One", staff_role: "DORM_PARENT", dorm_id: "${dorm_id}" }, as: SchoolAdmin, captures: { dp: "$.data.id" } }
            - { call: "POST /reslife/staff", payload: { full_name: "DP Two", staff_role: "DORM_PARENT", dorm_id: "${dorm_id}" }, as: SchoolAdmin, captures: { dp2: "$.data.id" } }
            - { call: "POST /reslife/duty-shifts", payload: { dorm_id: "${dorm_id}", staff_id: "${dp}", duty_date: "2026-09-07", shift_slot: "WEEKDAY_NIGHT", expected_dorm_version: "${dorm_v}" }, as: SchoolAdmin, captures: { shift1: "$.data.id" } }
          trigger:
            - { call: "POST /reslife/duty-shifts", payload: { dorm_id: "${dorm_id}", staff_id: "${dp2}", duty_date: "2026-09-07", shift_slot: "WEEKDAY_NIGHT", expected_dorm_version: "${dorm_v}" }, as: SchoolAdmin, captures: { err: "$.data.error_id" } }
            - { call: "GET /reslife/dorms/${dorm_id}", payload: {}, as: SchoolAdmin, captures: { dorm_v2: "$.data.version" } }
            - { call: "POST /reslife/duty-shifts", payload: { dorm_id: "${dorm_id}", staff_id: "${dp2}", duty_date: "2026-09-07", shift_slot: "WEEKDAY_NIGHT", expected_dorm_version: "${dorm_v2}" }, as: SchoolAdmin, captures: { shift2: "$.data.id" } }
            - { call: "GET /reslife/duty-shifts/${shift1}", payload: {}, as: SchoolAdmin, captures: { s1_status: "$.data.status", s1_reason: "$.data.cancel_reason" } }
          assert:
            - "captured err == ERR_STALE_VERSION (412)"
            - "DutyShift.${shift2} created with status SCHEDULED and staff_id == ${dp2}"
            - "captured s1_status == CANCELLED and s1_reason == SUPERSEDED"

  - section: consistency
    instances:
