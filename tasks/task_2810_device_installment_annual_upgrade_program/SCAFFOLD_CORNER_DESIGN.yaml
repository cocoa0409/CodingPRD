      - name: two_gates_violated_at_once_returns_the_lower_numbered_error
        claim_type: priority_ordering
        grounds:
          - validations.priority_54_ERR_LOAN_DELINQUENT
          - validations.priority_100_ERR_UPGRADE_THRESHOLD_NOT_MET
        excluded_because:
          difficulty_instance: delinquent_loan_beats_upgrade_threshold_on_upgrade_request
          rationale: |
            That §1.8 instance is the priority-ordering test: one call violates both priority 54
            (loan DELINQUENT) and priority 100 (ratio 4583 < 5000) and must return
            ERR_LOAN_DELINQUENT with HTTP 409, and it also runs the control where only 100 is
            violated. Restating it as a corner would duplicate both arms.

      - name: temporal_gate_outranks_the_capacity_gate
        claim_type: priority_conflict
        grounds:
          - validations.priority_80_ERR_UPGRADE_WINDOW_NOT_OPEN
          - validations.priority_90_ERR_MODEL_CAPACITY_EXHAUSTED
        excluded_because:
          difficulty_instance: upgrade_window_temporal_gate_beats_model_reservation_capacity
          rationale: |
            The P-versus-P+N conflict is exactly that instance: a loan one day short of its
            330-day window aimed at a model whose capacity is already exhausted must return
            ERR_UPGRADE_WINDOW_NOT_OPEN (80) rather than ERR_MODEL_CAPACITY_EXHAUSTED (90),
            with the reserved slot count proven unchanged.

      - name: application_validity_depends_on_the_customers_lock_state
        claim_type: cross_entity_validation
        grounds:
          - validations.priority_72_ERR_CUSTOMER_FINANCING_LOCKED
          - validations.priority_51_ERR_APPLICATION_NOT_APPROVED
        excluded_because:
          difficulty_instance: credit_application_blocked_by_customer_financing_lock
          rationale: |
            Both arms of the cross-entity rule live in that instance: while the Customer is
            FINANCING_LOCKED the application, decision and origination calls all fail
            (ERR_CUSTOMER_FINANCING_LOCKED, and ERR_APPLICATION_NOT_APPROVED on the
            VOIDED_BY_LOCK application), and after the lock is released by curing the defaulted
            loan the identical calls succeed.

      - name: individually_valid_reservations_collectively_exceed_capacity
        claim_type: aggregate_validation
        grounds:
          - validations.priority_90_ERR_MODEL_CAPACITY_EXHAUSTED
          - calculations.model_reservation_capacity
        excluded_because:
          difficulty_instance: model_reservation_capacity_over_overlapping_fulfillment_windows
          rationale: |
            The aggregate claim is the subject there: each individual upgrade request is
            perfectly valid, but the count of live requests whose windows overlap the candidate
            reaches concurrent_reservation_capacity and the next one is refused with
            ERR_MODEL_CAPACITY_EXHAUSTED, with the non-overlapping window accepted in the same
            fixture.

      - name: down_payment_rule_applies_only_to_conditionally_approved_applications
        claim_type: conditional_validation
        grounds:
          - validations.priority_101_ERR_DOWN_PAYMENT_INSUFFICIENT
          - entities.CreditApplication.fields.conditional_down_payment_required_cents
        excluded_because:
          difficulty_instance: segregation_of_duties_beats_down_payment_insufficient_on_origination
          rationale: |
            That instance contains the with/without pair for the conditional rule: on a
            CONDITIONAL_APPROVED application a short down payment raises
            ERR_DOWN_PAYMENT_INSUFFICIENT, while the same origination with the required amount
            passes — and it additionally proves priority 70 outranks 101 when both are
            violated.

      - name: quote_state_checks_run_only_after_the_quote_resolves
        claim_type: cascading_validation
        grounds:
          - validations.priority_36_ERR_PAYOFF_QUOTE_NOT_FOUND
          - validations.priority_59_ERR_PAYOFF_QUOTE_NOT_ISSUED
          - validations.priority_82_ERR_PAYOFF_QUOTE_EXPIRED
        excluded_because:
          difficulty_instance: payoff_quote_validity_window_single_occupancy_half_open
          rationale: |
            The dependency chain 36 -> 59 -> 82 is walked there on one loan: the quote must
            resolve before its status can be judged NOT_ISSUED (superseded) and before its
            7-day validity window can be judged EXPIRED, and the instance pins the half-open
            boundary at expires_at itself.

