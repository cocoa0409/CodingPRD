- rule_id: priority_pair_validation_conflict
  instances:
  - name: suspended_participant_error_beats_per_participant_cap_error
    grounds:
    - validations[priority=9,rule_id=participant-not-suspended-for-support]
    - validations[priority=13,rule_id=per-participant-cap]
    - errors[ERR_PARTICIPANT_SUSPENDED]
    - errors[ERR_PARTICIPANT_CAP_EXCEEDED]
    - calculations.support_request_settlement
    distinguishing_aspect: 'Error-category pair business_referential (priority 9) versus business_fiscal (priority
      13): one POST /support-requests violates both, the referential error wins, and lifting only the suspension exposes
      the fiscal error underneath.'
    test_recipe:
      setup:
      - Logical clock at 2026-08-01T08:00:00.000Z.
      - Participant p1 registered, then suspended by the director (suspension_status SUSPENDED, engagement_posture
        FROZEN).
      - 'FunderGrant g1: authorized_cents 5000000, per_participant_cap_cents 10000, funding_posture OPEN.'
      - The request being attempted is TRANSIT_PASS 10000 x 2 -> requested 20000, admin fee 600, total_charge_cents
        20600, which alone exceeds per_participant_cap_cents 10000.
      setup_api_calls:
      - call: POST /_clock/set_current_utc
        payload:
          current_utc: '2026-08-01T08:00:00.000Z'
        as: CaseManager
        as_user_id: cm-1
      - call: POST /participants
        payload:
          full_name: Andre Colwell
          facility_name: Northgate Correctional
          facility_state: OH
          expected_release_date: '2026-08-10'
          record_categories:
          - PROPERTY_OFFENSE
          required_document_types:
          - STATE_ID
          - SSN_CARD
          - BIRTH_CERTIFICATE
          - WORK_HISTORY
          - MEDICAID_APPLICATION
          assigned_case_manager_user_id: cm-1
        as: CaseManager
        as_user_id: cm-1
        captures:
          p1_id: $.data.id
      - call: POST /grants
        payload:
          funder_name: Statewide Reentry Fund
          program_year: 2026
          authorized_cents: 5000000
          allowed_categories:
          - TOOLS
          - UNIFORM
          - TRANSIT_PASS
          - ID_FEE
          - LICENSE_FEE
          - WAGE_SUBSIDY
          per_participant_cap_cents: 10000
          retention_benchmark_pct: 50.0
        as: FunderAnalyst
        as_user_id: analyst-1
        captures:
          g1_id: $.data.id
      - call: POST /participants/${p1_id}/suspension
        payload:
          to_status: SUSPENDED
          suspension_reason: Missed two supervision appointments
        as: ProgramDirector
        as_user_id: pd-1
      - call: GET /grants/${g1_id}
        as: CaseManager
        as_user_id: cm-1
        captures:
          g1_v_a: $.data.version
      trigger:
      - call: POST /support-requests
        payload:
          participant_id: ${p1_id}
          grant_id: ${g1_id}
          category: TRANSIT_PASS
          expected_grant_version: ${g1_v_a}
          line_items:
          - description: Monthly regional transit pass
            unit_cost_cents: 10000
            quantity: 2
          justification: Two months of transit passes
        as: CaseManager
        as_user_id: cm-1
        captures:
          err_susp: $.data.error_id
      - call: POST /participants/${p1_id}/suspension
        payload:
          to_status: LIFTED
        as: ProgramDirector
        as_user_id: pd-1
      - call: GET /grants/${g1_id}
        as: CaseManager
        as_user_id: cm-1
        captures:
          g1_v_b: $.data.version
      - call: POST /support-requests
        payload:
          participant_id: ${p1_id}
          grant_id: ${g1_id}
          category: TRANSIT_PASS
          expected_grant_version: ${g1_v_b}
          line_items:
          - description: Monthly regional transit pass
            unit_cost_cents: 10000
            quantity: 2
          justification: Two months of transit passes
        as: CaseManager
        as_user_id: cm-1
        captures:
          err_cap: $.data.error_id
      assert:
      - the first POST /support-requests returns error_id ${err_susp} == ERR_PARTICIPANT_SUSPENDED with http_status
        409
      - ${err_susp} != ERR_PARTICIPANT_CAP_EXCEEDED even though total_charge_cents 20600 > per_participant_cap_cents
        10000
      - after POST /participants/${p1_id}/suspension with to_status == LIFTED, Participant.${p1_id}.suspension_status
        == NONE
      - the second POST /support-requests returns error_id ${err_cap} == ERR_PARTICIPANT_CAP_EXCEEDED with http_status
        409
      - GET /support-requests?grant_id=${g1_id} returns total_count == 0 — neither refused request was persisted
      - FunderGrant.${g1_id}.open_request_count == 0 and committed_cents == 0
      - Participant.${p1_id}.engagement_posture == OPEN after the lift
