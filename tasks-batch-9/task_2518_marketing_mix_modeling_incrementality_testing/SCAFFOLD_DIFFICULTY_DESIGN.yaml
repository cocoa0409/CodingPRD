  - rule_id: resource_temporal_overlap
    note: >-
      Two DIFFERENT resource entities under two DIFFERENT interval semantics: MediaChannel occupancy uses a HALF-OPEN candidate against an incumbent whose tail carries a washout buffer (asymmetric), while DataWindow occupancy uses a CLOSED interval with no buffer, scoped by granularity.
    instances:
      - name: experiment_channel_window_half_open_with_incumbent_washout_buffer
        grounds:
          - "validations priority 65 (business_temporal) - no other Experiment on the same (market_id, channel_id) with status IN {DESIGN_LOCKED, CELLS_ASSIGNED, RUNNING, READ_OUT, ACCEPTED} occupies an overlapping interval, else ERR_EXPERIMENT_WINDOW_CONFLICT (409); the candidate occupies [start_date, end_date) while each incumbent occupies [start_date, end_date + washout_days)"
          - "state_machines Experiment DRAFT -> DESIGN_LOCKED, whose precondition list repeats that a DRAFT sibling reserves nothing"
          - "entities Experiment.channel_id (the resource handle), start_date, end_date, washout_days"
          - "endpoints POST /mmm/experiments/{id}/lock-design (200, ExperimentDesigner)"
        distinguishing_aspect: |
          The contested resource is a MediaChannel and the interval semantics are ASYMMETRIC: the
          washout buffer is appended to the INCUMBENT's tail only, so a candidate starting exactly on
          incumbent.end_date + washout_days is admitted while one day earlier is rejected, and a
          candidate with a 30-day washout of its own that ends exactly on the incumbent's start_date is
          still admitted - an implementation that buffers both sides, or that treats the candidate
          interval as closed, rejects the two calls that must succeed.
          
        test_recipe:
          setup:
            - "Market US_CORE with total_population 10000000 and two media channels A_SEARCH and B_SOCIAL. No DataWindow exists, so data_posture is RESTRICTED, which is != FROZEN and does not block lock-design."
            - "Five AUDIENCE_SPLIT / DIFF_IN_DIFF experiments, all with mde 5.0, baseline_conversion_rate 0.0200 and planned arms 245000 / 245000, so every one of them has power_index 2.5000 and computed_power 0.8000 and clears the priority-52 power gate - the interval rule is the only thing under test."
            - "E1 on A_SEARCH, [2026-09-07, 2026-10-05), washout_days 7, is LOCKED in setup and is therefore the sole incumbent; it occupies [2026-09-07, 2026-10-12)."
            - "E2 on A_SEARCH, [2026-10-11, 2026-11-08), washout_days 7 - starts one day inside the incumbent's washout tail."
            - "E3 on A_SEARCH, [2026-10-12, 2026-11-09), washout_days 7 - starts exactly on the incumbent's washout tail boundary."
            - "E4 on B_SOCIAL, [2026-10-11, 2026-11-08), washout_days 7 - the same interval E2 uses, on the other channel."
            - "E5 on A_SEARCH, [2026-08-10, 2026-09-07), washout_days 30 - ends exactly on the incumbent's start_date and carries a washout longer than the gap, which is what makes the asymmetry observable."
          setup_api_calls:
            - call: "POST /mmm/markets"
              payload: { market_code: "US_CORE", name: "US Core Brand Market", total_population: 10000000, annual_budget_ceiling_cents: 5000000000, currency_code: "USD" }
              as: DataEngineer
              as_user_id: "de-1"
              captures: { mkt: "$.data.id" }
            - call: "POST /mmm/media-channels"
              payload: { market_id: "${mkt}", channel_code: "A_SEARCH", channel_type: "SEARCH", adstock_decay_rate: 0.50, adstock_max_lag_periods: 2, saturation_half_point_cents: 200000, response_ceiling_units: 1200, min_spend_cents: 200000, max_spend_cents: 3000000, status: "ACTIVE" }
              as: DataEngineer
              as_user_id: "de-1"
              captures: { cha: "$.data.id" }
            - call: "POST /mmm/media-channels"
              payload: { market_id: "${mkt}", channel_code: "B_SOCIAL", channel_type: "SOCIAL", adstock_decay_rate: 0.25, adstock_max_lag_periods: 1, saturation_half_point_cents: 150000, response_ceiling_units: 800, min_spend_cents: 100000, max_spend_cents: 3000000, status: "ACTIVE" }
              as: DataEngineer
              as_user_id: "de-1"
              captures: { chb: "$.data.id" }
            - call: "POST /mmm/experiments"
              payload: { market_id: "${mkt}", channel_id: "${cha}", design_type: "AUDIENCE_SPLIT", readout_method: "DIFF_IN_DIFF", start_date: "2026-09-07T00:00:00Z", end_date: "2026-10-05T00:00:00Z", washout_days: 7, minimum_detectable_effect_pct: 5.0, baseline_conversion_rate: 0.0200, planned_treatment_population: 245000, planned_control_population: 245000 }
              as: ExperimentDesigner
              as_user_id: "ed-1"
              captures: { e1: "$.data.id" }
            - call: "POST /mmm/experiments/${e1}/lock-design"
              as: ExperimentDesigner
              as_user_id: "ed-1"
            - call: "POST /mmm/experiments"
              payload: { market_id: "${mkt}", channel_id: "${cha}", design_type: "AUDIENCE_SPLIT", readout_method: "DIFF_IN_DIFF", start_date: "2026-10-11T00:00:00Z", end_date: "2026-11-08T00:00:00Z", washout_days: 7, minimum_detectable_effect_pct: 5.0, baseline_conversion_rate: 0.0200, planned_treatment_population: 245000, planned_control_population: 245000 }
              as: ExperimentDesigner
              as_user_id: "ed-1"
              captures: { e2: "$.data.id" }
            - call: "POST /mmm/experiments"
              payload: { market_id: "${mkt}", channel_id: "${cha}", design_type: "AUDIENCE_SPLIT", readout_method: "DIFF_IN_DIFF", start_date: "2026-10-12T00:00:00Z", end_date: "2026-11-09T00:00:00Z", washout_days: 7, minimum_detectable_effect_pct: 5.0, baseline_conversion_rate: 0.0200, planned_treatment_population: 245000, planned_control_population: 245000 }
              as: ExperimentDesigner
              as_user_id: "ed-1"
              captures: { e3: "$.data.id" }
            - call: "POST /mmm/experiments"
              payload: { market_id: "${mkt}", channel_id: "${chb}", design_type: "AUDIENCE_SPLIT", readout_method: "DIFF_IN_DIFF", start_date: "2026-10-11T00:00:00Z", end_date: "2026-11-08T00:00:00Z", washout_days: 7, minimum_detectable_effect_pct: 5.0, baseline_conversion_rate: 0.0200, planned_treatment_population: 245000, planned_control_population: 245000 }
              as: ExperimentDesigner
              as_user_id: "ed-1"
              captures: { e4: "$.data.id" }
            - call: "POST /mmm/experiments"
              payload: { market_id: "${mkt}", channel_id: "${cha}", design_type: "AUDIENCE_SPLIT", readout_method: "DIFF_IN_DIFF", start_date: "2026-08-10T00:00:00Z", end_date: "2026-09-07T00:00:00Z", washout_days: 30, minimum_detectable_effect_pct: 5.0, baseline_conversion_rate: 0.0200, planned_treatment_population: 245000, planned_control_population: 245000 }
              as: ExperimentDesigner
              as_user_id: "ed-1"
              captures: { e5: "$.data.id" }
          trigger:
            - call: "POST /mmm/experiments/${e2}/lock-design"
              as: ExperimentDesigner
              as_user_id: "ed-1"
            - call: "POST /mmm/experiments/${e3}/lock-design"
              as: ExperimentDesigner
              as_user_id: "ed-1"
            - call: "POST /mmm/experiments/${e4}/lock-design"
              as: ExperimentDesigner
              as_user_id: "ed-1"
            - call: "POST /mmm/experiments/${e5}/lock-design"
              as: ExperimentDesigner
              as_user_id: "ed-1"
          assert:
            - "Call 1 (lock E2) returns 409 with error_id ERR_EXPERIMENT_WINDOW_CONFLICT: the incumbent E1 occupies [2026-09-07, 2026-10-12) - its own [start_date, end_date) extended by washout_days 7 - and the candidate start 2026-10-11 falls strictly inside it."
            - "Call 2 (lock E3) returns 200 with status == DESIGN_LOCKED: candidate.start_date == incumbent.end_date + incumbent.washout_days exactly, and touching is explicitly allowed - one day earlier is the rejection in call 1, so the boundary is proven from both sides."
            - "Call 3 (lock E4) returns 200 with status == DESIGN_LOCKED: the conflict key is (market_id, channel_id), so the interval rejected on A_SEARCH in call 1 is free on B_SOCIAL."
            - "Call 4 (lock E5) returns 200 with status == DESIGN_LOCKED: the candidate occupies the HALF-OPEN [2026-08-10, 2026-09-07) with NO buffer of its own, so it merely touches the incumbent's start. An implementation that appended the candidate's own washout_days 30 to its tail would compute [2026-08-10, 2026-10-07), find that it overlaps the incumbent, and wrongly return 409."
            - "E5 is also not blocked by E3 (locked in call 2, occupying [2026-10-12, 2026-11-16)) because the two intervals are months apart, so call 4's success is attributable to the asymmetry and not to an empty incumbent set."
            - "GET /mmm/experiments/${e2} still shows status == DRAFT after all four calls, and its continued existence never blocked calls 2 or 4 - a DRAFT design reserves no interval."
            - "GET /mmm/experiments?channel_id=${cha}&status=DESIGN_LOCKED returns total_count 3 (E1, E3, E5), and GET /mmm/experiments?channel_id=${chb}&status=DESIGN_LOCKED returns total_count 1 (E4)."
      - name: data_window_closed_interval_touching_conflict_scoped_by_granularity
        grounds:
          - "validations priority 66 (business_temporal) - no other DataWindow of the same market with the SAME granularity overlaps; for conflict detection only, a window occupies the CLOSED interval [window_start_date, window_end_date] with NO buffer, else ERR_DATA_WINDOW_OVERLAP (409)"
          - "validations priority 68 (business_temporal) - period_start_date must lie inside the HALF-OPEN range [window_start_date, window_end_date), the deliberate contrast with priority 66"
          - "entities DataWindow.granularity (part of the conflict key) and DataWindow.expected_period_count (computed from the range and the granularity)"
          - "endpoints POST /mmm/data-windows (201, DataEngineer)"
        distinguishing_aspect: |
          The contested resource is a DataWindow slot on (market_id, granularity) and the interval
          semantics are the opposite of the experiment rule: the interval is CLOSED with no buffer, so
          a window starting exactly on the incumbent's exclusive end date IS a conflict, while a window
          covering the incumbent's range completely is admitted as long as its granularity differs - an
          implementation that reuses one half-open overlap helper for both rules accepts the touching
          window and rejects the DAILY twin.
          
        test_recipe:
          setup:
            - "Market US_CORE, no other data."
            - "One WEEKLY DataWindow W1 [2026-08-03, 2026-08-31) already created and left OPEN, with expected_period_count 4. For conflict detection it occupies the CLOSED interval [2026-08-03, 2026-08-31]."
            - "The three trigger calls probe, in order: a WEEKLY window whose start lands exactly on W1's exclusive end date, a WEEKLY window starting one day later, and a DAILY window with byte-identical dates to W1."
          setup_api_calls:
            - call: "POST /mmm/markets"
              payload: { market_code: "US_CORE", name: "US Core Brand Market", total_population: 10000000, annual_budget_ceiling_cents: 5000000000, currency_code: "USD" }
              as: DataEngineer
              as_user_id: "de-1"
              captures: { mkt: "$.data.id" }
            - call: "POST /mmm/data-windows"
              payload: { market_id: "${mkt}", window_start_date: "2026-08-03T00:00:00Z", window_end_date: "2026-08-31T00:00:00Z", granularity: "WEEKLY" }
              as: DataEngineer
              as_user_id: "de-1"
              captures: { w1: "$.data.id" }
          trigger:
            - call: "POST /mmm/data-windows"
              payload: { market_id: "${mkt}", window_start_date: "2026-08-31T00:00:00Z", window_end_date: "2026-09-28T00:00:00Z", granularity: "WEEKLY" }
              as: DataEngineer
              as_user_id: "de-1"
            - call: "POST /mmm/data-windows"
              payload: { market_id: "${mkt}", window_start_date: "2026-09-01T00:00:00Z", window_end_date: "2026-09-29T00:00:00Z", granularity: "WEEKLY" }
              as: DataEngineer
              as_user_id: "de-1"
              captures: { w3: "$.data.id" }
            - call: "POST /mmm/data-windows"
              payload: { market_id: "${mkt}", window_start_date: "2026-08-03T00:00:00Z", window_end_date: "2026-08-31T00:00:00Z", granularity: "DAILY" }
              as: DataEngineer
              as_user_id: "de-1"
              captures: { w4: "$.data.id" }
          assert:
            - "Call 1 returns 409 with error_id ERR_DATA_WINDOW_OVERLAP: W1 occupies the CLOSED interval [2026-08-03, 2026-08-31] for conflict purposes, and the candidate start 2026-08-31 lands exactly on that occupied endpoint. A half-open reading of the incumbent would have admitted this window."
            - "Call 2 returns 201 with status == OPEN, granularity == WEEKLY and expected_period_count == 4 - 2026-09-01 is the first legal WEEKLY start after W1, exactly one day past the rejection in call 1."
            - "Call 3 returns 201 with status == OPEN, granularity == DAILY and expected_period_count == 28, even though its window_start_date and window_end_date are identical to W1's - granularity is part of the conflict key, not a tie-break, so two windows of the same market may overlap completely when they measure at different grains."
            - "All three new-window candidates start with sales_period_count == 0, spend_observation_count == 0, lag_completeness_pct == 0 and reopen_count == 0."
            - "GET /mmm/data-windows?market_id=${mkt} returns total_count 3 (W1, the WEEKLY window from call 2, the DAILY window from call 3) - the window rejected in call 1 was never persisted."
            - "The two semantics genuinely differ on the same date: a window starting 2026-08-31 collides with W1 under priority 66 (CLOSED), yet a SalesObservation with period_start_date 2026-08-31 inside W1 is rejected as out of range under priority 68 (HALF-OPEN), so a single shared interval helper cannot satisfy both rules."
  - rule_id: compensating_invariant
    note: >-
      Two DIFFERENT conserved quantities: budget cents on a BudgetScenario (broken by optimize, restored by revert-optimization) and held-out population on a Market (broken by assign-cells, restored only by release-cells FOLLOWED BY a clock-gated washout sweep).
    instances:
      - name: budget_cent_conservation_restored_by_revert_optimization
        grounds:
          - "declared invariant budget_cent_conservation - allocated_total_cents + reallocation_fee_cents + unallocated_cents == total_budget_cents at EVERY observable moment; breaker POST /mmm/budget-scenarios/{id}/optimize, compensator POST /mmm/budget-scenarios/{id}/revert-optimization"
          - "state_machines BudgetScenario DRAFT -> OPTIMIZED and OPTIMIZED -> DRAFT, whose side-effect list spells out the full reversal with no residual drift"
          - "calculations.budget_optimization - two-pass greedy with the fee PINNED at its pass-1 value"
          - "endpoints POST /mmm/budget-scenarios/{id}/optimize and POST /mmm/budget-scenarios/{id}/revert-optimization (both 200, BrandPlanner)"
        distinguishing_aspect: |
          The conserved quantity is integer budget cents, and the compensation must be exact rather than
          approximate: revert-optimization has to wind back nine computed fields across the scenario and
          both allocation rows so that a second optimize reproduces the first one field for field, which
          fails for any implementation that reverts only allocated_cents, leaves the reallocation fee or
          unallocated remainder behind, or recomputes the fee from pass-2 churn on the way back.
          
        test_recipe:
          setup:
            - "Fixture F1 taken to publication: an EFFECT_PERIOD ModelRun over A_SEARCH and B_SOCIAL on W1 [2026-08-03, 2026-08-31) WEEKLY, fitted, validated (holdout_mape_pct 11.53) and published, so unit_price_cents == 5026 and Market.data_posture == OPEN."
            - "A DRAFT BudgetScenario: total_budget_cents 4000000, planning window [2026-11-02, 2026-11-30) which is 4 WEEKLY periods, reallocation_fee_pct 0.50."
            - "Two allocation rows: A_SEARCH baseline_spend_cents 1500000 (channel floor 200000, ceiling 3000000, half_point 200000, response_ceiling_units 1200) and B_SOCIAL baseline_spend_cents 2500000 (floor 100000, ceiling 3000000, half_point 150000, response_ceiling_units 800). Their sum is exactly 4000000."
            - "Channel floors sum to 300000, well under the budget, so ERR_FLOORS_EXCEED_BUDGET is not in play and the greedy waterfall runs to completion in both passes."
            - "Pass 1 over 4000000 lands on A 2400000 / B 1600000 with churn abs(2400000 - 1500000) + abs(1600000 - 2500000) == 1800000, priced at round(1800000 * 0.50 / 100, 0) == 9000; pass 2 then re-runs the same greedy over 4000000 - 9000 == 3991000."
          setup_api_calls:
            - call: "POST /mmm/markets"
              payload: { market_code: "US_CORE", name: "US Core Brand Market", total_population: 10000000, annual_budget_ceiling_cents: 5000000000, currency_code: "USD" }
              as: DataEngineer
              as_user_id: "de-1"
              captures: { mkt: "$.data.id" }
            - call: "POST /mmm/media-channels"
              payload: { market_id: "${mkt}", channel_code: "A_SEARCH", channel_type: "SEARCH", adstock_decay_rate: 0.50, adstock_max_lag_periods: 2, saturation_half_point_cents: 200000, response_ceiling_units: 1200, min_spend_cents: 200000, max_spend_cents: 3000000, status: "ACTIVE" }
              as: DataEngineer
              as_user_id: "de-1"
              captures: { cha: "$.data.id" }
            - call: "POST /mmm/media-channels"
              payload: { market_id: "${mkt}", channel_code: "B_SOCIAL", channel_type: "SOCIAL", adstock_decay_rate: 0.25, adstock_max_lag_periods: 1, saturation_half_point_cents: 150000, response_ceiling_units: 800, min_spend_cents: 100000, max_spend_cents: 3000000, status: "ACTIVE" }
              as: DataEngineer
              as_user_id: "de-1"
              captures: { chb: "$.data.id" }
            - call: "POST /mmm/data-windows"
              payload: { market_id: "${mkt}", window_start_date: "2026-08-03T00:00:00Z", window_end_date: "2026-08-31T00:00:00Z", granularity: "WEEKLY" }
              as: DataEngineer
              as_user_id: "de-1"
              captures: { w1: "$.data.id" }
            - call: "POST /mmm/sales-observations"
              payload: { data_window_id: "${w1}", period_start_date: "2026-08-03T00:00:00Z", units_sold: 5000, revenue_cents: 25000000, distribution_pct: 82.00, macro_index: 100.0000 }
              as: DataEngineer
              as_user_id: "de-1"
            - call: "POST /mmm/sales-observations"
              payload: { data_window_id: "${w1}", period_start_date: "2026-08-10T00:00:00Z", units_sold: 6000, revenue_cents: 30600000, distribution_pct: 82.00, macro_index: 100.0000 }
              as: DataEngineer
