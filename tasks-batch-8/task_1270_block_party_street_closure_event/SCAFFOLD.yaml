# =============================================================================
# Task 1270 — Block Party & Street Closure Event Coordination
# City block party permit program: petitions, permits, traffic/sound/insurance
# review lanes, equipment quota, shared-cost pool, deposit, cleanup & return.
# =============================================================================

scenario: |
  1270. Block Party & Street Closure Event Coordination (city block party
  permit program): neighbor petition & signature threshold, permit application
  & jurisdiction lead time, barricade/traffic control equipment & placement
  plan, emergency vehicle access lane requirement, noise/amplified sound &
  end-time limits, insurance requirement & waiver, food/alcohol rules &
  shared-cost collection, cleanup & post-event equipment return

domain_name: block-party-street-closure
api_prefix: ""

complexity_profile:
  primary_archetype: workflow_orchestration
  secondary_archetype: quota_allocation
  complexity_layers:
    - optimistic_concurrency
    - cascading_side_effects
    - derived_field_reconciliation
    - selector_policy
  entity_topology: flat
  state_machine_shape: cyclic
  relationship_patterns: [one_to_many, cross_aggregate]
  role_model: segregation_of_duties
  consistency_model: immediate

# =============================================================================
# 1.1 Entity-Relationship Table
# =============================================================================
entities:
  - name: Organizer
    parent: null
    common_fields: true
    fields:
      - { name: full_name, type: string, source: input, description: "Organizer full name" }
      - { name: email, type: string, source: input, description: "Contact email" }
      - { name: phone, type: string, source: input, description: "Contact phone" }
      - { name: address, type: string, source: input, description: "Residential address on or near the block" }
      - { name: standing, type: enum, source: system, default: GOOD, description: "GOOD | FLAGGED | SUSPENDED — demoted by deposit forfeitures", constraints: "GOOD->FLAGGED on 1st forfeiture, ->SUSPENDED on 2nd" }
      - { name: forfeiture_count, type: integer, source: system, default: 0, description: "Lifetime deposit forfeitures driving standing demotion" }

  - name: StreetSegment
    parent: null
    common_fields: true
    fields:
      - { name: name, type: string, source: input, description: "Segment label, e.g. 'Maple Ave 100-block'" }
      - { name: jurisdiction, type: enum, source: input, description: "CITY | COUNTY | STATE_ROUTE — drives permit lead time" }
      - { name: segment_kind, type: enum, source: input, description: "RESIDENTIAL | MIXED_USE — drives petition threshold formula and support mode" }
      - { name: household_count, type: integer, source: input, description: "Households fronting the segment", constraints: ">= 0" }
      - { name: business_count, type: integer, source: input, default: 0, description: "Business frontages on the segment", constraints: ">= 0" }
      - { name: intersects_arterial, type: boolean, source: input, default: false, description: "Whether the closure touches an arterial intersection (adds barricade minimum)" }
      - { name: length_m, type: integer, source: input, description: "Segment length in meters", constraints: "> 0" }

  - name: Petition
    parent: null
    common_fields: true
    fields:
      - { name: segment_id, type: string, source: input, description: "FK -> StreetSegment.id; block the petition covers" }
      - { name: organizer_id, type: string, source: system, description: "FK -> Organizer.id; set from X-User-ID of the creating Organizer" }
      - { name: required_signatures, type: integer, source: computed, description: "Threshold per calculations.petition_required_signatures" }
      - { name: support_mode, type: enum, source: computed, description: "SIGNATURE_COUNT | DISTINCT_HOUSEHOLD — pinned by segment_kind (MIXED_USE -> SIGNATURE_COUNT, RESIDENTIAL -> DISTINCT_HOUSEHOLD)" }
      - { name: valid_signature_count, type: integer, source: computed, default: 0, description: "Count of PetitionSignature rows with status ACTIVE" }
      - { name: distinct_household_count, type: integer, source: computed, default: 0, description: "Count of distinct household_address values among ACTIVE signatures" }
      - { name: status, type: enum, source: system, description: "COLLECTING | SUBMITTED | VERIFIED | DEFICIENT | LOCKED" }
      - { name: deficiency_note, type: string, source: system, description: "Reason recorded when marked DEFICIENT", constraints: "null until first deficiency" }
      - { name: cure_round, type: integer, source: system, default: 0, description: "Number of DEFICIENT->COLLECTING cure cycles" }

  - name: PetitionSignature
    parent: Petition
    common_fields: true
    fields:
      - { name: petition_id, type: string, source: system, description: "FK -> Petition.id; parent petition from path" }
      - { name: household_address, type: string, source: input, description: "Street address of the signing household/business" }
      - { name: signer_name, type: string, source: input, description: "Signer full name" }
      - { name: signer_email, type: string, source: input, description: "Signer email; (household_address, signer_email) must be unique among ACTIVE signatures on the petition" }
      - { name: is_business, type: boolean, source: input, default: false, description: "True when the signer represents a business frontage" }
      - { name: status, type: enum, source: system, description: "ACTIVE | WITHDRAWN" }
      - { name: withdrawn_at, type: datetime, source: system, description: "Set on withdrawal", constraints: "null while ACTIVE" }

  - name: PermitApplication
    parent: null
    common_fields: true
    fields:
      - { name: organizer_id, type: string, source: system, description: "FK -> Organizer.id; set from X-User-ID of the creating Organizer" }
      - { name: petition_id, type: string, source: input, description: "FK -> Petition.id; backing petition" }
      - { name: segment_id, type: string, source: computed, description: "Derived from Petition.segment_id at creation; denormalized for window-conflict checks" }
      - { name: event_start_at, type: datetime, source: input, description: "Closure start (ISO 8601 UTC)" }
      - { name: event_end_at, type: datetime, source: input, description: "Closure end (ISO 8601 UTC); may cross midnight; duration must be > 0 and <= 12h" }
      - { name: expected_attendance, type: integer, source: input, description: "Expected attendees", constraints: "> 0" }
      - { name: amplified_sound, type: boolean, source: input, default: false, description: "Whether amplified sound will be used" }
      - { name: alcohol_served, type: boolean, source: input, default: false, description: "Whether alcohol will be served (blocks insurance waiver, raises fee/deposit)" }
      - { name: food_vendors, type: boolean, source: input, default: false, description: "Whether outside food vendors operate (recorded; no extra gate)" }
      - { name: status, type: enum, source: system, description: "DRAFT | UNDER_REVIEW | SUSPENDED | APPROVED | DENIED | ISSUED | COMPLETED | CANCELLED | REVOKED | EXPIRED" }
      - { name: provisional_fee_cents, type: integer, source: computed, description: "Fee estimate frozen at submit per calculations.permit_fee_provisional", constraints: "null until submit" }
      - { name: final_fee_cents, type: integer, source: computed, description: "Fee finalized at issuance per calculations.permit_fee_final", constraints: "null until issue" }
      - { name: equipment_total_cents, type: integer, source: computed, description: "Sum of reservation invoice_cents at issuance", constraints: "null until issue" }
      - { name: decision_reason, type: string, source: system, description: "Reason recorded on deny / revoke / cancel", constraints: "null otherwise" }

  - name: TrafficControlPlan
    parent: PermitApplication
    common_fields: true
    fields:
      - { name: application_id, type: string, source: system, description: "FK -> PermitApplication.id; parent application from path" }
      - { name: barricade_count, type: integer, source: input, description: "Planned barricades", constraints: ">= 0" }
      - { name: cone_count, type: integer, source: input, description: "Planned cones", constraints: ">= 0" }
      - { name: sign_count, type: integer, source: input, description: "Planned signs", constraints: ">= 0" }
      - { name: emergency_lane_width_m, type: number, source: input, description: "Continuous emergency vehicle lane width; must be >= 6.0" }
      - { name: emergency_lane_continuous, type: boolean, source: input, description: "True iff the lane is unobstructed end-to-end for the full closure" }
      - { name: placement_notes, type: string, source: input, description: "Free-text placement plan" }
      - { name: status, type: enum, source: system, description: "DRAFT | SUBMITTED | TCP_APPROVED | CHANGES_REQUESTED | LOCKED" }
      - { name: reviewed_by, type: string, source: system, description: "X-User-ID of the TrafficReviewer who last reviewed", constraints: "null until reviewed" }
      - { name: review_note, type: string, source: system, description: "Reviewer note", constraints: "null until reviewed" }
      - { name: locked_at_version, type: integer, source: system, description: "TCP version pinned when the plan locks at permit issuance", constraints: "null until LOCKED" }

  - name: SoundPlan
    parent: PermitApplication
    common_fields: true
    fields:
      - { name: application_id, type: string, source: system, description: "FK -> PermitApplication.id; parent application from path" }
      - { name: speaker_count, type: integer, source: input, description: "Amplified speakers", constraints: "> 0" }
      - { name: max_db_at_property_line, type: integer, source: input, description: "Declared max dB at nearest property line; cap 70", constraints: "> 0" }
      - { name: planned_sound_end, type: string, source: input, description: "HH:MM local 24h time amplified sound ends; cutoff 22:00 Fri/Sat else 21:00 (day of event_start_at)" }
      - { name: status, type: enum, source: system, description: "DRAFT | SUBMITTED | SOUND_APPROVED | CHANGES_REQUESTED | LOCKED" }
      - { name: reviewed_by, type: string, source: system, description: "X-User-ID of the SafetyReviewer who last reviewed", constraints: "null until reviewed" }
      - { name: review_note, type: string, source: system, description: "Reviewer note", constraints: "null until reviewed" }
      - { name: locked_at_version, type: integer, source: system, description: "SoundPlan version pinned at issuance", constraints: "null until LOCKED" }

  - name: InsuranceCertificate
    parent: PermitApplication
    common_fields: true
    fields:
      - { name: application_id, type: string, source: system, description: "FK -> PermitApplication.id; parent application from path" }
      - { name: kind, type: enum, source: input, description: "CERTIFICATE | WAIVER_REQUEST" }
      - { name: insurer_name, type: string, source: input, description: "Insurer name; required when kind=CERTIFICATE", constraints: "required for CERTIFICATE" }
      - { name: policy_number, type: string, source: input, description: "Policy number; required when kind=CERTIFICATE", constraints: "required for CERTIFICATE" }
      - { name: coverage_amount_cents, type: integer, source: input, description: "Liability coverage; must be >= 100000000 ($1M) to verify", constraints: "required for CERTIFICATE" }
      - { name: expires_on, type: string, source: input, description: "Policy expiry date YYYY-MM-DD; must be >= event date", constraints: "required for CERTIFICATE" }
      - { name: status, type: enum, source: system, description: "SUBMITTED | VERIFIED | REJECTED | WAIVER_GRANTED | WAIVER_DENIED | SUPERSEDED" }
      - { name: reviewed_by, type: string, source: system, description: "X-User-ID of the SafetyReviewer who reviewed", constraints: "null until reviewed" }
      - { name: review_note, type: string, source: system, description: "Reviewer note", constraints: "null until reviewed" }
      - { name: superseded_by_id, type: string, source: system, description: "Id of the newer InsuranceCertificate that superseded this one", constraints: "null unless SUPERSEDED" }

  - name: EquipmentStock
    parent: null
    common_fields: true
    fields:
      - { name: depot_name, type: string, source: input, description: "Public works depot label" }
      - { name: equipment_kind, type: enum, source: input, description: "BARRICADE | CONE | SIGN" }
      - { name: total_units, type: integer, source: input, description: "Total physical units at the depot", constraints: "> 0" }
      - { name: reserved_units, type: integer, source: computed, default: 0, description: "Sum of units over reservations in {HELD, CONFIRMED} whose buffered window contains current_utc" }
      - { name: out_units, type: integer, source: computed, default: 0, description: "Sum of (units - returned_units) over reservations in DISPATCHED" }
      - { name: available_units, type: integer, source: computed, default: 0, description: "= total_units - reserved_units - out_units; invariant: total == available + reserved + out at all times" }

  - name: EquipmentReservation
    parent: PermitApplication
    common_fields: true
    fields:
      - { name: application_id, type: string, source: system, description: "FK -> PermitApplication.id; parent application from path" }
      - { name: stock_id, type: string, source: system, description: "FK -> EquipmentStock.id; chosen by calculations.equipment_stock_selector" }
      - { name: equipment_kind, type: enum, source: input, description: "BARRICADE | CONE | SIGN" }
      - { name: units, type: integer, source: input, description: "Units requested", constraints: "> 0" }
      - { name: reservation_status, type: enum, source: system, description: "HELD | CONFIRMED | DISPATCHED | RETURNED | CLOSED | CANCELLED | RECALLED" }
      - { name: billing_status, type: enum, source: system, description: "UNBILLED | INVOICED | PAID | WAIVED — parallel dimension, independent of reservation_status" }
      - { name: invoice_cents, type: integer, source: computed, description: "Per-line pretax + per-line tax at CONFIRMED per calculations.equipment_rental_totals", constraints: "null until CONFIRMED" }
      - { name: dispatched_by, type: string, source: system, description: "X-User-ID of dispatching DepotOfficer", constraints: "null until DISPATCHED" }
      - { name: dispatched_at, type: datetime, source: system, description: "Dispatch timestamp", constraints: "null until DISPATCHED" }
      - { name: return_due_at, type: datetime, source: system, description: "= event_end_at + 48h, set at dispatch", constraints: "null until DISPATCHED" }
      - { name: returned_at, type: datetime, source: system, description: "Return timestamp", constraints: "null until RETURNED" }
      - { name: returned_units, type: integer, source: system, description: "Units physically returned", constraints: "null until RETURNED" }
      - { name: late_days, type: integer, source: computed, description: "0 if returned_at <= return_due_at else ceil(hours_late / 24)", constraints: "null until RETURNED" }
      - { name: return_verified_by, type: string, source: system, description: "X-User-ID of verifying DepotOfficer; must differ from dispatched_by", constraints: "null until CLOSED" }

  - name: CostSharePool
    parent: PermitApplication
    common_fields: true
    fields:
      - { name: application_id, type: string, source: system, description: "FK -> PermitApplication.id; parent application from path" }
      - { name: target_cents, type: integer, source: input, description: "Shared-cost collection target", constraints: "> 0" }
      - { name: collected_cents, type: integer, source: computed, default: 0, description: "Sum of amount_cents over contributions with status PAID" }
      - { name: refunded_cents, type: integer, source: computed, default: 0, description: "Sum of amount_cents over contributions with status REFUNDED" }
      - { name: status, type: enum, source: system, description: "OPEN | FUNDED | CLOSED | REFUNDING | REFUNDED" }

  - name: Contribution
    parent: CostSharePool
    common_fields: true
    fields:
      - { name: pool_id, type: string, source: system, description: "FK -> CostSharePool.id; parent pool from path" }
      - { name: household_address, type: string, source: input, description: "Contributing household" }
      - { name: amount_cents, type: integer, source: input, description: "Contribution amount", constraints: ">= 100" }
      - { name: status, type: enum, source: system, description: "PAID | REFUNDED" }
      - { name: refunded_at, type: datetime, source: system, description: "Set when refunded", constraints: "null while PAID" }

  - name: Deposit
    parent: PermitApplication
    common_fields: true
    fields:
      - { name: application_id, type: string, source: system, description: "FK -> PermitApplication.id; parent application from path" }
      - { name: required_cents, type: integer, source: computed, description: "Per calculations.deposit_required at creation" }
      - { name: held_cents, type: integer, source: system, description: "Amount actually held (equals required_cents at creation; payment simulated)" }
      - { name: charges_cents, type: integer, source: computed, default: 0, description: "Sum of amount_cents over its ChargeEntry rows" }
      - { name: refund_cents, type: integer, source: computed, description: "= max(0, held_cents - charges_cents) at settlement", constraints: "null until SETTLED/FORFEITED" }
      - { name: status, type: enum, source: system, description: "HELD | SETTLED | FORFEITED" }

  - name: ChargeEntry
    parent: Deposit
    common_fields: false
    fields:
      - { name: deposit_id, type: string, source: system, description: "FK -> Deposit.id; parent deposit" }
      - { name: kind, type: enum, source: system, description: "LATE_EQUIPMENT | SHORTAGE | CLEANING" }
      - { name: amount_cents, type: integer, source: system, description: "Charge amount", constraints: "> 0" }
      - { name: note, type: string, source: system, description: "Charge explanation" }
      - { name: source_reservation_id, type: string, source: system, description: "EquipmentReservation that caused the charge (LATE_EQUIPMENT/SHORTAGE)", constraints: "null for CLEANING" }

  - name: PostEventReport
    parent: PermitApplication
    common_fields: true
    fields:
      - { name: application_id, type: string, source: system, description: "FK -> PermitApplication.id; parent application from path" }
      - { name: cleanup_completed, type: boolean, source: input, description: "Organizer attestation that cleanup finished" }
      - { name: cleanup_notes, type: string, source: input, description: "Cleanup details" }
      - { name: submitted_at, type: datetime, source: system, description: "Submission timestamp (must be within 72h after event_end_at)" }
      - { name: inspection_result, type: enum, source: system, description: "PENDING | PASSED | FAILED" }
      - { name: inspected_by, type: string, source: system, description: "X-User-ID of inspecting PermitOfficer", constraints: "null until inspected" }
      - { name: cleaning_charge_cents, type: integer, source: system, default: 0, description: "Cleaning charge posted to the deposit when inspection FAILED" }

# =============================================================================
# 1.2 State Machine Table
# =============================================================================
state_machines:
  - entity: Petition
    initial_state: COLLECTING
    terminal_states: [LOCKED]
    transitions:
      - from: COLLECTING
        to: SUBMITTED
        trigger: "POST /petitions/{id}/submit"
        actor: Organizer
        preconditions:
          - "Petition status == COLLECTING (else ERR_INVALID_STATE)"
          - "Support metric per support_mode >= required_signatures (else ERR_SIGNATURE_THRESHOLD_NOT_MET): DISTINCT_HOUSEHOLD -> distinct_household_count; SIGNATURE_COUNT -> valid_signature_count"
        side_effects:
          - "status := SUBMITTED"
      - from: SUBMITTED
        to: VERIFIED
        trigger: "POST /petitions/{id}/verify with decision=APPROVE"
        actor: PermitOfficer
        preconditions:
          - "Support metric re-checked at verify time >= required_signatures (else ERR_SIGNATURE_THRESHOLD_NOT_MET)"
        side_effects:
          - "status := VERIFIED"
          - "Every PermitApplication with petition_id == this petition and status == SUSPENDED transitions SUSPENDED -> UNDER_REVIEW"
      - from: SUBMITTED
        to: DEFICIENT
        trigger: "POST /petitions/{id}/verify with decision=DEFICIENT"
        actor: PermitOfficer
        preconditions: []
        side_effects:
          - "status := DEFICIENT; deficiency_note := note"
      - from: VERIFIED
        to: DEFICIENT
        trigger: "system (automatic when a signature withdrawal drops the support metric below required_signatures)"
        actor: system
        preconditions: []
        side_effects:
          - "status := DEFICIENT; deficiency_note := 'signature withdrawal below threshold'"
          - "Cascade hop: every PermitApplication with petition_id == this petition and status IN {UNDER_REVIEW, APPROVED} transitions to SUSPENDED (reason 'petition deficient')"
      - from: DEFICIENT
        to: COLLECTING
        trigger: "POST /petitions/{id}/cure"
        actor: Organizer
        preconditions:
          - "Petition status == DEFICIENT (else ERR_INVALID_STATE)"
        side_effects:
          - "status := COLLECTING; cure_round += 1"
      - from: VERIFIED
        to: LOCKED
        trigger: "system (automatic when any PermitApplication referencing this petition is ISSUED)"
        actor: system
        preconditions: []
        side_effects:
          - "status := LOCKED; signature create/withdraw on a LOCKED petition rejected with ERR_PETITION_LOCKED"

  - entity: PetitionSignature
    initial_state: ACTIVE
    terminal_states: [WITHDRAWN]
    transitions:
      - from: ACTIVE
        to: WITHDRAWN
        trigger: "POST /petitions/{id}/signatures/{signatureId}/withdraw"
        actor: Neighbor
        preconditions:
          - "Signature status == ACTIVE (else ERR_INVALID_STATE)"
          - "Petition status IN {COLLECTING, SUBMITTED, VERIFIED} (else ERR_PETITION_LOCKED when LOCKED)"
        side_effects:
          - "status := WITHDRAWN; withdrawn_at := current_utc"
          - "Recompute petition.valid_signature_count and petition.distinct_household_count"
          - "If petition.status == VERIFIED and support metric now < required_signatures: petition VERIFIED -> DEFICIENT, which cascades linked applications UNDER_REVIEW/APPROVED -> SUSPENDED"

  - entity: PermitApplication
    initial_state: DRAFT
    terminal_states: [DENIED, COMPLETED, CANCELLED, REVOKED, EXPIRED]
    transitions:
      - from: DRAFT
        to: UNDER_REVIEW
        trigger: "POST /permit-applications/{id}/submit"
        actor: Organizer
        preconditions:
          - "Petition (petition_id) status == VERIFIED (else ERR_PETITION_NOT_VERIFIED)"
          - "Lead time: event_start_at >= current_utc + LEAD_DAYS[segment.jurisdiction] * 24h, equality passes (else ERR_LEAD_TIME_INSUFFICIENT)"
          - "No segment window conflict per calculations.segment_window_conflict (else ERR_SEGMENT_WINDOW_CONFLICT)"
        side_effects:
          - "status := UNDER_REVIEW"
          - "provisional_fee_cents := calculations.permit_fee_provisional (frozen)"
      - from: UNDER_REVIEW
        to: APPROVED
        trigger: "POST /permit-applications/{id}/approve"
        actor: PermitOfficer
        preconditions:
          - "Petition status == VERIFIED (else ERR_PETITION_NOT_VERIFIED)"
          - "TrafficControlPlan exists and status == TCP_APPROVED (else ERR_TCP_NOT_APPROVED)"
          - "If amplified_sound: SoundPlan exists and status == SOUND_APPROVED (else ERR_SOUND_PLAN_NOT_APPROVED)"
          - "Insurance satisfied: a non-SUPERSEDED InsuranceCertificate with status IN {VERIFIED, WAIVER_GRANTED} exists (else ERR_INSURANCE_NOT_SATISFIED)"
          - "Equipment coverage: for each kind in {BARRICADE, CONE, SIGN}, sum of units over this application's reservations with reservation_status IN {HELD, CONFIRMED} >= TCP planned count for that kind (else ERR_EQUIPMENT_NOT_RESERVED)"
          - "Deposit exists and status == HELD (else ERR_DEPOSIT_REQUIRED)"
        side_effects:
          - "status := APPROVED"
      - from: UNDER_REVIEW
        to: DENIED
        trigger: "POST /permit-applications/{id}/deny"
        actor: PermitOfficer
        preconditions: []
        side_effects:
          - "status := DENIED; decision_reason := reason"
          - "HELD EquipmentReservations of this application -> CANCELLED (stock reservation released)"
          - "Deposit (if HELD) auto-settles -> SETTLED with refund_cents = held_cents - charges_cents"
          - "CostSharePool (if OPEN/FUNDED) -> REFUNDING, then each PAID Contribution -> REFUNDED, then pool -> REFUNDED"
      - from: UNDER_REVIEW
        to: SUSPENDED
        trigger: "system (petition became DEFICIENT)"
        actor: system
        preconditions: []
        side_effects: ["status := SUSPENDED; decision_reason := 'petition deficient'"]
      - from: APPROVED
        to: SUSPENDED
        trigger: "system (petition became DEFICIENT)"
        actor: system
        preconditions: []
        side_effects: ["status := SUSPENDED; decision_reason := 'petition deficient'"]
      - from: SUSPENDED
        to: UNDER_REVIEW
        trigger: "system (petition re-VERIFIED; applications suspended from APPROVED also return to UNDER_REVIEW and must be re-approved)"
        actor: system
        preconditions: []
        side_effects: ["status := UNDER_REVIEW"]
      - from: APPROVED
        to: ISSUED
        trigger: "POST /permit-applications/{id}/issue"
        actor: PermitOfficer
        preconditions:
          - "Petition status == VERIFIED (else ERR_PETITION_NOT_VERIFIED)"
          - "Segment window conflict re-check per calculations.segment_window_conflict (else ERR_SEGMENT_WINDOW_CONFLICT)"
        side_effects:
          - "status := ISSUED"
          - "Petition -> LOCKED"
          - "TrafficControlPlan TCP_APPROVED -> LOCKED with locked_at_version := its current version; SoundPlan SOUND_APPROVED -> LOCKED with locked_at_version pinned"
          - "Each EquipmentReservation HELD -> CONFIRMED and billing UNBILLED -> INVOICED with invoice_cents per calculations.equipment_rental_totals (per-line tax)"
          - "equipment_total_cents := sum of invoice_cents; final_fee_cents := calculations.permit_fee_final"
      - from: ISSUED
        to: COMPLETED
        trigger: "POST /permit-applications/{id}/complete"
        actor: PermitOfficer
        preconditions:
          - "current_utc > event_end_at"
          - "Latest PostEventReport inspection_result == PASSED"
          - "All EquipmentReservations in terminal reservation_status IN {CLOSED, CANCELLED, RECALLED}"
          - "Deposit (if any) status IN {SETTLED, FORFEITED}"
          - "CostSharePool (if any) status IN {CLOSED, REFUNDED}"
          - "(any unmet -> ERR_COMPLETION_PRECONDITIONS)"
        side_effects: ["status := COMPLETED"]
      - from: DRAFT
        to: CANCELLED
        trigger: "POST /permit-applications/{id}/cancel"
        actor: Organizer
        preconditions: []
        side_effects: ["status := CANCELLED; decision_reason := reason"]
      - from: UNDER_REVIEW
        to: CANCELLED
        trigger: "POST /permit-applications/{id}/cancel"
        actor: Organizer
        preconditions: []
        side_effects:
          - "status := CANCELLED; decision_reason := reason"
          - "Cascade: HELD EquipmentReservations -> CANCELLED, releasing stock reservation (link B)"
          - "Deposit (if HELD) auto-settles -> SETTLED, refund_cents = held_cents - charges_cents"
          - "CostSharePool OPEN/FUNDED -> REFUNDING (link B); each PAID Contribution -> REFUNDED with refunded_cents accumulated (link C caused by REFUNDING); pool -> REFUNDED"
      - from: SUSPENDED
        to: CANCELLED
        trigger: "POST /permit-applications/{id}/cancel"
        actor: Organizer
        preconditions: []
        side_effects:
          - "Same cancel cascades as UNDER_REVIEW -> CANCELLED"
      - from: APPROVED
        to: CANCELLED
        trigger: "POST /permit-applications/{id}/cancel"
        actor: Organizer
        preconditions: []
        side_effects:
          - "Same cancel cascades as UNDER_REVIEW -> CANCELLED"
      - from: ISSUED
        to: CANCELLED
        trigger: "POST /permit-applications/{id}/cancel"
        actor: Organizer
        preconditions:
          - "No EquipmentReservation in DISPATCHED (else ERR_INVALID_STATE; return equipment first)"
        side_effects:
          - "status := CANCELLED"
          - "CONFIRMED reservations -> CANCELLED, releasing stock reservation"
          - "Deposit auto-settles; CostSharePool refund chain as above"
      - from: ISSUED
        to: REVOKED
        trigger: "POST /permit-applications/{id}/revoke"
        actor: PermitOfficer
        preconditions:
          - "No EquipmentReservation in DISPATCHED (else ERR_INVALID_STATE)"
        side_effects:
          - "status := REVOKED; decision_reason := reason"
          - "Cascade: CONFIRMED reservations -> RECALLED (link B); each RECALL releases its stock reservation: stock.reserved_units/out accounting updated per calculations.equipment_stock_selector bookkeeping (link C caused by B)"
          - "On RECALLED, billing_status INVOICED -> WAIVED automatically"
          - "Deposit auto-settles; CostSharePool refund chain; petition stays LOCKED"
      - from: DRAFT
        to: EXPIRED
        trigger: "system (lazy: evaluated on any access to the application when current_utc > event_end_at)"
        actor: system
        preconditions: []
        side_effects:
          - "status := EXPIRED"
          - "HELD reservations -> CANCELLED (stock released); Deposit auto-settles; pool refund chain"
      - from: UNDER_REVIEW
        to: EXPIRED
        trigger: "system (lazy expiry, same rule)"
        actor: system
        preconditions: []
        side_effects: ["Same as DRAFT -> EXPIRED"]
      - from: SUSPENDED
        to: EXPIRED
        trigger: "system (lazy expiry, same rule)"
        actor: system
        preconditions: []
        side_effects: ["Same as DRAFT -> EXPIRED"]
      - from: APPROVED
        to: EXPIRED
        trigger: "system (lazy expiry, same rule)"
        actor: system
        preconditions: []
        side_effects: ["Same as DRAFT -> EXPIRED"]

  - entity: TrafficControlPlan
    initial_state: DRAFT
    terminal_states: [LOCKED]
    transitions:
      - from: DRAFT
        to: SUBMITTED
        trigger: "POST /traffic-control-plans/{id}/submit"
        actor: Organizer
        preconditions:
          - "Application status IN {UNDER_REVIEW, SUSPENDED} (else ERR_INVALID_STATE)"
          - "emergency_lane_continuous == true AND emergency_lane_width_m >= 6.0 (else ERR_EMERGENCY_LANE_VIOLATION)"
          - "barricade_count >= required_barricades = ceil(segment.length_m / 12) + (segment.intersects_arterial ? 4 : 0) (else ERR_BARRICADE_PLAN_INSUFFICIENT)"
        side_effects: ["status := SUBMITTED"]
      - from: CHANGES_REQUESTED
        to: SUBMITTED
        trigger: "POST /traffic-control-plans/{id}/submit"
        actor: Organizer
        preconditions: ["Same validations as DRAFT -> SUBMITTED"]
        side_effects: ["status := SUBMITTED"]
      - from: SUBMITTED
        to: TCP_APPROVED
        trigger: "POST /traffic-control-plans/{id}/review with decision=APPROVE"
        actor: TrafficReviewer
        preconditions: []
        side_effects: ["status := TCP_APPROVED; reviewed_by := X-User-ID; review_note := note"]
      - from: SUBMITTED
        to: CHANGES_REQUESTED
        trigger: "POST /traffic-control-plans/{id}/review with decision=REQUEST_CHANGES"
        actor: TrafficReviewer
        preconditions: []
        side_effects: ["status := CHANGES_REQUESTED; reviewed_by := X-User-ID; review_note := note"]
      - from: TCP_APPROVED
        to: LOCKED
        trigger: "system (at permit issuance)"
        actor: system
        preconditions: []
        side_effects: ["status := LOCKED; locked_at_version := current version (version-pinned)"]

  - entity: SoundPlan
    initial_state: DRAFT
    terminal_states: [LOCKED]
    transitions:
      - from: DRAFT
        to: SUBMITTED
        trigger: "POST /sound-plans/{id}/submit"
        actor: Organizer
        preconditions:
          - "Application status IN {UNDER_REVIEW, SUSPENDED} (else ERR_INVALID_STATE)"
          - "max_db_at_property_line <= 70 (else ERR_SOUND_DB_EXCEEDED)"
          - "planned_sound_end <= cutoff(event_start_at day): 22:00 if Friday/Saturday else 21:00, equality passes (else ERR_SOUND_CUTOFF_VIOLATION)"
        side_effects: ["status := SUBMITTED"]
      - from: CHANGES_REQUESTED
        to: SUBMITTED
        trigger: "POST /sound-plans/{id}/submit"
        actor: Organizer
        preconditions: ["Same validations as DRAFT -> SUBMITTED"]
        side_effects: ["status := SUBMITTED"]
      - from: SUBMITTED
        to: SOUND_APPROVED
        trigger: "POST /sound-plans/{id}/review with decision=APPROVE"
        actor: SafetyReviewer
        preconditions: []
        side_effects: ["status := SOUND_APPROVED; reviewed_by := X-User-ID; review_note := note"]
      - from: SUBMITTED
        to: CHANGES_REQUESTED
        trigger: "POST /sound-plans/{id}/review with decision=REQUEST_CHANGES"
        actor: SafetyReviewer
        preconditions: []
        side_effects: ["status := CHANGES_REQUESTED; reviewed_by := X-User-ID; review_note := note"]
      - from: SOUND_APPROVED
        to: LOCKED
        trigger: "system (at permit issuance)"
        actor: system
        preconditions: []
        side_effects: ["status := LOCKED; locked_at_version := current version"]

  - entity: InsuranceCertificate
    initial_state: SUBMITTED
    terminal_states: [VERIFIED, WAIVER_GRANTED, SUPERSEDED]
    transitions:
      - from: SUBMITTED
        to: VERIFIED
        trigger: "POST /insurance-certificates/{id}/review with decision=APPROVE (kind=CERTIFICATE)"
        actor: SafetyReviewer
        preconditions:
          - "coverage_amount_cents >= 100000000 (else ERR_INSURANCE_COVERAGE_INSUFFICIENT)"
          - "expires_on >= date(event_start_at) of the application (else ERR_INSURANCE_EXPIRED)"
        side_effects: ["status := VERIFIED; reviewed_by := X-User-ID"]
      - from: SUBMITTED
        to: WAIVER_GRANTED
        trigger: "POST /insurance-certificates/{id}/review with decision=APPROVE (kind=WAIVER_REQUEST)"
        actor: SafetyReviewer
        preconditions:
          - "Waiver eligible: application.expected_attendance <= 75 AND application.alcohol_served == false AND segment.segment_kind == RESIDENTIAL (else ERR_WAIVER_INELIGIBLE)"
        side_effects: ["status := WAIVER_GRANTED; reviewed_by := X-User-ID"]
      - from: SUBMITTED
        to: REJECTED
        trigger: "POST /insurance-certificates/{id}/review with decision=DENY (kind=CERTIFICATE)"
        actor: SafetyReviewer
        preconditions: []
        side_effects: ["status := REJECTED; review_note := note"]
      - from: SUBMITTED
        to: WAIVER_DENIED
        trigger: "POST /insurance-certificates/{id}/review with decision=DENY (kind=WAIVER_REQUEST)"
        actor: SafetyReviewer
        preconditions: []
        side_effects: ["status := WAIVER_DENIED; review_note := note"]
      - from: SUBMITTED
        to: SUPERSEDED
        trigger: "system (a new InsuranceCertificate is created for the same application)"
        actor: system
        preconditions: []
        side_effects: ["status := SUPERSEDED; superseded_by_id := new record id"]
      - from: REJECTED
        to: SUPERSEDED
        trigger: "system (same supersede rule)"
        actor: system
        preconditions: []
        side_effects: ["status := SUPERSEDED; superseded_by_id := new record id"]
      - from: WAIVER_DENIED
        to: SUPERSEDED
        trigger: "system (same supersede rule)"
        actor: system
        preconditions: []
        side_effects: ["status := SUPERSEDED; superseded_by_id := new record id"]

  - entity: EquipmentReservation
    initial_state: HELD
    terminal_states: [CLOSED, CANCELLED, RECALLED]
    note: "Parallel dimensions: reservation_status (lifecycle) x billing_status (UNBILLED -> INVOICED -> PAID|WAIVED) evolve independently; CLOSED is gated on billing_status IN {PAID, WAIVED}."
    transitions:
      - from: HELD
        to: CONFIRMED
        trigger: "system (at permit issuance)"
        actor: system
        preconditions: []
        side_effects:
          - "reservation_status := CONFIRMED"
          - "billing_status UNBILLED -> INVOICED; invoice_cents := per-line pretax + round_half_up(pretax * 0.0825) per calculations.equipment_rental_totals"
      - from: CONFIRMED
        to: DISPATCHED
        trigger: "POST /equipment-reservations/{id}/dispatch"
        actor: DepotOfficer
        preconditions:
          - "Application status == ISSUED (else ERR_INVALID_STATE)"
          - "current_utc IN [event_start_at - 48h, event_start_at] (else ERR_DISPATCH_WINDOW_VIOLATION)"
        side_effects:
          - "reservation_status := DISPATCHED; dispatched_by := X-User-ID; dispatched_at := current_utc; return_due_at := event_end_at + 48h"
          - "stock bookkeeping: units move from reserved to out (out_units += units)"
      - from: DISPATCHED
        to: RETURNED
        trigger: "POST /equipment-reservations/{id}/return"
        actor: DepotOfficer
        preconditions:
          - "0 <= returned_units <= units (else ERR_INVALID_REQUEST)"
        side_effects:
          - "reservation_status := RETURNED; returned_at := current_utc; late_days computed (0 if on time else ceil(hours_late/24))"
          - "stock: out_units -= returned_units"
          - "If late_days > 0 and application deposit status == HELD: post ChargeEntry LATE_EQUIPMENT = returned_units * RATE[kind] * 2 * late_days"
          - "If units - returned_units > 0 and deposit HELD: post ChargeEntry SHORTAGE = (units - returned_units) * RATE[kind] * 5"
          - "If posted charges push deposit.charges_cents >= deposit.held_cents: deposit HELD -> FORFEITED (refund_cents := 0), which cascades Organizer standing demotion (GOOD->FLAGGED, FLAGGED->SUSPENDED; forfeiture_count += 1)"
      - from: RETURNED
        to: CLOSED
        trigger: "POST /equipment-reservations/{id}/verify-return"
        actor: DepotOfficer
        preconditions:
          - "X-User-ID != dispatched_by (segregation of duties; else ERR_SOD_SAME_OFFICER)"
          - "billing_status IN {PAID, WAIVED} (else ERR_BILLING_UNSETTLED)"
        side_effects:
          - "reservation_status := CLOSED; return_verified_by := X-User-ID"
      - from: HELD
        to: CANCELLED
        trigger: "POST /equipment-reservations/{id}/cancel"
        actor: Organizer
        preconditions:
          - "Application status IN {UNDER_REVIEW, SUSPENDED, APPROVED} (else ERR_INVALID_STATE)"
        side_effects:
          - "reservation_status := CANCELLED; stock reservation released"
      - from: CONFIRMED
        to: CANCELLED
        trigger: "system (application cancelled from ISSUED)"
        actor: system
        preconditions: []
        side_effects: ["reservation_status := CANCELLED; stock reservation released; billing INVOICED -> WAIVED"]
      - from: CONFIRMED
        to: RECALLED
        trigger: "system (application revoked)"
        actor: system
        preconditions: []
        side_effects: ["reservation_status := RECALLED; stock reservation released; billing INVOICED -> WAIVED"]
      - from: HELD
        to: CANCELLED
        trigger: "system (application cancelled/denied/expired pre-issuance)"
        actor: system
        preconditions: []
        side_effects: ["reservation_status := CANCELLED; stock reservation released"]
    billing_transitions:
      - from: UNBILLED
        to: INVOICED
        trigger: "system (reservation HELD -> CONFIRMED at issuance)"
      - from: INVOICED
        to: PAID
        trigger: "POST /equipment-reservations/{id}/pay"
        actor: Organizer
      - from: INVOICED
        to: WAIVED
        trigger: "POST /equipment-reservations/{id}/waive (invoice_cents <= 500 else ERR_WAIVER_AMOUNT_TOO_LARGE) OR system on CANCELLED/RECALLED"
        actor: PermitOfficer

  - entity: CostSharePool
    initial_state: OPEN
    terminal_states: [CLOSED, REFUNDED]
    transitions:
      - from: OPEN
        to: FUNDED
        trigger: "system (after a contribution makes collected_cents >= target_cents; equality funds)"
        actor: system
        preconditions: []
        side_effects: ["status := FUNDED"]
      - from: OPEN
        to: CLOSED
        trigger: "POST /cost-share-pools/{id}/close"
        actor: Organizer
        preconditions:
          - "Application status == ISSUED AND current_utc > event_end_at (else ERR_INVALID_STATE)"
        side_effects: ["status := CLOSED; funds stay collected (no refunds)"]
      - from: FUNDED
        to: CLOSED
        trigger: "POST /cost-share-pools/{id}/close"
        actor: Organizer
        preconditions: ["Same as OPEN -> CLOSED"]
        side_effects: ["status := CLOSED"]
      - from: OPEN
        to: REFUNDING
        trigger: "system (application CANCELLED / REVOKED / DENIED / EXPIRED)"
        actor: system
        preconditions: []
        side_effects:
          - "status := REFUNDING"
          - "Each PAID Contribution -> REFUNDED with refunded_at := current_utc; pool.refunded_cents += amount; pool.collected_cents -= amount"
          - "When no PAID contributions remain: pool REFUNDING -> REFUNDED"
      - from: FUNDED
        to: REFUNDING
        trigger: "system (same rule)"
        actor: system
        preconditions: []
        side_effects: ["Same as OPEN -> REFUNDING"]
      - from: REFUNDING
        to: REFUNDED
        trigger: "system (immediately after the refund sweep completes in the same request)"
        actor: system
        preconditions: []
        side_effects: ["status := REFUNDED"]

  - entity: Contribution
    initial_state: PAID
    terminal_states: [REFUNDED]
    transitions:
      - from: PAID
        to: REFUNDED
        trigger: "system (pool refund sweep)"
        actor: system
        preconditions: []
        side_effects: ["status := REFUNDED; refunded_at := current_utc; pool counters updated"]

  - entity: Deposit
    initial_state: HELD
    terminal_states: [SETTLED, FORFEITED]
    transitions:
      - from: HELD
        to: SETTLED
        trigger: "POST /deposits/{id}/settle OR system auto-settle on application CANCELLED/REVOKED/DENIED/EXPIRED"
        actor: PermitOfficer
        preconditions:
          - "Manual settle: application status IN {ISSUED, REVOKED} AND current_utc > event_end_at (else ERR_INVALID_STATE)"
          - "Manual settle: charges_cents < held_cents (if charges_cents >= held_cents the deposit has already auto-FORFEITED)"
        side_effects:
          - "status := SETTLED; refund_cents := held_cents - charges_cents"
      - from: HELD
        to: FORFEITED
        trigger: "system (a posted ChargeEntry makes charges_cents >= held_cents)"
        actor: system
        preconditions: []
        side_effects:
          - "status := FORFEITED; refund_cents := 0"
          - "Cascade: Organizer forfeiture_count += 1; standing GOOD -> FLAGGED, or FLAGGED -> SUSPENDED when forfeiture_count reaches 2"

  - entity: PostEventReport
    initial_state: PENDING
    terminal_states: [PASSED, FAILED]
    transitions:
      - from: PENDING
        to: PASSED
        trigger: "POST /post-event-reports/{id}/inspect with result=PASSED"
        actor: PermitOfficer
        preconditions: []
        side_effects: ["inspection_result := PASSED; inspected_by := X-User-ID"]
      - from: PENDING
        to: FAILED
        trigger: "POST /post-event-reports/{id}/inspect with result=FAILED"
        actor: PermitOfficer
        preconditions: []
        side_effects:
          - "inspection_result := FAILED; inspected_by := X-User-ID; cleaning_charge_cents := input cleaning_charge_cents (default 0)"
          - "If cleaning_charge_cents > 0 and deposit HELD: post ChargeEntry CLEANING (link B)"
          - "If that charge makes deposit.charges_cents >= held_cents: deposit HELD -> FORFEITED (link C caused by B)"
          - "Deposit forfeiture cascades Organizer standing demotion (link D caused by C)"

# =============================================================================
# 1.2.1 Concurrency Rules
# =============================================================================
concurrency_rules:
  - rule_id: insurance-create-stale-application
    parent_entity: PermitApplication
    write_endpoint: "POST /permit-applications/{id}/insurance-certificates"
    occ_field: expected_application_version
    description: |
      Creating an InsuranceCertificate supersedes the application's prior
      SUBMITTED/REJECTED/WAIVER_DENIED insurance record. A create carrying an
      expected_application_version that no longer matches the application's
      current version is rejected as stale: another writer has mutated the
      application (including superseding the insurance record) since the
      caller last observed it.
    error_id: ERR_STALE_APPLICATION_VERSION
    http_status: 412
  - rule_id: application-patch-stale-version
    parent_entity: PermitApplication
    write_endpoint: "PATCH /permit-applications/{id}"
    occ_field: expected_application_version
    description: |
      Updating a DRAFT PermitApplication requires the caller's last-observed
      application version. A PATCH whose expected_application_version does not
      match the current version is rejected as stale, since any intervening
      mutation (including an insurance-certificate create, which also bumps
      the version) invalidates the caller's view.
    error_id: ERR_STALE_APPLICATION_VERSION
    http_status: 412

# =============================================================================
# 1.3 Calculation Rules Table
# =============================================================================
calculations:
  - name: petition_required_signatures
    trigger: "Petition creation"
    algorithm: threshold
    formula: |
      if segment.segment_kind == RESIDENTIAL:
        required_signatures = ceil(0.60 * segment.household_count)
        support_mode = DISTINCT_HOUSEHOLD
      else:  # MIXED_USE
        required_signatures = ceil(0.60 * segment.household_count + 0.50 * segment.business_count)
        support_mode = SIGNATURE_COUNT
      Minimum is 1 (a segment with 0 households and 0 businesses requires 1).
    input_set: "The StreetSegment referenced by segment_id"
    constants:
      RESIDENTIAL_RATIO: 0.60
      MIXED_BUSINESS_WEIGHT: 0.50
    precision: "integer, ceil"
    variants:
      - name: residential_household_based
        when: "segment_kind == RESIDENTIAL"
        difference: "Threshold counts households only; support measured in DISTINCT_HOUSEHOLD mode"
      - name: mixed_use_business_weighted
        when: "segment_kind == MIXED_USE"
        difference: "Businesses add 0.5 each to the threshold; support measured in SIGNATURE_COUNT mode"

  - name: petition_support_metric
    trigger: "PetitionSignature create or withdraw; Petition submit; Petition verify"
    algorithm: aggregation
    formula: |
      valid_signature_count = count(PetitionSignature where petition_id = P and status = ACTIVE)
      distinct_household_count = count(distinct household_address over PetitionSignature where petition_id = P and status = ACTIVE)
      support_metric = (support_mode == DISTINCT_HOUSEHOLD) ? distinct_household_count : valid_signature_count
      Threshold satisfied iff support_metric >= required_signatures (equality passes).
    input_set: "PetitionSignature rows of the petition with status ACTIVE; WITHDRAWN rows excluded"
    precision: "integer"
    variants:
      - name: distinct_household
        when: "support_mode == DISTINCT_HOUSEHOLD (RESIDENTIAL segments)"
        difference: "Two ACTIVE signatures from the same household_address count once"
      - name: signature_count
        when: "support_mode == SIGNATURE_COUNT (MIXED_USE segments)"
        difference: "Every ACTIVE signature counts, so two signatures from one address count twice — diverges from distinct_household for identical rows"

  - name: permit_fee_provisional
    trigger: "PermitApplication DRAFT -> UNDER_REVIEW (submit); result frozen in provisional_fee_cents"
    algorithm: aggregation
    formula: |
      fee_subtotal = 5000
                   + (expected_attendance <= 50 ? 0 : expected_attendance <= 150 ? 4000 : 9000)
                   + (alcohol_served ? 7500 : 0)
                   + (amplified_sound ? 2500 : 0)
                   + (segment.jurisdiction == STATE_ROUTE ? 10000 : 0)
      equipment_estimate = if a TrafficControlPlan exists for the application (any status, using its CURRENT counts at submit time):
                             barricade_count * 250 + cone_count * 25 + sign_count * 100
                           else 0
      provisional_fee_cents = fee_subtotal + equipment_estimate
      # Provisional NEVER includes tax, discount, or admin surcharge.
    input_set: "PermitApplication fields at submit time; TrafficControlPlan row if present"
    constants:
      BASE_FEE_CENTS: 5000
      TIER1_MAX: 50
      TIER2_MAX: 150
      TIER2_FEE_CENTS: 4000
      TIER3_FEE_CENTS: 9000
      ALCOHOL_FEE_CENTS: 7500
      SOUND_FEE_CENTS: 2500
      STATE_ROUTE_FEE_CENTS: 10000
      RATE_BARRICADE: 250
      RATE_CONE: 25
      RATE_SIGN: 100
    precision: "integer cents"

  - name: permit_fee_final
    trigger: "PermitApplication APPROVED -> ISSUED (issue); result frozen in final_fee_cents"
    algorithm: tiered_pricing
    formula: |
      PINNED EVALUATION ORDER (circular-looking; evaluate exactly in this order):
      1. fee_subtotal = same tiered formula as permit_fee_provisional step 1, using the
         application's CURRENT fields at issue time.
      2. deposit_required = calculations.deposit_required(application)  # used ONLY for discount eligibility
      3. if fee_subtotal + deposit_required > 20000:                    # eligibility evaluated on PRE-discount subtotal
           discounted_fee = round_half_up(fee_subtotal * 0.90)
         else:
           discounted_fee = fee_subtotal
      4. admin_surcharge = round_half_up(discounted_fee * 0.03)          # surcharge on fee ONLY — never on equipment or deposit
      5. equipment_total_cents = calculations.equipment_rental_totals over reservations transitioned HELD->CONFIRMED by this issue
      6. final_fee_cents = discounted_fee + admin_surcharge + equipment_total_cents
    input_set: "PermitApplication current fields; EquipmentReservations of the application with reservation_status HELD (transitioning to CONFIRMED)"
    constants:
      LARGE_EVENT_THRESHOLD_CENTS: 20000
      LARGE_EVENT_DISCOUNT: 0.10
      ADMIN_SURCHARGE_RATE: 0.03
    precision: "integer cents, round_half_up where indicated"
    variants:
      - name: provisional
        when: "computed at submit (permit_fee_provisional)"
        difference: "No discount, no surcharge, no tax, equipment estimated from plan counts — produces a different number than final for identical application fields whenever discount/tax/surcharge apply"
      - name: final
        when: "computed at issue"
        difference: "Applies large-event discount (on pre-discount subtotal), admin surcharge (on discounted fee only), and taxed per-line equipment totals"

  - name: equipment_rental_totals
    trigger: "Permit issuance (each reservation HELD -> CONFIRMED)"
    algorithm: aggregation
    formula: |
      PINNED ROUNDING ORDER (per-line, then sum):
      for each reservation line:
        pretax = units * RATE[equipment_kind]
        tax    = round_half_up(pretax * 0.0825)     # tax rounded PER LINE
        invoice_cents = pretax + tax
      equipment_total_cents = sum(invoice_cents over lines)
      # The alternative order (sum pretax over lines, then apply tax, then round) is REJECTED;
      # the two orders diverge by cents for many unit combinations (e.g. 1B + 9C + 4C: 623 vs 622).
    input_set: "EquipmentReservations of the application transitioning HELD -> CONFIRMED at this issue"
    constants:
      RATE_BARRICADE: 250
      RATE_CONE: 25
      RATE_SIGN: 100
      TAX_RATE: 0.0825
    precision: "integer cents, round_half_up per line"

  - name: equipment_stock_selector
    trigger: "POST /permit-applications/{id}/equipment-reservations"
    algorithm: aggregation
    formula: |
      buffered window of an application A = [A.event_start_at - 24h, A.event_end_at + 24h], CLOSED interval.
      overlap(A, B) iff A.buf_start <= B.buf_end AND B.buf_start <= A.buf_end (closed: touching endpoints overlap).
      window_available(S, w) = S.total_units - sum(units of EquipmentReservation R where R.stock_id = S.id
                                and R.reservation_status IN {HELD, CONFIRMED, DISPATCHED}
                                and overlap(buffered_window(R.application), w))
      candidates = EquipmentStock S where S.equipment_kind == requested kind and window_available(S, requested window) >= requested units
      ranking: window_available DESC; tie-break: S.created_at ASC (never id)
      empty candidate set -> ERR_EQUIPMENT_UNAVAILABLE
    input_set: "All EquipmentStock rows of the requested kind; all non-terminal reservations on them"
    precision: "integer units"
    note: "Selector determinism pinned: eligibility filter + ranking expression + created_at tie-break + empty-pool error."

  - name: segment_window_conflict
    trigger: "PermitApplication submit and issue"
    algorithm: interval_merge
    formula: |
      Application windows are HALF-OPEN [event_start_at, event_end_at).
      New application N conflicts with existing application E on the same segment iff
        E.status IN {UNDER_REVIEW, SUSPENDED, APPROVED, ISSUED}
        AND E.event_start_at < N.event_end_at
        AND N.event_start_at < E.event_end_at
      Adjacency (N.event_start_at == E.event_end_at or N.event_end_at == E.event_start_at) is NOT a conflict.
    input_set: "PermitApplications on the same segment_id (excluding the application being checked)"

  - name: deposit_required
    trigger: "POST /permit-applications/{id}/deposits"
    algorithm: threshold
    formula: |
      required_cents = 10000
                     + (expected_attendance > 150 ? 15000 : 0)
                     + (alcohol_served ? 20000 : 0)
      held_cents = required_cents (payment simulated at creation)
    input_set: "PermitApplication fields"
    constants:
      DEPOSIT_BASE_CENTS: 10000
      DEPOSIT_LARGE_CROWD_CENTS: 15000
      DEPOSIT_ALCOHOL_CENTS: 20000
    precision: "integer cents"

  - name: late_and_shortage_fees
    trigger: "EquipmentReservation DISPATCHED -> RETURNED"
    algorithm: threshold
    formula: |
      late_days = (returned_at > return_due_at) ? ceil((returned_at - return_due_at) / 24h) : 0
      # returned_at exactly == return_due_at is on time (late_days = 0, no charge)
      late_fee_cents      = returned_units * RATE[kind] * LATE_MULTIPLIER * late_days        # posted if > 0
      shortage_units      = units - returned_units
      shortage_fee_cents  = shortage_units * RATE[kind] * SHORTAGE_MULTIPLIER                # posted if > 0
      Charges post to the application's Deposit only while deposit.status == HELD.
    constants:
      LATE_MULTIPLIER: 2
      SHORTAGE_MULTIPLIER: 5
      RETURN_GRACE_HOURS: 48
    precision: "integer cents"

# =============================================================================
# 1.4 Validation Rules Table (ordered by priority)
# =============================================================================
validations:
  - priority: 1
    category: auth
    check: "X-User-Role and X-User-ID headers present; X-User-Role is a recognized role"
    error_id: ERR_UNAUTHENTICATED
    http_status: 401
    applies_to: "all"
  - priority: 2
    category: auth
    check: "Role permitted for the endpoint; for entity-backed Organizer calls, X-User-ID must equal the owning organizer_id of the target resource; organizer standing must not be SUSPENDED for petition/application creation"
    error_id: "ERR_UNAUTHORIZED / ERR_NOT_RESOURCE_OWNER / ERR_ORGANIZER_SUSPENDED"
    http_status: 403
    applies_to: "all"
  - priority: 3
    category: existence
    check: "Path resource ids exist, validated left-to-right"
    error_id: ERR_NOT_FOUND
    http_status: 404
    applies_to: "all endpoints with path ids"
  - priority: 4
    category: state
    check: "Optimistic concurrency: expected_application_version matches current PermitApplication.version"
    error_id: ERR_STALE_APPLICATION_VERSION
    http_status: 412
    applies_to: "PATCH /permit-applications/{id}; POST /permit-applications/{id}/insurance-certificates"
  - priority: 5
    category: state
    check: "Target resource in the required state for the operation, including cross-entity state gates (petition VERIFIED, pool OPEN, billing settled, petition not LOCKED)"
    error_id: "ERR_INVALID_STATE / ERR_PETITION_NOT_VERIFIED / ERR_PETITION_LOCKED / ERR_POOL_NOT_OPEN / ERR_BILLING_UNSETTLED"
    http_status: 409
    applies_to: "state transition endpoints"
  - priority: 6
    category: business_safety
    check: "Safety invariants: continuous emergency lane >= 6.0m; barricade minimum for segment; dB cap 70"
    error_id: "ERR_EMERGENCY_LANE_VIOLATION / ERR_BARRICADE_PLAN_INSUFFICIENT / ERR_SOUND_DB_EXCEEDED"
    http_status: 422
    applies_to: "POST /traffic-control-plans/{id}/submit; POST /sound-plans/{id}/submit"
  - priority: 7
    category: business_temporal
    check: "Temporal rules: event window shape, jurisdiction lead time, sound cutoff by day-of-week, dispatch window, report window, insurance expiry"
    error_id: "ERR_EVENT_WINDOW_INVALID / ERR_LEAD_TIME_INSUFFICIENT / ERR_SOUND_CUTOFF_VIOLATION / ERR_DISPATCH_WINDOW_VIOLATION / ERR_REPORT_WINDOW_CLOSED / ERR_INSURANCE_EXPIRED"
    http_status: 422
    applies_to: "application create/submit; sound-plan submit; dispatch; report create; insurance review"
    note: "ERR_EVENT_WINDOW_INVALID is a 400 schema-level shape error evaluated with request validation but ordered here for conflicts against other business rules"
  - priority: 8
    category: business_referential
    check: "Cross-entity readiness: TCP approved, sound plan approved when required, insurance satisfied, completion preconditions, sound plan only when amplified"
    error_id: "ERR_TCP_NOT_APPROVED / ERR_SOUND_PLAN_NOT_APPROVED / ERR_INSURANCE_NOT_SATISFIED / ERR_COMPLETION_PRECONDITIONS / ERR_SOUND_NOT_REQUESTED"
    http_status: 409
    applies_to: "approve; complete; sound-plan create"
  - priority: 9
    category: business_constraint
    check: "Uniqueness, overlap and aggregate constraints: duplicate signature, singleton children, segment window conflict, signature threshold, equipment coverage, selector availability"
    error_id: "ERR_DUPLICATE_SIGNATURE / ERR_DUPLICATE_RESOURCE / ERR_SEGMENT_WINDOW_CONFLICT / ERR_SIGNATURE_THRESHOLD_NOT_MET / ERR_EQUIPMENT_NOT_RESERVED / ERR_EQUIPMENT_UNAVAILABLE"
    http_status: 409
    applies_to: "signatures; singleton creates; application submit/issue; petition submit/verify; reservation create; approve"
  - priority: 10
    category: business_fiscal
    check: "Money rules last: deposit held before approval, contribution minimum, waiver caps and eligibility, coverage amount"
    error_id: "ERR_DEPOSIT_REQUIRED / ERR_CONTRIBUTION_BELOW_MIN / ERR_WAIVER_INELIGIBLE / ERR_INSURANCE_COVERAGE_INSUFFICIENT / ERR_WAIVER_AMOUNT_TOO_LARGE"
    http_status: 422
    applies_to: "approve; contributions; insurance review; reservation waive"

# =============================================================================
# 1.0 Response Envelope (FIXED)
# =============================================================================
response_envelope:
  success: |
    { "meta": { "api_request_id": "req_xxx", "api_request_timestamp": "ISO8601" },
      "response_type": "object" | "array", "data": {} }
  error: |
    { "meta": { ... }, "response_type": "error",
      "data": { "error_id": "ERR_XXX", "message": "..." } }
  pagination_fields: ["limit", "offset", "total_count", "has_more"]
  pagination_defaults: { limit: 10, min: 1, max: 100, offset: 0 }

# =============================================================================
# 1.5 API Endpoint Table
# =============================================================================
endpoints:
  # --- Organizer ---
  - method: POST
    path: "/organizers"
    description: "Register an organizer"
    roles: [Anonymous]
    code: 201
    input: [full_name, email, phone, address]
    output: Organizer
    side_effects: ["standing=GOOD, forfeiture_count=0"]
  - method: GET
    path: "/organizers/{id}"
    description: "Get an organizer"
    roles: [Organizer, PermitOfficer, CityAdmin]
    code: 200
    input: []
    output: Organizer
    side_effects: []
  - method: GET
    path: "/organizers/{id}/petitions"
    description: "List petitions created by an organizer"
    roles: [Organizer, PermitOfficer, CityAdmin]
    code: 200
    input: []
    output: Petition[]
    side_effects: []
  - method: GET
    path: "/organizers/{id}/permit-applications"
    description: "List permit applications created by an organizer"
    roles: [Organizer, PermitOfficer, CityAdmin]
    code: 200
    input: []
    output: PermitApplication[]
    side_effects: []
  - method: POST
    path: "/_inject/organizer_forfeiture"
    description: "Test-driving endpoint: apply one deposit-forfeiture demotion to an organizer (forfeiture_count += 1; standing GOOD->FLAGGED, FLAGGED->SUSPENDED) without running a full event lifecycle"
    roles: [CityAdmin]
    code: 200
    input: [organizer_id]
    output: Organizer
    side_effects: ["forfeiture_count += 1; standing demoted per rule"]

  # --- StreetSegment ---
  - method: POST
    path: "/street-segments"
    description: "Register a street segment (city configuration)"
    roles: [CityAdmin]
    code: 201
    input: [name, jurisdiction, segment_kind, household_count, "business_count?", "intersects_arterial?", length_m]
    output: StreetSegment
    side_effects: []
  - method: GET
    path: "/street-segments/{id}"
    description: "Get a street segment"
    roles: [Organizer, Neighbor, TrafficReviewer, SafetyReviewer, PermitOfficer, DepotOfficer, CityAdmin]
    code: 200
    input: []
    output: StreetSegment
    side_effects: []
  - method: GET
    path: "/street-segments/{id}/petitions"
    description: "List petitions for a segment"
    roles: [Organizer, Neighbor, TrafficReviewer, SafetyReviewer, PermitOfficer, DepotOfficer, CityAdmin]
    code: 200
    input: []
    output: Petition[]
    side_effects: []
  - method: GET
    path: "/street-segments/{id}/permit-applications"
    description: "List permit applications for a segment"
    roles: [Organizer, TrafficReviewer, SafetyReviewer, PermitOfficer, DepotOfficer, CityAdmin]
    code: 200
    input: []
    output: PermitApplication[]
    side_effects: []

  # --- Logical clock (test-driving) ---
  - method: POST
    path: "/_clock/set_current_utc"
    description: "Set the logical clock. Before any call, the clock reads exactly 2026-05-01T00:00:00Z and NEVER falls back to wall-clock time; all deadline/window/expiry rules read this clock."
    roles: [CityAdmin]
    code: 200
    input: [to_iso8601]
    output: "{ current_utc: datetime }"
    side_effects: ["logical clock := to_iso8601"]

  # --- Petition ---
  - method: POST
    path: "/petitions"
    description: "Create a petition for a segment (organizer_id from X-User-ID)"
    roles: [Organizer]
    code: 201
    input: [segment_id]
    output: Petition
    side_effects: ["status=COLLECTING; required_signatures and support_mode computed per calculations.petition_required_signatures; fails with ERR_ORGANIZER_SUSPENDED if caller standing == SUSPENDED"]
  - method: GET
    path: "/petitions/{id}"
    description: "Get a petition"
    roles: [Organizer, Neighbor, PermitOfficer, CityAdmin]
    code: 200
    input: []
    output: Petition
    side_effects: []
  - method: POST
    path: "/petitions/{id}/signatures"
    description: "Add a signature to a COLLECTING petition"
    roles: [Neighbor]
    code: 201
    input: [household_address, signer_name, signer_email, "is_business?"]
    output: PetitionSignature
    side_effects: ["recompute valid_signature_count and distinct_household_count; rejects duplicate ACTIVE (household_address, signer_email) with ERR_DUPLICATE_SIGNATURE"]
  - method: GET
    path: "/petitions/{id}/signatures"
    description: "List signatures of a petition"
    roles: [Organizer, Neighbor, PermitOfficer, CityAdmin]
    code: 200
    input: ["status?"]
    output: PetitionSignature[]
    side_effects: []
  - method: POST
    path: "/petitions/{id}/signatures/{signatureId}/withdraw"
    description: "Withdraw an ACTIVE signature"
    roles: [Neighbor]
    code: 200
    input: []
    output: PetitionSignature
    side_effects: ["status -> WITHDRAWN; recompute counts; may auto-transition VERIFIED petition -> DEFICIENT and cascade applications to SUSPENDED"]
  - method: POST
    path: "/petitions/{id}/submit"
    description: "Submit a petition for verification"
    roles: [Organizer]
    code: 200
    input: []
    output: Petition
    side_effects: ["status COLLECTING -> SUBMITTED when support metric >= required_signatures"]
  - method: POST
    path: "/petitions/{id}/verify"
    description: "Permit officer verifies (decision=APPROVE) or marks deficient (decision=DEFICIENT)"
    roles: [PermitOfficer]
    code: 200
    input: [decision, "note?"]
    output: Petition
    side_effects: ["APPROVE -> VERIFIED (re-checks threshold) and unsuspends SUSPENDED applications; DEFICIENT -> DEFICIENT with deficiency_note"]
  - method: POST
    path: "/petitions/{id}/cure"
    description: "Re-open a DEFICIENT petition for more signatures (cure loop)"
    roles: [Organizer]
    code: 200
    input: []
    output: Petition
    side_effects: ["status DEFICIENT -> COLLECTING; cure_round += 1"]
  - method: GET
    path: "/petitions/{id}/permit-applications"
    description: "List applications backed by this petition"
    roles: [Organizer, PermitOfficer, CityAdmin]
    code: 200
    input: []
    output: PermitApplication[]
    side_effects: []

  # --- PermitApplication ---
  - method: POST
    path: "/permit-applications"
    description: "Create a permit application (organizer_id from X-User-ID; segment derived from petition)"
    roles: [Organizer]
    code: 201
    input: [petition_id, event_start_at, event_end_at, expected_attendance, "amplified_sound?", "alcohol_served?", "food_vendors?"]
    output: PermitApplication
    side_effects: ["status=DRAFT; segment_id := petition.segment_id; event window shape validated (end > start, duration <= 12h else ERR_EVENT_WINDOW_INVALID); petition must be in {COLLECTING, SUBMITTED, VERIFIED, DEFICIENT} and owned by caller; ERR_ORGANIZER_SUSPENDED if caller SUSPENDED"]
  - method: GET
    path: "/permit-applications"
    description: "List applications with filters and pagination"
    roles: [PermitOfficer, CityAdmin]
    code: 200
    input: ["status?", "organizer_id?", "limit?", "offset?"]
    output: PermitApplication[]
    side_effects: []
  - method: GET
    path: "/permit-applications/{id}"
    description: "Get an application (lazy expiry evaluated on access)"
    roles: [Organizer, TrafficReviewer, SafetyReviewer, PermitOfficer, DepotOfficer, CityAdmin]
    code: 200
    input: []
    output: PermitApplication
    side_effects: ["lazy EXPIRED transition when current_utc > event_end_at and status IN {DRAFT, UNDER_REVIEW, SUSPENDED, APPROVED}"]
  - method: PATCH
    path: "/permit-applications/{id}"
    description: "Update a DRAFT application's fields (OCC-guarded)"
    roles: [Organizer]
    code: 200
    input: [expected_application_version, "event_start_at?", "event_end_at?", "expected_attendance?", "amplified_sound?", "alcohol_served?", "food_vendors?"]
    output: PermitApplication
    side_effects: ["increments PermitApplication.version by 1; updated fields replaced"]
  - method: POST
    path: "/permit-applications/{id}/submit"
    description: "Submit an application for review"
    roles: [Organizer]
    code: 200
    input: []
    output: PermitApplication
    side_effects: ["status DRAFT -> UNDER_REVIEW; provisional_fee_cents computed and frozen"]
  - method: POST
    path: "/permit-applications/{id}/approve"
    description: "Approve an application (all review lanes must be green; checks evaluated in the order listed in the state machine)"
    roles: [PermitOfficer]
    code: 200
    input: []
    output: PermitApplication
    side_effects: ["status UNDER_REVIEW -> APPROVED"]
  - method: POST
    path: "/permit-applications/{id}/deny"
    description: "Deny an application under review"
    roles: [PermitOfficer]
    code: 200
    input: [reason]
    output: PermitApplication
    side_effects: ["status UNDER_REVIEW -> DENIED; reservations CANCELLED; deposit auto-settles; pool refund chain"]
  - method: POST
    path: "/permit-applications/{id}/issue"
    description: "Issue the permit: locks petition/plans, confirms reservations, computes final fee"
    roles: [PermitOfficer]
    code: 200
    input: []
    output: PermitApplication
    side_effects: ["status APPROVED -> ISSUED; petition LOCKED; TCP/SoundPlan LOCKED with pinned versions; reservations CONFIRMED + INVOICED; final_fee_cents and equipment_total_cents computed; increments PermitApplication.version by 1"]
  - method: POST
    path: "/permit-applications/{id}/cancel"
    description: "Organizer cancels an application (cascades differ by state)"
    roles: [Organizer]
    code: 200
    input: ["reason?"]
    output: PermitApplication
    side_effects: ["status -> CANCELLED; reservation release; deposit auto-settle; pool refund chain"]
  - method: POST
    path: "/permit-applications/{id}/revoke"
    description: "Permit officer revokes an issued permit"
    roles: [PermitOfficer]
    code: 200
    input: [reason]
    output: PermitApplication
    side_effects: ["status ISSUED -> REVOKED; CONFIRMED reservations -> RECALLED -> stock released; billing INVOICED -> WAIVED; deposit auto-settle; pool refund chain"]
  - method: POST
    path: "/permit-applications/{id}/complete"
    description: "Close out an event after the post-event gates pass"
    roles: [PermitOfficer]
    code: 200
    input: []
    output: PermitApplication
    side_effects: ["status ISSUED -> COMPLETED"]

  # --- TrafficControlPlan ---
  - method: POST
    path: "/permit-applications/{id}/traffic-control-plans"
    description: "Create the traffic control plan (singleton per application; application must be DRAFT, UNDER_REVIEW or SUSPENDED — DRAFT creation lets the provisional fee see plan counts at submit)"
    roles: [Organizer]
    code: 201
    input: [barricade_count, cone_count, sign_count, emergency_lane_width_m, emergency_lane_continuous, placement_notes]
    output: TrafficControlPlan
    side_effects: ["status=DRAFT; ERR_DUPLICATE_RESOURCE if one already exists"]
  - method: GET
    path: "/permit-applications/{id}/traffic-control-plans"
    description: "List traffic control plans of an application (0 or 1)"
    roles: [Organizer, TrafficReviewer, PermitOfficer, CityAdmin]
    code: 200
    input: []
    output: TrafficControlPlan[]
    side_effects: []
  - method: GET
    path: "/traffic-control-plans/{id}"
    description: "Get a traffic control plan"
    roles: [Organizer, TrafficReviewer, PermitOfficer, CityAdmin]
    code: 200
    input: []
    output: TrafficControlPlan
    side_effects: []
  - method: PATCH
    path: "/traffic-control-plans/{id}"
    description: "Update a plan while DRAFT or CHANGES_REQUESTED"
    roles: [Organizer]
    code: 200
    input: ["barricade_count?", "cone_count?", "sign_count?", "emergency_lane_width_m?", "emergency_lane_continuous?", "placement_notes?"]
    output: TrafficControlPlan
    side_effects: ["increments TrafficControlPlan.version by 1"]
  - method: POST
    path: "/traffic-control-plans/{id}/submit"
    description: "Submit plan for traffic review (safety validations: lane + barricade minimum)"
    roles: [Organizer]
    code: 200
    input: []
    output: TrafficControlPlan
    side_effects: ["status DRAFT/CHANGES_REQUESTED -> SUBMITTED"]
  - method: POST
    path: "/traffic-control-plans/{id}/review"
    description: "Traffic reviewer decision APPROVE | REQUEST_CHANGES"
    roles: [TrafficReviewer]
    code: 200
    input: [decision, "note?"]
    output: TrafficControlPlan
    side_effects: ["status SUBMITTED -> TCP_APPROVED or CHANGES_REQUESTED; reviewed_by recorded"]

  # --- SoundPlan ---
  - method: POST
    path: "/permit-applications/{id}/sound-plans"
    description: "Create a sound plan (only when amplified_sound; application UNDER_REVIEW/SUSPENDED)"
    roles: [Organizer]
    code: 201
    input: [speaker_count, max_db_at_property_line, planned_sound_end]
    output: SoundPlan
    side_effects: ["status=DRAFT; ERR_SOUND_NOT_REQUESTED when amplified_sound is false; ERR_DUPLICATE_RESOURCE if one exists"]
  - method: GET
    path: "/permit-applications/{id}/sound-plans"
    description: "List sound plans of an application (0 or 1)"
    roles: [Organizer, SafetyReviewer, PermitOfficer, CityAdmin]
    code: 200
    input: []
    output: SoundPlan[]
    side_effects: []
  - method: GET
    path: "/sound-plans/{id}"
    description: "Get a sound plan"
    roles: [Organizer, SafetyReviewer, PermitOfficer, CityAdmin]
    code: 200
    input: []
    output: SoundPlan
    side_effects: []
  - method: POST
    path: "/sound-plans/{id}/submit"
    description: "Submit sound plan (dB cap then day-of-week cutoff, in validation priority order)"
    roles: [Organizer]
    code: 200
    input: []
    output: SoundPlan
    side_effects: ["status DRAFT/CHANGES_REQUESTED -> SUBMITTED"]
  - method: POST
    path: "/sound-plans/{id}/review"
    description: "Safety reviewer decision APPROVE | REQUEST_CHANGES"
    roles: [SafetyReviewer]
    code: 200
    input: [decision, "note?"]
    output: SoundPlan
    side_effects: ["status SUBMITTED -> SOUND_APPROVED or CHANGES_REQUESTED; reviewed_by recorded"]

  # --- InsuranceCertificate ---
  - method: POST
    path: "/permit-applications/{id}/insurance-certificates"
    description: "Create an insurance record (CERTIFICATE or WAIVER_REQUEST); supersedes prior SUBMITTED/REJECTED/WAIVER_DENIED records; OCC-guarded; rejected with ERR_INVALID_STATE if a VERIFIED/WAIVER_GRANTED record already exists; application must be UNDER_REVIEW/SUSPENDED/APPROVED"
    roles: [Organizer]
    code: 201
    input: [kind, expected_application_version, "insurer_name?", "policy_number?", "coverage_amount_cents?", "expires_on?"]
    output: InsuranceCertificate
    side_effects: ["status=SUBMITTED; prior SUBMITTED/REJECTED/WAIVER_DENIED records -> SUPERSEDED; increments PermitApplication.version by 1"]
  - method: GET
    path: "/permit-applications/{id}/insurance-certificates"
    description: "List insurance records of an application"
    roles: [Organizer, SafetyReviewer, PermitOfficer, CityAdmin]
    code: 200
    input: []
    output: InsuranceCertificate[]
    side_effects: []
  - method: GET
    path: "/insurance-certificates/{id}"
    description: "Get an insurance record"
    roles: [Organizer, SafetyReviewer, PermitOfficer, CityAdmin]
    code: 200
    input: []
    output: InsuranceCertificate
    side_effects: []
  - method: POST
    path: "/insurance-certificates/{id}/review"
    description: "Safety reviewer decision APPROVE | DENY with server-side coverage/expiry/waiver-eligibility checks on APPROVE"
    roles: [SafetyReviewer]
    code: 200
    input: [decision, "note?"]
    output: InsuranceCertificate
    side_effects: ["status -> VERIFIED / WAIVER_GRANTED / REJECTED / WAIVER_DENIED; reviewed_by recorded"]

  # --- EquipmentStock ---
  - method: POST
    path: "/equipment-stocks"
    description: "Register depot equipment stock"
    roles: [CityAdmin]
    code: 201
    input: [depot_name, equipment_kind, total_units]
    output: EquipmentStock
    side_effects: ["reserved_units=0, out_units=0, available_units=total_units"]
  - method: GET
    path: "/equipment-stocks"
    description: "List stocks (optional kind filter)"
    roles: [Organizer, TrafficReviewer, SafetyReviewer, PermitOfficer, DepotOfficer, CityAdmin]
    code: 200
    input: ["equipment_kind?"]
    output: EquipmentStock[]
    side_effects: []
  - method: GET
    path: "/equipment-stocks/{id}"
    description: "Get a stock (computed counters evaluated against the logical clock)"
    roles: [Organizer, TrafficReviewer, SafetyReviewer, PermitOfficer, DepotOfficer, CityAdmin]
    code: 200
    input: []
    output: EquipmentStock
    side_effects: []
  - method: GET
    path: "/equipment-stocks/{id}/equipment-reservations"
    description: "List reservations drawn on a stock"
    roles: [PermitOfficer, DepotOfficer, CityAdmin]
    code: 200
    input: []
    output: EquipmentReservation[]
    side_effects: []

  # --- EquipmentReservation ---
  - method: POST
    path: "/permit-applications/{id}/equipment-reservations"
    description: "Reserve equipment; server selects the stock per calculations.equipment_stock_selector; application must be UNDER_REVIEW/SUSPENDED/APPROVED"
    roles: [Organizer]
    code: 201
    input: [equipment_kind, units]
    output: EquipmentReservation
    side_effects: ["reservation_status=HELD; billing_status=UNBILLED; stock_id assigned by selector"]
  - method: GET
    path: "/permit-applications/{id}/equipment-reservations"
    description: "List reservations of an application"
    roles: [Organizer, PermitOfficer, DepotOfficer, CityAdmin]
    code: 200
    input: []
    output: EquipmentReservation[]
    side_effects: []
  - method: GET
    path: "/equipment-reservations/{id}"
    description: "Get a reservation"
    roles: [Organizer, PermitOfficer, DepotOfficer, CityAdmin]
    code: 200
    input: []
    output: EquipmentReservation
    side_effects: []
  - method: POST
    path: "/equipment-reservations/{id}/cancel"
    description: "Cancel a HELD reservation (pre-issuance only)"
    roles: [Organizer]
    code: 200
    input: []
    output: EquipmentReservation
    side_effects: ["reservation_status HELD -> CANCELLED; stock reservation released"]
  - method: POST
    path: "/equipment-reservations/{id}/pay"
    description: "Pay an invoice (simulated)"
    roles: [Organizer]
    code: 200
    input: []
    output: EquipmentReservation
    side_effects: ["billing_status INVOICED -> PAID"]
  - method: POST
    path: "/equipment-reservations/{id}/waive"
    description: "Waive a small invoice (<= 500 cents)"
    roles: [PermitOfficer]
    code: 200
    input: []
    output: EquipmentReservation
    side_effects: ["billing_status INVOICED -> WAIVED; ERR_WAIVER_AMOUNT_TOO_LARGE when invoice_cents > 500"]
  - method: POST
    path: "/equipment-reservations/{id}/dispatch"
    description: "Dispatch equipment within the dispatch window"
    roles: [DepotOfficer]
    code: 200
    input: []
    output: EquipmentReservation
    side_effects: ["reservation_status CONFIRMED -> DISPATCHED; dispatched_by/dispatched_at/return_due_at set; stock out_units += units"]
  - method: POST
    path: "/equipment-reservations/{id}/return"
    description: "Record equipment return; computes late_days and posts LATE_EQUIPMENT / SHORTAGE charges"
    roles: [DepotOfficer]
    code: 200
    input: [returned_units]
    output: EquipmentReservation
    side_effects: ["reservation_status DISPATCHED -> RETURNED; stock out_units -= returned_units; charges may post to HELD deposit; possible deposit FORFEITED cascade to Organizer standing"]
  - method: POST
    path: "/equipment-reservations/{id}/verify-return"
    description: "Verify a return (must be a different DepotOfficer than the dispatcher; billing must be settled)"
    roles: [DepotOfficer]
    code: 200
    input: []
    output: EquipmentReservation
    side_effects: ["reservation_status RETURNED -> CLOSED; return_verified_by recorded"]

  # --- CostSharePool / Contribution ---
  - method: POST
    path: "/permit-applications/{id}/cost-share-pools"
    description: "Create the shared-cost pool (singleton; application UNDER_REVIEW/SUSPENDED/APPROVED/ISSUED)"
    roles: [Organizer]
    code: 201
    input: [target_cents]
    output: CostSharePool
    side_effects: ["status=OPEN; ERR_DUPLICATE_RESOURCE if one exists"]
  - method: GET
    path: "/permit-applications/{id}/cost-share-pools"
    description: "List cost-share pools of an application (0 or 1)"
    roles: [Organizer, Neighbor, PermitOfficer, CityAdmin]
    code: 200
    input: []
    output: CostSharePool[]
    side_effects: []
  - method: GET
    path: "/cost-share-pools/{id}"
    description: "Get a pool"
    roles: [Organizer, Neighbor, PermitOfficer, CityAdmin]
    code: 200
    input: []
    output: CostSharePool
    side_effects: []
  - method: POST
    path: "/cost-share-pools/{id}/contributions"
    description: "Contribute to an OPEN pool (payment simulated; auto-FUNDED at target)"
    roles: [Neighbor]
    code: 201
    input: [household_address, amount_cents]
    output: Contribution
    side_effects: ["Contribution status=PAID; pool.collected_cents += amount_cents; pool OPEN -> FUNDED when collected_cents >= target_cents"]
  - method: GET
    path: "/cost-share-pools/{id}/contributions"
    description: "List contributions of a pool"
    roles: [Organizer, Neighbor, PermitOfficer, CityAdmin]
    code: 200
    input: []
    output: Contribution[]
    side_effects: []
  - method: POST
    path: "/cost-share-pools/{id}/close"
    description: "Close a pool after the event (funds retained)"
    roles: [Organizer]
    code: 200
    input: []
    output: CostSharePool
    side_effects: ["status OPEN/FUNDED -> CLOSED"]

  # --- Deposit / ChargeEntry ---
  - method: POST
    path: "/permit-applications/{id}/deposits"
    description: "Create and fund the refundable deposit (singleton; application UNDER_REVIEW/SUSPENDED/APPROVED)"
    roles: [Organizer]
    code: 201
    input: []
    output: Deposit
    side_effects: ["required_cents computed per calculations.deposit_required; held_cents := required_cents; status=HELD; ERR_DUPLICATE_RESOURCE if one exists"]
  - method: GET
    path: "/permit-applications/{id}/deposits"
    description: "List deposits of an application (0 or 1)"
    roles: [Organizer, PermitOfficer, CityAdmin]
    code: 200
    input: []
    output: Deposit[]
    side_effects: []
  - method: GET
    path: "/deposits/{id}"
    description: "Get a deposit"
    roles: [Organizer, PermitOfficer, CityAdmin]
    code: 200
    input: []
    output: Deposit
    side_effects: []
  - method: POST
    path: "/deposits/{id}/settle"
    description: "Settle a deposit after the event (refund = held - charges)"
    roles: [PermitOfficer]
    code: 200
    input: []
    output: Deposit
    side_effects: ["status HELD -> SETTLED; refund_cents computed"]
  - method: GET
    path: "/deposits/{id}/charges"
    description: "List charge entries posted to a deposit"
    roles: [Organizer, PermitOfficer, CityAdmin]
    code: 200
    input: []
    output: ChargeEntry[]
    side_effects: []

  # --- PostEventReport ---
  - method: POST
    path: "/permit-applications/{id}/post-event-reports"
    description: "Submit the cleanup report (application ISSUED; current_utc in (event_end_at, event_end_at + 72h])"
    roles: [Organizer]
    code: 201
    input: [cleanup_completed, cleanup_notes]
    output: PostEventReport
    side_effects: ["inspection_result=PENDING; submitted_at := current_utc; ERR_REPORT_WINDOW_CLOSED outside the window; ERR_DUPLICATE_RESOURCE if one exists"]
  - method: GET
    path: "/permit-applications/{id}/post-event-reports"
    description: "List post-event reports of an application (0 or 1)"
    roles: [Organizer, PermitOfficer, CityAdmin]
    code: 200
    input: []
    output: PostEventReport[]
    side_effects: []
  - method: GET
    path: "/post-event-reports/{id}"
    description: "Get a post-event report"
    roles: [Organizer, PermitOfficer, CityAdmin]
    code: 200
    input: []
    output: PostEventReport
    side_effects: []
  - method: POST
    path: "/post-event-reports/{id}/inspect"
    description: "Inspect the report; FAILED posts the cleaning charge and may forfeit the deposit"
    roles: [PermitOfficer]
    code: 200
    input: [result, "cleaning_charge_cents?"]
    output: PostEventReport
    side_effects: ["inspection_result -> PASSED/FAILED; FAILED with cleaning_charge_cents > 0 posts ChargeEntry CLEANING to a HELD deposit; possible FORFEITED cascade to Organizer standing"]

# =============================================================================
# 1.6 Error Code Catalog
# =============================================================================
errors:
  - { id: ERR_UNAUTHENTICATED, http: 401, condition: "X-User-Role or X-User-ID missing, or X-User-Role is not a recognized role" }
  - { id: ERR_UNAUTHORIZED, http: 403, condition: "Role is recognized but not permitted for this endpoint" }
  - { id: ERR_NOT_RESOURCE_OWNER, http: 403, condition: "Entity-backed caller (Organizer) does not own the target resource" }
  - { id: ERR_NOT_FOUND, http: 404, condition: "Path resource id does not exist (validated left-to-right)" }
  - { id: ERR_INVALID_REQUEST, http: 400, condition: "Missing required field, invalid enum value, or numeric constraint violation (e.g. expected_attendance <= 0, returned_units out of range)" }
  - { id: ERR_EVENT_WINDOW_INVALID, http: 400, condition: "event_end_at <= event_start_at or duration > 12h" }
  - { id: ERR_INVALID_STATE, http: 409, condition: "Resource is not in a state that permits the requested transition" }
  - { id: ERR_STALE_APPLICATION_VERSION, http: 412, condition: "expected_application_version does not match the application's current version (OCC)" }
  - { id: ERR_DUPLICATE_RESOURCE, http: 409, condition: "Singleton child already exists for the application (traffic control plan, sound plan, cost-share pool, deposit, post-event report)" }
  - { id: ERR_DUPLICATE_SIGNATURE, http: 409, condition: "An ACTIVE signature with the same (household_address, signer_email) already exists on the petition" }
  - { id: ERR_SIGNATURE_THRESHOLD_NOT_MET, http: 409, condition: "Support metric (per petition.support_mode) is below required_signatures at submit or verify" }
  - { id: ERR_PETITION_NOT_VERIFIED, http: 409, condition: "Linked petition is not VERIFIED (application submit/approve/issue gate)" }
  - { id: ERR_PETITION_LOCKED, http: 409, condition: "Signature create/withdraw attempted on a LOCKED petition" }
  - { id: ERR_LEAD_TIME_INSUFFICIENT, http: 422, condition: "event_start_at is earlier than current_utc + LEAD_DAYS[jurisdiction] * 24h (CITY 14, COUNTY 28, STATE_ROUTE 45)" }
  - { id: ERR_SEGMENT_WINDOW_CONFLICT, http: 409, condition: "Half-open window overlap with another application on the same segment in {UNDER_REVIEW, SUSPENDED, APPROVED, ISSUED}" }
  - { id: ERR_EMERGENCY_LANE_VIOLATION, http: 422, condition: "emergency_lane_continuous is false or emergency_lane_width_m < 6.0" }
  - { id: ERR_BARRICADE_PLAN_INSUFFICIENT, http: 422, condition: "barricade_count below ceil(segment.length_m / 12) + (intersects_arterial ? 4 : 0)" }
  - { id: ERR_SOUND_NOT_REQUESTED, http: 409, condition: "Sound plan created for an application with amplified_sound == false" }
  - { id: ERR_SOUND_DB_EXCEEDED, http: 422, condition: "max_db_at_property_line > 70" }
  - { id: ERR_SOUND_CUTOFF_VIOLATION, http: 422, condition: "planned_sound_end past the cutoff for the event day (22:00 Fri/Sat, 21:00 otherwise)" }
  - { id: ERR_INSURANCE_COVERAGE_INSUFFICIENT, http: 422, condition: "APPROVE attempted on a CERTIFICATE with coverage_amount_cents < 100000000" }
  - { id: ERR_INSURANCE_EXPIRED, http: 422, condition: "APPROVE attempted on a CERTIFICATE whose expires_on is before the event date" }
  - { id: ERR_WAIVER_INELIGIBLE, http: 422, condition: "APPROVE attempted on a WAIVER_REQUEST when expected_attendance > 75 or alcohol_served or segment not RESIDENTIAL" }
  - { id: ERR_INSURANCE_NOT_SATISFIED, http: 409, condition: "Approve gate: no non-SUPERSEDED insurance record in VERIFIED or WAIVER_GRANTED" }
  - { id: ERR_EQUIPMENT_UNAVAILABLE, http: 409, condition: "Equipment selector found no stock of the requested kind with sufficient window-available units" }
  - { id: ERR_DISPATCH_WINDOW_VIOLATION, http: 422, condition: "Dispatch attempted outside [event_start_at - 48h, event_start_at]" }
  - { id: ERR_SOD_SAME_OFFICER, http: 403, condition: "verify-return attempted by the same DepotOfficer X-User-ID recorded in dispatched_by (segregation of duties)" }
  - { id: ERR_BILLING_UNSETTLED, http: 409, condition: "verify-return attempted while billing_status is INVOICED (must be PAID or WAIVED)" }
  - { id: ERR_WAIVER_AMOUNT_TOO_LARGE, http: 422, condition: "Waive attempted on an invoice_cents > 500" }
  - { id: ERR_CONTRIBUTION_BELOW_MIN, http: 400, condition: "Contribution amount_cents < 100" }
  - { id: ERR_POOL_NOT_OPEN, http: 409, condition: "Contribution attempted on a pool whose status is not OPEN" }
  - { id: ERR_DEPOSIT_REQUIRED, http: 409, condition: "Approve gate: no deposit in HELD status" }
  - { id: ERR_TCP_NOT_APPROVED, http: 409, condition: "Approve gate: traffic control plan missing or not TCP_APPROVED" }
  - { id: ERR_SOUND_PLAN_NOT_APPROVED, http: 409, condition: "Approve gate: amplified_sound is true but sound plan missing or not SOUND_APPROVED" }
  - { id: ERR_EQUIPMENT_NOT_RESERVED, http: 409, condition: "Approve gate: HELD/CONFIRMED reservation units do not cover the TCP planned counts per kind" }
  - { id: ERR_COMPLETION_PRECONDITIONS, http: 409, condition: "Complete gate unmet: report not PASSED, reservations not all terminal, deposit unsettled, or pool open" }
  - { id: ERR_REPORT_WINDOW_CLOSED, http: 422, condition: "Post-event report submitted outside (event_end_at, event_end_at + 72h]" }
  - { id: ERR_ORGANIZER_SUSPENDED, http: 403, condition: "Organizer standing == SUSPENDED cannot create petitions or applications" }

# =============================================================================
# 1.7 RBAC Matrix
# =============================================================================
roles:
  - name: Anonymous
    description: "Unauthenticated registrant"
    identity: opaque
    exclusive_operations:
      - "POST /organizers"
    shared_operations: []
  - name: Organizer
    description: "Resident who applies for the block party permit; owns petitions, applications, plans, reservations, pool, deposit, report"
    identity: "entity_backed:Organizer"
    exclusive_operations:
      - "POST /petitions; POST /petitions/{id}/submit; POST /petitions/{id}/cure"
      - "POST /permit-applications; PATCH /permit-applications/{id}; POST /permit-applications/{id}/submit; POST /permit-applications/{id}/cancel"
      - "POST /permit-applications/{id}/traffic-control-plans; PATCH /traffic-control-plans/{id}; POST /traffic-control-plans/{id}/submit"
      - "POST /permit-applications/{id}/sound-plans; POST /sound-plans/{id}/submit"
      - "POST /permit-applications/{id}/insurance-certificates"
      - "POST /permit-applications/{id}/equipment-reservations; POST /equipment-reservations/{id}/cancel; POST /equipment-reservations/{id}/pay"
      - "POST /permit-applications/{id}/cost-share-pools; POST /cost-share-pools/{id}/close"
      - "POST /permit-applications/{id}/deposits"
      - "POST /permit-applications/{id}/post-event-reports"
    shared_operations:
      - "GET on own resources (organizer, petitions, applications, plans, reservations, pool, deposit, charges, report, segments, stocks)"
  - name: Neighbor
    description: "Block resident who signs petitions and contributes to the shared-cost pool"
    identity: opaque
    exclusive_operations:
      - "POST /petitions/{id}/signatures; POST /petitions/{id}/signatures/{signatureId}/withdraw"
      - "POST /cost-share-pools/{id}/contributions"
    shared_operations:
      - "GET /petitions/{id}; GET /petitions/{id}/signatures; GET /street-segments/{id}; GET /cost-share-pools/{id}; GET /cost-share-pools/{id}/contributions"
  - name: TrafficReviewer
    description: "City traffic engineer reviewing traffic control plans"
    identity: opaque
    exclusive_operations:
      - "POST /traffic-control-plans/{id}/review"
    shared_operations:
      - "GET on applications, plans, segments, stocks"
  - name: SafetyReviewer
    description: "Police/fire safety reviewer for sound plans and insurance records"
    identity: opaque
    exclusive_operations:
      - "POST /sound-plans/{id}/review; POST /insurance-certificates/{id}/review"
    shared_operations:
      - "GET on applications, sound plans, insurance records, segments, stocks"
  - name: PermitOfficer
    description: "Permit office adjudicator; segregated from plan review and depot operations"
    identity: opaque
    exclusive_operations:
      - "POST /petitions/{id}/verify"
      - "POST /permit-applications/{id}/approve; POST /permit-applications/{id}/deny; POST /permit-applications/{id}/issue; POST /permit-applications/{id}/revoke; POST /permit-applications/{id}/complete"
      - "POST /equipment-reservations/{id}/waive"
      - "POST /deposits/{id}/settle; POST /post-event-reports/{id}/inspect"
    shared_operations:
      - "GET on all resources; GET /permit-applications (list with filters)"
  - name: DepotOfficer
    description: "Public works depot officer for equipment logistics; dispatch and return-verification must be performed by different officer ids (segregation of duties)"
    identity: opaque
    exclusive_operations:
      - "POST /equipment-reservations/{id}/dispatch; POST /equipment-reservations/{id}/return; POST /equipment-reservations/{id}/verify-return"
    shared_operations:
      - "GET on applications, reservations, stocks"
  - name: CityAdmin
    description: "City platform administrator for configuration and test-driving hooks"
    identity: opaque
    exclusive_operations:
      - "POST /street-segments; POST /equipment-stocks"
      - "POST /_clock/set_current_utc; POST /_inject/organizer_forfeiture"
    shared_operations:
      - "GET on all resources"
