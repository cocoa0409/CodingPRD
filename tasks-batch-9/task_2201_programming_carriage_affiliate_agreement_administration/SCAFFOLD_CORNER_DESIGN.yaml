              as_user_id: "u-admin-1"
          trigger:
            - call: "POST /carriage/invoices/${inv_id}/lifecycle"
              payload:
                action: "WRITE_OFF"
              as: RevenueAccountant
              as_user_id: "u-rev-1"
            - call: "POST /_clock/set_current_utc"
              payload:
                to_iso8601: "2026-11-29T00:00:00Z"
