      - name: local_registration_rejections_not_required_jurisdiction_and_every_wrong_from_state
        claim_type: violation_to_error
        grounds:
          - validations[priority=17]
          - validations[priority=42]
          - errors.ERR_LOCAL_REGISTRATION_NOT_REQUIRED
          - errors.ERR_REGISTRATION_STATE_INVALID
          - state_machines.LocalRegistration
        distinguishing_aspect: |
          Filing is a jurisdiction-conditional capability: an identical, perfectly valid filing against a
          certificate in a jurisdiction with requires_local_registration false is 409
          ERR_LOCAL_REGISTRATION_NOT_REQUIRED, not a silently created row. Once a registration exists, each of
          its three actions has its own legal from-set (posting from {FILED, DELINQUENT}, verification from
          POSTED, refiling from REJECTED), and every wrong pairing collapses to ERR_REGISTRATION_STATE_INVALID
          — including posting a REJECTED registration, which must be refiled first. The closing refile proves
          the REJECTED -> FILED hop bumps refile_count and clears rejection_reason.
