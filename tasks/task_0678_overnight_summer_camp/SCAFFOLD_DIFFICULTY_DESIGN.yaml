              as: CampDirector
            - call: "POST /sessions/${sess_id}/open-enrollment"
              payload: { expected_session_version: "${sess_v0}" }
              as: CampDirector
            - call: "POST /guardians/register"
              payload: { email: "g16@x.com", full_name: "Guardian Sixteen", phone: "555-1616" }
              as: Anonymous
              captures: { g16_id: $.data.id }
            - call: "POST /campers"
              payload: { full_name: "Camper Sixteen", age: 10, gender: "BOY" }
              as: Guardian
              as_user_id: "${g16_id}"
              captures: { c16_id: $.data.id }
            - call: "POST /health-forms"
              payload: { camper_id: "${c16_id}" }
              as: Guardian
              as_user_id: "${g16_id}"
              captures: { hf16_id: $.data.id }
            - call: "POST /health-forms/${hf16_id}/submit"
              payload: {}
              as: Guardian
              as_user_id: "${g16_id}"
            - call: "POST /applications"
              payload: { camper_id: "${c16_id}", session_id: "${sess_id}" }
              as: Guardian
              as_user_id: "${g16_id}"
              captures: { app16_id: $.data.id }
            - call: "POST /applications/${app16_id}/submit"
              payload: {}
              as: Guardian
              as_user_id: "${g16_id}"
            - call: "POST /canteen-accounts"
              payload: { application_id: "${app16_id}" }
              as: Guardian
              as_user_id: "${g16_id}"
              captures: { acct16_id: $.data.id }
            - call: "POST /canteen-accounts/${acct16_id}/transactions"
              payload: { kind: "DEPOSIT", amount_cents: 3000 }
              as: Guardian
              as_user_id: "${g16_id}"
          trigger:
            - call: "POST /canteen-accounts/${acct16_id}/transactions"
