      - name: safety_beats_constraint_on_experiment_lock_design
        grounds:
          - "validations[priority=52]"
          - "validations[priority=60]"
          - "errors.ERR_EXPERIMENT_UNDERPOWERED"
          - "errors.ERR_HOLDOUT_SHARE_EXCEEDED"
          - "calculations.experiment_power"
          - "global_constants.MAX_HOLDOUT_POPULATION_PCT"
        distinguishing_aspect: |
          A single POST /mmm/experiments/{id}/lock-design violates BOTH the business_safety
          rule at priority 52 (mde 1.0 over arms of 1500000 gives power_index 1.2372 ->
          computed_power 0.4500 < 0.80) AND the business_constraint rule at priority 60 (planned
          3000000 held-out people is 30 percent of a 10000000 market against a 20 percent cap),
          and the response is 422 ERR_EXPERIMENT_UNDERPOWERED - a DIFFERENT category pair from
          the state-versus-fiscal instance - while an otherwise identical design with mde 5.0
          (power_index 6.1859 -> 0.9500) returns ERR_HOLDOUT_SHARE_EXCEEDED, proving priority 60
          was reachable.
        test_recipe:
          setup:
            - "Market US_CORE with total_population 10000000 and held_out_population 0; channel A_SEARCH exists."
            - "Three GEO_HOLDOUT DIFF_IN_DIFF experiments on A_SEARCH with pairwise DISJOINT intervals so the priority-65 window check never fires: exp_both 2026-09-07 to 2026-10-05, exp_share 2026-10-12 to 2026-11-09, exp_ok 2026-11-16 to 2026-12-14, each washout_days 7."
            - "exp_both: mde 1.0 with planned arms 1500000/1500000 - violates BOTH rules."
            - "exp_share: mde 5.0 with the same oversized arms - violates only priority 60."
            - "exp_ok: mde 5.0 with planned arms 1000000/1000000 - violates neither and lands exactly on the 20 percent cap."
            - "No GeoCell exists: the lock-design share test reads Market.held_out_population plus the PLANNED arm sizes, never actual cells."
          setup_api_calls:
            - call: "POST /mmm/markets"
              payload: { market_code: "US_CORE", name: "US Core Brand Market", total_population: 10000000, annual_budget_ceiling_cents: 5000000000, currency_code: "USD" }
