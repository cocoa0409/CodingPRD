# =============================================================================
# §1.8 Scaffold Difficulty Design (Test Targeting Index)
# Task: task_3106_integrated_payer_provider_budgeting_internal_referral_management
#
# 9 rule_ids x 2 instances = 18 instances. Every grounds ref resolves into
# SCAFFOLD.yaml §1.1-§1.7. Every setup_api_calls / trigger chain drives
# empty-DB into the described state using only §1.5 endpoints.
# =============================================================================
scaffold_difficulty_design:

  # ===========================================================================
  - rule_id: dual_variant_calc
    instances:

      - name: dual_capitation_blind_average_vs_risk_adjusted_clamped
        grounds:
          - calculations.capitation_rate_cents
          - calculations.capitation_rate_cents.variants.blind_average
          - calculations.capitation_rate_cents.variants.risk_adjusted_clamped
          - entities.Member.fields.risk_score
          - entities.Member.fields.capitation_rate_cents
          - entities.Region.fields.premium_revenue_cents
        distinguishing_aspect: "The blind_average variant prices every member at the un-weighted COMMERCIAL_HMO base (42000) while the persisted risk_adjusted_clamped variant clamps 42000*2.0 = 84000 up to the 3.0-risk member's raw 42000+84000 = 126000 and prices the 0.6-risk member at 67200 — three different numbers for identical member data."
        test_recipe:
          setup:
            - "Empty database; logical clock at its 2026-09-01T00:00:00Z default."
            - "One OPEN region with capitation_index 1.0; one MEDICAL_OFFICE care site; one PROVIDER with specialty COMMERCIAL_HMO-compatible PRIMARY_CARE panel."
          setup_api_calls:
            - call: "POST /regions"
              payload: { name: "Northern Region", state_codes: ["WA", "OR"], margin_target_pct: 0.03, capitation_index: 1.0 }
              as: PlatformAdmin
              captures: { r1: $.data.id, r1_v: $.data.version }
            - call: "POST /regions/${r1}/care-sites"
              payload: { site_name: "Northern Medical Office", site_type: "MEDICAL_OFFICE", licensed_beds: 0, staffing_fte_budget: 10.0, facility_investment_budget_cents: 5000000 }
              as: RegionalFinanceOfficer
              captures: { cs1: $.data.id }
            - call: "POST /care-sites/${cs1}/departments"
              payload: { specialty: "PRIMARY_CARE", appointment_slots_budgeted: 200, wait_threshold_days: 14 }
              as: AccessScheduler
              captures: { d1: $.data.id }
            - call: "POST /care-sites/${cs1}/providers"
              payload: { provider_name: "Dr Alice Ng", specialty: "PRIMARY_CARE", compensation_model: "PANEL_CAPITATION", base_component_cents: 4000000, panel_size_target: 1200 }
              as: RegionalFinanceOfficer
              captures: { p1: $.data.id }
            - call: "POST /regions/${r1}/members"
              payload: { member_ref: "M-CA-1", attributed_provider_id: "${p1}", plan_product: "COMMERCIAL_HMO", benefit_tier: "TIER_1", risk_score: 0.6, coverage_effective_date: "2026-09-01T00:00:00Z" }
              as: RegionalFinanceOfficer
              captures: { m1: $.data.id, m1_v: $.data.version }
            - call: "POST /regions/${r1}/members"
              payload: { member_ref: "M-CA-2", attributed_provider_id: "${p1}", plan_product: "COMMERCIAL_HMO", benefit_tier: "TIER_1", risk_score: 3.0, coverage_effective_date: "2026-09-01T00:00:00Z" }
              as: RegionalFinanceOfficer
              captures: { m2: $.data.id, m2_v: $.data.version }
          trigger:
            - call: "POST /_inject/member-risk-score"
              payload: { member_id: "${m1}", risk_score: 0.6 }
              as: PlatformAdmin
            - call: "GET /regions/${r1}"
              payload: {}
              as: RegionalFinanceOfficer
              captures: { r1_premium: $.data.premium_revenue_cents, r1_computed_margin: $.data.computed_margin_cents, r1_settled_margin: $.data.operating_margin_cents }
          assert:
            - "Member.${m1}.capitation_rate_cents (risk_score 0.6) == 67200"
            - "Member.${m2}.capitation_rate_cents (risk_score 3.0) == 126000"
            - "the blind_average estimate for the same two members == 42000 + 42000 == 84000"
            - "Region.${r1}.premium_revenue_cents == 193200 and is unchanged by the inject call"
            - "the risk_adjusted_clamped total (193200) != the blind_average total (84000) for identical member data"

      - name: dual_claim_provisional_pct_vs_final_deductible
        grounds:
          - calculations.outside_services_liability
          - calculations.outside_services_liability.variants.provisional_pct_of_billed
          - calculations.outside_services_liability.variants.final_deductible_chronological
          - entities.OutsideServiceClaim.fields.provisional_liability_cents
          - entities.OutsideServiceClaim.fields.final_liability_cents
        distinguishing_aspect: "For one 520000-cent self-pay claim the provisional_pct_of_billed variant books 520000 * 0.70 = 364000 while the final_deductible_chronological variant pins 200000 — two different liability numbers for identical claim data, and the delta is not a constant ratio."
        test_recipe:
          setup:
            - "Empty database; logical clock at its 2026-09-01T00:00:00Z default."
            - "One OPEN region with an approved operating budget and its outside-services budget line."
          setup_api_calls:
            - call: "POST /regions"
              payload: { name: "Coastal Region", state_codes: ["CA"], margin_target_pct: 0.03, capitation_index: 1.0 }
              as: PlatformAdmin
              captures: { r1: $.data.id, r1_v: $.data.version }
            - call: "POST /regions/${r1}/care-sites"
              payload: { site_name: "Coastal Medical Center", site_type: "MEDICAL_CENTER", licensed_beds: 120, staffing_fte_budget: 40.0, facility_investment_budget_cents: 20000000 }
              as: RegionalFinanceOfficer
              captures: { cs1: $.data.id }
            - call: "POST /care-sites/${cs1}/departments"
              payload: { specialty: "PRIMARY_CARE", appointment_slots_budgeted: 400, wait_threshold_days: 14 }
              as: AccessScheduler
              captures: { d1: $.data.id }
            - call: "POST /care-sites/${cs1}/providers"
              payload: { provider_name: "Dr Ben Ortiz", specialty: "PRIMARY_CARE", compensation_model: "SALARY", base_component_cents: 5000000, panel_size_target: 1200 }
              as: RegionalFinanceOfficer
              captures: { p1: $.data.id }
            - call: "POST /regions/${r1}/members"
              payload: { member_ref: "M-CB-1", attributed_provider_id: "${p1}", plan_product: "COMMERCIAL_HMO", benefit_tier: "TIER_2", risk_score: 1.0, coverage_effective_date: "2026-09-01T00:00:00Z" }
              as: RegionalFinanceOfficer
              captures: { m1: $.data.id, m1_v: $.data.version }
            - call: "POST /regions/${r1}/regional-budgets"
              payload: { period: "2026-09", staffing_budget_cents: 50000000, outside_services_budget_cents: 20000000, facility_investment_cents: 20000000, system_deductible_cents: 0 }
              as: RegionalFinanceOfficer
              captures: { rb1: $.data.id }
            - call: "POST /regional-budgets/${rb1}/submit"
              payload: {}
              as: RegionalFinanceOfficer
            - call: "POST /regional-budgets/${rb1}/approve"
              payload: {}
              as: BudgetAppropriationsCommittee
          trigger:
            - call: "POST /regions/${r1}/outside-service-claims"
              payload: { member_id: "${m1}", vendor_name: "Coastal Vendor A", service_code: "RADIOLOGY", claim_type: "CONTRACTED", emergency_flag: false, billed_amount_cents: 520000, provider_type: "NON_CONTRACTED", claim_line_number: 1, emergency_inject_once: false, derived_claim_type: "CONTRACTED", expected_member_version: "${m1_v}" }
              as: RegionalFinanceOfficer
              captures: { c1: $.data.id, c1_prov: $.data.provisional_liability_cents }
            - call: "POST /outside-service-claims/${c1}/adjudicate"
              payload: {}
              as: RegionalFinanceOfficer
              captures: { c1_final: $.data.final_liability_cents }
          assert:
            - "OutsideServiceClaim.${c1}.provisional_liability_cents == 364000"
            - "OutsideServiceClaim.${c1}.final_liability_cents == 200000"
            - "OutsideServiceClaim.${c1}.status == ADJUDICATED"
            - "the two variants differ for identical claim data and the delta (164000) is not proportional to the billed amount"
            - "OutsideServiceClaim.${c1}.provisional_liability_cents != OutsideServiceClaim.${c1}.final_liability_cents"

  # ===========================================================================
  - rule_id: combinatorial_formula
    instances:

      - name: combinatorial_per_diem_cap_plus_interim_threshold_credit
        grounds:
          - calculations.referential_integration_settlement
          - entities.ReferentialIntegration.fields.settlement_account_cents
          - entities.Region.fields.referential_integration_credit_cents
        distinguishing_aspect: "Mode (a) pairing: the per-diem cap min() saturates at 4500000 while the interim-volume threshold branch multiplies only the basis component (1.5x, not the whole settlement), producing 6300000 rather than the 8700000 a whole-settlement multiplier would give."
        test_recipe:
          setup:
            - "Empty database; logical clock at its 2026-09-01T00:00:00Z default."
            - "One OPEN region."
          setup_api_calls:
            - call: "POST /regions"
              payload: { name: "Cascade Region", state_codes: ["OR"], margin_target_pct: 0.02, capitation_index: 1.0 }
              as: PlatformAdmin
              captures: { r1: $.data.id, r1_v: $.data.version }
            - call: "POST /regions/${r1}/referential-integrations"
              payload: { integration_type: "MEDICAL_GROUP", risk_sharing_model: "CAPITATED", bound_effective_date: "2026-09-01T00:00:00Z", cost_reporting_basis_cents: 10000000, shared_savings_rate: 0.20, per_diem_days: 10, per_diem_rate_cents: 500000, per_diem_cap_cents: 4500000, interim_claim_count: 50 }
              as: BudgetAppropriationsCommittee
              captures: { ri1: $.data.id, ri1_settlement: $.data.settlement_account_cents }
          trigger:
            - call: "POST /referential-integrations/${ri1}/bind"
              payload: {}
              as: BudgetAppropriationsCommittee
            - call: "GET /regions/${r1}"
              payload: {}
              as: BudgetAppropriationsCommittee
              captures: { r1_credit: $.data.referential_integration_credit_cents, r1_computed_margin: $.data.computed_margin_cents }
          assert:
            - "ReferentialIntegration.${ri1}.settlement_account_cents == 6300000"
            - "the per-diem component saturates at 4500000 (min(10*500000, 4500000)) rather than the uncapped 5000000"
            - "the basis component == 1800000 (round_half_up(10000000 * 0.12 * 1.5) with interim_claim_count 50 > 40)"
            - "Region.${r1}.referential_integration_credit_cents == 6300000 after bind"
            - "a whole-settlement interim multiplier would have produced 8700000, so the pinned evaluation order is observable"

      - name: combinatorial_provider_panel_capitation_then_bonus_on_base_plus_panel
        grounds:
          - calculations.provider_comp_total_cents
          - entities.Provider.fields.panel_capitation_component_cents
          - entities.Provider.fields.quality_bonus_cents
          - entities.Provider.fields.comp_total_cents
        distinguishing_aspect: "Mode (a) nested-dependency: quality_bonus_cents is keyed on (base + panel), and the panel component is itself clamped by the derived panel_size_assigned, so the same 2.0% bonus rate yields 560000 here rather than the 80000 a bonus keyed on base alone would give."
        test_recipe:
          setup:
            - "Empty database; logical clock at its 2026-09-01T00:00:00Z default."
            - "One OPEN region with a MEDICAL_CENTER care site and one CARDIOLOGY department and provider."
          setup_api_calls:
            - call: "POST /regions"
              payload: { name: "Valley Region", state_codes: ["AZ"], margin_target_pct: 0.03, capitation_index: 1.0 }
              as: PlatformAdmin
              captures: { r1: $.data.id, r1_v: $.data.version }
            - call: "POST /regions/${r1}/care-sites"
              payload: { site_name: "Valley Medical Center", site_type: "MEDICAL_CENTER", licensed_beds: 90, staffing_fte_budget: 30.0, facility_investment_budget_cents: 15000000 }
              as: RegionalFinanceOfficer
              captures: { cs1: $.data.id }
            - call: "POST /care-sites/${cs1}/departments"
              payload: { specialty: "CARDIOLOGY", appointment_slots_budgeted: 300, wait_threshold_days: 21 }
              as: AccessScheduler
              captures: { d1: $.data.id }
            - call: "POST /care-sites/${cs1}/providers"
              payload: { provider_name: "Dr Cara Lopez", specialty: "CARDIOLOGY", compensation_model: "QUALITY_BONUS", base_component_cents: 4000000, panel_size_target: 800 }
              as: RegionalFinanceOfficer
              captures: { p1: $.data.id }
            - call: "POST /regions/${r1}/members"
              payload: { member_ref: "M-CC-1", attributed_provider_id: "${p1}", plan_product: "COMMERCIAL_HMO", benefit_tier: "TIER_1", risk_score: 1.0, coverage_effective_date: "2026-09-01T00:00:00Z" }
              as: RegionalFinanceOfficer
              captures: { m1: $.data.id }
            - call: "POST /regions/${r1}/quality-metrics"
              payload: { metric_code: "QUALITY_COMPOSITE", period: "2026-09", target_value: 80, accountable_provider_id: "${p1}" }
              as: QualityReviewBoard
              captures: { qm1: $.data.id }
            - call: "PATCH /_outcome-targets/${qm1}"
              payload: { measured_value: 90, weighted_component_score: 90 }
              as: PlatformAdmin
          trigger:
            - call: "POST /quality-metrics/${qm1}/finalize"
              payload: {}
              as: QualityReviewBoard
            - call: "GET /providers/${p1}"
              payload: {}
              as: RegionalFinanceOfficer
              captures: { p1_panel: $.data.panel_capitation_component_cents, p1_bonus: $.data.quality_bonus_cents, p1_total: $.data.comp_total_cents, p1_score: $.data.quality_score, p1_volume: $.data.volume_component_cents }
          assert:
            - "Provider.${p1}.quality_score == 90, at or above the 85 QUALITY_BONUS_THRESHOLD"
            - "Provider.${p1}.panel_capitation_component_cents == 2800000 with panel_size_assigned == 2"
            - "Provider.${p1}.quality_bonus_cents == 560000 (0.10 of base 2800000 + panel 2800000)"
            - "Provider.${p1}.comp_total_cents == 7360000 and volume_component_cents == 0"
            - "a bonus keyed on base alone would have produced 400000, so the nested evaluation order is observable"

  # ===========================================================================
  - rule_id: non_linear_state_machine
    instances:

      - name: non_linear_referral_deny_appeal_authorize_cycle
        grounds:
          - state_machines.Referral.DENIED_to_APPEALED
          - state_machines.Referral.APPEALED_to_AUTHORIZED
          - state_machines.Referral.APPEALED_to_DENIED
          - entities.Referral.fields.appeal_rounds
        distinguishing_aspect: "Referral is a two-state negotiation cycle: a member's authorization walks PENDING_TRIAGE -> DENIED -> APPEALED -> AUTHORIZED, so the machine revisits the decision process rather than advancing along a linear pipeline; appeal_rounds records each loop."
        test_recipe:
          setup:
            - "Empty database; logical clock at its 2026-09-01T00:00:00Z default."
            - "One OPEN region with an ORTHOPEDICS department that accepts internal referrals, plus a member."
          setup_api_calls:
            - call: "POST /regions"
              payload: { name: "Sound Region", state_codes: ["WA"], margin_target_pct: 0.03, capitation_index: 1.0 }
              as: PlatformAdmin
              captures: { r1: $.data.id, r1_v: $.data.version }
            - call: "POST /regions/${r1}/care-sites"
              payload: { site_name: "Sound Medical Center", site_type: "MEDICAL_CENTER", licensed_beds: 80, staffing_fte_budget: 25.0, facility_investment_budget_cents: 12000000 }
              as: RegionalFinanceOfficer
              captures: { cs1: $.data.id }
            - call: "POST /care-sites/${cs1}/departments"
              payload: { specialty: "PRIMARY_CARE", appointment_slots_budgeted: 200, wait_threshold_days: 14 }
              as: AccessScheduler
              captures: { d_req: $.data.id }
            - call: "POST /care-sites/${cs1}/departments"
              payload: { specialty: "ORTHOPEDICS", appointment_slots_budgeted: 100, wait_threshold_days: 21 }
              as: AccessScheduler
              captures: { d_orth: $.data.id }
            - call: "POST /care-sites/${cs1}/providers"
              payload: { provider_name: "Dr Dan Reed", specialty: "ORTHOPEDICS", compensation_model: "PANEL_CAPITATION", base_component_cents: 4500000, panel_size_target: 900 }
              as: RegionalFinanceOfficer
              captures: { p1: $.data.id }
            - call: "POST /regions/${r1}/members"
              payload: { member_ref: "M-CD-1", attributed_provider_id: "${p1}", plan_product: "COMMERCIAL_HMO", benefit_tier: "TIER_1", risk_score: 1.0, coverage_effective_date: "2026-09-01T00:00:00Z" }
              as: RegionalFinanceOfficer
              captures: { m1: $.data.id, m1_v: $.data.version }
            - call: "POST /referrals"
              payload: { member_id: "${m1}", requesting_department_id: "${d_req}", target_department_id: "${d_orth}", service_code: "ORTHOPEDICS", referral_type: "INTERNAL", authorization_exception: false, exception_reason: "SERVICE_UNAVAILABLE_IN_NETWORK", external_contract_count: 0, expected_member_version: "${m1_v}" }
              as: AccessScheduler
              captures: { ref1: $.data.id, ref1_v: $.data.version }
          trigger:
            - call: "POST /referrals/${ref1}/deny"
              payload: {}
              as: UtilizationReviewer
            - call: "POST /referrals/${ref1}/appeal"
              payload: {}
              as: UtilizationReviewer
            - call: "POST /referrals/${ref1}/authorize"
              payload: {}
              as: UtilizationReviewer
              captures: { ref1_status: $.data.status, ref1_rounds: $.data.appeal_rounds, ref1_expires: $.data.expires_at }
            - call: "POST /referrals/${ref1}/appeal"
              payload: {}
              as: UtilizationReviewer
              captures: { ref1_err: $.data.error_id }
          assert:
            - "Referral.${ref1}.status == AUTHORIZED after the DENIED -> APPEALED -> AUTHORIZED cycle"
            - "Referral.${ref1}.appeal_rounds == 1"
            - "Referral.${ref1}.expires_at == Referral.${ref1}.created_at + 90 days"
            - "the revisit attempt returns status 409 with error_id == ERR_REFERRAL_NOT_DECIDABLE, proving the loop exits through AUTHORIZED rather than being a linear successor"

      - name: non_linear_claim_deny_appeal_adjudicate_cycle
        grounds:
          - state_machines.OutsideServiceClaim.DENIED_to_APPEALED
          - state_machines.OutsideServiceClaim.APPEALED_to_ADJUDICATED
          - state_machines.OutsideServiceClaim.APPEALED_to_DENIED
          - entities.OutsideServiceClaim.fields.appeal_rounds
        distinguishing_aspect: "OutsideServiceClaim runs an independent negotiation cycle: ADJUDICATED -> DENIED -> APPEALED -> ADJUDICATED, a different entity from Referral, so the scaffold carries more than one non-linear machine."
        test_recipe:
          setup:
            - "Empty database; logical clock at its 2026-09-01T00:00:00Z default."
            - "One OPEN region with an approved budget, a member, and one submitted 300000-cent claim."
          setup_api_calls:
            - call: "POST /regions"
              payload: { name: "Prairie Region", state_codes: ["KS"], margin_target_pct: 0.03, capitation_index: 1.0 }
              as: PlatformAdmin
              captures: { r1: $.data.id, r1_v: $.data.version }
            - call: "POST /regions/${r1}/care-sites"
              payload: { site_name: "Prairie Medical Center", site_type: "MEDICAL_CENTER", licensed_beds: 60, staffing_fte_budget: 20.0, facility_investment_budget_cents: 9000000 }
              as: RegionalFinanceOfficer
              captures: { cs1: $.data.id }
            - call: "POST /care-sites/${cs1}/departments"
              payload: { specialty: "PRIMARY_CARE", appointment_slots_budgeted: 150, wait_threshold_days: 14 }
              as: AccessScheduler
              captures: { d1: $.data.id }
            - call: "POST /care-sites/${cs1}/providers"
              payload: { provider_name: "Dr Eve Park", specialty: "PRIMARY_CARE", compensation_model: "SALARY", base_component_cents: 3800000, panel_size_target: 1000 }
              as: RegionalFinanceOfficer
              captures: { p1: $.data.id }
            - call: "POST /regions/${r1}/members"
              payload: { member_ref: "M-CE-1", attributed_provider_id: "${p1}", plan_product: "MEDICARE_ADVANTAGE", benefit_tier: "TIER_2", risk_score: 1.0, coverage_effective_date: "2026-09-01T00:00:00Z" }
              as: RegionalFinanceOfficer
              captures: { m1: $.data.id, m1_v: $.data.version }
            - call: "POST /regions/${r1}/regional-budgets"
              payload: { period: "2026-09", staffing_budget_cents: 80000000, outside_services_budget_cents: 40000000, facility_investment_cents: 9000000, system_deductible_cents: 0 }
              as: RegionalFinanceOfficer
              captures: { rb1: $.data.id }
            - call: "POST /regional-budgets/${rb1}/submit"
              payload: {}
              as: RegionalFinanceOfficer
            - call: "POST /regional-budgets/${rb1}/approve"
              payload: {}
              as: BudgetAppropriationsCommittee
            - call: "POST /regions/${r1}/outside-service-claims"
              payload: { member_id: "${m1}", vendor_name: "Prairie Vendor", service_code: "ONCOLOGY", claim_type: "CONTRACTED", emergency_flag: false, billed_amount_cents: 300000, provider_type: "NON_CONTRACTED", claim_line_number: 1, emergency_inject_once: false, derived_claim_type: "CONTRACTED", expected_member_version: "${m1_v}" }
              as: RegionalFinanceOfficer
              captures: { c1: $.data.id }
            - call: "POST /outside-service-claims/${c1}/adjudicate"
              payload: {}
              as: RegionalFinanceOfficer
          trigger:
            - call: "POST /outside-service-claims/${c1}/deny"
              payload: {}
              as: UtilizationReviewer
            - call: "POST /outside-service-claims/${c1}/appeal"
              payload: {}
              as: UtilizationReviewer
            - call: "POST /outside-service-claims/${c1}/adjudicate"
              payload: {}
              as: RegionalFinanceOfficer
              captures: { c1_status: $.data.status, c1_rounds: $.data.appeal_rounds, c1_final: $.data.final_liability_cents }
          assert:
            - "OutsideServiceClaim.${c1}.status == ADJUDICATED after the DENIED -> APPEALED -> ADJUDICATED cycle"
            - "OutsideServiceClaim.${c1}.appeal_rounds == 1"
            - "OutsideServiceClaim.${c1}.final_liability_cents == 30000 (round_half_up((300000 - 150000) * 0.20))"
            - "the machine revisits ADJUDICATED through a cycle rather than advancing linearly"

      - name: non_linear_referral_appeal_cycle_is_bounded_at_two_rounds
        grounds:
          - state_machines.Referral.DENIED_to_APPEALED
          - state_machines.Referral.APPEALED_to_DENIED
          - calculations.referral_authorization_rule
          - validations[priority=8c]
          - errors.ERR_APPEAL_ROUNDS_EXHAUSTED
        distinguishing_aspect: "The referral negotiation cycle terminates: after two DENIED -> APPEALED -> DENIED laps the third appeal is refused with ERR_APPEAL_ROUNDS_EXHAUSTED instead of looping forever, so appeal_rounds 2 is the pinned ceiling."
        test_recipe:
          setup:
            - "Empty database; logical clock at its 2026-09-01T00:00:00Z default."
            - "One OPEN region with an ORTHOPEDICS department that accepts internal referrals, plus a member and a PENDING_TRIAGE referral."
          setup_api_calls:
            - call: "POST /regions"
              payload: { name: "Sierra Region", state_codes: ["UT"], margin_target_pct: 0.03, capitation_index: 1.0 }
              as: PlatformAdmin
              captures: { r1: $.data.id, r1_v: $.data.version }
            - call: "POST /regions/${r1}/care-sites"
              payload: { site_name: "Sierra Medical Center", site_type: "MEDICAL_CENTER", licensed_beds: 70, staffing_fte_budget: 22.0, facility_investment_budget_cents: 11000000 }
              as: RegionalFinanceOfficer
              captures: { cs1: $.data.id }
            - call: "POST /care-sites/${cs1}/departments"
              payload: { specialty: "PRIMARY_CARE", appointment_slots_budgeted: 200, wait_threshold_days: 14 }
              as: AccessScheduler
              captures: { d_req: $.data.id }
            - call: "POST /care-sites/${cs1}/departments"
              payload: { specialty: "ORTHOPEDICS", appointment_slots_budgeted: 100, wait_threshold_days: 21 }
              as: AccessScheduler
              captures: { d_orth: $.data.id }
            - call: "POST /care-sites/${cs1}/providers"
              payload: { provider_name: "Dr Tara Novak", specialty: "ORTHOPEDICS", compensation_model: "PANEL_CAPITATION", base_component_cents: 4500000, panel_size_target: 900 }
              as: RegionalFinanceOfficer
              captures: { p1: $.data.id }
            - call: "POST /regions/${r1}/members"
