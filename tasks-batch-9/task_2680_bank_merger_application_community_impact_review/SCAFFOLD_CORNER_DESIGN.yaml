              captures: { s_id: "$.data.id", s_flag: "$.data.capital_adequacy_flag" }
          assert:
            - "app_v1 == 1 and app_v2 == 2"
            - "the stale write returns HTTP status 412 with e_stale == ERR_STALE_APPLICATION_VERSION and creates no ProFormaCapitalSchedule"
