            - call: "POST /api/v1/meet-and-greets"
              payload: { owner_id: "${oocc_id}", sitter_id: "${socc_id}", pet_id: "${pocc_id}", scheduled_at: "2026-07-05T07:30:00Z" }
              as: Owner
              as_user_id: "${oocc_id}"
              captures: { mgocc_id: $.data.id }
            - call: "POST /api/v1/meet-and-greets/${mgocc_id}/approve"
              payload: {}
              as: Owner
              as_user_id: "${oocc_id}"
            - call: "POST /api/v1/bookings"
              payload: { owner_id: "${oocc_id}", sitter_id: "${socc_id}", pet_id: "${pocc_id}", service_type: "WALK_30MIN", time_of_day: "STANDARD", recurring_cadence: "NONE", start_at: "2026-07-05T09:00:00Z", end_at: "2026-07-05T09:30:00Z" }
              as: Owner
              as_user_id: "${oocc_id}"
              captures: { bocc_id: $.data.id }
            - call: "POST /api/v1/bookings/${bocc_id}/confirm"
