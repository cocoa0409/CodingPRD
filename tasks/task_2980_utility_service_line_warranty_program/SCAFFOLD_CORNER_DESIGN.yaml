              as_user_id: "ops-001"
              captures: { e_stale_one: $.data.error_id }
            - call: "POST /claims/${claim_id}/dispatches"
              payload: { window_start: "2026-09-10T09:00:00.000Z", expected_claim_version: "${claim_v2}", contractor_id: "${contractor_a}" }
              as: OperationsAdmin
              as_user_id: "ops-001"
              captures: { dispatch_one: $.data.id, dispatch_one_status: $.data.status, dispatch_one_sla: $.data.sla_deadline_at }
            - call: "GET /claims/${claim_id}"
              payload: {}
              as: OperationsAdmin
              as_user_id: "ops-001"
              captures: { claim_v3: $.data.version, claim_status_dispatched: $.data.status }
            - call: "POST /claims/${claim_id}/dispatches"
              payload: { window_start: "2026-09-12T09:00:00.000Z", expected_claim_version: "${claim_v2}", contractor_id: "${contractor_b}", supersedes_dispatch_id: "${dispatch_one}" }
              as: OperationsAdmin
              as_user_id: "ops-001"
              captures: { e_stale_two: $.data.error_id }
            - call: "GET /dispatches/${dispatch_one}"
              payload: {}
              as: OperationsAdmin
              as_user_id: "ops-001"
              captures: { first_status_after_refusal: $.data.status, first_version_after_refusal: $.data.version }
            - call: "POST /claims/${claim_id}/dispatches"
              payload: { window_start: "2026-09-12T09:00:00.000Z", expected_claim_version: "${claim_v3}", contractor_id: "${contractor_b}", supersedes_dispatch_id: "${dispatch_one}" }
              as: OperationsAdmin
              as_user_id: "ops-001"
              captures: { dispatch_two: $.data.id, dispatch_two_status: $.data.status, dispatch_two_sla: $.data.sla_deadline_at, dispatch_two_supersedes: $.data.supersedes_dispatch_id }
            - call: "GET /dispatches/${dispatch_one}"
              payload: {}
              as: OperationsAdmin
              as_user_id: "ops-001"
              captures: { first_status_final: $.data.status }
          assert:
            - "${claim_v1} == 1 and ${e_pre_triage} == ERR_INVALID_CLAIM_STATE with HTTP 409  # the version is correct here, so the priority-20 state gate is what refuses a TRIAGE claim"
            - "${triage_status} == APPROVED and ${claim_v2} == 2"
            - "${e_stale_one} == ERR_STALE_CLAIM_VERSION with HTTP 412  # expected_claim_version 1 against current version 2; the priority-10 concurrency rule now outranks nothing else because the claim is dispatchable"
            - "${dispatch_one_status} == ASSIGNED and ${dispatch_one_sla} == 2026-09-13T08:00:00.000Z  # SLA_HOURS_BY_URGENCY[ROUTINE] 72 from the 2026-09-10T08:00:00.000Z dispatch"
            - "${claim_v3} == 3 and ${claim_status_dispatched} == DISPATCHED"
            - "${e_stale_two} == ERR_STALE_CLAIM_VERSION with HTTP 412  # the accepted dispatch bumped the claim again, so the supersede drafted at version 2 is stale"
            - "${first_status_after_refusal} == ASSIGNED and ${first_version_after_refusal} == 1  # the refused supersede did not touch the dispatch it named"
            - "${dispatch_two_status} == ASSIGNED, ${dispatch_two_supersedes} == ${dispatch_one} and ${dispatch_two_sla} == 2026-09-13T08:00:00.000Z  # the response SLA is inherited unchanged, not restarted"
            - "${first_status_final} == SUPERSEDED"

