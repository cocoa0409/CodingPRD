# Corner design (§1.9) — breadth coverage of every testable claim in §1.1–§1.7
# that SCAFFOLD_DIFFICULTY_DESIGN.yaml (§1.8) does not already assert.
# Sections follow references/claim-extraction-guide.md; claim_type values are its table rows.
scaffold_corner_design:
- section: entities
  instances:
  - name: venue_creation_returns_all_declared_fields
    claim_type: creation
    grounds:
    - entities.Venue
    - endpoints[POST /event-security/venues]
    - roles.SecurityDirector
    distinguishing_aspect: |
      The only §1.1 row with no parent at all: Venue is the topology root, so its creation claim is the one that must echo every declared input field plus the system status and the four common fields without any FK resolution, defaulting or computation standing in the way.
    test_recipe:
      setup:
      - logical clock at 2026-09-01T00:00:00Z (startup default), no other rows
      setup_api_calls:
      - call: POST /_clock/set_current_utc
        payload:
          to_iso8601: '2026-09-01T00:00:00Z'
        as: SystemOperator
      trigger:
      - call: POST /event-security/venues
        payload:
          name: Harbor Arena
          gross_capacity: 8000
          door_count: 4
          egress_capacity_per_minute: 500
          perimeter_length_m: 400
          alcohol_licensed: true
          prior_incident_rate: 1.25
        as: SecurityDirector
      assert:
      - the response status is 201
      - the created Venue has name == "Harbor Arena"
      - the created Venue has gross_capacity == 8000
      - the created Venue has door_count == 4
      - the created Venue has egress_capacity_per_minute == 500
      - the created Venue has perimeter_length_m == 400
      - the created Venue has alcohol_licensed == true
      - the created Venue has prior_incident_rate == 1.25
      - the created Venue has status == ACTIVE
      - the created Venue carries a server-assigned id, created_at, updated_at and version == 1
      - the response envelope carries meta.api_request_id and meta.api_request_timestamp
  - name: zone_creation_computes_max_safe_occupancy_from_three_way_min
    claim_type: computed_fields
    grounds:
    - entities.VenueZone.fields.max_safe_occupancy
    - calculations.zone_max_safe_occupancy
    - endpoints[POST /event-security/venues/{id}/zones]
    distinguishing_aspect: |
      max_safe_occupancy is the only §1.1 computed field whose value comes from a three-way minimum of unrelated inputs, so the claim is only pinned when each of the three terms wins once: the seated zone is egress-bound (100), the exit corridor is area-bound (76 = floor(50 / 0.65)) and the concourse is placard-bound (150).
    test_recipe:
      setup:
      - logical clock at 2026-09-01T00:00:00Z (startup default), no other rows
      - Venue "Harbor Arena" with gross_capacity 8000 and door_count 1
      setup_api_calls:
      - call: POST /_clock/set_current_utc
        payload:
          to_iso8601: '2026-09-01T00:00:00Z'
        as: SystemOperator
      - call: POST /event-security/venues
        payload:
          name: Harbor Arena
          gross_capacity: 8000
          door_count: 1
          egress_capacity_per_minute: 500
          perimeter_length_m: 400
          alcohol_licensed: false
          prior_incident_rate: 0
        as: SecurityDirector
        captures:
          venue_id: $.data.id
      trigger:
      - call: POST /event-security/venues/${venue_id}/zones
        payload:
          zone_code: ZG
          zone_type: SEATED
          floor_area_sqm: 200
          posted_capacity: 300
          exit_units: 1
          post_slot_capacity: 8
          is_ingress_zone: false
        as: SecurityDirector
        captures:
          zg_id: $.data.id
      - call: POST /event-security/venues/${venue_id}/zones
        payload:
          zone_code: ZE
          zone_type: EXIT_CORRIDOR
          floor_area_sqm: 50
          posted_capacity: 80
          exit_units: 1
          post_slot_capacity: 6
          is_ingress_zone: false
        as: SecurityDirector
        captures:
          ze_id: $.data.id
      - call: POST /event-security/venues/${venue_id}/zones
        payload:
          zone_code: ZI
          zone_type: CONCOURSE
          floor_area_sqm: 100
          posted_capacity: 150
          exit_units: 2
          post_slot_capacity: 12
          is_ingress_zone: true
        as: SecurityDirector
        captures:
          zi_id: $.data.id
      assert:
      - zone ZG (floor_area_sqm 200, posted_capacity 300, exit_units 1) has max_safe_occupancy == 100 because exit_units * 100 is the binding term
      - zone ZE (floor_area_sqm 50, posted_capacity 80, exit_units 1) has max_safe_occupancy == 76 because floor(50 / 0.65) == 76 is the binding term
      - zone ZI (floor_area_sqm 100, posted_capacity 150, exit_units 2) has max_safe_occupancy == 150 because posted_capacity is the binding term
      - each created VenueZone echoes its zone_code, zone_type, floor_area_sqm, posted_capacity, exit_units and post_slot_capacity, and ZI has is_ingress_zone == true while ZG and ZE default to false
      - every created VenueZone has version == 1
  - name: security_event_retrieval_returns_stored_and_derived_fields
    claim_type: retrieval
    grounds:
    - entities.SecurityEvent
    - endpoints[GET /event-security/security-events/{id}]
    - calculations.event_gate_posture
    distinguishing_aspect: |
      SecurityEvent is the aggregate root whose read surface mixes three field sources — stored inputs, the system status/ingress_status pair and the derived gate_posture / open_critical_incident_count pair — so the retrieval claim is the one that proves a freshly created event reads back PLANNING / NORMAL / OPEN / 0 rather than leaving the derived pair unset.
    test_recipe:
      setup:
      - logical clock at 2026-09-01T00:00:00Z (startup default), no other rows
      - Venue "Harbor Arena" with gross_capacity 8000 and door_count 1
      - SecurityEvent created with expected_attendance 200 and ticketed_attendance omitted
      setup_api_calls:
      - call: POST /_clock/set_current_utc
        payload:
          to_iso8601: '2026-09-01T00:00:00Z'
        as: SystemOperator
      - call: POST /event-security/venues
        payload:
          name: Harbor Arena
          gross_capacity: 8000
          door_count: 1
          egress_capacity_per_minute: 500
          perimeter_length_m: 400
          alcohol_licensed: false
          prior_incident_rate: 0
        as: SecurityDirector
        captures:
          venue_id: $.data.id
      - call: POST /event-security/security-events
        payload:
          venue_id: ${venue_id}
          event_name: Autumn Gala
          event_type: CONCERT
          doors_open_at: '2026-09-12T17:00:00Z'
          event_start_at: '2026-09-12T18:30:00Z'
          event_end_at: '2026-09-12T22:30:00Z'
          expected_attendance: 200
          alcohol_served: false
          vip_present: false
        as: SecurityDirector
        captures:
          event_id: $.data.id
      trigger:
      - call: GET /event-security/security-events/${event_id}
        payload: {}
        as: StaffingCoordinator
      assert:
      - the response status is 200
      - the SecurityEvent has event_name == "Autumn Gala" and event_type == CONCERT
      - the SecurityEvent has doors_open_at == "2026-09-12T17:00:00Z", event_start_at == "2026-09-12T18:30:00Z" and event_end_at == "2026-09-12T22:30:00Z"
      - the SecurityEvent has expected_attendance == 200 and ticketed_attendance == null
      - the SecurityEvent has status == PLANNING
      - the SecurityEvent has ingress_status == NORMAL
      - the SecurityEvent has gate_posture == OPEN (the pre_plan variant skips the plan-gating clause)
      - the SecurityEvent has open_critical_incident_count == 0
      - the SecurityEvent has venue_id equal to the created Venue id and version == 1
  - name: guard_listing_paginates_and_filters_by_verification_status
    claim_type: listing
    grounds:
    - entities.Guard
    - endpoints[GET /event-security/guards]
    - response_envelope.pagination_defaults
    distinguishing_aspect: |
      Guard is the only §1.1 collection with three orthogonal filters and no parent path segment, which makes it the one listing claim where the declared pagination contract (limit default 10, offset 0, total_count counting the whole filtered set rather than the returned page) can be separated from the filter contract in a single fixture.
    test_recipe:
      setup:
      - logical clock at 2026-09-01T00:00:00Z (startup default), no other rows
      - 'three Guard rows: GC-5001 (EMPLOYEE, level 1) VERIFIED, GC-5002 (EMPLOYEE, level 2) UNVERIFIED and GC-5003 (EMPLOYEE, level 3) UNVERIFIED'
      setup_api_calls:
      - call: POST /_clock/set_current_utc
        payload:
          to_iso8601: '2026-09-01T00:00:00Z'
        as: SystemOperator
      - call: POST /event-security/guards
        payload:
          full_name: Gale One
          employment_type: EMPLOYEE
          credential_level: 1
          license_number: GC-5001
          credential_expires_on: '2026-12-31T00:00:00Z'
          base_hourly_rate_cents: 2200
        as: StaffingCoordinator
        captures:
          g1_id: $.data.id
      - call: POST /event-security/guards/${g1_id}/credential-verification
        payload:
          action: VERIFY
        as: CredentialAuditor
      - call: POST /event-security/guards
        payload:
          full_name: Gale Two
          employment_type: EMPLOYEE
          credential_level: 2
          license_number: GC-5002
          credential_expires_on: '2026-12-31T00:00:00Z'
          base_hourly_rate_cents: 2200
        as: StaffingCoordinator
        captures:
          g2_id: $.data.id
      - call: POST /event-security/guards
        payload:
          full_name: Gale Three
          employment_type: EMPLOYEE
          credential_level: 3
          license_number: GC-5003
          credential_expires_on: '2026-12-31T00:00:00Z'
          base_hourly_rate_cents: 2200
        as: StaffingCoordinator
        captures:
          g3_id: $.data.id
      trigger:
      - call: GET /event-security/guards
        payload:
          limit: 2
          offset: 0
        as: StaffingCoordinator
      - call: GET /event-security/guards
        payload:
          limit: 2
          offset: 2
        as: StaffingCoordinator
      - call: GET /event-security/guards
        payload:
          verification_status: VERIFIED
        as: CredentialAuditor
      - call: GET /event-security/guards
        payload: {}
        as: StaffingCoordinator
      assert:
      - the first page returns exactly 2 Guard rows, reports total_count == 3 and has_more == true
      - the second page (offset 2) returns exactly 1 Guard row and reports has_more == false
      - the verification_status=VERIFIED page returns exactly 1 Guard row (GC-5001) and reports total_count == 1
      - the unparameterised list applies the declared defaults limit 10 and offset 0, returning all 3 rows with has_more == false
      - the returned rows include is_supervisor_qualified == true for GC-5003 (credential_level 3) and false for GC-5001 and GC-5002
  - name: staffing_plan_get_with_unknown_uuid_returns_plan_not_found
    claim_type: not_found
    grounds:
    - entities.StaffingPlan
    - endpoints[GET /event-security/staffing-plans/{id}]
    - validations[priority=6]
    - errors.ERR_PLAN_NOT_FOUND
    distinguishing_aspect: |
      StaffingPlan is the deepest entity reachable by a bare top-level id path, so it is the row that proves the priority-6 path check runs before any plan-specific state or currency check: a syntactically valid but unknown id must produce ERR_PLAN_NOT_FOUND and not ERR_PLAN_NOT_CURRENT.
    test_recipe:
      setup:
      - logical clock at 2026-09-01T00:00:00Z (startup default), no other rows
      setup_api_calls:
      - call: POST /_clock/set_current_utc
        payload:
          to_iso8601: '2026-09-01T00:00:00Z'
        as: SystemOperator
      trigger:
      - call: GET /event-security/staffing-plans/11111111-1111-4111-8111-111111111111
        payload: {}
        as: StaffingCoordinator
      assert:
      - the response status is 404
      - the error envelope reports data.error_id == "ERR_PLAN_NOT_FOUND" with a non-empty data.message
      - no StaffingPlan row is created as a side effect of the failed read
  - name: post_assignment_create_rejects_missing_guard_id
    claim_type: required_fields
    grounds:
    - entities.PostAssignment
    - endpoints[POST /event-security/post-assignments]
    - validations[priority=5]
    - errors.ERR_INVALID_REQUEST
    distinguishing_aspect: |
      PostAssignment is the junction row whose four inputs are all required, so it is the only entity where omitting a single field leaves an otherwise well-formed request that would resolve a real post: the claim is that the priority-5 schema check fires before the priority-7 body-FK lookup can even run.
    test_recipe:
      setup:
      - logical clock at 2026-09-01T00:00:00Z (startup default), no other rows
      - Venue "Harbor Arena" (gross_capacity 8000, door_count 1) with zones ZF (FLOOR, 200 sqm), ZI (CONCOURSE, 100 sqm, ingress) and ZE (EXIT_CORRIDOR, 50 sqm); SecurityEvent with expected_attendance 200,
        doors_open_at 2026-09-12T17:00:00Z, event_start_at 18:30:00Z, event_end_at 22:30:00Z; RiskAssessment APPROVED at version 3 (composite_threat_score 3.75, T1, required_total_staff 5, required_supervisors
        1, required_screening_lanes 2, minimum_staffing_cost_floor_cents 36000); logical clock 2026-09-01T00:00:00Z
      - StaffingPlan DRAFT with budget_cents 500000 and one PERIMETER post P1 in ZF (required_guard_count 5, window 2026-09-12T15:00:00Z..22:30:00Z)
      setup_api_calls:
      - call: POST /_clock/set_current_utc
        payload:
          to_iso8601: '2026-09-01T00:00:00Z'
        as: SystemOperator
      - call: POST /event-security/venues
        payload:
          name: Harbor Arena
          gross_capacity: 8000
          door_count: 1
          egress_capacity_per_minute: 500
          perimeter_length_m: 400
          alcohol_licensed: false
          prior_incident_rate: 0
        as: SecurityDirector
        captures:
          venue_id: $.data.id
      - call: POST /event-security/venues/${venue_id}/zones
        payload:
          zone_code: ZF
          zone_type: FLOOR
          floor_area_sqm: 200
          posted_capacity: 300
          exit_units: 3
          post_slot_capacity: 12
          is_ingress_zone: false
        as: SecurityDirector
        captures:
          zf_id: $.data.id
      - call: POST /event-security/venues/${venue_id}/zones
        payload:
          zone_code: ZI
          zone_type: CONCOURSE
          floor_area_sqm: 100
          posted_capacity: 150
          exit_units: 2
          post_slot_capacity: 12
          is_ingress_zone: true
        as: SecurityDirector
        captures:
          zi_id: $.data.id
      - call: POST /event-security/venues/${venue_id}/zones
        payload:
          zone_code: ZE
          zone_type: EXIT_CORRIDOR
          floor_area_sqm: 50
          posted_capacity: 80
          exit_units: 1
          post_slot_capacity: 6
          is_ingress_zone: false
        as: SecurityDirector
        captures:
          ze_id: $.data.id
      - call: POST /event-security/security-events
        payload:
          venue_id: ${venue_id}
          event_name: Autumn Gala
          event_type: CONCERT
          doors_open_at: '2026-09-12T17:00:00Z'
          event_start_at: '2026-09-12T18:30:00Z'
          event_end_at: '2026-09-12T22:30:00Z'
          expected_attendance: 200
          alcohol_served: false
          vip_present: false
        as: SecurityDirector
        captures:
          event_id: $.data.id
      - call: POST /event-security/security-events/${event_id}/risk-assessments
        payload:
          threat_level_input: LOW
          protest_likelihood: NONE
          crowd_profile: SEATED
          ingress_door_count: 1
          layout_complexity_score: 1
          history_incident_rate: 0
        as: RiskAnalyst
        as_user_id: analyst-1
        captures:
          ra_id: $.data.id
      - call: POST /event-security/risk-assessments/${ra_id}/decision
        payload:
          action: SUBMIT
        as: RiskAnalyst
        as_user_id: analyst-1
      - call: POST /event-security/risk-assessments/${ra_id}/decision
        payload:
          action: APPROVE
        as: SecurityDirector
        as_user_id: director-1
      - call: GET /event-security/security-events/${event_id}
        payload: {}
        as: SecurityDirector
        captures:
          event_v: $.data.version
      - call: POST /event-security/security-events/${event_id}/staffing-plans
        payload:
          risk_assessment_id: ${ra_id}
          budget_cents: 500000
          expected_event_version: ${event_v}
        as: StaffingCoordinator
        captures:
          plan_id: $.data.id
      - call: POST /event-security/staffing-plans/${plan_id}/posts
        payload:
          zone_id: ${zf_id}
          post_code: P1
          post_type: PERIMETER
          required_guard_count: 5
          min_credential_level: 1
          window_start: '2026-09-12T15:00:00Z'
          window_end: '2026-09-12T22:30:00Z'
        as: StaffingCoordinator
        captures:
          p1_id: $.data.id
      trigger:
      - call: POST /event-security/post-assignments
        payload:
          post_id: ${p1_id}
          window_start: '2026-09-12T15:00:00Z'
          window_end: '2026-09-12T22:30:00Z'
        as: StaffingCoordinator
      assert:
      - the response status is 400
      - the error envelope reports data.error_id == "ERR_INVALID_REQUEST"
      - no PostAssignment row is created
      - Post.${p1_id}.filled_guard_count stays 0 and Post.${p1_id}.status stays OPEN
  - name: venue_and_event_optional_fields_apply_declared_defaults
    claim_type: defaults
    grounds:
    - entities.Venue.fields.alcohol_licensed
    - entities.Venue.fields.prior_incident_rate
    - entities.SecurityEvent.fields.ticketed_attendance
    - entities.SecurityEvent.fields.alcohol_served
    - entities.SecurityEvent.fields.vip_present
    distinguishing_aspect: |
      Venue and SecurityEvent are the two entities that carry BOTH boolean defaults and a null default that later switches a calculation variant, so omitting the optional block on both is the claim that pins false / 0 / null rather than 'absent' — ticketed_attendance defaulting to null is what keeps the RiskAssessment on the EXPECTED attendance basis.
    test_recipe:
      setup:
      - logical clock at 2026-09-01T00:00:00Z (startup default), no other rows
      setup_api_calls:
      - call: POST /_clock/set_current_utc
        payload:
          to_iso8601: '2026-09-01T00:00:00Z'
        as: SystemOperator
      trigger:
      - call: POST /event-security/venues
        payload:
          name: Quiet Hall
          gross_capacity: 2000
          door_count: 2
          egress_capacity_per_minute: 300
          perimeter_length_m: 200
        as: SecurityDirector
        captures:
          venue_id: $.data.id
      - call: POST /event-security/security-events
        payload:
          venue_id: ${venue_id}
          event_name: Chamber Recital
          event_type: CONVENTION
          doors_open_at: '2026-09-12T17:00:00Z'
          event_start_at: '2026-09-12T18:30:00Z'
          event_end_at: '2026-09-12T22:30:00Z'
          expected_attendance: 150
        as: SecurityDirector
      assert:
      - the created Venue has alcohol_licensed == false
      - the created Venue has prior_incident_rate == 0
      - the created Venue has status == ACTIVE
      - the created SecurityEvent has ticketed_attendance == null
      - the created SecurityEvent has alcohol_served == false
      - the created SecurityEvent has vip_present == false
      - the created SecurityEvent has status == PLANNING, ingress_status == NORMAL and open_critical_incident_count == 0
  - name: guard_create_with_system_fields_in_body_input_ignored
    claim_type: system_fields
    grounds:
    - entities.Guard.fields.verification_status
    - entities.Guard.fields.verified_at
    - entities.Guard.fields.is_supervisor_qualified
    - endpoints[POST /event-security/guards]
    distinguishing_aspect: |
      Guard is the only entity whose system field is also the gate for every roster write, so it is the row where a client that pre-declares itself VERIFIED would bypass the whole credential subsystem: the claim is that verification_status, verified_at and the computed is_supervisor_qualified are all server-owned and the supplied values are discarded rather than merged.
    test_recipe:
      setup:
      - logical clock at 2026-09-01T00:00:00Z (startup default), no other rows
      setup_api_calls:
      - call: POST /_clock/set_current_utc
        payload:
          to_iso8601: '2026-09-01T00:00:00Z'
        as: SystemOperator
      trigger:
      - call: POST /event-security/guards
        payload:
          full_name: Sam Sentinel
          employment_type: EMPLOYEE
          credential_level: 3
          license_number: GC-4001
          credential_expires_on: '2026-12-31T00:00:00Z'
          base_hourly_rate_cents: 2200
          verification_status: VERIFIED
          verified_at: '2026-01-01T00:00:00Z'
          is_supervisor_qualified: false
          id: 11111111-1111-4111-8111-111111111111
          version: 99
        as: StaffingCoordinator
      assert:
      - the created Guard has verification_status == UNVERIFIED, not VERIFIED
      - the created Guard has verified_at == null
      - the created Guard has is_supervisor_qualified == true, recomputed from credential_level 3 rather than taken from the supplied false
      - the created Guard has a server-assigned id that is not 11111111-1111-4111-8111-111111111111
      - the created Guard has version == 1, not 99
      - the created Guard echoes full_name, employment_type, credential_level, license_number, credential_expires_on and base_hourly_rate_cents from the request, and subcontractor_id == null
  - name: density_reading_is_immutable_with_no_version_field
    claim_type: immutability
    grounds:
    - entities.DensityReading
    - calculations.crowd_density_classification
    - endpoints[POST /event-security/security-events/{id}/density-readings]
    distinguishing_aspect: |
      DensityReading is the single §1.1 row declared with common_fields false: it is an append-only observation, so it is the one entity that carries id and created_at but NO version and NO updated_at, and the API exposes no update or delete path at all — correcting an observation means appending a second row, which is exactly what makes the rolling window meaningful.
    test_recipe:
      setup:
      - logical clock at 2026-09-01T00:00:00Z (startup default), no other rows
      - Venue "Harbor Arena" (gross_capacity 8000, door_count 1) with zones ZF (FLOOR, 200 sqm), ZI (CONCOURSE, 100 sqm, ingress) and ZE (EXIT_CORRIDOR, 50 sqm); SecurityEvent with expected_attendance 200,
        doors_open_at 2026-09-12T17:00:00Z, event_start_at 18:30:00Z, event_end_at 22:30:00Z; RiskAssessment APPROVED at version 3 (composite_threat_score 3.75, T1, required_total_staff 5, required_supervisors
        1, required_screening_lanes 2, minimum_staffing_cost_floor_cents 36000); logical clock 2026-09-01T00:00:00Z
      setup_api_calls:
      - call: POST /_clock/set_current_utc
        payload:
          to_iso8601: '2026-09-01T00:00:00Z'
        as: SystemOperator
      - call: POST /event-security/venues
        payload:
          name: Harbor Arena
          gross_capacity: 8000
          door_count: 1
          egress_capacity_per_minute: 500
          perimeter_length_m: 400
          alcohol_licensed: false
          prior_incident_rate: 0
        as: SecurityDirector
        captures:
          venue_id: $.data.id
      - call: POST /event-security/venues/${venue_id}/zones
        payload:
          zone_code: ZF
          zone_type: FLOOR
          floor_area_sqm: 200
          posted_capacity: 300
          exit_units: 3
          post_slot_capacity: 12
          is_ingress_zone: false
        as: SecurityDirector
        captures:
          zf_id: $.data.id
      - call: POST /event-security/venues/${venue_id}/zones
        payload:
          zone_code: ZI
          zone_type: CONCOURSE
          floor_area_sqm: 100
          posted_capacity: 150
          exit_units: 2
          post_slot_capacity: 12
          is_ingress_zone: true
        as: SecurityDirector
        captures:
          zi_id: $.data.id
      - call: POST /event-security/venues/${venue_id}/zones
        payload:
          zone_code: ZE
          zone_type: EXIT_CORRIDOR
          floor_area_sqm: 50
          posted_capacity: 80
          exit_units: 1
          post_slot_capacity: 6
          is_ingress_zone: false
        as: SecurityDirector
        captures:
          ze_id: $.data.id
      - call: POST /event-security/security-events
        payload:
          venue_id: ${venue_id}
          event_name: Autumn Gala
          event_type: CONCERT
