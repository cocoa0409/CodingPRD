            - "TransferRequest.${t}.status remains UNDER_REVIEW"

      - name: legend_referential_beats_fiscal
        grounds:
          - validations[priority=9]
          - validations[priority=10]
          - entities.LegendRemovalRequest.fields.account_id
        distinguishing_aspect: |
          Error-category pair (business_referential vs business_fiscal — a different pair from
          instance approve_state_beats_sod_safety): the create violates BOTH referential integrity
          (account_id does not own the position) AND fiscal sufficiency (share_quantity exceeds
