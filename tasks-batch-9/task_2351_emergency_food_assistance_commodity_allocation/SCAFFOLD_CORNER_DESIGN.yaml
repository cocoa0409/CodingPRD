            - "InventoryTransfer.${tr1}.status == PROPOSED and cases == 5 (the refused replay created no third transfer)"

      - name: service_area_eligible_agency_count_reconciles_across_create_lapse_and_retraining
        claim_type: derived field reconciliation
        grounds:
          - calculations.agency_eligibility_posture
          - entities.ServiceArea.fields.eligible_agency_count
          - endpoints.POST_/efap/compliance-sweeps
        distinguishing_aspect: "The denormalised count must be rewritten on every posture-moving event, including one the client never addresses to the ServiceArea: 0 at creation, 1 after the agreement makes Alpha ELIGIBLE, back to 0 when a sweep lapses training a day past training_expires_at (posture PROBATION, not INELIGIBLE, because the agreement still runs to 2028-06-30), and 1 again after retraining — with ServiceArea.version bumping on each rewrite and poverty_population never touched."
        test_recipe:
          setup:
            - "Clock 2026-08-01T00:00:00Z; Area North created empty; Agency Alpha created with no training and no agreement; agreement term 2026-07-01 to 2028-06-30 so only the training axis can lapse."
            - "Training completed 2026-07-01T00:00:00Z, so training_expires_at == 2027-07-01T00:00:00Z."
          setup_api_calls:
            - call: "POST /efap/_clock/set_current_utc"
              payload: { current_utc: "2026-08-01T00:00:00Z" }
              as: StateAdmin
            - call: "POST /efap/service-areas"
              payload: { name: "Area North", county_code: "C001", poverty_population: 40000, urban_rural: "URBAN" }
              as: StateAdmin
              captures: { sa: $.data.id, sa_count0: $.data.eligible_agency_count }
            - call: "POST /efap/agencies"
              payload: { name: "Agency Alpha", service_area_id: "${sa}", cold_storage_pallet_capacity: 10, prior_period_pounds_distributed: 120000, prior_period_allocated_cases: 400 }
              as: StateAdmin
              captures: { ag: $.data.id }
            - call: "POST /efap/agencies/${ag}/civil-rights-trainings"
              payload: { completed_at: "2026-07-01T00:00:00Z", attendee_count: 4 }
              as: ComplianceReviewer
              as_user_id: "rev-1"
          trigger:
            - call: "GET /efap/service-areas/${sa}"
              payload: {}
              as: StateAdmin
              captures: { c_before: $.data.eligible_agency_count }
            - call: "POST /efap/agencies/${ag}/agreement-renewals"
              payload: { agreement_start_date: "2026-07-01", agreement_end_date: "2028-06-30" }
              as: ComplianceReviewer
              as_user_id: "rev-1"
            - call: "GET /efap/service-areas/${sa}"
              payload: {}
              as: StateAdmin
              captures: { c_eligible: $.data.eligible_agency_count }
            - call: "POST /efap/_clock/set_current_utc"
              payload: { current_utc: "2027-07-02T00:00:00Z" }
              as: StateAdmin
            - call: "POST /efap/compliance-sweeps"
              payload: {}
              as: StateAdmin
            - call: "GET /efap/service-areas/${sa}"
              payload: {}
              as: StateAdmin
              captures: { c_lapsed: $.data.eligible_agency_count }
            - call: "POST /efap/agencies/${ag}/civil-rights-trainings"
              payload: { completed_at: "2027-07-02T00:00:00Z", attendee_count: 5 }
              as: ComplianceReviewer
              as_user_id: "rev-1"
            - call: "GET /efap/service-areas/${sa}"
              payload: {}
              as: StateAdmin
              captures: { c_restored: $.data.eligible_agency_count }
          assert:
            - "sa_count0 == 0 and c_before == 0 (training alone, with agreement_status PENDING, leaves the posture INELIGIBLE)"
            - "after the renewal: Agency.${ag}.eligibility_posture == ELIGIBLE and c_eligible == 1"
            - "the sweep returns HTTP 200 and reports Agency.${ag} as changed; Agency.${ag}.training_status == LAPSED, agreement_status == ACTIVE and eligibility_posture == PROBATION"
            - "c_lapsed == 0 (the sweep rewrote the parent's count without any call addressing the ServiceArea)"
            - "after retraining: Agency.${ag}.training_status == CURRENT with training_expires_at == 2028-07-02T00:00:00Z, eligibility_posture == ELIGIBLE and c_restored == 1"
            - "ServiceArea.${sa}.poverty_population == 40000 throughout and its version increased at least three times (create -> 1 -> 0 -> 1)"

      - name: a_monitor_run_scores_only_available_and_watch_lots_and_skips_received_and_held_ones
        claim_type: ops-run checkpoint
        grounds:
          - calculations.lot_monitor_flag
          - endpoints.POST_/efap/inventory-monitor-runs
          - entities.InventoryLot.fields.last_monitored_at
        distinguishing_aspect: "The run's input set is state-filtered, not warehouse-wide: of three lots in WH North only the posted 600-case lot is scored (EXCESS by the pinned precedence even though its index 0.7000 is also above the slow threshold, moving AVAILABLE -> WATCH), while the never-posted RECEIVED lot and the recall-HELD lot keep monitor_flag NONE, slow_moving_index 0.0000 and last_monitored_at null."
        test_recipe:
          setup:
            - "Clock 2026-08-01T00:00:00Z; ELIGIBLE agency; WH North with monitor_policy TURNOVER_BASED; BULK_RICE has excess_case_ceiling 500."
            - "Lot EXCESS-600 posted with 600 cases (nothing shipped); lot RAW-100 created and left RECEIVED; lot HELD-100 posted and then placed on HOLD by a CLASS_III recall raised by adm-1."
          setup_api_calls:
            - call: "POST /efap/_clock/set_current_utc"
              payload: { current_utc: "2026-08-01T00:00:00Z" }
              as: StateAdmin
            - call: "POST /efap/commodities"
              payload: { code: "BULK_RICE", name: "Bulk Rice", storage_class: "DRY", net_weight_lbs_per_case: 20.0, cases_per_pallet: 50, entitlement_value_cents_per_case: 1200, shelf_life_days: 900, excess_case_ceiling: 500 }
              as: StateAdmin
              captures: { cm_rice: $.data.id }
            - call: "POST /efap/warehouses"
              payload: { name: "WH North", dock_count: 2, dry_pallet_capacity: 100, cold_pallet_capacity: 50, frozen_pallet_capacity: 20, monitor_policy: "TURNOVER_BASED" }
              as: StateAdmin
              captures: { wh: $.data.id }
            - call: "POST /efap/inventory-lots"
              payload: { commodity_id: "${cm_rice}", warehouse_id: "${wh}", federal_lot_code: "EXCESS-600", cases_received: 600, pack_date: "2026-07-01", best_by_date: "2028-01-01" }
              as: StateAdmin
              captures: { lot_x: $.data.id }
            - call: "POST /efap/inventory-lots/${lot_x}/post"
              payload: {}
              as: StateAdmin
            - call: "POST /efap/inventory-lots"
              payload: { commodity_id: "${cm_rice}", warehouse_id: "${wh}", federal_lot_code: "RAW-100", cases_received: 100, pack_date: "2026-07-01", best_by_date: "2028-01-01" }
              as: StateAdmin
              captures: { lot_r: $.data.id }
            - call: "POST /efap/inventory-lots"
              payload: { commodity_id: "${cm_rice}", warehouse_id: "${wh}", federal_lot_code: "HELD-100", cases_received: 100, pack_date: "2026-07-01", best_by_date: "2028-01-01" }
              as: StateAdmin
              captures: { lot_h: $.data.id }
            - call: "POST /efap/inventory-lots/${lot_h}/post"
              payload: {}
              as: StateAdmin
            - call: "POST /efap/recalls"
              payload: { source_lot_id: "${lot_h}", recall_class: "CLASS_III", hold_scope: "LOT_ONLY", reason: "Minor labelling defect under review" }
              as: StateAdmin
              as_user_id: "adm-1"
              captures: { rc: $.data.id }
          trigger:
            - call: "POST /efap/inventory-monitor-runs"
              payload: { warehouse_id: "${wh}" }
              as: StateAdmin
          assert:
            - "HTTP 200 (or 201) and the run reports scanned_lot_count == 1 and flagged_lot_count == 1"
            - "InventoryLot.${lot_x}.monitor_flag == EXCESS with slow_moving_index == 0.7000, status == WATCH and last_monitored_at == 2026-08-01T00:00:00Z"
            - "InventoryLot.${lot_r}.status == RECEIVED with monitor_flag == NONE, slow_moving_index == 0.0000 and last_monitored_at == null"
            - "InventoryLot.${lot_h}.status == HOLD with hold_recall_id == ${rc}, monitor_flag == NONE and last_monitored_at == null"
            - "a second run at the same clock leaves InventoryLot.${lot_x}.status == WATCH, monitor_flag == EXCESS and slow_moving_index == 0.7000 (idempotent rescore, no double transition)"

      - name: recall_hold_cascade_layer_is_covered_by_the_difficulty_index
        claim_type: cascading side effects
        excluded_because:
          difficulty_instance: recall_hold_propagates_lot_then_appointment_then_order
          rationale: "The transitive-cascade layer's whole content is the three-hop propagation from a recall to the lot, its scheduled appointments and the orders reserving it; §1.8 already asserts each hop, the released commitments and the untouched sibling lot. A §1.9 instance could only re-run the same chain with fewer assertions."

      - name: monitor_policy_feature_flag_layer_is_covered_by_the_difficulty_index
        claim_type: conditional feature flags
        excluded_because:
          difficulty_instance: lot_monitor_turnover_vs_shelf_life_flags_different_lots
          rationale: "Warehouse.monitor_policy is the conditional flag, and §1.8 pins two identical lots under the two policies so that TURNOVER_BASED and SHELF_LIFE_BASED disagree on which lot is SLOW_MOVING. The flag's only other observable effect — flag precedence — is asserted by the ops-run instance above, so a dedicated §1.9 flag instance would be redundant."

  # ===========================================================================
  # Section 9 — Consistency model (§1.0: immediate).
  # ===========================================================================
  - section: consistency model
    instances:

      - name: every_declared_cascade_is_visible_in_the_writing_response_and_on_immediate_reread
        claim_type: immediate consistency
        grounds:
          - complexity_profile.consistency_model
          - endpoints.POST_/efap/commodity-orders/{order_id}/approve
          - calculations.order_line_pound_conversion
        distinguishing_aspect: "The declared model is immediate, so approval's own 200 body must already carry the recomputed totals and every dependent row must show the cascade on a read issued immediately afterwards at the same logical instant — the lot's commitment, the allocation's committed/remaining pair and the cycle's draw_posture — with no second call, no retry loop and no clock advance needed to settle."
        test_recipe:
          setup:
            - "Clock 2026-08-06T00:00:00Z; ELIGIBLE agency; WH North; a 100-case BULK_RICE lot posted; cycle FY27A allocatable 1000 computed and opened."
            - "A 10-case order SUBMITTED by the agency and awaiting rev-2."
          setup_api_calls:
            - call: "POST /efap/_clock/set_current_utc"
              payload: { current_utc: "2026-08-01T00:00:00Z" }
              as: StateAdmin
            - call: "POST /efap/service-areas"
              payload: { name: "Area North", county_code: "C001", poverty_population: 40000, urban_rural: "URBAN" }
