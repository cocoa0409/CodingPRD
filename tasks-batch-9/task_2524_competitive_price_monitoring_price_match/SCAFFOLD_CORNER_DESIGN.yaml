            - "The 89 row is not 6545 — dropping into ATTRIBUTE_BLEND also enables the ceiling that IDENTIFIER_ANCHORED never applies"

      - name: corner_label_slot_ledger_after_batch_cancel
        claim_type: correct_result
        grounds: [calculations.store_label_slot_ledger, state_machines.LabelPrintBatch.transitions.SCHEDULED_to_CANCELLED]
        distinguishing_aspect: "The slot aggregation is a live sum over same-day SCHEDULED/PRINTING/COMPLETED batches, so cancelling a 2-slot batch returns exactly 2 slots and re-opens room for a new 2-slot batch that would otherwise be refused with ERR_PRINT_CAPACITY_EXCEEDED."
        test_recipe:
          setup:
            - "Logical clock at 2026-08-01T00:00:00Z; store STORE-101 with label_printer_capacity_per_day 5."
            - "Batch A window 09:00-10:00 reserved 2 and batch B window 11:00-12:00 reserved 3 (60-minute clearance, above the 45-minute buffer), so slots are fully used."
          setup_api_calls:
            - call: "POST /pricing/_clock/set_current_utc"
              payload: { current_utc: "2026-08-01T00:00:00Z" }
              as: PlatformAdmin
            - call: "POST /pricing/markets"
              payload: { market_code: "US-WEST", name: "US West", strategic_positioning: "AT_PARITY", strategic_index_target_bp: 9800 }
              as: PlatformAdmin
              captures: { m_id: $.data.id }
            - call: "POST /pricing/stores"
              payload: { market_id: "${m_id}", store_code: "STORE-101", override_authority_cents: 5000, label_printer_capacity_per_day: 5 }
              as: PlatformAdmin
              captures: { s_id: $.data.id }
            - call: "POST /pricing/label-batches"
              payload: { store_id: "${s_id}", window_start: "2026-08-01T09:00:00Z", window_end: "2026-08-01T10:00:00Z", reserved_item_count: 2 }
              as: StoreManager
              as_user_id: "${s_id}"
              captures: { b_a: $.data.id }
            - call: "POST /pricing/label-batches"
              payload: { store_id: "${s_id}", window_start: "2026-08-01T11:00:00Z", window_end: "2026-08-01T12:00:00Z", reserved_item_count: 3 }
              as: StoreManager
              as_user_id: "${s_id}"
              captures: { b_b: $.data.id }
          trigger:
            - call: "POST /pricing/label-batches/${b_a}/cancel"
              payload: { cancel_reason: "printer jam, rescheduling" }
              as: StoreManager
              as_user_id: "${s_id}"
            - call: "POST /pricing/label-batches"
              payload: { store_id: "${s_id}", window_start: "2026-08-01T13:00:00Z", window_end: "2026-08-01T14:00:00Z", reserved_item_count: 2 }
              as: StoreManager
              as_user_id: "${s_id}"
              captures: { b_c: $.data.id }
          assert:
            - "Before the cancel: Store.${s_id}.label_slots_used_today == 5 and label_slots_remaining_today == 0"
            - "After the cancel: LabelPrintBatch.${b_a}.status == CANCELLED, item_count == 0, cancel_reason == printer jam, rescheduling"
            - "After the cancel: Store.${s_id}.label_slots_used_today == 3 and label_slots_remaining_today == 2 — the CANCELLED batch contributes zero"
            - "The second trigger succeeds with HTTP 201, LabelPrintBatch.${b_c}.item_count == 2, and Store.${s_id}.label_slots_used_today == 5 again"
            - "At every step label_printer_capacity_per_day == label_slots_used_today + label_slots_remaining_today == 5"

