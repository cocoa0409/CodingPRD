  # ---------------------------------------------------------------- Rule 4
  - rule_id: transitive_cascade
    instances:
      - name: divert_cascade_bed_ground_flag
        grounds:
          - state_machines.Mission.IN_TRANSIT_to_DIVERTED
          - state_machines.BedReservation.HELD_to_RELEASED
          - state_machines.GroundTransportLeg.SCHEDULED_to_CANCELLED
          - entities.Mission.fields.ground_coordination_status
        distinguishing_aspect: |
          Depth-3 chain triggered by divert: divert rewrites
          destination_facility (hop 0) -> the HELD bed at the OLD facility is
          RELEASED because its facility no longer matches (hop 1) -> the
          DESTINATION ground leg linked to that bed is CANCELLED because its
          bed was released (hop 2, caused by hop 1, not by the divert) ->
          Mission.ground_coordination_status recomputes to NEEDS_REPLAN
          (hop 3, caused by hop 2).
        test_recipe:
          setup:
            - "ALS rotor mission IN_TRANSIT; BedReservation HELD at County General; DESTINATION ground leg SCHEDULED and linked to that bed"
          setup_api_calls:
            - { call: "POST /air-ambulance/_clock/set_current_utc", payload: { to_iso8601: "2026-08-01T00:00:00Z" }, as: OpsAdmin }
            - { call: "POST /air-ambulance/bases", payload: { name: "Base Theta", region: "SW-US" }, as: OpsAdmin, captures: { base_id: "$.data.id" } }
            - { call: "POST /air-ambulance/aircraft", payload: { base_id: "${base_id}", tail_number: "N777DV", aircraft_class: "ROTOR_WING", medical_config: "CCT_CAPABLE" }, as: OpsAdmin, captures: { ac_id: "$.data.id" } }
            - { call: "POST /air-ambulance/crew-members", payload: { base_id: "${base_id}", full_name: "Pat Pilot", crew_role: "PILOT" }, as: OpsAdmin, captures: { pilot_id: "$.data.id" } }
            - { call: "POST /air-ambulance/crew-members", payload: { base_id: "${base_id}", full_name: "Nina Nurse", crew_role: "NURSE" }, as: OpsAdmin, captures: { nurse_id: "$.data.id" } }
            - { call: "POST /air-ambulance/patients", payload: { full_name: "Paul Patient", date_of_birth: "1980-04-12", weight_kg: 80 }, as: Dispatcher, captures: { pat_id: "$.data.id" } }
            - { call: "POST /air-ambulance/mission-requests", payload: { patient_id: "${pat_id}", transport_class: "EMERGENCY_INTERFACILITY", origin_facility: "St Mary", destination_facility: "County General", reported_cardio: 8, reported_resp: 6, reported_neuro: 5, reported_interventions: 3, onset_iso: "2026-07-31T14:00:00Z" }, as: Dispatcher, captures: { req_id: "$.data.id" } }
            - { call: "POST /air-ambulance/mission-requests/${req_id}/triage", payload: { verified_cardio: 8, verified_resp: 6, verified_neuro: 5, verified_interventions: 3 }, as: MedicalDirector }
            - { call: "POST /air-ambulance/mission-requests/${req_id}/accept", payload: { aircraft_id: "${ac_id}", crew: [{ crew_member_id: "${pilot_id}", role_in_mission: "PILOT" }, { crew_member_id: "${nurse_id}", role_in_mission: "NURSE" }], estimated_loaded_miles: 60, planned_launch_iso: "2026-08-01T06:00:00Z", planned_duration_min: 120 }, as: Dispatcher, captures: { m_id: "$.data.id", m_v: "$.data.version" } }
            - { call: "POST /air-ambulance/bed-reservations", payload: { mission_id: "${m_id}", facility_name: "County General", bed_type: "ICU", hold_until_iso: "2026-08-01T18:00:00Z" }, as: Dispatcher, captures: { bed_id: "$.data.id" } }
            - { call: "POST /air-ambulance/ground-legs", payload: { mission_id: "${m_id}", leg_type: "DESTINATION", provider_name: "City EMS", scheduled_pickup_iso: "2026-08-01T09:30:00Z", bed_reservation_id: "${bed_id}" }, as: Dispatcher, captures: { leg_id: "$.data.id" } }
            - { call: "POST /air-ambulance/weather-assessments", payload: { mission_id: "${m_id}", ceiling_ft: 1000, visibility_sm: 5.0, wind_kt: 10, precip: "NONE", day_night: "DAY", terrain: "FLAT", expected_mission_version: "${m_v}" }, as: FlightCrew, as_user_id: "${pilot_id}" }
            - { call: "POST /air-ambulance/missions/${m_id}/advance", payload: { to_state: "LAUNCHED" }, as: FlightCrew, as_user_id: "${pilot_id}" }
            - { call: "POST /air-ambulance/missions/${m_id}/advance", payload: { to_state: "AT_PATIENT" }, as: FlightCrew, as_user_id: "${pilot_id}" }
            - { call: "POST /air-ambulance/missions/${m_id}/advance", payload: { to_state: "IN_TRANSIT" }, as: FlightCrew, as_user_id: "${pilot_id}" }
          trigger:
            - { call: "POST /air-ambulance/missions/${m_id}/divert", payload: { new_destination_facility: "Regional North", reason: "Thunderstorm over primary" }, as: FlightCrew, as_user_id: "${pilot_id}" }
          assert:
            - "Mission.${m_id}.status == DIVERTED and destination_facility == Regional North"
            - "BedReservation.${bed_id}.status == RELEASED (hop 1: facility mismatch with new destination)"
            - "GroundTransportLeg.${leg_id}.status == CANCELLED (hop 2: caused by its linked bed's release)"
