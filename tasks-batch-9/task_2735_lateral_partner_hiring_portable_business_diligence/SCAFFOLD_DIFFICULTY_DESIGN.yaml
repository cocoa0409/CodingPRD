      - name: candidate_pipeline_and_clearance_dimensions_advance_independently
        grounds:
          - state_machines.Candidate.IN_PROGRESS_to_CLEARED
          - state_machines.Candidate.DILIGENCE_to_WITHDRAWN
          - entities.Candidate.fields.pipeline_status
          - entities.Candidate.fields.clearance_status
          - state_machines.LateralQuestionnaire.UNDER_REVIEW_to_ABANDONED
        distinguishing_aspect: |
          Non-linearity = TWO PARALLEL state dimensions on one row, so the Candidate's
          observable state is a pair, not a scalar. Clearing the only ConflictCheck moves
          clearance_status NOT_STARTED -> IN_PROGRESS -> CLEARED while pipeline_status stays
          pinned at DILIGENCE, and withdrawing the candidate then moves pipeline_status to
