# =============================================================================
# Task 1955 — §1.9 Scaffold Corner Design (Coverage Index for Non-Difficulty Tests)
# Breadth walk of §1.1–§1.7 per references/claim-extraction-guide.md
# =============================================================================
scaffold_corner_design:
  - section: entities
    instances:
      - name: entity_creation_field_technician_defaults_and_envelope
        claim_type: creation
        grounds: [entities.FieldTechnician, 'endpoints["POST /field-technicians"]']
        distinguishing_aspect: "Create returns 201 with system defaults: technician_status ACTIVE, version 1, server-minted UUID id, created_at stamped from the logical clock default."
        test_recipe:
          setup: ["empty database; logical clock never set (default 2026-08-01T00:00:00Z)"]
          setup_api_calls: []
          trigger:
            - { call: "POST /field-technicians", payload: { display_name: "Corner Tech" }, as: MeterOpsAdmin, captures: { tech_id: $.data.id, tech_created: $.data.created_at } }
          assert:
            - "response envelope: response_type == object, meta.api_request_id present"
            - "FieldTechnician.${tech_id}.technician_status == ACTIVE"
            - "FieldTechnician.${tech_id}.version == 1"
            - "created_at == 2026-08-01T00:00:00.000Z (default logical clock, wall clock never consulted): ${tech_created}"

      - name: entity_creation_service_account_estimation_method_default
        claim_type: defaults
        grounds: [entities.ServiceAccount.fields.estimation_method]
        distinguishing_aspect: "Omitting estimation_method stores TRAILING_AVERAGE; account_status defaults ACTIVE and estimated_read_streak 0."
        test_recipe:
          setup: ["empty database"]
          setup_api_calls: []
          trigger:
            - { call: "POST /service-accounts", payload: { account_number: "C-0001", service_address: "1 Default Way", billing_cycle_code: "C01" }, as: MeterOpsAdmin, captures: { acct_id: $.data.id } }
          assert:
            - "ServiceAccount.${acct_id}.estimation_method == TRAILING_AVERAGE"
            - "ServiceAccount.${acct_id}.account_status == ACTIVE and estimated_read_streak == 0"
            - "ServiceAccount.${acct_id}.current_meter_id == null and last_validated_read_value == null"

      - name: entity_creation_meter_parallel_dimension_defaults
        claim_type: initial_state
        grounds: [entities.Meter.fields.endpoint_comms_status, entities.Meter.fields.tamper_status]
        distinguishing_aspect: "AMI meter starts IN_STOCK/COMMUNICATING/NONE; HANDHELD meter starts IN_STOCK/NOT_APPLICABLE/NONE — comms default depends on meter_type."
        test_recipe:
          setup: ["empty database"]
          setup_api_calls: []
          trigger:
            - { call: "POST /meters", payload: { serial_number: "SN-Z-AMI", meter_type: "AMI" }, as: MeterOpsAdmin, captures: { m_ami: $.data.id } }
            - { call: "POST /meters", payload: { serial_number: "SN-Z-HH", meter_type: "HANDHELD" }, as: MeterOpsAdmin, captures: { m_hh: $.data.id } }
          assert:
            - "Meter.${m_ami}: meter_status == IN_STOCK, endpoint_comms_status == COMMUNICATING, tamper_status == NONE, consecutive_missed_days == 0"
            - "Meter.${m_hh}: meter_status == IN_STOCK, endpoint_comms_status == NOT_APPLICABLE, tamper_status == NONE"

      - name: entity_creation_duplicate_account_number_rejected
        claim_type: type_constraints
        grounds: ['"validations[priority=20]"', '"errors[ERR_DUPLICATE_ACCOUNT_NUMBER]"']
        distinguishing_aspect: "Second account reusing account_number is rejected with 409 ERR_DUPLICATE_ACCOUNT_NUMBER."
        test_recipe:
          setup: ["one account with account_number C-0002 exists"]
          setup_api_calls:
            - { call: "POST /service-accounts", payload: { account_number: "C-0002", service_address: "2 Dup Ln", billing_cycle_code: "C01" }, as: MeterOpsAdmin }
          trigger:
            - { call: "POST /service-accounts", payload: { account_number: "C-0002", service_address: "3 Dup Ln", billing_cycle_code: "C02" }, as: MeterOpsAdmin, captures: { err: $.data.error_id } }
          assert:
            - "error_id == ERR_DUPLICATE_ACCOUNT_NUMBER (409)"
            - "GET /service-accounts?account_number... total_count of accounts == 1"

      - name: entity_creation_duplicate_serial_number_rejected
        claim_type: type_constraints
        grounds: ['"validations[priority=20]"', '"errors[ERR_DUPLICATE_SERIAL_NUMBER]"']
        distinguishing_aspect: "Second meter reusing serial_number is rejected with 409 ERR_DUPLICATE_SERIAL_NUMBER."
        test_recipe:
          setup: ["one meter SN-DUP exists"]
          setup_api_calls:
            - { call: "POST /meters", payload: { serial_number: "SN-DUP", meter_type: "HANDHELD" }, as: MeterOpsAdmin }
          trigger:
            - { call: "POST /meters", payload: { serial_number: "SN-DUP", meter_type: "AMI" }, as: MeterOpsAdmin, captures: { err: $.data.error_id } }
          assert:
            - "error_id == ERR_DUPLICATE_SERIAL_NUMBER (409)"

      - name: entity_creation_period_inverted_window_dates_rejected
        claim_type: type_constraints
        grounds: ['"validations[priority=3]"', '"errors[ERR_WINDOW_DATE_ORDER]"']
        distinguishing_aspect: "read_window_open_date after read_window_close_date fails the pinned date-order chain with 422 ERR_WINDOW_DATE_ORDER."
        test_recipe:
          setup: ["empty database"]
          setup_api_calls: []
          trigger:
            - { call: "POST /billing-cycle-periods", payload: { cycle_code: "C02", period_start_date: "2026-08-01", period_end_date: "2026-08-31", read_window_open_date: "2026-08-10", read_window_close_date: "2026-08-05", bill_run_date: "2026-08-31" }, as: MeterOpsAdmin, captures: { err: $.data.error_id } }
          assert:
            - "error_id == ERR_WINDOW_DATE_ORDER (422)"

      - name: entity_not_found_returns_404_error_envelope
        claim_type: not_found
        grounds: ['"validations[priority=5]"', '"errors[ERR_NOT_FOUND]"']
        distinguishing_aspect: "GET on a well-formed but unknown UUID yields 404 ERR_NOT_FOUND in the fixed error envelope."
        test_recipe:
          setup: ["empty database"]
          setup_api_calls: []
          trigger:
            - { call: "GET /meters/8a3e1c0b-2f4d-4a91-9c8b-12e7b6a0f1d2", payload: {}, as: MeterOpsAdmin, captures: { err: $.data.error_id } }
          assert:
            - "error_id == ERR_NOT_FOUND, http 404"
            - "error envelope: response_type == error, data.message present"

      - name: entity_computed_current_meter_id_derived_from_install
        claim_type: computed_fields
        grounds: [entities.ServiceAccount.fields.current_meter_id]
        distinguishing_aspect: "current_meter_id is derived from Meter.installed_service_account_id — it is null before install and equals the meter id after; client cannot set it."
        test_recipe:
          setup: ["account and IN_STOCK meter exist"]
          setup_api_calls:
            - { call: "POST /service-accounts", payload: { account_number: "C-0003", service_address: "3 Derived Dr", billing_cycle_code: "C01" }, as: MeterOpsAdmin, captures: { acct_id: $.data.id } }
            - { call: "POST /meters", payload: { serial_number: "SN-DER-1", meter_type: "HANDHELD" }, as: MeterOpsAdmin, captures: { meter_id: $.data.id } }
          trigger:
            - { call: "POST /meters/${meter_id}/install", payload: { service_account_id: "${acct_id}" }, as: MeterOpsAdmin }
            - { call: "GET /service-accounts/${acct_id}", payload: {}, as: MeterOpsAdmin, captures: { cur: $.data.current_meter_id } }
          assert:
            - "before install: current_meter_id was null"
            - "after install: current_meter_id == ${meter_id} (${cur})"
            - "Meter.${meter_id}.meter_status == IN_SERVICE and installed_service_account_id == ${acct_id}"

      - name: entity_computed_hazard_expires_at_exact_literal
        claim_type: computed_fields
        grounds: [entities.HazardFlag.fields.expires_at, calculations.hazard_ttl_expiry]
        distinguishing_aspect: "expires_at == reported_at + 30 days exactly, to the second."
        test_recipe:
          setup: ["clock pinned at 2026-08-01T09:00:00Z; account exists"]
          setup_api_calls:
            - { call: "POST /_clock/set_current_utc", payload: { to_iso8601: "2026-08-01T09:00:00Z" }, as: MeterOpsAdmin }
            - { call: "POST /service-accounts", payload: { account_number: "C-0004", service_address: "4 Hazard Ln", billing_cycle_code: "C01" }, as: MeterOpsAdmin, captures: { acct_id: $.data.id } }
            - { call: "POST /field-technicians", payload: { display_name: "Flag Tech" }, as: MeterOpsAdmin, captures: { tech_id: $.data.id } }
          trigger:
            - { call: "POST /hazard-flags", payload: { service_account_id: "${acct_id}", hazard_type: "LOCKED_GATE", severity: "LOW" }, as: FieldTechnician, as_user_id: "${tech_id}", captures: { flag_id: $.data.id, exp: $.data.expires_at, rep: $.data.reported_at } }
          assert:
            - "HazardFlag.${flag_id}.expires_at == 2026-08-31T09:00:00.000Z (${exp})"
            - "reported_at == 2026-08-01T09:00:00.000Z (${rep}); renewed_count == 0; flag_status == ACTIVE"
            - "reported_by_technician_id == ${tech_id}"

      - name: entity_computed_ops_snapshot_aggregate_counts
        claim_type: computed_fields
        grounds: [entities.OpsSnapshot.fields.eligible_stop_count, entities.OpsSnapshot.fields.read_rate_percent]
        distinguishing_aspect: "Snapshot aggregates over a known 2-stop fixture: eligible 2, covered 1, backlog 1, read_rate 50.00, net 50.00 (no hazard skips), validated_read_count 1."
        test_recipe:
          setup:
            - "Two handheld accounts with meters; period window [2026-08-03..2026-08-07] WINDOW_OPEN; route 2026-08-03 FULL IN_PROGRESS; stop1 captured+validated; stop2 marked NO_READ_PENDING"
          setup_api_calls:
            - { call: "POST /_clock/set_current_utc", payload: { to_iso8601: "2026-08-01T00:00:00Z" }, as: MeterOpsAdmin }
            - { call: "POST /field-technicians", payload: { display_name: "Agg Tech" }, as: MeterOpsAdmin, captures: { tech_id: $.data.id } }
            - { call: "POST /service-accounts", payload: { account_number: "C-0005", service_address: "5 Agg Ave", billing_cycle_code: "C23" }, as: MeterOpsAdmin, captures: { acct_1: $.data.id } }
            - { call: "POST /service-accounts", payload: { account_number: "C-0006", service_address: "6 Agg Ave", billing_cycle_code: "C23" }, as: MeterOpsAdmin, captures: { acct_2: $.data.id } }
            - { call: "POST /meters", payload: { serial_number: "SN-AGG-1", meter_type: "HANDHELD" }, as: MeterOpsAdmin, captures: { meter_1: $.data.id } }
            - { call: "POST /meters", payload: { serial_number: "SN-AGG-2", meter_type: "HANDHELD" }, as: MeterOpsAdmin, captures: { meter_2: $.data.id } }
            - { call: "POST /meters/${meter_1}/install", payload: { service_account_id: "${acct_1}" }, as: MeterOpsAdmin }
            - { call: "POST /meters/${meter_2}/install", payload: { service_account_id: "${acct_2}" }, as: MeterOpsAdmin }
            - { call: "POST /billing-cycle-periods", payload: { cycle_code: "C23", period_start_date: "2026-08-01", period_end_date: "2026-08-31", read_window_open_date: "2026-08-03", read_window_close_date: "2026-08-07", bill_run_date: "2026-08-31" }, as: MeterOpsAdmin, captures: { period_id: $.data.id } }
            - { call: "POST /_clock/set_current_utc", payload: { to_iso8601: "2026-08-03T08:00:00Z" }, as: MeterOpsAdmin }
            - { call: "POST /billing-cycle-periods/${period_id}/open-read-window", payload: {}, as: BillingLiaison }
            - { call: "POST /routes", payload: { billing_cycle_period_id: "${period_id}", scheduled_date: "2026-08-03", route_shift: "FULL" }, as: Dispatcher, captures: { route_id: $.data.id } }
            - { call: "GET /routes/${route_id}/stops", payload: {}, as: Dispatcher, captures: { stop_1: "$.data[0].id", sv_1: "$.data[0].version", stop_2: "$.data[1].id" } }
            - { call: "POST /routes/${route_id}/assign", payload: { technician_id: "${tech_id}" }, as: Dispatcher }
            - { call: "POST /routes/${route_id}/start", payload: {}, as: FieldTechnician, as_user_id: "${tech_id}" }
            - { call: "POST /route-stops/${stop_1}/reads", payload: { meter_id: "${meter_1}", read_value: 100, read_at: "2026-08-03T09:00:00Z", expected_route_stop_version: "${sv_1}" }, as: FieldTechnician, as_user_id: "${tech_id}", captures: { read_1: $.data.id } }
            - { call: "POST /reads/${read_1}/validate", payload: {}, as: BillingLiaison }
            - { call: "POST /route-stops/${stop_2}/mark-no-read", payload: { no_read_reason: "NO_ACCESS" }, as: FieldTechnician, as_user_id: "${tech_id}" }
          trigger:
            - { call: "POST /ops-snapshots", payload: { snapshot_at: "2026-08-04T00:00:00Z" }, as: MeterOpsAdmin, captures: { snap_id: $.data.id } }
          assert:
            - "OpsSnapshot.${snap_id}.eligible_stop_count == 2"
            - "OpsSnapshot.${snap_id}.covered_stop_count == 1 and backlog_count == 1"
            - "OpsSnapshot.${snap_id}.read_rate_percent == 50.00 and net_read_rate_percent == 50.00"
            - "OpsSnapshot.${snap_id}.validated_read_count == 1 and estimated_read_count == 0"
            - "OpsSnapshot.${snap_id}.sla_breach == null while DRAFT (only finalize sets it)"

      - name: entity_listing_pagination_defaults_and_offset
        claim_type: listing
        grounds: [response_envelope, 'endpoints["GET /meters"]']
        distinguishing_aspect: "12 meters: default page returns 10 with total_count 12 and has_more true; offset=10 returns the remaining 2 with has_more false."
        test_recipe:
          setup: ["12 meters SN-PG-01..SN-PG-12 created"]
          setup_api_calls:
            - { call: "POST /meters", payload: { serial_number: "SN-PG-01", meter_type: "HANDHELD" }, as: MeterOpsAdmin }
            - { call: "POST /meters", payload: { serial_number: "SN-PG-02", meter_type: "HANDHELD" }, as: MeterOpsAdmin }
            - { call: "POST /meters", payload: { serial_number: "SN-PG-03", meter_type: "HANDHELD" }, as: MeterOpsAdmin }
            - { call: "POST /meters", payload: { serial_number: "SN-PG-04", meter_type: "HANDHELD" }, as: MeterOpsAdmin }
            - { call: "POST /meters", payload: { serial_number: "SN-PG-05", meter_type: "HANDHELD" }, as: MeterOpsAdmin }
            - { call: "POST /meters", payload: { serial_number: "SN-PG-06", meter_type: "HANDHELD" }, as: MeterOpsAdmin }
            - { call: "POST /meters", payload: { serial_number: "SN-PG-07", meter_type: "HANDHELD" }, as: MeterOpsAdmin }
            - { call: "POST /meters", payload: { serial_number: "SN-PG-08", meter_type: "HANDHELD" }, as: MeterOpsAdmin }
            - { call: "POST /meters", payload: { serial_number: "SN-PG-09", meter_type: "HANDHELD" }, as: MeterOpsAdmin }
            - { call: "POST /meters", payload: { serial_number: "SN-PG-10", meter_type: "HANDHELD" }, as: MeterOpsAdmin }
            - { call: "POST /meters", payload: { serial_number: "SN-PG-11", meter_type: "HANDHELD" }, as: MeterOpsAdmin }
            - { call: "POST /meters", payload: { serial_number: "SN-PG-12", meter_type: "HANDHELD" }, as: MeterOpsAdmin }
          trigger:
            - { call: "GET /meters", payload: {}, as: Dispatcher, captures: { } }
            - { call: "GET /meters", payload: { limit: 2, offset: 10 }, as: Dispatcher, captures: { } }
          assert:
            - "default page: data has 10 items, total_count == 12, has_more == true"
            - "limit=2&offset=10: data has 2 items, total_count == 12, has_more == false"

      - name: entity_listing_enum_filter_and_filter_limit_interaction
        claim_type: listing
        grounds: ['endpoints["GET /meters"]', entities.Meter.fields.meter_status]
        distinguishing_aspect: "Enum filter narrows the set; pagination metadata reflects the FILTERED total (IN_STOCK 2 of 3 meters, limit=1 -> has_more true)."
        test_recipe:
          setup: ["3 meters: two IN_STOCK, one installed (IN_SERVICE)"]
          setup_api_calls:
            - { call: "POST /service-accounts", payload: { account_number: "C-0007", service_address: "7 Filter Rd", billing_cycle_code: "C01" }, as: MeterOpsAdmin, captures: { acct_id: $.data.id } }
            - { call: "POST /meters", payload: { serial_number: "SN-FL-1", meter_type: "HANDHELD" }, as: MeterOpsAdmin }
            - { call: "POST /meters", payload: { serial_number: "SN-FL-2", meter_type: "HANDHELD" }, as: MeterOpsAdmin }
            - { call: "POST /meters", payload: { serial_number: "SN-FL-3", meter_type: "HANDHELD" }, as: MeterOpsAdmin, captures: { m3: $.data.id } }
            - { call: "POST /meters/${m3}/install", payload: { service_account_id: "${acct_id}" }, as: MeterOpsAdmin }
          trigger:
            - { call: "GET /meters", payload: { meter_status: "IN_STOCK" }, as: Dispatcher, captures: { } }
            - { call: "GET /meters", payload: { meter_status: "IN_STOCK", limit: 1 }, as: Dispatcher, captures: { } }
            - { call: "GET /meters", payload: { meter_status: "IN_SERVICE" }, as: Dispatcher, captures: { } }
          assert:
            - "IN_STOCK filter: total_count == 2 and data has 2 items"
            - "IN_STOCK with limit=1: data has 1 item, has_more == true, total_count == 2"
            - "IN_SERVICE filter: total_count == 1 and data has 1 item"

      - name: entity_fk_reverse_reachability_filtered_lists
        claim_type: parent_relationships
        grounds: ['endpoints["GET /reads"]', 'endpoints["GET /route-stops"]', 'endpoints["GET /hazard-flags"]']
        distinguishing_aspect: "Every FK used in this fixture is discoverable from the parent side: reads by meter_id, stops by route_id, hazard flags by service_account_id."
        test_recipe:
          setup: ["account with meter on a route; one captured read; one hazard flag"]
          setup_api_calls:
            - { call: "POST /_clock/set_current_utc", payload: { to_iso8601: "2026-08-01T00:00:00Z" }, as: MeterOpsAdmin }
            - { call: "POST /field-technicians", payload: { display_name: "FK Tech" }, as: MeterOpsAdmin, captures: { tech_id: $.data.id } }
            - { call: "POST /service-accounts", payload: { account_number: "C-0008", service_address: "8 FK Blvd", billing_cycle_code: "C24" }, as: MeterOpsAdmin, captures: { acct_id: $.data.id } }
            - { call: "POST /meters", payload: { serial_number: "SN-FK-1", meter_type: "HANDHELD" }, as: MeterOpsAdmin, captures: { meter_id: $.data.id } }
            - { call: "POST /meters/${meter_id}/install", payload: { service_account_id: "${acct_id}" }, as: MeterOpsAdmin }
            - { call: "POST /hazard-flags", payload: { service_account_id: "${acct_id}", hazard_type: "OTHER", severity: "LOW" }, as: FieldTechnician, as_user_id: "${tech_id}" }
            - { call: "POST /hazard-flags/${acct_id}/clear", payload: {}, as: Dispatcher, captures: { err: $.data.error_id } }
            - { call: "POST /billing-cycle-periods", payload: { cycle_code: "C24", period_start_date: "2026-08-01", period_end_date: "2026-08-31", read_window_open_date: "2026-08-03", read_window_close_date: "2026-08-07", bill_run_date: "2026-08-31" }, as: MeterOpsAdmin, captures: { period_id: $.data.id } }
            - { call: "POST /_clock/set_current_utc", payload: { to_iso8601: "2026-08-03T08:00:00Z" }, as: MeterOpsAdmin }
            - { call: "POST /billing-cycle-periods/${period_id}/open-read-window", payload: {}, as: BillingLiaison }
            - { call: "POST /routes", payload: { billing_cycle_period_id: "${period_id}", scheduled_date: "2026-08-03", route_shift: "AM", two_person_crew: true }, as: Dispatcher, captures: { route_id: $.data.id } }
            - { call: "GET /routes/${route_id}/stops", payload: {}, as: Dispatcher, captures: { stop_id: "$.data[0].id", sv: "$.data[0].version" } }
            - { call: "POST /routes/${route_id}/assign", payload: { technician_id: "${tech_id}" }, as: Dispatcher }
            - { call: "POST /routes/${route_id}/start", payload: {}, as: FieldTechnician, as_user_id: "${tech_id}" }
            - { call: "POST /route-stops/${stop_id}/reads", payload: { meter_id: "${meter_id}", read_value: 42, read_at: "2026-08-03T09:00:00Z", expected_route_stop_version: "${sv}" }, as: FieldTechnician, as_user_id: "${tech_id}", captures: { read_id: $.data.id } }
          trigger:
            - { call: "GET /reads", payload: { meter_id: "${meter_id}" }, as: Dispatcher, captures: { got_read: "$.data[0].id" } }
            - { call: "GET /route-stops", payload: { route_id: "${route_id}" }, as: Dispatcher, captures: { got_stop: "$.data[0].id" } }
            - { call: "GET /hazard-flags", payload: { service_account_id: "${acct_id}" }, as: Dispatcher, captures: { got_flag: "$.data[0].id" } }
          assert:
            - "GET /reads?meter_id -> total_count == 1 and the single item id == ${read_id} (${got_read})"
            - "GET /route-stops?route_id -> total_count == 1 and the single item id == ${stop_id} (${got_stop})"
            - "GET /hazard-flags?service_account_id -> total_count == 1 (${got_flag} is the flag reported in setup)"
            - "the hazard flag cleared in setup (posted against the account id path is a 404 — flag ids are not account ids): err == ERR_NOT_FOUND"

      - name: entity_meter_system_field_input_ignored
        claim_type: system_fields
        grounds: [entities.Meter.fields.meter_status]
        distinguishing_aspect: "Client-supplied meter_status on create is ignored: the meter is still IN_STOCK."
        test_recipe:
          setup: ["empty database"]
          setup_api_calls: []
          trigger:
            - { call: "POST /meters", payload: { serial_number: "SN-SYS-1", meter_type: "HANDHELD", meter_status: "RETIRED" }, as: MeterOpsAdmin, captures: { meter_id: $.data.id, st: $.data.meter_status } }
          assert:
            - "Meter.${meter_id}.meter_status == IN_STOCK (${st}) — input value RETIRED ignored"

  - section: state_machines
    instances:
      - name: route_assign_from_assigned_returns_invalid_state
        claim_type: invalid_transition
        grounds: [state_machines.Route.transitions, 'errors[ERR_INVALID_STATE_TRANSITION]']
        distinguishing_aspect: "assign is only legal from DRAFT (the ASSIGNED->ASSIGNED self-loop belongs exclusively to reassign); a second assign on an ASSIGNED route fails with ERR_INVALID_STATE_TRANSITION and technician_id is unchanged."
        test_recipe:
          setup: ["period exists; empty route created (no accounts in cycle -> zero stops), already ASSIGNED to tech A"]
          setup_api_calls:
            - { call: "POST /field-technicians", payload: { display_name: "Assign A" }, as: MeterOpsAdmin, captures: { tech_a: $.data.id } }
            - { call: "POST /field-technicians", payload: { display_name: "Assign B" }, as: MeterOpsAdmin, captures: { tech_b: $.data.id } }
            - { call: "POST /billing-cycle-periods", payload: { cycle_code: "C30", period_start_date: "2026-08-01", period_end_date: "2026-08-31", read_window_open_date: "2026-08-03", read_window_close_date: "2026-08-07", bill_run_date: "2026-08-31" }, as: MeterOpsAdmin, captures: { period_id: $.data.id } }
            - { call: "POST /routes", payload: { billing_cycle_period_id: "${period_id}", scheduled_date: "2026-08-03", route_shift: "AM" }, as: Dispatcher, captures: { route_id: $.data.id } }
            - { call: "POST /routes/${route_id}/assign", payload: { technician_id: "${tech_a}" }, as: Dispatcher }
          trigger:
            - { call: "POST /routes/${route_id}/assign", payload: { technician_id: "${tech_b}" }, as: Dispatcher, captures: { err: $.data.error_id } }
          assert:
            - "error_id == ERR_INVALID_STATE_TRANSITION (409)"
            - "Route.${route_id}.route_status == ASSIGNED and technician_id == ${tech_a}"

      - name: route_cancel_cascades_pending_stops_to_cancelled
        claim_type: side_effect_execution
