      - name: adjudicated_sf_above_claimed_sf_rejected
        claim_type: violation_to_error
        grounds: ["validations[priority 50]", "entities.WarrantyClaim.adjudicated_affected_sf"]
        distinguishing_aspect: "250 adjudicated square feet against a 240 sq ft claim is refused with 422 before any reserve movement, while 240 exactly is accepted and debits 173113 cents."
        test_recipe:
          setup: ["A SOLID RED_OAK line (material 895 c/sf, funded 600000) with one SUBMITTED 240 sq ft claim installed 2026-03-15. Logical clock 2026-08-20."]
          setup_api_calls:
            - { call: "POST /_clock/set_current_utc", payload: { current_utc: "2026-08-20T00:00:00.000Z" }, as: MillAdmin }
            - { call: "POST /mill/species-profiles", payload: { species_code: "RED_OAK", common_name: "Red Oak", density_class: "DENSE", tangential_shrinkage_coefficient: 0.145, target_moisture_pct: 7.0, max_moisture_gradient_pp: 2.0 }, as: MillAdmin, captures: { species_id: "$.data.id" } }
            - { call: "POST /mill/product-lines", payload: { line_code: "SOLID-RO-325", species_profile_id: "${species_id}", construction_type: "SOLID", nominal_width_in: 3.250, nominal_thickness_in: 0.750, material_value_cents_per_sf: 895, warranty_funded_total_cents: 600000 }, as: MillAdmin, captures: { line_id: "$.data.id" } }
            - { call: "POST /mill/warranty-claims", payload: { product_line_id: "${line_id}", claim_type: "CUPPING", affected_square_feet: 240, installation_date: "2026-03-15", subfloor_moisture_pct_at_install: 10.5, ambient_rh_pct_at_install: 62 }, as: WarrantyAdjudicator, as_user_id: "u_intake", captures: { claim_id: "$.data.id" } }
          trigger:
            - { call: "POST /mill/warranty-claims/${claim_id}/adjudicate", payload: { decision: "APPROVED", adjudicated_affected_sf: 250, adjudicated_subfloor_moisture_pct: 10.5, adjudicated_ambient_rh_pct: 62 }, as: WarrantyAdjudicator, as_user_id: "u_adjudicator" }
            - { call: "POST /mill/warranty-claims/${claim_id}/adjudicate", payload: { decision: "APPROVED", adjudicated_affected_sf: 240, adjudicated_subfloor_moisture_pct: 10.5, adjudicated_ambient_rh_pct: 62 }, as: WarrantyAdjudicator, as_user_id: "u_adjudicator" }
          assert:
            - "250 sq ft: status 422 with data.error_id == \"ERR_ADJUDICATED_SF_EXCEEDS_CLAIM\"; the claim stays \"SUBMITTED\" with adjudicated_liability_cents == null and adjudicated_by_user_id == null."
            - "GET /mill/product-lines/{line_id} after the rejection shows warranty_committed_cents == 0 and posture \"OPEN\"."
            - "240 sq ft: status 200 with data.adjudication_status == \"APPROVED\", data.installer_share_pct == 50, data.service_months == 5, data.depreciation_pct == 2.5 and data.adjudicated_liability_cents == 173113 (gross 355104 -> depreciated 346226 -> 50 pct)."
            - "The line then shows warranty_committed_cents == 173113, warranty_balance_cents == 426887 and posture \"RESTRICTED\"."

      - name: fourth_open_claim_rejected_and_allowed_after_denial
        claim_type: violation_to_error
        grounds: ["validations[priority 48]", "constants.MAX_OPEN_CLAIMS"]
        distinguishing_aspect: "An INFO_REQUESTED claim still counts as open, so three claims (one of them awaiting information) block a fourth with 409; denying one frees the slot immediately."
        test_recipe:
          setup: ["A SOLID RED_OAK line (material 895 c/sf, funded 600000) with three PENDING claims, one of which has been moved to INFO_REQUESTED. Logical clock 2026-08-20."]
          setup_api_calls:
