# =============================================================================
# SCAFFOLD_DIFFICULTY_DESIGN.yaml — task_1775_site_utility_excavation_contracting
# §1.8 Test Targeting Index: 9 Difficulty Rules x 2 instances each.
# Every setup_api_calls / trigger chain replays against SCAFFOLD.yaml §1.5.
# All ${var} placeholders are bound by a captures: block earlier in the same
# instance. Numeric asserts were computed by executing the §1.3 formulas.
# =============================================================================
scaffold_difficulty_design:
  - rule_id: dual_variant_calc
    instances:
      - name: co_price_provisional_vs_final_reconciliation
        grounds:
          - calculations.change_order_price
          - entities.ChangeOrder.fields.provisional_price_cents
          - entities.ChangeOrder.fields.final_price_cents
          - entities.ChangeOrder.fields.price_delta_cents
        distinguishing_aspect: |
          Same ChangeOrder priced by the two sanctioned variants: PROVISIONAL
          (estimate inputs) yields 287500 cents; FINAL (actual inputs) yields
          327750 cents — identical formula shape, different input set, provably
          different money. Entity domain: ChangeOrder (distinct from the
          PipeSegment domain of the sibling instance).
        test_recipe:
          setup:
            - "Project P (contingency_cents 100000000, single_co_cap_cents 5000000), status ACTIVE, version 1"
            - "UtilityOwner O registered"
            - "UnforeseenCondition C on P: OPEN, stop_work_required=false, ROCK"
          setup_api_calls:
            - call: "POST /site-utility/projects"
              payload: { name: "P-CO", contract_ref: "C-100", soil_class_default: SOIL_C, contingency_cents: 100000000, single_co_cap_cents: 5000000 }
              as: ProjectManager
              captures: { p_id: $.data.id, p_v: $.data.version }
            - call: "POST /site-utility/utility-owners"
              payload: { name: "City Water", owner_type: WATER, min_notice_hours: 48, max_shutdown_hours: 8 }
              as: OpsAdmin
              captures: { o_id: $.data.id }
            - call: "POST /site-utility/unforeseen-conditions"
              payload: { project_id: "${p_id}", condition_type: ROCK, stop_work_required: false, description: "rock at 8 ft" }
              as: ProjectManager
              captures: { uc_id: $.data.id }
          trigger:
            - call: "POST /site-utility/change-orders"
              payload: { project_id: "${p_id}", unforeseen_condition_id: "${uc_id}", utility_owner_id: "${o_id}", labor_hours: 10.0, labor_rate_cents: 15000, equipment_hours: 4.0, equipment_rate_cents: 20000, material_cost_cents: 20000, expected_project_version: "${p_v}" }
              as: ProjectManager
              captures: { co_id: $.data.id }
            - call: "POST /site-utility/change-orders/${co_id}/submit"
              payload: {}
              as: ProjectManager
              as_user_id: "pm-1"
            - call: "POST /site-utility/change-orders/${co_id}/review"
              payload: { decision: APPROVE }
              as: ProjectManager
              as_user_id: "pm-2"
            - call: "POST /site-utility/change-orders/${co_id}/complete"
              payload: { actual_labor_hours: 12.0, actual_labor_rate_cents: 15000, actual_equipment_hours: 4.0, actual_equipment_rate_cents: 20000, actual_material_cost_cents: 25000 }
              as: ProjectManager
          assert:
            - "ChangeOrder.${co_id}.direct_cost_cents == 250000 and markup_cents == 37500 at submit (250000 * 0.15)"
            - "ChangeOrder.${co_id}.provisional_price_cents == 287500 (PROVISIONAL variant)"
            - "ChangeOrder.${co_id}.final_price_cents == 327750 (FINAL variant: direct 285000 + markup 42750)"
            - "ChangeOrder.${co_id}.price_delta_cents == 40250"
            - "Project.${p_id}.approved_co_total_cents == 327750 after complete (287500 at approve, +40250 delta at complete)"
            - "UnforeseenCondition.${uc_id}.status == MITIGATING (auto-advanced by the APPROVE)"

      - name: segment_compaction_mean_vs_worst_lift
        grounds:
          - calculations.segment_compaction_summary
          - entities.PipeSegment.fields.avg_compaction_pct
          - entities.PipeSegment.fields.min_compaction_pct
        distinguishing_aspect: |
          Same governing test set {95.0, 95.7} summarized by two sanctioned
          variants on the SAME segment: MEAN yields avg_compaction_pct 95.4
          while WORST_LIFT yields min_compaction_pct 95.0. Entity domain:
          PipeSegment compaction (distinct from ChangeOrder pricing).
        test_recipe:
          setup:
            - "Project P ACTIVE; ticket T ACTIVE (legal_start 2026-08-03, clock advanced to it)"
            - "Pothole PH VERIFIED; segment S (CLASS_B bedding, invert 8.0 ft, diameter 12 in -> lifts_required 10) driven to BACKFILLING via approved plan, READY, INSTALLING, INSTALLED, CONFIRMED-PASS inspection, start-backfill"
          setup_api_calls:
            - call: "POST /site-utility/projects"
              payload: { name: "P-CMP", contract_ref: "C-200", soil_class_default: SOIL_C, contingency_cents: 100000000, single_co_cap_cents: 5000000 }
              as: ProjectManager
              captures: { p_id: $.data.id }
            - call: "POST /site-utility/utility-owners"
              payload: { name: "City Water", owner_type: WATER, min_notice_hours: 48, max_shutdown_hours: 8 }
              as: OpsAdmin
              captures: { o_id: $.data.id }
            - call: "POST /site-utility/locate-tickets"
              payload: { project_id: "${p_id}", ticket_number: "T-1", legal_start_at: "2026-08-03T00:00:00Z" }
              as: ProjectManager
              captures: { t_id: $.data.id }
            - call: "POST /site-utility/locate-tickets/${t_id}/submit"
              payload: {}
              as: ProjectManager
            - call: "POST /site-utility/_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-03T00:00:00Z" }
              as: OpsAdmin
            - call: "POST /site-utility/pothole-verifications"
              payload: { project_id: "${p_id}", locate_ticket_id: "${t_id}", station_label: "STA 10+00", expected_utility_type: WATER, method: VACUUM, design_depth_in: 60, design_offset_in: 12 }
              as: ProjectManager
              captures: { ph_id: $.data.id }
            - call: "POST /site-utility/pothole-verifications/${ph_id}/perform"
              payload: { measured_depth_in: 62, measured_offset_in: 15 }
              as: Foreman
            - call: "POST /site-utility/pothole-verifications/${ph_id}/verify"
              payload: {}
              as: ProjectManager
            - call: "POST /site-utility/pipe-segments"
              payload: { project_id: "${p_id}", utility_owner_id: "${o_id}", segment_label: "WL-A-01", pipe_material: PVC_C900, diameter_in: 12, length_ft: 200.0, bedding_class: CLASS_B, design_invert_depth_ft: 8.0, design_slope_pct: 1.0, requires_dewatering: false }
              as: Foreman
              captures: { s_id: $.data.id }
            - call: "POST /site-utility/trench-safety-plans"
              payload: { project_id: "${p_id}", pipe_segment_id: "${s_id}", max_depth_ft: 9.5, soil_class: SOIL_C, protective_system: SLOPING, slope_ratio: 1.5 }
              as: Foreman
              captures: { sp_id: $.data.id }
            - call: "POST /site-utility/trench-safety-plans/${sp_id}/submit"
              payload: {}
              as: Foreman
              as_user_id: "foreman-1"
            - call: "POST /site-utility/trench-safety-plans/${sp_id}/review"
              payload: { decision: APPROVE }
              as: SafetyOfficer
              as_user_id: "safety-1"
            - call: "POST /site-utility/pipe-segments/${s_id}/mark-ready"
              payload: {}
              as: Foreman
            - call: "POST /site-utility/pipe-segments/${s_id}/start-install"
              payload: {}
              as: Foreman
            - call: "POST /site-utility/pipe-segments/${s_id}/complete-install"
              payload: {}
              as: Foreman
            - call: "POST /site-utility/installation-inspections"
              payload: { pipe_segment_id: "${s_id}", bedding_ok: true, joint_ok: true, slope_measured_pct: 1.1, cover_depth_ft: 3.5 }
              as: Inspector
              as_user_id: "insp-1"
              captures: { ii_id: $.data.id }
            - call: "POST /site-utility/installation-inspections/${ii_id}/confirm"
              payload: {}
              as: Inspector
              as_user_id: "insp-2"
            - call: "POST /site-utility/pipe-segments/${s_id}/start-backfill"
              payload: {}
              as: Foreman
          trigger:
            - call: "POST /site-utility/compaction-tests"
              payload: { pipe_segment_id: "${s_id}", lift_number: 1, proctor_max_density_pcf: 150.0, field_density_pcf: 142.5, moisture_pct: 12.0 }
              as: Foreman
              as_user_id: "foreman-1"
              captures: { ct1_id: $.data.id }
            - call: "POST /site-utility/compaction-tests/${ct1_id}/review"
              payload: { decision: ACCEPT }
              as: Inspector
              as_user_id: "insp-1"
            - call: "POST /site-utility/compaction-tests"
              payload: { pipe_segment_id: "${s_id}", lift_number: 2, proctor_max_density_pcf: 150.0, field_density_pcf: 143.5, moisture_pct: 12.0 }
              as: Foreman
              as_user_id: "foreman-1"
              captures: { ct2_id: $.data.id }
            - call: "POST /site-utility/compaction-tests/${ct2_id}/review"
              payload: { decision: ACCEPT }
              as: Inspector
              as_user_id: "insp-1"
          assert:
            - "CompactionTest.${ct1_id}.compaction_pct == 95.0 and result == PASS"
            - "CompactionTest.${ct2_id}.compaction_pct == 95.7 and result == PASS"
            - "PipeSegment.${s_id}.lifts_satisfied == 2"
            - "PipeSegment.${s_id}.avg_compaction_pct == 95.4 (MEAN variant: round_half_up((95.0+95.7)/2, 1))"
            - "PipeSegment.${s_id}.min_compaction_pct == 95.0 (WORST_LIFT variant)"
            - "avg_compaction_pct != min_compaction_pct for the identical governing set — the two variants diverge"

  - rule_id: combinatorial_formula
    instances:
      - name: co_price_pinned_rounding_order
        grounds:
          - calculations.change_order_price
          - entities.ChangeOrder.fields.direct_cost_cents
          - entities.ChangeOrder.fields.markup_cents
        distinguishing_aspect: |
          Mode (b) nested rounding: the scaffold pins per-cost-line round_half_up
          THEN per-tier-slice round_half_up. With 3.5h x 10001c labor and 1.5h x
          7777c equipment the pinned order yields provisional 54822; the
          alternative sum-then-round order would yield 54821 — the orders
          disagree by one cent and only the pinned order is correct.
        test_recipe:
          setup:
            - "Project P ACTIVE, single_co_cap_cents 5000000; UnforeseenCondition C OPEN (CONTAMINATED_SOIL, stop_work_required=false)"
          setup_api_calls:
            - call: "POST /site-utility/projects"
              payload: { name: "P-RND", contract_ref: "C-300", soil_class_default: SOIL_B, contingency_cents: 100000000, single_co_cap_cents: 5000000 }
              as: ProjectManager
              captures: { p_id: $.data.id, p_v: $.data.version }
            - call: "POST /site-utility/utility-owners"
              payload: { name: "Gas Co", owner_type: GAS, min_notice_hours: 72, max_shutdown_hours: 4 }
              as: OpsAdmin
              captures: { o_id: $.data.id }
            - call: "POST /site-utility/unforeseen-conditions"
              payload: { project_id: "${p_id}", condition_type: CONTAMINATED_SOIL, stop_work_required: false, description: "stained soil at sta 12+00" }
              as: ProjectManager
              captures: { uc_id: $.data.id }
          trigger:
            - call: "POST /site-utility/change-orders"
              payload: { project_id: "${p_id}", unforeseen_condition_id: "${uc_id}", utility_owner_id: "${o_id}", labor_hours: 3.5, labor_rate_cents: 10001, equipment_hours: 1.5, equipment_rate_cents: 7777, material_cost_cents: 1001, expected_project_version: "${p_v}" }
              as: ProjectManager
              captures: { co_id: $.data.id }
          assert:
            - "ChangeOrder.${co_id}.direct_cost_cents == 47671 (round_half_up(3.5*10001)=35004 + round_half_up(1.5*7777)=11666 + 1001)"
            - "ChangeOrder.${co_id}.markup_cents == 7151 (single tier slice round_half_up(47671*0.15)=round_half_up(7150.65))"
            - "ChangeOrder.${co_id}.provisional_price_cents == 54822 (sum-then-round order would produce 54821 and MUST NOT be used)"

      - name: as_built_tolerance_nested_max
        grounds:
          - calculations.as_built_acceptance
          - entities.AsBuiltPackage.fields.within_tolerance
          - entities.AsBuiltPackage.fields.length_variance_ft
        distinguishing_aspect: |
          Mode (a) >=3 inputs with non-linear interaction: two nested max()
          tolerance branches in one predicate — the length leg takes the
          percentage branch (max(1.0, 2.0)=2.0) while the invert leg takes the
          floor branch (max(0.1, 0.04)=0.1); both boundaries are inclusive.
          Distinct mode from the sibling instance's mode (b) rounding order.
        test_recipe:
          setup:
            - "Project P ACTIVE; segment S with length_ft 200.0 and design_invert_depth_ft 8.0 (PLANNED is sufficient — as-built create has no segment-state gate)"
          setup_api_calls:
            - call: "POST /site-utility/projects"
              payload: { name: "P-AB", contract_ref: "C-400", soil_class_default: SOIL_A, contingency_cents: 100000000, single_co_cap_cents: 5000000 }
              as: ProjectManager
              captures: { p_id: $.data.id }
            - call: "POST /site-utility/utility-owners"
              payload: { name: "City Water", owner_type: WATER, min_notice_hours: 48, max_shutdown_hours: 8 }
              as: OpsAdmin
              captures: { o_id: $.data.id }
            - call: "POST /site-utility/pipe-segments"
              payload: { project_id: "${p_id}", utility_owner_id: "${o_id}", segment_label: "WL-B-01", pipe_material: DUCTILE_IRON, diameter_in: 8, length_ft: 200.0, bedding_class: CLASS_C, design_invert_depth_ft: 8.0, design_slope_pct: 2.0, requires_dewatering: false }
              as: Foreman
              captures: { s_id: $.data.id }
          trigger:
            - call: "POST /site-utility/as-built-packages"
              payload: { pipe_segment_id: "${s_id}", surveyor_stamp: "SURV-77", measured_length_ft: 202.0, measured_invert_ft: 8.1 }
              as: ProjectManager
              captures: { ab_id: $.data.id }
          assert:
            - "AsBuiltPackage.${ab_id}.length_variance_ft == 2.0 and invert_variance_ft == 0.1"
            - "length tolerance = max(1.0, round_half_up(0.01*200.0,1)) == 2.0 (percentage branch); invert tolerance = max(0.1, round_half_up(0.005*8.0,2)) == 0.1 (floor branch)"
            - "AsBuiltPackage.${ab_id}.within_tolerance == true (2.0 <= 2.0 and 0.1 <= 0.1, both inclusive)"

  - rule_id: non_linear_state_machine
    instances:
      - name: trench_plan_revision_cycle
        grounds:
          - state_machines.TrenchSafetyPlan.SUBMITTED_to_REJECTED
          - state_machines.TrenchSafetyPlan.REJECTED_to_DRAFT
        distinguishing_aspect: |
          Cyclic machine on TrenchSafetyPlan: DRAFT->SUBMITTED->REJECTED->DRAFT->
          SUBMITTED->APPROVED traverses the revision loop once; revision counter
          proves the cycle (1 -> 2). Entity distinct from the sibling instance's
          Project.
        test_recipe:
          setup:
            - "Project P ACTIVE; segment S PLANNED; plan SP drafted (SOIL_C, SLOPING, ratio 1.5)"
          setup_api_calls:
            - call: "POST /site-utility/projects"
              payload: { name: "P-TSP", contract_ref: "C-500", soil_class_default: SOIL_C, contingency_cents: 100000000, single_co_cap_cents: 5000000 }
              as: ProjectManager
              captures: { p_id: $.data.id }
            - call: "POST /site-utility/utility-owners"
              payload: { name: "City Water", owner_type: WATER, min_notice_hours: 48, max_shutdown_hours: 8 }
              as: OpsAdmin
              captures: { o_id: $.data.id }
            - call: "POST /site-utility/pipe-segments"
              payload: { project_id: "${p_id}", utility_owner_id: "${o_id}", segment_label: "WL-C-01", pipe_material: HDPE, diameter_in: 12, length_ft: 150.0, bedding_class: CLASS_B, design_invert_depth_ft: 8.0, design_slope_pct: 1.0, requires_dewatering: false }
              as: Foreman
              captures: { s_id: $.data.id }
            - call: "POST /site-utility/trench-safety-plans"
              payload: { project_id: "${p_id}", pipe_segment_id: "${s_id}", max_depth_ft: 9.5, soil_class: SOIL_C, protective_system: SLOPING, slope_ratio: 1.5 }
              as: Foreman
              captures: { sp_id: $.data.id }
          trigger:
            - call: "POST /site-utility/trench-safety-plans/${sp_id}/submit"
              payload: {}
              as: Foreman
              as_user_id: "foreman-1"
            - call: "POST /site-utility/trench-safety-plans/${sp_id}/review"
              payload: { decision: REJECT }
              as: SafetyOfficer
              as_user_id: "safety-1"
            - call: "POST /site-utility/trench-safety-plans/${sp_id}/revise"
              payload: {}
              as: Foreman
            - call: "POST /site-utility/trench-safety-plans/${sp_id}/submit"
              payload: {}
              as: Foreman
              as_user_id: "foreman-1"
            - call: "POST /site-utility/trench-safety-plans/${sp_id}/review"
              payload: { decision: APPROVE }
              as: SafetyOfficer
              as_user_id: "safety-1"
          assert:
            - "TrenchSafetyPlan.${sp_id}.revision == 2 after the REJECTED->DRAFT loop"
            - "TrenchSafetyPlan.${sp_id}.status == APPROVED after re-submit and re-review"
            - "TrenchSafetyPlan.${sp_id}.submitted_by_user_id == foreman-1 and reviewed_by_user_id == safety-1"

      - name: project_status_x_posture_parallel_dims
        grounds:
          - state_machines.Project.CLEAR_to_STOPPED
          - state_machines.Project.STOPPED_to_CLEAR
          - entities.Project.fields.work_posture
        distinguishing_aspect: |
          Parallel state dimensions on ONE entity: Project.status stays ACTIVE
          while Project.work_posture independently cycles CLEAR->STOPPED->CLEAR
          via a stop-work condition and its resolution. Entity distinct from
          the sibling instance's TrenchSafetyPlan; shape (parallel dimensions)
          distinct from its cycle.
        test_recipe:
          setup:
            - "Project P ACTIVE, work_posture CLEAR, no conditions"
          setup_api_calls:
            - call: "POST /site-utility/projects"
              payload: { name: "P-PAR", contract_ref: "C-600", soil_class_default: SOIL_A, contingency_cents: 100000000, single_co_cap_cents: 5000000 }
              as: ProjectManager
              captures: { p_id: $.data.id }
          trigger:
            - call: "POST /site-utility/unforeseen-conditions"
              payload: { project_id: "${p_id}", condition_type: ROCK, stop_work_required: true, description: "rock face" }
              as: ProjectManager
              captures: { uc_id: $.data.id }
            - call: "POST /site-utility/unforeseen-conditions/${uc_id}/resolve"
              payload: { outcome: RESOLVED }
              as: ProjectManager
          assert:
            - "After condition create: Project.${p_id}.status == ACTIVE and Project.${p_id}.work_posture == STOPPED (dimensions independent)"
            - "After resolve: Project.${p_id}.status == ACTIVE and Project.${p_id}.work_posture == CLEAR"
            - "UnforeseenCondition.${uc_id}.status == RESOLVED"
  - rule_id: transitive_cascade
    instances:
      - name: turbidity_suspend_depth3_cascade
        grounds:
          - state_machines.DischargePermit.ACTIVE_to_SUSPENDED
          - state_machines.PipeSegment.INSTALLING_to_ON_HOLD
          - state_machines.ShutdownWindow.PROPOSED_to_CANCELLED
          - calculations.discharge_classification
        distinguishing_aspect: |
          Depth-3 cascade triggered by a discharge reading: EXCEEDS_TURBIDITY
          classification suspends the permit (hop 1); the suspension holds the
          dewatering-dependent INSTALLING segment (hop 2); the segment hold
          cancels its PROPOSED shutdown window (hop 3). Trigger differs from
          the sibling instance (unforeseen-condition create).
        test_recipe:
          setup:
            - "Project P ACTIVE; owner O (min_notice_hours 24, max_shutdown_hours 12); ticket ACTIVE (clock at 2026-08-03T00:00:00Z); pothole VERIFIED"
            - "Segment S requires_dewatering=true, driven to INSTALLING via approved plan and READY gate"
            - "ShutdownWindow W PROPOSED for S: 2026-08-05T10:00:00Z -> 2026-08-05T12:00:00Z (120 min committed)"
            - "DischargePermit DP ACTIVE (effective 2026-08-01..2026-09-01; turbidity_limit 50; max_flow 500; daily volume 100000)"
          setup_api_calls:
            - call: "POST /site-utility/projects"
              payload: { name: "P-DW", contract_ref: "C-700", soil_class_default: SOIL_C, contingency_cents: 100000000, single_co_cap_cents: 5000000 }
              as: ProjectManager
              captures: { p_id: $.data.id, p_v: $.data.version }
            - call: "POST /site-utility/utility-owners"
              payload: { name: "City Water", owner_type: WATER, min_notice_hours: 24, max_shutdown_hours: 12 }
              as: OpsAdmin
              captures: { o_id: $.data.id }
            - call: "POST /site-utility/locate-tickets"
              payload: { project_id: "${p_id}", ticket_number: "T-1", legal_start_at: "2026-08-03T00:00:00Z" }
              as: ProjectManager
              captures: { t_id: $.data.id }
            - call: "POST /site-utility/locate-tickets/${t_id}/submit"
              payload: {}
              as: ProjectManager
            - call: "POST /site-utility/_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-03T00:00:00Z" }
              as: OpsAdmin
            - call: "POST /site-utility/pothole-verifications"
              payload: { project_id: "${p_id}", locate_ticket_id: "${t_id}", station_label: "STA 10+00", expected_utility_type: WATER, method: VACUUM, design_depth_in: 60, design_offset_in: 12 }
              as: ProjectManager
              captures: { ph_id: $.data.id }
            - call: "POST /site-utility/pothole-verifications/${ph_id}/perform"
              payload: { measured_depth_in: 60, measured_offset_in: 12 }
              as: Foreman
            - call: "POST /site-utility/pothole-verifications/${ph_id}/verify"
              payload: {}
              as: ProjectManager
            - call: "POST /site-utility/pipe-segments"
              payload: { project_id: "${p_id}", utility_owner_id: "${o_id}", segment_label: "WL-D-01", pipe_material: PVC_C900, diameter_in: 12, length_ft: 200.0, bedding_class: CLASS_B, design_invert_depth_ft: 8.0, design_slope_pct: 1.0, requires_dewatering: true }
              as: Foreman
              captures: { s_id: $.data.id }
            - call: "POST /site-utility/trench-safety-plans"
              payload: { project_id: "${p_id}", pipe_segment_id: "${s_id}", max_depth_ft: 9.5, soil_class: SOIL_C, protective_system: TRENCH_BOX }
              as: Foreman
              captures: { sp_id: $.data.id }
            - call: "POST /site-utility/trench-safety-plans/${sp_id}/submit"
              payload: {}
              as: Foreman
              as_user_id: "foreman-1"
            - call: "POST /site-utility/trench-safety-plans/${sp_id}/review"
              payload: { decision: APPROVE }
              as: SafetyOfficer
              as_user_id: "safety-1"
            - call: "POST /site-utility/pipe-segments/${s_id}/mark-ready"
              payload: {}
              as: Foreman
            - call: "POST /site-utility/pipe-segments/${s_id}/start-install"
              payload: {}
              as: Foreman
            - call: "POST /site-utility/shutdown-windows"
              payload: { project_id: "${p_id}", utility_owner_id: "${o_id}", pipe_segment_id: "${s_id}", window_start: "2026-08-05T10:00:00Z", window_end: "2026-08-05T12:00:00Z", expected_project_version: "${p_v}" }
              as: ProjectManager
              captures: { w_id: $.data.id }
