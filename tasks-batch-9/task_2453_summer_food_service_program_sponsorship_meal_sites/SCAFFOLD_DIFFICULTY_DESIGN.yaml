  - rule_id: transitive_cascade
    instances:
      - name: critical_finding_suspends_site_voids_days_and_holds_claim_line
        grounds:
          - state_machines.MonitoringVisit.CONDUCTED_to_REPORT_FILED
          - state_machines.Site.APPROVED_to_SUSPENDED
          - state_machines.MealServiceDay.PLANNED_to_VOIDED
          - entities.ClaimLineItem.fields.hold_flag
          - entities.MealClaim.fields.blocking_hold_count
          - calculations.corrective_action_due_date
        distinguishing_aspect: |
          Depth-4 cascade from POST /sfsp/monitoring-visits/{visit_id}/report: hop 1 creates a CRITICAL
          CorrectiveAction; BECAUSE that action exists hop 2 drives Site.approval_status to SUSPENDED
          with claim_hold true; BECAUSE the site became SUSPENDED hop 3 voids its PLANNED 2026-06-15
          day; BECAUSE the site is on claim hold hop 4 sets the DRAFT claim line item's hold_flag and
          recomputes MealClaim.blocking_hold_count to 1. Each hop is caused by the previous one, not
          directly by the report call.
        test_recipe:
          setup:
            - "Sponsor APPROVED; one rural SELF_PREP OPEN site APPROVED and OPERATING since 2026-06-08."
            - "MealServiceDay 2026-06-08 FINALIZED with 47 LUNCH first meals; MealServiceDay 2026-06-15 still PLANNED."
            - "A DRAFT June claim with one line item for that site (hold_flag false, blocking_hold_count 0)."
            - "A FULL_REVIEW monitoring visit scheduled 2026-06-10 and already CONDUCTED at logical clock 2026-06-10T09:00:00Z."
