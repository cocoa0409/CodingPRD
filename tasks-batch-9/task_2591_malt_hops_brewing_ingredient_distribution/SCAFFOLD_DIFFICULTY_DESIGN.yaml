# =============================================================================
# 1.8 Scaffold Difficulty Design (Test Targeting Index)
#
# Task 2591 — Malt, Hops & Brewing Ingredient Distribution (BSG CraftBrewing)
#
# Every instance grounds in elements already declared in SCAFFOLD.yaml §1.1-§1.7.
# Every numeric literal in an `assert:` line was produced by executing the
# corresponding §1.3 `formula:` against its `constants:` in Python — none are
# estimates and none are left as expressions.
#
# The logical clock default is 2026-08-01T00:00:00Z (see POST /_clock/set_current_utc);
# every instance pins it explicitly as its first setup call so no chain depends
# on the implicit default.
# =============================================================================
scaffold_difficulty_design:

  # ===========================================================================
  # Rule 1 — Dual-variant calculations across different entity domains
  # ===========================================================================
  - rule_id: dual_variant_calc
    instances:

      - name: order_fee_provisional_vs_final_freight_tier_self_promotion
        grounds:
          - calculations.order_fee_assessment
          - calculations.freight_program_tier
          - calculations.order_subtotal_rollup
          - entities.SalesOrder.fields.fee_variant
          - entities.SalesOrder.fields.final_freight_adjustment_cents
          - entities.SalesOrder.fields.freight_tier_applied
          - state_machines.SalesOrder.DRAFT_to_CONFIRMED
          - state_machines.SalesOrder.SHIPPED_to_DELIVERED
        distinguishing_aspect: |
          This dual variant operates on the SalesOrder money domain: the
          PROVISIONAL pass excludes the order's own 2530 chargeable pounds from
          the brewer's trailing volume and lands on TIER_1 at 12 cents per pound,
          while the FINAL pass includes them, crosses TIER_2_MIN_LBS at 40530
          pounds, and re-rates at 8 cents per pound — so the same line data yields
          total_cents 417125 then 407005, a delta of -10120 booked as
          final_freight_adjustment_cents.
        test_recipe:
          setup:
            - "Logical clock at 2026-08-01T00:00:00Z."
            - "Brewer 'Ridgeline Brewing' with credit_limit_cents 5000000, cold_chain_certified true and legacy_trailing_lbs 38000 — 1470 pounds short of TIER_2_MIN_LBS."
            - "Crop-year program 2026 OPEN; hop variety Citra (cold_storage_required true, pallet_quantity_lbs 880); malt product Pale Ale Malt (pallet_quantity_lbs 2200)."
            - "A 5000 lb FIXED_CROP_YEAR Citra contract at 285.50 cents/lb with delivery window 2026-09-01 through 2026-12-31."
            - "A 20000 lb malt lot analysed and released by two different users."
            - "Cold storage zone Z1 with capacity_pallets 10 and temp_setpoint_c 2.0."
            - "A DRAFT order for requested_ship_date 2026-10-15 with one 880 lb CONTRACT hop line (no pallet break) and one 1650 lb malt line (pallet break)."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-08-01T00:00:00Z" }
              as: PlatformAdmin
            - call: "POST /brewers"
              payload: { name: "Ridgeline Brewing", brewery_license_no: "BR-0001", credit_terms_days: 30, credit_limit_cents: 5000000, cold_chain_certified: true, legacy_trailing_lbs: 38000 }
              as: CreditManager
              captures: { brewer_id: $.data.id }
            - call: "POST /crop-year-programs"
              payload: { crop_year: 2026, contract_open_date: "2026-01-15T00:00:00Z", harvest_report_due_date: "2026-10-01T00:00:00Z" }
              as: AllocationManager
              captures: { prog26_id: $.data.id }
            - call: "POST /hop-varieties"
              payload: { variety_code: "CITRA", name: "Citra", substitution_group: "AROMA_HIGH_ALPHA", alpha_acid_target_pct: 12.50, spot_price_cents_per_lb: 51.00, available_spot_lbs: 20000, cold_storage_required: true, pallet_quantity_lbs: 880, min_order_lbs: 44 }
              as: AllocationManager
              captures: { citra_id: $.data.id }
            - call: "POST /malt-products"
              payload: { sku: "PALE-ALE", name: "Pale Ale Malt", malt_class: "BASE", list_price_cents_per_lb: 68.50, max_moisture_pct: 5.0, min_diastatic_power: 60.0, pallet_quantity_lbs: 2200, min_order_lbs: 55 }
              as: WarehouseOperator
              captures: { malt_pale_id: $.data.id }
            - call: "POST /malt-lots"
              payload: { malt_product_id: "${malt_pale_id}", lot_code: "LOT-2601", quantity_lbs: 20000 }
              as: WarehouseOperator
              captures: { lot1_id: $.data.id }
            - call: "POST /malt-lots/${lot1_id}/analysis"
              payload: { color_lovibond: 2.60, extract_pct: 79.90, moisture_pct: 4.20, protein_pct: 11.10, diastatic_power: 92.00 }
              as: WarehouseOperator
              as_user_id: "qa-analyst-1"
            - call: "POST /malt-lots/${lot1_id}/release"
              payload: { release_note: "cleared for picking" }
              as: WarehouseOperator
              as_user_id: "qa-analyst-2"
            - call: "POST /cold-storage-zones"
              payload: { zone_code: "Z1", temp_setpoint_c: 2.0, capacity_pallets: 10, tolerance_c: 2.0 }
              as: WarehouseOperator
              captures: { zone1_id: $.data.id }
            - call: "POST /hop-contracts"
              payload: { brewer_id: "${brewer_id}", variety_id: "${citra_id}", crop_year_program_id: "${prog26_id}", contract_type: "FIXED_CROP_YEAR", contracted_lbs: 5000, price_per_lb_cents: 285.50, delivery_window_start: "2026-09-01T00:00:00Z", delivery_window_end: "2026-12-31T00:00:00Z" }
              as: AllocationManager
              captures: { c1_id: $.data.id }
            - call: "POST /sales-orders"
              payload: { brewer_id: "${brewer_id}", requested_ship_date: "2026-10-15T00:00:00Z", purchase_order_ref: "PO-1001" }
              as: Brewer
              as_user_id: "${brewer_id}"
              captures: { o1_id: $.data.id }
            - call: "POST /sales-orders/${o1_id}/lines"
              payload: { item_type: "HOP", quantity: 880, uom: "LB", allocation_source: "CONTRACT", hop_variety_id: "${citra_id}", hop_contract_id: "${c1_id}" }
              as: Brewer
              as_user_id: "${brewer_id}"
              captures: { l1_id: $.data.id }
            - call: "POST /sales-orders/${o1_id}/lines"
              payload: { item_type: "MALT", quantity: 1650, uom: "LB", malt_lot_id: "${lot1_id}" }
              as: Brewer
              as_user_id: "${brewer_id}"
              captures: { l2_id: $.data.id }
          trigger:
            - call: "POST /sales-orders/${o1_id}/confirm"
              payload: {}
              as: Brewer
              as_user_id: "${brewer_id}"
              captures: { prov_total: $.data.total_cents, prov_tier: $.data.freight_tier_applied }
            - call: "POST /sales-orders/${o1_id}/credit-decision"
              payload: { decision: "APPROVE" }
              as: CreditManager
            - call: "POST /sales-orders/${o1_id}/pick"
              payload: {}
              as: WarehouseOperator
            - call: "GET /sales-orders/${o1_id}"
              payload: {}
              as: WarehouseOperator
              captures: { o1_v: $.data.version }
            - call: "POST /cold-chain-shipments"
              payload: { sales_order_id: "${o1_id}", cold_storage_zone_id: "${zone1_id}", expected_sales_order_version: "${o1_v}", pallet_count: 3, stage_from: "2026-08-01T00:00:00Z", stage_until: "2026-08-02T00:00:00Z", reefer_setpoint_c: 2.0, reefer_tolerance_c: 2.0 }
              as: WarehouseOperator
              captures: { s1_id: $.data.id }
            - call: "POST /cold-chain-shipments/${s1_id}/depart"
              payload: {}
              as: WarehouseOperator
            - call: "POST /sales-orders/${o1_id}/ship"
              payload: {}
              as: WarehouseOperator
            - call: "POST /sales-orders/${o1_id}/deliver"
              payload: {}
              as: WarehouseOperator
              captures: { final_total: $.data.total_cents }
          assert:
            - "OrderLine.${l1_id}.extended_cents == 251240"
            - "OrderLine.${l2_id}.extended_cents == 113025"
            - "OrderLine.${l1_id}.pallet_break == false"
            - "OrderLine.${l2_id}.pallet_break == true"
            - "SalesOrder.${o1_id}.subtotal_cents == 364265"
            - "SalesOrder.${o1_id}.chargeable_lbs == 2530"
            - "SalesOrder.${o1_id}.volume_discount_cents == 0"
            - "SalesOrder.${o1_id}.requires_cold_chain == true"
            - "PROVISIONAL pass: ${prov_tier} == TIER_1 and ${prov_total} == 417125"
            - "PROVISIONAL pass: SalesOrder.${o1_id}.freight_cents was 48360 and pallet_break_fee_cents was 4500 and small_order_surcharge_cents was 0"
            - "FINAL pass: SalesOrder.${o1_id}.fee_variant == FINAL"
            - "FINAL pass: SalesOrder.${o1_id}.freight_tier_applied == TIER_2"
            - "FINAL pass: SalesOrder.${o1_id}.freight_cents == 38240"
            - "FINAL pass: ${final_total} == 407005 and SalesOrder.${o1_id}.total_cents == 407005"
            - "SalesOrder.${o1_id}.final_freight_adjustment_cents == -10120"
            - "Brewer.${brewer_id}.ar_balance_cents == 407005"
            - "Brewer.${brewer_id}.trailing_12mo_volume_lbs == 40530"
            - "Brewer.${brewer_id}.freight_program_tier == TIER_2"

      - name: contract_default_settlement_market_vs_liquidated_damages
        grounds:
          - calculations.contract_default_settlement
          - calculations.brewer_ar_ledger
          - entities.HopContract.fields.settlement_variant
          - entities.HopContract.fields.settlement_damages_cents
          - entities.HopContract.fields.settlement_total_cents
          - state_machines.HopContract.ACTIVE_to_DEFAULTED
          - state_machines.CropYearProgram.OPEN_to_HARVEST_REPORTED
        distinguishing_aspect: |
          This dual variant operates on the HopContract commitment domain, not on
          order money: on identical 5000 lb / 250.00 cents contracts the
          MARKET_SETTLED variant prices damages off the spot spread
          (250.00 - 51.00) for 995000 cents while the LIQUIDATED variant prices a
          flat 35 percent of contract value for 437500 cents, and the variant is
          selected by the parent CropYearProgram's status rather than by a
          calculation stage.
        test_recipe:
          setup:
            - "Logical clock at 2026-08-01T00:00:00Z."
            - "Two brewers D1 and D2, each with credit_limit_cents 5000000."
            - "Hop variety Citra with spot_price_cents_per_lb 51.00."
            - "Crop-year program 2026 which has REPORTED a 100 percent harvest, so it is HARVEST_REPORTED and no contract is short."
            - "Crop-year program 2027 still OPEN, so it has no established market reference."
            - "Contract CM: brewer D1, 5000 lb at 250.00 cents in program 2026, window 2026-09-01 through 2026-12-31, ACTIVE with remaining_lbs 5000."
            - "Contract CL: brewer D2, 5000 lb at 250.00 cents in program 2027, window 2027-09-01 through 2027-12-31, ACTIVE with remaining_lbs 5000."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-08-01T00:00:00Z" }
              as: PlatformAdmin
            - call: "POST /brewers"
              payload: { name: "Deltaworks Brewing", brewery_license_no: "BR-D1", credit_terms_days: 30, credit_limit_cents: 5000000, cold_chain_certified: true, legacy_trailing_lbs: 0 }
              as: CreditManager
              captures: { d1_id: $.data.id }
            - call: "POST /brewers"
              payload: { name: "Lockwood Brewing", brewery_license_no: "BR-D2", credit_terms_days: 30, credit_limit_cents: 5000000, cold_chain_certified: true, legacy_trailing_lbs: 0 }
              as: CreditManager
              captures: { d2_id: $.data.id }
            - call: "POST /crop-year-programs"
              payload: { crop_year: 2026, contract_open_date: "2026-01-15T00:00:00Z", harvest_report_due_date: "2026-10-01T00:00:00Z" }
              as: AllocationManager
              captures: { prog26_id: $.data.id }
            - call: "POST /crop-year-programs"
              payload: { crop_year: 2027, contract_open_date: "2027-01-15T00:00:00Z", harvest_report_due_date: "2027-10-01T00:00:00Z" }
              as: AllocationManager
              captures: { prog27_id: $.data.id }
            - call: "POST /hop-varieties"
              payload: { variety_code: "CITRA", name: "Citra", substitution_group: "AROMA_HIGH_ALPHA", alpha_acid_target_pct: 12.50, spot_price_cents_per_lb: 51.00, available_spot_lbs: 20000, cold_storage_required: true, pallet_quantity_lbs: 880, min_order_lbs: 44 }
              as: AllocationManager
              captures: { citra_id: $.data.id }
            - call: "POST /hop-contracts"
              payload: { brewer_id: "${d1_id}", variety_id: "${citra_id}", crop_year_program_id: "${prog26_id}", contract_type: "FIXED_CROP_YEAR", contracted_lbs: 5000, price_per_lb_cents: 250.00, delivery_window_start: "2026-09-01T00:00:00Z", delivery_window_end: "2026-12-31T00:00:00Z" }
              as: AllocationManager
              captures: { cm_id: $.data.id }
            - call: "POST /hop-contracts"
              payload: { brewer_id: "${d2_id}", variety_id: "${citra_id}", crop_year_program_id: "${prog27_id}", contract_type: "FIXED_CROP_YEAR", contracted_lbs: 5000, price_per_lb_cents: 250.00, delivery_window_start: "2027-09-01T00:00:00Z", delivery_window_end: "2027-12-31T00:00:00Z" }
              as: AllocationManager
              captures: { cl_id: $.data.id }
            - call: "POST /crop-year-programs/${prog26_id}/report-harvest"
              payload: { harvest_yield_pct: 100.00, reported_note: "full crop" }
              as: AllocationManager
          trigger:
            - call: "POST /hop-contracts/${cm_id}/declare-default"
              payload: { default_reason: "brewer walked away from crop-year commitment" }
              as: AllocationManager
              as_user_id: "alloc-mgr-1"
            - call: "POST /hop-contracts/${cl_id}/declare-default"
              payload: { default_reason: "brewer walked away from crop-year commitment" }
              as: AllocationManager
              as_user_id: "alloc-mgr-1"
          assert:
            - "HopContract.${cm_id}.settlement_variant == MARKET_SETTLED"
            - "HopContract.${cm_id}.settlement_damages_cents == 995000"
            - "HopContract.${cm_id}.settlement_admin_fee_cents == 19900"
            - "HopContract.${cm_id}.settlement_total_cents == 1014900"
            - "HopContract.${cl_id}.settlement_variant == LIQUIDATED"
            - "HopContract.${cl_id}.settlement_damages_cents == 437500"
            - "HopContract.${cl_id}.settlement_admin_fee_cents == 8750"
            - "HopContract.${cl_id}.settlement_total_cents == 446250"
            - "HopContract.${cm_id}.settlement_total_cents != HopContract.${cl_id}.settlement_total_cents"
            - "HopContract.${cm_id}.defaulted_lbs == 5000 and HopContract.${cm_id}.remaining_lbs == 0"
            - "HopContract.${cl_id}.defaulted_lbs == 5000 and HopContract.${cl_id}.remaining_lbs == 0"
            - "Brewer.${d1_id}.ar_balance_cents == 1014900"
            - "Brewer.${d2_id}.ar_balance_cents == 446250"

  # ===========================================================================
  # Rule 2 — Combinatorial formulas across different modes
  # ===========================================================================
  - rule_id: combinatorial_formula
    instances:

      - name: subtotal_rounds_each_line_before_summing_mode_b
        grounds:
          - calculations.order_subtotal_rollup
          - calculations.order_fee_assessment
          - entities.OrderLine.fields.extended_cents
          - entities.SalesOrder.fields.subtotal_cents
          - validations[priority=34]
        distinguishing_aspect: |
          This is mode (b) nested-rounding-order complexity: two identical 55 lb
          lines at 100.50 cents/lb each produce the half-cent residue 5527.5,
          so rounding per line first gives extended_cents 5528 twice and
          subtotal_cents 11056, whereas summing the unrounded products (11055.00)
          and rounding once gives 11055 — a one-cent divergence that pins the
          normative order.
        test_recipe:
          setup:
            - "Logical clock at 2026-08-01T00:00:00Z."
            - "Brewer with credit_limit_cents 5000000, legacy_trailing_lbs 0 and cold_chain_certified false."
            - "Malt product Munich Malt with list_price_cents_per_lb 100.50, min_order_lbs 55, pallet_quantity_lbs 2200 and cold storage not required."
            - "A 500 lb Munich lot, analysed and released."
            - "A DRAFT order carrying two separate 55 lb Munich lines, each exactly at the product minimum order quantity."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-08-01T00:00:00Z" }
              as: PlatformAdmin
            - call: "POST /brewers"
              payload: { name: "Halfpenny Brewing", brewery_license_no: "BR-0002", credit_terms_days: 30, credit_limit_cents: 5000000, cold_chain_certified: false, legacy_trailing_lbs: 0 }
              as: CreditManager
              captures: { brewer_id: $.data.id }
            - call: "POST /malt-products"
              payload: { sku: "MUNICH", name: "Munich Malt", malt_class: "BASE", list_price_cents_per_lb: 100.50, max_moisture_pct: 5.0, min_diastatic_power: 60.0, pallet_quantity_lbs: 2200, min_order_lbs: 55 }
              as: WarehouseOperator
              captures: { munich_id: $.data.id }
            - call: "POST /malt-lots"
              payload: { malt_product_id: "${munich_id}", lot_code: "LOT-MUN-01", quantity_lbs: 500 }
              as: WarehouseOperator
              captures: { lotm_id: $.data.id }
            - call: "POST /malt-lots/${lotm_id}/analysis"
              payload: { color_lovibond: 9.00, extract_pct: 80.50, moisture_pct: 4.10, protein_pct: 11.40, diastatic_power: 71.00 }
              as: WarehouseOperator
              as_user_id: "qa-analyst-1"
            - call: "POST /malt-lots/${lotm_id}/release"
              payload: { release_note: "cleared" }
              as: WarehouseOperator
              as_user_id: "qa-analyst-2"
            - call: "POST /sales-orders"
              payload: { brewer_id: "${brewer_id}", requested_ship_date: "2026-09-15T00:00:00Z", purchase_order_ref: "PO-2001" }
              as: Brewer
              as_user_id: "${brewer_id}"
              captures: { o2_id: $.data.id }
            - call: "POST /sales-orders/${o2_id}/lines"
              payload: { item_type: "MALT", quantity: 55, uom: "LB", malt_lot_id: "${lotm_id}" }
              as: Brewer
              as_user_id: "${brewer_id}"
              captures: { m1_id: $.data.id }
            - call: "POST /sales-orders/${o2_id}/lines"
              payload: { item_type: "MALT", quantity: 55, uom: "LB", malt_lot_id: "${lotm_id}" }
              as: Brewer
              as_user_id: "${brewer_id}"
              captures: { m2_id: $.data.id }
          trigger:
            - call: "POST /sales-orders/${o2_id}/confirm"
              payload: {}
              as: Brewer
              as_user_id: "${brewer_id}"
              captures: { sub: $.data.subtotal_cents, tot: $.data.total_cents }
          assert:
            - "OrderLine.${m1_id}.extended_cents == 5528"
            - "OrderLine.${m2_id}.extended_cents == 5528"
            - "${sub} == 11056 and SalesOrder.${o2_id}.subtotal_cents == 11056"
            - "SalesOrder.${o2_id}.subtotal_cents != 11055"
            - "SalesOrder.${o2_id}.chargeable_lbs == 110"
            - "SalesOrder.${o2_id}.volume_discount_cents == 0"
            - "SalesOrder.${o2_id}.freight_tier_applied == TIER_1"
            - "SalesOrder.${o2_id}.freight_cents == 25000"
            - "SalesOrder.${o2_id}.pallet_break_fee_cents == 9000"
            - "SalesOrder.${o2_id}.small_order_surcharge_cents == 7500"
            - "${tot} == 52556 and SalesOrder.${o2_id}.total_cents == 52556"
            - "OrderLine.${m1_id}.pallet_break == true and OrderLine.${m2_id}.pallet_break == true"

      - name: settlement_admin_fee_tier_read_from_pre_fee_damages_mode_c
        grounds:
          - calculations.contract_default_settlement
          - entities.HopContract.fields.settlement_admin_fee_cents
          - entities.HopContract.fields.settlement_total_cents
          - state_machines.HopContract.ACTIVE_to_DEFAULTED
        distinguishing_aspect: |
          This is mode (c) circular-looking evaluation order, not mode (b)
          rounding: settlement_total_cents = damages + fee while the fee rate is
          keyed on a damages tier, and the scaffold pins the tier read to the
          PRE-fee figure. Damages 995000 sit below ADMIN_FEE_TIER_CENTS so the
          2.0 percent rate applies for 19900 and a total of 1014900; reading the
          tier from the fee-inclusive total would self-justify the 1.0 percent
          rate and produce 1004950.
        test_recipe:
          setup:
            - "Logical clock at 2026-08-01T00:00:00Z."
            - "Brewer with credit_limit_cents 5000000."
            - "Hop variety Citra with spot_price_cents_per_lb 51.00."
            - "Crop-year program 2026 HARVEST_REPORTED at 100 percent yield, so MARKET_SETTLED applies."
            - "An ACTIVE 5000 lb contract at 250.00 cents/lb with remaining_lbs 5000, giving pre-fee damages of exactly 995000 cents — 5000 cents below the ADMIN_FEE_TIER_CENTS boundary, while damages-plus-1-percent-fee would sit above it."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-08-01T00:00:00Z" }
              as: PlatformAdmin
            - call: "POST /brewers"
              payload: { name: "Kestrel Brewing", brewery_license_no: "BR-0003", credit_terms_days: 30, credit_limit_cents: 5000000, cold_chain_certified: true, legacy_trailing_lbs: 0 }
              as: CreditManager
              captures: { brewer_id: $.data.id }
            - call: "POST /crop-year-programs"
              payload: { crop_year: 2026, contract_open_date: "2026-01-15T00:00:00Z", harvest_report_due_date: "2026-10-01T00:00:00Z" }
              as: AllocationManager
              captures: { prog26_id: $.data.id }
            - call: "POST /hop-varieties"
              payload: { variety_code: "CITRA", name: "Citra", substitution_group: "AROMA_HIGH_ALPHA", alpha_acid_target_pct: 12.50, spot_price_cents_per_lb: 51.00, available_spot_lbs: 20000, cold_storage_required: true, pallet_quantity_lbs: 880, min_order_lbs: 44 }
              as: AllocationManager
              captures: { citra_id: $.data.id }
            - call: "POST /hop-contracts"
              payload: { brewer_id: "${brewer_id}", variety_id: "${citra_id}", crop_year_program_id: "${prog26_id}", contract_type: "FIXED_CROP_YEAR", contracted_lbs: 5000, price_per_lb_cents: 250.00, delivery_window_start: "2026-09-01T00:00:00Z", delivery_window_end: "2026-12-31T00:00:00Z" }
              as: AllocationManager
              captures: { cm_id: $.data.id }
            - call: "POST /crop-year-programs/${prog26_id}/report-harvest"
              payload: { harvest_yield_pct: 100.00, reported_note: "full crop" }
              as: AllocationManager
          trigger:
            - call: "POST /hop-contracts/${cm_id}/declare-default"
              payload: { default_reason: "non-performance" }
              as: AllocationManager
              as_user_id: "alloc-mgr-1"
              captures: { fee: $.data.settlement_admin_fee_cents, tot: $.data.settlement_total_cents }
          assert:
            - "HopContract.${cm_id}.settlement_damages_cents == 995000"
            - "${fee} == 19900 and HopContract.${cm_id}.settlement_admin_fee_cents == 19900"
            - "${tot} == 1014900 and HopContract.${cm_id}.settlement_total_cents == 1014900"
            - "HopContract.${cm_id}.settlement_total_cents != 1004950"
            - "HopContract.${cm_id}.settlement_admin_fee_cents != 9950"
            - "Brewer.${brewer_id}.ar_balance_cents == 1014900"

      - name: pitch_advisory_nested_clamp_over_decayed_viability_mode_a
        grounds:
          - calculations.yeast_pitch_advisory
          - entities.YeastPropagationJob.fields.propagation_volume_l
          - entities.YeastPropagationJob.fields.recommended_slurry_l
          - entities.YeastPropagationJob.fields.pitch_rate_advice
          - entities.YeastStrain.fields.min_batch_l
          - entities.YeastStrain.fields.vessel_max_l
        distinguishing_aspect: |
          This is mode (a) non-linear interaction of five inputs, not a rounding
          or an evaluation-order question: strain type, gravity, batch volume,
          decayed viability and a safety factor feed a nested
          min(vessel_max_l, max(min_batch_l, slurry * 1.15)) clamp. A 1.0 bbl
          5.00-Plato ale needs only 440.06 billion cells and 0.470 L of slurry, so
          the safety-scaled 0.541 L is lifted by the inner max to the 20.0 L
          min_batch_l floor rather than passed through.
        test_recipe:
          setup:
            - "Logical clock at 2026-08-01T00:00:00Z."
            - "Brewer with credit_limit_cents 5000000 and credit_status GOOD_STANDING."
            - "Yeast strain WLP001, fermentation_type ALE, propagation_lead_time_days 7, viability_pct_at_ship 92.0, cells_per_ml_slurry_billion 1.2, min_batch_l 20.0, vessel_max_l 2000.0."
            - "Malt product Pale Ale Malt for the recipe's malt reference."
            - "Recipe 'Pilot Ale' with batch_volume_bbl 1.0, original_gravity_plato 5.00 and requested_pitch_rate 0.75, matching the ALE_TARGET_RATE exactly."
            - "A propagation requested for pitch_date 2026-08-08, exactly the 7-day lead time out, so viability has decayed 7 days from 0.92 to 0.78."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-08-01T00:00:00Z" }
              as: PlatformAdmin
            - call: "POST /brewers"
              payload: { name: "Pilot House Brewing", brewery_license_no: "BR-0004", credit_terms_days: 30, credit_limit_cents: 5000000, cold_chain_certified: true, legacy_trailing_lbs: 0 }
              as: CreditManager
              captures: { brewer_id: $.data.id }
            - call: "POST /yeast-strains"
              payload: { strain_code: "WLP001", name: "California Ale", fermentation_type: "ALE", propagation_lead_time_days: 7, list_price_cents_per_l: 1200.00, viability_pct_at_ship: 92.0, cells_per_ml_slurry_billion: 1.2, min_batch_l: 20.0, vessel_max_l: 2000.0 }
              as: WarehouseOperator
              captures: { wlp001_id: $.data.id }
            - call: "POST /malt-products"
              payload: { sku: "PALE-ALE", name: "Pale Ale Malt", malt_class: "BASE", list_price_cents_per_lb: 68.50, max_moisture_pct: 5.0, min_diastatic_power: 60.0, pallet_quantity_lbs: 2200, min_order_lbs: 55 }
              as: WarehouseOperator
              captures: { malt_pale_id: $.data.id }
            - call: "POST /brewer-recipes"
              payload: { brewer_id: "${brewer_id}", malt_product_id: "${malt_pale_id}", yeast_strain_id: "${wlp001_id}", name: "Pilot Ale", batch_volume_bbl: 1.0, original_gravity_plato: 5.00, target_color_lovibond: 2.50, target_extract_pct: 80.00, target_protein_pct: 11.00, requested_pitch_rate_million_cells_per_ml_per_plato: 0.75, adjunct_pct: 0.0 }
              as: Brewer
              as_user_id: "${brewer_id}"
              captures: { recipe_id: $.data.id }
          trigger:
            - call: "POST /yeast-propagation-jobs"
              payload: { brewer_id: "${brewer_id}", recipe_id: "${recipe_id}", yeast_strain_id: "${wlp001_id}", pitch_date: "2026-08-08T00:00:00Z" }
              as: Brewer
              as_user_id: "${brewer_id}"
              captures: { job_id: $.data.id, vol: $.data.propagation_volume_l }
          assert:
            - "YeastPropagationJob.${job_id}.recommended_pitch_rate_million_cells_per_ml_per_plato == 0.75"
            - "YeastPropagationJob.${job_id}.required_cells_billion == 440.06"
            - "YeastPropagationJob.${job_id}.recommended_slurry_l == 0.470"
            - "${vol} == 20.0 and YeastPropagationJob.${job_id}.propagation_volume_l == 20.0"
            - "YeastPropagationJob.${job_id}.propagation_volume_l != 0.541"
            - "YeastPropagationJob.${job_id}.pitch_rate_advice == OPTIMAL"
            - "YeastPropagationJob.${job_id}.status == REQUESTED"

  # ===========================================================================
  # Rule 3 — Non-linear state machines on different entities
  # ===========================================================================
  - rule_id: non_linear_state_machine
    instances:

      - name: sales_order_parallel_credit_and_fulfillment_dimensions
        grounds:
          - state_machines.SalesOrder.dimension.fulfillment_status
          - state_machines.SalesOrder.dimension.credit_status
          - state_machines.SalesOrder.PENDING_REVIEW_to_ON_HOLD
          - state_machines.SalesOrder.ON_HOLD_to_APPROVED
          - state_machines.SalesOrder.CONFIRMED_to_PICKED
          - errors.ERR_ORDER_CREDIT_NOT_APPROVED
          - validations[priority=46]
        distinguishing_aspect: |
          This is the SalesOrder's parallel shape: two independent state
          dimensions on one row. credit_status walks
          PENDING_REVIEW -> ON_HOLD -> APPROVED — a cycle back into APPROVED —
          while fulfillment_status sits still at CONFIRMED throughout, and only
          the combined state (CONFIRMED plus APPROVED) admits the pick. The
          rejected pick must leave BOTH dimensions untouched.
        test_recipe:
          setup:
            - "Logical clock at 2026-08-01T00:00:00Z."
            - "Brewer with credit_limit_cents 5000000, cold_chain_certified true, legacy_trailing_lbs 0."
            - "Hop variety Citra with available_spot_lbs 20000, spot_price_cents_per_lb 51.00, pallet_quantity_lbs 880, cold_storage_required true."
            - "A DRAFT order with a single 880 lb SPOT Citra line — exactly one pallet, so no pallet break, but below MOQ_ORDER_LBS."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-08-01T00:00:00Z" }
              as: PlatformAdmin
            - call: "POST /brewers"
              payload: { name: "Twin Dimension Brewing", brewery_license_no: "BR-0005", credit_terms_days: 30, credit_limit_cents: 5000000, cold_chain_certified: true, legacy_trailing_lbs: 0 }
              as: CreditManager
              captures: { brewer_id: $.data.id }
            - call: "POST /hop-varieties"
              payload: { variety_code: "CITRA", name: "Citra", substitution_group: "AROMA_HIGH_ALPHA", alpha_acid_target_pct: 12.50, spot_price_cents_per_lb: 51.00, available_spot_lbs: 20000, cold_storage_required: true, pallet_quantity_lbs: 880, min_order_lbs: 44 }
              as: AllocationManager
              captures: { citra_id: $.data.id }
            - call: "POST /sales-orders"
              payload: { brewer_id: "${brewer_id}", requested_ship_date: "2026-09-20T00:00:00Z", purchase_order_ref: "PO-3001" }
              as: Brewer
              as_user_id: "${brewer_id}"
              captures: { o3_id: $.data.id }
            - call: "POST /sales-orders/${o3_id}/lines"
              payload: { item_type: "HOP", quantity: 880, uom: "LB", allocation_source: "SPOT", hop_variety_id: "${citra_id}" }
              as: Brewer
              as_user_id: "${brewer_id}"
              captures: { sl_id: $.data.id }
          trigger:
            - call: "POST /sales-orders/${o3_id}/confirm"
              payload: {}
              as: Brewer
              as_user_id: "${brewer_id}"
              captures: { conf_total: $.data.total_cents }
            - call: "POST /sales-orders/${o3_id}/credit-decision"
              payload: { decision: "HOLD", decision_note: "awaiting updated financials" }
              as: CreditManager
            - call: "POST /sales-orders/${o3_id}/pick"
              payload: {}
              as: WarehouseOperator
              captures: { blocked_error: $.data.error_id }
            - call: "POST /sales-orders/${o3_id}/credit-decision"
              payload: { decision: "APPROVE", decision_note: "financials received" }
              as: CreditManager
            - call: "POST /sales-orders/${o3_id}/pick"
              payload: {}
              as: WarehouseOperator
          assert:
            - "after confirm: SalesOrder.${o3_id}.fulfillment_status == CONFIRMED and SalesOrder.${o3_id}.credit_status == PENDING_REVIEW"
            - "${conf_total} == 95380"
            - "SalesOrder.${o3_id}.freight_cents == 43000 and SalesOrder.${o3_id}.pallet_break_fee_cents == 0 and SalesOrder.${o3_id}.small_order_surcharge_cents == 7500"
            - "after HOLD decision: SalesOrder.${o3_id}.credit_status == ON_HOLD"
            - "after HOLD decision: SalesOrder.${o3_id}.fulfillment_status == CONFIRMED (the fulfillment dimension did not move)"
            - "blocked pick returns HTTP 402 with ${blocked_error} == ERR_ORDER_CREDIT_NOT_APPROVED"
            - "after the blocked pick: SalesOrder.${o3_id}.fulfillment_status == CONFIRMED and SalesOrder.${o3_id}.credit_status == ON_HOLD (neither dimension changed)"
            - "after APPROVE decision: SalesOrder.${o3_id}.credit_status == APPROVED and SalesOrder.${o3_id}.fulfillment_status == CONFIRMED"
            - "after the second pick: SalesOrder.${o3_id}.fulfillment_status == PICKED and SalesOrder.${o3_id}.credit_status == APPROVED"
            - "HopVariety.${citra_id}.available_spot_lbs == 19120"

      - name: hop_contract_carry_forward_decline_reenters_active
        grounds:
          - state_machines.HopContract.ACTIVE_to_CARRY_FORWARD_PENDING
          - state_machines.HopContract.CARRY_FORWARD_PENDING_to_ACTIVE
          - state_machines.HopContract.CARRY_FORWARD_PENDING_to_CARRIED_FORWARD
          - calculations.carry_forward_eligibility
          - entities.HopContract.fields.carry_forward_requested_lbs
          - entities.HopContract.fields.carried_forward_from_contract_id
        distinguishing_aspect: |
          This cycle lives on HopContract, not on SalesOrder, and it is a
          revert-then-retry loop rather than two parallel dimensions: a DECLINE
          returns the row to ACTIVE and NULLS carry_forward_target_program_id,
          carry_forward_requested_lbs and carry_forward_fee_cents, so the second
          request must recompute them from scratch rather than reuse stale values,
          and only the second pass mints the successor contract.
        test_recipe:
          setup:
            - "Logical clock at 2026-08-01T00:00:00Z."
            - "Brewer with credit_limit_cents 5000000 and ar_balance_cents 0."
            - "Crop-year program 2026 and program 2027 (crop_year exactly one greater, status OPEN)."
            - "Hop variety Citra."
            - "An ACTIVE 5000 lb FIXED_CROP_YEAR contract at 250.00 cents/lb in program 2026, no commitments, so remaining_lbs 5000."
            - "Program 2026 reports a 100.00 percent harvest so it is HARVEST_REPORTED and the contract stays ACTIVE with allocated_lbs 5000."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-08-01T00:00:00Z" }
              as: PlatformAdmin
            - call: "POST /brewers"
              payload: { name: "Rollover Brewing", brewery_license_no: "BR-0006", credit_terms_days: 30, credit_limit_cents: 5000000, cold_chain_certified: true, legacy_trailing_lbs: 0 }
              as: CreditManager
              captures: { brewer_id: $.data.id }
            - call: "POST /crop-year-programs"
              payload: { crop_year: 2026, contract_open_date: "2026-01-15T00:00:00Z", harvest_report_due_date: "2026-10-01T00:00:00Z" }
              as: AllocationManager
              captures: { prog26_id: $.data.id }
            - call: "POST /crop-year-programs"
              payload: { crop_year: 2027, contract_open_date: "2027-01-15T00:00:00Z", harvest_report_due_date: "2027-10-01T00:00:00Z" }
              as: AllocationManager
              captures: { prog27_id: $.data.id }
            - call: "POST /hop-varieties"
              payload: { variety_code: "CITRA", name: "Citra", substitution_group: "AROMA_HIGH_ALPHA", alpha_acid_target_pct: 12.50, spot_price_cents_per_lb: 51.00, available_spot_lbs: 20000, cold_storage_required: true, pallet_quantity_lbs: 880, min_order_lbs: 44 }
              as: AllocationManager
              captures: { citra_id: $.data.id }
            - call: "POST /hop-contracts"
              payload: { brewer_id: "${brewer_id}", variety_id: "${citra_id}", crop_year_program_id: "${prog26_id}", contract_type: "FIXED_CROP_YEAR", contracted_lbs: 5000, price_per_lb_cents: 250.00, delivery_window_start: "2026-09-01T00:00:00Z", delivery_window_end: "2026-12-31T00:00:00Z" }
              as: AllocationManager
              captures: { cf_id: $.data.id }
            - call: "POST /crop-year-programs/${prog26_id}/report-harvest"
              payload: { harvest_yield_pct: 100.00, reported_note: "full crop" }
              as: AllocationManager
          trigger:
            - call: "POST /hop-contracts/${cf_id}/carry-forward-requests"
              payload: { carry_forward_target_program_id: "${prog27_id}", requested_lbs: 1250, justification: "tank space" }
              as: Brewer
              as_user_id: "${brewer_id}"
              captures: { req1_fee: $.data.carry_forward_fee_cents }
            - call: "POST /hop-contracts/${cf_id}/carry-forward-decision"
              payload: { decision: "DECLINE", decision_note: "crop already allocated" }
              as: AllocationManager
            - call: "POST /hop-contracts/${cf_id}/carry-forward-requests"
              payload: { carry_forward_target_program_id: "${prog27_id}", requested_lbs: 1250, justification: "re-submitted after review" }
              as: Brewer
              as_user_id: "${brewer_id}"
            - call: "POST /hop-contracts/${cf_id}/carry-forward-decision"
              payload: { decision: "APPROVE", decision_note: "approved on appeal" }
              as: AllocationManager
            - call: "GET /hop-contracts"
              payload: { carried_forward_from_contract_id: "${cf_id}" }
              as: AllocationManager
              captures: { successor_id: "$.data[0].id", successor_lbs: "$.data[0].contracted_lbs" }
          assert:
            - "after request 1: HopContract.${cf_id}.status == CARRY_FORWARD_PENDING"
            - "after request 1: HopContract.${cf_id}.carry_forward_requested_lbs == 1250 and ${req1_fee} == 25000"
            - "after DECLINE: HopContract.${cf_id}.status == ACTIVE"
            - "after DECLINE: HopContract.${cf_id}.carry_forward_target_program_id == null and HopContract.${cf_id}.carry_forward_requested_lbs == null and HopContract.${cf_id}.carry_forward_fee_cents == null"
            - "after DECLINE: HopContract.${cf_id}.carried_forward_out_lbs == 0 and HopContract.${cf_id}.remaining_lbs == 5000"
            - "after request 2: HopContract.${cf_id}.status == CARRY_FORWARD_PENDING and HopContract.${cf_id}.carry_forward_fee_cents == 25000"
            - "after APPROVE: HopContract.${cf_id}.status == CARRIED_FORWARD"
            - "after APPROVE: HopContract.${cf_id}.carried_forward_out_lbs == 1250 and HopContract.${cf_id}.remaining_lbs == 3750"
            - "after APPROVE: HopContract.${cf_id}.allocated_lbs == 5000 (unchanged by the roll)"
            - "GET /hop-contracts?carried_forward_from_contract_id returns total_count 1"
            - "${successor_lbs} == 1250 and HopContract.${successor_id}.status == ACTIVE"
            - "HopContract.${successor_id}.crop_year_program_id == ${prog27_id}"
            - "HopContract.${successor_id}.price_per_lb_cents == 250.00 and HopContract.${successor_id}.contract_type == FIXED_CROP_YEAR"
            - "HopContract.${successor_id}.delivery_window_start == 2027-09-01T00:00:00Z and HopContract.${successor_id}.delivery_window_end == 2027-12-31T00:00:00Z"
            - "Brewer.${brewer_id}.ar_balance_cents == 25000"
            - "Brewer.${brewer_id}.credit_utilization_pct == 0.50 and Brewer.${brewer_id}.credit_status == GOOD_STANDING"

      - name: malt_lot_quarantine_retest_cycle_preserves_analysis_count
        grounds:
          - state_machines.MaltLot.RECEIVED_to_QUARANTINED
          - state_machines.MaltLot.QUARANTINED_to_RECEIVED
          - state_machines.MaltLot.RECEIVED_to_PASSED
          - state_machines.MaltLot.PASSED_to_RELEASED
          - entities.MaltLot.fields.analysis_count
          - entities.MaltLot.fields.quarantine_reason
        distinguishing_aspect: |
          A third distinct entity and a third loop flavour: MaltLot re-enters its
          own INITIAL state RECEIVED via retest, which is neither SalesOrder's
          parallel-dimension pattern nor HopContract's decline-and-retry. The
          monotone analysis_count is the proof the loop is not a reset — it reads
          2 after the second analysis even though the status is back to where it
          started, and quarantine_reason must be cleared rather than retained.
        test_recipe:
          setup:
            - "Logical clock at 2026-08-01T00:00:00Z."
            - "Malt product Pale Ale Malt, malt_class BASE, max_moisture_pct 5.0, min_diastatic_power 60.0."
            - "A RECEIVED 20000 lb lot with analysis_count 0 and quarantine_reason null."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-08-01T00:00:00Z" }
              as: PlatformAdmin
            - call: "POST /malt-products"
              payload: { sku: "PALE-ALE", name: "Pale Ale Malt", malt_class: "BASE", list_price_cents_per_lb: 68.50, max_moisture_pct: 5.0, min_diastatic_power: 60.0, pallet_quantity_lbs: 2200, min_order_lbs: 55 }
              as: WarehouseOperator
              captures: { malt_pale_id: $.data.id }
            - call: "POST /malt-lots"
              payload: { malt_product_id: "${malt_pale_id}", lot_code: "LOT-QT-01", quantity_lbs: 20000 }
              as: WarehouseOperator
              captures: { qlot_id: $.data.id }
          trigger:
            - call: "POST /malt-lots/${qlot_id}/analysis"
              payload: { color_lovibond: 2.60, extract_pct: 79.90, moisture_pct: 6.10, protein_pct: 11.10, diastatic_power: 92.00 }
              as: WarehouseOperator
              as_user_id: "qa-analyst-1"
              captures: { q_reason: $.data.quarantine_reason }
            - call: "POST /malt-lots/${qlot_id}/retest"
              payload: { retest_reason: "resampled after kiln re-dry" }
              as: WarehouseOperator
              as_user_id: "qa-analyst-1"
            - call: "POST /malt-lots/${qlot_id}/analysis"
              payload: { color_lovibond: 2.60, extract_pct: 79.90, moisture_pct: 4.20, protein_pct: 11.10, diastatic_power: 92.00 }
              as: WarehouseOperator
              as_user_id: "qa-analyst-1"
              captures: { second_count: $.data.analysis_count }
            - call: "POST /malt-lots/${qlot_id}/release"
              payload: { release_note: "cleared on retest" }
              as: WarehouseOperator
              as_user_id: "qa-analyst-2"
          assert:
            - "after analysis 1: MaltLot.${qlot_id}.status == QUARANTINED"
            - "after analysis 1: ${q_reason} == MOISTURE_ABOVE_MAX"
            - "after analysis 1: MaltLot.${qlot_id}.analysis_count == 1 and MaltLot.${qlot_id}.moisture_pct == 6.10"
            - "after retest: MaltLot.${qlot_id}.status == RECEIVED (back at the initial state)"
            - "after retest: MaltLot.${qlot_id}.quarantine_reason == null"
            - "after retest: MaltLot.${qlot_id}.analysis_count == 1 (the retest is not itself an analysis)"
            - "after analysis 2: MaltLot.${qlot_id}.status == PASSED"
            - "after analysis 2: ${second_count} == 2 and MaltLot.${qlot_id}.analysis_count == 2"
            - "after analysis 2: MaltLot.${qlot_id}.moisture_pct == 4.20 and MaltLot.${qlot_id}.quarantine_reason == null"
            - "after release: MaltLot.${qlot_id}.status == RELEASED"
            - "after release: MaltLot.${qlot_id}.analyzed_by_user_id == qa-analyst-1 and MaltLot.${qlot_id}.released_by_user_id == qa-analyst-2"
            - "MaltLot.${qlot_id}.version == 5"

  # ===========================================================================
  # Rule 4 — Transitive cascades from different triggers
  # ===========================================================================
  - rule_id: transitive_cascade
    instances:

      - name: report_harvest_shortfall_trims_lines_reprices_order_and_moves_credit
        cascade_depth: 5
        grounds:
          - state_machines.CropYearProgram.OPEN_to_HARVEST_REPORTED
          - state_machines.HopContract.ACTIVE_to_SHORTFALL_ADJUSTED
          - state_machines.OrderLine.OPEN_to_TRIMMED
          - calculations.shortfall_prorata_reallocation
          - calculations.order_subtotal_rollup
          - calculations.order_fee_assessment
          - calculations.brewer_credit_posture
        chain: |
          LINK 1 — POST /crop-year-programs/{id}/report-harvest with harvest_yield_pct
          50.00 freezes allocatable_pool_lbs at floor(4000 * 50 / 100) = 2000 and the
          waterfall writes HopContract.allocated_lbs = 2000, shortfall_lbs = 2000.
          LINK 2 (caused by link 1's allocated_lbs write) — because allocated_lbs 2000
          is below contracted_lbs 4000 the contract transitions
          ACTIVE -> SHORTFALL_ADJUSTED.
          LINK 3 (caused by link 2 leaving committed_lbs 4000 above allocated_lbs
          2000) — the single OPEN OrderLine on a CONFIRMED order is trimmed by the
          2000 lb gap: quantity 4000 -> 2000, trimmed_lbs 2000, status
          OPEN -> TRIMMED, and 2000 lbs return from committed_lbs to remaining_lbs.
          LINK 4 (caused by link 3's quantity change) — the owning SalesOrder re-runs
          order_subtotal_rollup and order_fee_assessment PROVISIONAL: subtotal_cents
          1000000 -> 500000, and because 500000 is below DISCOUNT_TIER_1_CENTS the
          1.5 percent volume discount of 15000 evaporates, while chargeable_lbs
          4000 -> 2000 drops freight_cents 66000 -> 43000, so total_cents
          1055500 -> 547500.
          LINK 5 (caused by link 4's total_cents rewrite) — the Brewer re-runs
          brewer_credit_posture: open_order_exposure_cents and credit_exposure_cents
          fall to 547500 and credit_utilization_pct 35.18 -> 18.25.
        distinguishing_aspect: |
          The trigger is a crop-year harvest report — a supply-side event on
          CropYearProgram — and the chain travels DOWNWARD through allocation into
          money: program -> contract -> line -> order -> brewer. It is five links
          deep and each link is caused strictly by the field the previous link
          wrote; nothing here is triggered by a default declaration or by a
          temperature reading.
        test_recipe:
          setup:
            - "Logical clock at 2026-08-01T00:00:00Z."
            - "Brewer 'Shortfall Brewing' with credit_limit_cents 3000000, cold_chain_certified true, legacy_trailing_lbs 0."
            - "Crop-year program 2026 OPEN."
            - "Hop variety Citra, pallet_quantity_lbs 880, cold_storage_required true."
            - "One ACTIVE 4000 lb FIXED_CROP_YEAR contract at 250.00 cents/lb, window 2026-09-01 through 2026-12-31 — the only contract in the program, so the whole pool is its own."
            - "A CONFIRMED order carrying one 4000 lb CONTRACT hop line, so committed_lbs is 4000 and remaining_lbs is 0."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-08-01T00:00:00Z" }
              as: PlatformAdmin
            - call: "POST /brewers"
              payload: { name: "Shortfall Brewing", brewery_license_no: "BR-0007", credit_terms_days: 30, credit_limit_cents: 3000000, cold_chain_certified: true, legacy_trailing_lbs: 0 }
              as: CreditManager
              captures: { b2_id: $.data.id }
            - call: "POST /crop-year-programs"
              payload: { crop_year: 2026, contract_open_date: "2026-01-15T00:00:00Z", harvest_report_due_date: "2026-10-01T00:00:00Z" }
              as: AllocationManager
              captures: { prog26_id: $.data.id }
            - call: "POST /hop-varieties"
              payload: { variety_code: "CITRA", name: "Citra", substitution_group: "AROMA_HIGH_ALPHA", alpha_acid_target_pct: 12.50, spot_price_cents_per_lb: 51.00, available_spot_lbs: 20000, cold_storage_required: true, pallet_quantity_lbs: 880, min_order_lbs: 44 }
              as: AllocationManager
