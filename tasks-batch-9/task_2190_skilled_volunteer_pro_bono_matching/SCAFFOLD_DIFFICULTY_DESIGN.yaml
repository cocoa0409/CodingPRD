              as: Volunteer
              as_user_id: "${vol_a}"
            - call: "POST /volunteers/${vol_a}/vet"
              payload: { verify_skill_codes: ["LEGAL_CONTRACTS"] }
              as: ProgramManager
              as_user_id: "pm-1"
            - call: "POST /volunteers/${vol_a}/availability-windows"
              payload: { starts_at: "2026-01-05T00:00:00Z", ends_at: "2026-03-01T00:00:00Z", window_kind: "HARD", hours_offered: 24.00 }
              as: Volunteer
              as_user_id: "${vol_a}"
              captures: { win_a: $.data.id }
            - call: "POST /volunteers"
              payload: { full_name: "Ben Iqbal", email: "ben@ex.org", professional_rate_usd_per_hour: 150.00, seniority: "SENIOR", weekly_hours_cap: 40 }
              as: ProgramManager
              as_user_id: "pm-1"
              captures: { vol_b: $.data.id }
            - call: "POST /volunteers/${vol_b}/skill-profiles"
