  # ---------------------------------------------------------------- Rule 3
  - rule_id: non_linear_state_machine
    instances:
      - name: flock_molt_cycle_returns_to_laying_then_caps
        grounds:
          - state_machines.Flock.LAYING_to_MOLT_REST
          - state_machines.Flock.MOLT_REST_to_LAYING
          - calculations.lay_curve_projection
        distinguishing_aspect: |
          Cyclic machine on Flock: LAYING -> MOLT_REST -> LAYING is a true cycle (not a
          pipeline), bounded by molt_count < MAX_MOLTS: after one completed loop the cycle closes
          and a second induce-molt is rejected with ERR_MOLT_LIMIT_REACHED. Sibling instance
          uses a different entity (EggLot).
        test_recipe:
          setup:
            - "Farm; house; flock placed 2026-01-05; clock 2027-03-01 (age 60 weeks); ops run done -> LAYING"
          setup_api_calls:
            - call: "POST /api/farms"
              payload: { name: "Cycle Farm", certification_program: "CONVENTIONAL", daily_overhead_cents: 12000 }
              as: PlatformAdmin
              captures: { farm_id: $.data.id }
            - call: "POST /api/houses"
              payload: { farm_id: "${farm_id}", house_code: "H1", environment_type: "CAGED", capacity_hens: 2000 }
              as: FarmManager
              captures: { house_id: $.data.id }
            - call: "POST /api/flocks"
              payload: { house_id: "${house_id}", breed_code: "HYLINE_BROWN", breed_peak_rate_pct: 95.0, placement_date: "2026-01-05", initial_hen_count: 800, pullet_cost_cents: 336000 }
              as: FarmManager
              captures: { flock_id: $.data.id }
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2027-03-01T00:00:00Z" }
              as: PlatformAdmin
            - call: "POST /api/ops/run-daily"
              payload: {}
              as: PlatformAdmin
          trigger:
            - call: "POST /api/flocks/${flock_id}/induce-molt"
              payload: {}
              as: FarmManager
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2027-03-15T00:00:00Z" }
              as: PlatformAdmin
            - call: "POST /api/flocks/${flock_id}/resume-lay"
              payload: {}
              as: FarmManager
            - call: "POST /api/flocks/${flock_id}/induce-molt"
              payload: {}
              as: FarmManager
              captures: { err: $.data.error_id }
          assert:
            - "after first induce-molt: status == MOLT_REST"
            - "after resume-lay: status == LAYING and lay_cycle == SECOND and molt_count == 1 (cycle traversed)"
            - "second induce-molt rejected: err == ERR_MOLT_LIMIT_REACHED; flock remains LAYING (loop is closed after MAX_MOLTS == 1)"

      - name: egg_lot_parallel_lifecycle_and_hold_dimensions
        grounds:
          - state_machines.EggLot
          - entities.EggLot.fields.lifecycle_status
          - entities.EggLot.fields.hold_status
        distinguishing_aspect: |
          Parallel state dimensions on EggLot (a different entity than Flock above): hold_status
          toggles CLEAR -> HELD -> CLEAR without touching lifecycle_status, and lifecycle
          transitions (release, allocate) are gated by the hold dimension. A HELD lot cannot be
          released or allocated; clearing the hold resumes the unchanged lifecycle state.
        test_recipe:
          setup:
            - "Farm; house; LAYING flock; production day 240 eggs; confirmed run -> one LARGE grade-A 20-dozen lot (FRESH/CLEAR); ACTIVE contract (max_open_dozen 1000)"
          setup_api_calls:
            - call: "POST /api/farms"
              payload: { name: "Dims Farm", certification_program: "CONVENTIONAL", daily_overhead_cents: 12000 }
              as: PlatformAdmin
              captures: { farm_id: $.data.id }
            - call: "POST /api/houses"
              payload: { farm_id: "${farm_id}", house_code: "H1", environment_type: "CAGED", capacity_hens: 2000 }
              as: FarmManager
