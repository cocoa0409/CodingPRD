            - call: "POST /training-assignments/${ta1_id}/complete"
              payload: { score: 80 }
              as: Employee
              as_user_id: "${w1_id}"
          assert:
            - "The first trigger call returns HTTP 409 with $.data.error_id == ERR_TRAINING_SCORE_BELOW_PASSING"
            - "TrainingAssignment.${ta1_id}.status is still ASSIGNED with completed_at null, expires_at null and attempt_count == 1"
            - "Employee.${w1_id}.training_current is still false after the failed attempt"
            - "The second trigger call returns HTTP 200 with score exactly at passing_score 80"
            - "TrainingAssignment.${ta1_id}.status == COMPLETED, completed_at == 2026-08-01T00:00:00Z, expires_at == 2027-08-01T00:00:00Z, scenario_set_version == \"2026.1\" and attempt_count == 2"
