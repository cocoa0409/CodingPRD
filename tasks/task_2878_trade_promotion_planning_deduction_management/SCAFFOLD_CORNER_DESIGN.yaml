      - name: the_portal_login_sees_only_its_own_customer
        claim_type: shared_operations
        grounds:
          - rbac.CustomerPortalUser.shared_operations
          - rbac.CustomerPortalUser.identity
          - errors.ERR_CUSTOMER_SCOPE_VIOLATION
          - validations.priority_4
        distinguishing_aspect: |
          The portal role is entity_backed:Customer, so X-User-ID is a Customer.id. Reading
          its own claim succeeds; reading the other retailer's claim returns 403
          ERR_CUSTOMER_SCOPE_VIOLATION rather than 404, because priority 4 runs ahead of the
          path-id existence check at priority 20 and must not leak whether the id exists. A
          list call filtered to the other customer is refused the same way.
        test_recipe:
