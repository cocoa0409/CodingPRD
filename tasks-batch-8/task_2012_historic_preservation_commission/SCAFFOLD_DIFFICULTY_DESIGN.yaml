              as: PreservationStaff
              captures: { o_id: $.data.id }
            - call: "POST /preservation/properties"
              payload: { address: "70 Ash", parcel_number: "P-1600", district_id: "${d_id}", owner_id: "${o_id}", contributing_status: "NON_CONTRIBUTING", construction_year: 1933, assessed_value_cents: 5500000 }
              as: PreservationStaff
              captures: { p_id: $.data.id }
            - call: "POST /preservation/applications"
              payload: { property_id: "${p_id}", owner_id: "${o_id}", application_type: "ADDITION", is_visible_from_public_way: true, after_the_fact: false, work_items: [{ category: "ADDITION", description: "dormer", estimated_cost_cents: 1300000 }] }
              as: Applicant
              as_user_id: "${o_id}"
              captures: { app_id: $.data.id }
            - call: "POST /preservation/applications/${app_id}/begin-review"
              payload: {}
              as: PreservationStaff
            - call: "POST /preservation/applications/${app_id}/accept-completeness"
              payload: { verified_work_items: [{ category: "ADDITION", verified_cost_cents: 1300000 }] }
              as: PreservationStaff
              as_user_id: "staff-1"
              captures: { app_v: $.data.version }
            - call: "POST /preservation/meetings"
              payload: { meeting_date: "2026-09-01T00:00:00Z", location: "City Hall", agenda_capacity: 2 }
              as: PreservationStaff
              captures: { m_id: $.data.id }
          trigger:
            - call: "POST /preservation/hearings"
              payload: { application_id: "${app_id}", meeting_id: "${m_id}", notice_posted_at: "2026-08-10T00:00:00Z" }
              as: PreservationStaff
              captures: { h_id: $.data.id }
            - call: "GET /preservation/meetings/${m_id}"
              payload: {}
              as: PreservationStaff
              captures: { mid_count: $.data.scheduled_hearing_count }
            - call: "POST /preservation/hearings/${h_id}/continue"
              payload: {}
              as: Commissioner
            - call: "GET /preservation/meetings/${m_id}"
              payload: {}
              as: PreservationStaff
              captures: { end_count: $.data.scheduled_hearing_count }
          assert:
