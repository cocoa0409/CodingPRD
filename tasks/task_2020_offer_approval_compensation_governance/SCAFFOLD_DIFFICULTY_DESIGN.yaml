# §1.8 Scaffold Difficulty Design — Test Targeting Index
# Every instance grounds in SCAFFOLD.yaml §1.1–§1.7. >=2 instances per §0.5 rule.

scaffold_difficulty_design:

  # ------------------------------------------------------------- Rule 1
  - rule_id: dual_variant_calc
    instances:
      - name: offer_cost_cash_vs_fully_loaded_divergence
        grounds:
          - calculations.offer_cost
          - entities.Offer.fields.cash_only_annual_cost_cents
          - entities.Offer.fields.fully_loaded_annual_cost_cents
          - calculations.committed_budget
        distinguishing_aspect: |
          Dual-variant on the OFFER cost domain: identical offer terms produce
          cash_only 23500000 vs fully_loaded 36350000, and the requisition's
          committed budget provably consumes the fully_loaded variant only.
        test_recipe:
          setup:
            - "Requisition (L5/T1, min 15000000, mid 18000000, max 21000000, budget 50000000, headcount 2) in OPEN"
            - "Three L5/T1 peer snapshots (19000000, 19500000, 20000000) exist"
            - "Offer: base 20000000, bonus pct 0.10, equity 10000 shares @ 2500; perks SIGN_ON 1000000 and RELOCATION 500000"
          setup_api_calls:
            - call: "POST /api/requisitions"
              payload: { title: "Sr Eng", department: "ENG", role_level: L5, geo_tier: T1, annual_budget_cents: 50000000, salary_min_cents: 15000000, salary_mid_cents: 18000000, salary_max_cents: 21000000, headcount_authorized: 2 }
              as: HiringManager
              as_user_id: hm-1
              captures: { req_id: $.data.id }
            - call: "POST /api/requisitions/${req_id}/submit"
              payload: {}
              as: HiringManager
              as_user_id: hm-1
            - call: "POST /api/requisitions/${req_id}/review-decision"
              payload: { decision: APPROVE }
              as: FinanceController
              as_user_id: fin-1
            - call: "POST /api/requisitions/${req_id}/review-decision"
              payload: { decision: APPROVE }
              as: CompAnalyst
              as_user_id: ca-1
            - call: "POST /api/equity-snapshots"
              payload: { role_level: L5, geo_tier: T1, base_cents: 19000000 }
              as: CompAnalyst
              as_user_id: ca-1
            - call: "POST /api/equity-snapshots"
              payload: { role_level: L5, geo_tier: T1, base_cents: 19500000 }
              as: CompAnalyst
              as_user_id: ca-1
            - call: "POST /api/equity-snapshots"
              payload: { role_level: L5, geo_tier: T1, base_cents: 20000000 }
              as: CompAnalyst
              as_user_id: ca-1
            - call: "POST /api/candidates"
              payload: { full_name: "Cand A", email: "cand.a@x.com" }
              as: Recruiter
              as_user_id: rec-1
              captures: { cand_id: $.data.id }
            - call: "POST /api/offers"
              payload: { requisition_id: "${req_id}", candidate_id: "${cand_id}", base_cents: 20000000, bonus_target_pct: 0.10, equity_shares: 10000, equity_fmv_cents: 2500 }
              as: Recruiter
              as_user_id: rec-1
              captures: { offer_id: $.data.id }
            - call: "POST /api/offers/${offer_id}/perks"
              payload: { kind: SIGN_ON, amount_cents: 1000000, clawback_months: 12, clawback_variant: FULL_CLIFF }
              as: Recruiter
              as_user_id: rec-1
            - call: "POST /api/offers/${offer_id}/perks"
              payload: { kind: RELOCATION, amount_cents: 500000, clawback_months: 12, clawback_variant: PRORATED_MONTHLY }
              as: Recruiter
              as_user_id: rec-1
          trigger:
            - call: "GET /api/offers/${offer_id}"
              as: Recruiter
              as_user_id: rec-1
              captures: { cash_v: $.data.cash_only_annual_cost_cents, full_v: $.data.fully_loaded_annual_cost_cents }
            - call: "POST /api/offers/${offer_id}/submit"
              payload: {}
              as: Recruiter
              as_user_id: rec-1
            - call: "GET /api/requisitions/${req_id}"
              as: Recruiter
              as_user_id: rec-1
              captures: { committed_v: $.data.committed_budget_cents }
          assert:
            - "Offer.${offer_id}.cash_only_annual_cost_cents == 23500000"
            - "Offer.${offer_id}.fully_loaded_annual_cost_cents == 36350000"
            - "Offer.${offer_id}.bonus_target_cents == 2000000"
            - "Requisition.${req_id}.committed_budget_cents == 36350000 (fully_loaded variant, not cash_only)"
            - "Offer.${offer_id}.status == PENDING_APPROVAL"

      - name: peer_equity_compa_vs_percentile_flag_divergence
        grounds:
          - calculations.peer_equity_position
          - entities.Offer.fields.equity_compa_risk_flag
          - entities.Offer.fields.equity_percentile_risk_flag
          - calculations.approval_chain_construction
        distinguishing_aspect: |
          Dual-variant on the PEER-EQUITY domain (different entity domain from
          offer_cost): with a right-skewed peer set, the mean-based compa ratio
          (0.8929) does NOT flag while the rank-based percentile (90) DOES flag,
          and only the percentile flag drives CompAnalyst into the chain.
        test_recipe:
          setup:
            - "Requisition (L4/T2, min 9000000, mid 12000000, max 15000000, budget 50000000, headcount 1) in OPEN"
            - "Ten L4/T2 peer snapshots: nine at 10000000 and one at 50000000"
            - "Offer: base 12500000, bonus pct 0, equity 0 @ 0"
          setup_api_calls:
            - call: "POST /api/requisitions"
              payload: { title: "Analyst", department: "FIN", role_level: L4, geo_tier: T2, annual_budget_cents: 50000000, salary_min_cents: 9000000, salary_mid_cents: 12000000, salary_max_cents: 15000000, headcount_authorized: 1 }
              as: HiringManager
              as_user_id: hm-1
              captures: { req_id: $.data.id }
            - call: "POST /api/requisitions/${req_id}/submit"
              payload: {}
              as: HiringManager
              as_user_id: hm-1
            - call: "POST /api/requisitions/${req_id}/review-decision"
              payload: { decision: APPROVE }
              as: FinanceController
              as_user_id: fin-1
            - call: "POST /api/requisitions/${req_id}/review-decision"
              payload: { decision: APPROVE }
              as: CompAnalyst
              as_user_id: ca-1
            - call: "POST /api/equity-snapshots"
              payload: { role_level: L4, geo_tier: T2, base_cents: 10000000 }
              as: CompAnalyst
              as_user_id: ca-1
            - call: "POST /api/equity-snapshots"
              payload: { role_level: L4, geo_tier: T2, base_cents: 10000000 }
              as: CompAnalyst
              as_user_id: ca-1
            - call: "POST /api/equity-snapshots"
              payload: { role_level: L4, geo_tier: T2, base_cents: 10000000 }
              as: CompAnalyst
              as_user_id: ca-1
            - call: "POST /api/equity-snapshots"
              payload: { role_level: L4, geo_tier: T2, base_cents: 10000000 }
              as: CompAnalyst
              as_user_id: ca-1
            - call: "POST /api/equity-snapshots"
              payload: { role_level: L4, geo_tier: T2, base_cents: 10000000 }
              as: CompAnalyst
              as_user_id: ca-1
            - call: "POST /api/equity-snapshots"
              payload: { role_level: L4, geo_tier: T2, base_cents: 10000000 }
              as: CompAnalyst
              as_user_id: ca-1
            - call: "POST /api/equity-snapshots"
              payload: { role_level: L4, geo_tier: T2, base_cents: 10000000 }
              as: CompAnalyst
              as_user_id: ca-1
            - call: "POST /api/equity-snapshots"
              payload: { role_level: L4, geo_tier: T2, base_cents: 10000000 }
              as: CompAnalyst
              as_user_id: ca-1
            - call: "POST /api/equity-snapshots"
              payload: { role_level: L4, geo_tier: T2, base_cents: 10000000 }
              as: CompAnalyst
              as_user_id: ca-1
            - call: "POST /api/equity-snapshots"
              payload: { role_level: L4, geo_tier: T2, base_cents: 50000000 }
              as: CompAnalyst
              as_user_id: ca-1
            - call: "POST /api/candidates"
              payload: { full_name: "Cand B", email: "cand.b@x.com" }
              as: Recruiter
              as_user_id: rec-1
              captures: { cand_id: $.data.id }
            - call: "POST /api/offers"
              payload: { requisition_id: "${req_id}", candidate_id: "${cand_id}", base_cents: 12500000, bonus_target_pct: 0, equity_shares: 0, equity_fmv_cents: 0 }
              as: Recruiter
              as_user_id: rec-1
              captures: { offer_id: $.data.id }
          trigger:
            - call: "POST /api/offers/${offer_id}/submit"
              payload: {}
              as: Recruiter
              as_user_id: rec-1
            - call: "GET /api/offers/${offer_id}/approval-steps"
              as: Recruiter
              as_user_id: rec-1
              captures: { s0_role: "$.data[0].required_role", s1_role: "$.data[1].required_role" }
          assert:
            - "Offer.${offer_id}.equity_compa_ratio == 0.8929"
            - "Offer.${offer_id}.equity_percentile == 90"
            - "Offer.${offer_id}.equity_compa_risk_flag == false"
            - "Offer.${offer_id}.equity_percentile_risk_flag == true"
            - "generated chain has exactly 2 steps: [HiringManager, CompAnalyst] (CompAnalyst present only because of the percentile flag)"

      - name: clawback_full_cliff_vs_prorated_divergence
        grounds:
          - calculations.clawback_schedule
          - entities.PerkPackage.fields.clawback_variant
        distinguishing_aspect: |
          Dual-variant on the PERK clawback domain (third distinct entity
          domain): two perks with identical amount (1000100) and clawback_months
          (3) diverge at months_worked=1 — FULL_CLIFF repays 1000100 while
          PRORATED_MONTHLY repays 666734.
        test_recipe:
          setup:
            - "Requisition (L5/T1 standard range, budget 50000000, headcount 1) in OPEN"
            - "Offer in DRAFT with two perks: SIGN_ON 1000100 FULL_CLIFF 3 months; RELOCATION 1000100 PRORATED_MONTHLY 3 months"
          setup_api_calls:
            - call: "POST /api/requisitions"
              payload: { title: "Sr Eng", department: "ENG", role_level: L5, geo_tier: T1, annual_budget_cents: 50000000, salary_min_cents: 15000000, salary_mid_cents: 18000000, salary_max_cents: 21000000, headcount_authorized: 1 }
              as: HiringManager
              as_user_id: hm-1
              captures: { req_id: $.data.id }
            - call: "POST /api/requisitions/${req_id}/submit"
              payload: {}
              as: HiringManager
              as_user_id: hm-1
            - call: "POST /api/requisitions/${req_id}/review-decision"
              payload: { decision: APPROVE }
              as: FinanceController
              as_user_id: fin-1
            - call: "POST /api/requisitions/${req_id}/review-decision"
              payload: { decision: APPROVE }
              as: CompAnalyst
              as_user_id: ca-1
            - call: "POST /api/candidates"
              payload: { full_name: "Cand C", email: "cand.c@x.com" }
              as: Recruiter
              as_user_id: rec-1
              captures: { cand_id: $.data.id }
            - call: "POST /api/offers"
              payload: { requisition_id: "${req_id}", candidate_id: "${cand_id}", base_cents: 18000000, bonus_target_pct: 0, equity_shares: 0, equity_fmv_cents: 0 }
              as: Recruiter
              as_user_id: rec-1
              captures: { offer_id: $.data.id }
            - call: "POST /api/offers/${offer_id}/perks"
              payload: { kind: SIGN_ON, amount_cents: 1000100, clawback_months: 3, clawback_variant: FULL_CLIFF }
              as: Recruiter
              as_user_id: rec-1
              captures: { perk_cliff_id: $.data.id }
            - call: "POST /api/offers/${offer_id}/perks"
              payload: { kind: RELOCATION, amount_cents: 1000100, clawback_months: 3, clawback_variant: PRORATED_MONTHLY }
              as: Recruiter
              as_user_id: rec-1
              captures: { perk_prorated_id: $.data.id }
          trigger:
            - call: "GET /api/perks/${perk_cliff_id}/clawback-quote"
              payload: { months_worked: 1 }
              as: HRAdmin
              captures: { repay_cliff: $.data.repayment_cents }
            - call: "GET /api/perks/${perk_prorated_id}/clawback-quote"
              payload: { months_worked: 1 }
              as: HRAdmin
              captures: { repay_prorated: $.data.repayment_cents }
          assert:
            - "clawback-quote for ${perk_cliff_id} at months_worked=1 -> repayment_cents == 1000100 (full amount, cliff not reached)"
            - "clawback-quote for ${perk_prorated_id} at months_worked=1 -> repayment_cents == 666734"
            - "repay_cliff != repay_prorated for identical amount and months"

  # ------------------------------------------------------------- Rule 2
  - rule_id: combinatorial_formula
    instances:
      - name: approval_chain_multi_input_routing
        grounds:
          - calculations.approval_chain_construction
          - entities.ApprovalPolicy.fields.min_band_severity
          - entities.ApprovalStep.fields.sequence
        distinguishing_aspect: |
          Mode (a) combinatorial: a single offer exercises four
          non-linear routing inputs (EXCEPTION band + sign-on > 1000000 +
          equity compa flag 1.3333 > 1.15 + total_cash 30100000 >= 30000000)
          and the chain resolves, with dedupe, to exactly
          [HiringManager, CompAnalyst, DepartmentDirector, VPPeople].
        test_recipe:
          setup:
            - "Policy rows: ABOVE_BAND->CompAnalyst pos 1; EXCEPTION->DepartmentDirector pos 2; EXCEPTION->VPPeople pos 3 (all ACTIVE)"
            - "Requisition (L5/T1 standard range, budget 50000000, headcount 2) in OPEN; three L5/T1 peers (19000000, 19500000, 20000000)"
            - "Offer: base 26000000 (EXCEPTION: > 23100000, <= hard cap 26250000), pct 0.10, equity 0; SIGN_ON perk 1500000"
          setup_api_calls:
            - call: "POST /api/approval-policies"
              payload: { min_band_severity: ABOVE_BAND, required_role: CompAnalyst, chain_position: 1 }
              as: HRAdmin
              as_user_id: admin-1
            - call: "POST /api/approval-policies"
              payload: { min_band_severity: EXCEPTION, required_role: DepartmentDirector, chain_position: 2 }
              as: HRAdmin
              as_user_id: admin-1
            - call: "POST /api/approval-policies"
              payload: { min_band_severity: EXCEPTION, required_role: VPPeople, chain_position: 3 }
              as: HRAdmin
              as_user_id: admin-1
            - call: "POST /api/requisitions"
              payload: { title: "Staff Eng", department: "ENG", role_level: L5, geo_tier: T1, annual_budget_cents: 50000000, salary_min_cents: 15000000, salary_mid_cents: 18000000, salary_max_cents: 21000000, headcount_authorized: 2 }
              as: HiringManager
              as_user_id: hm-1
              captures: { req_id: $.data.id }
            - call: "POST /api/requisitions/${req_id}/submit"
              payload: {}
              as: HiringManager
              as_user_id: hm-1
            - call: "POST /api/requisitions/${req_id}/review-decision"
              payload: { decision: APPROVE }
              as: FinanceController
              as_user_id: fin-1
            - call: "POST /api/requisitions/${req_id}/review-decision"
              payload: { decision: APPROVE }
              as: CompAnalyst
              as_user_id: ca-1
            - call: "POST /api/equity-snapshots"
              payload: { role_level: L5, geo_tier: T1, base_cents: 19000000 }
              as: CompAnalyst
              as_user_id: ca-1
            - call: "POST /api/equity-snapshots"
              payload: { role_level: L5, geo_tier: T1, base_cents: 19500000 }
              as: CompAnalyst
              as_user_id: ca-1
            - call: "POST /api/equity-snapshots"
              payload: { role_level: L5, geo_tier: T1, base_cents: 20000000 }
              as: CompAnalyst
              as_user_id: ca-1
            - call: "POST /api/candidates"
              payload: { full_name: "Cand D", email: "cand.d@x.com" }
              as: Recruiter
              as_user_id: rec-1
              captures: { cand_id: $.data.id }
            - call: "POST /api/offers"
              payload: { requisition_id: "${req_id}", candidate_id: "${cand_id}", base_cents: 26000000, bonus_target_pct: 0.10, equity_shares: 0, equity_fmv_cents: 0 }
              as: Recruiter
              as_user_id: rec-1
              captures: { offer_id: $.data.id }
            - call: "POST /api/offers/${offer_id}/perks"
              payload: { kind: SIGN_ON, amount_cents: 1500000, clawback_months: 12, clawback_variant: FULL_CLIFF }
              as: Recruiter
              as_user_id: rec-1
          trigger:
            - call: "POST /api/offers/${offer_id}/submit"
              payload: {}
              as: Recruiter
              as_user_id: rec-1
            - call: "GET /api/offers/${offer_id}/approval-steps"
              as: Recruiter
              as_user_id: rec-1
              captures: { s0: "$.data[0].required_role", s1: "$.data[1].required_role", s2: "$.data[2].required_role", s3: "$.data[3].required_role" }
          assert:
            - "Offer.${offer_id}.band == EXCEPTION"
            - "Offer.${offer_id}.total_cash_cents == 30100000"
            - "Offer.${offer_id}.equity_compa_risk_flag == true (26000000/19500000 = 1.3333 > 1.15)"
            - "chain is exactly 4 steps with required_role sequence [HiringManager, CompAnalyst, DepartmentDirector, VPPeople] at sequences 0,1,2,3"
            - "ApprovalStep[0].status == ACTIONABLE; steps 1..3 status == WAITING"

      - name: clawback_installment_rounding_order
        grounds:
          - calculations.clawback_schedule
          - entities.PerkPackage.fields.amount_cents
        distinguishing_aspect: |
          Mode (b) nested rounding: PRORATED_MONTHLY pins installment-first
          rounding — amount 1000100 over 3 months at months_worked=1 yields
          333367*2 = 666734, NOT the sum-then-round 666733; months_worked=0
          takes the full-amount special case and months_worked=3 yields 0.
        test_recipe:
          setup:
            - "Requisition (L5/T1 standard range, budget 50000000, headcount 1) in OPEN"
            - "Offer in DRAFT with one RELOCATION perk: 1000100 cents, 3 months, PRORATED_MONTHLY"
          setup_api_calls:
            - call: "POST /api/requisitions"
              payload: { title: "Sr Eng", department: "ENG", role_level: L5, geo_tier: T1, annual_budget_cents: 50000000, salary_min_cents: 15000000, salary_mid_cents: 18000000, salary_max_cents: 21000000, headcount_authorized: 1 }
              as: HiringManager
              as_user_id: hm-1
              captures: { req_id: $.data.id }
            - call: "POST /api/requisitions/${req_id}/submit"
              payload: {}
              as: HiringManager
              as_user_id: hm-1
            - call: "POST /api/requisitions/${req_id}/review-decision"
              payload: { decision: APPROVE }
              as: FinanceController
              as_user_id: fin-1
            - call: "POST /api/requisitions/${req_id}/review-decision"
              payload: { decision: APPROVE }
              as: CompAnalyst
              as_user_id: ca-1
            - call: "POST /api/candidates"
              payload: { full_name: "Cand E", email: "cand.e@x.com" }
              as: Recruiter
              as_user_id: rec-1
              captures: { cand_id: $.data.id }
            - call: "POST /api/offers"
              payload: { requisition_id: "${req_id}", candidate_id: "${cand_id}", base_cents: 18000000, bonus_target_pct: 0, equity_shares: 0, equity_fmv_cents: 0 }
              as: Recruiter
              as_user_id: rec-1
              captures: { offer_id: $.data.id }
            - call: "POST /api/offers/${offer_id}/perks"
              payload: { kind: RELOCATION, amount_cents: 1000100, clawback_months: 3, clawback_variant: PRORATED_MONTHLY }
              as: Recruiter
              as_user_id: rec-1
              captures: { perk_id: $.data.id }
          trigger:
            - call: "GET /api/perks/${perk_id}/clawback-quote"
              payload: { months_worked: 0 }
              as: HRAdmin
              captures: { r0: $.data.repayment_cents }
            - call: "GET /api/perks/${perk_id}/clawback-quote"
              payload: { months_worked: 1 }
              as: HRAdmin
              captures: { r1: $.data.repayment_cents }
            - call: "GET /api/perks/${perk_id}/clawback-quote"
              payload: { months_worked: 3 }
              as: HRAdmin
              captures: { r3: $.data.repayment_cents }
          assert:
            - "months_worked=0 -> repayment_cents == 1000100 (full-amount special case, no installment math)"
            - "months_worked=1 -> repayment_cents == 666734 (installment-first rounding, not 666733)"
            - "months_worked=3 -> repayment_cents == 0 (fully earned)"

      - name: signon_tier_self_referential_evaluation_order
        grounds:
          - calculations.total_cash_tier
          - calculations.approval_chain_construction
        distinguishing_aspect: |
          Mode (c) circular-looking dependency: the sign-on amount both faces
          its own review threshold (> 1000000) AND feeds total_cash, which
          itself gates VPPeople (>= 30000000). Pinned evaluation order makes
          offer A (sign-on 8000000 -> total exactly 30000000) route to
          [HM, CompAnalyst, VPPeople] while offer B (sign-on 7999999 -> total
          29999999) routes to [HM, CompAnalyst] only.
        test_recipe:
          setup:
            - "No policy rows needed (IN_BAND offers); requisition (L5/T1 standard range, budget 80000000, headcount 2) OPEN; three L5/T1 peers (19000000, 19500000, 20000000)"
            - "Offer A: base 20000000, pct 0.10, four SIGN_ON perks of 2000000 (total 8000000); Offer B: base 20000000, pct 0.10, SIGN_ON perks 2000000 x3 + 1999999 (total 7999999) — each single perk within the 2500000 hard cap"
          setup_api_calls:
            - call: "POST /api/requisitions"
              payload: { title: "Sr Eng", department: "ENG", role_level: L5, geo_tier: T1, annual_budget_cents: 80000000, salary_min_cents: 15000000, salary_mid_cents: 18000000, salary_max_cents: 21000000, headcount_authorized: 2 }
              as: HiringManager
              as_user_id: hm-1
              captures: { req_id: $.data.id }
            - call: "POST /api/requisitions/${req_id}/submit"
              payload: {}
              as: HiringManager
              as_user_id: hm-1
            - call: "POST /api/requisitions/${req_id}/review-decision"
              payload: { decision: APPROVE }
              as: FinanceController
              as_user_id: fin-1
            - call: "POST /api/requisitions/${req_id}/review-decision"
              payload: { decision: APPROVE }
              as: CompAnalyst
              as_user_id: ca-1
            - call: "POST /api/equity-snapshots"
              payload: { role_level: L5, geo_tier: T1, base_cents: 19000000 }
              as: CompAnalyst
              as_user_id: ca-1
            - call: "POST /api/equity-snapshots"
              payload: { role_level: L5, geo_tier: T1, base_cents: 19500000 }
              as: CompAnalyst
              as_user_id: ca-1
            - call: "POST /api/equity-snapshots"
              payload: { role_level: L5, geo_tier: T1, base_cents: 20000000 }
              as: CompAnalyst
              as_user_id: ca-1
            - call: "POST /api/candidates"
              payload: { full_name: "Cand F", email: "cand.f@x.com" }
              as: Recruiter
              as_user_id: rec-1
              captures: { cand_a: $.data.id }
            - call: "POST /api/candidates"
              payload: { full_name: "Cand G", email: "cand.g@x.com" }
              as: Recruiter
              as_user_id: rec-1
              captures: { cand_b: $.data.id }
            - call: "POST /api/offers"
              payload: { requisition_id: "${req_id}", candidate_id: "${cand_a}", base_cents: 20000000, bonus_target_pct: 0.10, equity_shares: 0, equity_fmv_cents: 0 }
              as: Recruiter
              as_user_id: rec-1
              captures: { offer_a: $.data.id }
            - call: "POST /api/offers/${offer_a}/perks"
