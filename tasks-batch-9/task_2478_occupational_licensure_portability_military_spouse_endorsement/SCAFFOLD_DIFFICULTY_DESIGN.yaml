# =============================================================================
# §1.8 Scaffold Difficulty Design (Test Targeting Index)
# Task 2478 — Occupational Licensure Portability & Military Spouse Endorsement
#
# Nine §0.5 rule_ids x 2 instances = 18 instances.
# Every literal in `assert:` was produced by executing the referenced
# §1.3 formula against the pinned §1.5 payloads below.
# The logical clock starts at 2026-08-01T00:00:00Z (§1.5 POST /_clock/set_current_utc);
# instances that do not call the clock endpoint run at that default instant.
# =============================================================================

scaffold_difficulty_design:

  # ===========================================================================
  - rule_id: dual_variant_calc
    instances:

      - name: equivalency_variant_divergence_strict_vs_universal
        grounds:
          - calculations.substantial_equivalency_score
          - entities.CredentialEvaluation.fields.variant
          - entities.CredentialEvaluation.fields.equivalency_score
          - entities.CredentialEvaluation.fields.exam_waiver_granted
          - state_machines.CredentialEvaluation.IN_PROGRESS_to_COMPLETE
        distinguishing_aspect: |
          Two applications carrying byte-identical credential data (scope [ASSESS, TREAT, SUPERVISE]
          against required [ASSESS, TREAT, PRESCRIBE, SUPERVISE], practice_hours 1200 of 2000,
          verified good standing, residency 24 months) score 65.00 under STRICT_SCOPE and 85.00 under
          UNIVERSAL_RECOGNITION — a fixed 20.00 delta produced by two independent variant differences
          (the 10.00 critical-miss penalty and the residency substitution that lifts hours_ratio from
          0.60 to 1.00), and the delta straddles Profession.exam_waiver_min_score (70.00) so only the
          UNIVERSAL_RECOGNITION arm appends an EXAM_FEE_REVERSAL.
        test_recipe:
          setup:
            - "Profession RN with required_scope_elements [ASSESS, TREAT, PRESCRIBE, SUPERVISE], critical_scope_elements [PRESCRIBE], required_practice_hours 2000, exam_waiver_min_score 70.00."
            - "Applicant A (military_status NONE, residency 24) on the ENDORSEMENT pathway -> evaluation variant STRICT_SCOPE."
            - "Applicant B (military_status NONE, residency 24) on the UNIVERSAL_RECOGNITION pathway -> evaluation variant UNIVERSAL_RECOGNITION."
            - "Both credentials grant exactly [ASSESS, TREAT, SUPERVISE] with practice_hours 1200 and verified_good_standing true."
            - "Both applications are UNDER_REVIEW with scope_review_status DEFICIENT_SCOPE (PRESCRIBE is critical, so EQUIVALENT is unavailable) and discipline_review_status CLEAR; neither is finalized."
            - "Neither applicant has any DisciplinaryRecord, so good_standing_flag is true and both indexes are 0.00."
          setup_api_calls:
            - call: "POST /licensure/professions"
              payload: { profession_code: "RN", title: "Registered Nurse", required_scope_elements: ["ASSESS", "TREAT", "PRESCRIBE", "SUPERVISE"], critical_scope_elements: ["PRESCRIBE"], required_practice_hours: 2000, requirement_hours_total: 240.0, exam_waiver_min_score: 70.00, jurisprudence_exam_required: true, universal_recognition_min_residency_months: 12, standard_processing_days: 90, base_fee_cents: 25000, endorsement_fee_cents: 10000, exam_fee_cents: 8000, jurisprudence_fee_cents: 5000, permit_fee_cents: 6000, expedite_surcharge_pct: 0.15 }
              as: AgencyAdmin
              as_user_id: "adm_1"
              captures: { prof_rn: $.data.id }
            - call: "POST /licensure/applicants"
              payload: { full_name: "Dana Reyes", state_code: "TX", residency_months: 24, military_status: "NONE" }
              as: AgencyAdmin
              as_user_id: "adm_1"
              captures: { ap_a: $.data.id }
            - call: "POST /licensure/applicants/${ap_a}/out-of-state-credentials"
              payload: { issuing_state: "OK", license_number: "OK-70001", scope_elements: ["ASSESS", "TREAT", "SUPERVISE"], practice_hours: 1200, status: "ACTIVE", verified_good_standing: true, issued_at: "2020-05-01T00:00:00Z" }
              as: Applicant
              as_user_id: "${ap_a}"
              captures: { cred_a: $.data.id }
            - call: "POST /licensure/applications"
              payload: { applicant_id: "${ap_a}", profession_id: "${prof_rn}", primary_credential_id: "${cred_a}", pathway: "ENDORSEMENT", expedited: false }
              as: Applicant
              as_user_id: "${ap_a}"
              captures: { app_a: $.data.id }
            - call: "POST /licensure/applications/${app_a}/submit"
              payload: {}
              as: Applicant
              as_user_id: "${ap_a}"
            - call: "POST /licensure/applicants"
              payload: { full_name: "Kai Moreno", state_code: "TX", residency_months: 24, military_status: "NONE" }
              as: AgencyAdmin
              as_user_id: "adm_1"
              captures: { ap_b: $.data.id }
            - call: "POST /licensure/applicants/${ap_b}/out-of-state-credentials"
              payload: { issuing_state: "OK", license_number: "OK-70002", scope_elements: ["ASSESS", "TREAT", "SUPERVISE"], practice_hours: 1200, status: "ACTIVE", verified_good_standing: true, issued_at: "2020-05-01T00:00:00Z" }
              as: Applicant
              as_user_id: "${ap_b}"
              captures: { cred_b: $.data.id }
            - call: "POST /licensure/applications"
              payload: { applicant_id: "${ap_b}", profession_id: "${prof_rn}", primary_credential_id: "${cred_b}", pathway: "UNIVERSAL_RECOGNITION", expedited: false }
              as: Applicant
              as_user_id: "${ap_b}"
              captures: { app_b: $.data.id }
            - call: "POST /licensure/applications/${app_b}/submit"
              payload: {}
              as: Applicant
              as_user_id: "${ap_b}"
            - call: "POST /licensure/credential-evaluations"
              payload: { application_id: "${app_a}", credential_id: "${cred_a}" }
              as: LicensingAnalyst
              as_user_id: "anl_1"
              captures: { ev_a: $.data.id }
            - call: "POST /licensure/credential-evaluations"
              payload: { application_id: "${app_b}", credential_id: "${cred_b}" }
              as: LicensingAnalyst
              as_user_id: "anl_1"
              captures: { ev_b: $.data.id }
            - call: "POST /licensure/credential-evaluations/${ev_a}/scope-review"
              payload: { decision: "DEFICIENT_SCOPE", note: "PRESCRIBE not granted by OK" }
              as: LicensingAnalyst
              as_user_id: "anl_1"
            - call: "POST /licensure/credential-evaluations/${ev_b}/scope-review"
              payload: { decision: "DEFICIENT_SCOPE", note: "PRESCRIBE not granted by OK" }
              as: LicensingAnalyst
              as_user_id: "anl_1"
            - call: "POST /licensure/evaluators"
              payload: { full_name: "Eli Vance", profession_code: "RN", status: "ACTIVE", max_concurrent_reviews: 2 }
              as: AgencyAdmin
              as_user_id: "adm_1"
              captures: { evr: $.data.id, evr_v0: $.data.version }
            - call: "POST /licensure/review-assignments"
              payload: { evaluator_id: "${evr}", application_id: "${app_a}", window_start_at: "2026-08-02T00:00:00Z", window_end_at: "2026-08-09T00:00:00Z", expected_evaluator_version: "${evr_v0}" }
              as: LicensingAnalyst
              as_user_id: "anl_1"
              captures: { ra_a: $.data.id }
            - call: "GET /licensure/evaluators/${evr}"
              payload: {}
              as: LicensingAnalyst
              as_user_id: "anl_1"
              captures: { evr_v1: $.data.version }
            - call: "POST /licensure/review-assignments"
              payload: { evaluator_id: "${evr}", application_id: "${app_b}", window_start_at: "2026-08-11T00:00:00Z", window_end_at: "2026-08-14T00:00:00Z", expected_evaluator_version: "${evr_v1}" }
              as: LicensingAnalyst
              as_user_id: "anl_1"
              captures: { ra_b: $.data.id }
            - call: "POST /licensure/credential-evaluations/${ev_a}/discipline-finding"
              payload: { finding: "CLEAR", databases_checked: ["NPDB", "NURSYS"] }
              as: Evaluator
              as_user_id: "${evr}"
            - call: "POST /licensure/credential-evaluations/${ev_b}/discipline-finding"
              payload: { finding: "CLEAR", databases_checked: ["NPDB", "NURSYS"] }
              as: Evaluator
              as_user_id: "${evr}"
          trigger:
            - call: "POST /licensure/credential-evaluations/${ev_a}/finalize"
              payload: {}
              as: LicensingAnalyst
              as_user_id: "anl_1"
            - call: "POST /licensure/credential-evaluations/${ev_b}/finalize"
              payload: {}
              as: LicensingAnalyst
              as_user_id: "anl_1"
          assert:
            - "CredentialEvaluation.${ev_a}.variant == STRICT_SCOPE"
            - "CredentialEvaluation.${ev_b}.variant == UNIVERSAL_RECOGNITION"
            - "CredentialEvaluation.${ev_a}.matched_scope_elements == [ASSESS, TREAT, SUPERVISE]"
            - "CredentialEvaluation.${ev_a}.missing_scope_elements == [PRESCRIBE]"
            - "CredentialEvaluation.${ev_a}.equivalency_score == 65.00"
            - "CredentialEvaluation.${ev_b}.equivalency_score == 85.00"
            - "CredentialEvaluation.${ev_b}.equivalency_score - CredentialEvaluation.${ev_a}.equivalency_score == 20.00"
            - "CredentialEvaluation.${ev_a}.exam_waiver_granted == false"
            - "CredentialEvaluation.${ev_b}.exam_waiver_granted == true"
            - "CredentialEvaluation.${ev_a}.overall_status == COMPLETE and CredentialEvaluation.${ev_b}.overall_status == COMPLETE"
            - "LicenseApplication.${app_a}.fee_balance_cents == 48000 (no EXAM_FEE_REVERSAL entry exists for ${app_a})"
            - "LicenseApplication.${app_b}.fee_balance_cents == 40000 (one EXAM_FEE_REVERSAL entry with amount_cents == -8000)"

      - name: risk_index_reported_vs_effective_variant_divergence
        grounds:
          - calculations.applicant_disciplinary_risk_index
          - entities.Applicant.fields.disciplinary_risk_index_reported
          - entities.Applicant.fields.disciplinary_risk_index_effective
          - entities.Applicant.fields.good_standing_flag
          - entities.DisciplinaryRecord.fields.action_effective_at
          - entities.DisciplinaryRecord.fields.reported_at
        distinguishing_aspect: |
          The same two unresolved DisciplinaryRecords yield 10.00 on the EFFECTIVE_AT variant and 17.00
          on the REPORTED_AT variant at clock 2027-03-01T00:00:00Z, because the decay ages each row from
          a different timestamp column (PROBATION: 3 full years effective vs 1 reported; ADVISORY: 1 vs 0),
          and the two variants also traverse the rows in different sort orders.
        test_recipe:
          setup:
            - "Logical clock parked at 2027-03-01T00:00:00Z."
            - "Applicant with no license application, holding one unresolved PROBATION record (action_effective_at 2024-02-01, reported_at 2026-02-01)."
            - "A second unresolved ADVISORY record (action_effective_at 2025-06-01, reported_at 2026-06-01) is posted by the trigger."
            - "No SUSPENSION or REVOCATION row exists, so good_standing_flag stays true and no application cascade can fire."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2027-03-01T00:00:00Z" }
              as: AgencyAdmin
              as_user_id: "adm_1"
            - call: "POST /licensure/applicants"
              payload: { full_name: "Rowan Pike", state_code: "TX", residency_months: 36, military_status: "NONE" }
              as: AgencyAdmin
              as_user_id: "adm_1"
              captures: { ap: $.data.id }
            - call: "POST /licensure/disciplinary-records"
              payload: { applicant_id: "${ap}", source_state: "NM", source_database: "NPDB", severity: "PROBATION", action_effective_at: "2024-02-01T00:00:00Z", reported_at: "2026-02-01T00:00:00Z" }
              as: AgencyAdmin
              as_user_id: "adm_1"
              captures: { dr1: $.data.id }
          trigger:
            - call: "POST /licensure/disciplinary-records"
              payload: { applicant_id: "${ap}", source_state: "AZ", source_database: "NURSYS", severity: "ADVISORY", action_effective_at: "2025-06-01T00:00:00Z", reported_at: "2026-06-01T00:00:00Z" }
              as: AgencyAdmin
              as_user_id: "adm_1"
              captures: { dr2: $.data.id }
          assert:
            - "Applicant.${ap}.disciplinary_risk_index_effective == 10.00"
            - "Applicant.${ap}.disciplinary_risk_index_reported == 17.00"
            - "Applicant.${ap}.disciplinary_risk_index_reported - Applicant.${ap}.disciplinary_risk_index_effective == 7.00"
            - "Applicant.${ap}.good_standing_flag == true"
            - "DisciplinaryRecord.${dr2}.resolved == false"

  # ===========================================================================
  - rule_id: combinatorial_formula
    instances:

      - name: fee_waiver_per_component_rounding_beats_sum_then_round
        grounds:
          - calculations.net_fee_due_cents
          - entities.LicenseApplication.fields.gross_total_cents
          - entities.LicenseApplication.fields.statutory_waiver_pct
          - entities.LicenseApplication.fields.fee_balance_cents
          - entities.ReciprocalAgreement.fields.fee_waiver_pct
          - state_machines.LicenseApplication.DRAFT_to_SUBMITTED
        distinguishing_aspect: |
          With four fee components each ending in an odd cent (12345 / 6789 / 3333 / 2221) and a 0.50
          compact waiver, STEP 5's round-per-component-then-sum produces waiver_credit_cents == 12346 and
          fee_balance_cents == 12342, whereas the forbidden sum-then-round-once path produces 12344 and
          12344 — a 2-cent separation that no other instance can produce.
        test_recipe:
          setup:
            - "Profession LPC with base 12345, endorsement 6789, exam 3333, jurisprudence 2221 cents and jurisprudence_exam_required true."
            - "An unexpired ReciprocalAgreement for (LPC, TX) with fee_waiver_pct 0.50 and no exam or jurisprudence waiver."
            - "Applicant resident in TX with military_status NONE, so the compact branch of STEP 4 is the one selected."
            - "One DRAFT ENDORSEMENT application, expedited false, on a verified ACTIVE credential."
            - "Logical clock at the 2026-08-01T00:00:00Z default, well before the compact's expires_on."
          setup_api_calls:
            - call: "POST /licensure/professions"
              payload: { profession_code: "LPC", title: "Licensed Professional Counselor", required_scope_elements: ["INTAKE", "THERAPY"], critical_scope_elements: [], required_practice_hours: 3000, requirement_hours_total: 150.0, exam_waiver_min_score: 75.00, jurisprudence_exam_required: true, universal_recognition_min_residency_months: 12, standard_processing_days: 75, base_fee_cents: 12345, endorsement_fee_cents: 6789, exam_fee_cents: 3333, jurisprudence_fee_cents: 2221, permit_fee_cents: 4444, expedite_surcharge_pct: 0.15 }
              as: AgencyAdmin
              as_user_id: "adm_1"
              captures: { prof_lpc: $.data.id }
            - call: "POST /licensure/professions/${prof_lpc}/reciprocal-agreements"
              payload: { partner_state: "TX", fee_waiver_pct: 0.50, exam_waiver_allowed: false, jurisprudence_waiver_allowed: false, expires_on: "2027-12-31T00:00:00Z" }
              as: AgencyAdmin
              as_user_id: "adm_1"
              captures: { rec_tx: $.data.id }
            - call: "POST /licensure/applicants"
              payload: { full_name: "Noor Haddad", state_code: "TX", residency_months: 18, military_status: "NONE" }
              as: AgencyAdmin
              as_user_id: "adm_1"
              captures: { ap: $.data.id }
            - call: "POST /licensure/applicants/${ap}/out-of-state-credentials"
              payload: { issuing_state: "NM", license_number: "NM-51001", scope_elements: ["INTAKE", "THERAPY"], practice_hours: 3000, status: "ACTIVE", verified_good_standing: true, issued_at: "2019-03-01T00:00:00Z" }
              as: Applicant
              as_user_id: "${ap}"
              captures: { cred: $.data.id }
            - call: "POST /licensure/applications"
              payload: { applicant_id: "${ap}", profession_id: "${prof_lpc}", primary_credential_id: "${cred}", pathway: "ENDORSEMENT", expedited: false }
              as: Applicant
              as_user_id: "${ap}"
              captures: { app: $.data.id }
          trigger:
            - call: "POST /licensure/applications/${app}/submit"
              payload: {}
              as: Applicant
              as_user_id: "${ap}"
          assert:
            - "LicenseApplication.${app}.gross_total_cents == 24688"
            - "LicenseApplication.${app}.statutory_waiver_pct == 0.50"
            - "LicenseApplication.${app}.fee_balance_cents == 12342 (NOT 12344, which is the sum-then-round answer)"
            - "GET /licensure/applications/${app}/fee-ledger-entries returns exactly 2 entries in created_at ASC: [0] entry_type == ASSESSMENT with amount_cents == 24688, [1] entry_type == WAIVER_CREDIT with amount_cents == -12346"
            - "LicenseApplication.${app}.status == SUBMITTED and submitted_at == 2026-08-01T00:00:00Z"
            - "LicenseApplication.${app}.review_deadline_at == 2026-10-15T00:00:00Z"

      - name: expedite_surcharge_flips_military_waiver_cap_tier
        grounds:
          - calculations.net_fee_due_cents
          - entities.Profession.fields.expedite_surcharge_pct
          - entities.LicenseApplication.fields.expedited
          - entities.Applicant.fields.military_status
          - calculations.review_deadline
        distinguishing_aspect: |
          Two VETERAN applicants on the identical LMT fee schedule land in different waiver tiers solely
          because of the `expedited` flag: the surcharge is keyed on the STEP 1 subtotal (40000) and adds
          6000, pushing gross_total_cents to 46000 above MILITARY_FULL_WAIVER_CAP_CENTS (40000), so
          statutory_waiver_pct drops from 1.00 to 0.50 and the net jumps from 0 to 23000 — the surcharge
          costs the applicant 23000 cents, not 6000.
        test_recipe:
          setup:
            - "Profession LMT with base 20000, endorsement 8000, exam 7000, jurisprudence 5000 cents, jurisprudence_exam_required true, expedite_surcharge_pct 0.15, standard_processing_days 45."
            - "Applicant C (military_status VETERAN, TX) with a DRAFT ENDORSEMENT application, expedited false."
            - "Applicant D (military_status VETERAN, TX) with a DRAFT ENDORSEMENT application, expedited true."
            - "No ReciprocalAgreement exists for LMT, so the military branch of STEP 4 is the only one reachable."
          setup_api_calls:
            - call: "POST /licensure/professions"
              payload: { profession_code: "LMT", title: "Licensed Massage Therapist", required_scope_elements: ["INTAKE", "MANUAL"], critical_scope_elements: [], required_practice_hours: 500, requirement_hours_total: 120.0, exam_waiver_min_score: 80.00, jurisprudence_exam_required: true, universal_recognition_min_residency_months: 6, standard_processing_days: 45, base_fee_cents: 20000, endorsement_fee_cents: 8000, exam_fee_cents: 7000, jurisprudence_fee_cents: 5000, permit_fee_cents: 3000, expedite_surcharge_pct: 0.15 }
              as: AgencyAdmin
              as_user_id: "adm_1"
              captures: { prof_lmt: $.data.id }
            - call: "POST /licensure/applicants"
              payload: { full_name: "Sasha Byrd", state_code: "TX", residency_months: 12, military_status: "VETERAN" }
              as: AgencyAdmin
              as_user_id: "adm_1"
              captures: { ap_c: $.data.id }
            - call: "POST /licensure/applicants/${ap_c}/out-of-state-credentials"
              payload: { issuing_state: "NM", license_number: "NM-33001", scope_elements: ["INTAKE", "MANUAL"], practice_hours: 500, status: "ACTIVE", verified_good_standing: true, issued_at: "2021-01-04T00:00:00Z" }
              as: Applicant
              as_user_id: "${ap_c}"
              captures: { cred_c: $.data.id }
            - call: "POST /licensure/applications"
              payload: { applicant_id: "${ap_c}", profession_id: "${prof_lmt}", primary_credential_id: "${cred_c}", pathway: "ENDORSEMENT", expedited: false }
              as: Applicant
              as_user_id: "${ap_c}"
              captures: { app_c: $.data.id }
            - call: "POST /licensure/applicants"
              payload: { full_name: "Mira Osei", state_code: "TX", residency_months: 12, military_status: "VETERAN" }
              as: AgencyAdmin
              as_user_id: "adm_1"
              captures: { ap_d: $.data.id }
            - call: "POST /licensure/applicants/${ap_d}/out-of-state-credentials"
              payload: { issuing_state: "NM", license_number: "NM-33002", scope_elements: ["INTAKE", "MANUAL"], practice_hours: 500, status: "ACTIVE", verified_good_standing: true, issued_at: "2021-01-04T00:00:00Z" }
              as: Applicant
              as_user_id: "${ap_d}"
              captures: { cred_d: $.data.id }
            - call: "POST /licensure/applications"
              payload: { applicant_id: "${ap_d}", profession_id: "${prof_lmt}", primary_credential_id: "${cred_d}", pathway: "ENDORSEMENT", expedited: true }
              as: Applicant
              as_user_id: "${ap_d}"
              captures: { app_d: $.data.id }
          trigger:
            - call: "POST /licensure/applications/${app_c}/submit"
              payload: {}
              as: Applicant
              as_user_id: "${ap_c}"
            - call: "POST /licensure/applications/${app_d}/submit"
              payload: {}
              as: Applicant
              as_user_id: "${ap_d}"
          assert:
            - "LicenseApplication.${app_c}.gross_total_cents == 40000"
            - "LicenseApplication.${app_c}.statutory_waiver_pct == 1.00"
            - "LicenseApplication.${app_c}.fee_balance_cents == 0"
            - "LicenseApplication.${app_d}.gross_total_cents == 46000"
            - "LicenseApplication.${app_d}.statutory_waiver_pct == 0.50"
            - "LicenseApplication.${app_d}.fee_balance_cents == 23000"
            - "The WAIVER_CREDIT entry of ${app_c} has amount_cents == -40000 and the WAIVER_CREDIT entry of ${app_d} has amount_cents == -23000"
            - "LicenseApplication.${app_c}.review_deadline_at == 2026-09-15T00:00:00Z"
            - "LicenseApplication.${app_d}.review_deadline_at == 2026-08-31T00:00:00Z"

  # ===========================================================================
  - rule_id: non_linear_state_machine
    instances:

      - name: deficiency_cycle_cap_third_deficiency_denies_instead_of_looping
        grounds:
          - state_machines.LicenseApplication.UNDER_REVIEW_to_DEFICIENT
          - state_machines.LicenseApplication.DEFICIENT_to_UNDER_REVIEW
          - state_machines.LicenseApplication.UNDER_REVIEW_to_DENIED
          - entities.LicenseApplication.fields.deficiency_cycle_count
          - state_machines.ReviewAssignment.ASSIGNED_to_RELEASED
          - calculations.processing_time_metrics
        distinguishing_aspect: |
          One endpoint (POST /licensure/applications/{id}/deficiency) selects between two different
          target states purely on the cumulative counter: calls 1 and 2 loop UNDER_REVIEW -> DEFICIENT
          (cured back each time, and deficiency_cycle_count is never decremented by the cure), while
          call 3 takes the DENIED branch and fires the release cascade — the loop is capped, not endless.
        test_recipe:
          setup:
            - "Profession RN; applicant with no disciplinary history; ENDORSEMENT application submitted and moved to UNDER_REVIEW by creating its CredentialEvaluation."
            - "An ACTIVE evaluator holds one ASSIGNED ReviewAssignment on the application."
            - "Two full deficiency/cure cycles have already been recorded, so deficiency_cycle_count == 2 and status is UNDER_REVIEW again."
            - "Logical clock at the 2026-08-01T00:00:00Z default; review_deadline_at is 2026-10-30T00:00:00Z."
          setup_api_calls:
            - call: "POST /licensure/professions"
              payload: { profession_code: "RN", title: "Registered Nurse", required_scope_elements: ["ASSESS", "TREAT", "PRESCRIBE", "SUPERVISE"], critical_scope_elements: ["PRESCRIBE"], required_practice_hours: 2000, requirement_hours_total: 240.0, exam_waiver_min_score: 70.00, jurisprudence_exam_required: true, universal_recognition_min_residency_months: 12, standard_processing_days: 90, base_fee_cents: 25000, endorsement_fee_cents: 10000, exam_fee_cents: 8000, jurisprudence_fee_cents: 5000, permit_fee_cents: 6000, expedite_surcharge_pct: 0.15 }
              as: AgencyAdmin
              as_user_id: "adm_1"
              captures: { prof_rn: $.data.id }
            - call: "POST /licensure/applicants"
              payload: { full_name: "Tess Nakamura", state_code: "TX", residency_months: 24, military_status: "NONE" }
              as: AgencyAdmin
              as_user_id: "adm_1"
              captures: { ap: $.data.id }
            - call: "POST /licensure/applicants/${ap}/out-of-state-credentials"
              payload: { issuing_state: "OK", license_number: "OK-70010", scope_elements: ["ASSESS", "TREAT", "SUPERVISE"], practice_hours: 1200, status: "ACTIVE", verified_good_standing: true, issued_at: "2020-05-01T00:00:00Z" }
              as: Applicant
