scaffold_difficulty_design:
  # =========================================================================
  - rule_id: dual_variant_calc
    instances:
      - name: assessed_vs_collectible_balance
        grounds:
          - calculations.case_balances
          - entities.ScofflawCase.fields.assessed_balance_cents
          - entities.ScofflawCase.fields.collectible_balance_cents
          - state_machines.Violation.OUTSTANDING_to_DISPUTED
        distinguishing_aspect: "Same two violations on one ScofflawCase; assessed_balance_cents includes the DISPUTED citation (50000) while collectible_balance_cents excludes it (30000) — two inclusion sets, one entity, different numbers."
        test_recipe:
          setup:
            - "Owner O1 owns Vehicle V1; ScofflawCase C1 opened for V1 (owner_id copied = O1)."
            - "Violation v1 fine 30000 OUTSTANDING (issued 2026-05-01, due 2026-12-31, no late penalty)."
            - "Violation v2 fine 20000 then disputed -> DISPUTED."
          setup_api_calls:
            - call: "POST /owners"
              payload: { full_name: "Olive Owner", dmv_customer_id: "DMV-1", email: "o1@x.com", mailing_state: "CA" }
              as: PlatformAdmin
              captures: { o1: $.data.id }
            - call: "POST /vehicles"
              payload: { owner_id: "${o1}", plate_number: "AAA111", plate_state: "CA", vin: "VIN1" }
              as: PlatformAdmin
              captures: { veh1: $.data.id }
            - call: "POST /scofflaw-cases"
              payload: { vehicle_id: "${veh1}" }
              as: EnforcementOfficer
              captures: { c1: $.data.id }
            - call: "POST /scofflaw-cases/${c1}/violations"
              payload: { citation_number: "CIT-1", violation_type: "METER_EXPIRED", fine_amount_cents: 30000, issued_at: "2026-05-01T00:00:00Z", due_at: "2026-12-31T00:00:00Z" }
              as: EnforcementOfficer
              captures: { v1: $.data.id }
            - call: "POST /scofflaw-cases/${c1}/violations"
              payload: { citation_number: "CIT-2", violation_type: "NO_PERMIT", fine_amount_cents: 20000, issued_at: "2026-05-01T00:00:00Z", due_at: "2026-12-31T00:00:00Z" }
              as: EnforcementOfficer
              captures: { v2: $.data.id }
            - call: "POST /violations/${v2}/disputes"
              payload: { reason: "not my car" }
              as: Owner
              as_user_id: "${o1}"
              captures: { d1: $.data.id }
          trigger:
            - call: "GET /scofflaw-cases/${c1}"
              as: EnforcementOfficer
          assert:
            - "ScofflawCase.${c1}.collectible_balance_cents == 30000"
            - "ScofflawCase.${c1}.assessed_balance_cents == 50000"
            - "ScofflawCase.${c1}.collectible_balance_cents != ScofflawCase.${c1}.assessed_balance_cents"

      - name: boot_vs_tow_release_fee
        grounds:
          - calculations.release_fee
          - entities.BootTowOrder.fields.release_fee_cents
          - state_machines.BootTowOrder.DISPATCHED_to_APPLIED
        distinguishing_aspect: "Identical case liabilities; a BOOT order's release_fee_cents is a flat 20000 while a TOW order stored 5 days is 50000 (TOW_FEE+ADMIN+5*4000) — two formulas on the BootTowOrder entity, different results."
        test_recipe:
          setup:
            - "Owner O1; Vehicles VA, VB; TowYard TY capacity 5."
            - "Case CA with 5 violations of 25000 (SCOFFLAW, boot-eligible)."
            - "Case CB with 5 violations of 25000 (SCOFFLAW, tow-eligible, collectible 125000)."
            - "BOOT dispatched+applied on CA; TOW dispatched+applied on CB with stored_from 2026-06-01 at clock 2026-06-06."
          setup_api_calls:
            - call: "POST /owners"
              payload: { full_name: "Olive Owner", dmv_customer_id: "DMV-2", email: "o1@x.com", mailing_state: "CA" }
              as: PlatformAdmin
              captures: { o1: $.data.id }
            - call: "POST /vehicles"
              payload: { owner_id: "${o1}", plate_number: "VA000", plate_state: "CA", vin: "VINA" }
              as: PlatformAdmin
              captures: { vehA: $.data.id }
            - call: "POST /vehicles"
              payload: { owner_id: "${o1}", plate_number: "VB000", plate_state: "CA", vin: "VINB" }
              as: PlatformAdmin
              captures: { vehB: $.data.id }
            - call: "POST /tow-yards"
              payload: { name: "Yard1", capacity: 5 }
              as: PlatformAdmin
              captures: { ty: $.data.id }
            - call: "POST /scofflaw-cases"
              payload: { vehicle_id: "${vehA}" }
              as: EnforcementOfficer
              captures: { cA: $.data.id }
            - call: "POST /scofflaw-cases/${cA}/violations"
              payload: { citation_number: "A1", violation_type: "METER_EXPIRED", fine_amount_cents: 25000, issued_at: "2026-05-01T00:00:00Z", due_at: "2026-12-31T00:00:00Z" }
              as: EnforcementOfficer
            - call: "POST /scofflaw-cases/${cA}/violations"
              payload: { citation_number: "A2", violation_type: "METER_EXPIRED", fine_amount_cents: 25000, issued_at: "2026-05-01T00:00:00Z", due_at: "2026-12-31T00:00:00Z" }
              as: EnforcementOfficer
            - call: "POST /scofflaw-cases/${cA}/violations"
              payload: { citation_number: "A3", violation_type: "METER_EXPIRED", fine_amount_cents: 25000, issued_at: "2026-05-01T00:00:00Z", due_at: "2026-12-31T00:00:00Z" }
              as: EnforcementOfficer
            - call: "POST /scofflaw-cases/${cA}/violations"
              payload: { citation_number: "A4", violation_type: "METER_EXPIRED", fine_amount_cents: 25000, issued_at: "2026-05-01T00:00:00Z", due_at: "2026-12-31T00:00:00Z" }
              as: EnforcementOfficer
            - call: "POST /scofflaw-cases/${cA}/violations"
              payload: { citation_number: "A5", violation_type: "METER_EXPIRED", fine_amount_cents: 25000, issued_at: "2026-05-01T00:00:00Z", due_at: "2026-12-31T00:00:00Z" }
              as: EnforcementOfficer
            - call: "GET /scofflaw-cases/${cA}"
              as: EnforcementOfficer
              captures: { vA: $.data.version }
            - call: "POST /scofflaw-cases/${cA}/boot-tow-orders"
              payload: { expected_scofflaw_case_version: "${vA}", action_type: "BOOT" }
              as: EnforcementOfficer
              as_user_id: "eo-dispatch"
              captures: { oA: $.data.id }
            - call: "POST /boot-tow-orders/${oA}/apply"
              payload: {}
              as: EnforcementOfficer
              as_user_id: "eo-apply"
            - call: "POST /scofflaw-cases"
              payload: { vehicle_id: "${vehB}" }
              as: EnforcementOfficer
              captures: { cB: $.data.id }
            - call: "POST /scofflaw-cases/${cB}/violations"
              payload: { citation_number: "B1", violation_type: "METER_EXPIRED", fine_amount_cents: 25000, issued_at: "2026-05-01T00:00:00Z", due_at: "2026-12-31T00:00:00Z" }
              as: EnforcementOfficer
            - call: "POST /scofflaw-cases/${cB}/violations"
              payload: { citation_number: "B2", violation_type: "METER_EXPIRED", fine_amount_cents: 25000, issued_at: "2026-05-01T00:00:00Z", due_at: "2026-12-31T00:00:00Z" }
              as: EnforcementOfficer
            - call: "POST /scofflaw-cases/${cB}/violations"
              payload: { citation_number: "B3", violation_type: "METER_EXPIRED", fine_amount_cents: 25000, issued_at: "2026-05-01T00:00:00Z", due_at: "2026-12-31T00:00:00Z" }
              as: EnforcementOfficer
            - call: "POST /scofflaw-cases/${cB}/violations"
              payload: { citation_number: "B4", violation_type: "METER_EXPIRED", fine_amount_cents: 25000, issued_at: "2026-05-01T00:00:00Z", due_at: "2026-12-31T00:00:00Z" }
              as: EnforcementOfficer
            - call: "POST /scofflaw-cases/${cB}/violations"
              payload: { citation_number: "B5", violation_type: "METER_EXPIRED", fine_amount_cents: 25000, issued_at: "2026-05-01T00:00:00Z", due_at: "2026-12-31T00:00:00Z" }
              as: EnforcementOfficer
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-06-06T00:00:00Z" }
              as: PlatformAdmin
            - call: "GET /scofflaw-cases/${cB}"
              as: EnforcementOfficer
              captures: { vB: $.data.version }
            - call: "POST /scofflaw-cases/${cB}/boot-tow-orders"
              payload: { expected_scofflaw_case_version: "${vB}", action_type: "TOW", tow_yard_id: "${ty}", stored_from: "2026-06-01T00:00:00Z", stored_until: "2026-06-30T00:00:00Z" }
              as: EnforcementOfficer
              as_user_id: "eo-dispatch"
              captures: { oB: $.data.id }
            - call: "POST /boot-tow-orders/${oB}/apply"
              payload: {}
              as: EnforcementOfficer
              as_user_id: "eo-apply"
          trigger:
            - call: "GET /boot-tow-orders/${oA}"
              as: EnforcementOfficer
            - call: "GET /boot-tow-orders/${oB}"
              as: EnforcementOfficer
          assert:
            - "BootTowOrder.${oA}.release_fee_cents == 20000"
            - "BootTowOrder.${oB}.release_fee_cents == 50000"
            - "BootTowOrder.${oA}.release_fee_cents != BootTowOrder.${oB}.release_fee_cents"

  # =========================================================================
  - rule_id: combinatorial_formula
    instances:
      - name: tow_release_fee_nested_min
        grounds:
          - calculations.release_fee
          - entities.BootTowOrder.fields.release_fee_cents
        distinguishing_aspect: "Mode (a): TOW fee = TOW_FEE + ADMIN_FEE + min(storage_days, MAX_STORAGE_DAYS)*DAILY_RATE; stored 40 days caps at 30, so fee = 25000+5000+30*4000 = 150000 (nested min over >=3 inputs)."
        test_recipe:
          setup:
            - "SCOFFLAW tow-eligible Case (5 violations of 25000)."
            - "TOW dispatched at stored_from 2026-06-01, applied; clock advanced to 2026-07-11 (40 days)."
          setup_api_calls:
            - call: "POST /owners"
              payload: { full_name: "Owner T", dmv_customer_id: "DMV-3", email: "t@x.com", mailing_state: "CA" }
              as: PlatformAdmin
              captures: { o1: $.data.id }
            - call: "POST /vehicles"
              payload: { owner_id: "${o1}", plate_number: "TOW40", plate_state: "CA", vin: "VINT" }
              as: PlatformAdmin
              captures: { veh: $.data.id }
            - call: "POST /tow-yards"
              payload: { name: "YardT", capacity: 5 }
              as: PlatformAdmin
              captures: { ty: $.data.id }
            - call: "POST /scofflaw-cases"
              payload: { vehicle_id: "${veh}" }
              as: EnforcementOfficer
              captures: { c: $.data.id }
            - call: "POST /scofflaw-cases/${c}/violations"
              payload: { citation_number: "T1", violation_type: "METER_EXPIRED", fine_amount_cents: 25000, issued_at: "2026-05-01T00:00:00Z", due_at: "2026-12-31T00:00:00Z" }
              as: EnforcementOfficer
            - call: "POST /scofflaw-cases/${c}/violations"
              payload: { citation_number: "T2", violation_type: "METER_EXPIRED", fine_amount_cents: 25000, issued_at: "2026-05-01T00:00:00Z", due_at: "2026-12-31T00:00:00Z" }
              as: EnforcementOfficer
            - call: "POST /scofflaw-cases/${c}/violations"
              payload: { citation_number: "T3", violation_type: "METER_EXPIRED", fine_amount_cents: 25000, issued_at: "2026-05-01T00:00:00Z", due_at: "2026-12-31T00:00:00Z" }
              as: EnforcementOfficer
            - call: "POST /scofflaw-cases/${c}/violations"
              payload: { citation_number: "T4", violation_type: "METER_EXPIRED", fine_amount_cents: 25000, issued_at: "2026-05-01T00:00:00Z", due_at: "2026-12-31T00:00:00Z" }
              as: EnforcementOfficer
            - call: "POST /scofflaw-cases/${c}/violations"
              payload: { citation_number: "T5", violation_type: "METER_EXPIRED", fine_amount_cents: 25000, issued_at: "2026-05-01T00:00:00Z", due_at: "2026-12-31T00:00:00Z" }
              as: EnforcementOfficer
            - call: "GET /scofflaw-cases/${c}"
              as: EnforcementOfficer
              captures: { v: $.data.version }
            - call: "POST /scofflaw-cases/${c}/boot-tow-orders"
              payload: { expected_scofflaw_case_version: "${v}", action_type: "TOW", tow_yard_id: "${ty}", stored_from: "2026-06-01T00:00:00Z", stored_until: "2026-08-01T00:00:00Z" }
              as: EnforcementOfficer
              as_user_id: "eo-dispatch"
              captures: { o: $.data.id }
            - call: "POST /boot-tow-orders/${o}/apply"
              payload: {}
              as: EnforcementOfficer
              as_user_id: "eo-apply"
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-07-11T00:00:00Z" }
              as: PlatformAdmin
          trigger:
            - call: "GET /boot-tow-orders/${o}"
              as: EnforcementOfficer
          assert:
            - "BootTowOrder.${o}.release_fee_cents == 150000"

      - name: late_penalty_round_each_then_sum
        grounds:
          - calculations.case_balances
          - entities.Violation.fields.late_penalty_cents
          - entities.ScofflawCase.fields.collectible_balance_cents
        distinguishing_aspect: "Mode (b): two 3333 fines at 25% overdue; per-violation round_half_up(833.25)=833 twice -> collectible 8332, not sum-then-round round(1666.5)=1667 -> 8333; scaffold pins per-violation rounding then sum."
        test_recipe:
          setup:
            - "Case with two OUTSTANDING violations fine 3333, due 2026-05-15; clock advanced to 2026-06-01 so both are overdue."
          setup_api_calls:
            - call: "POST /owners"
              payload: { full_name: "Owner R", dmv_customer_id: "DMV-4", email: "r@x.com", mailing_state: "CA" }
              as: PlatformAdmin
              captures: { o1: $.data.id }
            - call: "POST /vehicles"
              payload: { owner_id: "${o1}", plate_number: "RND01", plate_state: "CA", vin: "VINR" }
              as: PlatformAdmin
              captures: { veh: $.data.id }
            - call: "POST /scofflaw-cases"
              payload: { vehicle_id: "${veh}" }
              as: EnforcementOfficer
              captures: { c: $.data.id }
            - call: "POST /scofflaw-cases/${c}/violations"
              payload: { citation_number: "R1", violation_type: "METER_EXPIRED", fine_amount_cents: 3333, issued_at: "2026-05-01T00:00:00Z", due_at: "2026-05-15T00:00:00Z" }
              as: EnforcementOfficer
            - call: "POST /scofflaw-cases/${c}/violations"
              payload: { citation_number: "R2", violation_type: "METER_EXPIRED", fine_amount_cents: 3333, issued_at: "2026-05-01T00:00:00Z", due_at: "2026-05-15T00:00:00Z" }
              as: EnforcementOfficer
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-06-01T00:00:00Z" }
              as: PlatformAdmin
          trigger:
            - call: "GET /scofflaw-cases/${c}"
              as: EnforcementOfficer
          assert:
            - "ScofflawCase.${c}.collectible_balance_cents == 8332"

  # =========================================================================
  - rule_id: non_linear_state_machine
    instances:
      - name: scofflaw_case_parallel_status_hold
        grounds:
          - state_machines.ScofflawCase.NO_HOLD_to_HOLD_PLACED
          - entities.ScofflawCase.fields.case_status
          - entities.ScofflawCase.fields.hold_status
        distinguishing_aspect: "hold_status advances NO_HOLD->HOLD_PLACED while case_status stays SCOFFLAW — two independent parallel dimensions on the same ScofflawCase row."
        test_recipe:
          setup:
            - "Case SCOFFLAW via 5 violations of 12000 (collectible 60000, count 5); hold_status NO_HOLD."
          setup_api_calls:
            - call: "POST /owners"
              payload: { full_name: "Owner P", dmv_customer_id: "DMV-5", email: "p@x.com", mailing_state: "CA" }
              as: PlatformAdmin
              captures: { o1: $.data.id }
            - call: "POST /vehicles"
              payload: { owner_id: "${o1}", plate_number: "PAR01", plate_state: "CA", vin: "VINP" }
              as: PlatformAdmin
              captures: { veh: $.data.id }
            - call: "POST /scofflaw-cases"
              payload: { vehicle_id: "${veh}" }
              as: EnforcementOfficer
              captures: { c: $.data.id }
            - call: "POST /scofflaw-cases/${c}/violations"
              payload: { citation_number: "P1", violation_type: "METER_EXPIRED", fine_amount_cents: 12000, issued_at: "2026-05-01T00:00:00Z", due_at: "2026-12-31T00:00:00Z" }
              as: EnforcementOfficer
            - call: "POST /scofflaw-cases/${c}/violations"
              payload: { citation_number: "P2", violation_type: "METER_EXPIRED", fine_amount_cents: 12000, issued_at: "2026-05-01T00:00:00Z", due_at: "2026-12-31T00:00:00Z" }
              as: EnforcementOfficer
            - call: "POST /scofflaw-cases/${c}/violations"
              payload: { citation_number: "P3", violation_type: "METER_EXPIRED", fine_amount_cents: 12000, issued_at: "2026-05-01T00:00:00Z", due_at: "2026-12-31T00:00:00Z" }
              as: EnforcementOfficer
            - call: "POST /scofflaw-cases/${c}/violations"
              payload: { citation_number: "P4", violation_type: "METER_EXPIRED", fine_amount_cents: 12000, issued_at: "2026-05-01T00:00:00Z", due_at: "2026-12-31T00:00:00Z" }
              as: EnforcementOfficer
            - call: "POST /scofflaw-cases/${c}/violations"
              payload: { citation_number: "P5", violation_type: "METER_EXPIRED", fine_amount_cents: 12000, issued_at: "2026-05-01T00:00:00Z", due_at: "2026-12-31T00:00:00Z" }
              as: EnforcementOfficer
          trigger:
            - call: "POST /scofflaw-cases/${c}/place-hold"
              payload: {}
              as: EnforcementOfficer
          assert:
            - "ScofflawCase.${c}.hold_status == HOLD_PLACED"
            - "ScofflawCase.${c}.case_status == SCOFFLAW"
            - "Vehicle.${veh}.hold_flag == true"

      - name: violation_dispute_reinstate_cycle
        grounds:
          - state_machines.Violation.OUTSTANDING_to_DISPUTED
          - state_machines.Violation.DISPUTED_to_OUTSTANDING
          - state_machines.Dispute.SUBMITTED_to_WITHDRAWN
        distinguishing_aspect: "Violation traverses OUTSTANDING->DISPUTED->OUTSTANDING (an A->B->A cycle) on the Violation entity, distinct from ScofflawCase's parallel machine."
        test_recipe:
          setup:
            - "Case with one OUTSTANDING violation fine 40000; owner files then withdraws the dispute."
          setup_api_calls:
            - call: "POST /owners"
              payload: { full_name: "Owner C", dmv_customer_id: "DMV-6", email: "c@x.com", mailing_state: "CA" }
              as: PlatformAdmin
              captures: { o1: $.data.id }
            - call: "POST /vehicles"
              payload: { owner_id: "${o1}", plate_number: "CYC01", plate_state: "CA", vin: "VINC" }
              as: PlatformAdmin
              captures: { veh: $.data.id }
            - call: "POST /scofflaw-cases"
              payload: { vehicle_id: "${veh}" }
              as: EnforcementOfficer
              captures: { c: $.data.id }
            - call: "POST /scofflaw-cases/${c}/violations"
              payload: { citation_number: "CY1", violation_type: "NO_PERMIT", fine_amount_cents: 40000, issued_at: "2026-05-01T00:00:00Z", due_at: "2026-12-31T00:00:00Z" }
              as: EnforcementOfficer
              captures: { v: $.data.id }
            - call: "POST /violations/${v}/disputes"
              payload: { reason: "contest" }
              as: Owner
              as_user_id: "${o1}"
              captures: { d: $.data.id }
          trigger:
            - call: "POST /disputes/${d}/withdraw"
              payload: {}
              as: Owner
              as_user_id: "${o1}"
          assert:
            - "Violation.${v}.status == OUTSTANDING"
            - "Dispute.${d}.status == WITHDRAWN"

  # =========================================================================
  - rule_id: transitive_cascade
    instances:
      - name: payment_resolves_case_releases_hold
        grounds:
          - state_machines.Violation.OUTSTANDING_to_PAID
          - state_machines.ScofflawCase.SCOFFLAW_to_RESOLVED
          - state_machines.ScofflawCase.HOLD_PLACED_to_HOLD_RELEASED
          - entities.Vehicle.fields.hold_flag
        distinguishing_aspect: "Depth-4 chain from a single payment: violation->PAID (1) causes case->RESOLVED (2) causes hold_status->HOLD_RELEASED (3) causes Vehicle.hold_flag=false (4); each hop is caused by the previous."
        test_recipe:
          setup:
            - "Case SCOFFLAW via one OUTSTANDING violation fine 50000 (collectible 50000); DMV hold placed (hold_flag true); no boot/tow orders."
          setup_api_calls:
            - call: "POST /owners"
              payload: { full_name: "Owner D", dmv_customer_id: "DMV-7", email: "d@x.com", mailing_state: "CA" }
              as: PlatformAdmin
              captures: { o1: $.data.id }
            - call: "POST /vehicles"
              payload: { owner_id: "${o1}", plate_number: "CAS01", plate_state: "CA", vin: "VIND" }
              as: PlatformAdmin
              captures: { veh: $.data.id }
            - call: "POST /scofflaw-cases"
              payload: { vehicle_id: "${veh}" }
              as: EnforcementOfficer
              captures: { c: $.data.id }
            - call: "POST /scofflaw-cases/${c}/violations"
              payload: { citation_number: "CA1", violation_type: "FIRE_HYDRANT", fine_amount_cents: 50000, issued_at: "2026-05-01T00:00:00Z", due_at: "2026-12-31T00:00:00Z" }
              as: EnforcementOfficer
              captures: { v: $.data.id }
            - call: "POST /scofflaw-cases/${c}/place-hold"
              payload: {}
              as: EnforcementOfficer
          trigger:
            - call: "POST /scofflaw-cases/${c}/payments"
              payload: { amount_cents: 50000, method: "CARD" }
              as: Owner
              as_user_id: "${o1}"
          assert:
            - "Violation.${v}.status == PAID"
            - "ScofflawCase.${c}.collectible_balance_cents == 0"
            - "ScofflawCase.${c}.case_status == RESOLVED"
            - "ScofflawCase.${c}.hold_status == HOLD_RELEASED"
            - "Vehicle.${veh}.hold_flag == false"

      - name: dispute_deescalates_cancels_boot
        grounds:
          - state_machines.Violation.OUTSTANDING_to_DISPUTED
          - state_machines.ScofflawCase.SCOFFLAW_to_COMPLIANT
          - state_machines.BootTowOrder.DISPATCHED_to_CANCELLED
        distinguishing_aspect: "Depth-3 chain from a file-dispute trigger (distinct from the payment cascade): violation->DISPUTED (1) drops collectible causing case SCOFFLAW->COMPLIANT (2) which auto-cancels the still-DISPATCHED boot order (3)."
        test_recipe:
          setup:
            - "Case with 4 violations of 8000 plus one of 20000 (collectible 52000, count 5) -> SCOFFLAW, boot-eligible."
            - "A BOOT order dispatched (still DISPATCHED, not applied)."
          setup_api_calls:
            - call: "POST /owners"
              payload: { full_name: "Owner E", dmv_customer_id: "DMV-8", email: "e@x.com", mailing_state: "CA" }
              as: PlatformAdmin
              captures: { o1: $.data.id }
            - call: "POST /vehicles"
              payload: { owner_id: "${o1}", plate_number: "DEE01", plate_state: "CA", vin: "VINE" }
              as: PlatformAdmin
              captures: { veh: $.data.id }
            - call: "POST /scofflaw-cases"
              payload: { vehicle_id: "${veh}" }
