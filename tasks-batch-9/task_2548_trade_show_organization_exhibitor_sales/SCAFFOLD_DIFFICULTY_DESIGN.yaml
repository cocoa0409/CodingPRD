            - "After signing ${d1}: inventory_committed is still 2 and inventory_available is still 0 (the slot was consumed at PROPOSE, INVARIANT B)"
            - "After cancelling ${d2}: inventory_committed == 1 and inventory_available == 1, exactly the pre-propose split (INVARIANT D)"
            - "The re-attempted proposal now returns HTTP 201: SponsorshipDeal.${d3}.deal_status == PROPOSED"
            - "At every step inventory_total == inventory_committed + inventory_available == 2 (INVARIANT A) and 0 <= inventory_available <= 2 (INVARIANT C)"
            - "SponsorshipDeal.${d2}.deal_status == CANCELLED and its two FulfillmentObligations were never created (obligation_count == 0, because obligations are minted at SIGN)"
