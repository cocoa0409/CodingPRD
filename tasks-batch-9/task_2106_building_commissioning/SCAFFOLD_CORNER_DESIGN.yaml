        distinguishing_aspect: "8 of 10 attendees gives coverage_ratio exactly 0.8 and the acceptance succeeds because the gate is >=; 7 of 10 gives 0.7 and answers 422 ERR_TRAINING_COVERAGE_INSUFFICIENT."
        test_recipe:
