            - { call: "POST /youth-ministry/background-checks/${bcA}/advance", payload: {to_status: "CLEARED"}, as: ProgramDirector }
            - { call: "POST /youth-ministry/chaperones", payload: {program_id: "${prog}", first_name: "Bob", last_name: "B", email: "b@x.org", phone: "556"}, as: ProgramDirector, captures: {chapB: $.data.id} }
            - { call: "POST /youth-ministry/chaperone-assignments", payload: {trip_id: "${trip}", chaperone_id: "${chapA}", role: "LEAD"}, as: ProgramDirector, captures: {asg: $.data.id} }
          trigger:
            - { call: "POST /youth-ministry/chaperone-assignments/${asg}/respond", payload: {decision: "ACCEPT"}, as: Chaperone, as_user_id: "${chapB}", captures: {e_own: $.data.error_id} }
            - { call: "POST /youth-ministry/chaperone-assignments/${asg}/respond", payload: {decision: "DECLINE"}, as: Chaperone, as_user_id: "${chapA}", captures: {st: $.data.status} }
            - { call: "POST /youth-ministry/chaperone-assignments/${asg}/respond", payload: {decision: "ACCEPT"}, as: Chaperone, as_user_id: "${chapA}", captures: {e_term: $.data.error_id} }
          assert:
            - "e_own == ERR_NOT_RESOURCE_OWNER (B cannot answer A's assignment)"
            - "st == DECLINED"
            - "e_term == ERR_ASSIGNMENT_STATE_FORBIDS_ACTION (DECLINED is terminal)"

      - name: cross_role_exclusive_operations_forbidden
        claim_type: role_denial
        grounds:
          - validations[priority=3]
          - errors[ERR_ROLE_FORBIDDEN]
          - roles.ProgramDirector
          - roles.Treasurer
          - roles.ScholarshipReviewer
          - roles.TripLeader
        distinguishing_aspect: "Each role is denied other roles' exclusive operations: Guardian cannot lock rosters, Treasurer cannot review registrations, ScholarshipReviewer cannot record donations, TripLeader cannot disburse or run the clock, Chaperone cannot create trips."
        test_recipe:
          setup: ["program + trip DRAFT (ids for path validity; role check precedes existence anyway)"]
          setup_api_calls:
            - { call: "POST /youth-ministry/programs", payload: {name: "P", ministry_year: "2026-2027", scholarship_fund_total_cents: 0, code_of_conduct_text: "CoC", discipline_policy_text: "DP"}, as: ProgramDirector, captures: {prog: $.data.id} }
            - { call: "POST /youth-ministry/trips", payload: {program_id: "${prog}", name: "T", destination_name: "Local", destination_type: "IN_STATE", start_date: "2027-06-15", end_date: "2027-06-16", capacity_youth: 10, base_cost_cents: 80000, deposit_cents: 50000, chaperone_ratio: 5, registration_open_at: "2026-08-01T00:00:00Z", registration_close_at: "2026-12-01T00:00:00Z", deposit_due_at: "2027-01-15T00:00:00Z", final_payment_due_at: "2027-05-01T00:00:00Z"}, as: ProgramDirector, captures: {trip: $.data.id} }
          trigger:
            - { call: "POST /youth-ministry/trips/${trip}/lock-roster", as: Guardian, as_user_id: "guardian-1", captures: {e1: $.data.error_id} }
            - { call: "POST /youth-ministry/registrations/11111111-1111-4111-8111-111111111111/review", payload: {decision: "APPROVE"}, as: Treasurer, captures: {e2: $.data.error_id} }
            - { call: "POST /youth-ministry/fundraising-accounts/11111111-1111-4111-8111-111111111111/donations", payload: {donor_name: "D", amount_cents: 100, channel: "CASH"}, as: ScholarshipReviewer, captures: {e3: $.data.error_id} }
            - { call: "POST /youth-ministry/_clock/set-current-utc", payload: {to_iso8601: "2027-01-01T00:00:00Z"}, as: TripLeader, captures: {e4: $.data.error_id} }
            - { call: "POST /youth-ministry/trips", payload: {program_id: "${prog}", name: "X", destination_name: "Y", destination_type: "IN_STATE", start_date: "2027-06-15", end_date: "2027-06-16", capacity_youth: 5, base_cost_cents: 100, deposit_cents: 50, chaperone_ratio: 5, registration_open_at: "2026-08-01T00:00:00Z", registration_close_at: "2026-12-01T00:00:00Z", deposit_due_at: "2027-01-15T00:00:00Z", final_payment_due_at: "2027-05-01T00:00:00Z"}, as: Chaperone, as_user_id: "11111111-1111-4111-8111-111111111111", captures: {e5: $.data.error_id} }
          assert:
            - "e1 == e2 == e3 == e4 == e5 == ERR_ROLE_FORBIDDEN (403) — exclusive operations are enforced per endpoint roles list"

      - name: scholarship_disburse_segregation_of_duties
        claim_type: segregation_of_duties
        grounds:
          - errors[ERR_SOD_VIOLATION]
          - entities.ScholarshipApplication.fields.approved_by_user_id
          - entities.ScholarshipApplication.fields.disbursed_by_user_id
        distinguishing_aspect: "The user who approved (reviewer-1) cannot disburse even when presenting the Treasurer role — the SoD check compares stored approved_by_user_id to X-User-ID; a genuinely different treasurer-1 succeeds and the fund shifts reserved -> disbursed with available unchanged."
        test_recipe:
          setup: ["reg1 APPROVED; app1 APPROVED by reviewer-1 with award 60000 (need 60: BAND_A 50 + size 3 -> 5 + 0 + 5 for a 1000 CASH donation; basis 200000 -> need_cap round_half_up(0.60*0.5*200000) = 60000)"]
