# =============================================================================
# §1.8 Scaffold Difficulty Design (Test Targeting Index)
# task_3335_engineered_wood_products_distribution_builder_direct_supply
# 9 rules x 2 instances = 18 instances. Every grounds ref resolves into
# SCAFFOLD.yaml §1.1–§1.7. All numeric asserts are pre-computed literals.
# =============================================================================
scaffold_difficulty_design:

  # ===========================================================================
  - rule_id: dual_variant_calc
    instances:
      - name: valuation_fifo_vs_weighted_average_diverge_on_same_lots
        grounds:
          - calculations.inventory_valuation
          - endpoints.GET_/branches/{branch_id}/valuation
          - entities.InventoryLot.fields.unit_cost_cents_per_mbf
        distinguishing_aspect: |
          Entity domain: InventoryLot/Branch cost accounting. Two valid algorithms
          over identical lots produce different cents: FIFO values the remaining lot
          at its own cost (600000) while weighted-average values it at the pool
          average (550000); delta is exactly 50000.
        test_recipe:
          setup:
            - "Logical clock 2026-09-01. Branch BR-BOI holds lot L1 (10 mbf @ 50000, received 2026-09-02) and lot L2 (10 mbf @ 60000, received 2026-09-03)."
            - "Builder ACTIVE with limit 5000000; job J; order of 10 mbf FIXED @ 100000 confirmed 2026-09-04 and delivered 2026-09-10, so FIFO consumed all of L1 and weighted-average consumed 10 mbf at the 55000 pool average."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-09-01T00:00:00Z" }
              as: OpsAdmin
            - call: "POST /products"
              payload: { sku_code: "LVL-DF-16", product_family: "LVL_BEAM", species: "DOUGLAS_FIR", dimension_label: "16in", index_premium_cents: 500 }
              as: OpsAdmin
              captures: { prod: $.data.id }
            - call: "POST /branches"
              payload: { branch_code: "BR-BOI", region_code: "PNW", species_preference: "DOUGLAS_FIR", target_stock_mbf: 500, activity_score: 90 }
              as: OpsAdmin
              captures: { br: $.data.id }
            - call: "POST /builders"
              payload: { legal_name: "Treeline Builders", lien_rights_state_code: "ID" }
              as: CreditManager
              captures: { b: $.data.id }
            - call: "POST /builders/${b}/credit-review"
              payload: { decision: "APPROVE", credit_limit_cents: 5000000 }
              as: CreditManager
            - call: "POST /builders/${b}/jobs"
              payload: { job_name: "Ridgeview Lot 7", access_window_start: "2026-09-01T00:00:00Z", access_window_end: "2026-12-31T23:59:59Z", job_exposure_cap_cents: 100000000 }
              as: AccountManager
              captures: { job: $.data.id }
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-09-02T08:00:00Z" }
              as: OpsAdmin
            - call: "POST /branches/${br}/inventory-lots"
              payload: { product_id: "${prod}", qty_received_mbf: 10, unit_cost_cents_per_mbf: 50000 }
              as: BranchManager
              captures: { lot1: $.data.id }
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-09-03T08:00:00Z" }
              as: OpsAdmin
            - call: "POST /branches/${br}/inventory-lots"
              payload: { product_id: "${prod}", qty_received_mbf: 10, unit_cost_cents_per_mbf: 60000 }
              as: BranchManager
              captures: { lot2: $.data.id }
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-09-04T08:00:00Z" }
              as: OpsAdmin
            - call: "GET /builders/${b}"
              payload: {}
              as: AccountManager
              captures: { b_v: $.data.version }
            - call: "POST /jobs/${job}/sales-orders"
              payload: { branch_id: "${br}", pricing_week_mode: "LOCK_AT_ACCEPT", lines: [{ product_id: "${prod}", qty_mbf: 10, price_basis: "FIXED", fixed_unit_price_cents_per_mbf: 100000 }], expected_builder_version: "${b_v}" }
              as: AccountManager
              captures: { o: $.data.id }
            - call: "POST /sales-orders/${o}/confirm"
              payload: {}
              as: AccountManager
            - call: "POST /sales-orders/${o}/deliveries"
              payload: { boom_required: false, window_start: "2026-09-10T09:00:00Z", window_end: "2026-09-10T12:00:00Z" }
              as: AccountManager
              captures: { d: $.data.id }
            - call: "POST /truck-shifts"
              payload: { fleet_code: "FLT-1", shift_date: "2026-09-10", window_start: "2026-09-10T08:00:00Z", window_end: "2026-09-10T16:00:00Z", boom_capable: true }
              as: OpsAdmin
              captures: { sh: $.data.id }
            - call: "POST /deliveries/${d}/schedule"
              payload: { truck_shift_id: "${sh}" }
              as: FleetCoordinator
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-09-10T13:00:00Z" }
              as: OpsAdmin
            - call: "POST /deliveries/${d}/complete"
              payload: { outcome: "COMPLETED" }
              as: FleetCoordinator
          trigger:
            - call: "GET /branches/${br}/valuation"
              payload: {}
              as: BranchManager
              captures: { fifo: $.data.fifo_value_cents, wavg: $.data.weighted_avg_value_cents, delta: $.data.delta_cents }
          assert:
            - "valuation fifo_value_cents == 600000 (remaining lot L2 at its own cost 10 * 60000)"
            - "valuation weighted_avg_value_cents == 550000 (pool average 55000 * 10 remaining mbf)"
            - "valuation delta_cents == 50000"
            - "InventoryLot.${lot1}.lot_status == SOLD_OUT and qty_sold_mbf == 10"

      - name: builder_exposure_committed_includes_undelivered_settled_does_not
        grounds:
          - calculations.builder_exposure
          - endpoints.GET_/builders/{builder_id}/exposure
          - entities.Builder.fields.exposure_committed_cents
        distinguishing_aspect: |
          Entity domain: Builder credit risk. Over identical order data, the
          committed variant counts undelivered confirmed orders (5000000) while the
          settled variant counts only delivered orders (3000000); the variants
          diverge by exactly the undelivered order total.
        test_recipe:
          setup:
            - "Logical clock 2026-09-01. Branch BR-BOI stocked with 100 mbf @ 40000. Builder ACTIVE limit 20000000. Order O1: 20 mbf FIXED @ 100000 (total 2000000) CONFIRMED, not delivered. Order O2: 30 mbf FIXED @ 100000 (total 3000000) DELIVERED."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-09-01T00:00:00Z" }
              as: OpsAdmin
            - call: "POST /products"
              payload: { sku_code: "LVL-DF-16", product_family: "LVL_BEAM", species: "DOUGLAS_FIR", dimension_label: "16in", index_premium_cents: 500 }
              as: OpsAdmin
              captures: { prod: $.data.id }
            - call: "POST /branches"
              payload: { branch_code: "BR-BOI", region_code: "PNW", species_preference: "DOUGLAS_FIR", target_stock_mbf: 500, activity_score: 90 }
              as: OpsAdmin
              captures: { br: $.data.id }
            - call: "POST /builders"
              payload: { legal_name: "Treeline Builders", lien_rights_state_code: "ID" }
              as: CreditManager
              captures: { b: $.data.id }
            - call: "POST /builders/${b}/credit-review"
              payload: { decision: "APPROVE", credit_limit_cents: 20000000 }
              as: CreditManager
            - call: "POST /builders/${b}/jobs"
              payload: { job_name: "Ridgeview Lot 7", access_window_start: "2026-09-01T00:00:00Z", access_window_end: "2026-12-31T23:59:59Z", job_exposure_cap_cents: 100000000 }
              as: AccountManager
              captures: { job: $.data.id }
            - call: "POST /branches/${br}/inventory-lots"
              payload: { product_id: "${prod}", qty_received_mbf: 100, unit_cost_cents_per_mbf: 40000 }
              as: BranchManager
            - call: "GET /builders/${b}"
              payload: {}
              as: AccountManager
              captures: { b_v1: $.data.version }
            - call: "POST /jobs/${job}/sales-orders"
              payload: { branch_id: "${br}", pricing_week_mode: "LOCK_AT_ACCEPT", lines: [{ product_id: "${prod}", qty_mbf: 20, price_basis: "FIXED", fixed_unit_price_cents_per_mbf: 100000 }], expected_builder_version: "${b_v1}" }
              as: AccountManager
              captures: { o1: $.data.id }
            - call: "POST /sales-orders/${o1}/confirm"
              payload: {}
              as: AccountManager
            - call: "GET /builders/${b}"
              payload: {}
              as: AccountManager
              captures: { b_v2: $.data.version }
            - call: "POST /jobs/${job}/sales-orders"
              payload: { branch_id: "${br}", pricing_week_mode: "LOCK_AT_ACCEPT", lines: [{ product_id: "${prod}", qty_mbf: 30, price_basis: "FIXED", fixed_unit_price_cents_per_mbf: 100000 }], expected_builder_version: "${b_v2}" }
              as: AccountManager
              captures: { o2: $.data.id }
            - call: "POST /sales-orders/${o2}/confirm"
              payload: {}
              as: AccountManager
            - call: "POST /sales-orders/${o2}/deliveries"
              payload: { boom_required: false, window_start: "2026-09-10T09:00:00Z", window_end: "2026-09-10T12:00:00Z" }
              as: AccountManager
              captures: { d2: $.data.id }
            - call: "POST /truck-shifts"
              payload: { fleet_code: "FLT-1", shift_date: "2026-09-10", window_start: "2026-09-10T08:00:00Z", window_end: "2026-09-10T16:00:00Z", boom_capable: true }
              as: OpsAdmin
              captures: { sh: $.data.id }
            - call: "POST /deliveries/${d2}/schedule"
              payload: { truck_shift_id: "${sh}" }
              as: FleetCoordinator
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-09-10T13:00:00Z" }
              as: OpsAdmin
            - call: "POST /deliveries/${d2}/complete"
              payload: { outcome: "COMPLETED" }
              as: FleetCoordinator
          trigger:
            - call: "GET /builders/${b}/exposure"
              payload: {}
              as: CreditManager
              captures: { com: $.data.exposure_committed_cents, set_: $.data.exposure_settled_cents, head: $.data.credit_headroom_cents }
          assert:
            - "exposure_committed_cents == 2000000 (only undelivered CONFIRMED O1)"
            - "exposure_settled_cents == 3000000 (only DELIVERED O2)"
            - "credit_headroom_cents == 15000000 (20000000 - 2000000 - 3000000)"
            - "SalesOrder.${o1}.order_status == CONFIRMED and SalesOrder.${o2}.order_status == DELIVERED"

  # ===========================================================================
  - rule_id: combinatorial_formula
    instances:
      - name: capacity_close_waterfall_grants_by_activity_then_exhausts_pool
        grounds:
          - calculations.capacity_close_waterfall
          - endpoints.POST_/capacity-weeks/{capacity_week_id}/close
          - entities.MillCapacityWeek.fields.internal_grants
        distinguishing_aspect: |
          Mode (a): >=3 inputs with non-linear interaction — per-branch demand
          (target minus on-hand), activity ranking with a created_at tie-break, and
          a depleting pool under nested min(). Branch A (score 90, demand 500) takes
          500 of the 600 pool; branch B (score 70, demand 300) gets only min(300,
          100) = 100; the disabled branch gets nothing.
        test_recipe:
          setup:
            - "Logical clock 2026-09-01. Week MILL-ALX 2026-09-07 total 1000 mbf, allocate internal 600 market 400. Branch A: target 500, score 90, on-hand 0. Branch B: target 300, score 70, on-hand 0. Branch C: target 400, score 99, replenishment_enabled false."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-09-01T00:00:00Z" }
              as: OpsAdmin
            - call: "POST /branches"
              payload: { branch_code: "BR-BOI", region_code: "PNW", species_preference: "DOUGLAS_FIR", target_stock_mbf: 500, activity_score: 90 }
              as: OpsAdmin
              captures: { brA: $.data.id }
            - call: "POST /branches"
              payload: { branch_code: "BR-SPO", region_code: "PNW", species_preference: "SPRUCE_PINE_FIR", target_stock_mbf: 300, activity_score: 70 }
              as: OpsAdmin
              captures: { brB: $.data.id }
            - call: "POST /branches"
              payload: { branch_code: "BR-MIS", region_code: "MT", species_preference: "DOUGLAS_FIR", target_stock_mbf: 400, activity_score: 99, replenishment_enabled: false }
              as: OpsAdmin
              captures: { brC: $.data.id }
            - call: "POST /capacity-weeks"
              payload: { mill_code: "MILL-ALX", week_start_date: "2026-09-07", total_capacity_mbf: 1000 }
              as: MillPlanner
              captures: { cw: $.data.id, cw_v: $.data.version }
            - call: "POST /capacity-weeks/${cw}/allocate"
              payload: { internal_alloc_mbf: 600, market_alloc_mbf: 400, expected_capacity_week_version: "${cw_v}" }
              as: MillPlanner
          trigger:
            - call: "POST /capacity-weeks/${cw}/close"
              payload: {}
              as: MillPlanner
              captures: { ci: $.data.committed_internal_mbf, cm: $.data.committed_market_mbf, fr: $.data.fill_rate_pct }
          assert:
            - "MillCapacityWeek.${cw}.week_status == CLOSED"
            - "internal_grants == [{branch_id: ${brA}, granted_mbf: 500}, {branch_id: ${brB}, granted_mbf: 100}] in that order (activity_score DESC)"
            - "no grant entry references ${brC} (replenishment_enabled false)"
            - "committed_internal_mbf == 600 and committed_market_mbf == 400"
            - "fill_rate_pct == 1.0"

      - name: delivery_fee_component_rounding_beats_sum_then_round
        grounds:
          - calculations.delivery_fee
          - endpoints.POST_/deliveries/{delivery_id}/schedule
          - entities.Delivery.fields.delivery_fee_cents
        distinguishing_aspect: |
          Mode (b): nested rounding order is pinned as component-wise round then sum.
          With base 7501 and boom 4003 at the CRANE_ASSIST 1.5 multiplier,
          round(11251.5)+round(6004.5) = 11252+6005 = 17257, while the forbidden
          sum-then-round gives round(17256.0) = 17256 — the orders differ by exactly
          1 cent.
        test_recipe:
          setup:
            - "Logical clock 2026-09-01. Job J has placement_difficulty CRANE_ASSIST. Order CONFIRMED (20 mbf FIXED @ 100000 = 2000000). Delivery with boom_required true and window 2026-09-10T09:00-12:00. Shift covers 08:00-16:00 and is boom_capable."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-09-01T00:00:00Z" }
              as: OpsAdmin
            - call: "POST /products"
              payload: { sku_code: "LVL-DF-16", product_family: "LVL_BEAM", species: "DOUGLAS_FIR", dimension_label: "16in", index_premium_cents: 500 }
              as: OpsAdmin
              captures: { prod: $.data.id }
            - call: "POST /branches"
              payload: { branch_code: "BR-BOI", region_code: "PNW", species_preference: "DOUGLAS_FIR", target_stock_mbf: 500, activity_score: 90 }
              as: OpsAdmin
              captures: { br: $.data.id }
            - call: "POST /builders"
              payload: { legal_name: "Treeline Builders", lien_rights_state_code: "ID" }
              as: CreditManager
              captures: { b: $.data.id }
            - call: "POST /builders/${b}/credit-review"
              payload: { decision: "APPROVE", credit_limit_cents: 20000000 }
              as: CreditManager
            - call: "POST /builders/${b}/jobs"
              payload: { job_name: "Cliffside Lot 3", access_window_start: "2026-09-01T00:00:00Z", access_window_end: "2026-12-31T23:59:59Z", placement_difficulty: "CRANE_ASSIST", job_exposure_cap_cents: 100000000 }
              as: AccountManager
              captures: { job: $.data.id }
            - call: "POST /branches/${br}/inventory-lots"
              payload: { product_id: "${prod}", qty_received_mbf: 100, unit_cost_cents_per_mbf: 40000 }
              as: BranchManager
            - call: "GET /builders/${b}"
              payload: {}
              as: AccountManager
              captures: { b_v: $.data.version }
            - call: "POST /jobs/${job}/sales-orders"
              payload: { branch_id: "${br}", pricing_week_mode: "LOCK_AT_ACCEPT", lines: [{ product_id: "${prod}", qty_mbf: 20, price_basis: "FIXED", fixed_unit_price_cents_per_mbf: 100000 }], expected_builder_version: "${b_v}" }
              as: AccountManager
              captures: { o: $.data.id }
            - call: "POST /sales-orders/${o}/confirm"
              payload: {}
              as: AccountManager
            - call: "POST /sales-orders/${o}/deliveries"
              payload: { boom_required: true, window_start: "2026-09-10T09:00:00Z", window_end: "2026-09-10T12:00:00Z" }
              as: AccountManager
              captures: { d: $.data.id }
            - call: "POST /truck-shifts"
              payload: { fleet_code: "FLT-1", shift_date: "2026-09-10", window_start: "2026-09-10T08:00:00Z", window_end: "2026-09-10T16:00:00Z", boom_capable: true }
              as: OpsAdmin
              captures: { sh: $.data.id }
          trigger:
            - call: "POST /deliveries/${d}/schedule"
              payload: { truck_shift_id: "${sh}" }
              as: FleetCoordinator
              captures: { fee: $.data.delivery_fee_cents }
          assert:
            - "Delivery.${d}.delivery_fee_cents == 17257 (round_half_up(7501*1.5)=11252 plus round_half_up(4003*1.5)=6005)"
            - "Delivery.${d}.delivery_fee_cents != 17256 (the sum-then-round order is forbidden)"
            - "Delivery.${d}.delivery_status == SCHEDULED"
            - "TruckShift.${sh}.booked_drops == 1"

  # ===========================================================================
  - rule_id: non_linear_state_machine
    instances:
      - name: takeoff_revision_loop_restores_quoted_and_counts_revision
        grounds:
          - state_machines.TakeoffRequest.QUOTED_to_REVISION_REQUESTED
          - state_machines.TakeoffRequest.REVISION_REQUESTED_to_QUOTED
          - entities.TakeoffRequest.fields.revision_count
        distinguishing_aspect: |
          Entity: TakeoffRequest. The machine is cyclic — QUOTED ->
          REVISION_REQUESTED -> QUOTED — and the loop is observable: revision_count
          is exactly 1 after one loop while quoted_total_cents is overwritten by the
          second submit-design (850000 replaces 800000).
        test_recipe:
          setup:
            - "Logical clock 2026-09-01. Builder ACTIVE (limit 5000000) with job J. Branch BR-BOI exists. Takeoff T on J."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-09-01T00:00:00Z" }
              as: OpsAdmin
            - call: "POST /branches"
              payload: { branch_code: "BR-BOI", region_code: "PNW", species_preference: "DOUGLAS_FIR", target_stock_mbf: 500, activity_score: 90 }
              as: OpsAdmin
              captures: { br: $.data.id }
            - call: "POST /builders"
              payload: { legal_name: "Treeline Builders", lien_rights_state_code: "ID" }
              as: CreditManager
              captures: { b: $.data.id }
            - call: "POST /builders/${b}/credit-review"
              payload: { decision: "APPROVE", credit_limit_cents: 5000000 }
              as: CreditManager
            - call: "POST /builders/${b}/jobs"
              payload: { job_name: "Ridgeview Lot 7", access_window_start: "2026-09-01T00:00:00Z", access_window_end: "2026-12-31T23:59:59Z", job_exposure_cap_cents: 100000000 }
              as: AccountManager
              captures: { job: $.data.id }
            - call: "POST /jobs/${job}/takeoff-requests"
              payload: { plan_reference: "PLAN-2211", includes_floor_system_design: true }
              as: BuilderContact
              as_user_id: "${b}"
              captures: { t: $.data.id }
            - call: "POST /takeoff-requests/${t}/submit-design"
              payload: { design_package_reference: "DSN-A", quoted_total_cents: 800000 }
              as: AccountManager
          trigger:
            - call: "POST /takeoff-requests/${t}/revise"
              payload: { revision_note: "resize garage bay" }
              as: BuilderContact
              as_user_id: "${b}"
            - call: "POST /takeoff-requests/${t}/submit-design"
              payload: { design_package_reference: "DSN-B", quoted_total_cents: 850000 }
              as: AccountManager
            - call: "POST /takeoff-requests/${t}/accept"
              payload: { branch_id: "${br}", pricing_week_mode: "LOCK_AT_ACCEPT" }
              as: BuilderContact
              as_user_id: "${b}"
              captures: { o: $.data.id, o_total: $.data.order_total_cents, o_status: $.data.order_status, o_takeoff: $.data.takeoff_request_id }
          assert:
            - "TakeoffRequest.${t}.takeoff_status == ACCEPTED"
            - "TakeoffRequest.${t}.revision_count == 1"
            - "TakeoffRequest.${t}.quoted_total_cents == 850000 and design_package_reference == \"DSN-B\""
            - "SalesOrder.${o}.order_status == DRAFT and order_total_cents == 850000 and takeoff_request_id == ${t}"

      - name: delivery_failed_access_retry_cycle_completes
        grounds:
          - state_machines.Delivery.SCHEDULED_to_FAILED_ACCESS
          - state_machines.Delivery.FAILED_ACCESS_to_SCHEDULED
          - entities.Delivery.fields.fail_count
        distinguishing_aspect: |
          Entity: Delivery. The machine cycles SCHEDULED -> FAILED_ACCESS ->
          SCHEDULED -> COMPLETED; fail_count is exactly 1, the first shift's
          booked_drops returns to 0 on the failure, and the retried delivery on a
          second shift completes the order (DELIVERED).
        test_recipe:
          setup:
            - "Logical clock 2026-09-01. Builder ACTIVE (limit 5000000), job J (STANDARD), branch stocked 20 mbf. Order (10 mbf FIXED @ 100000 = 1000000) CONFIRMED. Two boom-capable shifts S1 and S2 on 2026-09-10 08:00-16:00. Delivery window 09:00-12:00."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-09-01T00:00:00Z" }
              as: OpsAdmin
            - call: "POST /products"
              payload: { sku_code: "LVL-DF-16", product_family: "LVL_BEAM", species: "DOUGLAS_FIR", dimension_label: "16in", index_premium_cents: 500 }
              as: OpsAdmin
              captures: { prod: $.data.id }
            - call: "POST /branches"
              payload: { branch_code: "BR-BOI", region_code: "PNW", species_preference: "DOUGLAS_FIR", target_stock_mbf: 500, activity_score: 90 }
              as: OpsAdmin
              captures: { br: $.data.id }
            - call: "POST /builders"
              payload: { legal_name: "Treeline Builders", lien_rights_state_code: "ID" }
              as: CreditManager
              captures: { b: $.data.id }
            - call: "POST /builders/${b}/credit-review"
              payload: { decision: "APPROVE", credit_limit_cents: 5000000 }
              as: CreditManager
            - call: "POST /builders/${b}/jobs"
              payload: { job_name: "Ridgeview Lot 7", access_window_start: "2026-09-01T00:00:00Z", access_window_end: "2026-12-31T23:59:59Z", job_exposure_cap_cents: 100000000 }
              as: AccountManager
              captures: { job: $.data.id }
            - call: "POST /branches/${br}/inventory-lots"
              payload: { product_id: "${prod}", qty_received_mbf: 20, unit_cost_cents_per_mbf: 40000 }
              as: BranchManager
            - call: "GET /builders/${b}"
              payload: {}
              as: AccountManager
              captures: { b_v: $.data.version }
            - call: "POST /jobs/${job}/sales-orders"
              payload: { branch_id: "${br}", pricing_week_mode: "LOCK_AT_ACCEPT", lines: [{ product_id: "${prod}", qty_mbf: 10, price_basis: "FIXED", fixed_unit_price_cents_per_mbf: 100000 }], expected_builder_version: "${b_v}" }
              as: AccountManager
