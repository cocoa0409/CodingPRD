  # ===========================================================================
  - section: endpoints
    instances:
      - name: list_pagination_envelope_and_status_filter
        claim_type: listing
        grounds:
          - response_envelope
          - entities.Subcontractor
        distinguishing_aspect: "Pagination contract: limit=2 over 3 rows yields total_count 3, has_more true, then offset=2 yields the last row with has_more false; the status filter narrows the set before pagination."
        test_recipe:
          setup: ["Three subcontractors: two APPROVED, one PENDING"]
          setup_api_calls:
            - { call: "POST /subcontractors", payload: { legal_name: "Alpha Plow", contact_email: "a@sub.example" }, as: OpsDispatcher, captures: { subA: $.data.id } }
            - { call: "POST /subcontractors", payload: { legal_name: "Beta Plow", contact_email: "b@sub.example" }, as: OpsDispatcher, captures: { subB: $.data.id } }
            - { call: "POST /subcontractors", payload: { legal_name: "Gamma Plow", contact_email: "g@sub.example" }, as: OpsDispatcher, captures: { subC: $.data.id } }
            - { call: "POST /subcontractors/${subA}/approve", as: PlatformAdmin }
            - { call: "POST /subcontractors/${subB}/approve", as: PlatformAdmin }
          trigger:
            - { call: "GET /subcontractors", payload: { limit: 2, offset: 0 }, as: OpsDispatcher }
            - { call: "GET /subcontractors", payload: { limit: 2, offset: 2 }, as: OpsDispatcher }
            - { call: "GET /subcontractors", payload: { status: "PENDING" }, as: OpsDispatcher }
          assert:
            - "Page 1: data length == 2, total_count == 3, has_more == true; envelope carries meta.api_request_id and response_type == \"array\""
            - "Page 2 (offset 2): data length == 1, has_more == false"
            - "Filter status=PENDING: total_count == 1 and the single row is ${subC}"

      - name: route_plan_orders_by_priority_sequence
        claim_type: computed_read
        grounds:
          - calculations.route_plan_ordering
          - entities.ContractSite.fields.priority_sequence
        distinguishing_aspect: "Selector ordering: the route plan serves priority 1 before 2 before 3 regardless of creation order of the visits."
        test_recipe:
          setup: ["One contract with three sites (priority 2, 1, 3); one event; three SCHEDULED visits created in site order A, B, C"]
          setup_api_calls:
            - { call: "POST /clients", payload: { name: "Route Co", credit_limit_cents: 10000000 }, as: OpsDispatcher, captures: { cl: $.data.id } }
            - { call: "POST /sites", payload: { client_id: "${cl}", name: "Route A", address: "1 Route St", region_code: "NE", pavement_area_sqft: 10000, requires_loader: false }, as: OpsDispatcher, captures: { sA: $.data.id } }
            - { call: "POST /sites", payload: { client_id: "${cl}", name: "Route B", address: "2 Route St", region_code: "NE", pavement_area_sqft: 10000, requires_loader: false }, as: OpsDispatcher, captures: { sB: $.data.id } }
            - { call: "POST /sites", payload: { client_id: "${cl}", name: "Route C", address: "3 Route St", region_code: "NE", pavement_area_sqft: 10000, requires_loader: false }, as: OpsDispatcher, captures: { sC: $.data.id } }
            - { call: "POST /contracts", payload: { client_id: "${cl}", contract_type: "PER_PUSH", season_start: "2026-11-01T00:00:00Z", season_end: "2027-03-31T23:59:59Z", per_push_rate_cents: 45000, require_photo_verification: false }, as: OpsDispatcher, captures: { k: $.data.id } }
            - { call: "POST /contract-sites", payload: { contract_id: "${k}", site_id: "${sA}", priority_sequence: 2, completion_target_minutes: 360 }, as: OpsDispatcher, captures: { csA: $.data.id } }
            - { call: "POST /contract-sites", payload: { contract_id: "${k}", site_id: "${sB}", priority_sequence: 1, completion_target_minutes: 360 }, as: OpsDispatcher, captures: { csB: $.data.id } }
            - { call: "POST /contract-sites", payload: { contract_id: "${k}", site_id: "${sC}", priority_sequence: 3, completion_target_minutes: 360 }, as: OpsDispatcher, captures: { csC: $.data.id } }
