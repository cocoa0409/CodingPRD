            - { call: "POST /grants/awards/${aw}/accept", payload: { accept_agreement_version: "FELLOWSHIP-AGREEMENT-2027.1", tax_certification_signed: false }, as: Artist, as_user_id: "${art}" }
            - { call: "GET /grants/payment-installments", payload: { award_id: "${aw}" }, as: FiscalOfficer, as_user_id: "fiscal-1" }
            - { call: "POST /grants/awards/${aw}/accept", payload: { accept_agreement_version: "FELLOWSHIP-AGREEMENT-2027.1", tax_certification_signed: true }, as: Artist, as_user_id: "${art}" }
          assert:
