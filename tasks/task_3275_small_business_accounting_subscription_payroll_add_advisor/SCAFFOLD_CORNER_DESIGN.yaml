      - name: derived_field_reconciliation_cleared_cents_recomputed
        claim_type: Derived field reconciliation
        grounds:
          - entities.Reconciliation.fields.cleared_cents
          - calculations.reconciliation_difference
        distinguishing_aspect: "Adding then excluding a txn updates cleared_cents incrementally; reads after each mutation see the correct derived value."
        test_recipe:
          setup: ["Logical clock. Plan. Company with bank connection, one txn categorized, one recon IN_PROGRESS."]
          setup_api_calls:
            - *c_clock
            - *c_plan
            - *c_company2
            - *c_adm2
            - call: "POST /api/companies/${c_company2_id}/users/${c_adm2_id}/accept"
              payload: {}
              as: CompanyUser
              as_user_id: "${c_adm2_id}"
