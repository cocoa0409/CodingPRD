              as: DesignConsultant
              as_user_id: "consultant-1"
              captures: { proj_id: $.data.id }
            - call: "POST /playground/projects/${proj_id}/start-consultation"
              payload: {}
              as: DesignConsultant
              as_user_id: "consultant-1"
            - call: "POST /playground/projects/${proj_id}/play-areas"
              payload: { age_group: "TODDLER_6_23M", axis_origin_cm: 0, axis_length_cm: 2000, surfacing_material: "ENGINEERED_WOOD_FIBER", surfacing_depth_cm: 30 }
              as: DesignConsultant
              as_user_id: "consultant-1"
              captures: { area_id: $.data.id }
            - call: "GET /playground/component-models/${m_deck_id}"
              payload: {}
              as: ManufacturerAdmin
              as_user_id: "admin-1"
              captures: { model_ver_before: $.data.version }
          trigger:
            - call: "POST /playground/component-models/${m_deck_id}/lifecycle"
              payload: { lifecycle_status: "LEGACY" }
              as: ManufacturerAdmin
              as_user_id: "admin-1"
            - call: "POST /playground/play-areas/${area_id}/placements"
              payload: { component_model_id: "${m_deck_id}", color_choice: "CEDAR", x_start_cm: 700, quantity: 1 }
              as: DesignConsultant
