              payload: { employee_id: "${emp_id}", election_window_id: "${win_id}", benefit_category_id: "${cat_default}", pretax_amount_cents: 4000, posttax_amount_cents: 1000, expected_account_version: "${acct_default_v}" }
              as: ProgramAdmin
              captures: { flag_on_excluded: $.data.excluded_amount_cents, flag_on_posttax_effective: $.data.posttax_effective_cents, flag_on_total: $.data.total_amount_cents }
            - call: "POST /benefits/elections"
              payload: { employee_id: "${emp_id}", election_window_id: "${win_id}", benefit_category_id: "${cat_pretax_only}", pretax_amount_cents: 4000, posttax_amount_cents: 0, expected_account_version: "${acct_pretax_only_v}" }
              as: ProgramAdmin
              captures: { pretax_only_excluded: $.data.excluded_amount_cents, pretax_only_total: $.data.total_amount_cents }
          assert:
            - "${pretax_only_pretax_flag} == true"
            - "${pretax_only_posttax_flag} == false"
            - "${default_posttax_flag} == true - the omitted flag took its declared default"
            - "the post-tax request on the pre-tax-only category returns HTTP 422"
            - "${flag_off_error} == ERR_ALLOCATION_TYPE_NOT_ALLOWED"
            - "the identical post-tax request on the defaulted category returns HTTP 201"
            - "${flag_on_excluded} == 4000"
            - "${flag_on_posttax_effective} == 1000"
            - "${flag_on_total} == 5000"
            - "the pure pre-tax request on the pre-tax-only category returns HTTP 201"
            - "${pretax_only_excluded} == 4000"
            - "${pretax_only_total} == 4000"

      - name: four_hop_lock_cascade_verified_end_to_end
        claim_type: cascading_side_effects
        grounds:
          - state_machines.ElectionWindow.OPEN_to_LOCKED
          - calculations.employer_pretax_commitment
        excluded_because:
          difficulty_instance: window_lock_cascades_window_to_election_to_account_to_employer_suspension
          rationale: "§1.8 already walks cascade A hop by hop (window LOCKED -> election FUNDED under funded_basis -> account CONTRIBUTION credit -> employer commitment recompute and ACTIVE->SUSPENDED), asserting each hop's fields and the ordering that makes hop 4 fire only because hop 3 ran; a §1.9 restatement would add no new observable."

      - name: exclusion_split_both_variants_and_the_switch_delta
        claim_type: dual_variant_calculation
        grounds:
          - calculations.election_pretax_exclusion_split.variants
        excluded_because:
          difficulty_instance: election_exclusion_split_elected_vs_funded_basis_divergence
          rationale: "§1.8 pins the same stored pretax_amount_cents of 18000 producing 12500 under ELECTED_BASIS and 18000 under FUNDED_BASIS, and asserts the 5500-cent delta carried at the variant switch - exactly the Variant Divergence / Variant Selection / Reconciliation trio this layer asks for."

      - name: auto_substantiation_instantaneous_ceiling_at_its_boundary
        claim_type: rate_threshold_triggers
        grounds:
          - calculations.card_transaction_auto_substantiation
          - calculations.card_transaction_auto_substantiation.constants.AUTO_SUBSTANTIATION_CEILING_CENTS
        excluded_because:
          difficulty_instance: auto_substantiation_ceiling_boundary_2500_inclusive_versus_2501
          rationale: "§1.8 tests the instantaneous per-swipe threshold at exactly 2500 (AUTO_SUBSTANTIATED, inclusive) and at 2501 (PENDING_DOCS), which is the boundary claim for this layer."

      - name: cumulative_program_cap_threshold_crossing_suspends_the_program
        claim_type: rate_threshold_triggers
        grounds:
          - calculations.employer_pretax_commitment
          - state_machines.Employer.ACTIVE_to_SUSPENDED
        excluded_because:
          difficulty_instance: window_lock_cascades_window_to_election_to_account_to_employer_suspension
          rationale: "The cumulative half of this layer is the program-cap crossing at cascade A hop 4, which §1.8 already drives past the cap and asserts as ACTIVE->SUSPENDED; the non-crossing side (committed exactly equal to the cap) is covered by the §1.9 calculations instance commitment_exactly_equal_to_program_cap_does_not_suspend. SUSPENDED is a terminal state, so no reset claim exists for this threshold."

  # ===========================================================================
  - section: consistency_model
    instances:
      - name: every_derived_field_is_visible_in_the_same_response_that_caused_it
        claim_type: immediate
        grounds:
          - complexity_profile.consistency_model
          - endpoints.POST_/benefits/elections
          - endpoints.POST_/benefits/election-windows/{window_id}/lock
          - state_machines.ElectionWindow.OPEN_to_LOCKED
          - calculations.benefit_account_conservation
          - calculations.employer_pretax_commitment
        distinguishing_aspect: "consistency_model is `immediate`, so nothing may lag by even one request: the election create response itself carries excluded_amount_cents 5000 / total_amount_cents 5000 / exclusion_basis ELECTED_BASIS, and the lock response itself carries status LOCKED with election_count 1 - and the four cascade-derived reads taken immediately afterwards (election FUNDED under FUNDED_BASIS, account contributed 5000 / available 7000 / 2 ledger rows, employer committed 5000) must already be settled with no second write, no retry and no re-read delay."
        test_recipe:
          setup:
            - "Employer 'Immediate Read Co' is ACTIVE in US-TX-AUS with transit_group_limit_cents 30000, pretax_ratio_cap_pct 100, program_cap_cents 5000000 and an ACTIVE TRANSIT_PASS category (limit 30000)."
            - "One ACTIVE employee holds a BenefitAccount opened with opening_rollover_cents 2000, so it starts with exactly one ROLLOVER_IN ledger row and available_balance_cents 2000."
            - "The 2026-08 window is OPEN with cutoff 2026-08-20 and the logical clock is at its default 2026-08-01T00:00:00Z."
          setup_api_calls:
            - call: "POST /benefits/employers"
              payload: { legal_name: "Immediate Read Co", region_code: "US-TX-AUS", transit_group_limit_cents: 30000, parking_group_limit_cents: 30000, program_cap_cents: 5000000, pretax_ratio_cap_pct: 100 }
              as: ProgramAdmin
              captures: { er_id: $.data.id, er_committed0: $.data.total_pretax_committed_cents }
            - call: "POST /benefits/benefit-categories"
              payload: { employer_id: "${er_id}", category_type: "TRANSIT_PASS", monthly_exclusion_limit_cents: 30000 }
              as: ProgramAdmin
              captures: { cat_id: $.data.id }
            - call: "POST /benefits/employers/${er_id}/activate"
              payload: {}
              as: ProgramAdmin
            - call: "POST /benefits/employees"
              payload: { employer_id: "${er_id}", external_ref: "AUS-IR-1", work_region_code: "US-TX-AUS", payroll_cycle: "MONTHLY", hire_date: "2026-02-01T00:00:00Z" }
              as: ProgramAdmin
              captures: { emp_id: $.data.id }
            - call: "POST /benefits/benefit-accounts"
              payload: { employee_id: "${emp_id}", benefit_category_id: "${cat_id}", opening_rollover_cents: 2000 }
              as: ProgramAdmin
              captures: { acct_id: $.data.id, acct_v0: $.data.version, acct_avail0: $.data.available_balance_cents, acct_entries0: $.data.ledger_entry_count }
            - call: "POST /benefits/election-windows"
              payload: { employer_id: "${er_id}", benefit_month: "2026-08", opens_at: "2026-07-01T00:00:00Z", cutoff_at: "2026-08-20T00:00:00Z" }
              as: ProgramAdmin
              captures: { win_id: $.data.id }
            - call: "POST /benefits/election-windows/${win_id}/open"
              payload: {}
              as: ProgramAdmin
              captures: { win_status_open: $.data.status }
          trigger:
            - call: "POST /benefits/elections"
              payload: { employee_id: "${emp_id}", election_window_id: "${win_id}", benefit_category_id: "${cat_id}", pretax_amount_cents: 5000, posttax_amount_cents: 0, expected_account_version: "${acct_v0}" }
              as: ProgramAdmin
              captures: { el_id: $.data.id, el_excluded_create: $.data.excluded_amount_cents, el_total_create: $.data.total_amount_cents, el_basis_create: $.data.exclusion_basis, el_funding_create: $.data.funding_status }
            - call: "GET /benefits/benefit-accounts/${acct_id}"
              payload: {}
              as: ProgramAdmin
              captures: { acct_v_after_create: $.data.version, acct_contributed_after_create: $.data.contributed_cents, acct_avail_after_create: $.data.available_balance_cents }
            - call: "POST /benefits/election-windows/${win_id}/lock"
              payload: {}
              as: ProgramAdmin
              captures: { win_status_locked: $.data.status, win_count_locked: $.data.election_count }
            - call: "GET /benefits/elections/${el_id}"
              payload: {}
              as: ProgramAdmin
              captures: { el_funding_locked: $.data.funding_status, el_basis_locked: $.data.exclusion_basis, el_excluded_locked: $.data.excluded_amount_cents }
            - call: "GET /benefits/benefit-accounts/${acct_id}"
              payload: {}
              as: ProgramAdmin
              captures: { acct_contributed_locked: $.data.contributed_cents, acct_spent_locked: $.data.spent_cents, acct_avail_locked: $.data.available_balance_cents, acct_entries_locked: $.data.ledger_entry_count }
            - call: "GET /benefits/benefit-accounts/${acct_id}/ledger-entries?entry_type=CONTRIBUTION"
              payload: {}
              as: ProgramAdmin
              captures: { contrib_amount: "$.data[0].amount_cents", contrib_source: "$.data[0].source_entity" }
            - call: "GET /benefits/employers/${er_id}"
              payload: {}
              as: ProgramAdmin
              captures: { er_committed_locked: $.data.total_pretax_committed_cents, er_status_locked: $.data.program_status }
          assert:
            - "${er_committed0} == 0"
            - "${acct_v0} == 1"
            - "${acct_avail0} == 2000"
            - "${acct_entries0} == 1"
            - "${win_status_open} == OPEN"
            - "the create response itself already carries ${el_excluded_create} == 5000, ${el_total_create} == 5000, ${el_basis_create} == ELECTED_BASIS and ${el_funding_create} == PENDING"
            - "${acct_v_after_create} == 2 - the OCC bump is visible on the very next read"
            - "${acct_contributed_after_create} == 0 and ${acct_avail_after_create} == 2000 - an election create moves no money yet"
            - "the lock response itself already carries ${win_status_locked} == LOCKED and ${win_count_locked} == 1"
            - "${el_funding_locked} == FUNDED"
            - "${el_basis_locked} == FUNDED_BASIS"
            - "${el_excluded_locked} == 5000"
            - "${acct_contributed_locked} == 5000"
            - "${acct_spent_locked} == 0"
            - "${acct_avail_locked} == 7000"
            - "${acct_entries_locked} == 2"
            - "the CONTRIBUTION ledger read carries total_count 1 with ${contrib_amount} == 5000 and ${contrib_source} == Election"
            - "${er_committed_locked} == 5000"
            - "${er_status_locked} == ACTIVE - 5000 is far below program_cap_cents 5000000, so hop 4 recomputes without suspending"
            - "every one of these values is observed on the first read after the causing write; no retry, delay or second request is needed anywhere in the chain"
