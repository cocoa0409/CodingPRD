      - name: challenge_start_review_twice_and_resubmit_when_not_remanded_rejected
        claim_type: invalid_transition
        grounds: [state_machines.DataQsChallenge, "errors[ERR_CHALLENGE_NOT_SUBMITTED]", "errors[ERR_CHALLENGE_NOT_REMANDED]"]
        distinguishing_aspect: "start-review is SUBMITTED-only (second call -> ERR_CHALLENGE_NOT_SUBMITTED); resubmit is REMANDED-only (call on UNDER_REVIEW -> ERR_CHALLENGE_NOT_REMANDED)."
