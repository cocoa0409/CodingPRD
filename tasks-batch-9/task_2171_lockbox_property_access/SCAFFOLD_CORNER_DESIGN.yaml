# =============================================================================
# §1.9 Scaffold Corner Design (Coverage Index for Non-Difficulty Tests)
# task_2171 — Real Estate Lockbox & Property Access Control
# Breadth probe over §1.1–§1.7. Logical clock default: 2026-08-01T00:00:00Z.
# =============================================================================
scaffold_corner_design:

  - section: entities
    instances:
      - name: association_creation_applies_every_policy_default
        claim_type: defaults
        grounds:
          - entities.Association.fields.temp_code_daily_limit
          - entities.Association.fields.removal_grace_days
          - entities.Association.fields.grant_buffer_minutes
          - endpoints["POST /associations"]
        distinguishing_aspect: "POST /associations with only name and jurisdiction_code returns temp_code_daily_limit 3, temp_code_overage_fee_cents 500, removal_grace_days 3, late_removal_daily_fee_cents 1500, late_removal_cap_cents 15000, credential_cap_per_member 2, grant_buffer_minutes 15, recovery_target_pct 95.00, posture OPEN, version 1."
        test_recipe:
          setup: ["Empty database"]
          setup_api_calls: []
          trigger:
            - call: "POST /associations"
              payload: { name: "Cascade Regional Association", jurisdiction_code: "WA-KING" }
              as: AssociationAdmin
              as_user_id: "admin-1"
              captures: { assoc_id: $.data.id }
          assert:
            - "Trigger responds HTTP 201"
            - "Response data.temp_code_daily_limit == 3 and data.temp_code_overage_fee_cents == 500"
            - "Response data.removal_grace_days == 3 and data.late_removal_daily_fee_cents == 1500 and data.late_removal_cap_cents == 15000"
            - "Response data.credential_cap_per_member == 2 and data.grant_buffer_minutes == 15"
            - "Response data.recovery_target_pct == 95.00 and data.posture == \"OPEN\" and data.version == 1"
            - "Response data.lockbox_total_count == 0, data.unplaced_inventory_count == 0, data.recovery_rate_pct == 0.00"

      - name: lockbox_read_back_returns_every_stored_input_field
        claim_type: retrieval
        grounds:
          - entities.Lockbox
          - endpoints["GET /lockboxes/{lockboxId}"]
        distinguishing_aspect: "GET /lockboxes/{id} returns serial_number LB-0001, model LB_PRO, replacement_cost_cents 12000, in_service_since 2025-08-01, status IN_STOCK, assigned_member_id null, current_listing_id null."
        test_recipe:
          setup: ["One association with one freshly intaken lockbox"]
          setup_api_calls:
            - call: "POST /associations"
              payload: { name: "Cascade Regional Association", jurisdiction_code: "WA-KING" }
              as: AssociationAdmin
              as_user_id: "admin-1"
              captures: { assoc_id: $.data.id }
            - call: "POST /lockboxes"
              payload: { association_id: "${assoc_id}", serial_number: "LB-0001", model: "LB_PRO", replacement_cost_cents: 12000, in_service_since: "2025-08-01" }
              as: AssociationAdmin
              as_user_id: "admin-1"
              captures: { box1_id: $.data.id }
          trigger:
            - call: "GET /lockboxes/${box1_id}"
              payload: {}
              as: Member
              as_user_id: "any-member-read"
          assert:
            - "Trigger responds HTTP 200 with response_type == \"object\""
            - "data.serial_number == \"LB-0001\" and data.model == \"LB_PRO\""
            - "data.replacement_cost_cents == 12000 and data.in_service_since == \"2025-08-01\""
            - "data.status == \"IN_STOCK\" and data.assigned_member_id == null and data.current_listing_id == null"
            - "data.loss_type == null and data.police_report_number == null"

      - name: lockbox_list_pagination_reports_total_count_and_has_more
        claim_type: listing
        grounds:
          - endpoints["GET /lockboxes"]
          - response_envelope.pagination_fields
        distinguishing_aspect: "With three lockboxes in one association, GET /lockboxes?association_id=..&limit=2&offset=0 returns 2 rows with total_count 3 and has_more true; offset=2 returns 1 row with has_more false."
        test_recipe:
          setup: ["One association holding exactly three IN_STOCK lockboxes"]
          setup_api_calls:
            - call: "POST /associations"
              payload: { name: "Cascade Regional Association", jurisdiction_code: "WA-KING" }
              as: AssociationAdmin
              as_user_id: "admin-1"
              captures: { assoc_id: $.data.id }
            - call: "POST /lockboxes"
              payload: { association_id: "${assoc_id}", serial_number: "LB-0001", model: "LB_STD", replacement_cost_cents: 9000, in_service_since: "2025-08-01" }
              as: AssociationAdmin
              as_user_id: "admin-1"
            - call: "POST /lockboxes"
              payload: { association_id: "${assoc_id}", serial_number: "LB-0002", model: "LB_STD", replacement_cost_cents: 9000, in_service_since: "2025-08-01" }
              as: AssociationAdmin
              as_user_id: "admin-1"
            - call: "POST /lockboxes"
              payload: { association_id: "${assoc_id}", serial_number: "LB-0003", model: "LB_STD", replacement_cost_cents: 9000, in_service_since: "2025-08-01" }
              as: AssociationAdmin
              as_user_id: "admin-1"
          trigger:
            - call: "GET /lockboxes?association_id=${assoc_id}&limit=2&offset=0"
              payload: {}
              as: AssociationAdmin
              as_user_id: "admin-1"
            - call: "GET /lockboxes?association_id=${assoc_id}&limit=2&offset=2"
              payload: {}
              as: AssociationAdmin
              as_user_id: "admin-1"
          assert:
            - "First response has response_type == \"array\", 2 rows, total_count == 3, limit == 2, offset == 0, has_more == true"
            - "Second response has 1 row, total_count == 3, offset == 2, has_more == false"

      - name: get_lockbox_with_unknown_id_returns_not_found
        claim_type: not_found
        grounds:
          - errors[ERR_LOCKBOX_NOT_FOUND]
          - validations[priority=10]
        distinguishing_aspect: "A well-formed UUID that matches no lockbox returns HTTP 404 with error_id ERR_LOCKBOX_NOT_FOUND, not 400 and not an empty object."
        test_recipe:
          setup: ["One association exists; no lockbox has the queried id"]
          setup_api_calls:
            - call: "POST /associations"
              payload: { name: "Cascade Regional Association", jurisdiction_code: "WA-KING" }
              as: AssociationAdmin
              as_user_id: "admin-1"
              captures: { assoc_id: $.data.id }
          trigger:
            - call: "GET /lockboxes/00000000-0000-4000-8000-000000000000"
              payload: {}
              as: AssociationAdmin
              as_user_id: "admin-1"
              captures: { err_id: $.data.error_id }
          assert:
            - "Trigger responds HTTP 404 with data.error_id == \"ERR_LOCKBOX_NOT_FOUND\""
            - "Response response_type == \"error\""

      - name: create_member_missing_required_field_invalid_request
        claim_type: required_fields
        grounds:
          - endpoints["POST /members"]
          - errors[ERR_INVALID_REQUEST]
          - validations[priority=20]
        distinguishing_aspect: "POST /members without dues_paid_through returns HTTP 422 ERR_INVALID_REQUEST and creates no Member row."
        test_recipe:
          setup: ["One association exists and holds zero members"]
          setup_api_calls:
            - call: "POST /associations"
              payload: { name: "Cascade Regional Association", jurisdiction_code: "WA-KING" }
              as: AssociationAdmin
              as_user_id: "admin-1"
              captures: { assoc_id: $.data.id }
          trigger:
            - call: "POST /members"
              payload: { association_id: "${assoc_id}", full_name: "Ana Reyes", email: "ana@example.com" }
              as: AssociationAdmin
              as_user_id: "admin-1"
              captures: { err_id: $.data.error_id }
          assert:
            - "Trigger responds HTTP 422 with data.error_id == \"ERR_INVALID_REQUEST\""
            - "GET /members?association_id=${assoc_id} returns 0 rows and total_count == 0"

      - name: member_system_fields_input_ignored_on_create
        claim_type: system_fields
        grounds:
          - entities.Member.fields.membership_status
          - entities.Member.fields.outstanding_balance_cents
          - state_machines.Member.PENDING_to_ACTIVE
        distinguishing_aspect: "membership_status is source: system — supplying membership_status TERMINATED and outstanding_balance_cents 9999 in the create body never reaches the row; the auto-transition still yields ACTIVE with balance 0."
        test_recipe:
          setup: ["One association; the client attempts to seed system fields through POST /members"]
          setup_api_calls:
            - call: "POST /associations"
              payload: { name: "Cascade Regional Association", jurisdiction_code: "WA-KING" }
              as: AssociationAdmin
              as_user_id: "admin-1"
              captures: { assoc_id: $.data.id }
          trigger:
            - call: "POST /members"
              payload: { association_id: "${assoc_id}", full_name: "Ana Reyes", email: "ana@example.com", dues_paid_through: "2027-01-31", membership_status: "TERMINATED", outstanding_balance_cents: 9999 }
              as: AssociationAdmin
              as_user_id: "admin-1"
              captures: { m1_id: $.data.id }
          assert:
            - "Response data.membership_status == \"ACTIVE\" (never TERMINATED)"
            - "Response data.outstanding_balance_cents == 0 and data.active_credential_count == 0"
            - "Response data.version == 1 and data.id is a bare UUID with no type prefix"

      - name: member_created_with_lapsed_dues_auto_expires_at_creation
        claim_type: computed_fields
        grounds:
          - state_machines.Member.PENDING_to_EXPIRED
          - entities.Member.fields.dues_paid_through
        distinguishing_aspect: "With the clock at 2026-08-01T00:00:00Z, a member whose dues_paid_through is 2026-07-31 resolves the PENDING auto-transition to EXPIRED inside the create request, while 2027-01-31 resolves to ACTIVE."
        test_recipe:
          setup: ["Logical clock at its default 2026-08-01T00:00:00Z"]
          setup_api_calls:
            - call: "POST /associations"
              payload: { name: "Cascade Regional Association", jurisdiction_code: "WA-KING" }
              as: AssociationAdmin
              as_user_id: "admin-1"
              captures: { assoc_id: $.data.id }
          trigger:
            - call: "POST /members"
              payload: { association_id: "${assoc_id}", full_name: "Lapsed Larry", email: "larry@example.com", dues_paid_through: "2026-07-31" }
              as: AssociationAdmin
              as_user_id: "admin-1"
              captures: { mL_id: $.data.id }
            - call: "POST /members"
              payload: { association_id: "${assoc_id}", full_name: "Ana Reyes", email: "ana@example.com", dues_paid_through: "2027-01-31" }
              as: AssociationAdmin
              as_user_id: "admin-1"
              captures: { m1_id: $.data.id }
          assert:
            - "GET /members/${mL_id} returns membership_status == \"EXPIRED\" and version == 1"
            - "GET /members/${m1_id} returns membership_status == \"ACTIVE\" and version == 1"

      - name: access_event_is_immutable_and_carries_no_version
        claim_type: immutability
        grounds:
          - entities.AccessEvent
          - endpoints["POST /_devices/access-attempts"]
        distinguishing_aspect: "AccessEvent is declared common_fields: false, so its create response carries id and created_at but no version and no updated_at, and no state endpoint exists for it."
        test_recipe:
          setup: ["One association with an IN_STOCK lockbox; the device posts an attempt against it"]
          setup_api_calls:
            - call: "POST /associations"
              payload: { name: "Cascade Regional Association", jurisdiction_code: "WA-KING" }
              as: AssociationAdmin
              as_user_id: "admin-1"
              captures: { assoc_id: $.data.id }
            - call: "POST /lockboxes"
              payload: { association_id: "${assoc_id}", serial_number: "LB-0001", model: "LB_STD", replacement_cost_cents: 9000, in_service_since: "2025-08-01" }
              as: AssociationAdmin
              as_user_id: "admin-1"
              captures: { box1_id: $.data.id }
          trigger:
            - call: "POST /_devices/access-attempts"
              payload: { lockbox_id: "${box1_id}", actor_type: "UNKNOWN", occurred_at: "2026-08-01T09:00:00Z" }
              as: LockboxDevice
              as_user_id: "device-gw-1"
              captures: { ev_id: $.data.id }
          assert:
            - "Trigger responds HTTP 201 and data contains id and created_at"
            - "Response data has no version field and no updated_at field"
            - "GET /access-events/${ev_id} returns outcome == \"DENIED_NO_CREDENTIAL\" and listing_id == null and matched_appointment_id == null"

      - name: lockbox_invalid_model_enum_returns_invalid_request
        claim_type: type_constraints
        grounds:
          - entities.Lockbox.fields.model
          - errors[ERR_INVALID_REQUEST]
        distinguishing_aspect: "model accepts only LB_STD and LB_PRO; the value LB_ULTRA is rejected with HTTP 422 ERR_INVALID_REQUEST and no lockbox row is created."
        test_recipe:
          setup: ["One association with zero lockboxes"]
          setup_api_calls:
            - call: "POST /associations"
              payload: { name: "Cascade Regional Association", jurisdiction_code: "WA-KING" }
              as: AssociationAdmin
              as_user_id: "admin-1"
              captures: { assoc_id: $.data.id }
          trigger:
            - call: "POST /lockboxes"
              payload: { association_id: "${assoc_id}", serial_number: "LB-0001", model: "LB_ULTRA", replacement_cost_cents: 9000, in_service_since: "2025-08-01" }
              as: AssociationAdmin
              as_user_id: "admin-1"
              captures: { err_id: $.data.error_id }
          assert:
            - "Trigger responds HTTP 422 with data.error_id == \"ERR_INVALID_REQUEST\""
            - "GET /lockboxes?association_id=${assoc_id} returns 0 rows"

      - name: placement_with_unknown_listing_id_returns_not_found
        claim_type: parent_relationships
        grounds:
          - entities.LockboxPlacement.fields.listing_id
          - validations[priority=15]
          - errors[ERR_LISTING_NOT_FOUND]
        distinguishing_aspect: "Flat topology FK integrity: POST /lockbox-placements with a listing_id that resolves to nothing returns HTTP 404 ERR_LISTING_NOT_FOUND and leaves the lockbox in ASSIGNED."
        test_recipe:
          setup: ["LB-0001 is ASSIGNED to Ana; the referenced listing id does not exist"]
          setup_api_calls:
            - call: "POST /associations"
              payload: { name: "Cascade Regional Association", jurisdiction_code: "WA-KING" }
              as: AssociationAdmin
              as_user_id: "admin-1"
              captures: { assoc_id: $.data.id }
            - call: "POST /members"
              payload: { association_id: "${assoc_id}", full_name: "Ana Reyes", email: "ana@example.com", dues_paid_through: "2027-01-31" }
              as: AssociationAdmin
              as_user_id: "admin-1"
              captures: { m1_id: $.data.id }
            - call: "POST /lockboxes"
              payload: { association_id: "${assoc_id}", serial_number: "LB-0001", model: "LB_PRO", replacement_cost_cents: 12000, in_service_since: "2025-08-01" }
              as: AssociationAdmin
              as_user_id: "admin-1"
              captures: { box1_id: $.data.id, box1_v: $.data.version }
            - call: "POST /lockboxes/${box1_id}/state"
              payload: { action: "ASSIGN", member_id: "${m1_id}", expected_lockbox_version: "${box1_v}" }
              as: AssociationAdmin
              as_user_id: "admin-1"
          trigger:
            - call: "POST /lockbox-placements"
              payload: { lockbox_id: "${box1_id}", listing_id: "00000000-0000-4000-8000-000000000000" }
              as: Member
              as_user_id: "${m1_id}"
              captures: { err_id: $.data.error_id }
          assert:
            - "Trigger responds HTTP 404 with data.error_id == \"ERR_LISTING_NOT_FOUND\""
            - "GET /lockboxes/${box1_id} returns status == \"ASSIGNED\" and current_listing_id == null"
            - "GET /lockbox-placements?lockbox_id=${box1_id} returns 0 rows"

      - name: duplicate_serial_number_within_association_rejected
        claim_type: type_constraints
        grounds:
          - validations[priority=65]
          - errors[ERR_DUPLICATE_SERIAL]
        distinguishing_aspect: "Two lockboxes with serial_number LB-0001 in the same association: the second returns HTTP 409 ERR_DUPLICATE_SERIAL, while the same serial in a different association is accepted."
        test_recipe:
          setup: ["Two associations; association A already holds LB-0001"]
          setup_api_calls:
            - call: "POST /associations"
              payload: { name: "Cascade Regional Association", jurisdiction_code: "WA-KING" }
              as: AssociationAdmin
              as_user_id: "admin-1"
              captures: { assocA_id: $.data.id }
            - call: "POST /associations"
              payload: { name: "Puget Sound Association", jurisdiction_code: "WA-PIERCE" }
              as: AssociationAdmin
              as_user_id: "admin-1"
              captures: { assocB_id: $.data.id }
            - call: "POST /lockboxes"
              payload: { association_id: "${assocA_id}", serial_number: "LB-0001", model: "LB_STD", replacement_cost_cents: 9000, in_service_since: "2025-08-01" }
              as: AssociationAdmin
              as_user_id: "admin-1"
          trigger:
            - call: "POST /lockboxes"
              payload: { association_id: "${assocA_id}", serial_number: "LB-0001", model: "LB_STD", replacement_cost_cents: 9000, in_service_since: "2025-08-01" }
              as: AssociationAdmin
              as_user_id: "admin-1"
              captures: { err_id: $.data.error_id }
            - call: "POST /lockboxes"
              payload: { association_id: "${assocB_id}", serial_number: "LB-0001", model: "LB_STD", replacement_cost_cents: 9000, in_service_since: "2025-08-01" }
              as: AssociationAdmin
              as_user_id: "admin-1"
          assert:
            - "First trigger responds HTTP 409 with data.error_id == \"ERR_DUPLICATE_SERIAL\""
            - "Second trigger responds HTTP 201"
            - "GET /lockboxes?association_id=${assocA_id} returns exactly 1 row"
            - "GET /lockboxes?association_id=${assocB_id} returns exactly 1 row"

  - section: state_machines
    instances:
      - name: lockbox_starts_in_stock_and_first_assign_is_the_only_legal_move
        claim_type: initial_state
        grounds:
          - state_machines.Lockbox.IN_STOCK_to_ASSIGNED
          - entities.Lockbox.fields.status
        distinguishing_aspect: "A newly intaken lockbox is IN_STOCK with version 1; a REMOVE-style placement cannot be created for it because POST /lockbox-placements requires ASSIGNED, so the create returns ERR_INVALID_STATE."
        test_recipe:
          setup: ["One association with LB-0001 IN_STOCK (never assigned) and one ACTIVE listing"]
          setup_api_calls:
            - call: "POST /associations"
              payload: { name: "Cascade Regional Association", jurisdiction_code: "WA-KING" }
              as: AssociationAdmin
              as_user_id: "admin-1"
              captures: { assoc_id: $.data.id }
            - call: "POST /members"
              payload: { association_id: "${assoc_id}", full_name: "Ana Reyes", email: "ana@example.com", dues_paid_through: "2027-01-31" }
              as: AssociationAdmin
              as_user_id: "admin-1"
              captures: { m1_id: $.data.id }
            - call: "POST /lockboxes"
              payload: { association_id: "${assoc_id}", serial_number: "LB-0001", model: "LB_STD", replacement_cost_cents: 9000, in_service_since: "2025-08-01" }
              as: AssociationAdmin
              as_user_id: "admin-1"
              captures: { box1_id: $.data.id }
            - call: "POST /listings"
              payload: { association_id: "${assoc_id}", listing_agent_id: "${m1_id}", address_line: "12 Pine St", mls_number: "MLS-1001" }
              as: Member
              as_user_id: "${m1_id}"
              captures: { lst1_id: $.data.id }
          trigger:
            - call: "POST /lockbox-placements"
              payload: { lockbox_id: "${box1_id}", listing_id: "${lst1_id}" }
              as: Member
              as_user_id: "${m1_id}"
              captures: { err_id: $.data.error_id }
          assert:
            - "GET /lockboxes/${box1_id} returns status == \"IN_STOCK\" and version == 1"
            - "Trigger responds HTTP 409 with data.error_id == \"ERR_INVALID_STATE\""
            - "GET /lockbox-placements?lockbox_id=${box1_id} returns 0 rows"

      - name: retired_lockbox_terminal_lockdown_rejects_assign
        claim_type: terminal_state_lockdown
        grounds:
          - state_machines.Lockbox.IN_STOCK_to_RETIRED
          - validations[priority=45]
          - errors[ERR_ENTITY_TERMINAL]
        distinguishing_aspect: "RETIRED is the Lockbox machine's only terminal state; an ASSIGN against a RETIRED unit returns HTTP 409 ERR_ENTITY_TERMINAL and leaves status RETIRED."
        test_recipe:
          setup: ["LB-0001 has been retired straight from IN_STOCK; Ana is ACTIVE with zero balance"]
          setup_api_calls:
            - call: "POST /associations"
              payload: { name: "Cascade Regional Association", jurisdiction_code: "WA-KING" }
              as: AssociationAdmin
              as_user_id: "admin-1"
              captures: { assoc_id: $.data.id }
            - call: "POST /members"
              payload: { association_id: "${assoc_id}", full_name: "Ana Reyes", email: "ana@example.com", dues_paid_through: "2027-01-31" }
              as: AssociationAdmin
              as_user_id: "admin-1"
              captures: { m1_id: $.data.id }
            - call: "POST /lockboxes"
              payload: { association_id: "${assoc_id}", serial_number: "LB-0001", model: "LB_STD", replacement_cost_cents: 9000, in_service_since: "2025-08-01" }
              as: AssociationAdmin
              as_user_id: "admin-1"
              captures: { box1_id: $.data.id, box1_v: $.data.version }
            - call: "POST /lockboxes/${box1_id}/state"
              payload: { action: "RETIRE", expected_lockbox_version: "${box1_v}" }
              as: AssociationAdmin
              as_user_id: "admin-1"
              captures: { box1_v2: $.data.version }
          trigger:
            - call: "POST /lockboxes/${box1_id}/state"
              payload: { action: "ASSIGN", member_id: "${m1_id}", expected_lockbox_version: "${box1_v2}" }
              as: AssociationAdmin
              as_user_id: "admin-1"
              captures: { err_id: $.data.error_id }
          assert:
            - "Trigger responds HTTP 409 with data.error_id == \"ERR_ENTITY_TERMINAL\""
            - "GET /lockboxes/${box1_id} returns status == \"RETIRED\" and assigned_member_id == null"
            - "GET /associations/${assoc_id} returns lockbox_total_count == 0 and unplaced_inventory_count == 0"

      - name: showing_cancel_twice_second_attempt_rejected
        claim_type: idempotency
        grounds:
          - state_machines.ShowingAppointment.REQUESTED_to_CANCELLED
          - validations[priority=45]
          - errors[ERR_ENTITY_TERMINAL]
        distinguishing_aspect: "CANCELLED is terminal for ShowingAppointment: the first CANCEL returns 200 with cancel_reason AGENT_CANCELLED, the second returns HTTP 409 ERR_ENTITY_TERMINAL and does not bump version again."
        test_recipe:
          setup: ["Ana owns MLS-1001; a REQUESTED showing for Ana sits on it"]
          setup_api_calls:
            - call: "POST /associations"
              payload: { name: "Cascade Regional Association", jurisdiction_code: "WA-KING" }
              as: AssociationAdmin
              as_user_id: "admin-1"
              captures: { assoc_id: $.data.id }
            - call: "POST /members"
              payload: { association_id: "${assoc_id}", full_name: "Ana Reyes", email: "ana@example.com", dues_paid_through: "2027-01-31" }
              as: AssociationAdmin
              as_user_id: "admin-1"
              captures: { m1_id: $.data.id }
            - call: "POST /listings"
              payload: { association_id: "${assoc_id}", listing_agent_id: "${m1_id}", address_line: "12 Pine St", mls_number: "MLS-1001" }
              as: Member
              as_user_id: "${m1_id}"
              captures: { lst1_id: $.data.id }
            - call: "POST /showing-appointments"
              payload: { listing_id: "${lst1_id}", showing_member_id: "${m1_id}", window_start: "2026-08-07T10:00:00Z", window_end: "2026-08-07T11:00:00Z" }
              as: Member
              as_user_id: "${m1_id}"
              captures: { a1_id: $.data.id, a1_v: $.data.version }
            - call: "POST /showing-appointments/${a1_id}/state"
              payload: { action: "CANCEL", expected_appointment_version: "${a1_v}" }
              as: Member
              as_user_id: "${m1_id}"
              captures: { a1_v2: $.data.version }
          trigger:
            - call: "POST /showing-appointments/${a1_id}/state"
              payload: { action: "CANCEL", expected_appointment_version: "${a1_v2}" }
              as: Member
              as_user_id: "${m1_id}"
              captures: { err_id: $.data.error_id }
          assert:
            - "Trigger responds HTTP 409 with data.error_id == \"ERR_ENTITY_TERMINAL\""
