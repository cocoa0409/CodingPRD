            - "BuyerMeeting.${meeting_nordic_id}.status is still SCHEDULED and its window is unchanged throughout"

  # ===========================================================================
  - rule_id: boundary_precision_check
    instances:

      - name: buyer_exposure_limit_passes_at_exact_equality_and_fails_one_cent_over
        grounds:
          - validations[priority=100]
          - calculations.buyer_exposure
          - entities.Buyer.fields.exposure_limit_usd
          - entities.Buyer.fields.outstanding_exposure_usd
          - errors.ERR_BUYER_EXPOSURE_EXCEEDED
        distinguishing_aspect: |
          A MONEY boundary at cent resolution on an AGGREGATE: the limit is 1500000.00 and the check
          is `outstanding_exposure_usd + minimum_guarantee_usd <= exposure_limit_usd` with equality
          passing. Three probes pin the edge — exactly at the limit (201), one cent over the limit
          (422), and the limit raised by exactly one cent so the same one-cent offer lands back on
          equality (201). A strict `<` comparison fails probe 1, a rounded-to-dollars comparison
          fails probe 2, and float accumulation fails probe 3.
        test_recipe:
          setup:
            - "Clock at 2026-08-01T00:00:00Z; film IN_MARKET with a PUBLISHED CAST_ADJUSTED DE valuation."
            - "Buyer Rhein Films AAA/ACTIVE with exposure_limit_usd exactly 1500000.00 and no contracts yet, so outstanding_exposure_usd is 0.00."
            - "A second territory FR exists so the follow-up offers do not trip the duplicate-territory rule or the supersede cascade."
          setup_api_calls:
            - call: "POST /film-sales/_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-01T00:00:00Z" }
              as: PlatformAdmin
            - call: "POST /film-sales/films"
              payload: { title: "Northern Lights", genre: "ACTION", production_budget_usd: 24000000.00, principal_cast_score: 88, estimated_delivery_date: "2027-02-28T00:00:00Z", theatrical_release_date: "2027-04-15T00:00:00Z" }
              as: PlatformAdmin
              captures: { film_id: $.data.id }
            - call: "POST /film-sales/territories"
              payload: { code: "DE", name: "Germany", region: "EMEA", market_tier: 1, currency_code: "EUR", base_value_index: 1.20 }
              as: PlatformAdmin
              captures: { terr_de_id: $.data.id }
            - call: "POST /film-sales/territories"
              payload: { code: "FR", name: "France", region: "EMEA", market_tier: 1, currency_code: "EUR", base_value_index: 1.00 }
              as: PlatformAdmin
              captures: { terr_fr_id: $.data.id }
            - call: "POST /film-sales/territories/${terr_de_id}/comparable-titles"
              payload: { name: "Comp Alpha", genre: "ACTION", cast_score: 80, gross_license_fee_usd: 800000.00, release_year: 2022, verified: true }
              as: PlatformAdmin
            - call: "POST /film-sales/territories/${terr_de_id}/comparable-titles"
              payload: { name: "Comp Beta", genre: "ACTION", cast_score: 74, gross_license_fee_usd: 1000000.00, release_year: 2023, verified: true }
              as: PlatformAdmin
            - call: "POST /film-sales/territories/${terr_de_id}/comparable-titles"
              payload: { name: "Comp Gamma", genre: "ACTION", cast_score: 91, gross_license_fee_usd: 1200000.00, release_year: 2021, verified: true }
              as: PlatformAdmin
            - call: "POST /film-sales/territories/${terr_de_id}/buyers"
              payload: { company_name: "Rhein Films", credit_rating: "AAA", exposure_limit_usd: 1500000.00, status: "ACTIVE" }
              as: PlatformAdmin
              captures: { buyer_de_id: $.data.id }
            - call: "POST /film-sales/films/${film_id}/agency-agreements"
              payload: { commission_pct: 0.10, expense_cap_usd: 75000.00, term_months: 24, term_start_date: "2026-08-01T00:00:00Z" }
              as: HeadOfSales
              captures: { agr_id: $.data.id }
            - call: "POST /film-sales/agency-agreements/${agr_id}/state"
              payload: { to_status: "EXECUTED" }
              as: HeadOfSales
              as_user_id: "hos-signer-1"
            - call: "POST /film-sales/films/${film_id}/state"
              payload: { to_status: "PACKAGING" }
              as: PlatformAdmin
            - call: "POST /film-sales/territory-valuations"
              payload: { film_id: "${film_id}", territory_id: "${terr_de_id}", method: "CAST_ADJUSTED" }
              as: SalesAgent
              captures: { val_de_id: $.data.id }
            - call: "GET /film-sales/films/${film_id}"
              payload: {}
              as: HeadOfSales
              captures: { film_v1: $.data.version }
            - call: "POST /film-sales/territory-valuations/${val_de_id}/publish"
              payload: { expected_film_version: "${film_v1}" }
              as: HeadOfSales
              as_user_id: "hos-valuer-1"
            - call: "POST /film-sales/films/${film_id}/state"
              payload: { to_status: "IN_MARKET" }
              as: HeadOfSales
            - call: "GET /film-sales/buyers/${buyer_de_id}"
              payload: {}
              as: SalesAgent
              captures: { buyer_v1: $.data.version }
          trigger:
            - call: "POST /film-sales/pre-sale-contracts"
              payload: { film_id: "${film_id}", buyer_id: "${buyer_de_id}", territory_id: "${terr_de_id}", minimum_guarantee_usd: 1500000.00, license_term_months: 24, holdback_days: 60, expected_buyer_version: "${buyer_v1}" }
              as: SalesAgent
              captures: { contract_de_id: $.data.id }
            - call: "GET /film-sales/buyers/${buyer_de_id}"
              payload: {}
              as: SalesAgent
              captures: { buyer_v2: $.data.version, exposure_at_limit: $.data.outstanding_exposure_usd }
            - call: "POST /film-sales/pre-sale-contracts"
              payload: { film_id: "${film_id}", buyer_id: "${buyer_de_id}", territory_id: "${terr_fr_id}", minimum_guarantee_usd: 0.01, license_term_months: 24, holdback_days: 60, expected_buyer_version: "${buyer_v2}" }
              as: SalesAgent
            - call: "PATCH /film-sales/buyers/${buyer_de_id}"
              payload: { exposure_limit_usd: 1500000.01 }
              as: PlatformAdmin
            - call: "GET /film-sales/buyers/${buyer_de_id}"
              payload: {}
              as: SalesAgent
              captures: { buyer_v3: $.data.version }
            - call: "POST /film-sales/pre-sale-contracts"
              payload: { film_id: "${film_id}", buyer_id: "${buyer_de_id}", territory_id: "${terr_fr_id}", minimum_guarantee_usd: 0.01, license_term_months: 24, holdback_days: 60, expected_buyer_version: "${buyer_v3}" }
              as: SalesAgent
              captures: { contract_fr_id: $.data.id }
          assert:
            - "probe 1 (0.00 + 1500000.00 == 1500000.00, exactly at the limit) → 201; PreSaleContract.${contract_de_id}.negotiation_status == OFFERED"
            - "${exposure_at_limit} == 1500000.00"
            - "probe 2 (1500000.00 + 0.01 > 1500000.00, one cent over) → 422 with error_id ERR_BUYER_EXPOSURE_EXCEEDED and no contract row created"
            - "probe 3 (limit raised to 1500000.01, so 1500000.00 + 0.01 == 1500000.01) → 201; PreSaleContract.${contract_fr_id}.negotiation_status == OFFERED"
            - "after probe 3: Buyer.${buyer_de_id}.outstanding_exposure_usd == 1500000.01 — cents accumulate exactly, with no drift"
            - "after probe 3: Buyer.${buyer_de_id}.net_unpaid_exposure_usd == 0.00 because neither contract is EXECUTED"

      - name: comparable_sample_boundary_at_min_sample_and_at_the_lookback_year_edge
        grounds:
          - calculations.territory_value_estimate.constants.MIN_COMP_SAMPLE
          - calculations.territory_value_estimate.constants.COMP_LOOKBACK_YEARS
          - entities.ComparableTitle.fields.release_year
          - entities.ComparableTitle.fields.verified
          - validations[priority=91]
          - validations[priority=92]
        distinguishing_aspect: |
          A COUNT-and-CALENDAR boundary rather than a money boundary: the sample must reach
          MIN_COMP_SAMPLE 3 and only comps with release_year >= 2026 - 7 == 2019 count. Five probes
          walk the edge — zero comps (ERR_NO_COMPARABLE_TITLES, a different error from a short
          sample), two comps (ERR_INSUFFICIENT_COMP_SAMPLE), a third comp dated 2018 that is one
          year outside the window (still ERR_INSUFFICIENT_COMP_SAMPLE), an unverified 2023 comp that
          is inside the window but excluded (still ERR_INSUFFICIENT_COMP_SAMPLE), and finally a
          verified comp dated exactly 2019 which is inside the inclusive edge and yields
          comp_median_usd 1000000.00. The two excluded rows also prove the median is taken over the
          filtered set: including the 5000000.00 or 4000000.00 rows would move it.
        test_recipe:
          setup:
            - "Clock at 2026-08-01T00:00:00Z, so the lookback edge is release_year >= 2019."
            - "One ACTION film with principal_cast_score 88 and territory FR with base_value_index 1.00."
            - "Territory FR starts with no comparable titles at all."
            - "MIN_COMP_SAMPLE is 3 and COMP_LOOKBACK_YEARS is 7."
          setup_api_calls:
            - call: "POST /film-sales/_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-01T00:00:00Z" }
              as: PlatformAdmin
            - call: "POST /film-sales/films"
              payload: { title: "Northern Lights", genre: "ACTION", production_budget_usd: 24000000.00, principal_cast_score: 88, estimated_delivery_date: "2027-02-28T00:00:00Z", theatrical_release_date: "2027-04-15T00:00:00Z" }
              as: PlatformAdmin
              captures: { film_id: $.data.id }
            - call: "POST /film-sales/territories"
              payload: { code: "FR", name: "France", region: "EMEA", market_tier: 1, currency_code: "EUR", base_value_index: 1.00 }
              as: PlatformAdmin
              captures: { terr_fr_id: $.data.id }
          trigger:
            - call: "POST /film-sales/territory-valuations"
              payload: { film_id: "${film_id}", territory_id: "${terr_fr_id}", method: "CAST_ADJUSTED" }
              as: SalesAgent
            - call: "POST /film-sales/territories/${terr_fr_id}/comparable-titles"
              payload: { name: "FR Comp One", genre: "ACTION", cast_score: 70, gross_license_fee_usd: 900000.00, release_year: 2021, verified: true }
              as: PlatformAdmin
            - call: "POST /film-sales/territories/${terr_fr_id}/comparable-titles"
              payload: { name: "FR Comp Two", genre: "ACTION", cast_score: 82, gross_license_fee_usd: 1100000.00, release_year: 2022, verified: true }
              as: PlatformAdmin
            - call: "POST /film-sales/territory-valuations"
              payload: { film_id: "${film_id}", territory_id: "${terr_fr_id}", method: "CAST_ADJUSTED" }
              as: SalesAgent
            - call: "POST /film-sales/territories/${terr_fr_id}/comparable-titles"
              payload: { name: "FR Comp Stale", genre: "ACTION", cast_score: 90, gross_license_fee_usd: 5000000.00, release_year: 2018, verified: true }
              as: PlatformAdmin
            - call: "POST /film-sales/territory-valuations"
              payload: { film_id: "${film_id}", territory_id: "${terr_fr_id}", method: "CAST_ADJUSTED" }
              as: SalesAgent
            - call: "POST /film-sales/territories/${terr_fr_id}/comparable-titles"
              payload: { name: "FR Comp Unverified", genre: "ACTION", cast_score: 88, gross_license_fee_usd: 4000000.00, release_year: 2023, verified: false }
              as: PlatformAdmin
            - call: "POST /film-sales/territory-valuations"
              payload: { film_id: "${film_id}", territory_id: "${terr_fr_id}", method: "CAST_ADJUSTED" }
              as: SalesAgent
            - call: "POST /film-sales/territories/${terr_fr_id}/comparable-titles"
              payload: { name: "FR Comp Edge", genre: "ACTION", cast_score: 76, gross_license_fee_usd: 1000000.00, release_year: 2019, verified: true }
              as: PlatformAdmin
            - call: "POST /film-sales/territory-valuations"
              payload: { film_id: "${film_id}", territory_id: "${terr_fr_id}", method: "CAST_ADJUSTED" }
              as: SalesAgent
              captures: { val_fr_id: $.data.id }
          assert:
            - "probe 1 (0 comps) → 422 with error_id ERR_NO_COMPARABLE_TITLES, not ERR_INSUFFICIENT_COMP_SAMPLE"
            - "probe 2 (2 verified in-window comps) → 422 with error_id ERR_INSUFFICIENT_COMP_SAMPLE"
            - "probe 3 (third comp released 2018, one year outside the inclusive 2019 edge) → 422 with error_id ERR_INSUFFICIENT_COMP_SAMPLE"
            - "probe 4 (fourth comp inside the window but verified == false) → 422 with error_id ERR_INSUFFICIENT_COMP_SAMPLE"
            - "probe 5 (fifth comp released exactly 2019 and verified) → 201"
            - "TerritoryValuation.${val_fr_id}.comp_sample_size == 3 — the 2018 and unverified rows are excluded"
            - "TerritoryValuation.${val_fr_id}.comp_median_usd == 1000000.00 (median of 900000.00, 1000000.00, 1100000.00)"
            - "TerritoryValuation.${val_fr_id}.cast_multiplier == 1.40 and estimate_usd == 1400000.00"
            - "TerritoryValuation.${val_fr_id}.ask_price_usd == 1750000.00 and floor_price_usd == 980000.00"
            - "no TerritoryValuation row exists for (film, FR) after probes 1-4 — the failed probes created nothing"

  # ===========================================================================
  - rule_id: cross_entity_state_dependency
    instances:

      - name: publish_and_offer_depend_on_the_agency_agreement_being_executed_and_in_term
        grounds:
          - validations[priority=70]
          - state_machines.SalesAgencyAgreement.DRAFT_to_EXECUTED
          - entities.SalesAgencyAgreement.fields.status
          - entities.SalesAgencyAgreement.fields.term_start_date
          - entities.SalesAgencyAgreement.fields.term_end_date
          - errors.ERR_AGENCY_AGREEMENT_NOT_IN_FORCE
        distinguishing_aspect: |
          The gating entity is SalesAgencyAgreement and the dependency has TWO facets that must both
          be enforced on operations against other entities: its status must be EXECUTED and the
          logical clock must sit inside [term_start_date, term_end_date). Publishing a valuation is
          refused while the agreement is DRAFT; the very same publish succeeds once the agreement is
          EXECUTED with nothing else changed; and a contract offer is then refused at clock
          2028-08-02 even though the agreement row is still EXECUTED, because the term ended at
          2028-08-01. Status-only checks pass the third probe, which is the falsifier.
        test_recipe:
          setup:
            - "Clock at 2026-08-01T00:00:00Z."
            - "Agreement created with term_start_date 2026-08-01 and term_months 24, left in DRAFT — term_end_date is only stamped on execution and lands at 2028-08-01T00:00:00Z."
            - "A DRAFT CAST_ADJUSTED DE valuation with comp_sample_size 3 already exists, so priority 92 and the publish precondition are satisfied."
            - "Buyer Rhein Films AAA/ACTIVE with exposure_limit_usd 3000000.00."
          setup_api_calls:
            - call: "POST /film-sales/_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-01T00:00:00Z" }
              as: PlatformAdmin
            - call: "POST /film-sales/films"
