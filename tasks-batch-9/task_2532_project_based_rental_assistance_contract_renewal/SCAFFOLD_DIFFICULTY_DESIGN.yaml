            - call: "POST /pbra/special-claims/${claim_id}/submit"
              payload: {}
              as: OwnerAgent
              as_user_id: "${owner_id}"
            - call: "POST /pbra/special-claims/${claim_id}/decide"
              payload: { decision: "APPROVE" }
              as: ContractAdministrator
              as_user_id: "ca-reviewer-1"
              captures: { claim_state_before: $.data.state }
          trigger:
            - call: "POST /pbra/special-claims/${claim_id}/pay"
