# =============================================================================
# SCAFFOLD_CORNER_DESIGN.yaml — Blood Bank & Transfusion Service (task 2010)
# §1.9 Coverage Index: breadth over every testable claim in §1.1–§1.7 that
# §1.8 (SCAFFOLD_DIFFICULTY_DESIGN.yaml) does not already cover. Sections and
# claim_type values follow references/claim-extraction-guide.md.
# =============================================================================

scaffold_corner_design:
  # ===========================================================================
  # Section: entities
  # ===========================================================================
  - section: entities
    instances:
      - name: patient_creation_defaults_and_system_fields
        claim_type: creation
        grounds:
          - "entities.Patient"
        distinguishing_aspect: "Minimal create returns 201 with all computed/system defaults applied and caller-supplied computed fields ignored."
        test_recipe:
          setup: ["empty DB; clock at default"]
          setup_api_calls:
            - call: "POST /blood-bank/patients"
              payload: { mrn: "M-1001", full_name: "Alex Doe", date_of_birth: "1980-01-01" }
              as: BloodBankTechnologist
              captures: { pat: $.data.id, pat_v: $.data.version }
          trigger:
            - call: "GET /blood-bank/patients/${pat}"
              as: QualityOfficer
          assert:
            - "Patient.${pat}.special_requirements == [] (default applied)"
            - "current_abo_type == UNKNOWN, current_rh_type == UNKNOWN, antibody_status == UNKNOWN, identified_antibodies == []"
            - "abo_confirmed == false, has_active_type_and_screen == false, active_mtp == false, total_units_transfused == 0"
            - "version == 1; id is a bare UUID (no type prefix); created_at/updated_at present with three fractional digits"
      - name: patient_missing_mrn_returns_invalid_request
        claim_type: required_fields
        grounds:
          - "entities.Patient.fields.mrn"
          - "errors[ERR_INVALID_REQUEST]"
        distinguishing_aspect: "Omitting the required mrn field yields 400 ERR_INVALID_REQUEST."
        test_recipe:
          setup: ["empty DB"]
          setup_api_calls: []
          trigger:
            - call: "POST /blood-bank/patients"
              payload: { full_name: "No Mrn", date_of_birth: "1990-01-01" }
              as: BloodBankTechnologist
              captures: { err: $.data.error_id }
          assert:
            - "response is 400 with error_id == ERR_INVALID_REQUEST"
      - name: unit_received_in_quarantine_with_computed_expiry
        claim_type: computed_fields
        grounds:
          - "entities.BloodUnit.fields.expires_at"
          - "calculations.unit_expiration_at_receive"
        distinguishing_aspect: "An RBC unit collected 2026-08-01T00:00:00Z is created QUARANTINED with expires_at exactly 42 days (1008h) later."
        test_recipe:
          setup: ["clock 2026-08-10T09:00:00Z; supplier + order (RBC O NEG x1) acknowledged"]
          setup_api_calls:
            - call: "POST /blood-bank/_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-10T09:00:00Z" }
              as: BloodBankSupervisor
            - call: "POST /blood-bank/suppliers"
              payload: { name: "SanguiServe", license_number: "LIC-100", default_lead_time_hours: 48 }
              as: BloodBankSupervisor
              captures: { sup_id: $.data.id }
            - call: "POST /blood-bank/supplier-orders"
              payload: { supplier_id: "${sup_id}", is_emergency: false, lines: [{ product_type: "RBC", abo_type: "O", rh_type: "NEG", quantity: 1 }] }
              as: SupplierCoordinator
              captures: { so_id: $.data.id }
            - call: "POST /blood-bank/supplier-orders/${so_id}/submit"
              as: SupplierCoordinator
            - call: "POST /blood-bank/supplier-orders/${so_id}/acknowledge"
              as: SupplierCoordinator
          trigger:
            - call: "POST /blood-bank/supplier-orders/${so_id}/receive"
              payload: { units: [{ unit_number: "U-100", product_type: "RBC", abo_type: "O", rh_type: "NEG", volume_ml: 300, collected_at: "2026-08-01T00:00:00Z", donor_id: "D-500", lot_number: "LOT-1", antigen_negative: [] }] }
              as: SupplierCoordinator
            - call: "GET /blood-bank/blood-units?supplier_order_id=${so_id}&unit_number=U-100"
              as: BloodBankTechnologist
              captures: { u_exp: "$.data[0].expires_at", u_status: "$.data[0].status" }
          assert:
            - "u_status == QUARANTINED (initial state)"
            - "u_exp == 2026-09-12T00:00:00Z (2026-08-01 + 1008h)"
            - "BloodUnit.irradiated == false, cmv_negative == false, washed == false (input defaults)"
      - name: ts_expires_at_computed_72h
        claim_type: computed_fields
        grounds:
          - "entities.TypeAndScreen.fields.expires_at"
        distinguishing_aspect: "expires_at == specimen_collected_at + 72h exactly."
        test_recipe:
          setup: ["clock 2026-08-10T09:00:00Z; patient exists"]
          setup_api_calls:
            - call: "POST /blood-bank/_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-10T09:00:00Z" }
              as: BloodBankSupervisor
            - call: "POST /blood-bank/patients"
              payload: { mrn: "M-1002", full_name: "Bea Doe", date_of_birth: "1985-05-05" }
              as: BloodBankTechnologist
              captures: { pat: $.data.id, pat_v: $.data.version }
          trigger:
            - call: "POST /blood-bank/type-and-screens"
              payload: { patient_id: "${pat}", specimen_collected_at: "2026-08-10T08:00:00Z", expected_patient_version: "${pat_v}" }
              as: BloodBankTechnologist
              as_user_id: "tech-a"
              captures: { ts_exp: $.data.expires_at, ts_status: $.data.status }
          assert:
            - "ts_exp == 2026-08-13T08:00:00Z"
            - "ts_status == COLLECTED (initial state)"
            - "TypeAndScreen.created_at == 2026-08-10T09:00:00Z (logical clock, not wall clock)"
      - name: recall_scope_invalid_returns_400
        claim_type: type_constraints
        grounds:
          - "validations[priority=20]"
          - "errors[ERR_RECALL_SCOPE_INVALID]"
        distinguishing_aspect: "scope_type DONOR without donor_id is a 400 schema-scope error, not a 404."
        test_recipe:
          setup: ["empty DB"]
          setup_api_calls: []
          trigger:
            - call: "POST /blood-bank/recall-cases"
              payload: { scope_type: "DONOR", reason: "missing donor id", disposition: "DESTRUCTION" }
              as: QualityOfficer
              captures: { err: $.data.error_id }
          assert:
            - "response is 400 with error_id == ERR_RECALL_SCOPE_INVALID"
      - name: policy_threshold_order_invalid_returns_400
        claim_type: type_constraints
        grounds:
          - "validations[priority=19]"
          - "errors[ERR_THRESHOLD_ORDER_INVALID]"
        distinguishing_aspect: "watch < shortage violates the threshold ladder even though each value is individually in range."
        test_recipe:
          setup: ["empty DB"]
          setup_api_calls: []
          trigger:
            - call: "POST /blood-bank/par-level-policies"
              payload: { product_type: "RBC", abo_type: "O", rh_type: "NEG", watch_threshold: 1, shortage_threshold: 3, critical_threshold: 2 }
              as: BloodBankSupervisor
              captures: { err: $.data.error_id }
          assert:
            - "response is 400 with error_id == ERR_THRESHOLD_ORDER_INVALID"
      - name: cooler_checkout_window_invalid_returns_400
        claim_type: type_constraints
        grounds:
          - "validations[priority=16]"
          - "errors[ERR_CHECKOUT_WINDOW_INVALID]"
        distinguishing_aspect: "planned_end equal to planned_start is rejected (zero-length window); the > 12h arm is separate."
        test_recipe:
          setup: ["cooler registered"]
          setup_api_calls:
            - call: "POST /blood-bank/coolers"
              payload: { cooler_tag: "C-9" }
              as: BloodBankSupervisor
              captures: { cool: $.data.id }
          trigger:
            - call: "POST /blood-bank/cooler-checkouts"
              payload: { cooler_id: "${cool}", planned_start: "2026-08-10T10:00:00Z", planned_end: "2026-08-10T10:00:00Z" }
              as: BloodBankTechnologist
              as_user_id: "tech-a"
              captures: { err: $.data.error_id }
            - call: "POST /blood-bank/cooler-checkouts"
              payload: { cooler_id: "${cool}", planned_start: "2026-08-10T10:00:00Z", planned_end: "2026-08-10T22:00:01Z" }
              as: BloodBankTechnologist
              as_user_id: "tech-a"
              captures: { err2: $.data.error_id }
          assert:
            - "zero-length window: 400 ERR_CHECKOUT_WINDOW_INVALID"
            - "12h00m01s window: 400 ERR_CHECKOUT_WINDOW_INVALID (duration must be <= 12h)"
      - name: crossmatch_method_serologic_for_unconfirmed_patient
        claim_type: computed_fields
        grounds:
          - "entities.Crossmatch.fields.method"
        distinguishing_aspect: "A patient with only one specimen (abo_confirmed false) gets SEROLOGIC_AHG, never ELECTRONIC."
        test_recipe:
          setup: ["clock 2026-08-10T09:00:00Z; patient A POS with one ACTIVE T&S; U1 AVAILABLE; order verified"]
          setup_api_calls:
            - call: "POST /blood-bank/_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-10T09:00:00Z" }
              as: BloodBankSupervisor
            - call: "POST /blood-bank/suppliers"
              payload: { name: "SanguiServe", license_number: "LIC-100", default_lead_time_hours: 48 }
              as: BloodBankSupervisor
              captures: { sup_id: $.data.id }
            - call: "POST /blood-bank/supplier-orders"
              payload: { supplier_id: "${sup_id}", is_emergency: false, lines: [{ product_type: "RBC", abo_type: "O", rh_type: "NEG", quantity: 1 }] }
              as: SupplierCoordinator
              captures: { so_id: $.data.id }
            - call: "POST /blood-bank/supplier-orders/${so_id}/submit"
              as: SupplierCoordinator
            - call: "POST /blood-bank/supplier-orders/${so_id}/acknowledge"
              as: SupplierCoordinator
            - call: "POST /blood-bank/supplier-orders/${so_id}/receive"
              payload: { units: [{ unit_number: "U-100", product_type: "RBC", abo_type: "O", rh_type: "NEG", volume_ml: 300, collected_at: "2026-08-01T00:00:00Z", donor_id: "D-500", lot_number: "LOT-1", antigen_negative: [] }] }
              as: SupplierCoordinator
            - call: "GET /blood-bank/blood-units?supplier_order_id=${so_id}&unit_number=U-100"
              as: BloodBankTechnologist
              captures: { u1: "$.data[0].id" }
            - call: "POST /blood-bank/blood-units/${u1}/release-from-quarantine"
              as: BloodBankTechnologist
            - call: "POST /blood-bank/patients"
              payload: { mrn: "M-1003", full_name: "Cory Doe", date_of_birth: "1991-01-01" }
              as: BloodBankTechnologist
              captures: { pat: $.data.id, pat_v: $.data.version }
            - call: "POST /blood-bank/type-and-screens"
              payload: { patient_id: "${pat}", specimen_collected_at: "2026-08-10T08:00:00Z", expected_patient_version: "${pat_v}" }
              as: BloodBankTechnologist
              as_user_id: "tech-a"
              captures: { ts: $.data.id }
            - call: "POST /blood-bank/type-and-screens/${ts}/result"
              payload: { abo_result: "A", rh_result: "POS", antibody_screen: "NEGATIVE", antibody_identifications: [] }
              as: BloodBankTechnologist
              as_user_id: "tech-a"
            - call: "POST /blood-bank/type-and-screens/${ts}/validate"
              as: BloodBankTechnologist
              as_user_id: "tech-b"
            - call: "POST /blood-bank/transfusion-orders"
              payload: { patient_id: "${pat}", product_type: "RBC", units_requested: 1, urgency: "ROUTINE", indication_code: "ANEMIA" }
              as: OrderingPhysician
              as_user_id: "doc-1"
              captures: { ord: $.data.id }
            - call: "POST /blood-bank/transfusion-orders/${ord}/verify"
              as: BloodBankTechnologist
              as_user_id: "tech-a"
          trigger:
            - call: "POST /blood-bank/crossmatches"
              payload: { order_id: "${ord}", unit_id: "${u1}" }
              as: BloodBankTechnologist
              as_user_id: "tech-a"
              captures: { xm_method: $.data.method, xm_auto: $.data.auto_selected }
          assert:
            - "xm_method == SEROLOGIC_AHG (patient not abo_confirmed)"
            - "xm_auto == false (explicit unit_id supplied)"
      - name: crossmatch_method_electronic_when_abo_confirmed
        claim_type: computed_fields
        grounds:
          - "entities.Crossmatch.fields.method"
          - "calculations.abo_confirmation_latch"
        distinguishing_aspect: "Two distinct specimens with the same ABO result latch abo_confirmed, supersede the first T&S, and switch the crossmatch method to ELECTRONIC."
        test_recipe:
          setup: ["clock 2026-08-10T09:00:00Z; U1 AVAILABLE; patient with T&S#1 ACTIVE (A POS, screen NEGATIVE)"]
          setup_api_calls:
            - call: "POST /blood-bank/_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-10T09:00:00Z" }
              as: BloodBankSupervisor
            - call: "POST /blood-bank/suppliers"
              payload: { name: "SanguiServe", license_number: "LIC-100", default_lead_time_hours: 48 }
              as: BloodBankSupervisor
              captures: { sup_id: $.data.id }
            - call: "POST /blood-bank/supplier-orders"
              payload: { supplier_id: "${sup_id}", is_emergency: false, lines: [{ product_type: "RBC", abo_type: "O", rh_type: "NEG", quantity: 1 }] }
              as: SupplierCoordinator
              captures: { so_id: $.data.id }
            - call: "POST /blood-bank/supplier-orders/${so_id}/submit"
              as: SupplierCoordinator
            - call: "POST /blood-bank/supplier-orders/${so_id}/acknowledge"
              as: SupplierCoordinator
            - call: "POST /blood-bank/supplier-orders/${so_id}/receive"
              payload: { units: [{ unit_number: "U-100", product_type: "RBC", abo_type: "O", rh_type: "NEG", volume_ml: 300, collected_at: "2026-08-01T00:00:00Z", donor_id: "D-500", lot_number: "LOT-1", antigen_negative: [] }] }
              as: SupplierCoordinator
            - call: "GET /blood-bank/blood-units?supplier_order_id=${so_id}&unit_number=U-100"
              as: BloodBankTechnologist
              captures: { u1: "$.data[0].id" }
            - call: "POST /blood-bank/blood-units/${u1}/release-from-quarantine"
              as: BloodBankTechnologist
            - call: "POST /blood-bank/patients"
              payload: { mrn: "M-1004", full_name: "Dana Doe", date_of_birth: "1976-06-06" }
              as: BloodBankTechnologist
              captures: { pat: $.data.id, pat_v: $.data.version }
            - call: "POST /blood-bank/type-and-screens"
              payload: { patient_id: "${pat}", specimen_collected_at: "2026-08-09T08:00:00Z", expected_patient_version: "${pat_v}" }
              as: BloodBankTechnologist
              as_user_id: "tech-a"
              captures: { ts1: $.data.id }
            - call: "POST /blood-bank/type-and-screens/${ts1}/result"
              payload: { abo_result: "A", rh_result: "POS", antibody_screen: "NEGATIVE", antibody_identifications: [] }
              as: BloodBankTechnologist
              as_user_id: "tech-a"
            - call: "POST /blood-bank/type-and-screens/${ts1}/validate"
              as: BloodBankTechnologist
              as_user_id: "tech-b"
            - call: "GET /blood-bank/patients/${pat}"
              as: BloodBankTechnologist
              captures: { pat_v2: $.data.version }
            - call: "POST /blood-bank/type-and-screens"
              payload: { patient_id: "${pat}", specimen_collected_at: "2026-08-10T08:00:00Z", expected_patient_version: "${pat_v2}" }
              as: BloodBankTechnologist
              as_user_id: "tech-a"
              captures: { ts2: $.data.id }
            - call: "POST /blood-bank/type-and-screens/${ts2}/result"
              payload: { abo_result: "A", rh_result: "POS", antibody_screen: "NEGATIVE", antibody_identifications: [] }
              as: BloodBankTechnologist
              as_user_id: "tech-a"
            - call: "POST /blood-bank/type-and-screens/${ts2}/validate"
              as: BloodBankTechnologist
              as_user_id: "tech-b"
            - call: "POST /blood-bank/transfusion-orders"
              payload: { patient_id: "${pat}", product_type: "RBC", units_requested: 1, urgency: "ROUTINE", indication_code: "ANEMIA" }
              as: OrderingPhysician
              as_user_id: "doc-1"
              captures: { ord: $.data.id }
            - call: "POST /blood-bank/transfusion-orders/${ord}/verify"
              as: BloodBankTechnologist
              as_user_id: "tech-a"
          trigger:
            - call: "POST /blood-bank/crossmatches"
              payload: { order_id: "${ord}", unit_id: "${u1}" }
              as: BloodBankTechnologist
              as_user_id: "tech-a"
              captures: { xm_method: $.data.method }
            - call: "GET /blood-bank/type-and-screens/${ts1}"
              as: BloodBankTechnologist
              captures: { ts1_status: $.data.status }
          assert:
            - "Patient.${pat}.abo_confirmed == true (two distinct specimens, same ABO)"
            - "ts1_status == SUPERSEDED after T&S#2 validated"
            - "xm_method == ELECTRONIC (abo_confirmed AND screen NEGATIVE)"
      - name: wastage_record_immutable_event_shape
        claim_type: immutability
        grounds:
          - "entities.WastageRecord"
        distinguishing_aspect: "common_fields: false — a wastage record exposes id and created_at but no version/updated_at, and no update endpoint exists."
        test_recipe:
          setup: ["clock 2026-08-10T09:00:00Z; one unit manually discarded"]
          setup_api_calls:
            - call: "POST /blood-bank/_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-10T09:00:00Z" }
              as: BloodBankSupervisor
            - call: "POST /blood-bank/suppliers"
              payload: { name: "SanguiServe", license_number: "LIC-100", default_lead_time_hours: 48 }
              as: BloodBankSupervisor
              captures: { sup_id: $.data.id }
            - call: "POST /blood-bank/supplier-orders"
              payload: { supplier_id: "${sup_id}", is_emergency: false, lines: [{ product_type: "RBC", abo_type: "O", rh_type: "NEG", quantity: 1 }] }
              as: SupplierCoordinator
              captures: { so_id: $.data.id }
            - call: "POST /blood-bank/supplier-orders/${so_id}/submit"
              as: SupplierCoordinator
            - call: "POST /blood-bank/supplier-orders/${so_id}/acknowledge"
              as: SupplierCoordinator
            - call: "POST /blood-bank/supplier-orders/${so_id}/receive"
              payload: { units: [{ unit_number: "U-100", product_type: "RBC", abo_type: "O", rh_type: "NEG", volume_ml: 300, collected_at: "2026-08-01T00:00:00Z", donor_id: "D-500", lot_number: "LOT-1", antigen_negative: [] }] }
              as: SupplierCoordinator
            - call: "GET /blood-bank/blood-units?supplier_order_id=${so_id}&unit_number=U-100"
              as: BloodBankTechnologist
              captures: { u1: "$.data[0].id" }
            - call: "POST /blood-bank/blood-units/${u1}/discard"
              payload: { note: "damaged" }
              as: BloodBankSupervisor
              as_user_id: "sup-1"
          trigger:
            - call: "GET /blood-bank/wastage-records?unit_id=${u1}"
              as: QualityOfficer
              captures: { w_id: "$.data[0].id" }
            - call: "GET /blood-bank/wastage-records/${w_id}"
              as: QualityOfficer
          assert:
            - "WastageRecord.${w_id} has id and created_at but NO version and NO updated_at key"
            - "reason == MANUAL, quantity_units == 1, recorded_by_user_id == sup-1"

  # ===========================================================================
  # Section: state_machines
  # ===========================================================================
  - section: state_machines
    instances:
      - name: unit_release_from_quarantine_valid
        claim_type: valid_transition
        grounds:
          - "state_machines.BloodUnit.QUARANTINED_to_AVAILABLE"
        distinguishing_aspect: "The happy-path intake transition lands AVAILABLE."
        test_recipe:
          setup: ["clock 2026-08-10T09:00:00Z; one QUARANTINED unit"]
          setup_api_calls:
            - call: "POST /blood-bank/_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-10T09:00:00Z" }
              as: BloodBankSupervisor
            - call: "POST /blood-bank/suppliers"
              payload: { name: "SanguiServe", license_number: "LIC-100", default_lead_time_hours: 48 }
              as: BloodBankSupervisor
              captures: { sup_id: $.data.id }
            - call: "POST /blood-bank/supplier-orders"
              payload: { supplier_id: "${sup_id}", is_emergency: false, lines: [{ product_type: "RBC", abo_type: "O", rh_type: "NEG", quantity: 1 }] }
              as: SupplierCoordinator
              captures: { so_id: $.data.id }
            - call: "POST /blood-bank/supplier-orders/${so_id}/submit"
              as: SupplierCoordinator
            - call: "POST /blood-bank/supplier-orders/${so_id}/acknowledge"
              as: SupplierCoordinator
            - call: "POST /blood-bank/supplier-orders/${so_id}/receive"
              payload: { units: [{ unit_number: "U-100", product_type: "RBC", abo_type: "O", rh_type: "NEG", volume_ml: 300, collected_at: "2026-08-01T00:00:00Z", donor_id: "D-500", lot_number: "LOT-1", antigen_negative: [] }] }
              as: SupplierCoordinator
            - call: "GET /blood-bank/blood-units?supplier_order_id=${so_id}&unit_number=U-100"
              as: BloodBankTechnologist
              captures: { u1: "$.data[0].id" }
          trigger:
            - call: "POST /blood-bank/blood-units/${u1}/release-from-quarantine"
              as: BloodBankTechnologist
              as_user_id: "tech-a"
              captures: { st: $.data.status }
          assert:
            - "st == AVAILABLE and version == 2"
      - name: unit_release_from_available_rejected
        claim_type: invalid_transition
        grounds:
          - "state_machines.BloodUnit.QUARANTINED_to_AVAILABLE"
          - "errors[ERR_UNIT_NOT_RELEASABLE]"
        distinguishing_aspect: "Releasing an already-AVAILABLE unit is an invalid-from rejection with no side effects."
        test_recipe:
          setup: ["clock 2026-08-10T09:00:00Z; one AVAILABLE unit"]
          setup_api_calls:
            - call: "POST /blood-bank/_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-10T09:00:00Z" }
              as: BloodBankSupervisor
            - call: "POST /blood-bank/suppliers"
              payload: { name: "SanguiServe", license_number: "LIC-100", default_lead_time_hours: 48 }
              as: BloodBankSupervisor
              captures: { sup_id: $.data.id }
            - call: "POST /blood-bank/supplier-orders"
              payload: { supplier_id: "${sup_id}", is_emergency: false, lines: [{ product_type: "RBC", abo_type: "O", rh_type: "NEG", quantity: 1 }] }
              as: SupplierCoordinator
              captures: { so_id: $.data.id }
            - call: "POST /blood-bank/supplier-orders/${so_id}/submit"
              as: SupplierCoordinator
            - call: "POST /blood-bank/supplier-orders/${so_id}/acknowledge"
              as: SupplierCoordinator
            - call: "POST /blood-bank/supplier-orders/${so_id}/receive"
              payload: { units: [{ unit_number: "U-100", product_type: "RBC", abo_type: "O", rh_type: "NEG", volume_ml: 300, collected_at: "2026-08-01T00:00:00Z", donor_id: "D-500", lot_number: "LOT-1", antigen_negative: [] }] }
              as: SupplierCoordinator
            - call: "GET /blood-bank/blood-units?supplier_order_id=${so_id}&unit_number=U-100"
              as: BloodBankTechnologist
              captures: { u1: "$.data[0].id" }
            - call: "POST /blood-bank/blood-units/${u1}/release-from-quarantine"
              as: BloodBankTechnologist
              as_user_id: "tech-a"
          trigger:
            - call: "POST /blood-bank/blood-units/${u1}/release-from-quarantine"
