    check: "the right-of-first-refusal window has not lapsed: now <= transaction.rofr_deadline"
    error_id: ERR_ROFR_WINDOW_EXPIRED
    http_status: 409
    applies_to: "POST /iz-compliance/resale-transactions/{resale_transaction_id}/rofr-decision"
