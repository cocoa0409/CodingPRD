      - name: occ_stale_challenge_version_on_evidence_append_rejected
        claim_type: concurrency
        grounds:
          - concurrency_rules.challenge-evidence-append-stale-challenge
          - validations.ERR_STALE_CHALLENGE_VERSION
        distinguishing_aspect: |
          Evidence appends are the only write on an immutable child that still carries an
          expected_<parent>_version, so the second append with the version captured before the first
          one is refused with 412 and, critically, creates no ChallengeEvidence row: the sufficiency
          score stays at the value produced by the single accepted item.
        test_recipe:
          setup:
            - "Program in CHALLENGE_OPEN at clock 2026-08-10T00:00:00Z with location L3 and a COMMUNITY challenge filed by comm-1, whose version is captured as cv1."
          setup_api_calls:
            - call: "POST /broadband/programs"
              payload: { name: "BEAD Round 1", fiscal_year: 2026, total_appropriation_cents: 100000000, challenge_window_start: "2026-08-05T00:00:00Z", challenge_window_end: "2026-09-05T00:00:00Z", application_window_start: "2026-08-05T00:00:00Z", application_window_end: "2026-09-05T00:00:00Z" }
              as: ProgramAdmin
              as_user_id: "admin-1"
              captures: { p_id: $.data.id }
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-08-10T00:00:00Z" }
              as: ProgramAdmin
              as_user_id: "admin-1"
            - call: "POST /broadband/programs/${p_id}/open-challenge-window"
              payload: {}
              as: ProgramAdmin
              as_user_id: "admin-1"
            - call: "POST /broadband/locations"
              payload: { program_id: "${p_id}", address_id: "ADDR-0003", reported_down_mbps: 10, reported_up_mbps: 1, reported_latency_ms: 50, reported_technology: "DSL", reporting_provider_user_id: "prov-2" }
              as: EligibilityAnalyst
              as_user_id: "analyst-1"
              captures: { l3_id: $.data.id }
            - call: "POST /broadband/challenges"
              payload: { program_id: "${p_id}", location_id: "${l3_id}", challenger_type: "COMMUNITY", asserted_classification: "UNSERVED", rationale: "Community filing." }
              as: Challenger
              as_user_id: "comm-1"
              captures: { ch_id: $.data.id, cv1: $.data.version }
          trigger:
            - call: "POST /broadband/challenges/${ch_id}/evidence"
              payload: { evidence_type: "SERVICE_DENIAL_LETTER", collected_at: "2026-06-01T00:00:00Z", description: "First item.", expected_challenge_version: "${cv1}" }
              as: Challenger
              as_user_id: "comm-1"
              captures: { ev1_id: $.data.id }
            - call: "POST /broadband/challenges/${ch_id}/evidence"
              payload: { evidence_type: "SPEED_TEST", collected_at: "2026-07-01T00:00:00Z", description: "Second item with the pre-append version.", expected_challenge_version: "${cv1}" }
              as: Challenger
              as_user_id: "comm-1"
            - call: "GET /broadband/challenges/${ch_id}"
              payload: {}
              as: Challenger
              as_user_id: "comm-1"
              captures: { cv2: $.data.version }
            - call: "POST /broadband/challenges/${ch_id}/evidence"
              payload: { evidence_type: "SPEED_TEST", collected_at: "2026-07-01T00:00:00Z", description: "Second item with the refreshed version.", expected_challenge_version: "${cv2}" }
              as: Challenger
              as_user_id: "comm-1"
          assert:
            - "the first append returns 201 and increments Challenge.version by 1"
            - "the second append with the stale ${cv1} returns ERR_STALE_CHALLENGE_VERSION with HTTP 412 and creates no ChallengeEvidence row"
            - "${cv2} == ${cv1} + 1"
            - "the append with ${cv2} returns 201 and increments Challenge.version by 1"
            - "Challenge.${ch_id}.evidence_count == 2 and evidence_sufficiency_score == 45.00"
            - "ChallengeEvidence.${ev1_id} has no version field, since the entity declares common_fields false"
            - "GET /broadband/challenges/${ch_id}/evidence returns total_count == 2"

      - name: occ_version_increments_on_every_write_and_never_on_reads
        claim_type: concurrency
        grounds:
          - complexity_profile.complexity_layers.optimistic_concurrency
          - entities.GrantProgram.version
          - entities.Application.version
        distinguishing_aspect: |
          The version counters that the two OCC rules compare against must move on every accepted
          write of their own entity - including action endpoints that change only a state field - and
          must never move on reads or on writes to a sibling entity, otherwise a well-behaved client
          would be refused for reasons it cannot observe.
        test_recipe:
          setup:
            - "Program in CHALLENGE_OPEN at clock 2026-08-10T00:00:00Z with one location, a REGISTERED subgrantee and a DRAFT application."
          setup_api_calls:
            - call: "POST /broadband/programs"
              payload: { name: "BEAD Round 1", fiscal_year: 2026, total_appropriation_cents: 100000000, challenge_window_start: "2026-08-05T00:00:00Z", challenge_window_end: "2026-09-05T00:00:00Z", application_window_start: "2026-08-05T00:00:00Z", application_window_end: "2026-09-05T00:00:00Z" }
              as: ProgramAdmin
              as_user_id: "admin-1"
              captures: { p_id: $.data.id, pv0: $.data.version }
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-08-10T00:00:00Z" }
              as: ProgramAdmin
              as_user_id: "admin-1"
            - call: "POST /broadband/locations"
              payload: { program_id: "${p_id}", address_id: "ADDR-0003", reported_down_mbps: 10, reported_up_mbps: 1, reported_latency_ms: 50, reported_technology: "DSL", reporting_provider_user_id: "prov-2" }
              as: EligibilityAnalyst
              as_user_id: "analyst-1"
              captures: { l3_id: $.data.id }
            - call: "POST /broadband/subgrantees"
              payload: { program_id: "${p_id}", legal_name: "Northline Fiber Coop", ein: "81-1234567", net_assets_cents: 900000, requested_amount_cents: 3000000, key_personnel_count: 4, has_prior_federal_award: true }
              as: ProgramAdmin
              as_user_id: "admin-1"
              captures: { s1_id: $.data.id }
            - call: "POST /broadband/applications"
              payload: { program_id: "${p_id}", subgrantee_id: "${s1_id}", match_offer_pct: 25.0, committed_down_mbps: 1000, committed_up_mbps: 1000, committed_latency_ms: 50, low_cost_plan_price_cents: 3000, participates_in_state_affordability_program: true, has_dbe_plan: true, has_union_agreement: false, local_hire_pct: 40, proposed_construction_start: "2026-10-01T00:00:00Z", proposed_construction_end: "2027-10-01T00:00:00Z" }
              as: Subgrantee
              as_user_id: "${s1_id}"
              captures: { a1_id: $.data.id, av0: $.data.version }
          trigger:
            - call: "POST /broadband/programs/${p_id}/open-challenge-window"
              payload: {}
              as: ProgramAdmin
              as_user_id: "admin-1"
              captures: { pv1: $.data.version }
            - call: "GET /broadband/programs/${p_id}"
              payload: {}
              as: ProgramAdmin
              as_user_id: "admin-1"
              captures: { pv2: $.data.version }
            - call: "POST /broadband/location-claims"
              payload: { application_id: "${a1_id}", location_id: "${l3_id}", claimed_cost_cents: 900002 }
              as: Subgrantee
              as_user_id: "${s1_id}"
            - call: "GET /broadband/applications/${a1_id}"
              payload: {}
              as: Subgrantee
              as_user_id: "${s1_id}"
              captures: { av1: $.data.version }
            - call: "POST /broadband/applications/${a1_id}/submit"
              payload: {}
              as: Subgrantee
              as_user_id: "${s1_id}"
              captures: { av2: $.data.version }
            - call: "GET /broadband/programs/${p_id}"
              payload: {}
              as: ProgramAdmin
              as_user_id: "admin-1"
              captures: { pv3: $.data.version }
          assert:
            - "${pv0} == 1 and ${av0} == 1, so every versioned entity starts at 1"
            - "the open-challenge-window action increments GrantProgram.version by 1, so ${pv1} == ${pv0} + 1"
            - "${pv2} == ${pv1}: a GET never increments version"
            - "the claim write increments Application.version by 1, so ${av1} == ${av0} + 1"
            - "the submit action increments Application.version by 1, so ${av2} == ${av1} + 1"
            - "${pv3} == ${pv1}: writes to Application and LocationClaim leave GrantProgram.version untouched even though location_count_total and derived counters were recomputed earlier"
            - "location creation is the sole exception recorded in the scaffold, because it recomputes GrantProgram.location_count_total on the parent row"

      - name: cascading_side_effects_layer_end_to_end
        claim_type: cross_cutting
        grounds:
          - complexity_profile.complexity_layers.cascading_side_effects
        excluded_because:
          difficulty_instance: sustained_challenge_four_hop_rescore_cascade
          rationale: |
            The deepest cascade in the scaffold (challenge SUSTAINED -> location RECLASSIFIED -> claim
            flip and application recount -> score sheet STALE and application RESCORE_REQUIRED ->
            program scoring_posture RESTRICTED) is already asserted hop by hop in §1.8, together with
            the ordering-sensitivity assertion that no hop is skipped when the location carries two
            claims. The audit-failure cascade is covered by audit_failure_three_hop_suspension_cascade.

      - name: dual_variant_calculation_layer_delta
        claim_type: cross_cutting
        grounds:
          - complexity_profile.complexity_layers.dual_variant_calculation
        excluded_because:
          difficulty_instance: milestone_disbursement_pro_rata_vs_cost_reimbursement
          rationale: |
            Variant divergence, variant selection and the reconciliation delta are all asserted in
            §1.8 for the disbursement pair, for the preliminary/final cost-per-location pair
            (application_cost_per_location_preliminary_vs_final) and for the initial/remediation
            capability pair (subgrantee_capability_index_initial_vs_remediation), each with literal
            expected values for both variants.

      - name: rate_threshold_triggers_layer_boundaries
        claim_type: cross_cutting
        grounds:
          - complexity_profile.complexity_layers.rate_threshold_triggers
        excluded_because:
          difficulty_instance: ehcl_threshold_strict_greater_than_edge
          rationale: |
            The cumulative and instantaneous threshold boundaries are covered in §1.8 by the strict
            EHCL edge at 2500000/2500001 cents and by the classification edges in
            location_classification_speed_and_latency_edges, and in §1.9 by
            clawback_penalty_tier_inclusive_upper_edge and
            application_total_score_cost_tier_first_breakpoint.

  - section: consistency model
    instances:
      - name: immediate_visibility_of_obligation_across_four_entities
        claim_type: consistency
        grounds:
          - complexity_profile.consistency_model
          - calculations.program_balance_reconciliation
        distinguishing_aspect: |
          The consistency model is immediate, so a single obligation write must leave no denormalized
          field lagging: the award response already carries the computed obligation, and reads issued
          straight afterwards - with no intervening write and no clock movement - show the program
          balances, the application state, the claim states and the location bindings all consistent
          with it. Any implementation that recomputed balances lazily would pass the award assertion
          and fail the program assertion.
        test_recipe:
          setup:
            - "Canonical two-location award fixture, stopped immediately after POST /broadband/awards."
          setup_api_calls:
            - call: "POST /broadband/programs"
              payload: { name: "BEAD Round 1", fiscal_year: 2026, total_appropriation_cents: 100000000, challenge_window_start: "2026-08-05T00:00:00Z", challenge_window_end: "2026-09-05T00:00:00Z", application_window_start: "2026-08-05T00:00:00Z", application_window_end: "2026-09-05T00:00:00Z" }
