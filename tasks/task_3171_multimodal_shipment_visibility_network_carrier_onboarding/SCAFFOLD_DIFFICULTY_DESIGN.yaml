            - "OpsRun.connections_degraded == 1 and alerts_created == 1"
            - "Shipment.${tc_ship_id}.data_freshness == STALE"
            - "Shipment.${tc_ship_id}.eta_at == \"2026-09-03T03:00:00Z\" (blended value survives suspension; staleness affects CI only)"
            - "Shipment.${tc_ship_id}.eta_confidence_halfwidth_minutes == 211 (round_half_up(120 * (1 + 17/100) * 1.5) = round_half_up(210.6); Q = 83 from the last completed checkpoint)"
            - "exactly one ExceptionAlert on the shipment: alert_type DELAY_RISK, severity HIGH (180 > 2*60), assigned_queue CS_TIER2, status OPEN"

      - name: delay_confirmation_appointment_miss_adherence_chain
        grounds:
          - state_machines.ExceptionAlert.ACKNOWLEDGED_to_RESOLVED
