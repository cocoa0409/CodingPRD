              as: FieldSalesManager
              as_user_id: "u-fsm-1"
              captures: { err_scope: $.data.error_id }
            - call: "POST /incentives/objectives/${obj_a}/protests/${prot_a}/resolve"
              payload: { resolution: "DENIED", expected_objective_version: "${obj_a_v1}" }
              as: FieldSalesManager
              as_user_id: "u-fsm-1"
              captures: { res1_status: $.data.status, res1_by: $.data.resolved_by_user_id, res1_units: $.data.resolved_units }
            - call: "GET /incentives/objectives/${obj_a}"
