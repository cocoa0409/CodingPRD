# §1.9 Scaffold Corner Design (Coverage Index for Non-Difficulty Tests) — Expert
# Breadth probe: walk the claim-extraction guide against SCAFFOLD.yaml §1.1–§1.7 and emit an
# instance per applicable testable claim not already covered by §1.8. `excluded_because:` stubs
# point at the §1.8 instance that already exercises the corner. Negative triggers (names ending
# in *_rejected / *_not_found / *_unauthorized / *_unauthenticated / *_invalid_* / *_cannot_*)
# intentionally violate role/payload/state constraints to verify rejection.
scaffold_corner_design:

  # =========================================================================
  - section: entities
    instances:
      - name: rider_creation_returns_201_with_system_defaults
        claim_type: creation
        grounds:
          - entities.Rider.fields.eligibility_status
          - entities.Rider.fields.account_status
          - entities.Rider.fields.mobility_device
          - entities.Rider.fields.penalty_tier
        distinguishing_aspect: "POST /riders with required fields only returns 201; system/default fields are UNCERTIFIED, ACTIVE, mobility_device NONE, requires_pca false, penalty_tier NONE, version 1."
        test_recipe:
          setup:
            - "Empty DB."
          setup_api_calls: []
          trigger:
            - call: "POST /riders"
              payload: { full_name: "New Rider", phone: "555-1000", email: "new@x.com", home_lat: 40.0, home_lng: -74.0 }
              as: EligibilitySpecialist
              captures: { r_id: "$.data.id" }
          assert:
            - "response.http_status == 201"
            - "Rider.${r_id}.eligibility_status == UNCERTIFIED"
            - "Rider.${r_id}.account_status == ACTIVE"
            - "Rider.${r_id}.mobility_device == NONE"
            - "Rider.${r_id}.requires_pca == false"
            - "Rider.${r_id}.penalty_tier == NONE"
            - "Rider.${r_id}.version == 1"

      - name: rider_missing_required_full_name_returns_invalid_request
        claim_type: required_fields
        grounds:
          - entities.Rider.fields.full_name
          - "errors[ERR_INVALID_REQUEST]"
        distinguishing_aspect: "POST /riders omitting the required full_name field is rejected with ERR_INVALID_REQUEST (400)."
        test_recipe:
          setup:
            - "Empty DB."
          setup_api_calls: []
          trigger:
            - call: "POST /riders"
              payload: { phone: "555-1001", email: "nf@x.com", home_lat: 40.0, home_lng: -74.0 }
              as: EligibilitySpecialist
          assert:
            - "response.error_id == ERR_INVALID_REQUEST"
            - "response.http_status == 400"

      - name: rider_invalid_mobility_device_enum_returns_invalid_request
        claim_type: type_constraints
        grounds:
          - entities.Rider.fields.mobility_device
          - "errors[ERR_INVALID_REQUEST]"
        distinguishing_aspect: "POST /riders with mobility_device not in {NONE,CANE,WALKER,MANUAL_WHEELCHAIR,POWER_WHEELCHAIR,SCOOTER} is ERR_INVALID_REQUEST (400)."
        test_recipe:
          setup:
            - "Empty DB."
          setup_api_calls: []
          trigger:
            - call: "POST /riders"
              payload: { full_name: "Bad Enum", phone: "555-1002", email: "be@x.com", home_lat: 40.0, home_lng: -74.0, mobility_device: "HOVERBOARD" }
              as: EligibilitySpecialist
          assert:
            - "response.error_id == ERR_INVALID_REQUEST"
            - "response.http_status == 400"

      - name: rider_get_nonexistent_returns_rider_not_found
        claim_type: not_found
        grounds:
          - "errors[ERR_RIDER_NOT_FOUND]"
        distinguishing_aspect: "GET /riders/{id} for an unknown UUID returns ERR_RIDER_NOT_FOUND (404)."
        test_recipe:
          setup:
            - "Empty DB."
          setup_api_calls: []
          trigger:
            - call: "GET /riders/00000000-0000-0000-0000-000000000000"
              payload: {}
              as: Admin
          assert:
            - "response.error_id == ERR_RIDER_NOT_FOUND"
            - "response.http_status == 404"

      - name: service_zone_creation_applies_default_radius
        claim_type: defaults
        grounds:
          - entities.ServiceZone.fields.service_radius_miles
        distinguishing_aspect: "POST /service-zones omitting service_radius_miles applies the 0.75 default."
        test_recipe:
          setup:
            - "Empty DB."
          setup_api_calls: []
          trigger:
            - call: "POST /service-zones"
              payload: { zone_code: "ZD", name: "Zone D", center_lat: 40.0, center_lng: -74.0, base_fare_cents: 500, fixed_route_fare_cents: 290 }
              as: Admin
              captures: { z_id: "$.data.id" }
          assert:
            - "response.http_status == 201"
            - "ServiceZone.${z_id}.service_radius_miles == 0.75"

      - name: service_zone_immutable_has_no_version_field
        claim_type: immutability
        grounds:
          - entities.ServiceZone
        distinguishing_aspect: "ServiceZone has common_fields:false, so its create response carries id and created_at but no version/updated_at field."
        test_recipe:
          setup:
            - "Empty DB."
          setup_api_calls: []
          trigger:
            - call: "POST /service-zones"
              payload: { zone_code: "ZE", name: "Zone E", center_lat: 40.0, center_lng: -74.0, service_radius_miles: 0.75, base_fare_cents: 400, fixed_route_fare_cents: 250 }
              as: Admin
              captures: { z_id: "$.data.id" }
          assert:
            - "response.http_status == 201"
            - "ServiceZone.${z_id} has field created_at"
            - "ServiceZone.${z_id} has no field version"

      - name: vehicle_run_negative_seats_returns_out_of_range
        claim_type: type_constraints
        grounds:
          - entities.VehicleRun.fields.total_ambulatory_seats
          - "validations[priority=17]"
          - "errors[ERR_OUT_OF_RANGE]"
        distinguishing_aspect: "POST /vehicle-runs with a negative total_ambulatory_seats is ERR_OUT_OF_RANGE (422)."
        test_recipe:
          setup:
            - "One service zone exists."
          setup_api_calls:
            - call: "POST /service-zones"
              payload: { zone_code: "ZF", name: "Zone F", center_lat: 40.0, center_lng: -74.0, service_radius_miles: 0.75, base_fare_cents: 500, fixed_route_fare_cents: 290 }
              as: Admin
              captures: { z_id: "$.data.id" }
          trigger:
            - call: "POST /vehicle-runs"
              payload: { service_zone_id: "${z_id}", service_date: "2026-06-05", total_ambulatory_seats: -2, total_wheelchair_positions: 1 }
              as: Dispatcher
          assert:
            - "response.error_id == ERR_OUT_OF_RANGE"
            - "response.http_status == 422"

      - name: eligibility_application_unknown_rider_returns_rider_not_found
        claim_type: parent_relationships
        grounds:
          - entities.EligibilityApplication.fields.rider_id
          - "errors[ERR_RIDER_NOT_FOUND]"
        distinguishing_aspect: "POST /eligibility-applications referencing a non-existent rider_id is ERR_RIDER_NOT_FOUND (404)."
        test_recipe:
          setup:
            - "Empty DB."
          setup_api_calls: []
          trigger:
            - call: "POST /eligibility-applications"
              payload: { rider_id: "00000000-0000-0000-0000-000000000000" }
              as: EligibilitySpecialist
          assert:
            - "response.error_id == ERR_RIDER_NOT_FOUND"
            - "response.http_status == 404"

  # =========================================================================
  - section: state_machines
    instances:
      - name: trip_created_initial_state_is_requested
        claim_type: initial_state
        grounds:
          - state_machines.TripReservation
          - entities.TripReservation.fields.status
        distinguishing_aspect: "A newly created TripReservation starts in REQUESTED with offer_round 0."
        test_recipe:
          setup:
            - "Certified rider and a service zone."
          setup_api_calls:
            - call: "POST /service-zones"
              payload: { zone_code: "ZA", name: "Zone A", center_lat: 40.0, center_lng: -74.0, service_radius_miles: 0.75, base_fare_cents: 500, fixed_route_fare_cents: 290 }
              as: Admin
              captures: { za_id: "$.data.id" }
            - call: "POST /riders"
              payload: { full_name: "Init R", phone: "555-1010", email: "init@x.com", home_lat: 40.0, home_lng: -74.0 }
              as: EligibilitySpecialist
              captures: { r_id: "$.data.id" }
            - call: "POST /eligibility-applications"
              payload: { rider_id: "${r_id}" }
              as: EligibilitySpecialist
              captures: { app_id: "$.data.id" }
            - call: "POST /functional-assessments"
              payload: { application_id: "${app_id}", scheduled_at: "2026-06-02T10:00:00Z" }
              as: EligibilitySpecialist
              captures: { fa_id: "$.data.id" }
            - call: "POST /functional-assessments/${fa_id}/complete"
              payload: { outcome: "PASS_UNCONDITIONAL", assessed_mobility_device: "NONE" }
              as: EligibilitySpecialist
            - call: "POST /eligibility-applications/${app_id}/certify"
              payload: {}
              as: EligibilitySpecialist
          trigger:
            - call: "POST /trip-reservations"
              payload: { rider_id: "${r_id}", pickup_zone_id: "${za_id}", dropoff_zone_id: "${za_id}", pickup_lat: 40.0, pickup_lng: -74.0, dropoff_lat: 40.0, dropoff_lng: -74.0, requested_pickup_at: "2026-06-05T09:00:00Z" }
              as: Rider
              as_user_id: "${r_id}"
              captures: { trip_id: "$.data.id" }
          assert:
            - "TripReservation.${trip_id}.status == REQUESTED"
            - "TripReservation.${trip_id}.offer_round == 0"

      - name: certify_from_submitted_returns_invalid_state
        claim_type: invalid_transitions
        grounds:
          - state_machines.EligibilityApplication.ASSESSED_to_CERTIFIED
          - "validations[priority=6]"
          - "errors[ERR_INVALID_STATE]"
        distinguishing_aspect: "POST /certify on an application still in SUBMITTED (never assessed) is ERR_INVALID_STATE (409)."
        test_recipe:
          setup:
            - "Rider with a fresh application in SUBMITTED."
          setup_api_calls:
            - call: "POST /riders"
              payload: { full_name: "Sub R", phone: "555-1011", email: "sub@x.com", home_lat: 40.0, home_lng: -74.0 }
              as: EligibilitySpecialist
              captures: { r_id: "$.data.id" }
            - call: "POST /eligibility-applications"
              payload: { rider_id: "${r_id}" }
              as: EligibilitySpecialist
              captures: { app_id: "$.data.id" }
          trigger:
            - call: "POST /eligibility-applications/${app_id}/certify"
              payload: {}
              as: EligibilitySpecialist
          assert:
            - "response.error_id == ERR_INVALID_STATE"
            - "response.http_status == 409"

      - name: certify_failed_assessment_returns_invalid_state
        claim_type: precondition_enforcement
        grounds:
          - state_machines.EligibilityApplication.ASSESSED_to_CERTIFIED
          - entities.EligibilityApplication.fields.assessment_outcome
          - "errors[ERR_INVALID_STATE]"
        distinguishing_aspect: "POST /certify on an ASSESSED application whose assessment_outcome is FAIL violates the outcome precondition -> ERR_INVALID_STATE (409)."
        test_recipe:
          setup:
            - "Application assessed with FAIL (status ASSESSED, assessment_outcome FAIL)."
          setup_api_calls:
            - call: "POST /riders"
              payload: { full_name: "Fail R", phone: "555-1012", email: "fail@x.com", home_lat: 40.0, home_lng: -74.0 }
              as: EligibilitySpecialist
              captures: { r_id: "$.data.id" }
            - call: "POST /eligibility-applications"
              payload: { rider_id: "${r_id}" }
              as: EligibilitySpecialist
              captures: { app_id: "$.data.id" }
            - call: "POST /functional-assessments"
              payload: { application_id: "${app_id}", scheduled_at: "2026-06-02T10:00:00Z" }
              as: EligibilitySpecialist
              captures: { fa_id: "$.data.id" }
            - call: "POST /functional-assessments/${fa_id}/complete"
              payload: { outcome: "FAIL", assessed_mobility_device: "NONE" }
              as: EligibilitySpecialist
          trigger:
            - call: "POST /eligibility-applications/${app_id}/certify"
              payload: {}
              as: EligibilitySpecialist
          assert:
            - "response.error_id == ERR_INVALID_STATE"
            - "response.http_status == 409"

      - name: deny_passing_assessment_returns_invalid_state
        claim_type: precondition_enforcement
        grounds:
          - state_machines.EligibilityApplication.ASSESSED_to_DENIED
          - entities.EligibilityApplication.fields.assessment_outcome
          - "errors[ERR_INVALID_STATE]"
        distinguishing_aspect: "POST /deny on an ASSESSED application whose assessment_outcome is PASS_UNCONDITIONAL violates the FAIL precondition -> ERR_INVALID_STATE (409)."
        test_recipe:
          setup:
            - "Application assessed with PASS_UNCONDITIONAL (status ASSESSED)."
          setup_api_calls:
            - call: "POST /riders"
              payload: { full_name: "Pass R", phone: "555-1013", email: "pass@x.com", home_lat: 40.0, home_lng: -74.0 }
              as: EligibilitySpecialist
              captures: { r_id: "$.data.id" }
            - call: "POST /eligibility-applications"
              payload: { rider_id: "${r_id}" }
              as: EligibilitySpecialist
              captures: { app_id: "$.data.id" }
            - call: "POST /functional-assessments"
              payload: { application_id: "${app_id}", scheduled_at: "2026-06-02T10:00:00Z" }
              as: EligibilitySpecialist
              captures: { fa_id: "$.data.id" }
            - call: "POST /functional-assessments/${fa_id}/complete"
              payload: { outcome: "PASS_UNCONDITIONAL", assessed_mobility_device: "NONE" }
              as: EligibilitySpecialist
          trigger:
            - call: "POST /eligibility-applications/${app_id}/deny"
              payload: {}
              as: EligibilitySpecialist
          assert:
            - "response.error_id == ERR_INVALID_STATE"
            - "response.http_status == 409"

      - name: complete_assessment_twice_returns_invalid_state
        claim_type: idempotency
        grounds:
          - state_machines.FunctionalAssessment.SCHEDULED_to_COMPLETED
          - "errors[ERR_INVALID_STATE]"
        distinguishing_aspect: "A second POST /functional-assessments/{id}/complete on an already-COMPLETED assessment is ERR_INVALID_STATE (409)."
        test_recipe:
          setup:
            - "Assessment completed once (status COMPLETED, parent application ASSESSED)."
          setup_api_calls:
            - call: "POST /riders"
              payload: { full_name: "Twice R", phone: "555-1014", email: "twice@x.com", home_lat: 40.0, home_lng: -74.0 }
              as: EligibilitySpecialist
              captures: { r_id: "$.data.id" }
            - call: "POST /eligibility-applications"
              payload: { rider_id: "${r_id}" }
              as: EligibilitySpecialist
              captures: { app_id: "$.data.id" }
            - call: "POST /functional-assessments"
              payload: { application_id: "${app_id}", scheduled_at: "2026-06-02T10:00:00Z" }
              as: EligibilitySpecialist
              captures: { fa_id: "$.data.id" }
            - call: "POST /functional-assessments/${fa_id}/complete"
              payload: { outcome: "PASS_UNCONDITIONAL", assessed_mobility_device: "NONE" }
              as: EligibilitySpecialist
          trigger:
            - call: "POST /functional-assessments/${fa_id}/complete"
              payload: { outcome: "PASS_UNCONDITIONAL", assessed_mobility_device: "NONE" }
              as: EligibilitySpecialist
          assert:
            - "response.error_id == ERR_INVALID_STATE"
            - "response.http_status == 409"

      - name: dispatch_planned_run_returns_invalid_state
        claim_type: invalid_transitions
        grounds:
          - state_machines.VehicleRun.OPEN_to_DISPATCHED
          - "errors[ERR_INVALID_STATE]"
        distinguishing_aspect: "POST /vehicle-runs/{id}/dispatch on a run still PLANNED (never opened) is ERR_INVALID_STATE (409)."
        test_recipe:
          setup:
            - "A PLANNED run and its zone."
          setup_api_calls:
            - call: "POST /service-zones"
              payload: { zone_code: "ZA", name: "Zone A", center_lat: 40.0, center_lng: -74.0, service_radius_miles: 0.75, base_fare_cents: 500, fixed_route_fare_cents: 290 }
              as: Admin
              captures: { za_id: "$.data.id" }
            - call: "POST /vehicle-runs"
              payload: { service_zone_id: "${za_id}", service_date: "2026-06-05", total_ambulatory_seats: 4, total_wheelchair_positions: 2 }
              as: Dispatcher
              captures: { run_id: "$.data.id" }
          trigger:
            - call: "POST /vehicle-runs/${run_id}/dispatch"
              payload: {}
              as: Dispatcher
          assert:
            - "response.error_id == ERR_INVALID_STATE"
            - "response.http_status == 409"

      - name: cancel_completed_trip_returns_invalid_state
        claim_type: terminal_state_lockdown
        grounds:
          - state_machines.TripReservation.PICKED_UP_to_COMPLETED
          - "errors[ERR_INVALID_STATE]"
        distinguishing_aspect: "POST /trip-reservations/{id}/cancel on a COMPLETED (terminal) trip is ERR_INVALID_STATE (409); no side effects fire."
        test_recipe:
          setup:
            - "Trip fully completed (COMPLETED terminal state)."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-06-01T00:00:00Z" }
              as: Admin
            - call: "POST /service-zones"
              payload: { zone_code: "ZA", name: "Zone A", center_lat: 40.0, center_lng: -74.0, service_radius_miles: 0.75, base_fare_cents: 500, fixed_route_fare_cents: 290 }
              as: Admin
              captures: { za_id: "$.data.id" }
            - call: "POST /riders"
              payload: { full_name: "Done R", phone: "555-1015", email: "done@x.com", home_lat: 40.0, home_lng: -74.0 }
              as: EligibilitySpecialist
              captures: { r_id: "$.data.id" }
            - call: "POST /eligibility-applications"
              payload: { rider_id: "${r_id}" }
              as: EligibilitySpecialist
              captures: { app_id: "$.data.id" }
            - call: "POST /functional-assessments"
              payload: { application_id: "${app_id}", scheduled_at: "2026-06-02T10:00:00Z" }
              as: EligibilitySpecialist
              captures: { fa_id: "$.data.id" }
            - call: "POST /functional-assessments/${fa_id}/complete"
              payload: { outcome: "PASS_UNCONDITIONAL", assessed_mobility_device: "NONE" }
              as: EligibilitySpecialist
            - call: "POST /eligibility-applications/${app_id}/certify"
              payload: {}
              as: EligibilitySpecialist
            - call: "POST /vehicle-runs"
              payload: { service_zone_id: "${za_id}", service_date: "2026-06-05", total_ambulatory_seats: 4, total_wheelchair_positions: 2 }
              as: Dispatcher
              captures: { run_id: "$.data.id", run_v: "$.data.version" }
            - call: "POST /trip-reservations"
              payload: { rider_id: "${r_id}", pickup_zone_id: "${za_id}", dropoff_zone_id: "${za_id}", pickup_lat: 40.0, pickup_lng: -74.0, dropoff_lat: 40.0, dropoff_lng: -74.0, requested_pickup_at: "2026-06-05T09:00:00Z" }
              as: Rider
              as_user_id: "${r_id}"
              captures: { trip_id: "$.data.id" }
            - call: "POST /trip-reservations/${trip_id}/offer"
              payload: { proposed_pickup_at: "2026-06-05T09:00:00Z" }
              as: Dispatcher
            - call: "POST /trip-reservations/${trip_id}/accept"
              payload: { run_id: "${run_id}", expected_run_version: "${run_v}" }
              as: Rider
              as_user_id: "${r_id}"
            - call: "POST /trip-reservations/${trip_id}/pickup"
              payload: { actual_pickup_at: "2026-06-05T09:00:00Z", actual_pickup_zone_id: "${za_id}" }
              as: Driver
            - call: "POST /trip-reservations/${trip_id}/dropoff"
              payload: { actual_dropoff_at: "2026-06-05T09:20:00Z", actual_dropoff_zone_id: "${za_id}" }
              as: Driver
          trigger:
            - call: "POST /trip-reservations/${trip_id}/cancel"
              payload: {}
              as: Rider
              as_user_id: "${r_id}"
          assert:
            - "response.error_id == ERR_INVALID_STATE"
            - "response.http_status == 409"
            - "TripReservation.${trip_id}.status == COMPLETED"

      - name: duplicate_active_application_returns_conflict
        claim_type: violation_to_error
        grounds:
          - "validations[priority=5]"
          - "errors[ERR_DUPLICATE_ACTIVE_APPLICATION]"
        distinguishing_aspect: "A second POST /eligibility-applications while the rider already has a non-terminal application is ERR_DUPLICATE_ACTIVE_APPLICATION (409)."
        test_recipe:
          setup:
            - "Rider with an existing SUBMITTED application."
          setup_api_calls:
            - call: "POST /riders"
              payload: { full_name: "Dup R", phone: "555-1016", email: "dup@x.com", home_lat: 40.0, home_lng: -74.0 }
              as: EligibilitySpecialist
              captures: { r_id: "$.data.id" }
            - call: "POST /eligibility-applications"
              payload: { rider_id: "${r_id}" }
              as: EligibilitySpecialist
              captures: { app_id: "$.data.id" }
          trigger:
            - call: "POST /eligibility-applications"
              payload: { rider_id: "${r_id}" }
              as: EligibilitySpecialist
          assert:
            - "response.error_id == ERR_DUPLICATE_ACTIVE_APPLICATION"
            - "response.http_status == 409"

  # =========================================================================
  - section: calculations
    instances:
      - name: fare_cross_zone_no_companion_cap_binds_580
        claim_type: correct_result
        grounds:
          - calculations.trip_fare
          - entities.TripReservation.fields.estimated_fare_cents
        distinguishing_aspect: "Cross-zone ZA->ZB with 0 companions: base=max(500,700)+150=850, ADA cap=min(850,2*290)=580 -> estimated_fare_cents==580 (cap binds)."
        test_recipe:
          setup:
            - "Clock 2026-06-01. ZA(base 500,fixed 290), ZB(base 700,fixed 290). Certified rider, run with seats."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-06-01T00:00:00Z" }
              as: Admin
            - call: "POST /service-zones"
              payload: { zone_code: "ZA", name: "Zone A", center_lat: 40.0, center_lng: -74.0, service_radius_miles: 0.75, base_fare_cents: 500, fixed_route_fare_cents: 290 }
              as: Admin
              captures: { za_id: "$.data.id" }
            - call: "POST /service-zones"
              payload: { zone_code: "ZB", name: "Zone B", center_lat: 40.05, center_lng: -74.0, service_radius_miles: 0.75, base_fare_cents: 700, fixed_route_fare_cents: 290 }
              as: Admin
              captures: { zb_id: "$.data.id" }
            - call: "POST /riders"
              payload: { full_name: "Fare R", phone: "555-1017", email: "fare@x.com", home_lat: 40.0, home_lng: -74.0 }
              as: EligibilitySpecialist
              captures: { r_id: "$.data.id" }
            - call: "POST /eligibility-applications"
              payload: { rider_id: "${r_id}" }
              as: EligibilitySpecialist
              captures: { app_id: "$.data.id" }
            - call: "POST /functional-assessments"
              payload: { application_id: "${app_id}", scheduled_at: "2026-06-02T10:00:00Z" }
              as: EligibilitySpecialist
              captures: { fa_id: "$.data.id" }
            - call: "POST /functional-assessments/${fa_id}/complete"
              payload: { outcome: "PASS_UNCONDITIONAL", assessed_mobility_device: "NONE" }
              as: EligibilitySpecialist
            - call: "POST /eligibility-applications/${app_id}/certify"
              payload: {}
              as: EligibilitySpecialist
            - call: "POST /vehicle-runs"
              payload: { service_zone_id: "${za_id}", service_date: "2026-06-05", total_ambulatory_seats: 4, total_wheelchair_positions: 2 }
              as: Dispatcher
