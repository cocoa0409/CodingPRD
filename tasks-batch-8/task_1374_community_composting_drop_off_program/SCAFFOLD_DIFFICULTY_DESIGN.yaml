              captures: { err: $.data.error_id }
          assert:
            - "err == ERR_ACCESS_GRANT_INVALID (409), not ERR_DROP_OUTSIDE_AGREEMENT_TERM"
            - "Referential (priority 8) fires before temporal (priority 9)"

  # ===========================================================================
  # Rule 6 — boundary_precision_check (different metrics / endpoints)
  # ===========================================================================
  - rule_id: boundary_precision_check
    instances:
      - name: posture_capacity_gte_boundary
        grounds:
          - calculations.site_posture
          - entities.Site.fields.stored_kg
          - errors[ERR_SITE_POSTURE_BLOCKS_DROP]
        distinguishing_aspect: |
          Boundary on the capacity metric: posture SUSPENDED requires
          (stored_kg − pending_pickup_kg) >= capacity_kg — exact equality
          triggers SUSPENDED. At 99.00/100 kg the site is WATCH; at exactly
          100.00 it flips SUSPENDED and the next drop fails.
        test_recipe:
          setup:
            - "Program ACTIVE; site capacity 100 kg; agreement; material; participant with grant"
            - "First drop fills site to exactly 99.00 (posture WATCH since 99 >= ceil(0.8*100)=80)"
            - "A 1.00-kg drop succeeds (WATCH allows <= 5 kg), bringing stored to exactly 100.00"
          setup_api_calls:
            - call: "POST /programs"
              payload: { name: "P11", fiscal_year: 2026 }
              as: ProgramAdmin
              captures: { prog_id: $.data.id }
            - call: "POST /programs/${prog_id}/sites"
              payload: { name: "S1", address: "1 A St", capacity_kg: 100 }
              as: ProgramAdmin
              captures: { site_id: $.data.id }
