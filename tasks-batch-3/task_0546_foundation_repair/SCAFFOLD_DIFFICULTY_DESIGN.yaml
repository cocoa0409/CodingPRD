        grounds:
          - validations[priority=16]
          - errors[ERR_NO_PIERS]
          - state_machines.EngineeringScope.DRAFT_to_ENGINEERED
        distinguishing_aspect: "A different metric (zero-count edge on pier_count) at a different endpoint (scope finalize): pier_count==0 is rejected with ERR_NO_PIERS."
