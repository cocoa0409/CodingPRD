  # ===========================================================================
  - rule_id: priority_pair_validation_conflict
    instances:
      - name: closed_lot_state_error_outranks_insufficient_deposit
        grounds:
          - validations[priority=26]
          - validations[priority=56]
          - state_machines.AuctionLot.OPEN_to_CLOSED_NO_SALE
          - entities.Bidder.fields.deposit_available_cents
        distinguishing_aspect: |
          The state band (priority 26, ERR_LOT_NOT_OPEN, 409) and the fiscal band
          (priority 56, ERR_DEPOSIT_INSUFFICIENT, 402) are BOTH violated by one bid request on
          a lot that already closed while the event is still LIVE (a second lot keeps it live).
          Only the state error surfaces, and the response carries 409 rather than 402 — the two
          rules sit in different bands with different HTTP statuses, so the ordering is
          observable in the status code, not merely the error_id.
        test_recipe:
          setup:
            - "One REO AuctionEvent in CA-ALAMEDA (17:00:00Z..19:00:00Z) with TWO lots on two different assets: lot A closes at 17:30:00Z, lot B runs to 19:00:00Z."
            - "Both lots were opened; lot A received no bids and was closed at 17:35:00Z into CLOSED_NO_SALE, while lot B stays OPEN so the event remains LIVE."
            - "One VERIFIED, REGISTERED bidder that has funded NOTHING (deposit_available_cents 0, required_deposit 1000000)."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
