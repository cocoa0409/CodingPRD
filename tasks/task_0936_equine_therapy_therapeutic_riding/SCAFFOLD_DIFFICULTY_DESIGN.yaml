          setup:
            - "Clock 2026-05-01T00:00:00Z; LEVEL_4 rider Rae in BAND_D with payer 0; MASTER instructor; horse Comet."
            - "One unrestricted grant of 5000 cents covering 2026-01-01..2026-12-31 and no scholarship award."
            - "A 30-minute session on 2026-05-11T10:00:00Z is CONFIRMED; its billed fee will be 30 * 150 = 4500 cents."
