# =============================================================================
# §1.8 Scaffold Difficulty Design (Test Targeting Index)
# Brewery / Winery Tasting Room & Club — Expert
# Nine §0.5 Difficulty Rules, each with >= 2 grounded, executable instances.
# Every setup_api_calls / trigger call resolves to a §1.5 endpoint; every ${var}
# traces to an earlier captures: binding; OCC version inputs are always ${vars}.
# =============================================================================

scaffold_difficulty_design:

  # ===========================================================================
  - rule_id: dual_variant_calc
    instances:
      - name: excise_wine_tier_vs_beer_barrel_diverge
        grounds:
          - calculations.excise_accrual
          - state_machines.ProductionBatch.BOTTLING_to_BOTTLING
          - entities.Winery.fields.excise_tax_owed_cents
        distinguishing_aspect: |
          The two excise variants live on the ProductionBatch domain but the
          calculation writes the Winery's excise_tax_owed_cents: identical removal
          gallons (100 bottles x 750ml = 19.812913 gal) yield 2120c under WINE
          tier1 (107c/gal) versus 1150c under BEER per-barrel (gal/31 * 1800c),
          a different result for the same physical removal.
        test_recipe:
          setup:
            - "Two ACTIVE wineries; one WINE batch (abv 13.5) and one BEER batch, each in BOTTLING with a DRAFT product to bottle 100x750ml into."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-06-15T00:00:00Z" }
              as: ComplianceOfficer
            - call: "POST /wineries"
              payload: { name: "Wine Co", ttb_permit_number: "WINE-1", home_state_code: "CA" }
              as: ComplianceOfficer
              captures: { w_wine: $.data.id }
            - call: "POST /wineries"
              payload: { name: "Beer Co", ttb_permit_number: "BEER-1", home_state_code: "CA" }
              as: ComplianceOfficer
              captures: { w_beer: $.data.id }
            - call: "POST /batches"
              payload: { winery_id: "${w_wine}", lot_code: "WLOT1", beverage_class: "WINE", volume_in_gallons: 100, abv_percent: 13.5 }
              as: CellarManager
              captures: { b_wine: $.data.id }
            - call: "POST /batches"
              payload: { winery_id: "${w_beer}", lot_code: "BLOT1", beverage_class: "BEER", volume_in_gallons: 100, abv_percent: 5.0 }
              as: CellarManager
              captures: { b_beer: $.data.id }
            - call: "POST /products"
              payload: { winery_id: "${w_wine}", source_batch_id: "${b_wine}", sku: "WS1", vintage_year: 2024, bottle_volume_ml: 750, list_price_cents: 5000 }
              as: CellarManager
              captures: { p_wine: $.data.id }
            - call: "POST /products"
              payload: { winery_id: "${w_beer}", source_batch_id: "${b_beer}", sku: "BS1", vintage_year: 2024, bottle_volume_ml: 750, list_price_cents: 5000 }
              as: CellarManager
              captures: { p_beer: $.data.id }
            - call: "POST /batches/${b_wine}/transitions"
              payload: { action: "BEGIN_AGING" }
              as: CellarManager
            - call: "POST /batches/${b_wine}/transitions"
              payload: { action: "OPEN_BOTTLING" }
              as: CellarManager
            - call: "POST /batches/${b_beer}/transitions"
              payload: { action: "BEGIN_AGING" }
              as: CellarManager
            - call: "POST /batches/${b_beer}/transitions"
              payload: { action: "OPEN_BOTTLING" }
              as: CellarManager
          trigger:
            - call: "POST /batches/${b_wine}/bottling-runs"
              payload: { product_id: "${p_wine}", requested_bottles: 100 }
              as: CellarManager
            - call: "POST /batches/${b_beer}/bottling-runs"
              payload: { product_id: "${p_beer}", requested_bottles: 100 }
              as: CellarManager
          assert:
            - "Winery.${w_wine}.excise_tax_owed_cents == 2120"
            - "Winery.${w_beer}.excise_tax_owed_cents == 1150"

      - name: loyalty_membership_balance_vs_winery_liability
        grounds:
          - calculations.loyalty_points_accrual
          - state_machines.Shipment.SCHEDULED_to_RELEASED
          - entities.Membership.fields.loyalty_points
          - entities.Winery.fields.loyalty_point_liability
        distinguishing_aspect: |
          The loyalty calculation operates on a different entity domain than excise:
          a single RELEASE mints 1476 points to the Membership (PLATINUM x3 on
          net 49200c -> floor(492)*3), and the Winery.loyalty_point_liability is the
          aggregate over all memberships; with one earning membership both equal 1476,
          but the membership balance is per-row while liability is a premises rollup.
        test_recipe:
          setup:
            - "ACTIVE winery, ACTIVE PLATINUM membership of a 21+ member, an OPEN release of 12 bottles of a 5000c product, a SCHEDULED shipment of 12 bottles."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-06-15T00:00:00Z" }
              as: ComplianceOfficer
            - call: "POST /wineries"
              payload: { name: "Club Co", ttb_permit_number: "CLUB-1", home_state_code: "CA" }
              as: ComplianceOfficer
              captures: { w: $.data.id }
            - call: "POST /batches"
              payload: { winery_id: "${w}", lot_code: "L1", beverage_class: "WINE", volume_in_gallons: 100, abv_percent: 13.5 }
              as: CellarManager
              captures: { b: $.data.id }
            - call: "POST /products"
              payload: { winery_id: "${w}", source_batch_id: "${b}", sku: "S1", vintage_year: 2024, bottle_volume_ml: 750, list_price_cents: 5000 }
              as: CellarManager
              captures: { p: $.data.id, pv0: $.data.version }
            - call: "POST /batches/${b}/transitions"
              payload: { action: "BEGIN_AGING" }
              as: CellarManager
            - call: "POST /batches/${b}/transitions"
              payload: { action: "OPEN_BOTTLING" }
              as: CellarManager
            - call: "POST /batches/${b}/bottling-runs"
              payload: { product_id: "${p}", requested_bottles: 50 }
              as: CellarManager
            - call: "POST /products/${p}/transitions"
              payload: { action: "ACTIVATE", expected_product_version: "${pv0}" }
              as: CellarManager
              captures: { pv1: $.data.version }
            - call: "POST /releases"
              payload: { winery_id: "${w}", product_id: "${p}", pool_bottles: 12, per_member_cap: 12, opens_at: "2026-06-01T00:00:00Z", closes_at: "2026-07-01T00:00:00Z" }
              as: CellarManager
              captures: { r: $.data.id, rv0: $.data.version }
            - call: "POST /releases/${r}/transitions"
              payload: { action: "OPEN_RELEASE", expected_release_version: "${rv0}", expected_product_version: "${pv1}" }
              as: CellarManager
            - call: "POST /members"
              payload: { winery_id: "${w}", full_name: "Ada Adult", email: "ada@x.com", date_of_birth: "1990-01-01T00:00:00Z", ship_to_state_code: "CA" }
              as: ClubManager
              captures: { m: $.data.id }
            - call: "POST /members/${m}/transitions"
              payload: { action: "ACTIVATE" }
              as: ClubManager
            - call: "POST /memberships"
              payload: { winery_id: "${w}", member_id: "${m}", tier: "PLATINUM", cadence_months: 3, bottles_per_shipment: 12 }
              as: ClubManager
              captures: { ms: $.data.id }
            - call: "POST /memberships/${ms}/transitions"
              payload: { action: "ACTIVATE" }
              as: ClubManager
            - call: "POST /shipments"
              payload: { winery_id: "${w}", membership_id: "${ms}", release_id: "${r}", requested_bottles: 12 }
              as: ClubManager
              captures: { sh: $.data.id }
          trigger:
            - call: "POST /shipments/${sh}/transitions"
              payload: { action: "RELEASE" }
              as: ClubManager
          assert:
            - "Membership.${ms}.loyalty_points == 1476"
            - "Winery.${w}.loyalty_point_liability == 1476"

  # ===========================================================================
  - rule_id: combinatorial_formula
    instances:
      - name: shipment_pricing_kicker_then_cap_mode_a
        grounds:
          - calculations.shipment_pricing
          - state_machines.Shipment.SCHEDULED_to_RELEASED
          - entities.Shipment.fields.discount_cents
        distinguishing_aspect: |
          Mode (a): >=3 inputs (tier, requested_bottles, list_price) with non-linear
          interaction — PLATINUM base 0.15 + volume kicker 0.05 = 0.20 is then clamped
          by min() to MAX_DISCOUNT_PCT 0.18, so discount on 60000c subtotal is exactly
          10800c (not 12000c), total 49200c.
        test_recipe:
          setup:
            - "ACTIVE PLATINUM membership; OPEN release of >=12 bottles of a 5000c product; SCHEDULED shipment of 12 bottles."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-06-15T00:00:00Z" }
              as: ComplianceOfficer
            - call: "POST /wineries"
              payload: { name: "Px Co", ttb_permit_number: "PX-1", home_state_code: "CA" }
              as: ComplianceOfficer
              captures: { w: $.data.id }
            - call: "POST /batches"
              payload: { winery_id: "${w}", lot_code: "L1", beverage_class: "WINE", volume_in_gallons: 100, abv_percent: 13.5 }
              as: CellarManager
              captures: { b: $.data.id }
            - call: "POST /products"
              payload: { winery_id: "${w}", source_batch_id: "${b}", sku: "S1", vintage_year: 2024, bottle_volume_ml: 750, list_price_cents: 5000 }
              as: CellarManager
              captures: { p: $.data.id, pv0: $.data.version }
            - call: "POST /batches/${b}/transitions"
              payload: { action: "BEGIN_AGING" }
              as: CellarManager
            - call: "POST /batches/${b}/transitions"
              payload: { action: "OPEN_BOTTLING" }
              as: CellarManager
            - call: "POST /batches/${b}/bottling-runs"
              payload: { product_id: "${p}", requested_bottles: 50 }
              as: CellarManager
            - call: "POST /products/${p}/transitions"
              payload: { action: "ACTIVATE", expected_product_version: "${pv0}" }
              as: CellarManager
              captures: { pv1: $.data.version }
            - call: "POST /releases"
              payload: { winery_id: "${w}", product_id: "${p}", pool_bottles: 12, per_member_cap: 12, opens_at: "2026-06-01T00:00:00Z", closes_at: "2026-07-01T00:00:00Z" }
              as: CellarManager
              captures: { r: $.data.id, rv0: $.data.version }
            - call: "POST /releases/${r}/transitions"
              payload: { action: "OPEN_RELEASE", expected_release_version: "${rv0}", expected_product_version: "${pv1}" }
              as: CellarManager
            - call: "POST /members"
              payload: { winery_id: "${w}", full_name: "Ada Adult", email: "ada@x.com", date_of_birth: "1990-01-01T00:00:00Z", ship_to_state_code: "CA" }
              as: ClubManager
              captures: { m: $.data.id }
            - call: "POST /members/${m}/transitions"
              payload: { action: "ACTIVATE" }
              as: ClubManager
            - call: "POST /memberships"
              payload: { winery_id: "${w}", member_id: "${m}", tier: "PLATINUM", cadence_months: 3, bottles_per_shipment: 12 }
              as: ClubManager
              captures: { ms: $.data.id }
            - call: "POST /memberships/${ms}/transitions"
              payload: { action: "ACTIVATE" }
              as: ClubManager
          trigger:
            - call: "POST /shipments"
              payload: { winery_id: "${w}", membership_id: "${ms}", release_id: "${r}", requested_bottles: 12 }
              as: ClubManager
              captures: { sh: $.data.id }
          assert:
            - "Shipment.${sh}.subtotal_cents == 60000"
            - "Shipment.${sh}.discount_cents == 10800"
            - "Shipment.${sh}.total_cents == 49200"

      - name: pos_total_round_per_line_then_sum_mode_b
        grounds:
          - calculations.pos_order_total
          - state_machines.TastingOrder.OPEN_to_PAID
          - entities.TastingOrder.fields.member_discount_cents
        distinguishing_aspect: |
          Mode (b): rounding order is pinned to aggregate-on-bottle-subtotal. Three
          BOTTLE lines of 333c each sum to 999c; GOLD discount rounds ONCE on the
          summed bottle subtotal -> round(99.9)=100c (not 3x round(33.3)=99c), giving
          subtotal 999, member_discount 100, total 899.
        test_recipe:
          setup:
            - "ACTIVE GOLD membership; an ACTIVE product priced 333c with >=3 on-hand bottles; an OPEN tasting order of three BOTTLE lines qty 1 each, member attached, age verified."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-06-15T00:00:00Z" }
              as: ComplianceOfficer
            - call: "POST /wineries"
              payload: { name: "Pos Co", ttb_permit_number: "POS-1", home_state_code: "CA" }
              as: ComplianceOfficer
              captures: { w: $.data.id }
            - call: "POST /batches"
              payload: { winery_id: "${w}", lot_code: "L1", beverage_class: "WINE", volume_in_gallons: 100, abv_percent: 13.5 }
              as: CellarManager
              captures: { b: $.data.id }
            - call: "POST /products"
              payload: { winery_id: "${w}", source_batch_id: "${b}", sku: "S1", vintage_year: 2024, bottle_volume_ml: 750, list_price_cents: 333 }
              as: CellarManager
              captures: { p: $.data.id, pv0: $.data.version }
            - call: "POST /batches/${b}/transitions"
              payload: { action: "BEGIN_AGING" }
              as: CellarManager
            - call: "POST /batches/${b}/transitions"
              payload: { action: "OPEN_BOTTLING" }
              as: CellarManager
            - call: "POST /batches/${b}/bottling-runs"
              payload: { product_id: "${p}", requested_bottles: 10 }
              as: CellarManager
            - call: "POST /products/${p}/transitions"
              payload: { action: "ACTIVATE", expected_product_version: "${pv0}" }
              as: CellarManager
            - call: "POST /members"
              payload: { winery_id: "${w}", full_name: "Gil Gold", email: "gil@x.com", date_of_birth: "1990-01-01T00:00:00Z", ship_to_state_code: "CA" }
              as: ClubManager
              captures: { m: $.data.id }
            - call: "POST /members/${m}/transitions"
              payload: { action: "ACTIVATE" }
              as: ClubManager
            - call: "POST /memberships"
              payload: { winery_id: "${w}", member_id: "${m}", tier: "GOLD", cadence_months: 3, bottles_per_shipment: 6 }
              as: ClubManager
              captures: { ms: $.data.id }
            - call: "POST /memberships/${ms}/transitions"
              payload: { action: "ACTIVATE" }
              as: ClubManager
          trigger:
            - call: "POST /tasting-orders"
              payload: { winery_id: "${w}", member_id: "${m}", guest_age_verified: true, line_items: [ { product_id: "${p}", kind: "BOTTLE", quantity: 1 }, { product_id: "${p}", kind: "BOTTLE", quantity: 1 }, { product_id: "${p}", kind: "BOTTLE", quantity: 1 } ] }
              as: TastingRoomStaff
              captures: { o: $.data.id }
          assert:
            - "TastingOrder.${o}.subtotal_cents == 999"
            - "TastingOrder.${o}.member_discount_cents == 100"
            - "TastingOrder.${o}.total_cents == 899"

      - name: distribution_invoice_freight_keyed_on_base_mode_c
        grounds:
          - calculations.distribution_invoice
          - entities.DistributionOrder.fields.wholesale_total_cents
        distinguishing_aspect: |
          Mode (c): circular-looking dependency with pinned evaluation order — freight
          is selected from wholesale_base (post 0.50 discount), NOT from gross. One case
          @8500 list -> gross 102000, base 51000 >= 50000 -> freight HIGH 1500 -> total
          52500; keying freight off gross would never reach the boundary the same way.
        test_recipe:
          setup:
            - "ACTIVE winery with a product list_price 8500c; a DRAFT distribution order of 1 case."
          setup_api_calls:
            - call: "POST /wineries"
              payload: { name: "Dist Co", ttb_permit_number: "DST-1", home_state_code: "CA" }
              as: ComplianceOfficer
              captures: { w: $.data.id }
            - call: "POST /batches"
              payload: { winery_id: "${w}", lot_code: "L1", beverage_class: "WINE", volume_in_gallons: 100, abv_percent: 13.5 }
              as: CellarManager
              captures: { b: $.data.id }
            - call: "POST /products"
              payload: { winery_id: "${w}", source_batch_id: "${b}", sku: "S1", vintage_year: 2024, bottle_volume_ml: 750, list_price_cents: 8500 }
              as: CellarManager
              captures: { p: $.data.id }
          trigger:
            - call: "POST /distribution-orders"
              payload: { winery_id: "${w}", product_id: "${p}", retailer_license_number: "RET-9", dest_state_code: "CA", case_count: 1 }
              as: ComplianceOfficer
              captures: { d: $.data.id }
          assert:
            - "DistributionOrder.${d}.bottles_ordered == 12"
            - "DistributionOrder.${d}.wholesale_total_cents == 52500"

  # ===========================================================================
  - rule_id: non_linear_state_machine
    instances:
      - name: batch_branch_ferment_to_dumped
        grounds:
          - state_machines.ProductionBatch.FERMENTING_to_DUMPED
          - state_machines.ProductionBatch.FERMENTING_to_AGING
          - entities.ProductionBatch.fields.available_bulk_gallons
        distinguishing_aspect: |
          ProductionBatch forks at FERMENTING into either AGING or DUMPED with
          divergent side-effects: DUMP sets loss_gallons=volume_in and zeroes
          available_bulk_gallons (no excise), unlike BEGIN_AGING which preserves bulk.
        test_recipe:
          setup:
            - "A FERMENTING batch of 100 gallons with no sourced product inventory."
          setup_api_calls:
            - call: "POST /wineries"
              payload: { name: "Dump Co", ttb_permit_number: "DMP-1", home_state_code: "CA" }
              as: ComplianceOfficer
              captures: { w: $.data.id }
            - call: "POST /batches"
              payload: { winery_id: "${w}", lot_code: "L1", beverage_class: "WINE", volume_in_gallons: 100, abv_percent: 13.5 }
              as: CellarManager
              captures: { b: $.data.id }
          trigger:
            - call: "POST /batches/${b}/transitions"
              payload: { action: "DUMP" }
              as: CellarManager
          assert:
            - "ProductionBatch.${b}.status == DUMPED"
            - "ProductionBatch.${b}.loss_gallons == 100"
            - "ProductionBatch.${b}.available_bulk_gallons == 0"

      - name: shipment_branch_held_then_release_revert
        grounds:
          - state_machines.Shipment.SCHEDULED_to_HELD
          - state_machines.Shipment.HELD_to_RELEASED
          - entities.Shipment.fields.hold_reason
        distinguishing_aspect: |
          On a different entity (Shipment): RELEASE on a PAST_DUE membership branches
          to HELD with hold_reason=BILLING (no commit); after billing is set CURRENT a
          second RELEASE reverts HELD->RELEASED and commits — a non-linear hold/release
          loop, not a forward-only pipeline.
        test_recipe:
          setup:
            - "ACTIVE GOLD membership marked PAST_DUE; OPEN release of 6 bottles of a 5000c product; SCHEDULED shipment of 6 bottles to CA."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-06-15T00:00:00Z" }
              as: ComplianceOfficer
            - call: "POST /wineries"
              payload: { name: "Hold Co", ttb_permit_number: "HLD-1", home_state_code: "CA" }
              as: ComplianceOfficer
              captures: { w: $.data.id }
            - call: "POST /batches"
              payload: { winery_id: "${w}", lot_code: "L1", beverage_class: "WINE", volume_in_gallons: 100, abv_percent: 13.5 }
              as: CellarManager
              captures: { b: $.data.id }
            - call: "POST /products"
              payload: { winery_id: "${w}", source_batch_id: "${b}", sku: "S1", vintage_year: 2024, bottle_volume_ml: 750, list_price_cents: 5000 }
              as: CellarManager
              captures: { p: $.data.id, pv0: $.data.version }
            - call: "POST /batches/${b}/transitions"
              payload: { action: "BEGIN_AGING" }
              as: CellarManager
            - call: "POST /batches/${b}/transitions"
              payload: { action: "OPEN_BOTTLING" }
              as: CellarManager
            - call: "POST /batches/${b}/bottling-runs"
              payload: { product_id: "${p}", requested_bottles: 20 }
              as: CellarManager
            - call: "POST /products/${p}/transitions"
              payload: { action: "ACTIVATE", expected_product_version: "${pv0}" }
              as: CellarManager
              captures: { pv1: $.data.version }
            - call: "POST /releases"
              payload: { winery_id: "${w}", product_id: "${p}", pool_bottles: 6, per_member_cap: 6, opens_at: "2026-06-01T00:00:00Z", closes_at: "2026-07-01T00:00:00Z" }
              as: CellarManager
              captures: { r: $.data.id, rv0: $.data.version }
            - call: "POST /releases/${r}/transitions"
              payload: { action: "OPEN_RELEASE", expected_release_version: "${rv0}", expected_product_version: "${pv1}" }
              as: CellarManager
            - call: "POST /members"
              payload: { winery_id: "${w}", full_name: "Ada Adult", email: "ada@x.com", date_of_birth: "1990-01-01T00:00:00Z", ship_to_state_code: "CA" }
              as: ClubManager
              captures: { m: $.data.id }
            - call: "POST /members/${m}/transitions"
              payload: { action: "ACTIVATE" }
              as: ClubManager
            - call: "POST /memberships"
              payload: { winery_id: "${w}", member_id: "${m}", tier: "GOLD", cadence_months: 3, bottles_per_shipment: 6 }
              as: ClubManager
              captures: { ms: $.data.id }
            - call: "POST /memberships/${ms}/transitions"
              payload: { action: "ACTIVATE" }
              as: ClubManager
            - call: "POST /memberships/${ms}/billing"
              payload: { billing_status: "PAST_DUE" }
              as: ClubManager
            - call: "POST /shipments"
              payload: { winery_id: "${w}", membership_id: "${ms}", release_id: "${r}", requested_bottles: 6 }
              as: ClubManager
              captures: { sh: $.data.id }
          trigger:
            - call: "POST /shipments/${sh}/transitions"
              payload: { action: "RELEASE" }
              as: ClubManager
            - call: "POST /memberships/${ms}/billing"
              payload: { billing_status: "CURRENT" }
              as: ClubManager
            - call: "POST /shipments/${sh}/transitions"
              payload: { action: "RELEASE" }
              as: ClubManager
          assert:
            - "After first RELEASE: Shipment.${sh}.status == HELD and Shipment.${sh}.hold_reason == BILLING"
            - "After billing CURRENT + second RELEASE: Shipment.${sh}.status == RELEASED and Shipment.${sh}.hold_reason == NONE"

  # ===========================================================================
  - rule_id: transitive_cascade
    instances:
      - name: bottling_depth3_batch_product_premises
        grounds:
          - state_machines.ProductionBatch.BOTTLING_to_BOTTLING
          - calculations.bottling_removal_accounting
          - calculations.excise_accrual
          - entities.Product.fields.on_hand_bottles
          - entities.Winery.fields.excise_tax_owed_cents
        distinguishing_aspect: |
          Depth-3 cascade from one bottling-run: hop1 debits batch bulk
          (available_bulk_gallons drops), hop2 the removal mints Product.on_hand_bottles
          (+100), hop3 that mint drives winery.bottled_taxpaid_volume_gallons and
          excise_tax_owed_cents (+2120 for WINE tier1). Each hop is caused by the prior.
        test_recipe:
          setup:
            - "A WINE batch (abv 13.5, 100 gal) in BOTTLING with a DRAFT product 750ml."
          setup_api_calls:
            - call: "POST /wineries"
              payload: { name: "Casc Co", ttb_permit_number: "CSC-1", home_state_code: "CA" }
              as: ComplianceOfficer
              captures: { w: $.data.id }
            - call: "POST /batches"
