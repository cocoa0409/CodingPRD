            - { call: "POST /festival/submissions", payload: { edition_id: "${ed}", category: SHORT_FILM, title: "Pending Film", runtime_minutes: 20, completion_date: "2025-06-01", premiere_status: NONE, production_company: "A Co", format: DCP_2K }, as: FILMMAKER, as_user_id: "${subm}", captures: { film: $.data.id } }
            - { call: "POST /festival/submissions/${film}/checkout", payload: {}, as: FILMMAKER, as_user_id: "${subm}", captures: { pay: $.data.id } }
