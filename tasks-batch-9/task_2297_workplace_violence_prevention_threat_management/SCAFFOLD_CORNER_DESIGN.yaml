              as: ProgramAdmin
              captures: { sm_id: $.data.id }
            - call: "POST /employees"
              payload: { worksite_id: "${ws_id}", work_area_id: "${wa_front_id}", full_name: "Dana Kim", job_function: "ADMIN", team_discipline: "HR" }
              as: ProgramAdmin
              captures: { lead_id: $.data.id }
            - call: "POST /employees"
              payload: { worksite_id: "${ws_id}", work_area_id: "${wa_front_id}", full_name: "Ivan Petrov", job_function: "ADMIN", team_discipline: "SECURITY" }
              as: ProgramAdmin
              captures: { sec_id: $.data.id }
            - call: "POST /employees"
              payload: { worksite_id: "${ws_id}", work_area_id: "${wa_front_id}", full_name: "Grace Liu", job_function: "ADMIN", team_discipline: "OPERATIONS" }
              as: ProgramAdmin
              captures: { ops_id: $.data.id }
            - call: "POST /employees"
              payload: { worksite_id: "${ws_id}", work_area_id: "${wa_front_id}", full_name: "Nora Bell", job_function: "ADMIN", team_discipline: "CLINICAL" }
              as: ProgramAdmin
              captures: { clin_id: $.data.id }
            - call: "POST /employees"
              payload: { worksite_id: "${ws_id}", work_area_id: "${wa_front_id}", full_name: "Omar Haddad", job_function: "ADMIN", team_discipline: "LEGAL" }
              as: ProgramAdmin
              captures: { legal_id: $.data.id }
            - call: "POST /employees"
              payload: { worksite_id: "${ws_id}", work_area_id: "${wa_front_id}", full_name: "Priya Nair", job_function: "ADMIN" }
              as: ProgramAdmin
              captures: { hr_id: $.data.id }
            - call: "POST /employees"
              payload: { worksite_id: "${ws_id}", work_area_id: "${wa_front_id}", full_name: "Luis Vega", job_function: "ADMIN" }
              as: ProgramAdmin
              captures: { coord_id: $.data.id }
            - call: "POST /employees"
              payload: { worksite_id: "${ws_id}", work_area_id: "${wa_front_id}", full_name: "Ana Torres", job_function: "ADMIN" }
              as: ProgramAdmin
              captures: { rep_id: $.data.id }
            - call: "POST /employees"
              payload: { worksite_id: "${ws_id}", work_area_id: "${wa_front_id}", full_name: "Karl Frey", job_function: "ADMIN" }
              as: ProgramAdmin
              captures: { subj_id: $.data.id }
          trigger:
            - call: "POST /prevention-plans"
              payload: { effective_date: "2026-08-01T00:00:00Z", review_interval_days: 365 }
              as: SafetyOfficer
              as_user_id: "${so_id}"
              captures: { err: $.data.error_id }
            - call: "POST /prevention-plans"
              payload: { worksite_id: "00000000-0000-0000-0000-000000000000", effective_date: "2026-08-01T00:00:00Z" }
              as: SafetyOfficer
              as_user_id: "${so_id}"
              captures: { err: $.data.error_id }
          assert:
            - "The first trigger call returns HTTP 400 with $.data.error_id == ERR_INVALID_REQUEST"
            - "The second trigger call returns HTTP 404 with $.data.error_id == ERR_WORKSITE_NOT_FOUND, showing priority 4 fires before priority 6"
            - "GET /prevention-plans?worksite_id=${ws_id} returns total_count 0 - neither rejected call created a row"
      - name: prevention_plan_and_module_defaults_applied_when_fields_omitted
        claim_type: defaults
        grounds:
          - entities.PreventionPlan.fields.review_interval_days
          - entities.TrainingModule.fields.refresh_interval_days
          - entities.TrainingModule.fields.passing_score
          - entities.TrainingModule.fields.required_for_escort
          - entities.WorkArea.fields.public_access_flag
          - entities.WorkArea.fields.lone_worker_flag
          - entities.WorkArea.fields.night_shift_flag
          - endpoints[POST /prevention-plans]
          - endpoints[POST /training-modules]
          - endpoints[POST /work-areas]
        distinguishing_aspect: |
          Three creates omit every optional input field at once, so the declared 1.1 defaults have to
          be supplied by the server: review_interval_days 365, refresh_interval_days 365, passing_score 80,
          required_for_escort false and all three WorkArea exposure flags false.
        test_recipe:
          setup:
            - "Logical clock pinned to 2026-08-01T00:00:00Z."
            - "Worksite \"North Plant\" (employee_count 20) exists."
            - "One SECURITY-job_function Employee \"Sofia Ortiz\" backs the SafetyOfficer role."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-08-01T00:00:00Z" }
              as: ProgramAdmin
            - call: "POST /worksites"
              payload: { name: "North Plant", state_code: "CA", employee_count: 20 }
              as: ProgramAdmin
              captures: { ws_id: $.data.id }
            - call: "POST /work-areas"
              payload: { worksite_id: "${ws_id}", name: "Front Desk", job_function: "CASH_HANDLING", public_access_flag: true, lone_worker_flag: false, night_shift_flag: true, occupancy_cap: 8 }
              as: ProgramAdmin
              captures: { wa_front_id: $.data.id }
            - call: "POST /employees"
              payload: { worksite_id: "${ws_id}", work_area_id: "${wa_front_id}", full_name: "Sofia Ortiz", job_function: "SECURITY" }
              as: ProgramAdmin
              captures: { so_id: $.data.id }
          trigger:
            - call: "POST /work-areas"
              payload: { worksite_id: "${ws_id}", name: "Records Room", job_function: "ADMIN", occupancy_cap: 4 }
              as: ProgramAdmin
              captures: { wa_rec_id: $.data.id }
            - call: "POST /prevention-plans"
              payload: { worksite_id: "${ws_id}", effective_date: "2026-08-01T00:00:00Z" }
              as: SafetyOfficer
              as_user_id: "${so_id}"
