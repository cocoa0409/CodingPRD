              as: HRBusinessPartner
              as_user_id: "hrbp-1"
              captures: { cls_id: $.data.id }
            - call: "POST /eligibility-classifications/${cls_id}/submit"
              payload: {}
              as: HRBusinessPartner
              as_user_id: "hrbp-1"
            - call: "POST /eligibility-classifications/${cls_id}/decision"
              payload: { decision: "APPROVE" }
              as: PeopleManager
              as_user_id: "mgr-1"
            - call: "POST /remote-location-requests"
              payload: { employee_id: "${e1_id}", jurisdiction_code: "BR", data_classification_tier: "RESTRICTED", proposed_start_date: "2026-10-01" }
              as: HRBusinessPartner
              as_user_id: "hrbp-1"
              captures: { br_id: $.data.id }
            - call: "POST /remote-location-requests/${br_id}/tax-review"
              payload: { review_outcome: "CLEARED", licensing_gap_count: 3, tax_nexus_registration_cost_cents: 5000000 }
              as: HRBusinessPartner
