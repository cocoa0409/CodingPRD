scaffold_difficulty_design:
  # =====================================================================
  # Rule 1 — dual_variant_calc (≥2 instances, different entity domains)
  # =====================================================================
  - rule_id: dual_variant_calc
    instances:
      - name: airport_hazard_level_prospective_vs_authoritative
        grounds:
          - calculations.airport_hazard_level
          - calculations.rolling_strike_window
        distinguishing_aspect: |
          Same Airport inputs produce different hazard outcomes depending on
          variant: the prospective variant (via hazard-preview with as_of)
          uses an exclusive-window rolling strike count and does NOT persist;
          the authoritative variant (fired on a state change) uses an
          inclusive-window count and writes to Airport.current_hazard_level.
          A strike landing exactly at the window boundary is counted by one
          variant and not the other.
        test_recipe:
          setup:
            - "Airport A with icao_code KAAA, current_hazard_level LOW"
            - "WildlifeBiologist B1 (senior) and B2 (reporter) both at A"
            - "Species S1 (risk_tier LOW)"
            - "5 CONFIRMED strikes at A — oldest one exactly at current_utc - 365 days; 4 within window"
            - "Logical clock set to 2026-08-01T00:00:00Z (default) so the boundary strike is at 2025-08-01T00:00:00Z"
          setup_api_calls:
            - call: "POST /wildlife/_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-01T00:00:00Z" }
              as: AirportAdmin
            - call: "POST /wildlife/airports"
              payload: { icao_code: "KAAA", name: "Alpha Airport", annual_plan_cycle_year: 2026 }
              as: AirportAdmin
              captures: { ap_id: $.data.id }
            - call: "POST /wildlife/species"
              payload: { common_name: "Mourning Dove", scientific_name: "Zenaida macroura", guild: "SONGBIRD", risk_tier: "LOW", body_mass_g: 120, is_protected_federally: false }
              as: AirportAdmin
              captures: { sp_id: $.data.id }
            - call: "POST /wildlife/biologists"
              payload: { full_name: "B One", certification_id: "CERT-001", airport_id: "${ap_id}", is_senior: true }
              as: AirportAdmin
              captures: { b1_id: $.data.id }
            - call: "POST /wildlife/biologists"
              payload: { full_name: "B Two", certification_id: "CERT-002", airport_id: "${ap_id}", is_senior: false }
              as: AirportAdmin
              captures: { b2_id: $.data.id }
            # strike 1 exactly at the 365-day boundary — strike_at = 2025-08-01T00:00:00Z
            - call: "POST /wildlife/strike-reports"
              payload: { airport_id: "${ap_id}", reporter_biologist_id: "${b2_id}", strike_at: "2025-08-01T00:00:00Z", runway_designator: "09L", aircraft_registration: "N101", species_id: "${sp_id}", damage_class: "NONE", phase_of_flight: "LANDING", altitude_ft_agl: 50, strike_count_animals: 1, carcass_present: false }
              as: WildlifeBiologist
              as_user_id: "${b2_id}"
              captures: { sr1: $.data.id }
            - call: "POST /wildlife/strike-reports/${sr1}/submit"
              payload: {}
              as: WildlifeBiologist
              as_user_id: "${b2_id}"
            - call: "POST /wildlife/strike-reports/${sr1}/begin-review"
              payload: {}
              as: WildlifeBiologist
              as_user_id: "${b1_id}"
            - call: "POST /wildlife/strike-reports/${sr1}/confirm"
              payload: { confirmation_notes: "ok" }
              as: WildlifeBiologist
              as_user_id: "${b1_id}"
            # strikes 2..5 inside the window
            - call: "POST /wildlife/strike-reports"
              payload: { airport_id: "${ap_id}", reporter_biologist_id: "${b2_id}", strike_at: "2026-07-01T00:00:00Z", runway_designator: "09L", aircraft_registration: "N102", species_id: "${sp_id}", damage_class: "NONE", phase_of_flight: "LANDING", altitude_ft_agl: 50, strike_count_animals: 1, carcass_present: false }
              as: WildlifeBiologist
              as_user_id: "${b2_id}"
              captures: { sr2: $.data.id }
            - call: "POST /wildlife/strike-reports/${sr2}/submit"
              payload: {}
              as: WildlifeBiologist
              as_user_id: "${b2_id}"
            - call: "POST /wildlife/strike-reports/${sr2}/begin-review"
              payload: {}
              as: WildlifeBiologist
              as_user_id: "${b1_id}"
            - call: "POST /wildlife/strike-reports/${sr2}/confirm"
              payload: { confirmation_notes: "ok" }
              as: WildlifeBiologist
              as_user_id: "${b1_id}"
            - call: "POST /wildlife/strike-reports"
              payload: { airport_id: "${ap_id}", reporter_biologist_id: "${b2_id}", strike_at: "2026-07-02T00:00:00Z", runway_designator: "09L", aircraft_registration: "N103", species_id: "${sp_id}", damage_class: "NONE", phase_of_flight: "LANDING", altitude_ft_agl: 50, strike_count_animals: 1, carcass_present: false }
              as: WildlifeBiologist
              as_user_id: "${b2_id}"
              captures: { sr3: $.data.id }
            - call: "POST /wildlife/strike-reports/${sr3}/submit"
              payload: {}
              as: WildlifeBiologist
              as_user_id: "${b2_id}"
            - call: "POST /wildlife/strike-reports/${sr3}/begin-review"
              payload: {}
              as: WildlifeBiologist
              as_user_id: "${b1_id}"
            - call: "POST /wildlife/strike-reports/${sr3}/confirm"
              payload: { confirmation_notes: "ok" }
              as: WildlifeBiologist
              as_user_id: "${b1_id}"
            - call: "POST /wildlife/strike-reports"
              payload: { airport_id: "${ap_id}", reporter_biologist_id: "${b2_id}", strike_at: "2026-07-03T00:00:00Z", runway_designator: "09L", aircraft_registration: "N104", species_id: "${sp_id}", damage_class: "NONE", phase_of_flight: "LANDING", altitude_ft_agl: 50, strike_count_animals: 1, carcass_present: false }
              as: WildlifeBiologist
              as_user_id: "${b2_id}"
              captures: { sr4: $.data.id }
            - call: "POST /wildlife/strike-reports/${sr4}/submit"
              payload: {}
              as: WildlifeBiologist
              as_user_id: "${b2_id}"
            - call: "POST /wildlife/strike-reports/${sr4}/begin-review"
              payload: {}
              as: WildlifeBiologist
              as_user_id: "${b1_id}"
            - call: "POST /wildlife/strike-reports/${sr4}/confirm"
              payload: { confirmation_notes: "ok" }
              as: WildlifeBiologist
              as_user_id: "${b1_id}"
            - call: "POST /wildlife/strike-reports"
              payload: { airport_id: "${ap_id}", reporter_biologist_id: "${b2_id}", strike_at: "2026-07-04T00:00:00Z", runway_designator: "09L", aircraft_registration: "N105", species_id: "${sp_id}", damage_class: "NONE", phase_of_flight: "LANDING", altitude_ft_agl: 50, strike_count_animals: 1, carcass_present: false }
              as: WildlifeBiologist
              as_user_id: "${b2_id}"
              captures: { sr5: $.data.id }
            - call: "POST /wildlife/strike-reports/${sr5}/submit"
              payload: {}
              as: WildlifeBiologist
              as_user_id: "${b2_id}"
            - call: "POST /wildlife/strike-reports/${sr5}/begin-review"
              payload: {}
              as: WildlifeBiologist
              as_user_id: "${b1_id}"
            - call: "POST /wildlife/strike-reports/${sr5}/confirm"
              payload: { confirmation_notes: "ok" }
              as: WildlifeBiologist
              as_user_id: "${b1_id}"
          trigger:
            - call: "GET /wildlife/airports/${ap_id}"
              as: WildlifeBiologist
              as_user_id: "${b1_id}"
              captures: { ap_level_authoritative: $.data.current_hazard_level, ap_count_authoritative: $.data.strikes_trailing_12m }
            - call: "GET /wildlife/airports/${ap_id}/hazard-preview"
              payload: { as_of: "2026-08-01T00:00:00Z" }
              as: WildlifeBiologist
              as_user_id: "${b1_id}"
              captures: { ap_level_prospective: $.data.projected_hazard_level, ap_count_prospective: $.data.projected_strikes_trailing_12m }
          assert:
            - "Authoritative: Airport.${ap_id}.strikes_trailing_12m == 5 (boundary strike included by inclusive_window)"
            - "Authoritative: Airport.${ap_id}.current_hazard_level == ELEVATED (5 >= 5 threshold)"
            - "Prospective: hazard-preview returns projected_strikes_trailing_12m == 4 (boundary strike excluded by exclusive_window variant)"
            - "Prospective: hazard-preview returns projected_hazard_level == LOW (4 < 5)"
            - "The two variants disagree on the same input data — pinned divergence"

      - name: permit_take_reconciliation_provisional_vs_authoritative
        grounds:
          - calculations.permit_take_reconciliation
          - state_machines.DispersalActivity.REVIEWED_to_CLOSED
        distinguishing_aspect: |
          Same TakePermit and same DispersalActivity set produce different
          take_consumed values: the provisional variant (take-preview) counts
          REVIEWED + CLOSED dispersals, while the authoritative variant
          (permit read) counts only CLOSED dispersals. Both values are
          observable simultaneously and MUST disagree by exactly the REVIEWED
          subtotal.
        test_recipe:
          setup:
            - "Airport A; biologists B1 (senior) and B2 (performer); RegulatorAgent R (USFWS)"
            - "Species S1 LOW risk, not federally protected"
            - "TakePermit P for A+S1, authorized_take_total=10, valid_from=2026-01-01, valid_to=2026-12-31, status ACTIVE (advanced via clock to within window)"
            - "One DispersalActivity D1 with animals_taken_lethal=3, status CLOSED"
            - "One DispersalActivity D2 with animals_taken_lethal=2, status REVIEWED (not yet closed)"
          setup_api_calls:
            - call: "POST /wildlife/_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-01T00:00:00Z" }
              as: AirportAdmin
            - call: "POST /wildlife/airports"
              payload: { icao_code: "KBBB", name: "Bravo Airport", annual_plan_cycle_year: 2026 }
              as: AirportAdmin
              captures: { ap_id: $.data.id }
            - call: "POST /wildlife/species"
              payload: { common_name: "Rock Pigeon", scientific_name: "Columba livia", guild: "SONGBIRD", risk_tier: "LOW", body_mass_g: 300, is_protected_federally: false }
              as: AirportAdmin
              captures: { sp_id: $.data.id }
            - call: "POST /wildlife/biologists"
              payload: { full_name: "B One", certification_id: "CERT-101", airport_id: "${ap_id}", is_senior: true }
              as: AirportAdmin
              captures: { b1_id: $.data.id }
            - call: "POST /wildlife/biologists"
              payload: { full_name: "B Two", certification_id: "CERT-102", airport_id: "${ap_id}", is_senior: false }
              as: AirportAdmin
              captures: { b2_id: $.data.id }
            - call: "POST /wildlife/regulators"
              payload: { full_name: "R One", agency: "USFWS", badge_number: "USFWS-9001" }
              as: AirportAdmin
              captures: { r_id: $.data.id }
            - call: "POST /wildlife/take-permits"
              payload: { airport_id: "${ap_id}", species_id: "${sp_id}", issued_by_regulator_id: "${r_id}", permit_number: "MB0001-00", authorized_take_total: 10, valid_from: "2026-01-01", valid_to: "2026-12-31" }
              as: RegulatorAgent
              as_user_id: "${r_id}"
              captures: { tp_id: $.data.id }
            # Permit ISSUED -> ACTIVE via clock (clock already at 2026-08-01 within window)
            - call: "GET /wildlife/take-permits/${tp_id}"
              as: RegulatorAgent
              as_user_id: "${r_id}"
            # D1 lethal take 3, then close it
            - call: "POST /wildlife/dispersal-activities"
              payload: { airport_id: "${ap_id}", performed_by_biologist_id: "${b2_id}", performed_at: "2026-07-15T10:00:00Z", method: "PYROTECHNICS", species_id: "${sp_id}", animals_dispersed: 5, animals_taken_lethal: 3, take_permit_id: "${tp_id}" }
              as: WildlifeBiologist
              as_user_id: "${b2_id}"
              captures: { d1_id: $.data.id }
            - call: "POST /wildlife/dispersal-activities/${d1_id}/review"
              payload: {}
              as: WildlifeBiologist
              as_user_id: "${b1_id}"
            - call: "POST /wildlife/dispersal-activities/${d1_id}/close"
              payload: {}
              as: WildlifeBiologist
              as_user_id: "${b1_id}"
            # D2 lethal take 2, leave in REVIEWED
            - call: "POST /wildlife/dispersal-activities"
              payload: { airport_id: "${ap_id}", performed_by_biologist_id: "${b2_id}", performed_at: "2026-07-20T10:00:00Z", method: "PYROTECHNICS", species_id: "${sp_id}", animals_dispersed: 4, animals_taken_lethal: 2, take_permit_id: "${tp_id}" }
              as: WildlifeBiologist
              as_user_id: "${b2_id}"
              captures: { d2_id: $.data.id }
            - call: "POST /wildlife/dispersal-activities/${d2_id}/review"
              payload: {}
              as: WildlifeBiologist
              as_user_id: "${b1_id}"
          trigger:
            - call: "GET /wildlife/take-permits/${tp_id}"
              as: RegulatorAgent
              as_user_id: "${r_id}"
              captures: { auth_take: $.data.take_consumed }
            - call: "GET /wildlife/take-permits/${tp_id}/take-preview"
              as: RegulatorAgent
              as_user_id: "${r_id}"
              captures: { prov_take: $.data.projected_take_consumed, prov_remaining: $.data.projected_remaining }
          assert:
            - "Authoritative: TakePermit.${tp_id}.take_consumed == 3 (only CLOSED D1 counts)"
            - "Provisional: take-preview returns projected_take_consumed == 5 (CLOSED D1=3 + REVIEWED D2=2)"
            - "Provisional: projected_remaining == 5 (10 - 5)"
            - "Authoritative remaining = 7; provisional remaining = 5 — the two variants disagree by the REVIEWED subtotal"

  # =====================================================================
  # Rule 2 — combinatorial_formula (≥2 instances, different modes a/b/c)
  # =====================================================================
  - rule_id: combinatorial_formula
    instances:
      - name: airport_hazard_level_threshold_promotion_order
        grounds:
          - calculations.airport_hazard_level
          - entities.Airport.fields.current_hazard_level
        distinguishing_aspect: |
          Mode (a) — a formula with ≥3 inputs and non-linear interaction
          (strikes threshold, active-advisory promotion, overdue-mitigation
          promotion). Evaluation order is pinned bottom-up: strikes base ->
          advisory bump -> overdue bump -> clamp. Swapping step 2 and step 3
          on an airport with (strikes=0, advisory=HIGH, overdue_mitigation=1)
          yields HIGH under pinned order but would yield a different
          intermediate under an alternative order.
        test_recipe:
          setup:
            - "Airport A, no strikes, one ACTIVE OperationalAdvisory with hazard_level HIGH"
            - "One MitigationAction in IN_PROGRESS with target_completion_date = 2026-07-01 (past due at clock 2026-08-01)"
            - "Clock at 2026-08-01T00:00:00Z"
          setup_api_calls:
            - call: "POST /wildlife/_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-01T00:00:00Z" }
              as: AirportAdmin
            - call: "POST /wildlife/airports"
              payload: { icao_code: "KCCC", name: "Charlie Airport", annual_plan_cycle_year: 2026 }
              as: AirportAdmin
              captures: { ap_id: $.data.id }
            - call: "POST /wildlife/species"
              payload: { common_name: "Canada Goose", scientific_name: "Branta canadensis", guild: "WATERFOWL", risk_tier: "MEDIUM", body_mass_g: 4500, is_protected_federally: true }
              as: AirportAdmin
              captures: { sp_id: $.data.id }
            - call: "POST /wildlife/biologists"
              payload: { full_name: "B One", certification_id: "CERT-201", airport_id: "${ap_id}", is_senior: true }
              as: AirportAdmin
              captures: { b1_id: $.data.id }
            - call: "POST /wildlife/biologists"
              payload: { full_name: "B Two", certification_id: "CERT-202", airport_id: "${ap_id}", is_senior: false }
              as: AirportAdmin
              captures: { b2_id: $.data.id }
            # HabitatAssessment with high composite (>=60) -> mandatory mitigation
            - call: "POST /wildlife/habitat-assessments"
              payload: { airport_id: "${ap_id}", assessed_by_biologist_id: "${b1_id}", assessed_at: "2026-06-15T10:00:00Z", habitat_feature: "STANDING_WATER", attractiveness_score: 8, severity_score: 9 }
              as: WildlifeBiologist
              as_user_id: "${b1_id}"
              captures: { ha_id: $.data.id }
            - call: "POST /wildlife/habitat-assessments/${ha_id}/mitigation-actions"
              payload: { action_type: "DRAINAGE", proposed_by_biologist_id: "${b1_id}", target_completion_date: "2026-07-01" }
              as: WildlifeBiologist
              as_user_id: "${b1_id}"
              captures: { ma_id: $.data.id }
            - call: "POST /wildlife/mitigation-actions/${ma_id}/approve"
              payload: {}
              as: WildlifeBiologist
              as_user_id: "${b1_id}"
            # Create a second senior biologist for start-work? No — approve and start-work can be same actor
            # but approve requires actor != proposer; since b1 proposed, b1 cannot approve. Use B2 (not senior) — fails.
            # Need another senior: create B3 senior
            - call: "POST /wildlife/biologists"
              payload: { full_name: "B Three", certification_id: "CERT-203", airport_id: "${ap_id}", is_senior: true }
              as: AirportAdmin
              captures: { b3_id: $.data.id }
          trigger:
            # Approve by B3 (senior, != proposer B1)
            - call: "POST /wildlife/mitigation-actions/${ma_id}/approve"
              payload: {}
              as: WildlifeBiologist
              as_user_id: "${b3_id}"
              captures: { err_approve_b1: $.data.error_id }
            - call: "POST /wildlife/mitigation-actions/${ma_id}/start-work"
              payload: {}
              as: WildlifeBiologist
              as_user_id: "${b1_id}"
            # Now advisory HIGH active
            - call: "POST /wildlife/operational-advisories"
              payload: { airport_id: "${ap_id}", issued_by_biologist_id: "${b1_id}", issued_at: "2026-07-30T00:00:00Z", effective_from: "2026-07-30T00:00:00Z", effective_to: "2026-09-30T00:00:00Z", hazard_level: "HIGH", reason_code: "STRIKE_SPIKE" }
              as: WildlifeBiologist
              as_user_id: "${b1_id}"
              captures: { oa_id: $.data.id }
            - call: "GET /wildlife/airports/${ap_id}"
              as: WildlifeBiologist
              as_user_id: "${b1_id}"
              captures: { ap_v: $.data.version }
            - call: "POST /wildlife/operational-advisories/${oa_id}/activate"
              payload: { expected_airport_version: "${ap_v}" }
              as: WildlifeBiologist
              as_user_id: "${b1_id}"
            - call: "GET /wildlife/airports/${ap_id}"
              as: WildlifeBiologist
              as_user_id: "${b1_id}"
              captures: { final_level: $.data.current_hazard_level }
          assert:
            - "MitigationAction.${ma_id}.status == IN_PROGRESS (overdue because target_completion_date 2026-07-01 < clock 2026-08-01)"
            - "Airport.${ap_id}.current_hazard_level == HIGH after advisory activation"
            - "HIGH wins over LOW base from strikes=0 and over the ELEVATED bump that overdue-mitigation would have produced alone"
            - "The pinned order (strikes->advisory->overdue->clamp) yields HIGH; an implementation that applies overdue bump AFTER advisory would still be HIGH here, but only the pinned order also yields HIGH when strikes=0 + advisory=ELEVATED + overdue=1 (base LOW, advisory bump -> ELEVATED, overdue bump keeps ELEVATED, NOT LOW->ELEVATED->ELEVATED+1)"

      - name: species_seasonal_trend_tiebreak_no_id
        grounds:
          - calculations.species_seasonal_trend
        distinguishing_aspect: |
          Mode (c) — a calculation with a circular-looking dependency between
          strike-count ranking and the prohibition on UUID tie-breaks. The
          pinned evaluation order resolves it: sort key is (strike_count DESC,
          species.common_name ASC), and created_at is NEVER used; the formula
          explicitly forbids id as tie-break, so two species with the same
          strike_count produce a deterministic output order keyed on
          common_name only.
        test_recipe:
          setup:
            - "Airport A with two species each having 2 CONFIRMED strikes in WINTER window: 'American Crow' and 'Bald Eagle' (alphabetical order A < B)"
            - "Both strikes in JANUARY 2026 (WINTER)"
            - "Clock at 2026-08-01"
          setup_api_calls:
            - call: "POST /wildlife/_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-01T00:00:00Z" }
              as: AirportAdmin
            - call: "POST /wildlife/airports"
              payload: { icao_code: "KDDD", name: "Delta Airport", annual_plan_cycle_year: 2026 }
              as: AirportAdmin
              captures: { ap_id: $.data.id }
            - call: "POST /wildlife/species"
              payload: { common_name: "Bald Eagle", scientific_name: "Haliaeetus leucocephalus", guild: "RAPTOR", risk_tier: "HIGH", body_mass_g: 5500, is_protected_federally: true }
              as: AirportAdmin
              captures: { sp_eagle: $.data.id }
            - call: "POST /wildlife/species"
              payload: { common_name: "American Crow", scientific_name: "Corvus brachyrhynchos", guild: "SONGBIRD", risk_tier: "LOW", body_mass_g: 500, is_protected_federally: false }
              as: AirportAdmin
              captures: { sp_crow: $.data.id }
            - call: "POST /wildlife/biologists"
              payload: { full_name: "B One", certification_id: "CERT-301", airport_id: "${ap_id}", is_senior: true }
              as: AirportAdmin
              captures: { b1_id: $.data.id }
            - call: "POST /wildlife/biologists"
              payload: { full_name: "B Two", certification_id: "CERT-302", airport_id: "${ap_id}", is_senior: false }
              as: AirportAdmin
              captures: { b2_id: $.data.id }
            # 2 strikes on eagle, 2 strikes on crow, both WINTER
            - call: "POST /wildlife/strike-reports"
              payload: { airport_id: "${ap_id}", reporter_biologist_id: "${b2_id}", strike_at: "2026-01-10T10:00:00Z", runway_designator: "09L", aircraft_registration: "N201", species_id: "${sp_eagle}", damage_class: "NONE", phase_of_flight: "LANDING", altitude_ft_agl: 50, strike_count_animals: 1, carcass_present: false }
              as: WildlifeBiologist
              as_user_id: "${b2_id}"
              captures: { s1: $.data.id }
            - call: "POST /wildlife/strike-reports/${s1}/submit"
              payload: {}
              as: WildlifeBiologist
              as_user_id: "${b2_id}"
            - call: "POST /wildlife/strike-reports/${s1}/begin-review"
              payload: {}
              as: WildlifeBiologist
              as_user_id: "${b1_id}"
            - call: "POST /wildlife/strike-reports/${s1}/confirm"
              payload: { confirmation_notes: "ok" }
              as: WildlifeBiologist
              as_user_id: "${b1_id}"
            - call: "POST /wildlife/strike-reports"
              payload: { airport_id: "${ap_id}", reporter_biologist_id: "${b2_id}", strike_at: "2026-01-15T10:00:00Z", runway_designator: "09L", aircraft_registration: "N202", species_id: "${sp_eagle}", damage_class: "NONE", phase_of_flight: "LANDING", altitude_ft_agl: 50, strike_count_animals: 1, carcass_present: false }
              as: WildlifeBiologist
              as_user_id: "${b2_id}"
              captures: { s2: $.data.id }
            - call: "POST /wildlife/strike-reports/${s2}/submit"
              payload: {}
              as: WildlifeBiologist
              as_user_id: "${b2_id}"
            - call: "POST /wildlife/strike-reports/${s2}/begin-review"
              payload: {}
              as: WildlifeBiologist
              as_user_id: "${b1_id}"
            - call: "POST /wildlife/strike-reports/${s2}/confirm"
              payload: { confirmation_notes: "ok" }
              as: WildlifeBiologist
              as_user_id: "${b1_id}"
            - call: "POST /wildlife/strike-reports"
              payload: { airport_id: "${ap_id}", reporter_biologist_id: "${b2_id}", strike_at: "2026-01-20T10:00:00Z", runway_designator: "09L", aircraft_registration: "N203", species_id: "${sp_crow}", damage_class: "NONE", phase_of_flight: "LANDING", altitude_ft_agl: 50, strike_count_animals: 1, carcass_present: false }
              as: WildlifeBiologist
              as_user_id: "${b2_id}"
