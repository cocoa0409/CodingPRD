            - { call: "POST /vault/rentals", payload: { box_id: "${box_id}", renter_id: "${renter_id}", plan_term_months: 12 }, as: VaultAdmin, captures: { rental_id: "$.data.id" } }
            - { call: "POST /vault/rentals/${rental_id}/activate", payload: {}, as: VaultAdmin }
            - { call: "POST /vault/_clock/set_current_utc", payload: { to_iso8601: "2026-07-10T00:00:00Z" }, as: VaultAdmin }
            - { call: "POST /vault/_billing/run_cycle", payload: {}, as: VaultAdmin }
            - { call: "POST /vault/drilling-orders", payload: { box_id: "${box_id}", rental_id: "${rental_id}", reason: "DELINQUENCY" }, as: VaultAdmin, as_user_id: "admin-1", captures: { drill_id: "$.data.id" } }
          trigger:
            - { call: "POST /vault/drilling-orders/${drill_id}/approve", payload: {}, as: ComplianceOfficer, as_user_id: "admin-1", captures: { err: "$.data.error_id" } }
          assert:
            - "response error_id == ERR_SEGREGATION_OF_DUTIES"
            - "http_status == 403"

      - name: activate_before_kyc_verified
        claim_type: violation_to_error
        grounds:
          - state_machines.Rental.PENDING_to_ACTIVE
          - "errors[ERR_KYC_NOT_VERIFIED]"
        distinguishing_aspect: "Activating a rental whose renter KYC is still PENDING → ERR_KYC_NOT_VERIFIED (409)."
        test_recipe:
          setup: ["Rental PENDING, renter kyc_status PENDING (not verified)."]
          setup_api_calls:
            - { call: "POST /vault/branches", payload: { name: "Kyc", code: "KY1", viewing_room_capacity: 2 }, as: VaultAdmin, captures: { branch_id: "$.data.id" } }
            - { call: "POST /vault/box-types", payload: { size_class: "MEDIUM", annual_rate_cents: 24000, height_mm: 100, width_mm: 250, depth_mm: 500 }, as: VaultAdmin, captures: { bt_id: "$.data.id" } }
            - { call: "POST /vault/boxes", payload: { branch_id: "${branch_id}", box_type_id: "${bt_id}", box_number: "KY-1" }, as: VaultAdmin, captures: { box_id: "$.data.id" } }
            - { call: "POST /vault/renters", payload: { full_name: "Ken Yc", email: "ken@x.com", gov_id_ref: "G-45", date_of_birth: "1994-04-14" }, as: VaultAdmin, captures: { renter_id: "$.data.id" } }
            - { call: "POST /vault/rentals", payload: { box_id: "${box_id}", renter_id: "${renter_id}", plan_term_months: 12 }, as: VaultAdmin, captures: { rental_id: "$.data.id" } }
          trigger:
            - { call: "POST /vault/rentals/${rental_id}/activate", payload: {}, as: VaultAdmin, captures: { err: "$.data.error_id" } }
          assert:
            - "response error_id == ERR_KYC_NOT_VERIFIED"
            - "Rental(${rental_id}).status == PENDING"

  # ----------------------------------------------------------------------- rbac
  - section: rbac
    instances:
      - name: renter_cannot_run_billing_cycle
        claim_type: role_denial
        grounds:
          - roles
          - endpoints
          - "errors[ERR_FORBIDDEN_FOR_ROLE]"
        distinguishing_aspect: "POST /vault/_billing/run_cycle as Renter → ERR_FORBIDDEN_FOR_ROLE (403); it is VaultAdmin-only."
        test_recipe:
          setup: ["A registered renter to act as."]
          setup_api_calls:
            - { call: "POST /vault/renters", payload: { full_name: "Ren Ter", email: "ren@x.com", gov_id_ref: "G-46", date_of_birth: "1995-05-25" }, as: VaultAdmin, captures: { renter_id: "$.data.id" } }
          trigger:
            - { call: "POST /vault/_billing/run_cycle", payload: {}, as: Renter, as_user_id: "${renter_id}", captures: { err: "$.data.error_id" } }
          assert:
            - "response error_id == ERR_FORBIDDEN_FOR_ROLE"
            - "http_status == 403"

      - name: officer_cannot_create_branch
        claim_type: role_denial
        grounds:
          - roles
          - endpoints
          - "errors[ERR_FORBIDDEN_FOR_ROLE]"
        distinguishing_aspect: "POST /vault/branches as VaultOfficer → ERR_FORBIDDEN_FOR_ROLE (403); branch creation is VaultAdmin-only."
        test_recipe:
          setup: ["Empty DB."]
          setup_api_calls: []
          trigger:
            - { call: "POST /vault/branches", payload: { name: "Nope", code: "NP1", viewing_room_capacity: 2 }, as: VaultOfficer, captures: { err: "$.data.error_id" } }
