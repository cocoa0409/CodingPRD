# =============================================================================
# Campus Housing & Dorm Assignment — benchmark seed tables (Expert)
# =============================================================================

scenario: |
  390. Campus Housing & Dorm Assignment: room/building inventory & type,
  application & priority (class year/lottery), roommate matching & preference,
  assignment & swap/waitlist, meal-plan linkage, damage/check-out billing,
  RA/incident, break housing

domain_name: campus-housing-dorm-assignment
api_prefix: ""
# Flat peer-entity topology: every entity has a top-level collection
# (/buildings, /rooms, /students, /housing-cycles, /applications,
# /roommate-groups, /roommate-memberships, /assignments, /meal-plans,
# /waitlist-entries, /damage-charges, /incident-reports,
# /break-housing-requests). Building -> Room is the one nested
# inventory relationship; everything else links by foreign key.

# =============================================================================
# Complexity Profile
# =============================================================================
complexity_profile:
  primary_archetype: quota_allocation
  secondary_archetype: temporal_windowing
  complexity_layers:
    - optimistic_concurrency
    - cascading_side_effects
    - dual_variant_calculation
    - derived_field_reconciliation

  entity_topology: hybrid
  # Building -> Room (strict hierarchy for inventory) plus flat cross-cutting
  # entities (Student, Application, RoommateGroup, Assignment, MealPlan,
  # WaitlistEntry, DamageCharge, IncidentReport, BreakHousingRequest) that
  # reference Room/Student/Assignment via foreign keys.

  state_machine_shape: branching
  # Application: branching (DRAFT -> SUBMITTED -> {OFFERED, WAITLISTED} ...).
  # RoommateGroup: cyclic (FORMING <-> negotiation rounds via invite/decline).
  # Room.posture: compound/derived from beds + open incidents + damage.

  relationship_patterns:
    - one_to_many        # Building -> Room, Room -> Assignment(bed), Student -> Application
    - many_to_many       # Student <-> RoommateGroup (members), Assignment <-> MealPlan
    - self_referential   # Assignment.swap_counterparty_assignment_id -> Assignment.id
    - cross_aggregate    # Assignment references Room (Building aggregate) and Student aggregate

  role_model: peer_roles
  # HousingOfficer (operator, opaque) owns inventory/lottery/billing.
  # Student (entity_backed:Student) owns own applications, preferences, swaps.
  # ResidentAdvisor (entity_backed:Student) owns incident reports for assigned building.

  consistency_model: immediate

# =============================================================================
# Table 1: Entity-Relationship Table
# =============================================================================
entities:
  - name: Building
    parent: null
    common_fields: true
    fields:
      - { name: id, type: string, source: system, description: "Server-minted UUID, identity only" }
      - { name: name, type: string, source: input, description: "Building display name" }
      - { name: building_type, type: enum, source: input, description: "Allowed values: TRADITIONAL, SUITE, APARTMENT. Drives default room type and break-housing eligibility.", constraints: "one of {TRADITIONAL, SUITE, APARTMENT}" }
      - { name: offers_break_housing, type: boolean, source: input, description: "Whether rooms in this building may host BreakHousingRequest occupancy", default: false }
      - { name: break_housing_capacity, type: integer, source: input, description: "Max simultaneous APPROVED break occupants across all rooms in this building (aggregate-capacity overlap ceiling)", default: 0, constraints: ">= 0" }
      - { name: total_bed_count, type: integer, source: computed, description: "Sum of Room.bed_capacity over Rooms whose status != OFFLINE in this building" }
      - { name: occupied_bed_count, type: integer, source: computed, description: "Count of Assignment in {OFFERED, ACTIVE} whose room belongs to this building" }
      - { name: created_at, type: datetime, source: system, description: "ISO 8601 UTC, three fractional digits" }
      - { name: updated_at, type: datetime, source: system, description: "Refreshed on every mutation including cascades" }
      - { name: version, type: integer, source: system, description: "OCC version, starts at 1, +1 per mutation" }

  - name: Room
    parent: Building
    common_fields: true
    fields:
      - { name: id, type: string, source: system, description: "Server-minted UUID, identity only" }
      - { name: building_id, type: string, source: system, description: "FK -> Building.id; owning building, set from path on create" }
      - { name: room_number, type: string, source: input, description: "Room label, unique within building" }
      - { name: room_type, type: enum, source: input, description: "Allowed values: SINGLE, DOUBLE, TRIPLE, SUITE_DOUBLE. Determines bed_capacity.", constraints: "one of {SINGLE, DOUBLE, TRIPLE, SUITE_DOUBLE}" }
      - { name: bed_capacity, type: integer, source: computed, description: "Derived from room_type: SINGLE=1, DOUBLE=2, TRIPLE=3, SUITE_DOUBLE=2" }
      - { name: gender_inclusivity, type: enum, source: input, description: "Allowed values: SINGLE_GENDER, ALL_GENDER. Constrains which Students may be assigned together.", constraints: "one of {SINGLE_GENDER, ALL_GENDER}" }
      - { name: nightly_break_rate_cents, type: integer, source: input, description: "Per-night charge for break housing occupancy in this room", default: 4500 }
      - { name: occupied_bed_count, type: integer, source: computed, description: "Count of Assignment in {OFFERED, ACTIVE} on this room" }
      - { name: open_incident_count, type: integer, source: computed, description: "Count of IncidentReport on this room with status in {OPEN, ESCALATED}" }
      - { name: status, type: enum, source: computed, description: "OPEN | RESTRICTED | OFFLINE. Posture derived from incidents/damage; OFFLINE only via take-offline action.", constraints: "one of {OPEN, RESTRICTED, OFFLINE}" }
      - { name: created_at, type: datetime, source: system, description: "ISO 8601 UTC, three fractional digits" }
      - { name: updated_at, type: datetime, source: system, description: "Refreshed on every mutation including cascades" }
      - { name: version, type: integer, source: system, description: "OCC version, starts at 1, +1 per mutation" }

  - name: Student
    parent: null
    common_fields: true
    fields:
      - { name: id, type: string, source: system, description: "Server-minted UUID, identity only" }
      - { name: full_name, type: string, source: input, description: "Student name" }
      - { name: class_year, type: enum, source: input, description: "Allowed values: FRESHMAN, SOPHOMORE, JUNIOR, SENIOR. Drives priority_rank.", constraints: "one of {FRESHMAN, SOPHOMORE, JUNIOR, SENIOR}" }
      - { name: gender_identity, type: enum, source: input, description: "Allowed values: MALE, FEMALE, NONBINARY. Used in gender_inclusivity compatibility checks.", constraints: "one of {MALE, FEMALE, NONBINARY}" }
      - { name: lottery_number, type: integer, source: input, description: "Tie-break seed for same-class-year priority; smaller wins. Caller supplies a draw value.", constraints: ">= 1" }
      - { name: account_balance_cents, type: integer, source: computed, description: "Sum of unpaid DamageCharge.amount_cents plus accrued break-housing charges for this student", default: 0 }
      - { name: status, type: enum, source: system, description: "ACTIVE | HOLD. HOLD blocks new applications and offers.", constraints: "one of {ACTIVE, HOLD}", default: ACTIVE }
      - { name: created_at, type: datetime, source: system, description: "ISO 8601 UTC, three fractional digits" }
      - { name: updated_at, type: datetime, source: system, description: "Refreshed on every mutation including cascades" }
      - { name: version, type: integer, source: system, description: "OCC version, starts at 1, +1 per mutation" }

  - name: HousingCycle
    parent: null
    common_fields: true
    fields:
      - { name: id, type: string, source: system, description: "Server-minted UUID, identity only" }
      - { name: term_label, type: string, source: input, description: "e.g. FALL_2026" }
      - { name: phase, type: enum, source: computed, description: "APPLICATION_OPEN | LOTTERY_RUN | ASSIGNMENT_OPEN | CLOSED. Advances only via run_lottery and close actions.", constraints: "one of {APPLICATION_OPEN, LOTTERY_RUN, ASSIGNMENT_OPEN, CLOSED}" }
      - { name: lottery_run_index, type: integer, source: system, description: "Monotonic epoch counter; increments on each run_lottery", default: 0 }
      - { name: created_at, type: datetime, source: system, description: "ISO 8601 UTC, three fractional digits" }
      - { name: updated_at, type: datetime, source: system, description: "Refreshed on every mutation including cascades" }
      - { name: version, type: integer, source: system, description: "OCC version, starts at 1, +1 per mutation" }

  - name: Application
    parent: null
    common_fields: true
    fields:
      - { name: id, type: string, source: system, description: "Server-minted UUID, identity only" }
      - { name: cycle_id, type: string, source: input, description: "FK -> HousingCycle.id; the cycle this application competes in" }
      - { name: student_id, type: string, source: input, description: "FK -> Student.id; the applicant" }
      - { name: roommate_group_id, type: string, source: input, description: "FK -> RoommateGroup.id; nullable, set when applicant joins a LOCKED group before lottery", default: null }
      - { name: preferred_building_type, type: enum, source: input, description: "Allowed values: TRADITIONAL, SUITE, APARTMENT, NO_PREFERENCE. Selector input for offer matching.", constraints: "one of {TRADITIONAL, SUITE, APARTMENT, NO_PREFERENCE}" }
      - { name: preferred_room_type, type: enum, source: input, description: "Allowed values: SINGLE, DOUBLE, TRIPLE, SUITE_DOUBLE, NO_PREFERENCE.", constraints: "one of {SINGLE, DOUBLE, TRIPLE, SUITE_DOUBLE, NO_PREFERENCE}" }
      - { name: priority_rank, type: integer, source: computed, description: "Computed at submit from class_year (SENIOR=1..FRESHMAN=4); lower is better. See calc application_priority_rank." }
      - { name: status, type: enum, source: system, description: "DRAFT | SUBMITTED | OFFERED | WAITLISTED | ACCEPTED | DECLINED | WITHDRAWN | EXPIRED.", constraints: "one of {DRAFT, SUBMITTED, OFFERED, WAITLISTED, ACCEPTED, DECLINED, WITHDRAWN, EXPIRED}" }
      - { name: offered_room_id, type: string, source: system, description: "FK -> Room.id; room selected by the lottery offer, null until OFFERED", default: null }
      - { name: offer_lottery_index, type: integer, source: system, description: "lottery_run_index value at which the current offer was minted, null until OFFERED", default: null }
      - { name: created_at, type: datetime, source: system, description: "ISO 8601 UTC, three fractional digits" }
      - { name: updated_at, type: datetime, source: system, description: "Refreshed on every mutation including cascades" }
      - { name: version, type: integer, source: system, description: "OCC version, starts at 1, +1 per mutation" }

  - name: RoommateGroup
    parent: null
    common_fields: true
    fields:
      - { name: id, type: string, source: system, description: "Server-minted UUID, identity only" }
      - { name: cycle_id, type: string, source: input, description: "FK -> HousingCycle.id; cycle the group competes in" }
      - { name: owner_student_id, type: string, source: input, description: "FK -> Student.id; group creator, auto-member with ACCEPTED membership" }
      - { name: target_size, type: integer, source: input, description: "Intended member count; must be 2..3 (matches DOUBLE/TRIPLE capacities)", constraints: "2 <= target_size <= 3" }
      - { name: accepted_member_count, type: integer, source: computed, description: "Count of RoommateMembership rows on this group with membership_status=ACCEPTED" }
      - { name: status, type: enum, source: system, description: "FORMING | LOCKED | DISBANDED. FORMING permits invite/accept/decline rounds; LOCKED freezes membership.", constraints: "one of {FORMING, LOCKED, DISBANDED}" }
      - { name: created_at, type: datetime, source: system, description: "ISO 8601 UTC, three fractional digits" }
      - { name: updated_at, type: datetime, source: system, description: "Refreshed on every mutation including cascades" }
      - { name: version, type: integer, source: system, description: "OCC version, starts at 1, +1 per mutation" }

  - name: RoommateMembership
    parent: RoommateGroup
    common_fields: true
    fields:
      - { name: id, type: string, source: system, description: "Server-minted UUID, identity only" }
      - { name: group_id, type: string, source: system, description: "FK -> RoommateGroup.id; owning group, set from path on create" }
      - { name: student_id, type: string, source: input, description: "FK -> Student.id; invited student" }
      - { name: membership_status, type: enum, source: system, description: "INVITED | ACCEPTED | DECLINED | REMOVED.", constraints: "one of {INVITED, ACCEPTED, DECLINED, REMOVED}" }
      - { name: created_at, type: datetime, source: system, description: "ISO 8601 UTC, three fractional digits" }
      - { name: updated_at, type: datetime, source: system, description: "Refreshed on every mutation including cascades" }
      - { name: version, type: integer, source: system, description: "OCC version, starts at 1, +1 per mutation" }

  - name: Assignment
    parent: null
    common_fields: true
    fields:
      - { name: id, type: string, source: system, description: "Server-minted UUID, identity only" }
      - { name: room_id, type: string, source: input, description: "FK -> Room.id; assigned room (one bed)" }
      - { name: student_id, type: string, source: input, description: "FK -> Student.id; resident" }
      - { name: application_id, type: string, source: input, description: "FK -> Application.id; the accepted application that produced this assignment" }
      - { name: swap_counterparty_assignment_id, type: string, source: system, description: "FK -> Assignment.id; the other leg of an in-progress swap, null otherwise", default: null }
      - { name: status, type: enum, source: system, description: "ACTIVE | SWAP_PENDING | VACATED | CHECKED_OUT. An Assignment is minted directly as ACTIVE on offer-accept; the pre-accept reservation lives on the Application (status OFFERED), not here.", constraints: "one of {ACTIVE, SWAP_PENDING, VACATED, CHECKED_OUT}" }
      - { name: checkout_total_cents, type: integer, source: computed, description: "Sum of DamageCharge.amount_cents linked to this assignment, computed at check-out, null until CHECKED_OUT", default: null }
      - { name: created_at, type: datetime, source: system, description: "ISO 8601 UTC, three fractional digits" }
      - { name: updated_at, type: datetime, source: system, description: "Refreshed on every mutation including cascades" }
      - { name: version, type: integer, source: system, description: "OCC version, starts at 1, +1 per mutation" }

  - name: MealPlan
    parent: null
    common_fields: true
    fields:
      - { name: id, type: string, source: system, description: "Server-minted UUID, identity only" }
      - { name: assignment_id, type: string, source: input, description: "FK -> Assignment.id; the housing assignment this plan is linked to (1:1)" }
      - { name: tier, type: enum, source: input, description: "Allowed values: NONE, COMMUTER, STANDARD, UNLIMITED. Drives weekly_fee_cents.", constraints: "one of {NONE, COMMUTER, STANDARD, UNLIMITED}" }
      - { name: weekly_fee_cents, type: integer, source: computed, description: "Derived from tier: NONE=0, COMMUTER=4000, STANDARD=9000, UNLIMITED=13500" }
      - { name: status, type: enum, source: system, description: "ACTIVE | CANCELLED. CANCELLED when its assignment leaves ACTIVE.", constraints: "one of {ACTIVE, CANCELLED}" }
      - { name: created_at, type: datetime, source: system, description: "ISO 8601 UTC, three fractional digits" }
      - { name: updated_at, type: datetime, source: system, description: "Refreshed on every mutation including cascades" }
      - { name: version, type: integer, source: system, description: "OCC version, starts at 1, +1 per mutation" }

  - name: WaitlistEntry
    parent: null
    common_fields: true
    fields:
      - { name: id, type: string, source: system, description: "Server-minted UUID, identity only" }
      - { name: cycle_id, type: string, source: input, description: "FK -> HousingCycle.id; cycle scope of this waitlist" }
      - { name: application_id, type: string, source: input, description: "FK -> Application.id; the waitlisted application" }
      - { name: priority_rank_snapshot, type: integer, source: system, description: "Copy of Application.priority_rank at waitlist time; queue sort key (asc)" }
      - { name: lottery_number_snapshot, type: integer, source: system, description: "Copy of Student.lottery_number at waitlist time; tie-break (asc)" }
      - { name: status, type: enum, source: system, description: "QUEUED | PROMOTED | CANCELLED.", constraints: "one of {QUEUED, PROMOTED, CANCELLED}" }
      - { name: created_at, type: datetime, source: system, description: "ISO 8601 UTC, three fractional digits" }
      - { name: updated_at, type: datetime, source: system, description: "Refreshed on every mutation including cascades" }
      - { name: version, type: integer, source: system, description: "OCC version, starts at 1, +1 per mutation" }

  - name: DamageCharge
    parent: null
    common_fields: true
    fields:
      - { name: id, type: string, source: system, description: "Server-minted UUID, identity only" }
      - { name: assignment_id, type: string, source: input, description: "FK -> Assignment.id; the assignment whose resident is billed" }
      - { name: room_id, type: string, source: system, description: "FK -> Room.id; copied from the assignment for room-level damage tracking" }
      - { name: category, type: enum, source: input, description: "Allowed values: CLEANING, REPAIR, REPLACEMENT, LOST_KEY. Drives base assessment.", constraints: "one of {CLEANING, REPAIR, REPLACEMENT, LOST_KEY}" }
      - { name: assessed_cents, type: integer, source: input, description: "Raw assessed amount before shared-room split" }
      - { name: amount_cents, type: integer, source: computed, description: "Final billed amount after damage_billing_split; what hits Student.account_balance_cents" }
      - { name: split_basis, type: enum, source: input, description: "Allowed values: SOLE, SHARED. SHARED divides assessed across ACTIVE occupants of the room.", constraints: "one of {SOLE, SHARED}" }
      - { name: status, type: enum, source: system, description: "PENDING | BILLED | WAIVED | PAID.", constraints: "one of {PENDING, BILLED, WAIVED, PAID}" }
      - { name: created_at, type: datetime, source: system, description: "ISO 8601 UTC, three fractional digits" }
      - { name: updated_at, type: datetime, source: system, description: "Refreshed on every mutation including cascades" }
      - { name: version, type: integer, source: system, description: "OCC version, starts at 1, +1 per mutation" }

  - name: IncidentReport
    parent: null
    common_fields: true
    fields:
      - { name: id, type: string, source: system, description: "Server-minted UUID, identity only" }
      - { name: room_id, type: string, source: input, description: "FK -> Room.id; room where the incident occurred" }
      - { name: reporter_student_id, type: string, source: input, description: "FK -> Student.id; the ResidentAdvisor (a Student) who filed it" }
      - { name: severity, type: enum, source: input, description: "Allowed values: MINOR, MAJOR, CRITICAL. CRITICAL restricts the room; MAJOR escalation may.", constraints: "one of {MINOR, MAJOR, CRITICAL}" }
      - { name: status, type: enum, source: system, description: "OPEN | ESCALATED | RESOLVED.", constraints: "one of {OPEN, ESCALATED, RESOLVED}" }
      - { name: created_at, type: datetime, source: system, description: "ISO 8601 UTC, three fractional digits" }
      - { name: updated_at, type: datetime, source: system, description: "Refreshed on every mutation including cascades" }
      - { name: version, type: integer, source: system, description: "OCC version, starts at 1, +1 per mutation" }

  - name: BreakHousingRequest
    parent: null
    common_fields: true
    fields:
      - { name: id, type: string, source: system, description: "Server-minted UUID, identity only" }
      - { name: assignment_id, type: string, source: input, description: "FK -> Assignment.id; the resident's term assignment, gives the room to occupy" }
      - { name: room_id, type: string, source: system, description: "FK -> Room.id; copied from the assignment's room" }
      - { name: check_in_date, type: datetime, source: input, description: "Break occupancy start (inclusive), date at 00:00:00Z" }
      - { name: check_out_date, type: datetime, source: input, description: "Break occupancy end (exclusive), date at 00:00:00Z; must be > check_in_date" }
      - { name: night_count, type: integer, source: computed, description: "Whole nights between check_in_date and check_out_date (half-open)" }
      - { name: total_charge_cents, type: integer, source: computed, description: "night_count * Room.nightly_break_rate_cents, computed at approval" }
      - { name: status, type: enum, source: system, description: "REQUESTED | APPROVED | DENIED | CANCELLED.", constraints: "one of {REQUESTED, APPROVED, DENIED, CANCELLED}" }
      - { name: created_at, type: datetime, source: system, description: "ISO 8601 UTC, three fractional digits" }
      - { name: updated_at, type: datetime, source: system, description: "Refreshed on every mutation including cascades" }
      - { name: version, type: integer, source: system, description: "OCC version, starts at 1, +1 per mutation" }

# =============================================================================
# Table 2: State Machine Table
# =============================================================================
state_machines:
  - entity: HousingCycle
    field: phase
    initial_state: APPLICATION_OPEN
    terminal_states: [CLOSED]
    note: "Linear with one batch action (run_lottery) that drives Application offers."
    transitions:
      - from: APPLICATION_OPEN
        to: LOTTERY_RUN
        trigger: "POST /housing-cycles/{cycle_id}/run-lottery"
        actor: HousingOfficer
        preconditions:
          - "phase == APPLICATION_OPEN"
        side_effects:
          - "lottery_run_index += 1"
          - "Run lottery_offer_selection: SUBMITTED Applications ordered by (priority_rank ASC, lottery_number ASC, created_at ASC) each receive an offer of one bed in a matching OPEN Room, or are WAITLISTED when no matching room remains"
          - "For each offered Application: status SUBMITTED -> OFFERED, set offered_room_id and offer_lottery_index = lottery_run_index"
          - "For each non-offered Application: status SUBMITTED -> WAITLISTED and a WaitlistEntry (status QUEUED) is created with priority_rank_snapshot and lottery_number_snapshot"

      - from: LOTTERY_RUN
        to: ASSIGNMENT_OPEN
        trigger: "POST /housing-cycles/{cycle_id}/open-assignment"
        actor: HousingOfficer
        preconditions:
          - "phase == LOTTERY_RUN"
        side_effects: []

      - from: ASSIGNMENT_OPEN
        to: CLOSED
        trigger: "POST /housing-cycles/{cycle_id}/close"
        actor: HousingOfficer
        preconditions:
          - "phase == ASSIGNMENT_OPEN"
        side_effects:
          - "Every Application still in OFFERED -> EXPIRED (cascade): its offered_room_id bed is released and any QUEUED WaitlistEntry is left for the next cycle"

  - entity: Application
    field: status
    initial_state: DRAFT
    terminal_states: [DECLINED, WITHDRAWN, EXPIRED]
    note: "Branching at lottery: SUBMITTED forks to OFFERED or WAITLISTED; OFFERED forks to ACCEPTED or DECLINED."
    transitions:
      - from: DRAFT
        to: SUBMITTED
        trigger: "POST /applications/{application_id}/submit"
        actor: Student
        preconditions:
          - "cycle.phase == APPLICATION_OPEN"
          - "student.status == ACTIVE"
          - "if roommate_group_id set: that RoommateGroup.status == LOCKED and the student is an ACCEPTED member"
        side_effects:
          - "Compute priority_rank from student.class_year (application_priority_rank)"

      - from: SUBMITTED
        to: OFFERED
        trigger: "system (run_lottery offer)"
        actor: system
        preconditions:
          - "A matching OPEN Room with a free bed exists for this Application during the lottery sweep"
        side_effects:
          - "Set offered_room_id and offer_lottery_index"
          - "Room.occupied_bed_count increments (bed reserved by the offer); Room.status may flip OPEN -> RESTRICTED when occupied_bed_count == bed_capacity"

      - from: SUBMITTED
        to: WAITLISTED
        trigger: "system (run_lottery, no matching room)"
        actor: system
        preconditions:
          - "No matching OPEN Room with a free bed remains during the lottery sweep"
        side_effects:
          - "Create WaitlistEntry (status QUEUED) with priority_rank_snapshot and lottery_number_snapshot"

      - from: OFFERED
        to: ACCEPTED
        trigger: "POST /applications/{application_id}/accept"
        actor: Student
        preconditions:
          - "cycle.phase == ASSIGNMENT_OPEN"
          - "offer_lottery_index == cycle.lottery_run_index (offer not stale)"
          - "student.status == ACTIVE"
        side_effects:
          - "Create Assignment (status ACTIVE) on offered_room_id for this student"
          - "Create MealPlan (tier STANDARD, status ACTIVE) linked to the new Assignment"

      - from: OFFERED
        to: DECLINED
        trigger: "POST /applications/{application_id}/decline"
        actor: Student
        preconditions:
          - "cycle.phase == ASSIGNMENT_OPEN"
        side_effects:
          - "Release the offered bed: Room.occupied_bed_count decrements; Room.status may flip RESTRICTED -> OPEN"
          - "Promote head of the cycle waitlist (waitlist_promotion): the QUEUED WaitlistEntry with the best (priority_rank_snapshot ASC, lottery_number_snapshot ASC, created_at ASC) whose Application can match the freed Room -> its Application WAITLISTED -> OFFERED on that Room, WaitlistEntry -> PROMOTED; if none match, the bed stays free"

      - from: SUBMITTED
        to: WITHDRAWN
        trigger: "POST /applications/{application_id}/withdraw"
        actor: Student
        preconditions:
          - "cycle.phase in {APPLICATION_OPEN, LOTTERY_RUN}"
        side_effects: []

      - from: OFFERED
        to: EXPIRED
        trigger: "system (cycle close)"
        actor: system
        preconditions:
          - "cycle.phase transition ASSIGNMENT_OPEN -> CLOSED"
        side_effects:
          - "Release the offered bed: Room.occupied_bed_count decrements; Room.status may flip RESTRICTED -> OPEN"

  - entity: RoommateGroup
    field: status
    initial_state: FORMING
    terminal_states: [DISBANDED]
    note: "Cyclic negotiation: invite/accept/decline rounds keep FORMING; lock freezes; disband from any non-terminal."
    transitions:
      - from: FORMING
        to: LOCKED
        trigger: "POST /roommate-groups/{group_id}/lock"
        actor: Student
        preconditions:
          - "accepted_member_count == target_size"
          - "actor is owner_student_id"
        side_effects:
          - "Freeze membership: no further invite/accept/decline accepted while LOCKED"

      - from: LOCKED
        to: FORMING
        trigger: "POST /roommate-groups/{group_id}/reopen"
        actor: Student
        preconditions:
          - "actor is owner_student_id"
          - "No Application referencing this group is in {SUBMITTED, OFFERED, ACCEPTED}"
        side_effects:
          - "Membership editable again"

      - from: [FORMING, LOCKED]
        to: DISBANDED
        trigger: "POST /roommate-groups/{group_id}/disband"
        actor: Student
        preconditions:
          - "actor is owner_student_id"
          - "No Application referencing this group is in {OFFERED, ACCEPTED}"
        side_effects:
          - "All RoommateMembership with status in {INVITED, ACCEPTED} -> REMOVED"
          - "Any SUBMITTED Application referencing this group keeps competing solo (roommate_group_id cleared to null)"

  - entity: RoommateMembership
    field: membership_status
    initial_state: INVITED
    terminal_states: [DECLINED, REMOVED]
    note: "Owner membership starts ACCEPTED; invitee memberships start INVITED."
    transitions:
      - from: INVITED
        to: ACCEPTED
        trigger: "POST /roommate-groups/{group_id}/memberships/{membership_id}/accept"
        actor: Student
        preconditions:
          - "group.status == FORMING"
          - "actor is this membership's student_id"
          - "accepted_member_count < target_size"
        side_effects:
          - "RoommateGroup.accepted_member_count increments"

      - from: INVITED
        to: DECLINED
        trigger: "POST /roommate-groups/{group_id}/memberships/{membership_id}/decline"
        actor: Student
        preconditions:
          - "group.status == FORMING"
          - "actor is this membership's student_id"
        side_effects: []

      - from: ACCEPTED
        to: REMOVED
        trigger: "POST /roommate-groups/{group_id}/memberships/{membership_id}/remove"
        actor: Student
        preconditions:
          - "group.status == FORMING"
          - "actor is owner_student_id"
          - "membership's student_id != owner_student_id"
        side_effects:
          - "RoommateGroup.accepted_member_count decrements"

  - entity: Assignment
    field: status
    initial_state: ACTIVE
    terminal_states: [CHECKED_OUT]
    note: "Cyclic via swap (ACTIVE -> SWAP_PENDING -> ACTIVE). VACATED on swap completion of the absorbed leg; CHECKED_OUT terminal."
    transitions:
      - from: ACTIVE
        to: SWAP_PENDING
        trigger: "POST /assignments/{assignment_id}/propose-swap"
        actor: Student
        preconditions:
          - "actor is this assignment's student_id"
          - "cycle.phase == ASSIGNMENT_OPEN"
          - "counterparty Assignment exists and is ACTIVE"
          - "both rooms have gender_inclusivity compatible with both students (room_gender_compatibility)"
        side_effects:
          - "This assignment.status -> SWAP_PENDING, set swap_counterparty_assignment_id"
          - "Counterparty assignment.status ACTIVE -> SWAP_PENDING, set its swap_counterparty_assignment_id to this assignment"

      - from: SWAP_PENDING
        to: ACTIVE
        trigger: "POST /assignments/{assignment_id}/confirm-swap"
        actor: Student
        preconditions:
          - "actor is this assignment's student_id (the confirming party, who must be the leg that did NOT propose the swap)"
          - "this assignment.status == SWAP_PENDING and swap_counterparty_assignment_id set"
        side_effects:
          - "Swap room_id between the two assignments (students exchange rooms)"
          - "Both assignments.status SWAP_PENDING -> ACTIVE, swap_counterparty_assignment_id cleared on both"
          - "Each Room.occupied_bed_count is unchanged in total but recomputed per room; Room.status re-derived on both rooms"

      - from: SWAP_PENDING
        to: ACTIVE
        trigger: "POST /assignments/{assignment_id}/cancel-swap"
        actor: Student
        preconditions:
          - "actor is this assignment's student_id OR the counterparty's student_id"
        side_effects:
          - "Both legs revert: status SWAP_PENDING -> ACTIVE, swap_counterparty_assignment_id cleared on both; no room change"

      - from: ACTIVE
        to: VACATED
        trigger: "POST /assignments/{assignment_id}/vacate"
        actor: HousingOfficer
        preconditions:
          - "status == ACTIVE"
        side_effects:
          - "Room.occupied_bed_count decrements; Room.status may flip RESTRICTED -> OPEN"
          - "Linked MealPlan ACTIVE -> CANCELLED"

      - from: [ACTIVE, VACATED]
        to: CHECKED_OUT
        trigger: "POST /assignments/{assignment_id}/check-out"
        actor: HousingOfficer
        preconditions:
          - "No DamageCharge on this assignment is in PENDING (all assessed charges BILLED, WAIVED, or PAID)"
        side_effects:
          - "Compute checkout_total_cents = sum of DamageCharge.amount_cents in {BILLED, PAID} on this assignment (checkout_billing)"
          - "If still ACTIVE: Room.occupied_bed_count decrements, Room.status re-derived, linked MealPlan ACTIVE -> CANCELLED"

  - entity: MealPlan
    field: status
    initial_state: ACTIVE
    terminal_states: [CANCELLED]
    note: "Linear: ACTIVE -> CANCELLED, driven only by its assignment leaving ACTIVE (vacate or check-out). Tier edits while ACTIVE do not change status."
    transitions:
      - from: ACTIVE
        to: CANCELLED
        trigger: "system (linked Assignment vacated or checked out)"
        actor: system
        preconditions:
          - "linked Assignment transitions ACTIVE -> VACATED or ACTIVE/VACATED -> CHECKED_OUT"
        side_effects:
          - "No further tier edits accepted once CANCELLED"

  - entity: DamageCharge
    field: status
    initial_state: PENDING
    terminal_states: [WAIVED, PAID]
    note: "Branching: PENDING -> {BILLED, WAIVED}; BILLED -> PAID."
    transitions:
      - from: PENDING
        to: BILLED
        trigger: "POST /damage-charges/{charge_id}/bill"
        actor: HousingOfficer
        preconditions:
          - "status == PENDING"
        side_effects:
          - "Compute amount_cents via damage_billing_split"
          - "Student.account_balance_cents += amount_cents (ledger debit)"

      - from: PENDING
        to: WAIVED
        trigger: "POST /damage-charges/{charge_id}/waive"
        actor: HousingOfficer
        preconditions:
          - "status == PENDING"
        side_effects:
          - "amount_cents set to 0; no ledger change"

      - from: BILLED
        to: PAID
        trigger: "POST /damage-charges/{charge_id}/pay"
        actor: HousingOfficer
        preconditions:
          - "status == BILLED"
        side_effects:
          - "Student.account_balance_cents -= amount_cents (ledger credit); never below 0"

  - entity: IncidentReport
    field: status
    initial_state: OPEN
    terminal_states: [RESOLVED]
    note: "Branching with revert: OPEN -> ESCALATED -> RESOLVED, and OPEN -> RESOLVED directly."
    transitions:
      - from: OPEN
        to: ESCALATED
        trigger: "POST /incident-reports/{incident_id}/escalate"
        actor: ResidentAdvisor
        preconditions:
          - "status == OPEN"
          - "actor is reporter_student_id"
        side_effects:
          - "Room.open_incident_count unchanged (ESCALATED still counts as open); Room.status re-derived (escalate_room_restriction)"

      - from: [OPEN, ESCALATED]
        to: RESOLVED
        trigger: "POST /incident-reports/{incident_id}/resolve"
        actor: HousingOfficer
        preconditions:
          - "status in {OPEN, ESCALATED}"
        side_effects:
          - "Room.open_incident_count decrements; Room.status may flip RESTRICTED -> OPEN when no open incidents and no offline flag remain"

  - entity: BreakHousingRequest
    field: status
    initial_state: REQUESTED
    terminal_states: [DENIED, CANCELLED]
    note: "Branching: REQUESTED -> {APPROVED, DENIED}; APPROVED/REQUESTED -> CANCELLED."
    transitions:
      - from: REQUESTED
        to: APPROVED
        trigger: "POST /break-housing-requests/{request_id}/approve"
        actor: HousingOfficer
        preconditions:
          - "Room.building offers_break_housing == true"
          - "Per-room exclusive overlap: no other APPROVED BreakHousingRequest on the SAME room overlaps this [check_in_date, check_out_date) half-open interval; adjacency (out == next in) is allowed (break_room_overlap_check)"
          - "Per-building aggregate-capacity overlap: at every instant within [check_in_date, check_out_date), the count of APPROVED BreakHousingRequests in the same Building (across all its rooms) overlapping that instant, plus this one, must not exceed Building.break_housing_capacity (break_building_capacity_check)"
        side_effects:
          - "Compute night_count and total_charge_cents (break_night_charge)"
          - "Student.account_balance_cents += total_charge_cents (ledger debit)"

      - from: REQUESTED
        to: DENIED
        trigger: "POST /break-housing-requests/{request_id}/deny"
        actor: HousingOfficer
        preconditions:
          - "status == REQUESTED"
        side_effects: []

      - from: [REQUESTED, APPROVED]
        to: CANCELLED
        trigger: "POST /break-housing-requests/{request_id}/cancel"
        actor: Student
        preconditions:
          - "actor is the assignment's student_id"
        side_effects:
          - "If was APPROVED: Student.account_balance_cents -= total_charge_cents (refund, never below 0)"

# =============================================================================
# Concurrency Rules (§1.2.1)
# =============================================================================
concurrency_rules:
  - rule_id: accept-offer-stale-application
    parent_entity: Application
    write_endpoint: "POST /applications/{application_id}/accept"
    occ_field: "expected_application_version"
    description: |
      Accepting an offer on an Application whose version has advanced since the
      client last observed it is rejected. A waitlist promotion (triggered by a
      sibling decline) can re-point or re-mint the offer and bump the
      Application's version; a client holding a stale view that accepts on the
      old offer is rejected on the stale-version check before the accept applies.
    error_id: ERR_STALE_VERSION
    http_status: 412

  - rule_id: confirm-swap-stale-assignment
    parent_entity: Assignment
    write_endpoint: "POST /assignments/{assignment_id}/confirm-swap"
    occ_field: "expected_assignment_version"
    description: |
      Confirming a swap on an Assignment whose version has advanced since the
      client last observed it is rejected. A cancel-swap on the counterparty
      leg, or a vacate, bumps this assignment's version; a confirm carrying a
      stale version is rejected before the room exchange applies.
    error_id: ERR_STALE_VERSION
    http_status: 412

# =============================================================================
# Table 3: Calculation Rules Table
# =============================================================================
calculations:
  - name: application_priority_rank
    trigger: "Application submit (DRAFT -> SUBMITTED)"
    algorithm: weighted_scoring
    formula: |
      priority_rank = CLASS_YEAR_RANK[student.class_year]
      where SENIOR=1, JUNIOR=2, SOPHOMORE=3, FRESHMAN=4 (lower is better priority).
      Stored on the Application; used as the primary lottery sort key.
    constants:
      SENIOR: 1
      JUNIOR: 2
      SOPHOMORE: 3
      FRESHMAN: 4
    precision: "integer"

  - name: lottery_offer_selection
    trigger: "HousingCycle run-lottery (APPLICATION_OPEN -> LOTTERY_RUN)"
    algorithm: waterfall_allocation
    formula: |
      candidates = Applications with status==SUBMITTED in this cycle.
      Order candidates by (priority_rank ASC, lottery_number ASC, created_at ASC).
      Walk candidates in order; for each candidate:
        matching_rooms = Rooms where status==OPEN
          AND occupied_bed_count < bed_capacity
          AND (application.preferred_building_type == NO_PREFERENCE
               OR building.building_type == application.preferred_building_type)
          AND (application.preferred_room_type == NO_PREFERENCE
               OR room.room_type == application.preferred_room_type)
          AND gender_inclusivity permits the student (room_gender_compatibility).
        if matching_rooms non-empty:
          pick the room with the FEWEST free beds first
            (bed_capacity - occupied_bed_count ASC), tie-break room.created_at ASC;
          offer that room: application -> OFFERED, occupied_bed_count += 1.
        else: application -> WAITLISTED, create WaitlistEntry QUEUED.
    input_set: "SUBMITTED Applications in the cycle; OPEN Rooms with a free bed"
    precision: "integer counts"
    variants:
      - name: strict_preference
        when: "preferred_building_type != NO_PREFERENCE or preferred_room_type != NO_PREFERENCE"
        difference: "Candidate is only matched against rooms satisfying every stated preference; if none match it is WAITLISTED even when other OPEN rooms exist."
      - name: open_preference
        when: "preferred_building_type == NO_PREFERENCE and preferred_room_type == NO_PREFERENCE"
        difference: "Candidate is matched against any OPEN room with a free bed (tightest-fit first)."

  - name: damage_billing_split
    trigger: "DamageCharge bill (PENDING -> BILLED)"
    algorithm: waterfall_allocation
    formula: |
      if split_basis == SOLE:
        amount_cents = assessed_cents
      else: # SHARED
        occupants = count of Assignment in status==ACTIVE on this room AT BILL TIME
        if occupants <= 1: amount_cents = assessed_cents
        else:
          base = floor(assessed_cents / occupants)
          remainder = assessed_cents - base * occupants
          # the billed resident (this charge's assignment) absorbs the remainder
          amount_cents = base + remainder
    input_set: "assessed_cents on the charge; ACTIVE Assignments on the charge's room"
    precision: "integer cents, floor division, remainder to the billed resident"
    variants:
      - name: sole
        when: "split_basis == SOLE"
        difference: "Full assessed_cents billed to the single resident; occupant count ignored."
      - name: shared
        when: "split_basis == SHARED"
        difference: "assessed_cents floor-divided across ACTIVE occupants; the billed resident absorbs the floor-division remainder."

  - name: break_night_charge
    trigger: "BreakHousingRequest approve (REQUESTED -> APPROVED)"
    algorithm: interval_merge
    formula: |
      night_count = (check_out_date - check_in_date) in whole days, half-open
                    [check_in_date, check_out_date); both are dates at 00:00:00Z.
      total_charge_cents = night_count * Room.nightly_break_rate_cents.
    input_set: "the request's check_in_date, check_out_date; the room's nightly_break_rate_cents"
    constants:
      NIGHT_SECONDS: 86400
    precision: "integer nights (floor), integer cents"
    variants:
      - name: same_day_rejected
        when: "check_out_date <= check_in_date"
        difference: "night_count would be <= 0; request rejected at validation (ERR_INVALID_DATE_RANGE), never approved."

  - name: checkout_billing
    trigger: "Assignment check-out (ACTIVE/VACATED -> CHECKED_OUT)"
    algorithm: aggregation
    formula: |
      checkout_total_cents = sum of DamageCharge.amount_cents for charges on this
      assignment whose status IN {BILLED, PAID}. WAIVED and PENDING excluded.
      (Check-out is blocked while any PENDING charge remains, so the sum is
      taken over a settled set.)
    input_set: "DamageCharge rows on the assignment with status in {BILLED, PAID}"
    precision: "integer cents"

  - name: mealplan_weekly_fee
    trigger: "MealPlan create (on accept) and PATCH /meal-plans/{id} tier change"
    algorithm: threshold
    formula: |
      weekly_fee_cents = TIER_FEE[tier]
      where NONE=0, COMMUTER=4000, STANDARD=9000, UNLIMITED=13500.
    input_set: "the meal plan's tier enum"
    constants:
      NONE: 0
      COMMUTER: 4000
      STANDARD: 9000
      UNLIMITED: 13500
    precision: "integer cents"

  - name: building_occupancy_rollup
    trigger: "Any Assignment status change, Room offline/restore, lottery offer, offer accept/decline/expire, swap confirm"
    algorithm: aggregation
    formula: |
      Room.occupied_bed_count =
        (count of Application with status==OFFERED AND offered_room_id == this room)   # offer reservations
        + (count of Assignment with room_id == this room AND status IN {ACTIVE, SWAP_PENDING})  # live residents
        (SWAP_PENDING still counts because room_id does not change until confirm).
      Building.occupied_bed_count = sum of Room.occupied_bed_count over rooms in the building.
      Building.total_bed_count = sum of Room.bed_capacity over rooms with status != OFFLINE.
    input_set: "OFFERED Applications per room; Assignments in {ACTIVE, SWAP_PENDING} per room; Rooms per building"
    precision: "integer counts"

# =============================================================================
# Table 4: Validation Rules Table (ordered by priority)
# =============================================================================
validations:
  - priority: 1
    category: auth
    check: "X-User-Role header present and a known role; X-User-ID present for entity-backed roles"
    error_id: ERR_UNAUTHENTICATED
    http_status: 401
    applies_to: all

  - priority: 2
    category: auth
    check: "Acting role is permitted for the operation per RBAC matrix; for entity-backed ownership ops, X-User-ID matches the owning student"
    error_id: ERR_FORBIDDEN
    http_status: 403
    applies_to: all

  - priority: 3
    category: existence
    check: "All path/body referenced resources exist, validated left-to-right (building before room, etc.)"
    error_id: ERR_NOT_FOUND
    http_status: 404
    applies_to: all

  - priority: 4
    category: business_constraint
    check: "Request body well-formed: required fields present, enum members valid, integers in range"
    error_id: ERR_INVALID_REQUEST
    http_status: 400
    applies_to: all

  - priority: 5
    category: business_temporal
    check: "BreakHousingRequest check_out_date strictly after check_in_date"
    error_id: ERR_INVALID_DATE_RANGE
    http_status: 422
    applies_to: "POST /break-housing-requests"

  - priority: 6
    category: state
    check: "Target resource is in a valid state for the requested transition"
    error_id: ERR_INVALID_STATE
    http_status: 409
    applies_to: "all state-transition endpoints"

  - priority: 7
    category: business_referential
    check: "Cross-entity preconditions hold (offer not stale, counterparty ACTIVE, group LOCKED at submit, room belongs to break-eligible building)"
    error_id: ERR_PRECONDITION_NOT_MET
    http_status: 409
    applies_to: "submit, accept, propose-swap, confirm-swap, break approve"

  - priority: 8
    category: business_safety
    check: "Gender inclusivity compatibility between student and room (and counterparty room on swap)"
    error_id: ERR_GENDER_INCOMPATIBLE
    http_status: 409
    applies_to: "accept, propose-swap, run-lottery offer matching"

  - priority: 9
    category: business_safety
    check: "Student is not on HOLD when submitting an application or accepting an offer"
    error_id: ERR_STUDENT_ON_HOLD
    http_status: 409
    applies_to: "submit, accept"

  - priority: 10
    category: business_temporal
    check: "Per-room exclusive overlap: an APPROVED break-housing interval on the SAME room must not overlap the requested half-open [check_in_date, check_out_date) interval; adjacency allowed"
    error_id: ERR_BREAK_OVERLAP
    http_status: 409
    applies_to: "POST /break-housing-requests/{request_id}/approve"

  - priority: 11
    category: business_constraint
    check: "Per-building aggregate-capacity overlap: APPROVED break occupancy in the building must not exceed Building.break_housing_capacity at any instant of the requested interval"
    error_id: ERR_BREAK_CAPACITY_EXCEEDED
    http_status: 409
    applies_to: "POST /break-housing-requests/{request_id}/approve"

  - priority: 12
    category: business_constraint
    check: "RoommateGroup lock requires accepted_member_count == target_size; accept requires accepted_member_count < target_size"
    error_id: ERR_GROUP_SIZE_INVALID
    http_status: 409
    applies_to: "roommate-group lock, membership accept"

  - priority: 13
    category: business_constraint
    check: "Assignment check-out blocked while any DamageCharge on it is PENDING"
    error_id: ERR_UNSETTLED_CHARGES
    http_status: 409
    applies_to: "POST /assignments/{assignment_id}/check-out"

  - priority: 14
    category: business_constraint
    check: "A student may hold at most one non-terminal Application (DRAFT, SUBMITTED, OFFERED, ACCEPTED, WAITLISTED) per cycle"
    error_id: ERR_DUPLICATE_APPLICATION
    http_status: 409
    applies_to: "POST /applications"

  - priority: 15
    category: business_constraint
    check: "A student may not be invited to a group where they already hold an INVITED or ACCEPTED membership"
    error_id: ERR_DUPLICATE_MEMBERSHIP
    http_status: 409
    applies_to: "POST /roommate-groups/{group_id}/memberships"

  - priority: 16
    category: business_constraint
    check: "Room take-offline blocked while occupied_bed_count > 0"
    error_id: ERR_ROOM_OCCUPIED
    http_status: 409
    applies_to: "POST /rooms/{room_id}/take-offline"

  - priority: 17
    category: business_constraint
    check: "Pagination bounds: limit in 1..100, offset >= 0"
    error_id: ERR_VALIDATION_PAGINATION
    http_status: 400
    applies_to: "all list endpoints"

  - priority: 18
    category: state
    check: "OCC: expected_<parent>_version matches the parent's current version on guarded writes"
    error_id: ERR_STALE_VERSION
    http_status: 412
    applies_to: "accept offer, confirm-swap, room take-offline, room restore"

# =============================================================================
# Response Envelope (FIXED)
# =============================================================================
response_envelope:
  success: |
    { "meta": { "api_request_id": "req_xxx", "api_request_timestamp": "ISO8601" },
      "response_type": "object" | "array", "data": {} }
  error: |
    { "meta": { ... }, "response_type": "error",
      "data": { "error_id": "ERR_XXX", "message": "..." } }
  pagination_fields: ["limit", "offset", "total_count", "has_more"]
  pagination_defaults: { limit: 10, min: 1, max: 100, offset: 0 }

# =============================================================================
# Table 5: API Endpoint Table
# =============================================================================
endpoints:
  # --- Buildings / Rooms (inventory) ---
  - method: POST
    path: "/buildings"
    description: "Create a building"
    roles: [HousingOfficer]
    code: 201
    input: [name, building_type, "offers_break_housing?", "break_housing_capacity?"]
    output: Building
    side_effects: ["total_bed_count=0, occupied_bed_count=0"]

  - method: GET
    path: "/buildings/{building_id}"
    description: "Get a building"
    roles: [HousingOfficer, Student, ResidentAdvisor]
    code: 200
    input: []
    output: Building
    side_effects: []

  - method: POST
    path: "/buildings/{building_id}/rooms"
    description: "Create a room in a building"
    roles: [HousingOfficer]
    code: 201
    input: [room_number, room_type, gender_inclusivity, "nightly_break_rate_cents?"]
    output: Room
    side_effects: ["bed_capacity derived from room_type, status=OPEN, occupied_bed_count=0, open_incident_count=0"]

  - method: GET
    path: "/buildings/{building_id}/rooms"
    description: "List rooms in a building (sub-resource convenience view)"
    roles: [HousingOfficer, Student, ResidentAdvisor]
    code: 200
    input: ["limit?", "offset?"]
    output: Room[]
    side_effects: []

  - method: GET
    path: "/rooms"
    description: "List rooms, filterable by building (reverse-reachability for Room.building_id)"
    roles: [HousingOfficer, Student, ResidentAdvisor]
    code: 200
    input: ["building_id?", "limit?", "offset?"]
    output: Room[]
    side_effects: []

  - method: GET
    path: "/rooms/{room_id}"
    description: "Get a room"
    roles: [HousingOfficer, Student, ResidentAdvisor]
    code: 200
    input: []
    output: Room
    side_effects: []

  - method: POST
    path: "/rooms/{room_id}/take-offline"
    description: "Mark a room OFFLINE (excluded from lottery and bed totals)"
    roles: [HousingOfficer]
    code: 200
    input: [expected_room_version]
    output: Room
    side_effects: ["status -> OFFLINE (only if occupied_bed_count==0)", "Building.total_bed_count recomputed", "increments Room.version by 1"]

  - method: POST
    path: "/rooms/{room_id}/restore"
    description: "Restore an OFFLINE room to OPEN/RESTRICTED per posture"
    roles: [HousingOfficer]
    code: 200
    input: [expected_room_version]
    output: Room
    side_effects: ["status re-derived from incidents/occupancy", "Building.total_bed_count recomputed", "increments Room.version by 1"]

  # --- Students ---
  - method: POST
    path: "/students"
    description: "Register a student"
    roles: [HousingOfficer]
    code: 201
    input: [full_name, class_year, gender_identity, lottery_number]
    output: Student
    side_effects: ["status=ACTIVE, account_balance_cents=0"]

  - method: GET
    path: "/students/{student_id}"
    description: "Get a student"
    roles: [HousingOfficer, Student, ResidentAdvisor]
    code: 200
    input: []
    output: Student
    side_effects: []

  - method: POST
    path: "/students/{student_id}/place-hold"
    description: "Put a student on HOLD (blocks new applications/offers)"
    roles: [HousingOfficer]
    code: 200
    input: []
    output: Student
    side_effects: ["status ACTIVE -> HOLD"]

  - method: POST
    path: "/students/{student_id}/release-hold"
    description: "Release a student HOLD"
    roles: [HousingOfficer]
    code: 200
    input: []
    output: Student
    side_effects: ["status HOLD -> ACTIVE"]

  # --- Housing cycle ---
  - method: POST
    path: "/housing-cycles"
    description: "Create a housing cycle"
    roles: [HousingOfficer]
    code: 201
    input: [term_label]
    output: HousingCycle
    side_effects: ["phase=APPLICATION_OPEN, lottery_run_index=0"]

  - method: GET
    path: "/housing-cycles/{cycle_id}"
    description: "Get a housing cycle"
    roles: [HousingOfficer, Student, ResidentAdvisor]
    code: 200
    input: []
    output: HousingCycle
    side_effects: []

  - method: POST
    path: "/housing-cycles/{cycle_id}/run-lottery"
    description: "Run the lottery: offer or waitlist every SUBMITTED application"
    roles: [HousingOfficer]
    code: 200
    input: []
    output: HousingCycle
    side_effects: ["phase APPLICATION_OPEN -> LOTTERY_RUN", "lottery_run_index += 1", "lottery_offer_selection: Applications -> OFFERED or WAITLISTED; Rooms occupied_bed_count updated; WaitlistEntry rows created"]

  - method: POST
    path: "/housing-cycles/{cycle_id}/open-assignment"
    description: "Open the assignment (accept/decline) window"
    roles: [HousingOfficer]
    code: 200
    input: []
    output: HousingCycle
    side_effects: ["phase LOTTERY_RUN -> ASSIGNMENT_OPEN"]

  - method: POST
    path: "/housing-cycles/{cycle_id}/close"
    description: "Close the cycle; expire outstanding offers"
    roles: [HousingOfficer]
    code: 200
    input: []
    output: HousingCycle
    side_effects: ["phase ASSIGNMENT_OPEN -> CLOSED", "OFFERED Applications -> EXPIRED, beds released, Room.status re-derived"]

  # --- Applications ---
  - method: POST
    path: "/applications"
    description: "Create a draft application"
    roles: [Student]
    code: 201
    input: [cycle_id, student_id, preferred_building_type, preferred_room_type, "roommate_group_id?"]
    output: Application
    side_effects: ["status=DRAFT, priority_rank=null"]

  - method: GET
    path: "/applications/{application_id}"
    description: "Get an application"
    roles: [HousingOfficer, Student, ResidentAdvisor]
    code: 200
    input: []
    output: Application
    side_effects: []

  - method: GET
    path: "/applications"
    description: "List applications, filterable by cycle, student, roommate group, or offered room"
    roles: [HousingOfficer, Student, ResidentAdvisor]
    code: 200
    input: ["cycle_id?", "student_id?", "roommate_group_id?", "offered_room_id?", "limit?", "offset?"]
    output: Application[]
    side_effects: []

  - method: POST
    path: "/applications/{application_id}/submit"
    description: "Submit a draft application into the lottery pool"
    roles: [Student]
    code: 200
    input: []
    output: Application
    side_effects: ["status DRAFT -> SUBMITTED", "priority_rank computed (application_priority_rank)"]

  - method: POST
    path: "/applications/{application_id}/withdraw"
    description: "Withdraw a submitted application before assignment opens"
    roles: [Student]
    code: 200
    input: []
    output: Application
    side_effects: ["status SUBMITTED -> WITHDRAWN"]

  - method: POST
    path: "/applications/{application_id}/accept"
    description: "Accept the lottery offer; mint an assignment + meal plan"
    roles: [Student]
    code: 200
    input: [expected_application_version]
    output: Application
    side_effects: ["status OFFERED -> ACCEPTED", "Assignment (ACTIVE) created on offered_room_id", "MealPlan (STANDARD, ACTIVE) created", "increments Application.version by 1"]

  - method: POST
    path: "/applications/{application_id}/decline"
    description: "Decline the lottery offer; release the bed and promote the waitlist"
    roles: [Student]
    code: 200
    input: []
    output: Application
    side_effects: ["status OFFERED -> DECLINED", "offered bed released, Room.status re-derived", "waitlist_promotion: best matching QUEUED entry -> its Application OFFERED, WaitlistEntry PROMOTED"]

  # --- Roommate groups & memberships ---
  - method: POST
    path: "/roommate-groups"
    description: "Create a roommate group (owner auto-ACCEPTED member)"
    roles: [Student]
    code: 201
    input: [cycle_id, owner_student_id, target_size]
    output: RoommateGroup
    side_effects: ["status=FORMING", "RoommateMembership (owner, ACCEPTED) created", "accepted_member_count=1"]

  - method: GET
    path: "/roommate-groups/{group_id}"
    description: "Get a roommate group"
    roles: [HousingOfficer, Student, ResidentAdvisor]
    code: 200
    input: []
    output: RoommateGroup
    side_effects: []

  - method: GET
    path: "/roommate-groups"
    description: "List roommate groups, filterable by cycle or owner (reverse-reachability for cycle_id, owner_student_id)"
    roles: [HousingOfficer, Student, ResidentAdvisor]
    code: 200
    input: ["cycle_id?", "owner_student_id?", "limit?", "offset?"]
    output: RoommateGroup[]
    side_effects: []

  - method: POST
    path: "/roommate-groups/{group_id}/memberships"
    description: "Invite a student into a forming group"
    roles: [Student]
    code: 201
    input: [student_id]
    output: RoommateMembership
    side_effects: ["status=INVITED"]

  - method: GET
    path: "/roommate-groups/{group_id}/memberships"
    description: "List memberships of a group (sub-resource convenience view)"
    roles: [HousingOfficer, Student, ResidentAdvisor]
    code: 200
    input: ["limit?", "offset?"]
    output: RoommateMembership[]
    side_effects: []

  - method: GET
    path: "/roommate-memberships/{membership_id}"
    description: "Get a roommate membership"
    roles: [HousingOfficer, Student, ResidentAdvisor]
    code: 200
    input: []
    output: RoommateMembership
    side_effects: []

  - method: GET
    path: "/roommate-memberships"
    description: "List roommate memberships, filterable by group or student (reverse-reachability for group_id, student_id)"
    roles: [HousingOfficer, Student, ResidentAdvisor]
    code: 200
    input: ["group_id?", "student_id?", "limit?", "offset?"]
    output: RoommateMembership[]
    side_effects: []

  - method: POST
    path: "/roommate-groups/{group_id}/memberships/{membership_id}/accept"
    description: "Invitee accepts membership"
    roles: [Student]
    code: 200
    input: []
    output: RoommateMembership
    side_effects: ["status INVITED -> ACCEPTED", "RoommateGroup.accepted_member_count += 1"]

  - method: POST
    path: "/roommate-groups/{group_id}/memberships/{membership_id}/decline"
    description: "Invitee declines membership"
    roles: [Student]
    code: 200
    input: []
    output: RoommateMembership
    side_effects: ["status INVITED -> DECLINED"]

  - method: POST
    path: "/roommate-groups/{group_id}/memberships/{membership_id}/remove"
    description: "Owner removes an accepted member"
    roles: [Student]
    code: 200
    input: []
    output: RoommateMembership
    side_effects: ["status ACCEPTED -> REMOVED", "RoommateGroup.accepted_member_count -= 1"]

  - method: POST
    path: "/roommate-groups/{group_id}/lock"
    description: "Lock a full forming group"
    roles: [Student]
    code: 200
    input: []
    output: RoommateGroup
    side_effects: ["status FORMING -> LOCKED"]

  - method: POST
    path: "/roommate-groups/{group_id}/reopen"
    description: "Reopen a locked group to editing"
    roles: [Student]
    code: 200
    input: []
    output: RoommateGroup
    side_effects: ["status LOCKED -> FORMING"]

  - method: POST
    path: "/roommate-groups/{group_id}/disband"
    description: "Disband a group"
    roles: [Student]
    code: 200
    input: []
    output: RoommateGroup
    side_effects: ["status -> DISBANDED", "memberships INVITED/ACCEPTED -> REMOVED", "SUBMITTED applications referencing the group keep competing solo (roommate_group_id cleared)"]

  # --- Assignments / swaps ---
  - method: GET
    path: "/assignments/{assignment_id}"
    description: "Get an assignment"
    roles: [HousingOfficer, Student, ResidentAdvisor]
    code: 200
    input: []
    output: Assignment
    side_effects: []

  - method: GET
    path: "/assignments"
    description: "List assignments, filterable by room, student, application, or swap counterparty"
    roles: [HousingOfficer, Student, ResidentAdvisor]
    code: 200
    input: ["room_id?", "student_id?", "application_id?", "swap_counterparty_assignment_id?", "limit?", "offset?"]
    output: Assignment[]
    side_effects: []

  - method: POST
    path: "/assignments/{assignment_id}/propose-swap"
    description: "Propose a room swap with another active assignment"
    roles: [Student]
    code: 200
    input: [counterparty_assignment_id]
    output: Assignment
    side_effects: ["both assignments ACTIVE -> SWAP_PENDING", "swap_counterparty_assignment_id set on both"]

  - method: POST
    path: "/assignments/{assignment_id}/confirm-swap"
    description: "Counterparty confirms the swap; rooms exchange"
    roles: [Student]
    code: 200
    input: [expected_assignment_version]
    output: Assignment
    side_effects: ["room_id exchanged between the two assignments", "both SWAP_PENDING -> ACTIVE", "Room.status re-derived on both rooms", "increments Assignment.version by 1"]

  - method: POST
    path: "/assignments/{assignment_id}/cancel-swap"
    description: "Either party cancels the pending swap"
    roles: [Student]
    code: 200
    input: []
    output: Assignment
    side_effects: ["both SWAP_PENDING -> ACTIVE, counterparty cleared, no room change"]

  - method: POST
    path: "/assignments/{assignment_id}/vacate"
    description: "Vacate an assignment (resident leaves mid-term)"
    roles: [HousingOfficer]
    code: 200
    input: []
    output: Assignment
    side_effects: ["status ACTIVE -> VACATED", "bed released, Room.status re-derived", "linked MealPlan ACTIVE -> CANCELLED"]

  - method: POST
    path: "/assignments/{assignment_id}/check-out"
    description: "Check out an assignment; compute settled checkout_total_cents"
    roles: [HousingOfficer]
    code: 200
    input: []
    output: Assignment
    side_effects: ["status -> CHECKED_OUT", "checkout_total_cents computed (checkout_billing)", "if was ACTIVE: bed released, MealPlan CANCELLED"]

  # --- Meal plans ---
  - method: GET
    path: "/meal-plans/{meal_plan_id}"
    description: "Get a meal plan"
    roles: [HousingOfficer, Student, ResidentAdvisor]
    code: 200
    input: []
    output: MealPlan
    side_effects: []

  - method: GET
    path: "/meal-plans"
    description: "List meal plans, filterable by assignment (reverse-reachability for assignment_id)"
    roles: [HousingOfficer, Student, ResidentAdvisor]
    code: 200
    input: ["assignment_id?", "limit?", "offset?"]
    output: MealPlan[]
    side_effects: []

  - method: PATCH
    path: "/meal-plans/{meal_plan_id}"
    description: "Change a meal plan tier while ACTIVE"
    roles: [Student]
    code: 200
    input: [tier]
    output: MealPlan
    side_effects: ["weekly_fee_cents recomputed from new tier"]

  # --- Waitlist ---
  - method: GET
    path: "/waitlist-entries/{entry_id}"
    description: "Get a waitlist entry"
    roles: [HousingOfficer, Student, ResidentAdvisor]
    code: 200
    input: []
    output: WaitlistEntry
    side_effects: []

  - method: GET
    path: "/waitlist-entries"
    description: "List waitlist entries, filterable by cycle or application (reverse-reachability for cycle_id, application_id)"
    roles: [HousingOfficer, Student, ResidentAdvisor]
    code: 200
    input: ["cycle_id?", "application_id?", "limit?", "offset?"]
    output: WaitlistEntry[]
    side_effects: []

  # --- Damage charges ---
  - method: POST
    path: "/damage-charges"
    description: "Assess a damage charge against an assignment"
    roles: [HousingOfficer]
    code: 201
    input: [assignment_id, category, assessed_cents, split_basis]
    output: DamageCharge
    side_effects: ["status=PENDING, room_id copied from assignment, amount_cents=null"]

  - method: GET
    path: "/damage-charges/{charge_id}"
    description: "Get a damage charge"
    roles: [HousingOfficer, Student, ResidentAdvisor]
    code: 200
    input: []
    output: DamageCharge
    side_effects: []

  - method: GET
    path: "/damage-charges"
    description: "List damage charges, filterable by assignment or room (reverse-reachability for assignment_id, room_id)"
    roles: [HousingOfficer, Student, ResidentAdvisor]
    code: 200
    input: ["assignment_id?", "room_id?", "limit?", "offset?"]
    output: DamageCharge[]
    side_effects: []

  - method: POST
    path: "/damage-charges/{charge_id}/bill"
    description: "Bill a pending charge; compute split and debit the student"
    roles: [HousingOfficer]
    code: 200
    input: []
    output: DamageCharge
    side_effects: ["status PENDING -> BILLED", "amount_cents computed (damage_billing_split)", "Student.account_balance_cents += amount_cents"]

  - method: POST
    path: "/damage-charges/{charge_id}/waive"
    description: "Waive a pending charge"
    roles: [HousingOfficer]
    code: 200
    input: []
    output: DamageCharge
    side_effects: ["status PENDING -> WAIVED", "amount_cents=0"]

  - method: POST
    path: "/damage-charges/{charge_id}/pay"
    description: "Mark a billed charge paid; credit the student"
    roles: [HousingOfficer]
    code: 200
    input: []
    output: DamageCharge
    side_effects: ["status BILLED -> PAID", "Student.account_balance_cents -= amount_cents (never below 0)"]

  # --- Incident reports (RA) ---
  - method: POST
    path: "/incident-reports"
    description: "RA files an incident report against a room"
    roles: [ResidentAdvisor]
    code: 201
    input: [room_id, reporter_student_id, severity]
    output: IncidentReport
    side_effects: ["status=OPEN", "Room.open_incident_count += 1", "Room.status re-derived (CRITICAL -> RESTRICTED)"]

  - method: GET
    path: "/incident-reports/{incident_id}"
    description: "Get an incident report"
    roles: [HousingOfficer, ResidentAdvisor]
    code: 200
    input: []
    output: IncidentReport
    side_effects: []

  - method: GET
    path: "/incident-reports"
    description: "List incident reports, filterable by room or reporter (reverse-reachability for room_id, reporter_student_id)"
    roles: [HousingOfficer, ResidentAdvisor]
    code: 200
    input: ["room_id?", "reporter_student_id?", "limit?", "offset?"]
    output: IncidentReport[]
    side_effects: []

  - method: POST
    path: "/incident-reports/{incident_id}/escalate"
    description: "RA escalates an open incident"
    roles: [ResidentAdvisor]
    code: 200
    input: []
    output: IncidentReport
    side_effects: ["status OPEN -> ESCALATED", "Room.status re-derived (escalate_room_restriction)"]

  - method: POST
    path: "/incident-reports/{incident_id}/resolve"
    description: "Housing officer resolves an incident"
    roles: [HousingOfficer]
    code: 200
    input: []
    output: IncidentReport
    side_effects: ["status -> RESOLVED", "Room.open_incident_count -= 1", "Room.status may flip RESTRICTED -> OPEN"]

  # --- Break housing ---
  - method: POST
    path: "/break-housing-requests"
    description: "Resident requests break housing for their assignment's room"
    roles: [Student]
    code: 201
    input: [assignment_id, check_in_date, check_out_date]
    output: BreakHousingRequest
    side_effects: ["status=REQUESTED, room_id copied from assignment, night_count computed (not yet charged)"]

  - method: GET
    path: "/break-housing-requests/{request_id}"
    description: "Get a break housing request"
    roles: [HousingOfficer, Student, ResidentAdvisor]
    code: 200
    input: []
    output: BreakHousingRequest
    side_effects: []

  - method: GET
    path: "/break-housing-requests"
    description: "List break housing requests, filterable by assignment or room (reverse-reachability for assignment_id, room_id)"
    roles: [HousingOfficer, Student, ResidentAdvisor]
    code: 200
    input: ["assignment_id?", "room_id?", "limit?", "offset?"]
    output: BreakHousingRequest[]
    side_effects: []

  - method: POST
    path: "/break-housing-requests/{request_id}/approve"
    description: "Approve a break request; charge nights to the student"
    roles: [HousingOfficer]
    code: 200
    input: []
    output: BreakHousingRequest
    side_effects: ["status REQUESTED -> APPROVED", "total_charge_cents computed (break_night_charge)", "Student.account_balance_cents += total_charge_cents", "break_room_overlap_check (per-room exclusive) and break_building_capacity_check (per-building aggregate-capacity) enforced"]

  - method: POST
    path: "/break-housing-requests/{request_id}/deny"
    description: "Deny a break request"
    roles: [HousingOfficer]
    code: 200
    input: []
    output: BreakHousingRequest
    side_effects: ["status REQUESTED -> DENIED"]

  - method: POST
    path: "/break-housing-requests/{request_id}/cancel"
    description: "Resident cancels a break request"
    roles: [Student]
    code: 200
    input: []
    output: BreakHousingRequest
    side_effects: ["status -> CANCELLED", "if was APPROVED: refund total_charge_cents to student balance"]

# =============================================================================
# Table 6: Error Code Catalog
# =============================================================================
errors:
  - { id: ERR_UNAUTHENTICATED, http: 401, condition: "Missing/unknown X-User-Role, or missing X-User-ID for an entity-backed role" }
  - { id: ERR_FORBIDDEN, http: 403, condition: "Role not permitted for the operation, or entity-backed ownership mismatch (acting student is not the owner)" }
  - { id: ERR_NOT_FOUND, http: 404, condition: "A referenced building, room, student, cycle, application, group, membership, assignment, meal plan, charge, incident, or break request does not exist" }
  - { id: ERR_INVALID_REQUEST, http: 400, condition: "Malformed body: missing required field, invalid enum member, out-of-range integer" }
  - { id: ERR_INVALID_DATE_RANGE, http: 422, condition: "BreakHousingRequest check_out_date is not strictly after check_in_date" }
  - { id: ERR_INVALID_STATE, http: 409, condition: "Resource not in a valid state for the requested transition (e.g. accept on a non-OFFERED application, lock a non-FORMING group, confirm a non-SWAP_PENDING assignment)" }
  - { id: ERR_PRECONDITION_NOT_MET, http: 409, condition: "Cross-entity precondition failed (stale offer epoch, counterparty not ACTIVE, group not LOCKED at submit, building does not offer break housing)" }
  - { id: ERR_GENDER_INCOMPATIBLE, http: 409, condition: "Student gender_identity not permitted by a SINGLE_GENDER room's existing occupants on accept/offer/swap" }
  - { id: ERR_STUDENT_ON_HOLD, http: 409, condition: "Student is on HOLD and cannot submit an application or accept an offer" }
  - { id: ERR_BREAK_OVERLAP, http: 409, condition: "Requested break interval overlaps an existing APPROVED interval on the same room (half-open, adjacency allowed)" }
  - { id: ERR_BREAK_CAPACITY_EXCEEDED, http: 409, condition: "Approving the break request would push the building's simultaneous APPROVED break occupancy above Building.break_housing_capacity for some instant in the interval" }
  - { id: ERR_GROUP_SIZE_INVALID, http: 409, condition: "Lock attempted with accepted_member_count != target_size, or accept attempted with accepted_member_count already == target_size" }
  - { id: ERR_UNSETTLED_CHARGES, http: 409, condition: "Assignment check-out attempted while a DamageCharge on it is still PENDING" }
  - { id: ERR_STALE_VERSION, http: 412, condition: "expected_<parent>_version does not match the parent entity's current version on a guarded write (accept offer, confirm-swap, room offline/restore)" }
  - { id: ERR_ROOM_OCCUPIED, http: 409, condition: "Room take-offline attempted while occupied_bed_count > 0" }
  - { id: ERR_DUPLICATE_MEMBERSHIP, http: 409, condition: "A membership for this student already exists on the group in status INVITED or ACCEPTED" }
  - { id: ERR_DUPLICATE_APPLICATION, http: 409, condition: "Student already has a non-terminal Application (status in {DRAFT, SUBMITTED, OFFERED, ACCEPTED, WAITLISTED}) in this cycle" }
  - { id: ERR_VALIDATION_PAGINATION, http: 400, condition: "limit/offset out of allowed bounds (limit 1..100, offset >= 0)" }

# =============================================================================
# Table 7: RBAC Matrix
# =============================================================================
roles:
  - name: HousingOfficer
    description: "Housing operations staff: owns inventory, cycle/lottery, billing, vacate/check-out, incident resolution, break approvals. Operator identity not tied to any persisted entity."
    identity: "opaque"
    exclusive_operations:
      - "POST /buildings, POST /buildings/{id}/rooms, POST /rooms/{id}/take-offline, POST /rooms/{id}/restore"
      - "POST /students, POST /students/{id}/place-hold, POST /students/{id}/release-hold"
      - "POST /housing-cycles, POST /housing-cycles/{id}/run-lottery, .../open-assignment, .../close"
      - "POST /damage-charges, .../bill, .../waive, .../pay"
      - "POST /assignments/{id}/vacate, POST /assignments/{id}/check-out"
      - "POST /incident-reports/{id}/resolve"
      - "POST /break-housing-requests/{id}/approve, .../deny"
    shared_operations:
      - "GET endpoints (buildings, rooms, students, cycles, applications, groups, assignments, meal-plans, waitlist, charges, incidents, break requests)"

  - name: Student
    description: "An enrolled student acting on their own applications, roommate groups, swaps, meal plan, and break requests. X-User-ID is the acting Student.id."
    identity: "entity_backed:Student"
    exclusive_operations:
      - "POST /applications, .../submit, .../withdraw, .../accept, .../decline (own application)"
      - "POST /roommate-groups, .../memberships, membership accept/decline/remove, lock/reopen/disband (own group / own membership)"
      - "POST /assignments/{id}/propose-swap, .../confirm-swap, .../cancel-swap (own assignment)"
      - "PATCH /meal-plans/{id} (own meal plan)"
      - "POST /break-housing-requests, .../cancel (own request)"
    shared_operations:
      - "GET endpoints scoped to readable resources"

  - name: ResidentAdvisor
    description: "A Student designated as RA who files and escalates incident reports for rooms. X-User-ID is the RA's Student.id (reporter_student_id)."
    identity: "entity_backed:Student"
    exclusive_operations:
      - "POST /incident-reports (file), POST /incident-reports/{id}/escalate"
    shared_operations:
      - "GET incident-reports, GET rooms/buildings/students/assignments"
