              payload: { name: "Atlantic Net Program", buy_rate_bps: 45, buy_rate_per_item_cents: 6, assessment_bps: 13, normalization_mode: "NET_REVENUE_SPLIT", minimum_billing_mode: "NO_MINIMUM" }
              as: IsoAdmin
              captures: { p1: $.data.id }
            - call: "POST /agents"
              payload: { name: "A1 Principal", split_pct: 0.50, override_pct: 0.60, vesting_start_date: "2024-01-15" }
              as: IsoAdmin
              captures: { a1: $.data.id }
            - call: "POST /merchants"
              payload: { owning_agent_id: "${a1}", processor_program_id: "${p1}", mid: "MID-9001", monthly_minimum_cents: 0, per_transaction_fee_cents: 10, equipment_lease_monthly_cents: 0, boarded_on: "2026-04-10" }
              as: IsoAdmin
              captures: { m1: $.data.id }
            - call: "POST /merchants"
              payload: { owning_agent_id: "${a1}", processor_program_id: "${p1}", mid: "MID-9002", monthly_minimum_cents: 0, per_transaction_fee_cents: 10, equipment_lease_monthly_cents: 0, boarded_on: "2026-04-10" }
              as: IsoAdmin
              captures: { m2: $.data.id }
            - call: "POST /merchants/${m1}/activate"
              payload: {}
              as: IsoAdmin
            - call: "POST /merchants/${m2}/activate"
              payload: {}
              as: IsoAdmin
          trigger:
            - call: "POST /merchants/${m1}/chargebacks"
              payload: { amount_cents: 1000, occurred_on: "2026-05-10", period_month: "2026-05", liability: "AGENT_CHARGED" }
              as: ResidualAnalyst
              captures: { cb1: $.data.id }
            - call: "POST /merchants/${m1}/chargebacks"
              payload: { amount_cents: 2000, occurred_on: "2026-06-11", period_month: "2026-06", liability: "ISO_ABSORBED" }
              as: ResidualAnalyst
              captures: { cb2: $.data.id }
            - call: "POST /merchants/${m1}/chargebacks"
              payload: { amount_cents: 3000, occurred_on: "2026-07-12", period_month: "2026-07", liability: "AGENT_CHARGED" }
              as: ResidualAnalyst
              captures: { cb3: $.data.id }
            - call: "POST /merchants/${m1}/chargebacks"
              payload: { amount_cents: 4000, occurred_on: "2026-07-13", period_month: "2026-07", liability: "ISO_ABSORBED" }
              as: ResidualAnalyst
              captures: { cb4: $.data.id }
            - call: "POST /merchants/${m1}/chargebacks"
              payload: { amount_cents: 5000, occurred_on: "2026-07-30", period_month: "2026-08", liability: "AGENT_CHARGED" }
              as: ResidualAnalyst
              captures: { cb5: $.data.id }
            - call: "POST /merchants/${m2}/chargebacks"
              payload: { amount_cents: 900, occurred_on: "2026-07-05", period_month: "2026-07", liability: "AGENT_CHARGED" }
              as: ResidualAnalyst
              captures: { cb6: $.data.id }
            - call: "GET /chargeback-events/${cb3}"
              payload: {}
