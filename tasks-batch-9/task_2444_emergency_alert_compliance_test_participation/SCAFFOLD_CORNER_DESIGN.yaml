              as_user_id: eng-1
              payload: { station_id: "${station_id}", event_code: "TOR", originator_sequence: "KSAXS-5002", fips_codes: ["20173"], received_at: "2026-08-01T00:00:00Z" }
              captures: { alert_below: "$.data.id" }
            - call: "POST /alert-events"
              as: StationEngineer
              as_user_id: eng-1
              payload: { station_id: "${station_id}", event_code: "TOR", originator_sequence: "KSAXS-5003", fips_codes: ["20173"], received_at: "2026-08-01T00:00:00Z" }
              captures: { alert_above: "$.data.id" }
          trigger:
