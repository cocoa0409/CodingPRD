              as: VenueCoordinator
              captures: { v: $.data.id }
            - call: "POST /api/ceremonies"
              payload: { name: "Spring Commencement", ceremony_date: "2026-06-01T15:00:00Z", venue_id: "${v}", ticket_ratio: 1.0, guest_ticket_base_cap: 4, honor_bonus_tickets: 2, pronunciation_deadline: "2026-05-20T00:00:00Z", ticket_request_deadline: "2026-05-15T00:00:00Z", regalia_order_deadline: "2026-05-10T00:00:00Z" }
              as: CommitteeChair
              captures: { c: $.data.id }
            - call: "POST /api/ceremonies/${c}/open-audit"
              payload: {}
              as: CommitteeChair
            - call: "POST /api/graduates"
              payload: { ceremony_id: "${c}", full_name: "Sam Summa", email: "sam@x.edu", institutional_gpa_credits: 45, institutional_quality_points: 175.5, transfer_gpa_credits: 0, transfer_quality_points: 0, credits_completed: 120, credits_required: 120, outstanding_hold_count: 0 }
              as: RegistrarOfficer
              captures: { g: $.data.id }
            - call: "POST /api/graduates/${g}/audits"
              payload: {}
              as: RegistrarOfficer
            - call: "POST /api/ceremonies/${c}/lock-audit"
              payload: {}
              as: CommitteeChair
            - call: "POST /api/ceremonies/${c}/print-batches"
              payload: {}
              as: RegistrarOfficer
              as_user_id: "reg-a-1"
              captures: { b: $.data.id }
            - call: "POST /api/print-batches/${b}/diplomas"
              payload: { graduate_id: "${g}" }
              as: RegistrarOfficer
              captures: { d: $.data.id }
            - call: "POST /api/ceremonies/${c}/reopen-audit"
              payload: {}
              as: CommitteeChair
          trigger:
            - call: "POST /api/print-batches/${b}/release"
              payload: {}
              as: RegistrarOfficer
              as_user_id: "reg-b-1"
              captures: { err: $.data.error_id }
          assert:
            - "error_id == ERR_CEREMONY_POSTURE_FORBIDS with HTTP 409 — release requires posture in {AUDIT_LOCKED, READY, COMMENCED, COMPLETED}, current is AUDIT_OPEN"
            - "batch remains OPEN and Diploma.${d} remains QUEUED (no partial side effects)"

  # ---------------------------------------------------------------------------
  - rule_id: resource_temporal_overlap
    instances:
      - name: rehearsal_half_open_adjacency
        grounds:
          - validations[priority=20]
          - errors[ERR_VENUE_TIME_OVERLAP]
        distinguishing_aspect: |
          Venue resource, HALF-OPEN interval semantics: [10:00,11:00) and
          [11:00,12:00) coexist (adjacency allowed), but [10:30,11:30)
          intersects and is rejected. Different resource and interval semantics
          than the buffered closed-interval vendor instance below.
        test_recipe:
          setup: ["Ceremony exists; venue V available"]
          setup_api_calls:
            - call: "POST /api/venues"
              payload: { name: "Field House", address: "3 College Ave", total_capacity: 50, accessible_capacity: 4, indoor: true }
              as: VenueCoordinator
              captures: { v: $.data.id }
            - call: "POST /api/ceremonies"
              payload: { name: "Spring Commencement", ceremony_date: "2026-06-01T15:00:00Z", venue_id: "${v}", ticket_ratio: 1.0, guest_ticket_base_cap: 4, honor_bonus_tickets: 2, pronunciation_deadline: "2026-05-20T00:00:00Z", ticket_request_deadline: "2026-05-15T00:00:00Z", regalia_order_deadline: "2026-05-10T00:00:00Z" }
              as: CommitteeChair
              captures: { c: $.data.id }
          trigger:
            - call: "POST /api/ceremonies/${c}/rehearsal-sessions"
              payload: { venue_id: "${v}", start_utc: "2026-05-25T10:00:00Z", end_utc: "2026-05-25T11:00:00Z", capacity: 30 }
              as: VenueCoordinator
              captures: { s1: $.data.id }
            - call: "POST /api/ceremonies/${c}/rehearsal-sessions"
              payload: { venue_id: "${v}", start_utc: "2026-05-25T11:00:00Z", end_utc: "2026-05-25T12:00:00Z", capacity: 30 }
              as: VenueCoordinator
              captures: { s2: $.data.id }
            - call: "POST /api/ceremonies/${c}/rehearsal-sessions"
              payload: { venue_id: "${v}", start_utc: "2026-05-25T10:30:00Z", end_utc: "2026-05-25T11:30:00Z", capacity: 30 }
              as: VenueCoordinator
              captures: { err: $.data.error_id }
          assert:
            - "S1 (10:00-11:00) and S2 (11:00-12:00) both created — half-open adjacency is allowed"
            - "S3 (10:30-11:30) rejected: error_id == ERR_VENUE_TIME_OVERLAP (10:30 < 11:00 and 10:00 < 11:30)"

      - name: vendor_buffered_closed_overlap
        grounds:
          - validations[priority=21]
          - errors[ERR_VENDOR_COVERAGE_OVERLAP]
        distinguishing_aspect: |
          VendorContract resource, BUFFERED CLOSED interval semantics: the
          existing LIVESTREAM contract 12:00-15:00 with 30-min buffer blocks
          [11:30,15:30]; a second LIVESTREAM 15:30-18:00 buffers to
          [15:00,18:30] and CONFLICTS (touching/overlapping closed intervals),
          while a PHOTOGRAPHY contract over the same window is allowed
          (overlap is per vendor_type). Different resource and semantics than
          the rehearsal instance.
        test_recipe:
          setup: ["Ceremony exists (any posture)"]
          setup_api_calls:
            - call: "POST /api/venues"
              payload: { name: "Main Arena", address: "1 College Ave", total_capacity: 10, accessible_capacity: 2, indoor: true }
              as: VenueCoordinator
              captures: { v: $.data.id }
            - call: "POST /api/ceremonies"
              payload: { name: "Spring Commencement", ceremony_date: "2026-06-01T15:00:00Z", venue_id: "${v}", ticket_ratio: 1.0, guest_ticket_base_cap: 4, honor_bonus_tickets: 2, pronunciation_deadline: "2026-05-20T00:00:00Z", ticket_request_deadline: "2026-05-15T00:00:00Z", regalia_order_deadline: "2026-05-10T00:00:00Z" }
              as: CommitteeChair
              captures: { c: $.data.id }
          trigger:
            - call: "POST /api/ceremonies/${c}/vendor-contracts"
              payload: { vendor_type: "LIVESTREAM", vendor_user_id: "vendor-1", coverage_start_utc: "2026-06-01T12:00:00Z", coverage_end_utc: "2026-06-01T15:00:00Z", setup_buffer_minutes: 30, fee_cents: 100000 }
              as: CommitteeChair
              captures: { c1: $.data.id }
            - call: "POST /api/ceremonies/${c}/vendor-contracts"
              payload: { vendor_type: "LIVESTREAM", vendor_user_id: "vendor-2", coverage_start_utc: "2026-06-01T15:30:00Z", coverage_end_utc: "2026-06-01T18:00:00Z", setup_buffer_minutes: 30, fee_cents: 80000 }
              as: CommitteeChair
              captures: { err: $.data.error_id }
            - call: "POST /api/ceremonies/${c}/vendor-contracts"
              payload: { vendor_type: "PHOTOGRAPHY", vendor_user_id: "vendor-3", coverage_start_utc: "2026-06-01T15:30:00Z", coverage_end_utc: "2026-06-01T18:00:00Z", setup_buffer_minutes: 30, fee_cents: 50000 }
              as: CommitteeChair
              captures: { c3: $.data.id }
          assert:
            - "C2 (LIVESTREAM 15:30-18:00, buffer 30) rejected: error_id == ERR_VENDOR_COVERAGE_OVERLAP — buffered closed intervals [11:30,15:30] and [15:00,18:30] intersect"
            - "C3 (PHOTOGRAPHY, same window) created — overlap rule is scoped per vendor_type"
            - "contrast with rehearsals: adjacency at a buffer boundary still conflicts here (closed semantics)"

  # ---------------------------------------------------------------------------
  - rule_id: compensating_invariant
    instances:
      - name: ticket_pool_grant_release_conservation
        grounds:
          - calculations.ticket_pool_waterfall
          - calculations.effective_capacity_and_pools
          - state_machines.TicketAllocation.ALLOCATED_to_RELEASED
        distinguishing_aspect: |
          Conserved quantity: TICKET COUNT. Invariant pinned as
          ticket_pool_total == ticket_pool_remaining + sum(granted_count over
          non-terminal allocations); grant (4+4) then release (4) restores the
          pool to 6 with zero drift. Different conserved quantity than the
          seat-inventory instance below.
        test_recipe:
          setup:
            - "Venue cap 10, ratio 1.0 (pool_total 10); eligible graduates A and B each requested 4; waterfall ran: A granted 4, B granted 4, pool_remaining 2"
          setup_api_calls:
            - call: "POST /api/venues"
              payload: { name: "Main Arena", address: "1 College Ave", total_capacity: 10, accessible_capacity: 2, indoor: true }
              as: VenueCoordinator
              captures: { v: $.data.id }
            - call: "POST /api/ceremonies"
              payload: { name: "Spring Commencement", ceremony_date: "2026-06-01T15:00:00Z", venue_id: "${v}", ticket_ratio: 1.0, guest_ticket_base_cap: 4, honor_bonus_tickets: 2, pronunciation_deadline: "2026-05-20T00:00:00Z", ticket_request_deadline: "2026-05-15T00:00:00Z", regalia_order_deadline: "2026-05-10T00:00:00Z" }
              as: CommitteeChair
              captures: { c: $.data.id }
            - call: "POST /api/ceremonies/${c}/open-audit"
              payload: {}
              as: CommitteeChair
            - call: "POST /api/graduates"
              payload: { ceremony_id: "${c}", full_name: "A Pool", email: "pa@x.edu", institutional_gpa_credits: 45, institutional_quality_points: 153.0, transfer_gpa_credits: 0, transfer_quality_points: 0, credits_completed: 120, credits_required: 120, outstanding_hold_count: 0 }
              as: RegistrarOfficer
              captures: { ga: $.data.id }
            - call: "POST /api/graduates/${ga}/audits"
              payload: {}
              as: RegistrarOfficer
            - call: "GET /api/graduates/${ga}/ticket-allocations"
              payload: {}
              as: RegistrarOfficer
              captures: { aa: "$.data[0].id", aav: "$.data[0].version" }
            - call: "POST /api/ticket-allocations/${aa}/request"
              payload: { requested_count: 4, expected_ticket_allocation_version: "${aav}" }
              as: Graduate
              as_user_id: "${ga}"
            - call: "POST /api/graduates"
              payload: { ceremony_id: "${c}", full_name: "B Pool", email: "pb@x.edu", institutional_gpa_credits: 45, institutional_quality_points: 153.0, transfer_gpa_credits: 0, transfer_quality_points: 0, credits_completed: 120, credits_required: 120, outstanding_hold_count: 0 }
              as: RegistrarOfficer
              captures: { gb: $.data.id }
            - call: "POST /api/graduates/${gb}/audits"
              payload: {}
              as: RegistrarOfficer
            - call: "GET /api/graduates/${gb}/ticket-allocations"
              payload: {}
              as: RegistrarOfficer
              captures: { ab: "$.data[0].id", abv: "$.data[0].version" }
            - call: "POST /api/ticket-allocations/${ab}/request"
              payload: { requested_count: 4, expected_ticket_allocation_version: "${abv}" }
              as: Graduate
              as_user_id: "${gb}"
            - call: "POST /api/ceremonies/${c}/lock-audit"
              payload: {}
              as: CommitteeChair
            - call: "POST /api/ceremonies/${c}/run-ticket-waterfall"
              payload: {}
              as: CommitteeChair
              captures: { pool_before: $.data.pool_remaining }
          trigger:
            - call: "POST /api/ticket-allocations/${aa}/release"
              payload: {}
              as: Graduate
              as_user_id: "${ga}"
          assert:
            - "before release: pool_remaining == 2 (10 - 4 - 4)"
            - "A's allocation: status == RELEASED, granted_count == 0"
            - "Ceremony.${c}.ticket_pool_remaining == 6 and ticket_pool_total == 10"
            - "invariant holds end-to-end: 10 == 6 + 4 (B) — grant+release is a compensating pair with zero pool drift"

      - name: seat_inventory_assign_evict_conservation
        grounds:
          - calculations.effective_capacity_and_pools
          - state_machines.SeatAssignment.ASSIGNED_to_EVICTED
        distinguishing_aspect: |
          Conserved quantity: SEAT INVENTORY. Invariant pinned as
          effective_capacity == count(ASSIGNED) + open_seat_count; assign two
          then evict one returns open_seat_count to 4 with zero drift.
          Different conserved quantity than the ticket-pool instance above.
        test_recipe:
          setup:
            - "Venue cap 5; ceremony AUDIT_LOCKED; two eligible graduates manually seated at A/1/1 and A/1/2 (open_seat_count 3)"
          setup_api_calls:
            - call: "POST /api/venues"
              payload: { name: "Small Hall", address: "4 College Ave", total_capacity: 5, accessible_capacity: 1, indoor: true }
              as: VenueCoordinator
              captures: { v: $.data.id }
            - call: "POST /api/ceremonies"
              payload: { name: "Spring Commencement", ceremony_date: "2026-06-01T15:00:00Z", venue_id: "${v}", ticket_ratio: 1.0, guest_ticket_base_cap: 4, honor_bonus_tickets: 2, pronunciation_deadline: "2026-05-20T00:00:00Z", ticket_request_deadline: "2026-05-15T00:00:00Z", regalia_order_deadline: "2026-05-10T00:00:00Z" }
              as: CommitteeChair
              captures: { c: $.data.id }
            - call: "POST /api/ceremonies/${c}/open-audit"
              payload: {}
              as: CommitteeChair
            - call: "POST /api/graduates"
              payload: { ceremony_id: "${c}", full_name: "Seat A", email: "sa@x.edu", institutional_gpa_credits: 45, institutional_quality_points: 175.5, transfer_gpa_credits: 0, transfer_quality_points: 0, credits_completed: 120, credits_required: 120, outstanding_hold_count: 0 }
              as: RegistrarOfficer
              captures: { ga: $.data.id }
            - call: "POST /api/graduates/${ga}/audits"
              payload: {}
              as: RegistrarOfficer
            - call: "POST /api/graduates"
              payload: { ceremony_id: "${c}", full_name: "Seat B", email: "sb@x.edu", institutional_gpa_credits: 45, institutional_quality_points: 153.0, transfer_gpa_credits: 0, transfer_quality_points: 0, credits_completed: 120, credits_required: 120, outstanding_hold_count: 0 }
              as: RegistrarOfficer
              captures: { gb: $.data.id }
            - call: "POST /api/graduates/${gb}/audits"
              payload: {}
              as: RegistrarOfficer
            - call: "POST /api/ceremonies/${c}/lock-audit"
              payload: {}
              as: CommitteeChair
            - call: "POST /api/seat-assignments"
              payload: { ceremony_id: "${c}", graduate_id: "${ga}", section: "A", row_label: "1", seat_number: 1 }
              as: VenueCoordinator
              captures: { s1: $.data.id }
            - call: "POST /api/seat-assignments"
              payload: { ceremony_id: "${c}", graduate_id: "${gb}", section: "A", row_label: "1", seat_number: 2 }
              as: VenueCoordinator
              captures: { s2: $.data.id }
          trigger:
            - call: "POST /api/seat-assignments/${s2}/evict"
              payload: {}
              as: VenueCoordinator
              captures: { s2_status: $.data.status, s2_reason: $.data.evicted_reason }
          assert:
            - "evicted seat: status == EVICTED, evicted_reason == MANUAL"
            - "Ceremony.${c}.open_seat_count == 4 (5 - 1 remaining ASSIGNED)"
            - "invariant holds: effective_capacity (5) == count(ASSIGNED) (1) + open_seat_count (4) — assign+evict is a compensating pair with zero seat drift"
