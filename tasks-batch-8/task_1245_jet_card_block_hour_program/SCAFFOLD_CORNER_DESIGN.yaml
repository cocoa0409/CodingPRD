                full_name: "Calc One"
                tier: "INDIVIDUAL"
                home_base_icao: "KTEB"
              as: Ops
              captures: { m_c1: $.data.id }
            - call: "POST /members/${m_c1}/cards"
              payload: { program_id: "${prog_c1}" }
              as: Ops
              captures: { c_c1: $.data.id }
            - call: "POST /cards/${c_c1}/activate"
              payload: {}
              as: Ops
            - call: "POST /aircraft"
              payload:
                tail_number: "N333LT"
                category: "LIGHT"
                home_base_icao: "KTEB"
                seats: 6
                reposition_rate_cents_per_nm: 80
              as: Ops
              captures: { ac_c1: $.data.id }
            - call: "POST /cards/${c_c1}/trips"
              payload:
                trip_kind: "ONE_WAY"
                departure_icao: "KTEB"
                arrival_icao: "KPBI"
                requested_departure_utc: "2026-01-15T15:00:00Z"
                pax_count: 4
                requested_category: "LIGHT"
              as: Member
              as_user_id: "${m_c1}"
              captures: { t_c1: $.data.id }
            - call: "POST /trips/${t_c1}/confirm"
              payload: {}
              as: Member
              as_user_id: "${m_c1}"
            - call: "POST /trips/${t_c1}/dispatch"
              payload: { dispatched_aircraft_id: "${ac_c1}" }
              as: Ops
            - call: "POST /trips/${t_c1}/depart"
              payload: {}
              as: Ops
            - call: "GET /trips/${t_c1}/legs"
              payload: {}
              as: Ops
              captures: { leg_c1: "$.data[0].id" }
          trigger:
            - call: "POST /trips/${t_c1}/complete"
              payload: { legs: [{ trip_leg_id: "${leg_c1}", actual_block_minutes: 108 }] }
              as: Ops
          assert:
            - "TripLeg.${leg_c1}.billable_minutes == 120"
            - "TripLeg.${leg_c1}.billable_hours == 2.00"

      - name: downgrade_swap_reduces_debit
        claim_type: variant_divergence
        grounds: [calculations.debited_hours_per_leg]
        distinguishing_aspect: "Downgrade swap (request MIDSIZE, dispatch LIGHT) applies swap_ratio_to_lower (0.85), debiting FEWER hours than billed."
        test_recipe:
