# =============================================================================
# §1.8 Scaffold Difficulty Design — Test Targeting Index
# Cross-references SCAFFOLD.yaml §1.1–§1.7 against the nine §0.5 Difficulty Rules.
# 9 rule_ids × 2 instances = 18 instances.
# =============================================================================
scaffold_difficulty_design:

  # ===========================================================================
  - rule_id: dual_variant_calc
    instances:
      - name: apportionment_per_capita_vs_sub_meter
        grounds:
          - calculations.utility_apportionment
          - entities.UtilityBill.fields.master_charge_cents
          - entities.Community.fields.utility_apportionment_method
          - entities.Resident.fields.household_size
        distinguishing_aspect: "Same master_charge_cents over the same 3 occupied lots yields different per-lot charges under PER_CAPITA (weight=household_size) vs SUB_METER (weight=metered_units) — apportionment operates on the UtilityBill/Lot domain."
        test_recipe:
          setup:
            - "Community CA, PER_CAPITA, with 3 occupied lots whose residents have household_size 4, 2, 1; a $100.00 (10000c) WATER bill apportioned"
          setup_api_calls:
            - call: "POST /communities"
              payload: { name: "Oak Park", state_code: "CA", utility_apportionment_method: "PER_CAPITA" }
              as: ParkManager
              captures: { comm_id: $.data.id }
            - call: "POST /lots"
              payload: { community_id: "${comm_id}", lot_number: "A1", base_rent_cents: 60000 }
              as: ParkManager
              captures: { lot1: $.data.id }
            - call: "POST /lots"
              payload: { community_id: "${comm_id}", lot_number: "A2", base_rent_cents: 60000 }
              as: ParkManager
              captures: { lot2: $.data.id }
            - call: "POST /lots"
              payload: { community_id: "${comm_id}", lot_number: "A3", base_rent_cents: 60000 }
              as: ParkManager
              captures: { lot3: $.data.id }
            - call: "POST /residents"
              payload: { community_id: "${comm_id}", full_name: "R4", household_size: 4 }
              as: ParkManager
              captures: { res1: $.data.id }
            - call: "POST /residents"
              payload: { community_id: "${comm_id}", full_name: "R2", household_size: 2 }
              as: ParkManager
              captures: { res2: $.data.id }
            - call: "POST /residents"
              payload: { community_id: "${comm_id}", full_name: "R1", household_size: 1 }
              as: ParkManager
              captures: { res3: $.data.id }
            - call: "POST /lot-leases"
              payload: { lot_id: "${lot1}", resident_id: "${res1}", start_date: "2026-01-01" }
              as: ParkManager
              captures: { lease1: $.data.id }
            - call: "POST /lot-leases/${lease1}/activate"
              payload: {}
              as: ParkManager
            - call: "POST /lot-leases"
              payload: { lot_id: "${lot2}", resident_id: "${res2}", start_date: "2026-01-01" }
              as: ParkManager
              captures: { lease2: $.data.id }
            - call: "POST /lot-leases/${lease2}/activate"
              payload: {}
              as: ParkManager
            - call: "POST /lot-leases"
              payload: { lot_id: "${lot3}", resident_id: "${res3}", start_date: "2026-01-01" }
              as: ParkManager
              captures: { lease3: $.data.id }
            - call: "POST /lot-leases/${lease3}/activate"
              payload: {}
              as: ParkManager
            - call: "POST /utility-bills"
              payload: { community_id: "${comm_id}", utility_type: "WATER", period_start: "2026-01-01", period_end: "2026-02-01", master_charge_cents: 10000 }
              as: ParkManager
              captures: { bill_id: $.data.id }
          trigger:
            - call: "POST /utility-bills/${bill_id}/apportion"
              payload: {}
              as: ParkManager
            - call: "GET /utility-charges?utility_bill_id=${bill_id}"
              payload: {}
              as: ParkManager
          assert:
            - "UtilityCharge for lot ${lot1} amount_cents == 5714"
            - "UtilityCharge for lot ${lot2} amount_cents == 2857"
            - "UtilityCharge for lot ${lot3} amount_cents == 1429"
            - "UtilityBill.${bill_id}.apportioned_total_cents == 10000"

      - name: rent_increase_capped_vs_uncapped_state
        grounds:
          - calculations.capped_rent_increase
          - entities.Community.fields.state_code
          - entities.RentSchedule.fields.proposed_rent_cents
          - entities.RentSchedule.fields.new_rent_cents
        distinguishing_aspect: "Same prior_rent_cents=60000 and proposed_rent_cents=70000 produces new_rent_cents=63000 (cap_applied) in CA but 70000 (no cap) in TX — rent-cap logic operates on the RentSchedule domain, a different entity than apportionment."
        test_recipe:
          setup:
            - "One CA lot at 60000c and one TX lot at 60000c, each gets a proposed schedule of 70000c"
          setup_api_calls:
            - call: "POST /communities"
              payload: { name: "CA Comm", state_code: "CA" }
              as: ParkManager
              captures: { comm_ca: $.data.id }
            - call: "POST /communities"
              payload: { name: "TX Comm", state_code: "TX" }
              as: ParkManager
              captures: { comm_tx: $.data.id }
            - call: "POST /lots"
              payload: { community_id: "${comm_ca}", lot_number: "C1", base_rent_cents: 60000 }
              as: ParkManager
              captures: { lot_ca: $.data.id }
            - call: "POST /lots"
              payload: { community_id: "${comm_tx}", lot_number: "T1", base_rent_cents: 60000 }
              as: ParkManager
              captures: { lot_tx: $.data.id }
          trigger:
            - call: "POST /rent-schedules"
              payload: { lot_id: "${lot_ca}", proposed_rent_cents: 70000, effective_date: "2027-01-01" }
              as: ParkManager
              captures: { sched_ca: $.data.id }
            - call: "POST /rent-schedules"
              payload: { lot_id: "${lot_tx}", proposed_rent_cents: 70000, effective_date: "2027-01-01" }
              as: ParkManager
              captures: { sched_tx: $.data.id }
          assert:
            - "RentSchedule.${sched_ca}.new_rent_cents == 63000"
            - "RentSchedule.${sched_ca}.cap_applied == true"
            - "RentSchedule.${sched_tx}.new_rent_cents == 70000"
            - "RentSchedule.${sched_tx}.cap_applied == false"

  # ===========================================================================
  - rule_id: combinatorial_formula
    instances:
      - name: apportionment_largest_remainder_rounding_order
        grounds:
          - calculations.utility_apportionment
          - entities.UtilityBill.fields.apportioned_total_cents
        distinguishing_aspect: "Mode (b) nested-rounding order: flooring each lot's raw share then distributing the leftover remainder in descending-fractional order yields lot A3=1429 not 1428; sum exactly equals master_charge_cents 10000 (floor-then-distribute, not round-each)."
        test_recipe:
          setup:
            - "Community CA PER_CAPITA, 3 occupied lots household_size 4/2/1, WATER bill 10000c (10000/7 produces non-terminating shares)"
          setup_api_calls:
            - call: "POST /communities"
              payload: { name: "Rem Park", state_code: "CA", utility_apportionment_method: "PER_CAPITA" }
              as: ParkManager
              captures: { comm_id: $.data.id }
            - call: "POST /lots"
              payload: { community_id: "${comm_id}", lot_number: "A1", base_rent_cents: 60000 }
              as: ParkManager
              captures: { lot1: $.data.id }
            - call: "POST /lots"
              payload: { community_id: "${comm_id}", lot_number: "A2", base_rent_cents: 60000 }
              as: ParkManager
              captures: { lot2: $.data.id }
            - call: "POST /lots"
              payload: { community_id: "${comm_id}", lot_number: "A3", base_rent_cents: 60000 }
              as: ParkManager
              captures: { lot3: $.data.id }
            - call: "POST /residents"
              payload: { community_id: "${comm_id}", full_name: "R4", household_size: 4 }
              as: ParkManager
              captures: { res1: $.data.id }
            - call: "POST /residents"
              payload: { community_id: "${comm_id}", full_name: "R2", household_size: 2 }
              as: ParkManager
              captures: { res2: $.data.id }
            - call: "POST /residents"
              payload: { community_id: "${comm_id}", full_name: "R1", household_size: 1 }
              as: ParkManager
              captures: { res3: $.data.id }
            - call: "POST /lot-leases"
              payload: { lot_id: "${lot1}", resident_id: "${res1}", start_date: "2026-01-01" }
              as: ParkManager
              captures: { lease1: $.data.id }
            - call: "POST /lot-leases/${lease1}/activate"
              payload: {}
              as: ParkManager
            - call: "POST /lot-leases"
              payload: { lot_id: "${lot2}", resident_id: "${res2}", start_date: "2026-01-01" }
              as: ParkManager
              captures: { lease2: $.data.id }
            - call: "POST /lot-leases/${lease2}/activate"
              payload: {}
              as: ParkManager
            - call: "POST /lot-leases"
              payload: { lot_id: "${lot3}", resident_id: "${res3}", start_date: "2026-01-01" }
              as: ParkManager
              captures: { lease3: $.data.id }
            - call: "POST /lot-leases/${lease3}/activate"
              payload: {}
              as: ParkManager
            - call: "POST /utility-bills"
              payload: { community_id: "${comm_id}", utility_type: "WATER", period_start: "2026-01-01", period_end: "2026-02-01", master_charge_cents: 10000 }
              as: ParkManager
              captures: { bill_id: $.data.id }
          trigger:
            - call: "POST /utility-bills/${bill_id}/apportion"
              payload: {}
              as: ParkManager
            - call: "GET /utility-charges?utility_bill_id=${bill_id}"
              payload: {}
              as: ParkManager
          assert:
            - "UtilityCharge for lot ${lot3} amount_cents == 1429 (gets the single remainder cent, highest fractional part .571)"
            - "sum of all UtilityCharge.amount_cents for bill ${bill_id} == 10000"

      - name: rent_cap_nested_min_floor_branch
        grounds:
          - calculations.capped_rent_increase
          - entities.Community.fields.state_code
          - entities.RentSchedule.fields.new_rent_cents
        distinguishing_aspect: "Mode (a) ≥3-input non-linear formula: new_rent_cents = min(proposed, floor(prior*(1+cap_pct(state)))) branches on state_code then nests floor inside min — OR (cap 0.07) leaves a 63000 proposal under its 64200 ceiling so new=63000 with cap_applied false."
        test_recipe:
          setup:
            - "OR lot at prior_rent 60000c, proposed 63000c (below the 7% ceiling of 64200c)"
          setup_api_calls:
            - call: "POST /communities"
              payload: { name: "OR Comm", state_code: "OR" }
              as: ParkManager
              captures: { comm_or: $.data.id }
            - call: "POST /lots"
              payload: { community_id: "${comm_or}", lot_number: "O1", base_rent_cents: 60000 }
              as: ParkManager
              captures: { lot_or: $.data.id }
          trigger:
            - call: "POST /rent-schedules"
              payload: { lot_id: "${lot_or}", proposed_rent_cents: 63000, effective_date: "2027-01-01" }
              as: ParkManager
              captures: { sched_or: $.data.id }
          assert:
            - "RentSchedule.${sched_or}.new_rent_cents == 63000"
            - "RentSchedule.${sched_or}.cap_applied == false"

  # ===========================================================================
  - rule_id: non_linear_state_machine
    instances:
      - name: rent_schedule_contest_revise_cycle
        grounds:
          - state_machines.RentSchedule.PROPOSED_to_CONTESTED
          - state_machines.RentSchedule.CONTESTED_to_PROPOSED
          - state_machines.RentSchedule.PROPOSED_to_ACCEPTED
        distinguishing_aspect: "RentSchedule cycles PROPOSED -> CONTESTED -> PROPOSED via revise, then PROPOSED -> ACCEPTED — a revision loop on the RentSchedule entity (cyclic shape)."
        test_recipe:
          setup:
            - "CA lot, a proposed schedule that the resident contests, the manager revises, and the resident then accepts"
          setup_api_calls:
            - call: "POST /communities"
              payload: { name: "Cyc Comm", state_code: "CA" }
              as: ParkManager
              captures: { comm_id: $.data.id }
            - call: "POST /lots"
              payload: { community_id: "${comm_id}", lot_number: "Y1", base_rent_cents: 60000 }
              as: ParkManager
              captures: { lot_id: $.data.id }
            - call: "POST /residents"
              payload: { community_id: "${comm_id}", full_name: "RY", household_size: 2 }
              as: ParkManager
              captures: { res_id: $.data.id }
            - call: "POST /lot-leases"
              payload: { lot_id: "${lot_id}", resident_id: "${res_id}", start_date: "2026-01-01" }
              as: ParkManager
              captures: { lease_id: $.data.id }
            - call: "POST /lot-leases/${lease_id}/activate"
              payload: {}
              as: ParkManager
            - call: "POST /rent-schedules"
              payload: { lot_id: "${lot_id}", proposed_rent_cents: 62000, effective_date: "2027-01-01" }
              as: ParkManager
              captures: { sched_id: $.data.id }
            - call: "POST /rent-schedules/${sched_id}/contest"
              payload: {}
              as: Resident
              as_user_id: "${res_id}"
          trigger:
            - call: "POST /rent-schedules/${sched_id}/revise"
              payload: { proposed_rent_cents: 61000 }
              as: ParkManager
            - call: "POST /rent-schedules/${sched_id}/accept"
              payload: {}
              as: Resident
              as_user_id: "${res_id}"
            - call: "GET /rent-schedules/${sched_id}"
              payload: {}
              as: ParkManager
          assert:
            - "RentSchedule.${sched_id}.status == ACCEPTED"
            - "RentSchedule.${sched_id}.proposed_rent_cents == 61000"
            - "RentSchedule.${sched_id}.new_rent_cents == 61000"

      - name: eviction_case_branch_cure_vs_adjudicate_vs_dismiss
        grounds:
          - state_machines.EvictionCase.NOTICE_SERVED_to_CURED
          - state_machines.EvictionCase.NOTICE_SERVED_to_ADJUDICATED
          - state_machines.EvictionCase.NOTICE_SERVED_to_DISMISSED
        distinguishing_aspect: "EvictionCase forks from NOTICE_SERVED to three terminal branches {CURED, ADJUDICATED, DISMISSED} with divergent side-effects per branch — branching shape on the EvictionCase entity, a different entity than RentSchedule."
        test_recipe:
          setup:
            - "A LEASE_VIOLATION eviction on an occupied CA lease; manager dismisses it, returning the lot to OCCUPIED"
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-01-01T00:00:00.000Z" }
              as: ParkManager
            - call: "POST /communities"
              payload: { name: "Ev Comm", state_code: "CA" }
              as: ParkManager
              captures: { comm_id: $.data.id }
            - call: "POST /lots"
              payload: { community_id: "${comm_id}", lot_number: "E1", base_rent_cents: 60000 }
              as: ParkManager
              captures: { lot_id: $.data.id }
            - call: "POST /residents"
              payload: { community_id: "${comm_id}", full_name: "RE", household_size: 2 }
              as: ParkManager
              captures: { res_id: $.data.id }
            - call: "POST /lot-leases"
              payload: { lot_id: "${lot_id}", resident_id: "${res_id}", start_date: "2026-01-01" }
              as: ParkManager
              captures: { lease_id: $.data.id }
            - call: "POST /lot-leases/${lease_id}/activate"
              payload: {}
              as: ParkManager
            - call: "POST /eviction-cases"
              payload: { lease_id: "${lease_id}", reason: "LEASE_VIOLATION" }
              as: ParkManager
              captures: { ev_id: $.data.id }
          trigger:
            - call: "POST /eviction-cases/${ev_id}/dismiss"
              payload: {}
              as: ParkManager
            - call: "GET /lots/${lot_id}"
              payload: {}
              as: ParkManager
          assert:
            - "EvictionCase.${ev_id}.status == DISMISSED"
            - "Lot.${lot_id}.status == OCCUPIED"

  # ===========================================================================
  - rule_id: transitive_cascade
    instances:
      - name: eviction_adjudicate_depth3_cascade
        grounds:
          - state_machines.EvictionCase.NOTICE_SERVED_to_ADJUDICATED
          - state_machines.Lot.EVICTING_to_VACANT
          - state_machines.LotLease.ACTIVE_to_TERMINATED
          - entities.Community.fields.occupied_lot_count
          - entities.Resident.fields.standing
        distinguishing_aspect: "Adjudication (A) terminates the lease (B); the lease termination drives the Lot to VACANT (C); the lot vacating decrements Community.occupied_lot_count and flips Resident.standing to EVICTED (D) — a depth-3 chain each link caused by the previous, originating at the adjudicate transition."
        test_recipe:
          setup:
            - "Occupied CA lease in EVICTING (NONPAYMENT, arrears >= 50000), clock advanced past the 60-day cure_deadline"
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-01-01T00:00:00.000Z" }
              as: ParkManager
            - call: "POST /communities"
              payload: { name: "Adj Comm", state_code: "CA" }
              as: ParkManager
              captures: { comm_id: $.data.id }
            - call: "POST /lots"
              payload: { community_id: "${comm_id}", lot_number: "D1", base_rent_cents: 60000 }
              as: ParkManager
              captures: { lot_id: $.data.id }
            - call: "POST /residents"
              payload: { community_id: "${comm_id}", full_name: "RD", household_size: 2 }
              as: ParkManager
              captures: { res_id: $.data.id }
            - call: "POST /lot-leases"
              payload: { lot_id: "${lot_id}", resident_id: "${res_id}", start_date: "2026-01-01" }
              as: ParkManager
              captures: { lease_id: $.data.id }
            - call: "POST /lot-leases/${lease_id}/activate"
              payload: {}
              as: ParkManager
            - call: "POST /eviction-cases"
              payload: { lease_id: "${lease_id}", reason: "NONPAYMENT" }
              as: ParkManager
              captures: { ev_id: $.data.id }
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-04-01T00:00:00.000Z" }
              as: ParkManager
          trigger:
            - call: "POST /eviction-cases/${ev_id}/adjudicate"
              payload: {}
              as: ParkManager
            - call: "GET /lots/${lot_id}"
              payload: {}
              as: ParkManager
            - call: "GET /residents/${res_id}"
              payload: {}
              as: ParkManager
            - call: "GET /communities/${comm_id}"
              payload: {}
              as: ParkManager
            - call: "GET /lot-leases/${lease_id}"
              payload: {}
              as: ParkManager
          assert:
            - "LotLease.${lease_id}.status == TERMINATED"
            - "Lot.${lot_id}.status == VACANT"
            - "Lot.${lot_id}.current_lease_id == null"
            - "Resident.${res_id}.standing == EVICTED"
            - "Community.${comm_id}.occupied_lot_count == 0"

      - name: conversion_tally_pass_depth2_cascade
        grounds:
          - state_machines.ConversionVote.OPEN_to_PASSED
          - state_machines.Lot.FROZEN_to_OCCUPIED
          - entities.Community.fields.ownership_model
          - entities.Lot.fields.status
        distinguishing_aspect: "Tally-pass (A) flips Community.ownership_model to RESIDENT_OWNED (B); that ownership flip drives every FROZEN community lot back to OCCUPIED (C) — a depth-2 chain originating at the tally transition, a different trigger than adjudicate."
        test_recipe:
          setup:
            - "RESIDENT_OWNED conversion vote OPEN over a CA community with 1 occupied (now FROZEN) lot, quorum 1.0, one YES ballot cast"
          setup_api_calls:
            - call: "POST /communities"
              payload: { name: "Conv Comm", state_code: "CA" }
              as: ParkManager
              captures: { comm_id: $.data.id }
            - call: "POST /lots"
              payload: { community_id: "${comm_id}", lot_number: "V1", base_rent_cents: 60000 }
              as: ParkManager
              captures: { lot_id: $.data.id }
            - call: "POST /residents"
              payload: { community_id: "${comm_id}", full_name: "RV", household_size: 2 }
              as: ParkManager
              captures: { res_id: $.data.id }
            - call: "POST /lot-leases"
              payload: { lot_id: "${lot_id}", resident_id: "${res_id}", start_date: "2026-01-01" }
              as: ParkManager
              captures: { lease_id: $.data.id }
            - call: "POST /lot-leases/${lease_id}/activate"
              payload: {}
              as: ParkManager
            - call: "POST /conversion-votes"
              payload: { community_id: "${comm_id}", quorum_threshold_pct: 1.0 }
              as: ParkManager
              captures: { vote_id: $.data.id }
            - call: "POST /conversion-votes/${vote_id}/open"
              payload: {}
              as: ParkManager
            - call: "POST /conversion-votes/${vote_id}/ballots"
              payload: { lot_id: "${lot_id}", choice: "YES" }
              as: ParkManager
          trigger:
            - call: "POST /conversion-votes/${vote_id}/tally"
              payload: {}
              as: ParkManager
            - call: "GET /communities/${comm_id}"
              payload: {}
              as: ParkManager
            - call: "GET /lots/${lot_id}"
              payload: {}
              as: ParkManager
          assert:
            - "ConversionVote.${vote_id}.status == PASSED"
            - "Community.${comm_id}.ownership_model == RESIDENT_OWNED"
            - "Lot.${lot_id}.status == OCCUPIED"

  # ===========================================================================
  - rule_id: priority_pair_validation_conflict
    instances:
      - name: cure_expired_temporal_beats_arrears_safety
        grounds:
          - validations[priority=12]
          - validations[priority=15]
        distinguishing_aspect: "A cure attempt that is both past cure_deadline (business_temporal, priority 12) AND has arrears still above threshold (business_safety, priority 15) returns ERR_CURE_PERIOD_EXPIRED — temporal beats safety because lower priority number wins."
        test_recipe:
          setup:
            - "NONPAYMENT eviction on a CA lease, arrears 55000 unpaid, clock advanced past the 60-day cure_deadline"
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-01-01T00:00:00.000Z" }
              as: ParkManager
            - call: "POST /communities"
              payload: { name: "P1 Comm", state_code: "CA" }
              as: ParkManager
              captures: { comm_id: $.data.id }
            - call: "POST /lots"
              payload: { community_id: "${comm_id}", lot_number: "P1", base_rent_cents: 55000 }
              as: ParkManager
              captures: { lot_id: $.data.id }
            - call: "POST /residents"
              payload: { community_id: "${comm_id}", full_name: "RP", household_size: 2 }
              as: ParkManager
              captures: { res_id: $.data.id }
            - call: "POST /lot-leases"
              payload: { lot_id: "${lot_id}", resident_id: "${res_id}", start_date: "2026-01-01" }
              as: ParkManager
              captures: { lease_id: $.data.id }
            - call: "POST /lot-leases/${lease_id}/activate"
              payload: {}
              as: ParkManager
            - call: "POST /eviction-cases"
              payload: { lease_id: "${lease_id}", reason: "NONPAYMENT" }
              as: ParkManager
              captures: { ev_id: $.data.id }
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-04-01T00:00:00.000Z" }
              as: ParkManager
          trigger:
            - call: "POST /eviction-cases/${ev_id}/cure"
              payload: {}
              as: Resident
              as_user_id: "${res_id}"
          assert:
            - "response error_id == ERR_CURE_PERIOD_EXPIRED"
            - "http status == 409"

      - name: invalid_state_beats_increase_too_soon_temporal
        grounds:
          - validations[priority=7]
          - validations[priority=11]
        distinguishing_aspect: "Applying a rent schedule that is still PROPOSED (not ACCEPTED) AND whose effective_date is < 12 months after the last EFFECTIVE schedule returns ERR_INVALID_STATE (state, priority 7), not ERR_INCREASE_TOO_SOON (business_temporal, priority 11) — a different category pair than the cure conflict."
        test_recipe:
          setup:
            - "A CA lot with a PROPOSED (un-accepted) rent schedule whose effective_date is only 1 month out"
          setup_api_calls:
            - call: "POST /communities"
              payload: { name: "P2 Comm", state_code: "CA" }
              as: ParkManager
              captures: { comm_id: $.data.id }
            - call: "POST /lots"
              payload: { community_id: "${comm_id}", lot_number: "P2", base_rent_cents: 60000 }
              as: ParkManager
