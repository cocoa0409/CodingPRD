      - name: ten_hemorrhage_bundle_ids_walked_from_a_failed_activation_to_a_blocked_stage_three_escalation
        claim_type: Error Triggerability
        grounds:
          - errors[ERR_ACTIVATION_CRITERIA_NOT_MET]
          - errors[ERR_BUNDLE_ALREADY_ACTIVE]
          - errors[ERR_BUNDLE_SCORE_NOT_COMPUTED]
          - errors[ERR_CHECKLIST_STAGE_NOT_REACHED]
          - errors[ERR_CHECKLIST_STAGE_INCOMPLETE]
          - errors[ERR_BUNDLE_STAGE_CRITERIA_NOT_MET]
          - errors[ERR_BUNDLE_STAGE_BLOCKS_RESCIND]
          - errors[ERR_BUNDLE_STAGE_BLOCKS_TRANSFER]
          - errors[ERR_OR_STANDBY_NOT_STAFFED]
          - errors[ERR_BUNDLE_NOT_CONTROLLED]
          - validations[priority 8 note (specific-over-generic carve-out)]
          - validations[priority 8.04]
          - validations[priority 8.05]
          - validations[priority 8.06]
          - validations[priority 8.1]
          - validations[priority 11.4]
          - validations[priority 11.5]
          - calculations.bundle_checklist_template
          - state_machines[SafetyBundleActivation]
        distinguishing_aspect: |
          Every id here is gated by a DIFFERENT rung of the same endpoint family, and three of them are
          only observable in a narrow window. ERR_BUNDLE_SCORE_NOT_COMPUTED requires the priority-8
          carve-out to be honoured -- a close-debrief on an ACTIVATED activation is not a declared edge,
          yet the specific 422 must win over the generic 409, which is also the precondition for
          PRIORITY CONFLICT PAIR 3 being constructible at all. ERR_BUNDLE_STAGE_BLOCKS_RESCIND needs the
          same carve-out from the other side. The escalate probes pin the 8.05-before-11.5 order twice:
          with stage-1 items PENDING the checklist id wins even though the supplied 1600 mL satisfies the
          stage threshold, and once the items are terminal the identical call with 1400 mL flips to the
          criteria id. The stage-3 probe then proves ERR_OR_STANDBY_NOT_STAFFED is only reachable AFTER
          every stage-2 item is terminal, and the resolve probe proves ERR_BUNDLE_NOT_CONTROLLED compares
          against the stage-2 reading (1600) rather than the activation reading (1200).
        test_recipe:
          setup: |
            Clock 2026-08-01T06:00:00Z, held fixed for the whole instance so every completed_at equals
            both activated_at and clock_now. One unit with two AVAILABLE LDR beds (never occupied, so the
            DIVERT bed-exhaustion branch never fires) and no OR_STANDBY shift anywhere. One RN on an
            ACTIVE CHARGE shift 05:00-15:00 who holds no CareAssignment, which is what makes her a legal
            checklist performer under priority 12 while keeping her assigned_acuity_load_units at 0. One
            TIER_I ANTEPARTUM encounter with no bed and no coverage.
          setup_api_calls:
            - call: POST /_clock/set_current_utc
              payload: { current_utc: "2026-08-01T06:00:00Z" }
              as: PerinatalSafetyOfficer
              as_user_id: "safety-officer-bootstrap"
            - call: POST /obstetric-units
              payload: { unit_name: "Bramblewood Regional Maternity LDR", licensed_ldr_beds: 3, licensed_or_rooms: 1 }
              as: PerinatalSafetyOfficer
              as_user_id: "safety-officer-bootstrap"
              captures: { unit_id: $.data.id }
            - call: POST /obstetric-units/${unit_id}/beds
              payload: { bed_label: "LDR-01", bed_type: "LDR" }
              as: PerinatalSafetyOfficer
              as_user_id: "safety-officer-bootstrap"
            - call: POST /obstetric-units/${unit_id}/beds
              payload: { bed_label: "LDR-02", bed_type: "LDR" }
              as: PerinatalSafetyOfficer
              as_user_id: "safety-officer-bootstrap"
            - call: POST /obstetric-units/${unit_id}/staff-members
              payload: { full_name: "Wren Kalinowski RN", staff_role: "RN_LABOR_DELIVERY", fetal_monitoring_cert_level: "ADVANCED", credential_expires_at: "2027-06-30T00:00:00Z" }
              as: PerinatalSafetyOfficer
              as_user_id: "safety-officer-bootstrap"
              captures: { rn_performer: $.data.id }
            - call: POST /shift-assignments
              payload: { unit_id: "${unit_id}", staff_id: "${rn_performer}", role_slot: "CHARGE", shift_start_utc: "2026-08-01T05:00:00Z", shift_end_utc: "2026-08-01T15:00:00Z" }
              as: ChargeNurse
              as_user_id: "charge-nurse-01"
              captures: { shift_charge: $.data.id }
            - call: POST /shift-assignments/${shift_charge}/activate
              payload: {}
              as: ChargeNurse
              as_user_id: "charge-nurse-01"
            - call: POST /labor-encounters
              payload: { unit_id: "${unit_id}", patient_record_code: "PRC-BRAM-5501", parity: 2, gestational_age_weeks: 39 }
              as: ChargeNurse
              as_user_id: "charge-nurse-01"
              captures: { enc_id: $.data.id }
          trigger:
            - call: POST /bundle-activations
              payload: { encounter_id: "${enc_id}", bundle_type: "OBSTETRIC_HEMORRHAGE", activation_trigger: "QBL_THRESHOLD", quantitative_blood_loss_ml: 900 }
              as: ObstetricianAttending
