            - { call: "POST /substitutes", payload: { full_name: "Sub A", base_daily_rate_cents: 20000 }, as: DistrictAdmin, captures: { subA: $.data.id } }
            - { call: "POST /qualifications", payload: { substitute_id: "${subA}", subject: "MATH", grade_band: "HIGH" }, as: DistrictAdmin }
            - { call: "POST /qualifications", payload: { substitute_id: "${subA}", subject: "SCIENCE", grade_band: "HIGH" }, as: DistrictAdmin }
            - { call: "POST /clearances", payload: { substitute_id: "${subA}", clearance_type: "BACKGROUND_CHECK", expires_on: "2027-12-31" }, as: DistrictAdmin, captures: { clrA1: $.data.id } }
            - { call: "POST /clearances/${clrA1}/verify", payload: {}, as: DistrictAdmin }
            - { call: "POST /clearances", payload: { substitute_id: "${subA}", clearance_type: "TEACHING_CREDENTIAL", expires_on: "2027-12-31" }, as: DistrictAdmin, captures: { clrA2: $.data.id } }
            - { call: "POST /clearances/${clrA2}/verify", payload: {}, as: DistrictAdmin }
            - { call: "POST /substitutes/${subA}/activate", payload: {}, as: DistrictAdmin }
            - { call: "POST /substitutes", payload: { full_name: "Sub B", base_daily_rate_cents: 18000 }, as: DistrictAdmin, captures: { subB: $.data.id } }
            - { call: "POST /qualifications", payload: { substitute_id: "${subB}", subject: "SCIENCE", grade_band: "HIGH" }, as: DistrictAdmin }
            - { call: "POST /clearances", payload: { substitute_id: "${subB}", clearance_type: "BACKGROUND_CHECK", expires_on: "2027-12-31" }, as: DistrictAdmin, captures: { clrB1: $.data.id } }
            - { call: "POST /clearances/${clrB1}/verify", payload: {}, as: DistrictAdmin }
            - { call: "POST /clearances", payload: { substitute_id: "${subB}", clearance_type: "TEACHING_CREDENTIAL", expires_on: "2027-12-31" }, as: DistrictAdmin, captures: { clrB2: $.data.id } }
            - { call: "POST /clearances/${clrB2}/verify", payload: {}, as: DistrictAdmin }
            - { call: "POST /substitutes/${subB}/activate", payload: {}, as: DistrictAdmin }
            - { call: "POST /performance-flags", payload: { substitute_id: "${subA}", school_id: "${sch1}", flag_type: "CONDUCT", severity: "MAJOR" }, as: DistrictAdmin }
            - { call: "POST /performance-flags", payload: { substitute_id: "${subA}", school_id: "${sch1}", flag_type: "TARDINESS", severity: "MAJOR" }, as: DistrictAdmin }
            - { call: "POST /performance-flags", payload: { substitute_id: "${subA}", school_id: "${sch1}", flag_type: "QUALITY", severity: "MAJOR" }, as: DistrictAdmin }
            - { call: "POST /_clock/set_current_utc", payload: { to_iso8601: "2026-07-29T00:00:00Z" }, as: DistrictAdmin }
            - { call: "POST /absences", payload: { staff_member_id: "${t1}", start_date: "2026-08-03", end_date: "2026-08-04", absence_type: "SICK", required_subject: "MATH", required_grade_band: "HIGH" }, as: Teacher, as_user_id: "${t1}", captures: { abs1: $.data.id } }
            - { call: "POST /assignments", payload: { absence_id: "${abs1}", substitute_id: "${subA}" }, as: DistrictAdmin, captures: { asg1: $.data.id } }
            - { call: "POST /assignments/${asg1}/respond", payload: { decision: "ACCEPT" }, as: Substitute, as_user_id: "${subA}" }
            - { call: "POST /absences", payload: { staff_member_id: "${t2}", start_date: "2026-08-06", end_date: "2026-08-07", absence_type: "SICK", required_subject: "SCIENCE", required_grade_band: "HIGH" }, as: Teacher, as_user_id: "${t2}", captures: { abs2: $.data.id } }
            - { call: "POST /assignments", payload: { absence_id: "${abs2}", substitute_id: "${subA}" }, as: DistrictAdmin, captures: { asg2: $.data.id } }
            - { call: "POST /assignments/${asg2}/respond", payload: { decision: "ACCEPT" }, as: Substitute, as_user_id: "${subA}" }
            - { call: "POST /_clock/set_current_utc", payload: { to_iso8601: "2026-08-02T12:00:00Z" }, as: DistrictAdmin }
          trigger:
            - { call: "POST /assignments/${asg1}/cancel", payload: {}, as: Substitute, as_user_id: "${subA}" }
            - { call: "GET /substitutes/${subA}", payload: {}, as: DistrictAdmin, captures: { subA_status: $.data.status, subA_trailing: $.data.reliability_trailing_score } }
            - { call: "GET /assignments/${asg2}", payload: {}, as: DistrictAdmin, captures: { asg2_status: $.data.status, asg2_reason: $.data.cancel_reason } }
            - { call: "GET /absences/${abs1}", payload: {}, as: DistrictAdmin, captures: { abs1_fill: $.data.fill_status } }
