  - rule_id: compensating_invariant
    instances:
      - name: refund_conserves_account_money_identity
        grounds:
          - state_machines.PremiumAccount.BILLING_to_BILLING
          - entities.PremiumAccount.fields.credit_balance_cents
          - entities.PremiumAccount.fields.amount_refunded_cents
        distinguishing_aspect: |
          Conserved quantity = money identity credit_balance_cents == amount_paid_cents +
          amount_subsidized_cents - amount_invoiced_cents - amount_refunded_cents: overpaying April by
          8800 then refunding 8800 returns credit_balance to 0 with the identity holding exactly (no drift).
        test_recipe:
          setup:
            - "Plan A account A1: April invoice 61200, payment 70000 -> credit_balance 8800; refund 8800 issued."
          setup_api_calls:
            - call: "POST /_clock/set"
              payload: { now_iso8601: "2026-03-20T00:00:00.000Z" }
              as: PlanAdministrator
            - call: "POST /plans"
              payload: { name: "Acme Plan A", applicable_premium_cents: 60000 }
              as: PlanAdministrator
              captures: { plan_id: $.data.id }
            - call: "POST /beneficiaries"
              payload: { plan_id: "${plan_id}", full_name: "B Inv1", relationship: "EMPLOYEE", original_coverage_start: "2024-01-01T00:00:00.000Z" }
              as: PlanSponsor
              captures: { ben_id: $.data.id }
            - call: "POST /events"
              payload: { plan_id: "${plan_id}", beneficiary_id: "${ben_id}", event_type: "TERMINATION", event_date: "2026-03-31T00:00:00.000Z", coverage_loss_date: "2026-04-01T00:00:00.000Z" }
              as: PlanSponsor
              captures: { event_id: $.data.id }
            - call: "POST /events/${event_id}/send-notice"
              payload: {}
              as: PlanAdministrator
              captures: { notice_id: $.data.id }
            - call: "POST /_clock/set"
              payload: { now_iso8601: "2026-04-10T00:00:00.000Z" }
              as: PlanAdministrator
            - call: "POST /notices/${notice_id}/elect"
              payload: {}
              as: QualifiedBeneficiary
              as_user_id: "${ben_id}"
              captures: { enr_id: $.data.id }
            - call: "GET /accounts?enrollment_id=${enr_id}"
              payload: {}
              as: BillingAgent
              captures: { acct_id: $.data.0.id }
            - call: "POST /accounts/${acct_id}/invoices"
              payload: { coverage_month: "2026-04" }
              as: BillingAgent
            - call: "POST /accounts/${acct_id}/payments"
              payload: { amount_cents: 70000, target_coverage_month: "2026-04" }
              as: BillingAgent
            - call: "GET /accounts/${acct_id}"
              payload: {}
              as: BillingAgent
              captures: { acct_v: $.data.version }
          trigger:
            - call: "POST /accounts/${acct_id}/refund"
              payload: { refund_amount_cents: 8800, expected_account_version: "${acct_v}" }
              as: BillingAgent
              captures: { final_credit: $.data.credit_balance_cents }
          assert:
            - "PremiumAccount.${acct_id}.credit_balance_cents == 0"
            - "PremiumAccount.${acct_id}.amount_refunded_cents == 8800"
            - "PremiumAccount.${acct_id}.amount_paid_cents == 70000"
            - "PremiumAccount.${acct_id}.amount_invoiced_cents == 61200"

      - name: hipaa_certificate_conserves_creditable_month_count
