          setup:
            - "DISPUTE fixture: FULL two-source chain where the legislative PIT estimate carries judgmental_adjustment_cents -20000000, so PIT variance is 160 bps and the round is DISPUTED with exactly one OPEN DisagreementRecord on PIT (exec 1258956684 / leg 1238956684, midpoint 1248956684)."
