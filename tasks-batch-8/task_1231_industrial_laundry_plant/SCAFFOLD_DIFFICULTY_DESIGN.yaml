              as: PlantOperator
            - call: "GET /customers/${c_id}"
              as: RouteDriver
              captures: { cust_ver: $.data.version }
            - call: "POST /stops/${s_id}/deliveries"
              payload: { category_id: "${cat_id}", pieces_promised: 10 }
              as: RouteDriver
              captures: { del_id: $.data.id }
            - call: "POST /deliveries/${del_id}/mark-delivered"
              payload: { pieces_delivered: 8, expected_customer_version: "${cust_ver}" }
              as: RouteDriver
            - call: "POST /deliveries/${del_id}/disputes"
              payload: { claimed_shortfall_pieces: 2 }
              as: CustomerContact
              as_user_id: "${c_id}"
              captures: { disp_id: $.data.id }
            - call: "POST /discrepancies/${disp_id}/start-review"
              payload: {}
              as: CustomerServiceRep
            - call: "POST /discrepancies/${disp_id}/approve"
              payload: { approved_shortfall_pieces: 2 }
              as: CustomerServiceRep
            - call: "POST /customers/${c_id}/invoices/generate"
              payload: { billing_period_start: "2026-05-01", billing_period_end: "2026-06-01" }
              as: BillingClerk
              captures: { inv_id: $.data.id }
            - call: "GET /invoices/${inv_id}"
              as: BillingClerk
              captures: { total_before: $.data.total_due_cents, credits_before: $.data.credits_cents }
            - call: "GET /customers/${c_id}"
              as: BillingClerk
              captures: { bal_before: $.data.account_balance_cents }
          trigger:
