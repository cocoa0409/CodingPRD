            - "CashOut.${co_id}.fee_cents == 10"

      - name: empty_available_set_cashout_has_no_reservable_claims
        grounds:
          - errors[ERR_CASHOUT_NOT_RESERVABLE]
          - state_machines.RewardClaim.AVAILABLE_to_RESERVED
          - entities.Member.fields.net_cashoutable_cents
        distinguishing_aspect: "Empty-collection boundary on a different metric/endpoint: a VERIFIED member with zero AVAILABLE claims (net_cashoutable_cents==0) requesting any cash-out hits the empty candidate set -> ERR_INSUFFICIENT_BALANCE (no reservable claims). Distinct metric (count of AVAILABLE claims) from the numeric minimum boundary."
