# =============================================================================
# SCAFFOLD_DIFFICULTY_DESIGN.yaml — §1.8 Test Targeting Index
# Securities Lending & Collateral Management. 9 rules x >=2 instances = 19.
# Every setup chain starts from empty-DB; the logical clock defaults to
# 2026-08-01T00:00:00Z before any /api/_clock/set_current_utc call.
# =============================================================================
scaffold_difficulty_design:
  # ---------------------------------------------------------------- rule 1
  - rule_id: dual_variant_calc
    instances:
      - name: loan_fee_provisional_rounding_vs_final_month_rounding
        grounds:
          - calculations.loan_fee_accrual
          - entities.RevenueLedgerEntry.fields.entry_type
        distinguishing_aspect: |
          Entity domain = Loan fee accrual. The provisional variant rounds each
          day's fee independently (4 x 6944 = 27776) while the final variant
          rounds the period total once (round(27777.78) = 27778), so identical
          loan data yields a +2 FEE_TRUE_UP at month-end close.
        test_recipe:
          setup:
            - "EQUITY security priced 1000c; owner (6250bps); borrower limit 2000000000c; position 1,000,000 sh @ min_fee 25bps"
            - "SECURITIES-collateral loan of 1,000,000 sh @ 25bps, BOOKED on 2026-08-01"
            - "MTM run on 2026-08-01..04 (4 accrual days at a constant 1000c price)"
          setup_api_calls:
            - { call: "POST /api/securities", payload: { symbol: "FEE1", asset_class: "EQUITY", price_cents: 1000 }, as: DeskAdmin, captures: { sec: $.data.id } }
            - { call: "POST /api/beneficial-owners", payload: { display_name: "Owner Fee", revenue_share_bps: 6250, indemnification_opt_in: false }, as: DeskAdmin, captures: { own: $.data.id } }
            - { call: "POST /api/borrowers", payload: { display_name: "Borrower Fee", credit_limit_cents: 2000000000 }, as: DeskAdmin, captures: { bor: $.data.id } }
            - { call: "POST /api/lendable-positions", payload: { owner_id: "${own}", security_id: "${sec}", quantity_total: 1000000, min_fee_bps: 25 }, as: OwnerRep, as_user_id: "${own}", captures: { pos: $.data.id } }
            - { call: "POST /api/loans", payload: { owner_id: "${own}", borrower_id: "${bor}", security_id: "${sec}", position_id: "${pos}", quantity: 1000000, collateral_type: "SECURITIES", rate_bps: 25 }, as: DeskTrader, captures: { loan: $.data.id } }
            - { call: "POST /api/loans/${loan}/accept", payload: {}, as: BorrowerRep, as_user_id: "${bor}" }
            - { call: "POST /api/ops/mark-to-market", payload: {}, as: OpsSettler }
            - { call: "POST /api/_clock/set_current_utc", payload: { to_iso8601: "2026-08-02T00:00:00Z" }, as: DeskAdmin }
            - { call: "POST /api/ops/mark-to-market", payload: {}, as: OpsSettler }
            - { call: "POST /api/_clock/set_current_utc", payload: { to_iso8601: "2026-08-03T00:00:00Z" }, as: DeskAdmin }
            - { call: "POST /api/ops/mark-to-market", payload: {}, as: OpsSettler }
            - { call: "POST /api/_clock/set_current_utc", payload: { to_iso8601: "2026-08-04T00:00:00Z" }, as: DeskAdmin }
            - { call: "POST /api/ops/mark-to-market", payload: {}, as: OpsSettler }
          trigger:
            - { call: "POST /api/ops/month-end-close", payload: { period: "2026-08" }, as: OpsSettler }
            - { call: "GET /api/ledger-entries?loan_id=${loan}&period=2026-08&entry_type=FEE_ACCRUAL_FINAL", as: OpsSettler, captures: { fee_final: "$.data[0].amount_cents" } }
            - { call: "GET /api/ledger-entries?loan_id=${loan}&period=2026-08&entry_type=FEE_TRUE_UP", as: OpsSettler, captures: { fee_trueup: "$.data[0].amount_cents" } }
          assert:
            - "Exactly 4 FEE_ACCRUAL_PROVISIONAL entries exist for Loan.${loan} in period 2026-08, each amount_cents == 6944 (sum 27776)"
            - "${fee_final} == 27778"
            - "${fee_trueup} == 2"
            - "PeriodClose for 2026-08 has status CLOSED and loans_finalized_count >= 1"

      - name: reinvestment_stated_yield_provisional_vs_nav_final
        grounds:
          - calculations.reinvestment_income
          - entities.ReinvestmentTranche.fields.realized_income_cents
        distinguishing_aspect: |
          Entity domain = ReinvestmentTranche income (different from the Loan
          fee domain). The provisional variant accrues stated yield
          (10 days x 1000 = 10000) while the final variant realizes NAV minus
          principal (10015002 - 10000000 = 15002) — a 5002 divergence on the
          same tranche, and the provisional stream is never trued-up.
        test_recipe:
          setup:
            - "EQUITY security priced 1000c; owner (6000bps); borrower limit 100000000c; position 1,000,000 sh @ 25bps"
            - "CASH-collateral loan of 10,000 sh @ rebate 0bps BOOKED on 2026-08-01; cash pledge 10,200,000c (exactly 102%)"
            - "Tranche invested: principal 10,000,000c, stated yield 360bps; MTM on 2026-08-01..10 (10 provisional days); NAV marked to 10,015,002c"
          setup_api_calls:
            - { call: "POST /api/securities", payload: { symbol: "RNV1", asset_class: "EQUITY", price_cents: 1000 }, as: DeskAdmin, captures: { sec: $.data.id } }
            - { call: "POST /api/beneficial-owners", payload: { display_name: "Owner Rnv", revenue_share_bps: 6000, indemnification_opt_in: false }, as: DeskAdmin, captures: { own: $.data.id } }
            - { call: "POST /api/borrowers", payload: { display_name: "Borrower Rnv", credit_limit_cents: 100000000 }, as: DeskAdmin, captures: { bor: $.data.id } }
            - { call: "POST /api/lendable-positions", payload: { owner_id: "${own}", security_id: "${sec}", quantity_total: 1000000, min_fee_bps: 25 }, as: OwnerRep, as_user_id: "${own}", captures: { pos: $.data.id } }
            - { call: "POST /api/loans", payload: { owner_id: "${own}", borrower_id: "${bor}", security_id: "${sec}", position_id: "${pos}", quantity: 10000, collateral_type: "CASH", rate_bps: 0 }, as: DeskTrader, captures: { loan: $.data.id } }
            - { call: "POST /api/loans/${loan}/accept", payload: {}, as: BorrowerRep, as_user_id: "${bor}" }
            - { call: "POST /api/loans/${loan}/pledges", payload: { pledge_type: "CASH", amount_cents: 10200000 }, as: BorrowerRep, as_user_id: "${bor}" }
            - { call: "POST /api/loans/${loan}/reinvestments", payload: { instrument_type: "MMF", principal_cents: 10000000, stated_yield_bps: 360 }, as: DeskTrader, captures: { tr: $.data.id } }
            - { call: "POST /api/ops/mark-to-market", payload: {}, as: OpsSettler }
            - { call: "POST /api/_clock/set_current_utc", payload: { to_iso8601: "2026-08-02T00:00:00Z" }, as: DeskAdmin }
            - { call: "POST /api/ops/mark-to-market", payload: {}, as: OpsSettler }
            - { call: "POST /api/_clock/set_current_utc", payload: { to_iso8601: "2026-08-03T00:00:00Z" }, as: DeskAdmin }
            - { call: "POST /api/ops/mark-to-market", payload: {}, as: OpsSettler }
            - { call: "POST /api/_clock/set_current_utc", payload: { to_iso8601: "2026-08-04T00:00:00Z" }, as: DeskAdmin }
            - { call: "POST /api/ops/mark-to-market", payload: {}, as: OpsSettler }
            - { call: "POST /api/_clock/set_current_utc", payload: { to_iso8601: "2026-08-05T00:00:00Z" }, as: DeskAdmin }
            - { call: "POST /api/ops/mark-to-market", payload: {}, as: OpsSettler }
            - { call: "POST /api/_clock/set_current_utc", payload: { to_iso8601: "2026-08-06T00:00:00Z" }, as: DeskAdmin }
            - { call: "POST /api/ops/mark-to-market", payload: {}, as: OpsSettler }
            - { call: "POST /api/_clock/set_current_utc", payload: { to_iso8601: "2026-08-07T00:00:00Z" }, as: DeskAdmin }
            - { call: "POST /api/ops/mark-to-market", payload: {}, as: OpsSettler }
            - { call: "POST /api/_clock/set_current_utc", payload: { to_iso8601: "2026-08-08T00:00:00Z" }, as: DeskAdmin }
            - { call: "POST /api/ops/mark-to-market", payload: {}, as: OpsSettler }
            - { call: "POST /api/_clock/set_current_utc", payload: { to_iso8601: "2026-08-09T00:00:00Z" }, as: DeskAdmin }
            - { call: "POST /api/ops/mark-to-market", payload: {}, as: OpsSettler }
            - { call: "POST /api/_clock/set_current_utc", payload: { to_iso8601: "2026-08-10T00:00:00Z" }, as: DeskAdmin }
            - { call: "POST /api/ops/mark-to-market", payload: {}, as: OpsSettler }
            - { call: "POST /api/reinvestments/${tr}/mark", payload: { current_nav_cents: 10015002 }, as: OpsSettler }
          trigger:
            - { call: "POST /api/reinvestments/${tr}/unwind", payload: {}, as: DeskTrader, captures: { realized: $.data.realized_income_cents } }
            - { call: "GET /api/ledger-entries?loan_id=${loan}&entry_type=REINVEST_INCOME_FINAL", as: OpsSettler, captures: { inc_final: "$.data[0].amount_cents" } }
          assert:
            - "Exactly 10 REINVEST_INCOME_PROVISIONAL entries exist for the tranche's loan, each amount_cents == 1000 (sum 10000)"
            - "${realized} == 15002"
            - "${inc_final} == 15002"
            - "No REINVEST_INCOME_PROVISIONAL entry is modified or removed by the unwind (final 15002 != provisional total 10000; divergence 5002 stands)"
            - "Loan.${loan}.cash_uninvested_cents == 10200000 after unwind (principal returns; gain goes to revenue only)"

  # ---------------------------------------------------------------- rule 2
  - rule_id: combinatorial_formula
    instances:
      - name: posted_collateral_per_pledge_round_then_sum
        grounds:
          - calculations.posted_collateral_value
          - entities.CollateralPledge.fields.marked_value_cents
        distinguishing_aspect: |
          Mode (b) nested rounding order: the scaffold pins round-per-pledge
          THEN sum. Two pledges of 1 share @ 22225c EQUITY (haircut 1000bps)
          each round to 20003 (20002.5 half-up), giving posted 40006;
          sum-then-round would give 40005 — a one-cent observable divergence.
        test_recipe:
          setup:
            - "Loaned security EQUITY @ 1000c; collateral security EQUITY @ 22225c (haircut 1000bps)"
            - "SECURITIES-collateral loan qty 1000 BOOKED; two 1-share pledges of the collateral security"
          setup_api_calls:
            - { call: "POST /api/securities", payload: { symbol: "RND1", asset_class: "EQUITY", price_cents: 1000 }, as: DeskAdmin, captures: { sec: $.data.id } }
            - { call: "POST /api/securities", payload: { symbol: "RND2", asset_class: "EQUITY", price_cents: 22225 }, as: DeskAdmin, captures: { csec: $.data.id } }
            - { call: "POST /api/beneficial-owners", payload: { display_name: "Owner Rnd", revenue_share_bps: 6000, indemnification_opt_in: false }, as: DeskAdmin, captures: { own: $.data.id } }
            - { call: "POST /api/borrowers", payload: { display_name: "Borrower Rnd", credit_limit_cents: 100000000 }, as: DeskAdmin, captures: { bor: $.data.id } }
            - { call: "POST /api/lendable-positions", payload: { owner_id: "${own}", security_id: "${sec}", quantity_total: 100000, min_fee_bps: 25 }, as: OwnerRep, as_user_id: "${own}", captures: { pos: $.data.id } }
            - { call: "POST /api/loans", payload: { owner_id: "${own}", borrower_id: "${bor}", security_id: "${sec}", position_id: "${pos}", quantity: 1000, collateral_type: "SECURITIES", rate_bps: 25 }, as: DeskTrader, captures: { loan: $.data.id } }
            - { call: "POST /api/loans/${loan}/accept", payload: {}, as: BorrowerRep, as_user_id: "${bor}" }
          trigger:
            - { call: "POST /api/loans/${loan}/pledges", payload: { pledge_type: "SECURITY", pledge_security_id: "${csec}", quantity: 1 }, as: BorrowerRep, as_user_id: "${bor}", captures: { p1_mark: $.data.marked_value_cents } }
            - { call: "POST /api/loans/${loan}/pledges", payload: { pledge_type: "SECURITY", pledge_security_id: "${csec}", quantity: 1 }, as: BorrowerRep, as_user_id: "${bor}", captures: { p2_mark: $.data.marked_value_cents } }
            - { call: "GET /api/loans/${loan}", as: DeskTrader, captures: { posted: $.data.posted_collateral_cents } }
          assert:
            - "${p1_mark} == 20003"
            - "${p2_mark} == 20003"
            - "${posted} == 40006 (per-pledge rounding; sum-then-round would yield 40005)"

      - name: revenue_split_owner_rounded_first_agent_residual
        grounds:
          - calculations.revenue_split_waterfall
          - calculations.loan_fee_accrual
          - calculations.reinvestment_income
        distinguishing_aspect: |
          Mode (c) pinned evaluation order for a circular-looking split: the
          pool is computed first, owner_share rounded half-up second, and the
          agent takes the residual. Pool 42780 @ 6250bps sits exactly on the
          .5/.5 rounding boundary: owner-first yields owner 26738 / agent 16042,
          while agent-first would yield agent 16043 / owner 26737.
        test_recipe:
          setup:
            - "Owner revenue_share_bps 6250; one SECURITIES loan of 1,000,000 sh @ 25bps (fee final 27778 over 4 MTM days @ 1000c)"
            - "One CASH loan of 10,000 sh @ rebate 0bps with a 10,000,000c tranche @ 360bps; NAV marked 10,015,002c and unwound in-period (final income 15002)"
            - "Net pool = 27778 + 15002 - 0 = 42780"
          setup_api_calls:
            - { call: "POST /api/securities", payload: { symbol: "SPL1", asset_class: "EQUITY", price_cents: 1000 }, as: DeskAdmin, captures: { sec: $.data.id } }
            - { call: "POST /api/beneficial-owners", payload: { display_name: "Owner Split", revenue_share_bps: 6250, indemnification_opt_in: false }, as: DeskAdmin, captures: { own: $.data.id } }
            - { call: "POST /api/borrowers", payload: { display_name: "Borrower Split", credit_limit_cents: 2000000000 }, as: DeskAdmin, captures: { bor: $.data.id } }
            - { call: "POST /api/lendable-positions", payload: { owner_id: "${own}", security_id: "${sec}", quantity_total: 1000000, min_fee_bps: 25 }, as: OwnerRep, as_user_id: "${own}", captures: { pos1: $.data.id } }
            - { call: "POST /api/lendable-positions", payload: { owner_id: "${own}", security_id: "${sec}", quantity_total: 1000000, min_fee_bps: 25 }, as: OwnerRep, as_user_id: "${own}", captures: { pos2: $.data.id } }
            - { call: "POST /api/loans", payload: { owner_id: "${own}", borrower_id: "${bor}", security_id: "${sec}", position_id: "${pos1}", quantity: 1000000, collateral_type: "SECURITIES", rate_bps: 25 }, as: DeskTrader, captures: { l1: $.data.id } }
            - { call: "POST /api/loans/${l1}/accept", payload: {}, as: BorrowerRep, as_user_id: "${bor}" }
            - { call: "POST /api/loans", payload: { owner_id: "${own}", borrower_id: "${bor}", security_id: "${sec}", position_id: "${pos2}", quantity: 10000, collateral_type: "CASH", rate_bps: 0 }, as: DeskTrader, captures: { l2: $.data.id } }
            - { call: "POST /api/loans/${l2}/accept", payload: {}, as: BorrowerRep, as_user_id: "${bor}" }
            - { call: "POST /api/loans/${l2}/pledges", payload: { pledge_type: "CASH", amount_cents: 10200000 }, as: BorrowerRep, as_user_id: "${bor}" }
            - { call: "POST /api/loans/${l2}/reinvestments", payload: { instrument_type: "REPO", principal_cents: 10000000, stated_yield_bps: 360 }, as: DeskTrader, captures: { tr: $.data.id } }
            - { call: "POST /api/ops/mark-to-market", payload: {}, as: OpsSettler }
            - { call: "POST /api/_clock/set_current_utc", payload: { to_iso8601: "2026-08-02T00:00:00Z" }, as: DeskAdmin }
            - { call: "POST /api/ops/mark-to-market", payload: {}, as: OpsSettler }
            - { call: "POST /api/_clock/set_current_utc", payload: { to_iso8601: "2026-08-03T00:00:00Z" }, as: DeskAdmin }
            - { call: "POST /api/ops/mark-to-market", payload: {}, as: OpsSettler }
            - { call: "POST /api/_clock/set_current_utc", payload: { to_iso8601: "2026-08-04T00:00:00Z" }, as: DeskAdmin }
            - { call: "POST /api/ops/mark-to-market", payload: {}, as: OpsSettler }
            - { call: "POST /api/reinvestments/${tr}/mark", payload: { current_nav_cents: 10015002 }, as: OpsSettler }
            - { call: "POST /api/reinvestments/${tr}/unwind", payload: {}, as: DeskTrader }
          trigger:
            - { call: "POST /api/ops/month-end-close", payload: { period: "2026-08" }, as: OpsSettler }
            - { call: "GET /api/ledger-entries?owner_id=${own}&period=2026-08&entry_type=REVENUE_SPLIT_OWNER", as: OpsSettler, captures: { split_owner: "$.data[0].amount_cents" } }
            - { call: "GET /api/ledger-entries?owner_id=${own}&period=2026-08&entry_type=REVENUE_SPLIT_AGENT", as: OpsSettler, captures: { split_agent: "$.data[0].amount_cents" } }
          assert:
            - "${split_owner} == 26738 (round_half_up(42780 x 0.625) = round_half_up(26737.5))"
            - "${split_agent} == 16042 (residual 42780 - 26738, NOT round(42780 x 0.375) = 16043)"
            - "${split_owner} + ${split_agent} == 42780 (no cent is created or destroyed)"

      - name: required_margin_collateral_type_branch
        grounds:
          - calculations.required_collateral_value
          - entities.Loan.fields.required_collateral_cents
        distinguishing_aspect: |
          Mode (a) >=3 inputs with a conditional branch: required collateral =
          quantity x price x margin_bps where margin_bps branches on
          collateral_type (10200 CASH vs 10500 SECURITIES). Identical quantity
          and price produce 1020000 vs 1050000 — a 30000c spread from the branch.
        test_recipe:
          setup:
            - "EQUITY security @ 1000c; owner; borrower limit 100000000c; position 100000 sh"
            - "Two loans of 1000 sh each, one CASH-collateral, one SECURITIES-collateral, both BOOKED"
          setup_api_calls:
            - { call: "POST /api/securities", payload: { symbol: "MRG1", asset_class: "EQUITY", price_cents: 1000 }, as: DeskAdmin, captures: { sec: $.data.id } }
            - { call: "POST /api/beneficial-owners", payload: { display_name: "Owner Mrg", revenue_share_bps: 6000, indemnification_opt_in: false }, as: DeskAdmin, captures: { own: $.data.id } }
            - { call: "POST /api/borrowers", payload: { display_name: "Borrower Mrg", credit_limit_cents: 100000000 }, as: DeskAdmin, captures: { bor: $.data.id } }
            - { call: "POST /api/lendable-positions", payload: { owner_id: "${own}", security_id: "${sec}", quantity_total: 100000, min_fee_bps: 25 }, as: OwnerRep, as_user_id: "${own}", captures: { pos: $.data.id } }
            - { call: "POST /api/loans", payload: { owner_id: "${own}", borrower_id: "${bor}", security_id: "${sec}", position_id: "${pos}", quantity: 1000, collateral_type: "CASH", rate_bps: 100 }, as: DeskTrader, captures: { lc: $.data.id } }
            - { call: "POST /api/loans/${lc}/accept", payload: {}, as: BorrowerRep, as_user_id: "${bor}" }
            - { call: "POST /api/loans", payload: { owner_id: "${own}", borrower_id: "${bor}", security_id: "${sec}", position_id: "${pos}", quantity: 1000, collateral_type: "SECURITIES", rate_bps: 25 }, as: DeskTrader, captures: { ls: $.data.id } }
            - { call: "POST /api/loans/${ls}/accept", payload: {}, as: BorrowerRep, as_user_id: "${bor}" }
          trigger:
            - { call: "GET /api/loans/${lc}", as: DeskTrader, captures: { req_cash: $.data.required_collateral_cents } }
            - { call: "GET /api/loans/${ls}", as: DeskTrader, captures: { req_sec: $.data.required_collateral_cents } }
          assert:
            - "${req_cash} == 1020000 (1000 x 1000 x 10200/10000)"
            - "${req_sec} == 1050000 (1000 x 1000 x 10500/10000)"
            - "${req_sec} - ${req_cash} == 30000 (branch spread on identical quantity and price)"

  # ---------------------------------------------------------------- rule 3
  - rule_id: non_linear_state_machine
    instances:
      - name: loan_negotiation_counter_cycle
        grounds:
          - state_machines.Loan.PROPOSED_to_COUNTERED
          - state_machines.Loan.COUNTERED_to_PROPOSED
          - state_machines.Loan.COUNTERED_to_BOOKED
        distinguishing_aspect: |
          Entity = Loan, shape = negotiation cycle: PROPOSED -> COUNTERED ->
          PROPOSED -> COUNTERED -> BOOKED, with the accepting role determined by
          who moved last (only DeskTrader may confirm a COUNTERED proposal).
        test_recipe:
          setup:
            - "EQUITY security @ 1000c; owner; borrower limit 100000000c; position 100000 sh @ min_fee 25bps"
            - "Direct loan proposal qty 4000 @ 25bps created by the desk (status PROPOSED, version 1)"
          setup_api_calls:
            - { call: "POST /api/securities", payload: { symbol: "NEG1", asset_class: "EQUITY", price_cents: 1000 }, as: DeskAdmin, captures: { sec: $.data.id } }
            - { call: "POST /api/beneficial-owners", payload: { display_name: "Owner Neg", revenue_share_bps: 6000, indemnification_opt_in: false }, as: DeskAdmin, captures: { own: $.data.id } }
            - { call: "POST /api/borrowers", payload: { display_name: "Borrower Neg", credit_limit_cents: 100000000 }, as: DeskAdmin, captures: { bor: $.data.id } }
            - { call: "POST /api/lendable-positions", payload: { owner_id: "${own}", security_id: "${sec}", quantity_total: 100000, min_fee_bps: 25 }, as: OwnerRep, as_user_id: "${own}", captures: { pos: $.data.id } }
            - { call: "POST /api/loans", payload: { owner_id: "${own}", borrower_id: "${bor}", security_id: "${sec}", position_id: "${pos}", quantity: 4000, collateral_type: "SECURITIES", rate_bps: 25 }, as: DeskTrader, captures: { loan: $.data.id, v1: $.data.version } }
          trigger:
            - { call: "POST /api/loans/${loan}/counter", payload: { rate_bps: 20 }, as: BorrowerRep, as_user_id: "${bor}", captures: { s1: $.data.status, v2: $.data.version } }
            - { call: "POST /api/loans/${loan}/counter", payload: { rate_bps: 22 }, as: DeskTrader, captures: { s2: $.data.status, v3: $.data.version } }
            - { call: "POST /api/loans/${loan}/counter", payload: { rate_bps: 21 }, as: BorrowerRep, as_user_id: "${bor}", captures: { s3: $.data.status, v4: $.data.version } }
            - { call: "POST /api/loans/${loan}/confirm", payload: {}, as: DeskTrader, captures: { s4: $.data.status, v5: $.data.version, rate: $.data.rate_bps } }
            - { call: "GET /api/lendable-positions/${pos}", as: DeskTrader, captures: { on_loan: $.data.quantity_on_loan, reserved: $.data.quantity_reserved } }
          assert:
            - "${s1} == COUNTERED and ${v2} == 2"
            - "${s2} == PROPOSED and ${v3} == 3 (cycle back to the desk's court)"
            - "${s3} == COUNTERED and ${v4} == 4"
            - "${s4} == BOOKED and ${v5} == 5 and ${rate} == 21 (last counter stands)"
            - "${on_loan} == 4000 and ${reserved} == 0"
            - "Loan.${loan}.original_price_cents == 1000 (captured at booking)"

      - name: regulatory_report_finalize_reopen_cycle
        grounds:
          - state_machines.RegulatoryReport.DRAFT_to_FINALIZED
          - state_machines.RegulatoryReport.FINALIZED_to_DRAFT
          - state_machines.RegulatoryReport.FINALIZED_to_FILED
        distinguishing_aspect: |
          Entity = RegulatoryReport (different from Loan), shape = rework cycle:
          DRAFT -> FINALIZED -> DRAFT -> FINALIZED -> FILED, with aggregates
          frozen on finalize and cleared to null on reopen.
        test_recipe:
          setup:
            - "Period 2026-08 closed with zero loan activity"
            - "DRAFT report for 2026-08 created by OpsSettler ops-1"
          setup_api_calls:
            - { call: "POST /api/ops/month-end-close", payload: { period: "2026-08" }, as: OpsSettler }
            - { call: "POST /api/regulatory-reports", payload: { period: "2026-08", report_type: "MONTHLY_LOAN_ACTIVITY" }, as: OpsSettler, captures: { rep: $.data.id, st0: $.data.status } }
          trigger:
            - { call: "POST /api/regulatory-reports/${rep}/finalize", payload: {}, as: OpsSettler, as_user_id: "ops-1", captures: { st1: $.data.status, onloan: $.data.total_on_loan_value_cents, fees: $.data.total_fee_income_cents } }
            - { call: "POST /api/regulatory-reports/${rep}/reopen", payload: {}, as: OpsSettler, captures: { st2: $.data.status, onloan2: $.data.total_on_loan_value_cents } }
            - { call: "POST /api/regulatory-reports/${rep}/finalize", payload: {}, as: OpsSettler, as_user_id: "ops-1", captures: { st3: $.data.status } }
            - { call: "POST /api/regulatory-reports/${rep}/file", payload: {}, as: DeskAdmin, as_user_id: "admin-9", captures: { st4: $.data.status, filed_by: $.data.filed_by_user_id } }
          assert:
            - "${st0} == DRAFT"
            - "${st1} == FINALIZED and ${onloan} == 0 and ${fees} == 0"
            - "${st2} == DRAFT and ${onloan2} == null (aggregates cleared on reopen)"
            - "${st3} == FINALIZED (second pass through the cycle)"
            - "${st4} == FILED and ${filed_by} == admin-9 (distinct from finalized_by ops-1)"

  # ---------------------------------------------------------------- rule 4
  - rule_id: transitive_cascade
    instances:
      - name: borrower_default_four_link_cascade
        grounds:
          - state_machines.Borrower.ACTIVE_to_DEFAULTED
          - state_machines.Loan.BOOKED_to_DEFAULTED
          - state_machines.CollateralPledge.ACTIVE_to_SEIZED
          - state_machines.ReinvestmentTranche.INVESTED_to_UNWOUND
          - calculations.indemnity_shortfall
        distinguishing_aspect: |
          Trigger = POST /api/borrowers/{id}/default. Depth-4 chain: borrower
          DEFAULTED (1) forces loan DEFAULTED (2), which seizes pledges (3) and
          unwinds tranches, whose unwind posts REINVEST_INCOME_FINAL and whose
          seizure values feed INDEMNITY_CREDIT (4). Each link is caused by the
          previous link's mutation, not by the original request.
        test_recipe:
          setup:
            - "Owner with indemnification_opt_in=true; borrower limit 100000000c; EQUITY security initially 1000c"
            - "CASH loan qty 1000 @ rebate 0bps BOOKED; cash pledge 1,020,000c; tranche 600,000c @ 360bps marked to 610,000c"
            - "Security price moved to 1100c (loan market value now 1,100,000c vs 1,020,000c collateral)"
            - "Borrower also has one SUBMITTED borrow request outstanding"
          setup_api_calls:
            - { call: "POST /api/securities", payload: { symbol: "DFT1", asset_class: "EQUITY", price_cents: 1000 }, as: DeskAdmin, captures: { sec: $.data.id } }
            - { call: "POST /api/beneficial-owners", payload: { display_name: "Owner Dft", revenue_share_bps: 6000, indemnification_opt_in: true }, as: DeskAdmin, captures: { own: $.data.id } }
            - { call: "POST /api/borrowers", payload: { display_name: "Borrower Dft", credit_limit_cents: 100000000 }, as: DeskAdmin, captures: { bor: $.data.id } }
            - { call: "POST /api/lendable-positions", payload: { owner_id: "${own}", security_id: "${sec}", quantity_total: 100000, min_fee_bps: 25 }, as: OwnerRep, as_user_id: "${own}", captures: { pos: $.data.id } }
            - { call: "POST /api/borrow-requests", payload: { borrower_id: "${bor}", security_id: "${sec}", quantity: 500, max_rate_bps: 40, collateral_type: "SECURITIES", needed_by_date: "2026-08-20" }, as: BorrowerRep, as_user_id: "${bor}", captures: { req: $.data.id } }
            - { call: "POST /api/loans", payload: { owner_id: "${own}", borrower_id: "${bor}", security_id: "${sec}", position_id: "${pos}", quantity: 1000, collateral_type: "CASH", rate_bps: 0 }, as: DeskTrader, captures: { loan: $.data.id } }
            - { call: "POST /api/loans/${loan}/accept", payload: {}, as: BorrowerRep, as_user_id: "${bor}" }
            - { call: "POST /api/loans/${loan}/pledges", payload: { pledge_type: "CASH", amount_cents: 1020000 }, as: BorrowerRep, as_user_id: "${bor}", captures: { plg: $.data.id } }
            - { call: "POST /api/loans/${loan}/reinvestments", payload: { instrument_type: "MMF", principal_cents: 600000, stated_yield_bps: 360 }, as: DeskTrader, captures: { tr: $.data.id } }
            - { call: "POST /api/reinvestments/${tr}/mark", payload: { current_nav_cents: 610000 }, as: OpsSettler }
            - { call: "POST /api/securities/${sec}/price", payload: { price_cents: 1100 }, as: DeskAdmin }
          trigger:
            - { call: "POST /api/borrowers/${bor}/default", payload: {}, as: RiskOfficer, captures: { bstatus: $.data.status } }
            - { call: "GET /api/loans/${loan}", as: RiskOfficer, captures: { lstatus: $.data.status, on_loan_mv: $.data.market_value_cents } }
            - { call: "GET /api/pledges/${plg}", as: RiskOfficer, captures: { pstatus: $.data.status } }
            - { call: "GET /api/reinvestments/${tr}", as: RiskOfficer, captures: { tstatus: $.data.status, tincome: $.data.realized_income_cents } }
            - { call: "GET /api/borrow-requests/${req}", as: RiskOfficer, captures: { rstatus: $.data.status } }
            - { call: "GET /api/ledger-entries?loan_id=${loan}&entry_type=COLLATERAL_SEIZURE", as: RiskOfficer, captures: { seize_amt: "$.data[0].amount_cents" } }
            - { call: "GET /api/ledger-entries?loan_id=${loan}&entry_type=INDEMNITY_CREDIT", as: RiskOfficer, captures: { indemn: "$.data[0].amount_cents" } }
            - { call: "GET /api/lendable-positions/${pos}", as: RiskOfficer, captures: { pos_on_loan: $.data.quantity_on_loan } }
          assert:
            - "${bstatus} == DEFAULTED (link 1)"
            - "${lstatus} == DEFAULTED (link 2, caused by link 1)"
            - "${pstatus} == SEIZED and ${seize_amt} == 1020000 (link 3, caused by the loan default)"
            - "${tstatus} == UNWOUND and ${tincome} == 10000 (link 3b: tranche unwound at marked NAV)"
            - "${indemn} == 80000 (link 4: max(0, 1100000 owed - 1020000 seized), owner indemnified)"
            - "${rstatus} == CANCELLED (borrower's open demand cancelled)"
            - "${pos_on_loan} == 0 (inventory released back to the owner's position)"

      - name: security_halt_three_link_cascade
        grounds:
          - state_machines.Security.LENDABLE_to_HALTED
          - state_machines.BorrowRequest.MATCHED_to_CANCELLED
          - state_machines.Loan.PROPOSED_to_CANCELLED
        distinguishing_aspect: |
          Trigger = POST /api/securities/{id}/halt (different trigger from the
          borrower-default cascade). Depth-3 chain: halt cancels open demand
          (1), a cancelled MATCHED request cancels its linked proposal (2), and
          the proposal cancellation releases the position reservation (3);
          proposals without any request are cancelled directly at link 2.
        test_recipe:
          setup:
            - "EQUITY security @ 1000c, LENDABLE; owner; borrower; position 10000 sh @ min_fee 25bps"
            - "Request R1 (3000 sh) SUBMITTED; request R2 (3000 sh) MATCHED to the position with proposal LP2; direct proposal LP3 (2000 sh)"
            - "Position: quantity_reserved == 5000, quantity_available == 5000"
          setup_api_calls:
            - { call: "POST /api/securities", payload: { symbol: "HLT1", asset_class: "EQUITY", price_cents: 1000 }, as: DeskAdmin, captures: { sec: $.data.id } }
            - { call: "POST /api/beneficial-owners", payload: { display_name: "Owner Hlt", revenue_share_bps: 6000, indemnification_opt_in: false }, as: DeskAdmin, captures: { own: $.data.id } }
            - { call: "POST /api/borrowers", payload: { display_name: "Borrower Hlt", credit_limit_cents: 100000000 }, as: DeskAdmin, captures: { bor: $.data.id } }
            - { call: "POST /api/lendable-positions", payload: { owner_id: "${own}", security_id: "${sec}", quantity_total: 10000, min_fee_bps: 25 }, as: OwnerRep, as_user_id: "${own}", captures: { pos: $.data.id } }
            - { call: "POST /api/borrow-requests", payload: { borrower_id: "${bor}", security_id: "${sec}", quantity: 3000, max_rate_bps: 40, collateral_type: "SECURITIES", needed_by_date: "2026-08-20" }, as: BorrowerRep, as_user_id: "${bor}", captures: { r1: $.data.id } }
            - { call: "POST /api/borrow-requests", payload: { borrower_id: "${bor}", security_id: "${sec}", quantity: 3000, max_rate_bps: 40, collateral_type: "SECURITIES", needed_by_date: "2026-08-20" }, as: BorrowerRep, as_user_id: "${bor}", captures: { r2: $.data.id } }
            - { call: "POST /api/borrow-requests/${r2}/match", payload: { position_id: "${pos}" }, as: DeskTrader, captures: { lp2: $.data.id } }
            - { call: "POST /api/loans", payload: { owner_id: "${own}", borrower_id: "${bor}", security_id: "${sec}", position_id: "${pos}", quantity: 2000, collateral_type: "SECURITIES", rate_bps: 28 }, as: DeskTrader, captures: { lp3: $.data.id } }
          trigger:
            - { call: "POST /api/securities/${sec}/halt", payload: {}, as: DeskAdmin, captures: { sec_status: $.data.status } }
            - { call: "GET /api/borrow-requests/${r1}", as: DeskAdmin, captures: { r1s: $.data.status } }
            - { call: "GET /api/borrow-requests/${r2}", as: DeskAdmin, captures: { r2s: $.data.status } }
            - { call: "GET /api/loans/${lp2}", as: DeskAdmin, captures: { lp2s: $.data.status } }
            - { call: "GET /api/loans/${lp3}", as: DeskAdmin, captures: { lp3s: $.data.status } }
            - { call: "GET /api/lendable-positions/${pos}", as: DeskAdmin, captures: { reserved: $.data.quantity_reserved, available: $.data.quantity_available } }
          assert:
            - "${sec_status} == HALTED"
            - "${r1s} == CANCELLED (link 1: open demand cancelled)"
            - "${r2s} == CANCELLED (link 1, MATCHED branch)"
            - "${lp2s} == CANCELLED (link 2: caused by R2's cancellation)"
            - "${lp3s} == CANCELLED (link 2, direct proposal)"
            - "${reserved} == 0 and ${available} == 10000 (link 3: reservations released)"

  # ---------------------------------------------------------------- rule 5
  - rule_id: priority_pair_validation_conflict
    instances:
      - name: state_error_beats_fiscal_error_on_confirm
        grounds:
          - validations[priority=6]
          - validations[priority=10]
          - errors[ERR_INVALID_STATE]
          - errors[ERR_CREDIT_LIMIT_EXCEEDED]
        distinguishing_aspect: |
          Category pair state(6) vs business_fiscal(10): the loan is CANCELLED
          (invalid state for confirm) AND the booking would breach the credit
          cap (prospective utilization 10000bps >= 9000). The state error wins.
        test_recipe:
          setup:
            - "EQUITY security @ 1000c; owner; borrower with a tiny 1,000,000c limit; position 1,000,000 sh"
            - "Proposal qty 1000 (market value 1,000,000c = 100% of limit) already CANCELLED by the desk"
          setup_api_calls:
            - { call: "POST /api/securities", payload: { symbol: "PRI1", asset_class: "EQUITY", price_cents: 1000 }, as: DeskAdmin, captures: { sec: $.data.id } }
            - { call: "POST /api/beneficial-owners", payload: { display_name: "Owner Pri", revenue_share_bps: 6000, indemnification_opt_in: false }, as: DeskAdmin, captures: { own: $.data.id } }
            - { call: "POST /api/borrowers", payload: { display_name: "Borrower Pri", credit_limit_cents: 1000000 }, as: DeskAdmin, captures: { bor: $.data.id } }
            - { call: "POST /api/lendable-positions", payload: { owner_id: "${own}", security_id: "${sec}", quantity_total: 1000000, min_fee_bps: 25 }, as: OwnerRep, as_user_id: "${own}", captures: { pos: $.data.id } }
            - { call: "POST /api/loans", payload: { owner_id: "${own}", borrower_id: "${bor}", security_id: "${sec}", position_id: "${pos}", quantity: 1000, collateral_type: "SECURITIES", rate_bps: 25 }, as: DeskTrader, captures: { loan: $.data.id } }
            - { call: "POST /api/loans/${loan}/cancel", payload: {}, as: DeskTrader }
          trigger:
            - { call: "POST /api/loans/${loan}/confirm", payload: {}, as: DeskTrader, captures: { err: $.data.error_id } }
          assert:
            - "${err} == ERR_INVALID_STATE (priority 6 state beats the ERR_CREDIT_LIMIT_EXCEEDED fiscal failure at priority 10)"
            - "Loan.${loan}.status remains CANCELLED; no ledger entries, no bucket changes"

      - name: sod_error_beats_window_overlap_on_override_approve
        grounds:
          - validations[priority=7]
          - validations[priority=8]
          - errors[ERR_SOD_VIOLATION]
          - errors[ERR_OVERRIDE_WINDOW_OVERLAP]
        distinguishing_aspect: |
          Category pair business_safety(7) vs business_constraint(8): the
          approver's X-User-ID equals the requester's (SoD) AND the window
          overlaps an APPROVED override. The SoD error wins.
        test_recipe:
          setup:
            - "Borrower limit 100000000c"
            - "Override O1 [2026-09-01, 2026-10-01) requested by trader-7, APPROVED by risk-1"
            - "Override O2 [2026-09-15, 2026-10-15) requested by trader-7, still REQUESTED"
          setup_api_calls:
            - { call: "POST /api/borrowers", payload: { display_name: "Borrower Sod", credit_limit_cents: 100000000 }, as: DeskAdmin, captures: { bor: $.data.id } }
            - { call: "POST /api/borrowers/${bor}/limit-overrides", payload: { new_limit_cents: 200000000, effective_from: "2026-09-01", expires_at: "2026-10-01" }, as: DeskTrader, as_user_id: "trader-7", captures: { o1: $.data.id } }
            - { call: "POST /api/limit-overrides/${o1}/approve", payload: {}, as: RiskOfficer, as_user_id: "risk-1" }
            - { call: "POST /api/borrowers/${bor}/limit-overrides", payload: { new_limit_cents: 300000000, effective_from: "2026-09-15", expires_at: "2026-10-15" }, as: DeskTrader, as_user_id: "trader-7", captures: { o2: $.data.id } }
          trigger:
            - { call: "POST /api/limit-overrides/${o2}/approve", payload: {}, as: RiskOfficer, as_user_id: "trader-7", captures: { err: $.data.error_id } }
          assert:
            - "${err} == ERR_SOD_VIOLATION (priority 7 safety beats the ERR_OVERRIDE_WINDOW_OVERLAP constraint failure at priority 8)"
            - "LimitOverride.${o2}.status remains REQUESTED"
            - "Borrower.${bor}.effective_limit_cents == 100000000 (clock is 2026-08-01, before O1's window starts; O2 was never applied)"

  # ---------------------------------------------------------------- rule 6
  - rule_id: boundary_precision_check
    instances:
      - name: utilization_exactly_9000bps_blocked_8999_allowed
        grounds:
          - calculations.borrower_utilization_bps
          - validations[priority=10]
          - errors[ERR_CREDIT_LIMIT_EXCEEDED]
        distinguishing_aspect: |
          Metric = prospective utilization in basis points, endpoint = loan
          accept. The gate is >= 9000: exactly 9000 (90,000,000c on a
          100,000,000c limit) is blocked while 8999 (89,999,000c) succeeds.
        test_recipe:
          setup:
            - "EQUITY security @ 1000c; owner; borrower limit 100,000,000c; position 1,000,000 sh"
            - "Loan A qty 50,000 BOOKED (utilization 50,000,000c = 5000bps)"
            - "Proposal B qty 40,000 (would land exactly 9000bps); proposal C qty 39,999 (would land 8999bps)"
          setup_api_calls:
            - { call: "POST /api/securities", payload: { symbol: "UTL1", asset_class: "EQUITY", price_cents: 1000 }, as: DeskAdmin, captures: { sec: $.data.id } }
            - { call: "POST /api/beneficial-owners", payload: { display_name: "Owner Utl", revenue_share_bps: 6000, indemnification_opt_in: false }, as: DeskAdmin, captures: { own: $.data.id } }
            - { call: "POST /api/borrowers", payload: { display_name: "Borrower Utl", credit_limit_cents: 100000000 }, as: DeskAdmin, captures: { bor: $.data.id } }
            - { call: "POST /api/lendable-positions", payload: { owner_id: "${own}", security_id: "${sec}", quantity_total: 1000000, min_fee_bps: 25 }, as: OwnerRep, as_user_id: "${own}", captures: { pos: $.data.id } }
            - { call: "POST /api/loans", payload: { owner_id: "${own}", borrower_id: "${bor}", security_id: "${sec}", position_id: "${pos}", quantity: 50000, collateral_type: "SECURITIES", rate_bps: 25 }, as: DeskTrader, captures: { la: $.data.id } }
            - { call: "POST /api/loans/${la}/accept", payload: {}, as: BorrowerRep, as_user_id: "${bor}" }
            - { call: "POST /api/loans", payload: { owner_id: "${own}", borrower_id: "${bor}", security_id: "${sec}", position_id: "${pos}", quantity: 40000, collateral_type: "SECURITIES", rate_bps: 25 }, as: DeskTrader, captures: { lb: $.data.id } }
            - { call: "POST /api/loans", payload: { owner_id: "${own}", borrower_id: "${bor}", security_id: "${sec}", position_id: "${pos}", quantity: 39999, collateral_type: "SECURITIES", rate_bps: 25 }, as: DeskTrader, captures: { lc: $.data.id } }
          trigger:
            - { call: "POST /api/loans/${lb}/accept", payload: {}, as: BorrowerRep, as_user_id: "${bor}", captures: { err: $.data.error_id } }
            - { call: "POST /api/loans/${lc}/accept", payload: {}, as: BorrowerRep, as_user_id: "${bor}", captures: { cs: $.data.status } }
            - { call: "GET /api/borrowers/${bor}", as: DeskTrader, captures: { util_c: $.data.utilization_cents, util_b: $.data.utilization_bps } }
          assert:
            - "${err} == ERR_CREDIT_LIMIT_EXCEEDED (90,000,000c prospective = floor 9000bps, blocked at exact boundary)"
            - "Loan.${lb}.status remains PROPOSED (rejected accept does not move state)"
            - "${cs} == BOOKED (89,999,000c prospective = floor 8999bps, one share below the boundary)"
            - "${util_c} == 89999000 and ${util_b} == 8999"

      - name: margin_deficit_zero_no_call_one_cent_call
        grounds:
          - calculations.margin_deficit_and_call_issuance
          - entities.Loan.fields.margin_status
          - errors[ERR_MARGIN_DEFICIT]
        distinguishing_aspect: |
          Metric = collateral deficit in cents, endpoint = mark-to-market run.
          Deficit uses strict > 0: posted exactly equal to required (1,020,000c)
          issues no call, while a 1-cent shortfall (1,019,999c) issues a call
          for exactly 1c.
        test_recipe:
          setup:
            - "EQUITY security @ 1000c; owner; borrower; position 100000 sh"
            - "Two CASH loans of 1000 sh each BOOKED (required 1,020,000c apiece at 102%)"
            - "L1 pledged exactly 1,020,000c; L2 pledged 1,019,999c"
          setup_api_calls:
            - { call: "POST /api/securities", payload: { symbol: "MGN1", asset_class: "EQUITY", price_cents: 1000 }, as: DeskAdmin, captures: { sec: $.data.id } }
            - { call: "POST /api/beneficial-owners", payload: { display_name: "Owner Mgn", revenue_share_bps: 6000, indemnification_opt_in: false }, as: DeskAdmin, captures: { own: $.data.id } }
            - { call: "POST /api/borrowers", payload: { display_name: "Borrower Mgn", credit_limit_cents: 100000000 }, as: DeskAdmin, captures: { bor: $.data.id } }
            - { call: "POST /api/lendable-positions", payload: { owner_id: "${own}", security_id: "${sec}", quantity_total: 100000, min_fee_bps: 25 }, as: OwnerRep, as_user_id: "${own}", captures: { pos: $.data.id } }
            - { call: "POST /api/loans", payload: { owner_id: "${own}", borrower_id: "${bor}", security_id: "${sec}", position_id: "${pos}", quantity: 1000, collateral_type: "CASH", rate_bps: 0 }, as: DeskTrader, captures: { l1: $.data.id } }
            - { call: "POST /api/loans/${l1}/accept", payload: {}, as: BorrowerRep, as_user_id: "${bor}" }
            - { call: "POST /api/loans/${l1}/pledges", payload: { pledge_type: "CASH", amount_cents: 1020000 }, as: BorrowerRep, as_user_id: "${bor}" }
            - { call: "POST /api/loans", payload: { owner_id: "${own}", borrower_id: "${bor}", security_id: "${sec}", position_id: "${pos}", quantity: 1000, collateral_type: "CASH", rate_bps: 0 }, as: DeskTrader, captures: { l2: $.data.id } }
            - { call: "POST /api/loans/${l2}/accept", payload: {}, as: BorrowerRep, as_user_id: "${bor}" }
            - { call: "POST /api/loans/${l2}/pledges", payload: { pledge_type: "CASH", amount_cents: 1019999 }, as: BorrowerRep, as_user_id: "${bor}" }
          trigger:
            - { call: "POST /api/ops/mark-to-market", payload: {}, as: OpsSettler, captures: { issued: $.data.margin_calls_issued } }
            - { call: "GET /api/margin-calls?loan_id=${l2}", as: OpsSettler, captures: { due2: "$.data[0].amount_due_cents", cstat2: "$.data[0].status" } }
            - { call: "GET /api/loans/${l1}", as: OpsSettler, captures: { m1: $.data.margin_status } }
            - { call: "GET /api/loans/${l2}", as: OpsSettler, captures: { m2: $.data.margin_status } }
          assert:
            - "${issued} == 1 (exactly one call across both loans)"
            - "GET /api/margin-calls?loan_id=${l1} returns an empty array (posted == required is NOT a deficit)"
            - "${due2} == 1 and ${cstat2} == OPEN (one-cent shortfall issues a one-cent call)"
            - "${m1} == CURRENT and ${m2} == CALL_OPEN"

  # ---------------------------------------------------------------- rule 7
  - rule_id: cross_entity_state_dependency
    instances:
      - name: loan_booking_requires_borrower_active
        grounds:
          - state_machines.Loan.PROPOSED_to_BOOKED
          - state_machines.Borrower.ACTIVE_to_SUSPENDED
          - errors[ERR_BORROWER_SUSPENDED]
        distinguishing_aspect: |
          Entity pair Loan -> Borrower: the PROPOSED -> BOOKED accept is gated
          on Borrower.status == ACTIVE; suspending the borrower blocks the
          accept, resuming unblocks the same proposal.
        test_recipe:
          setup:
            - "EQUITY security @ 1000c; owner; borrower; position 100000 sh; proposal qty 4000 @ 25bps (PROPOSED)"
            - "Borrower suspended by RiskOfficer, then later resumed"
          setup_api_calls:
            - { call: "POST /api/securities", payload: { symbol: "XDP1", asset_class: "EQUITY", price_cents: 1000 }, as: DeskAdmin, captures: { sec: $.data.id } }
            - { call: "POST /api/beneficial-owners", payload: { display_name: "Owner Xdp", revenue_share_bps: 6000, indemnification_opt_in: false }, as: DeskAdmin, captures: { own: $.data.id } }
            - { call: "POST /api/borrowers", payload: { display_name: "Borrower Xdp", credit_limit_cents: 100000000 }, as: DeskAdmin, captures: { bor: $.data.id } }
            - { call: "POST /api/lendable-positions", payload: { owner_id: "${own}", security_id: "${sec}", quantity_total: 100000, min_fee_bps: 25 }, as: OwnerRep, as_user_id: "${own}", captures: { pos: $.data.id } }
            - { call: "POST /api/loans", payload: { owner_id: "${own}", borrower_id: "${bor}", security_id: "${sec}", position_id: "${pos}", quantity: 4000, collateral_type: "SECURITIES", rate_bps: 25 }, as: DeskTrader, captures: { loan: $.data.id } }
            - { call: "POST /api/borrowers/${bor}/suspend", payload: {}, as: RiskOfficer }
          trigger:
            - { call: "POST /api/loans/${loan}/accept", payload: {}, as: BorrowerRep, as_user_id: "${bor}", captures: { err: $.data.error_id } }
            - { call: "POST /api/borrowers/${bor}/resume", payload: {}, as: RiskOfficer }
            - { call: "POST /api/loans/${loan}/accept", payload: {}, as: BorrowerRep, as_user_id: "${bor}", captures: { st: $.data.status } }
          assert:
            - "${err} == ERR_BORROWER_SUSPENDED (borrower state gates the loan transition)"
            - "${st} == BOOKED after resume (the same proposal survives the suspension window)"
            - "Loan.${loan}.original_price_cents == 1000"

      - name: reinvestment_requires_loan_booked
        grounds:
          - state_machines.ReinvestmentTranche.INVESTED_to_UNWOUND
          - entities.ReinvestmentTranche.fields.loan_id
          - errors[ERR_INVALID_STATE]
        distinguishing_aspect: |
          Entity pair ReinvestmentTranche -> Loan (different from Loan ->
          Borrower): tranche creation is the INVESTED entry transition and is
          rejected while the loan is still PROPOSED; after booking, the same
          invest call succeeds.
        test_recipe:
          setup:
            - "EQUITY security @ 1000c; owner; borrower; position 100000 sh"
            - "CASH-collateral proposal qty 1000 @ rebate 0bps, still PROPOSED"
          setup_api_calls:
            - { call: "POST /api/securities", payload: { symbol: "XDP2", asset_class: "EQUITY", price_cents: 1000 }, as: DeskAdmin, captures: { sec: $.data.id } }
            - { call: "POST /api/beneficial-owners", payload: { display_name: "Owner Xdp2", revenue_share_bps: 6000, indemnification_opt_in: false }, as: DeskAdmin, captures: { own: $.data.id } }
            - { call: "POST /api/borrowers", payload: { display_name: "Borrower Xdp2", credit_limit_cents: 100000000 }, as: DeskAdmin, captures: { bor: $.data.id } }
            - { call: "POST /api/lendable-positions", payload: { owner_id: "${own}", security_id: "${sec}", quantity_total: 100000, min_fee_bps: 25 }, as: OwnerRep, as_user_id: "${own}", captures: { pos: $.data.id } }
            - { call: "POST /api/loans", payload: { owner_id: "${own}", borrower_id: "${bor}", security_id: "${sec}", position_id: "${pos}", quantity: 1000, collateral_type: "CASH", rate_bps: 0 }, as: DeskTrader, captures: { loan: $.data.id } }
          trigger:
            - { call: "POST /api/loans/${loan}/reinvestments", payload: { instrument_type: "MMF", principal_cents: 100000, stated_yield_bps: 360 }, as: DeskTrader, captures: { err: $.data.error_id } }
            - { call: "POST /api/loans/${loan}/accept", payload: {}, as: BorrowerRep, as_user_id: "${bor}" }
            - { call: "POST /api/loans/${loan}/pledges", payload: { pledge_type: "CASH", amount_cents: 1020000 }, as: BorrowerRep, as_user_id: "${bor}" }
            - { call: "POST /api/loans/${loan}/reinvestments", payload: { instrument_type: "MMF", principal_cents: 100000, stated_yield_bps: 360 }, as: DeskTrader, captures: { tst: $.data.status } }
            - { call: "GET /api/loans/${loan}", as: DeskTrader, captures: { uninv: $.data.cash_uninvested_cents } }
          assert:
            - "${err} == ERR_INVALID_STATE (no INVESTED tranche may exist against a PROPOSED loan)"
            - "${tst} == INVESTED after the loan is BOOKED and collateral posted"
            - "${uninv} == 920000 (1,020,000 pledged - 100,000 invested)"

  # ---------------------------------------------------------------- rule 8
  - rule_id: resource_temporal_overlap
    instances:
      - name: limit_override_window_half_open_exclusion
        grounds:
          - state_machines.LimitOverride.REQUESTED_to_APPROVED
          - errors[ERR_OVERRIDE_WINDOW_OVERLAP]
          - entities.Borrower.fields.effective_limit_cents
        distinguishing_aspect: |
          Resource = Borrower, interval semantics = mutually-exclusive half-open
          windows: an APPROVED override [2026-09-01, 2026-10-01) permits a
          neighbor starting exactly 2026-10-01 but rejects an approval covering
          2026-09-30.
        test_recipe:
          setup:
            - "Borrower limit 100000000c"
            - "O1 [2026-09-01, 2026-10-01) APPROVED; O2 [2026-10-01, 2026-11-01) REQUESTED (adjacent); O3 [2026-09-30, 2026-10-15) REQUESTED (overlapping)"
          setup_api_calls:
            - { call: "POST /api/borrowers", payload: { display_name: "Borrower Win", credit_limit_cents: 100000000 }, as: DeskAdmin, captures: { bor: $.data.id } }
            - { call: "POST /api/borrowers/${bor}/limit-overrides", payload: { new_limit_cents: 200000000, effective_from: "2026-09-01", expires_at: "2026-10-01" }, as: DeskTrader, as_user_id: "trader-1", captures: { o1: $.data.id } }
            - { call: "POST /api/limit-overrides/${o1}/approve", payload: {}, as: RiskOfficer, as_user_id: "risk-1" }
            - { call: "POST /api/borrowers/${bor}/limit-overrides", payload: { new_limit_cents: 250000000, effective_from: "2026-10-01", expires_at: "2026-11-01" }, as: DeskTrader, as_user_id: "trader-1", captures: { o2: $.data.id } }
            - { call: "POST /api/borrowers/${bor}/limit-overrides", payload: { new_limit_cents: 300000000, effective_from: "2026-09-30", expires_at: "2026-10-15" }, as: DeskTrader, as_user_id: "trader-1", captures: { o3: $.data.id } }
          trigger:
            - { call: "POST /api/limit-overrides/${o2}/approve", payload: {}, as: RiskOfficer, as_user_id: "risk-2", captures: { o2s: $.data.status } }
            - { call: "POST /api/limit-overrides/${o3}/approve", payload: {}, as: RiskOfficer, as_user_id: "risk-1", captures: { err: $.data.error_id } }
          assert:
            - "${o2s} == APPROVED (half-open adjacency: [2026-09-01, 2026-10-01) and [2026-10-01, 2026-11-01) do not collide)"
            - "${err} == ERR_OVERRIDE_WINDOW_OVERLAP (O3 covers 2026-09-30 inside O1's window and 2026-10-01..14 inside O2's)"
            - "LimitOverride.${o3}.status remains REQUESTED"

      - name: forward_reservation_aggregate_capacity_per_day
        grounds:
          - calculations.forward_capacity_check
          - errors[ERR_FORWARD_CAPACITY_EXCEEDED]
          - entities.LendablePosition.fields.quantity_reserved
        distinguishing_aspect: |
          Resource = LendablePosition, interval semantics = aggregate capacity
          (different from the override's mutual exclusion): overlapping
          reservations may coexist as long as per-day summed occupancy stays
          within quantity_total, and windows ending exactly when another starts
          do not overlap.
        test_recipe:
          setup:
            - "EQUITY security @ 1000c; owner; borrower; position total 10000 sh"
            - "Clock at 2026-08-01: P1 qty 6000 term 7d [08-01, 08-08); P2 qty 4000 term 14d [08-01, 08-15) — both reserved"
            - "P3 qty 4001 term 7d would push 08-01..07 occupancy to 14001 > 10000"
          setup_api_calls:
            - { call: "POST /api/securities", payload: { symbol: "CAP1", asset_class: "EQUITY", price_cents: 1000 }, as: DeskAdmin, captures: { sec: $.data.id } }
            - { call: "POST /api/beneficial-owners", payload: { display_name: "Owner Cap", revenue_share_bps: 6000, indemnification_opt_in: false }, as: DeskAdmin, captures: { own: $.data.id } }
            - { call: "POST /api/borrowers", payload: { display_name: "Borrower Cap", credit_limit_cents: 500000000 }, as: DeskAdmin, captures: { bor: $.data.id } }
            - { call: "POST /api/lendable-positions", payload: { owner_id: "${own}", security_id: "${sec}", quantity_total: 10000, min_fee_bps: 25 }, as: OwnerRep, as_user_id: "${own}", captures: { pos: $.data.id } }
            - { call: "POST /api/loans", payload: { owner_id: "${own}", borrower_id: "${bor}", security_id: "${sec}", position_id: "${pos}", quantity: 6000, collateral_type: "SECURITIES", rate_bps: 25, term_days: 7 }, as: DeskTrader, captures: { p1: $.data.id } }
            - { call: "POST /api/loans", payload: { owner_id: "${own}", borrower_id: "${bor}", security_id: "${sec}", position_id: "${pos}", quantity: 4000, collateral_type: "SECURITIES", rate_bps: 25, term_days: 14 }, as: DeskTrader, captures: { p2: $.data.id } }
          trigger:
            - { call: "POST /api/loans", payload: { owner_id: "${own}", borrower_id: "${bor}", security_id: "${sec}", position_id: "${pos}", quantity: 4001, collateral_type: "SECURITIES", rate_bps: 25, term_days: 7 }, as: DeskTrader, captures: { err: $.data.error_id } }
            - { call: "POST /api/_clock/set_current_utc", payload: { to_iso8601: "2026-08-08T00:00:00Z" }, as: DeskAdmin }
            - { call: "POST /api/loans", payload: { owner_id: "${own}", borrower_id: "${bor}", security_id: "${sec}", position_id: "${pos}", quantity: 4001, collateral_type: "SECURITIES", rate_bps: 25, term_days: 7 }, as: DeskTrader, captures: { p4: $.data.id, p4s: $.data.status } }
            - { call: "GET /api/lendable-positions/${pos}", as: DeskTrader, captures: { reserved: $.data.quantity_reserved, available: $.data.quantity_available } }
          assert:
            - "${err} == ERR_FORWARD_CAPACITY_EXCEEDED (day 08-01 occupancy would be 6000+4000+4001 = 14001 > 10000)"
            - "${p4s} == PROPOSED (window [08-08, 08-15) misses P1 which ended 08-08 — half-open adjacency — and 4000+4001 = 8001 <= 10000)"
            - "${reserved} == 14001 (reservations are not netted per day in the bucket totals)"
            - "${available} == -4001 (bucket arithmetic is instantaneous; the per-day check is the real gate)"

  # ---------------------------------------------------------------- rule 9
  - rule_id: compensating_invariant
    instances:
      - name: lendable_quantity_bucket_conservation
        grounds:
          - state_machines.Loan.PROPOSED_to_BOOKED
          - state_machines.Loan.BOOKED_to_SETTLED
          - entities.LendablePosition.fields.quantity_available
        distinguishing_aspect: |
          Conserved quantity = share count: quantity_total ==
          quantity_reserved + quantity_on_loan + quantity_available at every
          hop of the forward action (propose, book) and its compensating action
          (full return), ending exactly at the starting buckets.
        test_recipe:
          setup:
            - "EQUITY security @ 1000c; owner; borrower; position total 10000 sh"
          setup_api_calls:
            - { call: "POST /api/securities", payload: { symbol: "INV1", asset_class: "EQUITY", price_cents: 1000 }, as: DeskAdmin, captures: { sec: $.data.id } }
            - { call: "POST /api/beneficial-owners", payload: { display_name: "Owner Inv", revenue_share_bps: 6000, indemnification_opt_in: false }, as: DeskAdmin, captures: { own: $.data.id } }
            - { call: "POST /api/borrowers", payload: { display_name: "Borrower Inv", credit_limit_cents: 100000000 }, as: DeskAdmin, captures: { bor: $.data.id } }
            - { call: "POST /api/lendable-positions", payload: { owner_id: "${own}", security_id: "${sec}", quantity_total: 10000, min_fee_bps: 25 }, as: OwnerRep, as_user_id: "${own}", captures: { pos: $.data.id, r0: $.data.quantity_reserved, l0: $.data.quantity_on_loan, a0: $.data.quantity_available } }
            - { call: "POST /api/loans", payload: { owner_id: "${own}", borrower_id: "${bor}", security_id: "${sec}", position_id: "${pos}", quantity: 4000, collateral_type: "SECURITIES", rate_bps: 25 }, as: DeskTrader, captures: { loan: $.data.id } }
          trigger:
            - { call: "GET /api/lendable-positions/${pos}", as: DeskTrader, captures: { r1: $.data.quantity_reserved, l1: $.data.quantity_on_loan, a1: $.data.quantity_available } }
            - { call: "POST /api/loans/${loan}/accept", payload: {}, as: BorrowerRep, as_user_id: "${bor}" }
            - { call: "GET /api/lendable-positions/${pos}", as: DeskTrader, captures: { r2: $.data.quantity_reserved, l2: $.data.quantity_on_loan, a2: $.data.quantity_available } }
            - { call: "POST /api/loans/${loan}/returns", payload: { quantity: 4000 }, as: BorrowerRep, as_user_id: "${bor}", captures: { lst: $.data.status } }
            - { call: "GET /api/lendable-positions/${pos}", as: DeskTrader, captures: { r3: $.data.quantity_reserved, l3: $.data.quantity_on_loan, a3: $.data.quantity_available } }
          assert:
            - "${r0}+${l0}+${a0} == 10000 with (0, 0, 10000)"
            - "${r1}+${l1}+${a1} == 10000 with (4000, 0, 6000) after the proposal"
            - "${r2}+${l2}+${a2} == 10000 with (0, 4000, 6000) after booking"
            - "${lst} == SETTLED"
            - "${r3}+${l3}+${a3} == 10000 with (0, 0, 10000) — the compensating return restores the starting buckets exactly, no drift"

      - name: cash_collateral_invest_unwind_conservation
        grounds:
          - state_machines.ReinvestmentTranche.INVESTED_to_UNWOUND
          - entities.Loan.fields.cash_uninvested_cents
          - calculations.reinvestment_income
        distinguishing_aspect: |
          Conserved quantity = collateral cash cents (different from share
          count): ACTIVE cash pledges == cash_uninvested_cents + invested
          principal at every hop; the 15,000c NAV gain lands on the revenue
          ledger only and never inflates the borrower's collateral principal.
        test_recipe:
          setup:
            - "EQUITY security @ 1000c; owner; borrower; position 100000 sh"
            - "CASH loan qty 1000 @ rebate 0bps BOOKED; cash pledge 1,020,000c ACTIVE"
          setup_api_calls:
            - { call: "POST /api/securities", payload: { symbol: "INV2", asset_class: "EQUITY", price_cents: 1000 }, as: DeskAdmin, captures: { sec: $.data.id } }
            - { call: "POST /api/beneficial-owners", payload: { display_name: "Owner Inv2", revenue_share_bps: 6000, indemnification_opt_in: false }, as: DeskAdmin, captures: { own: $.data.id } }
            - { call: "POST /api/borrowers", payload: { display_name: "Borrower Inv2", credit_limit_cents: 100000000 }, as: DeskAdmin, captures: { bor: $.data.id } }
            - { call: "POST /api/lendable-positions", payload: { owner_id: "${own}", security_id: "${sec}", quantity_total: 100000, min_fee_bps: 25 }, as: OwnerRep, as_user_id: "${own}", captures: { pos: $.data.id } }
            - { call: "POST /api/loans", payload: { owner_id: "${own}", borrower_id: "${bor}", security_id: "${sec}", position_id: "${pos}", quantity: 1000, collateral_type: "CASH", rate_bps: 0 }, as: DeskTrader, captures: { loan: $.data.id } }
            - { call: "POST /api/loans/${loan}/accept", payload: {}, as: BorrowerRep, as_user_id: "${bor}" }
            - { call: "POST /api/loans/${loan}/pledges", payload: { pledge_type: "CASH", amount_cents: 1020000 }, as: BorrowerRep, as_user_id: "${bor}" }
          trigger:
            - { call: "GET /api/loans/${loan}", as: DeskTrader, captures: { u0: $.data.cash_uninvested_cents } }
            - { call: "POST /api/loans/${loan}/reinvestments", payload: { instrument_type: "TIME_DEPOSIT", principal_cents: 600000, stated_yield_bps: 360 }, as: DeskTrader, captures: { tr: $.data.id } }
            - { call: "GET /api/loans/${loan}", as: DeskTrader, captures: { u1: $.data.cash_uninvested_cents } }
            - { call: "POST /api/reinvestments/${tr}/mark", payload: { current_nav_cents: 615000 }, as: OpsSettler }
            - { call: "POST /api/reinvestments/${tr}/unwind", payload: {}, as: DeskTrader, captures: { gain: $.data.realized_income_cents } }
            - { call: "GET /api/loans/${loan}", as: DeskTrader, captures: { u2: $.data.cash_uninvested_cents, posted: $.data.posted_collateral_cents } }
          assert:
            - "${u0} == 1020000 (pledged == uninvested + 0 invested)"
            - "${u1} == 420000 (1,020,000 pledged == 420,000 uninvested + 600,000 invested principal)"
            - "${gain} == 15000 (615,000 - 600,000)"
            - "${u2} == 1020000 and ${posted} == 1020000 (compensating unwind restores the invariant; gain excluded from collateral cash)"
