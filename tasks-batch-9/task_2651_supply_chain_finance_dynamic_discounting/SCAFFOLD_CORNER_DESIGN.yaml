              payload: { current_utc: "2026-08-02T00:00:00Z" }
              as: PlatformOps
            - call: "GET /invoices"
              payload: { file_id: "${file_id}" }
              as: BuyerAdmin
              as_user_id: "${buyer_id}"
              captures: { invoice_id: "$.data[0].id", invoice_version: "$.data[0].version" }
            - call: "POST /discount-offers"
              payload: { invoice_id: "${invoice_id}", session_id: "${session_id}", offered_apr_bps: 900, requested_pay_date: "2026-08-07T00:00:00Z", acceptance_deadline: "2026-08-20T00:00:00Z", expected_invoice_version: "${invoice_version}" }
              as: Supplier
              as_user_id: "${supplier_id}"
              captures: { offer_id: "$.data.id" }
            - call: "POST /discount-offers/${offer_id}/accept"
              payload: {}
              as: BuyerAdmin
              as_user_id: "${buyer_id}"
              captures: { offer_version: "$.data.version" }
          trigger:
            - call: "POST /early-payments"
              payload: { offer_id: "${offer_id}", expected_offer_version: "${offer_version}" }
              as: BuyerTreasury
              as_user_id: "${buyer_id}"
              captures: { payment_id: "$.data.id", create_discount: "$.data.discount_amount_cents", create_fee: "$.data.funder_fee_cents", create_net: "$.data.net_payment_cents", create_default_acct: "$.data.default_accounting_status", create_acct: "$.data.accounting_status", create_settlement: "$.data.settlement_status", create_funder: "$.data.funder_id" }
            - call: "GET /funders/${funder_id}"
              payload: {}
              as: PlatformOps
              captures: { enc_after: "$.data.encumbered_capital_cents", avail_after: "$.data.available_capital_cents" }
            - call: "GET /early-payments/${payment_id}"
              payload: {}
              as: BuyerTreasury
              as_user_id: "${buyer_id}"
              captures: { read_discount: "$.data.discount_amount_cents", read_fee: "$.data.funder_fee_cents", read_net: "$.data.net_payment_cents", read_default_acct: "$.data.default_accounting_status" }
            - call: "GET /invoices/${invoice_id}"
              payload: {}
              as: BuyerTreasury
              as_user_id: "${buyer_id}"
              captures: { inv_covered: "$.data.face_covered_cents", inv_remaining: "$.data.remaining_face_cents" }
          assert:
            - "the create response itself already carries create_discount == 1350 (100000*900*54/3600000), create_fee == 444 (round_half_up(98650*45/10000) at the lowest tier with fee_spread_bps 0) and create_net == 98206 - none of them null or 0 pending a later recompute"
            - "create_funder == ${funder_id}, create_settlement == UNSENT and create_acct == UNCLASSIFIED"
            - "create_default_acct == DEBT_RECLASSIFIED because days_early 54 > reclass_days_threshold 30, even though accepted_apr_bps 900 is not strictly above reclass_apr_threshold_bps 900"
            - "enc_after == 98206 and avail_after == 59901794 on the read that immediately follows the create - the ledger needed no settling time, and 98206 + 59901794 == 60000000"
            - "read_discount == 1350, read_fee == 444, read_net == 98206 and read_default_acct == DEBT_RECLASSIFIED - the read-back matches the create response field for field"
            - "inv_covered == 100000 and inv_remaining == 0 on the invoice read immediately after the create - the cross-entity write is visible too"
