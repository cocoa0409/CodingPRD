        payload:
          name: FY26 Presidents Circle
          fiscal_year: 2026
          qualification_metric: NET_REVENUE_CENTS
          sales_period_start: '2026-01-01T00:00:00Z'
          sales_period_end: '2026-06-30T00:00:00Z'
          budget_total_cents: 20000000
        as: ProgramDirector
        as_user_id: pd-01
        captures:
          p_id: $.data.id
      - call: POST /award-tiers
        payload:
          program_id: ${p_id}
          tier_code: PLATINUM
          tier_rank: 1
          qualification_threshold: 250000000
          budget_per_qualifier_cents: 2500000
          guest_allowance: 1
          air_cabin_class: BUSINESS
          upgrade_allowance_cents: 150000
          service_load_bp: 1275
        as: ProgramDirector
        as_user_id: pd-01
        captures:
          t1_id: $.data.id
      - call: POST /award-tiers
        payload:
          program_id: ${p_id}
          tier_code: GOLD
          tier_rank: 2
          qualification_threshold: 150000000
          budget_per_qualifier_cents: 1600000
          guest_allowance: 1
          air_cabin_class: PREMIUM_ECONOMY
          upgrade_allowance_cents: 40000
          service_load_bp: 800
        as: ProgramDirector
        as_user_id: pd-01
        captures:
          t2_id: $.data.id
      trigger:
      - GET /award-tiers/${t1_id} as ProgramDirector pd-01 and inspect the returned key set.
      - POST /award-tiers with tier_code "PLATINUM" and tier_rank 3 for the same program as ProgramDirector
        pd-01.
      - POST /award-tiers with tier_code "BRONZE" and tier_rank 1 for the same program as ProgramDirector
        pd-01.
      assert:
      - the AwardTier body contains id and created_at but NO version and NO updated_at field.
      - §1.5 declares no PATCH, PUT or DELETE route for /award-tiers/{tier_id} — the row is write-once.
      - the duplicate tier_code returns error_id "ERR_DUPLICATE_TIER_KEY" with HTTP 409.
      - the duplicate tier_rank returns error_id "ERR_DUPLICATE_TIER_KEY" with HTTP 409 — both halves
        of the composite key are enforced.
      - GET /award-tiers?program_id=${p_id} still returns total_count 2 with the original tier_code and
        tier_rank values untouched.
      - because tier_rank is unique per program, calculations.tier_assignment_selector has a total order
        and never needs an id-based tie-break.
