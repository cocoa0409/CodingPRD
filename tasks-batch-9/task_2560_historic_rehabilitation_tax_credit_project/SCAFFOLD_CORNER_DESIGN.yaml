# =============================================================================
# 1.9 Scaffold Corner Design — breadth probe for
# tasks/task_2560_historic_rehabilitation_tax_credit_project
#
# Taxonomy: references/claim-extraction-guide.md. `section:` values are the
# guide's nine sections; `claim_type:` values are its per-section rows.
# Corners already asserted by SCAFFOLD_DIFFICULTY_DESIGN.yaml are emitted as
# `excluded_because:` stubs with no test_recipe.
# =============================================================================
scaffold_corner_design:
  - section: entities
    instances:
      - name: property_creation_returns_201_with_system_and_computed_fields
        claim_type: creation
        grounds:
          - entities.Property
          - endpoints[POST /properties]
        distinguishing_aspect: "POST /properties with every required field returns 201 and a body carrying name, street_address, city, state_code, year_built, listing_status, evaluation_status == UNEVALUATED, open_project_count == 0 and version == 1."
        test_recipe:
          setup:
            - "Empty database; logical clock at 2026-09-01T00:00:00Z."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-09-01T00:00:00Z" }
              as: PlatformAdmin
          trigger:
            - call: "POST /properties"
              payload: { name: "Elm Mill", street_address: "120 Elm Street", city: "Dayton", state_code: "OH", year_built: 1912, listing_status: "INDIVIDUAL_LISTED" }
              as: PlatformAdmin
              captures: { prop_id: $.data.id }
          assert:
            - "response HTTP status == 201"
            - "response meta.api_request_id and meta.api_request_timestamp are present"
            - "response response_type == object"
            - "Property.${prop_id}.name == Elm Mill"
            - "Property.${prop_id}.year_built == 1912"
            - "Property.${prop_id}.listing_status == INDIVIDUAL_LISTED"
            - "Property.${prop_id}.evaluation_status == UNEVALUATED"
            - "Property.${prop_id}.certified_at == null"
            - "Property.${prop_id}.open_project_count == 0"
            - "Property.${prop_id}.version == 1"

      - name: project_retrieval_returns_stored_and_derived_fields
        claim_type: retrieval
        grounds:
          - entities.Project
          - endpoints[GET /projects/{id}]
        distinguishing_aspect: "GET /projects/{id} returns the stored inputs unchanged and the derived measuring_period_end_date == 2028-09-01, certification_status == PRE_CERTIFICATION and compliance_status == NOT_MONITORED."
        test_recipe:
          setup:
            - "One developer, one property and one project with a 24-month measuring period starting 2026-09-01."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-09-01T00:00:00Z" }
              as: PlatformAdmin
            - call: "POST /developers"
              payload: { legal_name: "Elm Mill Partners LLC", taxpayer_id_last4: "4821", entity_type: "LLC" }
              as: PlatformAdmin
              captures: { dev_id: $.data.id }
            - call: "POST /properties"
              payload: { name: "Elm Mill", street_address: "120 Elm Street", city: "Dayton", state_code: "OH", year_built: 1912, listing_status: "INDIVIDUAL_LISTED" }
              as: PlatformAdmin
              captures: { prop_id: $.data.id }
            - call: "POST /projects"
              payload: { developer_id: "${dev_id}", property_id: "${prop_id}", project_name: "Elm Mill Rehab", structure_type: "MASTER_LEASE", adjusted_basis_cents: 60000000, measuring_period_months: 24, measuring_period_start_date: "2026-09-01" }
              as: Developer
              as_user_id: "${dev_id}"
              captures: { proj_id: $.data.id }
          trigger:
            - call: "GET /projects/${proj_id}"
              payload: {}
              as: Developer
              as_user_id: "${dev_id}"
          assert:
            - "response HTTP status == 200"
            - "Project.${proj_id}.developer_id == ${dev_id}"
            - "Project.${proj_id}.property_id == ${prop_id}"
            - "Project.${proj_id}.structure_type == MASTER_LEASE"
            - "Project.${proj_id}.adjusted_basis_cents == 60000000"
            - "Project.${proj_id}.measuring_period_end_date == 2028-09-01"
            - "Project.${proj_id}.certification_status == PRE_CERTIFICATION"
            - "Project.${proj_id}.compliance_status == NOT_MONITORED"
            - "Project.${proj_id}.substantial_test_threshold_cents == 60000000"
            - "Project.${proj_id}.substantial_test_status == NOT_MET"

      - name: project_listing_paginates_with_total_count_and_has_more
        claim_type: listing
        grounds:
          - entities.Project
          - endpoints[GET /projects]
          - response_envelope.pagination_fields
        distinguishing_aspect: "With three projects for one developer, GET /projects?developer_id=&limit=2&offset=0 returns 2 rows with total_count == 3 and has_more == true, and offset=2 returns 1 row with has_more == false."
        test_recipe:
          setup:
            - "One developer, three properties, one project per property (so no measuring-period contention)."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-09-01T00:00:00Z" }
              as: PlatformAdmin
            - call: "POST /developers"
              payload: { legal_name: "Elm Mill Partners LLC", taxpayer_id_last4: "4821", entity_type: "LLC" }
              as: PlatformAdmin
              captures: { dev_id: $.data.id }
            - call: "POST /properties"
              payload: { name: "Elm Mill", street_address: "120 Elm Street", city: "Dayton", state_code: "OH", year_built: 1912, listing_status: "INDIVIDUAL_LISTED" }
              as: PlatformAdmin
              captures: { prop1_id: $.data.id }
            - call: "POST /properties"
              payload: { name: "Oak Foundry", street_address: "44 Oak Street", city: "Dayton", state_code: "OH", year_built: 1905, listing_status: "INDIVIDUAL_LISTED" }
              as: PlatformAdmin
              captures: { prop2_id: $.data.id }
            - call: "POST /properties"
              payload: { name: "Canal Warehouse", street_address: "9 Canal Road", city: "Dayton", state_code: "OH", year_built: 1898, listing_status: "INDIVIDUAL_LISTED" }
              as: PlatformAdmin
              captures: { prop3_id: $.data.id }
            - call: "POST /projects"
              payload: { developer_id: "${dev_id}", property_id: "${prop1_id}", project_name: "Elm Mill Rehab", structure_type: "SINGLE_TIER", adjusted_basis_cents: 60000000, measuring_period_months: 24, measuring_period_start_date: "2026-09-01" }
              as: Developer
              as_user_id: "${dev_id}"
            - call: "POST /projects"
              payload: { developer_id: "${dev_id}", property_id: "${prop2_id}", project_name: "Oak Foundry Rehab", structure_type: "SINGLE_TIER", adjusted_basis_cents: 60000000, measuring_period_months: 24, measuring_period_start_date: "2026-09-01" }
              as: Developer
              as_user_id: "${dev_id}"
            - call: "POST /projects"
              payload: { developer_id: "${dev_id}", property_id: "${prop3_id}", project_name: "Canal Warehouse Rehab", structure_type: "SINGLE_TIER", adjusted_basis_cents: 60000000, measuring_period_months: 24, measuring_period_start_date: "2026-09-01" }
              as: Developer
              as_user_id: "${dev_id}"
          trigger:
            - call: "GET /projects"
              payload: { developer_id: "${dev_id}", limit: 2, offset: 0 }
              as: Developer
              as_user_id: "${dev_id}"
            - call: "GET /projects"
              payload: { developer_id: "${dev_id}", limit: 2, offset: 2 }
              as: Developer
              as_user_id: "${dev_id}"
          assert:
            - "first call: response_type == array and data contains exactly 2 rows"
            - "first call: total_count == 3 and has_more == true and limit == 2 and offset == 0"
            - "second call: data contains exactly 1 row"
            - "second call: total_count == 3 and has_more == false and offset == 2"

      - name: project_detail_read_with_unknown_id_returns_not_found
        claim_type: not_found
        grounds:
          - errors[ERR_PROJECT_NOT_FOUND]
          - validations[priority=40]
        distinguishing_aspect: "GET /projects/{id} for an id no row carries returns 404 ERR_PROJECT_NOT_FOUND rather than an empty 200 body."
        test_recipe:
          setup:
            - "Empty database except the platform clock."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-09-01T00:00:00Z" }
              as: PlatformAdmin
            - call: "POST /developers"
              payload: { legal_name: "Elm Mill Partners LLC", taxpayer_id_last4: "4821", entity_type: "LLC" }
              as: PlatformAdmin
              captures: { dev_id: $.data.id }
          trigger:
            - call: "GET /projects/11111111-1111-1111-1111-111111111111"
              payload: {}
              as: Developer
              as_user_id: "${dev_id}"
              captures: { err_id: $.data.error_id }
          assert:
            - "response HTTP status == 404"
            - "response response_type == error"
            - "response data.error_id == ERR_PROJECT_NOT_FOUND"

      - name: project_creation_missing_required_adjusted_basis_returns_invalid_request
        claim_type: required_fields
        grounds:
          - entities.Project.fields.adjusted_basis_cents
          - validations[priority=30]
          - errors[ERR_INVALID_REQUEST]
        distinguishing_aspect: "adjusted_basis_cents has source input, is required and has no default, so omitting it returns 400 ERR_INVALID_REQUEST and creates no Project row."
        test_recipe:
          setup:
            - "One developer and one property."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-09-01T00:00:00Z" }
              as: PlatformAdmin
            - call: "POST /developers"
              payload: { legal_name: "Elm Mill Partners LLC", taxpayer_id_last4: "4821", entity_type: "LLC" }
              as: PlatformAdmin
              captures: { dev_id: $.data.id }
            - call: "POST /properties"
              payload: { name: "Elm Mill", street_address: "120 Elm Street", city: "Dayton", state_code: "OH", year_built: 1912, listing_status: "INDIVIDUAL_LISTED" }
              as: PlatformAdmin
              captures: { prop_id: $.data.id }
          trigger:
            - call: "POST /projects"
              payload: { developer_id: "${dev_id}", property_id: "${prop_id}", project_name: "Elm Mill Rehab", structure_type: "SINGLE_TIER", measuring_period_months: 24, measuring_period_start_date: "2026-09-01" }
              as: Developer
              as_user_id: "${dev_id}"
              captures: { err_id: $.data.error_id }
          assert:
            - "response HTTP status == 400"
            - "response data.error_id == ERR_INVALID_REQUEST"
            - "GET /projects?developer_id=${dev_id} returns total_count == 0"
            - "Property.${prop_id}.open_project_count == 0"

      - name: property_and_reviewer_optional_fields_apply_declared_defaults
        claim_type: defaults
        grounds:
          - entities.Property.fields.listing_status
          - entities.Reviewer.fields.credential_status
          - entities.CostLineItem.fields.classification
        distinguishing_aspect: "Omitting listing_status yields NOT_LISTED, omitting credential_status yields ACTIVE, and omitting classification on a cost yields PENDING_CLASSIFICATION with exclusion_reason NONE."
        test_recipe:
          setup:
            - "One developer, one property created without listing_status, one project."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-09-01T00:00:00Z" }
              as: PlatformAdmin
            - call: "POST /developers"
              payload: { legal_name: "Elm Mill Partners LLC", taxpayer_id_last4: "4821", entity_type: "LLC" }
              as: PlatformAdmin
              captures: { dev_id: $.data.id }
          trigger:
            - call: "POST /properties"
              payload: { name: "Elm Mill", street_address: "120 Elm Street", city: "Dayton", state_code: "OH", year_built: 1912 }
              as: PlatformAdmin
              captures: { prop_id: $.data.id }
            - call: "POST /reviewers"
              payload: { full_name: "S. Hale", agency: "SHPO", state_code: "OH" }
              as: PlatformAdmin
              captures: { shpo_id: $.data.id }
            - call: "POST /projects"
              payload: { developer_id: "${dev_id}", property_id: "${prop_id}", project_name: "Elm Mill Rehab", structure_type: "SINGLE_TIER", adjusted_basis_cents: 60000000, measuring_period_months: 24, measuring_period_start_date: "2026-09-01" }
              as: Developer
              as_user_id: "${dev_id}"
              captures: { proj_id: $.data.id }
            - call: "POST /cost-line-items"
              payload: { project_id: "${proj_id}", vendor_name: "Keystone Masonry", category: "HARD_CONSTRUCTION", amount_cents: 100000, incurred_date: "2027-05-10" }
              as: Developer
              as_user_id: "${dev_id}"
              captures: { c1_id: $.data.id }
          assert:
            - "Property.${prop_id}.listing_status == NOT_LISTED"
            - "Reviewer.${shpo_id}.credential_status == ACTIVE"
            - "CostLineItem.${c1_id}.classification == PENDING_CLASSIFICATION"
            - "CostLineItem.${c1_id}.exclusion_reason == NONE"
            - "CostLineItem.${c1_id}.in_measuring_period == true"
            - "Project.${proj_id}.classified_cost_total_cents == 0"
            - "Project.${proj_id}.qre_total_provisional_cents == 100000"
            - "Project.${proj_id}.qre_total_final_cents == 0"

      - name: project_measuring_period_end_date_is_computed_from_months
        claim_type: computed_fields
        grounds:
          - entities.Project.fields.measuring_period_end_date
          - entities.CostLineItem.fields.in_measuring_period
        distinguishing_aspect: "measuring_period_end_date is computed as start + measuring_period_months, so a 60-month period starting 2026-09-01 ends 2031-09-01 and a cost incurred 2031-08-31 is in_measuring_period == true."
        test_recipe:
          setup:
            - "One developer and one property; clock at 2026-09-01T00:00:00Z."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-09-01T00:00:00Z" }
              as: PlatformAdmin
            - call: "POST /developers"
              payload: { legal_name: "Elm Mill Partners LLC", taxpayer_id_last4: "4821", entity_type: "LLC" }
              as: PlatformAdmin
              captures: { dev_id: $.data.id }
            - call: "POST /properties"
              payload: { name: "Elm Mill", street_address: "120 Elm Street", city: "Dayton", state_code: "OH", year_built: 1912, listing_status: "INDIVIDUAL_LISTED" }
              as: PlatformAdmin
              captures: { prop_id: $.data.id }
          trigger:
            - call: "POST /projects"
              payload: { developer_id: "${dev_id}", property_id: "${prop_id}", project_name: "Elm Mill Phased Rehab", structure_type: "SINGLE_TIER", adjusted_basis_cents: 60000000, measuring_period_months: 60, measuring_period_start_date: "2026-09-01" }
              as: Developer
              as_user_id: "${dev_id}"
              captures: { proj_id: $.data.id }
            - call: "POST /cost-line-items"
              payload: { project_id: "${proj_id}", vendor_name: "Keystone Masonry", category: "HARD_CONSTRUCTION", amount_cents: 100000, incurred_date: "2031-08-31" }
              as: Developer
              as_user_id: "${dev_id}"
              captures: { c_late_id: $.data.id }
          assert:
            - "Project.${proj_id}.measuring_period_end_date == 2031-09-01"
            - "CostLineItem.${c_late_id}.in_measuring_period == true"
            - "Property.${prop_id}.open_project_count == 1"

      - name: project_system_fields_are_server_generated
        claim_type: system_fields
        grounds:
          - entities.Project
          - endpoints[POST /projects]
        distinguishing_aspect: "id, created_at, updated_at and version are system-sourced: the created Project carries a server id, a created_at equal to the logical clock 2026-09-01T00:00:00Z and version == 1, none of which appear in the request body."
        test_recipe:
          setup:
            - "Clock pinned at 2026-09-01T00:00:00Z; one developer and one property."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-09-01T00:00:00Z" }
              as: PlatformAdmin
            - call: "POST /developers"
              payload: { legal_name: "Elm Mill Partners LLC", taxpayer_id_last4: "4821", entity_type: "LLC" }
              as: PlatformAdmin
              captures: { dev_id: $.data.id }
            - call: "POST /properties"
              payload: { name: "Elm Mill", street_address: "120 Elm Street", city: "Dayton", state_code: "OH", year_built: 1912, listing_status: "INDIVIDUAL_LISTED" }
              as: PlatformAdmin
              captures: { prop_id: $.data.id }
          trigger:
            - call: "POST /projects"
              payload: { developer_id: "${dev_id}", property_id: "${prop_id}", project_name: "Elm Mill Rehab", structure_type: "SINGLE_TIER", adjusted_basis_cents: 60000000, measuring_period_months: 24, measuring_period_start_date: "2026-09-01" }
              as: Developer
              as_user_id: "${dev_id}"
              captures: { proj_id: $.data.id, proj_created: $.data.created_at }
          assert:
            - "Project.${proj_id}.id is a non-empty server-generated string"
            - "Project.${proj_id}.created_at == 2026-09-01T00:00:00Z"
            - "Project.${proj_id}.updated_at == 2026-09-01T00:00:00Z"
            - "Project.${proj_id}.version == 1"

      - name: project_creation_rejects_unknown_structure_type_enum_value
        claim_type: type_constraints
        grounds:
          - entities.Project.fields.structure_type
          - validations[priority=30]
          - errors[ERR_INVALID_REQUEST]
        distinguishing_aspect: "structure_type accepts only MASTER_LEASE or SINGLE_TIER, so TRIPLE_TIER returns 400 ERR_INVALID_REQUEST; the same 400 covers measuring_period_months == 36, which is neither 24 nor 60."
        test_recipe:
          setup:
            - "One developer and one property."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-09-01T00:00:00Z" }
              as: PlatformAdmin
            - call: "POST /developers"
              payload: { legal_name: "Elm Mill Partners LLC", taxpayer_id_last4: "4821", entity_type: "LLC" }
              as: PlatformAdmin
              captures: { dev_id: $.data.id }
            - call: "POST /properties"
              payload: { name: "Elm Mill", street_address: "120 Elm Street", city: "Dayton", state_code: "OH", year_built: 1912, listing_status: "INDIVIDUAL_LISTED" }
              as: PlatformAdmin
              captures: { prop_id: $.data.id }
          trigger:
            - call: "POST /projects"
              payload: { developer_id: "${dev_id}", property_id: "${prop_id}", project_name: "Elm Mill Rehab", structure_type: "TRIPLE_TIER", adjusted_basis_cents: 60000000, measuring_period_months: 24, measuring_period_start_date: "2026-09-01" }
              as: Developer
              as_user_id: "${dev_id}"
              captures: { err_enum: $.data.error_id }
            - call: "POST /projects"
              payload: { developer_id: "${dev_id}", property_id: "${prop_id}", project_name: "Elm Mill Rehab", structure_type: "SINGLE_TIER", adjusted_basis_cents: 60000000, measuring_period_months: 36, measuring_period_start_date: "2026-09-01" }
              as: Developer
              as_user_id: "${dev_id}"
              captures: { err_months: $.data.error_id }
          assert:
            - "first call: HTTP status == 400 and data.error_id == ERR_INVALID_REQUEST"
            - "second call: HTTP status == 400 and data.error_id == ERR_INVALID_REQUEST"
            - "GET /projects?developer_id=${dev_id} returns total_count == 0"

      - name: property_year_built_above_declared_range_is_rejected
        claim_type: type_constraints
        grounds:
          - entities.Property.fields.year_built
          - validations[priority=30]
        distinguishing_aspect: "year_built is constrained to 1600..2010 inclusive, so 2015 returns 400 ERR_INVALID_REQUEST while 2010 is accepted."
        test_recipe:
          setup:
            - "Clock at 2026-09-01T00:00:00Z."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-09-01T00:00:00Z" }
              as: PlatformAdmin
          trigger:
            - call: "POST /properties"
              payload: { name: "New Build", street_address: "1 New Way", city: "Dayton", state_code: "OH", year_built: 2015, listing_status: "NOT_LISTED" }
              as: PlatformAdmin
              captures: { err_range: $.data.error_id }
            - call: "POST /properties"
              payload: { name: "Boundary Block", street_address: "2 Edge Way", city: "Dayton", state_code: "OH", year_built: 2010, listing_status: "NOT_LISTED" }
              as: PlatformAdmin
              captures: { prop_ok_id: $.data.id }
          assert:
            - "first call: HTTP status == 400 and data.error_id == ERR_INVALID_REQUEST"
            - "second call: HTTP status == 201"
            - "Property.${prop_ok_id}.year_built == 2010"

      - name: developer_and_reviewer_are_immutable_identity_rows
        claim_type: immutability
        grounds:
          - entities.Developer
          - entities.Reviewer
          - endpoints[GET /developers/{id}]
          - endpoints[GET /reviewers/{id}]
        distinguishing_aspect: "Developer and Reviewer declare common_fields false: their read bodies carry no version field, and §1.5 declares no PATCH or DELETE for either path."
        test_recipe:
          setup:
            - "One developer and one SHPO reviewer."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-09-01T00:00:00Z" }
              as: PlatformAdmin
            - call: "POST /developers"
              payload: { legal_name: "Elm Mill Partners LLC", taxpayer_id_last4: "4821", entity_type: "LLC" }
              as: PlatformAdmin
              captures: { dev_id: $.data.id }
            - call: "POST /reviewers"
              payload: { full_name: "S. Hale", agency: "SHPO", state_code: "OH" }
              as: PlatformAdmin
              captures: { shpo_id: $.data.id }
          trigger:
            - call: "GET /developers/${dev_id}"
              payload: {}
              as: PlatformAdmin
            - call: "GET /reviewers/${shpo_id}"
              payload: {}
              as: PlatformAdmin
          assert:
            - "Developer.${dev_id} response body contains no version key"
            - "Reviewer.${shpo_id} response body contains no version key"
            - "Developer.${dev_id}.legal_name == Elm Mill Partners LLC"
            - "Reviewer.${shpo_id}.agency == SHPO"
            - "§1.5 declares no PATCH or DELETE endpoint on /developers/{id} or /reviewers/{id}"

      - name: standard_finding_rejects_unknown_parent_part_application
        claim_type: parent_relationships
        grounds:
          - entities.StandardFinding.parent
          - errors[ERR_PART_APPLICATION_NOT_FOUND]
          - validations[priority=40]
        distinguishing_aspect: "StandardFinding declares parent PartApplication, so POST /part-applications/{id}/findings against an unknown application id returns 404 ERR_PART_APPLICATION_NOT_FOUND and persists no finding."
        test_recipe:
          setup:
            - "One SHPO reviewer; no part application with the targeted id."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-09-01T00:00:00Z" }
              as: PlatformAdmin
            - call: "POST /reviewers"
              payload: { full_name: "S. Hale", agency: "SHPO", state_code: "OH" }
              as: PlatformAdmin
              captures: { shpo_id: $.data.id }
          trigger:
            - call: "POST /part-applications/22222222-2222-2222-2222-222222222222/findings"
              payload: { standard_number: 2, severity: "CONDITION", description: "Orphan finding." }
              as: ShpoReviewer
              as_user_id: "${shpo_id}"
              captures: { err_id: $.data.error_id }
          assert:
            - "response HTTP status == 404"
            - "response data.error_id == ERR_PART_APPLICATION_NOT_FOUND"

      - name: project_creation_rejects_unknown_developer_id_before_unknown_property_id
        claim_type: parent_relationships
        grounds:
          - validations[priority=45]
          - errors[ERR_DEVELOPER_NOT_FOUND]
          - errors[ERR_PROPERTY_NOT_FOUND]
        distinguishing_aspect: "Flat topology: body foreign keys are resolved left to right in the request_body order, so a POST /projects carrying both an unknown developer_id and an unknown property_id returns ERR_DEVELOPER_NOT_FOUND, never ERR_PROPERTY_NOT_FOUND."
        test_recipe:
          setup:
            - "One real developer exists so the caller identity resolves; neither referenced id exists."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-09-01T00:00:00Z" }
              as: PlatformAdmin
            - call: "POST /developers"
              payload: { legal_name: "Elm Mill Partners LLC", taxpayer_id_last4: "4821", entity_type: "LLC" }
