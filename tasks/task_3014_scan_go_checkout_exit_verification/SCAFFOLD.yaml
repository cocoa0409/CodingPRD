scenario: |
  Scan-and-Go Checkout & Exit Verification (Sam's Club): in-app item scanning
  with produce and weighted-item handling, restricted-item interception
  requiring an associate for alcohol, tobacco and pharmacy, cart-total payment
  inside the app with membership-linked tender and instant savings application,
  exit verification through a receipt code scan or computer-vision arch with
  mismatch handling, unscanned item detection and loss-prevention escalation
  thresholds, club-level enablement and fallback when connectivity fails,
  curbside pickup order staging alongside in-club scanning, member fee tier
  benefits including early shopping hours and cash rewards

domain_name: scan-go-checkout
api_prefix: /

# =============================================================================
# Complexity Profile (§0)
# =============================================================================
complexity_profile:
  primary_archetype: pricing_engine
  secondary_archetype: compliance_audit
  complexity_layers:
    - optimistic_concurrency
    - cascading_side_effects
    - dual_variant_calculation
    - rate_threshold_triggers
    - conditional_feature_flags
  entity_topology: hybrid          # Club-rooted tree + flat Member + cross-cutting session/order refs
  state_machine_shape: compound    # cyclic sessions + branching curbside/verification + posture-gated scans
  relationship_patterns:
    - one_to_many
    - cross_aggregate
  role_model: segregation_of_duties  # flagging associate cannot resolve own LP case
  consistency_model: immediate
  difficulty_target: expert_plus

# =============================================================================
# Response Envelope (§1.0 — FIXED, verbatim)
# =============================================================================
response_envelope:
  success: |
    { "meta": { "api_request_id": "req_xxx", "api_request_timestamp": "ISO8601" },
      "response_type": "object" | "array", "data": {} }
  error: |
    { "meta": { ... }, "response_type": "error",
      "data": { "error_id": "ERR_XXX", "message": "..." } }
  pagination_fields: ["limit", "offset", "total_count", "has_more"]
  pagination_defaults: { limit: 10, min: 1, max: 100, offset: 0 }

# =============================================================================
# Table 1: Entity-Relationship Table (§1.1)
# =============================================================================
entities:
  - name: Club
    parent: null
    common_fields: true
    fields:
      - { name: name, type: string, source: input, description: "Club display name" }
      - { name: open_minute, type: integer, source: input, description: "Regular opening minute-of-day (0-1439); normal shopping allowed at/after this minute" }
      - { name: early_shopping_start_minute, type: integer, source: input, description: "PLUS-tier early-shopping window start minute-of-day; must be < open_minute" }
      - { name: exit_verification_mode, type: enum, source: input, constraints: "RECEIPT_CODE | CV_ARCH | BOTH", description: "Which exit verification method(s) this club operates" }
      - { name: scan_go_enabled, type: boolean, source: input, default: true, description: "Club-level Scan-and-Go enablement flag; when false no new sessions may be created" }
      - { name: allow_offline_payment, type: boolean, source: input, default: false, description: "When true, OFFLINE_PAUSED sessions may pay using provisional totals (final == provisional, no re-pricing)" }
      - { name: connectivity_posture, type: enum, source: system, constraints: "ONLINE | DEGRADED | OFFLINE_FALLBACK", default: "ONLINE", description: "Current connectivity posture; set only via POST /clubs/{id}/connectivity" }
      - { name: lp_unscanned_threshold, type: integer, source: input, default: 2, description: "CV-arch unscanned count >= this value flips an exit verification to MISMATCH and opens an LP case" }
      - { name: lp_suspend_strikes, type: integer, source: input, default: 3, description: "Member.unscanned_strikes >= this value auto-suspends the member" }
      - { name: staging_slot_capacity, type: integer, source: input, default: 2, description: "Max curbside orders concurrently occupying one staging slot label within overlapping windows" }
      - { name: receipt_code_ttl_minutes, type: integer, source: input, default: 30, description: "Minutes a receipt code stays valid after payment" }
      - { name: intercept_ttl_minutes, type: integer, source: input, default: 10, description: "Minutes a PENDING restricted intercept lives before auto-expiry at closeout" }

  - name: Member
    parent: null
    common_fields: true
    fields:
      - { name: tier, type: enum, source: input, constraints: "CLUB | PLUS", description: "Membership fee tier; PLUS unlocks early hours and 2% cash rewards" }
      - { name: birth_year, type: integer, source: input, description: "Member birth year (4-digit); used for age verification on restricted items" }
      - { name: home_club_id, type: string, source: input, description: "FK -> Club.id; member's home club" }
      - { name: status, type: enum, source: system, constraints: "ACTIVE | SUSPENDED", default: "ACTIVE", description: "SUSPENDED when unscanned_strikes reaches club.lp_suspend_strikes" }
      - { name: tender_status, type: enum, source: input, constraints: "OK | DECLINED", default: "OK", description: "Membership-linked tender state; DECLINED blocks payment" }
      - { name: cash_rewards_pending_cents, type: integer, source: computed, default: 0, description: "Provisional 2% accrual posted at pay time (PLUS only); reduced by voids; not yet redeemable" }
      - { name: cash_rewards_posted_cents, type: integer, source: computed, default: 0, description: "Final accrual credited by POST /members/{id}/rewards/settle; excludes voided sessions" }
      - { name: lifetime_charged_cents, type: integer, source: computed, default: 0, description: "Running net charged amount: += final_total_cents at pay, -= final_total_cents at void-payment" }
      - { name: unscanned_strikes, type: integer, source: computed, default: 0, description: "Count of LP cases created against this member from CV mismatch or receipt expiry" }

  - name: CatalogItem
    parent: Club
    common_fields: true
    fields:
      - { name: club_id, type: string, source: system, description: "FK -> Club.id; owning club (from path)" }
      - { name: sku, type: string, source: input, description: "Stock keeping unit; unique per club" }
      - { name: item_name, type: string, source: input, description: "Display name" }
      - { name: pricing_mode, type: enum, source: input, constraints: "UNIT | WEIGHTED", description: "UNIT priced per piece; WEIGHTED priced per pound" }
      - { name: unit_price_cents, type: integer, source: input, required: false, description: "Price per unit in cents; required iff pricing_mode=UNIT" }
      - { name: price_per_pound_cents, type: integer, source: input, required: false, description: "Price per pound in cents; required iff pricing_mode=WEIGHTED" }
      - { name: restricted_class, type: enum, source: input, constraints: "NONE | ALCOHOL | TOBACCO | PHARMACY", default: "NONE", description: "Restricted merchandise class requiring associate interception" }
      - { name: early_hours_eligible, type: boolean, source: input, default: true, description: "Whether item may be scanned during the early-shopping window" }
      - { name: status, type: enum, source: system, constraints: "ACTIVE | DELISTED", default: "ACTIVE", description: "DELISTED items cannot be newly scanned" }

  - name: InstantSavingsOffer
    parent: Club
    common_fields: true
    fields:
      - { name: club_id, type: string, source: system, description: "FK -> Club.id; owning club (from path)" }
      - { name: catalog_item_id, type: string, source: input, description: "FK -> CatalogItem.id; item the offer discounts" }
      - { name: discount_cents, type: integer, source: input, description: "Discount per unit (UNIT item) or per commenced pound (WEIGHTED item)" }
      - { name: valid_from_iso, type: datetime, source: input, description: "Window start, INCLUSIVE; compared against logical clock" }
      - { name: valid_to_iso, type: datetime, source: input, description: "Window end, INCLUSIVE; window [valid_from_iso, valid_to_iso] closed both ends" }
      - { name: tier_eligibility, type: enum, source: input, constraints: "ALL | PLUS_ONLY", default: "ALL", description: "Which member tiers may redeem" }
      - { name: per_member_limit, type: integer, source: input, description: "Max discounted units one member may redeem across all sessions (released on line removal or session void)" }

  - name: ScanSession
    parent: null
    common_fields: true
    fields:
      - { name: member_id, type: string, source: system, description: "FK -> Member.id; taken from X-User-ID of the creating Member" }
      - { name: club_id, type: string, source: input, description: "FK -> Club.id; club being shopped" }
      - { name: status, type: enum, source: system, constraints: "OPEN | REVIEW_HOLD | OFFLINE_PAUSED | PAID | EXIT_PENDING | FLAGGED | EXITED | ABANDONED | VOIDED", description: "Session lifecycle; see state machine" }
      - { name: receipt_code, type: string, source: system, description: "Server-minted exit receipt code; populated at payment, null before" }
      - { name: provisional_total_cents, type: integer, source: computed, default: 0, description: "Cart total from scan-time price snapshots and scan-time offer evaluation; refreshed on every line add/remove" }
      - { name: final_total_cents, type: integer, source: computed, description: "Charged total computed at pay: re-priced against current catalog and pay-time offer validity (null until paid)" }
      - { name: refunded_cents, type: integer, source: computed, default: 0, description: "Amount returned by void-payment; equals final_total_cents after a full void" }
      - { name: qualifying_cents, type: integer, source: computed, description: "Portion of final_total_cents eligible for cash rewards (excludes ALCOHOL/TOBACCO/PHARMACY lines); set at pay" }
      - { name: rewards_contribution_cents, type: integer, source: computed, default: 0, description: "Pending rewards this session contributed at pay time (PLUS only)" }
      - { name: rewards_settled, type: boolean, source: system, default: false, description: "True once rewards/settle has folded this session into posted accrual" }
      - { name: scanned_item_count, type: integer, source: computed, default: 0, description: "Physical item count: sum(quantity over non-REMOVED UNIT lines) + count(non-REMOVED WEIGHTED lines); compared to CV arch observation" }
      - { name: paid_at, type: datetime, source: system, description: "Logical-clock timestamp of successful payment; null until paid" }

  - name: ScanLine
    parent: ScanSession
    common_fields: true
    fields:
      - { name: session_id, type: string, source: system, description: "FK -> ScanSession.id (from path)" }
      - { name: catalog_item_id, type: string, source: input, description: "FK -> CatalogItem.id; scanned item (must belong to session club and be ACTIVE)" }
      - { name: scan_seq, type: integer, source: system, description: "Monotone per-session scan order starting at 1" }
      - { name: pricing_mode_snapshot, type: enum, source: system, constraints: "UNIT | WEIGHTED", description: "Item pricing_mode captured at scan time" }
      - { name: unit_price_cents_snapshot, type: integer, source: system, description: "UNIT price captured at scan time (null for WEIGHTED)" }
      - { name: price_per_pound_cents_snapshot, type: integer, source: system, description: "WEIGHTED price captured at scan time (null for UNIT)" }
      - { name: restricted_class_snapshot, type: enum, source: system, constraints: "NONE | ALCOHOL | TOBACCO | PHARMACY", description: "Restricted class captured at scan time" }
      - { name: quantity, type: integer, source: input, required: false, description: "Unit count; required iff item is UNIT; must be >= 1" }
      - { name: weight_grams, type: integer, source: input, required: false, description: "Scale weight in grams; required iff item is WEIGHTED; must be > 0" }
      - { name: line_gross_cents, type: integer, source: computed, description: "Per-line rounded gross: UNIT quantity*price; WEIGHTED round_half_up(weight_grams * price_per_pound_cents / 454)" }
      - { name: offer_id_applied, type: string, source: system, description: "InstantSavingsOffer applied to this line, or null" }
      - { name: offer_units_applied, type: integer, source: computed, default: 0, description: "Discounted units redeemed on this line (quantity, or commenced pounds for WEIGHTED)" }
      - { name: line_savings_cents, type: integer, source: computed, default: 0, description: "offer_units_applied * offer.discount_cents; 0 when club connectivity is DEGRADED/OFFLINE at evaluation" }
      - { name: line_total_cents, type: integer, source: computed, description: "max(0, line_gross_cents - line_savings_cents)" }
      - { name: status, type: enum, source: system, constraints: "SCANNED | INTERCEPTED | CLEARED | REMOVED", description: "INTERCEPTED while restricted intercept pending; REMOVED is terminal" }

  - name: RestrictedIntercept
    parent: ScanSession
    common_fields: true
    fields:
      - { name: session_id, type: string, source: system, description: "FK -> ScanSession.id; session being shopped" }
      - { name: scan_line_id, type: string, source: system, description: "FK -> ScanLine.id; the intercepted line (1:1)" }
      - { name: club_id, type: string, source: system, description: "FK -> Club.id; denormalized from session for associate queueing" }
      - { name: restricted_class, type: enum, source: system, constraints: "ALCOHOL | TOBACCO | PHARMACY", description: "Class requiring resolution" }
      - { name: associate_id, type: string, source: system, description: "Opaque X-User-ID of resolving associate; null while PENDING" }
      - { name: decision, type: enum, source: system, constraints: "APPROVE | DENY", description: "Resolution decision; null while PENDING" }
      - { name: status, type: enum, source: system, constraints: "PENDING | APPROVED | DENIED | EXPIRED", description: "EXPIRED via run-closeout past TTL or club connectivity drop" }

  - name: ExitVerification
    parent: ScanSession
    common_fields: true
    fields:
      - { name: session_id, type: string, source: system, description: "FK -> ScanSession.id (from path on creation)" }
      - { name: club_id, type: string, source: system, description: "FK -> Club.id; denormalized from session" }
      - { name: method, type: enum, source: system, constraints: "RECEIPT_CODE | CV_ARCH", description: "Verification method; from request or club.exit_verification_mode" }
      - { name: status, type: enum, source: system, constraints: "PENDING | VERIFIED | MISMATCH | CONFIRMED | EXPIRED", description: "VERIFIED/CONFIRMED/EXPIRED are terminal" }
      - { name: expected_item_count, type: integer, source: system, description: "Session scanned_item_count snapshot at verification creation" }
      - { name: cv_observed_item_count, type: integer, source: system, description: "Count reported by the CV arch; null until cv-report" }
      - { name: flagging_associate_id, type: string, source: system, description: "Opaque X-User-ID of associate whose cv-report produced MISMATCH; drives segregation-of-duties" }

  - name: LossPreventionCase
    parent: null
    common_fields: true
    fields:
      - { name: session_id, type: string, source: system, description: "FK -> ScanSession.id; offending session" }
      - { name: member_id, type: string, source: system, description: "FK -> Member.id; offending member" }
      - { name: club_id, type: string, source: system, description: "FK -> Club.id; club where detected" }
      - { name: source, type: enum, source: system, constraints: "CV_MISMATCH | RECEIPT_EXPIRY", description: "What opened the case" }
      - { name: unscanned_count, type: integer, source: system, description: "Estimated unscanned items (cv_observed - expected); 0 for RECEIPT_EXPIRY" }
      - { name: tier, type: enum, source: computed, constraints: "REVIEW | SEVERE", description: "SEVERE iff unscanned_count >= 2 * club.lp_unscanned_threshold, else REVIEW" }
      - { name: flagging_associate_id, type: string, source: system, description: "Opaque X-User-ID of associate whose report opened the case; null for RECEIPT_EXPIRY" }
      - { name: outcome, type: enum, source: system, constraints: "DISMISSED | CONFIRMED", description: "Resolution outcome; null until RESOLVED" }
      - { name: status, type: enum, source: system, constraints: "OPEN | ACKNOWLEDGED | ESCALATED | RESOLVED", description: "RESOLVED is terminal" }

  - name: CurbsideOrder
    parent: Club
    common_fields: true
    fields:
      - { name: club_id, type: string, source: system, description: "FK -> Club.id (from path)" }
      - { name: member_id, type: string, source: system, description: "FK -> Member.id; taken from X-User-ID of the creating Member" }
      - { name: item_count, type: integer, source: input, description: "Number of items in the pickup order; must be >= 1" }
      - { name: staging_slot_label, type: string, source: system, description: "Staging slot assigned at stage time; null while PLACED" }
      - { name: window_start_iso, type: datetime, source: system, description: "Pickup window start (half-open, inclusive); set at stage/reschedule" }
      - { name: window_end_iso, type: datetime, source: system, description: "Pickup window end (half-open, EXCLUSIVE); must be > window_start_iso" }
      - { name: staged_by_associate_id, type: string, source: system, description: "Opaque X-User-ID of associate who marked the order STAGED" }
      - { name: status, type: enum, source: system, constraints: "PLACED | STAGING | STAGED | PICKED_UP | CANCELLED | EXPIRED", description: "PICKED_UP/CANCELLED/EXPIRED are terminal" }

# =============================================================================
# Table 2: State Machine Table (§1.2)
# =============================================================================
state_machines:
  - entity: ScanSession
    initial_state: OPEN
    terminal_states: [EXITED, ABANDONED, VOIDED]
    transitions:
      - from: OPEN
        to: REVIEW_HOLD
        trigger: "system (a scanned line is restricted and club is ONLINE, not early hours)"
        actor: system
        preconditions: []
        side_effects:
          - "ScanLine created with status INTERCEPTED"
          - "RestrictedIntercept created with status PENDING"

      - from: REVIEW_HOLD
        to: OPEN
        trigger: "system (last PENDING RestrictedIntercept of this session resolves or expires)"
        actor: system
        preconditions:
          - "No remaining PENDING RestrictedIntercept with session_id == this session"
        side_effects: []

      - from: OPEN
        to: OFFLINE_PAUSED
        trigger: "system (POST /clubs/{id}/connectivity sets OFFLINE_FALLBACK)"
        actor: system
        preconditions: []
        side_effects: []

      - from: REVIEW_HOLD
        to: OFFLINE_PAUSED
        trigger: "system (POST /clubs/{id}/connectivity sets OFFLINE_FALLBACK)"
        actor: system
        preconditions: []
        side_effects:
          - "All PENDING RestrictedIntercepts of this session -> EXPIRED"
          - "Each expired intercept's ScanLine -> REMOVED; provisional totals recomputed"

      - from: OFFLINE_PAUSED
        to: OPEN
        trigger: "system (POST /clubs/{id}/connectivity sets ONLINE or DEGRADED)"
        actor: system
        preconditions: []
        side_effects: []
        note: "Intercepts expired during the outage stay EXPIRED; session always resumes to OPEN"

      - from: OPEN
        to: PAID
        trigger: "POST /scan-sessions/{id}/pay"
        actor: Member
        preconditions:
          - "member.status == ACTIVE (ERR_MEMBER_INACTIVE)"
          - "No PENDING RestrictedIntercept for this session (ERR_INTERCEPT_PENDING)"
          - "At least one non-REMOVED ScanLine (ERR_EMPTY_CART)"
          - "member.tender_status == OK (ERR_TENDER_DECLINED)"
        side_effects:
          - "final_total_cents computed (re-priced at pay-time clock; skipped when OFFLINE_PAUSED fallback)"
          - "receipt_code minted; paid_at set to logical clock"
          - "Member.lifetime_charged_cents += final_total_cents"
          - "PLUS: Member.cash_rewards_pending_cents += floor(qualifying_cents * 2 / 100); rewards_contribution_cents recorded"

      - from: REVIEW_HOLD
        to: PAID
        trigger: "POST /scan-sessions/{id}/pay"
        actor: Member
        preconditions:
          - "Same as OPEN -> PAID (the PENDING-intercept check makes this path unreachable until resolved)"
        side_effects: ["Same as OPEN -> PAID"]

      - from: OFFLINE_PAUSED
        to: PAID
        trigger: "POST /scan-sessions/{id}/pay"
        actor: Member
        preconditions:
          - "club.allow_offline_payment == true (else ERR_SESSION_NOT_OPEN)"
          - "No PENDING RestrictedIntercept for this session (always true: they expired on the connectivity drop)"
          - "At least one non-REMOVED ScanLine (ERR_EMPTY_CART)"
          - "member.tender_status == OK (ERR_TENDER_DECLINED)"
        side_effects:
          - "final_total_cents := provisional_total_cents (no re-pricing while offline)"
          - "Same ledger side effects as OPEN -> PAID"

      - from: PAID
        to: EXIT_PENDING
        trigger: "POST /scan-sessions/{id}/exit-scan"
        actor: Member
        preconditions:
          - "method enabled by club.exit_verification_mode (ERR_VERIFICATION_METHOD_NOT_ENABLED)"
        side_effects:
          - "ExitVerification created PENDING with expected_item_count snapshot"

      - from: EXIT_PENDING
        to: EXITED
        trigger: "system (an ExitVerification of this session reaches VERIFIED)"
        actor: system
        preconditions: []
        side_effects: []

      - from: EXIT_PENDING
        to: FLAGGED
        trigger: "system (ExitVerification -> MISMATCH, or receipt code expiry at run-closeout)"
        actor: system
        preconditions: []
        side_effects:
          - "LossPreventionCase created OPEN (source CV_MISMATCH or RECEIPT_EXPIRY)"
          - "Member.unscanned_strikes += 1"
          - "If Member.unscanned_strikes >= club.lp_suspend_strikes: Member.status -> SUSPENDED"

      - from: FLAGGED
        to: EXIT_PENDING
        trigger: "POST /exit-verifications/{id}/resolve-mismatch with action RESCAN"
        actor: Associate
        preconditions:
          - "The addressed ExitVerification is MISMATCH (ERR_VERIFICATION_NOT_MISMATCHED)"
        side_effects:
          - "A new ExitVerification is created PENDING; the MISMATCH one stays MISMATCH (superseded)"

      - from: FLAGGED
        to: EXITED
        trigger: "POST /exit-verifications/{id}/resolve-mismatch with action CLEAR"
        actor: Associate
        preconditions:
          - "The addressed ExitVerification is MISMATCH (ERR_VERIFICATION_NOT_MISMATCHED)"
          - "Any OPEN/ACKNOWLEDGED/ESCALATED LossPreventionCase for this session must be RESOLVED first (ERR_LP_CASE_NOT_OPEN inverted: unresolved case blocks clear)"
        side_effects:
          - "ExitVerification -> VERIFIED"

      - from: OPEN
        to: ABANDONED
        trigger: "POST /scan-sessions/{id}/abandon"
        actor: Member
        preconditions: []
        side_effects: ["All non-REMOVED ScanLines -> REMOVED; PENDING intercepts -> EXPIRED"]

      - from: REVIEW_HOLD
        to: ABANDONED
        trigger: "POST /scan-sessions/{id}/abandon"
        actor: Member
        preconditions: []
        side_effects: ["All non-REMOVED ScanLines -> REMOVED; PENDING intercepts -> EXPIRED"]

      - from: OFFLINE_PAUSED
        to: ABANDONED
        trigger: "POST /scan-sessions/{id}/abandon"
        actor: Member
        preconditions: []
        side_effects: ["All non-REMOVED ScanLines -> REMOVED"]

      - from: PAID
        to: VOIDED
        trigger: "POST /scan-sessions/{id}/void-payment"
        actor: LossPreventionOfficer
        preconditions: []
        side_effects:
          - "refunded_cents := final_total_cents"
          - "Member.lifetime_charged_cents -= final_total_cents"
          - "Member.cash_rewards_pending_cents -= rewards_contribution_cents (floor 0)"
          - "receipt_code invalidated; PENDING ExitVerifications -> EXPIRED"

      - from: EXIT_PENDING
        to: VOIDED
        trigger: "POST /scan-sessions/{id}/void-payment"
        actor: LossPreventionOfficer
        preconditions: []
        side_effects: ["Same as PAID -> VOIDED"]

      - from: FLAGGED
        to: VOIDED
        trigger: "POST /scan-sessions/{id}/void-payment"
        actor: LossPreventionOfficer
        preconditions: []
        side_effects: ["Same as PAID -> VOIDED"]

  - entity: ScanLine
    initial_state: SCANNED
    terminal_states: [REMOVED]
    transitions:
      - from: SCANNED
        to: INTERCEPTED
        trigger: "system (line created for a restricted item while interception is available)"
        actor: system
        preconditions: []
        side_effects: ["RestrictedIntercept PENDING created; session -> REVIEW_HOLD"]
        note: "Restricted lines are born INTERCEPTED; this transition exists only for symmetry of documentation"

      - from: INTERCEPTED
        to: CLEARED
        trigger: "system (RestrictedIntercept resolved APPROVE)"
        actor: system
        preconditions: []
        side_effects:
          - "line_savings_cents / line_total_cents finalized for this line"
          - "Session provisional_total_cents recomputed"
          - "If no PENDING intercepts remain: session REVIEW_HOLD -> OPEN"

      - from: INTERCEPTED
        to: REMOVED
        trigger: "system (RestrictedIntercept DENIED or EXPIRED)"
        actor: system
        preconditions: []
        side_effects:
          - "Session provisional_total_cents recomputed (line excluded)"
          - "Session scanned_item_count recomputed"
          - "If no PENDING intercepts remain: session REVIEW_HOLD -> OPEN"

      - from: SCANNED
        to: REMOVED
        trigger: "POST /scan-lines/{id}/remove"
        actor: Member
        preconditions:
          - "Session status in {OPEN, REVIEW_HOLD, OFFLINE_PAUSED} (ERR_SESSION_NOT_OPEN)"
        side_effects:
          - "Session provisional_total_cents and scanned_item_count recomputed"
          - "Offer redemption released (per-member remaining allowance restored)"

      - from: CLEARED
        to: REMOVED
        trigger: "POST /scan-lines/{id}/remove"
        actor: Member
        preconditions:
          - "Session status in {OPEN, REVIEW_HOLD, OFFLINE_PAUSED} (ERR_SESSION_NOT_OPEN)"
        side_effects: ["Same as SCANNED -> REMOVED"]

  - entity: RestrictedIntercept
    initial_state: PENDING
    terminal_states: [APPROVED, DENIED, EXPIRED]
    transitions:
      - from: PENDING
        to: APPROVED
        trigger: "POST /intercepts/{id}/resolve with decision APPROVE"
        actor: Associate
        preconditions:
          - "ALCOHOL/TOBACCO: birth_year_verified == true AND (clock_year - member.birth_year) >= 21 (ERR_AGE_VERIFICATION_FAILED)"
          - "PHARMACY: pharmacist_note must be non-empty (ERR_INVALID_REQUEST)"
        side_effects:
          - "ScanLine INTERCEPTED -> CLEARED; associate_id recorded"
          - "Session reopens if no PENDING intercepts remain"

      - from: PENDING
        to: DENIED
        trigger: "POST /intercepts/{id}/resolve with decision DENY"
        actor: Associate
        preconditions: []
        side_effects:
          - "ScanLine INTERCEPTED -> REMOVED; associate_id recorded"
          - "Session provisional totals recomputed; session reopens if no PENDING intercepts remain"

      - from: PENDING
        to: EXPIRED
        trigger: "system (run-closeout when created_at + club.intercept_ttl_minutes < clock; or club connectivity drops to OFFLINE_FALLBACK)"
        actor: system
        preconditions: []
        side_effects: ["Same line/session effects as DENIED"]

  - entity: ExitVerification
    initial_state: PENDING
    terminal_states: [VERIFIED, CONFIRMED, EXPIRED]
    transitions:
      - from: PENDING
        to: VERIFIED
        trigger: "POST /exit-verifications/{id}/verify-receipt with matching receipt_code, or POST cv-report with unscanned below threshold"
        actor: Associate
        preconditions:
          - "Verification status == PENDING (ERR_VERIFICATION_NOT_PENDING)"
          - "method == RECEIPT_CODE for verify-receipt; method == CV_ARCH for cv-report (ERR_VERIFICATION_METHOD_NOT_ENABLED)"
        side_effects: ["Session EXIT_PENDING -> EXITED"]

      - from: PENDING
        to: MISMATCH
        trigger: "POST verify-receipt with wrong receipt_code, or POST cv-report with unscanned >= club.lp_unscanned_threshold"
        actor: Associate
        preconditions:
          - "Verification status == PENDING (ERR_VERIFICATION_NOT_PENDING)"
        side_effects:
          - "flagging_associate_id recorded (cv-report actor; verify-receipt actor for code mismatch)"
          - "Session EXIT_PENDING -> FLAGGED; LossPreventionCase OPEN created; member strikes incremented; possible suspension"

      - from: MISMATCH
        to: VERIFIED
        trigger: "POST /exit-verifications/{id}/resolve-mismatch with action CLEAR"
        actor: Associate
        preconditions:
          - "All LossPreventionCases for this session RESOLVED"
        side_effects: ["Session FLAGGED -> EXITED"]

      - from: MISMATCH
        to: CONFIRMED
        trigger: "POST /exit-verifications/{id}/resolve-mismatch with action CONFIRM"
        actor: Associate
        preconditions: []
        side_effects: ["Session stays FLAGGED awaiting LP case resolution and/or void-payment"]

      - from: PENDING
        to: EXPIRED
        trigger: "system (run-closeout when session.paid_at + club.receipt_code_ttl_minutes < clock; or session voided)"
        actor: system
        preconditions: []
        side_effects:
          - "If expired by TTL while session EXIT_PENDING: session -> FLAGGED with RECEIPT_EXPIRY case"

  - entity: LossPreventionCase
    initial_state: OPEN
    terminal_states: [RESOLVED]
    transitions:
      - from: OPEN
        to: ACKNOWLEDGED
        trigger: "POST /loss-prevention-cases/{id}/acknowledge"
        actor: LossPreventionOfficer
        preconditions: []
        side_effects: []

      - from: OPEN
        to: ESCALATED
        trigger: "POST /loss-prevention-cases/{id}/escalate"
        actor: LossPreventionOfficer
        preconditions: []
        side_effects: []

      - from: ACKNOWLEDGED
        to: ESCALATED
        trigger: "POST /loss-prevention-cases/{id}/escalate"
        actor: LossPreventionOfficer
        preconditions: []
        side_effects: []

      - from: OPEN
        to: RESOLVED
        trigger: "POST /loss-prevention-cases/{id}/resolve"
        actor: LossPreventionOfficer
        preconditions:
          - "X-User-ID != flagging_associate_id (ERR_SO_DUTY_VIOLATION; segregation of duties)"
        side_effects:
          - "outcome recorded"
          - "If outcome == DISMISSED: Member.unscanned_strikes -= 1 (floor 0)"

      - from: ACKNOWLEDGED
        to: RESOLVED
        trigger: "POST /loss-prevention-cases/{id}/resolve"
        actor: LossPreventionOfficer
        preconditions: ["Same SoD precondition"]
        side_effects: ["Same as OPEN -> RESOLVED"]

      - from: ESCALATED
        to: RESOLVED
        trigger: "POST /loss-prevention-cases/{id}/resolve"
        actor: LossPreventionOfficer
        preconditions: ["Same SoD precondition"]
        side_effects: ["Same as OPEN -> RESOLVED"]

  - entity: CurbsideOrder
    initial_state: PLACED
    terminal_states: [PICKED_UP, CANCELLED, EXPIRED]
    transitions:
      - from: PLACED
        to: STAGING
        trigger: "POST /curbside-orders/{id}/stage"
        actor: Associate
        preconditions:
          - "window_end_iso > window_start_iso (ERR_SLOT_WINDOW_INVALID)"
          - "Overlapping occupancy of staging_slot_label over [window_start_iso, window_end_iso) < club.staging_slot_capacity (ERR_SLOT_CAPACITY_EXCEEDED)"
        side_effects: ["Slot/window recorded; slot occupancy +1"]

      - from: STAGING
        to: STAGED
        trigger: "POST /curbside-orders/{id}/mark-staged"
        actor: Associate
        preconditions: []
        side_effects: ["staged_by_associate_id recorded"]

      - from: STAGED
        to: PICKED_UP
        trigger: "POST /curbside-orders/{id}/pickup"
        actor: Member
        preconditions:
          - "X-User-ID == order.member_id (ERR_FORBIDDEN_RESOURCE_OWNERSHIP)"
        side_effects: ["Slot occupancy -1"]

      - from: PLACED
        to: CANCELLED
        trigger: "POST /curbside-orders/{id}/cancel"
        actor: Member
        preconditions: ["X-User-ID == order.member_id"]
        side_effects: []

      - from: STAGING
        to: CANCELLED
        trigger: "POST /curbside-orders/{id}/cancel"
        actor: Member
        preconditions: ["X-User-ID == order.member_id"]
        side_effects: ["Slot occupancy -1"]

      - from: STAGED
        to: CANCELLED
        trigger: "POST /curbside-orders/{id}/cancel"
        actor: Member
        preconditions: ["X-User-ID == order.member_id"]
        side_effects: ["Slot occupancy -1"]

      - from: STAGING
        to: STAGING
        trigger: "POST /curbside-orders/{id}/reschedule"
        actor: Member
        preconditions:
          - "X-User-ID == order.member_id"
          - "expected_curbside_order_version == current version (OCC; ERR_STALE_VERSION)"
          - "New window valid and slot capacity available (excluding this order's own occupancy)"
        side_effects: ["Slot/window replaced; version += 1"]

      - from: STAGED
        to: STAGING
        trigger: "POST /curbside-orders/{id}/reschedule"
        actor: Member
        preconditions: ["Same as STAGING -> STAGING"]
        side_effects: ["Slot/window replaced; order demoted to STAGING; version += 1"]

      - from: STAGED
        to: EXPIRED
        trigger: "system (run-closeout when window_end_iso + 60 minutes < logical clock)"
        actor: system
        preconditions: []
        side_effects: ["Slot occupancy -1"]

  - entity: Member
    initial_state: ACTIVE
    terminal_states: []
    transitions:
      - from: ACTIVE
        to: SUSPENDED
        trigger: "system (unscanned_strikes reaches club.lp_suspend_strikes after an LP case is opened)"
        actor: system
        preconditions: []
        side_effects: ["Member cannot create new scan sessions"]

      - from: SUSPENDED
        to: ACTIVE
        trigger: "POST /members/{id}/reinstate"
        actor: LossPreventionOfficer
        preconditions: []
        side_effects: ["unscanned_strikes := 0"]

# =============================================================================
# Concurrency Rules (§1.2.1)
# =============================================================================
concurrency_rules:
  - rule_id: club-config-stale-version
    parent_entity: Club
    write_endpoint: "PATCH /clubs/{id}"
    occ_field: "expected_club_version"
    description: |
      Updating a Club's configuration with an expected_club_version that no
      longer matches the club's current version is rejected. This captures the
      case where another ClubManager has already saved a newer configuration
      (e.g., toggled scan_go_enabled) and the current writer's view of the
      club is therefore stale.
    error_id: ERR_STALE_VERSION
    http_status: 412

  - rule_id: curbside-reschedule-stale-version
    parent_entity: CurbsideOrder
    write_endpoint: "POST /curbside-orders/{id}/reschedule"
    occ_field: "expected_curbside_order_version"
    description: |
      Rescheduling a CurbsideOrder with an expected_curbside_order_version
      that no longer matches the order's current version is rejected. This
      captures the case where an associate has already re-staged the order
      (advancing its version) and the member's view of the slot/window is
      therefore stale.
    error_id: ERR_STALE_VERSION
    http_status: 412

# =============================================================================
# Table 3: Calculation Rules Table (§1.3)
# =============================================================================
calculations:
  - name: scan_line_gross
    trigger: "line creation (scan) and at payment final re-pricing"
    algorithm: aggregation
    formula: |
      UNIT:     line_gross_cents = quantity * unit_price_cents
      WEIGHTED: line_gross_cents = round_half_up(weight_grams * price_per_pound_cents / LB_GRAMS)
      Rounding is applied PER LINE first, then line values are summed into cart
      totals. The scaffold pins per-line-then-sum order: two 150g lines at
      250c/lb total 166c (2 x 83), whereas sum-then-round would give 165c.
      At scan time, snapshot prices are used; at pay time, CURRENT catalog
      prices are used (see cart_totals).
    constants:
      LB_GRAMS: 454
    precision: "0 decimal places (integer cents), round_half_up"

  - name: commenced_pound_units
    trigger: "WEIGHTED line offer application"
    algorithm: threshold
    formula: |
      commenced_pounds = ceil(weight_grams / LB_GRAMS)
      An offer on a WEIGHTED item discounts per commenced pound:
      454g -> 1 unit; 455g -> 2 units; 500g -> 2 units.
    constants:
      LB_GRAMS: 454

  - name: instant_savings_application
    trigger: "line creation (scan) and at payment final re-pricing"
    algorithm: tiered_pricing
    formula: |
      Evaluation context: member tier, logical clock, club connectivity.
      1. If club.connectivity_posture != ONLINE at evaluation time: no offer
         applies (line_savings_cents = 0).
      2. Otherwise find the unique InstantSavingsOffer o where
         o.club_id == session.club_id AND o.catalog_item_id == line item AND
         o.valid_from_iso <= clock <= o.valid_to_iso (inclusive both ends).
         (Windows never overlap for a club+item pair; see offer_window_overlap.)
      3. If o absent, or o.tier_eligibility == PLUS_ONLY and member.tier == CLUB:
         no savings.
      4. redeemed(o, member) = sum(offer_units_applied) over ScanLines with
         offer_id_applied == o.id whose session.member_id == member AND
         session.status != VOIDED AND line.status != REMOVED.
      5. line_units = quantity (UNIT) or commenced_pounds (WEIGHTED).
         offer_units_applied = min(o.per_member_limit - redeemed(o, member), line_units)
         (floor at 0). line_savings_cents = offer_units_applied * o.discount_cents.
      6. line_total_cents = max(0, line_gross_cents - line_savings_cents).
    precision: "integer cents"
    note: ">= 3 inputs with non-linear interaction (clock window x tier x remaining allowance x commenced pounds): mode (a) combinatorial"

  - name: cart_totals
    trigger: "provisional: every line add/remove/intercept resolution; final: POST /scan-sessions/{id}/pay"
    algorithm: aggregation
    formula: |
      provisional_total_cents = sum(line_total_cents over non-REMOVED lines)
        using scan-time price snapshots and scan-time offer evaluation.
      final_total_cents (at pay, club connectivity ONLINE or DEGRADED):
        recompute every non-REMOVED line with CURRENT catalog prices and
        offers evaluated at the pay-time clock, then sum.
      final_total_cents (at pay, OFFLINE_PAUSED fallback):
        final_total_cents := provisional_total_cents (no re-pricing).
      The provisional and final variants can diverge for identical cart
      contents when prices change or offers expire mid-shop.
    variants:
      - name: provisional
        when: "scan-time, on every cart mutation"
        difference: "uses scan-time price snapshots and scan-time offer window/allowance evaluation"
      - name: final
        when: "at payment"
        difference: "re-prices against current catalog and pay-time clock; skipped entirely under offline fallback"

  - name: cash_rewards_accrual
    trigger: "pending: at pay; posted: POST /members/{id}/rewards/settle"
    algorithm: aggregation
    formula: |
      qualifying_cents = final_total_cents - sum(line_total_cents of non-REMOVED
        lines whose restricted_class_snapshot != NONE), recomputed at pay.
      pending (at pay, PLUS members only):
        contribution = floor(qualifying_cents * REWARD_RATE / 100)
        member.cash_rewards_pending_cents += contribution
        session.rewards_contribution_cents = contribution
      posted (at settle):
        for each session of the member with rewards_settled == false AND
        status in {PAID, EXIT_PENDING, FLAGGED, EXITED}:
          posted_delta += floor(session.qualifying_cents * REWARD_RATE / 100)
          session.rewards_settled = true
        sessions in VOIDED status contribute 0 (their pending contribution was
        already clawed back by void-payment).
        member.cash_rewards_posted_cents += posted_delta
      CLUB tier: rate is 0; both variants always 0.
      The pending and posted variants diverge for identical payment data when
      the session is voided between pay and settle.
    constants:
      REWARD_RATE: 2
    variants:
      - name: pending
        when: "recorded at pay time"
        difference: "includes sessions that may later be voided"
      - name: posted
        when: "recorded at rewards/settle"
        difference: "excludes VOIDED sessions; only sessions still valid at settle contribute"

  - name: lp_escalation
    trigger: "POST /exit-verifications/{id}/cv-report; LP case creation"
    algorithm: threshold
    formula: |
      unscanned = cv_observed_item_count - session.scanned_item_count (expected_item_count)
      if unscanned >= club.lp_unscanned_threshold: verification -> MISMATCH
        (boundary is >=: unscanned == threshold triggers)
      else: verification -> VERIFIED (observed <= expected also VERIFIED)
      On case creation: member.unscanned_strikes += 1;
      if member.unscanned_strikes >= club.lp_suspend_strikes:
        member.status -> SUSPENDED (boundary is >=)
      Case tier: SEVERE iff unscanned >= 2 * club.lp_unscanned_threshold else REVIEW.

  - name: receipt_code_expiry
    trigger: "POST /clubs/{id}/run-closeout"
    algorithm: chronological
    formula: |
      For each ScanSession in EXIT_PENDING with
      paid_at + club.receipt_code_ttl_minutes < logical clock:
        its PENDING ExitVerifications -> EXPIRED
        session -> FLAGGED with a LossPreventionCase (source RECEIPT_EXPIRY,
        unscanned_count 0, tier REVIEW); member strikes/suspension per lp_escalation.
      For each RestrictedIntercept PENDING with
      created_at + club.intercept_ttl_minutes < logical clock:
        intercept -> EXPIRED (cascade to line REMOVED and session reopen).
      For each CurbsideOrder STAGED with
      window_end_iso + 60 minutes < logical clock:
        order -> EXPIRED (slot occupancy released).

  - name: offer_window_overlap
    trigger: "POST /clubs/{id}/instant-savings-offers"
    algorithm: interval_merge
    formula: |
      Offer windows are CLOSED intervals [valid_from_iso, valid_to_iso].
      A new offer for the same (club_id, catalog_item_id) is rejected with
      ERR_OFFER_WINDOW_CONFLICT iff there exists another offer with
      new.valid_from_iso <= existing.valid_to_iso AND
      existing.valid_from_iso <= new.valid_to_iso.
      Touching endpoints DO conflict (inclusive semantics): an existing window
      ending 2026-09-10T00:00:00Z blocks a new window starting 2026-09-10T00:00:00Z.

  - name: staging_slot_occupancy
    trigger: "POST /curbside-orders/{id}/stage and /reschedule"
    algorithm: interval_merge
    formula: |
      Pickup windows are HALF-OPEN intervals [window_start_iso, window_end_iso).
      occupancy(slot_label, W) = count of CurbsideOrders in {STAGING, STAGED}
        with same club and staging_slot_label whose windows overlap W:
        overlap iff a.window_start_iso < W.end AND W.start < a.window_end_iso.
      Adjacent windows do NOT overlap ([10:00,11:00) and [11:00,12:00) coexist).
      Stage/reschedule rejected with ERR_SLOT_CAPACITY_EXCEEDED iff
      occupancy >= club.staging_slot_capacity (the order's own current
      occupancy is excluded on reschedule).
      Different interval semantics from offer_window_overlap: half-open with
      aggregate capacity vs closed-interval pairwise conflict.

  - name: early_shopping_gate
    trigger: "POST /scan-sessions and POST /scan-sessions/{id}/lines"
    algorithm: threshold
    formula: |
      minute_of_day = (logical clock hour * 60 + minute), UTC.
      If open_minute <= minute_of_day: normal shopping, any tier.
      Else if early_shopping_start_minute <= minute_of_day < open_minute
      (early window):
        session creation requires member.tier == PLUS (ERR_EARLY_HOURS_NOT_ELIGIBLE)
        scanning a restricted item -> ERR_RESTRICTED_BLOCKED_EARLY_HOURS
      Else (before early window): session creation rejected ERR_CLUB_SCAN_GO_DISABLED
      is NOT used; use ERR_EARLY_HOURS_NOT_ELIGIBLE for any tier.
      Boundaries: at exactly early_shopping_start_minute the window is open;
      at exactly open_minute regular hours apply.

  - name: scanned_item_count
    trigger: "line add/remove; snapshotted into ExitVerification at exit-scan"
    algorithm: aggregation
    formula: |
      scanned_item_count = sum(quantity over non-REMOVED UNIT lines)
                         + count(non-REMOVED WEIGHTED lines)
      A weighted produce bag counts as exactly 1 physical item.

# =============================================================================
# Table 4: Validation Rules Table (ordered by priority) (§1.4)
# =============================================================================
validations:
  - priority: 1
    category: auth
    check: "X-User-ID and X-User-Role headers present; X-User-Role is a declared role"
    error_id: ERR_MISSING_OR_INVALID_USER_CONTEXT_HEADER
    http_status: 400
    applies_to: "all endpoints"

  - priority: 2
    category: auth
    check: "Role permitted for this endpoint per §1.5 roles"
    error_id: ERR_UNAUTHORIZED_ROLE
    http_status: 403
    applies_to: "all endpoints"

  - priority: 2.5
    category: auth
    check: "Ownership: for Member-scoped mutations X-User-ID must equal the owning member_id (session, curbside order)"
    error_id: ERR_FORBIDDEN_RESOURCE_OWNERSHIP
    http_status: 403
    applies_to: "Member-owned action endpoints (pay, exit-scan, abandon, line scan/remove, curbside pickup/cancel/reschedule)"

  - priority: 3
    category: existence
    check: "Path ids exist, validated left-to-right (club before item, session before line); body FK references exist"
    error_id: "ERR_CLUB_NOT_FOUND | ERR_MEMBER_NOT_FOUND | ERR_CATALOG_ITEM_NOT_FOUND | ERR_OFFER_NOT_FOUND | ERR_SCAN_SESSION_NOT_FOUND | ERR_SCAN_LINE_NOT_FOUND | ERR_INTERCEPT_NOT_FOUND | ERR_EXIT_VERIFICATION_NOT_FOUND | ERR_LP_CASE_NOT_FOUND | ERR_CURBSIDE_ORDER_NOT_FOUND"
    http_status: 404
    applies_to: "all endpoints with path/body resource references"

  - priority: 3.5
    category: existence
    check: "OCC: expected_<parent>_version matches current version on guarded writes"
    error_id: ERR_STALE_VERSION
    http_status: 412
    applies_to: "PATCH /clubs/{id}, POST /curbside-orders/{id}/reschedule"

  - priority: 4
    category: state
    check: "Target entity in a valid state for the operation (session scannable/payable/voidable, intercept PENDING, verification PENDING/MISMATCH, LP case non-terminal, curbside order in correct stage, member ACTIVE)"
    error_id: "ERR_SESSION_NOT_OPEN | ERR_MEMBER_INACTIVE | ERR_INTERCEPT_NOT_PENDING | ERR_VERIFICATION_NOT_PENDING | ERR_VERIFICATION_NOT_MISMATCHED | ERR_LP_CASE_NOT_OPEN | ERR_CURBSIDE_NOT_STAGED | ERR_CURBSIDE_NOT_CANCELLABLE | ERR_SESSION_NOT_PAID | ERR_SESSION_NOT_VOIDABLE"
    http_status: 409
    applies_to: "all state-transition endpoints"

  - priority: 5
    category: business_safety
    check: "Restricted-item and compliance gates: restricted scan blocked offline or during early hours; no PENDING intercepts at pay; age verification for ALCOHOL/TOBACCO approval; pharmacy note required"
    error_id: "ERR_RESTRICTED_BLOCKED_OFFLINE | ERR_RESTRICTED_BLOCKED_EARLY_HOURS | ERR_INTERCEPT_PENDING | ERR_AGE_VERIFICATION_FAILED"
    http_status: 409
    applies_to: "scan, pay, intercept resolve"

  - priority: 6
    category: business_temporal
    check: "Time-window sanity and gating: staging window_end > window_start; offer valid_from <= valid_to; early-shopping tier gate; receipt TTL handled by closeout"
    error_id: "ERR_SLOT_WINDOW_INVALID | ERR_OFFER_WINDOW_INVALID | ERR_EARLY_HOURS_NOT_ELIGIBLE"
    http_status: 400
    applies_to: "curbside stage/reschedule, offer create, session create/scan"

  - priority: 7
    category: business_constraint
    check: "Aggregate/constraint checks: staging slot capacity, offer window overlap, one active session per (member, club), item ACTIVE and belongs to session club, verification method enabled by club mode, exit-scan method gating"
    error_id: "ERR_SLOT_CAPACITY_EXCEEDED | ERR_OFFER_WINDOW_CONFLICT | ERR_SESSION_ALREADY_ACTIVE | ERR_CATALOG_ITEM_NOT_FOUND | ERR_VERIFICATION_METHOD_NOT_ENABLED | ERR_CLUB_SCAN_GO_DISABLED | ERR_CLUB_OFFLINE"
    http_status: 409
    applies_to: "curbside stage/reschedule, offer create, session create, scan, exit-scan"

  - priority: 8
    category: business_referential
    check: "Cross-entity referential integrity beyond existence: scan line belongs to session, intercept belongs to session's club, exit verification matches session receipt code"
    error_id: "ERR_NOT_FOUND scoped variants (404) for wrong-parent references"
    http_status: 404
    applies_to: "nested reads and actions"

  - priority: 9
    category: business_fiscal
    check: "Money gates last: cart non-empty, tender OK"
    error_id: "ERR_EMPTY_CART | ERR_TENDER_DECLINED"
    http_status: "409 | 402"
    applies_to: "POST /scan-sessions/{id}/pay"

  - priority: 10
    category: business_constraint
    check: "Request shape: required fields present, types valid, quantity >= 1 on UNIT lines, weight_grams > 0 on WEIGHTED lines, pricing-mode-appropriate fields only, pricing-mode-consistent catalog prices"
    error_id: "ERR_INVALID_REQUEST | ERR_INVALID_QUANTITY | ERR_INVALID_WEIGHT"
    http_status: 400
    applies_to: "all endpoints with bodies"
    note: "Malformed-shape checks are evaluated first in implementations where the request cannot be parsed; among business failures they rank last."

# =============================================================================
# Table 5: API Endpoint Table (§1.5)
# =============================================================================
endpoints:
  # --- Club ---
  - method: POST
    path: "/clubs"
    description: "Create a club"
    roles: [PlatformAdmin]
    code: 201
    input: ["name", "open_minute", "early_shopping_start_minute", "exit_verification_mode", "scan_go_enabled?", "allow_offline_payment?", "lp_unscanned_threshold?", "lp_suspend_strikes?", "staging_slot_capacity?", "receipt_code_ttl_minutes?", "intercept_ttl_minutes?"]
    output: Club
    side_effects: ["connectivity_posture ONLINE; defaults applied"]

  - method: GET
    path: "/clubs/{id}"
    description: "Get a club"
    roles: [Member, Associate, LossPreventionOfficer, ClubManager, PlatformAdmin]
    code: 200
    input: []
    output: Club
    side_effects: []

  - method: PATCH
    path: "/clubs/{id}"
    description: "Update club configuration (OCC-guarded); increments Club.version"
    roles: [ClubManager]
    code: 200
    input: ["expected_club_version", "scan_go_enabled?", "exit_verification_mode?", "allow_offline_payment?", "lp_unscanned_threshold?", "lp_suspend_strikes?", "staging_slot_capacity?", "receipt_code_ttl_minutes?", "intercept_ttl_minutes?", "open_minute?", "early_shopping_start_minute?"]
    output: Club
    side_effects: ["increments Club.version by 1"]

  - method: POST
    path: "/clubs/{id}/connectivity"
    description: "Set club connectivity posture; OFFLINE_FALLBACK pauses sessions and expires their PENDING intercepts; restore reopens sessions"
    roles: [ClubManager]
    code: 200
    input: ["posture"]
    output: Club
    side_effects:
      - "ONLINE|DEGRADED <- OFFLINE_FALLBACK: OFFLINE_PAUSED sessions -> OPEN"
      - "OFFLINE_FALLBACK: OPEN/REVIEW_HOLD sessions -> OFFLINE_PAUSED; their PENDING intercepts -> EXPIRED; those lines -> REMOVED; provisional totals recomputed"

  - method: POST
    path: "/clubs/{id}/run-closeout"
    description: "Ops checkpoint: expire stale PENDING intercepts (cascade line REMOVED, session reopen), expire receipt codes past TTL (session FLAGGED + RECEIPT_EXPIRY LP case), expire STAGED curbside orders past window+60m"
    roles: [ClubManager]
    code: 200
    input: []
    output: Club
    side_effects:
      - "PENDING intercepts past intercept_ttl_minutes -> EXPIRED -> line REMOVED -> session REVIEW_HOLD -> OPEN if clear"
      - "EXIT_PENDING sessions with expired receipt codes -> FLAGGED; PENDING verifications -> EXPIRED; LP case RECEIPT_EXPIRY created; strikes/suspension per lp_escalation"
      - "STAGED curbside orders past window_end + 60m -> EXPIRED"

  # --- Catalog ---
  - method: POST
    path: "/clubs/{id}/catalog-items"
    description: "Create a catalog item"
    roles: [PlatformAdmin]
    code: 201
    input: ["sku", "item_name", "pricing_mode", "unit_price_cents?", "price_per_pound_cents?", "restricted_class?", "early_hours_eligible?"]
    output: CatalogItem
    side_effects: ["status ACTIVE"]

  - method: GET
    path: "/catalog-items/{id}"
    description: "Get a catalog item"
    roles: [Member, Associate, LossPreventionOfficer, ClubManager, PlatformAdmin]
    code: 200
    input: []
    output: CatalogItem
    side_effects: []

  - method: PATCH
    path: "/catalog-items/{id}"
    description: "Update a catalog item price or delist it (drives provisional/final divergence)"
    roles: [PlatformAdmin]
    code: 200
    input: ["unit_price_cents?", "price_per_pound_cents?", "status?"]
