      - name: risk_score_caps_the_region_adjusted_wildfire_index_at_one_hundred
        claim_type: weighted_scoring
        grounds:
          - "calculations.insurance_premium_and_risk_score"
          - "entities.Property.fields.composite_risk_score"
          - "entities.Property.fields.insurance_premium_usd"
          - "endpoints[POST /timberland/properties/{id}/risk-review]"
        distinguishing_aspect: |
          The cap is applied to each adjusted index BEFORE the weights, not to the composite: a
          WEST wildfire index of 88 x 1.25 = 110.00 is clipped to 100.00, giving 0.45*100.00 +
          0.30*73.60 + 0.25*48 = 79.08. Weighting first and clipping afterwards leaves 83.58 and
          a premium of 29299.37 instead of 28581.17 — a 718.20 error on one policy.
        test_recipe:
          setup:
            - "Logical clock at 2026-08-01T00:00:00Z; fund with 400000.00 opening cash and 500000.00 committed capital."
            - "Cascade Ridge Tract: region WEST (wildfire multiplier 1.25), insured for 4200000.00."
            - "Its only stand is LOBLOLLY_PINE, so the species insect multiplier is 1.15."
          setup_api_calls:
            - call: "POST /timberland/_clock/set_current_utc"
              payload: {current_utc: "2026-08-01T00:00:00Z"}
              as: FundAdmin
            - call: "POST /timberland/funds"
              payload: {name: "Longleaf Timber Fund I", vintage_year: 2025, committed_capital_usd: 500000.00, target_cash_yield_bps: 0, opening_cash_usd: 400000.00}
              as: FundAdmin
              captures: { fund_id: "$.data.id" }
            - call: "POST /timberland/properties"
              payload: {fund_id: "${fund_id}", name: "Cascade Ridge Tract", region_code: "WEST", total_acres: 1200.00, haul_distance_miles: 62, insured_value_usd: 4200000.00, hbu_acres: 0.00, hbu_price_per_acre_usd: 0.00, annual_rec_income_usd: 0.00, certification_scheme: "SFI"}
              as: AcquisitionAnalyst
              captures: { prop_id: "$.data.id" }
            - call: "POST /timberland/stands"
              payload: {property_id: "${prop_id}", stand_code: "PC-01", acres: 120.00, species_code: "LOBLOLLY_PINE", age_years: 22, site_index: 78}
              as: ForestManager
              captures: { stand_id: "$.data.id" }
            - call: "POST /timberland/cruise-plots"
              payload: {stand_id: "${stand_id}", plot_number: 1, tons_per_acre: 41.37, defect_pct: 6.5, measured_at: "2026-07-15T00:00:00Z"}
              as: ForestManager
            - call: "POST /timberland/cruise-plots"
              payload: {stand_id: "${stand_id}", plot_number: 2, tons_per_acre: 38.94, defect_pct: 4.25, measured_at: "2026-07-15T00:00:00Z"}
              as: ForestManager
            - call: "POST /timberland/cruise-plots"
              payload: {stand_id: "${stand_id}", plot_number: 3, tons_per_acre: 44.06, defect_pct: 9.75, measured_at: "2026-07-15T00:00:00Z"}
              as: ForestManager
            - call: "POST /timberland/cruise-plots"
              payload: {stand_id: "${stand_id}", plot_number: 4, tons_per_acre: 39.51, defect_pct: 3.5, measured_at: "2026-07-15T00:00:00Z"}
              as: ForestManager
            - call: "POST /timberland/cruise-plots"
              payload: {stand_id: "${stand_id}", plot_number: 5, tons_per_acre: 42.88, defect_pct: 7.25, measured_at: "2026-07-15T00:00:00Z"}
              as: ForestManager
            - call: "POST /timberland/stands/${stand_id}/cruise-close"
              payload: {}
              as: ForestManager
              captures: { stand_v: "$.data.version" }
          trigger:
            - call: "POST /timberland/properties/${prop_id}/risk-review"
              payload: {insurance_rating_basis: "ACTUARIAL", wildfire_hazard_index: 88.00, insect_hazard_index: 64.00, weather_hazard_index: 48.00}
              as: FundAdmin
