# =============================================================================
# PRD Benchmark Scaffold — Transportation Procurement & Freight Bid Management
# Sections §1.0–§1.7. §1.8 lives in SCAFFOLD_DIFFICULTY_DESIGN.yaml,
# §1.9 lives in SCAFFOLD_CORNER_DESIGN.yaml.
# =============================================================================

scenario: |
  Generate task harder than expert level!

  2552. Transportation Procurement & Freight Bid Management (shipper transportation
  procurement team): lane data preparation with historical volumes, seasonality and
  accessorial history, carrier qualification, insurance verification and service
  capability screening before invitation, bid round design with rate submission,
  incumbent visibility and multi-round negotiation, optimization across cost, service,
  capacity commitment and carrier diversity constraints, award allocation with primary
  and backup routing guides, contract execution, rate loading and go-live cutover with
  tender acceptance monitoring, mini-bid and market adjustment procedures mid-contract,
  carrier scorecards and mid-term rate discussions

domain_name: freight-bid-management
api_prefix: /freight-procurement

complexity_profile:
  primary_archetype: multi_party_negotiation
  secondary_archetype: quota_allocation
  complexity_layers:
    - optimistic_concurrency
    - cascading_side_effects
    - dual_variant_calculation
    - selector_policy

  entity_topology: flat
  # Every entity is a peer collection under /freight-procurement with foreign keys
  # carried in request bodies and query filters. Only three read paths are nested
  # (qualification-reviews, scorecards, tender-events, bid-rounds, optimization-runs
  # sub-resource reads); no business identifier is ever nested more than one level.

  state_machine_shape: cyclic
  # BidEvent loops ROUND_OPEN -> ROUND_CLOSED -> ROUND_OPEN for multi-round
  # negotiation; QualificationReview loops SCREENED -> REMEDIATION -> SUBMITTED with a
  # bounded remediation counter; Contract carries two independent state dimensions
  # (signature_status and rate_load_status) that advance without ordering constraints
  # between them; QualificationReview also forks into two screening branches that join.

  relationship_patterns:
    - one_to_many          # BidEvent -> Lane, BidRound, Invitation, OptimizationRun, Contract
    - many_to_many         # Carrier x Lane resolved through LaneBid and AwardAllocation
    - self_referential     # RateRecord.superseded_by_rate_record_id -> RateRecord.id
    - cross_aggregate      # AwardAllocation references BidEvent, OptimizationRun, Lane, Carrier, LaneBid

  role_model: segregation_of_duties
  # The user who approved any AwardAllocation on a Contract may never apply that
  # Contract's shipper signature, even when the same X-User-ID holds both roles.

  consistency_model: immediate

  difficulty_level: expert_plus
  # 14 entities / 59 endpoints / 49 error codes / 8 calculations (4 with variants) /
  # 12 state machines (cycles, fork-join, two independent dimensions on one row).

# =============================================================================
# §1.0 Response Envelope (FIXED)
# =============================================================================
response_envelope:
  success: |
    { "meta": { "api_request_id": "req_xxx", "api_request_timestamp": "ISO8601" },
      "response_type": "object" | "array", "data": {} }
  error: |
    { "meta": { ... }, "response_type": "error",
      "data": { "error_id": "ERR_XXX", "message": "..." } }
  pagination_fields: ["limit", "offset", "total_count", "has_more"]
  pagination_defaults: { limit: 10, min: 1, max: 100, offset: 0 }

# =============================================================================
# §1.1 Entity-Relationship Table
# =============================================================================
entities:
  - name: Carrier
    parent: null
    common_fields: true
    entity_kind: resource
    fields:
      - name: legal_name
        type: string
        source: input
        description: Carrier legal entity name as it appears on the contract.
        constraints: "1..120 chars"
      - name: scac_code
        type: string
        source: input
        description: Standard Carrier Alpha Code; globally unique across all Carrier rows.
        constraints: "exactly 4 uppercase letters A-Z; unique -> ERR_DUPLICATE_SCAC"
      - name: status
        type: enum
        source: computed
        description: Qualification posture that gates invitation and award eligibility.
        default: REGISTERED
        constraints: "REGISTERED | SCREENING | QUALIFIED | CONDITIONALLY_QUALIFIED | WATCHLIST | SUSPENDED | DISQUALIFIED"
      - name: status_reason
        type: string
        source: system
        description: Free-text reason recorded by the last status-changing action; null when never set.
        default: null
      - name: diversity_classification
        type: enum
        source: input
        description: Supplier-diversity classification used by the diversity constraint in optimization.
        default: NONE
        constraints: "NONE | MWBE | VETERAN_OWNED | SMALL_BUSINESS"
      - name: service_modes
        type: array
        source: input
        description: Equipment modes the carrier declares it can serve.
        constraints: "non-empty subset of {DRY_VAN, REEFER, FLATBED}"
      - name: fleet_power_units
        type: integer
        source: input
        description: Declared tractor count, used by capability screening.
        constraints: ">= 1"
      - name: auto_liability_limit_usd
        type: number
        source: input
        description: Declared auto-liability insurance limit in USD.
        constraints: ">= 0, 2 decimal places"
      - name: cargo_limit_usd
        type: number
        source: input
        description: Declared cargo insurance limit in USD.
        constraints: ">= 0, 2 decimal places"
      - name: insurance_expiry_date
        type: datetime
        source: input
        description: ISO 8601 UTC instant at which the carrier's insurance certificate lapses.
      - name: capability_score
        type: number
        source: computed
        description: 0..100 score written by the latest capability screening on this carrier's newest QualificationReview.
        default: null
        constraints: "2 decimal places"
      - name: composite_score
        type: number
        source: computed
        description: Carrier composite performance score produced by calculations.carrier_composite_score.
        default: null
        constraints: "0.00..100.00, 2 decimal places"
      - name: composite_score_variant
        type: enum
        source: computed
        description: Which variant of carrier_composite_score produced composite_score.
        default: null
        constraints: "PROVISIONAL_SCREENING | FINAL_PERFORMANCE"
      - name: published_scorecard_count
        type: integer
        source: computed
        description: Count of Scorecard rows for this carrier whose status is PUBLISHED.
        default: 0
      - name: active_primary_lane_count
        type: integer
        source: computed
        description: Count of AwardAllocation rows for this carrier with routing_position PRIMARY and status IN {EXECUTED, ACTIVE}.
        default: 0
      - name: committed_volume_loads
        type: integer
        source: computed
        description: Sum of AwardAllocation.allocated_volume_loads for this carrier over status IN {EXECUTED, ACTIVE, SUSPENDED_ROUTING}.
        default: 0
      - name: qualified_at
        type: datetime
        source: system
        description: Logical-clock instant at which the carrier last entered QUALIFIED or CONDITIONALLY_QUALIFIED.
        default: null

  - name: QualificationReview
    parent: Carrier
    common_fields: true
    entity_kind: resource
    fields:
      - name: carrier_id
        type: string
        source: input
        description: "FK -> Carrier.id; the carrier being screened by this review."
      - name: status
        type: enum
        source: computed
        description: Review lifecycle; SCREENED is reached only when both screening branches have a non-PENDING result.
        default: SUBMITTED
        constraints: "SUBMITTED | SCREENED | REMEDIATION | APPROVED | CONDITIONALLY_APPROVED | REJECTED"
      - name: required_modes
        type: array
        source: input
        description: Equipment modes the shipper requires for this carrier's intended lanes.
        constraints: "non-empty subset of {DRY_VAN, REEFER, FLATBED}"
      - name: min_auto_liability_usd
        type: number
        source: input
        description: Minimum auto-liability limit demanded by this screening.
        default: 1000000.00
      - name: min_cargo_usd
        type: number
        source: input
        description: Minimum cargo limit demanded by this screening.
        default: 100000.00
      - name: insurance_result
        type: enum
        source: computed
        description: Result of the insurance-verification branch.
        default: PENDING
        constraints: "PENDING | PASS | FAIL"
      - name: capability_result
        type: enum
        source: computed
        description: Result of the capability-screening branch.
        default: PENDING
        constraints: "PENDING | PASS | FAIL"
      - name: verified_auto_liability_usd
        type: number
        source: computed
        description: Auto-liability limit as verified against the certificate; copied onto Carrier on PASS.
        default: null
      - name: verified_cargo_usd
        type: number
        source: computed
        description: Cargo limit as verified against the certificate; copied onto Carrier on PASS.
        default: null
      - name: verified_expiry_date
        type: datetime
        source: computed
        description: Insurance expiry as verified; copied onto Carrier.insurance_expiry_date on PASS.
        default: null
      - name: capability_score
        type: number
        source: computed
        description: 0..100 capability score produced by calculations.capability_screening_score.
        default: null
        constraints: "2 decimal places"
      - name: insurance_verified_at
        type: datetime
        source: system
        description: Logical-clock instant of the insurance-verification branch completion.
        default: null
      - name: capability_screened_at
        type: datetime
        source: system
        description: Logical-clock instant of the capability-screening branch completion.
        default: null
      - name: decision_outcome
        type: enum
        source: computed
        description: Outcome recorded by the decision endpoint.
        default: null
        constraints: "APPROVE | APPROVE_CONDITIONAL | REMEDIATE | REJECT"
      - name: decision_by_user_id
        type: string
        source: system
        description: X-User-ID of the ComplianceOfficer who recorded the decision.
        default: null
      - name: remediation_count
        type: integer
        source: computed
        description: Number of times this review has been sent back to REMEDIATION; loop terminates at MAX_REMEDIATIONS.
        default: 0

  - name: Lane
    parent: BidEvent
    common_fields: true
    entity_kind: resource
    fields:
      - name: bid_event_id
        type: string
        source: input
        description: "FK -> BidEvent.id; the bid event whose lane package contains this lane."
      - name: lane_code
        type: string
        source: input
        description: Shipper lane identifier; unique within one bid_event_id.
        constraints: "1..32 chars; unique per (bid_event_id, lane_code) -> ERR_DUPLICATE_LANE_CODE"
      - name: origin_zip3
        type: string
        source: input
        description: Three-digit origin postal prefix.
        constraints: "exactly 3 digits"
      - name: dest_zip3
        type: string
        source: input
        description: Three-digit destination postal prefix.
        constraints: "exactly 3 digits"
      - name: equipment_type
        type: enum
        source: input
        description: Equipment the lane requires; a bidding carrier must declare this mode.
        constraints: "DRY_VAN | REEFER | FLATBED"
      - name: mileage
        type: integer
        source: input
        description: Practical miles per load, used by every per-load cost formula.
        constraints: ">= 1"
      - name: annual_volume_loads
        type: integer
        source: input
        description: Planned annual load count; the conserved volume quantity for this lane.
        constraints: ">= 1"
      - name: trailing_12m_actual_loads
        type: integer
        source: input
        description: Actual load count shipped over the trailing twelve months; volume basis of the HISTORICAL variant.
        constraints: ">= 0"
      - name: seasonality_peak_index
        type: number
        source: input
        description: Peak-season multiplier applied to annual_volume_loads by the FORECAST variant.
        default: 1.00
        constraints: "1.00..2.00, 2 decimal places"
      - name: accessorial_history_usd_per_load
        type: number
        source: input
        description: Historical accessorial spend per load (detention, layover, stop-offs).
        constraints: ">= 0, 2 decimal places"
      - name: incumbent_carrier_id
        type: string
        source: input
        description: "FK -> Carrier.id; incumbent hauler of record, or null when the lane has no incumbent."
        default: null
      - name: incumbent_rate_per_mile
        type: number
        source: input
        description: Incumbent contracted linehaul rate per mile; baseline input for savings.
        default: null
        constraints: "> 0, 4 decimal places when present"
      - name: service_days_required
        type: integer
        source: input
        description: Maximum transit days the shipper accepts on this lane.
        constraints: ">= 1"
      - name: status
        type: enum
        source: computed
        description: Lane lifecycle from data preparation through award and rebid.
        default: DRAFT
        constraints: "DRAFT | VALIDATED | LOCKED | AWARDED | UNDER_REBID"
      - name: data_quality_flags
        type: array
        source: computed
        description: Flags raised by lane validation; empty array when the lane data is complete.
        default: []
        constraints: "subset of {MILEAGE_IMPLAUSIBLE, MISSING_TRAILING_VOLUME, VOLUME_VARIANCE_HIGH, SEASONALITY_EXTREME, NO_INCUMBENT_BASELINE, ACCESSORIAL_OUTLIER}, emitted in that declared order per calculations.lane_data_quality_flags"
      - name: unallocated_volume_loads
        type: integer
        source: computed
        description: Volume of this lane not yet held by a non-terminal AwardAllocation; initialised to annual_volume_loads.
        default: null
      - name: awarded_coverage_pct
        type: number
        source: computed
        description: Percentage of annual_volume_loads held by non-terminal AwardAllocation rows.
        default: 0.00
        constraints: "0.00..100.00, 2 decimal places"
      - name: baseline_cost_usd
        type: number
        source: computed
        description: Incumbent baseline annual cost produced by calculations.lane_baseline_cost.
        default: null
      - name: validated_at
        type: datetime
        source: system
        description: Logical-clock instant at which the lane passed validation.
        default: null

  - name: BidEvent
    parent: null
    common_fields: true
    entity_kind: resource
    fields:
      - name: name
        type: string
        source: input
        description: Human label of the procurement event.
        constraints: "1..120 chars"
      - name: cost_basis
        type: enum
        source: input
        description: Selects which variant of lane_evaluated_cost and lane_baseline_cost this event uses.
        constraints: "FORECAST | HISTORICAL"
      - name: fuel_index_per_mile
        type: number
        source: input
        description: Fuel surcharge per mile added to a bid whose fuel_surcharge_included is false.
        default: 0.4500
        constraints: ">= 0, 4 decimal places"
      - name: accessorial_inflation_factor
        type: number
        source: input
        description: Multiplier applied to Lane.accessorial_history_usd_per_load by the FORECAST variant only.
        default: 1.15
        constraints: "1.00..2.00, 2 decimal places"
      - name: rate_floor_per_mile
        type: number
        source: input
        description: Minimum acceptable linehaul rate per mile for any LaneBid in this event.
        constraints: "> 0, 4 decimal places"
      - name: rounds_allowed
        type: integer
        source: input
        description: Maximum number of BidRound rows this event may open.
        default: 2
        constraints: "1..4"
      - name: current_round_no
        type: integer
        source: computed
        description: Highest round_no opened so far; 0 before the first round.
        default: 0
      - name: cost_weight
        type: number
        source: input
        description: Objective weight on normalized savings.
        constraints: "0.00..1.00, 2 decimal places"
      - name: service_weight
        type: number
        source: input
        description: Objective weight on average awarded carrier composite score.
        constraints: "0.00..1.00, 2 decimal places"
      - name: capacity_weight
        type: number
        source: input
        description: Objective weight on volume coverage ratio.
        constraints: "0.00..1.00, 2 decimal places"
      - name: diversity_weight
        type: number
        source: input
        description: Objective weight on diversity ratio.
        constraints: "0.00..1.00, 2 decimal places; cost+service+capacity+diversity MUST equal exactly 1.00"
      - name: diversity_min_pct
        type: number
        source: input
        description: Minimum share of awarded primary volume that must go to diversity-classified carriers.
        default: 10.00
        constraints: "0.00..100.00, 2 decimal places"
      - name: max_award_share_pct
        type: number
        source: input
        description: Maximum share of total event volume any single carrier may hold as PRIMARY.
        default: 60.00
        constraints: "0.00..100.00, 2 decimal places"
      - name: max_carriers_per_lane
        type: integer
        source: input
        description: Maximum routing positions generated per lane (PRIMARY plus backups).
        default: 3
        constraints: "1..3"
      - name: contract_effective_from
        type: datetime
        source: input
        description: Effective start stamped on every Contract created by the award cascade.
      - name: contract_effective_to
        type: datetime
        source: input
        description: Effective end stamped on every Contract created by the award cascade; MUST be strictly after contract_effective_from.
      - name: status
        type: enum
        source: computed
        description: Event lifecycle; ROUND_CLOSED returns to ROUND_OPEN for each additional negotiation round.
        default: DRAFT
        constraints: "DRAFT | LANES_LOCKED | INVITING | ROUND_OPEN | ROUND_CLOSED | OPTIMIZING | AWARDING | AWARDED | LIVE"
      - name: lane_count
        type: integer
        source: computed
        description: Count of Lane rows with this bid_event_id.
        default: 0
      - name: invited_carrier_count
        type: integer
        source: computed
        description: Count of Invitation rows for this event with status IN {SENT, ACCEPTED, DECLINED}.
        default: 0
      - name: accepted_invitation_count
        type: integer
        source: computed
        description: Count of Invitation rows for this event with status ACCEPTED.
        default: 0
      - name: total_scope_volume_loads
        type: integer
        source: computed
        description: Sum of Lane.annual_volume_loads over lanes of this event with status IN {LOCKED, AWARDED, UNDER_REBID}.
        default: 0
      - name: baseline_cost_usd
        type: number
        source: computed
        description: Sum of Lane.baseline_cost_usd over in-scope lanes, per calculations.bid_event_savings.
        default: null
      - name: award_cost_usd
        type: number
        source: computed
        description: Awarded annual cost per calculations.bid_event_savings.
        default: null
      - name: savings_pct
        type: number
        source: computed
        description: Percentage savings of award_cost_usd against baseline_cost_usd.
        default: null
      - name: coverage_pct
        type: number
        source: computed
        description: Share of total_scope_volume_loads covered by non-terminal PRIMARY allocations.
        default: 0.00
      - name: diversity_pct
        type: number
        source: computed
        description: Share of awarded primary volume held by carriers whose diversity_classification is not NONE.
        default: 0.00
      - name: awarded_at
        type: datetime
        source: system
        description: Logical-clock instant at which the event reached AWARDED.
        default: null

  - name: BidRound
    parent: BidEvent
    common_fields: true
    entity_kind: resource
    fields:
      - name: bid_event_id
        type: string
        source: input
        description: "FK -> BidEvent.id; the event this negotiation round belongs to."
      - name: round_no
        type: integer
        source: computed
        description: Sequence number of this round; equals BidEvent.current_round_no + 1 at creation.
        constraints: ">= 1"
      - name: status
        type: enum
        source: computed
        description: Round lifecycle.
        default: OPEN
        constraints: "OPEN | CLOSED"
      - name: incumbent_visibility
        type: enum
        source: input
        description: How much incumbent information this round discloses to bidders.
        constraints: "HIDDEN | RANK_ONLY | FULL"
      - name: target_reduction_pct
        type: number
        source: input
        description: Reduction target published to bidders for this round; informational for round 1, enforced from round 2 by ERR_RATE_ABOVE_ROUND_TARGET.
        default: 0.00
        constraints: "0.00..50.00, 2 decimal places"
      - name: opens_at
        type: datetime
        source: system
        description: Logical-clock instant at which the round was created.
      - name: closes_at
        type: datetime
        source: input
        description: Submission deadline; a LaneBid submitted at or after this instant is rejected.
      - name: submitted_bid_count
        type: integer
        source: computed
        description: Count of LaneBid rows on this round with status IN {SUBMITTED, SHORTLISTED, AWARDED_PRIMARY, AWARDED_BACKUP, NOT_AWARDED}.
        default: 0
      - name: lowest_rate_per_mile
        type: number
        source: computed
        description: Minimum LaneBid.rate_per_mile over status SUBMITTED bids on this round; null when none.
        default: null
      - name: closed_at
        type: datetime
        source: system
        description: Logical-clock instant at which the round was closed.
        default: null

  - name: Invitation
    parent: BidEvent
    common_fields: true
    entity_kind: resource
    fields:
      - name: bid_event_id
        type: string
        source: input
        description: "FK -> BidEvent.id; the event the carrier is invited to."
      - name: carrier_id
        type: string
        source: input
        description: "FK -> Carrier.id; the invited carrier."
      - name: status
        type: enum
        source: computed
        description: Invitation lifecycle.
        default: SENT
        constraints: "SENT | ACCEPTED | DECLINED | REVOKED"
      - name: nda_required
        type: boolean
        source: input
        description: Whether the carrier must sign the NDA before its acceptance counts.
        default: true
      - name: nda_signed
        type: boolean
        source: computed
        description: Whether the carrier signed the NDA in its response.
        default: false
      - name: qualification_snapshot_score
        type: number
        source: computed
        description: Carrier.composite_score pinned at the instant the invitation was sent.
        default: null
      - name: qualification_snapshot_carrier_version
        type: integer
        source: computed
        description: Carrier.version pinned at the instant the invitation was sent; a later Carrier mutation makes the snapshot stale.
      - name: snapshot_stale
        type: boolean
        source: computed
        description: True when Carrier.version no longer equals qualification_snapshot_carrier_version.
        default: false
      - name: decline_reason
        type: string
        source: computed
        description: Reason supplied by the carrier when declining; null otherwise.
        default: null
      - name: responded_at
        type: datetime
        source: system
        description: Logical-clock instant of the carrier response.
        default: null
      - name: revoked_reason
        type: string
        source: computed
        description: Reason recorded when the shipper revoked the invitation.
        default: null

  - name: LaneBid
    parent: BidRound
    common_fields: true
    entity_kind: resource
    fields:
      - name: bid_round_id
        type: string
        source: input
        description: "FK -> BidRound.id; the round this rate submission belongs to."
      - name: lane_id
        type: string
        source: input
        description: "FK -> Lane.id; the lane being priced."
      - name: carrier_id
        type: string
        source: input
        description: "FK -> Carrier.id; the bidding carrier."
      - name: rate_per_mile
        type: number
        source: input
        description: Offered linehaul rate per mile.
        constraints: "> 0, 4 decimal places"
      - name: fuel_surcharge_included
        type: boolean
        source: input
        description: When false, BidEvent.fuel_index_per_mile is added to rate_per_mile in the cost formula.
      - name: committed_volume_loads
        type: integer
        source: input
        description: Annual load capacity the carrier commits to on this lane.
        constraints: ">= 1"
      - name: transit_days_offered
        type: integer
        source: input
        description: Transit days offered; must be <= Lane.service_days_required.
        constraints: ">= 1"
      - name: status
        type: enum
        source: computed
        description: Bid lifecycle across rounds and award.
        default: SUBMITTED
        constraints: "SUBMITTED | WITHDRAWN | SHORTLISTED | AWARDED_PRIMARY | AWARDED_BACKUP | NOT_AWARDED"
      - name: is_incumbent
        type: boolean
        source: computed
        description: True when carrier_id equals Lane.incumbent_carrier_id at submission time.
        default: false
      - name: evaluated_basis
        type: enum
        source: computed
        description: Which variant of lane_evaluated_cost produced the evaluation fields.
        constraints: "FORECAST | HISTORICAL"
      - name: awardable_volume_loads
        type: integer
        source: computed
        description: Volume basis used for evaluation, per calculations.lane_evaluated_cost step 3.
        default: null
      - name: linehaul_per_load_usd
        type: number
        source: computed
        description: Rounded per-load linehaul component, per calculations.lane_evaluated_cost step 4.
        default: null
      - name: accessorial_per_load_usd
        type: number
        source: computed
        description: Rounded per-load accessorial component, per calculations.lane_evaluated_cost step 5.
        default: null
      - name: cost_per_load_usd
        type: number
        source: computed
        description: linehaul_per_load_usd + accessorial_per_load_usd, both already rounded to cents.
        default: null
      - name: evaluated_total_cost_usd
        type: number
        source: computed
        description: cost_per_load_usd multiplied by awardable_volume_loads with no further rounding.
        default: null
      - name: cost_rank_score
        type: number
        source: computed
        description: Service-credited ranking key produced by calculations.bid_cost_rank_score.
        default: null
      - name: rank_in_lane
        type: integer
        source: computed
        description: 1-based rank within the lane after the round closes; null while the round is OPEN.
        default: null
      - name: withdrawn_at
        type: datetime
        source: system
        description: Logical-clock instant at which the carrier withdrew this bid.
        default: null

  - name: OptimizationRun
    parent: BidEvent
    common_fields: true
    entity_kind: resource
    fields:
      - name: bid_event_id
        type: string
        source: input
        description: "FK -> BidEvent.id; the event being optimized."
      - name: scenario_label
        type: string
        source: input
        description: Analyst label distinguishing scenarios of the same event.
        constraints: "1..64 chars"
      - name: max_carriers_per_lane
        type: integer
        source: input
        description: Scenario override of BidEvent.max_carriers_per_lane.
        default: null
        constraints: "1..3 when present"
      - name: diversity_min_pct
        type: number
        source: input
        description: Scenario override of BidEvent.diversity_min_pct.
        default: null
      - name: min_capacity_coverage_pct
        type: number
        source: input
        description: Minimum coverage the scenario must achieve for the routing guide to be publishable.
        default: 90.00
        constraints: "0.00..100.00, 2 decimal places"
      - name: status
        type: enum
        source: computed
        description: Run lifecycle; FAILED means no lane had an eligible bid.
        default: COMPLETED
        constraints: "COMPLETED | PUBLISHED | SUPERSEDED | FAILED"
      - name: total_cost_usd
        type: number
        source: computed
        description: Sum of proposed allocation costs for this scenario.
        default: null
      - name: coverage_pct
        type: number
        source: computed
        description: Share of BidEvent.total_scope_volume_loads covered by this scenario's PRIMARY selections.
        default: null
      - name: diversity_pct
        type: number
        source: computed
        description: Share of this scenario's PRIMARY volume held by diversity-classified carriers.
        default: null
      - name: objective_score
        type: number
        source: computed
        description: Weighted objective produced by calculations.optimization_objective_score.
        default: null
        constraints: "4 decimal places"
      - name: infeasible_lane_ids
        type: array
        source: computed
        description: Ids of in-scope lanes with an empty eligible-bid set, ordered by Lane.created_at ASC.
        default: []
      - name: proposed_primary_count
        type: integer
        source: computed
        description: Count of PRIMARY selections in this scenario.
        default: 0
      - name: proposed_backup_count
        type: integer
        source: computed
        description: Count of BACKUP_1 and BACKUP_2 selections in this scenario.
        default: 0
      - name: published_at
        type: datetime
        source: system
        description: Logical-clock instant at which this scenario's routing guide was published.
        default: null

  - name: AwardAllocation
    parent: OptimizationRun
    common_fields: true
    entity_kind: resource
    fields:
      - name: bid_event_id
        type: string
        source: input
        description: "FK -> BidEvent.id; denormalised event of the routing guide that produced this row."
      - name: optimization_run_id
        type: string
        source: input
        description: "FK -> OptimizationRun.id; the scenario whose routing guide created this row."
      - name: lane_id
        type: string
        source: input
        description: "FK -> Lane.id; the lane whose volume is allocated."
      - name: carrier_id
        type: string
        source: input
        description: "FK -> Carrier.id; the carrier receiving the routing position."
      - name: lane_bid_id
        type: string
        source: input
        description: "FK -> LaneBid.id; the priced bid this allocation locks in."
      - name: routing_position
        type: enum
        source: computed
        description: Position in the lane's routing guide.
        constraints: "PRIMARY | BACKUP_1 | BACKUP_2"
      - name: allocated_volume_loads
        type: integer
        source: computed
        description: Loads assigned to this position by calculations.award_allocation_waterfall.
        constraints: ">= 0"
      - name: allocated_pct
        type: number
        source: computed
        description: allocated_volume_loads as a percentage of Lane.annual_volume_loads.
        constraints: "0.00..100.00, 2 decimal places"
      - name: allocated_cost_usd
        type: number
        source: computed
        description: allocated_volume_loads multiplied by LaneBid.cost_per_load_usd, rounded to cents once.
      - name: status
        type: enum
        source: computed
        description: Allocation lifecycle from proposal to live routing.
        default: PROPOSED
        constraints: "PROPOSED | APPROVED | REJECTED | SUPERSEDED | EXECUTED | ACTIVE | SUSPENDED_ROUTING"
      - name: approved_by_user_id
        type: string
        source: system
        description: X-User-ID of the CategoryManager who approved this allocation; feeds the segregation-of-duties check on shipper signature.
        default: null
      - name: approved_at
        type: datetime
        source: system
        description: Logical-clock instant of approval.
        default: null
      - name: rejection_reason
        type: string
        source: computed
        description: Reason recorded when the allocation was rejected.
        default: null
      - name: promoted_from_position
        type: enum
        source: computed
        description: Prior routing_position when this row was promoted by a rejection cascade; null when never promoted.
        default: null
        constraints: "BACKUP_1 | BACKUP_2"

  - name: Contract
    parent: BidEvent
    common_fields: true
    entity_kind: resource
    fields:
      - name: bid_event_id
        type: string
        source: input
        description: "FK -> BidEvent.id; the event whose award created this contract."
      - name: carrier_id
        type: string
        source: input
        description: "FK -> Carrier.id; the contracted carrier."
      - name: status
        type: enum
        source: computed
        description: Commercial dimension of the contract lifecycle.
        default: DRAFT
        constraints: "DRAFT | EXECUTED | AMENDED"
      - name: signature_status
        type: enum
        source: computed
        description: Signature dimension; advances independently of rate_load_status.
        default: PENDING_BOTH
        constraints: "PENDING_BOTH | PENDING_SHIPPER | PENDING_CARRIER | FULLY_SIGNED"
      - name: rate_load_status
        type: enum
        source: computed
        description: Rate-loading dimension; advances independently of signature_status.
        default: NOT_STAGED
        constraints: "NOT_STAGED | STAGED | LOADED | LIVE"
      - name: effective_from
        type: datetime
        source: computed
        description: Copied from BidEvent.contract_effective_from by the award cascade.
      - name: effective_to
        type: datetime
        source: computed
        description: Copied from BidEvent.contract_effective_to by the award cascade.
      - name: carrier_signed_by_user_id
        type: string
        source: system
        description: X-User-ID of the CarrierRep who signed; equals carrier_id for entity-backed identity.
        default: null
      - name: carrier_signed_at
        type: datetime
        source: system
        description: Logical-clock instant of the carrier signature.
        default: null
      - name: shipper_signed_by_user_id
        type: string
        source: system
        description: X-User-ID of the ContractAdmin who applied the shipper signature.
        default: null
      - name: shipper_signed_at
        type: datetime
        source: system
        description: Logical-clock instant of the shipper signature.
        default: null
      - name: base_committed_value_usd
        type: number
        source: computed
        description: Step 1 of calculations.contract_committed_value.
        default: null
      - name: volume_discount_pct
        type: number
        source: computed
        description: Step 2 tier keyed on base_committed_value_usd.
        default: null
      - name: volume_discount_usd
        type: number
        source: computed
        description: Step 3 of calculations.contract_committed_value.
        default: null
      - name: accessorial_allowance_pct
        type: number
        source: computed
        description: Step 5 tier keyed on the post-discount subtotal.
        default: null
      - name: accessorial_allowance_usd
        type: number
        source: computed
        description: Step 6 of calculations.contract_committed_value.
        default: null
      - name: total_committed_value_usd
        type: number
        source: computed
        description: Step 7 of calculations.contract_committed_value; the conserved money quantity of the mini-bid revert invariant.
        default: null
      - name: amendment_count
        type: integer
        source: computed
        description: Number of applied mini-bids that amended this contract.
        default: 0
      - name: rate_record_count
        type: integer
        source: computed
        description: Count of RateRecord rows for this contract with status IN {STAGED, LOADED, LIVE, AT_RISK}.
        default: 0

  - name: RateRecord
    parent: Contract
    common_fields: true
    entity_kind: resource
    fields:
      - name: contract_id
        type: string
        source: input
        description: "FK -> Contract.id; the contract that carries this rate."
      - name: lane_id
        type: string
        source: input
        description: "FK -> Lane.id; the lane the rate applies to."
      - name: carrier_id
        type: string
        source: input
        description: "FK -> Carrier.id; denormalised carrier of the parent contract."
      - name: award_allocation_id
        type: string
        source: input
        description: "FK -> AwardAllocation.id; the routing position this rate implements."
      - name: superseded_by_rate_record_id
        type: string
        source: system
        description: "FK -> RateRecord.id; the record that replaced this one through an applied mini-bid; null while current."
        default: null
      - name: routing_position
        type: enum
        source: input
        description: Routing position this rate serves; must equal the referenced allocation's routing_position.
        constraints: "PRIMARY | BACKUP_1 | BACKUP_2"
      - name: rate_per_mile
        type: number
        source: input
        description: Linehaul rate per mile loaded into the routing guide.
        constraints: "> 0, 4 decimal places"
      - name: fuel_surcharge_included
        type: boolean
        source: input
        description: Whether the loaded rate already includes fuel.
      - name: effective_from
        type: datetime
        source: input
        description: Inclusive start of the rate's effective interval.
      - name: effective_to
        type: datetime
        source: input
        description: Exclusive end of the rate's effective interval; MUST be strictly after effective_from.
      - name: committed_volume_loads
        type: integer
        source: input
        description: Volume this record commits over its effective interval.
        constraints: ">= 1"
      - name: committed_value_usd
        type: number
        source: computed
        description: Money value of this record per calculations.contract_committed_value step 1.
        default: null
      - name: status
        type: enum
        source: computed
        description: Rate-loading lifecycle including the tender-risk posture.
        default: STAGED
        constraints: "STAGED | LOADED | LIVE | AT_RISK | SUPERSEDED | ROLLED_BACK"
      - name: tender_count
        type: integer
        source: computed
        description: Count of TenderEvent rows on this record, all outcomes included.
        default: 0
      - name: rejection_count
        type: integer
        source: computed
        description: Count of TenderEvent rows on this record whose outcome is REJECTED or TIMEOUT.
        default: 0
      - name: rejection_pct
        type: number
        source: computed
        description: Percentage of rejected or timed-out tenders per calculations.tender_acceptance_metrics.
        default: 0.00
      - name: acceptance_pct
        type: number
        source: computed
        description: 100 minus rejection_pct.
        default: 100.00
      - name: loaded_at
        type: datetime
        source: system
        description: Logical-clock instant of rate loading.
        default: null
      - name: live_at
        type: datetime
        source: system
        description: Logical-clock instant of go-live cutover.
        default: null

  - name: TenderEvent
    parent: RateRecord
    common_fields: false
    entity_kind: event
    fields:
      - name: rate_record_id
        type: string
        source: input
        description: "FK -> RateRecord.id; the live rate the load was tendered against."
      - name: outcome
        type: enum
        source: input
        description: Carrier response to the tender.
        constraints: "ACCEPTED | REJECTED | TIMEOUT"
      - name: load_reference
        type: string
