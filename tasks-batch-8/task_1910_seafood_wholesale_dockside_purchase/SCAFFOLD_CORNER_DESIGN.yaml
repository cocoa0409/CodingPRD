          trigger:
            - { call: "POST /sales-orders/${o_id}/confirm", payload: {}, as: OperationsManager, captures: { err: $.data.error_id } }
          assert:
            - "error_id == ERR_QUOTE_NOT_PUBLISHED (422); status stays SUBMITTED; total_cents stays 0"

