            - "lv == 1 and rc == ${emp} (level-1 goes to the assignee)"

  # =====================================================================
  # Section: calculations
  # =====================================================================
  - section: calculations
    instances:
      - name: business_day_due_skips_weekend_from_friday
        claim_type: correct_result
        grounds:
          - "calculations.due_date_computation"
        distinguishing_aspect: "BUSINESS_DAYS from a Friday with due_in_days 1 lands on the following Monday (weekend days are not counted)."
        test_recipe:
          setup:
            - "Clock Friday 2026-08-07T09:00:00Z; regulator REG-FRI (BUSINESS_DAYS); curriculum CUR-FRI ACTIVE; role R-FRI with SOFT INITIAL_ONLY requirement due_in_days 1"
          setup_api_calls:
            - { call: "POST /compliance/_clock/set_current_utc", payload: { to_iso8601: "2026-08-07T09:00:00Z" }, as: ComplianceAdmin }
            - { call: "POST /compliance/regulators", payload: { code: "REG-FRI", name: "Friday Regulator", deadline_mode: "BUSINESS_DAYS", recordkeeping_years: 7 }, as: ComplianceAdmin, captures: { reg_id: "$.data.id" } }
            - { call: "POST /compliance/curricula", payload: { regulator_id: "${reg_id}", code: "CUR-FRI", title: "Friday Course", passing_score_pct: 80, validity_months: 12, evidence_requirement: "NONE" }, as: ComplianceAdmin, captures: { cur_id: "$.data.id", cur_v: "$.data.version" } }
            - { call: "POST /compliance/curricula/${cur_id}/versions", payload: { version_no: 1, effective_from: "2026-08-01T00:00:00Z", content_uri: "uri://fri-v1" }, as: ComplianceAdmin }
            - { call: "PATCH /compliance/curricula/${cur_id}", payload: { status: "ACTIVE", expected_curriculum_version: "${cur_v}" }, as: ComplianceAdmin }
            - { call: "POST /compliance/roles", payload: { code: "R-FRI", name: "FRI Role" }, as: ComplianceAdmin, captures: { role_id: "$.data.id" } }
            - { call: "POST /compliance/roles/${role_id}/requirements", payload: { curriculum_id: "${cur_id}", recurrence: "INITIAL_ONLY", due_in_days: 1, criticality: "SOFT" }, as: ComplianceAdmin }
          trigger:
            - { call: "POST /compliance/employees", payload: { employee_no: "E-FRI-1", full_name: "Fri Emp", hired_at: "2026-08-07T09:00:00Z", current_role_id: "${role_id}" }, as: HRAdmin, captures: { emp: "$.data.id" } }
            - { call: "GET /compliance/assignments", payload: { employee_id: "${emp}" }, as: ComplianceAdmin, captures: { a_assigned: "$.data[0].assigned_at", a_due: "$.data[0].base_due_at" } }
          assert:
            - "a_assigned == \"2026-08-07T09:00:00Z\" (Friday)"
            - "a_due == \"2026-08-10T09:00:00Z\" (Saturday 08-08 and Sunday 08-09 skipped; next business day is Monday)"

      - name: retention_precedence_override_then_regulator_fallback
        claim_type: constants_applied
        grounds:
          - "calculations.retention_expiry"
          - "entities.Curriculum.fields.effective_recordkeeping_years"
        distinguishing_aspect: "effective_recordkeeping_years is the curriculum override (3) while set, and falls back to the regulator default (7) when the override is cleared to null."
        test_recipe:
          setup: ["Regulator REG-RET (recordkeeping_years 7); curriculum CUR-RET with recordkeeping_years_override 3"]
          setup_api_calls:
            - { call: "POST /compliance/regulators", payload: { code: "REG-RET", name: "RET Regulator", deadline_mode: "CALENDAR", recordkeeping_years: 7 }, as: ComplianceAdmin, captures: { reg_id: "$.data.id" } }
            - { call: "POST /compliance/curricula", payload: { regulator_id: "${reg_id}", code: "CUR-RET", title: "RET Course", passing_score_pct: 80, validity_months: 12, evidence_requirement: "NONE", recordkeeping_years_override: 3 }, as: ComplianceAdmin, captures: { cur_id: "$.data.id", cur_v: "$.data.version" } }
          trigger:
            - { call: "GET /compliance/curricula/${cur_id}", as: ComplianceAdmin, captures: { er1: "$.data.effective_recordkeeping_years" } }
            - { call: "PATCH /compliance/curricula/${cur_id}", payload: { recordkeeping_years_override: null, expected_curriculum_version: "${cur_v}" }, as: ComplianceAdmin, captures: { er2: "$.data.effective_recordkeeping_years" } }
          assert:
            - "er1 == 3 (curriculum override beats regulator default 7)"
            - "er2 == 7 (explicit JSON null clears the override; regulator default applies)"

      - name: audit_report_empty_population_returns_zero_metrics
        claim_type: correct_result
        grounds:
          - "calculations.compliance_rate"
          - "calculations.audit_weighted_first_attempt_pass_rate"
          - "entities.AuditReport.fields.recordkeeping_expires_at"
        distinguishing_aspect: "Empty-population edge: a regulator with no curricula and no assignments yields population_size 0 and 0.00 rates (no division-by-zero), with retention computed from the regulator."
        test_recipe:
          setup: ["Clock 2026-08-03T09:00:00Z; regulator REG-NIL (CALENDAR, recordkeeping_years 7); no curricula, no employees"]
          setup_api_calls:
            - { call: "POST /compliance/_clock/set_current_utc", payload: { to_iso8601: "2026-08-03T09:00:00Z" }, as: ComplianceAdmin }
