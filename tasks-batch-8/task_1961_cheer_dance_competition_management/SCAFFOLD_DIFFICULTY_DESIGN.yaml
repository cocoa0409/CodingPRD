  - rule_id: priority_pair_validation_conflict
    instances:
      - name: event_state_beats_session_sold_out
        grounds:
          - validations[priority=6]
          - validations[priority=14]
          - errors[ERR_EVENT_INVALID_STATE]
          - errors[ERR_SESSION_SOLD_OUT]
        distinguishing_aspect: |
          Pair = state x business_fiscal. A ticket order on a DRAFT event whose session is
          already over capacity (capacity 10 < quantity 40) violates both ERR_EVENT_INVALID_STATE
          (p6) and ERR_SESSION_SOLD_OUT (p14); the state error must win.
        test_recipe:
          setup: ["Event in DRAFT; session capacity 10 (no orders needed — 40 > 10 fails capacity on its own)"]
          setup_api_calls:
            - { call: "POST /api/events", payload: { name: "Regionals", venue_name: "Arena", start_date: "2026-09-05", end_date: "2026-09-06", age_reference_date: "2026-08-31" }, as: EventDirector, captures: { ev: $.data.id } }
            - { call: "POST /api/sessions", payload: { event_id: "${ev}", name: "Sat AM", starts_at: "2026-09-05T08:00:00Z", ends_at: "2026-09-05T12:00:00Z", capacity: 10 }, as: EventDirector, captures: { se: $.data.id } }
          trigger:
            - { call: "POST /api/ticket-orders", payload: { session_id: "${se}", quantity: 40 }, as: Spectator, as_user_id: "spec-1", captures: { err: "$.data.error_id" } }
          assert:
            - "error_id == ERR_EVENT_INVALID_STATE (state p6 beats business_fiscal p14), http 409"

      - name: roster_locked_beats_age_ineligibility
        grounds:
          - validations[priority=7]
          - validations[priority=11]
          - errors[ERR_ROSTER_LOCKED]
          - errors[ERR_ATHLETE_AGE_INELIGIBLE]
        distinguishing_aspect: |
          Pair = state x business_safety (different pair from state x business_fiscal).
          Adding an under-age athlete (10 years old vs min_age 14) to an already
          ROSTER_LOCKED team violates both ERR_ROSTER_LOCKED (p7) and
          ERR_ATHLETE_AGE_INELIGIBLE (p11); ERR_ROSTER_LOCKED must win.
        test_recipe:
          setup: ["Team ROSTER_LOCKED with one eligible athlete; second athlete (DOB 2016-05-01 -> age 10 at 2026-08-31) exists"]
          setup_api_calls:
            - { call: "POST /api/events", payload: { name: "Regionals", venue_name: "Arena", start_date: "2026-09-05", end_date: "2026-09-06", age_reference_date: "2026-08-31" }, as: EventDirector, captures: { ev: $.data.id } }
            - { call: "POST /api/judges", payload: { full_name: "J1", certified_levels: [3] }, as: EventDirector, captures: { j1: $.data.id } }
            - { call: "POST /api/judges", payload: { full_name: "J2", certified_levels: [3] }, as: EventDirector, captures: { j2: $.data.id } }
            - { call: "POST /api/judges", payload: { full_name: "J3", certified_levels: [3] }, as: EventDirector, captures: { j3: $.data.id } }
            - { call: "POST /api/divisions", payload: { event_id: "${ev}", name: "D1", category: "CHEER", level: 3, min_age: 14, max_age: 18, min_athletes: 1, max_athletes: 4, routine_time_limit_seconds: 150, warmup_mats: ["A", "B", "C"], schedule_start_at: "2026-09-05T10:00:00Z", judge_ids: ["${j1}", "${j2}", "${j3}"] }, as: EventDirector, captures: { dv: $.data.id } }
            - { call: "POST /api/events/${ev}/open-registration", payload: {}, as: EventDirector }
            - { call: "POST /api/athletes", payload: { full_name: "Ann", date_of_birth: "2010-05-01" }, as: TeamCoach, as_user_id: "coach-1", captures: { a1: $.data.id } }
            - { call: "POST /api/athletes", payload: { full_name: "Kid", date_of_birth: "2016-05-01" }, as: TeamCoach, as_user_id: "coach-1", captures: { a2: $.data.id } }
            - { call: "POST /api/teams", payload: { event_id: "${ev}", division_id: "${dv}", name: "T1", organization: "Gym1", category: "CHEER", level: 3, coach_user_id: "coach-1" }, as: TeamCoach, as_user_id: "coach-1", captures: { t1: $.data.id } }
            - { call: "POST /api/roster-entries", payload: { team_id: "${t1}", athlete_id: "${a1}", bib_number: 1 }, as: TeamCoach, as_user_id: "coach-1" }
            - { call: "POST /api/teams/${t1}/lock-roster", payload: {}, as: TeamCoach, as_user_id: "coach-1" }
          trigger:
            - { call: "POST /api/roster-entries", payload: { team_id: "${t1}", athlete_id: "${a2}", bib_number: 2 }, as: TeamCoach, as_user_id: "coach-1", captures: { err: "$.data.error_id" } }
          assert:
            - "error_id == ERR_ROSTER_LOCKED (state p7 beats business_safety p11), http 409"

