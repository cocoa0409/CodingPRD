# =============================================================================
# §1.9 Scaffold Corner Design (Coverage Index for Non-Difficulty Tests)
# Task: task_3381_charter_candidate_progression_exam_windows_experience_verification
#
# Breadth probe: every testable claim of SCAFFOLD.yaml §1.1–§1.7 that
# SCAFFOLD_DIFFICULTY_DESIGN.yaml does not already exercise. Corners covered by
# a §1.8 instance appear as `excluded_because:` stubs with no test_recipe.
# Shared fixture anchors (&c_*) are document-local and defined at first use.
# =============================================================================
scaffold_corner_design:

  # ===========================================================================
  - section: entities
    instances:
      - name: c_candidate_create_returns_declared_fields_and_defaults
        claim_type: Creation
        grounds:
          - entities.Candidate
          - endpoints.POST_/charter/candidates
        distinguishing_aspect: "A candidate created with the four required inputs returns 201 with server-minted id/created_at/updated_at, version 1, charter_awarded false, highest_level_passed_code null, and computed conduct_standing GOOD_STANDING — none of the system fields client-supplied."
        test_recipe:
          setup:
            - "Logical clock at 2027-01-05T00:00:00Z. Empty database."
          setup_api_calls:
            - &c_clock
              call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2027-01-05T00:00:00Z" }
              as: ProgramAdmin
          trigger:
            - &c_cand_a
              call: "POST /charter/candidates"
              payload: { email: "a.cand@example.com", full_name: "A Candidate", date_of_birth: "1995-04-12", gov_id_number: "GOV-A-1001" }
              as: ProgramAdmin
              captures: { cand_a: $.data.id }
          assert:
            - "the response status is 201 and response_type is object"
            - "Candidate.${cand_a}.email == \"a.cand@example.com\" and gov_id_number == \"GOV-A-1001\""
            - "Candidate.${cand_a}.version == 1 and charter_awarded == false"
            - "Candidate.${cand_a}.highest_level_passed_code is null and conduct_standing == GOOD_STANDING"
            - "meta.api_request_id and meta.api_request_timestamp are present"

      - name: c_candidate_get_round_trips_stored_fields
        claim_type: Retrieval
        grounds:
          - entities.Candidate
          - endpoints.GET_/charter/candidates/{candidateId}
        distinguishing_aspect: "GET by id returns every stored field unchanged, including the suspended_until null default and conduct_revoked false."
        test_recipe:
          setup:
            - "Logical clock 2027-01-05T00:00:00Z. Candidate A created."
          setup_api_calls:
            - *c_clock
            - *c_cand_a
          trigger:
            - call: "GET /charter/candidates/${cand_a}"
              payload: {}
              as: ExperienceReviewer
          assert:
            - "the response status is 200"
            - "Candidate.${cand_a}.full_name == \"A Candidate\" and date_of_birth == \"1995-04-12\""
            - "Candidate.${cand_a}.suspended_until is null and conduct_revoked == false"

      - name: c_appointments_list_paginates_filters_and_counts
        claim_type: Listing
        grounds:
          - endpoints.GET_/charter/appointments
          - response_envelope.pagination_fields
          - response_envelope.pagination_defaults
        distinguishing_aspect: "With three appointments at one center, limit=2&offset=0 returns 2 rows with total_count 3 and has_more true, offset=2 returns 1 row with has_more false, and the test_center_id filter plus booking_status filter narrow the set without changing total_count semantics."
        test_recipe:
          setup:
            - "Clock 2027-01-05. Candidates A, B, C each ENROLLED (35003 paid). LEVEL_I window W1, center cap 5. A booked 2027-03-03, B booked 2027-03-04, C booked 2027-03-05."
          setup_api_calls:
            - *c_clock
            - *c_cand_a
            - &c_enroll_a
              call: "POST /charter/candidates/${cand_a}/program-enrollments"
              payload: { pathway: "EDUCATION", degree_completed: true, graduation_date: "2023-05-15" }
              as: ProgramAdmin
              captures: { enr_a: $.data.id }
            - &c_pay_enr_a
              call: "POST /charter/program-enrollments/${enr_a}/payments"
              payload: { amount_cents: 35003 }
              as: ProgramAdmin
            - &c_cand_b
              call: "POST /charter/candidates"
              payload: { email: "b.cand@example.com", full_name: "B Candidate", date_of_birth: "1993-09-30", gov_id_number: "GOV-B-1002" }
              as: ProgramAdmin
              captures: { cand_b: $.data.id }
            - &c_enroll_b
              call: "POST /charter/candidates/${cand_b}/program-enrollments"
              payload: { pathway: "WORK_EXPERIENCE", declared_work_months: 48, declared_work_hours: 6000 }
              as: ProgramAdmin
              captures: { enr_b: $.data.id }
            - &c_pay_enr_b
              call: "POST /charter/program-enrollments/${enr_b}/payments"
              payload: { amount_cents: 35003 }
              as: ProgramAdmin
            - &c_cand_c
              call: "POST /charter/candidates"
              payload: { email: "c.cand@example.com", full_name: "C Candidate", date_of_birth: "1990-01-20", gov_id_number: "GOV-C-1003" }
              as: ProgramAdmin
              captures: { cand_c: $.data.id }
            - &c_enroll_c
              call: "POST /charter/candidates/${cand_c}/program-enrollments"
              payload: { pathway: "EDUCATION", degree_completed: true, graduation_date: "2022-06-01" }
              as: ProgramAdmin
              captures: { enr_c: $.data.id }
            - &c_pay_enr_c
              call: "POST /charter/program-enrollments/${enr_c}/payments"
              payload: { amount_cents: 35003 }
              as: ProgramAdmin
            - &c_level1
              call: "POST /charter/exam-levels"
              payload: { level_code: "LEVEL_I", mps_scaled_score: 700, max_attempts: 6, early_fee_cents: 94000, standard_fee_cents: 125000 }
              as: ProgramAdmin
              captures: { lvl1: $.data.id }
            - &c_win1
              call: "POST /charter/exam-windows"
              payload: { exam_level_id: "${lvl1}", window_opens_at: "2027-03-01T00:00:00Z", window_closes_at: "2027-03-15T00:00:00Z", scheduling_deadline_at: "2027-02-20T00:00:00Z", reschedule_deadline_at: "2027-03-08T00:00:00Z", early_fee_deadline_at: "2027-01-31T00:00:00Z" }
              as: ProgramAdmin
              captures: { win1: $.data.id }
            - &c_ctr5
              call: "POST /charter/test-centers"
              payload: { name: "Grand Center", city: "Metropolis", daily_seat_capacity: 5 }
              as: ProgramAdmin
              captures: { ctr5: $.data.id }
            - call: "POST /charter/appointments"
              payload: { program_enrollment_id: "${enr_a}", exam_window_id: "${win1}", test_center_id: "${ctr5}", exam_date: "2027-03-03", calculator_model: "TI_BA_II_PLUS" }
              as: Candidate
              as_user_id: "${cand_a}"
            - call: "POST /charter/appointments"
              payload: { program_enrollment_id: "${enr_b}", exam_window_id: "${win1}", test_center_id: "${ctr5}", exam_date: "2027-03-04", calculator_model: "HP_12C" }
              as: Candidate
              as_user_id: "${cand_b}"
            - call: "POST /charter/appointments"
              payload: { program_enrollment_id: "${enr_c}", exam_window_id: "${win1}", test_center_id: "${ctr5}", exam_date: "2027-03-05", calculator_model: "TI_BA_II_PLUS" }
              as: Candidate
              as_user_id: "${cand_c}"
          trigger:
            - call: "GET /charter/appointments"
              payload: { test_center_id: "${ctr5}", limit: 2, offset: 0 }
              as: ProgramAdmin
          assert:
            - "the response status is 200 and response_type is array"
            - "exactly 2 rows with total_count == 3 and has_more == true"
            - "GET /charter/appointments?test_center_id=${ctr5}&limit=2&offset=2 returns exactly 1 row with total_count == 3 and has_more == false"
            - "GET /charter/appointments?test_center_id=${ctr5}&booking_status=SCHEDULED returns 3 rows"
            - "GET /charter/appointments?exam_window_id=${win1} with no pagination params returns 3 rows (defaults limit 10, offset 0)"

      - name: c_candidate_get_unknown_id_returns_not_found
        claim_type: Not Found
        grounds:
          - endpoints.GET_/charter/candidates/{candidateId}
          - errors.ERR_CANDIDATE_NOT_FOUND
        distinguishing_aspect: "A syntactically valid but unallocated UUID yields the entity-specific 404 ERR_CANDIDATE_NOT_FOUND with the error envelope, not a generic 400 or empty 200."
        test_recipe:
          setup:
            - "Clock 2027-01-05. No candidate exists."
          setup_api_calls:
            - *c_clock
          trigger:
            - call: "GET /charter/candidates/00000000-0000-4000-8000-000000000000"
              payload: {}
              as: ProgramAdmin
              captures: { err: $.data.error_id }
          assert:
            - "the response status is 404 and error_id == ERR_CANDIDATE_NOT_FOUND"
            - "response_type is error and data carries both error_id and message"

      - name: c_enrollment_missing_pathway_returns_invalid_request
        claim_type: Required Fields
        grounds:
          - entities.ProgramEnrollment.fields.pathway
          - errors.ERR_INVALID_REQUEST
        distinguishing_aspect: "pathway is a required input with no default; omitting it is a 400 ERR_INVALID_REQUEST and no enrollment row is created."
        test_recipe:
          setup:
            - "Clock 2027-01-05. Candidate A exists."
          setup_api_calls:
            - *c_clock
            - *c_cand_a
          trigger:
            - call: "POST /charter/candidates/${cand_a}/program-enrollments"
              payload: { degree_completed: true, graduation_date: "2023-05-15" }
              as: ProgramAdmin
              captures: { err: $.data.error_id }
          assert:
            - "the response status is 400 and error_id == ERR_INVALID_REQUEST"
            - "GET /charter/program-enrollments?candidate_id=${cand_a} returns 0 rows"

      - name: c_enrollment_scholarship_omitted_defaults_to_zero
        claim_type: Defaults
        grounds:
          - entities.ProgramEnrollment.fields.scholarship_pct
          - calculations.enrollment_line_charges
        distinguishing_aspect: "Omitting scholarship_pct stores the default 0, so the program fee line is the undiscounted 35003, not a discounted or null amount."
        test_recipe:
          setup:
            - "Clock 2027-01-05. Candidate A exists."
          setup_api_calls:
            - *c_clock
            - *c_cand_a
          trigger:
            - call: "POST /charter/candidates/${cand_a}/program-enrollments"
              payload: { pathway: "EDUCATION", degree_completed: true, graduation_date: "2023-05-15" }
              as: ProgramAdmin
              captures: { enr_d: $.data.id, enr_d_charges: $.data.lifetime_charges_cents }
          assert:
            - "the response status is 201 and scholarship_pct == 0"
            - "enr_d_charges == 35003 (PROGRAM_FEE_CENTS undiscounted) and outstanding_balance_cents == 35003"

      - name: c_curriculum_access_empty_until_enrolled
        claim_type: Computed Fields
        grounds:
          - entities.ProgramEnrollment.fields.curriculum_access_cycle_ids
          - calculations.candidate_progression_recompute
        distinguishing_aspect: "The computed access list is [] while PENDING_PAYMENT even though a PUBLISHED cycle exists, and becomes exactly [l1 cycle] the moment the zero-balance payment flips the enrollment to ENROLLED — visible in the payment response itself."
        test_recipe:
          setup:
            - "Clock 2027-01-05. Candidate A, LEVEL_I with a PUBLISHED 2027 cycle, enrollment created unpaid."
          setup_api_calls:
            - *c_clock
            - *c_cand_a
            - *c_level1
            - &c_cyc_l1
              call: "POST /charter/exam-levels/${lvl1}/curriculum-cycles"
              payload: { cycle_year: 2027, effective_from: "2027-01-01T00:00:00Z", effective_to: "2028-01-01T00:00:00Z", content_version: "L1-2027" }
              as: ProgramAdmin
              captures: { l1_cyc: $.data.id }
            - *c_enroll_a
          trigger:
            - call: "GET /charter/program-enrollments"
              payload: { candidate_id: "${cand_a}" }
              as: ProgramAdmin
              captures: { access_pre: "$.data[0].curriculum_access_cycle_ids" }
            - call: "POST /charter/program-enrollments/${enr_a}/payments"
              payload: { amount_cents: 35003 }
              as: ProgramAdmin
              captures: { access_post: $.data.curriculum_access_cycle_ids, status_post: $.data.status }
          assert:
            - "access_pre == [] (PENDING_PAYMENT grants no curriculum access)"
            - "status_post == ENROLLED and access_post contains exactly [${l1_cyc}] (lowest unpassed level is LEVEL_I)"

      - name: c_candidate_create_with_system_fields_rejected
        claim_type: System Fields
        grounds:
          - entities.Candidate
          - errors.ERR_INVALID_REQUEST
        distinguishing_aspect: "Supplying id or version in the creation payload is rejected as an unknown-field 400 ERR_INVALID_REQUEST — system fields are never client-writable, even to values that would match the server's own."
        test_recipe:
          setup:
            - "Clock 2027-01-05. Empty database."
          setup_api_calls:
            - *c_clock
          trigger:
            - call: "POST /charter/candidates"
              payload: { id: "11111111-1111-4111-8111-111111111111", version: 1, email: "rigged@example.com", full_name: "Rigged Candidate", date_of_birth: "1990-01-01", gov_id_number: "GOV-R-9" }
              as: ProgramAdmin
              captures: { err: $.data.error_id }
          assert:
            - "the response status is 400 and error_id == ERR_INVALID_REQUEST"
            - "no candidate with email rigged@example.com exists afterwards"

      - name: c_enrollment_invalid_pathway_enum_rejected
        claim_type: Type Constraints
        grounds:
          - entities.ProgramEnrollment.fields.pathway
          - errors.ERR_INVALID_REQUEST
        distinguishing_aspect: "pathway outside {EDUCATION, WORK_EXPERIENCE} is a 400 ERR_INVALID_REQUEST at the request-shape priority, before any eligibility evaluation runs."
        test_recipe:
          setup:
            - "Clock 2027-01-05. Candidate A exists."
          setup_api_calls:
            - *c_clock
            - *c_cand_a
          trigger:
            - call: "POST /charter/candidates/${cand_a}/program-enrollments"
              payload: { pathway: "PHD", degree_completed: true, graduation_date: "2023-05-15" }
              as: ProgramAdmin
              captures: { err: $.data.error_id }
          assert:
            - "the response status is 400 and error_id == ERR_INVALID_REQUEST"
            - "GET /charter/program-enrollments?candidate_id=${cand_a} returns 0 rows"

      - name: c_enrollment_under_unknown_candidate_returns_404
        claim_type: Parent Relationships
        grounds:
          - entities.ProgramEnrollment.fields.candidate_id
          - errors.ERR_CANDIDATE_NOT_FOUND
        distinguishing_aspect: "The nested create validates its parent path segment first: an unknown candidateId yields 404 ERR_CANDIDATE_NOT_FOUND even with an otherwise valid payload."
        test_recipe:
          setup:
            - "Clock 2027-01-05. Empty database."
          setup_api_calls:
            - *c_clock
          trigger:
            - call: "POST /charter/candidates/00000000-0000-4000-8000-000000000000/program-enrollments"
              payload: { pathway: "EDUCATION", degree_completed: true, graduation_date: "2023-05-15" }
              as: ProgramAdmin
              captures: { err: $.data.error_id }
          assert:
            - "the response status is 404 and error_id == ERR_CANDIDATE_NOT_FOUND"
# === CORNER PART B MARKER ===

  # ===========================================================================
  - section: state_machines
    instances:
      - name: c_enrollment_initial_state_pending_payment
        claim_type: Initial State
        grounds:
          - state_machines.ProgramEnrollment
          - entities.ProgramEnrollment.fields.status
        distinguishing_aspect: "A freshly created enrollment is PENDING_PAYMENT with version 1 — it is not ENROLLED until a payment zeroes the balance."
        test_recipe:
          setup:
            - "Clock 2027-01-05. Candidate A exists."
          setup_api_calls:
            - *c_clock
            - *c_cand_a
          trigger:
            - call: "POST /charter/candidates/${cand_a}/program-enrollments"
              payload: { pathway: "EDUCATION", degree_completed: true, graduation_date: "2023-05-15" }
              as: ProgramAdmin
              captures: { enr_i: $.data.id, enr_i_status: $.data.status }
          assert:
            - "enr_i_status == PENDING_PAYMENT"
            - "ProgramEnrollment.${enr_i}.version == 1 and chartered_at is null"

      - name: c_award_from_pending_payment_rejected
        claim_type: Invalid Transitions
        grounds:
          - state_machines.ProgramEnrollment.ENROLLED_to_CHARTER_AWARDED
          - errors.ERR_ENROLLMENT_NOT_ENROLLED
        distinguishing_aspect: "award-charter from PENDING_PAYMENT (not a declared from-state) is rejected 409 ERR_ENROLLMENT_NOT_ENROLLED, and the candidate's charter_awarded stays false."
        test_recipe:
          setup:
            - "Clock 2027-01-05. Candidate A with a PENDING_PAYMENT enrollment."
          setup_api_calls:
            - *c_clock
            - *c_cand_a
            - *c_enroll_a
          trigger:
            - call: "POST /charter/program-enrollments/${enr_a}/award-charter"
              payload: {}
              as: ProgramAdmin
              captures: { err: $.data.error_id }
          assert:
            - "the response status is 409 and error_id == ERR_ENROLLMENT_NOT_ENROLLED"
            - "Candidate.${cand_a}.charter_awarded == false"

      - name: c_cancel_results_published_window_rejected
        claim_type: Terminal State Lockdown
        grounds:
          - state_machines.ExamWindow
          - errors.ERR_WINDOW_NOT_CANCELLABLE
        distinguishing_aspect: "Once the window reaches the terminal RESULTS_PUBLISHED state (auto-published when its only attempt was scored), the cancel transition is no longer declared and fails 409 ERR_WINDOW_NOT_CANCELLABLE."
        test_recipe:
          setup:
            - "Candidate A ENROLLED; LEVEL_I window W1; center cap 2. A booked 2027-03-03, paid the 94000 EARLY fee, checked in on exam day, and was scored 700 at clock 2027-03-16 — the window auto-published."
          setup_api_calls:
            - *c_clock
            - *c_cand_a
            - *c_enroll_a
            - *c_pay_enr_a
            - *c_level1
            - *c_win1
            - &c_ctr2
              call: "POST /charter/test-centers"
              payload: { name: "Metro Center", city: "Metropolis", daily_seat_capacity: 2 }
              as: ProgramAdmin
              captures: { ctr2: $.data.id }
            - &c_book_a
              call: "POST /charter/appointments"
              payload: { program_enrollment_id: "${enr_a}", exam_window_id: "${win1}", test_center_id: "${ctr2}", exam_date: "2027-03-03", calculator_model: "TI_BA_II_PLUS" }
              as: Candidate
              as_user_id: "${cand_a}"
              captures: { appt_a: $.data.id, appt_a_v: $.data.version }
            - &c_pay_fee_a
              call: "POST /charter/program-enrollments/${enr_a}/payments"
              payload: { amount_cents: 94000 }
              as: ProgramAdmin
            - &c_clock_mar03
              call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2027-03-03T08:00:00Z" }
              as: ProgramAdmin
            - &c_checkin_a
              call: "POST /charter/appointments/${appt_a}/check-in"
              payload: { identity_document_number: "GOV-A-1001", actual_calculator_model: "TI_BA_II_PLUS" }
              as: Proctor
            - &c_attempt_a
              call: "GET /charter/exam-attempts"
              payload: { exam_appointment_id: "${appt_a}" }
              as: ProgramAdmin
              captures: { att_a: "$.data[0].id" }
            - &c_clock_mar16
              call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2027-03-16T00:00:00Z" }
              as: ProgramAdmin
            - &c_score_a_700
              call: "POST /charter/exam-attempts/${att_a}/score"
              payload: { scaled_score: 700 }
              as: ProgramAdmin
          trigger:
            - call: "POST /charter/exam-windows/${win1}/cancel"
              payload: {}
              as: ProgramAdmin
              captures: { err: $.data.error_id }
          assert:
            - "the response status is 409 and error_id == ERR_WINDOW_NOT_CANCELLABLE"
            - "GET /charter/exam-windows?exam_level_id=${lvl1} still shows status RESULTS_PUBLISHED"
            - "ExamAppointment.${appt_a}.booking_status == COMPLETED (untouched by the rejected cancel)"

      - name: c_score_attempt_twice_rejected
        claim_type: Idempotency
        grounds:
          - state_machines.ExamAttempt.AWAITING_SCORE_to_SCORED
          - errors.ERR_ATTEMPT_ALREADY_SCORED
        distinguishing_aspect: "Re-scoring a SCORED attempt is not idempotent and not an overwrite — the second score call fails 409 ERR_ATTEMPT_ALREADY_SCORED and the original 700/PASS result is preserved."
        test_recipe:
          setup:
            - "Same pass-chain as c_cancel_results_published_window: A scored 700 (PASS) at 2027-03-16."
          setup_api_calls:
            - *c_clock
            - *c_cand_a
            - *c_enroll_a
            - *c_pay_enr_a
            - *c_level1
            - *c_win1
            - *c_ctr2
            - *c_book_a
            - *c_pay_fee_a
            - *c_clock_mar03
            - *c_checkin_a
            - *c_attempt_a
            - *c_clock_mar16
            - *c_score_a_700
          trigger:
            - call: "POST /charter/exam-attempts/${att_a}/score"
              payload: { scaled_score: 400 }
              as: ProgramAdmin
              captures: { err: $.data.error_id }
          assert:
            - "the response status is 409 and error_id == ERR_ATTEMPT_ALREADY_SCORED"
            - "GET /charter/exam-attempts?exam_appointment_id=${appt_a} still shows scaled_score == 700 and result == PASS"

      - name: c_no_show_auto_flip_on_first_window_score
        claim_type: Valid Transition
        grounds:
          - state_machines.ExamAppointment.SCHEDULED_to_NO_SHOW
          - state_machines.ExamWindow.OPEN_to_RESULTS_PUBLISHED
        distinguishing_aspect: "The system-side no-show sweep fires from the score event, not from any appointment endpoint: the candidate who never checked in lands in NO_SHOW with no attempt row, no credit, and the exam fee still owed — while the scored candidate's appointment goes COMPLETED."
        test_recipe:
          setup:
            - "A and C both booked W1 on 2027-03-03 at the cap-2 center. A checked in; C never did. Clock at 2027-03-16. C's 94000 fee was never paid."
          setup_api_calls:
            - *c_clock
            - *c_cand_a
            - *c_enroll_a
            - *c_pay_enr_a
            - *c_cand_c
            - *c_enroll_c
            - *c_pay_enr_c
            - *c_level1
            - *c_win1
            - *c_ctr2
            - *c_book_a
            - &c_book_c
              call: "POST /charter/appointments"
              payload: { program_enrollment_id: "${enr_c}", exam_window_id: "${win1}", test_center_id: "${ctr2}", exam_date: "2027-03-03", calculator_model: "HP_12C" }
              as: Candidate
              as_user_id: "${cand_c}"
              captures: { appt_c: $.data.id }
            - *c_clock_mar03
            - *c_checkin_a
            - *c_attempt_a
            - *c_clock_mar16
          trigger:
            - *c_score_a_700
            - call: "GET /charter/appointments"
              payload: { exam_window_id: "${win1}" }
              as: ProgramAdmin
            - call: "GET /charter/program-enrollments"
              payload: { candidate_id: "${cand_c}" }
              as: ProgramAdmin
              captures: { enr_c_credits: "$.data[0].lifetime_credits_posted_cents", enr_c_outstanding: "$.data[0].outstanding_balance_cents" }
          assert:
            - "ExamAppointment.${appt_a}.booking_status == COMPLETED"
            - "ExamAppointment.${appt_c}.booking_status == NO_SHOW"
            - "GET /charter/exam-attempts?candidate_id=${cand_c} returns 0 rows (no attempt for a no-show)"
            - "enr_c_credits == 0 and enr_c_outstanding == 94000 (no-show forfeits the fee; nothing is credited)"

      - name: c_submission_revision_cycle_returns_to_draft
        claim_type: Valid Transition
        grounds:
          - state_machines.WorkExperienceSubmission.SUBMITTED_to_RETURNED_FOR_REVISION
          - state_machines.WorkExperienceSubmission.RETURNED_FOR_REVISION_to_DRAFT
          - state_machines.WorkExperienceSubmission.DRAFT_to_SUBMITTED
        distinguishing_aspect: "The revision loop SUBMITTED -> RETURNED_FOR_REVISION -> DRAFT -> SUBMITTED is a cycle on WorkExperienceSubmission: amend (OCC-guarded) replaces the segments, resets both computed month fields to null, and resubmission recomputes provisional_months from the new segments (12 -> 18)."
        test_recipe:
          setup:
            - "Clock 2027-01-05. Candidate A. Submission with one segment 2023-01-05..2024-01-05 at 80% (12 months), two references attached; submitted (provisional 12), then RETURNED_FOR_REVISION."
          setup_api_calls:
            - *c_clock
            - *c_cand_a
            - &c_sub_a
              call: "POST /charter/candidates/${cand_a}/experience-submissions"
              payload: { segments: [ { employer_name: "Alpha Asset Management", role_title: "Analyst", start_date: "2023-01-05", end_date: "2024-01-05", qualifying_activity_pct: 80, hours: 2100 } ] }
              as: Candidate
              as_user_id: "${cand_a}"
              captures: { sub_a: $.data.id, sub_a_v: $.data.version }
            - &c_ref1
              call: "POST /charter/experience-submissions/${sub_a}/references"
              payload: { referee_name: "Ref One", referee_email: "ref1@example.com" }
              as: Candidate
              as_user_id: "${cand_a}"
              captures: { ref1: $.data.id }
            - &c_ref2
              call: "POST /charter/experience-submissions/${sub_a}/references"
              payload: { referee_name: "Ref Two", referee_email: "ref2@example.com" }
              as: Candidate
              as_user_id: "${cand_a}"
              captures: { ref2: $.data.id }
            - &c_submit_a
              call: "POST /charter/experience-submissions/${sub_a}/submit"
              payload: {}
              as: Candidate
              as_user_id: "${cand_a}"
              captures: { sub_a_v2: $.data.version, sub_a_prov1: $.data.provisional_months }
            - call: "POST /charter/experience-submissions/${sub_a}/review"
              payload: { decision: "RETURNED_FOR_REVISION", reviewer_notes: "Extend the documented period" }
              as: ExperienceReviewer
              captures: { sub_a_v3: $.data.version }
          trigger:
            - call: "POST /charter/experience-submissions/${sub_a}/amend"
              payload: { segments: [ { employer_name: "Alpha Asset Management", role_title: "Analyst", start_date: "2023-01-05", end_date: "2024-07-05", qualifying_activity_pct: 80, hours: 3200 } ], expected_submission_version: "${sub_a_v3}" }
              as: Candidate
              as_user_id: "${cand_a}"
              captures: { sub_a_v4: $.data.version, sub_a_status4: $.data.status }
            - call: "POST /charter/experience-submissions/${sub_a}/submit"
              payload: {}
              as: Candidate
              as_user_id: "${cand_a}"
              captures: { sub_a_prov2: $.data.provisional_months, sub_a_status5: $.data.status }
          assert:
            - "after amend: sub_a_status4 == DRAFT and version advanced to 4 (the cycle returned to DRAFT)"
            - "provisional_months was reset to null by the amend and recomputed on resubmission: sub_a_prov2 == 18 (2023-01-05..2024-07-05)"
            - "sub_a_prov1 == 12 and sub_a_prov1 != sub_a_prov2 (12 != 18)"
            - "sub_a_status5 == SUBMITTED and both references still exist with their PENDING status unchanged by the amend"

      - name: c_booking_level_ii_without_prerequisite_rejected
        claim_type: Precondition Enforcement
        grounds:
          - calculations.retake_eligibility_evaluation
          - errors.ERR_PREREQUISITE_LEVEL_NOT_PASSED
        distinguishing_aspect: "Guarded creation across entities: booking a LEVEL_II window requires a VALID|REINSTATED PASS at LEVEL_I; with zero attempts the referential gate fires 422 ERR_PREREQUISITE_LEVEL_NOT_PASSED after state/temporal/constraint checks all pass."
        test_recipe:
          setup:
            - "Clock 2027-01-05. Candidate A ENROLLED. LEVEL_I and LEVEL_II exist; LEVEL_II window W2 [2027-05-03, 2027-05-17); center cap 2. No attempts."
          setup_api_calls:
            - *c_clock
            - *c_cand_a
            - *c_enroll_a
            - *c_pay_enr_a
            - *c_level1
            - &c_level2
              call: "POST /charter/exam-levels"
              payload: { level_code: "LEVEL_II", mps_scaled_score: 720, max_attempts: 6, early_fee_cents: 94000, standard_fee_cents: 125000 }
              as: ProgramAdmin
              captures: { lvl2: $.data.id }
            - &c_win2
              call: "POST /charter/exam-windows"
              payload: { exam_level_id: "${lvl2}", window_opens_at: "2027-05-03T00:00:00Z", window_closes_at: "2027-05-17T00:00:00Z", scheduling_deadline_at: "2027-04-19T00:00:00Z", reschedule_deadline_at: "2027-04-26T00:00:00Z", early_fee_deadline_at: "2027-03-31T00:00:00Z" }
              as: ProgramAdmin
              captures: { win2: $.data.id }
            - *c_ctr2
          trigger:
            - call: "POST /charter/appointments"
              payload: { program_enrollment_id: "${enr_a}", exam_window_id: "${win2}", test_center_id: "${ctr2}", exam_date: "2027-05-05", calculator_model: "TI_BA_II_PLUS" }
              as: Candidate
              as_user_id: "${cand_a}"
              captures: { err: $.data.error_id }
          assert:
            - "the response status is 422 and error_id == ERR_PREREQUISITE_LEVEL_NOT_PASSED"
            - "GET /charter/appointments?program_enrollment_id=${enr_a} returns 0 rows"
            - "ProgramEnrollment.${enr_a}.outstanding_balance_cents == 0 (no charge posted on the rejected booking)"

      - name: c_checkin_creates_awaiting_score_attempt
        claim_type: Side Effect Execution
        grounds:
          - state_machines.ExamAppointment.SCHEDULED_to_CHECKED_IN
          - entities.ExamAttempt
        distinguishing_aspect: "Check-in's cascade creates exactly one ExamAttempt with score_status AWAITING_SCORE, validity VALID, attempt_sequence 1 and the denormalized level code — discoverable through the appointment-filtered list endpoint."
        test_recipe:
          setup:
            - "Clock 2027-01-05. A ENROLLED, booked W1 2027-03-03, fee paid. Clock moved to exam day."
          setup_api_calls:
            - *c_clock
            - *c_cand_a
            - *c_enroll_a
            - *c_pay_enr_a
            - *c_level1
            - *c_win1
            - *c_ctr2
            - *c_book_a
            - *c_pay_fee_a
            - *c_clock_mar03
          trigger:
            - *c_checkin_a
            - call: "GET /charter/exam-attempts"
              payload: { exam_appointment_id: "${appt_a}" }
              as: ProgramAdmin
          assert:
            - "check-in response shows booking_status == CHECKED_IN"
            - "GET /charter/exam-attempts?exam_appointment_id=${appt_a} returns exactly 1 row"
            - "that row has score_status == AWAITING_SCORE, validity == VALID, attempt_sequence == 1, exam_level_code == \"LEVEL_I\", scaled_score null and result null"

      - name: c_window_cancel_skips_checked_in_appointments
        claim_type: Side Effect Execution
        grounds:
          - state_machines.ExamWindow.OPEN_to_CANCELLED
          - state_machines.ExamAppointment.SCHEDULED_to_CANCELLED
        distinguishing_aspect: "The cancel cascade is conditional on child state: only SCHEDULED appointments are cancelled and credited; the CHECKED_IN appointment keeps its status and its unpaid fee, because its exam already happened."
        test_recipe:
          setup:
            - "Clock 2027-01-05. A and B booked W1 (cap 2), A on 2027-03-03 and B on 2027-03-03; neither paid the exam fee (each outstanding 94000). On 2027-03-03 A checked in. Window still OPEN."
          setup_api_calls:
            - *c_clock
            - *c_cand_a
            - *c_enroll_a
            - *c_pay_enr_a
            - *c_cand_b
            - *c_enroll_b
            - *c_pay_enr_b
            - *c_level1
            - *c_win1
            - *c_ctr2
            - *c_book_a
            - &c_book_b
              call: "POST /charter/appointments"
              payload: { program_enrollment_id: "${enr_b}", exam_window_id: "${win1}", test_center_id: "${ctr2}", exam_date: "2027-03-03", calculator_model: "HP_12C" }
              as: Candidate
              as_user_id: "${cand_b}"
              captures: { appt_b: $.data.id }
            - *c_clock_mar03
            - *c_checkin_a
          trigger:
            - call: "POST /charter/exam-windows/${win1}/cancel"
              payload: {}
              as: ProgramAdmin
              captures: { win_st: $.data.status }
            - call: "GET /charter/appointments"
              payload: { exam_window_id: "${win1}" }
              as: ProgramAdmin
            - call: "GET /charter/program-enrollments"
              payload: { candidate_id: "${cand_b}" }
              as: ProgramAdmin
              captures: { enr_b_credits: "$.data[0].lifetime_credits_posted_cents", enr_b_out: "$.data[0].outstanding_balance_cents" }
            - call: "GET /charter/program-enrollments"
              payload: { candidate_id: "${cand_a}" }
              as: ProgramAdmin
              captures: { enr_a_credits: "$.data[0].lifetime_credits_posted_cents", enr_a_out: "$.data[0].outstanding_balance_cents" }
          assert:
            - "win_st == CANCELLED"
            - "ExamAppointment.${appt_b}.booking_status == CANCELLED (SCHEDULED child caught by the cascade)"
            - "ExamAppointment.${appt_a}.booking_status == CHECKED_IN (conditional cascade skips non-SCHEDULED children)"
            - "enr_b_credits == 94000 and enr_b_out == 0 (full window-fault credit applied to the unpaid fee)"
            - "enr_a_credits == 0 and enr_a_out == 94000 (checked-in appointment receives no credit)"

      - name: c_case_appeal_cycle_states
        claim_type: Valid Transition
        grounds:
