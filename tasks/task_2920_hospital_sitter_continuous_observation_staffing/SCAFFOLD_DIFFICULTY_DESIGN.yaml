              captures: { p9: $.data.id }
            - call: "POST /observation/staff"
              payload: { home_unit_id: "${unit_h}", full_name: "Sitter Aitch", source_pool: "INTERNAL_FLOAT", hourly_rate_cents: 2400, competency_level: "ADVANCED", deescalation_cert_expires_on: "2027-01-01T00:00:00Z" }
              as: StaffingCoordinator
              captures: { s9: $.data.id }
            - call: "POST /observation/orders"
              payload: { patient_id: "${p9}", ordering_provider_user_id: "prov-1", risk_categories: ["FALL"], required_modality: "ONE_TO_ONE_SITTER", clinical_rationale: "Post-operative delirium with fall risk" }
              as: AttendingProvider
              as_user_id: "prov-1"
              captures: { o9: $.data.id, o9_v1: $.data.version }
            - call: "POST /observation/sitter-assignments"
              payload: { order_id: "${o9}", staff_id: "${s9}", shift_start_at: "2026-08-01T08:00:00Z", shift_end_at: "2026-08-01T16:00:00Z", expected_order_version: "${o9_v1}" }
              as: StaffingCoordinator
              captures: { a9: $.data.id }
            - call: "POST /observation/_clock/set_current_utc"
              payload: { current_utc: "2026-08-01T08:00:00Z" }
              as: SystemAdmin
            - call: "POST /observation/sitter-assignments/${a9}/start-watch"
              payload: {}
              as: Sitter
              as_user_id: "${s9}"
            - call: "POST /observation/_clock/set_current_utc"
              payload: { current_utc: "2026-08-01T11:00:00Z" }
              as: SystemAdmin
          trigger:
            - call: "POST /observation/patients/${p9}/discharge"
              payload: {}
              as: NurseManager
              as_user_id: "mgr-1"
          assert:
            - "Patient.${p9}.status == DISCHARGED and discharged_at == 2026-08-01T11:00:00Z"
            - "HOP 1: ObservationOrder.${o9}.status == DISCONTINUED with discontinued_at == 2026-08-01T11:00:00Z"
            - "HOP 2: SitterAssignment.${a9}.watch_status == COMPLETED, completion_reason == ORDER_DISCONTINUED, documentation_status == WAIVED"
            - "HOP 3: GET /observation/sitter-assignments/${a9}/cost-entries returns exactly 2 rows — the PROVISIONAL 19200 now status REVERSED with reversed_at 2026-08-01T11:00:00Z, and one POSTED FINAL_SEGMENT with amount_cents 7200, segment_index 1, segment_minutes 180, night_differential_applied false"
            - "SitterAssignment.${a9}.final_cost_cents == 7200, watch_segment_count == 1, watched_minutes == 180"
            - "HOP 3 ledger: Unit.${unit_h}.observed_cost_to_date_cents == 7200"
            - "HOP 4 no-op: Unit.${unit_h}.status == OPEN and restriction_reason == null (7200 < 100000, so the re-evaluated threshold does not fire)"
            - "ObservationOrder.${o9}.coverage_gap_flag == false (ORDER_DISCONTINUED is not SHIFT_END_NO_SUCCESSOR)"
            - "Staff.${s9}.status == AVAILABLE"

  - rule_id: priority_pair_validation_conflict
    instances:
      - name: discontinued_order_state_beats_unit_budget_exceeded
        category_pair: "state (priority 8, ERR_INVALID_ORDER_STATE 409) vs business_fiscal (priority 28, ERR_UNIT_BUDGET_EXCEEDED 402)"
        grounds:
          - validations.priority_8
          - validations.priority_28
          - state_machines.ObservationOrder.status.DISCONTINUATION_REVIEW_to_DISCONTINUED
        distinguishing_aspect: |
          A single POST /observation/sitter-assignments violates the state check and the fiscal check
          at once: the order is DISCONTINUED (no such transition is declared from a terminal order) and
          the candidate PROVISIONAL 19200 would push the unit head from 9600 to 28800 against a 10000
          budget. The lower-priority 402 must not be returned, and because the request is rejected
          before any ledger write the head must still read exactly 9600.
        test_recipe:
          setup:
            - "Unit UNIT-I with a deliberately tiny observation_cost_budget_cents 10000."
            - "Patient A carries a live watch at 1200 cents/hour for 8h, so the unit ledger head is 9600 (still under budget, unit OPEN)."
            - "Patient B's order is walked ACTIVE -> (reassessment) -> DISCONTINUATION_REVIEW -> DISCONTINUED by an approving provider who is not the ordering provider."
            - "The order version is re-read with GET after the walk so the OCC check at priority 7 is satisfied and cannot mask the conflict."
            - "The candidate sitter is homed on UNIT-I with an unexpired certification and ADVANCED competency, so priorities 10, 11, 12, 13 and 26 are all satisfied."
          setup_api_calls:
            - call: "POST /observation/units"
              payload: { unit_code: "UNIT-I", name: "Observation Unit I", observation_cost_budget_cents: 10000, video_monitoring_enabled: false }
              as: NurseManager
              captures: { unit_i: $.data.id }
            - call: "POST /observation/patients"
              payload: { unit_id: "${unit_i}", mrn: "MRN-9001", full_name: "Pat Ten", age_years: 60 }
              as: NurseManager
              captures: { p10: $.data.id }
            - call: "POST /observation/patients"
              payload: { unit_id: "${unit_i}", mrn: "MRN-9002", full_name: "Pat Eleven", age_years: 60 }
              as: NurseManager
              captures: { p11: $.data.id }
            - call: "POST /observation/staff"
              payload: { home_unit_id: "${unit_i}", full_name: "Sitter Eye One", source_pool: "INTERNAL_FLOAT", hourly_rate_cents: 1200, competency_level: "ADVANCED", deescalation_cert_expires_on: "2027-01-01T00:00:00Z" }
              as: StaffingCoordinator
              captures: { s10: $.data.id }
            - call: "POST /observation/staff"
              payload: { home_unit_id: "${unit_i}", full_name: "Sitter Eye Two", source_pool: "INTERNAL_FLOAT", hourly_rate_cents: 2400, competency_level: "ADVANCED", deescalation_cert_expires_on: "2027-01-01T00:00:00Z" }
              as: StaffingCoordinator
              captures: { s11: $.data.id }
            - call: "POST /observation/orders"
              payload: { patient_id: "${p10}", ordering_provider_user_id: "prov-1", risk_categories: ["FALL"], required_modality: "ONE_TO_ONE_SITTER", clinical_rationale: "Fall precautions, patient A" }
              as: AttendingProvider
              as_user_id: "prov-1"
              captures: { o10: $.data.id, o10_v1: $.data.version }
            - call: "POST /observation/sitter-assignments"
              payload: { order_id: "${o10}", staff_id: "${s10}", shift_start_at: "2026-08-01T08:00:00Z", shift_end_at: "2026-08-01T16:00:00Z", expected_order_version: "${o10_v1}" }
              as: StaffingCoordinator
              captures: { a10: $.data.id }
            - call: "POST /observation/orders"
              payload: { patient_id: "${p11}", ordering_provider_user_id: "prov-1", risk_categories: ["FALL"], required_modality: "ONE_TO_ONE_SITTER", clinical_rationale: "Fall precautions, patient B" }
              as: AttendingProvider
              as_user_id: "prov-1"
              captures: { o11: $.data.id }
            - call: "POST /observation/orders/${o11}/reassessments"
              payload: { risk_categories_after: ["FALL"] }
              as: AttendingProvider
              as_user_id: "prov-1"
            - call: "POST /observation/orders/${o11}/discontinuation-review"
              payload: { recommendation: "DISCONTINUE" }
              as: AttendingProvider
              as_user_id: "prov-1"
            - call: "POST /observation/orders/${o11}/discontinuation-decision"
              payload: { decision: "APPROVE", rationale: "Delirium resolved, no risk behaviours for a full shift" }
              as: AttendingProvider
              as_user_id: "prov-2"
            - call: "GET /observation/orders/${o11}"
              payload: {}
              as: StaffingCoordinator
              captures: { o11_vnow: $.data.version }
          trigger:
            - call: "POST /observation/sitter-assignments"
              payload: { order_id: "${o11}", staff_id: "${s11}", shift_start_at: "2026-08-01T08:00:00Z", shift_end_at: "2026-08-01T16:00:00Z", expected_order_version: "${o11_vnow}" }
              as: StaffingCoordinator
          assert:
            - "HTTP 409 with error.code == ERR_INVALID_ORDER_STATE (NOT 402 ERR_UNIT_BUDGET_EXCEEDED, even though 9600 + 19200 = 28800 exceeds the 10000 budget)"
            - "ObservationOrder.${o11}.status is still DISCONTINUED and its version is unchanged from ${o11_vnow}"
            - "GET /observation/orders/${o11}/sitter-assignments returns 0 rows"
            - "Unit.${unit_i}.observed_cost_to_date_cents == 9600 and status == OPEN (no PROVISIONAL entry was posted for the rejected request)"
            - "GET /observation/units/${unit_i}/cost-entries returns exactly 1 row, the POSTED PROVISIONAL 9600 belonging to ${a10}"

      - name: expired_deescalation_cert_beats_missing_float_authorization
        category_pair: "business_safety (priority 10, ERR_DEESCALATION_CERT_EXPIRED 422) vs business_referential (priority 26, ERR_FLOAT_AUTHORIZATION_MISSING 422)"
        grounds:
          - validations.priority_10
          - validations.priority_26
          - entities.Staff.fields.deescalation_cert_expires_on
        distinguishing_aspect: |
          A completely different category pair from instance 1 (two 422 business checks rather than a
          state-vs-fiscal pair), and the two errors share an HTTP status, so the assertion can only be
          settled by the error code. The candidate sitter's certification lapsed on 2026-07-15 while
          the clock sits at the mandatory startup default 2026-08-01T00:00:00Z, and the same staff is
          homed on a different unit from the patient with no float_authorization_code supplied.
        test_recipe:
          setup:
            - "Two units: UNIT-J (the patient's unit, generous budget) and UNIT-K (the sitter's home unit)."
            - "The clock is left at the mandatory startup default 2026-08-01T00:00:00Z."
            - "Staff cert expiry 2026-07-15T00:00:00Z (already lapsed) and home_unit_id == UNIT-K != the patient's UNIT-J."
            - "The assignment request omits float_authorization_code entirely, so priority 26 is violated as well."
          setup_api_calls:
            - call: "POST /observation/units"
              payload: { unit_code: "UNIT-J", name: "Geriatric Unit J", observation_cost_budget_cents: 500000, video_monitoring_enabled: false }
              as: NurseManager
              captures: { unit_j: $.data.id }
            - call: "POST /observation/units"
              payload: { unit_code: "UNIT-K", name: "Float Pool Unit K", observation_cost_budget_cents: 500000, video_monitoring_enabled: false }
              as: NurseManager
              captures: { unit_k: $.data.id }
            - call: "POST /observation/patients"
              payload: { unit_id: "${unit_j}", mrn: "MRN-9101", full_name: "Pat Twelve", age_years: 60 }
              as: NurseManager
              captures: { p12: $.data.id }
            - call: "POST /observation/staff"
              payload: { home_unit_id: "${unit_k}", full_name: "Lapsed Floater", source_pool: "INTERNAL_FLOAT", hourly_rate_cents: 2000, competency_level: "ADVANCED", deescalation_cert_expires_on: "2026-07-15T00:00:00Z" }
              as: StaffingCoordinator
              captures: { s12: $.data.id }
            - call: "POST /observation/orders"
              payload: { patient_id: "${p12}", ordering_provider_user_id: "prov-1", risk_categories: ["FALL"], required_modality: "ONE_TO_ONE_SITTER", clinical_rationale: "Repeated unassisted transfer attempts" }
              as: AttendingProvider
              as_user_id: "prov-1"
              captures: { o12: $.data.id, o12_v1: $.data.version }
          trigger:
            - call: "POST /observation/sitter-assignments"
              payload: { order_id: "${o12}", staff_id: "${s12}", shift_start_at: "2026-08-01T08:00:00Z", shift_end_at: "2026-08-01T16:00:00Z", expected_order_version: "${o12_v1}" }
              as: StaffingCoordinator
          assert:
            - "HTTP 422 with error.code == ERR_DEESCALATION_CERT_EXPIRED (NOT ERR_FLOAT_AUTHORIZATION_MISSING, although that rule is violated too and carries the same 422)"
            - "GET /observation/orders/${o12}/sitter-assignments returns 0 rows"
            - "ObservationOrder.${o12}.version is unchanged from ${o12_v1} (a rejected create never bumps the parent version)"
            - "Unit.${unit_j}.observed_cost_to_date_cents == 0 and Unit.${unit_k}.observed_cost_to_date_cents == 0"
            - "Staff.${s12}.status == AVAILABLE and version unchanged"

  - rule_id: boundary_precision_check
    instances:
      - name: video_gate_strict_less_than_six_point_zero_on_feed_admission
        metric: "elopement_risk_score against the VIDEO_GATE_SCORE_CEILING 6.0 (strict <)"
        endpoint: "POST /observation/video-feeds"
        grounds:
          - calculations.video_modality_gate
          - validations.priority_14
          - calculations.patient_elopement_risk_score.variants.rolling_event_weighted
        distinguishing_aspect: |
          Numeric threshold crossing on a score, driven through POST /observation/video-feeds. The
          same order is walked across the boundary by accumulating attempt events: 4.0 base + 1.0
          (one ELOPEMENT_ATTEMPT) = 5.0 admits the feed, and 4.0 + 2.0 (two attempt events) = exactly
          6.0 denies it, proving the comparison is `< 6.0` and not `<= 6.0`. No clock call is made, so
          both events stay inside the trailing 24h attempt window.
        test_recipe:
          setup:
            - "Video-enabled unit UNIT-L, budget 500000; admitted patient age 60 (no age adjustment)."
            - "Order for FALL + ELOPEMENT with required_modality VIDEO_MONITORING: baseline score 4.0, which passes the same gate at creation."
            - "Console CONSOLE-L1 declared_max_span 3 with observer S_L (ADVANCED, unexpired certification)."
            - "The clock is left at the startup default 2026-08-01T00:00:00Z for the whole recipe."
            - "One ELOPEMENT_ATTEMPT event is reported, escalated and closed, which re-scores the order to 5.0 with the rolling variant; a feed is then admitted successfully and released again."
            - "A second ELOPEMENT_ATTEMPT event is reported, escalated and closed, which re-scores the order to exactly 6.0."
          setup_api_calls:
            - call: "POST /observation/units"
              payload: { unit_code: "UNIT-L", name: "Telemetry Unit L", observation_cost_budget_cents: 500000, video_monitoring_enabled: true }
              as: NurseManager
              captures: { unit_l: $.data.id }
            - call: "POST /observation/patients"
              payload: { unit_id: "${unit_l}", mrn: "MRN-9201", full_name: "Pat Thirteen", age_years: 60 }
              as: NurseManager
              captures: { p13: $.data.id }
            - call: "POST /observation/staff"
              payload: { home_unit_id: "${unit_l}", full_name: "Observer Ell", source_pool: "INTERNAL_FLOAT", hourly_rate_cents: 2000, competency_level: "ADVANCED", deescalation_cert_expires_on: "2027-01-01T00:00:00Z" }
              as: StaffingCoordinator
              captures: { s_l: $.data.id }
            - call: "POST /observation/orders"
              payload: { patient_id: "${p13}", ordering_provider_user_id: "prov-1", risk_categories: ["FALL", "ELOPEMENT"], required_modality: "VIDEO_MONITORING", clinical_rationale: "Exit-seeking with unsteady gait" }
              as: AttendingProvider
              as_user_id: "prov-1"
              captures: { o13: $.data.id }
            - call: "POST /observation/monitoring-stations"
              payload: { observer_staff_id: "${s_l}", station_label: "CONSOLE-L1", declared_max_span: 3 }
              as: StaffingCoordinator
              captures: { st_l: $.data.id }
            - call: "POST /observation/safety-events"
              payload: { order_id: "${o13}", event_kind: "ELOPEMENT_ATTEMPT", narrative: "Found at stairwell door" }
              as: RemoteObserver
              as_user_id: "${s_l}"
              captures: { ev13a: $.data.id }
            - call: "POST /observation/safety-events/${ev13a}/escalate-response"
              payload: { response_actions: ["DOOR_ALARM_CHECK"] }
              as: SafetyOfficer
              as_user_id: "safety-1"
            - call: "POST /observation/safety-events/${ev13a}/close"
              payload: { resolution: "CONTINUE_OBSERVATION" }
              as: SafetyOfficer
              as_user_id: "safety-2"
            - call: "POST /observation/video-feeds"
              payload: { station_id: "${st_l}", order_id: "${o13}", monitor_start_at: "2026-08-01T08:00:00Z", monitor_end_at: "2026-08-01T12:00:00Z" }
              as: RemoteObserver
              as_user_id: "${s_l}"
              captures: { f_ok: $.data.id }
            - call: "POST /observation/video-feeds/${f_ok}/release"
              payload: {}
              as: RemoteObserver
              as_user_id: "${s_l}"
            - call: "POST /observation/safety-events"
              payload: { order_id: "${o13}", event_kind: "ELOPEMENT_ATTEMPT", narrative: "Second exit attempt via service corridor" }
              as: RemoteObserver
              as_user_id: "${s_l}"
              captures: { ev13b: $.data.id }
            - call: "POST /observation/safety-events/${ev13b}/escalate-response"
              payload: { response_actions: ["ONE_TO_ONE_REDIRECTION"] }
              as: SafetyOfficer
              as_user_id: "safety-1"
            - call: "POST /observation/safety-events/${ev13b}/close"
              payload: { resolution: "CONTINUE_OBSERVATION" }
              as: SafetyOfficer
              as_user_id: "safety-2"
          trigger:
            - call: "POST /observation/video-feeds"
              payload: { station_id: "${st_l}", order_id: "${o13}", monitor_start_at: "2026-08-01T13:00:00Z", monitor_end_at: "2026-08-01T17:00:00Z" }
              as: RemoteObserver
              as_user_id: "${s_l}"
          assert:
            - "PERMITTED SIDE: the feed created while the score was 5.0 returned 201 with VideoFeed.${f_ok}.status ACTIVE and acuity_weight 3.0"
            - "After the second close ObservationOrder.${o13}.elopement_risk_score == 6.0 exactly, risk_score_variant == ROLLING_EVENT_WEIGHTED, reassessment_interval_hours == 8"
            - "DENIED SIDE: the trigger returns HTTP 422 with error.code == ERR_VIDEO_MODALITY_NOT_PERMITTED (6.0 is not < 6.0)"
            - "GET /observation/orders/${o13}/video-feeds returns exactly 1 row, the RELEASED ${f_ok}; no second feed exists"
            - "MonitoringStation.${st_l}.status == IDLE, active_feed_count == 0, active_acuity_weight == 0.0, effective_span_limit == 3"
            - "ObservationOrder.${o13}.required_modality is still VIDEO_MONITORING (the gate rejection does not rewrite the modality)"

      - name: discontinuation_safety_window_inclusive_at_exactly_twenty_four_hours
        metric: "SafetyEvent recency against the trailing 24h discontinuation window (inclusive >=)"
        endpoint: "POST /observation/orders/{id}/discontinuation-decision"
        grounds:
          - validations.priority_15
          - state_machines.ObservationOrder.status.DISCONTINUATION_REVIEW_to_DISCONTINUED
          - endpoints.POST_observation__clock_set_current_utc
        distinguishing_aspect: |
          A temporal-window boundary rather than a numeric score threshold, and it is reachable only
          through POST /observation/orders/{id}/discontinuation-decision. The same request is issued at
          clock == occurred_at + 24h exactly (blocked, because `occurred_at >= clock_now - 24h` holds
          at equality) and then at occurred_at + 24h + 1s (allowed). It also proves the review-state
          sweep immunity: the order's next_reassessment_due_at is 2026-08-02T00:00:00Z, yet neither
          clock advance marks it REASSESSMENT_DUE or LAPSED because DISCONTINUATION_REVIEW is outside
          the sweep's input set.
        test_recipe:
          setup:
            - "Unit UNIT-M budget 500000, video disabled; admitted patient age 60; order for FALL only."
            - "At the startup default clock 2026-08-01T00:00:00Z an ELOPEMENT_ATTEMPT event is reported, escalated and closed, leaving occurred_at == 2026-08-01T00:00:00Z, order ACTIVE, score 2.5, interval 24h."
            - "One reassessment is performed at the same instant so reassessment_count reaches 1; last_reassessed_at 2026-08-01T00:00:00Z and next_reassessment_due_at 2026-08-02T00:00:00Z."
            - "The discontinuation review is opened by the ordering provider; the decision will be taken by a different provider so priority 16 is satisfied."
          setup_api_calls:
            - call: "POST /observation/units"
              payload: { unit_code: "UNIT-M", name: "Rehab Unit M", observation_cost_budget_cents: 500000, video_monitoring_enabled: false }
              as: NurseManager
              captures: { unit_m: $.data.id }
            - call: "POST /observation/patients"
              payload: { unit_id: "${unit_m}", mrn: "MRN-9301", full_name: "Pat Fourteen", age_years: 60 }
              as: NurseManager
              captures: { p14: $.data.id }
            - call: "POST /observation/staff"
              payload: { home_unit_id: "${unit_m}", full_name: "Sitter Em", source_pool: "INTERNAL_FLOAT", hourly_rate_cents: 2000, competency_level: "ADVANCED", deescalation_cert_expires_on: "2027-01-01T00:00:00Z" }
              as: StaffingCoordinator
              captures: { s14: $.data.id }
            - call: "POST /observation/orders"
              payload: { patient_id: "${p14}", ordering_provider_user_id: "prov-1", risk_categories: ["FALL"], required_modality: "ONE_TO_ONE_SITTER", clinical_rationale: "Impulsive transfers after sedation" }
              as: AttendingProvider
              as_user_id: "prov-1"
              captures: { o14: $.data.id }
            - call: "POST /observation/safety-events"
              payload: { order_id: "${o14}", event_kind: "ELOPEMENT_ATTEMPT", narrative: "Walked toward the elevator lobby unaccompanied" }
              as: Sitter
              as_user_id: "${s14}"
              captures: { ev14: $.data.id }
            - call: "POST /observation/safety-events/${ev14}/escalate-response"
              payload: { response_actions: ["VERBAL_REDIRECTION"] }
              as: SafetyOfficer
              as_user_id: "safety-1"
            - call: "POST /observation/safety-events/${ev14}/close"
              payload: { resolution: "CONTINUE_OBSERVATION" }
              as: SafetyOfficer
              as_user_id: "safety-2"
            - call: "POST /observation/orders/${o14}/reassessments"
              payload: { risk_categories_after: ["FALL"] }
              as: AttendingProvider
              as_user_id: "prov-1"
            - call: "POST /observation/orders/${o14}/discontinuation-review"
              payload: { recommendation: "DISCONTINUE" }
              as: AttendingProvider
              as_user_id: "prov-1"
            - call: "POST /observation/_clock/set_current_utc"
              payload: { current_utc: "2026-08-02T00:00:00Z" }
              as: SystemAdmin
          trigger:
            - call: "POST /observation/orders/${o14}/discontinuation-decision"
              payload: { decision: "APPROVE", rationale: "Attempt exactly 24h ago" }
              as: AttendingProvider
              as_user_id: "prov-2"
            - call: "POST /observation/_clock/set_current_utc"
              payload: { current_utc: "2026-08-02T00:00:01Z" }
              as: SystemAdmin
            - call: "POST /observation/orders/${o14}/discontinuation-decision"
              payload: { decision: "APPROVE", rationale: "Window now clear by one second" }
              as: AttendingProvider
              as_user_id: "prov-2"
          assert:
            - "BLOCKED SIDE: at clock 2026-08-02T00:00:00Z the first decision returns HTTP 409 with error.code == ERR_RECENT_SAFETY_EVENT_BLOCKS_DISCONTINUATION (occurred_at 2026-08-01T00:00:00Z is exactly on the >= boundary)"
            - "After the blocked call ObservationOrder.${o14}.status is still DISCONTINUATION_REVIEW, discontinued_at == null, discontinuation_recommendation == DISCONTINUE"
            - "SWEEP IMMUNITY: the 2026-08-02T00:00:00Z clock call reported orders_marked_reassessment_due == 0 and orders_lapsed == 0 even though next_reassessment_due_at == 2026-08-02T00:00:00Z"
            - "ALLOWED SIDE: at clock 2026-08-02T00:00:01Z the identical request returns HTTP 200 and ObservationOrder.${o14}.status == DISCONTINUED with discontinued_at == 2026-08-02T00:00:01Z"
            - "The 2026-08-02T00:00:01Z clock call also reported orders_marked_reassessment_due == 0 and orders_lapsed == 0"
            - "SafetyEvent.${ev14} is untouched by either decision: status CLOSED, occurred_at 2026-08-01T00:00:00Z"
            - "ObservationOrder.${o14}.reassessment_count == 1 and elopement_risk_score == 2.5"

  - rule_id: cross_entity_state_dependency
    instances:
      - name: start_watch_depends_on_staff_duty_posture_set_by_a_console_feed
        entity_pair: "SitterAssignment -> Staff"
        grounds:
          - validations.priority_9
          - state_machines.SitterAssignment.watch_status.SCHEDULED_to_ON_WATCH
          - state_machines.Staff.status.AVAILABLE_to_ON_ASSIGNMENT
          - state_machines.VideoFeed.status.ACTIVE_to_RELEASED
        distinguishing_aspect: |
          The SitterAssignment transition SCHEDULED -> ON_WATCH is legal only while the referenced
          Staff row sits in AVAILABLE, and that posture is set by a completely unrelated entity — an
          ACTIVE VideoFeed on the console the same staff member observes. Nothing about the assignment
          changes between the failing and the succeeding call: only the Staff state, mutated through
          POST /observation/video-feeds/{id}/release, differs.
        test_recipe:
          setup:
            - "Video-enabled unit UNIT-N budget 500000; two admitted patients age 60."
            - "One staff member S_N (ADVANCED, unexpired certification) is BOTH the sitter of a SCHEDULED watch on patient A's order and the observer of console CONSOLE-N1."
            - "Patient B's VIDEO_MONITORING order is admitted onto CONSOLE-N1, which drives S_N from AVAILABLE to ON_ASSIGNMENT."
            - "The clock is advanced to 2026-08-01T08:00:00Z, inside patient A's watch window, so the shift-window check at priority 20 is satisfied."
          setup_api_calls:
            - call: "POST /observation/units"
              payload: { unit_code: "UNIT-N", name: "Mixed Acuity Unit N", observation_cost_budget_cents: 500000, video_monitoring_enabled: true }
