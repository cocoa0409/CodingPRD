        distinguishing_aspect: "With 1 PRIMARY staff (ratio 1:10), placed_count==10 leaves compliance_status COMPLIANT while placed_count==11 flips it to OVER_RATIO (required_staff=ceil(11/10)=2 > 1) — exact ceil boundary on the ratio metric, reached via accept-offer."
