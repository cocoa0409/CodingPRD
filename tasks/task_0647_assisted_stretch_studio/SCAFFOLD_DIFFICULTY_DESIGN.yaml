            - call: "POST /bookings/${bk}/reschedule"
              payload: { session_start_utc: "2026-04-21T14:00:00Z", flexologist_id: "${flexB}", table_id: "${tbl2}" }
              as: FrontDesk
              captures: { newbk: $.data.id, newbk_from: $.data.rescheduled_from_booking_id }
          assert:
            - "Booking.${bk}.schedule_status == CANCELLED"
            - "Booking.${bk}.credit_status == RELEASED"
            - "Booking.${newbk}.rescheduled_from_booking_id == ${bk}"
