            - { call: "POST /phases", payload: { contract_id: "${ct_id}", phase_type: REFLOAT, planned_duration_hours: 336 }, as: SalvageMaster, as_user_id: "sm-01", captures: { ph_id: $.data.id } }
            - { call: "POST /phases/${ph_id}/activate", payload: { weather_window_id: "${ww_id}", charter_ids: ["${ch_id}"] }, as: SalvageMaster, as_user_id: "sm-01" }
            - { call: "POST /pollution-events", payload: { casualty_id: "${cas_id}", pollutant_class: OIL_NON_PERSISTENT, tier: TIER_1, est_volume_m3: 8 }, as: EnvironmentalOfficer, as_user_id: "env-01", captures: { ev_id: $.data.id } }
          trigger:
            - { call: "POST /pollution-events/${ev_id}/escalate", payload: { new_tier: TIER_2 }, as: EnvironmentalOfficer, as_user_id: "env-01" }
          assert:
            - "PollutionEvent.${ev_id}.status == ESCALATED and tier == TIER_2 (trigger mutation)"
            - "Casualty.${cas_id}.env_posture == ENV_HOLD (link 1: caused by the event escalation)"
            - "OperationPhase.${ph_id}.status == ENV_SUSPENDED (link 2: caused by posture entering ENV_HOLD)"
            - "EquipmentCharter.${ch_id}.status == STANDBY_ENV (link 3: caused by the phase suspension)"
            - "SalvageContract.${ct_id}.status == ACTIVE (cascade does not touch contract state)"

      - name: final_phase_completion_contract_casualty_bubble
        grounds:
          - state_machines.OperationPhase.ACTIVE_to_COMPLETE
          - state_machines.SalvageContract.ACTIVE_to_PERFORMANCE_COMPLETE
          - state_machines.Casualty.IN_OPERATION_to_OPERATIONS_COMPLETE
        distinguishing_aspect: |
          Depth-2 bubble-up from POST /phases/{id}/complete: the final phase
          completion causes contract -> PERFORMANCE_COMPLETE (link 1), which
          causes casualty lifecycle -> OPERATIONS_COMPLETE (link 2). The
          intermediate assertion (first of two phases completes, contract stays
          ACTIVE) proves the aggregation semantics. Distinct trigger from the
          pollution escalation cascade.
        test_recipe:
          setup:
            - "NCNP contract ACTIVE; two phases ACTIVE: REFLOAT ph1 (96h, COAST_GUARD permit) and DEMOBILIZATION ph2 (24h, PORT_AUTHORITY permit); one ON_HIRE TUG charter"
          setup_api_calls:
            - { call: "POST /casualties", payload: { vessel_name: "MV Pax", casualty_type: GROUNDING, declared_salved_value_cents: 200000000, position: "10S 140W" }, as: SalvageMaster, as_user_id: "sm-01", captures: { cas_id: $.data.id, cas_v: $.data.version } }
            - { call: "POST /assessments", payload: { casualty_id: "${cas_id}", expected_casualty_version: "${cas_v}", pollution_risk_tier: TIER_1, wreck_removal_required: false, estimated_cost_cents: 1000000 }, as: MarineSurveyor, as_user_id: "surveyor-01", captures: { asmt_id: $.data.id } }
            - { call: "POST /assessments/${asmt_id}/approve", payload: {}, as: OperationsDirector, as_user_id: "opsdir-01" }
            - { call: "POST /plans", payload: { casualty_id: "${cas_id}", method: REFLOAT, required_equipment_classes: [TUG] }, as: SalvageMaster, as_user_id: "sm-01", captures: { plan_id: $.data.id } }
            - { call: "POST /plans/${plan_id}/submit", payload: {}, as: SalvageMaster, as_user_id: "sm-01" }
            - { call: "POST /plans/${plan_id}/approve", payload: {}, as: OperationsDirector, as_user_id: "opsdir-01" }
            - { call: "POST /contracts", payload: { casualty_id: "${cas_id}", plan_id: "${plan_id}", form: NO_CURE_NO_PAY, scopic_clause_included: false }, as: ContractsOfficer, as_user_id: "co-01", captures: { ct_id: $.data.id } }
            - { call: "POST /contracts/${ct_id}/offer", payload: {}, as: ContractsOfficer, as_user_id: "co-01" }
            - { call: "POST /contracts/${ct_id}/sign", payload: {}, as: ContractsOfficer, as_user_id: "co-01" }
            - { call: "POST /securities", payload: { contract_id: "${ct_id}", lodged_amount_cents: 30000000 }, as: ContractsOfficer, as_user_id: "co-01" }
            - { call: "POST /contracts/${ct_id}/activate", payload: {}, as: ContractsOfficer, as_user_id: "co-01" }
            - { call: "POST /equipment-assets", payload: { asset_class: TUG, day_rate_cents: 2000000, max_hs_meters: 2.50 }, as: OperationsDirector, as_user_id: "opsdir-01", captures: { eq_id: $.data.id } }
            - { call: "POST /_clock/set_current_utc", payload: { to_iso8601: "2026-05-10T00:00:00Z" }, as: OperationsDirector, as_user_id: "opsdir-01" }
            - { call: "POST /charters", payload: { casualty_id: "${cas_id}", equipment_asset_id: "${eq_id}", window_start: "2026-05-10T00:00:00Z", window_end: "2026-05-24T00:00:00Z", purpose: SALVAGE }, as: SalvageMaster, as_user_id: "sm-01", captures: { ch_id: $.data.id } }
            - { call: "POST /charters/${ch_id}/on-hire", payload: {}, as: SalvageMaster, as_user_id: "sm-01" }
            - { call: "POST /weather-windows", payload: { casualty_id: "${cas_id}", window_start: "2026-05-08T00:00:00Z", window_end: "2026-05-26T00:00:00Z", forecast_hs_meters: 2.00 }, as: SalvageMaster, as_user_id: "sm-01", captures: { ww_id: $.data.id } }
            - { call: "POST /permits", payload: { casualty_id: "${cas_id}", agency_type: COAST_GUARD, valid_from: "2026-05-01T00:00:00Z", valid_to: "2026-06-30T00:00:00Z" }, as: EnvironmentalOfficer, as_user_id: "env-01", captures: { pm_cg: $.data.id } }
            - { call: "POST /permits/${pm_cg}/grant", payload: {}, as: EnvironmentalOfficer, as_user_id: "env-01" }
            - { call: "POST /permits", payload: { casualty_id: "${cas_id}", agency_type: PORT_AUTHORITY, valid_from: "2026-05-01T00:00:00Z", valid_to: "2026-06-30T00:00:00Z" }, as: EnvironmentalOfficer, as_user_id: "env-01", captures: { pm_pa: $.data.id } }
            - { call: "POST /permits/${pm_pa}/grant", payload: {}, as: EnvironmentalOfficer, as_user_id: "env-01" }
            - { call: "POST /phases", payload: { contract_id: "${ct_id}", phase_type: REFLOAT, planned_duration_hours: 96 }, as: SalvageMaster, as_user_id: "sm-01", captures: { ph1: $.data.id } }
            - { call: "POST /phases/${ph1}/activate", payload: { weather_window_id: "${ww_id}", charter_ids: ["${ch_id}"] }, as: SalvageMaster, as_user_id: "sm-01" }
            - { call: "POST /phases", payload: { contract_id: "${ct_id}", phase_type: DEMOBILIZATION, planned_duration_hours: 24 }, as: SalvageMaster, as_user_id: "sm-01", captures: { ph2: $.data.id } }
            - { call: "POST /phases/${ph2}/activate", payload: { weather_window_id: "${ww_id}", charter_ids: ["${ch_id}"] }, as: SalvageMaster, as_user_id: "sm-01" }
          trigger:
            - { call: "POST /phases/${ph1}/complete", payload: {}, as: SalvageMaster, as_user_id: "sm-01", captures: { ct_mid: $.data.status } }
            - { call: "POST /phases/${ph2}/complete", payload: {}, as: SalvageMaster, as_user_id: "sm-01" }
          assert:
            - "After completing ph1 only: SalvageContract.${ct_id}.status == ACTIVE (aggregate gate not yet satisfied) — read via GET /contracts/${ct_id}"
            - "After completing ph2: OperationPhase.${ph2}.status == COMPLETE"
            - "SalvageContract.${ct_id}.status == PERFORMANCE_COMPLETE (link 1: caused by the final phase completion)"
            - "Casualty.${cas_id}.lifecycle_status == OPERATIONS_COMPLETE (link 2: caused by the contract transition)"

  - rule_id: priority_pair_validation_conflict
    instances:
      - name: phase_activate_state_error_beats_env_hold
        grounds:
          - "validations[priority=5]"
          - "validations[priority=6]"
          - "errors[ERR_INVALID_STATE_TRANSITION]"
          - "errors[ERR_ENV_HOLD_ACTIVE]"
        distinguishing_aspect: |
          Category pair state vs business_safety: a phase in WEATHER_HOLD
          activated while the casualty is in ENV_HOLD violates both p5 (wrong
          from-state) and p6 (env gate); the p5 error
          ERR_INVALID_STATE_TRANSITION must be returned. Distinct pair from the
          safety-vs-fiscal instance.
        test_recipe:
          setup:
            - "NCNP contract ACTIVE; REFLOAT phase ACTIVE then WEATHER_HOLD; TIER_2 pollution event puts casualty in ENV_HOLD (phase stays WEATHER_HOLD — env cascade only touches ACTIVE phases)"
          setup_api_calls:
            - { call: "POST /casualties", payload: { vessel_name: "MV Kara", casualty_type: SUNK, declared_salved_value_cents: 800000000, position: "32N 64W" }, as: SalvageMaster, as_user_id: "sm-01", captures: { cas_id: $.data.id, cas_v: $.data.version } }
            - { call: "POST /assessments", payload: { casualty_id: "${cas_id}", expected_casualty_version: "${cas_v}", pollution_risk_tier: TIER_1, wreck_removal_required: false, estimated_cost_cents: 5000000 }, as: MarineSurveyor, as_user_id: "surveyor-01", captures: { asmt_id: $.data.id } }
            - { call: "POST /assessments/${asmt_id}/approve", payload: {}, as: OperationsDirector, as_user_id: "opsdir-01" }
            - { call: "POST /plans", payload: { casualty_id: "${cas_id}", method: REFLOAT, required_equipment_classes: [TUG] }, as: SalvageMaster, as_user_id: "sm-01", captures: { plan_id: $.data.id } }
            - { call: "POST /plans/${plan_id}/submit", payload: {}, as: SalvageMaster, as_user_id: "sm-01" }
            - { call: "POST /plans/${plan_id}/approve", payload: {}, as: OperationsDirector, as_user_id: "opsdir-01" }
            - { call: "POST /contracts", payload: { casualty_id: "${cas_id}", plan_id: "${plan_id}", form: NO_CURE_NO_PAY, scopic_clause_included: false }, as: ContractsOfficer, as_user_id: "co-01", captures: { ct_id: $.data.id } }
            - { call: "POST /contracts/${ct_id}/offer", payload: {}, as: ContractsOfficer, as_user_id: "co-01" }
            - { call: "POST /contracts/${ct_id}/sign", payload: {}, as: ContractsOfficer, as_user_id: "co-01" }
            - { call: "POST /securities", payload: { contract_id: "${ct_id}", lodged_amount_cents: 120000000 }, as: ContractsOfficer, as_user_id: "co-01" }
            - { call: "POST /contracts/${ct_id}/activate", payload: {}, as: ContractsOfficer, as_user_id: "co-01" }
            - { call: "POST /equipment-assets", payload: { asset_class: TUG, day_rate_cents: 2000000, max_hs_meters: 2.50 }, as: OperationsDirector, as_user_id: "opsdir-01", captures: { eq_id: $.data.id } }
            - { call: "POST /_clock/set_current_utc", payload: { to_iso8601: "2026-05-10T00:00:00Z" }, as: OperationsDirector, as_user_id: "opsdir-01" }
            - { call: "POST /charters", payload: { casualty_id: "${cas_id}", equipment_asset_id: "${eq_id}", window_start: "2026-05-10T00:00:00Z", window_end: "2026-05-24T00:00:00Z", purpose: SALVAGE }, as: SalvageMaster, as_user_id: "sm-01", captures: { ch_id: $.data.id } }
            - { call: "POST /charters/${ch_id}/on-hire", payload: {}, as: SalvageMaster, as_user_id: "sm-01" }
            - { call: "POST /weather-windows", payload: { casualty_id: "${cas_id}", window_start: "2026-05-08T00:00:00Z", window_end: "2026-05-26T00:00:00Z", forecast_hs_meters: 2.00 }, as: SalvageMaster, as_user_id: "sm-01", captures: { ww_id: $.data.id } }
            - { call: "POST /permits", payload: { casualty_id: "${cas_id}", agency_type: COAST_GUARD, valid_from: "2026-05-01T00:00:00Z", valid_to: "2026-06-30T00:00:00Z" }, as: EnvironmentalOfficer, as_user_id: "env-01", captures: { pm_id: $.data.id } }
            - { call: "POST /permits/${pm_id}/grant", payload: {}, as: EnvironmentalOfficer, as_user_id: "env-01" }
            - { call: "POST /phases", payload: { contract_id: "${ct_id}", phase_type: REFLOAT, planned_duration_hours: 336 }, as: SalvageMaster, as_user_id: "sm-01", captures: { ph_id: $.data.id } }
            - { call: "POST /phases/${ph_id}/activate", payload: { weather_window_id: "${ww_id}", charter_ids: ["${ch_id}"] }, as: SalvageMaster, as_user_id: "sm-01" }
            - { call: "POST /phases/${ph_id}/hold-weather", payload: {}, as: SalvageMaster, as_user_id: "sm-01" }
            - { call: "POST /pollution-events", payload: { casualty_id: "${cas_id}", pollutant_class: OIL_PERSISTENT, tier: TIER_2, est_volume_m3: 25 }, as: EnvironmentalOfficer, as_user_id: "env-01" }
          trigger:
