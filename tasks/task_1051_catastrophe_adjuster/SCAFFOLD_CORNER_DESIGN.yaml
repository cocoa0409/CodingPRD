        claim_type: Violation → Error
        grounds:
          - validations[priority=5]
          - errors[ERR_NOT_ASSIGNMENT_OWNER]
        distinguishing_aspect: "A FieldAdjuster whose X-User-ID != assignment.adjuster_id accepting the assignment returns ERR_NOT_ASSIGNMENT_OWNER (403)."
        test_recipe:
          setup: ["Adjuster A (assignee, licensed) and adjuster B (other); assignment OFFERED to A"]
          setup_api_calls:
            - { call: "POST /adjusters", payload: { full_name: "OwnA", email: "owna@x.com", adjuster_type: "INDEPENDENT", home_state: "FL" }, as: LicensingAdmin, captures: { adj_a: $.data.id } }
