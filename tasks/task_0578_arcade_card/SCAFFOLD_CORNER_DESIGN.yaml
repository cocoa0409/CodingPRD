            - call: "POST /game-cards/${c_id}/reload"
              payload: { amount_cents: 1000 }
              as: Cashier
              captures: { err: $.data.error_id }
          assert:
            - "trigger response error_id == ERR_CARD_NOT_ACTIVE (409)"

      - name: redeem_discontinued_prize_unavailable
        claim_type: Cross-entity validation
        grounds: ["validations[priority=7]", "errors[ERR_PRIZE_UNAVAILABLE]"]
        distinguishing_aspect: "Reserving against a DISCONTINUED prize returns ERR_PRIZE_UNAVAILABLE (409)."
        test_recipe:
