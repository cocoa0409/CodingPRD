  # ===========================================================================
  # Rule 6 — Boundary-precision checks on different metrics/endpoints
  # ===========================================================================
  - rule_id: boundary_precision_check
    instances:
      - name: refill_boundary_at_exact_earliest_refill_date
        grounds:
          - calculations.refill_cadence_rule
          - errors[ERR_REFILL_TOO_EARLY]
        distinguishing_aspect: |
          Metric = refill cadence day; endpoint = POST /sensor-orders.
          At logical_date == earliest_refill_date - 1 the refill MUST be
          rejected; at logical_date == earliest_refill_date the refill MUST
          be permitted (>= inclusive). Distinct metric and endpoint from the
          warranty failure-day boundary.
        test_recipe:
          setup:
            - "First fill on 2026-09-01 with quantity=2, wear_days=14, tolerance=0.25 → supply=28d, ceil(28*0.75)=21 → earliest_refill_date = 2026-09-22"
          setup_api_calls:
            - call: "POST /cgm/_clock/set_current_utc"
              payload: { to_iso8601: "2026-09-01T00:00:00Z" }
              as: PlatformAdmin
