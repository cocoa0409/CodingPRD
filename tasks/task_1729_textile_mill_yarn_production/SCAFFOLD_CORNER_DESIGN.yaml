scaffold_corner_design:

  # =========================================================================
  # Section: entities — creation, retrieval, listing, required fields,
  # defaults, computed fields, system fields, type constraints
  # =========================================================================
  - section: entities
    instances:
      - name: fiber_lot_create_returns_201_with_defaults
        claim_type: creation_success
        grounds: ["entities.FiberLot"]
        distinguishing_aspect: "POST /mill/fiber-lots with all required fields returns 201 with status=RECEIVED default and server-minted id."
        test_recipe:
          setup: ["Empty DB"]
          setup_api_calls: []
          trigger:
            - call: "POST /mill/fiber-lots"
              payload: { fiber_type: "COTTON", received_weight_lbs: 500.0, unit_cost_per_lb: 1.5 }
              as: MillPlanner
              captures: { fl_id: $.data.id }
          assert:
            - "HTTP status == 201"
            - "FiberLot.${fl_id}.status == RECEIVED"
            - "FiberLot.${fl_id}.available_weight_lbs == 500.0 (initialized from received)"
            - "FiberLot.${fl_id}.id matches UUID format"
            - "FiberLot.${fl_id}.version == 1"

      - name: fiber_lot_missing_required_field_returns_invalid_request
        claim_type: required_field_missing
        grounds: ["entities.FiberLot", "errors[ERR_INVALID_REQUEST]"]
        distinguishing_aspect: "POST /mill/fiber-lots without fiber_type is rejected with 400 ERR_INVALID_REQUEST."
        test_recipe:
          setup: ["Empty DB"]
          setup_api_calls: []
          trigger:
            - call: "POST /mill/fiber-lots"
              payload: { received_weight_lbs: 500.0, unit_cost_per_lb: 1.5 }
              as: MillPlanner
              captures: { err: $.data.error_id }
          assert:
            - "HTTP status == 400"
            - "error_id == ERR_INVALID_REQUEST"

      - name: fiber_lot_invalid_enum_rejected
        claim_type: type_constraint
        grounds: ["entities.FiberLot.fields.fiber_type"]
        distinguishing_aspect: "fiber_type outside the declared enum is rejected."
        test_recipe:
          setup: ["Empty DB"]
          setup_api_calls: []
          trigger:
            - call: "POST /mill/fiber-lots"
              payload: { fiber_type: "SILK", received_weight_lbs: 100.0, unit_cost_per_lb: 5.0 }
              as: MillPlanner
              captures: { err: $.data.error_id }
          assert:
            - "HTTP status == 400"
            - "error_id == ERR_INVALID_REQUEST"

      - name: fiber_lot_get_by_id_returns_stored_data
        claim_type: retrieval
        grounds: ["entities.FiberLot"]
        distinguishing_aspect: "GET /mill/fiber-lots/{id} returns the same field values submitted at POST."
        test_recipe:
          setup: ["One FiberLot created"]
          setup_api_calls:
            - call: "POST /mill/fiber-lots"
              payload: { fiber_type: "POLYESTER", received_weight_lbs: 250.5, unit_cost_per_lb: 2.25 }
              as: MillPlanner
              captures: { fl_id: $.data.id }
          trigger:
            - call: "GET /mill/fiber-lots/${fl_id}"
              as: MillPlanner
          assert:
            - "HTTP status == 200"
            - "response.fiber_type == POLYESTER"
            - "response.received_weight_lbs == 250.5"
            - "response.unit_cost_per_lb == 2.25"

      - name: fiber_lot_get_nonexistent_returns_404
        claim_type: not_found
        grounds: ["entities.FiberLot", "errors[ERR_NOT_FOUND]"]
        distinguishing_aspect: "GET with a non-existent UUID returns 404 ERR_NOT_FOUND."
        test_recipe:
          setup: ["Empty DB"]
          setup_api_calls: []
          trigger:
            - call: "GET /mill/fiber-lots/8a3e1c0b-2f4d-4a91-9c8b-12e7b6a0f1d2"
              as: MillPlanner
              captures: { err: $.data.error_id }
          assert:
            - "HTTP status == 404"
            - "error_id == ERR_NOT_FOUND"

      - name: fiber_lot_list_pagination
        claim_type: listing
        grounds: ["entities.FiberLot", "response_envelope"]
        distinguishing_aspect: "List endpoint returns paginated envelope with limit/offset/total_count/has_more."
        test_recipe:
          setup: ["Three FiberLots exist"]
          setup_api_calls:
            - call: "POST /mill/fiber-lots"
              payload: { fiber_type: "COTTON", received_weight_lbs: 100.0, unit_cost_per_lb: 1.0 }
              as: MillPlanner
            - call: "POST /mill/fiber-lots"
              payload: { fiber_type: "COTTON", received_weight_lbs: 200.0, unit_cost_per_lb: 1.1 }
              as: MillPlanner
            - call: "POST /mill/fiber-lots"
              payload: { fiber_type: "POLYESTER", received_weight_lbs: 300.0, unit_cost_per_lb: 1.2 }
              as: MillPlanner
          trigger:
            - call: "GET /mill/fiber-lots?limit=2&offset=0"
              as: MillPlanner
          assert:
            - "response.data length == 2"
            - "response.meta.pagination.total_count == 3"
            - "response.meta.pagination.has_more == true"

      - name: blend_recipe_total_component_weight_computed
        claim_type: computed_field
        grounds: ["entities.BlendRecipe.fields.total_component_weight_lbs"]
        distinguishing_aspect: "total_component_weight_lbs is recomputed as components are added."
        test_recipe:
          setup: ["FiberLot exists, DRAFT recipe exists"]
          setup_api_calls:
            - call: "POST /mill/fiber-lots"
              payload: { fiber_type: "COTTON", received_weight_lbs: 500.0, unit_cost_per_lb: 1.5 }
              as: MillPlanner
              captures: { fl_id: $.data.id }
            - call: "POST /mill/blend-recipes"
              payload: { recipe_code: "COMP-CALC", target_yarn_count_ne: 20.0 }
              as: MillPlanner
              captures: { rec_id: $.data.id }
          trigger:
            - call: "POST /mill/blend-recipes/${rec_id}/components"
              payload: { fiber_lot_id: "${fl_id}", component_weight_lbs: 75.5 }
              as: MillPlanner
            - call: "POST /mill/blend-recipes/${rec_id}/components"
              payload: { fiber_lot_id: "${fl_id}", component_weight_lbs: 24.5 }
              as: MillPlanner
          assert:
            - "BlendRecipe.${rec_id}.total_component_weight_lbs == 100.0"

      - name: blend_component_proportion_pct_computed
        claim_type: computed_field
        grounds: ["entities.BlendComponent.fields.proportion_pct"]
        distinguishing_aspect: "proportion_pct is recomputed on every component addition."
        test_recipe:
          setup: ["Two FiberLots and DRAFT recipe exist"]
          setup_api_calls:
            - call: "POST /mill/fiber-lots"
              payload: { fiber_type: "COTTON", received_weight_lbs: 500.0, unit_cost_per_lb: 1.5 }
              as: MillPlanner
              captures: { fl_a: $.data.id }
            - call: "POST /mill/fiber-lots"
              payload: { fiber_type: "POLYESTER", received_weight_lbs: 500.0, unit_cost_per_lb: 2.0 }
              as: MillPlanner
              captures: { fl_b: $.data.id }
            - call: "POST /mill/blend-recipes"
              payload: { recipe_code: "COMP-PROP", target_yarn_count_ne: 20.0 }
              as: MillPlanner
              captures: { rec_id: $.data.id }
          trigger:
            - call: "POST /mill/blend-recipes/${rec_id}/components"
              payload: { fiber_lot_id: "${fl_a}", component_weight_lbs: 60.0 }
              as: MillPlanner
            - call: "POST /mill/blend-recipes/${rec_id}/components"
              payload: { fiber_lot_id: "${fl_b}", component_weight_lbs: 40.0 }
              as: MillPlanner
          assert:
            - "First component proportion_pct == 60.0"
            - "Second component proportion_pct == 40.0"

      - name: finished_roll_yardage_deviation_pct_computed
        claim_type: computed_field
        grounds: ["entities.FinishedRoll.fields.yardage_deviation_pct"]
        distinguishing_aspect: "yardage_deviation_pct = (actual - put_up)/put_up * 100 is computed at creation."
        test_recipe:
          setup: ["An APPROVED DyeLot exists"]
          setup_api_calls:
            - call: "POST /mill/fiber-lots"
              payload: { fiber_type: "COTTON", received_weight_lbs: 500.0, unit_cost_per_lb: 1.5 }
              as: MillPlanner
              captures: { fl_id: $.data.id }
            - call: "POST /mill/blend-recipes"
              payload: { recipe_code: "ROLL-DEV", target_yarn_count_ne: 20.0 }
              as: MillPlanner
              captures: { rec_id: $.data.id, rec_v: $.data.version }
            - call: "POST /mill/blend-recipes/${rec_id}/components"
              payload: { fiber_lot_id: "${fl_id}", component_weight_lbs: 200.0 }
              as: MillPlanner
            - call: "POST /mill/blend-recipes/${rec_id}/approve"
              payload: { expected_recipe_version: "${rec_v}" }
              as: MillPlanner
            - call: "POST /mill/yarn-lots"
              payload: { recipe_id: "${rec_id}", spun_weight_lbs: 180.0, actual_yarn_count_ne: 20.0 }
              as: SpinningSupervisor
              captures: { yl_id: $.data.id }
            - call: "POST /mill/shade-bands"
              payload: { customer_code: "ACME", color_code: "NAVY-2B", centroid_l: 30.0, centroid_a: 5.0, centroid_b: -20.0, delta_e_tolerance: 1.5 }
              as: CustomerServiceRep
              captures: { sb_id: $.data.id }
            - call: "POST /mill/dye-lots"
              payload: { yarn_lot_id: "${yl_id}", shade_band_id: "${sb_id}", vat_id: "VAT-01", scheduled_at: "2026-08-14T08:00:00Z", requested_yards: 5000.0 }
              as: DyeHouseOperator
              captures: { dl_id: $.data.id }
            - call: "POST /mill/dye-lots/${dl_id}/start"
              payload: {}
              as: DyeHouseOperator
            - call: "POST /mill/dye-lots/${dl_id}/quality-tests"
              payload: { shrinkage_pct_provisional: 3.0, hand_score: 5, shrinkage_pct_final: 3.0 }
              as: QualityInspector
            - call: "POST /mill/dye-lots/${dl_id}/submit-shade"
              payload: {}
              as: DyeHouseOperator
            - call: "POST /mill/dye-lots/${dl_id}/approve"
              payload: {}
              as: QualityInspector
          trigger:
            - call: "POST /mill/finished-rolls"
              payload: { dye_lot_id: "${dl_id}", put_up_yards: 1000.0, actual_yards: 1020.0 }
              as: DyeHouseOperator
              captures: { roll_id: $.data.id }
          assert:
            - "FinishedRoll.${roll_id}.yardage_deviation_pct == 2.0 ((1020-1000)/1000*100)"

      - name: customer_order_default_yardage_tolerance
        claim_type: defaults
        grounds: ["entities.CustomerOrder.fields.yardage_tolerance_pct"]
        distinguishing_aspect: "Omitting yardage_tolerance_pct applies default 2.0."
        test_recipe:
          setup: ["Empty DB"]
          setup_api_calls: []
          trigger:
            - call: "POST /mill/customer-orders"
              payload: { customer_code: "ACME", color_code: "NAVY-2B", requested_yards: 5000.0 }
              as: CustomerServiceRep
              captures: { ord_id: $.data.id }
          assert:
            - "CustomerOrder.${ord_id}.yardage_tolerance_pct == 2.0"
            - "CustomerOrder.${ord_id}.status == OPEN"

      - name: system_fields_input_ignored
        claim_type: system_fields
        grounds: ["entities.FiberLot"]
        distinguishing_aspect: "Client-supplied id, created_at, version in POST body are ignored by server."
        test_recipe:
          setup: ["Empty DB"]
          setup_api_calls: []
          trigger:
            - call: "POST /mill/fiber-lots"
              payload: { fiber_type: "COTTON", received_weight_lbs: 100.0, unit_cost_per_lb: 1.5, id: "aaaaaaaa-1111-1111-1111-111111111111", version: 99 }
              as: MillPlanner
              captures: { fl_id: $.data.id }
          assert:
            - "FiberLot.${fl_id}.id != aaaaaaaa-1111-1111-1111-111111111111"
            - "FiberLot.${fl_id}.version == 1"

  # =========================================================================
  # Section: state_machines — invalid transitions, terminal lockdown, initial state
  # =========================================================================
  - section: state_machines
    instances:
      - name: blend_recipe_invalid_transition_approve_from_approved
        claim_type: invalid_transition
        grounds: ["state_machines.BlendRecipe", "errors[ERR_INVALID_STATE]"]
        distinguishing_aspect: "Approve on an already-APPROVED recipe must fail with ERR_INVALID_STATE."
        test_recipe:
          setup: ["An APPROVED BlendRecipe exists"]
          setup_api_calls:
            - call: "POST /mill/fiber-lots"
              payload: { fiber_type: "COTTON", received_weight_lbs: 500.0, unit_cost_per_lb: 1.5 }
              as: MillPlanner
              captures: { fl_id: $.data.id }
            - call: "POST /mill/blend-recipes"
              payload: { recipe_code: "INV-TR", target_yarn_count_ne: 20.0 }
              as: MillPlanner
              captures: { rec_id: $.data.id, rec_v: $.data.version }
            - call: "POST /mill/blend-recipes/${rec_id}/components"
              payload: { fiber_lot_id: "${fl_id}", component_weight_lbs: 100.0 }
              as: MillPlanner
            - call: "POST /mill/blend-recipes/${rec_id}/approve"
              payload: { expected_recipe_version: "${rec_v}" }
              as: MillPlanner
              captures: { rec_v2: $.data.version }
          trigger:
            - call: "POST /mill/blend-recipes/${rec_id}/approve"
              payload: { expected_recipe_version: "${rec_v2}" }
              as: MillPlanner
              captures: { err: $.data.error_id }
          assert:
            - "HTTP status == 409"
            - "error_id == ERR_INVALID_STATE"

      - name: blend_recipe_terminal_lockdown_rejected
        claim_type: terminal_lockdown
        grounds: ["state_machines.BlendRecipe"]
        distinguishing_aspect: "REJECTED is terminal; no transitions out of it are possible."
        test_recipe:
          setup: ["A REJECTED BlendRecipe exists"]
          setup_api_calls:
            - call: "POST /mill/fiber-lots"
              payload: { fiber_type: "COTTON", received_weight_lbs: 500.0, unit_cost_per_lb: 1.5 }
              as: MillPlanner
              captures: { fl_id: $.data.id }
            - call: "POST /mill/blend-recipes"
              payload: { recipe_code: "TERM-L", target_yarn_count_ne: 20.0 }
              as: MillPlanner
              captures: { rec_id: $.data.id, rec_v: $.data.version }
            - call: "POST /mill/blend-recipes/${rec_id}/components"
              payload: { fiber_lot_id: "${fl_id}", component_weight_lbs: 100.0 }
              as: MillPlanner
            - call: "POST /mill/blend-recipes/${rec_id}/reject"
              payload: {}
              as: MillPlanner
              captures: { rec_v2: $.data.version }
          trigger:
            - call: "POST /mill/blend-recipes/${rec_id}/approve"
              payload: { expected_recipe_version: "${rec_v2}" }
              as: MillPlanner
              captures: { err: $.data.error_id }
          assert:
            - "HTTP status == 409"
            - "error_id == ERR_INVALID_STATE"

      - name: yarn_lot_initial_state_greige
        claim_type: initial_state
        grounds: ["state_machines.YarnLot"]
        distinguishing_aspect: "A newly created YarnLot starts in GREIGE."
        test_recipe:
          setup: ["An approved BlendRecipe exists"]
          setup_api_calls:
            - call: "POST /mill/fiber-lots"
              payload: { fiber_type: "COTTON", received_weight_lbs: 500.0, unit_cost_per_lb: 1.5 }
              as: MillPlanner
              captures: { fl_id: $.data.id }
            - call: "POST /mill/blend-recipes"
              payload: { recipe_code: "INIT-ST", target_yarn_count_ne: 20.0 }
              as: MillPlanner
              captures: { rec_id: $.data.id, rec_v: $.data.version }
            - call: "POST /mill/blend-recipes/${rec_id}/components"
              payload: { fiber_lot_id: "${fl_id}", component_weight_lbs: 100.0 }
              as: MillPlanner
            - call: "POST /mill/blend-recipes/${rec_id}/approve"
              payload: { expected_recipe_version: "${rec_v}" }
              as: MillPlanner
          trigger:
            - call: "POST /mill/yarn-lots"
              payload: { recipe_id: "${rec_id}", spun_weight_lbs: 100.0, actual_yarn_count_ne: 20.0 }
              as: SpinningSupervisor
              captures: { yl_id: $.data.id }
          assert:
            - "YarnLot.${yl_id}.status == GREIGE"

      - name: machine_assignment_cancel_from_completed_rejected
        claim_type: invalid_transition
        grounds: ["state_machines.MachineAssignment"]
        distinguishing_aspect: "Cancelling a COMPLETED assignment fails — COMPLETED is terminal."
        test_recipe:
          setup: ["A COMPLETED MachineAssignment exists"]
          setup_api_calls:
            - call: "POST /mill/fiber-lots"
              payload: { fiber_type: "COTTON", received_weight_lbs: 500.0, unit_cost_per_lb: 1.5 }
              as: MillPlanner
              captures: { fl_id: $.data.id }
            - call: "POST /mill/blend-recipes"
              payload: { recipe_code: "MA-INV", target_yarn_count_ne: 20.0 }
              as: MillPlanner
              captures: { rec_id: $.data.id, rec_v: $.data.version }
            - call: "POST /mill/blend-recipes/${rec_id}/components"
              payload: { fiber_lot_id: "${fl_id}", component_weight_lbs: 100.0 }
              as: MillPlanner
            - call: "POST /mill/blend-recipes/${rec_id}/approve"
              payload: { expected_recipe_version: "${rec_v}" }
              as: MillPlanner
            - call: "POST /mill/yarn-lots"
              payload: { recipe_id: "${rec_id}", spun_weight_lbs: 100.0, actual_yarn_count_ne: 20.0 }
              as: SpinningSupervisor
              captures: { yl_id: $.data.id }
            - call: "POST /mill/spinning-machines"
              payload: { machine_code: "SPIN-INV", supported_count_min_ne: 10.0, supported_count_max_ne: 30.0 }
              as: MillAdmin
              captures: { sm_id: $.data.id }
            - call: "POST /mill/machine-assignments"
              payload: { machine_id: "${sm_id}", yarn_lot_id: "${yl_id}", window_start: "2026-08-14T08:00:00Z", window_end: "2026-08-14T12:00:00Z" }
              as: SpinningSupervisor
              captures: { ma_id: $.data.id }
            - call: "POST /mill/machine-assignments/${ma_id}/start"
              payload: {}
              as: SpinningSupervisor
            - call: "POST /mill/machine-assignments/${ma_id}/complete"
              payload: {}
              as: SpinningSupervisor
          trigger:
            - call: "POST /mill/machine-assignments/${ma_id}/cancel"
              payload: {}
              as: SpinningSupervisor
              captures: { err: $.data.error_id }
          assert:
            - "HTTP status == 409"
            - "error_id == ERR_INVALID_STATE"

      - name: lab_dip_approve_idempotency_violation
        claim_type: idempotency
        grounds: ["state_machines.LabDip"]
        distinguishing_aspect: "Approving a LabDip twice — second call returns ERR_INVALID_STATE because PENDING → APPROVED is not self-looping."
        test_recipe:
          setup: ["A LabDip in PENDING status"]
          setup_api_calls:
            - call: "POST /mill/shade-bands"
              payload: { customer_code: "ACME", color_code: "NAVY-2B", centroid_l: 30.0, centroid_a: 5.0, centroid_b: -20.0, delta_e_tolerance: 1.5 }
              as: CustomerServiceRep
              captures: { sb_id: $.data.id }
            - call: "POST /mill/lab-dips"
              payload: { shade_band_id: "${sb_id}", measured_delta_e: 1.0 }
              as: DyeHouseOperator
              captures: { ld_id: $.data.id }
          trigger:
            - call: "POST /mill/lab-dips/${ld_id}/approve"
              payload: {}
              as: CustomerServiceRep
            - call: "POST /mill/lab-dips/${ld_id}/approve"
              payload: {}
              as: CustomerServiceRep
              captures: { err: $.data.error_id }
          assert:
            - "First approve: HTTP 200, LabDip.status == APPROVED"
            - "Second approve: HTTP 409 with ERR_INVALID_STATE"

  # =========================================================================
  # Section: calculations — input-set filtering, constants applied
  # =========================================================================
  - section: calculations
    instances:
      - name: quality_grading_hand_score_below_min_yields_second
        claim_type: correct_result
        grounds: ["calculations.quality_grading"]
        distinguishing_aspect: "hand_score < 3 forces SECOND_QUALITY even when shrinkage is low."
        test_recipe:
          setup: ["A DyeLot in DYEING status"]
          setup_api_calls:
            - call: "POST /mill/fiber-lots"
              payload: { fiber_type: "COTTON", received_weight_lbs: 500.0, unit_cost_per_lb: 1.5 }
              as: MillPlanner
              captures: { fl_id: $.data.id }
            - call: "POST /mill/blend-recipes"
              payload: { recipe_code: "CALC-HAND", target_yarn_count_ne: 20.0 }
              as: MillPlanner
              captures: { rec_id: $.data.id, rec_v: $.data.version }
            - call: "POST /mill/blend-recipes/${rec_id}/components"
              payload: { fiber_lot_id: "${fl_id}", component_weight_lbs: 200.0 }
              as: MillPlanner
            - call: "POST /mill/blend-recipes/${rec_id}/approve"
              payload: { expected_recipe_version: "${rec_v}" }
              as: MillPlanner
            - call: "POST /mill/yarn-lots"
              payload: { recipe_id: "${rec_id}", spun_weight_lbs: 180.0, actual_yarn_count_ne: 20.0 }
              as: SpinningSupervisor
              captures: { yl_id: $.data.id }
            - call: "POST /mill/shade-bands"
              payload: { customer_code: "ACME", color_code: "NAVY-2B", centroid_l: 30.0, centroid_a: 5.0, centroid_b: -20.0, delta_e_tolerance: 1.5 }
              as: CustomerServiceRep
              captures: { sb_id: $.data.id }
            - call: "POST /mill/dye-lots"
              payload: { yarn_lot_id: "${yl_id}", shade_band_id: "${sb_id}", vat_id: "VAT-01", scheduled_at: "2026-08-14T08:00:00Z", requested_yards: 1000.0 }
              as: DyeHouseOperator
              captures: { dl_id: $.data.id }
            - call: "POST /mill/dye-lots/${dl_id}/start"
              payload: {}
              as: DyeHouseOperator
          trigger:
            - call: "POST /mill/dye-lots/${dl_id}/quality-tests"
              payload: { shrinkage_pct_provisional: 3.0, hand_score: 2 }
              as: QualityInspector
              captures: { qt_id: $.data.id }
          assert:
            - "QualityTest.${qt_id}.grade == SECOND_QUALITY (hand_score 2 < 3 forces downgrade despite low shrinkage)"

      - name: quality_grading_reject_threshold
        claim_type: correct_result
        grounds: ["calculations.quality_grading"]
        distinguishing_aspect: "shrinkage >= 8.0 yields REJECTED grade."
        test_recipe:
          setup: ["A DyeLot in DYEING status"]
          setup_api_calls:
            - call: "POST /mill/fiber-lots"
              payload: { fiber_type: "COTTON", received_weight_lbs: 500.0, unit_cost_per_lb: 1.5 }
              as: MillPlanner
              captures: { fl_id: $.data.id }
            - call: "POST /mill/blend-recipes"
              payload: { recipe_code: "CALC-REJ", target_yarn_count_ne: 20.0 }
              as: MillPlanner
              captures: { rec_id: $.data.id, rec_v: $.data.version }
            - call: "POST /mill/blend-recipes/${rec_id}/components"
              payload: { fiber_lot_id: "${fl_id}", component_weight_lbs: 200.0 }
              as: MillPlanner
            - call: "POST /mill/blend-recipes/${rec_id}/approve"
              payload: { expected_recipe_version: "${rec_v}" }
              as: MillPlanner
            - call: "POST /mill/yarn-lots"
              payload: { recipe_id: "${rec_id}", spun_weight_lbs: 180.0, actual_yarn_count_ne: 20.0 }
              as: SpinningSupervisor
