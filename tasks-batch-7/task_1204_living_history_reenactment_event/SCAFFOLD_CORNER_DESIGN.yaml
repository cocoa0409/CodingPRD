scaffold_corner_design:
- section: entities
  instances:
  - name: event_created_with_defaults_and_planning_posture
    claim_type: defaults
    grounds:
    - entities.Event
    distinguishing_aspect: Omitting max_minor_per_adult applies the default 4; a new Event starts in PLANNING with restriction_level GREEN, approved_combatant_count 0, version 1, and server-minted id/created_at.
    test_recipe:
      setup:
      - Empty DB
      setup_api_calls:
      - call: POST /events
        payload:
          name: Cedar Creek 2026
          site_name: Cedar Creek Field
          event_starts_at: '2026-07-10T08:00:00Z'
          event_ends_at: '2026-07-12T18:00:00Z'
          adult_day_price_cents: 2599
          child_day_price_cents: 1200
          adult_weekend_price_cents: 6000
          child_weekend_price_cents: 2800
          early_bird_pct: 0.2
          early_bird_cutoff_at: '2026-06-15T00:00:00Z'
          service_fee_cents: 350
          refund_retain_pct: 0.15
          required_liability_cents: 1000000
          vendor_frontage_rate_cents: 900
          vendor_multi_day_discount_pct: 0.1
          vendor_min_fee_cents: 5000
          vendor_late_insurance_surcharge_cents: 2500
          vendor_insurance_deadline_at: '2026-07-01T00:00:00Z'
        as: EventOrganizer
        captures:
          ev_id: $.data.id
          ev_posture: $.data.event_posture
          ev_ratio: $.data.max_minor_per_adult
          ev_level: $.data.restriction_level
          ev_count: $.data.approved_combatant_count
          ev_v: $.data.version
      trigger: []
      assert:
      - response 201; Event.${ev_id}.event_posture == PLANNING (initial state)
      - Event.${ev_id}.max_minor_per_adult == 4 (default applied)
      - Event.${ev_id}.restriction_level == GREEN and approved_combatant_count == 0 and version == 1
  - name: get_missing_event_returns_event_not_found
    claim_type: not_found
    grounds:
    - entities.Event
    - errors[ERR_EVENT_NOT_FOUND]
    distinguishing_aspect: Reading a well-formed but non-existent event id yields 404 ERR_EVENT_NOT_FOUND.
    test_recipe:
      setup:
      - One event exists (non-empty DB)
      setup_api_calls:
      - call: POST /events
        payload:
          name: Cedar Creek 2026
          site_name: Cedar Creek Field
          event_starts_at: '2026-07-10T08:00:00Z'
          event_ends_at: '2026-07-12T18:00:00Z'
          adult_day_price_cents: 2599
          child_day_price_cents: 1200
          adult_weekend_price_cents: 6000
          child_weekend_price_cents: 2800
          early_bird_pct: 0.2
          early_bird_cutoff_at: '2026-06-15T00:00:00Z'
          service_fee_cents: 350
          refund_retain_pct: 0.15
          required_liability_cents: 1000000
          max_minor_per_adult: 4
          vendor_frontage_rate_cents: 900
          vendor_multi_day_discount_pct: 0.1
          vendor_min_fee_cents: 5000
          vendor_late_insurance_surcharge_cents: 2500
          vendor_insurance_deadline_at: '2026-07-01T00:00:00Z'
        as: EventOrganizer
      trigger:
      - call: GET /events/00000000-0000-0000-0000-000000000000
        as: EventOrganizer
        captures:
          err: $.data.error_id
      assert:
      - error_id == ERR_EVENT_NOT_FOUND with HTTP 404
  - name: participant_is_minor_computed_from_age
    claim_type: computed_fields
    grounds:
    - entities.Participant.fields.is_minor
    distinguishing_aspect: 'is_minor is computed as age_at_event < 18: age 15 -> true, age 18 -> false (boundary at 18).'
    test_recipe:
      setup:
      - Canonical event in REGISTRATION_OPEN; unit APPROVED
      setup_api_calls:
      - call: POST /events
        payload:
          name: Cedar Creek 2026
          site_name: Cedar Creek Field
          event_starts_at: '2026-07-10T08:00:00Z'
          event_ends_at: '2026-07-12T18:00:00Z'
          adult_day_price_cents: 2599
          child_day_price_cents: 1200
          adult_weekend_price_cents: 6000
          child_weekend_price_cents: 2800
          early_bird_pct: 0.2
          early_bird_cutoff_at: '2026-06-15T00:00:00Z'
          service_fee_cents: 350
          refund_retain_pct: 0.15
          required_liability_cents: 1000000
          max_minor_per_adult: 4
          vendor_frontage_rate_cents: 900
          vendor_multi_day_discount_pct: 0.1
          vendor_min_fee_cents: 5000
          vendor_late_insurance_surcharge_cents: 2500
          vendor_insurance_deadline_at: '2026-07-01T00:00:00Z'
        as: EventOrganizer
        captures:
          ev_id: $.data.id
      - call: POST /events/${ev_id}/open-registration
        as: EventOrganizer
      - call: POST /units
        payload:
          event_id: ${ev_id}
          name: Civilians of the Valley
          unit_type: CIVILIAN
          portrayal_name: Townsfolk
        as: UnitCommander
        captures:
          un_id: $.data.id
      - call: POST /units/${un_id}/vet
        payload:
          decision: APPROVE
        as: EventOrganizer
      trigger:
      - call: POST /participants
        payload:
          event_id: ${ev_id}
          unit_id: ${un_id}
          full_name: Kid Cole
          age_at_event: 15
          impression_class: CIVILIAN
        as: UnitCommander
        as_user_id: ${un_id}
        captures:
          p_young: $.data.id
          m_young: $.data.is_minor
      - call: POST /participants
        payload:
          event_id: ${ev_id}
          unit_id: ${un_id}
          full_name: Eli Elder
          age_at_event: 18
          impression_class: CIVILIAN
        as: UnitCommander
        as_user_id: ${un_id}
        captures:
          p_old: $.data.id
          m_old: $.data.is_minor
      assert:
      - Participant.${p_young}.is_minor == true (15 < 18)
      - Participant.${p_old}.is_minor == false (18 is not < 18)
  - name: participants_list_pagination_and_unit_filter
    claim_type: listing
    grounds:
    - entities.Participant
    - response_envelope
    distinguishing_aspect: GET /participants with unit_id filter and limit/offset returns paginated envelope fields total_count and has_more.
    test_recipe:
      setup:
      - Canonical event in REGISTRATION_OPEN; unit APPROVED with 3 participants
      setup_api_calls:
      - call: POST /events
        payload:
          name: Cedar Creek 2026
          site_name: Cedar Creek Field
          event_starts_at: '2026-07-10T08:00:00Z'
          event_ends_at: '2026-07-12T18:00:00Z'
          adult_day_price_cents: 2599
          child_day_price_cents: 1200
          adult_weekend_price_cents: 6000
          child_weekend_price_cents: 2800
          early_bird_pct: 0.2
          early_bird_cutoff_at: '2026-06-15T00:00:00Z'
          service_fee_cents: 350
          refund_retain_pct: 0.15
          required_liability_cents: 1000000
          max_minor_per_adult: 4
          vendor_frontage_rate_cents: 900
          vendor_multi_day_discount_pct: 0.1
          vendor_min_fee_cents: 5000
          vendor_late_insurance_surcharge_cents: 2500
          vendor_insurance_deadline_at: '2026-07-01T00:00:00Z'
        as: EventOrganizer
        captures:
          ev_id: $.data.id
      - call: POST /events/${ev_id}/open-registration
        as: EventOrganizer
      - call: POST /units
        payload:
          event_id: ${ev_id}
          name: 6th Ohio
          unit_type: MILITARY
          portrayal_name: 6th OVI
        as: UnitCommander
        captures:
          un_id: $.data.id
      - call: POST /units/${un_id}/vet
        payload:
          decision: APPROVE
        as: EventOrganizer
      - call: POST /participants
        payload:
          event_id: ${ev_id}
          unit_id: ${un_id}
          full_name: P One
          age_at_event: 30
          impression_class: COMBATANT
        as: UnitCommander
        as_user_id: ${un_id}
      - call: POST /participants
        payload:
          event_id: ${ev_id}
          unit_id: ${un_id}
          full_name: P Two
          age_at_event: 31
          impression_class: COMBATANT
        as: UnitCommander
        as_user_id: ${un_id}
      - call: POST /participants
        payload:
          event_id: ${ev_id}
          unit_id: ${un_id}
          full_name: P Three
          age_at_event: 32
          impression_class: CIVILIAN
        as: UnitCommander
        as_user_id: ${un_id}
      trigger:
      - call: GET /participants
        payload:
          unit_id: ${un_id}
          limit: 2
          offset: 0
        as: EventOrganizer
        captures:
          page1_len: $.data
      - call: GET /participants
        payload:
          unit_id: ${un_id}
          limit: 2
          offset: 2
        as: EventOrganizer
      trigger_note: list responses carry pagination fields per response_envelope
      assert:
      - 'first page: 2 items, total_count == 3, has_more == true'
      - 'second page (offset 2): 1 item, total_count == 3, has_more == false'
  - name: allocation_with_two_parties_rejected
    claim_type: type_constraints
    grounds:
    - entities.AreaAllocation.fields.unit_id
    - entities.AreaAllocation.fields.vendor_id
    - errors[ERR_ALLOCATION_PARTY_REQUIRED]
    distinguishing_aspect: An allocation naming both unit_id and vendor_id violates the exactly-one-party constraint.
    test_recipe:
      setup:
      - Canonical event in REGISTRATION_OPEN; CAMP area ACTIVE; unit APPROVED; vendor CONTRACTED
      setup_api_calls:
      - call: POST /events
        payload:
          name: Cedar Creek 2026
          site_name: Cedar Creek Field
          event_starts_at: '2026-07-10T08:00:00Z'
          event_ends_at: '2026-07-12T18:00:00Z'
          adult_day_price_cents: 2599
          child_day_price_cents: 1200
          adult_weekend_price_cents: 6000
          child_weekend_price_cents: 2800
          early_bird_pct: 0.2
          early_bird_cutoff_at: '2026-06-15T00:00:00Z'
          service_fee_cents: 350
          refund_retain_pct: 0.15
          required_liability_cents: 1000000
          max_minor_per_adult: 4
          vendor_frontage_rate_cents: 900
          vendor_multi_day_discount_pct: 0.1
          vendor_min_fee_cents: 5000
          vendor_late_insurance_surcharge_cents: 2500
          vendor_insurance_deadline_at: '2026-07-01T00:00:00Z'
        as: EventOrganizer
        captures:
          ev_id: $.data.id
      - call: POST /events/${ev_id}/site-areas
        payload:
          area_name: Camp North
          area_kind: CAMP
          capacity_units: 10
        as: EventOrganizer
        captures:
          ar_id: $.data.id
      - call: POST /events/${ev_id}/open-registration
        as: EventOrganizer
      - call: POST /units
        payload:
          event_id: ${ev_id}
          name: 6th Ohio
          unit_type: MILITARY
          portrayal_name: 6th OVI
        as: UnitCommander
        captures:
          un_id: $.data.id
      - call: POST /units/${un_id}/vet
        payload:
          decision: APPROVE
        as: EventOrganizer
      - call: POST /events/${ev_id}/vendors
        payload:
          business_name: Sutler Sam
          wares_description: Dry goods
          frontage_feet: 10
          requested_days: 2
        as: Vendor
        captures:
          ve_id: $.data.id
      - call: POST /vendors/${ve_id}/approve
        as: EventOrganizer
      - call: POST /vendors/${ve_id}/contract
        payload:
          insurance_cert_ref: CERT-1
          fee_payment_cents: 18000
        as: Vendor
        as_user_id: ${ve_id}
      trigger:
      - call: POST /site-areas/${ar_id}/allocations
        payload:
          starts_at: '2026-07-09T12:00:00Z'
          ends_at: '2026-07-12T12:00:00Z'
          units: 2
          unit_id: ${un_id}
          vendor_id: ${ve_id}
        as: EventOrganizer
        captures:
          err: $.data.error_id
      assert:
      - error_id == ERR_ALLOCATION_PARTY_REQUIRED (both parties named; XOR required)
  - name: child_resource_not_found_variants
    claim_type: not_found
    grounds:
    - errors[ERR_EQUIPMENT_NOT_FOUND]
    - errors[ERR_INSPECTION_NOT_FOUND]
    - errors[ERR_AREA_NOT_FOUND]
    - errors[ERR_SLOT_NOT_FOUND]
    - errors[ERR_ORDER_NOT_FOUND]
    - errors[ERR_PASS_NOT_FOUND]
    - errors[ERR_VENDOR_NOT_FOUND]
    - errors[ERR_AGREEMENT_NOT_FOUND]
    - errors[ERR_ALERT_NOT_FOUND]
    - errors[ERR_ALLOCATION_NOT_FOUND]
    distinguishing_aspect: Each non-event resource class returns its own domain-specific 404 error id when the path id does not resolve.
    test_recipe:
      setup:
      - One event exists (non-empty DB)
      setup_api_calls:
      - call: POST /events
        payload:
          name: Cedar Creek 2026
          site_name: Cedar Creek Field
          event_starts_at: '2026-07-10T08:00:00Z'
          event_ends_at: '2026-07-12T18:00:00Z'
          adult_day_price_cents: 2599
          child_day_price_cents: 1200
          adult_weekend_price_cents: 6000
          child_weekend_price_cents: 2800
          early_bird_pct: 0.2
          early_bird_cutoff_at: '2026-06-15T00:00:00Z'
          service_fee_cents: 350
          refund_retain_pct: 0.15
          required_liability_cents: 1000000
          max_minor_per_adult: 4
          vendor_frontage_rate_cents: 900
          vendor_multi_day_discount_pct: 0.1
          vendor_min_fee_cents: 5000
          vendor_late_insurance_surcharge_cents: 2500
          vendor_insurance_deadline_at: '2026-07-01T00:00:00Z'
        as: EventOrganizer
      trigger:
      - call: GET /equipment-items/00000000-0000-0000-0000-000000000000
        as: EventOrganizer
        captures:
          e1: $.data.error_id
      - call: POST /inspections/00000000-0000-0000-0000-000000000000/record
        payload:
          outcome: PASS
        as: SafetyOfficer
        as_user_id: so-1
        captures:
          e2: $.data.error_id
      - call: GET /site-areas/00000000-0000-0000-0000-000000000000
        as: EventOrganizer
        captures:
          e3: $.data.error_id
      - call: POST /program-slots/00000000-0000-0000-0000-000000000000/confirm
        as: EventOrganizer
        captures:
          e4: $.data.error_id
      - call: GET /ticket-orders/00000000-0000-0000-0000-000000000000
        as: EventOrganizer
        captures:
          e5: $.data.error_id
      - call: POST /parking-passes/00000000-0000-0000-0000-000000000000/void
        as: EventOrganizer
        captures:
          e6: $.data.error_id
      - call: GET /vendors/00000000-0000-0000-0000-000000000000
        as: EventOrganizer
        captures:
          e7: $.data.error_id
      - call: POST /agreements/00000000-0000-0000-0000-000000000000/sign
        payload:
          signer_name: Nobody
        as: EventOrganizer
        captures:
          e8: $.data.error_id
      - call: POST /contingency-alerts/00000000-0000-0000-0000-000000000000/resolve
        as: SafetyOfficer
        as_user_id: so-1
        captures:
          e9: $.data.error_id
      - call: GET /allocations/00000000-0000-0000-0000-000000000000
        as: EventOrganizer
        captures:
          e10: $.data.error_id
      assert:
      - ERR_EQUIPMENT_NOT_FOUND, ERR_INSPECTION_NOT_FOUND, ERR_AREA_NOT_FOUND, ERR_SLOT_NOT_FOUND, ERR_ORDER_NOT_FOUND, ERR_PASS_NOT_FOUND, ERR_VENDOR_NOT_FOUND, ERR_AGREEMENT_NOT_FOUND, ERR_ALERT_NOT_FOUND,
        ERR_ALLOCATION_NOT_FOUND respectively, all HTTP 404
- section: state_machines
  instances:
  - name: vet_participant_from_draft_rejected
    claim_type: invalid_transition
    grounds:
    - state_machines.Participant
    - errors[ERR_INVALID_PARTICIPANT_STATUS]
    distinguishing_aspect: Vetting is only defined from SUBMITTED; a DRAFT participant cannot be vetted.
    test_recipe:
      setup:
      - Canonical event in REGISTRATION_OPEN; unit APPROVED; participant in DRAFT
      setup_api_calls:
      - call: POST /events
        payload:
          name: Cedar Creek 2026
          site_name: Cedar Creek Field
          event_starts_at: '2026-07-10T08:00:00Z'
          event_ends_at: '2026-07-12T18:00:00Z'
          adult_day_price_cents: 2599
          child_day_price_cents: 1200
          adult_weekend_price_cents: 6000
          child_weekend_price_cents: 2800
          early_bird_pct: 0.2
          early_bird_cutoff_at: '2026-06-15T00:00:00Z'
          service_fee_cents: 350
          refund_retain_pct: 0.15
          required_liability_cents: 1000000
          max_minor_per_adult: 4
          vendor_frontage_rate_cents: 900
          vendor_multi_day_discount_pct: 0.1
          vendor_min_fee_cents: 5000
          vendor_late_insurance_surcharge_cents: 2500
          vendor_insurance_deadline_at: '2026-07-01T00:00:00Z'
        as: EventOrganizer
        captures:
          ev_id: $.data.id
      - call: POST /events/${ev_id}/open-registration
        as: EventOrganizer
      - call: POST /units
        payload:
          event_id: ${ev_id}
          name: 6th Ohio
          unit_type: MILITARY
          portrayal_name: 6th OVI
        as: UnitCommander
        captures:
          un_id: $.data.id
      - call: POST /units/${un_id}/vet
        payload:
          decision: APPROVE
        as: EventOrganizer
      - call: POST /participants
        payload:
          event_id: ${ev_id}
          unit_id: ${un_id}
          full_name: Ada Adams
          age_at_event: 34
          impression_class: COMBATANT
        as: UnitCommander
        as_user_id: ${un_id}
        captures:
          pa_id: $.data.id
      trigger:
      - call: POST /participants/${pa_id}/vet
        payload:
          decision: APPROVE
        as: AuthenticityOfficer
        captures:
          err: $.data.error_id
      assert:
      - error_id == ERR_INVALID_PARTICIPANT_STATUS; Participant.${pa_id}.status remains DRAFT
  - name: equipment_banned_after_second_failure
    claim_type: valid_transition
    grounds:
    - state_machines.EquipmentItem.INSPECTION_DUE_to_FAILED
    - entities.EquipmentItem.fields.failure_count
    distinguishing_aspect: The second RECORDED_FAIL on the same item auto-transitions it FAILED -> BANNED (failure_count reaches 2); further inspection scheduling on a BANNED item is rejected.
    test_recipe:
      setup:
      - Canonical event in REGISTRATION_OPEN; unit APPROVED; participant DRAFT; FIREARM DECLARED
      - First inspection recorded FAIL (item FAILED, failure_count 1); second inspection scheduled (item INSPECTION_DUE again)
      setup_api_calls:
      - call: POST /events
        payload:
          name: Cedar Creek 2026
          site_name: Cedar Creek Field
          event_starts_at: '2026-07-10T08:00:00Z'
          event_ends_at: '2026-07-12T18:00:00Z'
          adult_day_price_cents: 2599
          child_day_price_cents: 1200
          adult_weekend_price_cents: 6000
          child_weekend_price_cents: 2800
          early_bird_pct: 0.2
          early_bird_cutoff_at: '2026-06-15T00:00:00Z'
          service_fee_cents: 350
          refund_retain_pct: 0.15
          required_liability_cents: 1000000
          max_minor_per_adult: 4
          vendor_frontage_rate_cents: 900
          vendor_multi_day_discount_pct: 0.1
          vendor_min_fee_cents: 5000
          vendor_late_insurance_surcharge_cents: 2500
          vendor_insurance_deadline_at: '2026-07-01T00:00:00Z'
        as: EventOrganizer
        captures:
          ev_id: $.data.id
      - call: POST /events/${ev_id}/open-registration
        as: EventOrganizer
      - call: POST /units
        payload:
          event_id: ${ev_id}
          name: 6th Ohio
          unit_type: MILITARY
          portrayal_name: 6th OVI
        as: UnitCommander
        captures:
          un_id: $.data.id
      - call: POST /units/${un_id}/vet
        payload:
          decision: APPROVE
        as: EventOrganizer
      - call: POST /participants
        payload:
          event_id: ${ev_id}
          unit_id: ${un_id}
          full_name: Ada Adams
          age_at_event: 34
          impression_class: COMBATANT
        as: UnitCommander
        as_user_id: ${un_id}
        captures:
          pa_id: $.data.id
      - call: POST /equipment-items
        payload:
          participant_id: ${pa_id}
          item_type: FIREARM
          description: 1861 Springfield rifled musket
        as: UnitCommander
        as_user_id: ${un_id}
        captures:
          eq_id: $.data.id
      - call: POST /equipment-items/${eq_id}/inspections
        payload:
          scheduled_for: '2026-07-10T09:00:00Z'
          inspection_kind: SAFETY
        as: SafetyOfficer
        as_user_id: so-1
        captures:
          in1: $.data.id
      - call: POST /inspections/${in1}/record
        payload:
          outcome: FAIL
          failure_reason: filed-down sear
        as: SafetyOfficer
        as_user_id: so-1
      - call: POST /equipment-items/${eq_id}/inspections
        payload:
          scheduled_for: '2026-07-10T11:00:00Z'
          inspection_kind: SAFETY
        as: SafetyOfficer
        as_user_id: so-1
        captures:
          in2: $.data.id
      trigger:
      - call: POST /inspections/${in2}/record
        payload:
          outcome: FAIL
          failure_reason: sear still unsafe
        as: SafetyOfficer
        as_user_id: so-1
      - call: POST /equipment-items/${eq_id}/inspections
        payload:
          scheduled_for: '2026-07-10T13:00:00Z'
          inspection_kind: SAFETY
        as: SafetyOfficer
        as_user_id: so-1
        captures:
          err: $.data.error_id
      assert:
      - EquipmentItem.${eq_id}.failure_count == 2 and status == BANNED (auto-transition at the second failure)
      - scheduling a third inspection on the BANNED item is rejected with ERR_INVALID_EQUIPMENT_STATUS
  - name: inspection_waive_by_different_officer_succeeds
    claim_type: valid_transition
    grounds:
    - state_machines.Inspection.RECORDED_FAIL_to_WAIVED
    - state_machines.EquipmentItem.FAILED_to_WAIVED
    distinguishing_aspect: 'A failed inspection CAN be waived by a different SafetyOfficer: inspection -> WAIVED and the equipment -> WAIVED.'
    test_recipe:
      setup:
      - Canonical event in REGISTRATION_OPEN; unit APPROVED; participant with EDGED item; inspection RECORDED_FAIL by officer so-1
      setup_api_calls:
      - call: POST /events
        payload:
          name: Cedar Creek 2026
          site_name: Cedar Creek Field
          event_starts_at: '2026-07-10T08:00:00Z'
