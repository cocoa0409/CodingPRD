        claim_type: terminal_state_lockdown
        grounds:
          - state_machines.Production.DELIVERY_to_WRAPPED
          - validations[priority=10]
          - validations[priority=31]
          - errors[ERR_DELIVERABLES_INCOMPLETE]
          - errors[ERR_PRODUCTION_PHASE_INVALID]
        distinguishing_aspect: |
          WRAPPED is terminal and locks the whole aggregate: shot creation afterwards returns 409
          ERR_PRODUCTION_PHASE_INVALID, and the wrap itself is refused with ERR_DELIVERABLES_INCOMPLETE while
          the only deliverable is still QC_PASSED rather than DELIVERED.
