            - { call: "POST /truck-washes", payload: { truck_code: "T-1", washed_at: "2026-07-12T08:00:00Z", wash_type: "FULL_DISINFECT" }, as: TransportCoordinator, as_user_id: "tc_1", captures: { wash1: $.data.id } }
