scenario: |
  Event & Party Equipment Rental: catalog (tent/table/chair/linen/bounce house), availability calendar/double-booking, delivery/pickup window & fee, damage/cleaning deposit, will-call vs delivery, multi-day rate, weather cancellation, venue certificate of insurance

domain_name: event-equipment-rental
api_prefix: ""

# =============================================================================
# Complexity Profile (Expert)
# =============================================================================
complexity_profile:
  primary_archetype: temporal_windowing
  secondary_archetype: quota_allocation
  complexity_layers:
    - optimistic_concurrency
    - cascading_side_effects
    - dual_variant_calculation
    - rate_threshold_triggers

  entity_topology: flat
  # Peer entities (CatalogItem, Customer, Venue, RentalOrder, ...) linked by
  # foreign keys; only OrderLine / DeliveryRun / DepositLedgerEntry / InsuranceCertificate
  # nest beneath their owning aggregate. URLs are mostly flat resource paths.

  state_machine_shape: parallel
  # RentalOrder carries TWO independent state dimensions (booking_status ×
  # settlement_status) that evolve on different triggers; DeliveryRun adds a
  # cyclic revision loop (SCHEDULED -> ATTEMPTED -> SCHEDULED).

  relationship_patterns:
    - one_to_many       # RentalOrder -> OrderLine; CatalogItem -> OrderLine
    - flat_references   # OrderLine references CatalogItem; RentalOrder references Customer, Venue
    - cross_aggregate   # InsuranceCertificate references Venue; DeliveryRun references RentalOrder

  role_model: peer_roles
  # Customer owns their own orders; RentalAgent operates the yard/catalog;
  # DepositAdjuster is segregated from RentalAgent for deposit settlement.

  consistency_model: immediate

# =============================================================================
# §1.0 Response Envelope (FIXED — EMIT VERBATIM)
# =============================================================================
response_envelope:
  success: |
    { "meta": { "api_request_id": "req_xxx", "api_request_timestamp": "ISO8601" },
      "response_type": "object" | "array", "data": {} }
  error: |
    { "meta": { ... }, "response_type": "error",
      "data": { "error_id": "ERR_XXX", "message": "..." } }
  pagination_fields: ["limit", "offset", "total_count", "has_more"]
  pagination_defaults: { limit: 10, min: 1, max: 100, offset: 0 }

# =============================================================================
# §1.1 Entity-Relationship Table
# =============================================================================
entities:
  - name: CatalogItem
    parent: null
    common_fields: true
    fields:
      - { name: id, type: string, source: system, description: "Server-minted UUID, identity only" }
      - { name: sku, type: string, source: input, description: "Stable catalog code, e.g. TENT-20X20", constraints: "unique across CatalogItem" }
      - { name: name, type: string, source: input, description: "Display name" }
      - { name: category, type: enum, source: input, description: "TENT | TABLE | CHAIR | LINEN | BOUNCE_HOUSE" }
      - { name: total_units, type: integer, source: input, description: "Physical units the yard owns", constraints: ">= 1" }
      - { name: daily_rate_cents, type: integer, source: input, description: "Base per-unit per-day rental price in cents", constraints: ">= 0" }
      - { name: multi_day_discount_pct, type: number, source: input, description: "Fractional discount applied to days beyond the first, e.g. 0.20 = 20% off days 2..N", default: 0, constraints: "0 <= x <= 0.90" }
      - { name: deposit_per_unit_cents, type: integer, source: input, description: "Damage deposit charged per reserved unit", default: 0, constraints: ">= 0" }
      - { name: requires_cleaning, type: boolean, source: input, description: "Whether a flat cleaning fee applies to this item (true for LINEN and BOUNCE_HOUSE)", default: false }
      - { name: cleaning_fee_cents, type: integer, source: input, description: "Flat per-unit cleaning fee charged when requires_cleaning is true", default: 0, constraints: ">= 0" }
      - { name: requires_coi, type: boolean, source: input, description: "Whether a venue Certificate of Insurance is mandatory to confirm a line for this item (true for TENT and BOUNCE_HOUSE)", default: false }
      - { name: status, type: enum, source: system, description: "ACTIVE | RETIRED", default: ACTIVE, constraints: "ACTIVE | RETIRED" }

  - name: Customer
    parent: null
    common_fields: true
    fields:
      - { name: id, type: string, source: system, description: "Server-minted UUID, identity only" }
      - { name: email, type: string, source: input, description: "Login/contact email", constraints: "unique across Customer" }
      - { name: full_name, type: string, source: input, description: "Customer name" }
      - { name: phone, type: string, source: input, description: "Contact phone" }
      - { name: account_credit_cents, type: integer, source: computed, description: "Running store credit balance from weather-cancellation refunds and deposit releases; never negative", default: 0 }

  - name: Venue
    parent: null
    common_fields: true
    fields:
      - { name: id, type: string, source: system, description: "Server-minted UUID, identity only" }
      - { name: customer_id, type: string, source: input, description: "FK -> Customer.id; the customer who registered this venue" }
      - { name: name, type: string, source: input, description: "Venue display name" }
      - { name: address, type: string, source: input, description: "Street address used for delivery" }
      - { name: delivery_zone, type: enum, source: input, description: "LOCAL | EXTENDED | REMOTE — drives delivery base fee tier" }
      - { name: coi_status, type: enum, source: computed, description: "NONE | PENDING | VALID | EXPIRED — derived from the venue's latest InsuranceCertificate vs the event window of orders using it", default: NONE, constraints: "NONE | PENDING | VALID | EXPIRED" }

  - name: InsuranceCertificate
    parent: Venue
    common_fields: true
    fields:
      - { name: id, type: string, source: system, description: "Server-minted UUID, identity only" }
      - { name: venue_id, type: string, source: input, description: "FK -> Venue.id; the venue this COI covers" }
      - { name: carrier_name, type: string, source: input, description: "Insurance carrier" }
      - { name: coverage_start, type: datetime, source: input, description: "ISO8601 UTC; first instant of coverage (inclusive)" }
      - { name: coverage_end, type: datetime, source: input, description: "ISO8601 UTC; last instant of coverage (inclusive)" }
      - { name: coverage_amount_cents, type: integer, source: input, description: "Liability coverage amount in cents", constraints: ">= 0" }
      - { name: status, type: enum, source: system, description: "SUBMITTED | APPROVED | REJECTED | REVOKED", default: SUBMITTED, constraints: "SUBMITTED | APPROVED | REJECTED | REVOKED" }

  - name: RentalOrder
    parent: null
    common_fields: true
    fields:
      - { name: id, type: string, source: system, description: "Server-minted UUID, identity only" }
      - { name: customer_id, type: string, source: input, description: "FK -> Customer.id; the booking customer" }
      - { name: venue_id, type: string, source: input, description: "FK -> Venue.id; the event location (required when fulfillment=DELIVERY)" }
      - { name: fulfillment, type: enum, source: input, description: "WILL_CALL | DELIVERY — pickup at yard vs delivered to venue" }
      - { name: event_start, type: datetime, source: input, description: "ISO8601 UTC; first rental day at 00:00:00.000Z (inclusive)" }
      - { name: event_end, type: datetime, source: input, description: "ISO8601 UTC; last rental day at 00:00:00.000Z (inclusive); rental_days = day-count from event_start to event_end inclusive" }
      - { name: rental_days, type: integer, source: computed, description: "Inclusive whole-day span: floor((event_end - event_start)/1 day) + 1", constraints: ">= 1" }
      - { name: booking_status, type: enum, source: system, description: "DRAFT | CONFIRMED | FULFILLED | RETURNED | CANCELLED — fulfillment lifecycle dimension", default: DRAFT, constraints: "DRAFT | CONFIRMED | FULFILLED | RETURNED | CANCELLED" }
      - { name: settlement_status, type: enum, source: system, description: "UNSETTLED | DEPOSIT_HELD | DEPOSIT_RELEASED | DEPOSIT_FORFEITED — deposit/money dimension, evolves independently of booking_status", default: UNSETTLED, constraints: "UNSETTLED | DEPOSIT_HELD | DEPOSIT_RELEASED | DEPOSIT_FORFEITED" }
      - { name: rental_subtotal_cents, type: integer, source: computed, description: "Sum of per-line rental charges across all lines (see calc order_rental_subtotal)", default: 0 }
      - { name: delivery_fee_cents, type: integer, source: computed, description: "Delivery/pickup fee; 0 for WILL_CALL (see calc delivery_fee)", default: 0 }
      - { name: cleaning_fee_total_cents, type: integer, source: computed, description: "Sum of per-unit cleaning fees across lines whose item requires_cleaning", default: 0 }
      - { name: deposit_total_cents, type: integer, source: computed, description: "Sum of per-unit deposits across all reserved line units", default: 0 }
      - { name: grand_total_cents, type: integer, source: computed, description: "rental_subtotal + delivery_fee + cleaning_fee_total (deposit is held separately, not part of grand_total)", default: 0 }
      - { name: weather_cancellable, type: boolean, source: computed, description: "True iff any line's item category is in the weather-sensitive set {TENT, BOUNCE_HOUSE}", default: false }
      - { name: version, type: integer, source: system, description: "Optimistic concurrency version; starts at 1, +1 on every mutation incl. cascades" }

  - name: OrderLine
    parent: RentalOrder
    common_fields: true
    fields:
      - { name: id, type: string, source: system, description: "Server-minted UUID, identity only" }
      - { name: order_id, type: string, source: input, description: "FK -> RentalOrder.id; the owning order" }
      - { name: item_id, type: string, source: input, description: "FK -> CatalogItem.id; the rented catalog item" }
      - { name: quantity, type: integer, source: input, description: "Units reserved on this line", constraints: ">= 1" }
      - { name: line_rental_cents, type: integer, source: computed, description: "Multi-day rental charge for this line (see calc line_rental_charge)", default: 0 }
      - { name: line_deposit_cents, type: integer, source: computed, description: "quantity * item.deposit_per_unit_cents", default: 0 }
      - { name: line_cleaning_cents, type: integer, source: computed, description: "quantity * item.cleaning_fee_cents if item.requires_cleaning else 0", default: 0 }
      - { name: reserved_window_start, type: datetime, source: system, description: "Copied from order.event_start when the order is CONFIRMED; null while DRAFT — defines the inventory hold interval" }
      - { name: reserved_window_end, type: datetime, source: system, description: "Copied from order.event_end when the order is CONFIRMED; null while DRAFT" }
      - { name: status, type: enum, source: system, description: "PENDING | RESERVED | RELEASED — RESERVED holds inventory over the window; RELEASED frees it", default: PENDING, constraints: "PENDING | RESERVED | RELEASED" }

  - name: DeliveryRun
    parent: RentalOrder
    common_fields: true
    fields:
      - { name: id, type: string, source: system, description: "Server-minted UUID, identity only" }
      - { name: order_id, type: string, source: input, description: "FK -> RentalOrder.id; the order being delivered/picked up" }
      - { name: leg, type: enum, source: input, description: "DROP_OFF | PICK_UP — outbound delivery vs return collection" }
      - { name: crew_id, type: string, source: input, description: "FK -> Crew.id; the assigned delivery crew" }
      - { name: window_start, type: datetime, source: input, description: "ISO8601 UTC; scheduled window open (inclusive)" }
      - { name: window_end, type: datetime, source: input, description: "ISO8601 UTC; scheduled window close (exclusive)" }
      - { name: status, type: enum, source: system, description: "SCHEDULED | ATTEMPTED | COMPLETED | CANCELLED — ATTEMPTED can be re-scheduled back to SCHEDULED (cyclic)", default: SCHEDULED, constraints: "SCHEDULED | ATTEMPTED | COMPLETED | CANCELLED" }
      - { name: attempt_count, type: integer, source: system, description: "Number of failed attempts; increments on each SCHEDULED->ATTEMPTED", default: 0 }

  - name: Crew
    parent: null
    common_fields: true
    fields:
      - { name: id, type: string, source: system, description: "Server-minted UUID, identity only" }
      - { name: name, type: string, source: input, description: "Crew/truck label" }
      - { name: turnaround_minutes, type: integer, source: input, description: "Buffer the crew needs between consecutive runs; back-to-back windows must be separated by at least this gap", default: 0, constraints: ">= 0" }

  - name: DepositLedgerEntry
    parent: RentalOrder
    common_fields: false
    fields:
      - { name: id, type: string, source: system, description: "Server-minted UUID, identity only" }
      - { name: order_id, type: string, source: input, description: "FK -> RentalOrder.id; the order whose deposit this entry adjusts" }
      - { name: kind, type: enum, source: input, description: "HOLD | RELEASE | FORFEIT — append-only deposit ledger event", constraints: "HOLD | RELEASE | FORFEIT" }
      - { name: amount_cents, type: integer, source: input, description: "Signed amount: HOLD positive, RELEASE/FORFEIT reduce the held balance", constraints: ">= 0" }
      - { name: reason, type: string, source: input, description: "Free-text reason (e.g. 'torn linen', 'clean return')", default: "" }
      - { name: created_at, type: datetime, source: system, description: "ISO8601 UTC; ledger entries replay in created_at ASC order, ties broken by id is forbidden — use created_at only" }

  - name: WeatherEvent
    parent: null
    common_fields: false
    fields:
      - { name: id, type: string, source: system, description: "Server-minted UUID, identity only" }
      - { name: delivery_zone, type: enum, source: input, description: "LOCAL | EXTENDED | REMOTE — zone the advisory covers" }
      - { name: severity, type: enum, source: input, description: "ADVISORY | WARNING — WARNING enables full weather-cancellation refunds", constraints: "ADVISORY | WARNING" }
      - { name: effective_date, type: datetime, source: input, description: "ISO8601 UTC; the event day at 00:00:00.000Z the advisory applies to (matched against an order's event_start..event_end inclusive day span)" }
      - { name: created_at, type: datetime, source: system, description: "ISO8601 UTC; creation timestamp" }

# =============================================================================
# §1.2 State Machine Table
# =============================================================================
state_machines:
  # ---- CatalogItem ----
  - entity: CatalogItem
    field: status
    initial_state: ACTIVE
    terminal_states: [RETIRED]
    transitions:
      - from: ACTIVE
        to: RETIRED
        trigger: "POST /catalog-items/{item_id}/retire"
        actor: RentalAgent
        preconditions: ["status == ACTIVE (ERR_INVALID_STATE)"]
        side_effects:
          - "New OrderLine creation referencing this item is rejected with ERR_INACTIVE_ITEM; existing RESERVED lines are unaffected"

  # ---- RentalOrder: booking_status dimension ----
  - entity: RentalOrder
    field: booking_status
    initial_state: DRAFT
    terminal_states: [RETURNED, CANCELLED]
    note: "Independent of settlement_status; both evolve on the same row."
    transitions:
      - from: DRAFT
        to: CONFIRMED
        trigger: "POST /orders/{order_id}/confirm"
        actor: Customer
        preconditions:
          - "Order has >= 1 OrderLine (ERR_ORDER_EMPTY)"
          - "For every line whose CatalogItem.requires_coi is true: the order's Venue.coi_status == VALID over the event window (ERR_COI_REQUIRED). WILL_CALL orders with no requires_coi lines skip this."
          - "For every line: availability check passes — units already RESERVED on overlapping windows + this line.quantity <= CatalogItem.total_units (ERR_INVENTORY_UNAVAILABLE)"
          - "expected_order_version matches RentalOrder.version (ERR_STALE_VERSION)"
        side_effects:
          - "All OrderLine.status PENDING -> RESERVED; copies reserved_window_start=event_start, reserved_window_end=event_end onto each line"
          - "Recomputes rental_subtotal_cents, delivery_fee_cents, cleaning_fee_total_cents, deposit_total_cents, grand_total_cents (calcs order_rental_subtotal, delivery_fee)"
          - "settlement_status UNSETTLED -> DEPOSIT_HELD; appends DepositLedgerEntry kind=HOLD amount=deposit_total_cents (cross-dimension cascade)"
          - "increments RentalOrder.version by 1"
      - from: CONFIRMED
        to: FULFILLED
        trigger: "POST /orders/{order_id}/fulfill"
        actor: RentalAgent
        preconditions:
          - "booking_status == CONFIRMED (ERR_INVALID_STATE)"
          - "If fulfillment == DELIVERY: the DROP_OFF DeliveryRun for this order is COMPLETED (ERR_DELIVERY_NOT_COMPLETED)"
        side_effects:
          - "increments RentalOrder.version by 1"
      - from: FULFILLED
        to: RETURNED
        trigger: "POST /orders/{order_id}/return"
        actor: RentalAgent
        preconditions:
          - "booking_status == FULFILLED (ERR_INVALID_STATE)"
          - "If fulfillment == DELIVERY: the PICK_UP DeliveryRun for this order is COMPLETED (ERR_DELIVERY_NOT_COMPLETED)"
        side_effects:
          - "All OrderLine.status RESERVED -> RELEASED (frees inventory window) — cascade hop 1"
          - "increments RentalOrder.version by 1"
      - from: [DRAFT, CONFIRMED]
        to: CANCELLED
        trigger: "POST /orders/{order_id}/cancel"
        actor: "Customer or system"
        preconditions:
          - "booking_status in {DRAFT, CONFIRMED} (ERR_INVALID_STATE)"
          - "expected_order_version matches RentalOrder.version (ERR_STALE_VERSION)"
        side_effects:
          - "All non-RELEASED OrderLine.status -> RELEASED (frees inventory window) — cascade hop 1"
          - "All SCHEDULED/ATTEMPTED DeliveryRun.status -> CANCELLED — cascade hop 1"
          - "If settlement_status == DEPOSIT_HELD: -> DEPOSIT_RELEASED and append DepositLedgerEntry kind=RELEASE amount=current held balance (cascade hop 2: order cancel -> deposit dimension transition -> Customer.account_credit_cents recompute)"
          - "increments RentalOrder.version by 1"

  # ---- RentalOrder: settlement_status dimension (parallel) ----
  - entity: RentalOrder
    field: settlement_status
    initial_state: UNSETTLED
    terminal_states: [DEPOSIT_RELEASED, DEPOSIT_FORFEITED]
    note: "Parallel dimension; transitions triggered by deposit ledger actions and by booking-dimension cascades."
    transitions:
      - from: UNSETTLED
        to: DEPOSIT_HELD
        trigger: "system (RentalOrder DRAFT->CONFIRMED)"
        actor: system
        preconditions: ["booking_status transitioning to CONFIRMED"]
        side_effects:
          - "Records held deposit = deposit_total_cents via DepositLedgerEntry kind=HOLD"
      - from: DEPOSIT_HELD
        to: DEPOSIT_RELEASED
        trigger: "POST /orders/{order_id}/deposit/settle with disposition=RELEASE, or system (order cancel)"
        actor: "DepositAdjuster or system"
        preconditions:
          - "settlement_status == DEPOSIT_HELD (ERR_INVALID_STATE)"
          - "Manual settle: booking_status == RETURNED (ERR_NOT_RETURNED)"
          - "Manual settle: expected_order_version matches RentalOrder.version (ERR_STALE_VERSION)"
        side_effects:
          - "Appends DepositLedgerEntry kind=RELEASE amount=current held balance"
          - "Credits Customer.account_credit_cents by released amount (calc customer_account_credit)"
          - "increments RentalOrder.version by 1"
      - from: DEPOSIT_HELD
        to: DEPOSIT_FORFEITED
        trigger: "POST /orders/{order_id}/deposit/settle with disposition=FORFEIT"
        actor: DepositAdjuster
        preconditions:
          - "settlement_status == DEPOSIT_HELD (ERR_INVALID_STATE)"
          - "booking_status == RETURNED (ERR_NOT_RETURNED)"
          - "forfeit_amount_cents <= current held balance (ERR_FORFEIT_EXCEEDS_HELD)"
          - "expected_order_version matches RentalOrder.version (ERR_STALE_VERSION)"
        side_effects:
          - "Appends DepositLedgerEntry kind=FORFEIT amount=forfeit_amount_cents"
          - "If forfeit_amount < held balance: appends DepositLedgerEntry kind=RELEASE for the remainder, crediting Customer.account_credit_cents by the remainder (calc customer_account_credit)"
          - "increments RentalOrder.version by 1"

  # ---- InsuranceCertificate ----
  - entity: InsuranceCertificate
    field: status
    initial_state: SUBMITTED
    terminal_states: [REJECTED, REVOKED]
    transitions:
      - from: SUBMITTED
        to: APPROVED
        trigger: "POST /venues/{venue_id}/certificates/{certificate_id}/approve"
        actor: RentalAgent
        preconditions:
          - "status == SUBMITTED (ERR_INVALID_STATE)"
          - "coverage_end >= coverage_start (ERR_INVALID_COVERAGE_WINDOW)"
        side_effects:
          - "Recomputes parent Venue.coi_status for affected orders (calc venue_coi_status)"
      - from: SUBMITTED
        to: REJECTED
        trigger: "POST /venues/{venue_id}/certificates/{certificate_id}/reject"
        actor: RentalAgent
        preconditions: ["status == SUBMITTED (ERR_INVALID_STATE)"]
        side_effects: ["Recomputes Venue.coi_status (calc venue_coi_status)"]
      - from: APPROVED
        to: REVOKED
        trigger: "POST /venues/{venue_id}/certificates/{certificate_id}/revoke"
        actor: RentalAgent
        preconditions: ["status == APPROVED (ERR_INVALID_STATE)"]
        side_effects:
          - "Recomputes Venue.coi_status (calc venue_coi_status); a CONFIRMED order on this venue with requires_coi lines whose window is now uncovered is flagged but NOT auto-cancelled"

  # ---- DeliveryRun (cyclic: SCHEDULED <-> ATTEMPTED) ----
  - entity: DeliveryRun
    field: status
    initial_state: SCHEDULED
    terminal_states: [COMPLETED, CANCELLED]
    transitions:
      - from: SCHEDULED
        to: ATTEMPTED
        trigger: "POST /delivery-runs/{run_id}/attempt with outcome=FAILED"
        actor: RentalAgent
        preconditions: ["status == SCHEDULED (ERR_INVALID_STATE)"]
        side_effects: ["increments attempt_count by 1"]
      - from: ATTEMPTED
        to: SCHEDULED
        trigger: "POST /delivery-runs/{run_id}/reschedule"
        actor: RentalAgent
        preconditions:
          - "status == ATTEMPTED (ERR_INVALID_STATE)"
          - "attempt_count <= 2 (ERR_MAX_ATTEMPTS_EXCEEDED) — third failure forbids reschedule"
          - "New window does not collide with another non-CANCELLED run on the same Crew incl. turnaround buffer (ERR_CREW_WINDOW_CONFLICT)"
        side_effects: ["Updates window_start, window_end"]
      - from: SCHEDULED
        to: COMPLETED
        trigger: "POST /delivery-runs/{run_id}/attempt with outcome=SUCCESS"
        actor: RentalAgent
        preconditions: ["status == SCHEDULED (ERR_INVALID_STATE)"]
        side_effects:
          - "Marks run COMPLETED; if leg==DROP_OFF this unblocks order fulfill; if leg==PICK_UP this unblocks order return"
      - from: [SCHEDULED, ATTEMPTED]
        to: CANCELLED
        trigger: "POST /delivery-runs/{run_id}/cancel or system (order cancel)"
        actor: "RentalAgent or system"
        preconditions: ["status in {SCHEDULED, ATTEMPTED} (ERR_INVALID_STATE)"]
        side_effects: ["Frees the crew window"]

# =============================================================================
# §1.2.1 Concurrency Rules
# =============================================================================
concurrency_rules:
  - rule_id: order-confirm-stale-version
    parent_entity: RentalOrder
    write_endpoint: "POST /orders/{order_id}/confirm"
    occ_field: "expected_order_version"
    description: |
      Confirming a RentalOrder whose version has advanced since the client last
      observed it is rejected. A prior writer may have added or removed an
      OrderLine (legitimately bumping the order version and changing the
      availability/COI picture) so the current writer's view of the order is
      stale. The loser carries an expected_order_version older than the order's
      current version and is rejected on the OCC check.
    error_id: ERR_STALE_VERSION
    http_status: 412

  - rule_id: deposit-settle-stale-version
    parent_entity: RentalOrder
    write_endpoint: "POST /orders/{order_id}/deposit/settle"
    occ_field: "expected_order_version"
    description: |
      Settling the deposit on a RentalOrder whose version has advanced since the
      client last read it is rejected. The deposit can legitimately be settled
      exactly once from DEPOSIT_HELD; a prior settle already advanced the order
      version, so a second settle carrying the now-stale expected_order_version
      is rejected on the OCC check rather than silently double-settling.
    error_id: ERR_STALE_VERSION
    http_status: 412

# =============================================================================
# §1.3 Calculation Rules Table
# =============================================================================
calculations:
  - name: line_rental_charge
    trigger: "RentalOrder DRAFT->CONFIRMED; also previewed on GET /orders/{order_id}/quote"
    algorithm: tiered_pricing
    formula: |
      # Multi-day rate: day 1 at full daily_rate; days 2..N discounted.
      # Evaluation order is PINNED: compute the per-unit multi-day price first,
      # round it to whole cents, THEN multiply by quantity (round-then-multiply).
      d = order.rental_days                      # integer >= 1
      full_day = item.daily_rate_cents
      disc_day = round_half_up(item.daily_rate_cents * (1 - item.multi_day_discount_pct))
      per_unit_price = full_day + (d - 1) * disc_day      # day 1 full, remaining at discounted
      line_rental_cents = per_unit_price * line.quantity
    input_set: "Single OrderLine + its CatalogItem + owning RentalOrder.rental_days"
    constants: {}
    precision: "round_half_up to whole cents at the per-unit step BEFORE multiplying by quantity"
    variants:
      - name: full_term
        when: "rental_days computed from event_start..event_end at confirm time"
        difference: "Uses the order's full inclusive day span"
      - name: prorated_weather_refund
        when: "weather cancellation with severity=WARNING (see calc weather_refund_amount)"
        difference: "Refund reverses rental at the SAME per-unit pricing but only for un-fulfilled days; never re-rounds per-unit price"

  - name: order_rental_subtotal
    trigger: "RentalOrder DRAFT->CONFIRMED; previewed on GET /orders/{order_id}/quote"
    algorithm: aggregation
    formula: |
      rental_subtotal_cents = sum(line.line_rental_cents for line in order.lines)   # already per-unit-rounded then *qty
      cleaning_fee_total_cents = sum(line.quantity * item.cleaning_fee_cents
                                     for line where item.requires_cleaning)
      deposit_total_cents = sum(line.quantity * item.deposit_per_unit_cents for line)
      grand_total_cents = rental_subtotal_cents + delivery_fee_cents + cleaning_fee_total_cents
    input_set: "All OrderLine rows on the order (status PENDING at confirm time)"
    constants: {}
    precision: "Inputs already whole cents; sum is exact (no re-rounding)"

  - name: delivery_fee
    trigger: "RentalOrder DRAFT->CONFIRMED; previewed on GET /orders/{order_id}/quote"
    algorithm: threshold
    formula: |
      if order.fulfillment == WILL_CALL:
          delivery_fee_cents = 0
      else:   # DELIVERY — round-trip (drop-off + pick-up)
          base = ZONE_BASE_CENTS[venue.delivery_zone]            # LOCAL/EXTENDED/REMOTE
          # Big-event surcharge: orders moving a lot of units cost more to haul.
          total_units = sum(line.quantity for line in order.lines)
          surcharge = SURCHARGE_CENTS if total_units >= BIG_EVENT_UNIT_THRESHOLD else 0
          # FREE-delivery waiver: large rental subtotals waive the BASE (not the surcharge).
          base_after_waiver = 0 if rental_subtotal_cents >= FREE_DELIVERY_SUBTOTAL_CENTS else base
          delivery_fee_cents = base_after_waiver + surcharge
    input_set: "order.fulfillment, venue.delivery_zone, total reserved units, rental_subtotal_cents"
    constants:
      ZONE_BASE_CENTS: { LOCAL: 5000, EXTENDED: 9000, REMOTE: 15000 }
      SURCHARGE_CENTS: 4000
      BIG_EVENT_UNIT_THRESHOLD: 100   # >= 100 units triggers surcharge (boundary: 99 no, 100 yes)
      FREE_DELIVERY_SUBTOTAL_CENTS: 200000   # >= $2000 subtotal waives base (boundary: 199999 no, 200000 yes)
    precision: "All whole cents; no rounding needed"

  - name: weather_refund_amount
    trigger: "POST /orders/{order_id}/weather-cancel"
    algorithm: chronological
    formula: |
      # A WARNING-severity WeatherEvent matching the order's zone and any day in
      # the event window enables a refund. Refund composition depends on
      # booking_status and is computed forward over the deposit ledger.
      if booking_status == CONFIRMED:        # not yet fulfilled
          rental_refund = rental_subtotal_cents + cleaning_fee_total_cents     # full rental+cleaning
          delivery_refund = delivery_fee_cents                                 # delivery not yet incurred
      elif booking_status == FULFILLED:      # goods delivered/picked up; partial
          rental_refund = 0                  # rental already consumed once goods are out
          delivery_refund = 0
      deposit_release = current_held_deposit_balance                           # always release held deposit
      weather_refund_cents = rental_refund + delivery_refund
      # Credited to Customer.account_credit_cents; deposit_release credited separately via ledger.
    input_set: "Order at CONFIRMED or FULFILLED; matching WARNING WeatherEvent; deposit ledger held balance"
    constants: {}
    precision: "Whole cents; sum is exact"
    variants:
      - name: pre_fulfillment_full
        when: "booking_status == CONFIRMED at weather-cancel time"
        difference: "Refunds rental + cleaning + delivery + releases deposit"
      - name: post_fulfillment_deposit_only
        when: "booking_status == FULFILLED at weather-cancel time"
        difference: "Refunds nothing on rental/delivery; only releases held deposit"

  - name: customer_account_credit
    trigger: "Deposit RELEASE ledger append; weather refund; deposit FORFEIT-with-remainder"
    algorithm: aggregation
    formula: |
      # Forward replay of every credit-affecting event for the customer, in
      # created_at ASC order (ties: created_at only; id is FORBIDDEN as tie-break).
      account_credit_cents = sum(
          e.amount_cents for e in DepositLedgerEntry where kind==RELEASE and e.order.customer_id == customer.id
      ) + sum(
          w.weather_refund_cents for weather-cancellations on the customer's orders
      )
      # Never negative.
    input_set: "All RELEASE DepositLedgerEntry rows + weather refunds for the customer's orders"
    constants: {}
    precision: "Whole cents; exact sum; floor at 0"

  - name: deposit_held_balance
    trigger: "Read on GET /orders/{order_id}/deposit-ledger; recomputed on every ledger append"
    algorithm: chronological
    formula: |
      # Replay the append-only DepositLedgerEntry stream in created_at ASC order
      # (tie-break: created_at only — id MUST NOT be used).
      held = 0
      for e in entries_sorted_by_created_at_asc:
          if e.kind == HOLD:    held += e.amount_cents
          if e.kind == RELEASE: held -= e.amount_cents
          if e.kind == FORFEIT: held -= e.amount_cents
      held_balance_cents = held    # invariant: held == HOLD_total - RELEASE_total - FORFEIT_total, never < 0
    input_set: "All DepositLedgerEntry rows for the order"
    constants: {}
    precision: "Whole cents; exact"

  - name: venue_coi_status
    trigger: "InsuranceCertificate approve/reject/revoke; order confirm COI check; GET /venues/{venue_id}"
    algorithm: projection
    formula: |
      # For a given venue and a target event window [event_start, event_end] (inclusive days):
      certs = APPROVED InsuranceCertificate for venue
      covering = [c for c in certs if c.coverage_start <= event_start and c.coverage_end >= event_end]
      if covering non-empty:        coi_status_for_window = VALID
      elif any SUBMITTED cert:      coi_status_for_window = PENDING
      elif any APPROVED cert whose window does NOT cover the event: coi_status_for_window = EXPIRED
      else:                         coi_status_for_window = NONE
      # Venue.coi_status (no order context) uses the venue's latest cert by coverage_end DESC,
      # tie-break created_at ASC; reports VALID/PENDING/EXPIRED/REJECTED-as-NONE.
    input_set: "APPROVED/SUBMITTED InsuranceCertificate rows for the venue + the order event window"
    constants: {}
    precision: "Boundary: coverage interval is INCLUSIVE on both ends (closed [start,end]); coverage_start == event_start qualifies"

# =============================================================================
# §1.4 Validation Rules Table (ordered by priority)
# =============================================================================
validations:
  - priority: 1
    category: auth
    check: "X-User-Role and X-User-ID headers present and X-User-Role is a known role"
    error_id: ERR_UNAUTHENTICATED
    http_status: 401
    applies_to: all

  - priority: 2
    category: auth
    check: "Acting role is permitted to perform this operation per §1.7 RBAC"
    error_id: ERR_UNAUTHORIZED
    http_status: 403
    applies_to: all

  - priority: 3
    category: existence
    check: "Every path/body-referenced resource exists, validated left-to-right in the path"
    error_id: ERR_NOT_FOUND
    http_status: 404
    applies_to: all

  - priority: 4
    category: business_referential
    check: "Customer acting on an order/venue must own it (X-User-ID == resource.customer_id)"
    error_id: ERR_NOT_RESOURCE_OWNER
    http_status: 403
    applies_to: "Customer-role order and venue mutations"

  - priority: 5
    category: state
    check: "Target resource is in a valid state for the requested transition (booking_status / settlement_status / cert status / run status)"
    error_id: ERR_INVALID_STATE
    http_status: 409
    applies_to: "all state-transition endpoints"

  - priority: 6
    category: business_constraint
    check: "Order has at least one OrderLine before confirm"
    error_id: ERR_ORDER_EMPTY
    http_status: 422
    applies_to: "POST /orders/{order_id}/confirm"

  - priority: 7
    category: business_safety
    check: "For lines whose CatalogItem.requires_coi is true, the venue's COI is VALID over the event window"
    error_id: ERR_COI_REQUIRED
    http_status: 422
    applies_to: "POST /orders/{order_id}/confirm"

  - priority: 8
    category: business_temporal
    check: "Inventory availability: reserved units over the overlapping window + requested quantity must not exceed CatalogItem.total_units (half-open day-overlap test)"
    error_id: ERR_INVENTORY_UNAVAILABLE
    http_status: 409
    applies_to: "POST /orders/{order_id}/confirm"

  - priority: 9
    category: business_temporal
    check: "Crew window non-overlap incl. turnaround buffer between consecutive runs on the same crew (closed-interval + buffer test)"
    error_id: ERR_CREW_WINDOW_CONFLICT
    http_status: 409
    applies_to: "POST /delivery-runs, POST /delivery-runs/{run_id}/reschedule"

  - priority: 10
    category: business_constraint
    check: "DeliveryRun reschedule allowed only while attempt_count <= 2"
    error_id: ERR_MAX_ATTEMPTS_EXCEEDED
    http_status: 422
    applies_to: "POST /delivery-runs/{run_id}/reschedule"

  - priority: 11
    category: business_constraint
    check: "Order fulfill requires the DROP_OFF run COMPLETED; order return requires the PICK_UP run COMPLETED (DELIVERY orders)"
    error_id: ERR_DELIVERY_NOT_COMPLETED
    http_status: 409
    applies_to: "POST /orders/{order_id}/fulfill, POST /orders/{order_id}/return"

  - priority: 12
    category: business_constraint
    check: "Deposit settle requires booking_status == RETURNED"
    error_id: ERR_NOT_RETURNED
    http_status: 409
    applies_to: "POST /orders/{order_id}/deposit/settle"

  - priority: 13
    category: business_fiscal
    check: "Forfeit amount must not exceed the current held deposit balance"
    error_id: ERR_FORFEIT_EXCEEDS_HELD
    http_status: 422
    applies_to: "POST /orders/{order_id}/deposit/settle (disposition=FORFEIT)"

  - priority: 14
    category: business_constraint
    check: "Weather cancellation requires a matching WARNING WeatherEvent on the order's zone and an event-window day"
    error_id: ERR_NO_WEATHER_EVENT
    http_status: 422
    applies_to: "POST /orders/{order_id}/weather-cancel"

  - priority: 15
    category: business_constraint
    check: "DELIVERY orders require a venue_id and the venue must belong to the order's customer"
    error_id: ERR_VENUE_REQUIRED
    http_status: 422
    applies_to: "POST /orders, POST /orders/{order_id}/lines (at confirm)"

  - priority: 16
    category: business_constraint
    check: "InsuranceCertificate coverage_end must be >= coverage_start"
    error_id: ERR_INVALID_COVERAGE_WINDOW
    http_status: 422
    applies_to: "POST /venues/{venue_id}/certificates, approve"

  - priority: 17
    category: business_temporal
    check: "RentalOrder event_end must be >= event_start (rental_days >= 1)"
    error_id: ERR_INVALID_EVENT_WINDOW
    http_status: 422
    applies_to: "POST /orders"

  - priority: 18
    category: business_constraint
    check: "OCC: expected_order_version must equal RentalOrder.version"
    error_id: ERR_STALE_VERSION
    http_status: 412
    applies_to: "POST /orders/{order_id}/confirm, /cancel, /deposit/settle"

  - priority: 19
    category: state
    check: "Add/remove line only allowed while order booking_status == DRAFT"
    error_id: ERR_LINE_NOT_DRAFT
    http_status: 409
    applies_to: "POST /orders/{order_id}/lines, DELETE /orders/{order_id}/lines/{line_id}"

  - priority: 20
    category: business_constraint
    check: "Cannot add a line referencing a RETIRED CatalogItem"
    error_id: ERR_INACTIVE_ITEM
    http_status: 422
    applies_to: "POST /orders/{order_id}/lines"

# =============================================================================
# §1.5 API Endpoint Table
# =============================================================================
endpoints:
  # ---- CatalogItem ----
  - method: POST
    path: "/catalog-items"
    description: "Create a catalog item (equipment type)"
    roles: [RentalAgent]
    code: 201
    input: [sku, name, category, total_units, daily_rate_cents, "multi_day_discount_pct?", "deposit_per_unit_cents?", "requires_cleaning?", "cleaning_fee_cents?", "requires_coi?"]
    output: CatalogItem
    side_effects: ["status=ACTIVE"]

  - method: GET
    path: "/catalog-items"
    description: "List catalog items (paginated; filter by category)"
    roles: [RentalAgent, Customer, DepositAdjuster]
    code: 200
    input: ["category?", "limit?", "offset?"]
    output: CatalogItem[]
    side_effects: []

  - method: GET
    path: "/catalog-items/{item_id}"
    description: "Get a catalog item"
    roles: [RentalAgent, Customer, DepositAdjuster]
    code: 200
    input: []
    output: CatalogItem
    side_effects: []

  - method: GET
    path: "/catalog-items/{item_id}/availability"
    description: "Computed read: available units of this item over a queried window (total_units - reserved overlapping units)"
    roles: [RentalAgent, Customer]
    code: 200
    input: [window_start, window_end]
    output: "{ item_id: string, window_start: datetime, window_end: datetime, total_units: integer, reserved_units: integer, available_units: integer }"
    side_effects: []

  - method: GET
    path: "/catalog-items/{id}/reservations"
    description: "List OrderLine rows that reference this catalog item — FK reverse-reachability for OrderLine.item_id"
    roles: [RentalAgent, Customer, DepositAdjuster]
    code: 200
    input: ["status?", "limit?", "offset?"]
    output: OrderLine[]
    side_effects: []

  - method: POST
    path: "/catalog-items/{item_id}/retire"
    description: "Retire a catalog item so no new lines can reference it"
    roles: [RentalAgent]
    code: 200
    input: []
    output: CatalogItem
    side_effects: ["status ACTIVE->RETIRED"]

  # ---- Customer ----
  - method: POST
    path: "/customers"
    description: "Register a customer"
    roles: [RentalAgent, Customer]
    code: 201
    input: [email, full_name, phone]
    output: Customer
    side_effects: ["account_credit_cents=0"]

  - method: GET
    path: "/customers/{customer_id}"
    description: "Get a customer (incl. account_credit_cents)"
    roles: [RentalAgent, Customer, DepositAdjuster]
    code: 200
    input: []
    output: Customer
    side_effects: []

  # ---- Venue ----
  - method: POST
    path: "/venues"
    description: "Register a venue for a customer"
    roles: [Customer, RentalAgent]
    code: 201
    input: [customer_id, name, address, delivery_zone]
    output: Venue
    side_effects: ["coi_status=NONE"]

  - method: GET
    path: "/venues/{venue_id}"
    description: "Get a venue (incl. computed coi_status)"
    roles: [Customer, RentalAgent]
    code: 200
    input: []
    output: Venue
    side_effects: []

  - method: GET
    path: "/venues"
    description: "List venues (filter by customer_id) — FK reverse-reachability for Venue.customer_id"
    roles: [Customer, RentalAgent]
    code: 200
    input: ["customer_id?", "limit?", "offset?"]
    output: Venue[]
    side_effects: []

  # ---- InsuranceCertificate ----
  - method: POST
    path: "/venues/{venue_id}/certificates"
    description: "Submit a Certificate of Insurance for a venue"
    roles: [Customer, RentalAgent]
    code: 201
    input: [carrier_name, coverage_start, coverage_end, coverage_amount_cents]
    output: InsuranceCertificate
    side_effects: ["status=SUBMITTED", "recompute Venue.coi_status"]

  - method: GET
    path: "/venues/{id}/certificates"
    description: "List COIs for a venue — FK reverse-reachability for InsuranceCertificate.venue_id"
    roles: [Customer, RentalAgent]
    code: 200
    input: ["limit?", "offset?"]
    output: InsuranceCertificate[]
    side_effects: []

  - method: POST
    path: "/venues/{venue_id}/certificates/{certificate_id}/approve"
    description: "Approve a submitted COI"
    roles: [RentalAgent]
    code: 200
    input: []
    output: InsuranceCertificate
    side_effects: ["status SUBMITTED->APPROVED", "recompute Venue.coi_status"]

  - method: POST
    path: "/venues/{venue_id}/certificates/{certificate_id}/reject"
    description: "Reject a submitted COI"
    roles: [RentalAgent]
    code: 200
    input: ["reason?"]
    output: InsuranceCertificate
    side_effects: ["status SUBMITTED->REJECTED", "recompute Venue.coi_status"]

  - method: POST
    path: "/venues/{venue_id}/certificates/{certificate_id}/revoke"
    description: "Revoke an approved COI"
    roles: [RentalAgent]
    code: 200
    input: ["reason?"]
    output: InsuranceCertificate
    side_effects: ["status APPROVED->REVOKED", "recompute Venue.coi_status"]

  # ---- RentalOrder ----
  - method: POST
    path: "/orders"
    description: "Create a draft rental order"
    roles: [Customer, RentalAgent]
    code: 201
    input: [customer_id, fulfillment, event_start, event_end, "venue_id?"]
    output: RentalOrder
    side_effects: ["booking_status=DRAFT, settlement_status=UNSETTLED, version=1, compute rental_days, weather_cancellable=false (no lines yet)"]

  - method: GET
    path: "/orders/{order_id}"
    description: "Get an order with computed totals"
    roles: [Customer, RentalAgent, DepositAdjuster]
    code: 200
    input: []
    output: RentalOrder
    side_effects: []

  - method: GET
    path: "/orders"
    description: "List orders (filter by customer_id) — FK reverse-reachability for RentalOrder.customer_id"
    roles: [Customer, RentalAgent, DepositAdjuster]
    code: 200
    input: ["customer_id?", "venue_id?", "limit?", "offset?"]
    output: RentalOrder[]
    side_effects: []

  - method: POST
    path: "/orders/{order_id}/lines"
    description: "Add a line item to a DRAFT order"
    roles: [Customer, RentalAgent]
    code: 201
    input: [item_id, quantity]
    output: OrderLine
    side_effects: ["status=PENDING; recompute order weather_cancellable; increment RentalOrder.version by 1"]

  - method: GET
    path: "/orders/{id}/lines"
    description: "List lines on an order — FK reverse-reachability for OrderLine.order_id"
    roles: [Customer, RentalAgent, DepositAdjuster]
    code: 200
    input: ["limit?", "offset?"]
    output: OrderLine[]
    side_effects: []

  - method: DELETE
    path: "/orders/{order_id}/lines/{line_id}"
    description: "Remove a line from a DRAFT order"
    roles: [Customer, RentalAgent]
    code: 200
    input: []
    output: OrderLine
    side_effects: ["recompute order weather_cancellable; increment RentalOrder.version by 1"]

  - method: GET
    path: "/orders/{order_id}/quote"
    description: "Computed read: preview rental_subtotal, delivery_fee, cleaning, deposit, grand_total without confirming"
    roles: [Customer, RentalAgent]
    code: 200
    input: []
    output: "{ order_id: string, rental_subtotal_cents: integer, delivery_fee_cents: integer, cleaning_fee_total_cents: integer, deposit_total_cents: integer, grand_total_cents: integer }"
    side_effects: []

  - method: POST
    path: "/orders/{order_id}/confirm"
    description: "Confirm a draft order: reserve inventory, compute totals, hold deposit"
    roles: [Customer, RentalAgent]
    code: 200
    input: [expected_order_version]
    output: RentalOrder
    side_effects:
      - "booking_status DRAFT->CONFIRMED; lines PENDING->RESERVED with reserved windows"
      - "settlement_status UNSETTLED->DEPOSIT_HELD; DepositLedgerEntry kind=HOLD appended"
      - "compute rental_subtotal_cents, delivery_fee_cents, cleaning_fee_total_cents, deposit_total_cents, grand_total_cents"
      - "increments RentalOrder.version by 1"

  - method: POST
    path: "/orders/{order_id}/fulfill"
    description: "Mark order fulfilled (goods released to customer)"
    roles: [RentalAgent]
    code: 200
    input: []
    output: RentalOrder
    side_effects: ["booking_status CONFIRMED->FULFILLED", "increments RentalOrder.version by 1"]

  - method: POST
    path: "/orders/{order_id}/return"
    description: "Mark order returned (goods back at yard)"
    roles: [RentalAgent]
    code: 200
    input: []
    output: RentalOrder
    side_effects: ["booking_status FULFILLED->RETURNED; lines RESERVED->RELEASED", "increments RentalOrder.version by 1"]

  - method: POST
    path: "/orders/{order_id}/cancel"
    description: "Cancel a draft or confirmed order"
    roles: [Customer, RentalAgent]
    code: 200
    input: [expected_order_version]
    output: RentalOrder
    side_effects:
      - "booking_status -> CANCELLED; non-RELEASED lines -> RELEASED; SCHEDULED/ATTEMPTED runs -> CANCELLED"
      - "if DEPOSIT_HELD: settlement_status -> DEPOSIT_RELEASED, RELEASE ledger entry, credit Customer.account_credit_cents"
      - "increments RentalOrder.version by 1"

  - method: POST
    path: "/orders/{order_id}/weather-cancel"
    description: "Weather cancellation (requires matching WARNING WeatherEvent)"
    roles: [Customer, RentalAgent]
    code: 200
    input: []
    output: RentalOrder
    side_effects:
      - "booking_status -> CANCELLED; lines -> RELEASED; runs -> CANCELLED"
      - "compute weather_refund_cents; credit Customer.account_credit_cents; release held deposit"
      - "increments RentalOrder.version by 1"

  # ---- Deposit ----
  - method: POST
    path: "/orders/{order_id}/deposit/settle"
    description: "Settle the held deposit: RELEASE in full, or FORFEIT a portion (remainder released)"
    roles: [DepositAdjuster]
    code: 200
    input: [disposition, expected_order_version, "forfeit_amount_cents?", "reason?"]
    output: RentalOrder
    side_effects:
      - "RELEASE: settlement_status DEPOSIT_HELD->DEPOSIT_RELEASED; RELEASE ledger; credit customer"
      - "FORFEIT: DEPOSIT_HELD->DEPOSIT_FORFEITED; FORFEIT ledger + RELEASE remainder; credit customer remainder"
      - "increments RentalOrder.version by 1"

  - method: GET
    path: "/orders/{id}/deposit-ledger"
    description: "List the append-only deposit ledger entries for an order (created_at ASC) — FK reverse-reachability for DepositLedgerEntry.order_id"
    roles: [RentalAgent, DepositAdjuster, Customer]
    code: 200
    input: ["limit?", "offset?"]
    output: DepositLedgerEntry[]
    side_effects: []

  # ---- Crew & DeliveryRun ----
  - method: POST
    path: "/crews"
    description: "Create a delivery crew"
    roles: [RentalAgent]
    code: 201
    input: [name, "turnaround_minutes?"]
    output: Crew
    side_effects: []

  - method: GET
    path: "/crews/{crew_id}"
    description: "Get a crew"
    roles: [RentalAgent]
    code: 200
    input: []
    output: Crew
    side_effects: []

  - method: POST
    path: "/delivery-runs"
    description: "Schedule a delivery/pickup run for an order against a crew"
    roles: [RentalAgent]
    code: 201
    input: [order_id, leg, crew_id, window_start, window_end]
    output: DeliveryRun
    side_effects: ["status=SCHEDULED, attempt_count=0; crew window reserved (overlap+turnaround checked)"]

  - method: GET
    path: "/delivery-runs/{run_id}"
    description: "Get a delivery run"
    roles: [RentalAgent]
    code: 200
    input: []
    output: DeliveryRun
    side_effects: []

  - method: GET
    path: "/delivery-runs"
    description: "List delivery runs (filter by order_id or crew_id) — FK reverse-reachability for DeliveryRun.order_id and DeliveryRun.crew_id"
    roles: [RentalAgent]
    code: 200
    input: ["order_id?", "crew_id?", "limit?", "offset?"]
    output: DeliveryRun[]
    side_effects: []

  - method: POST
    path: "/delivery-runs/{run_id}/attempt"
    description: "Record a delivery attempt outcome (SUCCESS->COMPLETED or FAILED->ATTEMPTED)"
    roles: [RentalAgent]
    code: 200
    input: [outcome]
    output: DeliveryRun
    side_effects: ["SUCCESS: ->COMPLETED; FAILED: ->ATTEMPTED, attempt_count+1"]

  - method: POST
    path: "/delivery-runs/{run_id}/reschedule"
    description: "Reschedule an ATTEMPTED run to a new window"
    roles: [RentalAgent]
    code: 200
    input: [window_start, window_end]
    output: DeliveryRun
    side_effects: ["status ATTEMPTED->SCHEDULED; updates window (overlap+turnaround re-checked)"]

  - method: POST
    path: "/delivery-runs/{run_id}/cancel"
    description: "Cancel a scheduled/attempted run"
    roles: [RentalAgent]
    code: 200
    input: []
    output: DeliveryRun
    side_effects: ["status -> CANCELLED; frees crew window"]

  # ---- WeatherEvent ----
  - method: POST
    path: "/weather-events"
    description: "Post a weather advisory/warning for a zone and date"
    roles: [RentalAgent]
    code: 201
    input: [delivery_zone, severity, effective_date]
    output: WeatherEvent
    side_effects: []

  - method: GET
    path: "/weather-events"
    description: "List weather events (filter by delivery_zone)"
    roles: [RentalAgent, Customer]
    code: 200
    input: ["delivery_zone?", "limit?", "offset?"]
    output: WeatherEvent[]
    side_effects: []

# =============================================================================
# §1.6 Error Code Catalog
# =============================================================================
errors:
  - { id: ERR_UNAUTHENTICATED, http: 401, condition: "Missing/invalid X-User-Role or X-User-ID headers" }
  - { id: ERR_UNAUTHORIZED, http: 403, condition: "Acting role not permitted for this operation" }
  - { id: ERR_NOT_RESOURCE_OWNER, http: 403, condition: "Customer acting on an order/venue they do not own" }
  - { id: ERR_NOT_FOUND, http: 404, condition: "Referenced resource does not exist" }
  - { id: ERR_VALIDATION, http: 400, condition: "Malformed request: missing required field, wrong type, invalid enum value" }
  - { id: ERR_INVALID_STATE, http: 409, condition: "Resource not in a valid state for the requested transition" }
  - { id: ERR_ORDER_EMPTY, http: 422, condition: "Confirm attempted on an order with zero lines" }
  - { id: ERR_COI_REQUIRED, http: 422, condition: "Confirm blocked: a requires_coi line lacks a VALID venue COI over the event window" }
  - { id: ERR_INVENTORY_UNAVAILABLE, http: 409, condition: "Requested quantity + overlapping reserved units exceeds CatalogItem.total_units" }
  - { id: ERR_CREW_WINDOW_CONFLICT, http: 409, condition: "Delivery run window collides with another non-CANCELLED run on the same crew (incl. turnaround buffer)" }
  - { id: ERR_MAX_ATTEMPTS_EXCEEDED, http: 422, condition: "Reschedule attempted after attempt_count > 2" }
  - { id: ERR_DELIVERY_NOT_COMPLETED, http: 409, condition: "Fulfill/return blocked because the required DROP_OFF/PICK_UP run is not COMPLETED" }
  - { id: ERR_NOT_RETURNED, http: 409, condition: "Deposit settle attempted before order is RETURNED" }
  - { id: ERR_FORFEIT_EXCEEDS_HELD, http: 422, condition: "Forfeit amount exceeds the current held deposit balance" }
  - { id: ERR_NO_WEATHER_EVENT, http: 422, condition: "Weather-cancel with no matching WARNING WeatherEvent for the zone and event window" }
  - { id: ERR_VENUE_REQUIRED, http: 422, condition: "DELIVERY order missing a valid customer-owned venue" }
  - { id: ERR_INVALID_COVERAGE_WINDOW, http: 422, condition: "COI coverage_end < coverage_start" }
  - { id: ERR_INVALID_EVENT_WINDOW, http: 422, condition: "Order event_end < event_start" }
  - { id: ERR_STALE_VERSION, http: 412, condition: "expected_order_version does not match RentalOrder.version (OCC)" }
  - { id: ERR_LINE_NOT_DRAFT, http: 409, condition: "Add/remove line attempted on a non-DRAFT order" }
  - { id: ERR_INACTIVE_ITEM, http: 422, condition: "Adding a line for a RETIRED CatalogItem" }

# =============================================================================
# §1.7 RBAC Matrix
# =============================================================================
roles:
  - name: Customer
    description: "End customer who books rentals, manages their own venues/orders, submits COIs, and may self-cancel."
    identity: "entity_backed:Customer"
    exclusive_operations: []
    shared_operations:
      - "POST /customers — self-register"
      - "POST /venues — register own venue"
      - "GET /venues, GET /venues/{id} — own venues"
      - "POST /venues/{id}/certificates — submit COI"
      - "GET /venues/{id}/certificates"
      - "POST /orders — create own order"
      - "GET /orders, GET /orders/{id}, GET /orders/{id}/lines, GET /orders/{id}/quote"
      - "POST /orders/{id}/lines, DELETE /orders/{id}/lines/{lid} — edit own draft"
      - "POST /orders/{id}/confirm — confirm own order"
      - "POST /orders/{id}/cancel — cancel own order"
      - "POST /orders/{id}/weather-cancel — weather-cancel own order"
      - "GET /orders/{id}/deposit-ledger"
      - "GET /catalog-items, GET /catalog-items/{id}, GET /catalog-items/{id}/availability"
      - "GET /weather-events"

  - name: RentalAgent
    description: "Yard operator: manages catalog, crews, delivery runs, COI approvals, fulfillment/return, and weather-event posting. Cannot settle deposits (segregation of duties)."
    identity: "opaque"
    exclusive_operations:
      - "POST /catalog-items — create catalog item"
      - "POST /venues/{id}/certificates/{cid}/approve|reject|revoke — COI decisions"
      - "POST /orders/{id}/fulfill — fulfill order"
      - "POST /orders/{id}/return — return order"
      - "POST /crews — create crew"
      - "GET /crews/{id}"
      - "POST /delivery-runs and run attempt/reschedule/cancel — manage runs"
      - "GET /delivery-runs, GET /delivery-runs/{id}"
      - "POST /weather-events — post advisories"
    shared_operations:
      - "POST /customers, POST /venues — on behalf of a customer"
      - "POST /orders, POST /orders/{id}/lines, DELETE lines, POST /orders/{id}/confirm, /cancel, /weather-cancel"
      - "GET reads across catalog, orders, venues, ledgers"

  - name: DepositAdjuster
    description: "Back-office role that settles deposits (RELEASE/FORFEIT). Segregated from RentalAgent: the role that fulfills/returns goods cannot decide deposit disposition."
    identity: "opaque"
    exclusive_operations:
      - "POST /orders/{id}/deposit/settle — release or forfeit deposit"
    shared_operations:
      - "GET /orders/{id}, GET /orders/{id}/deposit-ledger, GET /orders, GET /customers/{id}"
      - "GET /catalog-items, GET /catalog-items/{id}"
