# =============================================================================
# PRD Benchmark Scaffold — Home Renovation Contractor Bidding
# Difficulty: Expert
# =============================================================================

scenario: |
  Home Renovation Contractor Bidding: project scope/line items, contractor
  matching/qualification, bid submission/comparison, milestone payment schedule,
  change order, lien-waiver collection, escrow/progress draw, review & dispute

domain_name: renovation-contractor-bidding
api_prefix: ""    # flat top-level collections (/projects, /contractors, /bids, ...) — no shared prefix

# -----------------------------------------------------------------------------
# Complexity profile (§0.1–§0.4)
# -----------------------------------------------------------------------------
complexity_profile:
  primary_archetype: multi_party_negotiation     # homeowner ↔ contractors bid/award/agree
  secondary_archetype: ledger_reconciliation     # escrow funded vs released vs retained, two draw algorithms
  complexity_layers:
    - optimistic_concurrency        # OCC on Project.version for award; on Bid.version for change-order
    - cascading_side_effects        # award → reject siblings → schedule generation → escrow init
    - dual_variant_calculation      # provisional vs final draw release; estimated vs scored bid rank
    - derived_field_reconciliation  # escrow balances kept consistent with draws + lien waivers

  entity_topology: hybrid
  # Project is the aggregate root (hierarchical: scope line items, milestones nest under it);
  # Contractor / Bid / ChangeOrder / LienWaiver / Draw / Dispute reference across via FKs (flat).

  state_machine_shape: branching
  # Project: branching with revert (award/reject loop, dispute revert); Bid: cyclic (revise loop);
  # Draw: branching fork (approve vs dispute); Dispute: branching resolve.

  relationship_patterns:
    - one_to_many        # Project → ScopeLineItem, Milestone; Bid → BidLineItem
    - cross_aggregate    # Draw → Milestone, LienWaiver → Contractor, Dispute → Draw
    - polymorphic        # Dispute.subject_type references DRAW | CHANGE_ORDER

  role_model: peer_roles
  # Homeowner owns Projects; Contractor owns Bids/Draws; Escrow agent (opaque) controls funding/release;
  # PlatformAdmin (opaque) qualifies contractors and arbitrates disputes.

  consistency_model: immediate

# =============================================================================
# §1.0 Response Envelope (FIXED — emitted verbatim)
# =============================================================================
response_envelope:
  success: |
    { "meta": { "api_request_id": "req_xxx", "api_request_timestamp": "ISO8601" },
      "response_type": "object" | "array", "data": {} }
  error: |
    { "meta": { ... }, "response_type": "error",
      "data": { "error_id": "ERR_XXX", "message": "..." } }
  pagination_fields: ["limit", "offset", "total_count", "has_more"]
  pagination_defaults: { limit: 10, min: 1, max: 100, offset: 0 }

# =============================================================================
# §1.1 Entity-Relationship Table
# =============================================================================
entities:

  - name: Contractor
    parent: null
    common_fields: true
    fields:
      - name: legal_name
        type: string
        source: input
        description: "Contractor business legal name."
      - name: trade
        type: enum
        source: input
        description: "Primary trade discipline."
        constraints: "one of GENERAL, ELECTRICAL, PLUMBING, HVAC, ROOFING"
      - name: license_number
        type: string
        source: input
        description: "State contractor license number; required for qualification."
      - name: license_expiry
        type: datetime
        source: input
        description: "License expiry timestamp (ISO 8601 UTC). Must be strictly after project bid_deadline to bid."
      - name: insurance_coverage_cents
        type: integer
        source: input
        description: "Liability insurance coverage in cents."
        constraints: ">= 0"
      - name: qualification_status
        type: enum
        source: system
        description: "Qualification lifecycle state."
        default: PENDING
        constraints: "one of PENDING, QUALIFIED, SUSPENDED, REVOKED"
      - name: rating_sum
        type: integer
        source: computed
        description: "Sum of all 1..5 star ratings received across resolved projects; used to compute average_rating."
        default: 0
      - name: rating_count
        type: integer
        source: computed
        description: "Count of ratings received; denominator of average_rating."
        default: 0
      - name: average_rating
        type: number
        source: computed
        description: "rating_sum / rating_count rounded to 2 dp, or 0 when rating_count == 0. Used as bid-ranking tie-break and qualification gate."
        default: 0

  - name: Project
    parent: null
    common_fields: true
    fields:
      - name: homeowner_id
        type: string
        source: input
        description: "FK -> Homeowner.id; owner of the project."
      - name: title
        type: string
        source: input
        description: "Project title."
      - name: budget_cap_cents
        type: integer
        source: input
        description: "Maximum total the homeowner will accept across awarded bid + approved change orders."
        constraints: "> 0"
      - name: bid_deadline
        type: datetime
        source: input
        description: "ISO 8601 UTC. Bids may only be submitted while current clock < bid_deadline."
      - name: required_trade
        type: enum
        source: input
        description: "Trade the awarded contractor must hold."
        constraints: "one of GENERAL, ELECTRICAL, PLUMBING, HVAC, ROOFING"
      - name: min_rating
        type: number
        source: input
        description: "Minimum contractor average_rating required to bid (0 means no rating floor)."
        default: 0
        constraints: ">= 0 and <= 5"
      - name: status
        type: enum
        source: system
        description: "Project lifecycle state."
        default: DRAFT
        constraints: "one of DRAFT, OPEN_FOR_BIDS, AWARDED, IN_PROGRESS, COMPLETED, DISPUTED, CANCELLED"
      - name: awarded_bid_id
        type: string
        source: system
        description: "FK -> Bid.id; set on award, null until then."
        default: null
      - name: contract_value_cents
        type: integer
        source: computed
        description: "Awarded bid total_cents + sum of APPROVED ChangeOrder.delta_cents. 0 until award. Drives escrow funding target."
        default: 0
      - name: scope_locked
        type: boolean
        source: system
        description: "True once a bid is awarded; further ScopeLineItem creation is rejected."
        default: false

  - name: Homeowner
    parent: null
    common_fields: true
    fields:
      - name: full_name
        type: string
        source: input
        description: "Homeowner full name."
      - name: email
        type: string
        source: input
        description: "Contact email; unique across homeowners."
        constraints: "unique"

  - name: ScopeLineItem
    parent: Project
    common_fields: true
    fields:
      - name: project_id
        type: string
        source: input
        description: "FK -> Project.id; the project this scope item belongs to."
      - name: description
        type: string
        source: input
        description: "Work description for this scope line."
      - name: quantity
        type: number
        source: input
        description: "Quantity of the unit of work."
        constraints: "> 0"
      - name: unit
        type: enum
        source: input
        description: "Unit of measure."
        constraints: "one of SQFT, UNIT, HOUR, LUMP"
      - name: estimated_unit_cost_cents
        type: integer
        source: input
        description: "Homeowner's estimated cost per unit, in cents."
        constraints: ">= 0"
      - name: estimated_total_cents
        type: integer
        source: computed
        description: "round_half_up(quantity * estimated_unit_cost_cents) per line; summed by the project estimate calculation."

  - name: Bid
    parent: null
    common_fields: true
    fields:
      - name: project_id
        type: string
        source: input
        description: "FK -> Project.id; the project this bid targets."
      - name: contractor_id
        type: string
        source: input
        description: "FK -> Contractor.id; the bidding contractor."
      - name: total_cents
        type: integer
        source: computed
        description: "Sum over BidLineItem of round_half_up(quantity * unit_price_cents); recomputed on every line add."
        default: 0
      - name: duration_days
        type: integer
        source: input
        description: "Proposed project duration in days; lower is ranked better."
        constraints: "> 0"
      - name: status
        type: enum
        source: system
        description: "Bid lifecycle state."
        default: DRAFT
        constraints: "one of DRAFT, SUBMITTED, REVISING, AWARDED, REJECTED, WITHDRAWN"
      - name: rank_score
        type: number
        source: computed
        description: "Weighted bid score; lower is better. See calculations.bid_rank_score. Recomputed at award time over SUBMITTED bids."
        default: 0

  - name: BidLineItem
    parent: Bid
    common_fields: true
    fields:
      - name: bid_id
        type: string
        source: input
        description: "FK -> Bid.id; the bid this line belongs to."
      - name: scope_line_item_id
        type: string
        source: input
        description: "FK -> ScopeLineItem.id; the scope line this bid line prices."
      - name: quantity
        type: number
        source: input
        description: "Quantity the contractor commits to for this line."
        constraints: "> 0"
      - name: unit_price_cents
        type: integer
        source: input
        description: "Contractor's price per unit, in cents."
        constraints: ">= 0"
      - name: line_total_cents
        type: integer
        source: computed
        description: "round_half_up(quantity * unit_price_cents) for this line."

  - name: Milestone
    parent: Project
    common_fields: true
    fields:
      - name: project_id
        type: string
        source: input
        description: "FK -> Project.id; the project this milestone belongs to."
      - name: sequence
        type: integer
        source: input
        description: "1-based ordinal; draws must be requested in ascending sequence order."
        constraints: ">= 1, unique within project"
      - name: title
        type: string
        source: input
        description: "Milestone title."
      - name: release_pct
        type: number
        source: input
        description: "Percent of contract_value released when this milestone is approved, as a fraction (0.30 = 30%). Sum across a project's milestones must equal 1.0."
        constraints: "> 0 and <= 1"
      - name: status
        type: enum
        source: system
        description: "Milestone lifecycle state."
        default: PENDING
        constraints: "one of PENDING, DRAW_REQUESTED, APPROVED, PAID, DISPUTED"

  - name: Escrow
    parent: null
    common_fields: true
    fields:
      - name: project_id
        type: string
        source: input
        description: "FK -> Project.id; the single escrow account backing this project (1:1)."
      - name: funded_cents
        type: integer
        source: computed
        description: "Total deposited by the homeowner into escrow."
        default: 0
      - name: released_cents
        type: integer
        source: computed
        description: "Total paid out to the contractor across PAID milestones (net of retainage)."
        default: 0
      - name: retained_cents
        type: integer
        source: computed
        description: "Cumulative retainage held back across approved draws; released only on final-draw retainage release."
        default: 0
      - name: available_cents
        type: integer
        source: computed
        description: "funded_cents - released_cents - retained_cents. Invariant: never negative."
        default: 0
      - name: status
        type: enum
        source: system
        description: "Escrow lifecycle state."
        default: UNFUNDED
        constraints: "one of UNFUNDED, FUNDED, CLOSED"

  - name: Draw
    parent: null
    common_fields: true
    fields:
      - name: project_id
        type: string
        source: input
        description: "FK -> Project.id; the project this draw is against."
      - name: milestone_id
        type: string
        source: input
        description: "FK -> Milestone.id; the milestone the draw funds."
      - name: contractor_id
        type: string
        source: system
        description: "FK -> Contractor.id; copied from the project's awarded bid contractor at request time."
      - name: gross_amount_cents
        type: integer
        source: computed
        description: "round_half_up(Project.contract_value_cents * Milestone.release_pct) at draw-request time."
        default: 0
      - name: retainage_cents
        type: integer
        source: computed
        description: "round_half_up(gross_amount_cents * RETAINAGE_PCT) for non-final draws; 0 for the final-sequence milestone draw."
        default: 0
      - name: net_release_cents
        type: integer
        source: computed
        description: "gross_amount_cents - retainage_cents; paid to the contractor on approval."
        default: 0
      - name: lien_waiver_id
        type: string
        source: system
        description: "FK -> LienWaiver.id; the conditional waiver attached at request time, null until then."
        default: null
      - name: status
        type: enum
        source: system
        description: "Draw lifecycle state."
        default: REQUESTED
        constraints: "one of REQUESTED, APPROVED, PAID, REJECTED, DISPUTED"

  - name: LienWaiver
    parent: null
    common_fields: true
    fields:
      - name: project_id
        type: string
        source: input
        description: "FK -> Project.id; the project the waiver covers."
      - name: contractor_id
        type: string
        source: input
        description: "FK -> Contractor.id; the waiving contractor."
      - name: draw_id
        type: string
        source: input
        description: "FK -> Draw.id; the draw this waiver is tied to."
      - name: waiver_type
        type: enum
        source: input
        description: "CONDITIONAL is filed at draw request; UNCONDITIONAL is filed after payment to release retainage eligibility."
        constraints: "one of CONDITIONAL, UNCONDITIONAL"
      - name: amount_cents
        type: integer
        source: input
        description: "Dollar amount (cents) the waiver covers; must equal the draw's net_release_cents."
        constraints: ">= 0"
      - name: status
        type: enum
        source: system
        description: "Waiver lifecycle state."
        default: COLLECTED
        constraints: "one of COLLECTED, VOIDED"

  - name: ChangeOrder
    parent: null
    common_fields: true
    fields:
      - name: project_id
        type: string
        source: input
        description: "FK -> Project.id; the in-progress project being modified."
      - name: bid_id
        type: string
        source: input
        description: "FK -> Bid.id; the awarded bid this change order amends."
      - name: description
        type: string
        source: input
        description: "Description of the scope change."
      - name: delta_cents
        type: integer
        source: input
        description: "Signed cost delta in cents; positive increases contract_value, negative decreases it."
      - name: status
        type: enum
        source: system
        description: "Change order lifecycle state."
        default: PROPOSED
        constraints: "one of PROPOSED, APPROVED, REJECTED"

  - name: Dispute
    parent: null
    common_fields: true
    fields:
      - name: project_id
        type: string
        source: input
        description: "FK -> Project.id; the disputed project."
      - name: subject_type
        type: enum
        source: input
        description: "Polymorphic subject discriminator."
        constraints: "one of DRAW, CHANGE_ORDER"
      - name: subject_id
        type: string
        source: input
        description: "FK -> Draw.id; the disputed draw (only DRAW subjects are persisted in this scaffold; subject_type pins interpretation)."
      - name: raised_by
        type: enum
        source: input
        description: "Which party raised the dispute."
        constraints: "one of HOMEOWNER, CONTRACTOR"
      - name: reason
        type: string
        source: input
        description: "Free-text dispute reason."
      - name: resolution
        type: enum
        source: system
        description: "Arbitration outcome."
        default: null
        constraints: "one of UPHELD, OVERTURNED (null while OPEN)"
      - name: status
        type: enum
        source: system
        description: "Dispute lifecycle state."
        default: OPEN
        constraints: "one of OPEN, RESOLVED"

# =============================================================================
# §1.2 State Machine Table
# =============================================================================
state_machines:

  - entity: Contractor
    initial_state: PENDING
    terminal_states: [REVOKED]
    transitions:
      - from: PENDING
        to: QUALIFIED
        trigger: "POST /contractors/{id}/qualify"
        actor: PlatformAdmin
        preconditions:
          - "license_number is non-empty"
          - "license_expiry is in the future relative to current clock"
          - "insurance_coverage_cents >= 1000000 (MIN_INSURANCE_CENTS = $10,000.00)"
        side_effects:
          - "set qualification_status = QUALIFIED"
      - from: QUALIFIED
        to: SUSPENDED
        trigger: "POST /contractors/{id}/suspend"
        actor: PlatformAdmin
        preconditions: []
        side_effects:
          - "set qualification_status = SUSPENDED"
      - from: SUSPENDED
        to: QUALIFIED
        trigger: "POST /contractors/{id}/qualify"
        actor: PlatformAdmin
        preconditions:
          - "license_expiry is in the future relative to current clock"
          - "insurance_coverage_cents >= 1000000 (MIN_INSURANCE_CENTS = $10,000.00)"
        side_effects:
          - "set qualification_status = QUALIFIED"
      - from: SUSPENDED
        to: REVOKED
        trigger: "POST /contractors/{id}/revoke"
        actor: PlatformAdmin
        preconditions: []
        side_effects:
          - "set qualification_status = REVOKED"

  - entity: Project
    initial_state: DRAFT
    terminal_states: [COMPLETED, CANCELLED]
    transitions:
      - from: DRAFT
        to: OPEN_FOR_BIDS
        trigger: "POST /projects/{id}/open"
        actor: Homeowner
        preconditions:
          - "at least one ScopeLineItem exists for the project"
          - "at least one Milestone exists and the sum of Milestone.release_pct == 1.0"
          - "current clock < bid_deadline"
        side_effects:
          - "set status = OPEN_FOR_BIDS"
      - from: OPEN_FOR_BIDS
        to: AWARDED
        trigger: "POST /projects/{id}/award"
        actor: Homeowner
        preconditions:
          - "expected_project_version matches Project.version (OCC)"
          - "the named bid belongs to this project and is in status SUBMITTED"
          - "the named bid's total_cents <= budget_cap_cents"
        side_effects:
          - "set awarded_bid_id = the named bid"
          - "transition named bid DRAFT/SUBMITTED -> AWARDED"
          - "CASCADE: every other Bid on this project in status SUBMITTED or REVISING transitions to REJECTED"
          - "set scope_locked = true"
          - "recompute contract_value_cents = awarded bid total_cents (no change orders yet)"
          - "create Escrow for the project in status UNFUNDED with all amount fields 0"
          - "increments Project.version by 1"
      - from: AWARDED
        to: IN_PROGRESS
        trigger: "POST /escrows/{id}/fund"
        actor: EscrowAgent
        preconditions:
          - "Escrow.status == UNFUNDED"
          - "deposit_cents == Project.contract_value_cents"
        side_effects:
          - "set Escrow.funded_cents = deposit_cents and Escrow.available_cents = deposit_cents"
          - "set Escrow.status = FUNDED"
          - "BUBBLE: set Project.status = IN_PROGRESS"
      - from: IN_PROGRESS
        to: COMPLETED
        trigger: "POST /projects/{id}/complete"
        actor: Homeowner
        preconditions:
          - "every Milestone of the project is in status PAID"
          - "Escrow.retained_cents == 0 (all retainage released)"
        side_effects:
          - "set status = COMPLETED"
          - "set Escrow.status = CLOSED"
      - from: IN_PROGRESS
        to: DISPUTED
        trigger: "POST /disputes (subject draw on this project)"
        actor: Homeowner
        preconditions:
          - "the subject Draw belongs to this project and is in status REQUESTED or APPROVED"
        side_effects:
          - "set Project.status = DISPUTED"
          - "CASCADE: set the subject Draw.status = DISPUTED"
          - "CASCADE: set the Draw's Milestone.status = DISPUTED"
      - from: DISPUTED
        to: IN_PROGRESS
        trigger: "POST /disputes/{id}/resolve"
        actor: PlatformAdmin
        preconditions:
          - "the dispute is OPEN"
        side_effects:
          - "set Dispute.status = RESOLVED and Dispute.resolution = the supplied outcome"
          - "if resolution == OVERTURNED: CASCADE Draw.status DISPUTED -> REJECTED, and Milestone.status DISPUTED -> PENDING, and VOID the draw's CONDITIONAL LienWaiver"
          - "if resolution == UPHELD: CASCADE Draw.status DISPUTED -> APPROVED, and Milestone.status DISPUTED -> APPROVED"
          - "set Project.status = IN_PROGRESS"
      - from: OPEN_FOR_BIDS
        to: CANCELLED
        trigger: "POST /projects/{id}/cancel"
        actor: Homeowner
        preconditions:
          - "Project.status == OPEN_FOR_BIDS"
        side_effects:
          - "set status = CANCELLED"
          - "CASCADE: every Bid on this project in SUBMITTED or REVISING -> REJECTED"

  - entity: Bid
    initial_state: DRAFT
    terminal_states: [AWARDED, REJECTED, WITHDRAWN]
    transitions:
      - from: DRAFT
        to: SUBMITTED
        trigger: "POST /bids/{id}/submit"
        actor: Contractor
        preconditions:
          - "the Project is in status OPEN_FOR_BIDS"
          - "current clock < Project.bid_deadline"
          - "the Contractor.qualification_status == QUALIFIED"
          - "Contractor.trade == Project.required_trade"
          - "Contractor.average_rating >= Project.min_rating"
          - "Contractor.license_expiry > Project.bid_deadline"
          - "at least one BidLineItem exists"
          - "every ScopeLineItem of the project is priced by exactly one BidLineItem"
        side_effects:
          - "set status = SUBMITTED"
      - from: SUBMITTED
        to: REVISING
        trigger: "POST /bids/{id}/revise"
        actor: Contractor
        preconditions:
          - "the Project is still OPEN_FOR_BIDS"
          - "current clock < Project.bid_deadline"
        side_effects:
          - "set status = REVISING"
      - from: REVISING
        to: SUBMITTED
        trigger: "POST /bids/{id}/submit"
        actor: Contractor
        preconditions:
          - "the Project is still OPEN_FOR_BIDS"
          - "current clock < Project.bid_deadline"
          - "every ScopeLineItem of the project is priced by exactly one BidLineItem"
        side_effects:
          - "set status = SUBMITTED"
          - "recompute total_cents from current BidLineItem set"
        note: "Cyclic revise loop SUBMITTED -> REVISING -> SUBMITTED."
      - from: SUBMITTED
        to: WITHDRAWN
        trigger: "POST /bids/{id}/withdraw"
        actor: Contractor
        preconditions:
          - "the Project is not yet AWARDED"
        side_effects:
          - "set status = WITHDRAWN"
      - from: SUBMITTED
        to: AWARDED
        trigger: "POST /projects/{id}/award (this bid is the named winner)"
        actor: Homeowner
        preconditions:
          - "see Project OPEN_FOR_BIDS -> AWARDED preconditions"
        side_effects:
          - "set status = AWARDED"
      - from: SUBMITTED
        to: REJECTED
        trigger: "system: project award cascade or project cancel"
        actor: system
        preconditions:
          - "a sibling bid was awarded on the same project, or the project was cancelled"
        side_effects:
          - "set status = REJECTED"
      - from: REVISING
        to: REJECTED
        trigger: "system: project award cascade or project cancel"
        actor: system
        preconditions:
          - "a sibling bid was awarded on the same project, or the project was cancelled"
        side_effects:
          - "set status = REJECTED"

  - entity: Milestone
    initial_state: PENDING
    terminal_states: [PAID]
    transitions:
      - from: PENDING
        to: DRAW_REQUESTED
        trigger: "POST /draws (for this milestone)"
        actor: Contractor
        preconditions:
          - "Project.status == IN_PROGRESS"
          - "this is the lowest-sequence Milestone of the project still in status PENDING"
          - "a CONDITIONAL LienWaiver with amount_cents == the draw net_release_cents is included in the request"
        side_effects:
          - "set Milestone.status = DRAW_REQUESTED"
          - "create the Draw in status REQUESTED with computed amounts"
          - "create the CONDITIONAL LienWaiver in status COLLECTED, linked to the Draw"
      - from: DRAW_REQUESTED
        to: APPROVED
        trigger: "POST /draws/{id}/approve"
        actor: Homeowner
        preconditions:
          - "the Draw is in status REQUESTED"
          - "Escrow.available_cents >= the Draw.gross_amount_cents"
        side_effects:
          - "set Draw.status = APPROVED and Milestone.status = APPROVED"
          - "move Draw.retainage_cents from Escrow.available_cents to Escrow.retained_cents"
      - from: APPROVED
        to: PAID
        trigger: "POST /draws/{id}/pay"
        actor: EscrowAgent
        preconditions:
          - "the Draw is in status APPROVED"
          - "an UNCONDITIONAL LienWaiver for this draw with amount_cents == net_release_cents has been collected"
        side_effects:
          - "set Draw.status = PAID and Milestone.status = PAID"
          - "move Draw.net_release_cents from Escrow.available_cents to Escrow.released_cents"
          - "if this is the final-sequence milestone: release retainage — set Escrow.released_cents += Escrow.retained_cents, Escrow.retained_cents = 0"
      - from: DRAW_REQUESTED
        to: PENDING
        trigger: "POST /draws/{id}/reject"
        actor: Homeowner
        preconditions:
          - "the Draw is in status REQUESTED"
        side_effects:
          - "set Draw.status = REJECTED and Milestone.status = PENDING"
          - "VOID the Draw's CONDITIONAL LienWaiver (status -> VOIDED)"
      - from: DRAW_REQUESTED
        to: DISPUTED
        trigger: "POST /disputes (subject = this milestone's draw)"
        actor: Homeowner
        preconditions:
          - "see Project IN_PROGRESS -> DISPUTED preconditions"
        side_effects:
          - "set Milestone.status = DISPUTED (driven by the project dispute cascade)"

  - entity: Draw
    initial_state: REQUESTED
    terminal_states: [PAID, REJECTED]
    transitions:
      - from: REQUESTED
        to: APPROVED
        trigger: "POST /draws/{id}/approve"
        actor: Homeowner
        preconditions:
          - "Escrow.available_cents >= gross_amount_cents"
        side_effects:
          - "see Milestone DRAW_REQUESTED -> APPROVED side effects"
      - from: APPROVED
        to: PAID
        trigger: "POST /draws/{id}/pay"
        actor: EscrowAgent
        preconditions:
          - "an UNCONDITIONAL LienWaiver for this draw exists with amount_cents == net_release_cents"
        side_effects:
          - "see Milestone APPROVED -> PAID side effects"
      - from: REQUESTED
        to: REJECTED
        trigger: "POST /draws/{id}/reject"
        actor: Homeowner
        preconditions:
          - "the Draw is REQUESTED"
        side_effects:
          - "see Milestone DRAW_REQUESTED -> PENDING side effects"
      - from: REQUESTED
        to: DISPUTED
        trigger: "POST /disputes (subject = this draw)"
        actor: Homeowner
        preconditions: []
        side_effects:
          - "set Draw.status = DISPUTED (project dispute cascade)"
      - from: APPROVED
        to: DISPUTED
        trigger: "POST /disputes (subject = this draw)"
        actor: Homeowner
        preconditions: []
        side_effects:
          - "set Draw.status = DISPUTED (project dispute cascade)"
      - from: DISPUTED
        to: APPROVED
        trigger: "POST /disputes/{id}/resolve (UPHELD)"
        actor: PlatformAdmin
        preconditions:
          - "the dispute is OPEN and resolution == UPHELD"
        side_effects:
          - "restore Draw.status = APPROVED and Milestone.status = APPROVED"
      - from: DISPUTED
        to: REJECTED
        trigger: "POST /disputes/{id}/resolve (OVERTURNED)"
        actor: PlatformAdmin
        preconditions:
          - "the dispute is OPEN and resolution == OVERTURNED"
        side_effects:
          - "set Draw.status = REJECTED, Milestone.status = PENDING"
          - "if the draw was APPROVED before dispute: return Draw.retainage_cents from Escrow.retained_cents to Escrow.available_cents"
          - "VOID the Draw's CONDITIONAL LienWaiver"

  - entity: ChangeOrder
    initial_state: PROPOSED
    terminal_states: [APPROVED, REJECTED]
    transitions:
      - from: PROPOSED
        to: APPROVED
        trigger: "POST /change-orders/{id}/approve"
        actor: Homeowner
        preconditions:
          - "Project.status == IN_PROGRESS"
          - "expected_bid_version matches the awarded Bid.version (OCC)"
          - "Project.contract_value_cents + delta_cents <= Project.budget_cap_cents"
          - "Project.contract_value_cents + delta_cents >= Escrow.released_cents + Escrow.retained_cents"
        side_effects:
          - "set status = APPROVED"
          - "recompute Project.contract_value_cents += delta_cents"
          - "increments Bid.version by 1 (awarded bid)"
      - from: PROPOSED
        to: REJECTED
        trigger: "POST /change-orders/{id}/reject"
        actor: Homeowner
        preconditions:
          - "Project.status == IN_PROGRESS"
        side_effects:
          - "set status = REJECTED"

  - entity: Dispute
    initial_state: OPEN
    terminal_states: [RESOLVED]
    transitions:
      - from: OPEN
        to: RESOLVED
        trigger: "POST /disputes/{id}/resolve"
        actor: PlatformAdmin
        preconditions:
          - "the Dispute is OPEN"
          - "resolution is one of UPHELD, OVERTURNED"
        side_effects:
          - "set status = RESOLVED, resolution = the supplied outcome"
          - "see Draw DISPUTED -> APPROVED/REJECTED and Project DISPUTED -> IN_PROGRESS cascades"

# -----------------------------------------------------------------------------
# §1.2.1 Concurrency Rules (OCC on parent version only)
# -----------------------------------------------------------------------------
concurrency_rules:
  - rule_id: award-stale-project
    parent_entity: Project
    write_endpoint: "POST /projects/{id}/award"
    occ_field: "expected_project_version"
    description: |
      Awarding a bid against a Project whose version has advanced since the
      client last observed it is rejected. A prior award already moved the
      project out of OPEN_FOR_BIDS and bumped its version, so the current
      client's view of the project is stale.
    error_id: ERR_STALE_PROJECT_VERSION
    http_status: 412

  - rule_id: change-order-stale-bid
    parent_entity: Bid
    write_endpoint: "POST /change-orders/{id}/approve"
    occ_field: "expected_bid_version"
    description: |
      Approving a ChangeOrder carries the awarded Bid version the client last
      saw. A prior change-order approval already adjusted contract_value and
      bumped the awarded Bid's version, so a second approval still carrying the
      old version is rejected as stale.
    error_id: ERR_STALE_BID_VERSION
    http_status: 412

# =============================================================================
# §1.3 Calculation Rules Table
# =============================================================================
calculations:

  - name: bid_line_total
    trigger: "on POST /bids/{id}/line-items and bid total recompute"
    algorithm: aggregation
    formula: |
      line_total_cents = round_half_up(quantity * unit_price_cents)
      Bid.total_cents = sum over all BidLineItem of line_total_cents   # round-per-line then sum
    input_set: "all BidLineItem rows belonging to the bid"
    constants: {}
    precision: "integer cents, round_half_up applied PER LINE before summing"
    variants: []

  - name: project_estimate
    trigger: "GET /projects/{id}/estimate (homeowner's own estimate, independent of bids)"
    algorithm: aggregation
    formula: |
      estimated_total_cents (per ScopeLineItem) = round_half_up(quantity * estimated_unit_cost_cents)
      Project estimate = sum over all ScopeLineItem of estimated_total_cents   # round-per-line then sum
    input_set: "all ScopeLineItem rows belonging to the project"
    constants: {}
    precision: "integer cents, round_half_up PER LINE then sum (same pinned order as bid_line_total)"
    variants: []

  - name: bid_rank_score
    trigger: "computed over SUBMITTED bids when award comparison is requested or award occurs"
    algorithm: weighted_scoring
    formula: |
      # Lower score is better. Normalize each bid against the SUBMITTED pool.
      min_total    = min(total_cents)    over SUBMITTED bids on the project
      max_total    = max(total_cents)    over SUBMITTED bids on the project
      min_duration = min(duration_days)  over SUBMITTED bids on the project
      max_duration = max(duration_days)  over SUBMITTED bids on the project
      price_norm    = 0 if max_total == min_total
                      else (total_cents - min_total) / (max_total - min_total)
      duration_norm = 0 if max_duration == min_duration
                      else (duration_days - min_duration) / (max_duration - min_duration)
      rating_norm   = (5 - contractor.average_rating) / 5     # higher rating -> lower (better) score
      rank_score = round_half_up_to_4dp(
                     PRICE_WEIGHT*price_norm
                   + DURATION_WEIGHT*duration_norm
                   + RATING_WEIGHT*rating_norm )
      # winner = lowest rank_score; tie-break: lower total_cents, then earlier Bid.created_at
    input_set: "Bid rows on the project in status SUBMITTED (REVISING/DRAFT/WITHDRAWN excluded)"
    constants:
      PRICE_WEIGHT: 0.5
      DURATION_WEIGHT: 0.3
      RATING_WEIGHT: 0.2
    precision: "rank_score 4 decimal places round_half_up; tie-break lower total_cents then earlier created_at ASC"
    variants:
      - name: estimated_rank
        when: "GET /projects/{id}/bid-comparison while OPEN_FOR_BIDS"
        difference: "Pool is the current SUBMITTED set at read time; advisory only, not persisted."
      - name: award_rank
        when: "POST /projects/{id}/award"
        difference: "Pool is frozen at the SUBMITTED set at award time; rank_score persisted on each bid; named winner need not be the lowest score (homeowner may override), but comparison is recorded."

  - name: draw_release_amounts
    trigger: "on POST /draws (draw creation) — provisional; and on draw approval — final"
    algorithm: forward_looking
    formula: |
      gross_amount_cents = round_half_up(Project.contract_value_cents * Milestone.release_pct)
      is_final = (Milestone.sequence == max(sequence) over the project's milestones)
      retainage_cents = 0 if is_final else round_half_up(gross_amount_cents * RETAINAGE_PCT)
      net_release_cents = gross_amount_cents - retainage_cents
    input_set: "single Draw against one Milestone; contract_value_cents read at the trigger instant"
    constants:
      RETAINAGE_PCT: 0.10
    precision: "integer cents, round_half_up; retainage rounded then subtracted (round-then-subtract pinned)"
    variants:
      - name: provisional_at_request
        when: "at POST /draws"
        difference: "gross/retainage/net computed from contract_value_cents AS OF the request instant; persisted on the Draw and frozen — later change orders do NOT re-open already-requested draws."
      - name: final_at_approval
        when: "at POST /draws/{id}/approve"
        difference: "amounts are re-read from the Draw (frozen at request); approval moves money but does NOT recompute amounts. A change order approved between request and approval therefore does not alter this draw."

  - name: escrow_available
    trigger: "recomputed after every escrow-affecting transition (fund, approve, pay, dispute-resolve)"
    algorithm: aggregation
    formula: |
      available_cents = funded_cents - released_cents - retained_cents
      # invariant: available_cents >= 0 at all times; any transition that would
      # drive it negative is rejected before mutation (see validations).
    input_set: "the single Escrow row of the project"
    constants: {}
    precision: "integer cents; exact"
    variants: []

  - name: contractor_average_rating
    trigger: "on POST /projects/{id}/rate-contractor (after COMPLETED)"
    algorithm: aggregation
    formula: |
      rating_sum   += new_stars            # new_stars in 1..5
      rating_count += 1
      average_rating = 0 if rating_count == 0 else round_half_up_to_2dp(rating_sum / rating_count)
    input_set: "all ratings the contractor has received across completed projects"
    constants: {}
    precision: "average_rating 2 decimal places round_half_up"
    variants: []

# =============================================================================
# §1.4 Validation Rules Table (ordered by priority)
# =============================================================================
validations:
  - priority: 1
    category: auth
    check: "X-User-Role and X-User-ID headers present and X-User-Role is a known role"
    error_id: ERR_UNAUTHENTICATED
    http_status: 401
    applies_to: "all except POST /homeowners, POST /contractors"

  - priority: 2
    category: auth
    check: "the role is permitted to perform this operation per §1.7 RBAC"
    error_id: ERR_FORBIDDEN
    http_status: 403
    applies_to: "all"

  - priority: 3
    category: auth
    check: "for entity_backed roles, the acting X-User-ID owns the targeted resource (Homeowner owns Project; Contractor owns Bid/Draw)"
    error_id: ERR_NOT_RESOURCE_OWNER
    http_status: 403
    applies_to: "POST /projects/{id}/*, POST /bids/{id}/*, POST /draws (request)"

  - priority: 4
    category: existence
    check: "every path/body referenced resource exists, validated left-to-right"
    error_id: ERR_NOT_FOUND
    http_status: 404
    applies_to: "all endpoints with path ids or FK body fields"

  - priority: 5
    category: state
    check: "the target resource is in a state from which the requested transition is defined"
    error_id: ERR_INVALID_STATE
    http_status: 409
    applies_to: "all transition endpoints"

  - priority: 6
    category: state
    check: "OCC: expected_project_version / expected_bid_version equals the parent's current version"
    error_id: ERR_STALE_PROJECT_VERSION
    http_status: 412
    applies_to: "POST /projects/{id}/award, POST /change-orders/{id}/approve"

  - priority: 7
    category: business_temporal
    check: "current clock is strictly before Project.bid_deadline for bid submit/revise"
    error_id: ERR_BID_DEADLINE_PASSED
    http_status: 409
    applies_to: "POST /bids/{id}/submit, POST /bids/{id}/revise"

  - priority: 8
    category: business_safety
    check: "the bidding Contractor is QUALIFIED, trade matches required_trade, and license_expiry > bid_deadline"
    error_id: ERR_CONTRACTOR_NOT_QUALIFIED
    http_status: 409
    applies_to: "POST /bids/{id}/submit"

  - priority: 9
    category: business_safety
    check: "Contractor.average_rating >= Project.min_rating"
    error_id: ERR_RATING_BELOW_MINIMUM
    http_status: 409
    applies_to: "POST /bids/{id}/submit"

  - priority: 10
    category: business_referential
    check: "every ScopeLineItem of the project is priced by exactly one BidLineItem (no missing, no duplicate scope coverage)"
    error_id: ERR_INCOMPLETE_SCOPE_COVERAGE
    http_status: 422
    applies_to: "POST /bids/{id}/submit"

  - priority: 11
    category: business_referential
    check: "a CONDITIONAL LienWaiver with amount_cents == draw net_release_cents accompanies the draw request; on pay, an UNCONDITIONAL waiver with the same amount exists"
    error_id: ERR_LIEN_WAIVER_REQUIRED
    http_status: 422
    applies_to: "POST /draws, POST /draws/{id}/pay"

  - priority: 12
    category: business_constraint
    check: "the milestone being drawn is the lowest-sequence PENDING milestone of the project (draws are sequential)"
    error_id: ERR_MILESTONE_OUT_OF_ORDER
    http_status: 409
    applies_to: "POST /draws"

  - priority: 13
    category: business_temporal
    check: "no existing Milestone of the project already occupies the requested sequence ordinal (sequence slots are unique points on the project's milestone schedule)"
    error_id: ERR_MILESTONE_SEQUENCE_TAKEN
    http_status: 409
    applies_to: "POST /projects/{id}/milestones"

  - priority: 14
    category: business_constraint
    check: "the sum of Milestone.release_pct over the project equals exactly 1.0 before opening"
    error_id: ERR_MILESTONE_PCT_INVALID
    http_status: 422
    applies_to: "POST /projects/{id}/open"

  - priority: 15
    category: business_fiscal
    check: "awarded bid total_cents <= Project.budget_cap_cents; for change orders contract_value+delta <= budget_cap_cents and >= released+retained"
    error_id: ERR_BUDGET_EXCEEDED
    http_status: 409
    applies_to: "POST /projects/{id}/award, POST /change-orders/{id}/approve"

  - priority: 16
    category: business_fiscal
    check: "Escrow.available_cents >= the amount this transition would move (gross on approve, deposit must equal contract_value on fund)"
    error_id: ERR_INSUFFICIENT_ESCROW
    http_status: 409
    applies_to: "POST /draws/{id}/approve, POST /escrows/{id}/fund"

  - priority: 17
    category: business_constraint
    check: "request body satisfies field-level constraints (positive quantities, enum membership, release_pct range, deposit equals contract_value)"
    error_id: ERR_INVALID_REQUEST
    http_status: 400
    applies_to: "all POST/PATCH with a body"

# =============================================================================
# §1.5 API Endpoint Table
# =============================================================================
endpoints:

  # ---- Homeowner ----
  - method: POST
    path: "/homeowners"
    description: "Register a homeowner."
    roles: [Anonymous]
    code: 201
    input: [full_name, email]
    output: Homeowner
    side_effects: []
  - method: GET
    path: "/homeowners/{id}"
    description: "Fetch a homeowner."
    roles: [Homeowner, PlatformAdmin]
    code: 200
    input: []
    output: Homeowner
    side_effects: []

  # ---- Contractor ----
  - method: POST
    path: "/contractors"
    description: "Register a contractor (starts PENDING)."
    roles: [Anonymous]
    code: 201
    input: [legal_name, trade, license_number, license_expiry, insurance_coverage_cents]
    output: Contractor
    side_effects: ["Contractor created in qualification_status PENDING"]
  - method: GET
    path: "/contractors/{id}"
    description: "Fetch a contractor."
    roles: [Contractor, Homeowner, PlatformAdmin]
    code: 200
    input: []
    output: Contractor
    side_effects: []
  - method: GET
    path: "/contractors"
    description: "List contractors, optionally filtered."
    roles: [Homeowner, PlatformAdmin]
    code: 200
    input: ["trade?", "qualification_status?", "limit?", "offset?"]
    output: Contractor[]
    side_effects: []
  - method: POST
    path: "/contractors/{id}/qualify"
    description: "Qualify (or re-qualify) a contractor."
    roles: [PlatformAdmin]
    code: 200
    input: []
    output: Contractor
    side_effects: ["qualification_status -> QUALIFIED"]
  - method: POST
    path: "/contractors/{id}/suspend"
    description: "Suspend a qualified contractor."
    roles: [PlatformAdmin]
    code: 200
    input: []
    output: Contractor
    side_effects: ["qualification_status -> SUSPENDED"]
  - method: POST
    path: "/contractors/{id}/revoke"
    description: "Revoke a suspended contractor (terminal)."
    roles: [PlatformAdmin]
    code: 200
    input: []
    output: Contractor
    side_effects: ["qualification_status -> REVOKED"]

  # ---- Project ----
  - method: POST
    path: "/projects"
    description: "Create a project in DRAFT."
    roles: [Homeowner]
    code: 201
    input: ["homeowner_id", "title", "budget_cap_cents", "bid_deadline", "required_trade", "min_rating?"]
    output: Project
    side_effects: ["Project created in DRAFT, contract_value_cents 0, scope_locked false"]
  - method: GET
    path: "/projects/{id}"
    description: "Fetch a project."
    roles: [Homeowner, Contractor, PlatformAdmin]
    code: 200
    input: []
    output: Project
    side_effects: []
  - method: GET
    path: "/projects"
    description: "List projects, optionally filtered by homeowner or awarded bid."
    roles: [Homeowner, Contractor, PlatformAdmin]
    code: 200
    input: ["homeowner_id?", "awarded_bid_id?", "status?", "limit?", "offset?"]
    output: Project[]
    side_effects: []
  - method: POST
    path: "/projects/{id}/scope-line-items"
    description: "Add a scope line item to a DRAFT project."
    roles: [Homeowner]
    code: 201
    input: [description, quantity, unit, estimated_unit_cost_cents]
    output: ScopeLineItem
    side_effects: ["estimated_total_cents computed for the line"]
  - method: GET
    path: "/projects/{id}/scope-line-items"
    description: "List a project's scope line items."
    roles: [Homeowner, Contractor, PlatformAdmin]
    code: 200
    input: []
    output: ScopeLineItem[]
    side_effects: []
  - method: GET
    path: "/scope-line-items/{id}"
    description: "Fetch a single scope line item (registers ScopeLineItem collection segment)."
    roles: [Homeowner, Contractor, PlatformAdmin]
    code: 200
    input: []
    output: ScopeLineItem
    side_effects: []
  - method: GET
    path: "/scope-line-items/{id}/bid-line-items"
    description: "List every BidLineItem that prices this scope line (reverse-reachability for BidLineItem.scope_line_item_id)."
    roles: [Homeowner, Contractor, PlatformAdmin]
    code: 200
    input: []
    output: BidLineItem[]
    side_effects: []
  - method: POST
    path: "/projects/{id}/milestones"
    description: "Add a milestone to a DRAFT project."
    roles: [Homeowner]
    code: 201
    input: [sequence, title, release_pct]
    output: Milestone
    side_effects: []
  - method: GET
    path: "/projects/{id}/milestones"
    description: "List a project's milestones (ascending sequence)."
    roles: [Homeowner, Contractor, PlatformAdmin]
    code: 200
    input: []
    output: Milestone[]
    side_effects: []
  - method: GET
    path: "/projects/{id}/estimate"
    description: "Computed homeowner estimate over scope line items."
    roles: [Homeowner, PlatformAdmin]
    code: 200
    input: []
    output: "{ estimated_total_cents: integer, line_count: integer }"
    side_effects: ["runs project_estimate calculation"]
  - method: POST
    path: "/projects/{id}/open"
    description: "Open a project for bids."
    roles: [Homeowner]
    code: 200
    input: []
    output: Project
    side_effects: ["status DRAFT -> OPEN_FOR_BIDS"]
  - method: GET
    path: "/projects/{id}/bid-comparison"
    description: "Advisory ranked comparison of SUBMITTED bids (estimated_rank variant)."
    roles: [Homeowner, PlatformAdmin]
    code: 200
    input: []
    output: Bid[]
    side_effects: ["runs bid_rank_score estimated_rank variant, not persisted"]
  - method: POST
    path: "/projects/{id}/award"
    description: "Award a named bid; OCC-guarded; rejects siblings, locks scope, inits escrow."
    roles: [Homeowner]
    code: 200
    input: [bid_id, expected_project_version]
    output: Project
    side_effects:
      - "named bid -> AWARDED; sibling SUBMITTED/REVISING bids -> REJECTED"
      - "scope_locked -> true; contract_value_cents = awarded total; Escrow created UNFUNDED"
      - "persists rank_score on the SUBMITTED-pool bids"
      - "increments Project.version by 1"
  - method: POST
    path: "/projects/{id}/cancel"
    description: "Cancel an OPEN_FOR_BIDS project."
    roles: [Homeowner]
    code: 200
    input: []
    output: Project
    side_effects: ["status -> CANCELLED; sibling bids -> REJECTED"]
  - method: POST
    path: "/projects/{id}/complete"
    description: "Complete an IN_PROGRESS project once all milestones PAID and retainage released."
    roles: [Homeowner]
    code: 200
    input: []
    output: Project
    side_effects: ["status -> COMPLETED; Escrow -> CLOSED"]
  - method: POST
    path: "/projects/{id}/rate-contractor"
    description: "Homeowner rates the awarded contractor on a COMPLETED project (1..5)."
    roles: [Homeowner]
    code: 200
    input: [stars]
    output: Contractor
    side_effects: ["updates contractor rating_sum, rating_count, average_rating"]

  # ---- Bid ----
  - method: POST
    path: "/bids"
    description: "Create a DRAFT bid for a project."
    roles: [Contractor]
    code: 201
    input: [project_id, contractor_id, duration_days]
    output: Bid
    side_effects: ["Bid created in DRAFT, total_cents 0"]
  - method: GET
    path: "/bids/{id}"
    description: "Fetch a bid."
    roles: [Contractor, Homeowner, PlatformAdmin]
    code: 200
    input: []
    output: Bid
    side_effects: []
  - method: GET
    path: "/bids"
    description: "List bids, filterable by project or contractor."
    roles: [Contractor, Homeowner, PlatformAdmin]
    code: 200
    input: ["project_id?", "contractor_id?", "status?", "limit?", "offset?"]
    output: Bid[]
    side_effects: []
  - method: POST
    path: "/bids/{id}/line-items"
    description: "Add a priced line for a scope item to a DRAFT/REVISING bid."
    roles: [Contractor]
    code: 201
    input: [scope_line_item_id, quantity, unit_price_cents]
    output: BidLineItem
    side_effects: ["line_total_cents computed; Bid.total_cents recomputed"]
  - method: GET
    path: "/bids/{id}/line-items"
    description: "List a bid's line items."
    roles: [Contractor, Homeowner, PlatformAdmin]
    code: 200
    input: []
    output: BidLineItem[]
    side_effects: []
  - method: POST
    path: "/bids/{id}/submit"
    description: "Submit a DRAFT or REVISING bid."
    roles: [Contractor]
    code: 200
    input: []
    output: Bid
    side_effects: ["status -> SUBMITTED; total_cents recomputed"]
  - method: POST
    path: "/bids/{id}/revise"
    description: "Move a SUBMITTED bid back to REVISING."
    roles: [Contractor]
    code: 200
    input: []
    output: Bid
    side_effects: ["status -> REVISING"]
  - method: POST
    path: "/bids/{id}/withdraw"
    description: "Withdraw a SUBMITTED bid before award."
    roles: [Contractor]
    code: 200
    input: []
    output: Bid
    side_effects: ["status -> WITHDRAWN"]

  # ---- Escrow ----
  - method: GET
    path: "/escrows/{id}"
    description: "Fetch an escrow account."
    roles: [Homeowner, EscrowAgent, PlatformAdmin]
    code: 200
    input: []
    output: Escrow
    side_effects: []
  - method: GET
    path: "/escrows"
    description: "List escrows, filterable by project."
    roles: [Homeowner, EscrowAgent, PlatformAdmin]
    code: 200
    input: ["project_id?", "status?", "limit?", "offset?"]
    output: Escrow[]
    side_effects: []
  - method: POST
    path: "/escrows/{id}/fund"
    description: "Fund escrow with a deposit equal to contract_value; moves project to IN_PROGRESS."
    roles: [EscrowAgent]
    code: 200
    input: [deposit_cents]
    output: Escrow
    side_effects: ["funded/available set; status FUNDED; Project -> IN_PROGRESS"]

  # ---- Draw ----
  - method: POST
    path: "/draws"
    description: "Contractor requests a milestone draw; computes amounts, files CONDITIONAL waiver."
    roles: [Contractor]
    code: 201
    input: [project_id, milestone_id, conditional_waiver_amount_cents]
    output: Draw
    side_effects:
      - "Draw created REQUESTED with gross/retainage/net computed"
      - "Milestone -> DRAW_REQUESTED; CONDITIONAL LienWaiver created COLLECTED and linked"
  - method: GET
    path: "/draws/{id}"
    description: "Fetch a draw."
    roles: [Contractor, Homeowner, EscrowAgent, PlatformAdmin]
    code: 200
    input: []
    output: Draw
    side_effects: []
  - method: GET
    path: "/draws"
    description: "List draws, filterable by project, milestone, contractor, or attached waiver."
    roles: [Contractor, Homeowner, EscrowAgent, PlatformAdmin]
    code: 200
    input: ["project_id?", "milestone_id?", "contractor_id?", "lien_waiver_id?", "status?", "limit?", "offset?"]
    output: Draw[]
    side_effects: []
  - method: POST
    path: "/draws/{id}/approve"
    description: "Homeowner approves a requested draw; moves retainage to held."
    roles: [Homeowner]
    code: 200
    input: []
    output: Draw
    side_effects: ["Draw -> APPROVED; Milestone -> APPROVED; retainage moved to retained_cents"]
  - method: POST
    path: "/draws/{id}/reject"
    description: "Homeowner rejects a requested draw; voids the conditional waiver."
    roles: [Homeowner]
    code: 200
    input: []
    output: Draw
    side_effects: ["Draw -> REJECTED; Milestone -> PENDING; CONDITIONAL waiver VOIDED"]
  - method: POST
    path: "/draws/{id}/pay"
    description: "Escrow agent pays an approved draw once unconditional waiver collected."
    roles: [EscrowAgent]
    code: 200
    input: []
    output: Draw
    side_effects: ["Draw -> PAID; Milestone -> PAID; net released; final-milestone retainage released"]

  # ---- LienWaiver ----
  - method: POST
    path: "/lien-waivers"
    description: "File an UNCONDITIONAL lien waiver for a paid-pending draw (precondition for pay)."
    roles: [Contractor]
    code: 201
    input: [project_id, contractor_id, draw_id, waiver_type, amount_cents]
    output: LienWaiver
    side_effects: ["LienWaiver created COLLECTED"]
  - method: GET
    path: "/lien-waivers/{id}"
    description: "Fetch a lien waiver."
    roles: [Contractor, Homeowner, EscrowAgent, PlatformAdmin]
    code: 200
    input: []
    output: LienWaiver
    side_effects: []
  - method: GET
    path: "/lien-waivers"
    description: "List lien waivers, filterable by project, contractor, or draw."
    roles: [Contractor, Homeowner, EscrowAgent, PlatformAdmin]
    code: 200
    input: ["project_id?", "contractor_id?", "draw_id?", "waiver_type?", "status?", "limit?", "offset?"]
    output: LienWaiver[]
    side_effects: []

  # ---- ChangeOrder ----
  - method: POST
    path: "/change-orders"
    description: "Propose a change order against the awarded bid of an IN_PROGRESS project."
    roles: [Homeowner, Contractor]
    code: 201
    input: [project_id, bid_id, description, delta_cents]
    output: ChangeOrder
    side_effects: ["ChangeOrder created PROPOSED"]
  - method: GET
    path: "/change-orders/{id}"
    description: "Fetch a change order."
    roles: [Homeowner, Contractor, PlatformAdmin]
    code: 200
    input: []
    output: ChangeOrder
    side_effects: []
  - method: GET
    path: "/change-orders"
    description: "List change orders, filterable by project or bid."
    roles: [Homeowner, Contractor, PlatformAdmin]
    code: 200
    input: ["project_id?", "bid_id?", "status?", "limit?", "offset?"]
    output: ChangeOrder[]
    side_effects: []
  - method: POST
    path: "/change-orders/{id}/approve"
    description: "Approve a change order; OCC on awarded Bid.version; adjusts contract_value."
    roles: [Homeowner]
    code: 200
    input: [expected_bid_version]
    output: ChangeOrder
    side_effects: ["status -> APPROVED; contract_value_cents += delta_cents; increments Bid.version by 1"]
  - method: POST
    path: "/change-orders/{id}/reject"
    description: "Reject a proposed change order."
    roles: [Homeowner]
    code: 200
    input: []
    output: ChangeOrder
    side_effects: ["status -> REJECTED"]

  # ---- Dispute ----
  - method: POST
    path: "/disputes"
    description: "Raise a dispute over a draw; freezes project and draw/milestone."
    roles: [Homeowner, Contractor]
    code: 201
    input: [project_id, subject_type, subject_id, raised_by, reason]
    output: Dispute
    side_effects:
      - "Dispute created OPEN; Project -> DISPUTED"
      - "subject Draw -> DISPUTED; its Milestone -> DISPUTED"
  - method: GET
    path: "/disputes/{id}"
    description: "Fetch a dispute."
    roles: [Homeowner, Contractor, PlatformAdmin]
    code: 200
    input: []
    output: Dispute
    side_effects: []
  - method: GET
    path: "/disputes"
    description: "List disputes, filterable by project or subject draw."
    roles: [Homeowner, Contractor, PlatformAdmin]
    code: 200
    input: ["project_id?", "subject_id?", "status?", "limit?", "offset?"]
    output: Dispute[]
    side_effects: []
  - method: POST
    path: "/disputes/{id}/resolve"
    description: "Admin arbitrates a dispute UPHELD or OVERTURNED; cascades draw/milestone/escrow."
    roles: [PlatformAdmin]
    code: 200
    input: [resolution]
    output: Dispute
    side_effects:
      - "Dispute -> RESOLVED; Project -> IN_PROGRESS"
      - "UPHELD: Draw -> APPROVED, Milestone -> APPROVED"
      - "OVERTURNED: Draw -> REJECTED, Milestone -> PENDING, retainage returned, conditional waiver VOIDED"

  # ---- Test-driving clock endpoint ----
  - method: POST
    path: "/_clock/set_current_utc"
    description: "Set the server's current UTC clock (test-driving; controls bid_deadline gating)."
    roles: [PlatformAdmin]
    code: 200
    input: [to_iso8601]
    output: "{ current_utc: datetime }"
    side_effects: ["server clock set to the supplied instant"]

# =============================================================================
# §1.6 Error Code Catalog
# =============================================================================
errors:
  - id: ERR_UNAUTHENTICATED
    http: 401
    condition: "Missing/invalid X-User-Role or X-User-ID on an authenticated endpoint."
  - id: ERR_FORBIDDEN
    http: 403
    condition: "Role not permitted for the operation per RBAC."
  - id: ERR_NOT_RESOURCE_OWNER
    http: 403
    condition: "entity_backed actor is not the owner of the targeted resource."
  - id: ERR_NOT_FOUND
    http: 404
    condition: "A referenced resource (path id or FK body field) does not exist."
  - id: ERR_INVALID_STATE
    http: 409
    condition: "Target resource is not in a state from which the transition is defined."
  - id: ERR_STALE_PROJECT_VERSION
    http: 412
    condition: "expected_project_version != Project.version at award time."
  - id: ERR_STALE_BID_VERSION
    http: 412
    condition: "expected_bid_version != awarded Bid.version at change-order approval."
  - id: ERR_BID_DEADLINE_PASSED
    http: 409
    condition: "current clock >= Project.bid_deadline on submit/revise."
  - id: ERR_CONTRACTOR_NOT_QUALIFIED
    http: 409
    condition: "Bidder not QUALIFIED, trade mismatch, or license_expiry <= bid_deadline."
  - id: ERR_RATING_BELOW_MINIMUM
    http: 409
    condition: "Contractor.average_rating < Project.min_rating on submit."
  - id: ERR_INCOMPLETE_SCOPE_COVERAGE
    http: 422
    condition: "A submitted bid does not price every scope line exactly once."
  - id: ERR_LIEN_WAIVER_REQUIRED
    http: 422
    condition: "Required CONDITIONAL waiver missing/mismatched on draw request, or UNCONDITIONAL waiver missing on pay."
  - id: ERR_MILESTONE_OUT_OF_ORDER
    http: 409
    condition: "Draw requested for a milestone that is not the lowest-sequence PENDING milestone."
  - id: ERR_MILESTONE_SEQUENCE_TAKEN
    http: 409
    condition: "A milestone with the requested sequence ordinal already exists on the project."
  - id: ERR_MILESTONE_PCT_INVALID
    http: 422
    condition: "Sum of Milestone.release_pct != 1.0 at open."
  - id: ERR_BUDGET_EXCEEDED
    http: 409
    condition: "Awarded total or contract_value+delta exceeds budget_cap, or change order would drop contract_value below released+retained."
  - id: ERR_INSUFFICIENT_ESCROW
    http: 409
    condition: "Escrow.available_cents < amount to move, or fund deposit != contract_value."
  - id: ERR_INVALID_REQUEST
    http: 400
    condition: "Body fails field-level constraints (missing required field, bad enum, non-positive quantity, release_pct out of range)."

# =============================================================================
# §1.7 RBAC Matrix
# =============================================================================
roles:
  - name: Homeowner
    description: "Owns projects; defines scope/milestones, opens, awards, approves/rejects draws and change orders, raises disputes, completes, rates."
    identity: "entity_backed:Homeowner"
    exclusive_operations:
      - "POST /projects"
      - "POST /projects/{id}/scope-line-items"
      - "POST /projects/{id}/milestones"
      - "POST /projects/{id}/open"
      - "POST /projects/{id}/award"
      - "POST /projects/{id}/cancel"
      - "POST /projects/{id}/complete"
      - "POST /projects/{id}/rate-contractor"
      - "GET /projects/{id}/bid-comparison"
      - "POST /draws/{id}/approve"
      - "POST /draws/{id}/reject"
      - "POST /change-orders/{id}/approve"
      - "POST /change-orders/{id}/reject"
    shared_operations:
      - "POST /change-orders (with Contractor)"
      - "POST /disputes (with Contractor)"
      - "GET reads of projects/bids/draws/escrows/waivers/change-orders/disputes"

  - name: Contractor
    description: "Owns bids and draws; submits/revises/withdraws bids, requests draws, files lien waivers."
    identity: "entity_backed:Contractor"
    exclusive_operations:
      - "POST /bids"
      - "POST /bids/{id}/line-items"
      - "POST /bids/{id}/submit"
      - "POST /bids/{id}/revise"
      - "POST /bids/{id}/withdraw"
      - "POST /draws"
      - "POST /lien-waivers"
    shared_operations:
      - "POST /change-orders (with Homeowner)"
      - "POST /disputes (with Homeowner)"
      - "GET reads of own bids/draws/waivers and visible projects"

  - name: EscrowAgent
    description: "Operational role controlling escrow funding and draw payouts; not tied to a persisted entity."
    identity: "opaque"
    exclusive_operations:
      - "POST /escrows/{id}/fund"
      - "POST /draws/{id}/pay"
    shared_operations:
      - "GET reads of escrows/draws/waivers"

  - name: PlatformAdmin
    description: "Operational role: qualifies/suspends/revokes contractors and arbitrates disputes."
    identity: "opaque"
    exclusive_operations:
      - "POST /contractors/{id}/qualify"
      - "POST /contractors/{id}/suspend"
      - "POST /contractors/{id}/revoke"
      - "POST /disputes/{id}/resolve"
      - "POST /_clock/set_current_utc"
    shared_operations:
      - "GET reads across all resources"

  - name: Anonymous
    description: "Unauthenticated registration surface."
    identity: "opaque"
    exclusive_operations:
      - "POST /homeowners"
      - "POST /contractors"
    shared_operations: []
