              captures: { err: "$.data.error_id" }
          assert:
            - "At submission the sale already carries required_bond_cents == 30000000 (max of the 25000000 three-year average and the 30000000 most recent year, under the 300000000 price cap) and bond_period_end_plan_year == 2031, with exemption_status == \"PENDING\", successor_determination == \"PENDING\" and substantial_continuity_score == 0.0000."
            - "Rejection: HTTP 200 with sale_status == \"REJECTED\", exemption_status == \"NOT_EXEMPT\", successor_determination == \"NO_SUCCESSOR_LIABILITY\", adjudicated_at == \"2026-08-01T00:00:00Z\" and substantial_continuity_score still 0.0000."
