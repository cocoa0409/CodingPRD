      - name: sm_cascade_down_station_mark_down_aborts_the_scheduled_cycle_and_spares_the_running_one
        claim_type: "Side effect pattern: Cascade down"
        grounds:
          - state_machines.OvenStation.OPERATIONAL_to_DOWN
          - state_machines.MoldingCycle.SCHEDULED_to_ABORTED
          - state_machines.ResinCharge.RESERVED_to_RELEASED
