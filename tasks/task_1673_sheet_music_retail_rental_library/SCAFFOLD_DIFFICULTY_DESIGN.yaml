        distinguishing_aspect: |
          Pair RentalOrder→RightsAdvisoryCase (different entity pair than PO): dispatching a
          GRAND_RIGHTS work fails with ERR_RIGHTS_NOT_CLEARED while the case is OPEN/PENDING or
          DECIDED with LICENSE_REQUIRED, and succeeds only after a DECIDED+CLEARED determination.
