          One accept flips the deal to RECOUPED and cascade hop 5 must re-rate exactly the
          agreements whose status is in {ACTIVE, AMENDMENT_PENDING, POST_TERM}: the ACTIVE successor
          moves 0.1200 -> 0.1800 and the AMENDMENT_PENDING agreement on a DIFFERENT release of the
          same deal moves 0.1100 -> 0.1900, while the SUPERSEDED predecessor must not move to its
