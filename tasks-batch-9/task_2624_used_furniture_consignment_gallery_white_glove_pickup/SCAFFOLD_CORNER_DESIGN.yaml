              payload: { consignor_id: "${cons_id}", truck_id: "${truck_id}", window_start: "2026-08-01T09:00:00Z", window_end: "2026-08-01T12:00:00Z", crew_size: 2, item_ids: ["${item_id}"] }
              as: LogisticsCoordinator
              as_user_id: "logi-1"
              captures: { job_id: $.data.id }
            - call: "POST /pickup-jobs/${job_id}/complete"
              payload: { actual_stair_flights: 0, actual_elevator_used: false, actual_crew_size: 2 }
              as: LogisticsCoordinator
              as_user_id: "logi-1"
            - call: "POST /consignment-items/${item_id}/receive"
              payload: { photo_surface_score: 7.0, photo_structure_score: 6.5, photo_completeness_score: 6.0 }
              as: FloorOperator
              as_user_id: "floor-1"
            - call: "POST /floor-zones"
              payload: { name: "Front A", zone_type: "SHOWROOM_FRONT", capacity_sqft: 200 }
              as: FloorOperator
              as_user_id: "floor-1"
              captures: { zone_front_id: $.data.id }
            - call: "POST /consignment-items/${item_id}/place"
              payload: { placement_zone_id: "${zone_front_id}", tag_code: "TAG-001" }
              as: FloorOperator
              as_user_id: "floor-1"
            - call: "POST /buyers"
              payload: { display_name: "Nora Vance", email: "nora@example.com", address_line: "9 Kite Rd", floor_number: 2, has_elevator: false }
              as: GalleryManager
              as_user_id: "mgr-1"
              captures: { buyer_id: $.data.id }
            - call: "POST /sales"
              payload: { item_id: "${item_id}", buyer_id: "${buyer_id}", sale_price_cents: 126317 }
              as: FloorOperator
              as_user_id: "floor-1"
              captures: { sale_id: $.data.id }
            - call: "POST /white-glove-crews"
              payload: { name: "GLOVE-1", max_concurrent_jobs: 2 }
              as: LogisticsCoordinator
              as_user_id: "logi-1"
              captures: { crew_id: $.data.id }
            - call: "POST /delivery-orders"
              payload: { sale_id: "${sale_id}", crew_id: "${crew_id}", window_start: "2026-08-01T14:00:00Z", window_end: "2026-08-01T16:00:00Z" }
              as: LogisticsCoordinator
              as_user_id: "logi-2"
              captures: { do_id: $.data.id }
          trigger:
            - call: "POST /delivery-orders/${do_id}/complete"
              payload: { outcome: "REFUSED" }
              as: LogisticsCoordinator
              as_user_id: "logi-2"
          assert:
            - "HTTP 200 and data.status == \"REFUSED\", data.outcome_recorded_at == \"2026-08-01T00:00:00Z\" and data.claim_window_ends_at is null"
            - "data.delivery_fee_cents == 12000 and data.stair_flights == 1 and data.elevator_used == false, all quoted at scheduling and unchanged by the refusal"
            - "GET /sales/${sale_id} reports status == \"REVERSED\" and reversed_at == \"2026-08-01T00:00:00Z\""
            - "GET /consignors/${cons_id}/ledger-entries returns total_count == 3 with the last entry entry_type \"SALE_REVERSAL_DEBIT\" and amount_cents == -69474"
            - "GET /consignors/${cons_id} reports unclaimed_balance_cents == -35000, exactly the pre-sale figure"
            - "GET /consignment-items/${item_id} reports lifecycle_state == \"ON_FLOOR\" (markdown_sequence is 1), placement_zone_id still ${zone_front_id} and current_price_cents == 126317"
            - "GET /floor-zones/${zone_front_id} reports occupied_sqft == 30, never released"

  # ==========================================================================
  # 6. ERRORS
  #
  # Coverage map for all 55 ids in §1.6. "here" means an instance in this
  # section; the other entries name the instance elsewhere in this file, or the
  # §1.8 instance, that already triggers the id.
  #
  #   ERR_UNAUTHENTICATED          here: a_request_with_a_missing_x_user_id_header_returns_unauthenticated
  #   ERR_UNAUTHORIZED             rbac: an_intake_appraiser_cannot_place_a_piece_on_the_floor
  #   ERR_SEGREGATION_OF_DUTIES    rbac: the_screening_appraiser_cannot_perform_the_receiving_inspection
  #   ERR_VALIDATION               entities: item_creation_without_declared_value_cents_is_rejected
  #   ERR_CONSIGNOR_NOT_FOUND      here
  #   ERR_BUYER_NOT_FOUND          here
  #   ERR_SCHEDULE_NOT_FOUND       entities: appending_a_step_to_an_unknown_schedule_is_rejected
  #   ERR_AGREEMENT_NOT_FOUND      entities: item_creation_against_an_unknown_agreement_fk_is_rejected
  #   ERR_ITEM_NOT_FOUND           entities: reading_an_unknown_item_id_returns_not_found
  #   ERR_TRUCK_NOT_FOUND          here
  #   ERR_CREW_NOT_FOUND           here
  #   ERR_ZONE_NOT_FOUND           here
  #   ERR_PICKUP_JOB_NOT_FOUND     here
  #   ERR_SALE_NOT_FOUND           here
  #   ERR_DELIVERY_ORDER_NOT_FOUND here
  #   ERR_CLAIM_NOT_FOUND          here
  #   ERR_AUDIT_NOT_FOUND          here
  #   ERR_STALE_CONSIGNOR_VERSION  cross_cutting: a_stale_expected_consignor_version_is_refused
  #   ERR_STALE_ITEM_VERSION       §1.8: write_off_then_recovery_and_replacement_restores_zone_square_footage
  #   ERR_ITEM_STATE_INVALID       state_machines: placing_a_piece_that_was_never_screened_is_refused
  #   ERR_ITEM_CUSTODY_INVALID     state_machines: selling_a_piece_flagged_missing_is_refused_on_the_custody_dimension
  #   ERR_CONSIGNOR_ESCHEATED      §1.8: escheated_state_p11_beats_payout_minimum_p39
  #   ERR_CONSIGNOR_SUSPENDED      here
  #   ERR_BUYER_BLOCKED            here
  #   ERR_AGREEMENT_NOT_ACTIVE     §1.8: placement_blocked_by_expired_governing_agreement
  #   ERR_AGREEMENT_STATE_INVALID  state_machines: activating_an_already_active_agreement_is_refused
  #   ERR_SALE_ALREADY_REVERSED    §1.8: sale_reversal_returns_the_ledger_to_its_pre_sale_balance
  #   ERR_CLAIM_STATE_INVALID      here
  #   ERR_CLAIM_RESUBMIT_LIMIT     §1.8: damage_claim_info_request_cycle_terminates_on_third_pass
  #   ERR_ELECTION_ROUND_EXHAUSTED here
  #   ERR_PICKUP_JOB_STATE_INVALID state_machines: completing_an_already_completed_pickup_job_is_refused
  #   ERR_AUDIT_STATE_INVALID      here
  #   ERR_ELECTION_DEADLINE_PASSED §1.8: election_deadline_p19_beats_disposition_eligibility_p30
  #   ERR_CLAIM_WINDOW_CLOSED      §1.8: claim_filing_blocked_by_refused_delivery_leaving_the_window_null
  #   ERR_TRUCK_WINDOW_CONFLICT    §1.8: truck_windows_are_closed_intervals_plus_a_forty_five_minute_turnaround
  #   ERR_CREW_CAPACITY_EXCEEDED   §1.8: crew_windows_are_half_open_and_capacity_two_rather_than_one
  #   ERR_WINDOW_ORDER_INVALID     here
  #   ERR_SCHEDULE_STEP_OVERLAP    here
  #   ERR_CLOCK_NOT_MONOTONIC      validations: moving_the_logical_clock_backwards_is_refused
  #   ERR_PHOTOS_INSUFFICIENT      here
  #   ERR_GRADE_REJECTED           here
  #   ERR_LOT_NOT_READY            here
  #   ERR_DUPLICATE_TAG_CODE       here
  #   ERR_DISPOSITION_NOT_ELIGIBLE validations: donating_an_art_piece_is_refused_while_returning_it_is_allowed
  #   ERR_LOT_NESTING_FORBIDDEN    here
  #   ERR_ZONE_CLOSED              here
  #   ERR_TRUCK_CAPACITY_EXCEEDED  here
  #   ERR_ZONE_CAPACITY_EXCEEDED   validations: two_individually_legal_footprints_are_refused_as_a_collective_overflow
  #   ERR_AUDIT_COUNT_INVALID      here
  #   ERR_SALE_BELOW_FLOOR         validations: a_sale_one_cent_under_the_register_floor_is_refused
  #   ERR_CLAIM_EXCEEDS_SALE       here
  #   ERR_PAYOUT_BELOW_MINIMUM     here
  #   ERR_INSUFFICIENT_BALANCE     here
  #   ERR_SCHEDULE_RETIRED         here
  #   ERR_DUPLICATE_EMAIL          here
  # ==========================================================================
  - section: errors
    instances:
      - name: a_request_with_a_missing_x_user_id_header_returns_unauthenticated
        claim_type: error_triggerable
        grounds:
          - validations[priority 1]
          - errors[ERR_UNAUTHENTICATED]
          - roles
        distinguishing_aspect: "Authentication is checked before authorisation: with X-User-Role present and legal but X-User-ID absent the answer is ERR_UNAUTHENTICATED at HTTP 401, not ERR_UNAUTHORIZED at 403 and not ERR_VALIDATION."
        test_recipe:
          setup:
            - "an empty database; no fixture is needed because priority 1 runs before any lookup"
          setup_api_calls: []
          trigger:
            - call: "GET /consignors"
              payload: {}
              as: GalleryManager
              as_user_id: "(no X-User-ID header sent)"
          assert:
            - "HTTP 401 and data.error_id == \"ERR_UNAUTHENTICATED\""
            - "the same call with X-User-ID \"mgr-1\" returns HTTP 200 with total_count == 0"

      - name: reading_an_unknown_consignor_id_returns_consignor_not_found
        claim_type: error_triggerable
        grounds:
          - validations[priority 4]
          - errors[ERR_CONSIGNOR_NOT_FOUND]
        distinguishing_aspect: "A well-formed UUID that names no row answers ERR_CONSIGNOR_NOT_FOUND at HTTP 404, distinct from the 400 an unparseable id would draw."
        test_recipe:
          setup:
            - "an empty database"
          setup_api_calls: []
          trigger:
            - call: "GET /consignors/00000000-0000-4000-8000-000000000001"
              payload: {}
              as: GalleryManager
              as_user_id: "mgr-1"
          assert:
            - "HTTP 404 and data.error_id == \"ERR_CONSIGNOR_NOT_FOUND\""

      - name: reading_an_unknown_buyer_id_returns_buyer_not_found
        claim_type: error_triggerable
        grounds:
          - validations[priority 4]
          - errors[ERR_BUYER_NOT_FOUND]
        distinguishing_aspect: "The buyer aggregate has its own 404 id rather than sharing the consignor's, so the two must not be collapsed into one generic not-found."
        test_recipe:
          setup:
            - "an empty database"
          setup_api_calls: []
          trigger:
            - call: "GET /buyers/00000000-0000-4000-8000-000000000002"
              payload: {}
              as: GalleryManager
              as_user_id: "mgr-1"
          assert:
            - "HTTP 404 and data.error_id == \"ERR_BUYER_NOT_FOUND\""

      - name: reading_an_unknown_truck_id_returns_truck_not_found
        claim_type: error_triggerable
        grounds:
          - validations[priority 4]
          - errors[ERR_TRUCK_NOT_FOUND]
        distinguishing_aspect: "The truck 404 is reachable from a plain read, independently of the pickup-job body path that also raises it."
        test_recipe:
          setup:
            - "an empty database"
          setup_api_calls: []
          trigger:
            - call: "GET /trucks/00000000-0000-4000-8000-000000000003"
              payload: {}
              as: LogisticsCoordinator
              as_user_id: "logi-1"
          assert:
            - "HTTP 404 and data.error_id == \"ERR_TRUCK_NOT_FOUND\""

      - name: reading_an_unknown_crew_id_returns_crew_not_found
        claim_type: error_triggerable
        grounds:
          - validations[priority 4]
          - errors[ERR_CREW_NOT_FOUND]
        distinguishing_aspect: "The crew aggregate carries a distinct 404 id from the truck's, even though both are scheduling resources."
        test_recipe:
          setup:
            - "an empty database"
          setup_api_calls: []
          trigger:
            - call: "GET /white-glove-crews/00000000-0000-4000-8000-000000000004"
              payload: {}
              as: LogisticsCoordinator
              as_user_id: "logi-1"
          assert:
            - "HTTP 404 and data.error_id == \"ERR_CREW_NOT_FOUND\""

      - name: reading_an_unknown_zone_id_returns_zone_not_found
        claim_type: error_triggerable
        grounds:
          - validations[priority 4]
          - errors[ERR_ZONE_NOT_FOUND]
        distinguishing_aspect: "The same id also covers an unknown placement_zone_id in a body, so it must not be specialised to the path form."
        test_recipe:
          setup:
            - "an empty database"
          setup_api_calls: []
          trigger:
            - call: "GET /floor-zones/00000000-0000-4000-8000-000000000005"
              payload: {}
              as: FloorOperator
              as_user_id: "floor-1"
          assert:
            - "HTTP 404 and data.error_id == \"ERR_ZONE_NOT_FOUND\""

      - name: reading_an_unknown_pickup_job_id_returns_pickup_job_not_found
        claim_type: error_triggerable
        grounds:
          - validations[priority 4]
          - errors[ERR_PICKUP_JOB_NOT_FOUND]
        distinguishing_aspect: "The pickup-job 404 must precede any state guard, so an unknown id never answers ERR_PICKUP_JOB_STATE_INVALID."
        test_recipe:
          setup:
            - "an empty database"
          setup_api_calls: []
          trigger:
            - call: "GET /pickup-jobs/00000000-0000-4000-8000-000000000006"
              payload: {}
              as: LogisticsCoordinator
              as_user_id: "logi-1"
          assert:
            - "HTTP 404 and data.error_id == \"ERR_PICKUP_JOB_NOT_FOUND\""

      - name: reading_an_unknown_sale_id_returns_sale_not_found
        claim_type: error_triggerable
        grounds:
          - validations[priority 4]
          - errors[ERR_SALE_NOT_FOUND]
        distinguishing_aspect: "The sale 404 is also the answer for an unknown sale_id in a delivery-order body, so the id is shared across the path and body forms."
        test_recipe:
          setup:
            - "an empty database"
          setup_api_calls: []
          trigger:
            - call: "GET /sales/00000000-0000-4000-8000-000000000007"
              payload: {}
              as: GalleryManager
              as_user_id: "mgr-1"
          assert:
            - "HTTP 404 and data.error_id == \"ERR_SALE_NOT_FOUND\""

      - name: reading_an_unknown_delivery_order_id_returns_delivery_order_not_found
        claim_type: error_triggerable
        grounds:
          - validations[priority 4]
          - errors[ERR_DELIVERY_ORDER_NOT_FOUND]
        distinguishing_aspect: "The delivery-order 404 is distinct from the sale 404 even though a delivery order is always subordinate to a sale."
        test_recipe:
          setup:
            - "an empty database"
          setup_api_calls: []
          trigger:
            - call: "GET /delivery-orders/00000000-0000-4000-8000-000000000008"
              payload: {}
              as: LogisticsCoordinator
              as_user_id: "logi-1"
          assert:
            - "HTTP 404 and data.error_id == \"ERR_DELIVERY_ORDER_NOT_FOUND\""

      - name: reading_an_unknown_claim_id_returns_claim_not_found
        claim_type: error_triggerable
        grounds:
          - validations[priority 4]
          - errors[ERR_CLAIM_NOT_FOUND]
        distinguishing_aspect: "The claim 404 must beat the claim state guard, so an unknown id never answers ERR_CLAIM_STATE_INVALID."
        test_recipe:
          setup:
            - "an empty database"
          setup_api_calls: []
          trigger:
            - call: "GET /damage-claims/00000000-0000-4000-8000-000000000009"
              payload: {}
              as: GalleryManager
              as_user_id: "mgr-1"
          assert:
            - "HTTP 404 and data.error_id == \"ERR_CLAIM_NOT_FOUND\""

      - name: approving_an_unknown_audit_id_returns_audit_not_found
        claim_type: error_triggerable
        grounds:
          - validations[priority 4]
          - errors[ERR_AUDIT_NOT_FOUND]
        distinguishing_aspect: "ShrinkageAudit has no single-row GET, so its 404 is only reachable through the approve-write-off action; the path check must still run before the audit state guard."
        test_recipe:
          setup:
            - "an empty database"
          setup_api_calls: []
          trigger:
            - call: "POST /shrinkage-audits/00000000-0000-4000-8000-000000000010/approve-write-off"
              payload: {}
              as: GalleryManager
              as_user_id: "mgr-1"
          assert:
            - "HTTP 404 and data.error_id == \"ERR_AUDIT_NOT_FOUND\""

      - name: registering_a_second_consignor_on_the_same_email_is_refused
        claim_type: error_triggerable
        grounds:
          - validations[priority 44]
          - errors[ERR_DUPLICATE_EMAIL]
        distinguishing_aspect: "Uniqueness is per kind: a second CONSIGNOR on alpha@example.com is refused with ERR_DUPLICATE_EMAIL at HTTP 409, while a BUYER on the same address is accepted, so the constraint cannot be a single global index."
        test_recipe:
          setup:
            - "one consignor Alpha on alpha@example.com"
          setup_api_calls:
            - call: "POST /consignors"
              payload: { display_name: "Alpha", email: "alpha@example.com", address_line: "1 A St", floor_number: 1, has_elevator: false }
              as: GalleryManager
              as_user_id: "mgr-1"
              captures: { cons_id: $.data.id }
          trigger:
            - call: "POST /consignors"
              payload: { display_name: "Alpha Twin", email: "alpha@example.com", address_line: "2 A St", floor_number: 2, has_elevator: false }
              as: GalleryManager
              as_user_id: "mgr-1"
          assert:
            - "HTTP 409 and data.error_id == \"ERR_DUPLICATE_EMAIL\""
            - "GET /consignors returns total_count == 1"
            - "POST /buyers with email alpha@example.com returns HTTP 201, because the uniqueness scope is the consignor set alone"

      - name: blocking_an_already_blocked_buyer_is_refused
        claim_type: error_triggerable
        grounds:
          - validations[priority 13]
          - errors[ERR_BUYER_BLOCKED]
        distinguishing_aspect: "ERR_BUYER_BLOCKED serves two conditions; this instance drives the idempotency clause, where the second block answers HTTP 409 and leaves version at 2 rather than silently succeeding."
        test_recipe:
          setup:
            - "one buyer Nora, blocked once by mgr-1"
          setup_api_calls:
            - call: "POST /buyers"
              payload: { display_name: "Nora Vance", email: "nora@example.com", address_line: "9 Kite Rd", floor_number: 2, has_elevator: false }
              as: GalleryManager
              as_user_id: "mgr-1"
              captures: { buyer_id: $.data.id }
            - call: "POST /buyers/${buyer_id}/block"
              payload: {}
              as: GalleryManager
              as_user_id: "mgr-1"
          trigger:
            - call: "POST /buyers/${buyer_id}/block"
              payload: {}
              as: GalleryManager
              as_user_id: "mgr-1"
          assert:
            - "HTTP 409 and data.error_id == \"ERR_BUYER_BLOCKED\""
            - "GET /buyers/${buyer_id} reports status == \"BLOCKED\" and version == 2, not 3"

      - name: closing_an_already_closed_zone_is_refused
        claim_type: error_triggerable
        grounds:
          - validations[priority 32]
          - errors[ERR_ZONE_CLOSED]
        distinguishing_aspect: "ERR_ZONE_CLOSED covers both placing into a closed zone and re-closing one; this instance drives the re-close clause on an empty zone, so no item state can be confused with the cause."
        test_recipe:
          setup:
            - "one zone Front A of capacity 200, closed once by mgr-1 while still empty"
          setup_api_calls:
            - call: "POST /floor-zones"
              payload: { name: "Front A", zone_type: "SHOWROOM_FRONT", capacity_sqft: 200 }
              as: FloorOperator
              as_user_id: "floor-1"
              captures: { zone_front_id: $.data.id }
            - call: "POST /floor-zones/${zone_front_id}/close"
              payload: {}
              as: GalleryManager
              as_user_id: "mgr-1"
          trigger:
            - call: "POST /floor-zones/${zone_front_id}/close"
              payload: {}
              as: GalleryManager
              as_user_id: "mgr-1"
          assert:
            - "HTTP 409 and data.error_id == \"ERR_ZONE_CLOSED\""
            - "GET /floor-zones/${zone_front_id} reports status == \"CLOSED\", version == 2 and occupied_sqft == 0"

      - name: retiring_an_already_retired_schedule_is_refused
        claim_type: error_triggerable
        grounds:
          - validations[priority 43]
          - errors[ERR_SCHEDULE_RETIRED]
        distinguishing_aspect: "ERR_SCHEDULE_RETIRED covers both referencing a retired schedule from a new agreement and re-retiring it; this instance drives the idempotency clause, and the step already appended survives untouched."
        test_recipe:
          setup:
            - "schedule STD-2026 with one step at offset 0, retired once by mgr-1"
          setup_api_calls:
            - call: "POST /price-schedules"
              payload: { name: "STD-2026", unsold_trigger_day: 120, election_window_days: 14 }
              as: GalleryManager
              as_user_id: "mgr-1"
              captures: { sched_id: $.data.id }
            - call: "POST /price-schedule-steps"
              payload: { schedule_id: "${sched_id}", sequence: 1, start_day_offset: 0, markdown_pct: 0.00, min_price_cents: 0 }
              as: GalleryManager
              as_user_id: "mgr-1"
            - call: "POST /price-schedules/${sched_id}/retire"
              payload: {}
              as: GalleryManager
              as_user_id: "mgr-1"
          trigger:
            - call: "POST /price-schedules/${sched_id}/retire"
              payload: {}
              as: GalleryManager
              as_user_id: "mgr-1"
          assert:
            - "HTTP 409 and data.error_id == \"ERR_SCHEDULE_RETIRED\""
            - "GET /price-schedules/${sched_id} reports status == \"RETIRED\" and step_count == 1"
            - "GET /price-schedules/${sched_id}/steps returns total_count == 1"

      - name: appending_a_step_at_a_non_increasing_offset_is_refused
        claim_type: error_triggerable
        grounds:
          - validations[priority 24]
          - errors[ERR_SCHEDULE_STEP_OVERLAP]
        distinguishing_aspect: "The offsets must be STRICTLY increasing, so a sequence-2 step at the same start_day_offset 0 as sequence 1 is refused with ERR_SCHEDULE_STEP_OVERLAP at HTTP 422 even though the sequence number itself is the correct next one."
        test_recipe:
          setup:
            - "schedule STD-2026 holding exactly one step: sequence 1 at start_day_offset 0"
          setup_api_calls:
            - call: "POST /price-schedules"
              payload: { name: "STD-2026", unsold_trigger_day: 120, election_window_days: 14 }
              as: GalleryManager
              as_user_id: "mgr-1"
              captures: { sched_id: $.data.id }
            - call: "POST /price-schedule-steps"
              payload: { schedule_id: "${sched_id}", sequence: 1, start_day_offset: 0, markdown_pct: 0.00, min_price_cents: 0 }
              as: GalleryManager
              as_user_id: "mgr-1"
          trigger:
            - call: "POST /price-schedule-steps"
              payload: { schedule_id: "${sched_id}", sequence: 2, start_day_offset: 0, markdown_pct: 0.15, min_price_cents: 0 }
              as: GalleryManager
              as_user_id: "mgr-1"
          assert:
            - "HTTP 422 and data.error_id == \"ERR_SCHEDULE_STEP_OVERLAP\""
            - "GET /price-schedules/${sched_id} reports step_count == 1 and version == 2, the version bumped only by the accepted append"
            - "the same body with start_day_offset 1 returns HTTP 201, so the guard is on the offset and not on the sequence"

      - name: a_pickup_window_that_ends_when_it_starts_is_refused
        claim_type: error_triggerable
        grounds:
          - validations[priority 23]
          - errors[ERR_WINDOW_ORDER_INVALID]
        distinguishing_aspect: "The window guard is strict: window_start equal to window_end is refused with ERR_WINDOW_ORDER_INVALID at HTTP 422, and the guard runs before any truck overlap check, so an empty truck calendar cannot mask it."
        test_recipe:
          setup:
            - "consignor Alpha and truck BOX-1 of capacity 100; item_ids is omitted, so no agreement or screened piece is needed"
          setup_api_calls:
            - call: "POST /consignors"
              payload: { display_name: "Alpha", email: "alpha@example.com", address_line: "1 A St", floor_number: 1, has_elevator: false }
              as: GalleryManager
              as_user_id: "mgr-1"
              captures: { cons_id: $.data.id }
            - call: "POST /trucks"
              payload: { name: "BOX-1", capacity_volume_cuft: 100 }
              as: LogisticsCoordinator
              as_user_id: "logi-1"
              captures: { truck_id: $.data.id }
          trigger:
            - call: "POST /pickup-jobs"
