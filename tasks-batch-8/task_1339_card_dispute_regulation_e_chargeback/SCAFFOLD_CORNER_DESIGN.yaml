  # ==========================================================================
  # Excluded stubs (already covered by §1.8)
  # ==========================================================================
  - section: calculations
    instances:
      - name: claim_conservation_at_resolution
        claim_type: correct_result
        grounds: [calculations.recovery_waterfall]
        excluded_because:
          difficulty_instance: dual_variant_calc / provisional_vs_final_liability_holdback
          rationale: "cardholder_keeps_cents + final_liability_cents == claim_amount_cents is asserted literally there (0 + 20000 == 20000)."
  - section: validations
    instances:
      - name: recovery_equal_to_outstanding_boundary
        claim_type: violation_to_error
        grounds: ["validations[priority=11]", "errors[ERR_LOSS_EXCEEDS_OUTSTANDING]"]
        excluded_because:
          difficulty_instance: compensating_invariant / loss_recovery_outstanding_conservation
          rationale: "Equal-to-outstanding success and outstanding+1 rejection are both asserted in that instance's trigger chain."
