scenario: "774. Senior Errand & Companion Service (non-medical): client & task (grocery/Rx-pickup/transport/companion), recurring schedule & caregiver match, hourly billing & mileage, family-portal & visit log, background-check & bonding, escalation/wellness check, add-on, long-term-care reimbursement"
domain_name: "senior-errand-companion"
api_prefix: "/care"

complexity_profile:
  primary_archetype: "Temporal windowing"
  secondary_archetype: "Pricing engine"
  complexity_layers:
    - dual_variant_calculation
    - cascading_side_effects
    - optimistic_concurrency
    - derived_field_reconciliation
  entity_topology: hybrid
  # Client is the tree root (Client -> RecurringSchedule -> Visit) but Caregiver,
  # Invoice, ReimbursementClaim and LTCPolicy cross aggregate boundaries; Assignment
  # is a Visit x Caregiver junction.
  state_machine_shape: branching
  # Visit forks IN_PROGRESS -> {COMPLETED, ESCALATED} with divergent side effects;
  # ReimbursementClaim adds a SUBMITTED <-> NEEDS_INFO revision cycle.
  relationship_patterns:
    - one_to_many
    - many_to_many        # Assignment junction: Visit x Caregiver
    - cross_aggregate     # Invoice/Claim reference across the Client tree
  role_model: peer_roles
  consistency_model: immediate

response_envelope:
  success: |
    { "meta": { "api_request_id": "req_xxx", "api_request_timestamp": "ISO8601" },
      "response_type": "object" | "array", "data": {} }
  error: |
    { "meta": { ... }, "response_type": "error",
      "data": { "error_id": "ERR_XXX", "message": "..." } }
  pagination_fields: ["limit", "offset", "total_count", "has_more"]
  pagination_defaults: { limit: 10, min: 1, max: 100, offset: 0 }

# ---------------------------------------------------------------------------
# 1.1 Entity-Relationship Table
# ---------------------------------------------------------------------------
entities:
  - name: Client
    parent: null
    common_fields: true
    fields:
      - name: name
        type: string
        source: input
        description: "Senior client full name"
      - name: timezone
        type: string
        source: input
        description: "IANA timezone label (informational only; all timestamps are UTC)"
        default: "UTC"
      - name: home_zip
        type: string
        source: input
        description: "Residence ZIP code"
      - name: hourly_rate_cents
        type: integer
        source: input
        description: "Billing rate per hour, in cents; snapshotted onto each Visit at creation"
        constraints: ">= 0"
      - name: mileage_rate_cents_per_mile
        type: number
        source: input
        description: "Mileage reimbursement rate in cents per mile (may be fractional, e.g. 67.5)"
        constraints: ">= 0"
      - name: ot_threshold_hours
        type: number
        source: input
        description: "Billable hours in a single visit beyond which the overtime multiplier applies"
        default: 8
        constraints: "> 0"
      - name: ot_multiplier
        type: number
        source: input
        description: "Multiplier applied to the hourly rate for overtime hours"
        default: 1.5
        constraints: ">= 1"
      - name: min_visit_minutes
        type: integer
        source: input
        description: "Minimum billable minutes guaranteed per visit regardless of shorter actual duration"
        default: 60
        constraints: ">= 0"
      - name: status
        type: enum
        source: system
        description: "Lifecycle state"
        default: "ACTIVE"
        constraints: "one of {ACTIVE, SUSPENDED}"
      - name: outstanding_balance_cents
        type: integer
        source: computed
        description: "Derived: sum(total_cents of FINALIZED Invoices for this client) - sum(reimbursed_cents of APPROVED ReimbursementClaims on those invoices)"
        default: 0

  - name: FamilyContact
    parent: null
    common_fields: true
    fields:
      - name: client_id
        type: string
        source: input
        description: "FK -> Client.id; the client this family member is authorized to view"
      - name: name
        type: string
        source: input
        description: "Family contact full name"
      - name: email
        type: string
        source: input
        description: "Contact email"
      - name: relationship
        type: string
        source: input
        description: "Relationship to the client (e.g. daughter, son)"

  - name: Caregiver
    parent: null
    common_fields: true
    fields:
      - name: name
        type: string
        source: input
        description: "Caregiver full name"
      - name: home_zip
        type: string
        source: input
        description: "Caregiver base ZIP code"
      - name: hourly_pay_cents
        type: integer
        source: input
        description: "Caregiver pay rate (informational; not part of client billing)"
        default: 0
        constraints: ">= 0"
      - name: status
        type: enum
        source: system
        description: "Employment lifecycle"
        default: "ACTIVE"
        constraints: "one of {ACTIVE, INACTIVE}"
      - name: committed_minutes
        type: integer
        source: computed
        description: "Derived: sum of (Visit.scheduled_end - Visit.scheduled_start) in minutes over all Assignments with caregiver_id==this and status==CONFIRMED"
        default: 0

  - name: BackgroundCheck
    parent: Caregiver
    common_fields: true
    fields:
      - name: caregiver_id
        type: string
        source: input
        description: "FK -> Caregiver.id"
      - name: status
        type: enum
        source: system
        description: "Screening outcome; EXPIRED is set lazily by the system once the logical clock passes expires_at"
        default: "PENDING"
        constraints: "one of {PENDING, CLEARED, FLAGGED, EXPIRED}"
      - name: decided_at
        type: datetime
        source: computed
        description: "Logical-clock instant the decision was recorded"
      - name: expires_at
        type: datetime
        source: input
        description: "Instant the CLEARED result stops being valid; supplied on the decision call"
  - name: BondingRecord
    parent: Caregiver
    common_fields: true
    fields:
      - name: caregiver_id
        type: string
        source: input
        description: "FK -> Caregiver.id"
      - name: coverage_cents
        type: integer
        source: input
        description: "Bond coverage amount in cents"
        constraints: ">= 0"
      - name: effective_date
        type: datetime
        source: input
        description: "Instant coverage begins"
      - name: expiry_date
        type: datetime
        source: input
        description: "Instant coverage ends"
      - name: status
        type: enum
        source: system
        description: "ACTIVE while effective_date <= clock < expiry_date; LAPSED once clock >= expiry_date"
        default: "ACTIVE"
        constraints: "one of {ACTIVE, LAPSED}"

  - name: RecurringSchedule
    parent: Client
    common_fields: true
    fields:
      - name: client_id
        type: string
        source: input
        description: "FK -> Client.id"
      - name: task_type
        type: enum
        source: input
        description: "Kind of errand"
        constraints: "one of {GROCERY, RX_PICKUP, TRANSPORT, COMPANION}"
      - name: frequency
        type: enum
        source: input
        description: "Recurrence cadence"
        constraints: "one of {WEEKLY, BIWEEKLY}"
      - name: day_of_week
        type: enum
        source: input
        description: "Day the recurring visit lands on"
        constraints: "one of {MON, TUE, WED, THU, FRI, SAT, SUN}"
      - name: start_time
        type: string
        source: input
        description: "Visit start time-of-day in HH:MM, interpreted as UTC"
      - name: duration_minutes
        type: integer
        source: input
        description: "Scheduled visit length in minutes"
        constraints: "> 0"
      - name: start_date
        type: datetime
        source: input
        description: "First eligible date (inclusive) for generated visits"
      - name: end_date
        type: datetime
        source: input
        description: "Last eligible date (inclusive) for generated visits"
      - name: status
        type: enum
        source: system
        description: "ACTIVE generates visits; PAUSED set by the client-suspend cascade; ENDED is terminal"
        default: "ACTIVE"
        constraints: "one of {ACTIVE, PAUSED, ENDED}"

  - name: Visit
    parent: null
    common_fields: true
    fields:
      - name: client_id
        type: string
        source: input
        description: "FK -> Client.id"
      - name: schedule_id
        type: string
        source: input
        description: "FK -> RecurringSchedule.id; null for ad-hoc visits"
      - name: caregiver_id
        type: string
        source: system
        description: "FK -> Caregiver.id; null until a CONFIRMED Assignment sets it"
      - name: task_type
        type: enum
        source: input
        description: "Kind of errand"
        constraints: "one of {GROCERY, RX_PICKUP, TRANSPORT, COMPANION}"
      - name: scheduled_start
        type: datetime
        source: input
        description: "Planned start instant (UTC)"
      - name: scheduled_end
        type: datetime
        source: input
        description: "Planned end instant (UTC); must be strictly after scheduled_start"
      - name: actual_start
        type: datetime
        source: computed
        description: "Recorded at clock-in"
      - name: actual_end
        type: datetime
        source: computed
        description: "Recorded at clock-out"
      - name: mileage_miles
        type: number
        source: computed
        description: "Miles driven, submitted at clock-out"
        default: 0
      - name: status
        type: enum
        source: system
        description: "Lifecycle"
        default: "SCHEDULED"
        constraints: "one of {SCHEDULED, IN_PROGRESS, ESCALATED, COMPLETED, CANCELLED}"
      - name: hourly_rate_cents
        type: integer
        source: computed
        description: "Snapshot of Client.hourly_rate_cents at visit creation"
      - name: mileage_rate_cents_per_mile
        type: number
        source: computed
        description: "Snapshot of Client.mileage_rate_cents_per_mile at visit creation"
      - name: ot_threshold_hours
        type: number
        source: computed
        description: "Snapshot of Client.ot_threshold_hours at visit creation"
      - name: ot_multiplier
        type: number
        source: computed
        description: "Snapshot of Client.ot_multiplier at visit creation"
      - name: min_visit_minutes
        type: integer
        source: computed
        description: "Snapshot of Client.min_visit_minutes at visit creation"
      - name: estimated_cost_cents
        type: integer
        source: computed
        description: "Provisional labor estimate set when a caregiver is assigned (see calculations.visit_billing_cost, provisional variant)"

  - name: Assignment
    parent: null
    common_fields: true
    fields:
      - name: visit_id
        type: string
        source: input
        description: "FK -> Visit.id"
      - name: caregiver_id
        type: string
        source: input
        description: "FK -> Caregiver.id"
      - name: status
        type: enum
        source: system
        description: "CONFIRMED is the live match; SUPERSEDED when a newer assignment replaces it; CANCELLED when withdrawn or cascaded"
        default: "CONFIRMED"
        constraints: "one of {CONFIRMED, SUPERSEDED, CANCELLED}"

  - name: AddOn
    parent: Visit
    common_fields: true
    fields:
      - name: visit_id
        type: string
        source: input
        description: "FK -> Visit.id"
      - name: addon_type
        type: enum
        source: input
        description: "Extra service"
        constraints: "one of {MEAL_PREP, PET_CARE, PAPERWORK, EXTRA_STOP}"
      - name: fee_cents
        type: integer
        source: input
        description: "Flat fee for the add-on in cents"
        constraints: ">= 0"
      - name: status
        type: enum
        source: system
        description: "Only APPROVED add-ons are billed on the visit invoice"
        default: "REQUESTED"
        constraints: "one of {REQUESTED, APPROVED, REJECTED}"

  - name: Invoice
    parent: null
    common_fields: true
    fields:
      - name: client_id
        type: string
        source: input
        description: "FK -> Client.id"
      - name: visit_id
        type: string
        source: input
        description: "FK -> Visit.id (one invoice per completed visit)"
      - name: status
        type: enum
        source: system
        description: "DRAFT at clock-out; FINALIZED debits the client balance; VOID reverses it"
        default: "DRAFT"
        constraints: "one of {DRAFT, FINALIZED, VOID}"
      - name: labor_cents
        type: integer
        source: computed
        description: "round_half_up of the labor_charge raw result (see calculations.labor_charge, calculations.invoice_assembly)"
      - name: mileage_cents
        type: integer
        source: computed
        description: "round_half_up(mileage_miles * mileage_rate_cents_per_mile)"
      - name: addon_cents
        type: integer
        source: computed
        description: "Sum of fee_cents over APPROVED AddOns on the visit"
      - name: total_cents
        type: integer
        source: computed
        description: "labor_cents + mileage_cents + addon_cents (per-line rounding, then sum)"

  - name: LTCPolicy
    parent: Client
    common_fields: true
    fields:
      - name: client_id
        type: string
        source: input
        description: "FK -> Client.id"
      - name: payer_name
        type: string
        source: input
        description: "Long-term-care insurer name"
      - name: benefit_type
        type: enum
        source: input
        description: "Determines the reimbursement variant"
        constraints: "one of {INDEMNITY, REIMBURSEMENT}"
      - name: daily_benefit_cents
        type: integer
        source: input
        description: "Flat daily benefit paid under an INDEMNITY policy; null for REIMBURSEMENT"
      - name: reimbursement_rate
        type: number
        source: input
        description: "Fraction (0..1) of eligible cost paid under a REIMBURSEMENT policy; null for INDEMNITY"
      - name: daily_cap_cents
        type: integer
        source: input
        description: "Per-claim ceiling on the reimbursed amount for a REIMBURSEMENT policy; null for INDEMNITY"
      - name: lifetime_max_cents
        type: integer
        source: input
        description: "Cumulative reimbursement ceiling; the policy becomes EXHAUSTED when reimbursed_to_date_cents reaches it"
        constraints: ">= 0"
      - name: reimbursed_to_date_cents
        type: integer
        source: computed
        description: "Running total of reimbursed_cents over APPROVED claims against this policy"
        default: 0
      - name: status
        type: enum
        source: system
        description: "ACTIVE until reimbursed_to_date_cents >= lifetime_max_cents, then EXHAUSTED"
        default: "ACTIVE"
        constraints: "one of {ACTIVE, EXHAUSTED}"

  - name: ReimbursementClaim
    parent: null
    common_fields: true
    fields:
      - name: invoice_id
        type: string
        source: input
        description: "FK -> Invoice.id"
      - name: ltc_policy_id
        type: string
        source: input
        description: "FK -> LTCPolicy.id"
      - name: benefit_type
        type: enum
        source: computed
        description: "Snapshot of the policy's benefit_type at claim creation"
        constraints: "one of {INDEMNITY, REIMBURSEMENT}"
      - name: status
        type: enum
        source: system
        description: "Lifecycle with a SUBMITTED <-> NEEDS_INFO revision cycle"
        default: "DRAFT"
        constraints: "one of {DRAFT, SUBMITTED, NEEDS_INFO, APPROVED, DENIED, WITHDRAWN}"
      - name: eligible_cents
        type: integer
        source: computed
        description: "Invoice.labor_cents + Invoice.addon_cents (mileage is NOT LTC-eligible)"
      - name: reimbursed_cents
        type: integer
        source: computed
        description: "Amount the payer covers (see calculations.ltc_reimbursement)"
      - name: client_responsibility_cents
        type: integer
        source: computed
        description: "Invoice.total_cents - reimbursed_cents"

  - name: WellnessCheck
    parent: null
    common_fields: true
    fields:
      - name: visit_id
        type: string
        source: input
        description: "FK -> Visit.id that triggered the escalation"
      - name: client_id
        type: string
        source: input
        description: "FK -> Client.id"
      - name: severity
        type: enum
        source: input
        description: "Escalation severity"
        constraints: "one of {LOW, MEDIUM, HIGH}"
      - name: reason
        type: string
        source: input
        description: "Free-text reason for the escalation"
      - name: status
        type: enum
        source: system
        description: "OPEN -> ACKNOWLEDGED -> RESOLVED"
        default: "OPEN"
        constraints: "one of {OPEN, ACKNOWLEDGED, RESOLVED}"
      - name: acknowledged_by
        type: string
        source: computed
        description: "X-User-ID of the FamilyContact who acknowledged"

  - name: VisitLogEntry
    parent: Visit
    common_fields: false
    fields:
      - name: visit_id
        type: string
        source: input
        description: "FK -> Visit.id"
      - name: entry_type
        type: enum
        source: input
        description: "Kind of log line"
        constraints: "one of {NOTE, TASK_DONE, INCIDENT}"
      - name: note
        type: string
        source: input
        description: "Log text; append-only, never mutated"

# ---------------------------------------------------------------------------
# 1.2 State Machine Table
# ---------------------------------------------------------------------------
state_machines:
  - entity: Client
    initial_state: ACTIVE
    terminal_states: [SUSPENDED]
    transitions:
      - from: ACTIVE
        to: SUSPENDED
        trigger: "POST /care/clients/{id}/suspend"
        actor: CareCoordinator
        preconditions: ["client.status == ACTIVE"]
        side_effects:
          - "Cascade (hop 1): every RecurringSchedule with client_id==this and status==ACTIVE transitions ACTIVE->PAUSED (which itself cascades to its future visits)"

  - entity: RecurringSchedule
    initial_state: ACTIVE
    terminal_states: [ENDED]
    transitions:
      - from: ACTIVE
        to: PAUSED
        trigger: "system: owning Client suspended"
        actor: system
        preconditions: ["schedule.status == ACTIVE"]
        side_effects:
          - "Cascade (hop 2): every Visit with schedule_id==this and status==SCHEDULED transitions SCHEDULED->CANCELLED (which itself cascades to its assignments and draft invoice)"
      - from: ACTIVE
        to: ENDED
        trigger: "system: clock passes end_date with no remaining occurrences"
        actor: system
        preconditions: ["schedule.status == ACTIVE"]
        side_effects: []

  - entity: Visit
    initial_state: SCHEDULED
    terminal_states: [COMPLETED, CANCELLED]
    transitions:
      - from: SCHEDULED
        to: SCHEDULED
        trigger: "POST /care/visits/{id}/assignments"
        actor: CareCoordinator
        preconditions:
          - "visit.status == SCHEDULED"
          - "expected_visit_version == visit.version (OCC)"
          - "caregiver has a BackgroundCheck with status==CLEARED and expires_at > clock (business_safety)"
          - "caregiver has a BondingRecord with status==ACTIVE and effective_date <= clock < expiry_date (business_safety)"
          - "assigning does not double-book the caregiver (business_temporal, buffered half-open)"
        side_effects:
          - "creates Assignment(status=CONFIRMED); any prior CONFIRMED Assignment on this visit transitions CONFIRMED->SUPERSEDED and releases its caregiver's committed_minutes"
          - "sets visit.caregiver_id to the new caregiver; adds this visit's scheduled minutes to the new caregiver.committed_minutes"
          - "sets visit.estimated_cost_cents via calculations.visit_billing_cost (provisional variant)"
          - "increments Visit.version by 1"
        note: "Self-loop: assignment does not change the SCHEDULED state; it is the OCC-guarded write of §1.2.1."
      - from: SCHEDULED
        to: IN_PROGRESS
        trigger: "POST /care/visits/{id}/clock-in"
        actor: Caregiver
        preconditions:
          - "visit.status == SCHEDULED"
          - "acting caregiver == visit.caregiver_id (ownership)"
          - "caregiver BackgroundCheck CLEARED and expires_at > clock (business_safety)"
          - "caregiver BondingRecord ACTIVE and effective_date <= clock < expiry_date (business_safety)"
        side_effects: ["sets actual_start"]
      - from: IN_PROGRESS
        to: COMPLETED
        trigger: "POST /care/visits/{id}/clock-out"
        actor: Caregiver
        preconditions:
          - "visit.status == IN_PROGRESS"
          - "actual_end > actual_start (business_constraint)"
          - "mileage_miles >= 0 (business_constraint)"
        side_effects:
          - "sets actual_end, mileage_miles"
          - "creates Invoice(status=DRAFT) via calculations.invoice_assembly (final variant of calculations.visit_billing_cost)"
      - from: ESCALATED
        to: COMPLETED
        trigger: "POST /care/visits/{id}/clock-out"
        actor: Caregiver
        preconditions:
          - "visit.status == ESCALATED"
          - "actual_end > actual_start (business_constraint)"
          - "mileage_miles >= 0 (business_constraint)"
        side_effects:
          - "sets actual_end, mileage_miles"
          - "creates Invoice(status=DRAFT) via calculations.invoice_assembly"
        note: "The COMPLETED branch always produces an invoice regardless of whether it came from IN_PROGRESS or ESCALATED."
      - from: IN_PROGRESS
        to: ESCALATED
        trigger: "POST /care/visits/{id}/escalate"
        actor: Caregiver
        preconditions:
          - "visit.status == IN_PROGRESS"
          - "acting caregiver == visit.caregiver_id (ownership)"
        side_effects:
          - "creates WellnessCheck(status=OPEN) for the visit's client"
          - "does NOT create an invoice (divergent from the COMPLETED branch)"
        note: "Fork point: from IN_PROGRESS the two branches {COMPLETED, ESCALATED} carry different side-effect sets."
      - from: SCHEDULED
        to: CANCELLED
        trigger: "POST /care/visits/{id}/cancel OR system cascade from schedule pause"
        actor: CareCoordinator
        preconditions: ["visit.status == SCHEDULED"]
        side_effects:
          - "Cascade (hop 3): every Assignment with visit_id==this and status==CONFIRMED transitions CONFIRMED->CANCELLED, releasing that caregiver's committed_minutes"
          - "any DRAFT Invoice for this visit transitions DRAFT->VOID"

  - entity: Assignment
    initial_state: CONFIRMED
    terminal_states: [SUPERSEDED, CANCELLED]
    transitions:
      - from: CONFIRMED
        to: SUPERSEDED
        trigger: "system: a newer Assignment is created on the same visit"
        actor: system
        preconditions: ["assignment.status == CONFIRMED"]
        side_effects: ["subtracts this visit's scheduled minutes from caregiver.committed_minutes"]
      - from: CONFIRMED
        to: CANCELLED
        trigger: "POST /care/assignments/{id}/cancel OR system cascade from visit cancel"
        actor: CareCoordinator
        preconditions: ["assignment.status == CONFIRMED"]
        side_effects:
          - "subtracts this visit's scheduled minutes from caregiver.committed_minutes"
          - "clears visit.caregiver_id if it still points at this caregiver"

  - entity: BackgroundCheck
    initial_state: PENDING
    terminal_states: [FLAGGED, EXPIRED]
    transitions:
      - from: PENDING
        to: CLEARED
        trigger: "POST /care/background-checks/{id}/decision (outcome=CLEARED)"
        actor: CareCoordinator
        preconditions: ["check.status == PENDING"]
        side_effects: ["sets decided_at=clock, expires_at from input"]
      - from: PENDING
        to: FLAGGED
        trigger: "POST /care/background-checks/{id}/decision (outcome=FLAGGED)"
        actor: CareCoordinator
        preconditions: ["check.status == PENDING"]
        side_effects: ["sets decided_at=clock"]
      - from: CLEARED
        to: EXPIRED
        trigger: "system: logical clock reaches expires_at"
        actor: system
        preconditions: ["check.status == CLEARED", "clock >= expires_at"]
        side_effects: []

  - entity: BondingRecord
    initial_state: ACTIVE
    terminal_states: [LAPSED]
    transitions:
      - from: ACTIVE
        to: LAPSED
        trigger: "system: logical clock reaches expiry_date"
        actor: system
        preconditions: ["bond.status == ACTIVE", "clock >= expiry_date"]
        side_effects: []

  - entity: AddOn
    initial_state: REQUESTED
    terminal_states: [APPROVED, REJECTED]
    transitions:
      - from: REQUESTED
        to: APPROVED
        trigger: "POST /care/add-ons/{id}/approve (outcome=APPROVE)"
        actor: CareCoordinator
        preconditions: ["addon.status == REQUESTED", "parent visit.status not in {COMPLETED, CANCELLED}"]
        side_effects: []
      - from: REQUESTED
        to: REJECTED
        trigger: "POST /care/add-ons/{id}/approve (outcome=REJECT)"
        actor: CareCoordinator
        preconditions: ["addon.status == REQUESTED"]
        side_effects: []

  - entity: Invoice
    initial_state: DRAFT
    terminal_states: [VOID]
    transitions:
      - from: DRAFT
        to: FINALIZED
        trigger: "POST /care/invoices/{id}/finalize"
        actor: BillingClerk
        preconditions: ["invoice.status == DRAFT"]
        side_effects: ["adds invoice.total_cents to Client.outstanding_balance_cents"]
      - from: DRAFT
        to: VOID
        trigger: "POST /care/invoices/{id}/void OR system cascade from visit cancel"
        actor: BillingClerk
        preconditions: ["invoice.status == DRAFT"]
        side_effects: []
      - from: FINALIZED
        to: VOID
        trigger: "POST /care/invoices/{id}/void"
        actor: BillingClerk
        preconditions: ["invoice.status == FINALIZED"]
        side_effects:
          - "subtracts invoice.total_cents from Client.outstanding_balance_cents"
          - "Cascade (hop 2): every ReimbursementClaim with invoice_id==this and status in {DRAFT, SUBMITTED, NEEDS_INFO, APPROVED} transitions to WITHDRAWN; if it was APPROVED, its reimbursed_cents is subtracted back out of both LTCPolicy.reimbursed_to_date_cents and Client.outstanding_balance_cents"

  - entity: LTCPolicy
    initial_state: ACTIVE
    terminal_states: [EXHAUSTED]
    transitions:
      - from: ACTIVE
        to: EXHAUSTED
        trigger: "system: a claim approval pushes reimbursed_to_date_cents to lifetime_max_cents"
        actor: system
        preconditions: ["policy.status == ACTIVE", "reimbursed_to_date_cents >= lifetime_max_cents"]
        side_effects: []

  - entity: ReimbursementClaim
    initial_state: DRAFT
    terminal_states: [APPROVED, DENIED, WITHDRAWN]
    transitions:
      - from: DRAFT
        to: SUBMITTED
        trigger: "POST /care/claims/{id}/submit"
        actor: BillingClerk
        preconditions:
          - "claim.status in {DRAFT, NEEDS_INFO}"
          - "the referenced Invoice.status == FINALIZED (business_state cross-entity)"
          - "the referenced LTCPolicy.status == ACTIVE (business_fiscal)"
        side_effects: []
      - from: SUBMITTED
        to: NEEDS_INFO
        trigger: "POST /care/claims/{id}/request-info"
        actor: BillingClerk
        preconditions: ["claim.status == SUBMITTED"]
        side_effects: []
      - from: NEEDS_INFO
        to: SUBMITTED
        trigger: "POST /care/claims/{id}/submit"
        actor: BillingClerk
        preconditions:
          - "claim.status in {DRAFT, NEEDS_INFO}"
          - "the referenced Invoice.status == FINALIZED"
          - "the referenced LTCPolicy.status == ACTIVE"
        side_effects: []
        note: "Revision cycle: SUBMITTED -> NEEDS_INFO -> SUBMITTED may repeat any number of times."
      - from: SUBMITTED
        to: APPROVED
        trigger: "POST /care/claims/{id}/decision (outcome=APPROVE)"
        actor: BillingClerk
        preconditions: ["claim.status == SUBMITTED"]
        side_effects:
          - "adds reimbursed_cents to LTCPolicy.reimbursed_to_date_cents; if that reaches lifetime_max_cents the policy transitions ACTIVE->EXHAUSTED"
          - "subtracts reimbursed_cents from Client.outstanding_balance_cents"
      - from: SUBMITTED
        to: DENIED
        trigger: "POST /care/claims/{id}/decision (outcome=DENY)"
        actor: BillingClerk
        preconditions: ["claim.status == SUBMITTED"]
        side_effects: []
      - from: DRAFT
        to: WITHDRAWN
        trigger: "POST /care/claims/{id}/withdraw OR system cascade from invoice void"
        actor: BillingClerk
        preconditions: ["claim.status in {DRAFT, SUBMITTED, NEEDS_INFO, APPROVED}"]
        side_effects: ["if the claim was APPROVED, reverses its reimbursed_cents out of LTCPolicy.reimbursed_to_date_cents and Client.outstanding_balance_cents"]
      - from: SUBMITTED
        to: WITHDRAWN
        trigger: "POST /care/claims/{id}/withdraw OR system cascade from invoice void"
        actor: BillingClerk
        preconditions: ["claim.status in {DRAFT, SUBMITTED, NEEDS_INFO, APPROVED}"]
        side_effects: []

  - entity: WellnessCheck
    initial_state: OPEN
    terminal_states: [RESOLVED]
    transitions:
      - from: OPEN
        to: ACKNOWLEDGED
        trigger: "POST /care/wellness-checks/{id}/acknowledge"
        actor: FamilyContact
        preconditions: ["check.status == OPEN", "acting FamilyContact.client_id == check.client_id (ownership)"]
        side_effects: ["sets acknowledged_by to the acting X-User-ID"]
      - from: ACKNOWLEDGED
        to: RESOLVED
        trigger: "POST /care/wellness-checks/{id}/resolve"
        actor: FamilyContact
        preconditions: ["check.status == ACKNOWLEDGED"]
        side_effects: []
      - from: OPEN
        to: RESOLVED
        trigger: "POST /care/wellness-checks/{id}/resolve"
        actor: CareCoordinator
        preconditions: ["check.status == OPEN"]
        side_effects: []
        note: "A CareCoordinator may resolve directly from OPEN; a FamilyContact must acknowledge first."

# ---------------------------------------------------------------------------
# 1.2.1 Concurrency Rules
# ---------------------------------------------------------------------------
concurrency_rules:
  - rule_id: assignment-create-stale-visit
    parent_entity: Visit
    write_endpoint: "POST /care/visits/{id}/assignments"
    occ_field: "expected_visit_version"
    description: |
      Creating an Assignment against a Visit whose version has advanced since the
      client last observed it is rejected. A newly created Assignment legitimately
      supersedes any prior CONFIRMED match on the visit, so a second create that
      still carries the pre-supersede version is operating on a stale view of the
      visit and must be rejected on the version mismatch.
    error_id: ERR_STALE_VISIT_VERSION
    http_status: 412

# ---------------------------------------------------------------------------
# 1.3 Calculation Rules Table
# ---------------------------------------------------------------------------
calculations:
  - name: labor_charge
    trigger: "computed at clock-out (final) and at assignment (provisional) as the raw labor component"
    algorithm: tiered_pricing
    formula: |
      # Mode (a): >=3 inputs with nested min/max and a conditional overtime tier.
      # Returns RAW cents (may be fractional); rounding happens in invoice_assembly.
      billable_minutes = max(actual_minutes, min_visit_minutes)
      billable_hours   = billable_minutes / 60
      regular_hours    = min(billable_hours, ot_threshold_hours)
      ot_hours         = max(billable_hours - ot_threshold_hours, 0)
      labor_cents_raw  = regular_hours * hourly_rate_cents
                       + ot_hours * hourly_rate_cents * ot_multiplier
      # Boundary: at billable_hours == ot_threshold_hours exactly, ot_hours == 0
      # (the multiplier applies strictly ABOVE the threshold: '> ' not '>=').
    input_set: "A single visit's own snapshot fields (hourly_rate_cents, ot_threshold_hours, ot_multiplier, min_visit_minutes) and its actual (or scheduled, for provisional) minutes"
    constants:
      MINUTES_PER_HOUR: 60
    precision: "raw value carried unrounded; rounded to whole cents only in invoice_assembly, round_half_up"

  - name: invoice_assembly
    trigger: "Visit clock-out (SCHEDULED/ESCALATED -> COMPLETED)"
    algorithm: aggregation
    formula: |
      # Mode (b): rounding ORDER is pinned. Each line item is rounded to whole
      # cents FIRST, then the rounded line items are summed. (Sum-then-round would
      # give a different total when two lines each carry a .5 cent fraction.)
      labor_cents   = round_half_up(labor_cents_raw)                       # from labor_charge
      mileage_cents = round_half_up(mileage_miles * mileage_rate_cents_per_mile)
      addon_cents   = sum(fee_cents for AddOn in visit where status == APPROVED)   # already integer
      total_cents   = labor_cents + mileage_cents + addon_cents            # PIN: round-per-line, then sum
    input_set: "The completing visit's labor raw, its mileage, and only its APPROVED AddOns"
    constants: {}
    precision: "each line item round_half_up to whole cents, then integer sum"

  - name: visit_billing_cost
    trigger: "provisional at POST assignments; final at POST clock-out"
    algorithm: forward_looking
    formula: |
      # Dual-variant on the Visit/Invoice domain.
      provisional: estimated_cost_cents = round_half_up(labor_charge(actual_minutes := scheduled_minutes))
                   # mileage assumed 0, no add-ons; scheduled_minutes = scheduled_end - scheduled_start
      final:       Invoice.total_cents  = invoice_assembly(actual_minutes := actual duration, actual mileage, APPROVED add-ons)
    input_set: "provisional uses scheduled duration only; final uses actual duration + mileage + APPROVED add-ons"
    constants: {}
    precision: "round_half_up to whole cents"
    variants:
      - name: provisional
        when: "a caregiver is assigned to a SCHEDULED visit"
        difference: "uses scheduled_end - scheduled_start, zero mileage, no add-ons; stored on Visit.estimated_cost_cents"
      - name: final
        when: "the visit is clocked out"
        difference: "uses actual_end - actual_start, submitted mileage, and APPROVED add-ons; stored on Invoice.total_cents"

  - name: ltc_reimbursement
    trigger: "computed at ReimbursementClaim creation from the referenced invoice + policy"
    algorithm: threshold
    formula: |
      # Dual-variant on the ReimbursementClaim domain. Eligible base EXCLUDES mileage.
      eligible_cents = invoice.labor_cents + invoice.addon_cents
      INDEMNITY:     reimbursed_cents = min(policy.daily_benefit_cents, eligible_cents)
      REIMBURSEMENT: reimbursed_cents = min(round_half_up(policy.reimbursement_rate * eligible_cents), policy.daily_cap_cents)
      client_responsibility_cents = invoice.total_cents - reimbursed_cents
    input_set: "one Invoice's labor_cents + addon_cents (mileage excluded) and one LTCPolicy's benefit terms"
    constants: {}
    precision: "round_half_up to whole cents"
    variants:
      - name: indemnity
        when: "policy.benefit_type == INDEMNITY"
        difference: "pays a flat daily_benefit_cents, capped at eligible_cents; ignores reimbursement_rate/daily_cap"
      - name: reimbursement
        when: "policy.benefit_type == REIMBURSEMENT"
        difference: "pays reimbursement_rate * eligible_cents, capped at daily_cap_cents; ignores daily_benefit_cents"

  - name: outstanding_balance
    trigger: "recomputed on invoice finalize/void and on claim approve/withdraw"
    algorithm: aggregation
    formula: |
      Client.outstanding_balance_cents =
        sum(inv.total_cents for Invoice inv where inv.client_id == client.id and inv.status == FINALIZED)
        - sum(cl.reimbursed_cents for ReimbursementClaim cl
              where cl.status == APPROVED and cl.invoice's client_id == client.id)
    input_set: "FINALIZED invoices and APPROVED claims for the client only; DRAFT/VOID invoices and non-APPROVED claims excluded"
    constants: {}
    precision: "integer cents"

  - name: caregiver_committed_minutes
    trigger: "recomputed on assignment create/supersede/cancel and on visit cancel cascade"
    algorithm: aggregation
    formula: |
      Caregiver.committed_minutes =
        sum((v.scheduled_end - v.scheduled_start) in minutes
            for Assignment a where a.caregiver_id == caregiver.id and a.status == CONFIRMED,
            with v = the Visit referenced by a)
    input_set: "only CONFIRMED assignments; SUPERSEDED and CANCELLED excluded"
    constants:
      MINUTES_PER_HOUR: 60
    precision: "integer minutes"

# ---------------------------------------------------------------------------
# 1.4 Validation Rules Table (ordered by priority)
# ---------------------------------------------------------------------------
validations:
  - priority: 1
    category: auth
    check: "X-User-Role and X-User-ID headers present"
    error_id: ERR_UNAUTHENTICATED
    http_status: 401
    applies_to: "all"
  - priority: 2
    category: auth
    check: "acting role is permitted to call this endpoint per §1.7"
    error_id: ERR_UNAUTHORIZED
    http_status: 403
    applies_to: "all"
  - priority: 3
    category: existence
    check: "every resource named in the path exists (validated left-to-right)"
    error_id: ERR_RESOURCE_NOT_FOUND
    http_status: 404
    applies_to: "all path-parameterized endpoints"
  - priority: 4
    category: auth
    check: "entity_backed actor owns the resource: Caregiver acts only on a visit where visit.caregiver_id == X-User-ID; FamilyContact acts only where the target's client_id == the contact's client_id"
    error_id: ERR_NOT_RESOURCE_OWNER
    http_status: 403
    applies_to: "clock-in, clock-out, escalate, log, wellness acknowledge/resolve (FamilyContact), add-on create (FamilyContact)"
  - priority: 5
    category: business_constraint
    check: "request body has all required fields with correct types"
    error_id: ERR_INVALID_REQUEST
    http_status: 422
    applies_to: "all writes"
  - priority: 6
    category: business_constraint
    check: "enum-typed fields carry a declared member"
    error_id: ERR_INVALID_ENUM
    http_status: 422
    applies_to: "all writes with enum inputs"
  - priority: 7
    category: state
    check: "OCC: expected_visit_version matches the current Visit.version"
    error_id: ERR_STALE_VISIT_VERSION
    http_status: 412
    applies_to: "POST /care/visits/{id}/assignments"
  - priority: 8
    category: state
    check: "target resource is in a state that permits this transition (e.g. visit SCHEDULED for assign/clock-in, IN_PROGRESS for clock-out/escalate, invoice DRAFT for finalize, invoice FINALIZED for a claim to submit, claim in {DRAFT,NEEDS_INFO} for submit)"
    error_id: ERR_INVALID_STATE
    http_status: 409
    applies_to: "all transition endpoints (specific error ids below refine this)"
  - priority: 9
    category: business_safety
    check: "assigned/acting caregiver has a CLEARED, non-expired BackgroundCheck and an ACTIVE BondingRecord at the current clock"
    error_id: ERR_CAREGIVER_NOT_CLEARED
    http_status: 409
    applies_to: "POST /care/visits/{id}/assignments, POST /care/visits/{id}/clock-in"
  - priority: 10
    category: business_referential
    check: "the claim's LTCPolicy belongs to the same Client as the claim's Invoice"
    error_id: ERR_POLICY_CLIENT_MISMATCH
    http_status: 409
    applies_to: "POST /care/invoices/{id}/claims"
  - priority: 11
    category: business_temporal
    check: "temporal-overlap conflicts: caregiver double-booking (buffered half-open) on assign; client visit overlap (closed, no buffer) on visit create"
    error_id: ERR_CAREGIVER_DOUBLE_BOOKED
    http_status: 409
    applies_to: "POST /care/visits/{id}/assignments, POST /care/visits"
  - priority: 12
    category: business_constraint
    check: "value/range constraints: scheduled_end > scheduled_start; actual_end > actual_start; mileage_miles >= 0; schedule end_date >= start_date"
    error_id: ERR_INVALID_TIME_RANGE
    http_status: 422
    applies_to: "POST /care/visits, POST /care/visits/{id}/clock-out, POST /care/clients/{id}/schedules"
  - priority: 13
    category: business_fiscal
    check: "the claim's LTCPolicy is ACTIVE (not EXHAUSTED) when submitting"
    error_id: ERR_POLICY_EXHAUSTED
    http_status: 402
    applies_to: "POST /care/claims/{id}/submit"

# ---------------------------------------------------------------------------
# 1.5 API Endpoint Table
# ---------------------------------------------------------------------------
endpoints:
  # ---- Clients ----
  - method: POST
    path: "/care/clients"
    description: "Create a client with billing configuration"
    roles: [CareCoordinator]
    code: 201
    input: [name, home_zip, hourly_rate_cents, mileage_rate_cents_per_mile, "timezone?", "ot_threshold_hours?", "ot_multiplier?", "min_visit_minutes?"]
    output: Client
    side_effects: ["status=ACTIVE, outstanding_balance_cents=0"]
  - method: GET
    path: "/care/clients/{id}"
    description: "Fetch a client"
    roles: [CareCoordinator, BillingClerk]
    code: 200
    input: []
    output: Client
    side_effects: []
  - method: POST
    path: "/care/clients/{id}/suspend"
    description: "Suspend a client; cascades to schedules, visits, assignments"
    roles: [CareCoordinator]
    code: 200
    input: []
    output: Client
    side_effects: ["Client ACTIVE->SUSPENDED; cascade hop 1 pauses ACTIVE schedules"]
  - method: POST
    path: "/care/clients/{id}/family-contacts"
    description: "Register a family-portal contact for a client"
    roles: [CareCoordinator]
    code: 201
    input: [name, email, relationship]
    output: FamilyContact
    side_effects: []
  - method: GET
    path: "/care/clients/{id}/family-contacts"
    description: "List a client's family contacts (FK reverse for FamilyContact.client_id)"
    roles: [CareCoordinator]
    code: 200
    input: []
    output: FamilyContact[]
    side_effects: []
  - method: POST
    path: "/care/clients/{id}/schedules"
    description: "Create a recurring schedule for a client"
    roles: [CareCoordinator]
    code: 201
    input: [task_type, frequency, day_of_week, start_time, duration_minutes, start_date, end_date]
    output: RecurringSchedule
    side_effects: ["status=ACTIVE"]
  - method: GET
    path: "/care/clients/{id}/schedules"
    description: "List a client's schedules (FK reverse for RecurringSchedule.client_id)"
    roles: [CareCoordinator]
    code: 200
    input: []
    output: RecurringSchedule[]
    side_effects: []
  - method: POST
    path: "/care/clients/{id}/ltc-policies"
    description: "Attach a long-term-care policy to a client"
    roles: [CareCoordinator]
    code: 201
    input: [payer_name, benefit_type, lifetime_max_cents, "daily_benefit_cents?", "reimbursement_rate?", "daily_cap_cents?"]
    output: LTCPolicy
    side_effects: ["status=ACTIVE, reimbursed_to_date_cents=0"]
  - method: GET
    path: "/care/clients/{id}/ltc-policies"
    description: "List a client's LTC policies (FK reverse for LTCPolicy.client_id)"
    roles: [CareCoordinator, BillingClerk]
    code: 200
    input: []
    output: LTCPolicy[]
    side_effects: []
  # ---- Caregivers, checks, bonds ----
  - method: POST
    path: "/care/caregivers"
    description: "Create a caregiver"
    roles: [CareCoordinator]
    code: 201
    input: [name, home_zip, "hourly_pay_cents?"]
    output: Caregiver
    side_effects: ["status=ACTIVE, committed_minutes=0"]
  - method: GET
    path: "/care/caregivers/{id}"
    description: "Fetch a caregiver"
    roles: [CareCoordinator, BillingClerk]
    code: 200
    input: []
    output: Caregiver
    side_effects: []
  - method: POST
    path: "/care/caregivers/{id}/background-checks"
    description: "Open a background check for a caregiver"
    roles: [CareCoordinator]
    code: 201
    input: []
    output: BackgroundCheck
    side_effects: ["status=PENDING"]
  - method: GET
    path: "/care/caregivers/{id}/background-checks"
    description: "List a caregiver's background checks (FK reverse for BackgroundCheck.caregiver_id)"
    roles: [CareCoordinator]
    code: 200
    input: []
    output: BackgroundCheck[]
    side_effects: []
  - method: POST
    path: "/care/background-checks/{id}/decision"
    description: "Record a background-check decision"
    roles: [CareCoordinator]
    code: 200
    input: [outcome, "expires_at?"]
    output: BackgroundCheck
    side_effects: ["PENDING->CLEARED (sets expires_at) or PENDING->FLAGGED"]
  - method: POST
    path: "/care/caregivers/{id}/bonds"
    description: "Record a bonding coverage window for a caregiver"
    roles: [CareCoordinator]
    code: 201
    input: [coverage_cents, effective_date, expiry_date]
    output: BondingRecord
    side_effects: ["status=ACTIVE"]
  - method: GET
    path: "/care/caregivers/{id}/bonds"
    description: "List a caregiver's bonds (FK reverse for BondingRecord.caregiver_id)"
    roles: [CareCoordinator]
    code: 200
    input: []
    output: BondingRecord[]
    side_effects: []
  # ---- Schedules ----
  - method: GET
    path: "/care/schedules/{id}"
    description: "Fetch a schedule"
    roles: [CareCoordinator]
    code: 200
    input: []
    output: RecurringSchedule
    side_effects: []
  - method: POST
    path: "/care/schedules/{id}/generate-visits"
    description: "Materialize SCHEDULED visits for the schedule's matching days within [from_date, to_date]"
    roles: [CareCoordinator]
    code: 201
    input: [from_date, to_date]
    output: Visit[]
    side_effects: ["creates one SCHEDULED Visit per matching day_of_week occurrence; empty array when the window contains no matching day"]
  # ---- Visits ----
  - method: POST
    path: "/care/visits"
    description: "Create an ad-hoc visit; snapshots the client's billing rates"
    roles: [CareCoordinator]
    code: 201
    input: [client_id, task_type, scheduled_start, scheduled_end, "schedule_id?"]
    output: Visit
    side_effects: ["status=SCHEDULED; snapshots rate fields; rejects client-visit overlap (closed intervals)"]
  - method: GET
    path: "/care/visits/{id}"
    description: "Fetch a visit"
    roles: [CareCoordinator, BillingClerk, Caregiver, FamilyContact]
    code: 200
    input: []
    output: Visit
    side_effects: []
  - method: GET
    path: "/care/visits"
    description: "List/filter visits (FK reverse for Visit.client_id, Visit.caregiver_id, Visit.schedule_id)"
    roles: [CareCoordinator, BillingClerk]
    code: 200
    input: ["client_id?", "caregiver_id?", "schedule_id?", "limit?", "offset?"]
    output: Visit[]
    side_effects: []
  - method: POST
    path: "/care/visits/{id}/assignments"
    description: "Match a caregiver to a visit (OCC-guarded, supersedes prior match)"
    roles: [CareCoordinator]
    code: 201
    input: [caregiver_id, expected_visit_version]
    output: Assignment
    side_effects:
      - "creates Assignment CONFIRMED; supersedes any prior CONFIRMED assignment"
      - "sets visit.caregiver_id; recomputes committed_minutes; sets visit.estimated_cost_cents (provisional)"
      - "increments Visit.version by 1"
  - method: POST
    path: "/care/assignments/{id}/cancel"
    description: "Cancel a caregiver assignment"
    roles: [CareCoordinator]
    code: 200
    input: []
    output: Assignment
    side_effects: ["CONFIRMED->CANCELLED; releases caregiver.committed_minutes; clears visit.caregiver_id"]
  - method: GET
    path: "/care/assignments/{id}"
    description: "Fetch an assignment"
    roles: [CareCoordinator]
    code: 200
    input: []
    output: Assignment
    side_effects: []
  - method: GET
    path: "/care/assignments"
    description: "List/filter assignments (FK reverse for Assignment.visit_id and Assignment.caregiver_id)"
    roles: [CareCoordinator]
    code: 200
    input: ["visit_id?", "caregiver_id?", "limit?", "offset?"]
    output: Assignment[]
    side_effects: []
  - method: POST
    path: "/care/visits/{id}/add-ons"
    description: "Request an add-on service on a visit"
    roles: [CareCoordinator, FamilyContact]
    code: 201
    input: [addon_type, fee_cents]
    output: AddOn
    side_effects: ["status=REQUESTED"]
  - method: GET
    path: "/care/visits/{id}/add-ons"
    description: "List a visit's add-ons (FK reverse for AddOn.visit_id)"
    roles: [CareCoordinator, FamilyContact]
    code: 200
    input: []
    output: AddOn[]
    side_effects: []
  - method: POST
    path: "/care/add-ons/{id}/approve"
    description: "Approve or reject a requested add-on"
    roles: [CareCoordinator]
    code: 200
    input: [outcome]
    output: AddOn
    side_effects: ["REQUESTED->APPROVED or REQUESTED->REJECTED"]
  - method: POST
    path: "/care/visits/{id}/clock-in"
    description: "Caregiver starts the visit"
    roles: [Caregiver]
    code: 200
    input: [actual_start]
    output: Visit
    side_effects: ["SCHEDULED->IN_PROGRESS; sets actual_start; re-checks caregiver clearance/bonding"]
  - method: POST
    path: "/care/visits/{id}/clock-out"
    description: "Caregiver ends the visit; produces a DRAFT invoice"
    roles: [Caregiver]
    code: 200
    input: [actual_end, mileage_miles]
    output: Visit
    side_effects: ["{IN_PROGRESS,ESCALATED}->COMPLETED; sets actual_end, mileage; creates DRAFT Invoice via invoice_assembly"]
  - method: POST
    path: "/care/visits/{id}/escalate"
    description: "Caregiver escalates a wellness concern during a visit"
    roles: [Caregiver]
    code: 201
    input: [severity, reason]
    output: WellnessCheck
    side_effects: ["IN_PROGRESS->ESCALATED; creates WellnessCheck OPEN; no invoice"]
  - method: POST
    path: "/care/visits/{id}/cancel"
    description: "Cancel a scheduled visit; cascades to assignments and draft invoice"
    roles: [CareCoordinator]
    code: 200
    input: []
    output: Visit
    side_effects: ["SCHEDULED->CANCELLED; cascade hop 3 cancels CONFIRMED assignments and voids DRAFT invoice"]
  - method: POST
    path: "/care/visits/{id}/log"
    description: "Append a visit-log entry (append-only)"
    roles: [Caregiver]
    code: 201
    input: [entry_type, note]
    output: VisitLogEntry
    side_effects: []
  - method: GET
    path: "/care/visits/{id}/log"
    description: "List a visit's log entries (FK reverse for VisitLogEntry.visit_id)"
    roles: [CareCoordinator, FamilyContact, Caregiver]
    code: 200
    input: []
    output: VisitLogEntry[]
    side_effects: []
  # ---- Wellness checks ----
  - method: GET
    path: "/care/wellness-checks/{id}"
    description: "Fetch a wellness check"
    roles: [CareCoordinator, FamilyContact]
    code: 200
    input: []
    output: WellnessCheck
    side_effects: []
  - method: GET
    path: "/care/wellness-checks"
    description: "List/filter wellness checks (FK reverse for WellnessCheck.visit_id and WellnessCheck.client_id)"
    roles: [CareCoordinator, FamilyContact]
    code: 200
    input: ["visit_id?", "client_id?", "limit?", "offset?"]
    output: WellnessCheck[]
    side_effects: []
  - method: POST
    path: "/care/wellness-checks/{id}/acknowledge"
    description: "Family contact acknowledges a wellness check"
    roles: [FamilyContact]
    code: 200
    input: []
    output: WellnessCheck
    side_effects: ["OPEN->ACKNOWLEDGED; sets acknowledged_by"]
  - method: POST
    path: "/care/wellness-checks/{id}/resolve"
    description: "Resolve a wellness check"
    roles: [FamilyContact, CareCoordinator]
    code: 200
    input: []
    output: WellnessCheck
    side_effects: ["ACKNOWLEDGED->RESOLVED (FamilyContact) or OPEN->RESOLVED (CareCoordinator)"]
  # ---- Invoices ----
  - method: GET
    path: "/care/invoices/{id}"
    description: "Fetch an invoice"
    roles: [CareCoordinator, BillingClerk, FamilyContact]
    code: 200
    input: []
    output: Invoice
    side_effects: []
  - method: GET
    path: "/care/invoices"
    description: "List/filter invoices (FK reverse for Invoice.client_id and Invoice.visit_id)"
    roles: [CareCoordinator, BillingClerk]
    code: 200
    input: ["client_id?", "visit_id?", "limit?", "offset?"]
    output: Invoice[]
    side_effects: []
  - method: POST
    path: "/care/invoices/{id}/finalize"
    description: "Finalize a draft invoice; debits client balance"
    roles: [BillingClerk]
    code: 200
    input: []
    output: Invoice
    side_effects: ["DRAFT->FINALIZED; adds total_cents to Client.outstanding_balance_cents"]
  - method: POST
    path: "/care/invoices/{id}/void"
    description: "Void an invoice; reverses balance and withdraws claims"
    roles: [BillingClerk]
    code: 200
    input: []
    output: Invoice
    side_effects: ["->VOID; reverses balance; cascade hop 2 withdraws claims"]
  - method: POST
    path: "/care/invoices/{id}/claims"
    description: "Open an LTC reimbursement claim against a finalized-or-draft invoice"
    roles: [BillingClerk]
    code: 201
    input: [ltc_policy_id]
    output: ReimbursementClaim
    side_effects: ["status=DRAFT; snapshots benefit_type; computes eligible_cents/reimbursed_cents/client_responsibility_cents via ltc_reimbursement"]
  # ---- Claims ----
  - method: GET
    path: "/care/claims/{id}"
    description: "Fetch a reimbursement claim"
    roles: [CareCoordinator, BillingClerk]
    code: 200
    input: []
    output: ReimbursementClaim
    side_effects: []
  - method: GET
    path: "/care/claims"
    description: "List/filter claims (FK reverse for ReimbursementClaim.invoice_id and ReimbursementClaim.ltc_policy_id)"
    roles: [CareCoordinator, BillingClerk]
    code: 200
    input: ["invoice_id?", "ltc_policy_id?", "limit?", "offset?"]
    output: ReimbursementClaim[]
    side_effects: []
  - method: POST
    path: "/care/claims/{id}/submit"
    description: "Submit a claim (from DRAFT or NEEDS_INFO)"
    roles: [BillingClerk]
    code: 200
    input: []
    output: ReimbursementClaim
    side_effects: ["{DRAFT,NEEDS_INFO}->SUBMITTED; requires invoice FINALIZED and policy ACTIVE"]
  - method: POST
    path: "/care/claims/{id}/request-info"
    description: "Payer requests more information on a submitted claim"
    roles: [BillingClerk]
    code: 200
    input: ["note?"]
    output: ReimbursementClaim
    side_effects: ["SUBMITTED->NEEDS_INFO"]
  - method: POST
    path: "/care/claims/{id}/decision"
    description: "Record a payer decision on a submitted claim"
    roles: [BillingClerk]
    code: 200
    input: [outcome]
    output: ReimbursementClaim
    side_effects: ["SUBMITTED->APPROVED (credits balance, advances policy total) or SUBMITTED->DENIED"]
  - method: POST
    path: "/care/claims/{id}/withdraw"
    description: "Withdraw a claim"
    roles: [BillingClerk]
    code: 200
    input: []
    output: ReimbursementClaim
    side_effects: ["->WITHDRAWN; reverses reimbursement if it was APPROVED"]
  # ---- Test-driving clock ----
  - method: POST
    path: "/_clock/set_current_utc"
    description: "Set the server's logical clock. Startup default is 2026-03-01T00:00:00Z; before any call the clock reads exactly this default and never falls back to wall-clock time."
    roles: [CareCoordinator]
    code: 200
    input: [to_iso8601]
    output: null
    side_effects: ["advances the logical clock; lazily EXPIRES background checks and LAPSES bonds whose deadline has passed"]

# ---------------------------------------------------------------------------
# 1.6 Error Code Catalog
# ---------------------------------------------------------------------------
errors:
  - id: ERR_UNAUTHENTICATED
    http: 401
    condition: "Missing X-User-Role or X-User-ID header"
  - id: ERR_UNAUTHORIZED
    http: 403
    condition: "Acting role not permitted for this endpoint"
  - id: ERR_NOT_RESOURCE_OWNER
    http: 403
    condition: "entity_backed actor is not the owner of the target resource"
  - id: ERR_RESOURCE_NOT_FOUND
    http: 404
    condition: "A path-referenced resource does not exist"
  - id: ERR_INVALID_REQUEST
    http: 422
    condition: "Missing required field or wrong type"
  - id: ERR_INVALID_ENUM
    http: 422
    condition: "Enum field carries an undeclared member"
  - id: ERR_STALE_VISIT_VERSION
    http: 412
    condition: "expected_visit_version does not match current Visit.version"
  - id: ERR_INVALID_STATE
    http: 409
    condition: "Target resource is not in a state that permits the transition (generic)"
  - id: ERR_VISIT_NOT_SCHEDULED
    http: 409
    condition: "Assign/clock-in/cancel attempted on a visit not in SCHEDULED"
  - id: ERR_VISIT_NOT_IN_PROGRESS
    http: 409
    condition: "Clock-out or escalate attempted on a visit not in IN_PROGRESS (clock-out also allowed from ESCALATED)"
  - id: ERR_INVOICE_NOT_DRAFT
    http: 409
    condition: "Finalize attempted on an invoice not in DRAFT"
  - id: ERR_INVOICE_NOT_FINALIZED
    http: 409
    condition: "Claim submit attempted while the referenced invoice is not FINALIZED"
  - id: ERR_INVOICE_ALREADY_VOID
    http: 409
    condition: "Void attempted on an already-VOID invoice"
  - id: ERR_CLAIM_NOT_SUBMITTABLE
    http: 409
    condition: "Submit attempted on a claim not in {DRAFT, NEEDS_INFO}"
  - id: ERR_CLAIM_NOT_ACTIONABLE
    http: 409
    condition: "request-info/decision attempted on a claim not in SUBMITTED, or withdraw on a terminal claim"
  - id: ERR_ADDON_NOT_REQUESTED
    http: 409
    condition: "Approve/reject attempted on an add-on not in REQUESTED"
  - id: ERR_WELLNESS_NOT_ACTIONABLE
    http: 409
    condition: "Acknowledge on a non-OPEN check, or resolve from an invalid state"
  - id: ERR_SCHEDULE_NOT_ACTIVE
    http: 409
    condition: "generate-visits attempted on a schedule not in ACTIVE"
  - id: ERR_CLIENT_NOT_ACTIVE
    http: 409
    condition: "Visit/schedule creation attempted for a client not in ACTIVE"
  - id: ERR_CAREGIVER_NOT_CLEARED
    http: 409
    condition: "Assigned/acting caregiver lacks a CLEARED non-expired background check"
  - id: ERR_CAREGIVER_NOT_BONDED
    http: 409
    condition: "Assigned/acting caregiver lacks an ACTIVE bond at the current clock"
  - id: ERR_POLICY_CLIENT_MISMATCH
    http: 409
    condition: "Claim's LTCPolicy belongs to a different client than the claim's invoice"
  - id: ERR_CAREGIVER_DOUBLE_BOOKED
    http: 409
    condition: "Assignment would overlap another CONFIRMED assignment for the caregiver within the travel buffer"
  - id: ERR_CLIENT_VISIT_OVERLAP
    http: 409
    condition: "New visit's closed interval overlaps an existing non-cancelled visit for the same client"
  - id: ERR_INVALID_TIME_RANGE
    http: 422
    condition: "scheduled_end <= scheduled_start, actual_end <= actual_start, mileage < 0, or schedule end_date < start_date"
  - id: ERR_POLICY_EXHAUSTED
    http: 402
    condition: "Claim submit attempted against an EXHAUSTED policy"
  - id: ERR_POLICY_NOT_ACTIVE
    http: 409
    condition: "Claim operation attempted against a policy not in ACTIVE (alias for exhausted/other inactive states)"

# ---------------------------------------------------------------------------
# 1.7 RBAC Matrix
# ---------------------------------------------------------------------------
roles:
  - name: CareCoordinator
    description: "Operations staff who onboard clients/caregivers, run background checks and bonding, build schedules, match caregivers, and manage visits"
    identity: "opaque"
    exclusive_operations:
      - "create/suspend clients, family contacts, schedules, LTC policies"
      - "create caregivers, background checks + decisions, bonds"
      - "generate visits, create visits, assign/cancel caregivers, approve add-ons, cancel visits"
      - "resolve wellness checks directly from OPEN"
      - "set the logical clock"
    shared_operations:
      - "read clients/caregivers/visits/schedules/assignments/invoices/claims/policies/wellness/logs"
      - "request add-ons"
  - name: Caregiver
    description: "Field caregiver who performs the visit"
    identity: "entity_backed:Caregiver"
    exclusive_operations:
      - "clock-in, clock-out, escalate, append visit-log entries (only on visits where visit.caregiver_id == self)"
    shared_operations:
      - "read own visits and their logs"
  - name: FamilyContact
    description: "Family member with portal access to a specific client"
    identity: "entity_backed:FamilyContact"
    exclusive_operations:
      - "acknowledge wellness checks; resolve after acknowledging"
    shared_operations:
      - "read the client's visits, invoices, wellness checks, and visit logs"
      - "request add-ons"
  - name: BillingClerk
    description: "Billing staff who finalize/void invoices and manage LTC reimbursement claims"
    identity: "opaque"
    exclusive_operations:
      - "finalize/void invoices; open, submit, request-info, decide, withdraw claims"
    shared_operations:
      - "read clients, caregivers, visits, invoices, claims, policies"
