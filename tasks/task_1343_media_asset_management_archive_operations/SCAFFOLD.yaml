    code: 201
    input: [asset_id, matter_reference, reason]
    output: LegalHold
    side_effects:
      - "placed_by_user_id := X-User-ID; status = ACTIVE"
      - "Asset.hold_status → HELD (Asset.version += 1)"
      - "DisposalOrders for asset in PENDING_APPROVAL | APPROVED → BLOCKED; an APPROVED order also reverts Asset DISPOSAL_SCHEDULED → ARCHIVED"
      - "MigrationJobs for asset in QUEUED → HOLD_PAUSED"
  - method: GET
    path: "/archive/legal-holds/{id}"
    description: "Get a legal hold"
    roles: [SystemAdmin, IngestCoordinator, MetadataCataloger, MetadataLibrarian, ArchivistLead, RightsManager, LegalCounsel, AccessOfficer, Requester, FinanceOfficer, LabTechnician]
    code: 200
    input: []
    output: LegalHold
    side_effects: []

  - method: GET
    path: "/archive/legal-holds"
    description: "List legal holds"
    roles: [SystemAdmin, IngestCoordinator, MetadataCataloger, MetadataLibrarian, ArchivistLead, RightsManager, LegalCounsel, AccessOfficer, Requester, FinanceOfficer, LabTechnician]
    code: 200
    input: ["asset_id?", "status?", "limit?", "offset?"]
    output: "LegalHold[]"
    side_effects: []
  - method: POST
    path: "/archive/legal-holds/{id}/release"
    description: "Release a hold (ACTIVE → RELEASED); releaser must differ from placer"
    roles: [LegalCounsel]
    code: 200
    input: []
    output: LegalHold
    side_effects:
      - "released_by_user_id := X-User-ID; released_at := now"
      - "If last ACTIVE hold for the asset: hold_status → CLEAR; HOLD_PAUSED MigrationJobs → QUEUED"

  # --- RetentionPolicy ---
  - method: POST
    path: "/archive/retention-policies"
    description: "Create a retention policy (one per media_type)"
    roles: [SystemAdmin]
    code: 201
    input: [media_type, min_retention_years, "requires_legal_review?"]
    output: RetentionPolicy
    side_effects: []
  - method: GET
    path: "/archive/retention-policies"
    description: "List retention policies"
    roles: [SystemAdmin, IngestCoordinator, MetadataCataloger, MetadataLibrarian, ArchivistLead, RightsManager, LegalCounsel, AccessOfficer, Requester, FinanceOfficer, LabTechnician]
    code: 200
    input: ["media_type?", "limit?", "offset?"]
    output: "RetentionPolicy[]"
    side_effects: []

  # --- DisposalOrder ---
  - method: POST
    path: "/archive/disposal-orders"
    description: "Create a disposal order (DRAFT) pinned to the asset version; requires asset ARCHIVED (ERR_ASSET_NOT_ARCHIVED), retention elapsed or override, hold CLEAR; OCC via expected_asset_version"
    roles: [ArchivistLead]
    code: 201
    input: [asset_id, scheduled_execution_date, expected_asset_version, "retention_override?", "override_reason?"]
    output: DisposalOrder
    side_effects:
      - "created_by_user_id := X-User-ID"
      - "increments Asset.version by 1; pinned_asset_version := Asset.version AFTER this increment (== expected_asset_version + 1)"
  - method: GET
    path: "/archive/disposal-orders"
    description: "List disposal orders"
    roles: [SystemAdmin, IngestCoordinator, MetadataCataloger, MetadataLibrarian, ArchivistLead, RightsManager, LegalCounsel, AccessOfficer, Requester, FinanceOfficer, LabTechnician]
    code: 200
    input: ["asset_id?", "status?", "limit?", "offset?"]
    output: "DisposalOrder[]"
    side_effects: []
  - method: GET
    path: "/archive/disposal-orders/{id}"
    description: "Get a disposal order"
    roles: [SystemAdmin, IngestCoordinator, MetadataCataloger, MetadataLibrarian, ArchivistLead, RightsManager, LegalCounsel, AccessOfficer, Requester, FinanceOfficer, LabTechnician]
    code: 200
    input: []
    output: DisposalOrder
    side_effects: []
  - method: POST
    path: "/archive/disposal-orders/{id}/submit"
    description: "Submit order for approval (DRAFT → PENDING_APPROVAL)"
    roles: [ArchivistLead]
    code: 200
    input: []
    output: DisposalOrder
    side_effects: []
  - method: POST
    path: "/archive/disposal-orders/{id}/approve"
    description: "Approve order (PENDING_APPROVAL → APPROVED); SoD + hold + version-pin re-check; asset → DISPOSAL_SCHEDULED"
    roles: [ArchivistLead]
    code: 200
    input: []
    output: DisposalOrder
    side_effects: ["approved_by_user_id := X-User-ID; Asset ARCHIVED → DISPOSAL_SCHEDULED"]
  - method: POST
    path: "/archive/disposal-orders/{id}/reject"
    description: "Reject order (PENDING_APPROVAL → REJECTED)"
    roles: [ArchivistLead]
    code: 200
    input: [reason]
