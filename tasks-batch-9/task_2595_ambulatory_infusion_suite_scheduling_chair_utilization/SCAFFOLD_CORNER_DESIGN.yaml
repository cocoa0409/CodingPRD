              payload: { service_date: "2026-08-17", requested_start_minute: 540, booking_class: "ROUTINE", expected_appointment_version: "${ap1_vnow}" }
              as: Scheduler
              captures: { ap2: $.data.id, ap2_from: $.data.rescheduled_from_appointment_id, ap2_date: $.data.service_date, ap2_start: $.data.start_minute, ap2_v: $.data.version, ap2_chair: $.data.chair_id }
            - call: "GET /appointments/${ap1}"
