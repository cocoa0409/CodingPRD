  # =================================================================
  # Rule 5 — priority_pair_validation_conflict
  # =================================================================
  - rule_id: priority_pair_validation_conflict
    instances:
      - name: sell_credit_hold_masks_credit_limit
        grounds:
          - validations[priority=7]
          - validations[priority=24]
          - errors[ERR_DISTRIBUTOR_CREDIT_HOLD]
          - errors[ERR_CREDIT_LIMIT_EXCEEDED]
        distinguishing_aspect: |
          Error-category pair state vs business_fiscal: the buyer is BOTH on
          CREDIT_HOLD (state, priority 7) AND below the needed credit headroom
          (fiscal, priority 24); the state error ERR_DISTRIBUTOR_CREDIT_HOLD must
          win and no deposit may be created.
        test_recipe:
          setup:
            - "Distributor D-H has credit_limit_cents == 100000 (less than the 200000 deposit) and is on CREDIT_HOLD"
            - "Engine E of the ACTIVE spec is SEALED and unsold"
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-01T00:00:00Z" }
              as: PlantAdmin
