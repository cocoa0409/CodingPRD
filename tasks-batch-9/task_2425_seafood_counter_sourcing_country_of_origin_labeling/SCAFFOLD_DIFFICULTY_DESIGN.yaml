              as: ChainAdmin
              captures: { cod_id: $.data.id }
            - call: "POST /seafood-ops/lots"
              payload: { counter_id: "${counter_id}", supplier_id: "${supplier_id}", species_id: "${cod_id}", lot_code: "COD-0801-A", harvest_method: "WILD_LONGLINE", production_method: "WILD", origin_country_code: "US", previously_frozen: false, fresh_claim: true, received_weight_kg: 20.000, unit_cost_cents_per_kg: 1700, retail_price_cents_per_kg: 2450, cooked_retail_price_cents_per_kg: 2600 }
              as: SeafoodManager
              as_user_id: "${counter_id}"
              captures: { lot_id: $.data.id }
            - call: "POST /seafood-ops/lots/${lot_id}/case"
              payload: { case_slot: 1 }
              as: SeafoodManager
              as_user_id: "${counter_id}"
            - call: "POST /seafood-ops/_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-01T14:00:00Z" }
              as: ChainAdmin
          trigger:
            - call: "POST /seafood-ops/ice-bed-readings"
              payload: { counter_id: "${counter_id}", case_slot: 1, reading_at: "2026-08-01T13:00:00Z", temperature_c: 4.4, taken_by_user_id: "assoc-7" }
              as: SeafoodManager
              as_user_id: "${counter_id}"
              captures: { reading_at_limit: $.data.id }
            - call: "POST /seafood-ops/ice-bed-readings"
              payload: { counter_id: "${counter_id}", case_slot: 1, reading_at: "2026-08-01T13:30:00Z", temperature_c: 4.5, taken_by_user_id: "assoc-7" }
              as: SeafoodManager
              as_user_id: "${counter_id}"
              captures: { reading_over_limit: $.data.id }
          assert:
            - "IceBedReading.${reading_at_limit}.breach == false"
            - "after trigger call 1: 0 ColdChainExcursion rows exist for Counter.${counter_id}"
            - "after trigger call 1: SupplierLot.${lot_id}.intake_status == CASED"
            - "IceBedReading.${reading_over_limit}.breach == true"
            - "after trigger call 2: exactly 1 ColdChainExcursion exists for Counter.${counter_id} with case_slot == 1, status == OPEN, started_at == 2026-08-01T13:30:00Z, exposure_minutes == 0, peak_temperature_c == 4.5, severity == MINOR"
            - "after trigger call 2: SupplierLot.${lot_id}.intake_status == HELD"

      - name: empty_candidate_set_yields_zero_required_samples
        grounds:
          - calculations.verification_sampling_plan
          - entities.Counter.fields.last_cycle_required_samples
          - entities.Counter.fields.last_cycle_max_supplier_risk_index
          - concurrency_rules[cycle-close-stale-counter]
        distinguishing_aspect: |
          The sampling plan short-circuits on an EMPTY candidate set to
          last_cycle_required_samples 0, not to BASE_SAMPLES 1, so a counter with no lot in
          intake_status CASED or HELD must record 0 required samples and a
          last_cycle_max_supplier_risk_index of 0.00 after the cycle closes.
        test_recipe:
          setup:
            - "logical clock at 2026-08-01T08:00:00Z"
            - "Counter freshly registered at version 1, verification_cycle_index 0, posture OPEN"
            - "no SupplierLot, no Supplier and no Species exist, so the candidate set is empty"
          setup_api_calls:
            - call: "POST /seafood-ops/_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-01T08:00:00Z" }
              as: ChainAdmin
            - call: "POST /seafood-ops/counters"
              payload: { store_number: "4120", department_name: "Seafood Service Counter", case_slot_count: 6 }
              as: ChainAdmin
              captures: { counter_id: $.data.id, counter_v: $.data.version }
          trigger:
            - call: "POST /seafood-ops/counters/${counter_id}/close-verification-cycle"
              payload: { expected_counter_version: "${counter_v}" }
              as: ComplianceOfficer
              as_user_id: "officer-sampling-1"
          assert:
            - "Counter.${counter_id}.last_cycle_required_samples == 0"
            - "Counter.${counter_id}.last_cycle_required_samples != 1"
            - "Counter.${counter_id}.last_cycle_max_supplier_risk_index == 0.00"
            - "Counter.${counter_id}.verification_cycle_index == 1"
            - "Counter.${counter_id}.posture == OPEN"

      - name: goodwill_tier_boundary_at_exactly_fifty_thousand
        grounds:
          - calculations.supplier_chargeback_assessment
          - entities.SupplierLot.fields.chargeback_assessed_cents
          - state_machines.SupplierLot.chargeback_status.NONE_to_ASSESSED
        distinguishing_aspect: |
          The goodwill tier boundary is inclusive-low for tier 2: a
          pre_credit_subtotal_cents of exactly 50000 takes GOODWILL_TIER_2_RATE 0.08 and
          yields 46000, whereas treating the boundary as tier 1 at 0.15 yields 42500.
        test_recipe:
          setup:
            - "logical clock at 2026-08-01T08:00:00Z"
            - "SupplierLot of Tilapia, 10.000 kg remaining at retail 2100 cents/kg so lot_value_cents is exactly 21000 and pre_credit_subtotal_cents is exactly 50000"
            - "landed cost 1500 cents/kg; lot CASED in slot 1 with a PUBLISHED CaseLabel"
            - "Supplier in GOOD_STANDING with no prior samples; VerificationSample in status IN_LAB"
          setup_api_calls:
            - call: "POST /seafood-ops/_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-01T08:00:00Z" }
              as: ChainAdmin
            - call: "POST /seafood-ops/counters"
              payload: { store_number: "4120", department_name: "Seafood Service Counter", case_slot_count: 6 }
              as: ChainAdmin
              captures: { counter_id: $.data.id }
            - call: "POST /seafood-ops/suppliers"
              payload: { name: "Gulf Bay Dealers", permit_number: "PERMIT-8801" }
              as: ChainAdmin
              captures: { supplier_id: $.data.id }
            - call: "POST /seafood-ops/species"
              payload: { market_name: "Atlantic Cod", scientific_name: "Gadus morhua", acceptable_market_names: ["Atlantic Cod", "Cod"], simp_covered: false, high_risk_substitution: false, sustainability_program_eligible: true }
              as: ChainAdmin
              captures: { cod_id: $.data.id }
            - call: "POST /seafood-ops/species"
              payload: { market_name: "Tilapia", scientific_name: "Oreochromis niloticus", acceptable_market_names: ["Tilapia"], simp_covered: false, high_risk_substitution: false, sustainability_program_eligible: false }
              as: ChainAdmin
              captures: { tilapia_id: $.data.id }
            - call: "POST /seafood-ops/lots"
              payload: { counter_id: "${counter_id}", supplier_id: "${supplier_id}", species_id: "${tilapia_id}", lot_code: "TIL-0801-C", harvest_method: "AQUACULTURE_POND", production_method: "FARMED", origin_country_code: "EC", previously_frozen: false, fresh_claim: false, received_weight_kg: 10.000, unit_cost_cents_per_kg: 1500, retail_price_cents_per_kg: 2100, cooked_retail_price_cents_per_kg: 2400 }
              as: SeafoodManager
              as_user_id: "${counter_id}"
              captures: { lot_id: $.data.id }
            - call: "POST /seafood-ops/lots/${lot_id}/case"
              payload: { case_slot: 1 }
              as: SeafoodManager
              as_user_id: "${counter_id}"
            - call: "GET /seafood-ops/lots/${lot_id}"
              payload: {}
              as: SeafoodManager
              as_user_id: "${counter_id}"
              captures: { lot_v: $.data.version }
            - call: "POST /seafood-ops/case-labels"
              payload: { lot_id: "${lot_id}", expected_lot_version: "${lot_v}" }
              as: SeafoodManager
              as_user_id: "${counter_id}"
              captures: { label_id: $.data.id }
            - call: "POST /seafood-ops/verification-samples"
              payload: { lot_id: "${lot_id}", sampled_weight_g: 150 }
              as: ComplianceOfficer
              as_user_id: "officer-sampling-1"
              captures: { sample_id: $.data.id }
            - call: "POST /seafood-ops/verification-samples/${sample_id}/send-to-lab"
              payload: { lab_reference: "LAB-C-0001" }
              as: ComplianceOfficer
              as_user_id: "officer-sampling-1"
          trigger:
            - call: "POST /seafood-ops/verification-samples/${sample_id}/result"
              payload: { observed_species_id: "${cod_id}" }
              as: ComplianceOfficer
              as_user_id: "officer-sampling-1"
          assert:
            - "SupplierLot.${lot_id}.chargeback_assessed_cents == 46000"
            - "SupplierLot.${lot_id}.chargeback_assessed_cents != 42500"
            - "Supplier.${supplier_id}.chargeback_outstanding_cents == 46000"
            - "exactly 1 ShrinkEvent exists for SupplierLot.${lot_id} with reason == MISLABEL_DESTRUCTION and provisional_value_cents == 16450"

  # ===========================================================================
  - rule_id: cross_entity_state_dependency
    instances:
      - name: casing_covered_species_requires_accepted_import_document
        grounds:
          - validations[priority=37]
          - errors.ERR_SIMP_DOCUMENT_MISSING
          - state_machines.SimpDocument.SUBMITTED_to_ACCEPTED
          - state_machines.SupplierLot.intake_status.RECEIVED_to_CASED
          - entities.Species.fields.simp_covered
        distinguishing_aspect: |
          Casing a lot reads the state of a DIFFERENT entity in a different aggregate: the
          SimpDocument must be ACCEPTED, and a merely SUBMITTED document is refused with
          ERR_SIMP_DOCUMENT_MISSING even though nothing about the lot itself changed between
          the two attempts.
        test_recipe:
          setup:
            - "logical clock at 2026-08-01T08:00:00Z"
            - "Species Red Snapper with simp_covered true"
            - "SupplierLot of Red Snapper in intake_status RECEIVED"
            - "SimpDocument for that lot in status SUBMITTED (not yet ACCEPTED), harvest_date 2026-07-20 before landing_date 2026-07-22"
          setup_api_calls:
            - call: "POST /seafood-ops/_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-01T08:00:00Z" }
              as: ChainAdmin
            - call: "POST /seafood-ops/counters"
              payload: { store_number: "4120", department_name: "Seafood Service Counter", case_slot_count: 6 }
              as: ChainAdmin
              captures: { counter_id: $.data.id }
            - call: "POST /seafood-ops/suppliers"
              payload: { name: "Gulf Bay Dealers", permit_number: "PERMIT-8801" }
              as: ChainAdmin
              captures: { supplier_id: $.data.id }
            - call: "POST /seafood-ops/species"
              payload: { market_name: "Red Snapper", scientific_name: "Lutjanus campechanus", acceptable_market_names: ["Red Snapper"], simp_covered: true, high_risk_substitution: true, sustainability_program_eligible: false }
              as: ChainAdmin
              captures: { snapper_id: $.data.id }
            - call: "POST /seafood-ops/lots"
              payload: { counter_id: "${counter_id}", supplier_id: "${supplier_id}", species_id: "${snapper_id}", lot_code: "SNP-0801-D", harvest_method: "WILD_TRAP", production_method: "WILD", origin_country_code: "MX", previously_frozen: false, fresh_claim: false, received_weight_kg: 15.000, unit_cost_cents_per_kg: 2600, retail_price_cents_per_kg: 3400, cooked_retail_price_cents_per_kg: 3800 }
              as: SeafoodManager
              as_user_id: "${counter_id}"
              captures: { lot_id: $.data.id }
            - call: "POST /seafood-ops/simp-documents"
              payload: { lot_id: "${lot_id}", harvesting_vessel_name: "Estrella del Golfo", harvest_date: "2026-07-20T00:00:00Z", landing_date: "2026-07-22T00:00:00Z", chain_of_custody_ref: "COC-55210" }
              as: SupplierRep
              as_user_id: "${supplier_id}"
              captures: { doc_id: $.data.id }
            - call: "POST /seafood-ops/simp-documents/${doc_id}/submit"
              payload: {}
              as: SupplierRep
              as_user_id: "${supplier_id}"
          trigger:
            - call: "POST /seafood-ops/lots/${lot_id}/case"
              payload: { case_slot: 1 }
              as: SeafoodManager
              as_user_id: "${counter_id}"
              captures: { err: $.data.error_id }
            - call: "POST /seafood-ops/simp-documents/${doc_id}/review"
              payload: { decision: "ACCEPT", review_note: "chain of custody complete" }
              as: ComplianceOfficer
              as_user_id: "officer-simp-3"
            - call: "POST /seafood-ops/lots/${lot_id}/case"
              payload: { case_slot: 1 }
              as: SeafoodManager
              as_user_id: "${counter_id}"
          assert:
            - "trigger call 1 returns HTTP 409 with $.data.error_id == ERR_SIMP_DOCUMENT_MISSING"
            - "after trigger call 1: SupplierLot.${lot_id}.intake_status == RECEIVED and SupplierLot.${lot_id}.case_slot == null"
            - "after trigger call 2: SimpDocument.${doc_id}.status == ACCEPTED"
            - "after trigger call 3: SupplierLot.${lot_id}.intake_status == CASED and SupplierLot.${lot_id}.case_slot == 1"
            - "SupplierLot.${lot_id}.cased_at == 2026-08-01T08:00:00Z"

      - name: ad_publish_blocked_by_counter_posture_restricted
        grounds:
          - validations[priority=35]
          - errors.ERR_COUNTER_RESTRICTED
          - state_machines.AdvertisedItem.status.APPROVED_to_PUBLISHED
          - state_machines.Counter.posture.OPEN_to_RESTRICTED
          - calculations.counter_posture_derivation
        distinguishing_aspect: |
          Publication of an APPROVED advertisement reads a computed field on the Counter
          aggregate rather than anything on the AdvertisedItem: an excursion opened in the
          EMPTY slot 4 leaves the ad's own lot and CaseLabel untouched, yet the counter's
