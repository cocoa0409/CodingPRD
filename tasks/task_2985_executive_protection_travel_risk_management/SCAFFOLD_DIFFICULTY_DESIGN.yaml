      - name: empty_itinerary_cardinality_boundary_at_submit_for_approval
        grounds:
          - validations[priority=38]
          - validations[priority=31]
          - errors.ERR_TRIP_HAS_NO_LEGS
          - state_machines.Trip.DRAFT_to_PENDING_REVIEW
          - entities.Trip.max_leg_risk_band
          - calculations.required_approval_level
          - endpoints.POST_/exec-protection/trips/{id}/submit-for-approval
        distinguishing_aspect: |
          A different metric and a different endpoint from the tier-edge instance above:
          COLLECTION CARDINALITY at zero, exercised on
          POST /exec-protection/trips/{id}/submit-for-approval. Zero legs is the degenerate
          edge of every leg-quantified precondition on that transition: the advance-work
          rule (priority 31), the coverage rule (priority 48) and the excluded-country rule
          are all universally quantified over the legs and therefore VACUOUSLY TRUE on an
          empty set, so the only rule that can fire is the existence rule at priority 38.
          An implementation that folds priority 38 in after the quantified rules still
          returns the same error here, but an implementation that treats
          `max over an empty set` as 0-versus-error, or that lets a legless trip through
          because "no leg failed advance work", diverges immediately. Cardinality 1 is then
          shown to pass on the very same trip, so the claim is about the boundary itself and
          not about the trip being otherwise invalid.
        test_recipe:
          setup:
            - "logical clock at 2026-08-01T00:00:00Z; TIER_3 executive with budget 100000000, residential_component 10.00, destination PT rated LOW, VERIFIED MEDICAL_EVAC policy 500000000 whose window 2026-01-01..2027-06-01 covers the trip"
            - "one APPROVED assessment"
            - "one trip 2026-09-10T00:00:00Z..2026-09-12T00:00:00Z with ZERO legs; every other submit precondition already satisfied"
