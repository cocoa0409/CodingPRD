          - errors[ERR_POST_TEST_HOURS_NOT_MET]
        distinguishing_aspect: |
          Boundary on the cumulative instructional-hour ledger at the exact threshold: 39.75 hours
          (one 0.25 increment short) is refused and 40.00 is accepted because the comparison is
          inclusive. The interval gate is already satisfied so the hour gate is the only variable.
