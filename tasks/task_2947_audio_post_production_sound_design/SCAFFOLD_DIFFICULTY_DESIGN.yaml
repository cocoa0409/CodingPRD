          setup:
            - "THEATRICAL spec: target_lufs -24.00, tolerance_lu 0.50, true_peak_max_dbtp -2.00, 5_1, requires_me_stems false, max_remediation_rounds 2."
            - "Locked project, one CONFORMED stem package, one COMPLETED FINAL_MIX booking, one PREPARED deliverable."
