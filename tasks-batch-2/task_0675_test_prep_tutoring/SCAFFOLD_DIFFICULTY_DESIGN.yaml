  # ===========================================================================
  - rule_id: boundary_precision_check
    instances:
      - name: guarantee_delta_exactly_meets_min_is_not_eligible
        grounds:
          - calculations.score_improvement_guarantee_eligibility
          - validations[priority=11]
          - errors[ERR_GUARANTEE_THRESHOLD_MET]
          - entities.Enrollment.fields.guarantee_status
        distinguishing_aspect: |
          Numeric strict-< boundary on the score-improvement metric reached via POST
          /cohorts/{id}/conclude: improvement exactly equal to guarantee_min_delta (1200-1000 == 200)
          satisfies the guarantee (NOT missed), so guarantee_status becomes INELIGIBLE — distinct
          metric and endpoint from the empty-collection boundary below.
