          assert:
            - "GiftCard.${c_id}.balance_cents == 100000"
            - "GiftCard.${c_id}.status == ACTIVE"

  # ===========================================================================
  - rule_id: cross_entity_state_dependency
    instances:
      - name: card_activate_requires_program_active
        grounds:
          - state_machines.GiftCard.INACTIVE_to_ACTIVE
          - entities.CardProgram.fields.status
        distinguishing_aspect: "GiftCard INACTIVE->ACTIVE is rejected ERR_PROGRAM_NOT_ACTIVE when the owning CardProgram is PAUSED; the card's valid transition depends on the CardProgram's state — pair GiftCard↔CardProgram."
        test_recipe:
          setup:
            - "Merchant ACTIVE; program ACTIVE; batch committed (one INACTIVE card minted); then program PAUSED."
          setup_api_calls:
            - { call: "POST /merchants", payload: { legal_name: "Acme" }, as: PlatformAdmin, captures: { m_id: "$.data.id" } }
            - { call: "POST /merchants/${m_id}/activate", payload: {}, as: PlatformAdmin }
            - { call: "POST /card-programs", payload: { merchant_id: "${m_id}", name: "P", expiry_months: 12, max_balance_cents: 100000, min_load_cents: 500 }, as: MerchantAdmin, as_user_id: "${m_id}", captures: { p_id: "$.data.id" } }
            - { call: "POST /card-programs/${p_id}/activate", payload: {}, as: MerchantAdmin, as_user_id: "${m_id}" }
            - { call: "POST /card-batches", payload: { card_program_id: "${p_id}", channel: "DIGITAL", card_count: 1, unit_load_cents: 5000 }, as: MerchantAdmin, as_user_id: "${m_id}", captures: { b_id: "$.data.id" } }
            - { call: "POST /card-batches/${b_id}/commit", payload: {}, as: MerchantAdmin, as_user_id: "${m_id}" }
            - { call: "GET /gift-cards", payload: { card_batch_id: "${b_id}" }, as: Any, captures: { c_id: "$.data[0].id" } }
            - { call: "POST /card-programs/${p_id}/pause", payload: {}, as: MerchantAdmin, as_user_id: "${m_id}" }
          trigger:
            - { call: "POST /gift-cards/${c_id}/activate", payload: {}, as: POSTerminal, captures: { err: "$.data.error_id" } }
          assert:
            - "response.data.error_id == ERR_PROGRAM_NOT_ACTIVE"
            - "GiftCard.${c_id}.status == INACTIVE"

      - name: settlement_finalize_requires_merchant_active
        grounds:
          - state_machines.SettlementBatch.OPEN_to_FINALIZED
          - entities.Merchant.fields.status
        distinguishing_aspect: "SettlementBatch OPEN->FINALIZED is rejected ERR_MERCHANT_NOT_ACTIVE when the owning Merchant is SUSPENDED; the batch's valid transition depends on the Merchant's state — pair SettlementBatch↔Merchant, distinct from GiftCard↔CardProgram."
        test_recipe:
          setup:
            - "Merchant ACTIVE; program ACTIVE; one card ACTIVE loaded 100000, redeemed 20000; settlement opened by officer-1; then merchant SUSPENDED."
          setup_api_calls:
            - { call: "POST /merchants", payload: { legal_name: "Acme" }, as: PlatformAdmin, captures: { m_id: "$.data.id" } }
            - { call: "POST /merchants/${m_id}/activate", payload: {}, as: PlatformAdmin }
            - { call: "POST /card-programs", payload: { merchant_id: "${m_id}", name: "P", expiry_months: 12, max_balance_cents: 100000, min_load_cents: 500 }, as: MerchantAdmin, as_user_id: "${m_id}", captures: { p_id: "$.data.id" } }
            - { call: "POST /card-programs/${p_id}/activate", payload: {}, as: MerchantAdmin, as_user_id: "${m_id}" }
            - { call: "POST /card-batches", payload: { card_program_id: "${p_id}", channel: "DIGITAL", card_count: 1, unit_load_cents: 100000 }, as: MerchantAdmin, as_user_id: "${m_id}", captures: { b_id: "$.data.id" } }
            - { call: "POST /card-batches/${b_id}/commit", payload: {}, as: MerchantAdmin, as_user_id: "${m_id}" }
            - { call: "GET /gift-cards", payload: { card_batch_id: "${b_id}" }, as: Any, captures: { c_id: "$.data[0].id" } }
            - { call: "POST /gift-cards/${c_id}/activate", payload: {}, as: POSTerminal }
            - { call: "POST /gift-cards/${c_id}/redeem", payload: { amount_cents: 20000 }, as: POSTerminal }
            - { call: "GET /merchants/${m_id}", payload: {}, as: Any, captures: { m_ver: "$.data.version" } }
            - { call: "POST /settlement-batches", payload: { merchant_id: "${m_id}", period_start: "2026-07-01T00:00:00Z", period_end: "2026-08-01T00:00:00Z", expected_merchant_version: "${m_ver}" }, as: SettlementOfficer, as_user_id: "officer-1", captures: { s_id: "$.data.id" } }
            - { call: "POST /merchants/${m_id}/suspend", payload: {}, as: PlatformAdmin }
          trigger:
            - { call: "POST /settlement-batches/${s_id}/finalize", payload: {}, as: SettlementOfficer, as_user_id: "officer-2", captures: { err: "$.data.error_id" } }
          assert:
            - "response.data.error_id == ERR_MERCHANT_NOT_ACTIVE"
            - "SettlementBatch.${s_id}.status == OPEN"

  # ===========================================================================
  - rule_id: resource_temporal_overlap
    instances:
      - name: settlement_period_halfopen_overlap
        grounds:
          - "validations[priority=10]"
          - entities.SettlementBatch.fields.period_start
          - entities.SettlementBatch.fields.period_end
        distinguishing_aspect: "Opening a second settlement batch [2026-07-15,2026-08-15) for a merchant that already has [2026-07-01,2026-08-01) is rejected ERR_SETTLEMENT_PERIOD_OVERLAP because the half-open [start,end) intervals intersect; a touching batch [2026-08-01,2026-09-01) would be allowed — half-open interval semantics on the Merchant resource."
        test_recipe:
          setup:
            - "Merchant ACTIVE; one settlement batch already OPEN covering [2026-07-01,2026-08-01)."
          setup_api_calls:
            - { call: "POST /merchants", payload: { legal_name: "Acme" }, as: PlatformAdmin, captures: { m_id: "$.data.id" } }
            - { call: "POST /merchants/${m_id}/activate", payload: {}, as: PlatformAdmin }
            - { call: "GET /merchants/${m_id}", payload: {}, as: Any, captures: { m_ver1: "$.data.version" } }
            - { call: "POST /settlement-batches", payload: { merchant_id: "${m_id}", period_start: "2026-07-01T00:00:00Z", period_end: "2026-08-01T00:00:00Z", expected_merchant_version: "${m_ver1}" }, as: SettlementOfficer, as_user_id: "officer-1", captures: { s_a: "$.data.id" } }
            - { call: "GET /merchants/${m_id}", payload: {}, as: Any, captures: { m_ver2: "$.data.version" } }
          trigger:
            - { call: "POST /settlement-batches", payload: { merchant_id: "${m_id}", period_start: "2026-07-15T00:00:00Z", period_end: "2026-08-15T00:00:00Z", expected_merchant_version: "${m_ver2}" }, as: SettlementOfficer, as_user_id: "officer-1", captures: { err: "$.data.error_id" } }
          assert:
            - "response.data.error_id == ERR_SETTLEMENT_PERIOD_OVERLAP"

      - name: campaign_window_buffer_overlap
        grounds:
          - "validations[priority=11]"
          - entities.IncentiveCampaign.fields.starts_at
          - entities.IncentiveCampaign.fields.ends_at
        distinguishing_aspect: "A second campaign [2026-09-03,2026-09-30] on a program whose first campaign is [2026-08-01,2026-08-31] is rejected ERR_CAMPAIGN_WINDOW_OVERLAP because the 3-day gap is below the mandatory 7-day CAMPAIGN_GAP_DAYS buffer — closed-interval + buffer semantics on the CardProgram resource, distinct from the settlement half-open/touching rule."
        test_recipe:
          setup:
            - "Merchant ACTIVE; a CardProgram created with one IncentiveCampaign [2026-08-01,2026-08-31]."
          setup_api_calls:
            - { call: "POST /merchants", payload: { legal_name: "Acme" }, as: PlatformAdmin, captures: { m_id: "$.data.id" } }
            - { call: "POST /merchants/${m_id}/activate", payload: {}, as: PlatformAdmin }
            - { call: "POST /card-programs", payload: { merchant_id: "${m_id}", name: "P", expiry_months: 12, max_balance_cents: 100000, min_load_cents: 500 }, as: MerchantAdmin, as_user_id: "${m_id}", captures: { p_id: "$.data.id" } }
            - { call: "POST /incentive-campaigns", payload: { card_program_id: "${p_id}", name: "Aug", bonus_bps: 1000, starts_at: "2026-08-01T00:00:00Z", ends_at: "2026-08-31T00:00:00Z" }, as: MerchantAdmin, as_user_id: "${m_id}", captures: { camp_a: "$.data.id" } }
          trigger:
            - { call: "POST /incentive-campaigns", payload: { card_program_id: "${p_id}", name: "Sep", bonus_bps: 1000, starts_at: "2026-09-03T00:00:00Z", ends_at: "2026-09-30T00:00:00Z" }, as: MerchantAdmin, as_user_id: "${m_id}", captures: { err: "$.data.error_id" } }
          assert:
            - "response.data.error_id == ERR_CAMPAIGN_WINDOW_OVERLAP"

  # ===========================================================================
  - rule_id: compensating_invariant
    instances:
      - name: card_balance_conserved_redeem_reverse
        grounds:
          - state_machines.FraudHold.OPEN_to_CONFIRMED
          - calculations.card_balance
          - entities.GiftCard.fields.balance_cents
        distinguishing_aspect: "Forward redeem (-20000) paired with its compensating fraud-confirm reversal (+20000 effective) leaves the conserved quantity GiftCard.balance_cents invariant at 100000 (== the pre-redeem load); conserved quantity = a single card's balance."
        test_recipe:
          setup:
            - "Merchant ACTIVE; program ACTIVE; one card ACTIVE loaded 100000, redeemed 20000 (balance 80000); a fraud hold opened on the card by analyst-1."
          setup_api_calls:
            - { call: "POST /merchants", payload: { legal_name: "Acme" }, as: PlatformAdmin, captures: { m_id: "$.data.id" } }
            - { call: "POST /merchants/${m_id}/activate", payload: {}, as: PlatformAdmin }
