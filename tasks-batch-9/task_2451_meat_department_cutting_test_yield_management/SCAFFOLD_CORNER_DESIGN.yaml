              captures: { err_pounds: $.data.error_id }
            - call: "POST /meat-ops/case-plan-lines/${cpl1_id}/shrink-events"
              payload: { shrink_lb: 14.0 }
              as: MeatManager
              as_user_id: "mgr-01"
          assert:
            - "${err_unpub} == ERR_CASE_PLAN_NOT_PUBLISHED with HTTP 409 and CasePlanLine.${cpl1_id}.actual_fill_lb stays 0.00"
            - "After PUBLISH the same fill returns 200: actual_fill_lb == 34.00 and line_status == FILLED"
            - "The 20.00 lb markdown is accepted (floor is 0 while yield_adjusted_cost_per_lb_cents == 0): markdown_lb == 20.00"
            - "${err_pounds} == ERR_LINE_POUNDS_UNAVAILABLE with HTTP 422 (20.00 + 20.00 > 34.00) and shrink_lb stays 0.00"
            - "The 14.00 lb shrink event is accepted at the exact boundary: shrink_lb == 14.00 and markdown_lb + shrink_lb == 34.00 == actual_fill_lb"

      - name: sales_halted_posture_blocks_new_case_lines_until_containment
        claim_type: cross_entity_validation
        grounds:
          - validations[priority=16]
          - errors[ERR_POSTURE_SALES_HALTED]
          - calculations.case_posture_derivation
          - calculations.required_fill_derivation
        distinguishing_aspect: "Line creation is gated on a field of a different entity — Department.case_posture — so the identical request is refused with ERR_POSTURE_SALES_HALTED while a failure is OPEN and accepted once it is CONTAINED, at which point the SALES_RESTRICTED branch halves the required fill."
        test_recipe:
          setup:
            - "Department 'Meat 41' at default config; clock at 2026-08-05T08:00:00Z."
            - "RIB01 is PROPOSED at 2149; CasePlan CP1 (service_date 2026-08-06) is DRAFT and empty (so the temperature cascade, which only suspends PUBLISHED plans, leaves it alone)."
            - "Readings 4.5 then 4.6 C on CASE-A open CaseFailure CF1, driving the department to SALES_HALTED."
          setup_api_calls:
            - call: "POST /meat-ops/departments"
              payload: { name: "Meat 41", store_code: "S041" }
              as: StoreAdmin
              as_user_id: "admin-01"
              captures: { dept_id: $.data.id }
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-08-05T08:00:00Z" }
              as: StoreAdmin
              as_user_id: "admin-01"
            - call: "POST /meat-ops/retail-items"
              payload: { department_id: "${dept_id}", item_code: "RIB01", subprimal_code: "RIBEYE_STEAK", product_class: "WHOLE_MUSCLE" }
              as: MeatManager
              as_user_id: "mgr-01"
              captures: { ri1_id: $.data.id }
            - call: "POST /meat-ops/primal-purchases"
              payload: { department_id: "${dept_id}", primal_code: "BEEF_RIBEYE_LIP_ON", product_class: "WHOLE_MUSCLE", country_of_origin: "USA", vendor_name: "Prairie Packing", gross_weight_lb: 100.0, invoice_cost_cents: 84000, freight_cost_cents: 2500, vendor_allowance_cents: 500, receiving_shrink_lb: 1.5, received_at: "2026-08-05T06:00:00Z" }
              as: MeatCutter
              as_user_id: "cutter-01"
              captures: { p1_id: $.data.id }
            - call: "POST /meat-ops/retail-items/${ri1_id}/price-proposals"
              payload: { primal_purchase_id: "${p1_id}" }
              as: PricingAnalyst
              as_user_id: "analyst-01"
            - call: "POST /meat-ops/case-plans"
              payload: { department_id: "${dept_id}", service_date: "2026-08-06" }
              as: MeatManager
              as_user_id: "mgr-01"
              captures: { cp1_id: $.data.id }
            - call: "POST /meat-ops/temperature-logs"
              payload: { department_id: "${dept_id}", case_code: "CASE-A", reading_c: 4.5 }
              as: MeatCutter
              as_user_id: "cutter-01"
            - call: "POST /meat-ops/temperature-logs"
              payload: { department_id: "${dept_id}", case_code: "CASE-A", reading_c: 4.6 }
              as: MeatCutter
              as_user_id: "cutter-01"
            - call: "GET /meat-ops/case-failures"
              payload: { department_id: "${dept_id}", status: "OPEN" }
              as: MeatManager
              as_user_id: "mgr-01"
              captures: { cf1_id: "$.data[0].id" }
          trigger:
            - call: "POST /meat-ops/case-plans/${cp1_id}/lines"
              payload: { retail_item_id: "${ri1_id}", line_seq: 1, facings: 4, expected_movement_lb: 30.0 }
              as: MeatManager
              as_user_id: "mgr-01"
              captures: { err_halt: $.data.error_id }
            - call: "POST /meat-ops/case-failures/${cf1_id}/transitions"
              payload: { action: "CONTAIN", containment_note: "product moved to the backup case" }
              as: MeatCutter
              as_user_id: "cutter-01"
            - call: "POST /meat-ops/case-plans/${cp1_id}/lines"
              payload: { retail_item_id: "${ri1_id}", line_seq: 1, facings: 4, expected_movement_lb: 30.0 }
              as: MeatManager
              as_user_id: "mgr-01"
              captures: { cpl1_id: $.data.id }
          assert:
            - "Department.${dept_id}.case_posture == SALES_HALTED before the trigger and CasePlan.${cp1_id}.plan_status == DRAFT (never suspended, because the cascade only touches PUBLISHED plans)"
            - "${err_halt} == ERR_POSTURE_SALES_HALTED with HTTP 409 and CasePlan.${cp1_id} still has no lines"
            - "After CONTAIN: Department.${dept_id}.case_posture == SALES_RESTRICTED with open_case_failure_count == 0 and contained_case_failure_count == 1"
            - "The identical line request now returns 201: CasePlanLine.${cpl1_id}.required_fill_lb == 17.25 (34.50 halved by the SALES_RESTRICTED branch) and line_status == PLANNED"

