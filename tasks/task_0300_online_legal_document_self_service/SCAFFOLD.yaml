# =============================================================================
# SCAFFOLD — Online Legal Document Self-Service (LegalZoom-style)
# Difficulty band: EXPERT (§0.4)
# =============================================================================

scenario: |
  300. Online Legal Document Self-Service (LegalZoom style): document type
  (will/LLC/POA/lease), guided questionnaire, state-specific clause assembly,
  attorney-review add-on, e-signature & notary referral, revision/version,
  secure storage & update reminder, subscription tier

domain_name: online-legal-document-self-service
api_prefix: "/legal"

complexity_profile:
  primary_archetype: workflow_orchestration
  secondary_archetype: compliance_audit
  complexity_layers:
    - optimistic_concurrency
    - cascading_side_effects
    - dual_variant_calculation
    - scheduled_actions

  entity_topology: flat
  # Peer top-level collections under /legal, linked by FK fields in request
  # bodies. One sub-resource (questionnaire) is the only nested path; every
  # other relationship is a flat FK with a filtered-list reverse GET.

  state_machine_shape: cyclic
  # DocumentProject loops CHANGES_REQUESTED -> IN_PROGRESS (revision rounds);
  # AttorneyReview branches IN_REVIEW -> {APPROVED, CHANGES_REQUESTED};
  # Subscription reverts PAST_DUE -> ACTIVE; SignatureRequest is compound
  # (auto-COMPLETED bubbled up from signer counter).

  relationship_patterns:
    - one_to_many        # Customer -> DocumentProject; DocumentProject -> Revision
    - cross_aggregate    # SignatureRequest -> DocumentRevision; Project -> Subscription gating

  role_model: peer_roles
  # Customer owns projects/questionnaire/signature; Attorney owns reviews;
  # PlatformAdmin owns config (plans, clause templates) + system clock.

  consistency_model: immediate

# =============================================================================
# §1.0 Response Envelope (FIXED — EMIT VERBATIM)
# =============================================================================
response_envelope:
  success: |
    { "meta": { "api_request_id": "req_xxx", "api_request_timestamp": "ISO8601" },
      "response_type": "object" | "array", "data": {} }
  error: |
    { "meta": { ... }, "response_type": "error",
      "data": { "error_id": "ERR_XXX", "message": "..." } }
  pagination_fields: ["limit", "offset", "total_count", "has_more"]
  pagination_defaults: { limit: 10, min: 1, max: 100, offset: 0 }

# =============================================================================
# §1.1 Entity-Relationship Table
# =============================================================================
entities:
  - name: Customer
    parent: null
    common_fields: true
    fields:
      - { name: email, type: string, source: input, description: "Customer login email; unique among Customers" }
      - { name: full_name, type: string, source: input, description: "Customer legal full name" }
      - { name: state_of_residence, type: enum, source: input, description: "Two-letter US state code", constraints: "one of CA, NY, TX, FL" }

  - name: SubscriptionPlan
    parent: null
    common_fields: true
    fields:
      - { name: tier, type: enum, source: input, description: "Plan tier identifier", constraints: "one of FREE, STANDARD, PREMIUM; unique among SubscriptionPlans" }
      - { name: monthly_fee_cents, type: integer, source: input, description: "Recurring monthly fee in cents", constraints: ">= 0" }
      - { name: included_project_credits, type: integer, source: input, description: "Document-project credits granted per active billing period", constraints: ">= 0" }
      - { name: included_clause_count, type: integer, source: input, description: "Assembled clauses included before per-clause overage fee applies", constraints: ">= 0" }
      - { name: subscription_discount_pct, type: number, source: input, description: "Fractional discount applied to the document portion of an Order", constraints: "0.0 .. 1.0, two decimals" }
      - { name: review_discount_pct, type: number, source: input, description: "Fractional discount applied to the attorney-review surcharge", constraints: "0.0 .. 1.0, two decimals" }

  - name: Subscription
    parent: null
    common_fields: true
    fields:
      - { name: customer_id, type: string, source: input, description: "FK -> Customer.id; the subscribing customer" }
      - { name: plan_id, type: string, source: input, description: "FK -> SubscriptionPlan.id; the chosen plan" }
      - { name: tier, type: enum, source: computed, description: "Copied from the plan at subscribe time", constraints: "one of FREE, STANDARD, PREMIUM" }
      - { name: status, type: enum, source: system, description: "PENDING_PAYMENT | ACTIVE | PAST_DUE | CANCELLED" }
      - { name: credits_used, type: integer, source: computed, description: "Count of DocumentProjects that currently hold a credit from this subscription; conserved quantity (see credit_conservation)" }
      - { name: credits_remaining, type: integer, source: computed, description: "= plan.included_project_credits - credits_used (may be 0; never negative)" }

  - name: ClauseTemplate
    parent: null
    common_fields: true
    fields:
      - { name: clause_key, type: string, source: input, description: "Stable clause identifier within a (document_type,state_code) set; unique with document_type+state_code" }
      - { name: document_type, type: enum, source: input, description: "Document family this clause belongs to", constraints: "one of WILL, LLC, POA, LEASE" }
      - { name: state_code, type: enum, source: input, description: "US state this clause variant applies to", constraints: "one of CA, NY, TX, FL" }
      - { name: is_mandatory, type: boolean, source: input, description: "Whether this clause must be present for a valid assembled document of this (type,state)" }
      - { name: body_text, type: string, source: input, description: "Clause prose body snapshotted into AssembledClause at assembly" }

  - name: DocumentProject
    parent: null
    common_fields: true
    fields:
      - { name: customer_id, type: string, source: input, description: "FK -> Customer.id; the owner" }
      - { name: subscription_id, type: string, source: input, description: "FK -> Subscription.id; subscription that funded the credit consumed at creation" }
      - { name: document_type, type: enum, source: input, description: "WILL | LLC | POA | LEASE" }
      - { name: state_code, type: enum, source: input, description: "Governing state; must equal customer.state_of_residence at creation", constraints: "one of CA, NY, TX, FL" }
      - { name: title, type: string, source: input, description: "Human-readable project title" }
      - { name: attorney_review_addon, type: boolean, source: input, description: "Whether the customer elected the paid attorney-review add-on at creation", default: false }
      - { name: lease_property_ref, type: string, source: input, description: "For LEASE documents only: opaque property identifier used for lease-term overlap checks; null for other types", default: null }
      - { name: lease_start_date, type: datetime, source: input, description: "For LEASE only: lease term start (date-time, UTC); null otherwise", default: null }
      - { name: lease_end_date, type: datetime, source: input, description: "For LEASE only: lease term end (date-time, UTC); null otherwise", default: null }
      - { name: status, type: enum, source: system, description: "DRAFT | IN_PROGRESS | ASSEMBLED | IN_REVIEW | CHANGES_REQUESTED | FINALIZED | SIGNED | STORED | ABANDONED | STORAGE_LOCKED" }
      - { name: provisional_completeness, type: number, source: computed, description: "answered_required_questions / total_required_questions for (type,state); 0.0..1.0; recomputed on questionnaire upsert" }
      - { name: assembled_completeness, type: number, source: computed, description: "assembled_mandatory_clauses / required_mandatory_clauses for (type,state); 0.0 until assembled" }
      - { name: assembled_clause_count, type: integer, source: computed, description: "Count of AssembledClause rows for this project; 0 until assembled" }
      - { name: credit_held, type: boolean, source: computed, description: "True while this project counts against its subscription's credits_used; flips false on ABANDONED-before-assembly" }

  - name: QuestionnaireResponse
    parent: null
    common_fields: true
    fields:
      - { name: document_project_id, type: string, source: input, description: "FK -> DocumentProject.id; 1:1 with the project" }
      - { name: answers, type: object, source: input, description: "Map of required-question-key -> answer value for the (type,state) questionnaire" }
      - { name: answered_required_count, type: integer, source: computed, description: "Count of required questions present (non-empty) in answers" }
      - { name: total_required_count, type: integer, source: computed, description: "Total required questions for the project's (type,state)" }

  - name: AssembledClause
    parent: null
    common_fields: false
    fields:
      - { name: document_project_id, type: string, source: input, description: "FK -> DocumentProject.id; the assembled document this clause belongs to" }
      - { name: source_clause_template_id, type: string, source: system, description: "Source ClauseTemplate id snapshotted at assembly (reference only; not reverse-queried)" }
      - { name: clause_key, type: string, source: system, description: "Clause key copied from the source template" }
      - { name: is_mandatory, type: boolean, source: system, description: "Mandatory flag copied from the source template" }
      - { name: body_text, type: string, source: system, description: "Clause body snapshotted from the source template at assembly" }

  - name: DocumentRevision
    parent: null
    common_fields: true
    fields:
      - { name: document_project_id, type: string, source: input, description: "FK -> DocumentProject.id; the project snapshotted" }
      - { name: expected_document_project_version, type: integer, source: input, description: "OCC: project.version the client last observed; rejected if stale" }
      - { name: revision_number, type: integer, source: computed, description: "1-based sequence within the project; assigned by creation order (created_at ASC)" }
      - { name: clause_snapshot_count, type: integer, source: computed, description: "Number of AssembledClause rows captured into this snapshot" }
      - { name: status, type: enum, source: system, description: "FINAL | SUPERSEDED — newest revision is FINAL; older same-project revisions flip SUPERSEDED" }

  - name: Attorney
    parent: null
    common_fields: true
    fields:
      - { name: full_name, type: string, source: input, description: "Attorney full name" }
      - { name: bar_state, type: enum, source: input, description: "State the attorney is licensed in", constraints: "one of CA, NY, TX, FL" }

  - name: AttorneyReview
    parent: null
    common_fields: true
    fields:
      - { name: document_project_id, type: string, source: input, description: "FK -> DocumentProject.id; project under review" }
      - { name: attorney_id, type: string, source: input, description: "FK -> Attorney.id; assigned reviewer" }
      - { name: window_start, type: datetime, source: input, description: "Review window start (UTC); occupies the attorney for half-open [window_start, window_end)" }
      - { name: window_end, type: datetime, source: input, description: "Review window end (UTC); exclusive" }
      - { name: status, type: enum, source: system, description: "REQUESTED | ASSIGNED | IN_REVIEW | APPROVED | CHANGES_REQUESTED | CANCELLED" }
      - { name: surcharge_cents, type: integer, source: computed, description: "Review surcharge applied to the project's Order at request, net of plan.review_discount_pct" }

  - name: SignatureRequest
    parent: null
    common_fields: true
    fields:
      - { name: document_revision_id, type: string, source: input, description: "FK -> DocumentRevision.id; the FINAL revision being signed" }
      - { name: signer_emails, type: array, source: input, description: "Ordered list of signer email strings; must be non-empty" }
      - { name: notary_required, type: boolean, source: input, description: "Whether this envelope requires notary; gates notary-referral creation and adds the notary fee to the Order", default: false }
      - { name: signed_emails, type: array, source: computed, description: "Subset of signer_emails that have signed" }
      - { name: signed_count, type: integer, source: computed, description: "Length of signed_emails" }
      - { name: status, type: enum, source: system, description: "DRAFT | SENT | PARTIALLY_SIGNED | COMPLETED | VOIDED" }

  - name: NotaryReferral
    parent: null
    common_fields: true
    fields:
      - { name: signature_request_id, type: string, source: input, description: "FK -> SignatureRequest.id; envelope needing notarization" }
      - { name: referral_state_code, type: enum, source: input, description: "State whose notary network the customer is referred to", constraints: "one of CA, NY, TX, FL" }
      - { name: status, type: enum, source: system, description: "REFERRED (terminal) — referral issued" }

  - name: Order
    parent: null
    common_fields: true
    fields:
      - { name: document_project_id, type: string, source: input, description: "FK -> DocumentProject.id; 1:1 with the project; created as a side effect of project creation" }
      - { name: provisional_quote_cents, type: integer, source: computed, description: "Estimate computed at assembly: document portion only (base + state surcharge + extra-clause fee, per-line discounted)" }
      - { name: final_invoice_cents, type: integer, source: computed, description: "Final total computed at FINALIZED: document portion + active review line + active notary line" }
      - { name: amount_charged_cents, type: integer, source: computed, description: "Cumulative cents charged to the customer (forward actions)" }
      - { name: amount_refunded_cents, type: integer, source: computed, description: "Cumulative cents refunded (compensating actions)" }
      - { name: net_collected_cents, type: integer, source: computed, description: "= amount_charged_cents - amount_refunded_cents; conserved against active line items (see money_conservation)" }

  - name: UpdateReminder
    parent: null
    common_fields: true
    fields:
      - { name: document_project_id, type: string, source: input, description: "FK -> DocumentProject.id; the stored document to remind about" }
      - { name: due_at, type: datetime, source: computed, description: "When the reminder becomes due (UTC); set to project SIGNED time + REMINDER_INTERVAL_DAYS at scheduling" }
      - { name: status, type: enum, source: system, description: "SCHEDULED | SENT | CANCELLED" }

# =============================================================================
# §1.2 State Machine Table
# =============================================================================
state_machines:
  - entity: Subscription
    initial_state: PENDING_PAYMENT
    terminal_states: [CANCELLED]
    transitions:
      - from: PENDING_PAYMENT
        to: ACTIVE
        trigger: "POST /legal/subscriptions/{id}/transition (to_status=ACTIVE)"
        actor: PlatformAdmin
        preconditions: ["subscription.status == PENDING_PAYMENT"]
        side_effects: ["subscription becomes spendable for project credits"]
      - from: ACTIVE
        to: PAST_DUE
        trigger: "POST /legal/subscriptions/{id}/transition (to_status=PAST_DUE)"
        actor: PlatformAdmin
        preconditions: ["subscription.status == ACTIVE"]
        side_effects: ["paid features (attorney review request) become gated by ERR_SUBSCRIPTION_NOT_ACTIVE"]
      - from: PAST_DUE
        to: ACTIVE
        trigger: "POST /legal/subscriptions/{id}/transition (to_status=ACTIVE)"
        actor: PlatformAdmin
        preconditions: ["subscription.status == PAST_DUE"]
        side_effects: ["paid features ungated again (revert cycle)"]
      - from: ACTIVE
        to: CANCELLED
        trigger: "POST /legal/subscriptions/{id}/transition (to_status=CANCELLED)"
        actor: PlatformAdmin
        preconditions: ["subscription.status == ACTIVE"]
        side_effects:
          - "CASCADE (depth-4 origin): for each DocumentProject of this subscription whose status IN {DRAFT, IN_PROGRESS, ASSEMBLED, IN_REVIEW, CHANGES_REQUESTED, FINALIZED}, transition that project to STORAGE_LOCKED (hop B)"
      - from: PAST_DUE
        to: CANCELLED
        trigger: "POST /legal/subscriptions/{id}/transition (to_status=CANCELLED)"
        actor: PlatformAdmin
        preconditions: ["subscription.status == PAST_DUE"]
        side_effects:
          - "Same STORAGE_LOCKED cascade as ACTIVE -> CANCELLED"

  - entity: DocumentProject
    initial_state: DRAFT
    terminal_states: [STORED, ABANDONED, STORAGE_LOCKED]
    transitions:
      - from: DRAFT
        to: IN_PROGRESS
        trigger: "PUT /legal/document-projects/{id}/questionnaire (first upsert)"
        actor: Customer
        preconditions: ["project.status == DRAFT"]
        side_effects: ["recompute provisional_completeness"]
      - from: IN_PROGRESS
        to: IN_PROGRESS
        trigger: "PUT /legal/document-projects/{id}/questionnaire (subsequent upsert)"
        actor: Customer
        preconditions: ["project.status == IN_PROGRESS"]
        side_effects: ["recompute provisional_completeness"]
      - from: IN_PROGRESS
        to: ASSEMBLED
        trigger: "POST /legal/document-projects/{id}/assemble"
        actor: Customer
        preconditions:
          - "project.status == IN_PROGRESS"
          - "provisional_completeness >= 1.0 (ERR_QUESTIONNAIRE_INCOMPLETE)"
          - "at least one ClauseTemplate exists for (document_type,state_code) (ERR_NO_CLAUSE_TEMPLATES)"
        side_effects:
          - "create one AssembledClause per ClauseTemplate matching (document_type,state_code), snapshotting body_text/clause_key/is_mandatory"
          - "set assembled_clause_count = number of AssembledClause rows created"
          - "recompute assembled_completeness"
          - "recompute Order.provisional_quote_cents (provisional_pricing)"
      - from: ASSEMBLED
        to: IN_REVIEW
        trigger: "POST /legal/attorney-reviews (review requested for this project)"
        actor: Customer
        preconditions:
          - "project.status == ASSEMBLED"
          - "project.attorney_review_addon == true (ERR_REVIEW_ADDON_NOT_ELECTED)"
          - "owning Subscription.status == ACTIVE (ERR_SUBSCRIPTION_NOT_ACTIVE)"
        side_effects:
          - "create AttorneyReview in REQUESTED then ASSIGNED; occupy attorney window"
          - "Order.amount_charged_cents += review surcharge (review_pricing); recompute net_collected_cents"
      - from: CHANGES_REQUESTED
        to: IN_PROGRESS
        trigger: "POST /legal/document-projects/{id}/transition (to_status=IN_PROGRESS)"
        actor: Customer
        preconditions: ["project.status == CHANGES_REQUESTED"]
        side_effects: ["revision loop reopened; provisional_completeness retained"]
      - from: ASSEMBLED
        to: FINALIZED
        trigger: "POST /legal/document-projects/{id}/transition (to_status=FINALIZED)"
        actor: Customer
        preconditions:
          - "project.status == ASSEMBLED"
          - "assembled_completeness >= 1.0 (ERR_MANDATORY_CLAUSE_MISSING)"
          - "no AttorneyReview for this project in status IN {REQUESTED, ASSIGNED, IN_REVIEW} (ERR_REVIEW_IN_PROGRESS)"
        side_effects: ["recompute Order.final_invoice_cents (final_pricing); Order.amount_charged_cents += (doc_portion + notary_line) — the review surcharge was already charged at review request; recompute net_collected_cents"]
      - from: CHANGES_REQUESTED
        to: FINALIZED
        trigger: "POST /legal/document-projects/{id}/transition (to_status=FINALIZED)"
        actor: Customer
        preconditions:
          - "project.status == CHANGES_REQUESTED"
          - "assembled_completeness >= 1.0 (ERR_MANDATORY_CLAUSE_MISSING)"
        side_effects: ["recompute Order.final_invoice_cents (final_pricing)"]
      - from: FINALIZED
        to: SIGNED
        trigger: "POST /legal/signature-requests/{id}/sign (last signer signs -> envelope COMPLETED bubbles up)"
        actor: system
        preconditions:
          - "project.status == FINALIZED"
          - "a SignatureRequest on a FINAL revision of this project reached COMPLETED"
        side_effects:
          - "CASCADE (depth-3 origin via signature): schedule UpdateReminder due_at = now + REMINDER_INTERVAL_DAYS (hop C)"
      - from: IN_REVIEW
        to: ASSEMBLED
        trigger: "system: AttorneyReview IN_REVIEW -> APPROVED (review passed)"
        actor: system
        preconditions: ["project.status == IN_REVIEW", "the project's AttorneyReview transitioned to APPROVED"]
        side_effects: ["project ready to finalize; no monetary change at this hop (surcharge already charged at request)"]
      - from: IN_REVIEW
        to: CHANGES_REQUESTED
        trigger: "system: AttorneyReview IN_REVIEW -> CHANGES_REQUESTED (review found issues)"
        actor: system
        preconditions: ["project.status == IN_REVIEW", "the project's AttorneyReview transitioned to CHANGES_REQUESTED"]
        side_effects:
          - "the project's newest DocumentRevision (status FINAL) flips to SUPERSEDED (this is hop C of the review CHANGES_REQUESTED cascade)"
      - from: SIGNED
        to: STORED
        trigger: "POST /legal/document-projects/{id}/transition (to_status=STORED)"
        actor: Customer
        preconditions: ["project.status == SIGNED"]
        side_effects: ["document enters secure storage; UpdateReminder remains SCHEDULED"]
      - from: DRAFT
        to: ABANDONED
        trigger: "POST /legal/document-projects/{id}/transition (to_status=ABANDONED)"
        actor: Customer
        preconditions: ["project.status == DRAFT"]
        side_effects:
          - "set credit_held=false; decrement owning Subscription.credits_used by 1 (credit_conservation); recompute credits_remaining"
      - from: IN_PROGRESS
        to: ABANDONED
        trigger: "POST /legal/document-projects/{id}/transition (to_status=ABANDONED)"
        actor: Customer
        preconditions: ["project.status == IN_PROGRESS"]
        side_effects:
          - "set credit_held=false; decrement owning Subscription.credits_used by 1 (credit_conservation); recompute credits_remaining"
      - from: ASSEMBLED
        to: STORAGE_LOCKED
        trigger: "system cascade from Subscription -> CANCELLED"
        actor: system
        preconditions: ["project.status IN {DRAFT, IN_PROGRESS, ASSEMBLED, IN_REVIEW, CHANGES_REQUESTED, FINALIZED}"]
        side_effects:
          - "CASCADE hop C: for each AttorneyReview of this project in status IN {REQUESTED, ASSIGNED, IN_REVIEW}, transition it to CANCELLED"
      - from: IN_REVIEW
        to: STORAGE_LOCKED
        trigger: "system cascade from Subscription -> CANCELLED"
        actor: system
        preconditions: ["project.status IN {DRAFT, IN_PROGRESS, ASSEMBLED, IN_REVIEW, CHANGES_REQUESTED, FINALIZED}"]
        side_effects:
          - "CASCADE hop C: for each AttorneyReview of this project in {REQUESTED, ASSIGNED, IN_REVIEW}, transition it to CANCELLED"

  - entity: AttorneyReview
    initial_state: REQUESTED
    terminal_states: [APPROVED, CANCELLED]
    transitions:
      - from: REQUESTED
        to: ASSIGNED
        trigger: "auto on POST /legal/attorney-reviews (creation)"
        actor: system
        preconditions: ["attorney window [window_start, window_end) does not overlap another non-CANCELLED review for the same attorney (ERR_ATTORNEY_WINDOW_CONFLICT)"]
        side_effects: ["attorney window occupied"]
      - from: ASSIGNED
        to: IN_REVIEW
        trigger: "POST /legal/attorney-reviews/{id}/transition (to_status=IN_REVIEW)"
        actor: Attorney
        preconditions: ["review.status == ASSIGNED", "acting Attorney is review.attorney_id (ERR_NOT_REVIEW_OWNER)"]
        side_effects: []
      - from: IN_REVIEW
        to: APPROVED
        trigger: "POST /legal/attorney-reviews/{id}/transition (to_status=APPROVED)"
        actor: Attorney
        preconditions: ["review.status == IN_REVIEW", "acting Attorney is review.attorney_id (ERR_NOT_REVIEW_OWNER)"]
        side_effects:
          - "BRANCH A side-effects: project transitions IN_REVIEW -> ASSEMBLED (review passed; ready to finalize); attorney window released"
      - from: IN_REVIEW
        to: CHANGES_REQUESTED
        trigger: "POST /legal/attorney-reviews/{id}/transition (to_status=CHANGES_REQUESTED)"
        actor: Attorney
        preconditions: ["review.status == IN_REVIEW", "acting Attorney is review.attorney_id (ERR_NOT_REVIEW_OWNER)"]
        side_effects:
          - "BRANCH B side-effects (CASCADE depth-3 origin): project transitions IN_REVIEW -> CHANGES_REQUESTED (hop B)"
          - "hop C: the project's newest DocumentRevision (status FINAL) flips to SUPERSEDED"
          - "attorney window released"
      - from: REQUESTED
        to: CANCELLED
        trigger: "system cascade from DocumentProject -> STORAGE_LOCKED"
        actor: system
        preconditions: []
        side_effects:
          - "CASCADE hop D: refund the review surcharge — Order.amount_refunded_cents += review.surcharge_cents; recompute net_collected_cents (money_conservation); release attorney window"
      - from: ASSIGNED
        to: CANCELLED
        trigger: "system cascade from DocumentProject -> STORAGE_LOCKED"
        actor: system
        preconditions: []
        side_effects:
          - "CASCADE hop D: Order.amount_refunded_cents += review.surcharge_cents; recompute net_collected_cents; release attorney window"
      - from: IN_REVIEW
        to: CANCELLED
        trigger: "system cascade from DocumentProject -> STORAGE_LOCKED"
        actor: system
        preconditions: []
        side_effects:
          - "CASCADE hop D: Order.amount_refunded_cents += review.surcharge_cents; recompute net_collected_cents; release attorney window"

  - entity: SignatureRequest
    initial_state: DRAFT
    terminal_states: [COMPLETED, VOIDED]
    transitions:
      - from: DRAFT
        to: SENT
        trigger: "POST /legal/signature-requests/{id}/transition (to_status=SENT)"
        actor: Customer
        preconditions:
          - "request.status == DRAFT"
          - "referenced DocumentRevision.status == FINAL (ERR_REVISION_SUPERSEDED)"
          - "owning DocumentProject.status == FINALIZED (ERR_PROJECT_NOT_FINALIZED)"
        side_effects: []
      - from: SENT
        to: PARTIALLY_SIGNED
        trigger: "POST /legal/signature-requests/{id}/sign (a non-final signer signs)"
        actor: Customer
        preconditions:
          - "request.status IN {SENT, PARTIALLY_SIGNED}"
          - "signer_email in signer_emails and not already in signed_emails (ERR_SIGNER_NOT_INVITED / ERR_ALREADY_SIGNED)"
          - "signed_count after this signature < len(signer_emails)"
        side_effects: ["append signer_email to signed_emails; increment signed_count"]
      - from: PARTIALLY_SIGNED
        to: COMPLETED
        trigger: "POST /legal/signature-requests/{id}/sign (final outstanding signer signs)"
        actor: Customer
        preconditions:
          - "request.status IN {SENT, PARTIALLY_SIGNED}"
          - "signer_email in signer_emails and not already in signed_emails"
          - "signed_count after this signature == len(signer_emails)"
        side_effects:
          - "append signer_email; signed_count == len(signer_emails) -> COMPLETED (compound bubble-up)"
          - "CASCADE hop B: owning DocumentProject FINALIZED -> SIGNED (which schedules the UpdateReminder, hop C)"
      - from: SENT
        to: COMPLETED
        trigger: "POST /legal/signature-requests/{id}/sign (single-signer envelope, sole signer signs)"
        actor: Customer
        preconditions:
          - "request.status == SENT"
          - "len(signer_emails) == 1 and that signer signs"
        side_effects:
          - "COMPLETED (compound bubble-up)"
          - "CASCADE hop B: owning DocumentProject FINALIZED -> SIGNED (schedules UpdateReminder, hop C)"
      - from: DRAFT
        to: VOIDED
        trigger: "POST /legal/signature-requests/{id}/transition (to_status=VOIDED)"
        actor: Customer
        preconditions: ["request.status IN {DRAFT, SENT, PARTIALLY_SIGNED}"]
        side_effects: []
      - from: SENT
        to: VOIDED
        trigger: "POST /legal/signature-requests/{id}/transition (to_status=VOIDED)"
        actor: Customer
        preconditions: ["request.status IN {DRAFT, SENT, PARTIALLY_SIGNED}"]
        side_effects: []
      - from: PARTIALLY_SIGNED
        to: VOIDED
        trigger: "POST /legal/signature-requests/{id}/transition (to_status=VOIDED)"
        actor: Customer
        preconditions: ["request.status IN {DRAFT, SENT, PARTIALLY_SIGNED}"]
        side_effects: []

  - entity: UpdateReminder
    initial_state: SCHEDULED
    terminal_states: [SENT, CANCELLED]
    transitions:
      - from: SCHEDULED
        to: SENT
        trigger: "POST /legal/_reminders/dispatch_due (system sweep; reminder due_at <= clock now)"
        actor: PlatformAdmin
        preconditions: ["reminder.status == SCHEDULED", "reminder.due_at <= current clock (ERR_REMINDER_NOT_DUE)"]
        side_effects: []
      - from: SCHEDULED
        to: CANCELLED
        trigger: "system cascade from DocumentProject -> STORAGE_LOCKED (project locked before reminder fires)"
        actor: system
        preconditions: []
        side_effects: []

# =============================================================================
# §1.2.1 Concurrency Rules
# =============================================================================
concurrency_rules:
  - rule_id: revision-create-stale-project
    parent_entity: DocumentProject
    write_endpoint: "POST /legal/document-revisions"
    occ_field: "expected_document_project_version"
    description: |
      Creating a DocumentRevision against a DocumentProject whose version has
      advanced since the client last observed it is rejected. A new revision
      legitimately supersedes the project's prior FINAL revision; if another
      writer already created a revision (advancing the project version), the
      current writer's observed version is stale and the create is rejected.
    error_id: ERR_STALE_PROJECT_VERSION
    http_status: 412

# =============================================================================
# §1.3 Calculation Rules Table
# =============================================================================
calculations:
  - name: provisional_pricing
    trigger: "DocumentProject IN_PROGRESS -> ASSEMBLED (assemble)"
    algorithm: tiered_pricing
    formula: |
      tier = subscription.tier ; d = plan.subscription_discount_pct
      L_base  = BASE_PRICE_CENTS[document_type]
      L_state = STATE_SURCHARGE_CENTS[state_code]
      extra_clauses = max(0, assembled_clause_count - plan.included_clause_count)
      L_extra = extra_clauses * EXTRA_CLAUSE_FEE_CENTS
      # ROUNDING ORDER (pinned): discount EACH line, round_half_up to whole cents, THEN sum.
      provisional_quote_cents = round_half_up(L_base  * (1 - d))
                              + round_half_up(L_state * (1 - d))
                              + round_half_up(L_extra * (1 - d))
    input_set: "Order whose document_project_id == this project; document portion only — no review, no notary"
    constants:
      BASE_PRICE_CENTS: { WILL: 4999, LLC: 9999, POA: 3999, LEASE: 2999 }
      STATE_SURCHARGE_CENTS: { CA: 1500, NY: 1999, TX: 0, FL: 0 }
      EXTRA_CLAUSE_FEE_CENTS: 799
    precision: "whole cents, round_half_up, per-line before summation"

  - name: review_pricing
    trigger: "DocumentProject ASSEMBLED -> IN_REVIEW (attorney review requested)"
    algorithm: tiered_pricing
    formula: |
      # review surcharge net of the plan's review discount; charged to the Order at request
      surcharge_cents = round_half_up(REVIEW_SURCHARGE_CENTS * (1 - plan.review_discount_pct))
      AttorneyReview.surcharge_cents = surcharge_cents
      Order.amount_charged_cents += surcharge_cents
    input_set: "the AttorneyReview being created and its project's Order"
    constants:
      REVIEW_SURCHARGE_CENTS: 7500
    precision: "whole cents, round_half_up"

  - name: final_pricing
    trigger: "DocumentProject {ASSEMBLED,CHANGES_REQUESTED} -> FINALIZED"
    algorithm: tiered_pricing
    formula: |
      # document portion recomputed exactly as provisional_pricing (same per-line rounding order)
      doc_portion = round_half_up(L_base*(1-d)) + round_half_up(L_state*(1-d)) + round_half_up(L_extra*(1-d))
      # active review line: sum of surcharge_cents over AttorneyReviews of this project whose
      #   status IN {APPROVED} (CANCELLED reviews are excluded; their surcharge was refunded)
      review_line = sum(surcharge_cents for AttorneyReview where document_project_id==project.id and status==APPROVED)
      # active notary line: NOTARY_FEE_CENTS if any SignatureRequest on a FINAL revision of this project
      #   has notary_required==true, else 0
      notary_line = NOTARY_FEE_CENTS if (exists SignatureRequest with notary_required==true on a FINAL revision of project) else 0
      final_invoice_cents = doc_portion + review_line + notary_line
      # amount_charged_cents is ADDITIVE: review surcharge charged at review request;
      #   at FINALIZE add (doc_portion + notary_line). For an APPROVED-review + notary
      #   project this yields amount_charged_cents == final_invoice_cents.
    input_set: "Order, project's APPROVED AttorneyReviews, project's FINAL-revision SignatureRequests"
    constants:
      NOTARY_FEE_CENTS: 2500
    precision: "whole cents, round_half_up, per-line before summation"
    variants:
      - name: provisional_vs_final
        when: "provisional computed at assemble; final at FINALIZED"
        difference: "final adds the active review line and the notary line; provisional has neither"

  - name: project_completeness
    trigger: "questionnaire upsert (provisional) and assemble (assembled)"
    algorithm: aggregation
    formula: |
      # provisional (during IN_PROGRESS):
      total_required_count   = TOTAL_REQUIRED_QUESTIONS[document_type]
      answered_required_count = min(count of non-empty values in answers, total_required_count)
      provisional_completeness = answered_required_count / total_required_count   (total_required_count >= 1)
      # assembled (after ASSEMBLED): assembled_mandatory snapshotted at assembly; required_mandatory read live at finalize
      #   so an admin adding a mandatory ClauseTemplate AFTER assembly lowers assembled_completeness below 1.0
      required_mandatory = count(ClauseTemplate where document_type,state_code and is_mandatory==true)
      assembled_mandatory = count(AssembledClause for project where is_mandatory==true)
      assembled_completeness = assembled_mandatory / required_mandatory   (1.0 if required_mandatory==0)
    input_set: "QuestionnaireResponse for provisional; AssembledClause rows + ClauseTemplate set for assembled"
    constants:
      TOTAL_REQUIRED_QUESTIONS: { WILL: 8, LLC: 6, POA: 4, LEASE: 6 }
    precision: "ratio as float; assemble gate compares >= 1.0"
    variants:
      - name: provisional_vs_assembled
        when: "provisional measured over questionnaire answers; assembled measured over mandatory clauses"
        difference: "different numerator/denominator and different source entity; same project, two completeness meanings"

  - name: credit_conservation
    trigger: "DocumentProject creation (consume) and ABANDONED-before-assembly (return)"
    algorithm: aggregation
    formula: |
      # INVARIANT: subscription.credits_used == count(DocumentProject where subscription_id==sub.id and credit_held==true)
      on project create:           credits_used += 1 ; project.credit_held = true
      on project -> ABANDONED (from DRAFT or IN_PROGRESS): credits_used -= 1 ; project.credit_held = false
      credits_remaining = plan.included_project_credits - credits_used   (never negative; create rejected if 0 remaining)
    input_set: "all DocumentProjects of the subscription with credit_held==true"
    constants: {}
    precision: "integer counts"

  - name: money_conservation
    trigger: "review request (charge) and review CANCELLED via cascade (refund)"
    algorithm: aggregation
    formula: |
      # INVARIANT after any forward+compensating pair settles:
      #   Order.net_collected_cents == Order.amount_charged_cents - Order.amount_refunded_cents
      #   == document portion charged + sum(surcharge_cents of project's non-CANCELLED reviews) + active notary line
      on review request:           amount_charged_cents += surcharge_cents
      on review CANCELLED cascade:  amount_refunded_cents += surcharge_cents
      net_collected_cents = amount_charged_cents - amount_refunded_cents
    input_set: "the project's Order, its non-CANCELLED AttorneyReviews"
    constants: {}
    precision: "whole cents"

# =============================================================================
# §1.4 Validation Rules Table (ordered by priority)
# =============================================================================
validations:
  - priority: 1
    category: auth
    check: "X-User-Role header present and is one of Customer, Attorney, PlatformAdmin"
    error_id: ERR_UNAUTHENTICATED
    http_status: 401
    applies_to: "all"

  - priority: 2
    category: auth
    check: "Acting role is permitted for the operation per §1.7"
    error_id: ERR_FORBIDDEN_ROLE
    http_status: 403
    applies_to: "all"

  - priority: 3
    category: existence
    check: "Path/body resource ids resolve to existing resources, validated left-to-right"
    error_id: ERR_NOT_FOUND
    http_status: 404
    applies_to: "all endpoints referencing a resource id"

  - priority: 4
    category: business_referential
    check: "Body FK references resolve and are mutually consistent (e.g. subscription_id belongs to customer_id; clause exists for type+state)"
    error_id: ERR_REFERENCE_INVALID
    http_status: 409
    applies_to: "POST /legal/document-projects, POST /legal/subscriptions, POST /legal/attorney-reviews, POST /legal/document-revisions, POST /legal/signature-requests, POST /legal/notary-referrals"

  - priority: 5
    category: business_constraint
    check: "Required request fields present and well-typed; enum values in allowed set; signer_emails non-empty"
    error_id: ERR_INVALID_REQUEST
    http_status: 400
    applies_to: "all mutating endpoints"

  - priority: 6
    category: state
    check: "OCC: expected_document_project_version equals current DocumentProject.version on revision create"
    error_id: ERR_STALE_PROJECT_VERSION
    http_status: 412
    applies_to: "POST /legal/document-revisions"

  - priority: 7
    category: state
    check: "Target resource is in a valid from-state for the requested transition"
    error_id: ERR_INVALID_STATE
    http_status: 409
    applies_to: "all transition / action endpoints"

  - priority: 8
    category: business_safety
    check: "Cross-entity state gate: owning Subscription.status == ACTIVE for paid attorney-review request"
    error_id: ERR_SUBSCRIPTION_NOT_ACTIVE
    http_status: 403
    applies_to: "POST /legal/attorney-reviews"

  - priority: 9
    category: business_safety
    check: "Attorney-review add-on must have been elected on the project before a review can be requested"
    error_id: ERR_REVIEW_ADDON_NOT_ELECTED
    http_status: 409
    applies_to: "POST /legal/attorney-reviews"

  - priority: 10
    category: business_constraint
    check: "Assemble requires provisional_completeness >= 1.0"
    error_id: ERR_QUESTIONNAIRE_INCOMPLETE
    http_status: 409
    applies_to: "POST /legal/document-projects/{id}/assemble"

  - priority: 11
    category: business_referential
    check: "Assemble requires at least one ClauseTemplate for (document_type,state_code)"
    error_id: ERR_NO_CLAUSE_TEMPLATES
    http_status: 409
    applies_to: "POST /legal/document-projects/{id}/assemble"

  - priority: 12
    category: business_constraint
    check: "Finalize requires assembled_completeness >= 1.0 (all mandatory clauses present)"
    error_id: ERR_MANDATORY_CLAUSE_MISSING
    http_status: 409
    applies_to: "POST /legal/document-projects/{id}/transition (to_status=FINALIZED)"

  - priority: 13
    category: business_constraint
    check: "Finalize blocked while an AttorneyReview for the project is in {REQUESTED, ASSIGNED, IN_REVIEW}"
    error_id: ERR_REVIEW_IN_PROGRESS
    http_status: 409
    applies_to: "POST /legal/document-projects/{id}/transition (to_status=FINALIZED)"

  - priority: 14
    category: business_temporal
    check: "Attorney review window [window_start, window_end) must not overlap another non-CANCELLED review for the same attorney (half-open intervals; back-to-back allowed)"
    error_id: ERR_ATTORNEY_WINDOW_CONFLICT
    http_status: 409
    applies_to: "POST /legal/attorney-reviews"

  - priority: 15
    category: business_temporal
    check: "LEASE project term [lease_start_date, lease_end_date] must not overlap an existing non-ABANDONED LEASE project on the same lease_property_ref, including a LEASE_TURNOVER_BUFFER_DAYS gap between consecutive terms (closed intervals + buffer)"
    error_id: ERR_LEASE_TERM_OVERLAP
    http_status: 409
    applies_to: "POST /legal/document-projects (document_type=LEASE)"

  - priority: 16
    category: business_constraint
    check: "SignatureRequest send requires referenced DocumentRevision.status == FINAL"
    error_id: ERR_REVISION_SUPERSEDED
    http_status: 409
    applies_to: "POST /legal/signature-requests/{id}/transition (to_status=SENT)"

  - priority: 17
    category: business_constraint
    check: "Signer email must be invited and not already signed"
    error_id: ERR_SIGNER_NOT_INVITED
    http_status: 409
    applies_to: "POST /legal/signature-requests/{id}/sign"

  - priority: 18
    category: business_fiscal
    check: "DocumentProject creation requires subscription credits_remaining >= 1"
    error_id: ERR_NO_CREDITS_REMAINING
    http_status: 402
    applies_to: "POST /legal/document-projects"

  - priority: 19
    category: business_constraint
    check: "Notary referral requires the referenced SignatureRequest.notary_required == true"
    error_id: ERR_NOTARY_NOT_REQUIRED
    http_status: 409
    applies_to: "POST /legal/notary-referrals"

  - priority: 20
    category: business_constraint
    check: "SignatureRequest send requires owning DocumentProject.status == FINALIZED"
    error_id: ERR_PROJECT_NOT_FINALIZED
    http_status: 409
    applies_to: "POST /legal/signature-requests/{id}/transition (to_status=SENT)"

  - priority: 21
    category: business_constraint
    check: "Sign rejected when the signer email has already signed this envelope"
    error_id: ERR_ALREADY_SIGNED
    http_status: 409
    applies_to: "POST /legal/signature-requests/{id}/sign"

# =============================================================================
# §1.5 API Endpoint Table
# =============================================================================
endpoints:
  # ---- Customer ----
  - method: POST
    path: "/legal/customers"
    description: "Create a Customer"
    roles: [Customer, PlatformAdmin]
    code: 201
    input: [email, full_name, state_of_residence]
    output: Customer
    side_effects: []
  - method: GET
    path: "/legal/customers/{id}"
    description: "Get a Customer"
    roles: [Customer, PlatformAdmin]
    code: 200
    input: []
    output: Customer
    side_effects: []

  # ---- SubscriptionPlan (config) ----
  - method: POST
    path: "/legal/subscription-plans"
    description: "Create a SubscriptionPlan (catalog)"
    roles: [PlatformAdmin]
    code: 201
    input: [tier, monthly_fee_cents, included_project_credits, included_clause_count, subscription_discount_pct, review_discount_pct]
    output: SubscriptionPlan
    side_effects: []
  - method: GET
    path: "/legal/subscription-plans/{id}"
    description: "Get a SubscriptionPlan"
    roles: [Customer, Attorney, PlatformAdmin]
    code: 200
    input: []
    output: SubscriptionPlan
    side_effects: []

  # ---- Subscription ----
  - method: POST
    path: "/legal/subscriptions"
    description: "Subscribe a customer to a plan (status PENDING_PAYMENT)"
    roles: [Customer, PlatformAdmin]
    code: 201
    input: [customer_id, plan_id]
    output: Subscription
    side_effects: ["tier copied from plan; credits_used=0; credits_remaining=plan.included_project_credits"]
  - method: GET
    path: "/legal/subscriptions/{id}"
    description: "Get a Subscription"
    roles: [Customer, PlatformAdmin]
    code: 200
    input: []
    output: Subscription
    side_effects: []
  - method: GET
    path: "/legal/subscriptions"
    description: "List subscriptions, optionally filtered by customer_id and/or plan_id"
    roles: [Customer, PlatformAdmin]
    code: 200
    input: ["customer_id?", "plan_id?", "limit?", "offset?"]
    output: Subscription[]
    side_effects: []
  - method: POST
    path: "/legal/subscriptions/{id}/transition"
    description: "Transition subscription status (activate / past_due / cure / cancel)"
    roles: [PlatformAdmin]
    code: 200
    input: [to_status]
    output: Subscription
    side_effects: ["per Subscription state machine; CANCELLED triggers STORAGE_LOCKED cascade over the customer's projects"]

  # ---- ClauseTemplate (config) ----
  - method: POST
    path: "/legal/clause-templates"
    description: "Create a state-specific ClauseTemplate"
    roles: [PlatformAdmin]
    code: 201
    input: [clause_key, document_type, state_code, is_mandatory, body_text]
    output: ClauseTemplate
    side_effects: []
  - method: GET
    path: "/legal/clause-templates/{id}"
    description: "Get a ClauseTemplate"
    roles: [Customer, Attorney, PlatformAdmin]
    code: 200
    input: []
    output: ClauseTemplate
    side_effects: []
  - method: GET
    path: "/legal/clause-templates"
    description: "List clause templates, optionally filtered by document_type and/or state_code"
    roles: [Customer, Attorney, PlatformAdmin]
    code: 200
    input: ["document_type?", "state_code?", "limit?", "offset?"]
    output: ClauseTemplate[]
    side_effects: []

  # ---- DocumentProject ----
  - method: POST
    path: "/legal/document-projects"
    description: "Create a DocumentProject (consumes a subscription credit; auto-creates the Order)"
    roles: [Customer]
    code: 201
    input: [customer_id, subscription_id, document_type, state_code, title, "attorney_review_addon?", "lease_property_ref?", "lease_start_date?", "lease_end_date?"]
    output: DocumentProject
    side_effects:
      - "subscription.credits_used += 1; credit_held=true; credits_remaining recomputed (credit_conservation)"
      - "create Order (document_project_id=this) with all amount fields 0"
      - "status=DRAFT"
  - method: GET
    path: "/legal/document-projects/{id}"
    description: "Get a DocumentProject"
    roles: [Customer, Attorney, PlatformAdmin]
    code: 200
    input: []
    output: DocumentProject
    side_effects: []
  - method: GET
    path: "/legal/document-projects"
    description: "List document projects, optionally filtered by customer_id and/or subscription_id"
    roles: [Customer, Attorney, PlatformAdmin]
    code: 200
    input: ["customer_id?", "subscription_id?", "limit?", "offset?"]
    output: DocumentProject[]
    side_effects: []
  - method: PUT
    path: "/legal/document-projects/{id}/questionnaire"
    description: "Upsert the project's questionnaire answers (1:1); first upsert moves DRAFT->IN_PROGRESS"
    roles: [Customer]
    code: 200
    input: [answers]
    output: QuestionnaireResponse
    side_effects: ["DRAFT->IN_PROGRESS on first upsert; recompute provisional_completeness"]
  - method: GET
    path: "/legal/document-projects/{id}/questionnaire"
    description: "Get the project's questionnaire response (array of 0 or 1)"
    roles: [Customer, Attorney, PlatformAdmin]
    code: 200
    input: []
    output: QuestionnaireResponse[]
    side_effects: []
  - method: POST
    path: "/legal/document-projects/{id}/assemble"
    description: "Assemble state-specific clauses into the project (IN_PROGRESS->ASSEMBLED)"
    roles: [Customer]
    code: 200
    input: []
    output: DocumentProject
    side_effects:
      - "create one AssembledClause per matching ClauseTemplate; set assembled_clause_count; recompute assembled_completeness"
      - "recompute Order.provisional_quote_cents (provisional_pricing)"
  - method: POST
    path: "/legal/document-projects/{id}/transition"
    description: "Transition project status (IN_PROGRESS on reopen, FINALIZED, STORED, ABANDONED)"
    roles: [Customer]
    code: 200
    input: [to_status]
    output: DocumentProject
    side_effects: ["per DocumentProject state machine"]

  # ---- AssembledClause ----
  - method: GET
    path: "/legal/assembled-clauses/{id}"
    description: "Get an AssembledClause"
    roles: [Customer, Attorney, PlatformAdmin]
    code: 200
    input: []
    output: AssembledClause
    side_effects: []
  - method: GET
    path: "/legal/assembled-clauses"
    description: "List assembled clauses for a project"
    roles: [Customer, Attorney, PlatformAdmin]
    code: 200
    input: ["document_project_id?", "limit?", "offset?"]
    output: AssembledClause[]
    side_effects: []

  # ---- DocumentRevision (OCC-guarded create) ----
  - method: POST
    path: "/legal/document-revisions"
    description: "Snapshot the project's current assembled document as a new FINAL revision (OCC on project.version)"
    roles: [Customer]
    code: 201
    input: [document_project_id, expected_document_project_version]
    output: DocumentRevision
    side_effects:
      - "assign revision_number (created_at ASC within project); set clause_snapshot_count"
      - "prior FINAL revisions of the project flip to SUPERSEDED"
      - "increments DocumentProject.version by 1"
  - method: GET
    path: "/legal/document-revisions/{id}"
    description: "Get a DocumentRevision"
    roles: [Customer, Attorney, PlatformAdmin]
    code: 200
    input: []
    output: DocumentRevision
    side_effects: []
  - method: GET
    path: "/legal/document-revisions"
    description: "List revisions for a project"
    roles: [Customer, Attorney, PlatformAdmin]
    code: 200
    input: ["document_project_id?", "limit?", "offset?"]
    output: DocumentRevision[]
    side_effects: []

  # ---- Attorney ----
  - method: POST
    path: "/legal/attorneys"
    description: "Create an Attorney"
    roles: [PlatformAdmin]
    code: 201
    input: [full_name, bar_state]
    output: Attorney
    side_effects: []
  - method: GET
    path: "/legal/attorneys/{id}"
    description: "Get an Attorney"
    roles: [Customer, Attorney, PlatformAdmin]
    code: 200
    input: []
    output: Attorney
    side_effects: []

  # ---- AttorneyReview ----
  - method: POST
    path: "/legal/attorney-reviews"
    description: "Request an attorney review for an ASSEMBLED project (project ASSEMBLED->IN_REVIEW)"
    roles: [Customer]
    code: 201
    input: [document_project_id, attorney_id, window_start, window_end]
    output: AttorneyReview
    side_effects:
      - "review REQUESTED->ASSIGNED; occupy attorney window (overlap check)"
      - "project ASSEMBLED->IN_REVIEW"
      - "set surcharge_cents and Order.amount_charged_cents += surcharge (review_pricing); recompute net_collected_cents"
  - method: GET
    path: "/legal/attorney-reviews/{id}"
    description: "Get an AttorneyReview"
    roles: [Customer, Attorney, PlatformAdmin]
    code: 200
    input: []
    output: AttorneyReview
    side_effects: []
  - method: GET
    path: "/legal/attorney-reviews"
    description: "List reviews, optionally filtered by document_project_id and/or attorney_id"
    roles: [Customer, Attorney, PlatformAdmin]
    code: 200
    input: ["document_project_id?", "attorney_id?", "limit?", "offset?"]
    output: AttorneyReview[]
    side_effects: []
  - method: POST
    path: "/legal/attorney-reviews/{id}/transition"
    description: "Attorney advances the review (IN_REVIEW, APPROVED, CHANGES_REQUESTED)"
    roles: [Attorney]
    code: 200
    input: [to_status]
    output: AttorneyReview
    side_effects: ["per AttorneyReview state machine; APPROVED and CHANGES_REQUESTED branch differently"]

  # ---- SignatureRequest ----
  - method: POST
    path: "/legal/signature-requests"
    description: "Create an e-signature envelope for a FINAL revision"
    roles: [Customer]
    code: 201
    input: [document_revision_id, signer_emails, "notary_required?"]
    output: SignatureRequest
    side_effects: ["status=DRAFT; signed_count=0"]
  - method: GET
    path: "/legal/signature-requests/{id}"
    description: "Get a SignatureRequest"
    roles: [Customer, Attorney, PlatformAdmin]
    code: 200
    input: []
    output: SignatureRequest
    side_effects: []
  - method: GET
    path: "/legal/signature-requests"
    description: "List signature requests for a revision"
    roles: [Customer, Attorney, PlatformAdmin]
    code: 200
    input: ["document_revision_id?", "limit?", "offset?"]
    output: SignatureRequest[]
    side_effects: []
  - method: POST
    path: "/legal/signature-requests/{id}/transition"
    description: "Send or void an envelope (DRAFT->SENT, ->VOIDED)"
    roles: [Customer]
    code: 200
    input: [to_status]
    output: SignatureRequest
    side_effects: ["per SignatureRequest state machine"]
  - method: POST
    path: "/legal/signature-requests/{id}/sign"
    description: "A signer signs the envelope; final signature completes it and bubbles project to SIGNED"
    roles: [Customer]
    code: 200
    input: [signer_email]
    output: SignatureRequest
    side_effects:
      - "append signer to signed_emails; increment signed_count"
      - "if all signers signed -> COMPLETED; project FINALIZED->SIGNED; schedule UpdateReminder"

  # ---- NotaryReferral ----
  - method: POST
    path: "/legal/notary-referrals"
    description: "Create a notary referral for an envelope flagged notary_required"
    roles: [Customer]
    code: 201
    input: [signature_request_id, referral_state_code]
    output: NotaryReferral
    side_effects: ["status=REFERRED"]
  - method: GET
    path: "/legal/notary-referrals/{id}"
    description: "Get a NotaryReferral"
    roles: [Customer, PlatformAdmin]
    code: 200
    input: []
    output: NotaryReferral
    side_effects: []
  - method: GET
    path: "/legal/notary-referrals"
    description: "List notary referrals for a signature request"
    roles: [Customer, PlatformAdmin]
    code: 200
    input: ["signature_request_id?", "limit?", "offset?"]
    output: NotaryReferral[]
    side_effects: []

  # ---- Order ----
  - method: GET
    path: "/legal/orders/{id}"
    description: "Get an Order"
    roles: [Customer, PlatformAdmin]
    code: 200
    input: []
    output: Order
    side_effects: []
  - method: GET
    path: "/legal/orders"
    description: "List orders for a project (1:1)"
    roles: [Customer, PlatformAdmin]
    code: 200
    input: ["document_project_id?", "limit?", "offset?"]
    output: Order[]
    side_effects: []

  # ---- UpdateReminder ----
  - method: GET
    path: "/legal/update-reminders/{id}"
    description: "Get an UpdateReminder"
    roles: [Customer, PlatformAdmin]
    code: 200
    input: []
    output: UpdateReminder
    side_effects: []
  - method: GET
    path: "/legal/update-reminders"
    description: "List update reminders for a project"
    roles: [Customer, PlatformAdmin]
    code: 200
    input: ["document_project_id?", "limit?", "offset?"]
    output: UpdateReminder[]
    side_effects: []

  # ---- Test-driving endpoints ----
  - method: POST
    path: "/legal/_clock/set"
    description: "Set the system clock to a fixed UTC instant (test-driving)"
    roles: [PlatformAdmin]
    code: 200
    input: [to_iso8601]
    output: null
    side_effects: ["current clock now == to_iso8601 for due_at comparisons and window checks"]
  - method: POST
    path: "/legal/_reminders/dispatch_due"
    description: "System sweep: transition every SCHEDULED UpdateReminder whose due_at <= clock now to SENT (test-driving)"
    roles: [PlatformAdmin]
    code: 200
    input: []
    output: null
    side_effects: ["due reminders -> SENT"]

# =============================================================================
# §1.6 Error Code Catalog
# =============================================================================
errors:
  - { id: ERR_UNAUTHENTICATED, http: 401, condition: "X-User-Role header missing or not a known role" }
  - { id: ERR_FORBIDDEN_ROLE, http: 403, condition: "Acting role not permitted for this operation" }
  - { id: ERR_NOT_FOUND, http: 404, condition: "Referenced resource id does not exist" }
  - { id: ERR_INVALID_REQUEST, http: 400, condition: "Missing/invalid required field, bad enum, or empty signer_emails" }
  - { id: ERR_REFERENCE_INVALID, http: 409, condition: "Body FK references inconsistent (e.g. subscription_id not owned by customer_id; state_code != customer state)" }
  - { id: ERR_STALE_PROJECT_VERSION, http: 412, condition: "expected_document_project_version does not equal current DocumentProject.version" }
  - { id: ERR_INVALID_STATE, http: 409, condition: "Resource not in a valid from-state for the requested transition" }
  - { id: ERR_SUBSCRIPTION_NOT_ACTIVE, http: 403, condition: "Attorney-review request while owning Subscription.status != ACTIVE" }
  - { id: ERR_REVIEW_ADDON_NOT_ELECTED, http: 409, condition: "Attorney-review requested but project.attorney_review_addon == false" }
  - { id: ERR_QUESTIONNAIRE_INCOMPLETE, http: 409, condition: "Assemble attempted with provisional_completeness < 1.0" }
  - { id: ERR_NO_CLAUSE_TEMPLATES, http: 409, condition: "Assemble attempted but no ClauseTemplate exists for (document_type,state_code)" }
  - { id: ERR_MANDATORY_CLAUSE_MISSING, http: 409, condition: "Finalize attempted with assembled_completeness < 1.0" }
  - { id: ERR_REVIEW_IN_PROGRESS, http: 409, condition: "Finalize attempted while an AttorneyReview is REQUESTED/ASSIGNED/IN_REVIEW" }
  - { id: ERR_ATTORNEY_WINDOW_CONFLICT, http: 409, condition: "Review window overlaps another non-CANCELLED review for the same attorney" }
  - { id: ERR_LEASE_TERM_OVERLAP, http: 409, condition: "LEASE term overlaps an existing lease on the same property within the turnover buffer" }
  - { id: ERR_REVISION_SUPERSEDED, http: 409, condition: "SignatureRequest send references a SUPERSEDED revision" }
  - { id: ERR_PROJECT_NOT_FINALIZED, http: 409, condition: "SignatureRequest send while owning project not FINALIZED" }
  - { id: ERR_NOT_REVIEW_OWNER, http: 403, condition: "Acting attorney is not the assigned reviewer (attorney_id mismatch)" }
  - { id: ERR_SIGNER_NOT_INVITED, http: 409, condition: "Sign attempted with an email not in signer_emails" }
  - { id: ERR_ALREADY_SIGNED, http: 409, condition: "Signer has already signed this envelope" }
  - { id: ERR_NOTARY_NOT_REQUIRED, http: 409, condition: "Notary referral requested for an envelope whose notary_required == false" }
  - { id: ERR_NO_CREDITS_REMAINING, http: 402, condition: "Project create with subscription credits_remaining == 0" }
  - { id: ERR_REMINDER_NOT_DUE, http: 409, condition: "Reminder dispatch attempted before due_at (single-reminder dispatch)" }

# =============================================================================
# §1.7 RBAC Matrix
# =============================================================================
roles:
  - name: Customer
    description: "End user who owns document projects, fills questionnaires, assembles, finalizes, requests reviews, and drives signing."
    identity: "entity_backed:Customer"
    exclusive_operations:
      - "POST /legal/document-projects — create project (X-User-ID == customer_id)"
      - "PUT /legal/document-projects/{id}/questionnaire — answer questionnaire (owner)"
      - "POST /legal/document-projects/{id}/assemble — assemble clauses (owner)"
      - "POST /legal/document-projects/{id}/transition — project lifecycle (owner)"
      - "POST /legal/document-revisions — snapshot revision (owner of project)"
      - "POST /legal/attorney-reviews — request review (owner of project)"
      - "POST /legal/signature-requests — create envelope (owner)"
      - "POST /legal/signature-requests/{id}/transition — send/void (owner)"
      - "POST /legal/signature-requests/{id}/sign — sign (owner)"
      - "POST /legal/notary-referrals — create referral (owner)"
    shared_operations:
      - "POST /legal/customers (also PlatformAdmin)"
      - "POST /legal/subscriptions (also PlatformAdmin)"
      - "GET reads of own resources (projects, orders, reminders, etc.)"

  - name: Attorney
    description: "Licensed reviewer who advances assigned attorney reviews."
    identity: "entity_backed:Attorney"
    exclusive_operations:
      - "POST /legal/attorney-reviews/{id}/transition — advance own review (X-User-ID == attorney_id)"
    shared_operations:
      - "GET reads of projects, revisions, clause templates, assembled clauses, reviews"

  - name: PlatformAdmin
    description: "Operator managing configuration (plans, clause templates, attorneys), subscription lifecycle, and system clock/reminder sweeps."
    identity: "opaque"
    exclusive_operations:
      - "POST /legal/subscription-plans — manage plan catalog"
      - "POST /legal/clause-templates — manage clause library"
      - "POST /legal/attorneys — onboard attorneys"
      - "POST /legal/subscriptions/{id}/transition — subscription lifecycle"
      - "POST /legal/_clock/set — set system clock"
      - "POST /legal/_reminders/dispatch_due — fire due reminders"
    shared_operations:
      - "POST /legal/customers (also Customer)"
      - "POST /legal/subscriptions (also Customer)"
      - "GET reads across resources"
