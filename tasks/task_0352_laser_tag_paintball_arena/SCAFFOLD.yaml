# =============================================================================
# SCAFFOLD — Laser Tag & Paintball Arena (Expert tier)
# §1.0–§1.7. Single source of truth for downstream PRD / tests / implementation.
# =============================================================================

scenario: |
  Laser Tag & Paintball Arena: session/field booking & capacity, group/party
  package, equipment (marker/vest) rental & deposit, ammo/CO2 & add-on, waiver
  & age rules, referee/marshal assignment, walk-in vs reservation, league/event

domain_name: laser-tag-paintball-arena
api_prefix: ""    # flat topology: every entity is its own top-level collection (/arenas, /fields, /bookings, ...)

# -----------------------------------------------------------------------------
# Complexity profile (structural DNA — §0.1–§0.4, Expert tier)
# -----------------------------------------------------------------------------
complexity_profile:
  difficulty_tier: Expert
  primary_archetype: temporal_windowing      # field bookings occupy half-open time intervals with turnaround buffers and per-field capacity
  secondary_archetype: quota_allocation       # equipment pool + deposit ledger reserved/committed/released; field capacity headcount quota
  complexity_layers:
    - optimistic_concurrency                  # OCC on Field.version (slot booking) and on League.version (round advance)
    - cascading_side_effects                  # booking cancel -> rentals release -> equipment back to pool -> deposit ledger credit; referee freed
    - dual_variant_calculation                # add-on quote vs settled; deposit hold vs final
    - derived_field_reconciliation            # Field.reserved_headcount, Arena equipment pool counts, League standings

  entity_topology: flat                       # peer entities linked by FK fields in bodies; nesting limited to Arena/{id}/<collection> for discovery
  state_machine_shape: branching              # Booking fork (CHECKED_IN vs NO_SHOW) + revert (HELD->CANCELLED); League is cyclic across rounds
  relationship_patterns:
    - one_to_many                             # Arena -> Field/EquipmentUnit/Referee/...; Booking -> Rental/AddOnOrder
    - cross_aggregate                         # Rental references both Booking and EquipmentUnit; LeagueMatch references Booking
    - polymorphic                             # EquipmentUnit.unit_type in {MARKER, VEST}; AddOnLine.sku across categories
  role_model: peer_roles                      # FrontDesk vs FieldMarshal vs LeagueDirector vs ArenaManager own distinct resource types
  consistency_model: immediate                # all mutations atomic within a single request

# -----------------------------------------------------------------------------
# §1.0 Response Envelope (FIXED — verbatim)
# -----------------------------------------------------------------------------
response_envelope:
  success: |
    { "meta": { "api_request_id": "req_xxx", "api_request_timestamp": "ISO8601" },
      "response_type": "object" | "array", "data": {} }
  error: |
    { "meta": { ... }, "response_type": "error",
      "data": { "error_id": "ERR_XXX", "message": "..." } }
  pagination_fields: ["limit", "offset", "total_count", "has_more"]
  pagination_defaults: { limit: 10, min: 1, max: 100, offset: 0 }

# =============================================================================
# §1.1 Entity-Relationship Table
# =============================================================================
entities:

  # --- Arena: top-level config + deterministic clock + equipment pool ledger ---
  - name: Arena
    parent: null
    common_fields: true
    fields:
      - { name: name, type: string, source: input, description: "Arena display name" }
      - { name: timezone, type: string, source: input, default: "UTC", description: "IANA tz used only for display; all stored timestamps are UTC" }
      - { name: current_utc, type: datetime, source: system, description: "Deterministic arena clock; set via /_clock/set; drives walk-in NOW windows and booking lead-time checks. ISO 8601 UTC with three fractional digits." }
      - { name: marker_pool_total, type: integer, source: input, description: "Count of MARKER EquipmentUnits provisioned for this arena", constraints: ">= 0" }
      - { name: vest_pool_total, type: integer, source: input, description: "Count of VEST EquipmentUnits provisioned for this arena", constraints: ">= 0" }
      - { name: marker_available_count, type: integer, source: computed, description: "MARKER units with status AVAILABLE; reconciled on every rental reserve/release" }
      - { name: vest_available_count, type: integer, source: computed, description: "VEST units with status AVAILABLE; reconciled on every rental reserve/release" }
      - { name: deposit_held_cents, type: integer, source: computed, description: "Sum of Rental.deposit_hold_cents across all Rentals in HELD or CHECKED_OUT state; conserved ledger quantity" }
      - { name: deposit_refunded_cents, type: integer, source: computed, description: "Cumulative deposit returned to customers across all settled Rentals" }
      - { name: deposit_forfeited_cents, type: integer, source: computed, description: "Cumulative deposit retained for damage/loss across all settled Rentals" }
      - { name: status, type: enum, source: system, default: "OPEN", description: "OPEN | CLOSED; CLOSED blocks new bookings/rentals", constraints: "OPEN, CLOSED" }

  # --- Field: a playing field/zone with capacity and turnaround buffer ---
  - name: Field
    parent: null
    common_fields: true
    fields:
      - { name: arena_id, type: string, source: input, description: "FK -> Arena.id" }
      - { name: name, type: string, source: input, description: "Field name e.g. 'Outdoor Woodsball'" }
      - { name: game_mode, type: enum, source: input, description: "LASER_TAG | PAINTBALL; constrains which add-on SKUs and equipment apply", constraints: "LASER_TAG, PAINTBALL" }
      - { name: capacity_max, type: integer, source: input, description: "Maximum players allowed on this field for any one session window", constraints: ">= 1" }
      - { name: turnaround_minutes, type: integer, source: input, default: 0, description: "Buffer minutes that must separate the end of one CONFIRMED/CHECKED_IN booking and the start of the next on this field", constraints: ">= 0" }
      - { name: reserved_headcount, type: integer, source: computed, description: "Sum of party_size over Bookings on this field currently holding a live slot (HELD, CONFIRMED, CHECKED_IN) whose window overlaps NOW; recomputed on booking transitions" }
      - { name: status, type: enum, source: system, default: "ACTIVE", description: "ACTIVE | CLOSED; CLOSED rejects new slot holds", constraints: "ACTIVE, CLOSED" }

  # --- PartyPackage: pricing/config for group bookings ---
  - name: PartyPackage
    parent: null
    common_fields: true
    fields:
      - { name: arena_id, type: string, source: input, description: "FK -> Arena.id" }
      - { name: name, type: string, source: input, description: "Package name e.g. 'Birthday Blitz'" }
      - { name: included_players, type: integer, source: input, description: "Headcount covered by the flat package fee", constraints: ">= 1" }
      - { name: extra_player_fee_cents, type: integer, source: input, description: "Per-player fee charged for each player above included_players", constraints: ">= 0" }
      - { name: base_fee_cents, type: integer, source: input, description: "Flat package fee covering included_players", constraints: ">= 0" }
      - { name: included_ammo_balls, type: integer, source: input, default: 0, description: "Paintballs (or laser credits) bundled per booking before metered add-on pricing applies", constraints: ">= 0" }
      - { name: discount_pct, type: number, source: input, default: 0, description: "Fractional discount [0,1) applied to the metered add-on SETTLED variant for bookings on this package", constraints: ">= 0 and < 1" }
      - { name: active, type: boolean, source: input, default: true, description: "When false the package cannot be attached to new bookings" }

  # --- Booking: a session on a field over a half-open time window ---
  - name: Booking
    parent: null
    common_fields: true
    fields:
      - { name: arena_id, type: string, source: input, description: "FK -> Arena.id" }
      - { name: field_id, type: string, source: input, description: "FK -> Field.id" }
      - { name: package_id, type: string, source: input, description: "FK -> PartyPackage.id; null for a la carte bookings" }
      - { name: booking_type, type: enum, source: input, description: "RESERVATION (future, lead-time enforced) | WALK_IN (starts at arena NOW)", constraints: "RESERVATION, WALK_IN" }
      - { name: party_size, type: integer, source: input, description: "Number of players; counts against Field.capacity_max", constraints: ">= 1" }
      - { name: window_start, type: datetime, source: input, description: "Session start (inclusive). For WALK_IN must equal Arena.current_utc at create time." }
      - { name: window_end, type: datetime, source: input, description: "Session end (exclusive). Half-open interval [window_start, window_end)." }
      - { name: status, type: enum, source: system, default: "HELD", description: "HELD | CONFIRMED | CHECKED_IN | COMPLETED | NO_SHOW | CANCELLED", constraints: "HELD, CONFIRMED, CHECKED_IN, COMPLETED, NO_SHOW, CANCELLED" }
      - { name: field_fee_cents, type: integer, source: computed, description: "Package base_fee + extra-player fees (0 when package_id null); pinned at CONFIRMED" }
      - { name: invoice_total_cents, type: integer, source: computed, description: "Final settled invoice: field_fee + settled add-on total + forfeited deposit; computed at COMPLETED. See calculations.booking_invoice_cents" }
      - { name: checked_in_count, type: integer, source: input, default: 0, description: "Actual players who checked in; <= party_size; set at CHECKED_IN" }
      - { name: minors_present, type: boolean, source: computed, description: "True if any linked WaiverProfile.is_minor is true; gates referee requirement" }
      - { name: referee_required, type: boolean, source: computed, description: "True when party_size >= REFEREE_THRESHOLD or minors_present or game_mode PAINTBALL; gates CHECKED_IN" }

  # --- WaiverProfile: per-participant waiver + age, linked to a booking ---
  - name: WaiverProfile
    parent: null
    common_fields: true
    fields:
      - { name: arena_id, type: string, source: input, description: "FK -> Arena.id" }
      - { name: booking_id, type: string, source: input, description: "FK -> Booking.id" }
      - { name: participant_name, type: string, source: input, description: "Participant legal name" }
      - { name: date_of_birth, type: datetime, source: input, description: "DOB as ISO 8601 UTC; age computed against Arena.current_utc" }
      - { name: age_years, type: integer, source: computed, description: "Full years between date_of_birth and Arena.current_utc at signing" }
      - { name: is_minor, type: boolean, source: computed, description: "True when age_years < ADULT_AGE" }
      - { name: guardian_name, type: string, source: input, description: "Guardian name; required when is_minor true" }
      - { name: status, type: enum, source: system, default: "DRAFT", description: "DRAFT | SIGNED | VOID; SIGNED required to count toward booking check-in", constraints: "DRAFT, SIGNED, VOID" }

  # --- EquipmentUnit: a physical marker or vest in the arena pool ---
  - name: EquipmentUnit
    parent: null
    common_fields: true
    fields:
      - { name: arena_id, type: string, source: input, description: "FK -> Arena.id" }
      - { name: unit_type, type: enum, source: input, description: "MARKER | VEST", constraints: "MARKER, VEST" }
      - { name: asset_tag, type: string, source: input, description: "Human asset label, unique within arena+unit_type" }
      - { name: deposit_cents, type: integer, source: input, description: "Deposit required to check this unit out", constraints: ">= 0" }
      - { name: condition_grade, type: enum, source: input, default: "A", description: "A | B | C condition; C units cannot be reserved", constraints: "A, B, C" }
      - { name: status, type: enum, source: system, default: "AVAILABLE", description: "AVAILABLE | RESERVED | CHECKED_OUT | MAINTENANCE", constraints: "AVAILABLE, RESERVED, CHECKED_OUT, MAINTENANCE" }

  # --- Rental: links a Booking to an EquipmentUnit with a deposit lifecycle ---
  - name: Rental
    parent: null
    common_fields: true
    fields:
      - { name: arena_id, type: string, source: input, description: "FK -> Arena.id" }
      - { name: booking_id, type: string, source: input, description: "FK -> Booking.id" }
      - { name: equipment_unit_id, type: string, source: input, description: "FK -> EquipmentUnit.id" }
      - { name: deposit_hold_cents, type: integer, source: computed, description: "Deposit reserved at reserve time = EquipmentUnit.deposit_cents snapshot" }
      - { name: damage_fee_cents, type: integer, source: input, default: 0, description: "Damage/loss fee assessed at return; <= deposit_hold_cents", constraints: ">= 0" }
      - { name: deposit_refund_cents, type: integer, source: computed, description: "Deposit returned at settlement = max(0, deposit_hold_cents - damage_fee_cents). See calculations.deposit_settlement_cents" }
      - { name: deposit_forfeit_cents, type: integer, source: computed, description: "Deposit retained at settlement = min(deposit_hold_cents, damage_fee_cents)" }
      - { name: status, type: enum, source: system, default: "HELD", description: "HELD | CHECKED_OUT | RETURNED | RELEASED; RELEASED = cancelled before checkout", constraints: "HELD, CHECKED_OUT, RETURNED, RELEASED" }

  # --- AddOnOrder: ammo/CO2 & misc add-ons attached to a booking ---
  - name: AddOnOrder
    parent: null
    common_fields: true
    fields:
      - { name: arena_id, type: string, source: input, description: "FK -> Arena.id" }
      - { name: booking_id, type: string, source: input, description: "FK -> Booking.id" }
      - { name: ammo_balls, type: integer, source: input, default: 0, description: "Metered ammunition units ordered (paintballs / laser credits)", constraints: ">= 0" }
      - { name: co2_tanks, type: integer, source: input, default: 0, description: "CO2/air refills ordered", constraints: ">= 0" }
      - { name: misc_cents, type: integer, source: input, default: 0, description: "Flat miscellaneous add-on charge (snacks, photos)", constraints: ">= 0" }
      - { name: quote_total_cents, type: integer, source: computed, description: "Provisional add-on price at order creation; ignores package discount. See calculations.add_on_total_cents variant=quote" }
      - { name: settled_total_cents, type: integer, source: computed, description: "Final add-on price at booking COMPLETED; applies package discount_pct and included_ammo allowance. See calculations.add_on_total_cents variant=settled" }
      - { name: status, type: enum, source: system, default: "QUOTED", description: "QUOTED | SETTLED | VOID", constraints: "QUOTED, SETTLED, VOID" }

  # --- Referee: a marshal who can be assigned to bookings ---
  - name: Referee
    parent: null
    common_fields: true
    fields:
      - { name: arena_id, type: string, source: input, description: "FK -> Arena.id" }
      - { name: name, type: string, source: input, description: "Referee name" }
      - { name: certified_paintball, type: boolean, source: input, default: false, description: "Eligible to marshal PAINTBALL bookings only when true" }
      - { name: status, type: enum, source: system, default: "AVAILABLE", description: "AVAILABLE | ON_DUTY | OFF_SHIFT; ON_DUTY means currently assigned to a live booking", constraints: "AVAILABLE, ON_DUTY, OFF_SHIFT" }

  # --- RefereeAssignment: assigns a referee to a booking for its window ---
  - name: RefereeAssignment
    parent: null
    common_fields: true
    fields:
      - { name: arena_id, type: string, source: input, description: "FK -> Arena.id" }
      - { name: booking_id, type: string, source: input, description: "FK -> Booking.id" }
      - { name: referee_id, type: string, source: input, description: "FK -> Referee.id" }
      - { name: status, type: enum, source: system, default: "ASSIGNED", description: "ASSIGNED | RELEASED; RELEASED when booking ends or is cancelled", constraints: "ASSIGNED, RELEASED" }

  # --- League: a recurring competitive event with cyclic rounds ---
  - name: League
    parent: null
    common_fields: true
    fields:
      - { name: arena_id, type: string, source: input, description: "FK -> Arena.id" }
      - { name: name, type: string, source: input, description: "League name" }
      - { name: total_rounds, type: integer, source: input, description: "Number of rounds before the league can be finalized", constraints: ">= 1" }
      - { name: current_round, type: integer, source: system, default: 0, description: "0 before the league opens; increments on each round advance up to total_rounds" }
      - { name: win_points, type: integer, source: input, default: 3, description: "Standings points awarded to a match winner", constraints: ">= 0" }
      - { name: draw_points, type: integer, source: input, default: 1, description: "Standings points awarded to each team on a draw", constraints: ">= 0" }
      - { name: status, type: enum, source: system, default: "DRAFT", description: "DRAFT | OPEN | ROUND_LOCKED | FINALIZED; OPEN<->ROUND_LOCKED cycle per round", constraints: "DRAFT, OPEN, ROUND_LOCKED, FINALIZED" }

  # --- LeagueMatch: one scored match inside a league round, backed by a Booking ---
  - name: LeagueMatch
    parent: null
    common_fields: true
    fields:
      - { name: arena_id, type: string, source: input, description: "FK -> Arena.id" }
      - { name: league_id, type: string, source: input, description: "FK -> League.id" }
      - { name: booking_id, type: string, source: input, description: "FK -> Booking.id; the physical session the match is played in" }
      - { name: round_index, type: integer, source: system, description: "League.current_round at match creation" }
      - { name: home_team, type: string, source: input, description: "Home team label" }
      - { name: away_team, type: string, source: input, description: "Away team label" }
      - { name: home_score, type: integer, source: input, default: 0, description: "Home score recorded at result entry", constraints: ">= 0" }
      - { name: away_score, type: integer, source: input, default: 0, description: "Away score recorded at result entry", constraints: ">= 0" }
      - { name: outcome, type: enum, source: computed, description: "HOME | AWAY | DRAW; derived from scores at result entry", constraints: "HOME, AWAY, DRAW" }
      - { name: status, type: enum, source: system, default: "SCHEDULED", description: "SCHEDULED | RESULT_RECORDED | VOID", constraints: "SCHEDULED, RESULT_RECORDED, VOID" }

# =============================================================================
# §1.2 State Machine Table
# =============================================================================
state_machines:

  # --- Booking: branching (CHECKED_IN vs NO_SHOW) with revert (HELD->CANCELLED) ---
  - entity: Booking
    field: status
    initial_state: HELD
    terminal_states: [COMPLETED, NO_SHOW, CANCELLED]
    transitions:
      - from: HELD
        to: CONFIRMED
        trigger: "POST /bookings/{bookingId}/confirm"
        actor: FrontDesk
        preconditions:
          - "Booking.status == HELD"
          - "Field.status == ACTIVE"
          - "Arena.status == OPEN"
          - "expected_field_version matches Field.version (OCC)"
        side_effects:
          - "Field.field_fee_cents computed onto Booking.field_fee_cents (calculations.field_fee_cents)"
          - "increments Field.version by 1"
          - "Field.reserved_headcount recomputed"

      - from: HELD
        to: CANCELLED
        trigger: "POST /bookings/{bookingId}/cancel"
        actor: FrontDesk
        preconditions:
          - "Booking.status in {HELD, CONFIRMED}"
        side_effects:
          - "All Rentals with this booking_id in {HELD, CHECKED_OUT} -> RELEASED (cascade hop 1)"
          - "Each released Rental's EquipmentUnit -> AVAILABLE (cascade hop 2)"
          - "Arena.deposit_held_cents decremented by each released Rental.deposit_hold_cents (cascade hop 3)"
          - "Arena equipment available counts recomputed"
          - "All AddOnOrders with this booking_id in {QUOTED} -> VOID"
          - "Any RefereeAssignment for this booking -> RELEASED; its Referee -> AVAILABLE"
          - "Field.reserved_headcount recomputed"

      - from: CONFIRMED
        to: CANCELLED
        trigger: "POST /bookings/{bookingId}/cancel"
        actor: FrontDesk
        preconditions:
          - "Booking.status in {HELD, CONFIRMED}"
        side_effects:
          - "Same cascade as HELD->CANCELLED"

      - from: CONFIRMED
        to: CHECKED_IN
        trigger: "POST /bookings/{bookingId}/check-in"
        actor: FieldMarshal
        preconditions:
          - "Booking.status == CONFIRMED"
          - "Arena.current_utc within [window_start, window_end)"
          - "1 <= checked_in_count <= party_size"
          - "Every WaiverProfile for this booking whose status is NOT VOID and whose is_minor is true must be SIGNED with a guardian_name (the minor-waiver safety gate). Adults are NOT required to have an individual waiver row for check-in; only minors who have a profile on the booking are gated."
          - "If Booking.referee_required then an ASSIGNED RefereeAssignment exists for this booking"
        side_effects:
          - "Booking.checked_in_count set from request"
          - "Each HELD Rental for this booking -> CHECKED_OUT; its EquipmentUnit -> CHECKED_OUT"
          - "Field.reserved_headcount recomputed"

      - from: CHECKED_IN
        to: COMPLETED
        trigger: "POST /bookings/{bookingId}/complete"
        actor: FieldMarshal
        preconditions:
          - "Booking.status == CHECKED_IN"
          - "No Rental for this booking still in CHECKED_OUT (all returned)"
        side_effects:
          - "Each AddOnOrder QUOTED -> SETTLED; settled_total_cents computed (calculations.add_on_total_cents variant=settled)"
          - "Booking.invoice_total_cents computed (calculations.booking_invoice_cents)"
          - "RefereeAssignment for this booking -> RELEASED; Referee -> AVAILABLE"
          - "Field.reserved_headcount recomputed"

      - from: CONFIRMED
        to: NO_SHOW
        trigger: "POST /bookings/{bookingId}/no-show"
        actor: FieldMarshal
        preconditions:
          - "Booking.status == CONFIRMED"
          - "Arena.current_utc >= window_end"
        side_effects:
          - "All Rentals HELD for this booking -> RELEASED; EquipmentUnits -> AVAILABLE; Arena.deposit_held_cents decremented"
          - "All QUOTED AddOnOrders -> VOID"
          - "RefereeAssignment -> RELEASED; Referee -> AVAILABLE"
          - "Field.reserved_headcount recomputed"

  # --- Rental: deposit lifecycle (HELD -> CHECKED_OUT -> RETURNED; HELD -> RELEASED) ---
  - entity: Rental
    field: status
    initial_state: HELD
    terminal_states: [RETURNED, RELEASED]
    transitions:
      - from: HELD
        to: CHECKED_OUT
        trigger: "system (parent Booking CONFIRMED->CHECKED_IN)"
        actor: system
        preconditions:
          - "Rental.status == HELD"
          - "EquipmentUnit.status == RESERVED"
        side_effects:
          - "EquipmentUnit.status -> CHECKED_OUT"

      - from: CHECKED_OUT
        to: RETURNED
        trigger: "POST /rentals/{rentalId}/return"
        actor: FieldMarshal
        preconditions:
          - "Rental.status == CHECKED_OUT"
          - "damage_fee_cents <= deposit_hold_cents"
        side_effects:
          - "deposit_refund_cents and deposit_forfeit_cents computed (calculations.deposit_settlement_cents)"
          - "EquipmentUnit.status -> AVAILABLE (condition_grade unchanged) when damage_fee_cents == 0 else MAINTENANCE"
          - "Arena.deposit_held_cents decremented by deposit_hold_cents (cascade: ledger sync)"
          - "Arena.deposit_refunded_cents incremented by deposit_refund_cents"
          - "Arena.deposit_forfeited_cents incremented by deposit_forfeit_cents"
          - "Arena equipment available counts recomputed"

      - from: HELD
        to: RELEASED
        trigger: "system (parent Booking cancelled/no-show) or POST /rentals/{rentalId}/release"
        actor: "system or FrontDesk"
        preconditions:
          - "Rental.status == HELD"
        side_effects:
          - "EquipmentUnit.status -> AVAILABLE"
          - "Arena.deposit_held_cents decremented by deposit_hold_cents"
          - "Arena equipment available counts recomputed"

  # --- EquipmentUnit: pool occupancy machine ---
  - entity: EquipmentUnit
    field: status
    initial_state: AVAILABLE
    terminal_states: []
    transitions:
      - from: AVAILABLE
        to: RESERVED
        trigger: "system (POST /rentals creates a HELD Rental)"
        actor: system
        preconditions:
          - "EquipmentUnit.status == AVAILABLE"
          - "EquipmentUnit.condition_grade in {A, B}"
        side_effects:
          - "Arena available count for this unit_type decremented; Arena.deposit_held_cents incremented by deposit_cents"

      - from: RESERVED
        to: CHECKED_OUT
        trigger: "system (Booking check-in)"
        actor: system
        preconditions: ["EquipmentUnit.status == RESERVED"]
        side_effects: []

      - from: [RESERVED, CHECKED_OUT]
        to: AVAILABLE
        trigger: "system (Rental released or returned undamaged)"
        actor: system
        preconditions: []
        side_effects:
          - "Arena available count for this unit_type incremented"

      - from: CHECKED_OUT
        to: MAINTENANCE
        trigger: "system (Rental returned with damage_fee_cents > 0)"
        actor: system
        preconditions: []
        side_effects: ["condition_grade downgraded one notch (A->B->C, C stays C)"]

      - from: MAINTENANCE
        to: AVAILABLE
        trigger: "POST /equipment-units/{unitId}/restore"
        actor: ArenaManager
        preconditions: ["EquipmentUnit.status == MAINTENANCE"]
        side_effects: ["Arena available count for this unit_type incremented"]

  # --- WaiverProfile: signing lifecycle ---
  - entity: WaiverProfile
    field: status
    initial_state: DRAFT
    terminal_states: [VOID]
    transitions:
      - from: DRAFT
        to: SIGNED
        trigger: "POST /waiver-profiles/{waiverId}/sign"
        actor: FrontDesk
        preconditions:
          - "WaiverProfile.status == DRAFT"
          - "If is_minor then guardian_name is present"
          - "Parent Booking.status in {HELD, CONFIRMED}"
        side_effects:
          - "Booking.minors_present recomputed"
          - "Booking.referee_required recomputed"

      - from: [DRAFT, SIGNED]
        to: VOID
        trigger: "POST /waiver-profiles/{waiverId}/void"
        actor: FrontDesk
        preconditions: ["WaiverProfile.status in {DRAFT, SIGNED}"]
        side_effects:
          - "Booking.minors_present recomputed"
          - "Booking.referee_required recomputed"

  # --- League: cyclic OPEN <-> ROUND_LOCKED per round, then FINALIZED ---
  - entity: League
    field: status
    initial_state: DRAFT
    terminal_states: [FINALIZED]
    transitions:
      - from: DRAFT
        to: OPEN
        trigger: "POST /leagues/{leagueId}/open"
        actor: LeagueDirector
        preconditions:
          - "League.status == DRAFT"
        side_effects:
          - "current_round set to 1"

      - from: OPEN
        to: ROUND_LOCKED
        trigger: "POST /leagues/{leagueId}/lock-round"
        actor: LeagueDirector
        preconditions:
          - "League.status == OPEN"
          - "Every LeagueMatch with round_index == current_round is in {RESULT_RECORDED, VOID}"
          - "expected_league_version matches League.version (OCC)"
        side_effects:
          - "increments League.version by 1"
          - "Standings recomputed (calculations.league_standings)"

      - from: ROUND_LOCKED
        to: OPEN
        trigger: "POST /leagues/{leagueId}/advance-round"
        actor: LeagueDirector
        preconditions:
          - "League.status == ROUND_LOCKED"
          - "current_round < total_rounds"
          - "expected_league_version matches League.version (OCC)"
        side_effects:
          - "current_round incremented by 1"
          - "increments League.version by 1"

      - from: ROUND_LOCKED
        to: FINALIZED
        trigger: "POST /leagues/{leagueId}/finalize"
        actor: LeagueDirector
        preconditions:
          - "League.status == ROUND_LOCKED"
          - "current_round == total_rounds"
        side_effects:
          - "Final standings frozen"

  # --- LeagueMatch: result recording ---
  - entity: LeagueMatch
    field: status
    initial_state: SCHEDULED
    terminal_states: [VOID]
    transitions:
      - from: SCHEDULED
        to: RESULT_RECORDED
        trigger: "POST /league-matches/{matchId}/record-result"
        actor: LeagueDirector
        preconditions:
          - "LeagueMatch.status == SCHEDULED"
          - "League.status == OPEN"
          - "LeagueMatch.round_index == League.current_round"
          - "Linked Booking.status == COMPLETED"
        side_effects:
          - "outcome computed from home_score vs away_score"
          - "home_score/away_score persisted"

      - from: SCHEDULED
        to: VOID
        trigger: "POST /league-matches/{matchId}/void"
        actor: LeagueDirector
        preconditions: ["LeagueMatch.status == SCHEDULED"]
        side_effects: []

# -----------------------------------------------------------------------------
# §1.2.1 Concurrency Rules (OCC on parent version — strictly serial-testable)
# -----------------------------------------------------------------------------
concurrency_rules:
  - rule_id: confirm-booking-stale-field
    parent_entity: Field
    write_endpoint: "POST /bookings/{bookingId}/confirm"
    occ_field: "expected_field_version"
    description: |
      Confirming a Booking against a Field whose version has advanced since the
      client last observed it is rejected with a stale-version error. Confirming
      a competing Booking on the same field bumps Field.version (the field's slot
      ledger and reserved_headcount changed), so a confirm still carrying the
      older expected_field_version is observing stale field state and is rejected.
    error_id: ERR_STALE_FIELD_VERSION
    http_status: 412

  - rule_id: advance-round-stale-league
    parent_entity: League
    write_endpoint: "POST /leagues/{leagueId}/advance-round"
    occ_field: "expected_league_version"
    description: |
      Advancing a League round against a League whose version has advanced since
      the client last observed it is rejected. Locking the round (a legitimate
      prior write) bumps League.version, so an advance-round still carrying the
      pre-lock expected_league_version observes stale league state and is rejected.
    error_id: ERR_STALE_LEAGUE_VERSION
    http_status: 412

# =============================================================================
# §1.3 Calculation Rules Table
# =============================================================================
calculations:

  # --- Rule 1 instance A (domain: AddOnOrder) + Rule 2 mode (a) ---
  - name: add_on_total_cents
    trigger: "AddOnOrder creation (quote variant) and parent Booking CHECKED_IN->COMPLETED (settled variant)"
    algorithm: tiered_pricing
    formula: |
      Let ammo = AddOnOrder.ammo_balls, co2 = AddOnOrder.co2_tanks, misc = AddOnOrder.misc_cents.

      ammo_cost(n):                      # tiered marginal pricing on ball count n
        tier1 = min(n, TIER1_BALLS)                          # first 500 balls
        tier2 = min(max(n - TIER1_BALLS, 0), TIER2_BALLS)    # next 1500 balls
        tier3 = max(n - TIER1_BALLS - TIER2_BALLS, 0)        # remainder
        return tier1*RATE1_CENTS + tier2*RATE2_CENTS + tier3*RATE3_CENTS

      QUOTE variant (at order creation, no package context applied):
        billable_ammo = ammo
        gross = ammo_cost(billable_ammo) + co2 * CO2_CENTS + misc
        quote_total_cents = gross                            # integer cents, exact

      SETTLED variant (at booking COMPLETED, package context applied):
        included = PartyPackage.included_ammo_balls (0 if no package)
        billable_ammo = max(ammo - included, 0)              # included allowance is consumed first
        gross = ammo_cost(billable_ammo) + co2 * CO2_CENTS + misc
        discount = round_half_up(ammo_cost(billable_ammo) * PartyPackage.discount_pct)   # discount applies to METERED ammo only, not CO2/misc
        settled_total_cents = gross - discount
    input_set: "Exactly one AddOnOrder; package context from the parent Booking.package_id (null -> included=0, discount_pct=0)"
    constants:
      TIER1_BALLS: 500
      TIER2_BALLS: 1500
      RATE1_CENTS: 10        # $0.10 per ball, first 500
      RATE2_CENTS: 8         # $0.08 per ball, next 1500
      RATE3_CENTS: 6         # $0.06 per ball beyond 2000
      CO2_CENTS: 700         # $7.00 per CO2 tank
    precision: "integer cents; discount rounded round_half_up to nearest cent BEFORE subtraction (rounding order pinned: round the discount term, then subtract)"
    variants:
      - name: quote
        when: "AddOnOrder created (status QUOTED); shown to customer up front"
        difference: "No included_ammo allowance and no discount_pct; bills every ball at tier rates"
      - name: settled
        when: "Parent Booking transitions CHECKED_IN->COMPLETED"
        difference: "Subtracts package included_ammo from billable balls first, then subtracts a round_half_up package discount on metered ammo cost"

  # --- Rule 1 instance B (domain: Rental deposit) ---
  - name: deposit_settlement_cents
    trigger: "Rental CHECKED_OUT->RETURNED (final variant); deposit_hold pinned at Rental creation (hold variant)"
    algorithm: waterfall_allocation
    formula: |
      HOLD variant (at Rental creation):
        deposit_hold_cents = EquipmentUnit.deposit_cents      # full deposit reserved

      FINAL variant (at return):
        forfeit = min(deposit_hold_cents, damage_fee_cents)   # damage drawn from deposit first
        refund  = deposit_hold_cents - forfeit                # remainder returned (>= 0)
        deposit_forfeit_cents = forfeit
        deposit_refund_cents  = refund
        invariant: deposit_refund_cents + deposit_forfeit_cents == deposit_hold_cents
    input_set: "Exactly one Rental; damage_fee_cents from the return request"
    constants: {}
    precision: "integer cents, exact (no rounding)"
    variants:
      - name: hold
        when: "Rental created and EquipmentUnit reserved"
        difference: "Full EquipmentUnit.deposit_cents reserved; refund/forfeit not yet known"
      - name: final
        when: "Rental returned"
        difference: "Damage fee waterfalls out of the held deposit; remainder refunded"

  # --- Rule 2 mode (b): rounding-order-pinned line invoice (different metric/entity) ---
  - name: booking_invoice_cents
    trigger: "Booking CHECKED_IN->COMPLETED"
    algorithm: aggregation
    formula: |
      Invoice lines (each line taxed independently, then summed — rounding order PINNED):
        line_field   = Booking.field_fee_cents
        line_addon   = sum over this booking's AddOnOrders of addon.settled_total_cents
        line_forfeit = sum over this booking's Rentals of rental.deposit_forfeit_cents

      Per-line tax then sum (NOT sum-then-tax):
        taxed(line) = line + round_half_up(line * TAX_RATE)
        invoice_total_cents = taxed(line_field) + taxed(line_addon) + taxed(line_forfeit)

      The order is fixed: round each line's tax to the nearest cent FIRST, then add
      the three taxed lines. "Sum the three lines, then tax once" is explicitly NOT
      the algorithm and can differ by one or two cents.
    input_set: "All non-VOID AddOnOrders (now SETTLED) and all RETURNED Rentals for this booking; field_fee from the booking"
    constants:
      TAX_RATE: 0.0825      # 8.25% sales tax
    precision: "integer cents; tax rounded round_half_up per line BEFORE summation"

  # --- Rule 2 mode (c) would-be circular guard lives here: field_fee depends on package tier ---
  - name: field_fee_cents
    trigger: "Booking HELD->CONFIRMED"
    algorithm: threshold
    formula: |
      If Booking.package_id is null:
        field_fee_cents = 0
      Else (evaluation order pinned to avoid circularity):
        extra_players = max(Booking.party_size - PartyPackage.included_players, 0)
        field_fee_cents = PartyPackage.base_fee_cents + extra_players * PartyPackage.extra_player_fee_cents
    input_set: "The booking and its PartyPackage (if any)"
    constants: {}
    precision: "integer cents, exact"

  # --- League standings: weighted scoring across matches, order-pinned ---
  - name: league_standings
    trigger: "League OPEN->ROUND_LOCKED"
    algorithm: weighted_scoring
    formula: |
      For each team label appearing as home_team or away_team across all
      RESULT_RECORDED LeagueMatches with round_index <= League.current_round:
        points = 0
        for each match in chronological order by match.created_at ASC (tie-break created_at):
          if match.outcome == DRAW:    both teams += League.draw_points
          if match.outcome == HOME:    home_team  += League.win_points
          if match.outcome == AWAY:    away_team  += League.win_points
      Standings = teams sorted by points DESC, then team label ASC (deterministic, no id use).
    input_set: "RESULT_RECORDED LeagueMatches with round_index <= current_round; VOID matches excluded"
    constants: {}
    precision: "integer points, exact"

  # --- Referee requirement (threshold, drives cross-entity gate) ---
  - name: referee_required
    trigger: "Booking creation, WaiverProfile sign/void, party_size change"
    algorithm: threshold
    formula: |
      referee_required =
        (Booking.party_size >= REFEREE_THRESHOLD)
        OR Booking.minors_present
        OR (Field.game_mode == PAINTBALL)
      where minors_present = exists SIGNED WaiverProfile for this booking with is_minor true.
    input_set: "The booking, its field's game_mode, and SIGNED WaiverProfiles for this booking"
    constants:
      REFEREE_THRESHOLD: 12      # >= 12 players requires a referee
      ADULT_AGE: 18

# =============================================================================
# §1.4 Validation Rules Table (ordered by priority)
# =============================================================================
validations:
  - priority: 1
    category: auth
    check: "X-User-ID and X-User-Role headers present and well-formed"
    error_id: ERR_MISSING_OR_INVALID_USER_CONTEXT_HEADER
    http_status: 401
    applies_to: all

  - priority: 2
    category: auth
    check: "Role is permitted for this operation per §1.7 RBAC matrix"
    error_id: ERR_FORBIDDEN_ROLE
    http_status: 403
    applies_to: all

  - priority: 3
    category: existence
    check: "Every resource id in the path and every FK in the body exists, validated left-to-right (arena first, then field/package/booking/etc.)"
    error_id: "ERR_ARENA_NOT_FOUND / ERR_FIELD_NOT_FOUND / ERR_PACKAGE_NOT_FOUND / ERR_BOOKING_NOT_FOUND / ERR_EQUIPMENT_NOT_FOUND / ERR_RENTAL_NOT_FOUND / ERR_WAIVER_NOT_FOUND / ERR_REFEREE_NOT_FOUND / ERR_LEAGUE_NOT_FOUND / ERR_MATCH_NOT_FOUND / ERR_ASSIGNMENT_NOT_FOUND"
    http_status: 404
    applies_to: all endpoints with path ids or FK body fields

  - priority: 4
    category: existence
    check: "Required input fields present and of correct type; enum values within declared domain"
    error_id: ERR_VALIDATION
    http_status: 400
    applies_to: all write endpoints

  - priority: 5
    category: state
    check: "Target resource is in a state from which the requested transition is allowed"
    error_id: "ERR_BOOKING_INVALID_STATE / ERR_RENTAL_INVALID_STATE / ERR_WAIVER_INVALID_STATE / ERR_LEAGUE_INVALID_STATE / ERR_MATCH_INVALID_STATE / ERR_EQUIPMENT_INVALID_STATE"
    http_status: 409
    applies_to: all transition endpoints

  - priority: 6
    category: state
    check: "OCC: expected_<parent>_version equals the live parent version"
    error_id: "ERR_STALE_FIELD_VERSION / ERR_STALE_LEAGUE_VERSION"
    http_status: 412
    applies_to: "POST /bookings/{bookingId}/confirm, POST /leagues/{leagueId}/advance-round, POST /leagues/{leagueId}/lock-round"

  - priority: 7
    category: business_safety
    check: "Minor waiver/guardian rule: at check-in, every non-VOID WaiverProfile on the booking whose is_minor is true must be SIGNED and carry a guardian_name. At sign time, signing a minor's waiver that has no guardian_name is rejected. Adults need no individual waiver row to check in."
    error_id: ERR_MINOR_WAIVER_REQUIRED
    http_status: 422
    applies_to: "POST /bookings/{bookingId}/check-in, POST /waiver-profiles/{waiverId}/sign"

  - priority: 8
    category: business_safety
    check: "Referee gate: if Booking.referee_required, an ASSIGNED RefereeAssignment must exist before check-in; a PAINTBALL booking's assigned referee must be certified_paintball"
    error_id: ERR_REFEREE_REQUIRED
    http_status: 422
    applies_to: "POST /bookings/{bookingId}/check-in"

  - priority: 9
    category: business_referential
    check: "Referee eligibility: assigning a referee who is not certified_paintball to a PAINTBALL booking is rejected; assigning a referee whose status is not AVAILABLE is rejected"
    error_id: ERR_REFEREE_NOT_ELIGIBLE
    http_status: 409
    applies_to: "POST /referee-assignments"

  - priority: 10
    category: business_temporal
    check: "Field slot overlap: a new HELD/CONFIRMED booking on a field whose half-open window [start,end) plus turnaround buffer collides with an existing live booking's window on the same field is rejected"
    error_id: ERR_FIELD_SLOT_CONFLICT
    http_status: 409
    applies_to: "POST /bookings, POST /bookings/{bookingId}/confirm"

  - priority: 11
    category: business_temporal
    check: "Equipment double-booking overlap: reserving an EquipmentUnit whose CHECKED_OUT/RESERVED interval (an existing live Rental's booking window) overlaps the new booking's window is rejected (closed-interval, no buffer)"
    error_id: ERR_EQUIPMENT_TIME_CONFLICT
    http_status: 409
    applies_to: "POST /rentals"

  - priority: 12
    category: business_temporal
    check: "Reservation lead time: a RESERVATION's window_start must be >= Arena.current_utc + MIN_LEAD_MINUTES (MIN_LEAD_MINUTES = 60); a WALK_IN's window_start must equal Arena.current_utc exactly. Comparison is inclusive at the boundary: window_start == current_utc + 60min satisfies the reservation rule."
    error_id: ERR_LEAD_TIME_VIOLATION
    http_status: 422
    applies_to: "POST /bookings"

  - priority: 13
    category: business_constraint
    check: "Window sanity: window_end must be strictly after window_start"
    error_id: ERR_INVALID_WINDOW
    http_status: 422
    applies_to: "POST /bookings"

  - priority: 14
    category: business_constraint
    check: "Field capacity: Booking.party_size must be <= Field.capacity_max; check-in checked_in_count must be <= party_size and >= 1"
    error_id: ERR_CAPACITY_EXCEEDED
    http_status: 409
    applies_to: "POST /bookings, POST /bookings/{bookingId}/check-in"

  - priority: 15
    category: business_constraint
    check: "Equipment availability: reserving an EquipmentUnit requires status AVAILABLE and condition_grade in {A,B}"
    error_id: ERR_EQUIPMENT_UNAVAILABLE
    http_status: 409
    applies_to: "POST /rentals"

  - priority: 16
    category: business_constraint
    check: "Package active: a booking may only attach a PartyPackage whose active flag is true and whose arena matches"
    error_id: ERR_PACKAGE_INACTIVE
    http_status: 409
    applies_to: "POST /bookings"

  - priority: 17
    category: business_fiscal
    check: "Damage fee bound: Rental return damage_fee_cents must be <= deposit_hold_cents"
    error_id: ERR_DAMAGE_FEE_EXCEEDS_DEPOSIT
    http_status: 422
    applies_to: "POST /rentals/{rentalId}/return"

# =============================================================================
# §1.5 API Endpoint Table
# =============================================================================
endpoints:

  # --- Arena ---
  - method: POST
    path: "/arenas"
    description: "Create an arena (provisions equipment pool counters)"
    roles: [ArenaManager]
    code: 201
    input: [name, marker_pool_total, vest_pool_total, "timezone?"]
    output: Arena
    side_effects: ["status=OPEN, current_utc defaults to epoch until set, available counts = 0 (no units yet)"]

  - method: GET
    path: "/arenas/{arenaId}"
    description: "Get an arena with reconciled pool + deposit ledger fields"
    roles: [ArenaManager, FrontDesk, FieldMarshal, LeagueDirector]
    code: 200
    input: []
    output: Arena
    side_effects: []

  - method: GET
    path: "/arenas"
    description: "List arenas (paginated)"
    roles: [ArenaManager, FrontDesk, FieldMarshal, LeagueDirector]
    code: 200
    input: []
    output: "Arena[]"
    side_effects: []

  - method: POST
    path: "/_clock/set"
    description: "Test-driving clock: set Arena.current_utc to an explicit timestamp"
    roles: [ArenaManager]
    code: 200
    input: [arena_id, to_iso8601]
    output: Arena
    side_effects: ["Arena.current_utc set to to_iso8601"]

  - method: POST
    path: "/arenas/{arenaId}/close"
    description: "Close arena (blocks new bookings/rentals)"
    roles: [ArenaManager]
    code: 200
    input: []
    output: Arena
    side_effects: ["Arena.status -> CLOSED"]

  # --- Field ---
  - method: POST
    path: "/fields"
    description: "Create a playing field under an arena"
    roles: [ArenaManager]
    code: 201
    input: [arena_id, name, game_mode, capacity_max, "turnaround_minutes?"]
    output: Field
    side_effects: ["status=ACTIVE, reserved_headcount=0"]

  - method: GET
    path: "/fields/{fieldId}"
    description: "Get a field"
    roles: [ArenaManager, FrontDesk, FieldMarshal, LeagueDirector]
    code: 200
    input: []
    output: Field
    side_effects: []

  - method: GET
    path: "/fields"
    description: "List fields, optionally filtered by arena_id"
    roles: [ArenaManager, FrontDesk, FieldMarshal, LeagueDirector]
    code: 200
    input: ["arena_id?"]
    output: "Field[]"
    side_effects: []

  - method: POST
    path: "/fields/{fieldId}/close"
    description: "Close a field (rejects new slot holds)"
    roles: [ArenaManager]
    code: 200
    input: []
    output: Field
    side_effects: ["status -> CLOSED"]

  # --- PartyPackage ---
  - method: POST
    path: "/party-packages"
    description: "Create a party package"
    roles: [ArenaManager]
    code: 201
    input: [arena_id, name, included_players, extra_player_fee_cents, base_fee_cents, "included_ammo_balls?", "discount_pct?", "active?"]
    output: PartyPackage
    side_effects: []

  - method: GET
    path: "/party-packages/{packageId}"
    description: "Get a party package"
    roles: [ArenaManager, FrontDesk, LeagueDirector, FieldMarshal]
    code: 200
    input: []
    output: PartyPackage
    side_effects: []

  - method: GET
    path: "/party-packages"
    description: "List party packages, optionally filtered by arena_id"
    roles: [ArenaManager, FrontDesk, LeagueDirector, FieldMarshal]
    code: 200
    input: ["arena_id?"]
    output: "PartyPackage[]"
    side_effects: []

  # --- Booking ---
  - method: POST
    path: "/bookings"
    description: "Create a booking (HELD) on a field over a half-open window"
    roles: [FrontDesk]
    code: 201
    input: [arena_id, field_id, booking_type, party_size, window_start, window_end, "package_id?"]
    output: Booking
    side_effects: ["status=HELD; Field.reserved_headcount recomputed; referee_required/minors_present computed"]

  - method: GET
    path: "/bookings/{bookingId}"
    description: "Get a booking with computed fee/invoice/flag fields"
    roles: [ArenaManager, FrontDesk, FieldMarshal, LeagueDirector]
    code: 200
    input: []
    output: Booking
    side_effects: []

  - method: GET
    path: "/bookings"
    description: "List bookings, optionally filtered by arena_id, field_id, or package_id"
    roles: [ArenaManager, FrontDesk, FieldMarshal, LeagueDirector]
    code: 200
    input: ["arena_id?", "field_id?", "package_id?"]
    output: "Booking[]"
    side_effects: []

  - method: POST
    path: "/bookings/{bookingId}/confirm"
    description: "Confirm a HELD booking (OCC on the field version)"
    roles: [FrontDesk]
    code: 200
    input: [expected_field_version]
    output: Booking
    side_effects: ["status -> CONFIRMED; field_fee_cents computed; increments Field.version by 1; Field.reserved_headcount recomputed"]

  - method: POST
    path: "/bookings/{bookingId}/check-in"
    description: "Check in a confirmed booking; checks out held rentals"
    roles: [FieldMarshal]
    code: 200
    input: [checked_in_count]
    output: Booking
    side_effects: ["status -> CHECKED_IN; HELD rentals -> CHECKED_OUT; equipment -> CHECKED_OUT; Field.reserved_headcount recomputed"]

  - method: POST
    path: "/bookings/{bookingId}/complete"
    description: "Complete a checked-in booking; settles add-ons and invoice"
    roles: [FieldMarshal]
    code: 200
    input: []
    output: Booking
    side_effects: ["status -> COMPLETED; AddOnOrders SETTLED; invoice_total_cents computed; referee released; Field.reserved_headcount recomputed"]

  - method: POST
    path: "/bookings/{bookingId}/no-show"
    description: "Mark a confirmed booking as no-show after its window ends"
    roles: [FieldMarshal]
    code: 200
    input: []
    output: Booking
    side_effects: ["status -> NO_SHOW; rentals released; add-ons voided; referee released; Field.reserved_headcount recomputed"]

  - method: POST
    path: "/bookings/{bookingId}/cancel"
    description: "Cancel a HELD or CONFIRMED booking (cascade releases rentals/equipment/deposit/referee)"
    roles: [FrontDesk]
    code: 200
    input: []
    output: Booking
    side_effects: ["status -> CANCELLED; rentals RELEASED; equipment AVAILABLE; deposit_held decremented; add-ons VOID; referee released"]

  # --- WaiverProfile ---
  - method: POST
    path: "/waiver-profiles"
    description: "Create a waiver profile (DRAFT) for a participant on a booking"
    roles: [FrontDesk]
    code: 201
    input: [arena_id, booking_id, participant_name, date_of_birth, "guardian_name?"]
    output: WaiverProfile
    side_effects: ["status=DRAFT; age_years/is_minor computed against Arena.current_utc"]

  - method: GET
    path: "/waiver-profiles/{waiverId}"
    description: "Get a waiver profile"
    roles: [ArenaManager, FrontDesk, FieldMarshal]
    code: 200
    input: []
    output: WaiverProfile
    side_effects: []

  - method: GET
    path: "/waiver-profiles"
    description: "List waiver profiles, optionally filtered by arena_id or booking_id"
    roles: [ArenaManager, FrontDesk, FieldMarshal]
    code: 200
    input: ["arena_id?", "booking_id?"]
    output: "WaiverProfile[]"
    side_effects: []

  - method: POST
    path: "/waiver-profiles/{waiverId}/sign"
    description: "Sign a waiver (enforces guardian rule for minors)"
    roles: [FrontDesk]
    code: 200
    input: []
    output: WaiverProfile
    side_effects: ["status -> SIGNED; Booking.minors_present/referee_required recomputed"]

  - method: POST
    path: "/waiver-profiles/{waiverId}/void"
    description: "Void a waiver"
    roles: [FrontDesk]
    code: 200
    input: []
    output: WaiverProfile
    side_effects: ["status -> VOID; Booking.minors_present/referee_required recomputed"]

  # --- EquipmentUnit ---
  - method: POST
    path: "/equipment-units"
    description: "Provision a marker or vest into the arena pool"
    roles: [ArenaManager]
    code: 201
    input: [arena_id, unit_type, asset_tag, deposit_cents, "condition_grade?"]
    output: EquipmentUnit
    side_effects: ["status=AVAILABLE; Arena available count for unit_type incremented"]

  - method: GET
    path: "/equipment-units/{unitId}"
    description: "Get an equipment unit"
    roles: [ArenaManager, FrontDesk, FieldMarshal]
    code: 200
    input: []
    output: EquipmentUnit
    side_effects: []

  - method: GET
    path: "/equipment-units"
    description: "List equipment units, optionally filtered by arena_id"
    roles: [ArenaManager, FrontDesk, FieldMarshal]
    code: 200
    input: ["arena_id?"]
    output: "EquipmentUnit[]"
    side_effects: []

  - method: POST
    path: "/equipment-units/{unitId}/restore"
    description: "Restore a unit from MAINTENANCE back to AVAILABLE"
    roles: [ArenaManager]
    code: 200
    input: []
    output: EquipmentUnit
    side_effects: ["status -> AVAILABLE; Arena available count incremented"]

  # --- Rental ---
  - method: POST
    path: "/rentals"
    description: "Reserve an equipment unit for a booking (HELD rental; holds deposit)"
    roles: [FrontDesk]
    code: 201
    input: [arena_id, booking_id, equipment_unit_id]
    output: Rental
    side_effects: ["status=HELD; EquipmentUnit RESERVED; deposit_hold_cents snapshot; Arena.deposit_held_cents incremented; available count decremented"]

  - method: GET
    path: "/rentals/{rentalId}"
    description: "Get a rental"
    roles: [ArenaManager, FrontDesk, FieldMarshal]
    code: 200
    input: []
    output: Rental
    side_effects: []

  - method: GET
    path: "/rentals"
    description: "List rentals, optionally filtered by arena_id, booking_id, or equipment_unit_id"
    roles: [ArenaManager, FrontDesk, FieldMarshal]
    code: 200
    input: ["arena_id?", "booking_id?", "equipment_unit_id?"]
    output: "Rental[]"
    side_effects: []

  - method: POST
    path: "/rentals/{rentalId}/return"
    description: "Return a checked-out rental; settles deposit (refund/forfeit)"
    roles: [FieldMarshal]
    code: 200
    input: ["damage_fee_cents?"]
    output: Rental
    side_effects: ["status -> RETURNED; deposit settled; equipment AVAILABLE or MAINTENANCE; Arena deposit ledger updated"]

  - method: POST
    path: "/rentals/{rentalId}/release"
    description: "Release a HELD rental before checkout (returns equipment + deposit)"
    roles: [FrontDesk]
    code: 200
    input: []
    output: Rental
    side_effects: ["status -> RELEASED; EquipmentUnit AVAILABLE; Arena.deposit_held_cents decremented"]

  # --- AddOnOrder ---
  - method: POST
    path: "/add-on-orders"
    description: "Create an ammo/CO2/misc add-on order on a booking (QUOTED)"
    roles: [FrontDesk]
    code: 201
    input: [arena_id, booking_id, "ammo_balls?", "co2_tanks?", "misc_cents?"]
    output: AddOnOrder
    side_effects: ["status=QUOTED; quote_total_cents computed"]

  - method: GET
    path: "/add-on-orders/{orderId}"
    description: "Get an add-on order"
    roles: [ArenaManager, FrontDesk, FieldMarshal]
    code: 200
    input: []
    output: AddOnOrder
    side_effects: []

  - method: GET
    path: "/add-on-orders"
    description: "List add-on orders, optionally filtered by arena_id or booking_id"
    roles: [ArenaManager, FrontDesk, FieldMarshal]
    code: 200
    input: ["arena_id?", "booking_id?"]
    output: "AddOnOrder[]"
    side_effects: []

  # --- Referee ---
  - method: POST
    path: "/referees"
    description: "Create a referee/marshal"
    roles: [ArenaManager]
    code: 201
    input: [arena_id, name, "certified_paintball?"]
    output: Referee
    side_effects: ["status=AVAILABLE"]

  - method: GET
    path: "/referees/{refereeId}"
    description: "Get a referee"
    roles: [ArenaManager, FrontDesk, FieldMarshal]
    code: 200
    input: []
    output: Referee
    side_effects: []

  - method: GET
    path: "/referees"
    description: "List referees, optionally filtered by arena_id"
    roles: [ArenaManager, FrontDesk, FieldMarshal]
    code: 200
    input: ["arena_id?"]
    output: "Referee[]"
    side_effects: []

  # --- RefereeAssignment ---
  - method: POST
    path: "/referee-assignments"
    description: "Assign an available referee to a booking (eligibility enforced)"
    roles: [FieldMarshal]
    code: 201
    input: [arena_id, booking_id, referee_id]
    output: RefereeAssignment
    side_effects: ["status=ASSIGNED; Referee -> ON_DUTY"]

  - method: GET
    path: "/referee-assignments/{assignmentId}"
    description: "Get a referee assignment"
    roles: [ArenaManager, FrontDesk, FieldMarshal]
    code: 200
    input: []
    output: RefereeAssignment
    side_effects: []

  - method: GET
    path: "/referee-assignments"
    description: "List referee assignments, optionally filtered by arena_id, booking_id, or referee_id"
    roles: [ArenaManager, FrontDesk, FieldMarshal]
    code: 200
    input: ["arena_id?", "booking_id?", "referee_id?"]
    output: "RefereeAssignment[]"
    side_effects: []

  # --- League ---
  - method: POST
    path: "/leagues"
    description: "Create a league (DRAFT)"
    roles: [LeagueDirector]
    code: 201
    input: [arena_id, name, total_rounds, "win_points?", "draw_points?"]
    output: League
    side_effects: ["status=DRAFT; current_round=0"]

  - method: GET
    path: "/leagues/{leagueId}"
    description: "Get a league"
    roles: [ArenaManager, FrontDesk, LeagueDirector]
    code: 200
    input: []
    output: League
    side_effects: []

  - method: GET
    path: "/leagues"
    description: "List leagues, optionally filtered by arena_id"
    roles: [ArenaManager, FrontDesk, LeagueDirector]
    code: 200
    input: ["arena_id?"]
    output: "League[]"
    side_effects: []

  - method: GET
    path: "/leagues/{leagueId}/standings"
    description: "Computed read: current league standings (teams sorted by points DESC, label ASC)"
    roles: [ArenaManager, FrontDesk, LeagueDirector]
    code: 200
    input: []
    output: "{ standings: array, current_round: integer, league_version: integer }"
    side_effects: []

  - method: POST
    path: "/leagues/{leagueId}/open"
    description: "Open a league (DRAFT -> OPEN, current_round=1)"
    roles: [LeagueDirector]
    code: 200
    input: []
    output: League
    side_effects: ["status -> OPEN; current_round=1"]

  - method: POST
    path: "/leagues/{leagueId}/lock-round"
    description: "Lock the current round (OCC on league version; recomputes standings)"
    roles: [LeagueDirector]
    code: 200
    input: [expected_league_version]
    output: League
    side_effects: ["status -> ROUND_LOCKED; increments League.version by 1; standings recomputed"]

  - method: POST
    path: "/leagues/{leagueId}/advance-round"
    description: "Advance to the next round (OCC on league version)"
    roles: [LeagueDirector]
    code: 200
    input: [expected_league_version]
    output: League
    side_effects: ["status -> OPEN; current_round incremented; increments League.version by 1"]

  - method: POST
    path: "/leagues/{leagueId}/finalize"
    description: "Finalize the league after the last round is locked"
    roles: [LeagueDirector]
    code: 200
    input: []
    output: League
    side_effects: ["status -> FINALIZED; standings frozen"]

  # --- LeagueMatch ---
  - method: POST
    path: "/league-matches"
    description: "Schedule a match in the current open round, backed by a booking"
    roles: [LeagueDirector]
    code: 201
    input: [arena_id, league_id, booking_id, home_team, away_team]
    output: LeagueMatch
    side_effects: ["status=SCHEDULED; round_index=League.current_round"]

  - method: GET
    path: "/league-matches/{matchId}"
    description: "Get a league match"
    roles: [ArenaManager, FrontDesk, LeagueDirector]
    code: 200
    input: []
    output: LeagueMatch
    side_effects: []

  - method: GET
    path: "/league-matches"
    description: "List league matches, optionally filtered by arena_id, league_id, or booking_id"
    roles: [ArenaManager, FrontDesk, LeagueDirector]
    code: 200
    input: ["arena_id?", "league_id?", "booking_id?"]
    output: "LeagueMatch[]"
    side_effects: []

  - method: POST
    path: "/league-matches/{matchId}/record-result"
    description: "Record a match result (requires linked booking COMPLETED)"
    roles: [LeagueDirector]
    code: 200
    input: [home_score, away_score]
    output: LeagueMatch
    side_effects: ["status -> RESULT_RECORDED; outcome computed from scores"]

  - method: POST
    path: "/league-matches/{matchId}/void"
    description: "Void a scheduled match"
    roles: [LeagueDirector]
    code: 200
    input: []
    output: LeagueMatch
    side_effects: ["status -> VOID"]

# =============================================================================
# §1.6 Error Code Catalog
# =============================================================================
errors:
  # --- auth ---
  - { id: ERR_MISSING_OR_INVALID_USER_CONTEXT_HEADER, http: 401, condition: "X-User-ID or X-User-Role header missing or malformed" }
  - { id: ERR_FORBIDDEN_ROLE, http: 403, condition: "Authenticated role not permitted for this operation" }
  - { id: ERR_VALIDATION, http: 400, condition: "Missing required field, wrong type, or enum value out of domain" }

  # --- not found ---
  - { id: ERR_ARENA_NOT_FOUND, http: 404, condition: "Arena id does not exist" }
  - { id: ERR_FIELD_NOT_FOUND, http: 404, condition: "Field id does not exist" }
  - { id: ERR_PACKAGE_NOT_FOUND, http: 404, condition: "PartyPackage id does not exist" }
  - { id: ERR_BOOKING_NOT_FOUND, http: 404, condition: "Booking id does not exist" }
  - { id: ERR_EQUIPMENT_NOT_FOUND, http: 404, condition: "EquipmentUnit id does not exist" }
  - { id: ERR_RENTAL_NOT_FOUND, http: 404, condition: "Rental id does not exist" }
  - { id: ERR_WAIVER_NOT_FOUND, http: 404, condition: "WaiverProfile id does not exist" }
  - { id: ERR_REFEREE_NOT_FOUND, http: 404, condition: "Referee id does not exist" }
  - { id: ERR_ASSIGNMENT_NOT_FOUND, http: 404, condition: "RefereeAssignment id does not exist" }
  - { id: ERR_LEAGUE_NOT_FOUND, http: 404, condition: "League id does not exist" }
  - { id: ERR_MATCH_NOT_FOUND, http: 404, condition: "LeagueMatch id does not exist" }

  # --- state ---
  - { id: ERR_BOOKING_INVALID_STATE, http: 409, condition: "Booking not in a state allowing this transition" }
  - { id: ERR_RENTAL_INVALID_STATE, http: 409, condition: "Rental not in a state allowing this transition" }
  - { id: ERR_WAIVER_INVALID_STATE, http: 409, condition: "WaiverProfile not in a state allowing this transition" }
  - { id: ERR_EQUIPMENT_INVALID_STATE, http: 409, condition: "EquipmentUnit not in a state allowing this transition (e.g. restore on non-MAINTENANCE)" }
  - { id: ERR_LEAGUE_INVALID_STATE, http: 409, condition: "League not in a state allowing this transition" }
  - { id: ERR_MATCH_INVALID_STATE, http: 409, condition: "LeagueMatch not in a state allowing this transition" }
  - { id: ERR_ARENA_CLOSED, http: 409, condition: "Arena is CLOSED; new bookings/rentals blocked" }
  - { id: ERR_FIELD_CLOSED, http: 409, condition: "Field is CLOSED; new slot holds blocked" }
  - { id: ERR_ROUND_NOT_COMPLETE, http: 409, condition: "lock-round attempted while a match in current_round is still SCHEDULED" }
  - { id: ERR_ROUND_LIMIT_REACHED, http: 409, condition: "advance-round attempted when current_round == total_rounds" }
  - { id: ERR_LEAGUE_NOT_AT_FINAL_ROUND, http: 409, condition: "finalize attempted before current_round == total_rounds" }

  # --- OCC ---
  - { id: ERR_STALE_FIELD_VERSION, http: 412, condition: "expected_field_version does not match the live Field.version" }
  - { id: ERR_STALE_LEAGUE_VERSION, http: 412, condition: "expected_league_version does not match the live League.version" }

  # --- business_safety ---
  - { id: ERR_MINOR_WAIVER_REQUIRED, http: 422, condition: "A minor participant lacks a SIGNED waiver with guardian_name at check-in, or sign attempted for a minor without guardian_name" }
  - { id: ERR_REFEREE_REQUIRED, http: 422, condition: "Booking requires a referee but no ASSIGNED RefereeAssignment exists at check-in" }

  # --- business_referential ---
  - { id: ERR_REFEREE_NOT_ELIGIBLE, http: 409, condition: "Referee not AVAILABLE, or not certified_paintball for a PAINTBALL booking" }

  # --- business_temporal ---
  - { id: ERR_FIELD_SLOT_CONFLICT, http: 409, condition: "Booking window plus turnaround buffer overlaps an existing live booking on the same field" }
  - { id: ERR_EQUIPMENT_TIME_CONFLICT, http: 409, condition: "EquipmentUnit already reserved/checked-out for a booking whose window overlaps this booking's window" }
  - { id: ERR_LEAD_TIME_VIOLATION, http: 422, condition: "RESERVATION starts sooner than MIN_LEAD_MINUTES, or WALK_IN start != Arena.current_utc" }

  # --- business_constraint ---
  - { id: ERR_INVALID_WINDOW, http: 422, condition: "window_end not strictly after window_start" }
  - { id: ERR_CAPACITY_EXCEEDED, http: 409, condition: "party_size exceeds Field.capacity_max, or checked_in_count exceeds party_size / below 1" }
  - { id: ERR_EQUIPMENT_UNAVAILABLE, http: 409, condition: "EquipmentUnit not AVAILABLE or condition_grade C" }
  - { id: ERR_PACKAGE_INACTIVE, http: 409, condition: "PartyPackage inactive or belongs to a different arena" }

  # --- business_fiscal ---
  - { id: ERR_DAMAGE_FEE_EXCEEDS_DEPOSIT, http: 422, condition: "Return damage_fee_cents exceeds the deposit_hold_cents" }

# =============================================================================
# §1.7 RBAC Matrix (peer_roles)
# =============================================================================
roles:
  - name: ArenaManager
    description: "Owns arena configuration: arenas, fields, packages, equipment pool, equipment restore, clock"
    identity: "opaque"
    exclusive_operations:
      - "POST /arenas — create arena"
      - "POST /arenas/{id}/close — close arena"
      - "POST /_clock/set — set arena clock"
      - "POST /fields — create field"
      - "POST /fields/{id}/close — close field"
      - "POST /party-packages — create package"
      - "POST /equipment-units — provision equipment"
      - "POST /equipment-units/{id}/restore — restore equipment from maintenance"
    shared_operations:
      - "GET endpoints across arenas, fields, packages, bookings, equipment, rentals, waivers, referees, assignments, leagues, matches"

  - name: FrontDesk
    description: "Owns the booking/rental/waiver/add-on counter surface (reservation + walk-in intake)"
    identity: "opaque"
    exclusive_operations:
      - "POST /bookings — create booking"
      - "POST /bookings/{id}/confirm — confirm booking"
      - "POST /bookings/{id}/cancel — cancel booking"
      - "POST /waiver-profiles — create waiver"
      - "POST /waiver-profiles/{id}/sign — sign waiver"
      - "POST /waiver-profiles/{id}/void — void waiver"
      - "POST /rentals — reserve equipment"
      - "POST /rentals/{id}/release — release held rental"
      - "POST /add-on-orders — create add-on order"
    shared_operations:
      - "GET endpoints across all resources"

  - name: FieldMarshal
    description: "Owns on-field operations: check-in, complete, no-show, equipment return, referee assignment"
    identity: "opaque"
    exclusive_operations:
      - "POST /bookings/{id}/check-in — check in booking"
      - "POST /bookings/{id}/complete — complete booking"
      - "POST /bookings/{id}/no-show — mark no-show"
      - "POST /rentals/{id}/return — return equipment"
      - "POST /referee-assignments — assign referee"
    shared_operations:
      - "GET endpoints across all resources"

  - name: LeagueDirector
    description: "Owns league/event lifecycle and match scheduling/scoring"
    identity: "opaque"
    exclusive_operations:
      - "POST /leagues — create league"
      - "POST /leagues/{id}/open — open league"
      - "POST /leagues/{id}/lock-round — lock round"
      - "POST /leagues/{id}/advance-round — advance round"
      - "POST /leagues/{id}/finalize — finalize league"
      - "POST /league-matches — schedule match"
      - "POST /league-matches/{id}/record-result — record result"
      - "POST /league-matches/{id}/void — void match"
    shared_operations:
      - "GET endpoints across all resources"
