              as: ForestryAdmin
              captures: { s1: $.data.id }
            - call: "POST /forestry/trees"
              payload: { zone_id: "${z1}", species_id: "${s1}", dbh_inches: 20.0, canopy_radius_m: 6.0, latitude: 40.0, longitude: -83.0, condition_class: "GOOD" }
              as: ForestryStaff
              captures: { t20: $.data.id, t20_v: $.data.version }
            - call: "POST /forestry/trees/${t20}/inspections"
              payload: { expected_tree_version: "${t20_v}", inspection_type: "RISK", likelihood_score: 3, consequence_score: 3, target_rating: 4 }
              as: Inspector
              captures: { insp: $.data.id }
            - call: "POST /forestry/inspections/${insp}/finalize"
              payload: {}
              as: Inspector
          trigger:
            - call: "POST /forestry/inspections/${insp}/dispute"
              payload: {}
              as: ForestryAdmin
          assert:
            - "Tree.${t20}.risk_rating == NONE"
            - "Tree.${t20}.health_status == HEALTHY"
            - "Zone.${z1}.high_risk_tree_count == 0"
