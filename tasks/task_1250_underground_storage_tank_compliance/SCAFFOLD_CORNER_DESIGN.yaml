              as: Technician
              as_user_id: "${t_tr}"
              captures: { err: $.data.error_id }
          assert:
            - "${err} == ERR_CLASS_MISMATCH"

      - name: instructor_not_trainer_rejected
        claim_type: violation_to_error
        grounds:
          - validations[priority=8]
          - errors[ERR_INSTRUCTOR_NOT_TRAINER]
        distinguishing_aspect: "A technician with trainer == false cannot issue training records even for a matching class."
        test_recipe:
          setup: ["Facility with a class-C operator; non-trainer technician"]
          setup_api_calls:
            - { call: "POST /_clock/set_current_utc", payload: { to_iso8601: "2026-05-01T00:00:00Z" }, as: ContractorAdmin }
            - { call: "POST /facilities", payload: { facility_name: "Trainer Gate", state_code: "CA", annual_fee_paid_through: "2027-01-01T00:00:00Z" }, as: FacilityOwner, as_user_id: "owner-1", captures: { fac: $.data.id } }
            - { call: "POST /technicians", payload: { full_name: "Not Trainer", endorsements: ["CP_TESTER"], trainer: false }, as: ContractorAdmin, captures: { t_nt: $.data.id } }
            - { call: "POST /operators", payload: { facility_id: "${fac}", full_name: "Op C", operator_class: "C" }, as: FacilityOwner, as_user_id: "owner-1", captures: { op: $.data.id } }
          trigger:
            - call: "POST /training-records"
              payload: { operator_id: "${op}", course_class: "C", completed_at: "2026-04-01T00:00:00Z" }
              as: Technician
              as_user_id: "${t_nt}"
              captures: { err: $.data.error_id }
          assert:
            - "${err} == ERR_INSTRUCTOR_NOT_TRAINER"

      - name: self_certification_rejected
        claim_type: violation_to_error
        grounds:
          - validations[priority=6]
          - errors[ERR_SELF_CERTIFICATION]
        distinguishing_aspect: "On a valid UNDER_REVIEW order, the performing technician calling certify (in the ComplianceReviewer role) is rejected purely on segregation of duties."
        test_recipe:
          setup: ["Facility ACTIVE, tank IN_SERVICE; TANK_TIGHTNESS order started by t_tt and results recorded (order UNDER_REVIEW)"]
          setup_api_calls:
            - { call: "POST /_clock/set_current_utc", payload: { to_iso8601: "2026-05-01T00:00:00Z" }, as: ContractorAdmin }
            - { call: "POST /facilities", payload: { facility_name: "SoD Site", state_code: "CA", annual_fee_paid_through: "2027-01-01T00:00:00Z" }, as: FacilityOwner, as_user_id: "owner-1", captures: { fac: $.data.id } }
            - { call: "POST /tank-systems", payload: { facility_id: "${fac}", tank_tag: "T1", substance: "DIESEL", capacity_gallons: 10000, installed_on: "2018-01-01T00:00:00Z", tank_construction: "STEEL", piping_type: "PRESSURIZED", release_detection_mode: "ATG_INVENTORY" }, as: FacilityOwner, as_user_id: "owner-1", captures: { tank: $.data.id } }
            - { call: "POST /facilities/${fac}/activate", payload: {}, as: FacilityOwner, as_user_id: "owner-1" }
            - { call: "POST /tank-systems/${tank}/place-in-service", payload: {}, as: FacilityOwner, as_user_id: "owner-1" }
            - { call: "POST /technicians", payload: { full_name: "TT", endorsements: ["TIGHTNESS_TESTER"], trainer: false }, as: ContractorAdmin, captures: { t_tt: $.data.id } }
            - { call: "POST /service-orders", payload: { facility_id: "${fac}", tank_system_id: "${tank}", service_type: "TANK_TIGHTNESS", line_items: [{ description: "t", qty: 1, unit_price_cents: 60000 }] }, as: ContractorAdmin, captures: { so: $.data.id } }
            - { call: "POST /service-orders/${so}/schedule", payload: { technician_id: "${t_tt}", window_start: "2026-05-02T10:00:00Z", window_end: "2026-05-02T11:00:00Z" }, as: ContractorAdmin }
            - { call: "POST /_clock/set_current_utc", payload: { to_iso8601: "2026-05-02T10:30:00Z" }, as: ContractorAdmin }
            - { call: "POST /service-orders/${so}/start", payload: {}, as: Technician, as_user_id: "${t_tt}" }
            - { call: "POST /service-orders/${so}/results", payload: { readings: { leak_rate_gph: 0.05 } }, as: Technician, as_user_id: "${t_tt}" }
          trigger:
            - { call: "POST /service-orders/${so}/certify", payload: {}, as: ComplianceReviewer, as_user_id: "${t_tt}", captures: { err: $.data.error_id } }
            - { call: "GET /service-orders/${so}", as: Any, captures: { so_status: $.data.status } }
          assert:
            - "${err} == ERR_SELF_CERTIFICATION with http 403"
            - "${so_status} == UNDER_REVIEW (no state change on the rejected certify)"

  # ===========================================================================
  # Section: endpoints
  # ===========================================================================
  - section: endpoints
    instances:
      - name: endorsement_missing_on_schedule_rejected
        claim_type: conditional_action
        grounds:
          - validations[priority=7]
          - errors[ERR_ENDORSEMENT_MISSING]
        distinguishing_aspect: "Schedule is a conditional action on the technician's endorsement set: a TIGHTNESS_TESTER cannot be scheduled for a CP_SURVEY order."
        test_recipe:
          setup: ["Facility ACTIVE, tank IN_SERVICE with CP component; CP_SURVEY order; technician with only TIGHTNESS_TESTER"]
          setup_api_calls:
            - { call: "POST /facilities", payload: { facility_name: "Endorse Site", state_code: "CA", annual_fee_paid_through: "2027-01-01T00:00:00Z" }, as: FacilityOwner, as_user_id: "owner-1", captures: { fac: $.data.id } }
            - { call: "POST /tank-systems", payload: { facility_id: "${fac}", tank_tag: "T1", substance: "DIESEL", capacity_gallons: 10000, installed_on: "2018-01-01T00:00:00Z", tank_construction: "STEEL", piping_type: "PRESSURIZED", release_detection_mode: "ATG_INVENTORY" }, as: FacilityOwner, as_user_id: "owner-1", captures: { tank: $.data.id } }
            - { call: "POST /facilities/${fac}/activate", payload: {}, as: FacilityOwner, as_user_id: "owner-1" }
            - { call: "POST /tank-systems/${tank}/place-in-service", payload: {}, as: FacilityOwner, as_user_id: "owner-1" }
            - { call: "POST /components", payload: { tank_system_id: "${tank}", component_type: "CATHODIC_PROTECTION", install_date: "2018-01-01T00:00:00Z", serial_no: "CP-E" }, as: FacilityOwner, as_user_id: "owner-1", captures: { comp: $.data.id } }
            - { call: "POST /technicians", payload: { full_name: "TT only", endorsements: ["TIGHTNESS_TESTER"], trainer: false }, as: ContractorAdmin, captures: { t_tt: $.data.id } }
            - { call: "POST /service-orders", payload: { facility_id: "${fac}", tank_system_id: "${tank}", service_type: "CP_SURVEY", component_id: "${comp}", line_items: [{ description: "cp", qty: 1, unit_price_cents: 40000 }] }, as: ContractorAdmin, captures: { so: $.data.id } }
          trigger:
            - call: "POST /service-orders/${so}/schedule"
              payload: { technician_id: "${t_tt}", window_start: "2026-05-02T10:00:00Z", window_end: "2026-05-02T11:00:00Z" }
              as: ContractorAdmin
              captures: { err: $.data.error_id }
          assert:
            - "${err} == ERR_ENDORSEMENT_MISSING (CP_SURVEY requires CP_TESTER)"

      - name: submission_bundle_requires_certified_orders
        claim_type: conditional_action
        grounds:
          - validations[priority=17]
          - errors[ERR_BUNDLE_ITEM_MISMATCH]
        distinguishing_aspect: "TEST_REPORT submissions accept only CERTIFIED orders; bundling an UNDER_REVIEW order fails with ERR_BUNDLE_ITEM_MISMATCH at creation."
        test_recipe:
          setup: ["Facility ACTIVE, tank IN_SERVICE; TANK_TIGHTNESS order UNDER_REVIEW with a PASS result (not yet certified); reviewer technician"]
          setup_api_calls:
            - { call: "POST /_clock/set_current_utc", payload: { to_iso8601: "2026-05-01T00:00:00Z" }, as: ContractorAdmin }
            - { call: "POST /facilities", payload: { facility_name: "Bundle Site", state_code: "CA", annual_fee_paid_through: "2027-01-01T00:00:00Z" }, as: FacilityOwner, as_user_id: "owner-1", captures: { fac: $.data.id } }
            - { call: "POST /tank-systems", payload: { facility_id: "${fac}", tank_tag: "T1", substance: "DIESEL", capacity_gallons: 10000, installed_on: "2018-01-01T00:00:00Z", tank_construction: "STEEL", piping_type: "PRESSURIZED", release_detection_mode: "ATG_INVENTORY" }, as: FacilityOwner, as_user_id: "owner-1", captures: { tank: $.data.id } }
            - { call: "POST /facilities/${fac}/activate", payload: {}, as: FacilityOwner, as_user_id: "owner-1" }
            - { call: "POST /tank-systems/${tank}/place-in-service", payload: {}, as: FacilityOwner, as_user_id: "owner-1" }
            - { call: "POST /technicians", payload: { full_name: "TT", endorsements: ["TIGHTNESS_TESTER"], trainer: false }, as: ContractorAdmin, captures: { t_tt: $.data.id } }
            - { call: "POST /technicians", payload: { full_name: "Rev", endorsements: [], trainer: false }, as: ContractorAdmin, captures: { t_rev: $.data.id } }
            - { call: "POST /service-orders", payload: { facility_id: "${fac}", tank_system_id: "${tank}", service_type: "TANK_TIGHTNESS", line_items: [{ description: "t", qty: 1, unit_price_cents: 60000 }] }, as: ContractorAdmin, captures: { so: $.data.id } }
            - { call: "POST /service-orders/${so}/schedule", payload: { technician_id: "${t_tt}", window_start: "2026-05-02T10:00:00Z", window_end: "2026-05-02T11:00:00Z" }, as: ContractorAdmin }
            - { call: "POST /_clock/set_current_utc", payload: { to_iso8601: "2026-05-02T10:30:00Z" }, as: ContractorAdmin }
            - { call: "POST /service-orders/${so}/start", payload: {}, as: Technician, as_user_id: "${t_tt}" }
            - { call: "POST /service-orders/${so}/results", payload: { readings: { leak_rate_gph: 0.05 } }, as: Technician, as_user_id: "${t_tt}" }
          trigger:
            - call: "POST /submissions"
              payload: { facility_id: "${fac}", submission_type: "TEST_REPORT", service_order_ids: ["${so}"] }
              as: ComplianceReviewer
              as_user_id: "${t_rev}"
              captures: { err: $.data.error_id }
          assert:
            - "${err} == ERR_BUNDLE_ITEM_MISMATCH (order ${so} is UNDER_REVIEW, not CERTIFIED)"

      - name: monthly_submission_late_flag
        claim_type: computed_read
        grounds:
          - entities.RegulatorySubmission.fields.is_late
          - calculations.monthly_close_sweep
        distinguishing_aspect: "is_late uses the inclusive due timestamp: submitting on the 10th at 23:59:59Z is on time; submitting on the 11th at 00:00:00Z is late."
        test_recipe:
          setup: ["Facility ACTIVE, tank IN_SERVICE; records for 2026-04 and 2026-05 exist; reviewer technician"]
          setup_api_calls:
            - { call: "POST /_clock/set_current_utc", payload: { to_iso8601: "2026-05-05T00:00:00Z" }, as: ContractorAdmin }
            - { call: "POST /facilities", payload: { facility_name: "Late Site", state_code: "CA", annual_fee_paid_through: "2027-01-01T00:00:00Z" }, as: FacilityOwner, as_user_id: "owner-1", captures: { fac: $.data.id } }
            - { call: "POST /tank-systems", payload: { facility_id: "${fac}", tank_tag: "T1", substance: "DIESEL", capacity_gallons: 10000, installed_on: "2018-01-01T00:00:00Z", tank_construction: "STEEL", piping_type: "PRESSURIZED", release_detection_mode: "ATG_INVENTORY" }, as: FacilityOwner, as_user_id: "owner-1", captures: { tank: $.data.id } }
            - { call: "POST /facilities/${fac}/activate", payload: {}, as: FacilityOwner, as_user_id: "owner-1" }
            - { call: "POST /tank-systems/${tank}/place-in-service", payload: {}, as: FacilityOwner, as_user_id: "owner-1" }
            - { call: "POST /release-detection-records", payload: { tank_system_id: "${tank}", period_month: "2026-04", readings_summary: { log: "april" } }, as: FacilityOwner, as_user_id: "owner-1", captures: { rec1: $.data.id } }
            - { call: "POST /technicians", payload: { full_name: "Rev", endorsements: [], trainer: false }, as: ContractorAdmin, captures: { t_rev: $.data.id } }
            - { call: "POST /release-detection-records", payload: { tank_system_id: "${tank}", period_month: "2026-05", readings_summary: { log: "may" } }, as: FacilityOwner, as_user_id: "owner-1", captures: { rec2: $.data.id } }
          trigger:
            - { call: "POST /_clock/set_current_utc", payload: { to_iso8601: "2026-05-10T23:59:59Z" }, as: ContractorAdmin }
            - { call: "POST /submissions", payload: { facility_id: "${fac}", submission_type: "MONTHLY_RELEASE_DETECTION", period_month: "2026-04", release_detection_record_ids: ["${rec1}"] }, as: ComplianceReviewer, as_user_id: "${t_rev}", captures: { sub1: $.data.id } }
            - { call: "POST /submissions/${sub1}/submit", payload: {}, as: ComplianceReviewer, as_user_id: "${t_rev}", captures: { s1_late: $.data.is_late, s1_at: $.data.submitted_at } }
            - { call: "POST /submissions", payload: { facility_id: "${fac}", submission_type: "MONTHLY_RELEASE_DETECTION", period_month: "2026-05", release_detection_record_ids: ["${rec2}"] }, as: ComplianceReviewer, as_user_id: "${t_rev}", captures: { sub2: $.data.id } }
            - { call: "POST /_clock/set_current_utc", payload: { to_iso8601: "2026-06-11T00:00:00Z" }, as: ContractorAdmin }
            - { call: "POST /submissions/${sub2}/submit", payload: {}, as: ComplianceReviewer, as_user_id: "${t_rev}", captures: { s2_late: $.data.is_late, s2_at: $.data.submitted_at } }
            - { call: "GET /release-detection-records/${rec1}", as: Any, captures: { rec1_status: $.data.status } }
          assert:
            - "${s1_at} == 2026-05-10T23:59:59Z and ${s1_late} == false (on or before due 2026-05-10T23:59:59.999Z)"
            - "${s2_at} == 2026-06-11T00:00:00Z and ${s2_late} == true (strictly after due 2026-06-10T23:59:59.999Z)"
            - "${rec1_status} == SUBMITTED (bundle side effect)"

      - name: record_submission_lifecycle_compensation
        claim_type: action_endpoint
        grounds:
          - state_machines.RegulatorySubmission
          - state_machines.ReleaseDetectionRecord
        distinguishing_aspect: "Full submission cycle DRAFT -> SUBMITTED -> REJECTED -> DRAFT -> SUBMITTED -> ACCEPTED propagates to bundled records, with the reject hop compensating record state back to RECORDED."
        test_recipe:
          setup: ["Facility ACTIVE, tank IN_SERVICE; one release-detection record; reviewer technician"]
          setup_api_calls:
            - { call: "POST /_clock/set_current_utc", payload: { to_iso8601: "2026-05-05T00:00:00Z" }, as: ContractorAdmin }
            - { call: "POST /facilities", payload: { facility_name: "Cycle Site", state_code: "CA", annual_fee_paid_through: "2027-01-01T00:00:00Z" }, as: FacilityOwner, as_user_id: "owner-1", captures: { fac: $.data.id } }
            - { call: "POST /tank-systems", payload: { facility_id: "${fac}", tank_tag: "T1", substance: "DIESEL", capacity_gallons: 10000, installed_on: "2018-01-01T00:00:00Z", tank_construction: "STEEL", piping_type: "PRESSURIZED", release_detection_mode: "ATG_INVENTORY" }, as: FacilityOwner, as_user_id: "owner-1", captures: { tank: $.data.id } }
            - { call: "POST /facilities/${fac}/activate", payload: {}, as: FacilityOwner, as_user_id: "owner-1" }
            - { call: "POST /tank-systems/${tank}/place-in-service", payload: {}, as: FacilityOwner, as_user_id: "owner-1" }
            - { call: "POST /release-detection-records", payload: { tank_system_id: "${tank}", period_month: "2026-04", readings_summary: { log: "april" } }, as: FacilityOwner, as_user_id: "owner-1", captures: { rec: $.data.id } }
            - { call: "POST /technicians", payload: { full_name: "Rev", endorsements: [], trainer: false }, as: ContractorAdmin, captures: { t_rev: $.data.id } }
            - { call: "POST /submissions", payload: { facility_id: "${fac}", submission_type: "MONTHLY_RELEASE_DETECTION", period_month: "2026-04", release_detection_record_ids: ["${rec}"] }, as: ComplianceReviewer, as_user_id: "${t_rev}", captures: { sub: $.data.id } }
          trigger:
            - { call: "POST /submissions/${sub}/submit", payload: {}, as: ComplianceReviewer, as_user_id: "${t_rev}" }
            - { call: "GET /release-detection-records/${rec}", as: Any, captures: { rec_s1: $.data.status } }
            - { call: "POST /submissions/${sub}/reject", payload: { note: "missing signature page" }, as: StateRegulator, captures: { sub_s1: $.data.status, sub_note: $.data.state_reviewer_note } }
            - { call: "GET /release-detection-records/${rec}", as: Any, captures: { rec_s2: $.data.status } }
            - { call: "GET /submissions/${sub}", as: Any, captures: { sub_v: $.data.version } }
            - { call: "POST /submissions/${sub}/amend", payload: { expected_submission_version: "${sub_v}" }, as: ComplianceReviewer, as_user_id: "${t_rev}", captures: { sub_s2: $.data.status } }
            - { call: "POST /submissions/${sub}/submit", payload: {}, as: ComplianceReviewer, as_user_id: "${t_rev}" }
            - { call: "POST /submissions/${sub}/accept", payload: {}, as: StateRegulator, captures: { sub_s3: $.data.status } }
            - { call: "GET /release-detection-records/${rec}", as: Any, captures: { rec_s3: $.data.status } }
            - { call: "GET /submissions?facility_id=${fac}", as: Any }
          assert:
            - "${rec_s1} == SUBMITTED (bundle submit propagates)"
            - "${sub_s1} == REJECTED and ${sub_note} == missing signature page"
            - "${rec_s2} == RECORDED (reject compensates the record state)"
            - "${sub_s2} == DRAFT (amend cycle re-opens with fresh version)"
            - "${sub_s3} == ACCEPTED and ${rec_s3} == ACCEPTED"
            - "GET /submissions?facility_id=${fac} returns total_count 1"

      - name: run_monthly_close_creates_gap_deficiency
        claim_type: action_endpoint
        grounds:
          - calculations.monthly_close_sweep
          - entities.Deficiency.fields.origin
        distinguishing_aspect: "The ops-run checkpoint materializes a MINOR CLOSE_SWEEP deficiency per in-service tank missing its period record, with deadline created_at + 90 days, and recomputes posture."
        test_recipe:
          setup: ["Facility ACTIVE, tank IN_SERVICE; NO release-detection record for 2026-05; clock 2026-06-11"]
          setup_api_calls:
            - { call: "POST /_clock/set_current_utc", payload: { to_iso8601: "2026-05-01T00:00:00Z" }, as: ContractorAdmin }
            - { call: "POST /facilities", payload: { facility_name: "Gap Site", state_code: "CA", annual_fee_paid_through: "2027-01-01T00:00:00Z" }, as: FacilityOwner, as_user_id: "owner-1", captures: { fac: $.data.id } }
            - { call: "POST /tank-systems", payload: { facility_id: "${fac}", tank_tag: "T1", substance: "DIESEL", capacity_gallons: 10000, installed_on: "2018-01-01T00:00:00Z", tank_construction: "STEEL", piping_type: "PRESSURIZED", release_detection_mode: "ATG_INVENTORY" }, as: FacilityOwner, as_user_id: "owner-1", captures: { tank: $.data.id } }
            - { call: "POST /facilities/${fac}/activate", payload: {}, as: FacilityOwner, as_user_id: "owner-1" }
            - { call: "POST /tank-systems/${tank}/place-in-service", payload: {}, as: FacilityOwner, as_user_id: "owner-1" }
            - { call: "POST /_clock/set_current_utc", payload: { to_iso8601: "2026-06-11T00:00:00Z" }, as: ContractorAdmin }
          trigger:
            - { call: "POST /facilities/${fac}/run-monthly-close", payload: { period_month: "2026-05" }, as: ContractorAdmin, captures: { mc_created: $.data.deficiencies_created, mc_lapsed: $.data.operators_lapsed, mc_escalated: $.data.deficiencies_escalated, mc_score: $.data.posture_score, mc_posture: $.data.compliance_posture } }
            - { call: "GET /deficiencies?facility_id=${fac}&status=OPEN", as: Any, captures: { d_id: "$.data[0].id", d_sev: "$.data[0].severity", d_origin: "$.data[0].origin", d_period: "$.data[0].period_month", d_deadline: "$.data[0].correction_deadline", d_tank: "$.data[0].tank_system_id" } }
          assert:
            - "${mc_created} == 1 and ${mc_lapsed} == 0 and ${mc_escalated} == 0"
            - "${d_sev} == MINOR and ${d_origin} == CLOSE_SWEEP and ${d_period} == 2026-05 and ${d_tank} == ${tank}"
            - "${d_deadline} == 2026-09-09T00:00:00Z (created 2026-06-11T00:00:00Z + MINOR 90 days)"
            - "${mc_score} == 95 and ${mc_posture} == COMPLIANT (100 - 5 MINOR)"

      - name: run_monthly_close_idempotent_rerun
        claim_type: idempotency
        grounds:
          - calculations.monthly_close_sweep
          - entities.Deficiency.fields.period_month
        distinguishing_aspect: "Re-running the close for the same facility+period creates no second deficiency — the (tank_system_id, origin, period_month) dedupe key makes the sweep idempotent."
        test_recipe:
          setup: ["Facility ACTIVE, tank IN_SERVICE, no record for 2026-05; first close already executed"]
          setup_api_calls:
            - { call: "POST /_clock/set_current_utc", payload: { to_iso8601: "2026-06-11T00:00:00Z" }, as: ContractorAdmin }
            - { call: "POST /facilities", payload: { facility_name: "Idem Site", state_code: "CA", annual_fee_paid_through: "2027-01-01T00:00:00Z" }, as: FacilityOwner, as_user_id: "owner-1", captures: { fac: $.data.id } }
            - { call: "POST /tank-systems", payload: { facility_id: "${fac}", tank_tag: "T1", substance: "DIESEL", capacity_gallons: 10000, installed_on: "2018-01-01T00:00:00Z", tank_construction: "STEEL", piping_type: "PRESSURIZED", release_detection_mode: "ATG_INVENTORY" }, as: FacilityOwner, as_user_id: "owner-1", captures: { tank: $.data.id } }
            - { call: "POST /facilities/${fac}/activate", payload: {}, as: FacilityOwner, as_user_id: "owner-1" }
            - { call: "POST /tank-systems/${tank}/place-in-service", payload: {}, as: FacilityOwner, as_user_id: "owner-1" }
            - { call: "POST /facilities/${fac}/run-monthly-close", payload: { period_month: "2026-05" }, as: ContractorAdmin }
          trigger:
            - { call: "POST /facilities/${fac}/run-monthly-close", payload: { period_month: "2026-05" }, as: ContractorAdmin, captures: { mc2_created: $.data.deficiencies_created, mc2_score: $.data.posture_score } }
            - { call: "GET /deficiencies?facility_id=${fac}", as: Any }
          assert:
            - "${mc2_created} == 0 (second sweep for the same period is a no-op)"
            - "${mc2_score} == 95 (posture unchanged on idempotent re-run)"
            - "GET /deficiencies?facility_id=${fac} returns total_count 1"

      - name: run_monthly_close_too_early_rejected
        claim_type: violation_to_error
        grounds:
          - validations[priority=15]
          - errors[ERR_CLOSE_TOO_EARLY]
        distinguishing_aspect: "The close for period 2026-05 requires the clock to reach 2026-06-11T00:00:00Z; running it on 2026-06-10 fails with ERR_CLOSE_TOO_EARLY."
        test_recipe:
          setup: ["Facility ACTIVE with a tank; clock 2026-06-10 (day 10 of the following month — records are still on time)"]
          setup_api_calls:
            - { call: "POST /_clock/set_current_utc", payload: { to_iso8601: "2026-05-01T00:00:00Z" }, as: ContractorAdmin }
            - { call: "POST /facilities", payload: { facility_name: "Early Site", state_code: "CA", annual_fee_paid_through: "2027-01-01T00:00:00Z" }, as: FacilityOwner, as_user_id: "owner-1", captures: { fac: $.data.id } }
            - { call: "POST /tank-systems", payload: { facility_id: "${fac}", tank_tag: "T1", substance: "DIESEL", capacity_gallons: 10000, installed_on: "2018-01-01T00:00:00Z", tank_construction: "STEEL", piping_type: "PRESSURIZED", release_detection_mode: "ATG_INVENTORY" }, as: FacilityOwner, as_user_id: "owner-1", captures: { tank: $.data.id } }
            - { call: "POST /facilities/${fac}/activate", payload: {}, as: FacilityOwner, as_user_id: "owner-1" }
            - { call: "POST /tank-systems/${tank}/place-in-service", payload: {}, as: FacilityOwner, as_user_id: "owner-1" }
            - { call: "POST /_clock/set_current_utc", payload: { to_iso8601: "2026-06-10T00:00:00Z" }, as: ContractorAdmin }
          trigger:
            - call: "POST /facilities/${fac}/run-monthly-close"
              payload: { period_month: "2026-05" }
              as: ContractorAdmin
              captures: { err: $.data.error_id }
          assert:
            - "${err} == ERR_CLOSE_TOO_EARLY (clock 2026-06-10 < required 2026-06-11T00:00:00Z)"

      - name: run_monthly_close_escalates_overdue
        claim_type: action_endpoint
        grounds:
          - calculations.monthly_close_sweep
          - calculations.deficiency_deadline
          - state_machines.Deficiency.OPEN_to_ESCALATED
        distinguishing_aspect: "A close past a deficiency's correction_deadline moves it to ESCALATED (extra -5 posture) while a newly created gap deficiency for the swept period starts fresh — both effects land in one run with pinned counts."
        test_recipe:
          setup:
            - "Facility ACTIVE, tank IN_SERVICE, no records at all"
            - "Close for 2026-05 ran at 2026-06-11 creating MINOR deficiency D1 (deadline 2026-09-09T00:00:00Z); posture 95"
            - "Clock advanced to 2026-09-20 (past D1's deadline)"
          setup_api_calls:
            - { call: "POST /_clock/set_current_utc", payload: { to_iso8601: "2026-05-01T00:00:00Z" }, as: ContractorAdmin }
            - { call: "POST /facilities", payload: { facility_name: "Escalation Site", state_code: "CA", annual_fee_paid_through: "2027-01-01T00:00:00Z" }, as: FacilityOwner, as_user_id: "owner-1", captures: { fac: $.data.id } }
            - { call: "POST /tank-systems", payload: { facility_id: "${fac}", tank_tag: "T1", substance: "DIESEL", capacity_gallons: 10000, installed_on: "2018-01-01T00:00:00Z", tank_construction: "STEEL", piping_type: "PRESSURIZED", release_detection_mode: "ATG_INVENTORY" }, as: FacilityOwner, as_user_id: "owner-1", captures: { tank: $.data.id } }
            - { call: "POST /facilities/${fac}/activate", payload: {}, as: FacilityOwner, as_user_id: "owner-1" }
            - { call: "POST /tank-systems/${tank}/place-in-service", payload: {}, as: FacilityOwner, as_user_id: "owner-1" }
            - { call: "POST /_clock/set_current_utc", payload: { to_iso8601: "2026-06-11T00:00:00Z" }, as: ContractorAdmin }
            - { call: "POST /facilities/${fac}/run-monthly-close", payload: { period_month: "2026-05" }, as: ContractorAdmin }
            - { call: "GET /deficiencies?facility_id=${fac}&status=OPEN", as: Any, captures: { d1: "$.data[0].id" } }
            - { call: "POST /_clock/set_current_utc", payload: { to_iso8601: "2026-09-20T00:00:00Z" }, as: ContractorAdmin }
          trigger:
            - { call: "POST /facilities/${fac}/run-monthly-close", payload: { period_month: "2026-08" }, as: ContractorAdmin, captures: { mc_created: $.data.deficiencies_created, mc_escalated: $.data.deficiencies_escalated, mc_score: $.data.posture_score, mc_posture: $.data.compliance_posture } }
            - { call: "GET /deficiencies/${d1}", as: Any, captures: { d1_status: $.data.status, d1_esc: $.data.escalated_at } }
          assert:
            - "${mc_created} == 1 (new MINOR gap deficiency for 2026-08)"
            - "${mc_escalated} == 1 (D1 overdue since 2026-09-09)"
            - "${d1_status} == ESCALATED and ${d1_esc} == 2026-09-20T00:00:00Z"
            - "${mc_score} == 85 and ${mc_posture} == COMPLIANT (95 - 5 new MINOR - 5 escalation extra)"

      - name: empty_facility_close_zero_deficiencies
        claim_type: action_endpoint
        grounds:
          - calculations.monthly_close_sweep
        distinguishing_aspect: "Empty-set edge: a facility whose only tank is REGISTERED (never in service) sweeps zero gaps — REGISTERED and PERMANENTLY_CLOSED tanks are excluded from the record obligation."
        test_recipe:
          setup: ["Facility ACTIVE with one tank left in REGISTERED status; clock 2026-06-11"]
          setup_api_calls:
            - { call: "POST /_clock/set_current_utc", payload: { to_iso8601: "2026-06-11T00:00:00Z" }, as: ContractorAdmin }
            - { call: "POST /facilities", payload: { facility_name: "Empty Sweep", state_code: "CA", annual_fee_paid_through: "2027-01-01T00:00:00Z" }, as: FacilityOwner, as_user_id: "owner-1", captures: { fac: $.data.id } }
            - { call: "POST /tank-systems", payload: { facility_id: "${fac}", tank_tag: "T1", substance: "DIESEL", capacity_gallons: 10000, installed_on: "2018-01-01T00:00:00Z", tank_construction: "STEEL", piping_type: "PRESSURIZED", release_detection_mode: "ATG_INVENTORY" }, as: FacilityOwner, as_user_id: "owner-1" }
            - { call: "POST /facilities/${fac}/activate", payload: {}, as: FacilityOwner, as_user_id: "owner-1" }
          trigger:
            - { call: "POST /facilities/${fac}/run-monthly-close", payload: { period_month: "2026-05" }, as: ContractorAdmin, captures: { mc_created: $.data.deficiencies_created, mc_score: $.data.posture_score } }
          assert:
            - "${mc_created} == 0 (REGISTERED tank is outside the sweep set)"
            - "${mc_score} == 100"

      - name: begin_cleanup_then_close_release
        claim_type: valid_transition
        grounds:
          - state_machines.ReleaseEvent.CONFIRMED_to_CLEANUP_IN_PROGRESS
          - state_machines.ReleaseEvent.CLEANUP_IN_PROGRESS_to_CLOSED
          - calculations.compliance_posture_score
        distinguishing_aspect: "The release lifecycle completes CONFIRMED -> CLEANUP_IN_PROGRESS -> CLOSED, and closing returns the open-release posture penalty."
        test_recipe:
          setup: ["Facility with a CONFIRMED release (posture 90)"]
          setup_api_calls:
            - { call: "POST /_clock/set_current_utc", payload: { to_iso8601: "2026-05-01T00:00:00Z" }, as: ContractorAdmin }
            - { call: "POST /facilities", payload: { facility_name: "Cleanup Site", state_code: "CA", annual_fee_paid_through: "2027-01-01T00:00:00Z" }, as: FacilityOwner, as_user_id: "owner-1", captures: { fac: $.data.id } }
            - { call: "POST /release-events", payload: { facility_id: "${fac}", discovered_at: "2026-05-01T08:00:00Z", source_description: "sheen" }, as: FacilityOwner, as_user_id: "owner-1", captures: { rel: $.data.id } }
            - { call: "POST /release-events/${rel}/confirm", payload: {}, as: StateRegulator }
          trigger:
            - { call: "POST /release-events/${rel}/begin-cleanup", payload: {}, as: FacilityOwner, as_user_id: "owner-1", captures: { rel_s1: $.data.status } }
            - { call: "POST /release-events/${rel}/close", payload: {}, as: StateRegulator, captures: { rel_s2: $.data.status } }
            - { call: "GET /facilities/${fac}", as: Any, captures: { fac_score: $.data.posture_score } }
          assert:
            - "${rel_s1} == CLEANUP_IN_PROGRESS"
            - "${rel_s2} == CLOSED"
            - "${fac_score} == 100 (open-release weight 10 restored at closure)"

      - name: adjudicate_partial_denied_approved_cap_effects
        claim_type: action_endpoint
        grounds:
          - state_machines.StateFundClaim
          - entities.Facility.fields.fund_cap_remaining_cents
        distinguishing_aspect: "Three adjudication outcomes have distinct ledger effects: PARTIALLY_APPROVED releases (payable - approved), DENIED releases the full reservation, APPROVED consumes it — asserted as exact cap literals across three claims."
        test_recipe:
          setup: ["Facility ACTIVE (PER_OCCURRENCE) with CONFIRMED release; cap 100000000"]
          setup_api_calls:
            - { call: "POST /_clock/set_current_utc", payload: { to_iso8601: "2026-05-01T00:00:00Z" }, as: ContractorAdmin }
            - { call: "POST /facilities", payload: { facility_name: "Adj Site", state_code: "CA", annual_fee_paid_through: "2027-01-01T00:00:00Z", fund_program_election: "PER_OCCURRENCE" }, as: FacilityOwner, as_user_id: "owner-1", captures: { fac: $.data.id } }
            - { call: "POST /tank-systems", payload: { facility_id: "${fac}", tank_tag: "T1", substance: "GASOLINE", capacity_gallons: 8000, installed_on: "2018-01-01T00:00:00Z", tank_construction: "FRP", piping_type: "SUCTION", release_detection_mode: "ATG_INVENTORY" }, as: FacilityOwner, as_user_id: "owner-1", captures: { tank: $.data.id } }
            - { call: "POST /facilities/${fac}/activate", payload: {}, as: FacilityOwner, as_user_id: "owner-1" }
            - { call: "POST /tank-systems/${tank}/place-in-service", payload: {}, as: FacilityOwner, as_user_id: "owner-1" }
            - { call: "POST /release-events", payload: { facility_id: "${fac}", discovered_at: "2026-05-01T08:00:00Z", source_description: "sheen" }, as: FacilityOwner, as_user_id: "owner-1", captures: { rel: $.data.id } }
            - { call: "POST /release-events/${rel}/confirm", payload: {}, as: StateRegulator }
            - { call: "POST /fund-claims", payload: { facility_id: "${fac}", release_event_id: "${rel}", expense_lines: [{ description: "c1", amount_cents: 3000000 }] }, as: FacilityOwner, as_user_id: "owner-1", captures: { c1: $.data.id } }
            - { call: "POST /fund-claims", payload: { facility_id: "${fac}", release_event_id: "${rel}", expense_lines: [{ description: "c2", amount_cents: 3000000 }] }, as: FacilityOwner, as_user_id: "owner-1", captures: { c2: $.data.id } }
            - { call: "POST /fund-claims", payload: { facility_id: "${fac}", release_event_id: "${rel}", expense_lines: [{ description: "c3", amount_cents: 1500000 }] }, as: FacilityOwner, as_user_id: "owner-1", captures: { c3: $.data.id } }
          trigger:
            - { call: "POST /fund-claims/${c1}/submit", payload: {}, as: FacilityOwner, as_user_id: "owner-1" }
            - { call: "POST /fund-claims/${c1}/adjudicate", payload: { decision: "PARTIALLY_APPROVED", approved_amount_cents: 1000000 }, as: StateRegulator, captures: { c1_status: $.data.status, c1_approved: $.data.approved_amount_cents } }
            - { call: "GET /facilities/${fac}", as: Any, captures: { cap1: $.data.fund_cap_remaining_cents } }
            - { call: "POST /fund-claims/${c2}/submit", payload: {}, as: FacilityOwner, as_user_id: "owner-1" }
            - { call: "POST /fund-claims/${c2}/adjudicate", payload: { decision: "DENIED" }, as: StateRegulator, captures: { c2_status: $.data.status, c2_approved: $.data.approved_amount_cents } }
            - { call: "GET /facilities/${fac}", as: Any, captures: { cap2: $.data.fund_cap_remaining_cents } }
            - { call: "POST /fund-claims/${c3}/submit", payload: {}, as: FacilityOwner, as_user_id: "owner-1" }
            - { call: "POST /fund-claims/${c3}/adjudicate", payload: { decision: "APPROVED" }, as: StateRegulator, captures: { c3_status: $.data.status, c3_approved: $.data.approved_amount_cents } }
            - { call: "GET /facilities/${fac}", as: Any, captures: { cap3: $.data.fund_cap_remaining_cents } }
            - { call: "GET /fund-claims?facility_id=${fac}", as: Any }
          assert:
            - "${c1_status} == PARTIALLY_APPROVED and ${c1_approved} == 1000000"
            - "${cap1} == 99000000 (100000000 - 1800000 reserved + 800000 released)"
            - "${c2_status} == DENIED and ${c2_approved} == 0"
            - "${cap2} == 99000000 (reserve 1800000 fully released on denial)"
            - "${c3_status} == APPROVED and ${c3_approved} == 450000 (round_half_up((1500000 - 1000000) * 0.90))"
            - "${cap3} == 98550000 (99000000 - 450000; approval consumes the reservation)"
            - "GET /fund-claims?facility_id=${fac} returns total_count 3"

  # ===========================================================================
  # Section: errors
  # ===========================================================================
  - section: errors
    instances:
      - name: missing_required_field_rejected
        claim_type: violation_to_error
        grounds:
          - errors[ERR_INVALID_REQUEST]
          - validations[priority=4]
        distinguishing_aspect: "POST /tank-systems without the required tank_tag fails with 400 ERR_INVALID_REQUEST before any business rule runs."
        test_recipe:
          setup: ["Facility exists"]
          setup_api_calls:
            - { call: "POST /facilities", payload: { facility_name: "Req Site", state_code: "CA", annual_fee_paid_through: "2027-01-01T00:00:00Z" }, as: FacilityOwner, as_user_id: "owner-1", captures: { fac: $.data.id } }
          trigger:
            - call: "POST /tank-systems"
              payload: { facility_id: "${fac}", substance: "DIESEL", capacity_gallons: 10000, installed_on: "2018-01-01T00:00:00Z", tank_construction: "STEEL", piping_type: "PRESSURIZED", release_detection_mode: "ATG_INVENTORY" }
              as: FacilityOwner
              as_user_id: "owner-1"
              captures: { err: $.data.error_id }
          assert:
            - "${err} == ERR_INVALID_REQUEST (required field tank_tag absent)"

      - name: result_record_not_found
        claim_type: violation_to_error
        grounds:
          - errors[ERR_RESULT_RECORD_NOT_FOUND]
        distinguishing_aspect: "Every catalogued NOT_FOUND id maps to its resource: a random UUID under /result-records returns 404 ERR_RESULT_RECORD_NOT_FOUND with the standard error envelope."
        test_recipe:
          setup: ["Empty DB"]
          setup_api_calls: []
          trigger:
            - { call: "GET /result-records/8a3e1c0b-2f4d-4a91-9c8b-12e7b6a0f1d2", as: Any, captures: { err: $.data.error_id, msg: $.data.message } }
          assert:
            - "${err} == ERR_RESULT_RECORD_NOT_FOUND with http 404"
            - "${msg} is a non-empty human-readable message (error envelope carries data.error_id and data.message)"

  # ===========================================================================
  # Section: rbac
  # ===========================================================================
  - section: rbac
    instances:
      - name: technician_cannot_create_technicians_forbidden
        claim_type: role_denial
        grounds:
          - roles.Technician
          - roles.ContractorAdmin
          - errors[ERR_INSUFFICIENT_PERMISSIONS]
        distinguishing_aspect: "POST /technicians is ContractorAdmin-exclusive; a Technician caller is denied with 403."
        test_recipe:
          setup: ["One technician exists (supplies the caller identity)"]
          setup_api_calls:
            - { call: "POST /technicians", payload: { full_name: "First", endorsements: [], trainer: false }, as: ContractorAdmin, captures: { t1: $.data.id } }
          trigger:
            - call: "POST /technicians"
              payload: { full_name: "Second", endorsements: [], trainer: false }
              as: Technician
              as_user_id: "${t1}"
              captures: { err: $.data.error_id }
          assert:
            - "${err} == ERR_INSUFFICIENT_PERMISSIONS"

      - name: reviewer_cannot_record_results_forbidden
        claim_type: role_denial
        grounds:
          - roles.ComplianceReviewer
          - roles.Technician
          - errors[ERR_INSUFFICIENT_PERMISSIONS]
        distinguishing_aspect: "POST /service-orders/{id}/results is Technician-exclusive; even a reviewer who is a different person than the performer is denied by role, keeping the field-work/write path segregated by role as well as by identity."
        test_recipe:
          setup: ["Facility ACTIVE, tank IN_SERVICE; order started by t_tt (IN_PROGRESS); reviewer technician t_rev"]
          setup_api_calls:
            - { call: "POST /_clock/set_current_utc", payload: { to_iso8601: "2026-05-01T00:00:00Z" }, as: ContractorAdmin }
            - { call: "POST /facilities", payload: { facility_name: "Role Site", state_code: "CA", annual_fee_paid_through: "2027-01-01T00:00:00Z" }, as: FacilityOwner, as_user_id: "owner-1", captures: { fac: $.data.id } }
            - { call: "POST /tank-systems", payload: { facility_id: "${fac}", tank_tag: "T1", substance: "DIESEL", capacity_gallons: 10000, installed_on: "2018-01-01T00:00:00Z", tank_construction: "STEEL", piping_type: "PRESSURIZED", release_detection_mode: "ATG_INVENTORY" }, as: FacilityOwner, as_user_id: "owner-1", captures: { tank: $.data.id } }
            - { call: "POST /facilities/${fac}/activate", payload: {}, as: FacilityOwner, as_user_id: "owner-1" }
            - { call: "POST /tank-systems/${tank}/place-in-service", payload: {}, as: FacilityOwner, as_user_id: "owner-1" }
            - { call: "POST /technicians", payload: { full_name: "TT", endorsements: ["TIGHTNESS_TESTER"], trainer: false }, as: ContractorAdmin, captures: { t_tt: $.data.id } }
            - { call: "POST /technicians", payload: { full_name: "Rev", endorsements: [], trainer: false }, as: ContractorAdmin, captures: { t_rev: $.data.id } }
            - { call: "POST /service-orders", payload: { facility_id: "${fac}", tank_system_id: "${tank}", service_type: "TANK_TIGHTNESS", line_items: [{ description: "t", qty: 1, unit_price_cents: 60000 }] }, as: ContractorAdmin, captures: { so: $.data.id } }
            - { call: "POST /service-orders/${so}/schedule", payload: { technician_id: "${t_tt}", window_start: "2026-05-02T10:00:00Z", window_end: "2026-05-02T11:00:00Z" }, as: ContractorAdmin }
            - { call: "POST /_clock/set_current_utc", payload: { to_iso8601: "2026-05-02T10:30:00Z" }, as: ContractorAdmin }
            - { call: "POST /service-orders/${so}/start", payload: {}, as: Technician, as_user_id: "${t_tt}" }
          trigger:
            - call: "POST /service-orders/${so}/results"
              payload: { readings: { leak_rate_gph: 0.05 } }
              as: ComplianceReviewer
              as_user_id: "${t_rev}"
              captures: { err: $.data.error_id }
          assert:
            - "${err} == ERR_INSUFFICIENT_PERMISSIONS (role gate fires before identity checks)"

      - name: owner_cannot_certify_forbidden
        claim_type: role_denial
        grounds:
          - roles.FacilityOwner
          - roles.ComplianceReviewer
          - errors[ERR_INSUFFICIENT_PERMISSIONS]
        distinguishing_aspect: "Certification is ComplianceReviewer-exclusive; a FacilityOwner (even of the serviced facility) is denied — segregation of duties keeps owners out of the QA path."
        test_recipe:
          setup: ["Facility ACTIVE, tank IN_SERVICE; order UNDER_REVIEW after PASS results"]
          setup_api_calls:
            - { call: "POST /_clock/set_current_utc", payload: { to_iso8601: "2026-05-01T00:00:00Z" }, as: ContractorAdmin }
            - { call: "POST /facilities", payload: { facility_name: "Cert Gate", state_code: "CA", annual_fee_paid_through: "2027-01-01T00:00:00Z" }, as: FacilityOwner, as_user_id: "owner-1", captures: { fac: $.data.id } }
            - { call: "POST /tank-systems", payload: { facility_id: "${fac}", tank_tag: "T1", substance: "DIESEL", capacity_gallons: 10000, installed_on: "2018-01-01T00:00:00Z", tank_construction: "STEEL", piping_type: "PRESSURIZED", release_detection_mode: "ATG_INVENTORY" }, as: FacilityOwner, as_user_id: "owner-1", captures: { tank: $.data.id } }
            - { call: "POST /facilities/${fac}/activate", payload: {}, as: FacilityOwner, as_user_id: "owner-1" }
            - { call: "POST /tank-systems/${tank}/place-in-service", payload: {}, as: FacilityOwner, as_user_id: "owner-1" }
            - { call: "POST /technicians", payload: { full_name: "TT", endorsements: ["TIGHTNESS_TESTER"], trainer: false }, as: ContractorAdmin, captures: { t_tt: $.data.id } }
            - { call: "POST /service-orders", payload: { facility_id: "${fac}", tank_system_id: "${tank}", service_type: "TANK_TIGHTNESS", line_items: [{ description: "t", qty: 1, unit_price_cents: 60000 }] }, as: ContractorAdmin, captures: { so: $.data.id } }
            - { call: "POST /service-orders/${so}/schedule", payload: { technician_id: "${t_tt}", window_start: "2026-05-02T10:00:00Z", window_end: "2026-05-02T11:00:00Z" }, as: ContractorAdmin }
            - { call: "POST /_clock/set_current_utc", payload: { to_iso8601: "2026-05-02T10:30:00Z" }, as: ContractorAdmin }
            - { call: "POST /service-orders/${so}/start", payload: {}, as: Technician, as_user_id: "${t_tt}" }
            - { call: "POST /service-orders/${so}/results", payload: { readings: { leak_rate_gph: 0.05 } }, as: Technician, as_user_id: "${t_tt}" }
          trigger:
            - call: "POST /service-orders/${so}/certify"
              payload: {}
              as: FacilityOwner
              as_user_id: "owner-1"
              captures: { err: $.data.error_id }
          assert:
            - "${err} == ERR_INSUFFICIENT_PERMISSIONS"

      - name: any_role_can_read_lists
        claim_type: role_allow
        grounds:
          - roles.Any
        distinguishing_aspect: "All GET list/detail endpoints are shared read operations: a caller with any declared role (modeled as Any) can read."
        test_recipe:
          setup: ["One facility exists"]
          setup_api_calls:
            - { call: "POST /facilities", payload: { facility_name: "Read Site", state_code: "CA", annual_fee_paid_through: "2027-01-01T00:00:00Z" }, as: FacilityOwner, as_user_id: "owner-1", captures: { fac: $.data.id } }
          trigger:
            - { call: "GET /facilities/${fac}", as: Any, captures: { g_name: $.data.facility_name } }
            - { call: "GET /deficiencies?facility_id=${fac}", as: Any }
            - { call: "GET /operators?facility_id=${fac}", as: Any }
          assert:
            - "${g_name} == Read Site (200 with the stored entity)"
            - "GET /deficiencies?facility_id=${fac} returns 200 with total_count 0"
            - "GET /operators?facility_id=${fac} returns 200 with total_count 0"

  # ===========================================================================
  # Section: cross-cutting complexity layers
  # ===========================================================================
  - section: cross_cutting_layers
    instances:
      - name: occ_stale_version_rejected_on_second_order_update
        claim_type: optimistic_concurrency
        grounds:
          - concurrency_rules[order-update-stale-version]
          - errors[ERR_STALE_VERSION]
        distinguishing_aspect: "Two sequential PUTs carrying the same expected_service_order_version: the first succeeds and bumps version to 2; the second is rejected 412 ERR_STALE_VERSION — a deterministic stale-view test with no parallelism."
        test_recipe:
          setup: ["Facility with one tank; REQUESTED order at version 1"]
          setup_api_calls:
            - { call: "POST /facilities", payload: { facility_name: "OCC Site", state_code: "CA", annual_fee_paid_through: "2027-01-01T00:00:00Z" }, as: FacilityOwner, as_user_id: "owner-1", captures: { fac: $.data.id } }
            - { call: "POST /tank-systems", payload: { facility_id: "${fac}", tank_tag: "T1", substance: "DIESEL", capacity_gallons: 10000, installed_on: "2018-01-01T00:00:00Z", tank_construction: "STEEL", piping_type: "PRESSURIZED", release_detection_mode: "ATG_INVENTORY" }, as: FacilityOwner, as_user_id: "owner-1", captures: { tank: $.data.id } }
            - { call: "POST /service-orders", payload: { facility_id: "${fac}", tank_system_id: "${tank}", service_type: "TANK_TIGHTNESS", line_items: [{ description: "t", qty: 1, unit_price_cents: 60000 }] }, as: ContractorAdmin, captures: { so: $.data.id, so_v: $.data.version } }
          trigger:
            - { call: "PUT /service-orders/${so}", payload: { expected_service_order_version: "${so_v}", line_items: [{ description: "t2", qty: 2, unit_price_cents: 60000 }] }, as: ContractorAdmin, captures: { v_after: $.data.version, q_after: $.data.quote_total_cents } }
            - call: "PUT /service-orders/${so}"
              payload: { expected_service_order_version: "${so_v}", line_items: [{ description: "t3", qty: 3, unit_price_cents: 60000 }] }
              as: ContractorAdmin
              captures: { err: $.data.error_id }
            - { call: "GET /service-orders/${so}", as: Any, captures: { so_final_v: $.data.version } }
          assert:
            - "${v_after} == 2 (first PUT bumped the version) and ${q_after} == 135000 (2 x 60000 + 15000)"
            - "${err} == ERR_STALE_VERSION with http 412 (second PUT replayed version 1)"
            - "${so_final_v} == 2 (rejected write did not mutate)"

      - name: occ_stale_version_rejected_on_submission_amend
        claim_type: optimistic_concurrency
        grounds:
          - concurrency_rules[submission-amend-stale-version]
          - errors[ERR_STALE_VERSION]
        distinguishing_aspect: "Amending a REJECTED submission with a version captured before its reject transition is rejected 412 ERR_STALE_VERSION, while amending with the fresh version succeeds and resets submitted_at/is_late."
        test_recipe:
          setup: ["Facility ACTIVE, tank IN_SERVICE; monthly submission for 2026-04 submitted then rejected (version advanced by submit and reject)"]
          setup_api_calls:
            - { call: "POST /_clock/set_current_utc", payload: { to_iso8601: "2026-05-05T00:00:00Z" }, as: ContractorAdmin }
            - { call: "POST /facilities", payload: { facility_name: "OCC Sub", state_code: "CA", annual_fee_paid_through: "2027-01-01T00:00:00Z" }, as: FacilityOwner, as_user_id: "owner-1", captures: { fac: $.data.id } }
            - { call: "POST /tank-systems", payload: { facility_id: "${fac}", tank_tag: "T1", substance: "DIESEL", capacity_gallons: 10000, installed_on: "2018-01-01T00:00:00Z", tank_construction: "STEEL", piping_type: "PRESSURIZED", release_detection_mode: "ATG_INVENTORY" }, as: FacilityOwner, as_user_id: "owner-1", captures: { tank: $.data.id } }
            - { call: "POST /facilities/${fac}/activate", payload: {}, as: FacilityOwner, as_user_id: "owner-1" }
            - { call: "POST /tank-systems/${tank}/place-in-service", payload: {}, as: FacilityOwner, as_user_id: "owner-1" }
            - { call: "POST /release-detection-records", payload: { tank_system_id: "${tank}", period_month: "2026-04", readings_summary: { log: "april" } }, as: FacilityOwner, as_user_id: "owner-1", captures: { rec: $.data.id } }
            - { call: "POST /technicians", payload: { full_name: "Rev", endorsements: [], trainer: false }, as: ContractorAdmin, captures: { t_rev: $.data.id } }
            - { call: "POST /submissions", payload: { facility_id: "${fac}", submission_type: "MONTHLY_RELEASE_DETECTION", period_month: "2026-04", release_detection_record_ids: ["${rec}"] }, as: ComplianceReviewer, as_user_id: "${t_rev}", captures: { sub: $.data.id, sub_v: $.data.version } }
            - { call: "POST /submissions/${sub}/submit", payload: {}, as: ComplianceReviewer, as_user_id: "${t_rev}" }
            - { call: "POST /submissions/${sub}/reject", payload: { note: "incomplete" }, as: StateRegulator }
          trigger:
            - call: "POST /submissions/${sub}/amend"
              payload: { expected_submission_version: "${sub_v}" }
              as: ComplianceReviewer
              as_user_id: "${t_rev}"
              captures: { err: $.data.error_id }
            - { call: "GET /submissions/${sub}", as: Any, captures: { sub_v_fresh: $.data.version } }
            - { call: "POST /submissions/${sub}/amend", payload: { expected_submission_version: "${sub_v_fresh}" }, as: ComplianceReviewer, as_user_id: "${t_rev}", captures: { sub_status: $.data.status, sub_at: $.data.submitted_at, sub_late: $.data.is_late } }
          assert:
            - "${err} == ERR_STALE_VERSION (creation-time version ${sub_v} is stale after submit+reject bumped it)"
            - "${sub_status} == DRAFT and ${sub_at} == null and ${sub_late} == false (fresh-version amend resets the filing fields)"

      - name: cascading_side_effects_release_confirm
        claim_type: cascading_side_effects
        grounds:
          - state_machines.ReleaseEvent.SUSPECTED_to_CONFIRMED
        excluded_because:
          difficulty_instance: release_confirm_cascades_tank_orders_deficiency
          rationale: "§1.8 instance asserts the full confirm -> tank closure -> order cancellation -> deficiency reversion chain end to end."

      - name: dual_variant_cp_and_fund_covered
        claim_type: dual_variant_calculation
        grounds:
          - calculations.cp_survey_determination
          - calculations.fund_reimbursement_amount
        excluded_because:
          difficulty_instance: cp_survey_criterion_divergence_same_readings
          rationale: "Both dual-variant calculations are exercised with literal expected outputs by §1.8 rule-1 instances (cp_survey_criterion_divergence_same_readings and fund_claim_election_changes_payable)."

      - name: ops_run_checkpoint_close_semantics
        claim_type: ops_run_checkpoint
        grounds:
          - calculations.monthly_close_sweep
        excluded_because:
          difficulty_instance: posture_score_weighted_sum_tier_boundary
          rationale: "The close's lapse sweep and posture recompute are asserted inside the §1.8 posture instance; gap-creation, idempotency, early-close, escalation, and empty-set edges are asserted by §1.9 endpoint-section instances above."

  # ===========================================================================
  # Section: consistency model (immediate)
  # ===========================================================================
  - section: consistency_model
    instances:
      - name: immediate_read_after_write_matches
        claim_type: immediate_consistency
        grounds:
          - complexity_profile.consistency_model
        distinguishing_aspect: "Immediate consistency: a GET issued after a mutating call in the same session observes the mutation — no lag, no stale cache."
        test_recipe:
          setup: ["Facility created; its name then read back; tank created; facility detail re-read"]
          setup_api_calls:
            - { call: "POST /facilities", payload: { facility_name: "Immediate Site", state_code: "WA", annual_fee_paid_through: "2027-01-01T00:00:00Z", fund_program_election: "AGGREGATE" }, as: FacilityOwner, as_user_id: "owner-1", captures: { fac: $.data.id } }
          trigger:
            - { call: "GET /facilities/${fac}", as: Any, captures: { g_name: $.data.facility_name, g_election: $.data.fund_program_election, g_state: $.data.state_code } }
            - { call: "POST /tank-systems", payload: { facility_id: "${fac}", tank_tag: "T1", substance: "DIESEL", capacity_gallons: 10000, installed_on: "2018-01-01T00:00:00Z", tank_construction: "STEEL", piping_type: "PRESSURIZED", release_detection_mode: "ATG_INVENTORY" }, as: FacilityOwner, as_user_id: "owner-1", captures: { tank: $.data.id } }
            - { call: "POST /facilities/${fac}/activate", payload: {}, as: FacilityOwner, as_user_id: "owner-1" }
            - { call: "GET /facilities/${fac}", as: Any, captures: { g_status: $.data.status, g_version: $.data.version } }
          assert:
            - "${g_name} == Immediate Site and ${g_election} == AGGREGATE and ${g_state} == WA (create fields visible on the very next read)"
            - "${g_status} == ACTIVE and ${g_version} == 2 (activation mutation visible immediately, version bumped once)"

  # ===========================================================================
  # Section: errors (catalog triggerability addendum)
  # ===========================================================================
  - section: errors
    instances:
      - name: not_found_variants_across_resources
        claim_type: violation_to_error
        grounds:
          - errors[ERR_TANK_SYSTEM_NOT_FOUND]
          - errors[ERR_COMPONENT_NOT_FOUND]
          - errors[ERR_TECHNICIAN_NOT_FOUND]
          - errors[ERR_SERVICE_ORDER_NOT_FOUND]
          - errors[ERR_DEFICIENCY_NOT_FOUND]
          - errors[ERR_SUBMISSION_NOT_FOUND]
          - errors[ERR_RECORD_NOT_FOUND]
          - errors[ERR_OPERATOR_NOT_FOUND]
          - errors[ERR_TRAINING_RECORD_NOT_FOUND]
          - errors[ERR_RELEASE_EVENT_NOT_FOUND]
          - errors[ERR_FUND_CLAIM_NOT_FOUND]
        distinguishing_aspect: "Every resource collection maps unknown ids to its own domain-specific 404 error id rather than a generic not-found."
        test_recipe:
          setup: ["Empty DB"]
          setup_api_calls: []
          trigger:
            - { call: "GET /tank-systems/8a3e1c0b-2f4d-4a91-9c8b-12e7b6a0f1d2", as: Any, captures: { e_tank: $.data.error_id } }
            - { call: "GET /components/8a3e1c0b-2f4d-4a91-9c8b-12e7b6a0f1d2", as: Any, captures: { e_comp: $.data.error_id } }
            - { call: "GET /technicians/8a3e1c0b-2f4d-4a91-9c8b-12e7b6a0f1d2", as: Any, captures: { e_tech: $.data.error_id } }
            - { call: "GET /service-orders/8a3e1c0b-2f4d-4a91-9c8b-12e7b6a0f1d2", as: Any, captures: { e_so: $.data.error_id } }
            - { call: "GET /deficiencies/8a3e1c0b-2f4d-4a91-9c8b-12e7b6a0f1d2", as: Any, captures: { e_def: $.data.error_id } }
            - { call: "GET /submissions/8a3e1c0b-2f4d-4a91-9c8b-12e7b6a0f1d2", as: Any, captures: { e_sub: $.data.error_id } }
            - { call: "GET /release-detection-records/8a3e1c0b-2f4d-4a91-9c8b-12e7b6a0f1d2", as: Any, captures: { e_rec: $.data.error_id } }
            - { call: "GET /operators/8a3e1c0b-2f4d-4a91-9c8b-12e7b6a0f1d2", as: Any, captures: { e_op: $.data.error_id } }
            - { call: "GET /training-records/8a3e1c0b-2f4d-4a91-9c8b-12e7b6a0f1d2", as: Any, captures: { e_tr: $.data.error_id } }
            - { call: "GET /release-events/8a3e1c0b-2f4d-4a91-9c8b-12e7b6a0f1d2", as: Any, captures: { e_rel: $.data.error_id } }
            - { call: "GET /fund-claims/8a3e1c0b-2f4d-4a91-9c8b-12e7b6a0f1d2", as: Any, captures: { e_fc: $.data.error_id } }
          assert:
            - "${e_tank} == ERR_TANK_SYSTEM_NOT_FOUND"
            - "${e_comp} == ERR_COMPONENT_NOT_FOUND"
            - "${e_tech} == ERR_TECHNICIAN_NOT_FOUND"
            - "${e_so} == ERR_SERVICE_ORDER_NOT_FOUND"
            - "${e_def} == ERR_DEFICIENCY_NOT_FOUND"
            - "${e_sub} == ERR_SUBMISSION_NOT_FOUND"
            - "${e_rec} == ERR_RECORD_NOT_FOUND"
            - "${e_op} == ERR_OPERATOR_NOT_FOUND"
            - "${e_tr} == ERR_TRAINING_RECORD_NOT_FOUND"
            - "${e_rel} == ERR_RELEASE_EVENT_NOT_FOUND"
            - "${e_fc} == ERR_FUND_CLAIM_NOT_FOUND"

      - name: claim_state_transitions_rejected
        claim_type: violation_to_error
        grounds:
          - errors[ERR_CLAIM_NOT_DRAFT]
          - errors[ERR_CLAIM_NOT_SUBMITTED]
          - errors[ERR_CLAIM_NOT_WITHDRAWABLE]
          - state_machines.StateFundClaim
        distinguishing_aspect: "Each claim transition enforces its from-state: adjudicate on DRAFT, submit on SUBMITTED, and withdraw on terminal APPROVED all fail with distinct 409s."
        test_recipe:
          setup: ["Facility ACTIVE (PER_OCCURRENCE) with CONFIRMED release and fees current; one claim created (DRAFT)"]
          setup_api_calls:
            - { call: "POST /_clock/set_current_utc", payload: { to_iso8601: "2026-05-01T00:00:00Z" }, as: ContractorAdmin }
            - { call: "POST /facilities", payload: { facility_name: "Claim States", state_code: "CA", annual_fee_paid_through: "2027-01-01T00:00:00Z", fund_program_election: "PER_OCCURRENCE" }, as: FacilityOwner, as_user_id: "owner-1", captures: { fac: $.data.id } }
            - { call: "POST /tank-systems", payload: { facility_id: "${fac}", tank_tag: "T1", substance: "GASOLINE", capacity_gallons: 8000, installed_on: "2018-01-01T00:00:00Z", tank_construction: "FRP", piping_type: "SUCTION", release_detection_mode: "ATG_INVENTORY" }, as: FacilityOwner, as_user_id: "owner-1", captures: { tank: $.data.id } }
            - { call: "POST /facilities/${fac}/activate", payload: {}, as: FacilityOwner, as_user_id: "owner-1" }
            - { call: "POST /tank-systems/${tank}/place-in-service", payload: {}, as: FacilityOwner, as_user_id: "owner-1" }
            - { call: "POST /release-events", payload: { facility_id: "${fac}", discovered_at: "2026-05-01T08:00:00Z", source_description: "sheen" }, as: FacilityOwner, as_user_id: "owner-1", captures: { rel: $.data.id } }
            - { call: "POST /release-events/${rel}/confirm", payload: {}, as: StateRegulator }
            - { call: "POST /fund-claims", payload: { facility_id: "${fac}", release_event_id: "${rel}", expense_lines: [{ description: "c", amount_cents: 3000000 }] }, as: FacilityOwner, as_user_id: "owner-1", captures: { claim: $.data.id } }
          trigger:
            - { call: "POST /fund-claims/${claim}/adjudicate", payload: { decision: "APPROVED" }, as: StateRegulator, captures: { err_adj: $.data.error_id } }
            - { call: "POST /fund-claims/${claim}/submit", payload: {}, as: FacilityOwner, as_user_id: "owner-1" }
            - { call: "POST /fund-claims/${claim}/submit", payload: {}, as: FacilityOwner, as_user_id: "owner-1", captures: { err_sub: $.data.error_id } }
            - { call: "POST /fund-claims/${claim}/adjudicate", payload: { decision: "APPROVED" }, as: StateRegulator }
            - { call: "POST /fund-claims/${claim}/withdraw", payload: {}, as: FacilityOwner, as_user_id: "owner-1", captures: { err_wd: $.data.error_id } }
          assert:
            - "${err_adj} == ERR_CLAIM_NOT_SUBMITTED (adjudicate requires SUBMITTED)"
            - "${err_sub} == ERR_CLAIM_NOT_DRAFT (second submit on SUBMITTED)"
            - "${err_wd} == ERR_CLAIM_NOT_WITHDRAWABLE (withdraw on terminal APPROVED)"

      - name: claim_release_not_confirmed_rejected
        claim_type: violation_to_error
        grounds:
          - errors[ERR_CLAIM_RELEASE_NOT_CONFIRMED]
          - validations[priority=18]
        distinguishing_aspect: "A fund claim against a release still SUSPECTED fails with 402 ERR_CLAIM_RELEASE_NOT_CONFIRMED; the release must reach CONFIRMED first."
        test_recipe:
          setup: ["Facility ACTIVE with a SUSPECTED (unconfirmed) release; fees current; posture clean"]
          setup_api_calls:
            - { call: "POST /_clock/set_current_utc", payload: { to_iso8601: "2026-05-01T00:00:00Z" }, as: ContractorAdmin }
            - { call: "POST /facilities", payload: { facility_name: "Suspect Site", state_code: "CA", annual_fee_paid_through: "2027-01-01T00:00:00Z", fund_program_election: "PER_OCCURRENCE" }, as: FacilityOwner, as_user_id: "owner-1", captures: { fac: $.data.id } }
            - { call: "POST /tank-systems", payload: { facility_id: "${fac}", tank_tag: "T1", substance: "GASOLINE", capacity_gallons: 8000, installed_on: "2018-01-01T00:00:00Z", tank_construction: "FRP", piping_type: "SUCTION", release_detection_mode: "ATG_INVENTORY" }, as: FacilityOwner, as_user_id: "owner-1", captures: { tank: $.data.id } }
            - { call: "POST /facilities/${fac}/activate", payload: {}, as: FacilityOwner, as_user_id: "owner-1" }
            - { call: "POST /tank-systems/${tank}/place-in-service", payload: {}, as: FacilityOwner, as_user_id: "owner-1" }
            - { call: "POST /release-events", payload: { facility_id: "${fac}", discovered_at: "2026-05-01T08:00:00Z", source_description: "odor" }, as: FacilityOwner, as_user_id: "owner-1", captures: { rel: $.data.id } }
          trigger:
            - call: "POST /fund-claims"
              payload: { facility_id: "${fac}", release_event_id: "${rel}", expense_lines: [{ description: "c", amount_cents: 3000000 }] }
              as: FacilityOwner
              as_user_id: "owner-1"
              captures: { err: $.data.error_id }
          assert:
            - "${err} == ERR_CLAIM_RELEASE_NOT_CONFIRMED (release still SUSPECTED)"

      - name: fund_cap_exceeded_at_create_rejected
        claim_type: violation_to_error
        grounds:
          - errors[ERR_FUND_CAP_EXCEEDED]
          - calculations.fund_reimbursement_amount
          - validations[priority=18]
        distinguishing_aspect: "With clean posture and current fees, a claim whose payable (179100000) exceeds the full fund-year cap (100000000) is rejected at creation with 402 ERR_FUND_CAP_EXCEEDED."
        test_recipe:
          setup: ["Facility ACTIVE (PER_OCCURRENCE), CONFIRMED release, fees current, posture COMPLIANT"]
          setup_api_calls:
            - { call: "POST /_clock/set_current_utc", payload: { to_iso8601: "2026-05-01T00:00:00Z" }, as: ContractorAdmin }
            - { call: "POST /facilities", payload: { facility_name: "Over Cap", state_code: "CA", annual_fee_paid_through: "2027-01-01T00:00:00Z", fund_program_election: "PER_OCCURRENCE" }, as: FacilityOwner, as_user_id: "owner-1", captures: { fac: $.data.id } }
            - { call: "POST /tank-systems", payload: { facility_id: "${fac}", tank_tag: "T1", substance: "GASOLINE", capacity_gallons: 8000, installed_on: "2018-01-01T00:00:00Z", tank_construction: "FRP", piping_type: "SUCTION", release_detection_mode: "ATG_INVENTORY" }, as: FacilityOwner, as_user_id: "owner-1", captures: { tank: $.data.id } }
            - { call: "POST /facilities/${fac}/activate", payload: {}, as: FacilityOwner, as_user_id: "owner-1" }
            - { call: "POST /tank-systems/${tank}/place-in-service", payload: {}, as: FacilityOwner, as_user_id: "owner-1" }
            - { call: "POST /release-events", payload: { facility_id: "${fac}", discovered_at: "2026-05-01T08:00:00Z", source_description: "sheen" }, as: FacilityOwner, as_user_id: "owner-1", captures: { rel: $.data.id } }
            - { call: "POST /release-events/${rel}/confirm", payload: {}, as: StateRegulator }
          trigger:
            - call: "POST /fund-claims"
              payload: { facility_id: "${fac}", release_event_id: "${rel}", expense_lines: [{ description: "huge cleanup", amount_cents: 200000000 }] }
              as: FacilityOwner
              as_user_id: "owner-1"
              captures: { err: $.data.error_id }
          assert:
            - "${err} == ERR_FUND_CAP_EXCEEDED (payable round_half_up(199000000 * 0.9) = 179100000 > 100000000 cap; posture gate passed because posture is COMPLIANT)"

      - name: return_to_service_blocked_by_critical_deficiency
        claim_type: violation_to_error
        grounds:
          - errors[ERR_CRITICAL_DEFICIENCY_OPEN]
          - state_machines.TankSystem.TEMPORARILY_CLOSED_to_IN_SERVICE
        distinguishing_aspect: "After a tightness FAIL closes the tank, dismissing the auto-created release is not enough — the still-OPEN CRITICAL deficiency independently blocks return-to-service."
        test_recipe:
          setup: ["Facility ACTIVE; tank was placed IN_SERVICE then auto-closed by a failed TANK_TIGHTNESS test; the SUSPECTED release was DISMISSED; CRITICAL deficiency still OPEN"]
          setup_api_calls:
            - { call: "POST /_clock/set_current_utc", payload: { to_iso8601: "2026-05-01T00:00:00Z" }, as: ContractorAdmin }
            - { call: "POST /facilities", payload: { facility_name: "Critical Gate", state_code: "CA", annual_fee_paid_through: "2027-01-01T00:00:00Z" }, as: FacilityOwner, as_user_id: "owner-1", captures: { fac: $.data.id } }
            - { call: "POST /tank-systems", payload: { facility_id: "${fac}", tank_tag: "T1", substance: "DIESEL", capacity_gallons: 10000, installed_on: "2018-01-01T00:00:00Z", tank_construction: "STEEL", piping_type: "PRESSURIZED", release_detection_mode: "ATG_INVENTORY" }, as: FacilityOwner, as_user_id: "owner-1", captures: { tank: $.data.id } }
            - { call: "POST /facilities/${fac}/activate", payload: {}, as: FacilityOwner, as_user_id: "owner-1" }
            - { call: "POST /tank-systems/${tank}/place-in-service", payload: {}, as: FacilityOwner, as_user_id: "owner-1" }
            - { call: "POST /technicians", payload: { full_name: "TT", endorsements: ["TIGHTNESS_TESTER"], trainer: false }, as: ContractorAdmin, captures: { t_tt: $.data.id } }
            - { call: "POST /service-orders", payload: { facility_id: "${fac}", tank_system_id: "${tank}", service_type: "TANK_TIGHTNESS", line_items: [{ description: "t", qty: 1, unit_price_cents: 60000 }] }, as: ContractorAdmin, captures: { so: $.data.id } }
            - { call: "POST /service-orders/${so}/schedule", payload: { technician_id: "${t_tt}", window_start: "2026-05-02T10:00:00Z", window_end: "2026-05-02T11:00:00Z" }, as: ContractorAdmin }
            - { call: "POST /_clock/set_current_utc", payload: { to_iso8601: "2026-05-02T10:30:00Z" }, as: ContractorAdmin }
            - { call: "POST /service-orders/${so}/start", payload: {}, as: Technician, as_user_id: "${t_tt}" }
            - { call: "POST /service-orders/${so}/results", payload: { readings: { leak_rate_gph: 0.5 } }, as: Technician, as_user_id: "${t_tt}" }
            - { call: "GET /release-events?tank_system_id=${tank}&status=SUSPECTED", as: Any, captures: { rel: "$.data[0].id" } }
            - { call: "POST /release-events/${rel}/dismiss", payload: {}, as: StateRegulator }
          trigger:
            - { call: "POST /tank-systems/${tank}/return-to-service", payload: {}, as: FacilityOwner, as_user_id: "owner-1", captures: { err: $.data.error_id } }
          assert:
            - "${err} == ERR_CRITICAL_DEFICIENCY_OPEN (release cleared but the OPEN CRITICAL deficiency still gates)"

      - name: deficiency_order_correction_from_corrected_rejected
        claim_type: violation_to_error
        grounds:
          - errors[ERR_DEFICIENCY_NOT_OPEN]
          - state_machines.Deficiency
        distinguishing_aspect: "order-correction is defined only from OPEN or ESCALATED; a CORRECTED deficiency rejects a duplicate correction order with ERR_DEFICIENCY_NOT_OPEN."
        test_recipe:
          setup: ["Facility ACTIVE, tank IN_SERVICE with CP component; MAJOR deficiency driven OPEN -> CORRECTION_ORDERED -> CORRECTED"]
          setup_api_calls:
            - { call: "POST /_clock/set_current_utc", payload: { to_iso8601: "2026-05-01T00:00:00Z" }, as: ContractorAdmin }
            - { call: "POST /facilities", payload: { facility_name: "Def States", state_code: "CA", annual_fee_paid_through: "2027-01-01T00:00:00Z" }, as: FacilityOwner, as_user_id: "owner-1", captures: { fac: $.data.id } }
            - { call: "POST /tank-systems", payload: { facility_id: "${fac}", tank_tag: "T1", substance: "DIESEL", capacity_gallons: 10000, installed_on: "2018-01-01T00:00:00Z", tank_construction: "STEEL", piping_type: "PRESSURIZED", release_detection_mode: "ATG_INVENTORY" }, as: FacilityOwner, as_user_id: "owner-1", captures: { tank: $.data.id } }
            - { call: "POST /facilities/${fac}/activate", payload: {}, as: FacilityOwner, as_user_id: "owner-1" }
            - { call: "POST /tank-systems/${tank}/place-in-service", payload: {}, as: FacilityOwner, as_user_id: "owner-1" }
            - { call: "POST /components", payload: { tank_system_id: "${tank}", component_type: "CATHODIC_PROTECTION", install_date: "2018-01-01T00:00:00Z", serial_no: "CP-D" }, as: FacilityOwner, as_user_id: "owner-1", captures: { comp: $.data.id } }
            - { call: "POST /technicians", payload: { full_name: "CP", endorsements: ["CP_TESTER"], trainer: false }, as: ContractorAdmin, captures: { t_cp: $.data.id } }
            - { call: "POST /service-orders", payload: { facility_id: "${fac}", tank_system_id: "${tank}", service_type: "CP_SURVEY", component_id: "${comp}", line_items: [{ description: "cp", qty: 1, unit_price_cents: 40000 }] }, as: ContractorAdmin, captures: { so: $.data.id } }
            - { call: "POST /service-orders/${so}/schedule", payload: { technician_id: "${t_cp}", window_start: "2026-05-02T10:00:00Z", window_end: "2026-05-02T11:00:00Z" }, as: ContractorAdmin }
            - { call: "POST /_clock/set_current_utc", payload: { to_iso8601: "2026-05-02T10:30:00Z" }, as: ContractorAdmin }
            - { call: "POST /service-orders/${so}/start", payload: {}, as: Technician, as_user_id: "${t_cp}" }
            - { call: "POST /service-orders/${so}/results", payload: { readings: { instant_off_mv: -800, polarized_mv: -700, native_mv: -500, valid_contact: true, criterion: "INSTANT_OFF" } }, as: Technician, as_user_id: "${t_cp}" }
            - { call: "GET /deficiencies?source_service_order_id=${so}", as: Any, captures: { d1: "$.data[0].id" } }
            - { call: "POST /deficiencies/${d1}/order-correction", payload: {}, as: FacilityOwner, as_user_id: "owner-1" }
            - { call: "POST /deficiencies/${d1}/mark-corrected", payload: {}, as: FacilityOwner, as_user_id: "owner-1" }
          trigger:
            - { call: "POST /deficiencies/${d1}/order-correction", payload: {}, as: FacilityOwner, as_user_id: "owner-1", captures: { err: $.data.error_id } }
          assert:
            - "${err} == ERR_DEFICIENCY_NOT_OPEN (CORRECTED is past the correction-ordering state)"

      - name: place_in_service_requires_active_facility
        claim_type: violation_to_error
        grounds:
          - errors[ERR_FACILITY_NOT_ACTIVE]
          - state_machines.TankSystem.REGISTERED_to_IN_SERVICE
        distinguishing_aspect: "A tank cannot enter service while its facility is still REGISTERED; ERR_FACILITY_NOT_ACTIVE enforces the parent-state gate."
        test_recipe:
          setup: ["Facility REGISTERED (never activated) with one REGISTERED tank"]
          setup_api_calls:
            - { call: "POST /facilities", payload: { facility_name: "Dormant", state_code: "CA", annual_fee_paid_through: "2027-01-01T00:00:00Z" }, as: FacilityOwner, as_user_id: "owner-1", captures: { fac: $.data.id } }
            - { call: "POST /tank-systems", payload: { facility_id: "${fac}", tank_tag: "T1", substance: "DIESEL", capacity_gallons: 10000, installed_on: "2018-01-01T00:00:00Z", tank_construction: "STEEL", piping_type: "PRESSURIZED", release_detection_mode: "ATG_INVENTORY" }, as: FacilityOwner, as_user_id: "owner-1", captures: { tank: $.data.id } }
          trigger:
            - { call: "POST /tank-systems/${tank}/place-in-service", payload: {}, as: FacilityOwner, as_user_id: "owner-1", captures: { err: $.data.error_id } }
          assert:
            - "${err} == ERR_FACILITY_NOT_ACTIVE"

      - name: order_state_transitions_rejected
        claim_type: violation_to_error
        grounds:
          - errors[ERR_ORDER_NOT_SCHEDULED]
          - errors[ERR_ORDER_NOT_REQUESTED]
          - errors[ERR_ORDER_NOT_IN_PROGRESS]
          - errors[ERR_ORDER_NOT_EDITABLE]
        distinguishing_aspect: "Each service-order action enforces its from-state: start on REQUESTED, second schedule on SCHEDULED, results on SCHEDULED (never started), and PUT on IN_PROGRESS each fail with the specific 409."
        test_recipe:
          setup: ["Facility ACTIVE, tank IN_SERVICE; endorsed technician; one order carried through its lifecycle"]
          setup_api_calls:
            - { call: "POST /_clock/set_current_utc", payload: { to_iso8601: "2026-05-01T00:00:00Z" }, as: ContractorAdmin }
            - { call: "POST /facilities", payload: { facility_name: "Order States", state_code: "CA", annual_fee_paid_through: "2027-01-01T00:00:00Z" }, as: FacilityOwner, as_user_id: "owner-1", captures: { fac: $.data.id } }
            - { call: "POST /tank-systems", payload: { facility_id: "${fac}", tank_tag: "T1", substance: "DIESEL", capacity_gallons: 10000, installed_on: "2018-01-01T00:00:00Z", tank_construction: "STEEL", piping_type: "PRESSURIZED", release_detection_mode: "ATG_INVENTORY" }, as: FacilityOwner, as_user_id: "owner-1", captures: { tank: $.data.id } }
            - { call: "POST /facilities/${fac}/activate", payload: {}, as: FacilityOwner, as_user_id: "owner-1" }
            - { call: "POST /tank-systems/${tank}/place-in-service", payload: {}, as: FacilityOwner, as_user_id: "owner-1" }
            - { call: "POST /technicians", payload: { full_name: "TT", endorsements: ["TIGHTNESS_TESTER"], trainer: false }, as: ContractorAdmin, captures: { t_tt: $.data.id } }
            - { call: "POST /service-orders", payload: { facility_id: "${fac}", tank_system_id: "${tank}", service_type: "TANK_TIGHTNESS", line_items: [{ description: "t", qty: 1, unit_price_cents: 60000 }] }, as: ContractorAdmin, captures: { so: $.data.id } }
          trigger:
            - { call: "POST /service-orders/${so}/start", payload: {}, as: Technician, as_user_id: "${t_tt}", captures: { err_start: $.data.error_id } }
            - { call: "POST /service-orders/${so}/schedule", payload: { technician_id: "${t_tt}", window_start: "2026-05-02T10:00:00Z", window_end: "2026-05-02T11:00:00Z" }, as: ContractorAdmin }
            - { call: "POST /service-orders/${so}/schedule", payload: { technician_id: "${t_tt}", window_start: "2026-05-03T10:00:00Z", window_end: "2026-05-03T11:00:00Z" }, as: ContractorAdmin, captures: { err_sched: $.data.error_id } }
            - { call: "POST /service-orders/${so}/results", payload: { readings: { leak_rate_gph: 0.05 } }, as: Technician, as_user_id: "${t_tt}", captures: { err_res: $.data.error_id } }
            - { call: "POST /_clock/set_current_utc", payload: { to_iso8601: "2026-05-02T10:30:00Z" }, as: ContractorAdmin }
            - { call: "POST /service-orders/${so}/start", payload: {}, as: Technician, as_user_id: "${t_tt}" }
            - { call: "GET /service-orders/${so}", as: Any, captures: { so_v: $.data.version } }
            - { call: "PUT /service-orders/${so}", payload: { expected_service_order_version: "${so_v}", line_items: [{ description: "x", qty: 1, unit_price_cents: 1 }] }, as: ContractorAdmin, captures: { err_put: $.data.error_id } }
          assert:
            - "${err_start} == ERR_ORDER_NOT_SCHEDULED (start on REQUESTED)"
            - "${err_sched} == ERR_ORDER_NOT_REQUESTED (schedule on SCHEDULED)"
            - "${err_res} == ERR_ORDER_NOT_IN_PROGRESS (results before start)"
            - "${err_put} == ERR_ORDER_NOT_EDITABLE (PUT on IN_PROGRESS; state checked before OCC)"

      - name: release_state_transitions_rejected
        claim_type: violation_to_error
        grounds:
          - errors[ERR_RELEASE_NOT_CONFIRMED]
          - errors[ERR_RELEASE_NOT_CLEANUP]
          - state_machines.ReleaseEvent
        distinguishing_aspect: "begin-cleanup requires CONFIRMED and close requires CLEANUP_IN_PROGRESS; both skip-ahead attempts fail with the specific 409."
        test_recipe:
          setup: ["Facility with one SUSPECTED release"]
          setup_api_calls:
            - { call: "POST /_clock/set_current_utc", payload: { to_iso8601: "2026-05-01T00:00:00Z" }, as: ContractorAdmin }
            - { call: "POST /facilities", payload: { facility_name: "Release States", state_code: "CA", annual_fee_paid_through: "2027-01-01T00:00:00Z" }, as: FacilityOwner, as_user_id: "owner-1", captures: { fac: $.data.id } }
            - { call: "POST /release-events", payload: { facility_id: "${fac}", discovered_at: "2026-05-01T08:00:00Z", source_description: "odor" }, as: FacilityOwner, as_user_id: "owner-1", captures: { rel: $.data.id } }
          trigger:
            - { call: "POST /release-events/${rel}/begin-cleanup", payload: {}, as: FacilityOwner, as_user_id: "owner-1", captures: { err_begin: $.data.error_id } }
            - { call: "POST /release-events/${rel}/confirm", payload: {}, as: StateRegulator }
            - { call: "POST /release-events/${rel}/close", payload: {}, as: StateRegulator, captures: { err_close: $.data.error_id } }
          assert:
            - "${err_begin} == ERR_RELEASE_NOT_CONFIRMED (begin-cleanup on SUSPECTED)"
            - "${err_close} == ERR_RELEASE_NOT_CLEANUP (close on CONFIRMED, skipping cleanup)"

      - name: submission_state_transitions_rejected
        claim_type: violation_to_error
        grounds:
          - errors[ERR_SUBMISSION_NOT_SUBMITTED]
          - errors[ERR_SUBMISSION_NOT_DRAFT]
          - state_machines.RegulatorySubmission
        distinguishing_aspect: "accept on a DRAFT submission and a second submit on a SUBMITTED one each fail with the specific 409."
        test_recipe:
          setup: ["Facility ACTIVE, tank IN_SERVICE; one monthly record bundled into a DRAFT submission; reviewer technician"]
          setup_api_calls:
            - { call: "POST /_clock/set_current_utc", payload: { to_iso8601: "2026-05-05T00:00:00Z" }, as: ContractorAdmin }
            - { call: "POST /facilities", payload: { facility_name: "Sub States", state_code: "CA", annual_fee_paid_through: "2027-01-01T00:00:00Z" }, as: FacilityOwner, as_user_id: "owner-1", captures: { fac: $.data.id } }
            - { call: "POST /tank-systems", payload: { facility_id: "${fac}", tank_tag: "T1", substance: "DIESEL", capacity_gallons: 10000, installed_on: "2018-01-01T00:00:00Z", tank_construction: "STEEL", piping_type: "PRESSURIZED", release_detection_mode: "ATG_INVENTORY" }, as: FacilityOwner, as_user_id: "owner-1", captures: { tank: $.data.id } }
            - { call: "POST /facilities/${fac}/activate", payload: {}, as: FacilityOwner, as_user_id: "owner-1" }
            - { call: "POST /tank-systems/${tank}/place-in-service", payload: {}, as: FacilityOwner, as_user_id: "owner-1" }
            - { call: "POST /release-detection-records", payload: { tank_system_id: "${tank}", period_month: "2026-04", readings_summary: { log: "april" } }, as: FacilityOwner, as_user_id: "owner-1", captures: { rec: $.data.id } }
            - { call: "POST /technicians", payload: { full_name: "Rev", endorsements: [], trainer: false }, as: ContractorAdmin, captures: { t_rev: $.data.id } }
            - { call: "POST /submissions", payload: { facility_id: "${fac}", submission_type: "MONTHLY_RELEASE_DETECTION", period_month: "2026-04", release_detection_record_ids: ["${rec}"] }, as: ComplianceReviewer, as_user_id: "${t_rev}", captures: { sub: $.data.id } }
          trigger:
            - { call: "POST /submissions/${sub}/accept", payload: {}, as: StateRegulator, captures: { err_acc: $.data.error_id } }
            - { call: "POST /submissions/${sub}/submit", payload: {}, as: ComplianceReviewer, as_user_id: "${t_rev}" }
            - { call: "POST /submissions/${sub}/submit", payload: {}, as: ComplianceReviewer, as_user_id: "${t_rev}", captures: { err_sub: $.data.error_id } }
          assert:
            - "${err_acc} == ERR_SUBMISSION_NOT_SUBMITTED (accept on DRAFT)"
            - "${err_sub} == ERR_SUBMISSION_NOT_DRAFT (second submit)"

      - name: tank_facility_mismatch_rejected
        claim_type: violation_to_error
        grounds:
          - errors[ERR_TANK_FACILITY_MISMATCH]
          - validations[priority=17]
        distinguishing_aspect: "A service order's tank_system_id must belong to its facility_id; a cross-facility pairing fails with 422 ERR_TANK_FACILITY_MISMATCH."
        test_recipe:
          setup: ["Facilities F1 (owner-1) and F2 (owner-2); tank belongs to F2"]
          setup_api_calls:
            - { call: "POST /facilities", payload: { facility_name: "F1", state_code: "CA", annual_fee_paid_through: "2027-01-01T00:00:00Z" }, as: FacilityOwner, as_user_id: "owner-1", captures: { fac1: $.data.id } }
            - { call: "POST /facilities", payload: { facility_name: "F2", state_code: "CA", annual_fee_paid_through: "2027-01-01T00:00:00Z" }, as: FacilityOwner, as_user_id: "owner-2", captures: { fac2: $.data.id } }
            - { call: "POST /tank-systems", payload: { facility_id: "${fac2}", tank_tag: "T1", substance: "DIESEL", capacity_gallons: 10000, installed_on: "2018-01-01T00:00:00Z", tank_construction: "STEEL", piping_type: "PRESSURIZED", release_detection_mode: "ATG_INVENTORY" }, as: FacilityOwner, as_user_id: "owner-2", captures: { tank2: $.data.id } }
          trigger:
            - call: "POST /service-orders"
              payload: { facility_id: "${fac1}", tank_system_id: "${tank2}", service_type: "TANK_TIGHTNESS", line_items: [{ description: "t", qty: 1, unit_price_cents: 60000 }] }
              as: ContractorAdmin
              captures: { err: $.data.error_id }
          assert:
            - "${err} == ERR_TANK_FACILITY_MISMATCH (tank ${tank2} belongs to facility ${fac2}, not ${fac1})"
