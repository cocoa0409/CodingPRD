    side_effects: ["initializes package_status = DRAFT, funded_count = 0, declined_count = 0"]
  - method: GET
    path: "/alarm-funding/dealer-packages"
    description: "List funding packages"
    roles: [Dealer, FundingAnalyst, ChannelManager, PlatformAdmin]
    code: 200
    input: ["dealer_id?", "package_status?", "limit?", "offset?"]
    output: DealerPackage[]
    side_effects: []
  - method: GET
    path: "/alarm-funding/dealer-packages/{id}"
    description: "Read one funding package"
    roles: [Dealer, FundingAnalyst, ChannelManager, PlatformAdmin]
    code: 200
    input: []
    output: DealerPackage
    side_effects: []
  - method: POST
    path: "/alarm-funding/dealer-packages/{id}/submit"
    description: "Submit a package for funding review"
    roles: [Dealer]
    code: 200
    input: []
    output: DealerPackage
    side_effects: ["stamps submitted_at from the logical clock", "increments DealerPackage.version by 1"]
  - method: POST
    path: "/alarm-funding/dealer-packages/{id}/withdraw"
    description: "Withdraw a package from review back to draft (negotiation round)"
    roles: [Dealer]
    code: 200
    input: []
    output: DealerPackage
    side_effects: ["clears submitted_at", "increments DealerPackage.version by 1"]
  - method: POST
    path: "/alarm-funding/dealer-packages/{id}/approve"
    description: "Approve a package and set its funding window"
    roles: [FundingAnalyst]
    code: 200
    input: [expected_dealer_package_version]
    output: DealerPackage
    side_effects: ["runs allowed_holdback_rate_floor_ceiling_binding", "runs package_funding_posture and writes the returned posture and holdback into package_holdback_cents", "sets expires_at = now + funding_window_days", "increments DealerPackage.version by 1"]
  - method: POST
    path: "/alarm-funding/dealer-packages/{id}/fund"
    description: "Fund the package; every child contract in PENDING_VALIDATION is funded or frozen"
    roles: [FundingAnalyst]
    code: 200
    input: [expected_dealer_package_version]
    output: DealerPackage
    side_effects: ["runs the contract funding cascade over every child in PENDING_VALIDATION", "runs package_funding_posture", "sets closed_at from the logical clock", "increments DealerPackage.version by 1"]
  - method: POST
    path: "/alarm-funding/dealer-packages/{id}/decline"
    description: "Decline a package under review"
    roles: [FundingAnalyst]
    code: 200
    input: []
    output: DealerPackage
    side_effects: ["cascades a decline to every child contract still in PENDING_VALIDATION", "sets closed_at from the logical clock", "increments DealerPackage.version by 1"]
  - method: POST
    path: "/alarm-funding/dealer-packages/{id}/contracts"
    description: "Declare a contract on a package; the protected-premises address is supplied inline and the monitoring account is created UNPROVISIONED"
    roles: [Dealer, FundingAnalyst]
    code: 201
    input: [customer_id, equipment_config_code, credit_score, contract_term_months, monthly_monitoring_cents, "financed_charge_at_apr_cents?", premises_address_line, premises_city, premises_state_code, premises_postal_code, "installation_scheduled_at?", "installation_duration_minutes?", "installation_engineer_id?"]
    output: Contract
    side_effects: ["creates the contract in PENDING_VALIDATION", "creates its monitoring account in UNPROVISIONED", "creates an installation in SCHEDULED when installation_scheduled_at is supplied", "increments DealerPackage.submitted_contract_count and DealerPackage.version by 1"]

