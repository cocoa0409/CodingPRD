        distinguishing_aspect: "entity_backed Passenger identity: X-User-ID = passenger A reading passenger B's booking -> 403 ERR_FORBIDDEN_OWNERSHIP."
        test_recipe:
          setup: ["passengers A and B; booking owned by B"]
          setup_api_calls:
