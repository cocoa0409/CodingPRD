      - name: embargo_intervals_are_closed_and_carry_a_24_hour_cooling_gap
        grounds:
          - validations.priority_43_ERR_EMBARGO_WINDOW_CONFLICT
          - global_constants.MIN_RECLAIM_HOURS
          - entities.EmbargoOrder.fields.effective_from
          - entities.EmbargoOrder.fields.effective_to
          - endpoints.POST_car-hire_embargo-orders
        distinguishing_aspect: |
          For the same (junction_id, car_type_id), EmbargoOrder intervals are CLOSED at
          both ends AND separated by a mandatory MIN_RECLAIM_HOURS = 24-hour cooling gap.
          With E1 = [2026-08-20T00:00:00Z, 2026-08-22T00:00:00Z] ACTIVE: E2 starting
          exactly at E1's effective_to conflicts (closed endpoints touch — the opposite of
          the reclaim rule in this same §1.8 rule id), E3 starting 12 hours after E1's
          effective_to conflicts on the cooling gap alone even though the intervals are
          disjoint, and E4 starting exactly 24 hours after E1's effective_to is accepted
          because the gap is measured with a strict "within".
        test_recipe:
          setup:
            - "Railroads BN and CX ACTIVE; car type XM; junction JCT-CHI connects CX and BN; the clock reads 2026-08-20T00:00:00Z."
            - "CX issues E1 for (JCT-CHI, XM) effective 2026-08-20T00:00:00Z through 2026-08-22T00:00:00Z; it is ACTIVE for every later filing."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-08-20T00:00:00Z" }
              as: ClearinghouseAdmin
            - call: "POST /car-hire/railroads"
