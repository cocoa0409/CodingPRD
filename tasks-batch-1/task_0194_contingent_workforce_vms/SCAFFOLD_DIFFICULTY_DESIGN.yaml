  # ===========================================================================
  - rule_id: compensating_invariant
    instances:
      - name: worker_tenure_days_conserved_across_offboard
        grounds:
          - calculations.worker_tenure_rollup
          - state_machines.Assignment.ACTIVE_to_ENDED
          - entities.WorkerProfile.fields.cumulative_engaged_days
          - entities.Assignment.fields.engaged_days
        distinguishing_aspect: |
          Conserved quantity = engaged calendar DAYS. Invariant pinned as
          WorkerProfile.cumulative_engaged_days == sum over the worker's assignments
          of Assignment.engaged_days. The forward action advance_clock accrues days
          and the compensating offboard freezes engaged_days; after offboard the
          named quantity equals the realized inclusive count (90 for 2026-01-01..
          2026-03-31) with NO drift.
        test_recipe:
          setup:
            - "Program limit 3650. Worker hired ACTIVE [2026-01-01, 2026-12-01], clock advanced to 2026-03-31 (90 inclusive days), then offboarded"
          setup_api_calls:
            - call: "POST /vms/programs"
              payload: { name: "P", client_name: "C", default_markup_pct: 0.45, max_markup_pct: 0.60, coemployment_tenure_limit_days: 3650, tenure_warning_threshold_days: 3000 }
              as: ProgramManager
              captures: { prog_id: $.data.id }
            - call: "POST /vms/programs/${prog_id}/_clock/set"
              payload: { to_iso8601: "2026-01-01T00:00:00.000Z" }
              as: ProgramManager
            - call: "POST /vms/suppliers"
              payload: { program_id: "${prog_id}", name: "Acme", tier: 1 }
              as: ProgramManager
              captures: { sup_id: $.data.id }
            - call: "POST /vms/workers"
              payload: { program_id: "${prog_id}", full_name: "W", national_id_hash: "h1" }
              as: ProgramManager
              captures: { wkr_id: $.data.id }
            - call: "POST /vms/requisitions"
              payload: { program_id: "${prog_id}", title: "Eng", openings: 1, max_pay_rate_cents: 20000 }
              as: ProgramManager
              captures: { req_id: $.data.id }
            - call: "POST /vms/requisitions/${req_id}/distribute"
              payload: { supplier_ids: ["${sup_id}"] }
              as: ProgramManager
              captures: { req_v: $.data.version }
            - call: "POST /vms/submittals"
              payload: { requisition_id: "${req_id}", supplier_id: "${sup_id}", worker_profile_id: "${wkr_id}", pay_rate_cents: 8000 }
              as: Supplier
              as_user_id: "${sup_id}"
              captures: { sub_id: $.data.id }
            - call: "POST /vms/submittals/${sub_id}/shortlist"
              payload: {}
              as: HiringManager
            - call: "POST /vms/submittals/${sub_id}/start_interview"
              payload: {}
              as: HiringManager
            - call: "POST /vms/submittals/${sub_id}/propose_rate"
              payload: { pay_rate_cents: 8000 }
              as: Supplier
              as_user_id: "${sup_id}"
            - call: "POST /vms/submittals/${sub_id}/offer"
              payload: {}
              as: HiringManager
            - call: "POST /vms/submittals/${sub_id}/hire"
              payload: { expected_requisition_version: "${req_v}", start_date: "2026-01-01T00:00:00.000Z", planned_end_date: "2026-12-01T00:00:00.000Z" }
              as: ProgramManager
              captures: { asg_id: $.data.id }
            - call: "POST /vms/programs/${prog_id}/advance_clock"
              payload: { to_iso8601: "2026-03-31T00:00:00.000Z" }
              as: ProgramManager
          trigger:
            - call: "POST /vms/assignments/${asg_id}/offboard"
              payload: {}
              as: ProgramManager
              captures: { eng_days: $.data.engaged_days, eng_status: $.data.engagement_status }
            - call: "GET /vms/workers/${wkr_id}"
              payload: {}
              as: ProgramManager
              captures: { cum: $.data.cumulative_engaged_days }
          assert:
            - "Assignment.${asg_id}.engaged_days == 90"
            - "Assignment.${asg_id}.actual_end_date == 2026-03-31T00:00:00.000Z"
            - "WorkerProfile.${wkr_id}.cumulative_engaged_days == 90 (equals the single assignment's engaged_days; no drift)"

      - name: sow_invoiced_value_conserved_across_milestone_reject_restart
        grounds:
          - state_machines.Milestone.SUBMITTED_to_REJECTED
          - state_machines.Milestone.ACCEPTED_to_INVOICED
          - state_machines.StatementOfWork.ACTIVE_to_COMPLETED
          - entities.StatementOfWork.fields.invoiced_value_cents
        distinguishing_aspect: |
          Conserved quantity = invoiced MONEY (a different conserved quantity than
          days). Invariant pinned as StatementOfWork.invoiced_value_cents ==
          sum(milestone_amount_cents over INVOICED milestones). The forward submit
          and its compensating reject leave invoiced_value_cents unchanged at 0
          (reject touches no INVOICED milestone); after a later accept+invoice it
          equals exactly the one invoiced amount 40000 — no double counting from the
          rejected lap.
        test_recipe:
          setup:
            - "ACTIVE SOW total 100000 with one milestone amount 40000; milestone submitted then REJECTED, restarted, resubmitted, accepted, invoiced"
          setup_api_calls:
            - call: "POST /vms/programs"
              payload: { name: "P", client_name: "C", default_markup_pct: 0.45, max_markup_pct: 0.60, coemployment_tenure_limit_days: 180, tenure_warning_threshold_days: 120 }
              as: ProgramManager
              captures: { prog_id: $.data.id }
            - call: "POST /vms/suppliers"
              payload: { program_id: "${prog_id}", name: "Acme", tier: 1 }
              as: ProgramManager
              captures: { sup_id: $.data.id }
            - call: "POST /vms/statements-of-work"
              payload: { program_id: "${prog_id}", supplier_id: "${sup_id}", title: "Build", total_value_cents: 100000 }
              as: ProgramManager
              captures: { sow_id: $.data.id }
            - call: "POST /vms/milestones"
              payload: { statement_of_work_id: "${sow_id}", name: "M1", milestone_amount_cents: 40000, sequence: 1 }
              as: ProgramManager
              captures: { m1: $.data.id }
            - call: "POST /vms/statements-of-work/${sow_id}/activate"
              payload: {}
              as: ProgramManager
            - call: "POST /vms/milestones/${m1}/start"
              payload: {}
              as: Supplier
              as_user_id: "${sup_id}"
            - call: "POST /vms/milestones/${m1}/submit"
              payload: {}
              as: Supplier
              as_user_id: "${sup_id}"
            - call: "POST /vms/milestones/${m1}/reject"
              payload: {}
              as: HiringManager
            - call: "GET /vms/statements-of-work/${sow_id}"
              payload: {}
              as: ProgramManager
              captures: { inv_after_reject: $.data.invoiced_value_cents }
            - call: "POST /vms/milestones/${m1}/start"
              payload: {}
              as: Supplier
              as_user_id: "${sup_id}"
            - call: "POST /vms/milestones/${m1}/submit"
              payload: {}
              as: Supplier
              as_user_id: "${sup_id}"
            - call: "POST /vms/milestones/${m1}/accept"
              payload: {}
              as: HiringManager
          trigger:
            - call: "POST /vms/milestones/${m1}/invoice"
              payload: {}
              as: Finance
            - call: "GET /vms/statements-of-work/${sow_id}"
              payload: {}
              as: ProgramManager
              captures: { inv_final: $.data.invoiced_value_cents, sow_status: $.data.status }
          assert:
            - "invoiced_value_cents was 0 immediately after the REJECT (reject leaves the conserved money quantity unchanged)"
            - "StatementOfWork.${sow_id}.invoiced_value_cents == 40000 after invoice (single count, no drift from the rejected lap)"
            - "StatementOfWork.${sow_id}.status == COMPLETED"
