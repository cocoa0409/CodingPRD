      - name: submit_campaign_wrong_state_and_brand_not_verified
        grounds:
          - validations[priority=7]
          - validations[priority=9]
          - errors[ERR_INVALID_STATE]
          - errors[ERR_BRAND_NOT_VERIFIED]
        distinguishing_aspect: |
          Pair state(7) vs business_referential(9): a campaign in PENDING_REVIEW
          (wrong from-state for submit) whose brand is only PENDING_VERIFICATION
          (unverified) violates both; priority 7 wins, so the response is
          ERR_INVALID_STATE, not ERR_BRAND_NOT_VERIFIED.
        test_recipe:
          setup:
            - "Brand created and submitted but NOT verified (PENDING_VERIFICATION)"
            - "Campaign created under that brand while DRAFT, then artificially... rather: campaign is submitted once (blocked by brand gate) — instead: brand verified, campaign submitted (now PENDING_REVIEW), then brand revoke is NOT possible pre-verification; use second brand unverified is impossible for same campaign. Final setup: campaign PENDING_REVIEW under verified brand; second submit attempt while PENDING_REVIEW violates state; to also violate brand gate, brand is revoked first."
          setup_api_calls:
            - call: "POST /messaging/accounts"
              payload: { name: "Acme", plan_tier: "PREMIUM", country_code: "US" }
              as: PlatformAdmin
              captures: { acct: $.data.id }
            - call: "POST /messaging/accounts/${acct}/brands"
