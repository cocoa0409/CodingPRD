scenario: "2261. Airline Loyalty Partner & Co-Brand Program Economics (airline loyalty program): mile sale agreements with the co-brand card issuer including price per mile, volume commitments and term, earning structures across flight, card spend and partner activity with promotional multipliers, award seat inventory management with dynamic pricing and capacity controls by cabin, partner airline award pricing, settlement rates and reciprocity terms, elite status qualification, rollover and status match program governance, breakage and deferred revenue accounting for outstanding miles, program change communication with grandfathering and member reaction risk, fraud detection on account takeover and mile brokering"
domain_name: airline-loyalty-partner-co-brand
api_prefix: ""   # flat topology: every business collection is a root-level path (/loyalty-programs, /member-accounts, ...); test-driving endpoints live under /_clock and /_ops

complexity_profile:
  primary_archetype: ledger_reconciliation
  secondary_archetype: multi_party_negotiation
  complexity_layers:
    - dual_variant_calculation
    - cascading_side_effects
    - optimistic_concurrency
    - rate_threshold_triggers

  entity_topology: flat
  state_machine_shape: cyclic
  relationship_patterns:
    - one_to_many
    - self_referential
    - cross_aggregate
  role_model: segregation_of_duties
  consistency_model: immediate

  difficulty_level: beyond_expert
  notes: |
    13 entities / 66 endpoints / 46 error codes / 8 calculations / 9 state machines.
    Density comes from four tightly coupled ledgers that must stay mutually consistent:
      (1) mile-sale economics: agreement tier schedule -> per-order provisional price
          -> per-slice-rounded final price at invoice -> deferred revenue in cents;
      (2) member mile liability: earning with tier + promotional stacking -> mile
          balance -> award redemption -> breakage recognition against deferred revenue;
      (3) award seat inventory: authorized seats -> held/confirmed -> load factor ->
          demand multiplier -> the very price the next booking is quoted at;
      (4) governance: negotiation rounds, segregation of duties on ratification and
          fraud adjudication, program-change reaction risk, and an accounting-period
          lock that freezes ledger postings.
    Every one of the four ledgers is reachable from at least two of the others, so a
    single fraud substantiation or agreement ratification propagates five hops deep.

response_envelope:
  success: |
    { "meta": { "api_request_id": "req_xxx", "api_request_timestamp": "ISO8601" },
      "response_type": "object" | "array", "data": {} }
  error: |
    { "meta": { ... }, "response_type": "error",
      "data": { "error_id": "ERR_XXX", "message": "..." } }
  pagination_fields: ["limit", "offset", "total_count", "has_more"]
  pagination_defaults: { limit: 10, min: 1, max: 100, offset: 0 }

# =====================================================================
# §1.1 Entity-Relationship Table
# =====================================================================
entities:

  - name: LoyaltyProgram
    parent: null
    common_fields: true
    fields:
      - name: name
        type: string
        source: input
        description: Program display name.
        constraints: non-empty, max 120 chars
      - name: currency_code
        type: string
        source: input
        description: Settlement currency for all cent-denominated fields.
        default: "USD"
        constraints: ISO-4217 3-letter code
      - name: current_period
        type: string
        source: input
        description: Accounting period the program is currently posting into.
        default: "2026-08"
        constraints: "YYYY-MM"
      - name: breakage_policy_mode
        type: enum
        source: input
        description: Default breakage algorithm used when a DeferredRevenuePosting omits `method`.
        default: HISTORICAL_ATTRITION
        constraints: "one of {HISTORICAL_ATTRITION, FORWARD_EXPECTATION}"
      - name: saver_share_default_bps
        type: integer
        source: input
        description: Default share of authorized seats reservable at SAVER fare, in basis points.
        default: 3000
        constraints: 0..10000
      - name: revenue_recognition_state
        type: enum
        source: system
        description: Accounting-period posture. Gates mile postings and deferred-revenue postings.
        default: OPEN
        constraints: "one of {OPEN, CLOSING, LOCKED}"
      - name: outstanding_miles
        type: integer
        source: computed
        description: "Member-held mile liability: sum of MileTransaction.total_miles over every MileTransaction whose member belongs to this program (all txn_type values, signed). Recomputed on every MileTransaction insert."
        default: 0
      - name: deferred_revenue_cents
        type: integer
        source: computed
        description: Unrecognized cash received from co-brand mile sales. Credited on MilePurchaseOrder issue, adjusted by volume true-up at invoice, debited by breakage recognition.
        default: 0
      - name: last_breakage_rate_bps
        type: integer
        source: computed
        description: breakage_rate_bps of the most recent DeferredRevenuePosting for this program, ordered by created_at ASC (last row wins).
        default: 0
      - name: lifetime_breakage_income_cents
        type: integer
        source: computed
        description: Running sum of breakage_income_cents across every DeferredRevenuePosting for this program.
        default: 0

  - name: CoBrandIssuer
    parent: LoyaltyProgram
    common_fields: true
    fields:
      - name: program_id
        type: string
        source: input
        description: FK -> LoyaltyProgram.id
      - name: name
        type: string
        source: input
        description: Card issuer legal name.
        constraints: non-empty
      - name: annual_mile_purchase_cap_miles
        type: integer
        source: input
        description: Hard ceiling on miles the issuer may commit to across all RATIFIED/ACTIVE agreements.
        constraints: ">= 1"
      - name: aggregate_committed_miles
        type: integer
        source: computed
        description: "Sum of MileSaleAgreement.committed_volume_miles over this issuer's agreements whose status IN {RATIFIED, ACTIVE}. Recomputed on every agreement ratify / activate / terminate / expire."
        default: 0
      - name: status
        type: enum
        source: system
        description: "Trading posture. SUSPENDED blocks new agreement submission, agreement activation and new mile purchase orders. A ratification sets status = SUSPENDED with suspension_reason = CAP_BREACH when the recomputed aggregate_committed_miles >= round_half_up(annual_mile_purchase_cap_miles * ISSUER_UTILIZATION_ALERT_BPS / 10000), where ISSUER_UTILIZATION_ALERT_BPS = 9000 (90% utilization, inclusive lower bound)."
        default: ACTIVE
        constraints: "one of {ACTIVE, SUSPENDED}"
      - name: suspension_reason
        type: enum
        source: system
        description: Why the issuer was suspended.
        default: NONE
        constraints: "one of {NONE, CAP_BREACH}"

  - name: MileSaleAgreement
    parent: CoBrandIssuer
    common_fields: true
    fields:
      - name: issuer_id
        type: string
        source: input
        description: FK -> CoBrandIssuer.id
      - name: supersedes_agreement_id
        type: string
        source: input
        description: FK -> MileSaleAgreement.id; null for a first-generation agreement. When set, ratifying this agreement terminates the target.
        default: null
      - name: term_start_date
        type: string
        source: input
        description: First date of the agreement term (inclusive).
        constraints: "YYYY-MM-DD"
      - name: term_end_date
        type: string
        source: input
        description: Last date of the agreement term (inclusive).
        constraints: "YYYY-MM-DD; must be > term_start_date"
      - name: committed_volume_miles
        type: integer
        source: input
        description: Miles the issuer commits to purchase over the term.
        constraints: ">= 1"
      - name: tier_schedule
        type: array
        source: input
        description: "Volume price tiers, each { threshold_miles: integer, price_per_mile_centicents: integer }. price is in hundredths of a cent per mile (160 = 1.60 cents/mile)."
        constraints: ">= 1 entry; entry[0].threshold_miles == 0; threshold_miles strictly increasing; price_per_mile_centicents strictly decreasing"
      - name: status
        type: enum
        source: system
        description: Negotiation and lifecycle state.
        default: DRAFT
        constraints: "one of {DRAFT, ISSUER_REVIEW, COUNTERED, RATIFIED, ACTIVE, EXPIRED, TERMINATED}"
      - name: negotiation_round
        type: integer
        source: system
        description: Increments by 1 each time a COUNTERED agreement is revised back to DRAFT.
        default: 1
      - name: countered_price_per_mile_centicents
        type: integer
        source: system
        description: Price the issuer countered with on the most recent counter; null until first counter.
        default: null
      - name: countered_committed_volume_miles
        type: integer
        source: system
        description: Volume the issuer countered with on the most recent counter; null until first counter.
        default: null
      - name: drawn_miles
        type: integer
        source: computed
        description: "Sum of order_miles over this agreement's MilePurchaseOrder rows whose fulfillment_status == ISSUED. Decremented when an order is reversed."
        default: 0
      - name: prepayment_balance_miles
        type: integer
        source: computed
        description: Issuer-held miles bought but not yet distributed to members. Credited on order issue, debited on order reverse, and transferred in full from a superseded agreement at ratification.
        default: 0
      - name: negotiated_by_user_id
        type: string
        source: system
        description: X-User-ID of the PartnerManager who created (or last revised) the agreement. Segregation of duties compares this against the ratifier.
      - name: ratified_by_user_id
        type: string
        source: system
        description: X-User-ID of the ContractsOfficer who ratified the agreement; null before ratification.
        default: null

  - name: MilePurchaseOrder
    parent: MileSaleAgreement
    common_fields: true
    fields:
      - name: agreement_id
        type: string
        source: input
        description: FK -> MileSaleAgreement.id
      - name: order_miles
        type: integer
        source: input
        description: Miles the issuer is buying on this order.
        constraints: ">= 1"
      - name: drawn_miles_before
        type: integer
        source: system
        description: Snapshot of MileSaleAgreement.drawn_miles at the instant this order was created. Both pricing variants are anchored on this snapshot, never on the live value.
      - name: provisional_tier_price_centicents
        type: integer
        source: computed
        description: Single tier price selected by drawn_miles_before (PROVISIONAL_AT_ORDER variant of mile_purchase_order_pricing).
      - name: gross_amount_cents
        type: integer
        source: computed
        description: PROVISIONAL_AT_ORDER amount, stamped at order creation.
      - name: final_amount_cents
        type: integer
        source: computed
        description: FINAL_AT_INVOICE amount from per-slice progressive tier allocation; null until invoiced.
        default: null
      - name: volume_true_up_cents
        type: integer
        source: computed
        description: final_amount_cents - gross_amount_cents; 0 until invoiced. May be negative.
        default: 0
      - name: net_amount_cents
        type: integer
        source: computed
        description: Amount actually invoiced (equals final_amount_cents); null until invoiced.
        default: null
      - name: fulfillment_status
        type: enum
        source: system
        description: Mile-delivery dimension; evolves independently of settlement_status.
        default: PENDING
        constraints: "one of {PENDING, ISSUED, REVERSED}"
      - name: settlement_status
        type: enum
        source: system
        description: Cash dimension; evolves independently of fulfillment_status.
        default: PENDING
        constraints: "one of {PENDING, INVOICED, SETTLED, WRITTEN_OFF}"
      - name: posted_period
        type: string
        source: system
        description: LoyaltyProgram.current_period captured at invoice time; null until invoiced.
        default: null
      - name: reversal_reason
        type: string
        source: system
        description: Free-text reason captured when the order is reversed; null otherwise.
        default: null

  - name: MemberAccount
    parent: LoyaltyProgram
    common_fields: true
    fields:
      - name: program_id
        type: string
        source: input
        description: FK -> LoyaltyProgram.id
      - name: external_member_ref
        type: string
        source: input
        description: Airline-side member number.
        constraints: unique within program_id
      - name: home_region
        type: enum
        source: input
        description: Member home region.
        constraints: "one of {AMER, EMEA, APAC}"
      - name: cycle_year
        type: integer
        source: input
        description: Elite qualification cycle year currently accumulating.
        default: 2026
      - name: rollover_carried_in
        type: integer
        source: input
        description: Qualifying miles rolled over from the prior cycle; added to qualifying_miles_ytd for tier evaluation.
        default: 0
      - name: elite_tier
        type: enum
        source: system
        description: Current elite tier. Drives earn bonus and award mileage discount.
        default: BASE
        constraints: "one of {BASE, SILVER, GOLD, PLATINUM}"
      - name: security_state
        type: enum
        source: system
        description: Fraud posture dimension; evolves independently of elite_tier, status_match_state and qualification_state.
        default: NORMAL
        constraints: "one of {NORMAL, WATCH, FROZEN, CLOSED}"
      - name: status_match_state
        type: enum
        source: system
        description: Status-match governance dimension.
        default: NONE
        constraints: "one of {NONE, TRIAL, CONFIRMED, LAPSED}"
      - name: status_match_tier
        type: enum
        source: system
        description: Tier granted by the status match; null when status_match_state == NONE.
        default: null
        constraints: "one of {SILVER, GOLD, PLATINUM} or null"
      - name: status_match_expires_at
        type: datetime
        source: system
        description: End of the status-match trial window; null when status_match_state == NONE.
        default: null
      - name: qualification_state
        type: enum
        source: system
        description: Qualification-cycle dimension; evolves independently of security_state and status_match_state.
        default: ACCUMULATING
        constraints: "one of {ACCUMULATING, CLOSED, RESTATED}"
      - name: qualifying_miles_ytd
        type: integer
        source: computed
        description: Sum of MileTransaction.qualifying_miles_credited for this member over the current cycle_year.
        default: 0
      - name: qualifying_segments_ytd
        type: integer
        source: computed
        description: Sum of MileTransaction.segments for this member over the current cycle_year.
        default: 0
      - name: qualifying_spend_cents_ytd
        type: integer
        source: computed
        description: Sum of MileTransaction.qualifying_spend_cents for this member over the current cycle_year.
        default: 0
      - name: rollover_carried_out
        type: integer
        source: computed
        description: Qualifying miles above the awarded tier threshold, capped at ROLLOVER_CAP_MILES; stamped at cycle close.
        default: 0
      - name: awarded_tier_at_close
        type: enum
        source: system
        description: Tier computed by elite_qualification_and_rollover at the last cycle close; null until closed.
        default: null
        constraints: "one of {BASE, SILVER, GOLD, PLATINUM} or null"
      - name: mile_balance
        type: integer
        source: computed
        description: Sum of MileTransaction.total_miles for this member (signed). Never negative.
        default: 0
      - name: lifetime_miles
        type: integer
        source: computed
        description: Sum of MileTransaction.total_miles for this member restricted to txn_type IN {FLIGHT_EARN, CARD_SPEND_EARN, PARTNER_EARN}.
        default: 0
      - name: risk_score
        type: integer
        source: computed
        description: detection_score of the most recent FraudCase for this member, ordered by created_at ASC (last row wins).
        default: 0

  - name: MileTransaction
    parent: MemberAccount
    common_fields: false
    fields:
      - name: member_id
        type: string
        source: input
        description: FK -> MemberAccount.id
      - name: promotion_id
        type: string
        source: input
        description: FK -> PromotionCampaign.id; null when no promotion is applied.
        default: null
      - name: award_booking_id
        type: string
        source: input
        description: FK -> AwardBooking.id; set on REDEEM rows created by ticketing and on REVERSAL rows created by refund.
        default: null
      - name: reverses_transaction_id
        type: string
        source: input
        description: FK -> MileTransaction.id; set on REVERSAL rows to name the row being undone.
        default: null
      - name: txn_type
        type: enum
        source: input
        description: Ledger row kind.
        constraints: "one of {FLIGHT_EARN, CARD_SPEND_EARN, PARTNER_EARN, REDEEM, REVERSAL, EXPIRY, ADJUSTMENT}"
      - name: base_miles
        type: integer
        source: input
        description: "Channel base miles for earn rows; magnitude for REDEEM/EXPIRY/ADJUSTMENT rows (always supplied non-negative; the sign is applied by the calculation). Ignored for CARD_SPEND_EARN, where base miles are derived from qualifying_spend_cents."
        default: 0
        constraints: ">= 0"
      - name: qualifying_spend_cents
        type: integer
        source: input
        description: Card spend backing a CARD_SPEND_EARN row.
        default: 0
        constraints: ">= 0"
      - name: segments
        type: integer
        source: input
        description: Flight segments credited by this row.
        default: 0
        constraints: ">= 0"
      - name: activity_date
        type: string
        source: input
        description: Date the underlying activity occurred; drives promotion-window eligibility and trailing accounting windows.
        constraints: "YYYY-MM-DD"
      - name: elite_tier_at_earn
        type: enum
        source: system
        description: MemberAccount.elite_tier snapshot at insert time.
        constraints: "one of {BASE, SILVER, GOLD, PLATINUM}"
      - name: tier_bonus_miles
        type: integer
        source: computed
        description: Elite-tier bonus component of the earn (0 for non-earn rows and for EXCLUSIVE promotion stacking).
        default: 0
      - name: promo_multiplier_bps
        type: integer
        source: computed
        description: Promotional multiplier actually applied, in basis points (10000 = 1.0x).
        default: 10000
      - name: stacking_mode_applied
        type: enum
        source: computed
        description: Stacking mode taken from the applied campaign; null when promotion_id is null.
        default: null
        constraints: "one of {EXCLUSIVE, ADDITIVE, MULTIPLICATIVE} or null"
      - name: bonus_miles
        type: integer
        source: computed
        description: Promotional bonus component after campaign-cap and per-member-cap clamping.
        default: 0
      - name: total_miles
        type: integer
        source: computed
        description: "Signed ledger delta: +(base + tier_bonus + bonus) for earn rows, -(magnitude) for REDEEM/EXPIRY, and the compensating sign for REVERSAL/ADJUSTMENT."
      - name: qualifying_miles_credited
        type: integer
        source: computed
        description: Elite-qualifying miles this row contributes; excludes tier bonus and promotional bonus.
        default: 0
      - name: posted_period
        type: string
        source: system
        description: LoyaltyProgram.current_period at insert time.

  - name: PromotionCampaign
    parent: LoyaltyProgram
    common_fields: true
    fields:
      - name: program_id
        type: string
        source: input
        description: FK -> LoyaltyProgram.id
      - name: code
        type: string
        source: input
        description: Campaign code.
        constraints: unique within program_id
      - name: earn_channel
        type: enum
        source: input
        description: Channel the multiplier applies to.
        constraints: "one of {FLIGHT, CARD_SPEND, PARTNER}"
      - name: multiplier_bps
        type: integer
        source: input
        description: Promotional multiplier in basis points.
        constraints: ">= 10000 and <= 50000"
      - name: stacking_mode
        type: enum
        source: input
        description: How the multiplier composes with the elite tier bonus.
        constraints: "one of {EXCLUSIVE, ADDITIVE, MULTIPLICATIVE}"
      - name: bonus_cap_miles
        type: integer
        source: input
        description: Program-wide ceiling on bonus_miles this campaign may award. Null means unbounded.
        default: null
        constraints: ">= 0"
      - name: accrued_bonus_miles
        type: integer
        source: computed
        description: Sum of MileTransaction.bonus_miles across rows whose promotion_id == this campaign.
        default: 0
      - name: window_start
        type: datetime
        source: input
        description: Campaign window start, INCLUSIVE.
      - name: window_end
        type: datetime
        source: input
        description: Campaign window end, EXCLUSIVE.
      - name: status
        type: enum
        source: system
        description: Campaign lifecycle.
        default: SCHEDULED
        constraints: "one of {SCHEDULED, LIVE, ENDED, CANCELLED}"
      - name: cancellation_reason
        type: string
        source: system
        description: Reason captured when the campaign is cancelled; null otherwise.
        default: null

  - name: AwardInventoryWindow
    parent: LoyaltyProgram
    common_fields: true
    fields:
      - name: program_id
        type: string
        source: input
        description: FK -> LoyaltyProgram.id
      - name: route_code
        type: string
        source: input
        description: Route the inventory belongs to (e.g. "JFK-LHR").
        constraints: non-empty
      - name: cabin
        type: enum
        source: input
        description: Cabin the inventory is authorized in.
        constraints: "one of {ECONOMY, PREMIUM, BUSINESS, FIRST}"
      - name: window_start_date
        type: string
        source: input
        description: First travel date covered, INCLUSIVE.
        constraints: "YYYY-MM-DD"
      - name: window_end_date
        type: string
        source: input
        description: Last travel date covered, INCLUSIVE.
        constraints: "YYYY-MM-DD; must be >= window_start_date"
      - name: authorized_seats
        type: integer
        source: input
        description: Total award seats authorized for the window across all fare classes.
        constraints: ">= 0"
      - name: saver_seat_share_bps
        type: integer
        source: input
        description: Share of authorized_seats reservable at SAVER fare, in basis points. Defaults to the program's saver_share_default_bps when omitted.
        default: null
        constraints: 0..10000
      - name: seats_held
        type: integer
        source: computed
        description: Seats occupied by AwardBooking rows in status HELD.
        default: 0
      - name: seats_confirmed
        type: integer
        source: computed
        description: Seats occupied by AwardBooking rows in status TICKETED.
        default: 0
      - name: saver_seats_consumed
        type: integer
        source: computed
        description: "Seats occupied by AwardBooking rows whose fare_class == SAVER and status IN {HELD, TICKETED}."
        default: 0
      - name: load_factor_bps
        type: integer
        source: computed
        description: "round_half_up(10000 * (seats_held + seats_confirmed) / authorized_seats); 0 when authorized_seats == 0."
        default: 0
      - name: capacity_control_state
        type: enum
        source: system
        description: Derived capacity posture; may also be pinned manually by ProgramAdmin, in which case later recomputes still overwrite it.
        default: OPEN
        constraints: "one of {OPEN, CONSTRAINED, CLOSED}"
      - name: demand_multiplier_bps
        type: integer
        source: computed
        description: Award-price demand multiplier derived from load_factor_bps at the last recompute.
        default: 9000

  - name: AwardBooking
    parent: MemberAccount
    common_fields: true
    fields:
      - name: member_id
        type: string
        source: input
        description: FK -> MemberAccount.id
      - name: window_id
        type: string
        source: input
        description: FK -> AwardInventoryWindow.id
      - name: partner_airline_id
        type: string
        source: input
        description: FK -> PartnerAirline.id; null for own-metal awards.
        default: null
      - name: travel_date
        type: string
        source: input
        description: Travel date; must fall inside the window's inclusive date range.
        constraints: "YYYY-MM-DD"
      - name: seats
        type: integer
        source: input
        description: Seats requested.
        constraints: 1..9
      - name: fare_class
        type: enum
        source: input
        description: Award fare class.
        constraints: "one of {SAVER, FLEX}"
      - name: chart_miles_per_seat
        type: integer
        source: computed
        description: Award-chart miles for (cabin, fare_class) before multipliers.
      - name: demand_multiplier_bps_applied
        type: integer
        source: computed
        description: Demand multiplier derived from the window load factor measured BEFORE this booking's seats were added.
      - name: partner_uplift_bps_applied
        type: integer
        source: computed
        description: Partner award-pricing uplift; 10000 for own metal.
      - name: surcharge_band
        type: enum
        source: computed
        description: Band selected by gross miles per seat BEFORE the elite discount is applied.
        constraints: "one of {SURCHARGE_LOW, SURCHARGE_MID, SURCHARGE_HIGH}"
      - name: elite_discount_bps_applied
        type: integer
        source: computed
        description: Elite mileage discount looked up by (elite_tier, surcharge_band).
      - name: quoted_miles
        type: integer
        source: computed
        description: Total miles quoted for the booking (per-seat miles rounded, then multiplied by seats).
      - name: cash_surcharge_cents
        type: integer
        source: computed
        description: Cash surcharge for the booking (per-seat band surcharge times seats).
      - name: partner_settlement_cents
        type: integer
        source: computed
        description: Cash owed to the partner airline for this booking; 0 for own metal.
        default: 0
      - name: partner_settled
        type: boolean
        source: system
        description: True once a partner settlement run has included this booking.
        default: false
      - name: hold_expires_at
        type: datetime
        source: system
        description: Instant the HELD booking lapses; set to booking creation time + HOLD_HOURS.
      - name: status
        type: enum
        source: system
        description: Booking lifecycle.
        default: HELD
        constraints: "one of {HELD, TICKETED, CANCELLED, REFUNDED, EXPIRED}"

  - name: PartnerAirline
    parent: LoyaltyProgram
    common_fields: true
    fields:
      - name: program_id
        type: string
        source: input
        description: FK -> LoyaltyProgram.id
      - name: iata_code
        type: string
        source: input
        description: Two-letter partner carrier code.
        constraints: unique within program_id
      - name: settlement_rate_centicents_per_mile
        type: integer
        source: input
        description: Cash the program owes the partner per redeemed mile, in hundredths of a cent.
        constraints: ">= 1"
      - name: reciprocity_mode
        type: enum
        source: input
        description: Reciprocity terms; drives the settlement netting factor and blocks bookings when SUSPENDED.
        default: FULL
        constraints: "one of {FULL, INBOUND_ONLY, OUTBOUND_ONLY, SUSPENDED}"
      - name: award_pricing_mode
        type: enum
        source: input
        description: How partner award miles are uplifted over the own-metal chart.
        default: FIXED_CHART
        constraints: "one of {FIXED_CHART, DISTANCE_BAND, DYNAMIC_PASSTHROUGH}"
      - name: net_settlement_balance_cents
        type: integer
        source: computed
        description: Running cash balance owed to the partner across settlement runs.
        default: 0
      - name: settled_booking_count
        type: integer
        source: computed
        description: Count of AwardBooking rows this partner has been settled for.
        default: 0
      - name: last_settlement_run_at
        type: datetime
        source: system
        description: Logical-clock instant of the last settlement run; null until the first run.
        default: null

  - name: ProgramChangeNotice
    parent: LoyaltyProgram
    common_fields: true
    fields:
      - name: program_id
        type: string
        source: input
        description: FK -> LoyaltyProgram.id
      - name: change_type
        type: enum
        source: input
        description: What the program is changing.
        constraints: "one of {EARN_STRUCTURE, AWARD_PRICING, ELITE_THRESHOLD, EXPIRY_POLICY}"
      - name: effective_at
        type: datetime
        source: input
        description: Instant the change takes effect.
      - name: grandfather_until
        type: datetime
        source: input
        description: Instant grandfathering lapses; null means no grandfathering.
        default: null
      - name: grandfathered_tier_floor
        type: enum
        source: input
        description: Minimum elite tier protected during grandfathering; null when no floor is offered.
        default: null
        constraints: "one of {BASE, SILVER, GOLD, PLATINUM} or null"
      - name: announced_at
        type: datetime
        source: system
        description: Logical-clock instant the notice was announced; null while DRAFT.
        default: null
      - name: notice_days
        type: integer
        source: computed
        description: Whole days from announced_at to effective_at (floor of the difference); 0 while DRAFT.
        default: 0
      - name: exposed_member_count
        type: integer
        source: computed
        description: "Count of MemberAccount rows in this program with elite_tier != BASE and security_state IN {NORMAL, WATCH}, measured at announcement."
        default: 0
      - name: member_reaction_index
        type: integer
        source: computed
        description: 0..100 reaction-risk score computed at announcement.
        default: 0
      - name: status
        type: enum
        source: system
        description: Communication lifecycle.
        default: DRAFT
        constraints: "one of {DRAFT, ANNOUNCED, IN_GRANDFATHER, EFFECTIVE, ROLLED_BACK}"
      - name: rollback_reason
        type: string
        source: system
        description: Reason captured when the notice is rolled back; null otherwise.
        default: null

  - name: FraudCase
    parent: MemberAccount
    common_fields: true
    fields:
      - name: member_id
        type: string
        source: input
        description: FK -> MemberAccount.id
      - name: case_type
        type: enum
        source: input
        description: Detected abuse pattern.
        constraints: "one of {ACCOUNT_TAKEOVER, MILE_BROKERING, VELOCITY_ANOMALY}"
      - name: login_geo_velocity
        type: integer
        source: input
        description: Count of impossible-travel login events in the detection sample.
        default: 0
        constraints: ">= 0"
      - name: redemption_velocity_24h
        type: integer
        source: input
        description: Count of redemptions in the trailing 24h of the detection sample.
        default: 0
        constraints: ">= 0"
      - name: brokering_pattern_hits
        type: integer
        source: input
        description: Count of third-party-beneficiary patterns matched.
        default: 0
        constraints: ">= 0"
      - name: dormancy_days
        type: integer
        source: input
        description: Days of account dormancy before the burst of activity.
        default: 0
        constraints: ">= 0"
      - name: detection_score
        type: integer
        source: computed
        description: 0..100 weighted risk score computed at case creation.
      - name: freeze_applied
        type: boolean
        source: computed
        description: True once this case has driven the member into FROZEN or CLOSED.
        default: false
      - name: clawback_miles
        type: integer
        source: computed
        description: Miles reversed from the member at substantiation; 0 otherwise.
        default: 0
      - name: opened_by_user_id
        type: string
        source: system
        description: X-User-ID of the FraudAnalyst who created the case.
      - name: adjudicated_by_user_id
        type: string
        source: system
        description: X-User-ID of the FraudAnalyst who substantiated or dismissed the case; null while open.
        default: null
      - name: status
        type: enum
        source: system
        description: Case lifecycle.
        default: OPEN
        constraints: "one of {OPEN, INVESTIGATING, SUBSTANTIATED, DISMISSED}"

  - name: DeferredRevenuePosting
    parent: LoyaltyProgram
    common_fields: false
    fields:
      - name: program_id
        type: string
        source: input
        description: FK -> LoyaltyProgram.id
      - name: period
        type: string
        source: input
        description: Accounting period being posted.
        constraints: "YYYY-MM; unique per program_id"
      - name: method
        type: enum
        source: input
        description: Breakage algorithm variant. Defaults to LoyaltyProgram.breakage_policy_mode when omitted.
        default: null
        constraints: "one of {HISTORICAL_ATTRITION, FORWARD_EXPECTATION} or null"
      - name: method_applied
        type: enum
        source: computed
        description: Variant actually used after defaulting.
        constraints: "one of {HISTORICAL_ATTRITION, FORWARD_EXPECTATION}"
      - name: outstanding_miles_snapshot
        type: integer
        source: computed
        description: LoyaltyProgram.outstanding_miles at posting time.
      - name: expired_miles_trailing
        type: integer
        source: computed
        description: Absolute miles expired in the trailing accounting window.
      - name: redeemed_miles_trailing
        type: integer
        source: computed
        description: Absolute miles redeemed in the trailing accounting window.
      - name: issued_miles_trailing
        type: integer
        source: computed
        description: Miles earned in the trailing accounting window.
      - name: breakage_rate_bps
        type: integer
        source: computed
        description: Breakage rate produced by method_applied, after floor/cap clamping.
      - name: deferred_balance_before_cents
        type: integer
        source: computed
        description: LoyaltyProgram.deferred_revenue_cents immediately before this posting.
      - name: breakage_income_cents
        type: integer
        source: computed
        description: Revenue recognized by this posting.
      - name: deferred_balance_after_cents
        type: integer
        source: computed
        description: deferred_balance_before_cents - breakage_income_cents.

# =====================================================================
# §1.2 State Machine Table
# =====================================================================
state_machines:

  # ---- 1. LoyaltyProgram: cyclic accounting-period posture -----------
  - entity: LoyaltyProgram
    initial_state: OPEN
    terminal_states: []
    note: "Cyclic OPEN -> CLOSING -> LOCKED -> OPEN. Field: revenue_recognition_state."
    transitions:
      - from: OPEN
        to: CLOSING
        trigger: "POST /loyalty-programs/{programId}/recognition-transitions with target_state=CLOSING"
        actor: RevenueAccountant
        preconditions: ["revenue_recognition_state == OPEN"]
        side_effects:
          - "revenue_recognition_state = CLOSING (deferred-revenue postings become permitted)"
          - "increments LoyaltyProgram.version by 1"
      - from: CLOSING
        to: LOCKED
        trigger: "POST /loyalty-programs/{programId}/recognition-transitions with target_state=LOCKED"
        actor: RevenueAccountant
        preconditions:
          - "revenue_recognition_state == CLOSING"
          - "a DeferredRevenuePosting exists for (program_id, current_period)"
        side_effects:
          - "revenue_recognition_state = LOCKED (all MileTransaction inserts and all deferred-revenue postings rejected with ERR_PERIOD_LOCKED)"
          - "increments LoyaltyProgram.version by 1"
      - from: LOCKED
        to: OPEN
        trigger: "POST /loyalty-programs/{programId}/recognition-transitions with target_state=OPEN"
        actor: RevenueAccountant
        preconditions: ["revenue_recognition_state == LOCKED"]
        side_effects:
          - "current_period advances by one calendar month (YYYY-MM + 1)"
          - "revenue_recognition_state = OPEN"
          - "increments LoyaltyProgram.version by 1"
      - from: CLOSING
        to: OPEN
        trigger: "POST /loyalty-programs/{programId}/recognition-transitions with target_state=OPEN"
        actor: RevenueAccountant
        preconditions: ["revenue_recognition_state == CLOSING"]
        side_effects:
          - "revenue_recognition_state = OPEN; current_period unchanged (abandoned close)"
          - "increments LoyaltyProgram.version by 1"

  # ---- 2. MileSaleAgreement: cyclic negotiation ----------------------
  - entity: MileSaleAgreement
    initial_state: DRAFT
    terminal_states: [EXPIRED, TERMINATED]
    note: "Cycle DRAFT -> ISSUER_REVIEW -> COUNTERED -> DRAFT increments negotiation_round each lap."
    transitions:
      - from: DRAFT
        to: ISSUER_REVIEW
        trigger: "POST /mile-sale-agreements/{agreementId}/submit"
        actor: PartnerManager
        preconditions:
          - "status == DRAFT"
          - "CoBrandIssuer.status == ACTIVE"
        side_effects: ["negotiated_by_user_id = X-User-ID of the submitting PartnerManager", "increments MileSaleAgreement.version by 1"]
      - from: ISSUER_REVIEW
        to: COUNTERED
        trigger: "POST /mile-sale-agreements/{agreementId}/counter"
        actor: IssuerRepresentative
        preconditions:
          - "status == ISSUER_REVIEW"
          - "X-User-ID == MileSaleAgreement.issuer_id"
        side_effects:
          - "countered_price_per_mile_centicents and countered_committed_volume_miles stamped from the request"
          - "increments MileSaleAgreement.version by 1"
      - from: COUNTERED
        to: DRAFT
        trigger: "POST /mile-sale-agreements/{agreementId}/revise"
        actor: PartnerManager
        preconditions: ["status == COUNTERED"]
        side_effects:
          - "tier_schedule and committed_volume_miles replaced from the request"
          - "negotiation_round += 1"
          - "negotiated_by_user_id = X-User-ID of the revising PartnerManager"
          - "increments MileSaleAgreement.version by 1"
      - from: ISSUER_REVIEW
        to: RATIFIED
        trigger: "POST /mile-sale-agreements/{agreementId}/ratify"
        actor: ContractsOfficer
        preconditions:
          - "status == ISSUER_REVIEW"
          - "X-User-ID != negotiated_by_user_id (segregation of duties)"
          - "CoBrandIssuer.aggregate_committed_miles (excluding any agreement this one supersedes) + committed_volume_miles <= CoBrandIssuer.annual_mile_purchase_cap_miles"
        side_effects:
          - "ratified_by_user_id = X-User-ID"
          - "CASCADE HOP 1: when supersedes_agreement_id is not null, the target agreement transitions ACTIVE -> TERMINATED"
          - "CASCADE HOP 2 (caused by hop 1): the terminated agreement's prepayment_balance_miles is moved in full onto this agreement (target set to 0), and CoBrandIssuer.aggregate_committed_miles is recomputed over agreements with status IN {RATIFIED, ACTIVE}"
          - "CASCADE HOP 3 (caused by hop 2): when the recomputed aggregate_committed_miles >= annual_mile_purchase_cap_miles * ISSUER_UTILIZATION_ALERT_BPS / 10000, CoBrandIssuer.status = SUSPENDED and suspension_reason = CAP_BREACH"
          - "increments MileSaleAgreement.version by 1"
      - from: RATIFIED
        to: ACTIVE
        trigger: "POST /mile-sale-agreements/{agreementId}/activate"
        actor: ContractsOfficer
        preconditions:
          - "status == RATIFIED"
          - "CoBrandIssuer.status == ACTIVE"
        side_effects: ["mile purchase orders become creatable", "increments MileSaleAgreement.version by 1"]
      - from: ACTIVE
        to: TERMINATED
        trigger: "system: ratification of a superseding MileSaleAgreement (cascade hop 1 above)"
        actor: system
        preconditions: ["status == ACTIVE", "another agreement whose supersedes_agreement_id == this id reached RATIFIED"]
        side_effects:
          - "prepayment_balance_miles transferred to the superseding agreement and set to 0"
          - "CoBrandIssuer.aggregate_committed_miles recomputed"
          - "increments MileSaleAgreement.version by 1"
      - from: ACTIVE
        to: EXPIRED
        trigger: "POST /_ops/run-epoch"
        actor: system
        preconditions: ["status == ACTIVE", "term_end_date < logical clock date"]
        side_effects:
          - "CoBrandIssuer.aggregate_committed_miles recomputed (this agreement drops out of the {RATIFIED, ACTIVE} set)"
          - "increments MileSaleAgreement.version by 1"

  # ---- 3. MilePurchaseOrder: parallel dimensions ---------------------
  - entity: MilePurchaseOrder
    initial_state: "PENDING x PENDING (fulfillment_status x settlement_status)"
    terminal_states: ["REVERSED x WRITTEN_OFF", "ISSUED x SETTLED"]
    note: "Two independent axes on one row: fulfillment_status (mile delivery) and settlement_status (cash)."
    transitions:
      - from: "fulfillment_status=PENDING"
        to: "fulfillment_status=ISSUED"
        trigger: "POST /mile-purchase-orders/{orderId}/issue"
        actor: PartnerManager
        preconditions:
          - "fulfillment_status == PENDING"
          - "MileSaleAgreement.status == ACTIVE"
        side_effects:
          - "MileSaleAgreement.drawn_miles += order_miles"
          - "MileSaleAgreement.prepayment_balance_miles += order_miles"
          - "LoyaltyProgram.deferred_revenue_cents += gross_amount_cents"
          - "increments MilePurchaseOrder.version by 1 and MileSaleAgreement.version by 1"
      - from: "settlement_status=PENDING"
        to: "settlement_status=INVOICED"
        trigger: "POST /mile-purchase-orders/{orderId}/invoice"
        actor: RevenueAccountant
        preconditions:
          - "settlement_status == PENDING"
          - "fulfillment_status == ISSUED"
          - "LoyaltyProgram.revenue_recognition_state != LOCKED"
        side_effects:
          - "runs mile_purchase_order_pricing variant FINAL_AT_INVOICE -> final_amount_cents, volume_true_up_cents, net_amount_cents"
          - "LoyaltyProgram.deferred_revenue_cents += volume_true_up_cents (may be negative)"
          - "posted_period = LoyaltyProgram.current_period"
          - "increments MilePurchaseOrder.version by 1"
      - from: "settlement_status=INVOICED"
        to: "settlement_status=SETTLED"
        trigger: "POST /mile-purchase-orders/{orderId}/settle"
        actor: RevenueAccountant
        preconditions: ["settlement_status == INVOICED"]
        side_effects: ["increments MilePurchaseOrder.version by 1"]
      - from: "fulfillment_status=ISSUED"
        to: "fulfillment_status=REVERSED"
        trigger: "POST /mile-purchase-orders/{orderId}/reverse"
        actor: PartnerManager
        preconditions:
          - "fulfillment_status == ISSUED"
          - "settlement_status != SETTLED"
          - "MileSaleAgreement.prepayment_balance_miles >= order_miles"
        side_effects:
          - "MileSaleAgreement.drawn_miles -= order_miles"
          - "MileSaleAgreement.prepayment_balance_miles -= order_miles"
          - "LoyaltyProgram.deferred_revenue_cents -= (net_amount_cents when settlement_status == INVOICED, else gross_amount_cents)"
          - "settlement_status = WRITTEN_OFF"
          - "reversal_reason stamped from the request"
          - "increments MilePurchaseOrder.version by 1 and MileSaleAgreement.version by 1"

  # ---- 4. MemberAccount: three parallel dimensions -------------------
  - entity: MemberAccount
    initial_state: "NORMAL x NONE x ACCUMULATING (security_state x status_match_state x qualification_state)"
    terminal_states: ["CLOSED (security_state)"]
    note: "security_state, status_match_state and qualification_state evolve independently on the same row."
    transitions:
      - from: "security_state=NORMAL"
        to: "security_state=WATCH"
        trigger: "POST /fraud-cases (system side effect)"
        actor: system
        preconditions: ["security_state == NORMAL", "FraudCase.detection_score >= RISK_WATCH_THRESHOLD and < RISK_FREEZE_THRESHOLD"]
        side_effects: ["risk_score = FraudCase.detection_score", "increments MemberAccount.version by 1"]
      - from: "security_state IN {NORMAL, WATCH}"
        to: "security_state=FROZEN"
        trigger: "POST /fraud-cases (detection_score >= RISK_FREEZE_THRESHOLD) or POST /fraud-cases/{caseId}/substantiate with case_type IN {MILE_BROKERING, VELOCITY_ANOMALY}"
        actor: system
        preconditions: ["security_state IN {NORMAL, WATCH}"]
        side_effects:
          - "risk_score = FraudCase.detection_score"
          - "FraudCase.freeze_applied = true"
          - "CASCADE: every AwardBooking of this member with status == HELD transitions HELD -> CANCELLED, releasing seats_held and saver_seats_consumed on its AwardInventoryWindow"
          - "increments MemberAccount.version by 1"
      - from: "security_state IN {NORMAL, WATCH}"
        to: "security_state=CLOSED"
        trigger: "POST /fraud-cases/{caseId}/substantiate with case_type == ACCOUNT_TAKEOVER"
        actor: system
        preconditions: ["security_state IN {NORMAL, WATCH}"]
        side_effects:
          - "FraudCase.freeze_applied = true"
          - "CASCADE: every AwardBooking of this member with status == HELD transitions HELD -> CANCELLED, releasing seats"
          - "increments MemberAccount.version by 1"
      - from: "security_state IN {WATCH, FROZEN}"
        to: "security_state=NORMAL"
        trigger: "POST /fraud-cases/{caseId}/dismiss"
        actor: FraudAnalyst
        preconditions:
          - "security_state IN {WATCH, FROZEN}"
          - "no other FraudCase for this member has status IN {OPEN, INVESTIGATING, SUBSTANTIATED}"
        side_effects: ["risk_score = 0", "increments MemberAccount.version by 1"]
      - from: "status_match_state=NONE"
        to: "status_match_state=TRIAL"
        trigger: "POST /member-accounts/{memberId}/status-match"
        actor: ProgramAdmin
        preconditions:
          - "status_match_state == NONE"
          - "security_state == NORMAL"
          - "matched_tier is strictly higher than the member's current elite_tier in tier order BASE < SILVER < GOLD < PLATINUM"
        side_effects:
          - "elite_tier = matched_tier; status_match_tier = matched_tier"
          - "status_match_expires_at = logical clock now + trial_days days"
          - "increments MemberAccount.version by 1"
      - from: "status_match_state=TRIAL"
        to: "status_match_state=CONFIRMED"
        trigger: "POST /member-accounts/{memberId}/status-match/resolve with outcome=CONFIRM"
        actor: ProgramAdmin
        preconditions: ["status_match_state == TRIAL"]
        side_effects: ["elite_tier retained at status_match_tier", "increments MemberAccount.version by 1"]
      - from: "status_match_state=TRIAL"
        to: "status_match_state=LAPSED"
        trigger: "POST /member-accounts/{memberId}/status-match/resolve with outcome=LAPSE, or POST /_ops/run-epoch when status_match_expires_at <= clock now"
        actor: "ProgramAdmin | system"
        preconditions: ["status_match_state == TRIAL"]
        side_effects:
          - "elite_tier reverts to awarded_tier_at_close when not null, else BASE"
          - "increments MemberAccount.version by 1"
      - from: "qualification_state=ACCUMULATING"
        to: "qualification_state=CLOSED"
        trigger: "POST /member-accounts/{memberId}/qualification-cycle/close"
        actor: ProgramAdmin
        preconditions: ["qualification_state == ACCUMULATING"]
        side_effects:
          - "runs elite_qualification_and_rollover -> awarded_tier_at_close, rollover_carried_out"
          - "elite_tier = awarded_tier_at_close unless status_match_state IN {TRIAL, CONFIRMED} and status_match_tier ranks higher, in which case elite_tier is retained at status_match_tier"
          - "increments MemberAccount.version by 1"
      - from: "qualification_state=CLOSED"
        to: "qualification_state=RESTATED"
        trigger: "POST /member-accounts/{memberId}/qualification-cycle/restate"
        actor: ProgramAdmin
        preconditions: ["qualification_state == CLOSED"]
        side_effects:
          - "awarded_tier_at_close and rollover_carried_out cleared to null / 0"
          - "elite_tier reverts to BASE unless a status match holds a higher tier"
          - "increments MemberAccount.version by 1"
      - from: "qualification_state=RESTATED"
        to: "qualification_state=CLOSED"
        trigger: "POST /member-accounts/{memberId}/qualification-cycle/close"
        actor: ProgramAdmin
        preconditions: ["qualification_state == RESTATED"]
        side_effects:
          - "re-runs elite_qualification_and_rollover on the restated ledger"
          - "increments MemberAccount.version by 1"

  # ---- 5. PromotionCampaign -----------------------------------------
  - entity: PromotionCampaign
    initial_state: SCHEDULED
    terminal_states: [ENDED, CANCELLED]
    transitions:
      - from: SCHEDULED
        to: LIVE
        trigger: "POST /_ops/run-epoch"
        actor: system
        preconditions: ["status == SCHEDULED", "window_start <= logical clock now"]
        side_effects: ["campaign becomes eligible for promotion_id on MileTransaction inserts", "increments PromotionCampaign.version by 1"]
      - from: LIVE
        to: ENDED
        trigger: "POST /_ops/run-epoch"
        actor: system
        preconditions: ["status == LIVE", "window_end <= logical clock now"]
        side_effects: ["campaign no longer eligible", "increments PromotionCampaign.version by 1"]
      - from: SCHEDULED
        to: CANCELLED
        trigger: "POST /promotion-campaigns/{campaignId}/cancel"
        actor: ProgramAdmin
        preconditions: ["status == SCHEDULED"]
        side_effects: ["cancellation_reason stamped", "increments PromotionCampaign.version by 1"]
      - from: LIVE
        to: CANCELLED
        trigger: "POST /promotion-campaigns/{campaignId}/cancel"
        actor: ProgramAdmin
        preconditions: ["status == LIVE"]
        side_effects: ["cancellation_reason stamped", "increments PromotionCampaign.version by 1"]

  # ---- 6. AwardInventoryWindow: derived capacity posture -------------
  - entity: AwardInventoryWindow
    initial_state: OPEN
    terminal_states: []
    note: "capacity_control_state is recomputed from load_factor_bps after every seat movement; ProgramAdmin may also pin it. Thresholds used by every precondition below: CAPACITY_CONSTRAINED_BPS = 7500 and CAPACITY_CLOSED_BPS = 10000, both inclusive lower bounds — load_factor_bps < 7500 is OPEN, 7500..9999 is CONSTRAINED, >= 10000 is CLOSED."
    transitions:
      - from: OPEN
        to: CONSTRAINED
        trigger: "system: recompute after any seat movement (booking create / ticket / cancel / refund / expire) or POST /_ops/run-epoch"
        actor: system
        preconditions: ["load_factor_bps >= CAPACITY_CONSTRAINED_BPS and < CAPACITY_CLOSED_BPS"]
        side_effects: ["demand_multiplier_bps refreshed from load_factor_bps", "increments AwardInventoryWindow.version by 1"]
      - from: CONSTRAINED
        to: CLOSED
        trigger: "system: recompute after any seat movement or POST /_ops/run-epoch"
        actor: system
        preconditions: ["load_factor_bps >= CAPACITY_CLOSED_BPS"]
        side_effects: ["new bookings rejected with ERR_AWARD_WINDOW_CLOSED", "increments AwardInventoryWindow.version by 1"]
      - from: CONSTRAINED
        to: OPEN
        trigger: "system: recompute after seat release (cancel / refund / expire)"
        actor: system
        preconditions: ["load_factor_bps < CAPACITY_CONSTRAINED_BPS"]
        side_effects: ["demand_multiplier_bps refreshed", "increments AwardInventoryWindow.version by 1"]
      - from: CLOSED
        to: CONSTRAINED
        trigger: "system: recompute after seat release"
        actor: system
        preconditions: ["load_factor_bps >= CAPACITY_CONSTRAINED_BPS and < CAPACITY_CLOSED_BPS"]
        side_effects: ["increments AwardInventoryWindow.version by 1"]
      - from: "OPEN | CONSTRAINED"
        to: CLOSED
        trigger: "PATCH /award-inventory-windows/{windowId}/capacity-control with capacity_control_state=CLOSED"
        actor: ProgramAdmin
        preconditions: ["capacity_control_state != CLOSED"]
        side_effects: ["manual capacity pin; the next system recompute overwrites it", "increments AwardInventoryWindow.version by 1"]
      - from: CLOSED
        to: OPEN
        trigger: "PATCH /award-inventory-windows/{windowId}/capacity-control with capacity_control_state=OPEN"
        actor: ProgramAdmin
        preconditions: ["capacity_control_state == CLOSED", "load_factor_bps < CAPACITY_CONSTRAINED_BPS"]
        side_effects: ["increments AwardInventoryWindow.version by 1"]

  # ---- 7. AwardBooking: forward + compensation ----------------------
  - entity: AwardBooking
    initial_state: HELD
    terminal_states: [CANCELLED, REFUNDED, EXPIRED]
    transitions:
      - from: HELD
        to: TICKETED
        trigger: "POST /award-bookings/{bookingId}/ticket"
        actor: "Member | ProgramAdmin"
        preconditions:
          - "status == HELD"
          - "hold_expires_at > logical clock now"
          - "MemberAccount.security_state == NORMAL"
          - "MemberAccount.mile_balance >= quoted_miles"
          - "LoyaltyProgram.revenue_recognition_state != LOCKED"
        side_effects:
          - "a MileTransaction row of txn_type REDEEM is inserted with total_miles = -quoted_miles and award_booking_id = this booking"
          - "MemberAccount.mile_balance -= quoted_miles"
          - "LoyaltyProgram.outstanding_miles -= quoted_miles"
          - "AwardInventoryWindow.seats_held -= seats; seats_confirmed += seats"
          - "AwardInventoryWindow.load_factor_bps, demand_multiplier_bps and capacity_control_state recomputed"
          - "increments AwardBooking.version by 1 and AwardInventoryWindow.version by 1"
      - from: TICKETED
        to: REFUNDED
        trigger: "POST /award-bookings/{bookingId}/refund"
        actor: ProgramAdmin
        preconditions: ["status == TICKETED", "partner_settled == false", "LoyaltyProgram.revenue_recognition_state != LOCKED"]
        side_effects:
          - "COMPENSATION: a MileTransaction row of txn_type REVERSAL is inserted with total_miles = +quoted_miles, award_booking_id = this booking and reverses_transaction_id = the REDEEM row"
          - "MemberAccount.mile_balance += quoted_miles (restored to its pre-ticket value)"
          - "LoyaltyProgram.outstanding_miles += quoted_miles (restored)"
          - "AwardInventoryWindow.seats_confirmed -= seats; saver_seats_consumed -= seats when fare_class == SAVER"
          - "AwardInventoryWindow.load_factor_bps, demand_multiplier_bps and capacity_control_state recomputed"
          - "increments AwardBooking.version by 1 and AwardInventoryWindow.version by 1"
      - from: HELD
        to: CANCELLED
        trigger: "POST /award-bookings/{bookingId}/cancel, or the FROZEN/CLOSED security cascade"
        actor: "Member | ProgramAdmin | system"
        preconditions: ["status == HELD"]
        side_effects:
          - "AwardInventoryWindow.seats_held -= seats; saver_seats_consumed -= seats when fare_class == SAVER"
          - "AwardInventoryWindow.load_factor_bps, demand_multiplier_bps and capacity_control_state recomputed"
          - "increments AwardBooking.version by 1 and AwardInventoryWindow.version by 1"
      - from: HELD
        to: EXPIRED
        trigger: "POST /_ops/run-epoch"
        actor: system
        preconditions: ["status == HELD", "hold_expires_at <= logical clock now"]
        side_effects:
          - "AwardInventoryWindow.seats_held -= seats; saver_seats_consumed -= seats when fare_class == SAVER"
          - "AwardInventoryWindow.load_factor_bps, demand_multiplier_bps and capacity_control_state recomputed"
          - "MemberAccount.mile_balance unchanged (no miles were ever debited on a hold)"
          - "increments AwardBooking.version by 1 and AwardInventoryWindow.version by 1"

  # ---- 8. ProgramChangeNotice: announce with rollback loop -----------
  - entity: ProgramChangeNotice
    initial_state: DRAFT
    terminal_states: [ROLLED_BACK]
    transitions:
      - from: DRAFT
        to: ANNOUNCED
        trigger: "POST /program-change-notices/{noticeId}/announce"
        actor: ProgramAdmin
        preconditions:
          - "status == DRAFT"
          - "effective_at > logical clock now"
          - "member_reaction_index < REACTION_RISK_BLOCK_THRESHOLD, or grandfather_until is not null"
        side_effects:
          - "announced_at = logical clock now; notice_days, exposed_member_count and member_reaction_index computed"
          - "increments ProgramChangeNotice.version by 1"
      - from: ANNOUNCED
        to: IN_GRANDFATHER
        trigger: "POST /_ops/run-epoch"
        actor: system
        preconditions: ["status == ANNOUNCED", "logical clock now >= effective_at", "grandfather_until is not null and grandfather_until > clock now"]
        side_effects: ["increments ProgramChangeNotice.version by 1"]
      - from: ANNOUNCED
        to: EFFECTIVE
        trigger: "POST /_ops/run-epoch"
        actor: system
        preconditions: ["status == ANNOUNCED", "logical clock now >= effective_at", "grandfather_until is null or <= clock now"]
        side_effects: ["increments ProgramChangeNotice.version by 1"]
      - from: IN_GRANDFATHER
        to: EFFECTIVE
        trigger: "POST /_ops/run-epoch"
        actor: system
        preconditions: ["status == IN_GRANDFATHER", "grandfather_until <= logical clock now"]
        side_effects: ["increments ProgramChangeNotice.version by 1"]
      - from: "ANNOUNCED | IN_GRANDFATHER | EFFECTIVE"
        to: ROLLED_BACK
        trigger: "POST /program-change-notices/{noticeId}/rollback"
        actor: ProgramAdmin
        preconditions: ["status IN {ANNOUNCED, IN_GRANDFATHER, EFFECTIVE}"]
        side_effects:
          - "rollback_reason stamped"
          - "every PromotionCampaign in this program whose status == SCHEDULED and whose earn_channel is CARD_SPEND transitions SCHEDULED -> CANCELLED when change_type == EARN_STRUCTURE"
          - "increments ProgramChangeNotice.version by 1"

  # ---- 9. FraudCase --------------------------------------------------
  - entity: FraudCase
    initial_state: OPEN
    terminal_states: [SUBSTANTIATED, DISMISSED]
    transitions:
      - from: OPEN
        to: INVESTIGATING
        trigger: "POST /fraud-cases/{caseId}/investigate"
        actor: FraudAnalyst
        preconditions: ["status == OPEN"]
        side_effects: ["increments FraudCase.version by 1"]
      - from: INVESTIGATING
        to: SUBSTANTIATED
        trigger: "POST /fraud-cases/{caseId}/substantiate"
        actor: FraudAnalyst
        preconditions:
          - "status == INVESTIGATING"
          - "X-User-ID != opened_by_user_id (segregation of duties)"
          - "LoyaltyProgram.revenue_recognition_state != LOCKED"
        side_effects:
          - "CASCADE HOP 1: adjudicated_by_user_id stamped; clawback_miles computed by fraud_risk_and_clawback"
          - "CASCADE HOP 2 (caused by hop 1): when clawback_miles > 0 a MileTransaction of txn_type ADJUSTMENT with total_miles = -clawback_miles is inserted and MemberAccount.mile_balance is debited; MemberAccount.security_state moves to CLOSED for ACCOUNT_TAKEOVER, otherwise FROZEN"
          - "CASCADE HOP 3 (caused by hop 2's security_state transition): every AwardBooking of this member with status == HELD transitions HELD -> CANCELLED and its seats are released from AwardInventoryWindow.seats_held / saver_seats_consumed"
          - "CASCADE HOP 4 (caused by hop 3's seat release): each affected AwardInventoryWindow recomputes load_factor_bps, demand_multiplier_bps and capacity_control_state"
          - "CASCADE HOP 5 (caused by hop 2's ADJUSTMENT insert): LoyaltyProgram.outstanding_miles is recomputed downward by clawback_miles"
          - "increments FraudCase.version by 1"
      - from: INVESTIGATING
        to: DISMISSED
        trigger: "POST /fraud-cases/{caseId}/dismiss"
        actor: FraudAnalyst
        preconditions:
          - "status == INVESTIGATING"
          - "X-User-ID != opened_by_user_id (segregation of duties)"
        side_effects:
          - "adjudicated_by_user_id stamped"
          - "MemberAccount.security_state returns to NORMAL when no other FraudCase for the member is in {OPEN, INVESTIGATING, SUBSTANTIATED}; risk_score reset to 0"
          - "increments FraudCase.version by 1"

# =====================================================================
# §1.2.1 Concurrency Rules (OCC on the parent's `version`)
# =====================================================================
concurrency_rules:
  - rule_id: mile-purchase-order-stale-agreement
    parent_entity: MileSaleAgreement
    write_endpoint: "POST /mile-purchase-orders"
    occ_field: "expected_agreement_version"
    description: |
      Creating a MilePurchaseOrder against a MileSaleAgreement whose version has
      advanced since the client last observed it is rejected. Every issued order
      moves drawn_miles, which is the anchor for the tier price the new order will
      be quoted at, so a client holding a stale view of the agreement would be
      priced off a tier that no longer applies. A second order is otherwise
      perfectly legitimate, which is why this is resolved by a stale-version check
      rather than by a state precondition.
    error_id: ERR_STALE_VERSION
    http_status: 412

  - rule_id: award-booking-hold-stale-window
    parent_entity: AwardInventoryWindow
    write_endpoint: "POST /award-bookings"
    occ_field: "expected_window_version"
    description: |
      Creating an AwardBooking hold against an AwardInventoryWindow whose version
      has advanced since the client last observed it is rejected. The quoted price
      is derived from the window's load factor and demand multiplier, both of which
      move on every seat event and on every capacity-control change, so a stale view
      would lock in a price the window no longer offers. Additional holds on the
      same window are legitimate in themselves, so the conflict is resolved by a
      stale-version check.
    error_id: ERR_STALE_VERSION
    http_status: 412

  - rule_id: deferred-posting-stale-program
    parent_entity: LoyaltyProgram
    write_endpoint: "POST /deferred-revenue-postings"
    occ_field: "expected_program_version"
    description: |
      Posting deferred revenue against a LoyaltyProgram whose version has advanced
      since the client last observed it is rejected. The posting snapshots
      outstanding_miles and deferred_revenue_cents, both of which move on mile
      postings, order issuance and prior postings, so a stale view would recognize
      breakage against a balance that no longer exists. Postings for distinct
      periods are legitimate in themselves, so the conflict is resolved by a
      stale-version check.
    error_id: ERR_STALE_VERSION
    http_status: 412

# =====================================================================
# §1.3 Calculation Rules
# =====================================================================
calculations:

  - name: mile_purchase_order_pricing
    entity: MilePurchaseOrder
    algorithm_type: tiered_pricing
    trigger: "POST /mile-purchase-orders (PROVISIONAL_AT_ORDER) and POST /mile-purchase-orders/{orderId}/invoice (FINAL_AT_INVOICE)"
    input_set: "the parent MileSaleAgreement's tier_schedule, its drawn_miles at the moment of the call (captured onto the order as drawn_miles_before), and order_miles"
    constants:
      VOLUME_OVERDRAW_TOLERANCE_BPS: 11000   # cumulative committed-volume draw may reach 110% of committed_volume_miles
      CENTICENTS_PER_CENT: 100               # tier prices are quoted in centicents per mile (1 cent = 100 centicents)
    rounding: "round_half_up to whole cents; see the per-variant rounding boundary below"
    variants:
      - name: PROVISIONAL_AT_ORDER
        applies_when: "POST /mile-purchase-orders — writes provisional_tier_price_centicents and gross_amount_cents"
        formula: |
          1. tier = the LAST entry of agreement.tier_schedule whose threshold_miles <= drawn_miles_before
             (entries are ordered by strictly increasing threshold_miles, entry[0].threshold_miles == 0,
              so a tier always exists).
          2. provisional_tier_price_centicents = tier.price_per_mile_centicents
          3. gross_amount_cents = round_half_up(order_miles * provisional_tier_price_centicents / 100)
          A SINGLE tier price is applied to the WHOLE order, chosen only by where the order STARTS.
          The order never straddles tiers under this variant.
      - name: FINAL_AT_INVOICE
        applies_when: "POST /mile-purchase-orders/{orderId}/invoice — writes final_amount_cents, volume_true_up_cents, net_amount_cents"
        formula: |
          1. The order occupies the half-open mile interval
             [drawn_miles_before, drawn_miles_before + order_miles).
          2. Cut that interval at every tier_schedule threshold_miles, producing one slice per tier
             actually traversed. Slice k has slice_miles_k and the price_per_mile_centicents of the
             tier whose threshold_miles opens it.
          3. slice_cents_k = round_half_up(slice_miles_k * price_k / 100)   <-- ROUNDED PER SLICE
          4. final_amount_cents = sum over k of slice_cents_k
             (each slice is rounded to whole cents INDIVIDUALLY and only then summed; summing the
              exact centicent products first and rounding once at the end is NOT the rule and can
              differ by a cent)
          5. volume_true_up_cents = final_amount_cents - gross_amount_cents   (signed; negative when
             the marginal slicing beat the provisional single-tier quote)
          6. net_amount_cents = final_amount_cents
    edge_cases:
      - "order_miles that stays entirely inside the starting tier: FINAL_AT_INVOICE produces exactly one slice and final_amount_cents == gross_amount_cents, so volume_true_up_cents == 0."
      - "an order whose interval starts exactly ON a threshold_miles opens at that tier (thresholds are inclusive lower bounds)."
      - "drawn_miles + order_miles > round_half_up(committed_volume_miles * VOLUME_OVERDRAW_TOLERANCE_BPS / 10000) is rejected at order creation with ERR_VOLUME_COMMITMENT_EXCEEDED; the pricing calculation never runs."
      - "a reversed order does not un-round anything: reversal debits exactly the cents that were credited (net_amount_cents when already INVOICED, otherwise gross_amount_cents)."

  - name: breakage_and_deferred_revenue
    entity: DeferredRevenuePosting
    algorithm_type: aggregation
    trigger: "POST /deferred-revenue-postings"
    input_set: |
      MileTransaction rows belonging to members of the program whose activity_date falls in the
      TRAILING WINDOW: the 24 calendar months ending on the last day of `period` (inclusive on both
      ends). Only these three buckets are counted:
        expired_miles_trailing  = sum of -total_miles over txn_type == EXPIRY
        redeemed_miles_trailing = sum of -total_miles over txn_type == REDEEM
        issued_miles_trailing   = sum of  total_miles over txn_type IN {FLIGHT_EARN, CARD_SPEND_EARN, PARTNER_EARN}
      REVERSAL and ADJUSTMENT rows are excluded from all three buckets (they are corrections, not
      program activity), but they DO move outstanding_miles_snapshot.
    constants:
      BREAKAGE_TRAILING_MONTHS: 24
      BREAKAGE_RATE_FLOOR_HISTORICAL_BPS: 0
      BREAKAGE_RATE_FLOOR_FORWARD_BPS: 200
      BREAKAGE_RATE_CEILING_BPS: 3500
    rounding: "round_half_up to whole basis points for the rate, then round_half_up to whole cents for the income"
    variants:
      - name: HISTORICAL_ATTRITION
        applies_when: "posting.method == HISTORICAL_ATTRITION, or method omitted and LoyaltyProgram.breakage_policy_mode == HISTORICAL_ATTRITION"
        formula: |
          denominator = expired_miles_trailing + redeemed_miles_trailing
          raw_bps = 0 when denominator == 0,
                    else round_half_up(10000 * expired_miles_trailing / denominator)
          breakage_rate_bps = clamp(raw_bps, BREAKAGE_RATE_FLOOR_HISTORICAL_BPS, BREAKAGE_RATE_CEILING_BPS)
          Looks BACKWARD: what share of miles that left the program left by expiring rather than
          by being redeemed.
      - name: FORWARD_EXPECTATION
        applies_when: "posting.method == FORWARD_EXPECTATION, or method omitted and LoyaltyProgram.breakage_policy_mode == FORWARD_EXPECTATION"
        formula: |
          raw_bps = BREAKAGE_RATE_CEILING_BPS when issued_miles_trailing == 0,
                    else round_half_up(10000 * (1 - redeemed_miles_trailing / issued_miles_trailing))
                    (equivalently round_half_up(10000 * (issued - redeemed) / issued))
          breakage_rate_bps = clamp(raw_bps, BREAKAGE_RATE_FLOOR_FORWARD_BPS, BREAKAGE_RATE_CEILING_BPS)
          Looks FORWARD: what share of miles ISSUED is expected never to be redeemed. Ignores
          expiries entirely and has a non-zero floor, so on identical data the two variants
          generally disagree.
    formula: |
      Common tail, run after the variant has produced breakage_rate_bps:
        method_applied                 = the variant actually used (echoes the resolved method)
        outstanding_miles_snapshot     = LoyaltyProgram.outstanding_miles at posting time
        deferred_balance_before_cents  = LoyaltyProgram.deferred_revenue_cents at posting time
        breakage_income_cents          = round_half_up(deferred_balance_before_cents * breakage_rate_bps / 10000)
        deferred_balance_after_cents   = deferred_balance_before_cents - breakage_income_cents
      Side effects: LoyaltyProgram.deferred_revenue_cents = deferred_balance_after_cents;
      last_breakage_rate_bps = breakage_rate_bps;
      lifetime_breakage_income_cents += breakage_income_cents.
    edge_cases:
      - "denominator == 0 under HISTORICAL_ATTRITION yields breakage_rate_bps == 0 and breakage_income_cents == 0 (the posting is still created)."
      - "issued_miles_trailing == 0 under FORWARD_EXPECTATION yields the ceiling 3500 bps, not a division error."
      - "a rate above 3500 bps is clamped to exactly 3500; the clamp applies AFTER rounding."
      - "deferred_balance_before_cents == 0 yields breakage_income_cents == 0 regardless of the rate."
      - "one posting per (program_id, period): a second attempt is rejected with ERR_PERIOD_ALREADY_POSTED."

  - name: earning_credit_with_multipliers
    entity: MileTransaction
    algorithm_type: weighted_scoring
    trigger: "POST /mile-transactions with txn_type IN {FLIGHT_EARN, CARD_SPEND_EARN, PARTNER_EARN}"
    input_set: "the request's base_miles / qualifying_spend_cents / segments, MemberAccount.elite_tier at posting time (stamped as elite_tier_at_earn), and the referenced PromotionCampaign when promotion_id is supplied"
    constants:
      TIER_BONUS_BPS: { BASE: 0, SILVER: 2500, GOLD: 5000, PLATINUM: 10000 }
      CARD_SPEND_CENTS_PER_BASE_MILE: 100
      CARD_SPEND_QUALIFYING_MILE_CAP: 15000    # per transaction
      PER_MEMBER_PROMO_CAP_MILES: 25000        # promotional bonus per transaction
      MIN_PROMO_MULTIPLIER_BPS: 10000
      MAX_PROMO_MULTIPLIER_BPS: 50000
    rounding: round_half_up to whole miles
    formula: |
      STEP 1 - base_miles resolution (by txn_type):
        FLIGHT_EARN      : base = request.base_miles                (required; segments required)
        CARD_SPEND_EARN  : base = floor(request.qualifying_spend_cents / CARD_SPEND_CENTS_PER_BASE_MILE)
        PARTNER_EARN     : base = request.base_miles                (required)
      STEP 2 - tier bonus:
        tier_bps        = TIER_BONUS_BPS[elite_tier_at_earn]
        tier_bonus_miles = round_half_up(base * tier_bps / 10000)
      STEP 3 - promotional multiplier:
        promo_multiplier_bps = MIN_PROMO_MULTIPLIER_BPS when promotion_id is null,
                               else campaign.multiplier_bps
        stacking_mode_applied = null when promotion_id is null, else campaign.stacking_mode
      STEP 4 - total_gross by stacking_mode_applied (m = promo_multiplier_bps, t = tier_bps):
        NONE            : total_gross = base + tier_bonus_miles
        EXCLUSIVE       : total_gross = round_half_up(base * m / 10000)
                          AND tier_bonus_miles is FORCED to 0 (the promotion replaces elite bonus)
        ADDITIVE        : total_gross = round_half_up(base * (10000 + t + (m - 10000)) / 10000)
                          (tier and promo lift are added as independent percentage adders)
        MULTIPLICATIVE  : total_gross = round_half_up(round_half_up(base * (10000 + t) / 10000) * m / 10000)
                          (promo multiplies the ALREADY tier-boosted subtotal; the inner
                           tier-boosted subtotal is rounded to whole miles BEFORE the outer multiply)
      STEP 5 - promotional bonus, capped:
        raw_bonus      = max(0, total_gross - base - tier_bonus_miles)
        campaign_room  = max(0, campaign.bonus_cap_miles - campaign.accrued_bonus_miles)   (null cap => unbounded)
        bonus_miles    = min(raw_bonus, campaign_room, PER_MEMBER_PROMO_CAP_MILES)
      STEP 6 - totals:
        total_miles = base + tier_bonus_miles + bonus_miles
      STEP 7 - qualifying credit (independent of every multiplier above):
        FLIGHT_EARN     : qualifying_miles_credited = base
                          MemberAccount.qualifying_segments_ytd += request.segments
        CARD_SPEND_EARN : qualifying_miles_credited = min(base, CARD_SPEND_QUALIFYING_MILE_CAP)
                          MemberAccount.qualifying_spend_cents_ytd += request.qualifying_spend_cents
        PARTNER_EARN    : qualifying_miles_credited = 0
        MemberAccount.qualifying_miles_ytd += qualifying_miles_credited
      Side effects: MemberAccount.mile_balance += total_miles; lifetime_miles += total_miles;
      LoyaltyProgram.outstanding_miles += total_miles;
      PromotionCampaign.accrued_bonus_miles += bonus_miles; posted_period = LoyaltyProgram.current_period.
      REDEEM / REVERSAL / EXPIRY / ADJUSTMENT rows bypass steps 1-7 entirely: total_miles is taken
      straight from the caller-supplied base_miles with the sign the txn_type dictates
      (REDEEM / EXPIRY / ADJUSTMENT negative, REVERSAL positive), tier_bonus_miles == 0,
      bonus_miles == 0, qualifying_miles_credited == 0.
    edge_cases:
      - "an already exhausted campaign (accrued_bonus_miles == bonus_cap_miles) yields bonus_miles == 0 and the transaction is still created with 201 — the earn is not rejected."
      - "campaign_room smaller than raw_bonus clips the bonus to exactly the remaining room, driving accrued_bonus_miles to precisely bonus_cap_miles."
      - "EXCLUSIVE at multiplier 10000 bps yields total_gross == base, tier_bonus_miles == 0 and bonus_miles == 0 — a PLATINUM member is strictly worse off than with no promotion at all."
      - "MULTIPLICATIVE double-rounds by design (inner tier subtotal, then outer product), so it can differ from ADDITIVE by more than the pure arithmetic difference."
      - "a campaign whose earn_channel does not match the txn_type is rejected with ERR_PROMOTION_CHANNEL_MISMATCH; a campaign whose status != LIVE or whose window does not contain activity_date is rejected with ERR_INVALID_STATE."

  - name: award_dynamic_pricing
    entity: AwardBooking
    algorithm_type: threshold
    trigger: "POST /award-bookings"
    input_set: "the AwardInventoryWindow's authorized_seats / seats_held / seats_confirmed, the requested cabin+fare_class, the optional PartnerAirline's award_pricing_mode, and the MemberAccount's elite_tier"
    constants:
      AWARD_CHART_MILES:
        ECONOMY: { SAVER: 12500, FLEX: 25000 }
        PREMIUM: { SAVER: 25000, FLEX: 45000 }
        BUSINESS: { SAVER: 50000, FLEX: 85000 }
        FIRST: { SAVER: 90000, FLEX: 140000 }
      DEMAND_MULTIPLIER_LADDER_BPS:   # keyed by pre-booking load_factor_bps
        - { load_lt: 5000, multiplier_bps: 9000 }
        - { load_lt: 7500, multiplier_bps: 10000 }
        - { load_lt: 9000, multiplier_bps: 12500 }
        - { load_gte: 9000, multiplier_bps: 16000 }
      PARTNER_UPLIFT_BPS: { OWN_METAL: 10000, FIXED_CHART: 10000, DISTANCE_BAND: 11500 }
      SURCHARGE_BANDS:                # keyed by gross award miles per seat
        - { gross_lt: 25000, band: SURCHARGE_LOW, cents_per_seat: 560 }
        - { gross_lt: 75000, band: SURCHARGE_MID, cents_per_seat: 1120 }
        - { gross_gte: 75000, band: SURCHARGE_HIGH, cents_per_seat: 2240 }
      ELITE_DISCOUNT_BPS:             # [elite_tier][surcharge_band]
        BASE:     { SURCHARGE_LOW: 0,   SURCHARGE_MID: 0,    SURCHARGE_HIGH: 0 }
        SILVER:   { SURCHARGE_LOW: 0,   SURCHARGE_MID: 250,  SURCHARGE_HIGH: 500 }
        GOLD:     { SURCHARGE_LOW: 250, SURCHARGE_MID: 500,  SURCHARGE_HIGH: 1000 }
        PLATINUM: { SURCHARGE_LOW: 500, SURCHARGE_MID: 1000, SURCHARGE_HIGH: 1500 }
      MAX_SEATS_PER_BOOKING: 9
      HOLD_HOURS: 72
    rounding: round_half_up to whole miles and whole cents
    formula: |
      The seven steps run in EXACTLY this order. Each step consumes the previous step's output;
      no step is ever recomputed after a later step changes something.
      STEP 1 - pre-booking load factor (the requested seats are NOT included):
        pre_load_bps = 0 when window.authorized_seats == 0,
                       else round_half_up(10000 * (window.seats_held + window.seats_confirmed) / window.authorized_seats)
      STEP 2 - demand multiplier from DEMAND_MULTIPLIER_LADDER_BPS keyed by pre_load_bps:
        demand_multiplier_bps_applied = 9000  when pre_load_bps < 5000
                                        10000 when 5000 <= pre_load_bps < 7500
                                        12500 when 7500 <= pre_load_bps < 9000
                                        16000 when pre_load_bps >= 9000
      STEP 3 - chart:  chart_miles_per_seat = AWARD_CHART_MILES[window.cabin][fare_class]
      STEP 4 - partner uplift:
        partner_airline_id null                          -> partner_uplift_bps_applied = 10000 (own metal)
        award_pricing_mode == FIXED_CHART                 -> 10000
        award_pricing_mode == DISTANCE_BAND               -> 11500
        award_pricing_mode == DYNAMIC_PASSTHROUGH         -> demand_multiplier_bps_applied (the demand
                                                            multiplier is charged a SECOND time)
      STEP 5 - gross per seat:
        gross_per_seat = round_half_up(chart_miles_per_seat * demand_multiplier_bps_applied
                                       * partner_uplift_bps_applied / 100000000)
      STEP 6 - surcharge band, keyed by gross_per_seat (PRE-discount; the band is never recomputed
               after step 7 lowers the mileage):
        surcharge_band       = SURCHARGE_LOW  when gross_per_seat < 25000
                               SURCHARGE_MID  when 25000 <= gross_per_seat < 75000
                               SURCHARGE_HIGH when gross_per_seat >= 75000
        cash_surcharge_cents = SURCHARGE_BANDS[surcharge_band].cents_per_seat * seats
      STEP 7 - elite discount, keyed by (member.elite_tier, surcharge_band):
        elite_discount_bps_applied = ELITE_DISCOUNT_BPS[elite_tier][surcharge_band]
        quoted_miles = round_half_up(gross_per_seat * (10000 - elite_discount_bps_applied) / 10000) * seats
        (the per-seat price is rounded FIRST and only then multiplied by seats)
      Partner settlement basis, stamped at booking creation:
        partner_settlement_cents = 0 when partner_airline_id is null, else
          round_half_up(quoted_miles * PartnerAirline.settlement_rate_centicents_per_mile / 100)
      hold_expires_at = logical clock now + HOLD_HOURS hours.
    edge_cases:
      - "authorized_seats == 0 short-circuits step 1 to 0 bps (never a division by zero) — but such a window always fails the seat-availability check with ERR_AWARD_SEATS_UNAVAILABLE."
      - "pre_load_bps at exactly 5000 / 7500 / 9000 takes the HIGHER band (the ladder's lower bounds are inclusive)."
      - "gross_per_seat at exactly 25000 or exactly 75000 takes the HIGHER surcharge band."
      - "a PLATINUM discount can pull quoted_miles below the band's threshold without moving the band or the cash surcharge — the band is frozen at step 6."
      - "DYNAMIC_PASSTHROUGH on a >=9000 bps loaded window compounds 16000 bps twice (2.56x chart)."
      - "SAVER is additionally capped by the window's saver allotment round_half_up(authorized_seats * saver_seat_share_bps / 10000); exceeding it raises ERR_SAVER_ALLOTMENT_EXHAUSTED even when raw seats remain."

  - name: elite_qualification_and_rollover
    entity: MemberAccount
    algorithm_type: waterfall_allocation
    trigger: "POST /member-accounts/{memberId}/qualification-cycle/close"
    input_set: "the member's qualifying_miles_ytd, qualifying_segments_ytd, qualifying_spend_cents_ytd and rollover_carried_in"
    constants:
      TIER_THRESHOLDS:
        SILVER:   { miles: 25000,  segments: 30,  spend_cents: 300000 }
        GOLD:     { miles: 75000,  segments: 75,  spend_cents: 900000 }
        PLATINUM: { miles: 150000, segments: 120, spend_cents: 1500000 }
      ROLLOVER_CAP_MILES: 40000
    rounding: "integer arithmetic only; no rounding"
    formula: |
      effective_miles = qualifying_miles_ytd + rollover_carried_in
      A tier T is EARNED when either arm holds:
        MILES ARM   : effective_miles >= TIER_THRESHOLDS[T].miles
        SEGMENT ARM : qualifying_segments_ytd >= TIER_THRESHOLDS[T].segments
                      AND qualifying_spend_cents_ytd >= TIER_THRESHOLDS[T].spend_cents
      (the segment arm is a conjunction: segments alone never earn a tier)
      Evaluate STRICTLY highest-first and stop at the first tier earned:
        PLATINUM -> GOLD -> SILVER -> BASE (BASE is the fallthrough and is always earned)
      awarded_tier_at_close = that tier.
      Rollover spills only what the awarded tier did not consume, and only from the MILES arm:
        consumed          = TIER_THRESHOLDS[awarded_tier_at_close].miles, or 0 when the tier is BASE
        rollover_carried_out = min(ROLLOVER_CAP_MILES, max(0, effective_miles - consumed))
      Side effects: qualification_state = CLOSED; elite_tier = awarded_tier_at_close unless a
      TRIAL/CONFIRMED status match holds a strictly higher tier, in which case elite_tier is
      retained at status_match_tier.
    edge_cases:
      - "effective_miles exactly equal to a threshold EARNS that tier (thresholds are inclusive) and leaves rollover_carried_out == 0."
      - "one mile short of GOLD awards SILVER and rolls the whole 25000+ surplus forward, capped at 40000 — so a near-miss can bank more rollover than a clean qualification."
      - "a member who earns via the SEGMENT arm still computes rollover against the MILES arm, so a low-mileage segment qualifier can carry out 0."
      - "rollover_carried_in from a previous cycle counts toward the MILES arm but never toward segments or spend."
      - "a restate clears awarded_tier_at_close and rollover_carried_out; the subsequent close recomputes from the (unchanged) ledger and reproduces the same answer."

  - name: partner_settlement_run
    entity: PartnerAirline
    algorithm_type: chronological
    trigger: "POST /partner-airlines/{airlineId}/settlement-runs"
    input_set: |
      AwardBooking rows where partner_airline_id == this airline AND status == TICKETED AND
      partner_settled == false AND travel_date <= the logical clock's calendar date, processed in
      created_at ASC order (ties impossible in practice; created_at ASC is the sole ordering key).
    constants:
      RECIPROCITY_FACTOR_BPS: { FULL: 10000, INBOUND_ONLY: 10000, OUTBOUND_ONLY: 5000 }
    rounding: round_half_up to whole cents, applied PER BOOKING before accumulation
    formula: |
      reciprocity_mode == SUSPENDED -> the whole run is rejected with ERR_RECIPROCITY_SUSPENDED
      (no booking is settled, net_settlement_balance_cents unchanged).
      factor_bps = RECIPROCITY_FACTOR_BPS[reciprocity_mode]
      For each eligible booking, in created_at ASC order:
        delta_cents = round_half_up(booking.partner_settlement_cents * factor_bps / 10000)
        PartnerAirline.net_settlement_balance_cents += delta_cents
        PartnerAirline.settled_booking_count += 1
        booking.partner_settled = true   (making the booking permanently ineligible for later runs)
      last_settlement_run_at = logical clock now.
      A run over zero eligible bookings succeeds and changes nothing but last_settlement_run_at.
    edge_cases:
      - "a booking whose travel_date is exactly the clock's calendar date IS eligible (the bound is inclusive)."
      - "OUTBOUND_ONLY halves each booking independently, so two 1121-cent bookings settle to 561 + 561 = 1122, not round_half_up(2242/2) = 1121 — per-booking rounding is the rule."
      - "a HELD or CANCELLED booking is never eligible, even after its travel_date has passed."
      - "refunding a TICKETED booking before settlement removes it from the eligible set; refund is blocked once partner_settled == true."
      - "a second run immediately after the first settles nothing (every candidate now has partner_settled == true) and is not an error."

  - name: fraud_risk_and_clawback
    entity: FraudCase
    algorithm_type: weighted_scoring
    trigger: "POST /fraud-cases (detection_score) and POST /fraud-cases/{caseId}/substantiate (clawback_miles)"
    input_set: "the four signal inputs on the case, plus — at substantiation — the member's mile_balance and the member's MileTransaction rows inside the clawback lookback"
    constants:
      SIGNAL_WEIGHTS_BPS: { geo_velocity: 3500, redemption_velocity: 3000, brokering_pattern: 2500, dormancy: 1000 }
      SIGNAL_SCALES: { geo_velocity_per_hit: 10, redemption_velocity_per_hit: 20, brokering_pattern_per_hit: 25, dormancy_days_per_point: 4 }
      RISK_WATCH_THRESHOLD: 40
      RISK_FREEZE_THRESHOLD: 70
      CLAWBACK_LOOKBACK_DAYS: 90
    rounding: round_half_up to whole points / whole miles
    formula: |
      SCORING (at case creation):
        A = min(100, login_geo_velocity     * 10)
        B = min(100, redemption_velocity_24h * 20)
        C = min(100, brokering_pattern_hits  * 25)
        D = min(100, floor(dormancy_days / 4))
        detection_score = min(100, round_half_up((3500*A + 3000*B + 2500*C + 1000*D) / 10000))
        (each signal is clamped to 100 BEFORE weighting, so no single signal can dominate)
      SECURITY POSTURE (at case creation, applied to the member):
        detection_score >= RISK_FREEZE_THRESHOLD -> security_state = FROZEN, freeze_applied = true
        RISK_WATCH_THRESHOLD <= score < RISK_FREEZE_THRESHOLD -> security_state = WATCH
        score < RISK_WATCH_THRESHOLD -> security_state unchanged
        MemberAccount.risk_score = detection_score in every case.
      CLAWBACK (at substantiation):
        basis = sum of total_miles over the member's MileTransaction rows with
                txn_type IN {FLIGHT_EARN, CARD_SPEND_EARN, PARTNER_EARN} whose activity_date is
                within CLAWBACK_LOOKBACK_DAYS days before the logical clock's calendar date (inclusive)
        MILE_BROKERING    -> clawback_miles = min(MemberAccount.mile_balance, basis)
        VELOCITY_ANOMALY  -> clawback_miles = min(MemberAccount.mile_balance, floor(basis / 2))
        ACCOUNT_TAKEOVER  -> clawback_miles = 0
                             (miles were stolen FROM the member, not earned by them; the account is
                              CLOSED instead of frozen and the balance is preserved for reissue)
    edge_cases:
      - "a score of exactly 40 sets WATCH; exactly 70 sets FROZEN (both bounds inclusive)."
      - "a low-signal case (score below 40) still opens and can still be substantiated — substantiation freezes the member regardless of the original score."
      - "clawback is capped by the member's CURRENT mile_balance, so a member who has already redeemed everything is clawed back 0 and the ADJUSTMENT row is skipped entirely."
      - "earn rows outside the 90-day lookback are excluded from the basis even though they are still in the balance."
      - "ACCOUNT_TAKEOVER substantiation moves security_state to CLOSED (the only way CLOSED is produced) and leaves mile_balance untouched."

  - name: member_reaction_index
    entity: ProgramChangeNotice
    algorithm_type: weighted_scoring
    trigger: "POST /program-change-notices/{noticeId}/announce"
    input_set: "the notice's change_type, effective_at, grandfather_until, the logical clock at announce time, and the count of MemberAccount rows in the program whose elite_tier != BASE (exposed_member_count)"
    constants:
      SEVERITY_POINTS: { EARN_STRUCTURE: 40, AWARD_PRICING: 50, ELITE_THRESHOLD: 30, EXPIRY_POLICY: 20 }
      LEAD_TIME_FACTOR_BPS:
        - { notice_days_gte: 180, factor_bps: 10000 }
        - { notice_days_gte: 90,  factor_bps: 12500 }
        - { notice_days_gte: 30,  factor_bps: 15000 }
        - { notice_days_lt: 30,   factor_bps: 20000 }
      GRANDFATHER_RELIEF_POINTS: { FULL_YEAR: 30, PARTIAL: 15, NONE: 0 }
      GRANDFATHER_FULL_YEAR_DAYS: 365
      EXPOSURE_POINTS_PER_MEMBER_BPS: 100
      EXPOSURE_UPLIFT_CAP_BPS: 5000
      REACTION_RISK_BLOCK_THRESHOLD: 70
    rounding: round_half_up to whole points
    formula: |
      notice_days = whole days from the logical clock now to effective_at (floor of the difference)
      severity    = SEVERITY_POINTS[change_type]
      lead_bps    = 10000 when notice_days >= 180
                    12500 when 90  <= notice_days < 180
                    15000 when 30  <= notice_days < 90
                    20000 when notice_days < 30
      relief      = 30 when grandfather_until >= effective_at + 365 days
                    15 when grandfather_until >= effective_at (but < effective_at + 365 days)
                    0  when grandfather_until is null
      exposure_bps = 10000 + min(EXPOSURE_UPLIFT_CAP_BPS, exposed_member_count * EXPOSURE_POINTS_PER_MEMBER_BPS)
      member_reaction_index = min(100,
        round_half_up(max(0, round_half_up(severity * lead_bps / 10000) - relief) * exposure_bps / 10000))
      exposed_member_count is snapshotted onto the notice at announce time.
      GATE: announce is rejected with ERR_REACTION_RISK_EXCEEDED when
      member_reaction_index >= REACTION_RISK_BLOCK_THRESHOLD AND grandfather_until is null.
      A notice can therefore always be pushed through by attaching grandfathering, which also
      lowers the index by the relief points.
    edge_cases:
      - "notice_days exactly 180 / 90 / 30 takes the LOWER (kinder) factor — the bounds are inclusive from below."
      - "grandfather_until exactly equal to effective_at earns PARTIAL relief (15), not zero."
      - "relief can drive the pre-exposure term to 0, in which case the index is 0 no matter how many members are exposed."
      - "exposure uplift saturates at 5000 bps (50 exposed members); the 51st exposed member does not move the index."
      - "an index of exactly 70 with no grandfathering is BLOCKED (the threshold is inclusive); the same index with grandfathering announces."

# =====================================================================
# §1.4 Validation Rules (evaluated in ascending `priority` order;
# the FIRST rule that fires is the response and no later rule runs)
# =====================================================================
validations:

  - priority: 1
    rule: "X-User-Role header present and one of the seven declared roles; X-User-ID header present on every request"
    error_id: ERR_UNAUTHENTICATED
    http_status: 401
    category: auth
    applies_to: "every endpoint including /_clock and /_ops"

  - priority: 2
    rule: "the caller's role is listed in the endpoint's allowed_roles"
    error_id: ERR_FORBIDDEN_ROLE
    http_status: 403
    category: auth
    applies_to: "every endpoint"

  - priority: 3
    rule: "a caller with role Member may only read or act on the MemberAccount whose id equals X-User-ID, and on AwardBooking / MileTransaction / FraudCase rows whose member_id equals X-User-ID"
    error_id: ERR_MEMBER_SCOPE_VIOLATION
    http_status: 403
    category: auth
    applies_to: "member-scoped reads and actions"

  - priority: 4
    rule: "a caller with role IssuerRepresentative may only act on MileSaleAgreement rows whose issuer_id equals X-User-ID"
    error_id: ERR_ISSUER_SCOPE_VIOLATION
    http_status: 403
    category: auth
    applies_to: "POST /mile-sale-agreements/{agreementId}/counter and issuer-scoped reads"

  - priority: 5
    rule: "every path-parameter id resolves to an existing row, checked LEFT TO RIGHT along the path"
    error_id: "ERR_<ENTITY>_NOT_FOUND"
    http_status: 404
    category: existence
    applies_to: "every endpoint carrying a path parameter"

  - priority: 6
    rule: "every FK supplied in the request body resolves to an existing row, checked in the order the fields are declared in the endpoint's input"
    error_id: "ERR_<ENTITY>_NOT_FOUND"
    http_status: 404
    category: existence
    applies_to: "every create endpoint carrying FKs"

  - priority: 7
    rule: "request body is well-formed: required fields present, enums in range, integers within their declared bounds, dates ISO-8601, tier_schedule shaped as an array of {threshold_miles, price_per_mile_centicents} with entry[0].threshold_miles == 0, strictly increasing threshold_miles and strictly decreasing price_per_mile_centicents. Two bounds are deliberately EXCLUDED from this rule because they carry dedicated rules further down the ladder: AwardBooking.seats (priority 26, ERR_SEAT_COUNT_INVALID) and every interval ordering (priority 14, ERR_INVALID_INTERVAL) — an out-of-range seats value or an inverted interval must NOT surface as ERR_INVALID_REQUEST"
    error_id: ERR_INVALID_REQUEST
    http_status: 400
    category: schema
    applies_to: "every write endpoint"

  - priority: 8
    rule: "the target row is in a state from which the requested transition exists (see §1.2); includes 'issuer is ACTIVE', 'agreement is ACTIVE before an order may be created', 'campaign is LIVE before it may be referenced by an earn', 'booking hold is HELD', 'case is in the expected status'"
    error_id: ERR_INVALID_STATE
    http_status: 409
    category: state
    applies_to: "every transition endpoint and every create endpoint with a parent-state precondition"

  - priority: 9
    rule: "the supplied expected_<parent>_version equals the parent's current version (see §1.2.1)"
    error_id: ERR_STALE_VERSION
    http_status: 412
    category: concurrency
    applies_to: "POST /mile-purchase-orders, POST /award-bookings, POST /deferred-revenue-postings, POST /program-change-notices"

  - priority: 10
    rule: "the ratifying ContractsOfficer's X-User-ID differs from MileSaleAgreement.negotiated_by_user_id"
    error_id: ERR_SEGREGATION_OF_DUTIES
    http_status: 409
    category: governance
    applies_to: "POST /mile-sale-agreements/{agreementId}/ratify"

  - priority: 11
    rule: "the adjudicating FraudAnalyst's X-User-ID differs from FraudCase.opened_by_user_id"
    error_id: ERR_SEGREGATION_OF_DUTIES
    http_status: 409
    category: governance
    applies_to: "POST /fraud-cases/{caseId}/substantiate and POST /fraud-cases/{caseId}/dismiss"

  - priority: 12
    rule: "the MemberAccount's security_state is NORMAL for any mile-moving or seat-taking operation (mile transaction insert, award booking create, ticket, status match)"
    error_id: ERR_MEMBER_FROZEN
    http_status: 409
    category: business_safety
    applies_to: "POST /mile-transactions, POST /award-bookings, POST /award-bookings/{bookingId}/ticket, POST /member-accounts/{memberId}/status-match"

  - priority: 13
    rule: "the LoyaltyProgram's revenue_recognition_state is not LOCKED for any ledger-moving operation (mile transaction insert, order invoice, booking ticket/refund, deferred-revenue posting, fraud substantiation)"
    error_id: ERR_PERIOD_LOCKED
    http_status: 409
    category: business_accounting
    applies_to: "POST /mile-transactions, POST /mile-purchase-orders/{orderId}/invoice, POST /award-bookings/{bookingId}/ticket, POST /award-bookings/{bookingId}/refund, POST /deferred-revenue-postings, POST /fraud-cases/{caseId}/substantiate"

  - priority: 14
    rule: "every date interval is ordered: term_start_date <= term_end_date, window_start_date <= window_end_date, window_start < window_end"
    error_id: ERR_INVALID_INTERVAL
    http_status: 422
    category: business_temporal
    applies_to: "POST /mile-sale-agreements, POST /promotion-campaigns, POST /award-inventory-windows"

  - priority: 15
    rule: "a newly created promotion campaign or award inventory window must not open in the past: window_start (or window_start_date) >= the logical clock's current instant (dates compare at 00:00:00Z)"
    error_id: ERR_WINDOW_IN_PAST
    http_status: 422
    category: business_temporal
    applies_to: "POST /promotion-campaigns, POST /award-inventory-windows"

  - priority: 16
    rule: "a program change notice must be schedulable: effective_at > the logical clock now, and grandfather_until (when supplied) >= effective_at"
    error_id: ERR_INVALID_NOTICE_SCHEDULE
    http_status: 422
    category: business_temporal
    applies_to: "POST /program-change-notices, POST /program-change-notices/{noticeId}/announce"

  - priority: 17
    rule: "an agreement term must be at least 90 days long and must start no earlier than the logical clock's calendar date"
    error_id: ERR_INVALID_TERM
    http_status: 422
    category: business_temporal
    applies_to: "POST /mile-sale-agreements"

  - priority: 18
    rule: "AwardBooking.travel_date falls inside the AwardInventoryWindow's closed interval [window_start_date, window_end_date]"
    error_id: ERR_TRAVEL_DATE_OUT_OF_WINDOW
    http_status: 422
    category: business_temporal
    applies_to: "POST /award-bookings"

  - priority: 19
    rule: "a new promotion campaign's half-open window [window_start, window_end) must not overlap any SCHEDULED or LIVE campaign with the same (program_id, earn_channel); exact adjacency (previous.window_end == new.window_start) is ALLOWED"
    error_id: ERR_PROMOTION_WINDOW_OVERLAP
    http_status: 409
    category: business_constraint
    applies_to: "POST /promotion-campaigns"

  - priority: 20
    rule: "a new award inventory window must leave at least AWARD_WINDOW_BUFFER_DAYS = 2 clear days between its closed interval [window_start_date, window_end_date] and every existing window with the same (program_id, route_code, cabin); overlap or an insufficient gap is rejected"
    error_id: ERR_AWARD_WINDOW_BUFFER_VIOLATION
    http_status: 409
    category: business_constraint
    applies_to: "POST /award-inventory-windows"

  - priority: 21
    rule: "a new mile sale agreement's closed term [term_start_date, term_end_date] must not overlap any agreement of the same issuer whose status IN {DRAFT, ISSUER_REVIEW, COUNTERED, RATIFIED, ACTIVE}, unless the new agreement supersedes that very agreement"
    error_id: ERR_AGREEMENT_TERM_OVERLAP
    http_status: 409
    category: business_constraint
    applies_to: "POST /mile-sale-agreements"

  - priority: 22
    rule: "supersedes_agreement_id, when supplied, must reference an agreement of the SAME issuer whose status IN {RATIFIED, ACTIVE} and must not already be superseded by another agreement, and must not be the new agreement itself"
    error_id: ERR_SUPERSEDE_TARGET_INVALID
    http_status: 422
    category: business_constraint
    applies_to: "POST /mile-sale-agreements"

  - priority: 23
    rule: "the referenced PromotionCampaign's earn_channel matches the transaction's txn_type (FLIGHT<->FLIGHT_EARN, CARD_SPEND<->CARD_SPEND_EARN, PARTNER<->PARTNER_EARN), and the campaign's half-open window contains activity_date"
    error_id: ERR_PROMOTION_CHANNEL_MISMATCH
    http_status: 422
    category: business_constraint
    applies_to: "POST /mile-transactions"

  - priority: 24
    rule: "the PartnerAirline's reciprocity_mode is not SUSPENDED when a settlement run is requested or when the airline is referenced by a new award booking"
    error_id: ERR_RECIPROCITY_SUSPENDED
    http_status: 409
    category: business_constraint
    applies_to: "POST /partner-airlines/{airlineId}/settlement-runs, POST /award-bookings"

  - priority: 25
    rule: "the AwardInventoryWindow's capacity_control_state is not CLOSED"
    error_id: ERR_AWARD_WINDOW_CLOSED
    http_status: 409
    category: business_capacity
    applies_to: "POST /award-bookings"

  - priority: 26
    rule: "seats is between 1 and MAX_SEATS_PER_BOOKING = 9 inclusive"
    error_id: ERR_SEAT_COUNT_INVALID
    http_status: 422
    category: business_capacity
    applies_to: "POST /award-bookings"

  - priority: 27
    rule: "every cross-entity reference in one request must belong to the same LoyaltyProgram (member, window, partner airline, promotion, notice, posting)"
    error_id: ERR_CROSS_PROGRAM_REFERENCE
    http_status: 422
    category: business_integrity
    applies_to: "POST /award-bookings, POST /mile-transactions"

  - priority: 28
    rule: "seats_held + seats_confirmed + requested seats <= authorized_seats"
    error_id: ERR_AWARD_SEATS_UNAVAILABLE
    http_status: 409
    category: business_capacity
    applies_to: "POST /award-bookings"

  - priority: 29
    rule: "for fare_class == SAVER: saver_seats_consumed + requested seats <= round_half_up(authorized_seats * saver_seat_share_bps / 10000)"
    error_id: ERR_SAVER_ALLOTMENT_EXHAUSTED
    http_status: 409
    category: business_capacity
    applies_to: "POST /award-bookings"

  - priority: 30
    rule: "the AwardBooking's hold is still live: hold_expires_at > the logical clock now"
    error_id: ERR_HOLD_EXPIRED
    http_status: 409
    category: business_temporal
    applies_to: "POST /award-bookings/{bookingId}/ticket"

  - priority: 31
    rule: "MemberAccount.mile_balance >= the miles being debited (quoted_miles at ticketing, base_miles at REDEEM / EXPIRY / ADJUSTMENT)"
    error_id: ERR_INSUFFICIENT_MILES
    http_status: 402
    category: business_fiscal
    applies_to: "POST /award-bookings/{bookingId}/ticket, POST /mile-transactions"

  - priority: 32
    rule: "MileSaleAgreement.drawn_miles + order_miles <= round_half_up(committed_volume_miles * VOLUME_OVERDRAW_TOLERANCE_BPS / 10000)"
    error_id: ERR_VOLUME_COMMITMENT_EXCEEDED
    http_status: 409
    category: business_fiscal
    applies_to: "POST /mile-purchase-orders"

  - priority: 33
    rule: "CoBrandIssuer.status is ACTIVE when submitting an agreement, activating an agreement or creating a mile purchase order"
    error_id: ERR_ISSUER_SUSPENDED
    http_status: 409
    category: business_fiscal
    applies_to: "POST /mile-sale-agreements/{agreementId}/submit, POST /mile-sale-agreements/{agreementId}/activate, POST /mile-purchase-orders"

  - priority: 34
    rule: "CoBrandIssuer.aggregate_committed_miles (net of any agreement this one supersedes) + committed_volume_miles <= annual_mile_purchase_cap_miles at ratification"
    error_id: ERR_ISSUER_CAP_EXCEEDED
    http_status: 409
    category: business_fiscal
    applies_to: "POST /mile-sale-agreements/{agreementId}/ratify"

  - priority: 35
    rule: "member_reaction_index < REACTION_RISK_BLOCK_THRESHOLD = 70, or grandfather_until is not null"
    error_id: ERR_REACTION_RISK_EXCEEDED
    http_status: 409
    category: business_governance
    applies_to: "POST /program-change-notices/{noticeId}/announce"

  - priority: 36
    rule: "at most one DeferredRevenuePosting per (program_id, period)"
    error_id: ERR_PERIOD_ALREADY_POSTED
    http_status: 409
    category: business_accounting
    applies_to: "POST /deferred-revenue-postings"

# =====================================================================
# §1.5 API Endpoint Table
# =====================================================================
endpoints:

  # ---------------- LoyaltyProgram ----------------------------------
  - method: POST
    path: "/loyalty-programs"
    description: "Create a loyalty program. revenue_recognition_state starts OPEN; all four ledger counters start at 0."
    roles: [ProgramAdmin]
    code: 201
    input: ["name", "currency_code?", "current_period?", "breakage_policy_mode?", "saver_share_default_bps?"]
    output: LoyaltyProgram
    side_effects: ["none"]

  - method: GET
    path: "/loyalty-programs"
    description: "List loyalty programs, paginated."
    roles: [ProgramAdmin, PartnerManager, ContractsOfficer, RevenueAccountant, FraudAnalyst]
    code: 200
    input: ["limit?", "offset?"]
    output: LoyaltyProgram[]
    side_effects: ["none"]

  - method: GET
    path: "/loyalty-programs/{programId}"
    description: "Read a loyalty program including outstanding_miles, deferred_revenue_cents and version."
    roles: [ProgramAdmin, PartnerManager, ContractsOfficer, RevenueAccountant, FraudAnalyst]
    code: 200
    input: []
    output: LoyaltyProgram
    side_effects: ["none"]

  - method: POST
    path: "/loyalty-programs/{programId}/recognition-transitions"
    description: "Drive the accounting-period posture OPEN -> CLOSING -> LOCKED -> OPEN (cyclic). LOCKED -> OPEN advances current_period by one month."
    roles: [RevenueAccountant]
    code: 200
    input: ["target_state"]
    output: LoyaltyProgram
    side_effects:
      - "revenue_recognition_state set to target_state"
      - "current_period advanced by one calendar month on LOCKED -> OPEN"
      - "increments LoyaltyProgram.version by 1"

  # ---------------- CoBrandIssuer -----------------------------------
  - method: POST
    path: "/co-brand-issuers"
    description: "Register a co-brand card issuer under a program with an annual mile-purchase cap."
    roles: [ProgramAdmin, PartnerManager]
    code: 201
    input: ["program_id", "name", "annual_mile_purchase_cap_miles"]
    output: CoBrandIssuer
    side_effects: ["none"]

  - method: GET
    path: "/co-brand-issuers"
    description: "List co-brand issuers, filterable by program_id and status."
    roles: [ProgramAdmin, PartnerManager, ContractsOfficer, RevenueAccountant, IssuerRepresentative]
    code: 200
    input: ["program_id?", "status?", "limit?", "offset?"]
    output: CoBrandIssuer[]
    side_effects: ["none"]

  - method: GET
    path: "/co-brand-issuers/{issuerId}"
    description: "Read a co-brand issuer including aggregate_committed_miles and suspension_reason."
    roles: [ProgramAdmin, PartnerManager, ContractsOfficer, RevenueAccountant, IssuerRepresentative]
    code: 200
    input: []
    output: CoBrandIssuer
    side_effects: ["none"]

  # ---------------- MileSaleAgreement -------------------------------
  - method: POST
    path: "/mile-sale-agreements"
    description: "Draft a mile sale agreement with a tier schedule. Term must be >= 90 days and must not overlap another live agreement of the same issuer."
    roles: [PartnerManager]
    code: 201
    input: ["issuer_id", "term_start_date", "term_end_date", "committed_volume_miles", "tier_schedule", "supersedes_agreement_id?"]
    output: MileSaleAgreement
    side_effects: ["none — the agreement starts in DRAFT and does not yet count toward the issuer's aggregate"]

  - method: GET
    path: "/mile-sale-agreements"
    description: "List mile sale agreements, filterable by issuer_id, supersedes_agreement_id and status."
    roles: [ProgramAdmin, PartnerManager, ContractsOfficer, RevenueAccountant, IssuerRepresentative]
    code: 200
    input: ["issuer_id?", "supersedes_agreement_id?", "status?", "limit?", "offset?"]
    output: MileSaleAgreement[]
    side_effects: ["none"]

  - method: GET
    path: "/mile-sale-agreements/{agreementId}"
    description: "Read a mile sale agreement including negotiation_round, drawn_miles, prepayment_balance_miles and version."
    roles: [ProgramAdmin, PartnerManager, ContractsOfficer, RevenueAccountant, IssuerRepresentative]
    code: 200
    input: []
    output: MileSaleAgreement
    side_effects: ["none"]

  - method: POST
    path: "/mile-sale-agreements/{agreementId}/submit"
    description: "Submit a DRAFT agreement to the issuer for review. Stamps negotiated_by_user_id from X-User-ID."
    roles: [PartnerManager]
    code: 200
    input: []
    output: MileSaleAgreement
    side_effects: ["status DRAFT -> ISSUER_REVIEW", "negotiated_by_user_id = X-User-ID", "increments MileSaleAgreement.version by 1"]

  - method: POST
    path: "/mile-sale-agreements/{agreementId}/counter"
    description: "Issuer counters the terms under review. Only the issuer named on the agreement may counter."
    roles: [IssuerRepresentative]
    code: 200
    input: ["counter_price_per_mile_centicents", "counter_committed_volume_miles", "note?"]
    output: MileSaleAgreement
    side_effects: ["status ISSUER_REVIEW -> COUNTERED", "countered_* fields stamped", "increments MileSaleAgreement.version by 1"]

  - method: POST
    path: "/mile-sale-agreements/{agreementId}/revise"
    description: "Airline revises a COUNTERED agreement back into DRAFT, incrementing negotiation_round."
    roles: [PartnerManager]
    code: 200
    input: ["tier_schedule", "committed_volume_miles"]
    output: MileSaleAgreement
    side_effects: ["status COUNTERED -> DRAFT", "negotiation_round += 1", "negotiated_by_user_id = X-User-ID", "increments MileSaleAgreement.version by 1"]

  - method: POST
    path: "/mile-sale-agreements/{agreementId}/ratify"
    description: "Ratify an agreement under issuer review. Segregation of duties: the ratifier must differ from negotiated_by_user_id. Terminates any superseded agreement and recomputes the issuer's aggregate."
    roles: [ContractsOfficer]
    code: 200
    input: []
    output: MileSaleAgreement
    side_effects:
      - "status ISSUER_REVIEW -> RATIFIED; ratified_by_user_id = X-User-ID"
      - "superseded agreement ACTIVE -> TERMINATED and its prepayment_balance_miles transferred onto this agreement"
      - "CoBrandIssuer.aggregate_committed_miles recomputed; issuer SUSPENDED / CAP_BREACH at or above the utilization alert"
      - "increments MileSaleAgreement.version by 1"

  - method: POST
    path: "/mile-sale-agreements/{agreementId}/activate"
    description: "Activate a RATIFIED agreement so mile purchase orders may be drawn against it."
    roles: [ContractsOfficer]
    code: 200
    input: []
    output: MileSaleAgreement
    side_effects: ["status RATIFIED -> ACTIVE", "increments MileSaleAgreement.version by 1"]

  # ---------------- MilePurchaseOrder -------------------------------
  - method: POST
    path: "/mile-purchase-orders"
    description: "Draw miles against an ACTIVE agreement. Prices the order with the PROVISIONAL_AT_ORDER variant using the agreement's drawn_miles as the tier anchor. Requires the agreement's current version."
    roles: [PartnerManager]
    code: 201
    input: ["agreement_id", "order_miles", "expected_agreement_version"]
    output: MilePurchaseOrder
    side_effects:
      - "drawn_miles_before captured from MileSaleAgreement.drawn_miles"
      - "provisional_tier_price_centicents and gross_amount_cents computed"
      - "increments MileSaleAgreement.version by 1"

  - method: GET
    path: "/mile-purchase-orders"
    description: "List mile purchase orders, filterable by agreement_id, fulfillment_status and settlement_status."
    roles: [ProgramAdmin, PartnerManager, ContractsOfficer, RevenueAccountant, IssuerRepresentative]
    code: 200
    input: ["agreement_id?", "fulfillment_status?", "settlement_status?", "limit?", "offset?"]
    output: MilePurchaseOrder[]
    side_effects: ["none"]

  - method: GET
    path: "/mile-purchase-orders/{orderId}"
    description: "Read a mile purchase order including both status dimensions and all three cent amounts."
    roles: [ProgramAdmin, PartnerManager, ContractsOfficer, RevenueAccountant, IssuerRepresentative]
    code: 200
    input: []
    output: MilePurchaseOrder
    side_effects: ["none"]

  - method: POST
    path: "/mile-purchase-orders/{orderId}/issue"
    description: "Issue the purchased miles: advances the agreement's drawn_miles and prepayment balance and credits program deferred revenue."
    roles: [PartnerManager]
    code: 200
    input: []
    output: MilePurchaseOrder
    side_effects:
      - "fulfillment_status PENDING -> ISSUED"
      - "MileSaleAgreement.drawn_miles += order_miles; prepayment_balance_miles += order_miles"
      - "LoyaltyProgram.deferred_revenue_cents += gross_amount_cents"
      - "increments MilePurchaseOrder.version by 1 and MileSaleAgreement.version by 1"

  - method: POST
    path: "/mile-purchase-orders/{orderId}/invoice"
    description: "Invoice an issued order: runs the FINAL_AT_INVOICE pricing variant with per-slice rounding and books the volume true-up."
    roles: [RevenueAccountant]
    code: 200
    input: []
    output: MilePurchaseOrder
    side_effects:
      - "settlement_status PENDING -> INVOICED"
      - "final_amount_cents, volume_true_up_cents and net_amount_cents computed"
      - "LoyaltyProgram.deferred_revenue_cents += volume_true_up_cents"
      - "posted_period stamped from LoyaltyProgram.current_period"
      - "increments MilePurchaseOrder.version by 1"

  - method: POST
    path: "/mile-purchase-orders/{orderId}/settle"
    description: "Record cash settlement of an invoiced order."
    roles: [RevenueAccountant]
    code: 200
    input: []
    output: MilePurchaseOrder
    side_effects: ["settlement_status INVOICED -> SETTLED", "increments MilePurchaseOrder.version by 1"]

  - method: POST
    path: "/mile-purchase-orders/{orderId}/reverse"
    description: "Reverse an issued but unsettled order, unwinding drawn miles, prepayment balance and deferred revenue."
    roles: [PartnerManager]
    code: 200
    input: ["reason"]
    output: MilePurchaseOrder
    side_effects:
      - "fulfillment_status ISSUED -> REVERSED; settlement_status -> WRITTEN_OFF"
      - "MileSaleAgreement.drawn_miles -= order_miles; prepayment_balance_miles -= order_miles"
      - "LoyaltyProgram.deferred_revenue_cents debited by net_amount_cents when invoiced, else gross_amount_cents"
      - "increments MilePurchaseOrder.version by 1 and MileSaleAgreement.version by 1"

  # ---------------- MemberAccount -----------------------------------
  - method: POST
    path: "/member-accounts"
    description: "Open a member account. Starts BASE / NORMAL / NONE / ACCUMULATING with zeroed qualification counters."
    roles: [ProgramAdmin]
    code: 201
    input: ["program_id", "external_member_ref", "home_region", "cycle_year?", "rollover_carried_in?"]
    output: MemberAccount
    side_effects: ["none"]

  - method: GET
    path: "/member-accounts"
    description: "List member accounts, filterable by program_id, elite_tier and security_state."
    roles: [ProgramAdmin, FraudAnalyst, RevenueAccountant, Member]
    code: 200
    input: ["program_id?", "elite_tier?", "security_state?", "limit?", "offset?"]
    output: MemberAccount[]
    side_effects: ["none"]

  - method: GET
    path: "/member-accounts/{memberId}"
    description: "Read a member account including mile_balance, the three status dimensions and every qualification counter."
    roles: [ProgramAdmin, FraudAnalyst, RevenueAccountant, Member]
    code: 200
    input: []
    output: MemberAccount
    side_effects: ["none"]

  - method: POST
    path: "/member-accounts/{memberId}/status-match"
    description: "Grant a trial status match at a strictly higher tier for trial_days days. Requires security_state NORMAL."
    roles: [ProgramAdmin]
    code: 200
    input: ["matched_tier", "trial_days"]
    output: MemberAccount
    side_effects:
      - "status_match_state NONE -> TRIAL; status_match_tier and status_match_expires_at set"
      - "elite_tier raised to matched_tier"
      - "increments MemberAccount.version by 1"

  - method: POST
    path: "/member-accounts/{memberId}/status-match/resolve"
    description: "Resolve a trial status match. outcome=CONFIRM keeps the matched tier; outcome=LAPSE reverts to the last awarded tier (or BASE)."
    roles: [ProgramAdmin]
    code: 200
    input: ["outcome"]
    output: MemberAccount
    side_effects:
      - "status_match_state TRIAL -> CONFIRMED or TRIAL -> LAPSED"
      - "elite_tier retained or reverted accordingly"
      - "increments MemberAccount.version by 1"

  - method: POST
    path: "/member-accounts/{memberId}/qualification-cycle/close"
    description: "Close the qualification cycle: runs elite_qualification_and_rollover to award a tier and bank rollover miles."
    roles: [ProgramAdmin]
    code: 200
    input: []
    output: MemberAccount
    side_effects:
      - "qualification_state ACCUMULATING|RESTATED -> CLOSED"
      - "awarded_tier_at_close and rollover_carried_out computed; elite_tier updated unless a higher status match holds"
      - "increments MemberAccount.version by 1"

  - method: POST
    path: "/member-accounts/{memberId}/qualification-cycle/restate"
    description: "Reopen a closed qualification cycle for restatement, clearing the awarded tier and banked rollover."
    roles: [ProgramAdmin]
    code: 200
    input: ["reason"]
    output: MemberAccount
    side_effects:
      - "qualification_state CLOSED -> RESTATED"
      - "awarded_tier_at_close cleared; rollover_carried_out reset to 0; elite_tier reverts to BASE unless a status match holds higher"
      - "increments MemberAccount.version by 1"

  # ---------------- MileTransaction ---------------------------------
  - method: POST
    path: "/mile-transactions"
    description: "Post a mile ledger row. Earn types run earning_credit_with_multipliers; REDEEM / REVERSAL / EXPIRY / ADJUSTMENT post the caller-supplied magnitude with the sign the type dictates."
    roles: [ProgramAdmin, RevenueAccountant]
    code: 201
    input: ["member_id", "txn_type", "activity_date", "base_miles?", "qualifying_spend_cents?", "segments?", "promotion_id?", "award_booking_id?", "reverses_transaction_id?"]
    output: MileTransaction
    side_effects:
      - "tier_bonus_miles, bonus_miles, total_miles and qualifying_miles_credited computed"
      - "MemberAccount.mile_balance, lifetime_miles and the three qualification counters updated"
      - "LoyaltyProgram.outstanding_miles updated"
      - "PromotionCampaign.accrued_bonus_miles += bonus_miles"

  - method: GET
    path: "/mile-transactions"
    description: "List mile ledger rows, filterable by member_id, promotion_id, award_booking_id, reverses_transaction_id and txn_type."
    roles: [ProgramAdmin, RevenueAccountant, FraudAnalyst, Member]
    code: 200
    input: ["member_id?", "promotion_id?", "award_booking_id?", "reverses_transaction_id?", "txn_type?", "limit?", "offset?"]
    output: MileTransaction[]
    side_effects: ["none"]

  - method: GET
    path: "/mile-transactions/{transactionId}"
    description: "Read a single immutable mile ledger row."
    roles: [ProgramAdmin, RevenueAccountant, FraudAnalyst, Member]
    code: 200
    input: []
    output: MileTransaction
    side_effects: ["none"]

  # ---------------- PromotionCampaign -------------------------------
  - method: POST
    path: "/promotion-campaigns"
