scenario: "496. Water Treatment & Softener Service (Culligan style): water test & system recommendation, install & rental/purchase, salt/filter delivery & route, recurring service & regeneration, RO/UV cartridge schedule, billing & rental contract, well/whole-house, warranty/repair"
domain_name: "water-softener-service"
api_prefix: "/"

complexity_profile:
  primary_archetype: "Workflow orchestration"
  secondary_archetype: "Temporal windowing"
  complexity_layers:
    - "Dual-variant calculation"
    - "Scheduled / deferred actions"
    - "Cascading side effects"
    - "Rate / threshold triggers"
    - "Optimistic concurrency"

  entity_topology: flat
  # Peer entities linked by FK references: ServiceAccount is the hub, but
  # WaterTest, SoftenerSystem, RentalContract, RouteStop, CartridgeSchedule,
  # ServiceVisit, WarrantyClaim, Invoice are peers wired by foreign keys, not
  # nested URL paths. Routes own RouteStops as the only nested pair.

  state_machine_shape: parallel
  # SoftenerSystem carries two independent state dimensions (lifecycle_status
  # × regen_health). RentalContract is cyclic (suspend↔active). WarrantyClaim
  # is branching fork-join (TRIAGED → {REPAIR, REPLACE} → CLOSED). Invoice and
  # ServiceVisit add linear/guarded machines. RouteStop is guarded by Route.

  relationship_patterns:
    - one_to_many        # ServiceAccount → SoftenerSystem, RentalContract, Invoice
    - cross_aggregate    # RouteStop.system_id crosses into SoftenerSystem; WarrantyClaim → RentalContract
    - self_referential   # Invoice.supersedes_invoice_id references a prior Invoice

  role_model: peer_roles
  # FieldTech owns service visits & route execution; Dispatcher owns routes &
  # scheduling; BillingClerk owns invoices & contracts; Customer (entity_backed)
  # owns their own account read + claim filing. ServiceManager is a hierarchical
  # superset for overrides.

  consistency_model: immediate

response_envelope:
  success: |
    { "meta": { "api_request_id": "req_xxx", "api_request_timestamp": "ISO8601" },
      "response_type": "object" | "array", "data": {} }
  error: |
    { "meta": { ... }, "response_type": "error",
      "data": { "error_id": "ERR_XXX", "message": "..." } }
  pagination_fields: ["limit", "offset", "total_count", "has_more"]
  pagination_defaults: { limit: 10, min: 1, max: 100, offset: 0 }

# =============================================================================
# §1.1 Entity-Relationship Table
# =============================================================================
entities:
  - name: ServiceAccount
    parent: null
    common_fields: true
    fields:
      - name: customer_id
        type: string
        source: input
        description: "FK -> Customer.id; the account holder who owns this service account"
      - name: property_type
        type: enum
        source: input
        description: "Installation site water source / scope"
        constraints: "one of {MUNICIPAL_WHOLE_HOUSE, WELL_WHOLE_HOUSE, POINT_OF_USE}"
      - name: service_zone
        type: string
        source: input
        description: "Geographic routing zone the address falls in"
        constraints: "non-empty; e.g. 'Z-NORTH', 'Z-SOUTH'"
      - name: credit_balance_cents
        type: integer
        source: computed
        description: "Account-level prepaid credit ledger in cents; debited by invoices, credited by rental compensation. Never negative."
        default: 0
      - name: hardness_gpg
        type: number
        source: computed
        description: "Latest accepted WaterTest grains-per-gallon hardness reading; copied from the WaterTest whose status flipped to ACCEPTED. Null until first accepted test."
      - name: standing
        type: enum
        source: computed
        description: "Derived collections posture: GOOD while no invoice is past due >0 days; DELINQUENT once any OPEN invoice passes its due window. Gates new rental contracts."
        default: "GOOD"
        constraints: "one of {GOOD, DELINQUENT}"

  - name: WaterTest
    parent: null
    common_fields: true
    fields:
      - name: account_id
        type: string
        source: input
        description: "FK -> ServiceAccount.id; the account this water test was performed for"
      - name: hardness_gpg
        type: number
        source: input
        description: "Measured water hardness in grains per gallon"
        constraints: ">= 0"
      - name: iron_ppm
        type: number
        source: input
        description: "Measured dissolved iron in parts per million"
        constraints: ">= 0"
      - name: tds_ppm
        type: integer
        source: input
        description: "Total dissolved solids in parts per million"
        constraints: ">= 0"
      - name: status
        type: enum
        source: computed
        description: "Test lifecycle: DRAFT on creation, RECOMMENDED once a recommendation is computed, ACCEPTED once the customer accepts, SUPERSEDED if a newer test for the same account is accepted."
        default: "DRAFT"
        constraints: "one of {DRAFT, RECOMMENDED, ACCEPTED, SUPERSEDED}"
      - name: recommended_grain_capacity
        type: integer
        source: computed
        description: "System grain capacity sizing recommended from hardness, iron, and household demand. Null until status RECOMMENDED."
      - name: recommended_needs_ro
        type: boolean
        source: computed
        description: "Whether a reverse-osmosis point-of-use unit is recommended (driven by tds_ppm threshold). Null until status RECOMMENDED."
        default: false
      - name: household_size
        type: integer
        source: input
        description: "Number of residents, used in capacity sizing demand"
        constraints: ">= 1"

  - name: SoftenerSystem
    parent: null
    common_fields: true
    fields:
      - name: account_id
        type: string
        source: input
        description: "FK -> ServiceAccount.id; the account this installed system serves"
      - name: source_test_id
        type: string
        source: input
        description: "FK -> WaterTest.id; the ACCEPTED water test this system was sized from"
      - name: acquisition_mode
        type: enum
        source: input
        description: "Whether the unit was purchased outright or is rented under a contract"
        constraints: "one of {PURCHASE, RENTAL}"
      - name: grain_capacity
        type: integer
        source: input
        description: "Installed resin grain capacity; must equal the source test's recommended_grain_capacity at install time"
        constraints: ">= 16000"
      - name: lifecycle_status
        type: enum
        source: computed
        description: "Install/decommission dimension: ORDERED on create, INSTALLED after install, ACTIVE while in service, DECOMMISSIONED when removed. Independent of regen_health."
        default: "ORDERED"
        constraints: "one of {ORDERED, INSTALLED, ACTIVE, DECOMMISSIONED}"
      - name: regen_health
        type: enum
        source: computed
        description: "Regeneration dimension (parallel to lifecycle_status): NOMINAL while gallons remain in cycle, DUE once consumed gallons reach capacity gallons, OVERDUE once a grace cycle is also exhausted. Reset to NOMINAL on regeneration."
        default: "NOMINAL"
        constraints: "one of {NOMINAL, DUE, OVERDUE}"
      - name: gallons_since_regen
        type: integer
        source: computed
        description: "Treated gallons consumed since last regeneration; reset to 0 on REGENERATE."
        default: 0
      - name: salt_level_pct
        type: integer
        source: computed
        description: "Brine tank salt fill percentage; raised by salt delivery RouteStops, decays on regeneration."
        default: 100
        constraints: "0..100"
      - name: install_date
        type: datetime
        source: computed
        description: "UTC instant the system transitioned to INSTALLED; null while ORDERED."

  - name: RentalContract
    parent: null
    common_fields: true
    fields:
      - name: account_id
        type: string
        source: input
        description: "FK -> ServiceAccount.id; the account billed for this rental"
      - name: system_id
        type: string
        source: input
        description: "FK -> SoftenerSystem.id; the rented unit (must have acquisition_mode RENTAL)"
      - name: monthly_rate_cents
        type: integer
        source: input
        description: "Base monthly rental rate in cents"
        constraints: ">= 0"
      - name: term_months
        type: integer
        source: input
        description: "Committed minimum term length in months"
        constraints: ">= 1"
      - name: start_date
        type: datetime
        source: input
        description: "UTC contract start instant; billing anchor for proration"
      - name: status
        type: enum
        source: computed
        description: "Contract lifecycle (cyclic): ACTIVE on create, SUSPENDED↔ACTIVE while paused, TERMINATED at end. Suspended contracts do not accrue rental."
        default: "ACTIVE"
        constraints: "one of {ACTIVE, SUSPENDED, TERMINATED}"
      - name: months_billed
        type: integer
        source: computed
        description: "Count of full monthly billing cycles already invoiced against this contract."
        default: 0
      - name: early_termination_fee_cents
        type: integer
        source: computed
        description: "Computed penalty if terminated before term_months elapse; 0 otherwise."
        default: 0

  - name: Route
    parent: null
    common_fields: true
    fields:
      - name: service_zone
        type: string
        source: input
        description: "Zone this route covers; only accounts in this zone may have stops"
        constraints: "non-empty"
      - name: route_date
        type: datetime
        source: input
        description: "UTC date the route runs"
      - name: tech_id
        type: string
        source: input
        description: "FK -> FieldTech.id; the technician assigned to drive this route"
      - name: status
        type: enum
        source: computed
        description: "Route lifecycle: PLANNED while stops are being added, DISPATCHED once locked for execution, COMPLETED after the last stop closes."
        default: "PLANNED"
        constraints: "one of {PLANNED, DISPATCHED, COMPLETED}"
      - name: capacity_stops
        type: integer
        source: input
        description: "Maximum number of stops allowed on this route"
        constraints: ">= 1"
      - name: stop_count
        type: integer
        source: computed
        description: "Current number of stops attached to this route; must never exceed capacity_stops."
        default: 0

  - name: RouteStop
    parent: Route
    common_fields: true
    fields:
      - name: route_id
        type: string
        source: input
        description: "FK -> Route.id; the route this stop belongs to"
      - name: system_id
        type: string
        source: input
        description: "FK -> SoftenerSystem.id; the installed unit serviced at this stop"
      - name: stop_type
        type: enum
        source: input
        description: "Work performed at the stop"
        constraints: "one of {SALT_DELIVERY, FILTER_SWAP, REGEN_SERVICE, INSPECTION}"
      - name: window_start
        type: datetime
        source: input
        description: "UTC start of the appointment window for this stop"
      - name: window_end
        type: datetime
        source: input
        description: "UTC end of the appointment window for this stop; must be strictly after window_start"
      - name: status
        type: enum
        source: computed
        description: "Stop lifecycle: SCHEDULED on create, COMPLETED when serviced, SKIPPED if route completes without it."
        default: "SCHEDULED"
        constraints: "one of {SCHEDULED, COMPLETED, SKIPPED}"
      - name: salt_bags_delivered
        type: integer
        source: input
        description: "Bags of salt dropped (only meaningful for SALT_DELIVERY); each bag raises system salt_level_pct"
        default: 0
        constraints: ">= 0"

  - name: CartridgeSchedule
    parent: null
    common_fields: true
    fields:
      - name: system_id
        type: string
        source: input
        description: "FK -> SoftenerSystem.id; the unit whose RO/UV cartridges this schedule tracks"
      - name: cartridge_type
        type: enum
        source: input
        description: "Consumable element class"
        constraints: "one of {RO_MEMBRANE, SEDIMENT_FILTER, CARBON_FILTER, UV_LAMP}"
      - name: interval_days
        type: integer
        source: input
        description: "Replacement cadence in days"
        constraints: ">= 1"
      - name: last_replaced_at
        type: datetime
        source: input
        description: "UTC instant the cartridge was last replaced; due date = last_replaced_at + interval_days"
      - name: status
        type: enum
        source: computed
        description: "Schedule state: ON_TRACK while before due date, DUE_SOON within the lead window, OVERDUE past due date plus grace."
        default: "ON_TRACK"
        constraints: "one of {ON_TRACK, DUE_SOON, OVERDUE}"
      - name: replacements_logged
        type: integer
        source: computed
        description: "Number of cartridge replacements recorded; incremented on each replacement."
        default: 0

  - name: ServiceVisit
    parent: null
    common_fields: true
    fields:
      - name: system_id
        type: string
        source: input
        description: "FK -> SoftenerSystem.id; the unit serviced"
      - name: stop_id
        type: string
        source: input
        description: "FK -> RouteStop.id; the route stop that generated this visit (null for ad-hoc visits)"
      - name: visit_type
        type: enum
        source: input
        description: "Work classification"
        constraints: "one of {REGEN, CARTRIDGE_REPLACE, SALT_REFILL, REPAIR, INSPECTION}"
      - name: gallons_treated_reading
        type: integer
        source: input
        description: "Meter reading of total gallons treated since last regen at visit time"
        constraints: ">= 0"
      - name: status
        type: enum
        source: computed
        description: "Visit lifecycle: LOGGED on create, CONFIRMED once a tech confirms work, VOIDED if reversed."
        default: "LOGGED"
        constraints: "one of {LOGGED, CONFIRMED, VOIDED}"
      - name: billable_cents
        type: integer
        source: computed
        description: "Labor + parts charge for this visit; 0 for rental-covered routine service, non-zero for out-of-warranty repair."
        default: 0

  - name: WarrantyClaim
    parent: null
    common_fields: true
    fields:
      - name: system_id
        type: string
        source: input
        description: "FK -> SoftenerSystem.id; the unit the defect was found on"
      - name: contract_id
        type: string
        source: input
        description: "FK -> RentalContract.id; the rental contract covering this unit (null for PURCHASE systems still under factory warranty)"
      - name: defect_class
        type: enum
        source: input
        description: "Reported failure category"
        constraints: "one of {VALVE_FAILURE, RESIN_FOULING, CONTROL_BOARD, LEAK, UV_BALLAST}"
      - name: reported_at
        type: datetime
        source: input
        description: "UTC instant the defect was reported"
      - name: status
        type: enum
        source: computed
        description: "Claim lifecycle (branching fork-join): FILED on create, TRIAGED after assessment, then forks to REPAIR or REPLACE, joining at CLOSED; DENIED if out of warranty."
        default: "FILED"
        constraints: "one of {FILED, TRIAGED, REPAIR, REPLACE, CLOSED, DENIED}"
      - name: covered
        type: boolean
        source: computed
        description: "Whether the claim is warranty-covered (within coverage window for the defect class); set during triage."
        default: false
      - name: settlement_cents
        type: integer
        source: computed
        description: "Customer charge for the claim resolution; 0 when covered, repair/replace cost when not covered."
        default: 0

  - name: Invoice
    parent: null
    common_fields: true
    fields:
      - name: account_id
        type: string
        source: input
        description: "FK -> ServiceAccount.id; the account billed"
      - name: contract_id
        type: string
        source: input
        description: "FK -> RentalContract.id; the rental contract billed (null for one-off service invoices)"
      - name: supersedes_invoice_id
        type: string
        source: input
        description: "FK -> Invoice.id; the prior VOIDED invoice this corrected invoice replaces (null for originals)"
      - name: invoice_kind
        type: enum
        source: input
        description: "Charge basis"
        constraints: "one of {RENTAL_CYCLE, SERVICE_REPAIR, TERMINATION, PRORATION}"
      - name: period_start
        type: datetime
        source: input
        description: "UTC start of the billing period this invoice covers"
      - name: period_end
        type: datetime
        source: input
        description: "UTC end of the billing period this invoice covers; must be strictly after period_start"
      - name: amount_cents
        type: integer
        source: computed
        description: "Total invoiced amount in cents, computed from kind, rate, proration and fees."
        default: 0
      - name: status
        type: enum
        source: computed
        description: "Invoice lifecycle: OPEN on issue, PAID when settled, VOID when cancelled (only a VOID may be superseded), PAST_DUE if unpaid beyond the due window."
        default: "OPEN"
        constraints: "one of {OPEN, PAID, VOID, PAST_DUE}"
      - name: due_offset_days
        type: integer
        source: input
        description: "Days after period_end the invoice falls due"
        default: 30
        constraints: ">= 0"

  - name: Customer
    parent: null
    common_fields: false
    fields:
      - name: full_name
        type: string
        source: input
        description: "Account holder name"
        constraints: "non-empty"
      - name: email
        type: string
        source: input
        description: "Contact email"
        constraints: "non-empty, unique"

  - name: FieldTech
    parent: null
    common_fields: false
    fields:
      - name: full_name
        type: string
        source: input
        description: "Technician name"
        constraints: "non-empty"
      - name: home_zone
        type: string
        source: input
        description: "Default service zone the technician operates in"
        constraints: "non-empty"

# =============================================================================
# §1.2 State Machine Table
# =============================================================================
state_machines:
  - entity: WaterTest
    initial_state: DRAFT
    terminal_states: [SUPERSEDED]
    transitions:
      - from: DRAFT
        to: RECOMMENDED
        trigger: "POST /water-tests/{id}/recommend"
        actor: FieldTech
        preconditions:
          - "WaterTest.status == DRAFT"
        side_effects:
          - "compute recommended_grain_capacity via size_grain_capacity calculation"
          - "set recommended_needs_ro = (tds_ppm >= RO_TDS_THRESHOLD)"
          - "increments WaterTest.version by 1"
        note: "Recommendation is idempotent only via state guard; re-running from RECOMMENDED is rejected."
      - from: RECOMMENDED
        to: ACCEPTED
        trigger: "POST /water-tests/{id}/accept"
        actor: Customer
        preconditions:
          - "WaterTest.status == RECOMMENDED"
        side_effects:
          - "set ServiceAccount.hardness_gpg = this.hardness_gpg"
          - "any other ACCEPTED WaterTest for the same account transitions ACCEPTED -> SUPERSEDED (cascade)"
          - "increments WaterTest.version by 1"
        note: "Accepting a newer test supersedes the prior accepted test for the same account."
      - from: ACCEPTED
        to: SUPERSEDED
        trigger: "system: another WaterTest for same account accepted"
        actor: system
        preconditions:
          - "WaterTest.status == ACCEPTED"
          - "a different WaterTest for the same account_id just transitioned to ACCEPTED"
        side_effects:
          - "increments WaterTest.version by 1"
        note: "Terminal. A SoftenerSystem already sized from a now-SUPERSEDED test keeps its grain_capacity."

  - entity: SoftenerSystem
    initial_state: ORDERED
    terminal_states: [DECOMMISSIONED]
    transitions:
      - from: ORDERED
        to: INSTALLED
        trigger: "POST /systems/{id}/install"
        actor: FieldTech
        preconditions:
          - "SoftenerSystem.lifecycle_status == ORDERED"
          - "source WaterTest.status == ACCEPTED"
          - "SoftenerSystem.grain_capacity == source WaterTest.recommended_grain_capacity"
        side_effects:
          - "set lifecycle_status = INSTALLED"
          - "set install_date = clock now"
          - "set regen_health = NOMINAL, gallons_since_regen = 0, salt_level_pct = 100"
          - "increments SoftenerSystem.version by 1"
      - from: INSTALLED
        to: ACTIVE
        trigger: "POST /systems/{id}/activate"
        actor: FieldTech
        preconditions:
          - "SoftenerSystem.lifecycle_status == INSTALLED"
        side_effects:
          - "set lifecycle_status = ACTIVE"
          - "increments SoftenerSystem.version by 1"
        note: "Only ACTIVE systems may be added to RouteStops or accrue meter readings."
      - from: ACTIVE
        to: DECOMMISSIONED
        trigger: "POST /systems/{id}/decommission"
        actor: ServiceManager
        preconditions:
          - "SoftenerSystem.lifecycle_status == ACTIVE"
          - "no RentalContract for this system in status ACTIVE or SUSPENDED (must be TERMINATED first)"
        side_effects:
          - "set lifecycle_status = DECOMMISSIONED"
          - "all CartridgeSchedule for this system cease accruing (frozen at current status)"
          - "increments SoftenerSystem.version by 1"
      # ---- parallel regen_health dimension (independent of lifecycle_status) ----
      - from: "regen_health=NOMINAL"
        to: "regen_health=DUE"
        trigger: "POST /systems/{id}/meter-reading (gallons cross capacity)"
        actor: FieldTech
        preconditions:
          - "SoftenerSystem.lifecycle_status == ACTIVE"
          - "gallons_since_regen >= capacity_gallons (computed by regen_demand)"
        side_effects:
          - "set regen_health = DUE"
          - "increments SoftenerSystem.version by 1"
        note: "capacity_gallons = grain_capacity / hardness_gpg (see regen_demand)."
      - from: "regen_health=DUE"
        to: "regen_health=OVERDUE"
        trigger: "POST /systems/{id}/meter-reading (gallons cross grace)"
        actor: FieldTech
        preconditions:
          - "SoftenerSystem.lifecycle_status == ACTIVE"
          - "gallons_since_regen >= capacity_gallons * REGEN_GRACE_FACTOR"
        side_effects:
          - "set regen_health = OVERDUE"
          - "increments SoftenerSystem.version by 1"
      - from: "regen_health=DUE|OVERDUE"
        to: "regen_health=NOMINAL"
        trigger: "POST /systems/{id}/regenerate"
        actor: FieldTech
        preconditions:
          - "SoftenerSystem.lifecycle_status == ACTIVE"
          - "regen_health IN {DUE, OVERDUE}"
          - "salt_level_pct >= SALT_MIN_REGEN_PCT"
        side_effects:
          - "set regen_health = NOMINAL, gallons_since_regen = 0"
          - "decrement salt_level_pct by SALT_PER_REGEN_PCT (floor 0)"
          - "create a ServiceVisit(visit_type=REGEN, billable_cents=0)"
          - "increments SoftenerSystem.version by 1"

  - entity: RentalContract
    initial_state: ACTIVE
    terminal_states: [TERMINATED]
    transitions:
      - from: ACTIVE
        to: SUSPENDED
        trigger: "POST /rental-contracts/{id}/suspend"
        actor: BillingClerk
        preconditions:
          - "RentalContract.status == ACTIVE"
        side_effects:
          - "rental ceases to accrue while SUSPENDED"
          - "increments RentalContract.version by 1"
      - from: SUSPENDED
        to: ACTIVE
        trigger: "POST /rental-contracts/{id}/resume"
        actor: BillingClerk
        preconditions:
          - "RentalContract.status == SUSPENDED"
          - "ServiceAccount.standing == GOOD"
        side_effects:
          - "rental resumes accrual"
          - "increments RentalContract.version by 1"
        note: "Cyclic: ACTIVE↔SUSPENDED may repeat any number of times."
      - from: "ACTIVE|SUSPENDED"
        to: TERMINATED
        trigger: "POST /rental-contracts/{id}/terminate"
        actor: BillingClerk
        preconditions:
          - "RentalContract.status IN {ACTIVE, SUSPENDED}"
          - "expected_rentalcontract_version matches RentalContract.version (OCC)"
        side_effects:
          - "compute early_termination_fee_cents via early_termination_fee calculation"
          - "if early_termination_fee_cents > 0: create Invoice(invoice_kind=TERMINATION) (cascade); that invoice debits ServiceAccount.credit_balance_cents via apply_invoice (cascade)"
          - "set RentalContract.status = TERMINATED"
          - "increments RentalContract.version by 1"
        note: "Termination → fee invoice → account ledger debit is a depth-3 cascade."

  - entity: Route
    initial_state: PLANNED
    terminal_states: [COMPLETED]
    transitions:
      - from: PLANNED
        to: DISPATCHED
        trigger: "POST /routes/{id}/dispatch"
        actor: Dispatcher
        preconditions:
          - "Route.status == PLANNED"
          - "Route.stop_count >= 1"
        side_effects:
          - "all RouteStops remain SCHEDULED; route is locked (no further stops may be added)"
          - "increments Route.version by 1"
      - from: DISPATCHED
        to: COMPLETED
        trigger: "POST /routes/{id}/complete"
        actor: FieldTech
        preconditions:
          - "Route.status == DISPATCHED"
        side_effects:
          - "every RouteStop still SCHEDULED transitions to SKIPPED (cascade)"
          - "increments Route.version by 1"
        note: "Completing a route force-skips unserviced stops."

  - entity: RouteStop
    initial_state: SCHEDULED
    terminal_states: [COMPLETED, SKIPPED]
    transitions:
      - from: SCHEDULED
        to: COMPLETED
        trigger: "POST /route-stops/{id}/complete"
        actor: FieldTech
        preconditions:
          - "RouteStop.status == SCHEDULED"
          - "parent Route.status == DISPATCHED"
          - "SoftenerSystem.lifecycle_status == ACTIVE"
        side_effects:
          - "if stop_type == SALT_DELIVERY: raise SoftenerSystem.salt_level_pct by salt_bags_delivered * SALT_PCT_PER_BAG (cap 100); that bump may flip a pending regen eligibility (cascade)"
          - "if stop_type == REGEN_SERVICE: create ServiceVisit(visit_type=REGEN); reset SoftenerSystem.gallons_since_regen=0, regen_health=NOMINAL (cascade)"
          - "if stop_type == FILTER_SWAP: increment matching CartridgeSchedule.replacements_logged, set last_replaced_at=now, status=ON_TRACK (cascade)"
          - "increments RouteStop.version by 1"
      - from: SCHEDULED
        to: SKIPPED
        trigger: "system: parent Route completed with this stop unserviced"
        actor: system
        preconditions:
          - "RouteStop.status == SCHEDULED"
          - "parent Route.status transitioning to COMPLETED"
        side_effects:
          - "increments RouteStop.version by 1"
        note: "Terminal; no service side effects fire."

  - entity: CartridgeSchedule
    initial_state: ON_TRACK
    terminal_states: []
    transitions:
      - from: ON_TRACK
        to: DUE_SOON
        trigger: "POST /cartridge-schedules/{id}/evaluate (clock within lead window)"
        actor: Dispatcher
        preconditions:
          - "clock now >= due_date - CARTRIDGE_LEAD_DAYS AND clock now < due_date"
        side_effects:
          - "set status = DUE_SOON"
          - "increments CartridgeSchedule.version by 1"
      - from: "ON_TRACK|DUE_SOON"
        to: OVERDUE
        trigger: "POST /cartridge-schedules/{id}/evaluate (past due+grace)"
        actor: Dispatcher
        preconditions:
          - "clock now >= due_date + CARTRIDGE_GRACE_DAYS"
        side_effects:
          - "set status = OVERDUE"
          - "increments CartridgeSchedule.version by 1"
      - from: "DUE_SOON|OVERDUE"
        to: ON_TRACK
        trigger: "POST /cartridge-schedules/{id}/replace"
        actor: FieldTech
        preconditions:
          - "CartridgeSchedule.status IN {DUE_SOON, OVERDUE}"
        side_effects:
          - "set last_replaced_at = clock now, status = ON_TRACK, increment replacements_logged"
          - "create ServiceVisit(visit_type=CARTRIDGE_REPLACE)"
          - "increments CartridgeSchedule.version by 1"

  - entity: ServiceVisit
    initial_state: LOGGED
    terminal_states: [VOIDED]
    transitions:
      - from: LOGGED
        to: CONFIRMED
        trigger: "POST /service-visits/{id}/confirm"
        actor: FieldTech
        preconditions:
          - "ServiceVisit.status == LOGGED"
        side_effects:
          - "if billable_cents > 0: create Invoice(invoice_kind=SERVICE_REPAIR) debiting the account (cascade)"
          - "increments ServiceVisit.version by 1"
      - from: "LOGGED|CONFIRMED"
        to: VOIDED
        trigger: "POST /service-visits/{id}/void"
        actor: ServiceManager
        preconditions:
          - "ServiceVisit.status IN {LOGGED, CONFIRMED}"
        side_effects:
          - "if a SERVICE_REPAIR Invoice was created on confirm and is OPEN: void that Invoice and credit back ServiceAccount.credit_balance_cents (compensation)"
          - "increments ServiceVisit.version by 1"
        note: "Void compensates the confirm cascade so account credit_balance_cents nets to its pre-confirm value."

  - entity: WarrantyClaim
    initial_state: FILED
    terminal_states: [CLOSED, DENIED]
    transitions:
      - from: FILED
        to: TRIAGED
        trigger: "POST /warranty-claims/{id}/triage"
        actor: FieldTech
        preconditions:
          - "WarrantyClaim.status == FILED"
        side_effects:
          - "set covered via coverage_window check (defect_class window vs system install_date)"
          - "increments WarrantyClaim.version by 1"
      - from: TRIAGED
        to: REPAIR
        trigger: "POST /warranty-claims/{id}/resolve {resolution: REPAIR}"
        actor: ServiceManager
        preconditions:
          - "WarrantyClaim.status == TRIAGED"
        side_effects:
          - "compute settlement_cents via claim_settlement (0 if covered, repair cost if not)"
          - "create ServiceVisit(visit_type=REPAIR, billable_cents=settlement_cents)"
          - "increments WarrantyClaim.version by 1"
      - from: TRIAGED
        to: REPLACE
        trigger: "POST /warranty-claims/{id}/resolve {resolution: REPLACE}"
        actor: ServiceManager
        preconditions:
          - "WarrantyClaim.status == TRIAGED"
          - "covered == true (uncovered claims cannot elect free replacement)"
        side_effects:
          - "compute settlement_cents via claim_settlement"
          - "decommission the defective SoftenerSystem path is NOT auto; a replacement system must be ordered separately"
          - "increments WarrantyClaim.version by 1"
      - from: "REPAIR|REPLACE"
        to: CLOSED
        trigger: "POST /warranty-claims/{id}/close"
        actor: ServiceManager
        preconditions:
          - "WarrantyClaim.status IN {REPAIR, REPLACE}"
        side_effects:
          - "if settlement_cents > 0: create Invoice(invoice_kind=SERVICE_REPAIR) debiting account (cascade)"
          - "increments WarrantyClaim.version by 1"
      - from: TRIAGED
        to: DENIED
        trigger: "POST /warranty-claims/{id}/deny"
        actor: ServiceManager
        preconditions:
          - "WarrantyClaim.status == TRIAGED"
          - "covered == false"
        side_effects:
          - "increments WarrantyClaim.version by 1"
        note: "Branching fork-join: TRIAGED forks to {REPAIR, REPLACE, DENIED}; REPAIR and REPLACE join at CLOSED."

  - entity: Invoice
    initial_state: OPEN
    terminal_states: [PAID, VOID]
    transitions:
      - from: OPEN
        to: PAID
        trigger: "POST /invoices/{id}/pay"
        actor: BillingClerk
        preconditions:
          - "Invoice.status IN {OPEN, PAST_DUE}"
        side_effects:
          - "credit ServiceAccount.credit_balance_cents is NOT changed; payment clears the receivable"
          - "if account had no other OPEN/PAST_DUE invoice past due window: set ServiceAccount.standing = GOOD"
          - "increments Invoice.version by 1"
      - from: OPEN
        to: PAST_DUE
        trigger: "POST /invoices/{id}/evaluate (clock past due date)"
        actor: BillingClerk
        preconditions:
          - "Invoice.status == OPEN"
          - "clock now > period_end + due_offset_days"
        side_effects:
          - "set ServiceAccount.standing = DELINQUENT (cascade)"
          - "increments Invoice.version by 1"
      - from: "OPEN|PAST_DUE"
        to: VOID
        trigger: "POST /invoices/{id}/void"
        actor: BillingClerk
        preconditions:
          - "Invoice.status IN {OPEN, PAST_DUE}"
        side_effects:
          - "credit ServiceAccount.credit_balance_cents back by the applied amount recorded at issue (compensation reversing apply_invoice)"
          - "if invoice_kind == RENTAL_CYCLE: decrement the contract.months_billed by 1 (conserves months_billed across issue+void)"
          - "if this invoice drove the account DELINQUENT and no other invoice is past-due: set standing = GOOD (cascade)"
          - "increments Invoice.version by 1"
        note: "Only a VOID invoice may be cited by a later invoice's supersedes_invoice_id. Issue+void leaves BOTH credit_balance_cents and contract.months_billed unchanged."

concurrency_rules:
  - rule_id: rental-terminate-stale-contract
    parent_entity: RentalContract
    write_endpoint: "POST /rental-contracts/{id}/terminate"
    occ_field: "expected_rentalcontract_version"
    description: |
      Terminating a RentalContract whose version has advanced since the client
      last observed it is rejected. This captures the case where a suspend/resume
      cycle (which legitimately changes accrual basis and bumps the contract
      version) has already advanced the contract, so the terminating client's
      view — and therefore the early-termination fee it expects — is stale.
    error_id: ERR_STALE_VERSION
    http_status: 412

# =============================================================================
# §1.3 Calculation Rules Table
# =============================================================================
calculations:
  - name: size_grain_capacity
    trigger: "POST /water-tests/{id}/recommend (WaterTest DRAFT -> RECOMMENDED)"
    algorithm: threshold
    formula: |
      # Daily softening demand in grains, then nearest standard tank size up.
      daily_grains = household_size * GALLONS_PER_PERSON_DAY * effective_hardness
      where effective_hardness = hardness_gpg + (iron_ppm * IRON_HARDNESS_EQUIV)
      # Size for REGEN_TARGET_DAYS of capacity between regenerations.
      required_capacity = ceil(daily_grains * REGEN_TARGET_DAYS)
      # Round UP to the next standard tank in STANDARD_TANKS; if it exceeds the
      # largest tank, select the largest tank.
      recommended_grain_capacity = smallest tank in STANDARD_TANKS with tank >= required_capacity,
                                   else max(STANDARD_TANKS)
    input_set: "single WaterTest in DRAFT status; uses its hardness_gpg, iron_ppm, household_size"
    constants:
      GALLONS_PER_PERSON_DAY: 80
      IRON_HARDNESS_EQUIV: 4
      REGEN_TARGET_DAYS: 6
      STANDARD_TANKS: [16000, 24000, 32000, 40000, 48000, 64000]
    precision: "integer grains; ceil before tank selection"
    variants:
      - name: iron_inflated
        when: "iron_ppm > 0"
        difference: "effective_hardness adds iron_ppm * IRON_HARDNESS_EQUIV grains before sizing, pushing into a larger tank"

  - name: regen_demand
    trigger: "POST /systems/{id}/meter-reading; system regen_health re-evaluated"
    algorithm: threshold
    formula: |
      # Treated-gallon capacity of one regeneration cycle.
      capacity_gallons = floor(grain_capacity / effective_hardness_at_install)
      where effective_hardness_at_install = ServiceAccount.hardness_gpg
            (the accepted-test hardness copied onto the account)
      # regen_health crossing logic:
      if gallons_since_regen >= capacity_gallons * REGEN_GRACE_FACTOR -> OVERDUE
      elif gallons_since_regen >= capacity_gallons -> DUE
      else -> NOMINAL
    input_set: "single SoftenerSystem (ACTIVE) plus its account's hardness_gpg"
    constants:
      REGEN_GRACE_FACTOR: 1.25
      SALT_MIN_REGEN_PCT: 20
      SALT_PER_REGEN_PCT: 30
      SALT_PCT_PER_BAG: 25
      CARTRIDGE_LEAD_DAYS: 14
      CARTRIDGE_GRACE_DAYS: 7
      MIN_SERVICE_GAP_HOURS: 24
    precision: "integer gallons; floor on division; threshold uses >= (at-boundary counts as crossed)"
    variants:
      - name: account_hardness_basis
        when: "always"
        difference: "uses ServiceAccount.hardness_gpg (the accepted-test reading), NOT the system's source_test hardness which may since have been SUPERSEDED — these can diverge"

  - name: rental_proration
    trigger: "POST /invoices for invoice_kind in {RENTAL_CYCLE, PRORATION}"
    algorithm: chronological
    formula: |
      # Two valid prorations of a partial month; the scaffold pins which is used
      # per invoice_kind. Both operate on the SAME contract+period inputs.
      billable_days = number of days in [period_start, period_end) the contract
                      was in status ACTIVE (SUSPENDED days excluded), counting
                      period_start inclusive and period_end exclusive.
      # Variant FULL_CYCLE (invoice_kind=RENTAL_CYCLE): bill a whole month flat.
      amount_full = monthly_rate_cents
      # Variant DAILY (invoice_kind=PRORATION): daily rate * billable_days.
      daily_rate = round_half_up(monthly_rate_cents / DAYS_PER_BILLING_MONTH)
      amount_daily = daily_rate * billable_days
    input_set: "one RentalContract + the [period_start, period_end) window; SUSPENDED intervals excluded"
    constants:
      DAYS_PER_BILLING_MONTH: 30
    precision: "cents, round_half_up; daily_rate rounded to whole cents BEFORE multiplying by billable_days (round-then-multiply, NOT multiply-then-round)"
    variants:
      - name: full_cycle
        when: "invoice_kind == RENTAL_CYCLE"
        difference: "flat monthly_rate_cents regardless of partial occupancy"
      - name: daily_prorated
        when: "invoice_kind == PRORATION"
        difference: "daily_rate (rounded first) * billable_days; for a partial/suspended month this differs from full_cycle on identical contract inputs"

  - name: early_termination_fee
    trigger: "POST /rental-contracts/{id}/terminate (RentalContract -> TERMINATED)"
    algorithm: tiered_pricing
    formula: |
      months_elapsed = floor( days_between(start_date, clock_now) / DAYS_PER_BILLING_MONTH )
      months_remaining = max(0, term_months - months_elapsed)
      if months_remaining == 0:
        fee = 0
      else:
        # Tiered penalty rate on remaining months.
        if months_remaining <= TIER1_MONTHS:   rate = TIER1_RATE
        elif months_remaining <= TIER2_MONTHS: rate = TIER2_RATE
        else:                                   rate = TIER3_RATE
        raw = months_remaining * monthly_rate_cents * rate
        fee = min( round_half_up(raw), FEE_CAP_CENTS )
    input_set: "one RentalContract; uses start_date, term_months, monthly_rate_cents, and clock now"
    constants:
      DAYS_PER_BILLING_MONTH: 30
      TIER1_MONTHS: 3
      TIER2_MONTHS: 6
      TIER1_RATE: 1.0
      TIER2_RATE: 0.6
      TIER3_RATE: 0.4
      FEE_CAP_CENTS: 50000
    precision: "cents, round_half_up; cap applied AFTER rounding"
    variants:
      - name: within_term
        when: "months_remaining > 0"
        difference: "non-zero tiered fee owed"
      - name: term_complete
        when: "months_remaining == 0"
        difference: "fee = 0, no termination invoice created"

  - name: claim_settlement
    trigger: "POST /warranty-claims/{id}/resolve and /close (WarrantyClaim resolution)"
    algorithm: weighted_scoring
    formula: |
      base = DEFECT_BASE_COST[defect_class]
      if covered == true:
        settlement_cents = 0
      else:
        # Out-of-warranty: customer pays parts (base) plus labor, minus an
        # age-based goodwill discount that grows with system age.
        age_days = days_between(system.install_date, clock_now)
        goodwill = min( GOODWILL_MAX, floor(age_days / GOODWILL_STEP_DAYS) * GOODWILL_PCT_PER_STEP )
        labor = LABOR_FLAT_CENTS
        settlement_cents = round_half_up( (base + labor) * (1 - goodwill) )
    input_set: "one WarrantyClaim + its SoftenerSystem.install_date + clock now"
    constants:
      DEFECT_BASE_COST: { VALVE_FAILURE: 18000, RESIN_FOULING: 12000, CONTROL_BOARD: 26000, LEAK: 8000, UV_BALLAST: 9000 }
      LABOR_FLAT_CENTS: 9000
      GOODWILL_STEP_DAYS: 365
      GOODWILL_PCT_PER_STEP: 0.05
      GOODWILL_MAX: 0.30
    precision: "cents, round_half_up"
    variants:
      - name: covered_free
        when: "covered == true"
        difference: "settlement_cents = 0 regardless of defect_class"
      - name: out_of_warranty_aged
        when: "covered == false"
        difference: "(base+labor) reduced by age-tiered goodwill; older systems pay less"

  - name: coverage_window
    trigger: "POST /warranty-claims/{id}/triage (FILED -> TRIAGED)"
    algorithm: threshold
    formula: |
      # Warranty coverage is a per-defect-class window measured in days from the
      # system's install_date. A claim is covered iff reported within the window.
      window_days = COVERAGE_DAYS[defect_class]
      age_at_report = days_between(system.install_date, WarrantyClaim.reported_at)
      covered = (age_at_report <= window_days)   # boundary is inclusive (<=)
    input_set: "one WarrantyClaim + its SoftenerSystem.install_date; uses defect_class and reported_at"
    constants:
      COVERAGE_DAYS: { VALVE_FAILURE: 1825, RESIN_FOULING: 3650, CONTROL_BOARD: 730, LEAK: 1825, UV_BALLAST: 365 }
    precision: "integer days; boundary inclusive — age_at_report == window_days is still covered"
    variants:
      - name: in_window
        when: "age_at_report <= window_days"
        difference: "covered = true; settlement later forced to 0"
      - name: out_of_window
        when: "age_at_report > window_days"
        difference: "covered = false; settlement later charged"

  - name: apply_invoice
    trigger: "Invoice issued (any invoice_kind) and on void compensation"
    algorithm: aggregation
    formula: |
      # On issue: debit account ledger. On void: credit it back.
      on_issue:  ServiceAccount.credit_balance_cents -= amount_cents   # may go negative-as-owed? NO:
                 # credit_balance is a prepaid balance floored at 0; the receivable
                 # is the invoice itself. Debit reduces prepaid credit to floor 0;
                 # remainder stays owed on the OPEN invoice.
                 applied = min(amount_cents, credit_balance_cents_before)
                 ServiceAccount.credit_balance_cents = credit_balance_cents_before - applied
      on_void:   ServiceAccount.credit_balance_cents += applied_recorded   # exact reversal
    input_set: "one Invoice + its ServiceAccount; applied amount recorded for exact reversal"
    constants: {}
    precision: "integer cents; credit_balance_cents floored at 0"
    variants:
      - name: partial_apply
        when: "amount_cents > credit_balance_cents_before"
        difference: "only credit_balance_cents_before is consumed (applied), remainder owed on invoice"

# =============================================================================
# §1.4 Validation Rules Table (Ordered by Priority)
# =============================================================================
validations:
  - priority: 1
    category: auth
    check: "X-User-Role and X-User-ID headers present"
    error_id: ERR_UNAUTHENTICATED
    http_status: 401
    applies_to: "all"
  - priority: 2
    category: auth
    check: "Role is permitted for this operation per §1.7 RBAC"
    error_id: ERR_UNAUTHORIZED
    http_status: 403
    applies_to: "all"
  - priority: 3
    category: existence
    check: "All path-referenced resources exist, validated left-to-right"
    error_id: ERR_NOT_FOUND
    http_status: 404
    applies_to: "all endpoints with path ids"
  - priority: 4
    category: existence
    check: "All FK fields in body reference existing resources"
    error_id: ERR_FK_NOT_FOUND
    http_status: 404
    applies_to: "all create endpoints with FK body fields"
  - priority: 5
    category: business_constraint
    check: "Required body fields present and well-typed; enums in allowed set; numeric ranges satisfied"
    error_id: ERR_INVALID_REQUEST
    http_status: 400
    applies_to: "all create/action endpoints"
  - priority: 6
    category: state
    check: "Target resource is in a state from which this transition is defined"
    error_id: ERR_INVALID_STATE
    http_status: 409
    applies_to: "all state-transition endpoints"
  - priority: 7
    category: state
    check: "OCC: expected_<parent>_version matches current parent.version"
    error_id: ERR_STALE_VERSION
    http_status: 412
    applies_to: "POST /rental-contracts/{id}/terminate"
  - priority: 8
    category: business_referential
    check: "SoftenerSystem.grain_capacity equals source WaterTest.recommended_grain_capacity at install"
    error_id: ERR_CAPACITY_MISMATCH
    http_status: 422
    applies_to: "POST /systems/{id}/install"
  - priority: 9
    category: business_referential
    check: "RouteStop.system_id system is ACTIVE and its account.service_zone equals the Route.service_zone"
    error_id: ERR_ZONE_MISMATCH
    http_status: 422
    applies_to: "POST /routes/{id}/stops"
  - priority: 10
    category: business_safety
    check: "Regeneration requires salt_level_pct >= SALT_MIN_REGEN_PCT; below it the unit cannot regenerate"
    error_id: ERR_INSUFFICIENT_SALT
    http_status: 422
    applies_to: "POST /systems/{id}/regenerate, POST /route-stops/{id}/complete (REGEN_SERVICE)"
  - priority: 11
    category: business_temporal
    check: "RouteStop window_end strictly after window_start; new stop window must not overlap an existing SCHEDULED stop on the same Route (buffer-aware)"
    error_id: ERR_WINDOW_OVERLAP
    http_status: 409
    applies_to: "POST /routes/{id}/stops"
  - priority: 12
    category: business_temporal
    check: "Two stops servicing the SAME system across ANY route must not have windows within MIN_SERVICE_GAP_HOURS of each other"
    error_id: ERR_SERVICE_GAP_VIOLATION
    http_status: 409
    applies_to: "POST /routes/{id}/stops"
  - priority: 13
    category: business_constraint
    check: "Route.stop_count would exceed Route.capacity_stops"
    error_id: ERR_ROUTE_FULL
    http_status: 409
    applies_to: "POST /routes/{id}/stops"
  - priority: 14
    category: business_constraint
    check: "A new RentalContract requires the account standing == GOOD and the system acquisition_mode == RENTAL with no other ACTIVE/SUSPENDED contract on it"
    error_id: ERR_RENTAL_NOT_ALLOWED
    http_status: 422
    applies_to: "POST /rental-contracts"
  - priority: 15
    category: business_referential
    check: "supersedes_invoice_id, when present, must reference an Invoice in status VOID"
    error_id: ERR_SUPERSEDE_NOT_VOID
    http_status: 422
    applies_to: "POST /invoices"
  - priority: 16
    category: business_fiscal
    check: "An Invoice already PAID or VOID cannot be paid or voided again"
    error_id: ERR_INVOICE_CLOSED
    http_status: 409
    applies_to: "POST /invoices/{id}/pay, POST /invoices/{id}/void"

# =============================================================================
# §1.5 API Endpoint Table
# =============================================================================
endpoints:
  # ---- Customers / Techs (identity-backing entities) ----
  - method: POST
    path: "/customers"
    description: "Register a customer (account holder)"
    roles: [ServiceManager, BillingClerk]
    code: 201
    input: [full_name, email]
    output: Customer
    side_effects: []
  - method: GET
    path: "/customers/{id}"
    description: "Fetch a customer"
    roles: [ServiceManager, BillingClerk, Customer]
    code: 200
    input: []
    output: Customer
    side_effects: []
  - method: POST
    path: "/field-techs"
    description: "Register a field technician"
    roles: [ServiceManager, Dispatcher]
    code: 201
    input: [full_name, home_zone]
    output: FieldTech
    side_effects: []
  - method: GET
    path: "/field-techs/{id}"
    description: "Fetch a field technician"
    roles: [ServiceManager, Dispatcher]
    code: 200
    input: []
    output: FieldTech
    side_effects: []

  # ---- Service Accounts ----
  - method: POST
    path: "/accounts"
    description: "Open a service account for a customer"
    roles: [ServiceManager, BillingClerk]
    code: 201
    input: [customer_id, property_type, service_zone]
    output: ServiceAccount
    side_effects: ["credit_balance_cents initialized to 0; standing GOOD"]
  - method: GET
    path: "/accounts/{id}"
    description: "Fetch a service account with derived ledger and standing"
    roles: [ServiceManager, BillingClerk, Customer]
    code: 200
    input: []
    output: ServiceAccount
    side_effects: []
  - method: GET
    path: "/accounts"
    description: "List service accounts (paginated, filterable by customer_id)"
    roles: [ServiceManager, BillingClerk]
    code: 200
    input: ["customer_id?", "limit?", "offset?"]
    output: ServiceAccount[]
    side_effects: []
  - method: POST
    path: "/accounts/{id}/credit"
    description: "Apply a prepaid credit to the account ledger (admin top-up)"
    roles: [BillingClerk, ServiceManager]
    code: 200
    input: [amount_cents]
    output: ServiceAccount
    side_effects: ["increase credit_balance_cents by amount_cents", "increments ServiceAccount.version by 1"]

  # ---- Water Tests ----
  - method: POST
    path: "/water-tests"
    description: "Record a water test for an account (DRAFT)"
    roles: [FieldTech, ServiceManager]
    code: 201
    input: [account_id, hardness_gpg, iron_ppm, tds_ppm, household_size]
    output: WaterTest
    side_effects: []
  - method: GET
    path: "/water-tests/{id}"
    description: "Fetch a water test"
    roles: [FieldTech, ServiceManager, Customer]
    code: 200
    input: []
    output: WaterTest
    side_effects: []
  - method: GET
    path: "/water-tests"
    description: "List water tests (filterable by account_id)"
    roles: [FieldTech, ServiceManager, Customer]
    code: 200
    input: ["account_id?", "limit?", "offset?"]
    output: WaterTest[]
    side_effects: []
  - method: POST
    path: "/water-tests/{id}/recommend"
    description: "Compute system recommendation (DRAFT -> RECOMMENDED)"
    roles: [FieldTech, ServiceManager]
    code: 200
    input: []
    output: WaterTest
    side_effects: ["compute recommended_grain_capacity, recommended_needs_ro", "increments WaterTest.version by 1"]
  - method: POST
    path: "/water-tests/{id}/accept"
    description: "Customer accepts recommendation (RECOMMENDED -> ACCEPTED)"
    roles: [Customer, ServiceManager]
    code: 200
    input: []
    output: WaterTest
    side_effects: ["set account.hardness_gpg", "supersede any prior ACCEPTED test for the account (cascade)", "increments WaterTest.version by 1"]

  # ---- Softener Systems ----
  - method: POST
    path: "/systems"
    description: "Order a softener system sized from an ACCEPTED water test"
    roles: [ServiceManager, FieldTech]
    code: 201
    input: [account_id, source_test_id, acquisition_mode, grain_capacity]
    output: SoftenerSystem
    side_effects: []
  - method: GET
    path: "/systems/{id}"
    description: "Fetch a softener system with both state dimensions"
    roles: [ServiceManager, FieldTech, Customer]
    code: 200
    input: []
    output: SoftenerSystem
    side_effects: []
  - method: GET
    path: "/systems"
    description: "List systems (filterable by account_id and source_test_id; reverse-reachability for SoftenerSystem.source_test_id)"
    roles: [ServiceManager, FieldTech, Customer]
    code: 200
    input: ["account_id?", "source_test_id?", "limit?", "offset?"]
    output: SoftenerSystem[]
    side_effects: []
  - method: POST
    path: "/systems/{id}/install"
    description: "Install ordered system (ORDERED -> INSTALLED)"
    roles: [FieldTech, ServiceManager]
    code: 200
    input: []
    output: SoftenerSystem
    side_effects: ["set lifecycle_status INSTALLED, install_date now", "increments SoftenerSystem.version by 1"]
  - method: POST
    path: "/systems/{id}/activate"
    description: "Place installed system in service (INSTALLED -> ACTIVE)"
    roles: [FieldTech, ServiceManager]
    code: 200
    input: []
    output: SoftenerSystem
    side_effects: ["set lifecycle_status ACTIVE", "increments SoftenerSystem.version by 1"]
  - method: POST
    path: "/systems/{id}/decommission"
    description: "Remove an active system from service (ACTIVE -> DECOMMISSIONED)"
    roles: [ServiceManager]
    code: 200
    input: []
    output: SoftenerSystem
    side_effects: ["freeze cartridge schedules", "increments SoftenerSystem.version by 1"]
  - method: POST
    path: "/systems/{id}/meter-reading"
    description: "Record treated-gallons reading; re-evaluate regen_health"
    roles: [FieldTech, ServiceManager]
    code: 200
    input: [gallons_since_regen]
    output: SoftenerSystem
    side_effects: ["set gallons_since_regen", "recompute regen_health via regen_demand", "increments SoftenerSystem.version by 1"]
  - method: POST
    path: "/systems/{id}/regenerate"
    description: "Run a regeneration cycle (regen_health DUE|OVERDUE -> NOMINAL)"
    roles: [FieldTech, ServiceManager]
    code: 200
    input: []
    output: SoftenerSystem
    side_effects: ["reset gallons_since_regen=0, regen_health=NOMINAL", "decrement salt_level_pct", "create ServiceVisit(REGEN)", "increments SoftenerSystem.version by 1"]
  - method: GET
    path: "/systems/{id}/cartridge-schedules"
    description: "List cartridge schedules for a system (reverse-reachability for CartridgeSchedule.system_id)"
    roles: [ServiceManager, FieldTech, Customer]
    code: 200
    input: []
    output: CartridgeSchedule[]
    side_effects: []
  - method: GET
    path: "/systems/{id}/service-visits"
    description: "List service visits for a system (reverse-reachability for ServiceVisit.system_id)"
    roles: [ServiceManager, FieldTech, Customer]
    code: 200
    input: []
    output: ServiceVisit[]
    side_effects: []
  - method: GET
    path: "/systems/{id}/warranty-claims"
    description: "List warranty claims for a system (reverse-reachability for WarrantyClaim.system_id)"
    roles: [ServiceManager, FieldTech, Customer]
    code: 200
    input: []
    output: WarrantyClaim[]
    side_effects: []

  # ---- Rental Contracts ----
  - method: POST
    path: "/rental-contracts"
    description: "Create a rental contract for a RENTAL system"
    roles: [BillingClerk, ServiceManager]
    code: 201
    input: [account_id, system_id, monthly_rate_cents, term_months, start_date]
    output: RentalContract
    side_effects: []
  - method: GET
    path: "/rental-contracts/{id}"
    description: "Fetch a rental contract"
    roles: [BillingClerk, ServiceManager, Customer]
    code: 200
    input: []
    output: RentalContract
    side_effects: []
  - method: GET
    path: "/rental-contracts"
    description: "List rental contracts (filterable by account_id and system_id)"
    roles: [BillingClerk, ServiceManager, Customer]
    code: 200
    input: ["account_id?", "system_id?", "limit?", "offset?"]
    output: RentalContract[]
    side_effects: []
  - method: POST
    path: "/rental-contracts/{id}/suspend"
    description: "Suspend an active contract (ACTIVE -> SUSPENDED)"
    roles: [BillingClerk, ServiceManager]
    code: 200
    input: []
    output: RentalContract
    side_effects: ["increments RentalContract.version by 1"]
  - method: POST
    path: "/rental-contracts/{id}/resume"
    description: "Resume a suspended contract (SUSPENDED -> ACTIVE)"
    roles: [BillingClerk, ServiceManager]
    code: 200
    input: []
    output: RentalContract
    side_effects: ["increments RentalContract.version by 1"]
  - method: POST
    path: "/rental-contracts/{id}/terminate"
    description: "Terminate a contract with OCC; may emit a termination fee invoice (ACTIVE|SUSPENDED -> TERMINATED)"
    roles: [BillingClerk, ServiceManager]
    code: 200
    input: [expected_rentalcontract_version]
    output: RentalContract
    side_effects: ["compute early_termination_fee_cents", "if fee>0 create TERMINATION Invoice debiting account (cascade)", "increments RentalContract.version by 1"]

  # ---- Routes & Stops ----
  - method: POST
    path: "/routes"
    description: "Plan a route for a zone and date"
    roles: [Dispatcher, ServiceManager]
    code: 201
    input: [service_zone, route_date, tech_id, capacity_stops]
    output: Route
    side_effects: []
  - method: GET
    path: "/routes/{id}"
    description: "Fetch a route"
    roles: [Dispatcher, ServiceManager, FieldTech]
    code: 200
    input: []
    output: Route
    side_effects: []
  - method: GET
    path: "/routes"
    description: "List routes (filterable by tech_id and service_zone)"
    roles: [Dispatcher, ServiceManager, FieldTech]
    code: 200
    input: ["tech_id?", "service_zone?", "limit?", "offset?"]
    output: Route[]
    side_effects: []
  - method: POST
    path: "/routes/{id}/stops"
    description: "Add a stop to a PLANNED route (overlap/zone/capacity/gap validated)"
    roles: [Dispatcher, ServiceManager]
    code: 201
    input: [system_id, stop_type, window_start, window_end, "salt_bags_delivered?"]
    output: RouteStop
    side_effects: ["increment Route.stop_count", "increments Route.version by 1"]
  - method: GET
    path: "/routes/{id}/stops"
    description: "List stops on a route (reverse-reachability for RouteStop.route_id)"
    roles: [Dispatcher, ServiceManager, FieldTech]
    code: 200
    input: []
    output: RouteStop[]
    side_effects: []
  - method: POST
    path: "/routes/{id}/dispatch"
    description: "Lock and dispatch a route (PLANNED -> DISPATCHED)"
    roles: [Dispatcher, ServiceManager]
    code: 200
    input: []
    output: Route
    side_effects: ["increments Route.version by 1"]
  - method: POST
    path: "/routes/{id}/complete"
    description: "Complete a dispatched route; skip unserviced stops (DISPATCHED -> COMPLETED)"
    roles: [FieldTech, ServiceManager]
    code: 200
    input: []
    output: Route
    side_effects: ["force-skip SCHEDULED stops (cascade)", "increments Route.version by 1"]

  # ---- Route Stops (peer access) ----
  - method: GET
    path: "/route-stops/{id}"
    description: "Fetch a route stop"
    roles: [Dispatcher, ServiceManager, FieldTech]
    code: 200
    input: []
    output: RouteStop
    side_effects: []
  - method: GET
    path: "/route-stops"
    description: "List route stops (filterable by system_id)"
    roles: [Dispatcher, ServiceManager, FieldTech]
    code: 200
    input: ["system_id?", "limit?", "offset?"]
    output: RouteStop[]
    side_effects: []
  - method: POST
    path: "/route-stops/{id}/complete"
    description: "Service a stop on a dispatched route (SCHEDULED -> COMPLETED)"
    roles: [FieldTech, ServiceManager]
    code: 200
    input: []
    output: RouteStop
    side_effects: ["stop_type-specific side effects on system / cartridge / visit (cascade)", "increments RouteStop.version by 1"]

  # ---- Cartridge Schedules ----
  - method: POST
    path: "/cartridge-schedules"
    description: "Create an RO/UV cartridge schedule for a system"
    roles: [ServiceManager, FieldTech]
    code: 201
    input: [system_id, cartridge_type, interval_days, last_replaced_at]
    output: CartridgeSchedule
    side_effects: []
  - method: GET
    path: "/cartridge-schedules/{id}"
    description: "Fetch a cartridge schedule"
    roles: [ServiceManager, FieldTech, Customer]
    code: 200
    input: []
    output: CartridgeSchedule
    side_effects: []
  - method: POST
    path: "/cartridge-schedules/{id}/evaluate"
    description: "Re-evaluate cartridge status against the clock (ON_TRACK/DUE_SOON/OVERDUE)"
    roles: [Dispatcher, ServiceManager]
    code: 200
    input: []
    output: CartridgeSchedule
    side_effects: ["set status per lead/grace window", "increments CartridgeSchedule.version by 1"]
  - method: POST
    path: "/cartridge-schedules/{id}/replace"
    description: "Replace a due cartridge (DUE_SOON|OVERDUE -> ON_TRACK)"
    roles: [FieldTech, ServiceManager]
    code: 200
    input: []
    output: CartridgeSchedule
    side_effects: ["reset last_replaced_at, status ON_TRACK, increment replacements_logged", "create ServiceVisit(CARTRIDGE_REPLACE)", "increments CartridgeSchedule.version by 1"]

  # ---- Service Visits ----
  - method: POST
    path: "/service-visits"
    description: "Log an ad-hoc service visit for a system"
    roles: [FieldTech, ServiceManager]
    code: 201
    input: [system_id, "stop_id?", visit_type, gallons_treated_reading, "billable_cents?"]
    output: ServiceVisit
    side_effects: []
  - method: GET
    path: "/service-visits/{id}"
    description: "Fetch a service visit"
    roles: [FieldTech, ServiceManager, Customer]
    code: 200
    input: []
    output: ServiceVisit
    side_effects: []
  - method: GET
    path: "/service-visits"
    description: "List service visits (filterable by system_id and stop_id; reverse-reachability for ServiceVisit.stop_id)"
    roles: [FieldTech, ServiceManager, Customer]
    code: 200
    input: ["system_id?", "stop_id?", "limit?", "offset?"]
    output: ServiceVisit[]
    side_effects: []
  - method: POST
    path: "/service-visits/{id}/confirm"
    description: "Confirm a logged visit (LOGGED -> CONFIRMED); billable visits emit an invoice"
    roles: [FieldTech, ServiceManager]
    code: 200
    input: []
    output: ServiceVisit
    side_effects: ["if billable_cents>0 create SERVICE_REPAIR Invoice debiting account (cascade)", "increments ServiceVisit.version by 1"]
  - method: POST
    path: "/service-visits/{id}/void"
    description: "Void a visit and compensate any emitted invoice (LOGGED|CONFIRMED -> VOIDED)"
    roles: [ServiceManager]
    code: 200
    input: []
    output: ServiceVisit
    side_effects: ["void emitted OPEN invoice, credit back account (compensation)", "increments ServiceVisit.version by 1"]

  # ---- Warranty Claims ----
  - method: POST
    path: "/warranty-claims"
    description: "File a warranty claim against a system"
    roles: [Customer, FieldTech, ServiceManager]
    code: 201
    input: [system_id, "contract_id?", defect_class, reported_at]
    output: WarrantyClaim
    side_effects: []
  - method: GET
    path: "/warranty-claims/{id}"
    description: "Fetch a warranty claim"
    roles: [Customer, FieldTech, ServiceManager]
    code: 200
    input: []
    output: WarrantyClaim
    side_effects: []
  - method: GET
    path: "/warranty-claims"
    description: "List warranty claims (filterable by contract_id)"
    roles: [Customer, FieldTech, ServiceManager]
    code: 200
    input: ["contract_id?", "limit?", "offset?"]
    output: WarrantyClaim[]
    side_effects: []
  - method: POST
    path: "/warranty-claims/{id}/triage"
    description: "Triage a filed claim; set coverage (FILED -> TRIAGED)"
    roles: [FieldTech, ServiceManager]
    code: 200
    input: []
    output: WarrantyClaim
    side_effects: ["set covered via coverage_window", "increments WarrantyClaim.version by 1"]
  - method: POST
    path: "/warranty-claims/{id}/resolve"
    description: "Resolve a triaged claim to REPAIR or REPLACE (TRIAGED -> REPAIR|REPLACE)"
    roles: [ServiceManager]
    code: 200
    input: [resolution]
    output: WarrantyClaim
    side_effects: ["compute settlement_cents", "create ServiceVisit (REPAIR path)", "increments WarrantyClaim.version by 1"]
  - method: POST
    path: "/warranty-claims/{id}/deny"
    description: "Deny an uncovered triaged claim (TRIAGED -> DENIED)"
    roles: [ServiceManager]
    code: 200
    input: []
    output: WarrantyClaim
    side_effects: ["increments WarrantyClaim.version by 1"]
  - method: POST
    path: "/warranty-claims/{id}/close"
    description: "Close a resolved claim; emit settlement invoice if owed (REPAIR|REPLACE -> CLOSED)"
    roles: [ServiceManager]
    code: 200
    input: []
    output: WarrantyClaim
    side_effects: ["if settlement_cents>0 create SERVICE_REPAIR Invoice (cascade)", "increments WarrantyClaim.version by 1"]

  # ---- Invoices ----
  - method: POST
    path: "/invoices"
    description: "Issue an invoice (computes amount via rental_proration / fees)"
    roles: [BillingClerk, ServiceManager]
    code: 201
    input: [account_id, "contract_id?", "supersedes_invoice_id?", invoice_kind, period_start, period_end, "due_offset_days?"]
    output: Invoice
    side_effects: ["compute amount_cents", "debit account credit_balance via apply_invoice (cascade)", "for RENTAL_CYCLE increment contract.months_billed"]
  - method: GET
    path: "/invoices/{id}"
    description: "Fetch an invoice"
    roles: [BillingClerk, ServiceManager, Customer]
    code: 200
    input: []
    output: Invoice
    side_effects: []
  - method: GET
    path: "/invoices"
    description: "List invoices (filterable by account_id, contract_id, and supersedes_invoice_id; reverse-reachability for Invoice.supersedes_invoice_id)"
    roles: [BillingClerk, ServiceManager, Customer]
    code: 200
    input: ["account_id?", "contract_id?", "supersedes_invoice_id?", "limit?", "offset?"]
    output: Invoice[]
    side_effects: []
  - method: POST
    path: "/invoices/{id}/evaluate"
    description: "Re-evaluate an OPEN invoice against the clock; may mark PAST_DUE (OPEN -> PAST_DUE)"
    roles: [BillingClerk, ServiceManager]
    code: 200
    input: []
    output: Invoice
    side_effects: ["if past due window set PAST_DUE and account standing DELINQUENT (cascade)", "increments Invoice.version by 1"]
  - method: POST
    path: "/invoices/{id}/pay"
    description: "Mark an invoice paid (OPEN|PAST_DUE -> PAID)"
    roles: [BillingClerk, ServiceManager]
    code: 200
    input: []
    output: Invoice
    side_effects: ["if no other past-due invoice set account standing GOOD (cascade)", "increments Invoice.version by 1"]
  - method: POST
    path: "/invoices/{id}/void"
    description: "Void an invoice and reverse its ledger debit (OPEN|PAST_DUE -> VOID)"
    roles: [BillingClerk, ServiceManager]
    code: 200
    input: []
    output: Invoice
    side_effects: ["credit back account by amount_cents (compensation)", "if cleared delinquency set standing GOOD (cascade)", "increments Invoice.version by 1"]

  # ---- Test-driving clock ----
  - method: POST
    path: "/_clock/set_current_utc"
    description: "Set the logical clock used for all temporal rules. Server startup default is 2026-01-01T00:00:00Z; before any set call the clock reads exactly this default and never falls back to wall-clock time."
    roles: [ServiceManager, Dispatcher, BillingClerk]
    code: 200
    input: [to_iso8601]
    output: "{ current_utc: string }"
    side_effects: ["advance logical clock to to_iso8601"]

# =============================================================================
# §1.6 Error Code Catalog
# =============================================================================
errors:
  - id: ERR_UNAUTHENTICATED
    http: 401
    condition: "Missing or malformed X-User-Role / X-User-ID headers"
  - id: ERR_UNAUTHORIZED
    http: 403
    condition: "Role not permitted for this operation per RBAC"
  - id: ERR_NOT_FOUND
    http: 404
    condition: "Path-referenced resource does not exist"
  - id: ERR_FK_NOT_FOUND
    http: 404
    condition: "A foreign-key body field references a non-existent resource"
  - id: ERR_INVALID_REQUEST
    http: 400
    condition: "Missing required field, bad type, enum out of range, or numeric constraint violated"
  - id: ERR_INVALID_STATE
    http: 409
    condition: "Resource not in a state from which the requested transition is defined"
  - id: ERR_STALE_VERSION
    http: 412
    condition: "OCC: expected_<parent>_version does not match current parent.version"
  - id: ERR_CAPACITY_MISMATCH
    http: 422
    condition: "System grain_capacity does not equal source WaterTest.recommended_grain_capacity at install"
  - id: ERR_ZONE_MISMATCH
    http: 422
    condition: "RouteStop system is not ACTIVE or its account zone differs from the route zone"
  - id: ERR_INSUFFICIENT_SALT
    http: 422
    condition: "Regeneration attempted while salt_level_pct < SALT_MIN_REGEN_PCT"
  - id: ERR_WINDOW_OVERLAP
    http: 409
    condition: "New stop window overlaps an existing SCHEDULED stop on the same route (buffer-aware), or window_end <= window_start"
  - id: ERR_SERVICE_GAP_VIOLATION
    http: 409
    condition: "Two stops servicing the same system fall within MIN_SERVICE_GAP_HOURS across routes"
  - id: ERR_ROUTE_FULL
    http: 409
    condition: "Adding a stop would push Route.stop_count above capacity_stops"
  - id: ERR_RENTAL_NOT_ALLOWED
    http: 422
    condition: "Account not in GOOD standing, system not RENTAL, or system already has an ACTIVE/SUSPENDED contract"
  - id: ERR_SUPERSEDE_NOT_VOID
    http: 422
    condition: "supersedes_invoice_id references an invoice that is not in status VOID"
  - id: ERR_INVOICE_CLOSED
    http: 409
    condition: "Pay/void attempted on an invoice already PAID or VOID"

# =============================================================================
# §1.7 RBAC Matrix
# =============================================================================
roles:
  - name: ServiceManager
    description: "Operations supervisor; hierarchical superset able to perform every operation plus exclusive overrides (decommission, void visit, resolve/deny/close claims)."
    identity: "opaque"
    exclusive_operations:
      - "POST /systems/{id}/decommission"
      - "POST /service-visits/{id}/void"
      - "POST /warranty-claims/{id}/resolve"
      - "POST /warranty-claims/{id}/deny"
      - "POST /warranty-claims/{id}/close"
    shared_operations:
      - "all FieldTech, Dispatcher, BillingClerk operations"
  - name: FieldTech
    description: "Performs water tests, installs/activates systems, runs regenerations, services stops, replaces cartridges, triages claims."
    identity: "entity_backed:FieldTech"
    exclusive_operations:
      - "POST /water-tests/{id}/recommend"
      - "POST /systems/{id}/install"
      - "POST /systems/{id}/activate"
      - "POST /systems/{id}/meter-reading"
      - "POST /systems/{id}/regenerate"
      - "POST /route-stops/{id}/complete"
      - "POST /routes/{id}/complete"
      - "POST /cartridge-schedules/{id}/replace"
      - "POST /warranty-claims/{id}/triage"
      - "POST /service-visits/{id}/confirm"
    shared_operations:
      - "POST /water-tests, POST /systems, POST /service-visits, GET reads"
  - name: Dispatcher
    description: "Owns route planning, stop scheduling, dispatch, and cartridge evaluation."
    identity: "opaque"
    exclusive_operations:
      - "POST /routes"
      - "POST /routes/{id}/stops"
      - "POST /routes/{id}/dispatch"
      - "POST /cartridge-schedules/{id}/evaluate"
    shared_operations:
      - "POST /field-techs, GET routes/stops/techs"
  - name: BillingClerk
    description: "Owns rental contracts, invoices, account credit, and contract lifecycle (suspend/resume/terminate)."
    identity: "opaque"
    exclusive_operations:
      - "POST /rental-contracts"
      - "POST /rental-contracts/{id}/suspend"
      - "POST /rental-contracts/{id}/resume"
      - "POST /rental-contracts/{id}/terminate"
      - "POST /invoices"
      - "POST /invoices/{id}/evaluate"
      - "POST /invoices/{id}/pay"
      - "POST /invoices/{id}/void"
      - "POST /accounts/{id}/credit"
    shared_operations:
      - "POST /customers, POST /accounts, GET reads"
  - name: Customer
    description: "Account holder; reads own resources, accepts recommendations, files warranty claims."
    identity: "entity_backed:Customer"
    exclusive_operations:
      - "POST /water-tests/{id}/accept"
    shared_operations:
      - "POST /warranty-claims, GET reads on own account resources"
