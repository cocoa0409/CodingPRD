# =============================================================================
# SCAFFOLD — task_2910_emerging_contaminant_sampling_treatment_compliance
# Sections §1.0 - §1.7. Difficulty design (§1.8) lives in
# SCAFFOLD_DIFFICULTY_DESIGN.yaml; corner design (§1.9) in
# SCAFFOLD_CORNER_DESIGN.yaml.
# =============================================================================

scenario: |
  2910. Emerging Contaminant Sampling & Treatment Compliance (drinking water utility): initial
  monitoring at each entry point with sampling protocols preventing sample contamination,
  laboratory selection with certified methods and detection limit requirements, running average
  calculation against maximum contaminant levels with violation determination, public notification
  requirements with content and timing by violation type, treatment technology evaluation across
  granular activated carbon, ion exchange and reverse osmosis with pilot testing, capital planning,
  funding applications and rate impact analysis for treatment installation, residuals handling and
  disposal for spent media with waste classification questions, source water investigation and
  potential cost recovery from responsible parties, ongoing compliance monitoring frequency
  reduction based on results

domain_name: emerging-contaminant-compliance

# All collections are root-level (flat topology): /entry-points, /samples, /lab-results, ...
# Every FK is discovered through a filtered list on the CHILD collection rather than through a
# nested sub-resource path, so no entity owns a URL sub-tree.
api_prefix: "/"

complexity_profile:
  primary_archetype: compliance_audit
  secondary_archetype: ledger_reconciliation
  complexity_layers:
    - rate_threshold_triggers        # MCL / trigger-level / hazard-index / surcharge-tier breakpoints
    - cascading_side_effects         # accept-result and invalidate-sample chains span 4 entities
    - dual_variant_calculation       # compliance vs planning LRAA; uniform vs volumetric bill impact
    - optimistic_concurrency         # OCC on EntryPoint.version and CapitalProject.version
    - derived_field_reconciliation   # posture / hazard_index / rate-impact ladder recomputed on every write

  entity_topology: flat
  # 13 peer entities linked only by foreign keys; no entity is nested under another in any URL.
  # The read surface (one GET /{collection}/{id} + one filtered GET /{collection} per entity) is
  # deliberately mechanical — the difficulty lives in §1.3 calculations, the §1.2 cascades and the
  # §1.4 priority ladder, not in the endpoint count.

  state_machine_shape: branching
  # Concretely: EntryPoint.monitoring_status is CYCLIC (QUARTERLY -> REDUCTION_PENDING -> QUARTERLY),
  # PublicNotification.status is CYCLIC (DRAFT -> SUBMITTED -> DRAFT revision loop) and BRANCHING at
  # distribution (APPROVED -> DISTRIBUTED | LATE_DISTRIBUTED with divergent side-effect sets),
  # CapitalProject carries two PARALLEL dimensions (funding_status x construction_status),
  # TreatmentEvaluation is a FORK-JOIN (SCREENING -> per-technology pilots -> SELECTED | REJECTED_ALL
  # with divergent side effects per selected technology), Sample branches at receive
  # (IN_TRANSIT -> RECEIVED | INVALIDATED) and cycles through invalidate/reinstate.

  relationship_patterns:
    - one_to_many          # EntryPoint -> Sample, TreatmentEvaluation -> PilotTest, CapitalProject -> FundingApplication
    - self_referential     # Sample.resample_of_sample_id -> Sample.id
    - cross_aggregate      # LabResult -> Laboratory, CostRecoveryClaim -> CapitalProject
    - polymorphic: false

  role_model: segregation_of_duties
  # The ComplianceOfficer who drafts/submits a PublicNotification may not certify its distribution
  # (X-User-ID comparison); regulator-side approvals (monitoring reduction, waste classification,
  # funding decisions, determination rescission) are reserved to StateRegulator.

  consistency_model: immediate

response_envelope:
  success: |
    { "meta": { "api_request_id": "req_xxx", "api_request_timestamp": "ISO8601" },
      "response_type": "object" | "array", "data": {} }
  error: |
    { "meta": { ... }, "response_type": "error",
      "data": { "error_id": "ERR_XXX", "message": "..." } }
  pagination_fields: ["limit", "offset", "total_count", "has_more"]
  pagination_defaults: { limit: 10, min: 1, max: 100, offset: 0 }

# =============================================================================
# §1.1 Entity-Relationship Table
# =============================================================================

entities:

  # ---------------------------------------------------------------------------
  - name: Contaminant
    parent: null
    common_fields: true
    entity_kind: configuration
    fields:
      - name: code
        type: string
        source: input
        description: "Regulated emerging-contaminant code (e.g. PFOA, PFHXS)."
        constraints: "1..16 chars, uppercase letters/digits/underscore; unique across Contaminant"
      - name: mcl_ng_per_l
        type: number
        source: input
        description: "Maximum contaminant level in ng/L."
        constraints: "> 0; exactly 2 decimal places"
      - name: trigger_level_ng_per_l
        type: number
        source: input
        description: "Trigger level in ng/L; a quarter qualifies for monitoring reduction only when the compliance value is strictly below this."
        constraints: "> 0 and < mcl_ng_per_l; exactly 2 decimal places"
      - name: required_mrl_ng_per_l
        type: number
        source: input
        description: "Maximum detection limit a laboratory may report for this contaminant (required minimum reporting level)."
        constraints: "> 0 and <= mcl_ng_per_l; exactly 2 decimal places"
      - name: hazard_index_member
        type: boolean
        source: input
        description: "True when this contaminant participates in the mixture hazard index."
        default: false
      - name: hbwc_ng_per_l
        type: number
        source: input
        description: "Health-based water concentration used as the hazard-index denominator."
        default: null
        constraints: "required and > 0 when hazard_index_member is true; must be null when hazard_index_member is false"
      - name: notification_tier
        type: enum
        source: input
        description: "Baseline public-notification tier for an MCL violation on this contaminant."
        default: TIER_2
        constraints: "one of TIER_1 | TIER_2 | TIER_3"

  # ---------------------------------------------------------------------------
  - name: Laboratory
    parent: null
    common_fields: true
    entity_kind: configuration
    fields:
      - name: name
        type: string
        source: input
        description: "Laboratory trade name."
        constraints: "1..120 chars"
      - name: certification_id
        type: string
        source: input
        description: "State certification number."
        constraints: "1..40 chars; unique across Laboratory"
      - name: certified_methods
        type: array
        source: input
        description: "Analytical methods this laboratory is certified to run."
        constraints: "non-empty array of distinct values from METHOD_533 | METHOD_537_1 | METHOD_1633"
      - name: lowest_achievable_dl_ng_per_l
        type: number
        source: input
        description: "Lowest detection limit this laboratory can achieve; a reported detection limit below this value is physically impossible and rejected."
        constraints: "> 0; exactly 2 decimal places"
      - name: certification_expires_on
        type: datetime
        source: input
        description: "Instant at which the certification lapses; a result whose analyzed_at is at or after this instant is rejected."
        constraints: "ISO 8601 UTC with exactly three fractional digits"
      - name: daily_analysis_capacity
        type: integer
        source: input
        description: "Maximum number of live LabResult rows this laboratory may hold inside one UTC calendar day of analyzed_at."
        default: 3
        constraints: ">= 1"

  # ---------------------------------------------------------------------------
  - name: EntryPoint
    parent: null
    common_fields: true
    entity_kind: resource
    fields:
      - name: label
        type: string
        source: input
        description: "Entry-point-to-the-distribution-system label (EPTDS label)."
        constraints: "1..40 chars; unique across EntryPoint"
      - name: source_type
        type: enum
        source: input
        description: "Raw water source category."
        constraints: "one of GROUNDWATER | SURFACE_WATER | PURCHASED"
      - name: population_served
        type: integer
        source: input
        description: "Population served through this entry point; drives the acute-notification test and the rate base."
        constraints: ">= 1"
      - name: monitoring_status
        type: enum
        source: system
        description: "Monitoring-frequency state machine value (§1.2 EntryPoint.monitoring_status)."
        default: INITIAL
        constraints: "one of INITIAL | QUARTERLY | REDUCTION_PENDING | ANNUAL | TRIENNIAL | SUSPENDED"
      - name: requested_monitoring_status
        type: enum
        source: system
        description: "Reduction target captured while monitoring_status is REDUCTION_PENDING; cleared on decision."
        default: null
        constraints: "one of ANNUAL | TRIENNIAL, or null"
      - name: treatment_status
        type: enum
        source: system
        description: "Treatment posture; NONE until a pilot exists, INSTALLED once the capital project is in service."
        default: NONE
        constraints: "one of NONE | PILOT | INSTALLED"
      - name: compliance_posture
        type: enum
        source: computed
        description: "Derived from max_compliance_ratio by calculations.compliance_posture_derivation."
        default: COMPLIANT
        constraints: "one of COMPLIANT | TRIGGERED | VIOLATION_PENDING"
      - name: max_compliance_ratio
        type: number
        source: computed
        description: "Highest compliance LRAA / MCL ratio across contaminants with at least one ACCEPTED result; see calculations.max_compliance_ratio."
        default: 0.0
        constraints: "4 decimal places, round_half_up"
      - name: hazard_index
        type: number
        source: computed
        description: "Mixture hazard index over hazard-index-member contaminants; see calculations.hazard_index."
        default: 0.0
        constraints: "2 decimal places, round_half_up"
      - name: accepted_result_count
        type: integer
        source: computed
        description: "Count of LabResult rows with status ACCEPTED whose Sample.entry_point_id is this entry point."
        default: 0
      - name: consecutive_qualifying_quarters
        type: integer
        source: computed
        description: "Consecutive most-recent monitoring periods qualifying for reduction; see calculations.consecutive_qualifying_quarters."
        default: 0
      - name: consecutive_invalidated_samples
        type: integer
        source: computed
        description: "Consecutive Sample invalidations at this entry point since the last successful receive; reaching 3 forces monitoring_status to SUSPENDED."
        default: 0
      - name: open_violation_count
        type: integer
        source: computed
        description: "Count of ComplianceDetermination rows for this entry point with status ISSUED and determination MCL_VIOLATION."
        default: 0
      - name: served_account_count
        type: integer
        source: computed
        description: "ceil(population_served / PERSONS_PER_ACCOUNT); frozen at creation and copied onto CapitalProject."
      - name: annual_billed_kgal
        type: integer
        source: computed
        description: "served_account_count * KGAL_PER_ACCOUNT_PER_YEAR; frozen at creation."
      - name: baseline_annual_revenue_cents
        type: integer
        source: computed
        description: "annual_billed_kgal * BASE_RATE_CENTS_PER_KGAL; frozen at creation, copied onto CapitalProject as current_annual_revenue_cents."

  # ---------------------------------------------------------------------------
  - name: Sample
    parent: null
    common_fields: true
    entity_kind: resource
    fields:
      - name: entry_point_id
        type: string
        source: input
        description: "FK -> EntryPoint.id; the entry point sampled."
      - name: panel_contaminant_ids
        type: array
        source: input
        description: "FK -> Contaminant.id; array of contaminant ids the sample must be analyzed for. Sample.status reaches ANALYZED only when every id in this array has an ACCEPTED LabResult."
        constraints: "non-empty array of distinct Contaminant ids"
      - name: collector_user_id
        type: string
        source: system
        description: "X-User-ID of the SamplingTechnician who created the sample (opaque operator id, deliberately NOT a foreign key)."
      - name: monitoring_period
        type: string
        source: input
        description: "Monitoring period label; must equal the calendar quarter containing collected_at."
        constraints: "matches ^[0-9]{4}Q[1-4]$"
      - name: collected_at
        type: datetime
        source: input
        description: "Instant of collection; must be at or before the logical clock."
        constraints: "ISO 8601 UTC with exactly three fractional digits"
      - name: protocol
        type: enum
        source: input
        description: "Field collection protocol."
        constraints: "one of LOW_FLOW_GRAB | COMPOSITE"
      - name: ptfe_free_kit
        type: boolean
        source: input
        description: "True when the collection kit contained no PTFE/fluoropolymer wetted parts; false is rejected outright as a contamination-protocol breach."
      - name: field_blank_included
        type: boolean
        source: input
        description: "True when a paired field blank accompanied the sample; false is rejected for LOW_FLOW_GRAB and COMPOSITE alike."
      - name: preservative_lot
        type: string
        source: input
        description: "Preservative lot code recorded on the chain-of-custody form."
        constraints: "1..40 chars"
      - name: resample_of_sample_id
        type: string
        source: input
        description: "FK -> Sample.id; the INVALIDATED sample this collection replaces. Self-referential."
        default: null
      - name: assigned_laboratory_id
        type: string
        source: system
        description: "FK -> Laboratory.id; set when the sample is shipped. Every LabResult must originate from this laboratory."
        default: null
      - name: shipped_at
        type: datetime
        source: system
        description: "Instant the courier took custody."
        default: null
      - name: received_at
        type: datetime
        source: system
        description: "Instant the laboratory logged receipt."
        default: null
      - name: chain_of_custody_intact
        type: boolean
        source: system
        description: "Custody-seal verdict recorded at receipt."
        default: null
      - name: field_blank_result_ng_per_l
        type: number
        source: system
        description: "Paired field-blank concentration recorded at receipt; at or above FIELD_BLANK_LIMIT_NG_PER_L the sample is auto-invalidated as contaminated."
        default: null
      - name: status
        type: enum
        source: system
        description: "Sample lifecycle state (§1.2 Sample.status)."
        default: COLLECTED
        constraints: "one of COLLECTED | IN_TRANSIT | RECEIVED | ANALYZED | INVALIDATED"
      - name: status_before_invalidation
        type: enum
        source: system
        description: "State captured at invalidation so reinstatement restores it exactly."
        default: null
        constraints: "one of RECEIVED | ANALYZED, or null"
      - name: invalidation_reason
        type: enum
        source: system
        description: "Why the sample was invalidated."
        default: null
        constraints: "one of CHAIN_OF_CUSTODY_BROKEN | FIELD_BLANK_CONTAMINATED | HOLDING_TIME_EXCEEDED | QC_FAILURE | OPERATOR_ERROR, or null"

  # ---------------------------------------------------------------------------
  - name: LabResult
    parent: null
    common_fields: true
    entity_kind: resource
    fields:
      - name: sample_id
        type: string
        source: input
        description: "FK -> Sample.id; the sample analyzed."
      - name: laboratory_id
        type: string
        source: system
        description: "FK -> Laboratory.id; taken from the submitting LaboratoryManager's X-User-ID, never from the request body."
      - name: contaminant_id
        type: string
        source: input
        description: "FK -> Contaminant.id; must be a member of Sample.panel_contaminant_ids."
      - name: method
        type: enum
        source: input
        description: "Analytical method used; must be in Laboratory.certified_methods."
        constraints: "one of METHOD_533 | METHOD_537_1 | METHOD_1633"
      - name: reported_ng_per_l
        type: number
        source: input
        description: "Reported concentration in ng/L."
        constraints: ">= 0; exactly 2 decimal places"
      - name: detection_limit_ng_per_l
        type: number
        source: input
        description: "Detection limit achieved for this analysis."
        constraints: "> 0; exactly 2 decimal places; >= Laboratory.lowest_achievable_dl_ng_per_l and <= Contaminant.required_mrl_ng_per_l"
      - name: analyzed_at
        type: datetime
        source: input
        description: "Instant of analysis; drives holding-time and laboratory-daily-capacity checks."
        constraints: "ISO 8601 UTC with exactly three fractional digits"
      - name: censored
        type: boolean
        source: computed
        description: "True when reported_ng_per_l < detection_limit_ng_per_l (a non-detect)."
      - name: compliance_value_ng_per_l
        type: number
        source: computed
        description: "Zero-substituted value used by the compliance LRAA variant; see calculations.locational_running_annual_average."
        constraints: "2 decimal places, round_half_up"
      - name: planning_value_ng_per_l
        type: number
        source: computed
        description: "Half-detection-limit-substituted value used by the planning LRAA variant."
        constraints: "2 decimal places, round_half_up"
      - name: status
        type: enum
        source: system
        description: "Result lifecycle state (§1.2 LabResult.status)."
        default: SUBMITTED
        constraints: "one of SUBMITTED | ACCEPTED | REJECTED | SUPERSEDED"
      - name: review_note
        type: string
        source: system
        description: "Free-text note captured by the reviewing ComplianceOfficer."
        default: null
      - name: reject_reason_code
        type: enum
        source: system
        description: "Reason recorded when the reviewer rejects the result."
        default: null
        constraints: "one of QC_FAILURE | TRANSCRIPTION_ERROR | METHOD_DEVIATION, or null"

  # ---------------------------------------------------------------------------
  - name: ComplianceDetermination
    parent: null
    common_fields: true
    entity_kind: resource
    fields:
      - name: entry_point_id
        type: string
        source: input
        description: "FK -> EntryPoint.id; the entry point being determined."
      - name: contaminant_id
        type: string
        source: input
        description: "FK -> Contaminant.id; the subject contaminant."
      - name: period_end
        type: string
        source: input
        description: "Most recent monitoring period included in the determination window."
        constraints: "matches ^[0-9]{4}Q[1-4]$"
      - name: lraa_ng_per_l
        type: number
        source: computed
        description: "Compliance-variant locational running annual average frozen at creation."
        constraints: "2 decimal places, round_half_up"
      - name: planning_lraa_ng_per_l
        type: number
        source: computed
        description: "Planning-variant LRAA frozen at creation; differs from lraa_ng_per_l whenever any included result is censored."
        constraints: "2 decimal places, round_half_up"
      - name: quarters_used
        type: integer
        source: computed
        description: "Number of monitoring periods that contributed to lraa_ng_per_l (0..4)."
      - name: hazard_index
        type: number
        source: computed
        description: "EntryPoint.hazard_index frozen at creation; only meaningful when the subject contaminant is a hazard-index member."
        constraints: "2 decimal places, round_half_up"
      - name: determination
        type: enum
        source: computed
        description: "Outcome from calculations.violation_determination."
        constraints: "one of NO_VIOLATION | TRIGGER_EXCEEDED | MCL_VIOLATION | MONITORING_VIOLATION"
      - name: violation_type
        type: enum
        source: computed
        description: "Severity classification used to pick the public-notification tier."
        constraints: "one of NONE | ACUTE | NON_ACUTE | MONITORING_AND_REPORTING"
      - name: status
        type: enum
        source: system
        description: "Determination lifecycle state (§1.2 ComplianceDetermination.status)."
        default: DRAFT
        constraints: "one of DRAFT | ISSUED | RESCINDED"
      - name: determined_by_user_id
        type: string
        source: system
        description: "X-User-ID of the ComplianceOfficer who created the determination (opaque operator id)."
      - name: issued_at
        type: datetime
        source: system
        description: "Logical-clock instant at issuance; the public-notification deadline is measured from here."
        default: null
      - name: rescind_reason
        type: string
        source: system
        description: "Reason supplied by the StateRegulator on rescission."
        default: null

  # ---------------------------------------------------------------------------
  - name: PublicNotification
    parent: null
    common_fields: true
    entity_kind: resource
    fields:
      - name: determination_id
        type: string
        source: system
        description: "FK -> ComplianceDetermination.id; the violation being noticed. Set by the cascade that creates this row."
      - name: tier
        type: enum
        source: system
        description: "Notification tier chosen by calculations.notification_tier_and_deadline."
        constraints: "one of TIER_1 | TIER_2 | TIER_3"
      - name: required_by_at
        type: datetime
        source: system
        description: "Deadline = determination.issued_at + TIER_DEADLINE_HOURS[tier]."
      - name: content_elements
        type: array
        source: system
        description: "Mandatory content elements supplied at submit time."
        default: []
        constraints: "distinct values from MANDATORY_CONTENT_ELEMENTS"
      - name: delivery_methods
        type: array
        source: system
        description: "Delivery channels supplied at submit time."
        default: []
        constraints: "distinct values from BROADCAST_MEDIA | POSTING | MAIL | HAND_DELIVERY | ANNUAL_REPORT"
      - name: status
        type: enum
        source: system
        description: "Notification lifecycle state (§1.2 PublicNotification.status)."
        default: DRAFT
        constraints: "one of DRAFT | SUBMITTED | APPROVED | DISTRIBUTED | LATE_DISTRIBUTED | VOIDED"
      - name: revision_count
        type: integer
        source: system
        description: "Number of times a regulator review sent the draft back; a fourth submit is refused."
        default: 0
      - name: drafted_by_user_id
        type: string
        source: system
        description: "X-User-ID of the ComplianceOfficer who last submitted the draft (opaque operator id)."
        default: null
      - name: certified_by_user_id
        type: string
        source: system
        description: "X-User-ID of the ComplianceOfficer who certified distribution; must differ from drafted_by_user_id."
        default: null
      - name: distributed_at
        type: datetime
        source: system
        description: "Instant distribution was certified."
        default: null
      - name: late_by_hours
        type: integer
        source: system
        description: "ceil of hours by which distributed_at exceeded required_by_at; 0 when on time."
        default: null
      - name: delivery_evidence_ref
        type: string
        source: system
        description: "Evidence reference (affidavit/broadcast log) captured at certification."
        default: null
      - name: review_note
        type: string
        source: system
        description: "Regulator note from the most recent review."
        default: null

  # ---------------------------------------------------------------------------
  - name: TreatmentEvaluation
    parent: null
    common_fields: true
    entity_kind: resource
    fields:
      - name: entry_point_id
        type: string
        source: input
        description: "FK -> EntryPoint.id; the entry point whose treatment options are being evaluated."
      - name: residuals_budget_cents
        type: integer
        source: input
        description: "Ceiling on cumulative residuals disposal spend charged to this evaluation."
        default: 250000
        constraints: ">= 0"
      - name: residuals_spent_cents
        type: integer
        source: computed
        description: "Sum of ResidualsManifest.disposal_cost_cents for manifests of this evaluation's pilots with status SHIPPED."
        default: 0
      - name: mandated
        type: boolean
        source: system
        description: "True when the evaluation was auto-created by the violation-pending cascade rather than opened voluntarily by an engineer."
        default: false
      - name: status
        type: enum
        source: system
        description: "Evaluation lifecycle state (§1.2 TreatmentEvaluation.status)."
        default: SCREENING
        constraints: "one of SCREENING | PILOTING | SELECTED | REJECTED_ALL"
      - name: selected_technology
        type: enum
        source: system
        description: "Technology chosen by calculations.technology_selection."
        default: null
        constraints: "one of GAC | IX | RO, or null"
      - name: decision_note
        type: string
        source: system
        description: "Note captured with the SELECT or ABANDON decision."
        default: null

  # ---------------------------------------------------------------------------
  - name: PilotTest
    parent: null
    common_fields: true
    entity_kind: resource
    fields:
      - name: treatment_evaluation_id
        type: string
        source: input
        description: "FK -> TreatmentEvaluation.id; the evaluation this pilot belongs to."
      - name: technology
        type: enum
        source: input
        description: "Technology under pilot."
        constraints: "one of GAC | IX | RO"
      - name: window_start_at
        type: datetime
        source: input
        description: "Start of the skid occupancy window at the entry point (inclusive)."
      - name: window_end_at
        type: datetime
        source: input
        description: "End of the skid occupancy window (exclusive); must be strictly after window_start_at."
      - name: ebct_min
        type: number
        source: input
        description: "Empty bed contact time in minutes."
        constraints: "> 0; 2 decimal places"
      - name: lifecycle_cost_cents
        type: integer
        source: input
        description: "20-year lifecycle cost estimate in cents; feeds lifecycle_cost_score and the selection tie-break."
        constraints: ">= 0"
      - name: capital_cost_estimate_cents
        type: integer
        source: input
        description: "Installed capital cost estimate in cents; copied onto CapitalProject.capital_cost_cents when this pilot is selected."
        constraints: ">= 0"
      - name: annual_om_estimate_cents
        type: integer
        source: input
        description: "Annual O&M estimate in cents; copied onto CapitalProject.annual_om_cost_cents when this pilot is selected."
        constraints: ">= 0"
      - name: residuals_burden_score
        type: number
        source: input
        description: "Operator-scored residuals burden criterion value."
        constraints: "0.00 .. 100.00; 2 decimal places"
      - name: footprint_score
        type: number
        source: input
        description: "Operator-scored footprint criterion value."
        constraints: "0.00 .. 100.00; 2 decimal places"
      - name: om_complexity_score
        type: number
        source: input
        description: "Operator-scored O&M complexity criterion value."
        constraints: "0.00 .. 100.00; 2 decimal places"
      - name: influent_ng_per_l
        type: number
        source: system
        description: "Influent concentration recorded at completion."
        default: null
      - name: effluent_ng_per_l
        type: number
        source: system
        description: "Effluent concentration recorded at completion."
        default: null
      - name: bed_volumes_treated
        type: integer
        source: system
        description: "Bed volumes treated, recorded at completion."
        default: null
      - name: spent_media_kg
        type: number
        source: system
        description: "Spent media mass generated by the pilot, recorded at completion."
        default: null
        constraints: "> 0; 2 decimal places"
      - name: unmanifested_media_kg
        type: number
        source: computed
        description: "spent_media_kg minus the mass already committed to non-VOIDED manifests; conserved quantity of the residuals invariant."
        default: 0.00
        constraints: "2 decimal places, round_half_up"
      - name: removal_pct
        type: number
        source: computed
        description: "round_half_up((influent_ng_per_l - effluent_ng_per_l) / influent_ng_per_l * 100, 2)."
        default: null
      - name: lifecycle_cost_score
        type: number
        source: computed
        description: "Cost criterion value derived from lifecycle_cost_cents; see calculations.technology_score."
        default: null
      - name: technology_score
        type: number
        source: computed
        description: "Weighted score from calculations.technology_score (round-each-term-then-sum)."
        default: null
      - name: selected
        type: boolean
        source: computed
        description: "True on exactly the pilot that won calculations.technology_selection for its evaluation."
        default: false
      - name: status
        type: enum
        source: system
        description: "Pilot lifecycle state (§1.2 PilotTest.status)."
        default: PLANNED
        constraints: "one of PLANNED | RUNNING | COMPLETED"

  # ---------------------------------------------------------------------------
  - name: ResidualsManifest
    parent: null
    common_fields: true
    entity_kind: resource
    fields:
      - name: pilot_test_id
        type: string
        source: input
        description: "FK -> PilotTest.id; the pilot whose spent media this manifest covers."
      - name: media_type
        type: enum
        source: input
        description: "Residual stream; must be compatible with the pilot's technology per MEDIA_TYPE_BY_TECHNOLOGY."
        constraints: "one of GAC_CARBON | IX_RESIN | RO_MEMBRANE | RO_CONCENTRATE"
      - name: mass_kg
        type: number
        source: input
        description: "Mass committed to this manifest; may not exceed PilotTest.unmanifested_media_kg."
        constraints: "> 0; 2 decimal places"
      - name: leachate_pfas_ng_per_l
        type: number
        source: system
        description: "Leachate concentration recorded by the regulator at classification."
        default: null
      - name: waste_classification
        type: enum
        source: system
        description: "Classification derived from leachate_pfas_ng_per_l by calculations.waste_classification."
        default: null
        constraints: "one of NON_HAZARDOUS_SOLID | SPECIAL_WASTE | HAZARDOUS, or null"
      - name: disposal_method
        type: enum
        source: system
        description: "Disposal route recorded at shipment; must be permitted for waste_classification."
        default: null
        constraints: "one of LANDFILL | REACTIVATION | INCINERATION_1100C | DEEP_WELL, or null"
      - name: disposal_cost_cents
        type: integer
        source: computed
        description: "round_half_up(mass_kg * DISPOSAL_RATE_CENTS_PER_KG[disposal_method]); charged against the evaluation's residuals budget at shipment."
        default: null
      - name: carrier_ref
        type: string
        source: system
        description: "Hauler manifest reference captured at shipment."
        default: null
      - name: status
        type: enum
        source: system
        description: "Manifest lifecycle state (§1.2 ResidualsManifest.status)."
        default: DRAFT
        constraints: "one of DRAFT | CLASSIFIED | SHIPPED | VOIDED"
      - name: classified_by_user_id
        type: string
        source: system
        description: "X-User-ID of the StateRegulator who classified the waste (opaque operator id)."
        default: null
      - name: void_reason_code
        type: enum
        source: system
        description: "Reason recorded when the manifest is voided and its mass returned to the pilot."
        default: null
        constraints: "one of DUPLICATE_ENTRY | MASS_CORRECTION | CLASSIFICATION_ERROR, or null"

  # ---------------------------------------------------------------------------
  - name: CapitalProject
    parent: null
    common_fields: true
    entity_kind: resource
    fields:
      - name: entry_point_id
        type: string
        source: system
        description: "FK -> EntryPoint.id; copied from the evaluation when the cascade creates this project."
      - name: treatment_evaluation_id
        type: string
        source: system
        description: "FK -> TreatmentEvaluation.id; the evaluation whose SELECT decision created this project."
      - name: selected_technology
        type: enum
        source: system
        description: "Technology inherited from the winning pilot."
        constraints: "one of GAC | IX | RO"
      - name: required_disposal_method
        type: enum
        source: system
        description: "Disposal route mandated for the full-scale residual stream; set per technology by the SELECT cascade."
        constraints: "one of REACTIVATION | INCINERATION_1100C | DEEP_WELL"
      - name: concentrate_permit_required
        type: boolean
        source: system
        description: "True only on the RO branch, where a concentrate discharge permit is a precondition for construction."
        default: false
      - name: capital_cost_cents
        type: integer
        source: system
        description: "Installed capital cost; seeded from the winning pilot and adjustable by the FinanceOfficer."
        constraints: ">= 0"
      - name: annual_om_cost_cents
        type: integer
        source: system
        description: "Annual O&M cost; seeded from the winning pilot and adjustable by the FinanceOfficer."
        constraints: ">= 0"
      - name: served_account_count
        type: integer
        source: system
        description: "Billed accounts in the rate base; seeded from EntryPoint.served_account_count."
        constraints: ">= 1"
      - name: annual_billed_kgal
        type: integer
        source: system
        description: "Annual billed volume in thousand-gallon units; seeded from EntryPoint.annual_billed_kgal."
        constraints: ">= 1"
      - name: current_annual_revenue_cents
        type: integer
        source: system
        description: "Current annual water revenue; seeded from EntryPoint.baseline_annual_revenue_cents."
        constraints: ">= 1"
      - name: rate_design
        type: enum
        source: system
        description: "Which bill-impact variant is authoritative for monthly_bill_increase_cents."
        default: UNIFORM
        constraints: "one of UNIFORM | VOLUMETRIC"
      - name: funding_awarded_cents
        type: integer
        source: computed
        description: "Sum of awarded_cents over FundingApplication rows of this project with status AWARDED."
        default: 0
      - name: grant_equivalent_cents
        type: integer
        source: computed
        description: "Sum of forgiven_cents over AWARDED applications; the portion that never has to be repaid."
        default: 0
      - name: loan_principal_cents
        type: integer
        source: computed
        description: "Sum of (awarded_cents - forgiven_cents) over AWARDED applications; still borrowed money."
        default: 0
      - name: recovered_cents
        type: integer
        source: computed
        description: "Sum of alloc_capital_cents over SETTLED CostRecoveryClaim rows of this project."
        default: 0
      - name: local_share_cents
        type: integer
        source: computed
        description: "capital_cost_cents - funding_awarded_cents - recovered_cents; the ledger identity of §0.5 rule 9."
      - name: borrowed_cents
        type: integer
        source: computed
        description: "local_share_cents + loan_principal_cents; a 0%-forgiveness loan therefore leaves borrowing unchanged."
      - name: annual_debt_service_cents
        type: integer
        source: computed
        description: "round_half_up(borrowed_cents * ANNUITY_FACTOR_20Y_2PCT)."
      - name: base_annual_requirement_cents
        type: integer
        source: computed
        description: "annual_debt_service_cents + annual_om_cost_cents; step 3 of calculations.rate_impact_analysis."
      - name: provisional_rate_impact_pct
        type: number
        source: computed
        description: "Pre-surcharge impact used ONLY to select the surcharge tier; step 4."
        constraints: "2 decimal places, round_half_up"
      - name: surcharge_bp
        type: integer
        source: computed
        description: "Regulatory surcharge in basis points selected from provisional_rate_impact_pct; step 5."
      - name: final_annual_requirement_cents
        type: integer
        source: computed
        description: "base_annual_requirement_cents plus the surcharge; step 6."
      - name: rate_impact_pct
        type: number
        source: computed
        description: "Final impact on current_annual_revenue_cents; step 7."
        constraints: "2 decimal places, round_half_up"
      - name: uniform_monthly_increase_cents
        type: integer
        source: computed
        description: "Uniform variant of the bill impact."
      - name: volumetric_rate_increase_cents_per_kgal
        type: integer
        source: computed
        description: "Intermediate volumetric rate step used by the volumetric variant."
      - name: volumetric_monthly_increase_cents
        type: integer
        source: computed
        description: "Volumetric variant of the bill impact; differs from the uniform variant because of the intermediate rounding."
      - name: monthly_bill_increase_cents
        type: integer
        source: computed
        description: "The variant selected by rate_design."
      - name: funding_status
        type: enum
        source: computed
        description: "First dimension of the parallel state machine, derived from this project's FundingApplication rows."
        default: NOT_APPLIED
        constraints: "one of NOT_APPLIED | APPLIED | AWARDED | DENIED"
      - name: construction_status
        type: enum
        source: system
        description: "Second, independent dimension of the parallel state machine."
        default: PLANNED
        constraints: "one of PLANNED | BIDDING | CONSTRUCTION | IN_SERVICE"

  # ---------------------------------------------------------------------------
  - name: FundingApplication
    parent: null
    common_fields: true
    entity_kind: resource
    fields:
      - name: capital_project_id
        type: string
        source: input
        description: "FK -> CapitalProject.id; the project being funded."
      - name: program
        type: enum
        source: input
        description: "Funding program applied to."
        constraints: "one of SRF_LOAN | EC_GRANT | BIL_SUPPLEMENTAL"
      - name: amount_requested_cents
        type: integer
        source: input
        description: "Amount requested in cents."
        constraints: "> 0"
      - name: disadvantaged_community
        type: boolean
        source: input
        description: "Disadvantaged-community designation; raises the principal-forgiveness percentage."
        default: false
      - name: forgiveness_pct
        type: number
        source: computed
        description: "Principal forgiveness percentage from FORGIVENESS_PCT_BY_PROGRAM."
        constraints: "0.00 .. 100.00"
      - name: awarded_cents
        type: integer
        source: system
        description: "Amount actually awarded; may not exceed amount_requested_cents."
        default: null
      - name: forgiven_cents
        type: integer
        source: computed
        description: "round_half_up(awarded_cents * forgiveness_pct / 100)."
        default: null
      - name: status
        type: enum
        source: system
        description: "Application lifecycle state (§1.2 FundingApplication.status)."
        default: SUBMITTED
        constraints: "one of SUBMITTED | AWARDED | DENIED | WITHDRAWN"
      - name: decided_by_user_id
        type: string
        source: system
        description: "X-User-ID of the StateRegulator who decided the application (opaque operator id)."
        default: null
      - name: decision_note
        type: string
        source: system
        description: "Regulator decision note."
        default: null
      - name: withdraw_reason
        type: string
        source: system
        description: "Reason recorded when the utility withdraws the application or the award."
        default: null

  # ---------------------------------------------------------------------------
  - name: CostRecoveryClaim
    parent: null
    common_fields: true
    entity_kind: resource
    fields:
      - name: entry_point_id
        type: string
        source: input
        description: "FK -> EntryPoint.id; the contaminated entry point under source-water investigation."
      - name: capital_project_id
        type: string
        source: input
        description: "FK -> CapitalProject.id; the project whose local share a recovery may offset."
      - name: responsible_party_name
        type: string
        source: input
        description: "Potentially responsible party identified by the source-water investigation."
        constraints: "1..120 chars"
      - name: investigation_basis
        type: enum
        source: input
        description: "Evidentiary basis linking the party to the entry point."
        constraints: "one of UPSTREAM_DISCHARGER | AFFF_TRAINING_SITE | LANDFILL_LEACHATE | MANUFACTURING_SITE"
      - name: allocation_pct
        type: number
        source: input
        description: "Share of the contamination attributed to this party."
        constraints: "1.00 .. 100.00; 2 decimal places"
      - name: investigation_cost_cents
        type: integer
        source: input
        description: "Utility spend on the source-water investigation; first bucket of the recovery waterfall."
        constraints: ">= 0"
      - name: claim_basis_cents
        type: integer
        source: computed
        description: "round_half_up((CapitalProject.capital_cost_cents + investigation_cost_cents) * allocation_pct / 100); informational claim ceiling guidance."
      - name: claimed_cents
        type: integer
        source: system
        description: "Amount formally claimed when the claim is filed."
        default: null
      - name: recovered_cents
        type: integer
        source: system
        description: "Amount actually recovered at settlement; may not exceed claimed_cents."
        default: null
      - name: alloc_investigation_cents
        type: integer
        source: computed
        description: "Waterfall bucket 1 of calculations.cost_recovery_allocation."
        default: null
      - name: alloc_capital_cents
        type: integer
        source: computed
        description: "Waterfall bucket 2; the only bucket that reduces CapitalProject.local_share_cents."
        default: null
      - name: alloc_om_reserve_cents
        type: integer
        source: computed
        description: "Waterfall bucket 3."
        default: null
      - name: alloc_rate_stabilization_cents
        type: integer
        source: computed
        description: "Waterfall bucket 4; absorbs the remainder so the four buckets always sum to recovered_cents."
        default: null
      - name: status
        type: enum
        source: system
        description: "Claim lifecycle state (§1.2 CostRecoveryClaim.status)."
        default: INVESTIGATING
        constraints: "one of INVESTIGATING | CLAIM_FILED | SETTLED | DISMISSED"
      - name: filed_at
        type: datetime
        source: system
        description: "Instant the claim was filed."
        default: null
      - name: settled_at
        type: datetime
        source: system
        description: "Instant the claim was resolved."
        default: null
      - name: resolution_note
        type: string
        source: system
        description: "Note captured with the settlement or dismissal."
        default: null

# =============================================================================
# §1.2 State Machines
# =============================================================================

state_machines:

  # ---------------------------------------------------------------------------
  - entity: EntryPoint
    state_field: monitoring_status
    dimension: monitoring_frequency
    initial_state: INITIAL
    states: [INITIAL, QUARTERLY, REDUCTION_PENDING, ANNUAL, TRIENNIAL, SUSPENDED]
    terminal_states: []
    shape_note: "CYCLIC — QUARTERLY -> REDUCTION_PENDING -> QUARTERLY on a denied or auto-denied reduction request."
    transitions:
      - from: INITIAL
        to: QUARTERLY
        trigger: "accepted_result_count transitions 0 -> 1 (cascade side effect of POST /lab-results/{id}/review with action ACCEPT)"
        preconditions:
          - "EntryPoint.monitoring_status == INITIAL"
        side_effects:
          - "No other field changes; initial monitoring is considered under way once the first result is accepted"
      - from: QUARTERLY
        to: REDUCTION_PENDING
        trigger: "POST /entry-points/{id}/monitoring-reduction-requests"
        preconditions:
          - "monitoring_status == QUARTERLY else ERR_MONITORING_STATE_INVALID"
          - "compliance_posture != VIOLATION_PENDING else ERR_VIOLATION_PENDING_BLOCKS_REDUCTION"
          - "open_violation_count == 0 else ERR_OPEN_VIOLATION_BLOCKS_REDUCTION"
          - "consecutive_qualifying_quarters >= REDUCTION_MIN_QUARTERS_ANNUAL else ERR_INSUFFICIENT_MONITORING_HISTORY"
          - "when target_status == TRIENNIAL: consecutive_qualifying_quarters >= REDUCTION_MIN_QUARTERS_TRIENNIAL else ERR_TRIENNIAL_HISTORY_INSUFFICIENT"
        side_effects:
          - "requested_monitoring_status = body.target_status"
      - from: REDUCTION_PENDING
        to: "requested_monitoring_status (ANNUAL or TRIENNIAL)"
        trigger: "POST /entry-points/{id}/monitoring-reduction-decisions with approve = true"
        preconditions:
          - "monitoring_status == REDUCTION_PENDING else ERR_MONITORING_STATE_INVALID"
          - "compliance_posture != VIOLATION_PENDING else ERR_VIOLATION_PENDING_BLOCKS_REDUCTION"
        side_effects:
          - "monitoring_status = requested_monitoring_status"
          - "requested_monitoring_status = null"
      - from: REDUCTION_PENDING
        to: QUARTERLY
        trigger: "POST /entry-points/{id}/monitoring-reduction-decisions with approve = false"
        preconditions:
          - "monitoring_status == REDUCTION_PENDING else ERR_MONITORING_STATE_INVALID"
        side_effects:
          - "requested_monitoring_status = null (the cycle returns the entry point to quarterly monitoring)"
      - from: REDUCTION_PENDING
        to: QUARTERLY
        trigger: "cascade — a newly accepted result drives compliance_posture to VIOLATION_PENDING while a reduction request is pending (auto-deny)"
        preconditions:
          - "monitoring_status == REDUCTION_PENDING"
          - "compliance_posture becomes VIOLATION_PENDING in the same request"
        side_effects:
          - "requested_monitoring_status = null"
      - from: ANNUAL
        to: QUARTERLY
        trigger: "cascade — compliance_posture becomes VIOLATION_PENDING or TRIGGERED (reduced monitoring is revoked)"
        preconditions:
          - "monitoring_status in [ANNUAL, TRIENNIAL]"
        side_effects:
          - "consecutive_qualifying_quarters is left untouched (history is not erased, only the frequency is restored)"
      - from: TRIENNIAL
        to: QUARTERLY
        trigger: "cascade — compliance_posture becomes VIOLATION_PENDING or TRIGGERED (reduced monitoring is revoked)"
        preconditions:
          - "monitoring_status in [ANNUAL, TRIENNIAL]"
        side_effects:
          - "consecutive_qualifying_quarters is left untouched"
      - from: "any state"
        to: SUSPENDED
        trigger: "POST /entry-points/{id}/monitoring-status with action SUSPEND, or cascade when consecutive_invalidated_samples reaches SUSPENSION_INVALIDATION_STREAK"
        preconditions:
          - "monitoring_status != SUSPENDED else ERR_MONITORING_STATE_INVALID"
        side_effects:
          - "requested_monitoring_status = null"
          - "New Sample collection at this entry point is refused with ERR_MONITORING_SUSPENDED"
      - from: SUSPENDED
        to: QUARTERLY
        trigger: "POST /entry-points/{id}/monitoring-status with action RESUME"
        preconditions:
          - "monitoring_status == SUSPENDED else ERR_MONITORING_STATE_INVALID"
        side_effects:
          - "consecutive_invalidated_samples = 0"

  # ---------------------------------------------------------------------------
  - entity: EntryPoint
    state_field: compliance_posture
    dimension: compliance_posture
    initial_state: COMPLIANT
    states: [COMPLIANT, TRIGGERED, VIOLATION_PENDING]
    terminal_states: []
    shape_note: >-
      COMPOUND — never set by a request body. Re-derived from max_compliance_ratio (and hazard_index)
      by calculations.compliance_posture_derivation after every write that can change the set of
      ACCEPTED results: result acceptance, result rejection, sample invalidation, sample reinstatement.
    transitions:
      - from: COMPLIANT
        to: TRIGGERED
        trigger: "re-derivation after an LRAA-affecting write when max_compliance_ratio >= POSTURE_TRIGGER_RATIO and <= 1.0"
        preconditions:
          - "accepted_result_count >= 1"
        side_effects:
          - "monitoring_status returns to QUARTERLY when it was ANNUAL or TRIENNIAL"
      - from: COMPLIANT
        to: VIOLATION_PENDING
        trigger: "re-derivation when max_compliance_ratio > 1.0 or hazard_index > HAZARD_INDEX_MCL"
        preconditions:
          - "accepted_result_count >= 1"
        side_effects:
          - "A mandated TreatmentEvaluation is auto-created when none is open for this entry point"
          - "A pending monitoring reduction is auto-denied"
      - from: TRIGGERED
        to: VIOLATION_PENDING
        trigger: "re-derivation when max_compliance_ratio > 1.0 or hazard_index > HAZARD_INDEX_MCL"
        preconditions: []
        side_effects:
          - "A mandated TreatmentEvaluation is auto-created when none is open for this entry point"
      - from: VIOLATION_PENDING
        to: TRIGGERED
        trigger: "re-derivation after a compensating write (sample invalidation or result rejection) leaves POSTURE_TRIGGER_RATIO <= max_compliance_ratio <= 1.0"
        preconditions: []
        side_effects:
          - "Existing TreatmentEvaluation rows are left untouched — de-escalation never retracts a mandated evaluation"
      - from: TRIGGERED
        to: COMPLIANT
        trigger: "re-derivation after a compensating write leaves max_compliance_ratio < POSTURE_TRIGGER_RATIO"
        preconditions: []
        side_effects: []
      - from: VIOLATION_PENDING
        to: COMPLIANT
        trigger: "re-derivation after every ACCEPTED result at the entry point is superseded or rejected (accepted_result_count reaches 0)"
        preconditions: []
        side_effects:
          - "max_compliance_ratio = 0.0, hazard_index = 0.0"

  # ---------------------------------------------------------------------------
  - entity: Sample
    state_field: status
    initial_state: COLLECTED
    states: [COLLECTED, IN_TRANSIT, RECEIVED, ANALYZED, INVALIDATED]
    terminal_states: []
    shape_note: >-
      BRANCHING at receipt (one trigger, two destinations chosen by the custody and field-blank
      evidence in the body) and CYCLIC through invalidate/reinstate, which restores
      status_before_invalidation rather than a fixed state.
    transitions:
      - from: COLLECTED
        to: IN_TRANSIT
        trigger: "POST /samples/{id}/ship"
        preconditions:
          - "status == COLLECTED else ERR_SAMPLE_STATE_INVALID"
          - "body.laboratory_id resolves to a Laboratory else ERR_LABORATORY_NOT_FOUND"
          - "shipped_at >= collected_at else ERR_SHIP_BEFORE_COLLECTION"
        side_effects:
          - "assigned_laboratory_id = body.laboratory_id"
          - "shipped_at = logical clock"
      - from: IN_TRANSIT
        to: RECEIVED
        trigger: "POST /samples/{id}/receive with chain_of_custody_intact = true and field_blank_result_ng_per_l < FIELD_BLANK_LIMIT_NG_PER_L"
        preconditions:
          - "status == IN_TRANSIT else ERR_SAMPLE_STATE_INVALID"
          - "X-User-ID == assigned_laboratory_id else ERR_LABORATORY_ASSIGNMENT_MISMATCH"
        side_effects:
          - "received_at = logical clock, chain_of_custody_intact = true, field_blank_result_ng_per_l stored"
          - "EntryPoint.consecutive_invalidated_samples = 0"
      - from: IN_TRANSIT
        to: INVALIDATED
        trigger: "POST /samples/{id}/receive with chain_of_custody_intact = false or field_blank_result_ng_per_l >= FIELD_BLANK_LIMIT_NG_PER_L"
        preconditions:
          - "status == IN_TRANSIT else ERR_SAMPLE_STATE_INVALID"
          - "X-User-ID == assigned_laboratory_id else ERR_LABORATORY_ASSIGNMENT_MISMATCH"
        side_effects:
          - "invalidation_reason = CHAIN_OF_CUSTODY_BROKEN when custody failed, otherwise FIELD_BLANK_CONTAMINATED (custody wins when both are true)"
          - "status_before_invalidation = null (the sample never reached RECEIVED)"
          - "EntryPoint.consecutive_invalidated_samples += 1; at SUSPENSION_INVALIDATION_STREAK the entry point's monitoring_status becomes SUSPENDED"
      - from: RECEIVED
        to: ANALYZED
        trigger: "cascade — POST /lab-results/{id}/review with action ACCEPT accepts the final outstanding contaminant in panel_contaminant_ids"
        preconditions:
          - "every id in panel_contaminant_ids has exactly one LabResult with status ACCEPTED"
        side_effects:
          - "EntryPoint LRAA, max_compliance_ratio, hazard_index and compliance_posture are re-derived"
      - from: RECEIVED
        to: INVALIDATED
        trigger: "POST /samples/{id}/invalidate"
        preconditions:
          - "status in [RECEIVED, ANALYZED] else ERR_SAMPLE_STATE_INVALID"
        side_effects:
          - "status_before_invalidation = RECEIVED, invalidation_reason = body.invalidation_reason"
          - "Every LabResult of this sample with status SUBMITTED becomes REJECTED with reject_reason_code QC_FAILURE"
          - "EntryPoint.consecutive_invalidated_samples += 1"
      - from: ANALYZED
        to: INVALIDATED
        trigger: "POST /samples/{id}/invalidate"
        preconditions:
          - "status in [RECEIVED, ANALYZED] else ERR_SAMPLE_STATE_INVALID"
        side_effects:
          - "status_before_invalidation = ANALYZED, invalidation_reason = body.invalidation_reason"
          - "Every LabResult of this sample with status ACCEPTED becomes SUPERSEDED (cascade depth 2)"
          - "EntryPoint.accepted_result_count decreases by the number of superseded results; LRAA, max_compliance_ratio, hazard_index and compliance_posture are re-derived (cascade depth 3)"
          - "EntryPoint.consecutive_invalidated_samples += 1"
      - from: INVALIDATED
        to: "status_before_invalidation (RECEIVED or ANALYZED)"
        trigger: "POST /samples/{id}/reinstate"
        preconditions:
          - "status == INVALIDATED else ERR_SAMPLE_STATE_INVALID"
          - "invalidation_reason == OPERATOR_ERROR else ERR_INVALIDATION_NOT_REVERSIBLE"
          - "status_before_invalidation != null else ERR_INVALIDATION_NOT_REVERSIBLE"
        side_effects:
          - "invalidation_reason = null, status_before_invalidation = null"
          - "Every LabResult of this sample with status SUPERSEDED returns to ACCEPTED"
          - "EntryPoint.accepted_result_count, LRAA, max_compliance_ratio, hazard_index and compliance_posture are re-derived; consecutive_invalidated_samples -= 1 (floor 0)"

  # ---------------------------------------------------------------------------
  - entity: LabResult
    state_field: status
    initial_state: SUBMITTED
    states: [SUBMITTED, ACCEPTED, REJECTED, SUPERSEDED]
    terminal_states: [REJECTED]
    shape_note: "BRANCHING at review (accept vs reject on one trigger) and CYCLIC between ACCEPTED and SUPERSEDED, driven only by sample invalidation and reinstatement."
    transitions:
      - from: SUBMITTED
        to: ACCEPTED
        trigger: "POST /lab-results/{id}/review with action ACCEPT"
        preconditions:
          - "status == SUBMITTED else ERR_RESULT_STATE_INVALID"
          - "Sample.status == RECEIVED else ERR_SAMPLE_NOT_RECEIVED"
          - "no other LabResult for the same (Sample.entry_point_id, contaminant_id, Sample.monitoring_period) already has status ACCEPTED else ERR_DUPLICATE_PERIOD_RESULT"
        side_effects:
          - "EntryPoint.accepted_result_count += 1; monitoring_status INITIAL -> QUARTERLY on the first accepted result"
          - "EntryPoint LRAA per contaminant, max_compliance_ratio, hazard_index, consecutive_qualifying_quarters and compliance_posture re-derived (cascade depth 2)"
          - "Sample becomes ANALYZED when the whole panel is now accepted (cascade depth 2)"
          - "A mandated TreatmentEvaluation is auto-created when compliance_posture becomes VIOLATION_PENDING and no evaluation is open (cascade depth 3)"
          - "A pending monitoring reduction is auto-denied when compliance_posture becomes VIOLATION_PENDING (cascade depth 3)"
      - from: SUBMITTED
        to: REJECTED
        trigger: "POST /lab-results/{id}/review with action REJECT"
        preconditions:
          - "status == SUBMITTED else ERR_RESULT_STATE_INVALID"
          - "body.reject_reason_code is present else ERR_INVALID_REQUEST"
        side_effects:
          - "reject_reason_code and review_note stored; no EntryPoint field changes"
      - from: SUBMITTED
        to: REJECTED
        trigger: "cascade — POST /samples/{id}/invalidate on the parent sample"
        preconditions:
          - "status == SUBMITTED"
        side_effects:
          - "reject_reason_code = QC_FAILURE"
      - from: ACCEPTED
        to: SUPERSEDED
        trigger: "cascade — POST /samples/{id}/invalidate on the parent sample"
        preconditions:
          - "status == ACCEPTED"
        side_effects:
          - "The result leaves every LRAA input set; EntryPoint derived fields are recomputed"
      - from: SUPERSEDED
        to: ACCEPTED
        trigger: "cascade — POST /samples/{id}/reinstate on the parent sample"
        preconditions:
          - "status == SUPERSEDED"
        side_effects:
          - "The result re-enters the LRAA input sets; EntryPoint derived fields are recomputed"

  # ---------------------------------------------------------------------------
  - entity: ComplianceDetermination
    state_field: status
    initial_state: DRAFT
    states: [DRAFT, ISSUED, RESCINDED]
    terminal_states: [RESCINDED]
    transitions:
      - from: DRAFT
        to: ISSUED
        trigger: "POST /compliance-determinations/{id}/issue"
        preconditions:
          - "status == DRAFT else ERR_DETERMINATION_STATE_INVALID"
          - "quarters_used >= 1 else ERR_NO_QUALIFYING_RESULTS"
        side_effects:
          - "issued_at = logical clock"
          - "EntryPoint.open_violation_count += 1 when determination == MCL_VIOLATION"
          - "A PublicNotification is auto-created in DRAFT when determination is MCL_VIOLATION or MONITORING_VIOLATION, with tier and required_by_at from calculations.notification_tier_and_deadline; no notification is created for NO_VIOLATION or TRIGGER_EXCEEDED"
      - from: ISSUED
        to: RESCINDED
        trigger: "POST /compliance-determinations/{id}/rescind"
        preconditions:
          - "status == ISSUED else ERR_DETERMINATION_STATE_INVALID"
          - "body.rescind_reason is present else ERR_INVALID_REQUEST"
        side_effects:
          - "EntryPoint.open_violation_count -= 1 when determination == MCL_VIOLATION (floor 0)"
          - "The linked PublicNotification becomes VOIDED when its status is not DISTRIBUTED or LATE_DISTRIBUTED; an already distributed notification is left untouched (conditional cascade)"

  # ---------------------------------------------------------------------------
  - entity: PublicNotification
    state_field: status
    initial_state: DRAFT
    states: [DRAFT, SUBMITTED, APPROVED, DISTRIBUTED, LATE_DISTRIBUTED, VOIDED]
    terminal_states: [DISTRIBUTED, LATE_DISTRIBUTED, VOIDED]
    shape_note: >-
      CYCLIC — SUBMITTED -> DRAFT on a rejected review, bounded by MAX_NOTIFICATION_REVISIONS —
      and BRANCHING at certification, where the logical clock alone decides between DISTRIBUTED and
      LATE_DISTRIBUTED and the two destinations carry different side-effect sets.
    transitions:
      - from: DRAFT
        to: SUBMITTED
        trigger: "POST /public-notifications/{id}/submit"
        preconditions:
          - "status == DRAFT else ERR_NOTIFICATION_STATE_INVALID"
          - "revision_count <= MAX_NOTIFICATION_REVISIONS else ERR_NOTIFICATION_REVISION_LIMIT"
          - "body.content_elements contains every element of MANDATORY_CONTENT_ELEMENTS else ERR_NOTIFICATION_CONTENT_INCOMPLETE"
          - "body.delivery_methods contains every method of REQUIRED_DELIVERY_METHODS_BY_TIER[tier] else ERR_DELIVERY_METHOD_INSUFFICIENT"
        side_effects:
          - "content_elements and delivery_methods stored; drafted_by_user_id = X-User-ID"
      - from: SUBMITTED
        to: APPROVED
        trigger: "POST /public-notifications/{id}/review with approve = true"
        preconditions:
          - "status == SUBMITTED else ERR_NOTIFICATION_STATE_INVALID"
        side_effects:
          - "review_note stored"
      - from: SUBMITTED
        to: DRAFT
        trigger: "POST /public-notifications/{id}/review with approve = false"
        preconditions:
          - "status == SUBMITTED else ERR_NOTIFICATION_STATE_INVALID"
          - "body.review_note is present else ERR_INVALID_REQUEST"
        side_effects:
          - "revision_count += 1"
          - "content_elements = [] and delivery_methods = [] (the draft must be rebuilt)"
      - from: APPROVED
        to: DISTRIBUTED
        trigger: "POST /public-notifications/{id}/certify-distribution while the logical clock is at or before required_by_at"
        preconditions:
          - "status == APPROVED else ERR_NOTIFICATION_STATE_INVALID"
          - "X-User-ID != drafted_by_user_id else ERR_SEGREGATION_OF_DUTIES"
          - "body.delivery_evidence_ref is present else ERR_INVALID_REQUEST"
        side_effects:
          - "distributed_at = logical clock, certified_by_user_id = X-User-ID, late_by_hours = 0"
      - from: APPROVED
        to: LATE_DISTRIBUTED
        trigger: "POST /public-notifications/{id}/certify-distribution while the logical clock is strictly after required_by_at"
        preconditions:
          - "status == APPROVED else ERR_NOTIFICATION_STATE_INVALID"
          - "X-User-ID != drafted_by_user_id else ERR_SEGREGATION_OF_DUTIES"
          - "body.delivery_evidence_ref is present else ERR_INVALID_REQUEST"
        side_effects:
          - "distributed_at = logical clock, certified_by_user_id = X-User-ID"
          - "late_by_hours = ceil((distributed_at - required_by_at) in hours), always >= 1 on this branch"
      - from: DRAFT
        to: VOIDED
        trigger: "cascade — POST /compliance-determinations/{id}/rescind on the parent determination"
        preconditions:
          - "status in [DRAFT, SUBMITTED, APPROVED]"
        side_effects: []
      - from: SUBMITTED
        to: VOIDED
        trigger: "cascade — POST /compliance-determinations/{id}/rescind on the parent determination"
        preconditions:
          - "status in [DRAFT, SUBMITTED, APPROVED]"
        side_effects: []
      - from: APPROVED
        to: VOIDED
        trigger: "cascade — POST /compliance-determinations/{id}/rescind on the parent determination"
        preconditions:
          - "status in [DRAFT, SUBMITTED, APPROVED]"
        side_effects: []

  # ---------------------------------------------------------------------------
  - entity: TreatmentEvaluation
    state_field: status
    initial_state: SCREENING
    states: [SCREENING, PILOTING, SELECTED, REJECTED_ALL]
    terminal_states: [SELECTED, REJECTED_ALL]
    shape_note: >-
      FORK-JOIN — SCREENING forks into one PilotTest per candidate technology; the join at
      POST /treatment-evaluations/{id}/decision requires at least MIN_COMPLETED_PILOTS completed
      branches and then runs divergent side effects per winning technology.
    transitions:
      - from: SCREENING
        to: PILOTING
        trigger: "cascade — POST /pilot-tests creates the first pilot for this evaluation"
        preconditions:
          - "status == SCREENING"
        side_effects:
          - "EntryPoint.treatment_status = PILOT"
      - from: PILOTING
        to: SELECTED
        trigger: "POST /treatment-evaluations/{id}/decision with action SELECT"
        preconditions:
          - "status == PILOTING else ERR_EVALUATION_STATE_INVALID"
          - "count of COMPLETED pilots >= MIN_COMPLETED_PILOTS else ERR_INSUFFICIENT_PILOT_EVIDENCE"
          - "at least one COMPLETED pilot has removal_pct >= MIN_REMOVAL_PCT else ERR_NO_QUALIFYING_TECHNOLOGY"
        side_effects:
          - "selected_technology = technology of the pilot chosen by calculations.technology_selection; that pilot's selected flag becomes true"
          - "A CapitalProject is created (construction_status PLANNED, funding_status NOT_APPLIED) seeded from the winning pilot's capital_cost_estimate_cents and annual_om_estimate_cents and from the entry point's rate base"
          - "GAC branch: CapitalProject.required_disposal_method = REACTIVATION, concentrate_permit_required = false"
          - "IX branch: CapitalProject.required_disposal_method = INCINERATION_1100C, concentrate_permit_required = false"
          - "RO branch: CapitalProject.required_disposal_method = DEEP_WELL, concentrate_permit_required = true"
          - "The full rate-impact ladder of calculations.rate_impact_analysis is evaluated on the new project"
      - from: PILOTING
        to: REJECTED_ALL
        trigger: "POST /treatment-evaluations/{id}/decision with action ABANDON"
        preconditions:
          - "status == PILOTING else ERR_EVALUATION_STATE_INVALID"
          - "count of COMPLETED pilots >= MIN_COMPLETED_PILOTS else ERR_INSUFFICIENT_PILOT_EVIDENCE"
          - "body.decision_note is present else ERR_INVALID_REQUEST"
        side_effects:
          - "No CapitalProject is created; EntryPoint.treatment_status returns to NONE"

  # ---------------------------------------------------------------------------
  - entity: PilotTest
    state_field: status
    initial_state: PLANNED
    states: [PLANNED, RUNNING, COMPLETED]
    terminal_states: [COMPLETED]
    transitions:
      - from: PLANNED
        to: RUNNING
        trigger: "POST /pilot-tests/{id}/start"
        preconditions:
          - "status == PLANNED else ERR_PILOT_STATE_INVALID"
          - "logical clock >= window_start_at else ERR_PILOT_WINDOW_NOT_STARTED"
        side_effects: []
      - from: RUNNING
        to: COMPLETED
        trigger: "POST /pilot-tests/{id}/complete"
        preconditions:
          - "status == RUNNING else ERR_PILOT_STATE_INVALID"
          - "body.effluent_ng_per_l <= body.influent_ng_per_l else ERR_EFFLUENT_EXCEEDS_INFLUENT"
        side_effects:
          - "influent_ng_per_l, effluent_ng_per_l, bed_volumes_treated and spent_media_kg stored"
          - "unmanifested_media_kg = spent_media_kg (the conserved mass enters the residuals ledger)"
          - "removal_pct, lifecycle_cost_score and technology_score computed"

  # ---------------------------------------------------------------------------
  - entity: ResidualsManifest
    state_field: status
    initial_state: DRAFT
    states: [DRAFT, CLASSIFIED, SHIPPED, VOIDED]
    terminal_states: [SHIPPED, VOIDED]
    transitions:
      - from: DRAFT
        to: CLASSIFIED
        trigger: "POST /residuals-manifests/{id}/classify"
        preconditions:
          - "status == DRAFT else ERR_MANIFEST_STATE_INVALID"
          - "body.leachate_pfas_ng_per_l >= 0 else ERR_INVALID_REQUEST"
        side_effects:
          - "leachate_pfas_ng_per_l stored, waste_classification set by calculations.waste_classification, classified_by_user_id = X-User-ID"
      - from: CLASSIFIED
        to: SHIPPED
        trigger: "POST /residuals-manifests/{id}/ship"
        preconditions:
          - "status == CLASSIFIED else ERR_MANIFEST_STATE_INVALID"
          - "body.disposal_method is permitted for waste_classification else ERR_DISPOSAL_METHOD_PROHIBITED"
          - "TreatmentEvaluation.residuals_spent_cents + disposal_cost_cents <= TreatmentEvaluation.residuals_budget_cents else ERR_RESIDUALS_BUDGET_EXCEEDED"
        side_effects:
          - "disposal_method and carrier_ref stored; disposal_cost_cents computed"
          - "TreatmentEvaluation.residuals_spent_cents += disposal_cost_cents"
      - from: DRAFT
        to: VOIDED
        trigger: "POST /residuals-manifests/{id}/void"
        preconditions:
          - "status in [DRAFT, CLASSIFIED] else ERR_MANIFEST_STATE_INVALID"
          - "body.void_reason_code is present else ERR_INVALID_REQUEST"
        side_effects:
          - "PilotTest.unmanifested_media_kg += mass_kg (the residuals mass invariant is restored exactly)"
      - from: CLASSIFIED
        to: VOIDED
        trigger: "POST /residuals-manifests/{id}/void"
        preconditions:
          - "status in [DRAFT, CLASSIFIED] else ERR_MANIFEST_STATE_INVALID"
          - "body.void_reason_code is present else ERR_INVALID_REQUEST"
        side_effects:
          - "PilotTest.unmanifested_media_kg += mass_kg"
          - "waste_classification and leachate_pfas_ng_per_l are retained as evidence"

  # ---------------------------------------------------------------------------
  - entity: CapitalProject
    state_field: funding_status
    dimension: funding
    initial_state: NOT_APPLIED
    states: [NOT_APPLIED, APPLIED, AWARDED, DENIED]
    terminal_states: []
    shape_note: >-
      PARALLEL dimension 1 of 2 — derived purely from this project's FundingApplication rows and
      completely independent of construction_status: AWARDED when any application is AWARDED,
      else APPLIED when any is SUBMITTED, else DENIED when at least one exists and all are DENIED or
      WITHDRAWN, else NOT_APPLIED.
    transitions:
      - from: NOT_APPLIED
        to: APPLIED
        trigger: "cascade — POST /capital-projects/{id}/funding-applications"
        preconditions: []
        side_effects: []
      - from: APPLIED
        to: AWARDED
        trigger: "cascade — POST /funding-applications/{id}/decision with action AWARD"
        preconditions: []
        side_effects:
          - "funding_awarded_cents, grant_equivalent_cents, loan_principal_cents, local_share_cents, borrowed_cents and the whole rate-impact ladder are recomputed"
      - from: APPLIED
        to: DENIED
        trigger: "cascade — POST /funding-applications/{id}/decision with action DENY leaves no SUBMITTED or AWARDED application"
        preconditions: []
        side_effects: []
      - from: AWARDED
        to: DENIED
        trigger: "cascade — POST /funding-applications/{id}/withdraw removes the last award and no SUBMITTED application remains"
        preconditions: []
        side_effects:
          - "funding_awarded_cents, grant_equivalent_cents and loan_principal_cents return to their pre-award values and the rate-impact ladder is recomputed to its pre-award numbers"
      - from: DENIED
        to: APPLIED
        trigger: "cascade — POST /capital-projects/{id}/funding-applications creates a fresh application after a denial"
        preconditions: []
        side_effects: []

  # ---------------------------------------------------------------------------
  - entity: CapitalProject
    state_field: construction_status
    dimension: construction
    initial_state: PLANNED
    states: [PLANNED, BIDDING, CONSTRUCTION, IN_SERVICE]
    terminal_states: [IN_SERVICE]
    shape_note: "PARALLEL dimension 2 of 2 — advances on its own trigger and never reads funding_status except at the BIDDING gate."
    transitions:
      - from: PLANNED
        to: BIDDING
        trigger: "POST /capital-projects/{id}/construction-status with target BIDDING"
        preconditions:
          - "construction_status == PLANNED else ERR_PROJECT_STATE_INVALID"
          - "funding_status == AWARDED else ERR_FUNDING_NOT_SECURED"
          - "concentrate_permit_required is false or body.concentrate_permit_ref is present else ERR_CONCENTRATE_PERMIT_REQUIRED"
        side_effects: []
      - from: BIDDING
        to: CONSTRUCTION
        trigger: "POST /capital-projects/{id}/construction-status with target CONSTRUCTION"
        preconditions:
          - "construction_status == BIDDING else ERR_PROJECT_STATE_INVALID"
        side_effects: []
      - from: CONSTRUCTION
        to: IN_SERVICE
        trigger: "POST /capital-projects/{id}/construction-status with target IN_SERVICE"
        preconditions:
          - "construction_status == CONSTRUCTION else ERR_PROJECT_STATE_INVALID"
        side_effects:
          - "EntryPoint.treatment_status = INSTALLED"
          - "capital_cost_cents and annual_om_cost_cents become immutable — PATCH /capital-projects/{id} is refused with ERR_PROJECT_IN_SERVICE"

  # ---------------------------------------------------------------------------
  - entity: FundingApplication
    state_field: status
    initial_state: SUBMITTED
    states: [SUBMITTED, AWARDED, DENIED, WITHDRAWN]
    terminal_states: [DENIED, WITHDRAWN]
    transitions:
      - from: SUBMITTED
        to: AWARDED
        trigger: "POST /funding-applications/{id}/decision with action AWARD"
        preconditions:
          - "status == SUBMITTED else ERR_APPLICATION_STATE_INVALID"
          - "body.awarded_cents <= amount_requested_cents else ERR_AWARD_EXCEEDS_REQUEST"
          - "funding_awarded_cents of the project + body.awarded_cents <= CapitalProject.capital_cost_cents else ERR_AWARD_EXCEEDS_PROJECT_COST"
        side_effects:
          - "awarded_cents stored, forgiven_cents computed, decided_by_user_id = X-User-ID"
          - "CapitalProject funding ledger and rate-impact ladder recomputed (cascade depth 2)"
      - from: SUBMITTED
        to: DENIED
        trigger: "POST /funding-applications/{id}/decision with action DENY"
        preconditions:
          - "status == SUBMITTED else ERR_APPLICATION_STATE_INVALID"
          - "body.decision_note is present else ERR_INVALID_REQUEST"
        side_effects:
          - "CapitalProject.funding_status re-derived; no money moves"
      - from: SUBMITTED
        to: WITHDRAWN
        trigger: "POST /funding-applications/{id}/withdraw"
        preconditions:
          - "status in [SUBMITTED, AWARDED] else ERR_APPLICATION_STATE_INVALID"
          - "CapitalProject.construction_status == PLANNED else ERR_PROJECT_STATE_INVALID"
        side_effects:
          - "withdraw_reason stored"
      - from: AWARDED
        to: WITHDRAWN
        trigger: "POST /funding-applications/{id}/withdraw"
        preconditions:
          - "status in [SUBMITTED, AWARDED] else ERR_APPLICATION_STATE_INVALID"
          - "CapitalProject.construction_status == PLANNED else ERR_PROJECT_STATE_INVALID"
        side_effects:
          - "awarded_cents = null, forgiven_cents = null"
          - "CapitalProject funding ledger and rate-impact ladder recomputed; the money identity capital_cost_cents == funding_awarded_cents + recovered_cents + local_share_cents holds again with the pre-award numbers (compensating invariant)"

  # ---------------------------------------------------------------------------
  - entity: CostRecoveryClaim
    state_field: status
    initial_state: INVESTIGATING
    states: [INVESTIGATING, CLAIM_FILED, SETTLED, DISMISSED]
    terminal_states: [SETTLED, DISMISSED]
    transitions:
      - from: INVESTIGATING
        to: CLAIM_FILED
        trigger: "POST /cost-recovery-claims/{id}/file"
        preconditions:
          - "status == INVESTIGATING else ERR_CLAIM_STATE_INVALID"
          - "body.claimed_cents > 0 else ERR_INVALID_REQUEST"
        side_effects:
          - "claimed_cents stored, filed_at = logical clock"
      - from: CLAIM_FILED
        to: SETTLED
        trigger: "POST /cost-recovery-claims/{id}/resolve with action SETTLE"
        preconditions:
          - "status == CLAIM_FILED else ERR_CLAIM_STATE_INVALID"
          - "body.recovered_cents <= claimed_cents else ERR_RECOVERY_EXCEEDS_CLAIM"
        side_effects:
          - "recovered_cents stored, settled_at = logical clock, the four allocation buckets of calculations.cost_recovery_allocation are computed and always sum to recovered_cents"
          - "CapitalProject.recovered_cents += alloc_capital_cents; local_share_cents, borrowed_cents and the whole rate-impact ladder are recomputed (cascade depth 3)"
      - from: CLAIM_FILED
        to: DISMISSED
        trigger: "POST /cost-recovery-claims/{id}/resolve with action DISMISS"
        preconditions:
          - "status == CLAIM_FILED else ERR_CLAIM_STATE_INVALID"
          - "body.resolution_note is present else ERR_INVALID_REQUEST"
        side_effects:
          - "recovered_cents = 0 and all four allocation buckets are 0; no CapitalProject field changes"
      - from: INVESTIGATING
        to: DISMISSED
        trigger: "POST /cost-recovery-claims/{id}/resolve with action DISMISS"
        preconditions:
          - "status in [INVESTIGATING, CLAIM_FILED] else ERR_CLAIM_STATE_INVALID"
          - "body.resolution_note is present else ERR_INVALID_REQUEST"
        side_effects:
          - "The investigation closes with no claim on file"

# =============================================================================
# §1.2.1 Concurrency Rules (optimistic concurrency control)
# =============================================================================
# OCC is the ONLY concurrency mechanism in this domain. Every rule below is a
# lost-update guard: a client that read a parent row, then acted on a stale copy,
# is refused deterministically with 412 and must re-read.

concurrency_rules:

  - name: entry-point-determination-supersede
    occ_field: EntryPoint.version
    write_endpoint: "POST /compliance-determinations"
    expected_version_param: expected_entry_point_version
    error_id: ERR_STALE_ENTRY_POINT_VERSION
    http_status: 412
    rationale: >-
      A determination freezes the LRAA, the hazard index and the violation classification of an
      entry point at creation time. Every accepted or superseded result bumps EntryPoint.version, so a
      compliance officer who computed a determination from an older read of the entry point is refused
      rather than allowed to issue a determination against numbers that no longer exist.
    precedence: "Checked after path-resource existence and body-FK resolution and before every state check (priority 10 in §1.4)."

  - name: capital-project-funding-supersede
    occ_field: CapitalProject.version
    write_endpoint: "POST /capital-projects/{id}/funding-applications"
    expected_version_param: expected_capital_project_version
    error_id: ERR_STALE_CAPITAL_PROJECT_VERSION
    http_status: 412
    rationale: >-
      An application's amount is sized against the project's local share. Awards, award withdrawals,
      settled cost recoveries and PATCHes to capital_cost_cents all bump CapitalProject.version, so an
      application built on a stale project read is refused instead of over-subscribing the project.
    precedence: "Checked after path-resource existence and before ERR_AWARD_EXCEEDS_PROJECT_COST style constraint checks (priority 10 in §1.4)."

# =============================================================================
# §1.3 Calculation Rules
# =============================================================================
# All money is integer cents. All arithmetic is decimal with round_half_up at the
# declared precision — never binary float, never bankers rounding. Every rule below
# names its input set, its ordering and its rounding points explicitly; no rule may
# read an id, a UUID or a random value.

global_constants:
  PERSONS_PER_ACCOUNT: 2.5
  KGAL_PER_ACCOUNT_PER_YEAR: 60
  BASE_RATE_CENTS_PER_KGAL: 950
  MONTHS_PER_YEAR: 12
  LRAA_WINDOW_QUARTERS: 4
  POSTURE_TRIGGER_RATIO: 0.5
  HAZARD_INDEX_MCL: 1.00
  HAZARD_TERM_CAP: 4.00
  ACUTE_MULTIPLIER: 4
  ACUTE_MIN_POPULATION: 10000
  FIELD_BLANK_LIMIT_NG_PER_L: 2.00
  SUSPENSION_INVALIDATION_STREAK: 3
  HOLDING_TIME_HOURS_BY_METHOD: { METHOD_533: 336, METHOD_537_1: 336, METHOD_1633: 720 }
  TIER_DEADLINE_HOURS: { TIER_1: 24, TIER_2: 720, TIER_3: 8760 }
  MAX_NOTIFICATION_REVISIONS: 3
  MANDATORY_CONTENT_ELEMENTS:
    - VIOLATION_DESCRIPTION
    - HEALTH_EFFECTS_LANGUAGE
    - POPULATION_AT_RISK
    - CORRECTIVE_ACTION
    - UTILITY_CONTACT
    - ALTERNATE_WATER_GUIDANCE
  REQUIRED_DELIVERY_METHODS_BY_TIER:
    TIER_1: [BROADCAST_MEDIA, POSTING]
    TIER_2: [MAIL, POSTING]
    TIER_3: [ANNUAL_REPORT]
  REDUCTION_MIN_QUARTERS_ANNUAL: 4
  REDUCTION_MIN_QUARTERS_TRIENNIAL: 8
  MIN_COMPLETED_PILOTS: 2
  MIN_REMOVAL_PCT: 90.00
  TECHNOLOGY_WEIGHTS: { removal: 0.35, lifecycle_cost: 0.25, residuals_burden: 0.20, footprint: 0.10, om_complexity: 0.10 }
  LIFECYCLE_COST_DIVISOR_CENTS: 100000000
  ANNUITY_FACTOR_20Y_2PCT: 0.0611567181
  OM_RESERVE_PCT: 25.00
  LEACHATE_HAZARDOUS_NG_PER_L: 500.0
  LEACHATE_SPECIAL_NG_PER_L: 50.0
  DISPOSAL_RATE_CENTS_PER_KG: { LANDFILL: 12, REACTIVATION: 95, INCINERATION_1100C: 340, DEEP_WELL: 210 }
  PERMITTED_DISPOSAL_BY_CLASSIFICATION:
    NON_HAZARDOUS_SOLID: [LANDFILL, REACTIVATION, INCINERATION_1100C, DEEP_WELL]
    SPECIAL_WASTE: [REACTIVATION, INCINERATION_1100C, DEEP_WELL]
    HAZARDOUS: [INCINERATION_1100C, DEEP_WELL]
  MEDIA_TYPE_BY_TECHNOLOGY:
    GAC: [GAC_CARBON]
    IX: [IX_RESIN]
    RO: [RO_MEMBRANE, RO_CONCENTRATE]
  FULL_SCALE_DISPOSAL_BY_TECHNOLOGY: { GAC: REACTIVATION, IX: INCINERATION_1100C, RO: DEEP_WELL }
  PILOT_DECONTAMINATION_BUFFER_HOURS: 48

calculations:

  # ---------------------------------------------------------------------------
  - name: locational_running_annual_average
    algorithm_type: aggregation
    applies_to: "EntryPoint x Contaminant"
    trigger: "Any write that changes the set of ACCEPTED LabResult rows at an entry point: result review, sample invalidation, sample reinstatement."
    input_set: >-
      LabResult rows with status == ACCEPTED whose Sample.entry_point_id is the entry point, whose
      contaminant_id is the contaminant, and whose Sample.status == ANALYZED. Results attached to a
      sample that has not yet completed its whole panel are deliberately excluded until the sample
      reaches ANALYZED.
    ordering: >-
      Group the input set by Sample.monitoring_period, sort the distinct periods DESC by the
      (year, quarter) pair decoded from the YYYYQn label, and keep the first LRAA_WINDOW_QUARTERS
      periods. At most one ACCEPTED result may exist per (entry point, contaminant, period) — this is
      enforced by ERR_DUPLICATE_PERIOD_RESULT at review time, so no in-period tie-break is needed.
    formula: |
      censored          = reported_ng_per_l < detection_limit_ng_per_l
      compliance_value  = 0.00 if censored else reported_ng_per_l
      planning_value    = round_half_up(detection_limit_ng_per_l / 2, 2) if censored else reported_ng_per_l
      quarters_used     = number of periods kept (0..4)
      lraa              = 0.00 when quarters_used == 0
                          else round_half_up(sum(value over kept periods) / quarters_used, 2)
    precision: "2 decimal places, round_half_up. The window average divides by quarters_used, NOT by 4 — three quarters of data average over three."
    variants:
      - name: compliance_lraa
        description: "Regulatory variant. Every non-detect contributes exactly 0.00, so censored quarters drag the average down. This is the only variant compared against the MCL and the trigger level."
        selection_context: "EntryPoint.max_compliance_ratio, EntryPoint.hazard_index, ComplianceDetermination.lraa_ng_per_l, monitoring-reduction qualification."
      - name: planning_lraa
        description: "Capital-planning variant. Every non-detect contributes half its detection limit, so the same data yields a higher average used for sizing treatment."
        selection_context: "ComplianceDetermination.planning_lraa_ng_per_l and the treatment-sizing narrative. Never used for a violation decision."
    worked_example: |
      Four PFOA quarters at EP-01, detection limit 1.80 ng/L throughout:
        2025Q3 reported 3.20 (detect)      2025Q4 reported 1.20 (non-detect)
        2026Q1 reported 5.40 (detect)      2026Q2 reported 1.60 (non-detect)
      compliance values 3.20 / 0.00 / 5.40 / 0.00 -> sum 8.60 -> compliance_lraa = 2.15
      planning  values 3.20 / 0.90 / 5.40 / 0.90 -> sum 10.40 -> planning_lraa   = 2.60
      Same four rows, two different averages: the delta 0.45 is exactly the half-detection-limit
      substitution on the two censored quarters.

  # ---------------------------------------------------------------------------
  - name: compliance_posture_derivation
    algorithm_type: threshold
    applies_to: EntryPoint
    trigger: "Recomputed after every write that changes the ACCEPTED result set at the entry point."
    input_set: "compliance_lraa per contaminant that has at least one ACCEPTED result in the window, together with that contaminant's mcl_ng_per_l; plus the entry point's hazard_index."
    formula: |
      ratio_c              = round_half_up(compliance_lraa_c / mcl_c, 4)   # per contaminant
      max_compliance_ratio = 0.0 when no contaminant qualifies else max(ratio_c)
      compliance_posture   = VIOLATION_PENDING when max_compliance_ratio > 1.0
                                                 or hazard_index > HAZARD_INDEX_MCL
                             TRIGGERED         when POSTURE_TRIGGER_RATIO <= max_compliance_ratio <= 1.0
                             COMPLIANT         otherwise
    precision: "max_compliance_ratio 4 decimal places, round_half_up. Exactly 1.0 is TRIGGERED, not a violation — the MCL comparison is strictly greater."
    constants: { POSTURE_TRIGGER_RATIO: 0.5, HAZARD_INDEX_MCL: 1.00 }
    worked_example: |
      PFOA mcl 4.0 with compliance_lraa 2.15 -> ratio 0.5375 -> TRIGGERED (0.5375 >= 0.5, <= 1.0).
      PFOA mcl 4.0 with compliance_lraa 4.50 -> ratio 1.1250 -> VIOLATION_PENDING.
      PFOA mcl 4.0 with compliance_lraa 4.00 -> ratio 1.0000 -> TRIGGERED (boundary is inclusive of
      compliance, exclusive of violation).

  # ---------------------------------------------------------------------------
  - name: hazard_index
    algorithm_type: weighted_scoring
    applies_to: EntryPoint
    trigger: "Recomputed with compliance_posture_derivation."
    input_set: "Contaminant rows with hazard_index_member == true that have at least one ACCEPTED result at this entry point. A member contaminant with no accepted result contributes nothing (it is absent from the sum, not a zero term with a denominator)."
    combination_mode: >-
      MODE (a) — ACCUMULATE UNROUNDED, ROUND ONCE AT THE END. Each ratio term is computed in exact
      decimal arithmetic and added to the running total at full precision; the single rounding to two
      decimals happens on the final sum. This is deliberately NOT the mode used by technology_score.
    formula: |
      term_c      = min(compliance_lraa_c / hbwc_c, HAZARD_TERM_CAP)     # exact decimal, NOT rounded
      hazard_index = round_half_up(sum(term_c over member contaminants), 2)
    precision: "2 decimal places, round_half_up, applied exactly once to the final sum."
    constants: { HAZARD_TERM_CAP: 4.00 }
    worked_example: |
      Mode-discriminating case — three members, each compliance_lraa 3.35 with hbwc 10.0:
        raw terms 0.335 + 0.335 + 0.335 = 1.005 -> round once -> hazard_index = 1.01
        (rounding each term first would give 0.34 * 3 = 1.02, a different and wrong answer)
      1.01 > HAZARD_INDEX_MCL 1.00, so the mixture is an MCL violation even though every individual
      ratio is 0.335 and no single contaminant is anywhere near its own MCL.

      Censoring case — PFHXS lraa 4.00 (term 0.40), PFNA lraa 6.50 (term 0.65), HFPO_DA reported 2.50
      against detection limit 5.00 so its compliance value is 0.00 (term 0.00):
        hazard_index = 1.05 -> mixture violation with max_compliance_ratio only 0.6500.

  # ---------------------------------------------------------------------------
  - name: violation_determination
    algorithm_type: threshold
    applies_to: ComplianceDetermination
    trigger: "POST /compliance-determinations (values are frozen onto the row at creation)."
    input_set: "compliance_lraa and planning_lraa for (entry_point_id, contaminant_id) over the window ending at period_end; the entry point's hazard_index and population_served; the contaminant's mcl, trigger level and hazard membership."
    formula: |
      individual_violation = lraa_ng_per_l > mcl_ng_per_l
      mixture_violation    = contaminant.hazard_index_member and hazard_index > HAZARD_INDEX_MCL
      determination = MONITORING_VIOLATION when quarters_used < LRAA_WINDOW_QUARTERS
                                             and EntryPoint.monitoring_status == QUARTERLY
                                             and not individual_violation and not mixture_violation
                      MCL_VIOLATION        when individual_violation or mixture_violation
                      TRIGGER_EXCEEDED     when lraa_ng_per_l >= trigger_level_ng_per_l
                      NO_VIOLATION         otherwise
      acute = (lraa_ng_per_l >= ACUTE_MULTIPLIER * mcl_ng_per_l or hazard_index >= HAZARD_TERM_CAP)
              and EntryPoint.population_served >= ACUTE_MIN_POPULATION
      violation_type = ACUTE                   when determination == MCL_VIOLATION and acute
                       NON_ACUTE               when determination == MCL_VIOLATION and not acute
                       MONITORING_AND_REPORTING when determination == MONITORING_VIOLATION
                       NONE                    otherwise
    precision: "No rounding of its own; consumes the already-rounded LRAA and hazard index."
    ordering_note: "The four determination branches are evaluated top to bottom; MCL_VIOLATION outranks TRIGGER_EXCEEDED, and the monitoring branch is only reachable when neither substantive violation applies."
    constants: { ACUTE_MULTIPLIER: 4, ACUTE_MIN_POPULATION: 10000, HAZARD_INDEX_MCL: 1.00, HAZARD_TERM_CAP: 4.00, LRAA_WINDOW_QUARTERS: 4 }
    worked_example: |
      PFOA mcl 4.0, trigger 2.0, four quarters 3.00 / 3.00 / 3.00 / 9.00 -> lraa 4.50:
        individual_violation true -> MCL_VIOLATION; acute needs lraa >= 16.0, so violation_type NON_ACUTE.
      Same entry point with lraa 2.15 -> 2.15 >= 2.0 -> TRIGGER_EXCEEDED, violation_type NONE.

  # ---------------------------------------------------------------------------
  - name: sample_integrity_evaluation
    algorithm_type: threshold
    applies_to: LabResult
    trigger: "POST /lab-results (before the row is created)."
    input_set: "Sample.collected_at, the submitted analyzed_at and method; the laboratory's certified_methods, lowest_achievable_dl_ng_per_l and certification_expires_on; the contaminant's required_mrl_ng_per_l."
    formula: |
      holding_hours = (analyzed_at - Sample.collected_at) in exact hours
      limit_hours   = HOLDING_TIME_HOURS_BY_METHOD[method]
      holding_time_ok = holding_hours <= limit_hours          # exactly at the limit PASSES
      dl_ok           = detection_limit_ng_per_l >= Laboratory.lowest_achievable_dl_ng_per_l
                        and detection_limit_ng_per_l <= Contaminant.required_mrl_ng_per_l
      certification_ok = analyzed_at < Laboratory.certification_expires_on
    precision: "Hour differences are exact decimals; no truncation to whole hours before the comparison."
    constants: { HOLDING_TIME_HOURS_BY_METHOD: { METHOD_533: 336, METHOD_537_1: 336, METHOD_1633: 720 } }
    worked_example: |
      Collected 2026-04-10T08:00:00.000Z, METHOD_533 (336 h = 14 days):
        analyzed 2026-04-24T08:00:00.000Z -> 336.0 h -> accepted (the boundary is inclusive)
        analyzed 2026-04-24T09:00:00.000Z -> 337.0 h -> ERR_HOLDING_TIME_EXCEEDED
      METHOD_1633 on the same collection instant tolerates 720 h, so the identical analyzed_at that
      fails a METHOD_533 submission passes a METHOD_1633 one.

  # ---------------------------------------------------------------------------
  - name: monitoring_frequency_reduction
    algorithm_type: chronological
    applies_to: EntryPoint
    trigger: "Recomputed with compliance_posture_derivation; read by POST /entry-points/{id}/monitoring-reduction-requests."
    input_set: "For every monitoring period that has at least one ACCEPTED result at this entry point, the compliance value of each contaminant analyzed in that period."
    ordering: "Periods sorted DESC by (year, quarter); the streak walks from the most recent period backwards and stops at the first non-qualifying period."
    formula: |
      qualifies(period) = for every contaminant with an ACCEPTED result in that period:
                            compliance_value < contaminant.trigger_level_ng_per_l     # STRICTLY below
      consecutive_qualifying_quarters = length of the qualifying prefix of the DESC period list
    precision: "Integer count. The comparison is strictly less than the trigger level: a value exactly equal to the trigger level does NOT qualify."
    constants: { REDUCTION_MIN_QUARTERS_ANNUAL: 4, REDUCTION_MIN_QUARTERS_TRIENNIAL: 8 }
    worked_example: |
      PFOA trigger 2.0, detection limit 1.80, four quarters oldest to newest:
        2025Q3 reported 2.00 -> compliance value 2.00 -> NOT below 2.0 -> does not qualify
        2025Q4 reported 1.90 -> 1.90 qualifies
        2026Q1 reported 1.20 -> non-detect -> compliance value 0.00 qualifies
        2026Q2 reported 1.85 -> 1.85 qualifies
      DESC walk 2026Q2, 2026Q1, 2025Q4 all qualify then 2025Q3 stops the streak
      -> consecutive_qualifying_quarters = 3, one short of REDUCTION_MIN_QUARTERS_ANNUAL, so the
      reduction request is refused even though the four-quarter lraa is only 1.44 (ratio 0.3600).

  # ---------------------------------------------------------------------------
  - name: notification_tier_and_deadline
    algorithm_type: threshold
    applies_to: PublicNotification
    trigger: "Cascade from POST /compliance-determinations/{id}/issue."
    input_set: "ComplianceDetermination.determination, violation_type and issued_at; Contaminant.notification_tier."
    formula: |
      tier = TIER_1 when violation_type == ACUTE
             TIER_3 when determination == MONITORING_VIOLATION
             Contaminant.notification_tier otherwise            # MCL_VIOLATION, non-acute
      required_by_at = determination.issued_at + TIER_DEADLINE_HOURS[tier] hours
    precision: "required_by_at is an exact instant with three fractional digits; no calendar-day truncation."
    constants: { TIER_DEADLINE_HOURS: { TIER_1: 24, TIER_2: 720, TIER_3: 8760 } }
    worked_example: |
      Non-acute PFOA MCL violation (contaminant notification_tier TIER_2) issued at the default clock
      2026-08-01T00:00:00.000Z -> tier TIER_2, required_by_at 2026-08-31T00:00:00.000Z.
      Certifying distribution at 2026-08-31T00:00:00.000Z is DISTRIBUTED with late_by_hours 0;
      certifying at 2026-08-31T01:00:00.000Z is LATE_DISTRIBUTED with late_by_hours 1.

  # ---------------------------------------------------------------------------
  - name: technology_score
    algorithm_type: weighted_scoring
    applies_to: PilotTest
    trigger: "POST /pilot-tests/{id}/complete."
    input_set: "The pilot's own influent/effluent pair, lifecycle_cost_cents and three operator-scored criteria."
    combination_mode: >-
      MODE (b) — ROUND EACH WEIGHTED TERM TO TWO DECIMALS, THEN SUM THE ROUNDED TERMS. This is
      intentionally the opposite of hazard_index's mode (a): here the rounding happens five times,
      before the accumulation, and the final sum is not rounded again.
    formula: |
      removal_pct          = round_half_up((influent - effluent) / influent * 100, 2)
      lifecycle_cost_score = round_half_up(max(0, 100 - lifecycle_cost_cents / LIFECYCLE_COST_DIVISOR_CENTS), 2)
      term_removal   = round_half_up(removal_pct          * 0.35, 2)
      term_lifecycle = round_half_up(lifecycle_cost_score * 0.25, 2)
      term_residuals = round_half_up(residuals_burden_score * 0.20, 2)
      term_footprint = round_half_up(footprint_score      * 0.10, 2)
      term_om        = round_half_up(om_complexity_score  * 0.10, 2)
      technology_score = term_removal + term_lifecycle + term_residuals + term_footprint + term_om
    precision: "Each term 2 decimal places round_half_up; the sum of rounded terms is reported as-is."
    constants: { TECHNOLOGY_WEIGHTS: { removal: 0.35, lifecycle_cost: 0.25, residuals_burden: 0.20, footprint: 0.10, om_complexity: 0.10 }, LIFECYCLE_COST_DIVISOR_CENTS: 100000000 }
    worked_example: |
      GAC pilot: influent 50.00, effluent 1.85 -> removal_pct 96.30; lifecycle_cost_cents
      2,550,000,000 -> lifecycle_cost_score 74.50; residuals 62.00, footprint 71.00, om 83.00.
        terms 33.71 + 18.63 + 12.40 + 7.10 + 8.30 -> technology_score 80.14
        (summing the unrounded terms would give 80.13 — the mode is observable)
      IX pilot: influent 50.00, effluent 4.00 -> removal 92.00; lifecycle 1,800,000,000 -> 82.00;
      residuals 40.00, footprint 85.00, om 70.00 -> terms 32.20 + 20.50 + 8.00 + 8.50 + 7.00 = 76.20.

  # ---------------------------------------------------------------------------
  - name: technology_selection
    algorithm_type: aggregation
    applies_to: TreatmentEvaluation
    trigger: "POST /treatment-evaluations/{id}/decision with action SELECT."
    input_set: "PilotTest rows of this evaluation with status == COMPLETED and removal_pct >= MIN_REMOVAL_PCT. Pilots below the removal floor are excluded even when their overall score is the highest."
    ordering: >-
      technology_score DESC, then lifecycle_cost_cents ASC, then created_at ASC. Ids and insertion
      order never participate beyond the created_at fallback.
    formula: |
      candidates = completed pilots with removal_pct >= MIN_REMOVAL_PCT
      winner     = first candidate under the ordering above
      selected_technology = winner.technology
    precision: "No arithmetic of its own; empty candidate set raises ERR_NO_QUALIFYING_TECHNOLOGY."
    constants: { MIN_REMOVAL_PCT: 90.00, MIN_COMPLETED_PILOTS: 2 }
    worked_example: |
      GAC 80.14 and IX 76.20 both clear the 90.00 removal floor -> GAC wins on score.
      An RO pilot scoring 91.00 but with removal_pct 88.40 is not a candidate at all, so GAC still wins:
      the eligibility filter runs before the ranking, never after it.

  # ---------------------------------------------------------------------------
  - name: waste_classification
    algorithm_type: threshold
    applies_to: ResidualsManifest
    trigger: "POST /residuals-manifests/{id}/classify, then POST /residuals-manifests/{id}/ship for the cost."
    input_set: "The regulator-recorded leachate_pfas_ng_per_l and, at shipment, mass_kg and disposal_method."
    formula: |
      waste_classification = HAZARDOUS            when leachate_pfas_ng_per_l >= LEACHATE_HAZARDOUS_NG_PER_L
                             SPECIAL_WASTE        when leachate_pfas_ng_per_l >= LEACHATE_SPECIAL_NG_PER_L
                             NON_HAZARDOUS_SOLID  otherwise
      disposal_cost_cents  = round_half_up(mass_kg * DISPOSAL_RATE_CENTS_PER_KG[disposal_method], 0)
    precision: "disposal_cost_cents is an integer, round_half_up at zero decimals. Both classification thresholds are inclusive lower bounds."
    constants: { LEACHATE_HAZARDOUS_NG_PER_L: 500.0, LEACHATE_SPECIAL_NG_PER_L: 50.0, DISPOSAL_RATE_CENTS_PER_KG: { LANDFILL: 12, REACTIVATION: 95, INCINERATION_1100C: 340, DEEP_WELL: 210 } }
    worked_example: |
      leachate 500.00 -> HAZARDOUS (inclusive); leachate 499.99 -> SPECIAL_WASTE; leachate 50.00 ->
      SPECIAL_WASTE; leachate 49.99 -> NON_HAZARDOUS_SOLID.
      800.00 kg shipped to REACTIVATION -> 800 * 95 = 76,000 cents.
      The same 800.00 kg to LANDFILL would cost only 9,600 cents but LANDFILL is not permitted for
      HAZARDOUS media, and the prohibition is checked before the budget.

  # ---------------------------------------------------------------------------
  - name: rate_impact_analysis
    algorithm_type: tiered_pricing
    applies_to: CapitalProject
    trigger: "Project creation (SELECT cascade), PATCH /capital-projects/{id}, funding award, award withdrawal, settled cost recovery."
    input_set: "capital_cost_cents, annual_om_cost_cents, the project's AWARDED FundingApplication rows, its SETTLED CostRecoveryClaim allocations, served_account_count, annual_billed_kgal, current_annual_revenue_cents."
    combination_mode: >-
      MODE (c) — PINNED SEQUENTIAL DEPENDENCY. The seven steps below must execute in exactly this
      order because step 5 selects the surcharge tier from the PROVISIONAL impact computed in step 4,
      while step 7 reports the FINAL impact that includes that surcharge. Feeding step 7's answer back
      into step 5 (a naive fixed-point loop) changes the tier and therefore the answer.
    formula: |
      step 1  funding_awarded_cents = sum(awarded_cents  over AWARDED applications)
              grant_equivalent_cents = sum(forgiven_cents over AWARDED applications)
              loan_principal_cents  = funding_awarded_cents - grant_equivalent_cents
              local_share_cents     = capital_cost_cents - funding_awarded_cents - recovered_cents
      step 2  borrowed_cents             = local_share_cents + loan_principal_cents
              annual_debt_service_cents  = round_half_up(borrowed_cents * ANNUITY_FACTOR_20Y_2PCT, 0)
      step 3  base_annual_requirement_cents = annual_debt_service_cents + annual_om_cost_cents
      step 4  provisional_rate_impact_pct  = round_half_up(base_annual_requirement_cents * 100
                                                          / current_annual_revenue_cents, 2)
      step 5  surcharge_bp = 0   when provisional_rate_impact_pct < 5.00
                             150 when 5.00 <= provisional_rate_impact_pct < 15.00
                             400 when provisional_rate_impact_pct >= 15.00
      step 6  final_annual_requirement_cents = base_annual_requirement_cents
                                             + round_half_up(base_annual_requirement_cents
                                                             * surcharge_bp / 10000, 0)
      step 7  rate_impact_pct = round_half_up(final_annual_requirement_cents * 100
                                              / current_annual_revenue_cents, 2)
    precision: "Percentages 2 decimal places round_half_up; every money value an integer cent with round_half_up at zero decimals. Nothing is truncated."
    constants: { ANNUITY_FACTOR_20Y_2PCT: 0.0611567181, SURCHARGE_TIERS_BP: [0, 150, 400], SURCHARGE_BREAKPOINTS_PCT: [5.00, 15.00] }
    variants:
      - name: bill_impact_uniform
        description: "Flat monthly charge per account — the annual requirement is divided directly by accounts and months."
        formula: |
          uniform_monthly_increase_cents = round_half_up(final_annual_requirement_cents
                                                         / (served_account_count * MONTHS_PER_YEAR), 0)
        selection_context: "Authoritative for monthly_bill_increase_cents when rate_design == UNIFORM."
      - name: bill_impact_volumetric
        description: >-
          Volumetric pass-through — the requirement first becomes a whole-cent rate per thousand
          gallons, and that INTERMEDIATE ROUNDED RATE is then converted to a monthly bill. The
          intermediate rounding is why the two variants disagree on the same project.
        formula: |
          volumetric_rate_increase_cents_per_kgal = round_half_up(final_annual_requirement_cents
                                                                  / annual_billed_kgal, 0)
          volumetric_monthly_increase_cents = round_half_up(volumetric_rate_increase_cents_per_kgal
                                                            * (annual_billed_kgal / served_account_count)
                                                            / MONTHS_PER_YEAR, 0)
        selection_context: "Authoritative for monthly_bill_increase_cents when rate_design == VOLUMETRIC."
    worked_example: |
      Base project: capital 680,000,000, annual O&M 31,000,000, revenue 1,026,000,000,
      18,000 accounts, 1,080,000 kgal, no funding, no recovery.
        local_share 680,000,000 -> borrowed 680,000,000 -> debt service 41,586,568
        base 72,586,568 -> provisional 7.07 -> surcharge_bp 150 -> surcharge 1,088,799
        final 73,675,367 -> rate_impact_pct 7.18
        uniform 341 cents/month; volumetric rate 68 cents/kgal -> volumetric 340 cents/month
      Mode-(c) discriminator: PATCH capital_cost_cents to 1,993,000,000.
        debt service 121,885,339 -> base 152,885,339 -> provisional 14.90 -> surcharge_bp 150
        final 155,178,619 -> rate_impact_pct 15.12
        A fixed-point loop that re-read 15.12 in step 5 would jump to 400 bp and report a different
        final requirement; the pinned order keeps 150 bp.

  # ---------------------------------------------------------------------------
  - name: funding_forgiveness
    algorithm_type: threshold
    applies_to: FundingApplication
    trigger: "POST /capital-projects/{id}/funding-applications for forgiveness_pct; POST /funding-applications/{id}/decision with action AWARD for forgiven_cents."
    input_set: "program, disadvantaged_community, awarded_cents."
    formula: |
      forgiveness_pct = 100.00 when program == EC_GRANT
                        100.00 when program == BIL_SUPPLEMENTAL and disadvantaged_community
                         25.00 when program == BIL_SUPPLEMENTAL and not disadvantaged_community
                         49.00 when program == SRF_LOAN and disadvantaged_community
                          0.00 when program == SRF_LOAN and not disadvantaged_community
      forgiven_cents = round_half_up(awarded_cents * forgiveness_pct / 100, 0)
    precision: "Integer cents, round_half_up."
    constants: { FORGIVENESS_PCT_BY_PROGRAM: { EC_GRANT: 100.00, BIL_SUPPLEMENTAL_DISADVANTAGED: 100.00, BIL_SUPPLEMENTAL_STANDARD: 25.00, SRF_LOAN_DISADVANTAGED: 49.00, SRF_LOAN_STANDARD: 0.00 } }
    worked_example: |
      On the base project (capital 680,000,000, O&M 31,000,000, revenue 1,026,000,000):
        EC_GRANT award 400,000,000 -> forgiven 400,000,000 -> loan_principal 0 -> borrowed 280,000,000
          -> debt 17,123,881 -> base 48,123,881 -> provisional 4.69 -> surcharge_bp 0
          -> final 48,123,881 -> rate_impact_pct 4.69
        SRF_LOAN award 400,000,000, standard community -> forgiven 0 -> loan_principal 400,000,000
          -> borrowed 280,000,000 + 400,000,000 = 680,000,000 -> rate_impact_pct 7.18, IDENTICAL to the
          unfunded project: a zero-forgiveness loan moves money from local share to loan principal and
          changes nothing about the borrowing total.
        SRF_LOAN award 400,000,000, disadvantaged -> forgiven 196,000,000 -> borrowed 484,000,000
          -> debt 29,599,852 -> base 60,599,852 -> provisional 5.91 -> surcharge 908,998
          -> final 61,508,850 -> rate_impact_pct 6.00

  # ---------------------------------------------------------------------------
  - name: cost_recovery_allocation
    algorithm_type: waterfall_allocation
    applies_to: CostRecoveryClaim
    trigger: "POST /cost-recovery-claims/{id}/resolve with action SETTLE."
    input_set: "recovered_cents, the claim's investigation_cost_cents, and the linked CapitalProject's local_share_cents and annual_om_cost_cents as they stand immediately before this settlement is applied."
    ordering: "Buckets fill strictly in the order below; each takes min(remaining, its own cap) and the last bucket absorbs whatever is left."
    formula: |
      claim_basis_cents = round_half_up((CapitalProject.capital_cost_cents + investigation_cost_cents)
                                        * allocation_pct / 100, 0)      # informational, computed at creation
      remaining = recovered_cents
      alloc_investigation_cents      = min(remaining, investigation_cost_cents);          remaining -= it
      alloc_capital_cents            = min(remaining, CapitalProject.local_share_cents);  remaining -= it
      om_reserve_cap                 = round_half_up(CapitalProject.annual_om_cost_cents * OM_RESERVE_PCT / 100, 0)
      alloc_om_reserve_cents         = min(remaining, om_reserve_cap);                     remaining -= it
      alloc_rate_stabilization_cents = remaining
      # invariant: the four buckets always sum to recovered_cents, even when remaining hits 0 early
      # and even when the recovery exceeds every cap.
    precision: "Integer cents throughout; only om_reserve_cap involves a rounding step."
    constants: { OM_RESERVE_PCT: 25.00 }
    worked_example: |
      Base project (capital 680,000,000, local share 680,000,000, annual O&M 31,000,000),
      investigation_cost_cents 20,000,000, claimed 900,000,000, recovered 750,000,000:
        bucket 1 investigation      20,000,000  (remaining 730,000,000)
        bucket 2 capital local share 680,000,000 (remaining  50,000,000)
        bucket 3 O&M reserve cap round_half_up(31,000,000 * 0.25) = 7,750,000 (remaining 42,250,000)
        bucket 4 rate stabilization 42,250,000
        sum 750,000,000 == recovered_cents
      Only bucket 2 touches the project: recovered_cents becomes 680,000,000, local_share_cents falls
      to 0, borrowed_cents to 0, debt service to 0, base to 31,000,000, provisional 3.02 -> surcharge_bp 0
      -> rate_impact_pct 3.02, uniform 144 cents/month, volumetric rate 29 -> volumetric 145 cents/month.

# =============================================================================
# §1.4 Ordered Validation Rules
# =============================================================================
# One total order over every write in the domain. The lowest priority number whose
# condition holds is the error returned; no request ever reports two failures.
# Bands: 1-11 authentication / authorization / ownership / existence / shape /
# pagination / concurrency, 20-51 state, 60-64 business_safety,
# 70-79 business_referential, 80-87 business_temporal, 90-105 business_constraint,
# 110-113 business_fiscal.

validations:

  # --- band 1-11: envelope, identity, existence, shape, concurrency -----------
  - priority: 1
    name: authentication_headers_present
    category: auth
    condition: "X-User-ID or X-Role is absent, empty, or whitespace-only"
    error_id: ERR_UNAUTHENTICATED
    http_status: 401
    applies_to: "every endpoint except POST /_clock/set_current_utc"
  - priority: 2
    name: role_header_recognised
    category: auth
    condition: "X-Role is not one of UtilityAdmin | SamplingTechnician | LaboratoryManager | ComplianceOfficer | TreatmentEngineer | FinanceOfficer | StateRegulator"
    error_id: ERR_UNAUTHENTICATED
    http_status: 401
    applies_to: "every authenticated endpoint"
  - priority: 3
    name: role_permitted_for_endpoint
    category: auth
    condition: "X-Role is not listed in the endpoint's roles"
    error_id: ERR_FORBIDDEN_ROLE
    http_status: 403
    applies_to: "every authenticated endpoint"
  - priority: 4
    name: laboratory_identity_resolves
    category: ownership
    condition: "X-Role is LaboratoryManager and X-User-ID does not resolve to an existing Laboratory.id"
    error_id: ERR_LABORATORY_NOT_OWNED
    http_status: 403
    applies_to: "POST /samples/{id}/receive, POST /lab-results, GET /lab-results, GET /samples"
  - priority: 5
    name: path_resource_exists
    category: existence
    condition: "A path {id} segment does not resolve to a live row"
    error_id: "ERR_ENTRY_POINT_NOT_FOUND | ERR_SAMPLE_NOT_FOUND | ERR_LAB_RESULT_NOT_FOUND | ERR_DETERMINATION_NOT_FOUND | ERR_NOTIFICATION_NOT_FOUND | ERR_EVALUATION_NOT_FOUND | ERR_PILOT_NOT_FOUND | ERR_MANIFEST_NOT_FOUND | ERR_PROJECT_NOT_FOUND | ERR_APPLICATION_NOT_FOUND | ERR_CLAIM_NOT_FOUND | ERR_CONTAMINANT_NOT_FOUND | ERR_LABORATORY_NOT_FOUND"
    http_status: 404
    applies_to: "every endpoint with a path parameter"
  - priority: 6
    name: request_shape_valid
    category: shape
    condition: "Unknown enum value, wrong JSON type, missing required body field, negative where non-negative is required, more than two decimal places on a 2dp field, malformed ISO-8601 instant, malformed YYYYQn period, or a violated declared range"
    error_id: ERR_INVALID_REQUEST
    http_status: 422
    applies_to: "every write endpoint"
  - priority: 7
    name: pagination_within_range
    category: shape
    condition: "limit < 1, limit > 100, or offset < 0"
    error_id: ERR_PAGINATION_OUT_OF_RANGE
    http_status: 422
    applies_to: "every list endpoint"
  - priority: 8
    name: body_foreign_keys_resolve
    category: existence
    condition: "A foreign key supplied in the body or as a query filter does not resolve"
    error_id: "the NOT_FOUND error of the referenced entity"
    http_status: 404
    applies_to: "POST /samples, POST /samples/{id}/ship, POST /lab-results, POST /compliance-determinations, POST /treatment-evaluations, POST /pilot-tests, POST /residuals-manifests, POST /cost-recovery-claims, every filtered list"
  - priority: 9
    name: laboratory_holds_the_sample
    category: ownership
    condition: "X-User-ID differs from Sample.assigned_laboratory_id"
    error_id: ERR_LABORATORY_ASSIGNMENT_MISMATCH
    http_status: 403
    applies_to: "POST /samples/{id}/receive, POST /lab-results"
  - priority: 10
    name: entry_point_version_current
    category: concurrency
    condition: "expected_entry_point_version differs from EntryPoint.version"
    error_id: ERR_STALE_ENTRY_POINT_VERSION
    http_status: 412
    applies_to: "POST /compliance-determinations"
  - priority: 11
    name: capital_project_version_current
    category: concurrency
    condition: "expected_capital_project_version differs from CapitalProject.version"
    error_id: ERR_STALE_CAPITAL_PROJECT_VERSION
    http_status: 412
    applies_to: "POST /capital-projects/{id}/funding-applications"

  # --- band 20-51: state ------------------------------------------------------
  - priority: 20
    name: entry_point_accepts_new_samples
    category: state
    condition: "EntryPoint.monitoring_status == SUSPENDED"
    error_id: ERR_MONITORING_SUSPENDED
    http_status: 422
    applies_to: "POST /samples"
    conflict_note: "Deliberately ranked ABOVE the sampling-material safety check at priority 60: a suspended entry point refuses the collection before anyone inspects the kit."
  - priority: 21
    name: sample_state_allows_action
    category: state
    condition: "Sample.status is not in the set the action requires (ship needs COLLECTED, receive needs IN_TRANSIT, invalidate needs RECEIVED or ANALYZED, reinstate needs INVALIDATED)"
    error_id: ERR_SAMPLE_STATE_INVALID
    http_status: 422
    applies_to: "POST /samples/{id}/ship, POST /samples/{id}/receive, POST /samples/{id}/invalidate, POST /samples/{id}/reinstate"
  - priority: 22
    name: invalidation_is_reversible
    category: state
    condition: "Sample.invalidation_reason != OPERATOR_ERROR or status_before_invalidation is null"
    error_id: ERR_INVALIDATION_NOT_REVERSIBLE
    http_status: 422
    applies_to: "POST /samples/{id}/reinstate"
  - priority: 23
    name: result_awaits_review
    category: state
    condition: "LabResult.status != SUBMITTED"
    error_id: ERR_RESULT_STATE_INVALID
    http_status: 422
    applies_to: "POST /lab-results/{id}/review"
  - priority: 24
    name: determination_state_allows_action
    category: state
    condition: "ComplianceDetermination.status != DRAFT on issue, or != ISSUED on rescind"
    error_id: ERR_DETERMINATION_STATE_INVALID
    http_status: 422
    applies_to: "POST /compliance-determinations/{id}/issue, POST /compliance-determinations/{id}/rescind"
  - priority: 25
    name: notification_state_allows_action
    category: state
    condition: "PublicNotification.status != DRAFT on submit, != SUBMITTED on review, != APPROVED on certify-distribution"
    error_id: ERR_NOTIFICATION_STATE_INVALID
    http_status: 422
    applies_to: "POST /public-notifications/{id}/submit, POST /public-notifications/{id}/review, POST /public-notifications/{id}/certify-distribution"
  - priority: 26
    name: evaluation_is_piloting
    category: state
    condition: "TreatmentEvaluation.status != PILOTING"
    error_id: ERR_EVALUATION_STATE_INVALID
    http_status: 422
    applies_to: "POST /treatment-evaluations/{id}/decision"
  - priority: 27
    name: pilot_state_allows_action
    category: state
    condition: "PilotTest.status != PLANNED on start, or != RUNNING on complete"
    error_id: ERR_PILOT_STATE_INVALID
    http_status: 422
    applies_to: "POST /pilot-tests/{id}/start, POST /pilot-tests/{id}/complete"
  - priority: 28
    name: manifest_state_allows_action
    category: state
    condition: "ResidualsManifest.status != DRAFT on classify, != CLASSIFIED on ship, not in [DRAFT, CLASSIFIED] on void"
    error_id: ERR_MANIFEST_STATE_INVALID
    http_status: 422
    applies_to: "POST /residuals-manifests/{id}/classify, POST /residuals-manifests/{id}/ship, POST /residuals-manifests/{id}/void"
  - priority: 29
    name: application_state_allows_action
    category: state
    condition: "FundingApplication.status != SUBMITTED on decision, or not in [SUBMITTED, AWARDED] on withdraw"
    error_id: ERR_APPLICATION_STATE_INVALID
    http_status: 422
    applies_to: "POST /funding-applications/{id}/decision, POST /funding-applications/{id}/withdraw"
  - priority: 30
    name: claim_state_allows_action
    category: state
    condition: "CostRecoveryClaim.status != INVESTIGATING on file, != CLAIM_FILED on settle, not in [INVESTIGATING, CLAIM_FILED] on dismiss"
    error_id: ERR_CLAIM_STATE_INVALID
    http_status: 422
    applies_to: "POST /cost-recovery-claims/{id}/file, POST /cost-recovery-claims/{id}/resolve"
  - priority: 31
    name: monitoring_state_allows_action
    category: state
    condition: "monitoring_status != QUARTERLY on a reduction request, != REDUCTION_PENDING on a reduction decision, already SUSPENDED on SUSPEND, not SUSPENDED on RESUME"
    error_id: ERR_MONITORING_STATE_INVALID
    http_status: 422
    applies_to: "POST /entry-points/{id}/monitoring-reduction-requests, POST /entry-points/{id}/monitoring-reduction-decisions, POST /entry-points/{id}/monitoring-status"
  - priority: 32
    name: project_state_allows_action
    category: state
    condition: "The requested construction_status is not the immediate successor of the current one, or a withdrawal is attempted while construction_status != PLANNED"
    error_id: ERR_PROJECT_STATE_INVALID
    http_status: 422
    applies_to: "POST /capital-projects/{id}/construction-status, POST /funding-applications/{id}/withdraw"
  - priority: 33
    name: project_costs_still_mutable
    category: state
    condition: "CapitalProject.construction_status == IN_SERVICE"
    error_id: ERR_PROJECT_IN_SERVICE
    http_status: 422
    applies_to: "PATCH /capital-projects/{id}"
  - priority: 34
    name: sample_has_been_received
    category: state
    condition: "Sample.status != RECEIVED"
    error_id: ERR_SAMPLE_NOT_RECEIVED
    http_status: 422
    applies_to: "POST /lab-results, POST /lab-results/{id}/review"
    cross_entity_note: "The subject entity is LabResult but the state read is on Sample — a cross-entity state dependency, not a self-state check."

  # --- band 60-64: business_safety -------------------------------------------
  - priority: 60
    name: sampling_material_permitted
    category: business_safety
    condition: "ptfe_free_kit is false — a fluoropolymer-wetted kit cross-contaminates the sample"
    error_id: ERR_PROHIBITED_SAMPLING_MATERIAL
    http_status: 422
    applies_to: "POST /samples"
    conflict_note: "Ranked BELOW ERR_MONITORING_SUSPENDED (priority 20); a request that violates both reports the suspension."
  - priority: 61
    name: field_blank_accompanies_sample
    category: business_safety
    condition: "field_blank_included is false"
    error_id: ERR_FIELD_BLANK_REQUIRED
    http_status: 422
    applies_to: "POST /samples"
  - priority: 62
    name: disposal_route_permitted_for_classification
    category: business_safety
    condition: "disposal_method is not in PERMITTED_DISPOSAL_BY_CLASSIFICATION[waste_classification]"
    error_id: ERR_DISPOSAL_METHOD_PROHIBITED
    http_status: 422
    applies_to: "POST /residuals-manifests/{id}/ship"
    conflict_note: "Ranked ABOVE the residuals budget check at priority 110: landfilling hazardous spent media is refused on safety grounds even when it is the only affordable route."
  - priority: 63
    name: concentrate_permit_on_file
    category: business_safety
    condition: "concentrate_permit_required is true and concentrate_permit_ref is absent"
    error_id: ERR_CONCENTRATE_PERMIT_REQUIRED
    http_status: 422
    applies_to: "POST /capital-projects/{id}/construction-status"
  - priority: 64
    name: distribution_certified_by_a_second_officer
    category: business_safety
    condition: "X-User-ID == PublicNotification.drafted_by_user_id"
    error_id: ERR_SEGREGATION_OF_DUTIES
    http_status: 403
    applies_to: "POST /public-notifications/{id}/certify-distribution"

  # --- band 70-79: business_referential --------------------------------------
  - priority: 70
    name: contaminant_within_sample_panel
    category: business_referential
    condition: "contaminant_id is not a member of Sample.panel_contaminant_ids"
    error_id: ERR_CONTAMINANT_NOT_IN_PANEL
    http_status: 422
    applies_to: "POST /lab-results"
  - priority: 71
    name: method_certified_for_laboratory
    category: business_referential
    condition: "method is not in Laboratory.certified_methods"
    error_id: ERR_METHOD_NOT_CERTIFIED
    http_status: 422
    applies_to: "POST /lab-results"
  - priority: 72
    name: detection_limit_meets_required_mrl
    category: business_referential
    condition: "detection_limit_ng_per_l > Contaminant.required_mrl_ng_per_l"
    error_id: ERR_DETECTION_LIMIT_TOO_HIGH
    http_status: 422
    applies_to: "POST /lab-results"
  - priority: 73
    name: detection_limit_within_laboratory_capability
    category: business_referential
    condition: "detection_limit_ng_per_l < Laboratory.lowest_achievable_dl_ng_per_l"
    error_id: ERR_DETECTION_LIMIT_BELOW_CAPABILITY
    http_status: 422
    applies_to: "POST /lab-results"
  - priority: 74
    name: one_accepted_result_per_period
    category: business_referential
    condition: "Another LabResult with status ACCEPTED already exists for the same (Sample.entry_point_id, contaminant_id, Sample.monitoring_period)"
    error_id: ERR_DUPLICATE_PERIOD_RESULT
    http_status: 422
    applies_to: "POST /lab-results/{id}/review"
  - priority: 75
    name: resample_target_was_invalidated
    category: business_referential
    condition: "resample_of_sample_id resolves to a Sample whose status != INVALIDATED"
    error_id: ERR_RESAMPLE_TARGET_NOT_INVALIDATED
    http_status: 422
    applies_to: "POST /samples"
  - priority: 76
    name: manifest_pilot_is_complete
    category: business_referential
    condition: "PilotTest.status != COMPLETED"
    error_id: ERR_PILOT_NOT_COMPLETED
    http_status: 422
    applies_to: "POST /residuals-manifests"
    cross_entity_note: "Subject entity ResidualsManifest, state read on PilotTest — the second cross-entity state dependency, on a different entity pair than priority 34."
  - priority: 77
    name: media_type_matches_technology
    category: business_referential
    condition: "media_type is not in MEDIA_TYPE_BY_TECHNOLOGY[PilotTest.technology]"
    error_id: ERR_MEDIA_TYPE_MISMATCH
    http_status: 422
    applies_to: "POST /residuals-manifests"
  - priority: 78
    name: funding_secured_before_bidding
    category: business_referential
    condition: "The target construction_status is BIDDING and funding_status != AWARDED"
    error_id: ERR_FUNDING_NOT_SECURED
    http_status: 422
    applies_to: "POST /capital-projects/{id}/construction-status"
  - priority: 79
    name: claim_entry_point_matches_project
    category: business_referential
    condition: "entry_point_id differs from CapitalProject.entry_point_id"
    error_id: ERR_ENTRY_POINT_MISMATCH
    http_status: 422
    applies_to: "POST /cost-recovery-claims"

  # --- band 80-87: business_temporal -----------------------------------------
  - priority: 80
    name: holding_time_respected
    category: business_temporal
    condition: "(analyzed_at - Sample.collected_at) in hours > HOLDING_TIME_HOURS_BY_METHOD[method]"
    error_id: ERR_HOLDING_TIME_EXCEEDED
    http_status: 422
    applies_to: "POST /lab-results"
    conflict_note: "Ranked ABOVE the laboratory daily capacity check at priority 94: an expired sample is refused on its own merits before the laboratory's workload is considered."
  - priority: 81
    name: laboratory_certification_valid_at_analysis
    category: business_temporal
    condition: "analyzed_at >= Laboratory.certification_expires_on"
    error_id: ERR_LABORATORY_CERTIFICATION_EXPIRED
    http_status: 422
    applies_to: "POST /lab-results"
  - priority: 82
    name: analysis_after_collection
    category: business_temporal
    condition: "analyzed_at < Sample.collected_at"
    error_id: ERR_ANALYZED_BEFORE_COLLECTION
    http_status: 422
    applies_to: "POST /lab-results"
  - priority: 83
    name: collection_not_in_future
    category: business_temporal
    condition: "collected_at > the logical clock"
    error_id: ERR_COLLECTED_IN_FUTURE
    http_status: 422
    applies_to: "POST /samples"
  - priority: 84
    name: monitoring_period_matches_collection
    category: business_temporal
    condition: "monitoring_period is not the calendar quarter containing collected_at"
    error_id: ERR_MONITORING_PERIOD_MISMATCH
    http_status: 422
    applies_to: "POST /samples"
  - priority: 85
    name: shipment_after_collection
    category: business_temporal
    condition: "the logical clock is earlier than Sample.collected_at"
    error_id: ERR_SHIP_BEFORE_COLLECTION
    http_status: 422
    applies_to: "POST /samples/{id}/ship"
  - priority: 86
    name: pilot_window_free_of_overlap
    category: business_temporal
    condition: >-
      Another PilotTest at the same entry point with status PLANNED or RUNNING has a half-open window
      [window_start_at, window_end_at) that overlaps the requested window after each existing window is
      widened by PILOT_DECONTAMINATION_BUFFER_HOURS on both sides
    error_id: ERR_PILOT_WINDOW_CONFLICT
    http_status: 422
    applies_to: "POST /pilot-tests"
  - priority: 87
    name: pilot_window_has_opened
    category: business_temporal
    condition: "the logical clock is earlier than window_start_at"
    error_id: ERR_PILOT_WINDOW_NOT_STARTED
    http_status: 422
    applies_to: "POST /pilot-tests/{id}/start"

  # --- band 90-105: business_constraint --------------------------------------
  - priority: 90
    name: no_violation_pending_during_reduction
    category: business_constraint
    condition: "EntryPoint.compliance_posture == VIOLATION_PENDING"
    error_id: ERR_VIOLATION_PENDING_BLOCKS_REDUCTION
    http_status: 422
    applies_to: "POST /entry-points/{id}/monitoring-reduction-requests, POST /entry-points/{id}/monitoring-reduction-decisions"
  - priority: 91
    name: no_open_violation_during_reduction
    category: business_constraint
    condition: "EntryPoint.open_violation_count > 0"
    error_id: ERR_OPEN_VIOLATION_BLOCKS_REDUCTION
    http_status: 422
    applies_to: "POST /entry-points/{id}/monitoring-reduction-requests"
  - priority: 92
    name: annual_reduction_history_sufficient
    category: business_constraint
    condition: "consecutive_qualifying_quarters < REDUCTION_MIN_QUARTERS_ANNUAL"
    error_id: ERR_INSUFFICIENT_MONITORING_HISTORY
    http_status: 422
    applies_to: "POST /entry-points/{id}/monitoring-reduction-requests"
  - priority: 93
    name: triennial_reduction_history_sufficient
    category: business_constraint
    condition: "target_status == TRIENNIAL and consecutive_qualifying_quarters < REDUCTION_MIN_QUARTERS_TRIENNIAL"
    error_id: ERR_TRIENNIAL_HISTORY_INSUFFICIENT
    http_status: 422
    applies_to: "POST /entry-points/{id}/monitoring-reduction-requests"
  - priority: 94
    name: laboratory_daily_capacity_available
    category: business_constraint
    condition: >-
      The count of this laboratory's LabResult rows with status in [SUBMITTED, ACCEPTED] whose
      analyzed_at falls in the same UTC calendar day as the submitted analyzed_at is already
      >= Laboratory.daily_analysis_capacity
    error_id: ERR_LAB_DAILY_CAPACITY_EXCEEDED
    http_status: 422
    applies_to: "POST /lab-results"
  - priority: 95
    name: enough_completed_pilots
    category: business_constraint
    condition: "count of COMPLETED pilots for the evaluation < MIN_COMPLETED_PILOTS"
    error_id: ERR_INSUFFICIENT_PILOT_EVIDENCE
    http_status: 422
    applies_to: "POST /treatment-evaluations/{id}/decision"
  - priority: 96
    name: at_least_one_qualifying_technology
    category: business_constraint
    condition: "action == SELECT and no COMPLETED pilot has removal_pct >= MIN_REMOVAL_PCT"
    error_id: ERR_NO_QUALIFYING_TECHNOLOGY
    http_status: 422
    applies_to: "POST /treatment-evaluations/{id}/decision"
  - priority: 97
    name: determination_has_data
    category: business_constraint
    condition: "quarters_used == 0"
    error_id: ERR_NO_QUALIFYING_RESULTS
    http_status: 422
    applies_to: "POST /compliance-determinations/{id}/issue"
  - priority: 98
    name: revision_budget_remaining
    category: business_constraint
    condition: "revision_count > MAX_NOTIFICATION_REVISIONS"
    error_id: ERR_NOTIFICATION_REVISION_LIMIT
    http_status: 422
    applies_to: "POST /public-notifications/{id}/submit"
  - priority: 99
    name: mandatory_content_present
    category: business_constraint
    condition: "content_elements does not contain every element of MANDATORY_CONTENT_ELEMENTS"
    error_id: ERR_NOTIFICATION_CONTENT_INCOMPLETE
    http_status: 422
    applies_to: "POST /public-notifications/{id}/submit"
  - priority: 100
    name: required_delivery_methods_present
    category: business_constraint
    condition: "delivery_methods does not contain every method of REQUIRED_DELIVERY_METHODS_BY_TIER[tier]"
    error_id: ERR_DELIVERY_METHOD_INSUFFICIENT
    http_status: 422
    applies_to: "POST /public-notifications/{id}/submit"
  - priority: 101
    name: manifest_mass_within_unmanifested
    category: business_constraint
    condition: "mass_kg > PilotTest.unmanifested_media_kg"
    error_id: ERR_MASS_EXCEEDS_SPENT_MEDIA
    http_status: 422
    applies_to: "POST /residuals-manifests"
  - priority: 102
    name: effluent_not_above_influent
    category: business_constraint
    condition: "effluent_ng_per_l > influent_ng_per_l"
    error_id: ERR_EFFLUENT_EXCEEDS_INFLUENT
    http_status: 422
    applies_to: "POST /pilot-tests/{id}/complete"
  - priority: 103
    name: entry_point_label_unique
    category: business_constraint
    condition: "label already exists on another EntryPoint"
    error_id: ERR_DUPLICATE_ENTRY_POINT_LABEL
    http_status: 422
    applies_to: "POST /entry-points"
  - priority: 104
    name: contaminant_code_unique
    category: business_constraint
    condition: "code already exists on another Contaminant"
    error_id: ERR_DUPLICATE_CONTAMINANT_CODE
    http_status: 422
    applies_to: "POST /contaminants"
  - priority: 105
    name: certification_id_unique
    category: business_constraint
    condition: "certification_id already exists on another Laboratory"
    error_id: ERR_DUPLICATE_CERTIFICATION_ID
    http_status: 422
    applies_to: "POST /laboratories"

  # --- band 110-113: business_fiscal -----------------------------------------
  - priority: 110
    name: residuals_budget_available
    category: business_fiscal
    condition: "TreatmentEvaluation.residuals_spent_cents + disposal_cost_cents > TreatmentEvaluation.residuals_budget_cents"
    error_id: ERR_RESIDUALS_BUDGET_EXCEEDED
    http_status: 422
    applies_to: "POST /residuals-manifests/{id}/ship"
    conflict_note: "Ranked BELOW ERR_DISPOSAL_METHOD_PROHIBITED (priority 62); a shipment that is both unsafe and unaffordable reports the safety error."
  - priority: 111
    name: award_within_request
    category: business_fiscal
    condition: "awarded_cents > FundingApplication.amount_requested_cents"
    error_id: ERR_AWARD_EXCEEDS_REQUEST
    http_status: 422
    applies_to: "POST /funding-applications/{id}/decision"
  - priority: 112
    name: award_within_project_cost
    category: business_fiscal
    condition: "CapitalProject.funding_awarded_cents + awarded_cents > CapitalProject.capital_cost_cents"
    error_id: ERR_AWARD_EXCEEDS_PROJECT_COST
    http_status: 422
    applies_to: "POST /funding-applications/{id}/decision"
  - priority: 113
    name: recovery_within_claim
    category: business_fiscal
    condition: "recovered_cents > CostRecoveryClaim.claimed_cents"
    error_id: ERR_RECOVERY_EXCEEDS_CLAIM
    http_status: 422
    applies_to: "POST /cost-recovery-claims/{id}/resolve"

# =============================================================================
# §1.5 API Endpoints
# =============================================================================
# 61 endpoints over 13 flat collections. Reads are universal (all seven roles);
# every write is restricted to the role that owns the act. `field?` marks an
# optional input. Query strings are not part of the path template.

endpoints:

  # --- test harness ----------------------------------------------------------
  - method: POST
    path: /_clock/set_current_utc
    roles: [UtilityAdmin, SamplingTechnician, LaboratoryManager, ComplianceOfficer, TreatmentEngineer, FinanceOfficer, StateRegulator]
    input: [current_utc]
    output: { current_utc: datetime }
    side_effects:
      - "Sets the logical clock every subsequent request reads. Default before any call: 2026-08-01T00:00:00.000Z"
    errors: [ERR_INVALID_REQUEST]

  # --- Contaminant -----------------------------------------------------------
  - method: POST
    path: /contaminants
    roles: [UtilityAdmin]
    input: [code, mcl_ng_per_l, trigger_level_ng_per_l, required_mrl_ng_per_l, "hazard_index_member?", "hbwc_ng_per_l?", "notification_tier?"]
    output: Contaminant
    side_effects: []
    errors: [ERR_UNAUTHENTICATED, ERR_FORBIDDEN_ROLE, ERR_INVALID_REQUEST, ERR_DUPLICATE_CONTAMINANT_CODE]
  - method: GET
    path: /contaminants/{id}
    roles: [UtilityAdmin, SamplingTechnician, LaboratoryManager, ComplianceOfficer, TreatmentEngineer, FinanceOfficer, StateRegulator]
    input: []
    output: Contaminant
    side_effects: []
    errors: [ERR_UNAUTHENTICATED, ERR_CONTAMINANT_NOT_FOUND]

  # --- Laboratory ------------------------------------------------------------
  - method: POST
    path: /laboratories
    roles: [UtilityAdmin]
    input: [name, certification_id, certified_methods, lowest_achievable_dl_ng_per_l, certification_expires_on, "daily_analysis_capacity?"]
    output: Laboratory
    side_effects:
      - "The new Laboratory.id doubles as the X-User-ID a LaboratoryManager presents (identity: entity_backed)"
    errors: [ERR_UNAUTHENTICATED, ERR_FORBIDDEN_ROLE, ERR_INVALID_REQUEST, ERR_DUPLICATE_CERTIFICATION_ID]
  - method: GET
    path: /laboratories/{id}
    roles: [UtilityAdmin, SamplingTechnician, LaboratoryManager, ComplianceOfficer, TreatmentEngineer, FinanceOfficer, StateRegulator]
    input: []
    output: Laboratory
    side_effects: []
    errors: [ERR_UNAUTHENTICATED, ERR_LABORATORY_NOT_FOUND]

  # --- EntryPoint ------------------------------------------------------------
  - method: POST
    path: /entry-points
    roles: [UtilityAdmin]
    input: [label, source_type, population_served]
    output: EntryPoint
    side_effects:
      - "served_account_count = ceil(population_served / PERSONS_PER_ACCOUNT), annual_billed_kgal and baseline_annual_revenue_cents frozen"
      - "monitoring_status INITIAL, compliance_posture COMPLIANT, treatment_status NONE"
    errors: [ERR_UNAUTHENTICATED, ERR_FORBIDDEN_ROLE, ERR_INVALID_REQUEST, ERR_DUPLICATE_ENTRY_POINT_LABEL]
  - method: GET
    path: /entry-points
    roles: [UtilityAdmin, SamplingTechnician, LaboratoryManager, ComplianceOfficer, TreatmentEngineer, FinanceOfficer, StateRegulator]
    input: ["source_type?", "monitoring_status?", "compliance_posture?", "treatment_status?", "limit?", "offset?"]
    output: EntryPoint[]
    side_effects: []
    errors: [ERR_UNAUTHENTICATED, ERR_PAGINATION_OUT_OF_RANGE]
  - method: GET
    path: /entry-points/{id}
    roles: [UtilityAdmin, SamplingTechnician, LaboratoryManager, ComplianceOfficer, TreatmentEngineer, FinanceOfficer, StateRegulator]
    input: []
    output: EntryPoint
    side_effects: []
    errors: [ERR_UNAUTHENTICATED, ERR_ENTRY_POINT_NOT_FOUND]
  - method: POST
    path: /entry-points/{id}/monitoring-status
    roles: [UtilityAdmin]
    input: [action, "reason?"]
    output: EntryPoint
    side_effects:
      - "action SUSPEND -> monitoring_status SUSPENDED, requested_monitoring_status cleared"
      - "action RESUME -> monitoring_status QUARTERLY, consecutive_invalidated_samples reset to 0"
    errors: [ERR_UNAUTHENTICATED, ERR_FORBIDDEN_ROLE, ERR_ENTRY_POINT_NOT_FOUND, ERR_INVALID_REQUEST, ERR_MONITORING_STATE_INVALID]
  - method: POST
    path: /entry-points/{id}/monitoring-reduction-requests
    roles: [ComplianceOfficer]
    input: [target_status, "justification?"]
    output: EntryPoint
    side_effects:
      - "monitoring_status QUARTERLY -> REDUCTION_PENDING, requested_monitoring_status = target_status"
    errors: [ERR_UNAUTHENTICATED, ERR_FORBIDDEN_ROLE, ERR_ENTRY_POINT_NOT_FOUND, ERR_INVALID_REQUEST, ERR_MONITORING_STATE_INVALID, ERR_VIOLATION_PENDING_BLOCKS_REDUCTION, ERR_OPEN_VIOLATION_BLOCKS_REDUCTION, ERR_INSUFFICIENT_MONITORING_HISTORY, ERR_TRIENNIAL_HISTORY_INSUFFICIENT]
  - method: POST
    path: /entry-points/{id}/monitoring-reduction-decisions
    roles: [StateRegulator]
    input: [approve, "decision_note?"]
    output: EntryPoint
    side_effects:
      - "approve true -> monitoring_status = requested_monitoring_status; approve false -> monitoring_status QUARTERLY"
      - "requested_monitoring_status cleared either way"
    errors: [ERR_UNAUTHENTICATED, ERR_FORBIDDEN_ROLE, ERR_ENTRY_POINT_NOT_FOUND, ERR_INVALID_REQUEST, ERR_MONITORING_STATE_INVALID, ERR_VIOLATION_PENDING_BLOCKS_REDUCTION]

  # --- Sample ----------------------------------------------------------------
  - method: POST
    path: /samples
    roles: [SamplingTechnician]
    input: [entry_point_id, panel_contaminant_ids, monitoring_period, collected_at, protocol, ptfe_free_kit, field_blank_included, preservative_lot, "resample_of_sample_id?"]
    output: Sample
    side_effects:
      - "status COLLECTED, collector_user_id = X-User-ID"
    errors: [ERR_UNAUTHENTICATED, ERR_FORBIDDEN_ROLE, ERR_INVALID_REQUEST, ERR_ENTRY_POINT_NOT_FOUND, ERR_CONTAMINANT_NOT_FOUND, ERR_SAMPLE_NOT_FOUND, ERR_MONITORING_SUSPENDED, ERR_PROHIBITED_SAMPLING_MATERIAL, ERR_FIELD_BLANK_REQUIRED, ERR_RESAMPLE_TARGET_NOT_INVALIDATED, ERR_COLLECTED_IN_FUTURE, ERR_MONITORING_PERIOD_MISMATCH]
  - method: GET
    path: /samples
    roles: [UtilityAdmin, SamplingTechnician, LaboratoryManager, ComplianceOfficer, TreatmentEngineer, FinanceOfficer, StateRegulator]
    input: ["entry_point_id?", "assigned_laboratory_id?", "resample_of_sample_id?", "panel_contaminant_ids?", "collector_user_id?", "monitoring_period?", "status?", "limit?", "offset?"]
    output: Sample[]
    side_effects: []
    errors: [ERR_UNAUTHENTICATED, ERR_LABORATORY_NOT_OWNED, ERR_PAGINATION_OUT_OF_RANGE, ERR_ENTRY_POINT_NOT_FOUND, ERR_LABORATORY_NOT_FOUND, ERR_CONTAMINANT_NOT_FOUND, ERR_SAMPLE_NOT_FOUND]
  - method: GET
    path: /samples/{id}
    roles: [UtilityAdmin, SamplingTechnician, LaboratoryManager, ComplianceOfficer, TreatmentEngineer, FinanceOfficer, StateRegulator]
    input: []
    output: Sample
    side_effects: []
    errors: [ERR_UNAUTHENTICATED, ERR_SAMPLE_NOT_FOUND]
  - method: POST
    path: /samples/{id}/ship
    roles: [SamplingTechnician]
    input: [laboratory_id]
    output: Sample
    side_effects:
      - "status COLLECTED -> IN_TRANSIT, assigned_laboratory_id set, shipped_at = logical clock"
    errors: [ERR_UNAUTHENTICATED, ERR_FORBIDDEN_ROLE, ERR_SAMPLE_NOT_FOUND, ERR_INVALID_REQUEST, ERR_LABORATORY_NOT_FOUND, ERR_SAMPLE_STATE_INVALID, ERR_SHIP_BEFORE_COLLECTION]
  - method: POST
    path: /samples/{id}/receive
    roles: [LaboratoryManager]
    input: [chain_of_custody_intact, field_blank_result_ng_per_l]
    output: Sample
    side_effects:
      - "Clean evidence -> status RECEIVED, received_at set, EntryPoint.consecutive_invalidated_samples reset to 0"
      - "Broken custody or a field blank at or above FIELD_BLANK_LIMIT_NG_PER_L -> status INVALIDATED with the matching invalidation_reason and EntryPoint.consecutive_invalidated_samples += 1"
    errors: [ERR_UNAUTHENTICATED, ERR_FORBIDDEN_ROLE, ERR_LABORATORY_NOT_OWNED, ERR_SAMPLE_NOT_FOUND, ERR_INVALID_REQUEST, ERR_LABORATORY_ASSIGNMENT_MISMATCH, ERR_SAMPLE_STATE_INVALID]
  - method: POST
    path: /samples/{id}/invalidate
    roles: [ComplianceOfficer]
    input: [invalidation_reason]
    output: Sample
    side_effects:
      - "status RECEIVED or ANALYZED -> INVALIDATED, status_before_invalidation captured"
      - "SUBMITTED results -> REJECTED (QC_FAILURE); ACCEPTED results -> SUPERSEDED"
      - "EntryPoint accepted_result_count, LRAA, max_compliance_ratio, hazard_index, consecutive_qualifying_quarters, compliance_posture and consecutive_invalidated_samples all re-derived"
    errors: [ERR_UNAUTHENTICATED, ERR_FORBIDDEN_ROLE, ERR_SAMPLE_NOT_FOUND, ERR_INVALID_REQUEST, ERR_SAMPLE_STATE_INVALID]
  - method: POST
    path: /samples/{id}/reinstate
    roles: [ComplianceOfficer]
    input: []
    output: Sample
    side_effects:
      - "status INVALIDATED -> status_before_invalidation; SUPERSEDED results return to ACCEPTED"
      - "EntryPoint derived fields recomputed; consecutive_invalidated_samples -= 1 with a floor of 0"
    errors: [ERR_UNAUTHENTICATED, ERR_FORBIDDEN_ROLE, ERR_SAMPLE_NOT_FOUND, ERR_SAMPLE_STATE_INVALID, ERR_INVALIDATION_NOT_REVERSIBLE]

  # --- LabResult -------------------------------------------------------------
  - method: POST
    path: /lab-results
    roles: [LaboratoryManager]
    input: [sample_id, contaminant_id, method, reported_ng_per_l, detection_limit_ng_per_l, analyzed_at]
    output: LabResult
    side_effects:
      - "status SUBMITTED, laboratory_id = X-User-ID, censored / compliance_value_ng_per_l / planning_value_ng_per_l computed"
    errors: [ERR_UNAUTHENTICATED, ERR_FORBIDDEN_ROLE, ERR_LABORATORY_NOT_OWNED, ERR_INVALID_REQUEST, ERR_SAMPLE_NOT_FOUND, ERR_CONTAMINANT_NOT_FOUND, ERR_LABORATORY_ASSIGNMENT_MISMATCH, ERR_SAMPLE_NOT_RECEIVED, ERR_CONTAMINANT_NOT_IN_PANEL, ERR_METHOD_NOT_CERTIFIED, ERR_DETECTION_LIMIT_TOO_HIGH, ERR_DETECTION_LIMIT_BELOW_CAPABILITY, ERR_HOLDING_TIME_EXCEEDED, ERR_LABORATORY_CERTIFICATION_EXPIRED, ERR_ANALYZED_BEFORE_COLLECTION, ERR_LAB_DAILY_CAPACITY_EXCEEDED]
  - method: GET
    path: /lab-results
    roles: [UtilityAdmin, SamplingTechnician, LaboratoryManager, ComplianceOfficer, TreatmentEngineer, FinanceOfficer, StateRegulator]
    input: ["sample_id?", "laboratory_id?", "contaminant_id?", "status?", "limit?", "offset?"]
    output: LabResult[]
    side_effects: []
    errors: [ERR_UNAUTHENTICATED, ERR_LABORATORY_NOT_OWNED, ERR_PAGINATION_OUT_OF_RANGE, ERR_SAMPLE_NOT_FOUND, ERR_LABORATORY_NOT_FOUND, ERR_CONTAMINANT_NOT_FOUND]
  - method: GET
    path: /lab-results/{id}
    roles: [UtilityAdmin, SamplingTechnician, LaboratoryManager, ComplianceOfficer, TreatmentEngineer, FinanceOfficer, StateRegulator]
    input: []
    output: LabResult
    side_effects: []
    errors: [ERR_UNAUTHENTICATED, ERR_LAB_RESULT_NOT_FOUND]
  - method: POST
    path: /lab-results/{id}/review
    roles: [ComplianceOfficer]
    input: [action, "reject_reason_code?", "review_note?"]
    output: LabResult
    side_effects:
      - "ACCEPT -> status ACCEPTED and the four-level cascade of §1.2 LabResult.status runs"
      - "REJECT -> status REJECTED with reject_reason_code stored and no EntryPoint change"
    errors: [ERR_UNAUTHENTICATED, ERR_FORBIDDEN_ROLE, ERR_LAB_RESULT_NOT_FOUND, ERR_INVALID_REQUEST, ERR_RESULT_STATE_INVALID, ERR_SAMPLE_NOT_RECEIVED, ERR_DUPLICATE_PERIOD_RESULT]

  # --- ComplianceDetermination ----------------------------------------------
  - method: POST
    path: /compliance-determinations
    roles: [ComplianceOfficer]
    input: [entry_point_id, contaminant_id, period_end, expected_entry_point_version]
    output: ComplianceDetermination
    side_effects:
      - "lraa_ng_per_l, planning_lraa_ng_per_l, quarters_used, hazard_index, determination and violation_type frozen onto the row"
      - "status DRAFT, determined_by_user_id = X-User-ID"
    errors: [ERR_UNAUTHENTICATED, ERR_FORBIDDEN_ROLE, ERR_INVALID_REQUEST, ERR_ENTRY_POINT_NOT_FOUND, ERR_CONTAMINANT_NOT_FOUND, ERR_STALE_ENTRY_POINT_VERSION]
  - method: GET
    path: /compliance-determinations
    roles: [UtilityAdmin, SamplingTechnician, LaboratoryManager, ComplianceOfficer, TreatmentEngineer, FinanceOfficer, StateRegulator]
    input: ["entry_point_id?", "contaminant_id?", "status?", "determination?", "limit?", "offset?"]
    output: ComplianceDetermination[]
    side_effects: []
    errors: [ERR_UNAUTHENTICATED, ERR_PAGINATION_OUT_OF_RANGE, ERR_ENTRY_POINT_NOT_FOUND, ERR_CONTAMINANT_NOT_FOUND]
  - method: GET
    path: /compliance-determinations/{id}
    roles: [UtilityAdmin, SamplingTechnician, LaboratoryManager, ComplianceOfficer, TreatmentEngineer, FinanceOfficer, StateRegulator]
    input: []
    output: ComplianceDetermination
    side_effects: []
    errors: [ERR_UNAUTHENTICATED, ERR_DETERMINATION_NOT_FOUND]
  - method: POST
    path: /compliance-determinations/{id}/issue
    roles: [ComplianceOfficer]
    input: []
    output: ComplianceDetermination
    side_effects:
      - "status DRAFT -> ISSUED, issued_at = logical clock"
      - "EntryPoint.open_violation_count += 1 for an MCL_VIOLATION"
      - "A DRAFT PublicNotification is created for MCL_VIOLATION and MONITORING_VIOLATION only, with tier and required_by_at from calculations.notification_tier_and_deadline"
    errors: [ERR_UNAUTHENTICATED, ERR_FORBIDDEN_ROLE, ERR_DETERMINATION_NOT_FOUND, ERR_DETERMINATION_STATE_INVALID, ERR_NO_QUALIFYING_RESULTS]
  - method: POST
    path: /compliance-determinations/{id}/rescind
    roles: [StateRegulator]
    input: [rescind_reason]
    output: ComplianceDetermination
    side_effects:
      - "status ISSUED -> RESCINDED, rescind_reason stored"
      - "EntryPoint.open_violation_count -= 1 for an MCL_VIOLATION (floor 0)"
      - "The linked PublicNotification becomes VOIDED unless it is already DISTRIBUTED or LATE_DISTRIBUTED"
    errors: [ERR_UNAUTHENTICATED, ERR_FORBIDDEN_ROLE, ERR_DETERMINATION_NOT_FOUND, ERR_INVALID_REQUEST, ERR_DETERMINATION_STATE_INVALID]

  # --- PublicNotification ---------------------------------------------------
  - method: GET
    path: /public-notifications
    roles: [UtilityAdmin, SamplingTechnician, LaboratoryManager, ComplianceOfficer, TreatmentEngineer, FinanceOfficer, StateRegulator]
    input: ["determination_id?", "status?", "tier?", "limit?", "offset?"]
    output: PublicNotification[]
    side_effects: []
    errors: [ERR_UNAUTHENTICATED, ERR_PAGINATION_OUT_OF_RANGE, ERR_DETERMINATION_NOT_FOUND]
  - method: GET
    path: /public-notifications/{id}
    roles: [UtilityAdmin, SamplingTechnician, LaboratoryManager, ComplianceOfficer, TreatmentEngineer, FinanceOfficer, StateRegulator]
    input: []
    output: PublicNotification
    side_effects: []
    errors: [ERR_UNAUTHENTICATED, ERR_NOTIFICATION_NOT_FOUND]
  - method: POST
    path: /public-notifications/{id}/submit
    roles: [ComplianceOfficer]
    input: [content_elements, delivery_methods]
    output: PublicNotification
    side_effects:
      - "status DRAFT -> SUBMITTED, content_elements and delivery_methods stored, drafted_by_user_id = X-User-ID"
    errors: [ERR_UNAUTHENTICATED, ERR_FORBIDDEN_ROLE, ERR_NOTIFICATION_NOT_FOUND, ERR_INVALID_REQUEST, ERR_NOTIFICATION_STATE_INVALID, ERR_NOTIFICATION_REVISION_LIMIT, ERR_NOTIFICATION_CONTENT_INCOMPLETE, ERR_DELIVERY_METHOD_INSUFFICIENT]
  - method: POST
    path: /public-notifications/{id}/review
    roles: [StateRegulator]
    input: [approve, "review_note?"]
    output: PublicNotification
    side_effects:
      - "approve true -> APPROVED; approve false -> DRAFT with revision_count += 1 and the content and delivery arrays cleared"
    errors: [ERR_UNAUTHENTICATED, ERR_FORBIDDEN_ROLE, ERR_NOTIFICATION_NOT_FOUND, ERR_INVALID_REQUEST, ERR_NOTIFICATION_STATE_INVALID]
  - method: POST
    path: /public-notifications/{id}/certify-distribution
    roles: [ComplianceOfficer]
    input: [delivery_evidence_ref]
    output: PublicNotification
    side_effects:
      - "On or before required_by_at -> DISTRIBUTED with late_by_hours 0; after it -> LATE_DISTRIBUTED with late_by_hours = ceil(overrun in hours)"
      - "distributed_at = logical clock, certified_by_user_id = X-User-ID"
    errors: [ERR_UNAUTHENTICATED, ERR_FORBIDDEN_ROLE, ERR_NOTIFICATION_NOT_FOUND, ERR_INVALID_REQUEST, ERR_NOTIFICATION_STATE_INVALID, ERR_SEGREGATION_OF_DUTIES]

  # --- TreatmentEvaluation --------------------------------------------------
  - method: POST
    path: /treatment-evaluations
    roles: [TreatmentEngineer]
    input: [entry_point_id, "residuals_budget_cents?"]
    output: TreatmentEvaluation
    side_effects:
      - "status SCREENING, mandated false (an evaluation opened by hand is voluntary; only the violation cascade sets mandated true)"
    errors: [ERR_UNAUTHENTICATED, ERR_FORBIDDEN_ROLE, ERR_INVALID_REQUEST, ERR_ENTRY_POINT_NOT_FOUND]
  - method: GET
    path: /treatment-evaluations
    roles: [UtilityAdmin, SamplingTechnician, LaboratoryManager, ComplianceOfficer, TreatmentEngineer, FinanceOfficer, StateRegulator]
    input: ["entry_point_id?", "status?", "mandated?", "limit?", "offset?"]
    output: TreatmentEvaluation[]
    side_effects: []
    errors: [ERR_UNAUTHENTICATED, ERR_PAGINATION_OUT_OF_RANGE, ERR_ENTRY_POINT_NOT_FOUND]
  - method: GET
    path: /treatment-evaluations/{id}
    roles: [UtilityAdmin, SamplingTechnician, LaboratoryManager, ComplianceOfficer, TreatmentEngineer, FinanceOfficer, StateRegulator]
    input: []
    output: TreatmentEvaluation
    side_effects: []
    errors: [ERR_UNAUTHENTICATED, ERR_EVALUATION_NOT_FOUND]
  - method: POST
    path: /treatment-evaluations/{id}/decision
    roles: [TreatmentEngineer]
    input: [action, "decision_note?"]
    output: TreatmentEvaluation
    side_effects:
      - "SELECT -> status SELECTED, selected_technology set, the winning PilotTest.selected becomes true"
      - "SELECT -> a CapitalProject is created with the per-technology disposal route and permit flag and the full rate-impact ladder evaluated"
      - "ABANDON -> status REJECTED_ALL and EntryPoint.treatment_status returns to NONE"
    errors: [ERR_UNAUTHENTICATED, ERR_FORBIDDEN_ROLE, ERR_EVALUATION_NOT_FOUND, ERR_INVALID_REQUEST, ERR_EVALUATION_STATE_INVALID, ERR_INSUFFICIENT_PILOT_EVIDENCE, ERR_NO_QUALIFYING_TECHNOLOGY]

  # --- PilotTest ------------------------------------------------------------
  - method: POST
    path: /pilot-tests
    roles: [TreatmentEngineer]
    input: [treatment_evaluation_id, technology, window_start_at, window_end_at, ebct_min, lifecycle_cost_cents, capital_cost_estimate_cents, annual_om_estimate_cents, residuals_burden_score, footprint_score, om_complexity_score]
    output: PilotTest
    side_effects:
      - "status PLANNED, unmanifested_media_kg 0.00, selected false"
      - "The parent TreatmentEvaluation moves SCREENING -> PILOTING on the first pilot and EntryPoint.treatment_status becomes PILOT"
    errors: [ERR_UNAUTHENTICATED, ERR_FORBIDDEN_ROLE, ERR_INVALID_REQUEST, ERR_EVALUATION_NOT_FOUND, ERR_EVALUATION_STATE_INVALID, ERR_PILOT_WINDOW_CONFLICT]
  - method: GET
    path: /pilot-tests
    roles: [UtilityAdmin, SamplingTechnician, LaboratoryManager, ComplianceOfficer, TreatmentEngineer, FinanceOfficer, StateRegulator]
    input: ["treatment_evaluation_id?", "technology?", "status?", "selected?", "limit?", "offset?"]
    output: PilotTest[]
    side_effects: []
    errors: [ERR_UNAUTHENTICATED, ERR_PAGINATION_OUT_OF_RANGE, ERR_EVALUATION_NOT_FOUND]
  - method: GET
    path: /pilot-tests/{id}
    roles: [UtilityAdmin, SamplingTechnician, LaboratoryManager, ComplianceOfficer, TreatmentEngineer, FinanceOfficer, StateRegulator]
    input: []
    output: PilotTest
    side_effects: []
    errors: [ERR_UNAUTHENTICATED, ERR_PILOT_NOT_FOUND]
  - method: POST
    path: /pilot-tests/{id}/start
    roles: [TreatmentEngineer]
    input: []
    output: PilotTest
    side_effects:
      - "status PLANNED -> RUNNING"
    errors: [ERR_UNAUTHENTICATED, ERR_FORBIDDEN_ROLE, ERR_PILOT_NOT_FOUND, ERR_PILOT_STATE_INVALID, ERR_PILOT_WINDOW_NOT_STARTED]
  - method: POST
    path: /pilot-tests/{id}/complete
    roles: [TreatmentEngineer]
    input: [influent_ng_per_l, effluent_ng_per_l, bed_volumes_treated, spent_media_kg]
    output: PilotTest
    side_effects:
      - "status RUNNING -> COMPLETED, the four measurements stored"
      - "unmanifested_media_kg = spent_media_kg; removal_pct, lifecycle_cost_score and technology_score computed"
    errors: [ERR_UNAUTHENTICATED, ERR_FORBIDDEN_ROLE, ERR_PILOT_NOT_FOUND, ERR_INVALID_REQUEST, ERR_PILOT_STATE_INVALID, ERR_EFFLUENT_EXCEEDS_INFLUENT]

  # --- ResidualsManifest ----------------------------------------------------
  - method: POST
    path: /residuals-manifests
    roles: [TreatmentEngineer]
    input: [pilot_test_id, media_type, mass_kg]
    output: ResidualsManifest
    side_effects:
      - "status DRAFT; PilotTest.unmanifested_media_kg -= mass_kg"
    errors: [ERR_UNAUTHENTICATED, ERR_FORBIDDEN_ROLE, ERR_INVALID_REQUEST, ERR_PILOT_NOT_FOUND, ERR_PILOT_NOT_COMPLETED, ERR_MEDIA_TYPE_MISMATCH, ERR_MASS_EXCEEDS_SPENT_MEDIA]
  - method: GET
    path: /residuals-manifests
    roles: [UtilityAdmin, SamplingTechnician, LaboratoryManager, ComplianceOfficer, TreatmentEngineer, FinanceOfficer, StateRegulator]
    input: ["pilot_test_id?", "status?", "waste_classification?", "limit?", "offset?"]
    output: ResidualsManifest[]
    side_effects: []
    errors: [ERR_UNAUTHENTICATED, ERR_PAGINATION_OUT_OF_RANGE, ERR_PILOT_NOT_FOUND]
  - method: GET
    path: /residuals-manifests/{id}
    roles: [UtilityAdmin, SamplingTechnician, LaboratoryManager, ComplianceOfficer, TreatmentEngineer, FinanceOfficer, StateRegulator]
    input: []
    output: ResidualsManifest
    side_effects: []
    errors: [ERR_UNAUTHENTICATED, ERR_MANIFEST_NOT_FOUND]
  - method: POST
    path: /residuals-manifests/{id}/classify
    roles: [StateRegulator]
    input: [leachate_pfas_ng_per_l]
    output: ResidualsManifest
    side_effects:
      - "status DRAFT -> CLASSIFIED, waste_classification derived from the leachate concentration, classified_by_user_id = X-User-ID"
    errors: [ERR_UNAUTHENTICATED, ERR_FORBIDDEN_ROLE, ERR_MANIFEST_NOT_FOUND, ERR_INVALID_REQUEST, ERR_MANIFEST_STATE_INVALID]
  - method: POST
    path: /residuals-manifests/{id}/ship
    roles: [TreatmentEngineer]
    input: [disposal_method, carrier_ref]
    output: ResidualsManifest
    side_effects:
      - "status CLASSIFIED -> SHIPPED, disposal_cost_cents computed, TreatmentEvaluation.residuals_spent_cents += disposal_cost_cents"
    errors: [ERR_UNAUTHENTICATED, ERR_FORBIDDEN_ROLE, ERR_MANIFEST_NOT_FOUND, ERR_INVALID_REQUEST, ERR_MANIFEST_STATE_INVALID, ERR_DISPOSAL_METHOD_PROHIBITED, ERR_RESIDUALS_BUDGET_EXCEEDED]
  - method: POST
    path: /residuals-manifests/{id}/void
    roles: [TreatmentEngineer]
    input: [void_reason_code]
    output: ResidualsManifest
    side_effects:
      - "status -> VOIDED; PilotTest.unmanifested_media_kg += mass_kg, restoring the residuals mass invariant exactly"
    errors: [ERR_UNAUTHENTICATED, ERR_FORBIDDEN_ROLE, ERR_MANIFEST_NOT_FOUND, ERR_INVALID_REQUEST, ERR_MANIFEST_STATE_INVALID]

  # --- CapitalProject -------------------------------------------------------
  - method: GET
    path: /capital-projects
    roles: [UtilityAdmin, SamplingTechnician, LaboratoryManager, ComplianceOfficer, TreatmentEngineer, FinanceOfficer, StateRegulator]
    input: ["entry_point_id?", "treatment_evaluation_id?", "funding_status?", "construction_status?", "limit?", "offset?"]
    output: CapitalProject[]
    side_effects: []
    errors: [ERR_UNAUTHENTICATED, ERR_PAGINATION_OUT_OF_RANGE, ERR_ENTRY_POINT_NOT_FOUND, ERR_EVALUATION_NOT_FOUND]
  - method: GET
    path: /capital-projects/{id}
    roles: [UtilityAdmin, SamplingTechnician, LaboratoryManager, ComplianceOfficer, TreatmentEngineer, FinanceOfficer, StateRegulator]
    input: []
    output: CapitalProject
    side_effects: []
    errors: [ERR_UNAUTHENTICATED, ERR_PROJECT_NOT_FOUND]
  - method: PATCH
    path: /capital-projects/{id}
    roles: [FinanceOfficer]
    input: ["capital_cost_cents?", "annual_om_cost_cents?", "rate_design?"]
    output: CapitalProject
    side_effects:
      - "Any supplied field is stored and the entire seven-step rate-impact ladder plus both bill-impact variants are recomputed"
      - "monthly_bill_increase_cents follows rate_design"
    errors: [ERR_UNAUTHENTICATED, ERR_FORBIDDEN_ROLE, ERR_PROJECT_NOT_FOUND, ERR_INVALID_REQUEST, ERR_PROJECT_IN_SERVICE]
  - method: POST
    path: /capital-projects/{id}/construction-status
    roles: [FinanceOfficer]
    input: [target_status, "concentrate_permit_ref?"]
    output: CapitalProject
    side_effects:
      - "construction_status advances one step; IN_SERVICE also sets EntryPoint.treatment_status to INSTALLED and freezes the project's costs"
    errors: [ERR_UNAUTHENTICATED, ERR_FORBIDDEN_ROLE, ERR_PROJECT_NOT_FOUND, ERR_INVALID_REQUEST, ERR_PROJECT_STATE_INVALID, ERR_CONCENTRATE_PERMIT_REQUIRED, ERR_FUNDING_NOT_SECURED]
  - method: POST
    path: /capital-projects/{id}/funding-applications
    roles: [FinanceOfficer]
    input: [program, amount_requested_cents, "disadvantaged_community?", expected_capital_project_version]
    output: FundingApplication
    side_effects:
      - "A FundingApplication is created directly in SUBMITTED with forgiveness_pct resolved from the program and the disadvantaged flag"
      - "CapitalProject.funding_status is re-derived and CapitalProject.version increments"
    errors: [ERR_UNAUTHENTICATED, ERR_FORBIDDEN_ROLE, ERR_PROJECT_NOT_FOUND, ERR_INVALID_REQUEST, ERR_STALE_CAPITAL_PROJECT_VERSION]

  # --- FundingApplication ---------------------------------------------------
  - method: GET
    path: /funding-applications
    roles: [UtilityAdmin, SamplingTechnician, LaboratoryManager, ComplianceOfficer, TreatmentEngineer, FinanceOfficer, StateRegulator]
    input: ["capital_project_id?", "program?", "status?", "limit?", "offset?"]
    output: FundingApplication[]
    side_effects: []
    errors: [ERR_UNAUTHENTICATED, ERR_PAGINATION_OUT_OF_RANGE, ERR_PROJECT_NOT_FOUND]
  - method: GET
    path: /funding-applications/{id}
    roles: [UtilityAdmin, SamplingTechnician, LaboratoryManager, ComplianceOfficer, TreatmentEngineer, FinanceOfficer, StateRegulator]
    input: []
    output: FundingApplication
    side_effects: []
    errors: [ERR_UNAUTHENTICATED, ERR_APPLICATION_NOT_FOUND]
  - method: POST
    path: /funding-applications/{id}/decision
    roles: [StateRegulator]
    input: [action, "awarded_cents?", "decision_note?"]
    output: FundingApplication
    side_effects:
      - "AWARD -> status AWARDED, awarded_cents and forgiven_cents stored, the project's funding ledger and rate-impact ladder recomputed"
      - "DENY -> status DENIED with no money movement"
    errors: [ERR_UNAUTHENTICATED, ERR_FORBIDDEN_ROLE, ERR_APPLICATION_NOT_FOUND, ERR_INVALID_REQUEST, ERR_APPLICATION_STATE_INVALID, ERR_AWARD_EXCEEDS_REQUEST, ERR_AWARD_EXCEEDS_PROJECT_COST]
  - method: POST
    path: /funding-applications/{id}/withdraw
    roles: [FinanceOfficer]
    input: [withdraw_reason]
    output: FundingApplication
    side_effects:
      - "status -> WITHDRAWN, awarded_cents and forgiven_cents cleared"
      - "The project's funding ledger and rate-impact ladder return to their pre-award values"
    errors: [ERR_UNAUTHENTICATED, ERR_FORBIDDEN_ROLE, ERR_APPLICATION_NOT_FOUND, ERR_INVALID_REQUEST, ERR_APPLICATION_STATE_INVALID, ERR_PROJECT_STATE_INVALID]

  # --- CostRecoveryClaim ----------------------------------------------------
  - method: POST
    path: /cost-recovery-claims
    roles: [ComplianceOfficer]
    input: [entry_point_id, capital_project_id, responsible_party_name, investigation_basis, allocation_pct, investigation_cost_cents]
    output: CostRecoveryClaim
    side_effects:
      - "status INVESTIGATING, claim_basis_cents computed from the project cost, the investigation spend and allocation_pct"
    errors: [ERR_UNAUTHENTICATED, ERR_FORBIDDEN_ROLE, ERR_INVALID_REQUEST, ERR_ENTRY_POINT_NOT_FOUND, ERR_PROJECT_NOT_FOUND, ERR_ENTRY_POINT_MISMATCH]
  - method: GET
    path: /cost-recovery-claims
    roles: [UtilityAdmin, SamplingTechnician, LaboratoryManager, ComplianceOfficer, TreatmentEngineer, FinanceOfficer, StateRegulator]
    input: ["entry_point_id?", "capital_project_id?", "status?", "limit?", "offset?"]
    output: CostRecoveryClaim[]
    side_effects: []
    errors: [ERR_UNAUTHENTICATED, ERR_PAGINATION_OUT_OF_RANGE, ERR_ENTRY_POINT_NOT_FOUND, ERR_PROJECT_NOT_FOUND]
  - method: GET
    path: /cost-recovery-claims/{id}
    roles: [UtilityAdmin, SamplingTechnician, LaboratoryManager, ComplianceOfficer, TreatmentEngineer, FinanceOfficer, StateRegulator]
    input: []
    output: CostRecoveryClaim
    side_effects: []
    errors: [ERR_UNAUTHENTICATED, ERR_CLAIM_NOT_FOUND]
  - method: POST
    path: /cost-recovery-claims/{id}/file
    roles: [ComplianceOfficer]
    input: [claimed_cents]
    output: CostRecoveryClaim
    side_effects:
      - "status INVESTIGATING -> CLAIM_FILED, claimed_cents stored, filed_at = logical clock"
    errors: [ERR_UNAUTHENTICATED, ERR_FORBIDDEN_ROLE, ERR_CLAIM_NOT_FOUND, ERR_INVALID_REQUEST, ERR_CLAIM_STATE_INVALID]
  - method: POST
    path: /cost-recovery-claims/{id}/resolve
    roles: [FinanceOfficer]
    input: [action, "recovered_cents?", "resolution_note?"]
    output: CostRecoveryClaim
    side_effects:
      - "SETTLE -> status SETTLED, the four waterfall buckets computed and summing to recovered_cents"
      - "SETTLE -> CapitalProject.recovered_cents += alloc_capital_cents and the rate-impact ladder recomputed"
      - "DISMISS -> status DISMISSED with every bucket 0 and no project change"
    errors: [ERR_UNAUTHENTICATED, ERR_FORBIDDEN_ROLE, ERR_CLAIM_NOT_FOUND, ERR_INVALID_REQUEST, ERR_CLAIM_STATE_INVALID, ERR_RECOVERY_EXCEEDS_CLAIM]

# =============================================================================
# §1.6 Error Catalog
# =============================================================================
# 79 error identifiers. `priority` matches the §1.4 ladder; NOT_FOUND rows share
# priority 5 (path) / 8 (body or filter reference) depending on where the id came from.

errors:

  # --- authentication / authorization / ownership ----------------------------
  - error_id: ERR_UNAUTHENTICATED
    http_status: 401
    category: auth
    priority: 1
    message_template: "Authentication headers are missing or unrecognised."
    triggered_by: "Absent, blank or whitespace-only X-User-ID or X-Role, or an X-Role outside the seven declared roles."
  - error_id: ERR_FORBIDDEN_ROLE
    http_status: 403
    category: auth
    priority: 3
    message_template: "Role {role} may not call {method} {path}."
    triggered_by: "Any endpoint invoked with a role outside its roles list."
  - error_id: ERR_LABORATORY_NOT_OWNED
    http_status: 403
    category: ownership
    priority: 4
    message_template: "X-User-ID {user_id} does not identify a registered laboratory."
    triggered_by: "A LaboratoryManager whose X-User-ID is not a Laboratory.id."
  - error_id: ERR_LABORATORY_ASSIGNMENT_MISMATCH
    http_status: 403
    category: ownership
    priority: 9
    message_template: "Sample {sample_id} is assigned to laboratory {assigned}, not {actor}."
    triggered_by: "A laboratory receiving or reporting on a sample shipped to a different laboratory."
  - error_id: ERR_SEGREGATION_OF_DUTIES
    http_status: 403
    category: business_safety
    priority: 64
    message_template: "User {user_id} drafted this notification and may not certify its distribution."
    triggered_by: "certify-distribution called by the same X-User-ID that submitted the draft."

  # --- shape / pagination ---------------------------------------------------
  - error_id: ERR_INVALID_REQUEST
    http_status: 422
    category: shape
    priority: 6
    message_template: "Request body failed validation: {detail}."
    triggered_by: "Missing required field, unknown enum member, wrong type, out-of-range number, excess decimal places, malformed instant or malformed YYYYQn period."
  - error_id: ERR_PAGINATION_OUT_OF_RANGE
    http_status: 422
    category: shape
    priority: 7
    message_template: "limit must be between 1 and 100 and offset must be at least 0."
    triggered_by: "limit 0, limit 101, or a negative offset on any list endpoint."

  # --- existence ------------------------------------------------------------
  - error_id: ERR_CONTAMINANT_NOT_FOUND
    http_status: 404
    category: existence
    priority: 5
    message_template: "Contaminant {id} does not exist."
    triggered_by: "Unknown contaminant id in a path, a sample panel, a result body or a list filter."
  - error_id: ERR_LABORATORY_NOT_FOUND
    http_status: 404
    category: existence
    priority: 5
    message_template: "Laboratory {id} does not exist."
    triggered_by: "Unknown laboratory id in a path, in a ship body or in a list filter."
  - error_id: ERR_ENTRY_POINT_NOT_FOUND
    http_status: 404
    category: existence
    priority: 5
    message_template: "Entry point {id} does not exist."
    triggered_by: "Unknown entry point id in a path, a body or a list filter."
  - error_id: ERR_SAMPLE_NOT_FOUND
    http_status: 404
    category: existence
    priority: 5
    message_template: "Sample {id} does not exist."
    triggered_by: "Unknown sample id in a path, in resample_of_sample_id, in a result body or in a list filter."
  - error_id: ERR_LAB_RESULT_NOT_FOUND
    http_status: 404
    category: existence
    priority: 5
    message_template: "Lab result {id} does not exist."
    triggered_by: "Unknown lab result id in a path."
  - error_id: ERR_DETERMINATION_NOT_FOUND
    http_status: 404
    category: existence
    priority: 5
    message_template: "Compliance determination {id} does not exist."
    triggered_by: "Unknown determination id in a path or a notification list filter."
  - error_id: ERR_NOTIFICATION_NOT_FOUND
    http_status: 404
    category: existence
    priority: 5
    message_template: "Public notification {id} does not exist."
    triggered_by: "Unknown notification id in a path."
  - error_id: ERR_EVALUATION_NOT_FOUND
    http_status: 404
    category: existence
    priority: 5
    message_template: "Treatment evaluation {id} does not exist."
    triggered_by: "Unknown evaluation id in a path, a pilot body or a list filter."
  - error_id: ERR_PILOT_NOT_FOUND
    http_status: 404
    category: existence
    priority: 5
    message_template: "Pilot test {id} does not exist."
    triggered_by: "Unknown pilot id in a path, a manifest body or a list filter."
  - error_id: ERR_MANIFEST_NOT_FOUND
    http_status: 404
    category: existence
    priority: 5
    message_template: "Residuals manifest {id} does not exist."
    triggered_by: "Unknown manifest id in a path."
  - error_id: ERR_PROJECT_NOT_FOUND
    http_status: 404
    category: existence
    priority: 5
    message_template: "Capital project {id} does not exist."
    triggered_by: "Unknown project id in a path, a claim body or a list filter."
  - error_id: ERR_APPLICATION_NOT_FOUND
    http_status: 404
    category: existence
    priority: 5
    message_template: "Funding application {id} does not exist."
    triggered_by: "Unknown application id in a path."
  - error_id: ERR_CLAIM_NOT_FOUND
    http_status: 404
    category: existence
    priority: 5
    message_template: "Cost recovery claim {id} does not exist."
    triggered_by: "Unknown claim id in a path."

  # --- concurrency ----------------------------------------------------------
  - error_id: ERR_STALE_ENTRY_POINT_VERSION
    http_status: 412
    category: concurrency
    priority: 10
    message_template: "Entry point {id} is at version {actual}; {expected} was supplied."
    triggered_by: "POST /compliance-determinations with an expected_entry_point_version that is no longer current."
  - error_id: ERR_STALE_CAPITAL_PROJECT_VERSION
    http_status: 412
    category: concurrency
    priority: 11
    message_template: "Capital project {id} is at version {actual}; {expected} was supplied."
    triggered_by: "POST /capital-projects/{id}/funding-applications with a stale expected_capital_project_version."

  # --- state ----------------------------------------------------------------
  - error_id: ERR_MONITORING_SUSPENDED
    http_status: 422
    category: state
    priority: 20
    message_template: "Entry point {id} has suspended monitoring; no samples may be collected."
    triggered_by: "POST /samples against a SUSPENDED entry point."
  - error_id: ERR_SAMPLE_STATE_INVALID
    http_status: 422
    category: state
    priority: 21
    message_template: "Sample {id} is {status}; this action requires {required}."
    triggered_by: "ship on a non-COLLECTED sample, receive on a non-IN_TRANSIT sample, invalidate outside RECEIVED/ANALYZED, reinstate on a non-INVALIDATED sample."
  - error_id: ERR_INVALIDATION_NOT_REVERSIBLE
    http_status: 422
    category: state
    priority: 22
    message_template: "Sample {id} was invalidated for {reason} and cannot be reinstated."
    triggered_by: "reinstate on a sample whose invalidation_reason is not OPERATOR_ERROR."
  - error_id: ERR_RESULT_STATE_INVALID
    http_status: 422
    category: state
    priority: 23
    message_template: "Lab result {id} is {status}; only SUBMITTED results may be reviewed."
    triggered_by: "A second review of the same result."
  - error_id: ERR_DETERMINATION_STATE_INVALID
    http_status: 422
    category: state
    priority: 24
    message_template: "Determination {id} is {status}; this action requires {required}."
    triggered_by: "issue on a non-DRAFT determination, rescind on a non-ISSUED determination."
  - error_id: ERR_NOTIFICATION_STATE_INVALID
    http_status: 422
    category: state
    priority: 25
    message_template: "Notification {id} is {status}; this action requires {required}."
    triggered_by: "submit outside DRAFT, review outside SUBMITTED, certify-distribution outside APPROVED."
  - error_id: ERR_EVALUATION_STATE_INVALID
    http_status: 422
    category: state
    priority: 26
    message_template: "Treatment evaluation {id} is {status}; this action requires PILOTING."
    triggered_by: "A decision on a SCREENING, SELECTED or REJECTED_ALL evaluation, or a new pilot on a terminal evaluation."
  - error_id: ERR_PILOT_STATE_INVALID
    http_status: 422
    category: state
    priority: 27
    message_template: "Pilot {id} is {status}; this action requires {required}."
    triggered_by: "start on a non-PLANNED pilot, complete on a non-RUNNING pilot."
  - error_id: ERR_MANIFEST_STATE_INVALID
    http_status: 422
    category: state
    priority: 28
    message_template: "Manifest {id} is {status}; this action requires {required}."
    triggered_by: "classify outside DRAFT, ship outside CLASSIFIED, void outside DRAFT/CLASSIFIED."
  - error_id: ERR_APPLICATION_STATE_INVALID
    http_status: 422
    category: state
    priority: 29
    message_template: "Funding application {id} is {status}; this action requires {required}."
    triggered_by: "A second decision on the same application, or a withdrawal of a DENIED or WITHDRAWN application."
  - error_id: ERR_CLAIM_STATE_INVALID
    http_status: 422
    category: state
    priority: 30
    message_template: "Claim {id} is {status}; this action requires {required}."
    triggered_by: "file outside INVESTIGATING, settle outside CLAIM_FILED, dismiss on an already resolved claim."
  - error_id: ERR_MONITORING_STATE_INVALID
    http_status: 422
    category: state
    priority: 31
    message_template: "Entry point {id} is in monitoring status {status}; this action requires {required}."
    triggered_by: "A reduction request outside QUARTERLY, a reduction decision with nothing pending, SUSPEND on an already suspended entry point, RESUME on one that is not suspended."
  - error_id: ERR_PROJECT_STATE_INVALID
    http_status: 422
    category: state
    priority: 32
    message_template: "Capital project {id} is {status}; {target} is not reachable from here."
    triggered_by: "A construction-status jump that skips a step or moves backwards, or a funding withdrawal once the project has left PLANNED."
  - error_id: ERR_PROJECT_IN_SERVICE
    http_status: 422
    category: state
    priority: 33
    message_template: "Capital project {id} is in service; its costs are frozen."
    triggered_by: "PATCH /capital-projects/{id} on an IN_SERVICE project."
  - error_id: ERR_SAMPLE_NOT_RECEIVED
    http_status: 422
    category: state
    priority: 34
    message_template: "Sample {id} is {status}; results require a RECEIVED sample."
    triggered_by: "POST /lab-results or a review while the parent sample is COLLECTED, IN_TRANSIT, ANALYZED or INVALIDATED."

  # --- business_safety ------------------------------------------------------
  - error_id: ERR_PROHIBITED_SAMPLING_MATERIAL
    http_status: 422
    category: business_safety
    priority: 60
    message_template: "Collection kits with fluoropolymer wetted parts are prohibited."
    triggered_by: "POST /samples with ptfe_free_kit false."
  - error_id: ERR_FIELD_BLANK_REQUIRED
    http_status: 422
    category: business_safety
    priority: 61
    message_template: "A paired field blank is mandatory for every collection."
    triggered_by: "POST /samples with field_blank_included false."
  - error_id: ERR_DISPOSAL_METHOD_PROHIBITED
    http_status: 422
    category: business_safety
    priority: 62
    message_template: "{disposal_method} is not permitted for {waste_classification} media."
    triggered_by: "Shipping HAZARDOUS media to LANDFILL or REACTIVATION, or SPECIAL_WASTE to LANDFILL."
  - error_id: ERR_CONCENTRATE_PERMIT_REQUIRED
    http_status: 422
    category: business_safety
    priority: 63
    message_template: "Project {id} needs a concentrate discharge permit reference before bidding."
    triggered_by: "Advancing an RO project to BIDDING without concentrate_permit_ref."

  # --- business_referential -------------------------------------------------
  - error_id: ERR_CONTAMINANT_NOT_IN_PANEL
    http_status: 422
    category: business_referential
    priority: 70
    message_template: "Contaminant {contaminant_id} is not in the panel of sample {sample_id}."
    triggered_by: "A result for a contaminant the sample was never collected for."
  - error_id: ERR_METHOD_NOT_CERTIFIED
    http_status: 422
    category: business_referential
    priority: 71
    message_template: "Laboratory {id} is not certified for {method}."
    triggered_by: "A result reported with a method outside certified_methods."
  - error_id: ERR_DETECTION_LIMIT_TOO_HIGH
    http_status: 422
    category: business_referential
    priority: 72
    message_template: "Detection limit {dl} exceeds the required reporting level {mrl} for {contaminant}."
    triggered_by: "A laboratory whose achievable detection limit is coarser than the contaminant's required MRL."
  - error_id: ERR_DETECTION_LIMIT_BELOW_CAPABILITY
    http_status: 422
    category: business_referential
    priority: 73
    message_template: "Detection limit {dl} is below laboratory {id}'s achievable limit {floor}."
    triggered_by: "A physically impossible detection limit."
  - error_id: ERR_DUPLICATE_PERIOD_RESULT
    http_status: 422
    category: business_referential
    priority: 74
    message_template: "An accepted result already exists for {contaminant} at {entry_point} in {period}."
    triggered_by: "Accepting a second result for a (entry point, contaminant, monitoring period) triple."
  - error_id: ERR_RESAMPLE_TARGET_NOT_INVALIDATED
    http_status: 422
    category: business_referential
    priority: 75
    message_template: "Sample {id} is {status}; only an invalidated sample may be resampled."
    triggered_by: "resample_of_sample_id pointing at a live sample."
  - error_id: ERR_PILOT_NOT_COMPLETED
    http_status: 422
    category: business_referential
    priority: 76
    message_template: "Pilot {id} is {status}; residuals may only be manifested from a completed pilot."
    triggered_by: "POST /residuals-manifests for a PLANNED or RUNNING pilot."
  - error_id: ERR_MEDIA_TYPE_MISMATCH
    http_status: 422
    category: business_referential
    priority: 77
    message_template: "{media_type} is not a residual stream of a {technology} pilot."
    triggered_by: "An IX_RESIN manifest on a GAC pilot, a GAC_CARBON manifest on an RO pilot, and so on."
  - error_id: ERR_FUNDING_NOT_SECURED
    http_status: 422
    category: business_referential
    priority: 78
    message_template: "Project {id} has funding status {status}; bidding requires AWARDED."
    triggered_by: "Advancing to BIDDING with no awarded application."
  - error_id: ERR_ENTRY_POINT_MISMATCH
    http_status: 422
    category: business_referential
    priority: 79
    message_template: "Entry point {claim_ep} does not match project {project_id}'s entry point {project_ep}."
    triggered_by: "A cost recovery claim that pairs a project with the wrong entry point."

  # --- business_temporal ----------------------------------------------------
  - error_id: ERR_HOLDING_TIME_EXCEEDED
    http_status: 422
    category: business_temporal
    priority: 80
    message_template: "{hours} hours elapsed since collection; {method} allows {limit}."
    triggered_by: "analyzed_at more than the method's holding time after collected_at."
  - error_id: ERR_LABORATORY_CERTIFICATION_EXPIRED
    http_status: 422
    category: business_temporal
    priority: 81
    message_template: "Laboratory {id}'s certification lapsed on {expires_on}."
    triggered_by: "analyzed_at at or after certification_expires_on."
  - error_id: ERR_ANALYZED_BEFORE_COLLECTION
    http_status: 422
    category: business_temporal
    priority: 82
    message_template: "analyzed_at {analyzed_at} precedes collection {collected_at}."
    triggered_by: "A backdated analysis instant."
  - error_id: ERR_COLLECTED_IN_FUTURE
    http_status: 422
    category: business_temporal
    priority: 83
    message_template: "collected_at {collected_at} is after the current instant {now}."
    triggered_by: "POST /samples with a future collection instant."
  - error_id: ERR_MONITORING_PERIOD_MISMATCH
    http_status: 422
    category: business_temporal
    priority: 84
    message_template: "collected_at {collected_at} falls in {actual_period}, not {monitoring_period}."
    triggered_by: "A period label that disagrees with the collection quarter."
  - error_id: ERR_SHIP_BEFORE_COLLECTION
    http_status: 422
    category: business_temporal
    priority: 85
    message_template: "The current instant {now} precedes collection {collected_at}."
    triggered_by: "Shipping after the clock has been rewound behind the collection instant."
  - error_id: ERR_PILOT_WINDOW_CONFLICT
    http_status: 422
    category: business_temporal
    priority: 86
    message_template: "Pilot {id} occupies {start} to {end}; a {buffer}-hour decontamination gap is required on both sides."
    triggered_by: "A second pilot skid window at the same entry point that overlaps an existing window widened by the decontamination buffer."
  - error_id: ERR_PILOT_WINDOW_NOT_STARTED
    http_status: 422
    category: business_temporal
    priority: 87
    message_template: "Pilot {id} cannot start before {window_start_at}."
    triggered_by: "start called while the logical clock is before window_start_at."

  # --- business_constraint --------------------------------------------------
  - error_id: ERR_VIOLATION_PENDING_BLOCKS_REDUCTION
    http_status: 422
    category: business_constraint
    priority: 90
    message_template: "Entry point {id} has a pending violation; monitoring may not be reduced."
    triggered_by: "A reduction request or approval while compliance_posture is VIOLATION_PENDING."
  - error_id: ERR_OPEN_VIOLATION_BLOCKS_REDUCTION
    http_status: 422
    category: business_constraint
    priority: 91
    message_template: "Entry point {id} has {count} open violation determinations."
    triggered_by: "A reduction request while open_violation_count > 0."
  - error_id: ERR_INSUFFICIENT_MONITORING_HISTORY
    http_status: 422
    category: business_constraint
    priority: 92
    message_template: "{actual} consecutive qualifying quarters; {required} are required."
    triggered_by: "A reduction request with fewer than four consecutive qualifying quarters."
  - error_id: ERR_TRIENNIAL_HISTORY_INSUFFICIENT
    http_status: 422
    category: business_constraint
    priority: 93
    message_template: "Triennial monitoring requires {required} consecutive qualifying quarters; {actual} on record."
    triggered_by: "target_status TRIENNIAL with between four and seven qualifying quarters."
  - error_id: ERR_LAB_DAILY_CAPACITY_EXCEEDED
    http_status: 422
    category: business_constraint
    priority: 94
    message_template: "Laboratory {id} already holds {count} analyses dated {day}; capacity is {capacity}."
    triggered_by: "One result too many inside a single UTC calendar day of analyzed_at."
  - error_id: ERR_INSUFFICIENT_PILOT_EVIDENCE
    http_status: 422
    category: business_constraint
    priority: 95
    message_template: "{actual} completed pilots; {required} are required to decide."
    triggered_by: "A decision with fewer than two completed pilots."
  - error_id: ERR_NO_QUALIFYING_TECHNOLOGY
    http_status: 422
    category: business_constraint
    priority: 96
    message_template: "No completed pilot reached the {required} percent removal floor."
    triggered_by: "SELECT when every completed pilot is below MIN_REMOVAL_PCT."
  - error_id: ERR_NO_QUALIFYING_RESULTS
    http_status: 422
    category: business_constraint
    priority: 97
    message_template: "Determination {id} used zero quarters of data and cannot be issued."
    triggered_by: "issue on a determination whose window contained no accepted results."
  - error_id: ERR_NOTIFICATION_REVISION_LIMIT
    http_status: 422
    category: business_constraint
    priority: 98
    message_template: "Notification {id} has been revised {count} times; the limit is {limit}."
    triggered_by: "A fourth submit after three regulator rejections."
  - error_id: ERR_NOTIFICATION_CONTENT_INCOMPLETE
    http_status: 422
    category: business_constraint
    priority: 99
    message_template: "Missing mandatory content elements: {missing}."
    triggered_by: "submit without every element of MANDATORY_CONTENT_ELEMENTS."
  - error_id: ERR_DELIVERY_METHOD_INSUFFICIENT
    http_status: 422
    category: business_constraint
    priority: 100
    message_template: "Tier {tier} requires delivery by {required}."
    triggered_by: "submit without the tier's mandatory delivery channels."
  - error_id: ERR_MASS_EXCEEDS_SPENT_MEDIA
    http_status: 422
    category: business_constraint
    priority: 101
    message_template: "{mass} kg exceeds the {available} kg still unmanifested on pilot {id}."
    triggered_by: "A manifest that would drive unmanifested_media_kg negative."
  - error_id: ERR_EFFLUENT_EXCEEDS_INFLUENT
    http_status: 422
    category: business_constraint
    priority: 102
    message_template: "Effluent {effluent} exceeds influent {influent}."
    triggered_by: "complete with an effluent concentration above the influent."
  - error_id: ERR_DUPLICATE_ENTRY_POINT_LABEL
    http_status: 422
    category: business_constraint
    priority: 103
    message_template: "Entry point label {label} is already registered."
    triggered_by: "A second entry point with the same label."
  - error_id: ERR_DUPLICATE_CONTAMINANT_CODE
    http_status: 422
    category: business_constraint
    priority: 104
    message_template: "Contaminant code {code} is already registered."
    triggered_by: "A second contaminant with the same code."
  - error_id: ERR_DUPLICATE_CERTIFICATION_ID
    http_status: 422
    category: business_constraint
    priority: 105
    message_template: "Certification id {certification_id} is already registered."
    triggered_by: "A second laboratory with the same certification id."

  # --- business_fiscal ------------------------------------------------------
  - error_id: ERR_RESIDUALS_BUDGET_EXCEEDED
    http_status: 422
    category: business_fiscal
    priority: 110
    message_template: "Disposal would spend {total} cents against a {budget} cent residuals budget."
    triggered_by: "A shipment whose cost pushes residuals_spent_cents past residuals_budget_cents."
  - error_id: ERR_AWARD_EXCEEDS_REQUEST
    http_status: 422
    category: business_fiscal
    priority: 111
    message_template: "Award {awarded} exceeds the {requested} requested."
    triggered_by: "AWARD with awarded_cents above amount_requested_cents."
  - error_id: ERR_AWARD_EXCEEDS_PROJECT_COST
    http_status: 422
    category: business_fiscal
    priority: 112
    message_template: "Total awards {total} would exceed project cost {capital_cost}."
    triggered_by: "An award that over-subscribes the project."
  - error_id: ERR_RECOVERY_EXCEEDS_CLAIM
    http_status: 422
    category: business_fiscal
    priority: 113
    message_template: "Recovery {recovered} exceeds the {claimed} claimed."
    triggered_by: "SETTLE with recovered_cents above claimed_cents."

# =============================================================================
# §1.7 Role-Based Access Control
# =============================================================================
# Seven roles. `identity` states what X-User-ID means for the role: only the
# laboratory role is entity_backed, so only laboratory identity can be checked
# against stored rows. Every other role's X-User-ID is an opaque operator id that
# is recorded (collector, drafter, certifier, classifier, decider) but never
# resolved against an entity table.

roles:

  - name: UtilityAdmin
    identity: opaque
    description: "Registry keeper. Owns reference data and the emergency monitoring switch; never touches sample, laboratory or money workflows."
    exclusive_operations:
      - "POST /contaminants"
      - "POST /laboratories"
      - "POST /entry-points"
      - "POST /entry-points/{id}/monitoring-status"
    shared_operations:
      - "every GET"
      - "POST /_clock/set_current_utc"

  - name: SamplingTechnician
    identity: opaque
    description: "Field crew. Collects and ships samples; the X-User-ID is stored on Sample.collector_user_id purely as provenance."
    exclusive_operations:
      - "POST /samples"
      - "POST /samples/{id}/ship"
    shared_operations:
      - "every GET"
      - "POST /_clock/set_current_utc"

  - name: LaboratoryManager
    identity: "entity_backed:Laboratory"
    description: >-
      Contract laboratory. X-User-ID must equal a Laboratory.id, and every action is additionally
      restricted to samples assigned to that laboratory. This is the only role whose identity is
      resolved against a stored row, giving two distinct 403s: ERR_LABORATORY_NOT_OWNED when the
      header is not a laboratory at all, and ERR_LABORATORY_ASSIGNMENT_MISMATCH when it is the
      wrong laboratory for the sample.
    exclusive_operations:
      - "POST /samples/{id}/receive"
      - "POST /lab-results"
    shared_operations:
      - "every GET"
      - "POST /_clock/set_current_utc"

  - name: ComplianceOfficer
    identity: opaque
    description: >-
      Regulatory compliance staff. Reviews results, freezes determinations, drafts and certifies
      public notifications and opens cost recovery investigations. Subject to segregation of duties:
      the officer who submits a notification draft may not certify its distribution.
    exclusive_operations:
      - "POST /samples/{id}/invalidate"
      - "POST /samples/{id}/reinstate"
      - "POST /lab-results/{id}/review"
      - "POST /compliance-determinations"
      - "POST /compliance-determinations/{id}/issue"
      - "POST /public-notifications/{id}/submit"
      - "POST /public-notifications/{id}/certify-distribution"
      - "POST /entry-points/{id}/monitoring-reduction-requests"
      - "POST /cost-recovery-claims"
      - "POST /cost-recovery-claims/{id}/file"
    shared_operations:
      - "every GET"
      - "POST /_clock/set_current_utc"

  - name: TreatmentEngineer
    identity: opaque
    description: "Process engineering. Runs technology evaluations, pilot skids and the residuals chain up to shipment."
    exclusive_operations:
      - "POST /treatment-evaluations"
      - "POST /treatment-evaluations/{id}/decision"
      - "POST /pilot-tests"
      - "POST /pilot-tests/{id}/start"
      - "POST /pilot-tests/{id}/complete"
      - "POST /residuals-manifests"
      - "POST /residuals-manifests/{id}/ship"
      - "POST /residuals-manifests/{id}/void"
    shared_operations:
      - "every GET"
      - "POST /_clock/set_current_utc"

  - name: FinanceOfficer
    identity: opaque
    description: "Rates and capital finance. Owns project cost adjustments, construction progression, funding applications and recovery settlements."
    exclusive_operations:
      - "PATCH /capital-projects/{id}"
      - "POST /capital-projects/{id}/construction-status"
      - "POST /capital-projects/{id}/funding-applications"
      - "POST /funding-applications/{id}/withdraw"
      - "POST /cost-recovery-claims/{id}/resolve"
    shared_operations:
      - "every GET"
      - "POST /_clock/set_current_utc"

  - name: StateRegulator
    identity: opaque
    description: "Primacy agency. Approves or rejects everything the utility asks for, classifies waste and rescinds determinations."
    exclusive_operations:
      - "POST /compliance-determinations/{id}/rescind"
      - "POST /public-notifications/{id}/review"
      - "POST /entry-points/{id}/monitoring-reduction-decisions"
      - "POST /residuals-manifests/{id}/classify"
      - "POST /funding-applications/{id}/decision"
    shared_operations:
      - "every GET"
      - "POST /_clock/set_current_utc"

segregation_of_duties_rules:
  - name: notification_drafting_versus_certification
    compared_field: "PublicNotification.drafted_by_user_id vs the certifying X-User-ID"
    error_id: ERR_SEGREGATION_OF_DUTIES
    http_status: 403
    note: "Both acts belong to ComplianceOfficer, so the guard is a user-id comparison, not a role check. Two distinct officer ids are required end to end."
