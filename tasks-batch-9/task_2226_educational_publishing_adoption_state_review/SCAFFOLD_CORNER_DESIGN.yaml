            - call: "POST /state-profiles"
              payload: { state_code: "PA", adoption_model: "OPEN_TERRITORY", sampling_copies_required: 0, min_verified_coverage_pct: 50.00, accessibility_standard: "WCAG_2_2_AA", rostering_standard: "ONEROSTER_1_2", data_privacy_addendum_required: true }
