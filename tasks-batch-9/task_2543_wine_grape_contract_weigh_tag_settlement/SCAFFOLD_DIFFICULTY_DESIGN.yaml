            - "The seventh call (the fourth offer on ${stuck_id}) returns 409 with error_id == ERR_MAX_OFFER_ROUNDS_EXCEEDED and GrapeContract.${stuck_id}.offer_round stays 3 with lifecycle_status COUNTERED"
            - "After the final clock advance, GrapeContract.${contract_id}.renewal_status == RENEWAL_WINDOW_OPEN while lifecycle_status is still ACTIVE"
            - "After the final clock advance, GrapeContract.${stuck_id}.renewal_status is still NOT_DUE because renewal_window_opens_at is null on a contract that was never accepted"

      - name: weigh_tag_parallel_weigh_and_disposition_dimensions_with_dispute_cycle
        grounds:
          - state_machines.WeighTag.weigh_status
          - state_machines.WeighTag.disposition
          - state_machines.SettlementLine.PROVISIONAL_to_VOID
          - entities.WeighTag.fields.grade_count
          - entities.WeighTag.fields.active_adjustment_pct
          - entities.WeighTag.fields.dispute_deadline_at
        distinguishing_aspect: |
          A different entity from the first instance and a different flavour of non-linearity:
          WeighTag's weigh_status dimension reaches its terminal NET_FINAL after the tare and
          then NEVER moves again, while the disposition dimension of the same row walks
          PENDING -> ACCEPTED -> DISPUTED -> ACCEPTED, a genuine cycle that returns to a state
          it already occupied with grade_count 2 and a different active_adjustment_pct. The
          weighed tonnage 22.000 is invariant across the whole cycle.
