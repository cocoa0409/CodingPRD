              payload: { utility_name: "City Power", contract_number: "CV-7", effective_start: "2026-08-01T00:00:00Z", effective_end: "2026-12-31T00:00:00Z" }
              as: CONTRACTOR_PM
              captures: { cid: $.data.id }
            - call: "POST /contracts/${cid}/bid-items"
              payload: { item_code: "OH-MISC", description: "Misc", unit: "HR", unit_price: 10.00, estimated_quantity: 100 }
              as: CONTRACTOR_PM
            - call: "POST /contracts/${cid}/transition"
              payload: { to: "ACTIVE" }
              as: CONTRACTOR_PM
            - call: "POST /contracts/${cid}/work-packages"
              payload: { name: "WP sd", location: "L13", requires_outage: false }
