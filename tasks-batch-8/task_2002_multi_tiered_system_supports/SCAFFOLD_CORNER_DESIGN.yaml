              payload: { scheduled_on: "2026-08-06" }
              as: TeamLead
              captures: { m1_id: $.data.id }
            - call: "POST /districts/${d_id}/schools/${s_id}/team-meetings/${m1_id}/convene"
              payload: {}
              as: TeamLead
