            - "s_t2 == 80 and s_t2m == 70 — one cent below the tier-2 line costs 10 points"
            - "s_t3m == 55 — below the tier-3 line only the residual 5-point capital award applies"
            - "deciding ${r_t2m_id} with APPROVE and no conditions_note returns 200, because 70 is exactly the approval minimum"
            - "deciding ${r_t3m_id} with APPROVE returns 422 ERR_DECISION_SCORE_MISMATCH, because 55 sits in the CONDITION band"

      - name: allocation_rows_keep_the_rates_pinned_at_calculation_time
        claim_type: version_pinning_on_approval
        grounds:
          - entities.PolicyStateAllocation.fields.premium_tax_rate_applied
          - entities.PolicyStateAllocation.fields.stamping_fee_rate_applied
          - calculations.endorsement_tax_adjustment
        distinguishing_aspect: "calculate-tax copies each state's rates onto the allocation row, and every later recomputation reads the pinned copy rather than the live StateProgram. Doubling the Texas premium tax rate to 0.1000 after calculation therefore changes nothing: the endorsement recomputation still yields 46346 total tax, identical to a run with the rate untouched."
        test_recipe:
          setup:
            - "Logical clock at 2026-08-01T00:00:00Z; the base TX-home policy with tax calculated (total_tax_cents 38779), then the TX program's premium_tax_rate raised from 0.0485 to 0.1000 and its stamping_fee_rate from 0.0015 to 0.0100."
