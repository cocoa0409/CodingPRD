    instances:
      - name: buyer_cannot_create_cruise
        claim_type: role_denied
        grounds: ["roles[Buyer]", "endpoints[POST /cruises]", "errors[ERR_FORBIDDEN_ROLE]"]
        distinguishing_aspect: "Buyer role is not in POST /cruises roles; 403 ERR_FORBIDDEN_ROLE fires before existence checks."
        test_recipe:
          setup: ["buyer registered"]
          setup_api_calls:
            - { call: "POST /forestry/buyers", payload: { company_name: "Blue Mill", license_no: "B-100" }, as: PlatformAdmin, captures: { b_id: "$.data.id" } }
          trigger:
            - { call: "POST /forestry/cruises", payload: { stand_id: "8a3e1c0b-2f4d-4a91-9c8b-12e7b6a0f1d2", cruise_date: "2026-03-01", plots: [ { plot_number: 1, species: "PINE", volume_bf: 1165 } ] }, as: Buyer, as_user_id: "${b_id}", captures: { err: "$.data.error_id" } }
          assert:
            - "${err} == ERR_FORBIDDEN_ROLE"

