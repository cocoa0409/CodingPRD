        distinguishing_aspect: |
          A SUSPENDED member booking with a FROZEN entitlement violates both p7 (business_safety,
          ERR_MEMBER_SUSPENDED) and p8 (business_referential, ERR_ENTITLEMENT_NOT_USABLE). The
          higher-priority p7 wins: ERR_MEMBER_SUSPENDED, not ERR_ENTITLEMENT_NOT_USABLE.
        test_recipe:
          setup:
            - "Clock 2026-02-01. Member M SUSPENDED (3 no-shows) AND holds a FROZEN ACTIVE membership."
            - "A published OPEN session S exists with open seats."
