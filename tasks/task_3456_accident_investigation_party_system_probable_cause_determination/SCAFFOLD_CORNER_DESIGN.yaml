          - errors.ERR_SOD_IIC_ON_BOARD
        distinguishing_aspect: "A board meeting whose sitting_member_ids contain the investigation's iic_user_id is rejected with 403 ERR_SOD_IIC_ON_BOARD even though quorum (3 distinct members) and room windows are satisfied."
        test_recipe:
          setup:
            - "Base chain through ANALYSIS."
          setup_api_calls:
            - *c_clock
            - *c_case
            - *c_propose
            - *c_adopt
            - *c_fetch_inv
            - *c_group
            - *c_adv_onscene
            - *c_org
            - *c_designation
            - *c_seat
            - *c_adv_factual
            - *c_report
            - *c_verify
            - *c_complete
            - *c_release
            - *c_adv_analysis
          trigger:
