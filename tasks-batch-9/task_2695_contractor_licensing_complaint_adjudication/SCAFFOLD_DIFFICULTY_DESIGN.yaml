  - rule_id: transitive_cascade
    instances:

      - name: recovery_payout_cascade_suspends_license_and_releases_qualifier_slot
        grounds:
          - state_machines.RecoveryFundClaim.APPROVED_to_PAID
          - state_machines.License.ACTIVE_to_SUSPENDED
          - state_machines.QualifierAssignment.ACTIVE_to_SUSPENDED_BY_LICENSE
          - entities.QualifyingIndividual.fields.active_qualification_count
          - concurrency_rules[claim-pay-stale-fund-account]
        distinguishing_aspect: |
          Four causally chained hops from ONE payment call: (1) the claim is stamped PAID, (2) the fund
          balance falls and the licence's outstanding repayment rises, (3) because that balance is now
          positive the licence goes ACTIVE -> SUSPENDED(RECOVERY_FUND_PAYOUT), (4) because the licence
          left ACTIVE its designation goes SUSPENDED_BY_LICENSE and the qualifier's
          active_qualification_count drops 1 -> 0. Hop 4 is invisible to the payment endpoint's own row.
        test_recipe:
          setup:
            - "a fund appropriation with balance 5000000, per-claim cap 1500000, aggregate cap 2000000"
            - "one ACTIVE licence whose sole designation is ACTIVE and whose qualifier holds exactly 1 qualification"
            - "one COURT_JUDGMENT claim on that licence approved for 900000, clock at 2026-12-04"
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-08-01T00:00:00Z" }
              as: BoardAdmin
            - call: "POST /licensing/trade-classifications"
              payload: { code: "C-10", name: "Electrical", hazard_tier: 3, min_experience_months: 48, min_net_worth_cents: 250000, required_bond_amount_cents: 1500000, required_ce_hours: 8, renewal_base_fee_cents: 45000, mediation_required: true }
              as: BoardAdmin
              captures: { cls_id: $.data.id }
            - call: "POST /licensing/recovery-fund-accounts"
              payload: { fiscal_year: 2027, initial_balance_cents: 5000000, per_claim_cap_cents: 1500000, per_license_aggregate_cap_cents: 2000000 }
