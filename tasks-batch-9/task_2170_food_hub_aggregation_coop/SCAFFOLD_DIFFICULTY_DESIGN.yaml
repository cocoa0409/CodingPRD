      - call: POST /producer-documents/${p1_hac}/adjudication
        payload:
          decision: VERIFY
        as: ComplianceOfficer
        as_user_id: co-verify-1
      - call: POST /producers/${p1_id}/review
        payload:
          decision: APPROVE
        as: ComplianceOfficer
        as_user_id: co-approve-9
      - call: POST /products
        payload:
