      - name: bid_reevaluation_flips_responsiveness_in_both_directions
        claim_type: Valid Transition
        grounds:
          - state_machines.Bid.transitions.RESPONSIVE_to_NONRESPONSIVE
          - state_machines.Bid.transitions.NONRESPONSIVE_to_RESPONSIVE
