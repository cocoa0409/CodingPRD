              as: Registrar
              as_user_id: "registrar-1"
              captures: { support_first_student: "$.data[0].student_id", support_first_state: "$.data[0].state" }
          assert:
            - "${reg_a_state} == \"ENROLLED\" and ${reg_a_units} == 6.0 and ${reg_a_companion} != null (setup: the PAIRED PRIMARY auto-creates the support row)"
            - "${reg_b_state} == \"WAITLISTED\" and ${reg_b_companion} == null (setup: WAITLISTED never creates a companion)"
            - "HOP 1 — ${att_a_state} == \"VOIDED\", ${att_a_reason} == \"IRREGULARITY\", ${att_a_next} == null"
            - "HOP 1 — ${sa_counts}.MATH == 0 and ${sa_remaining}.MATH == 3: the retake credit is handed back"
            - "HOP 2 — ${det_a_ev} == \"DISPUTED\" while ${det_a_place} == \"PROVISIONAL\" (only the evidence axis moves) and ${sa_hold} == true"
            - "HOP 3 — ${reg_a_after} == \"DENIED\" and ${reg_a_reason} == \"EVIDENCE_DISPUTED\""
            - "HOP 4 — Registration.${reg_a_companion}.state == \"DENIED\" with denial_reason \"EVIDENCE_DISPUTED\""
            - "HOP 5 — ${reg_b_after} == \"ENROLLED\" and ${reg_b_companion_after} != null: promotion re-ran the ENROLLED side effects and minted SB's support row"
            - "${secP_taken} == 1 and ${secP_held} == 0 and ${secP_wait} == 0"
            - "${secP_av} == 0 — paired_conservative: min(1 - 1 - 0, 5 - 1 - 0)"
            - "${support_first_student} == \"${sb_id}\" and ${support_first_state} == \"ENROLLED\" — SA's support row is DENIED, so the only ENROLLED support row belongs to SB"
            - "PlacementDetermination.${det_b}.evidence_state == \"UNVERIFIED\" — SB's determination is untouched by SA's void"

      - name: appeal_grant_five_hop_cascade_mints_override_determination
        grounds:
          - state_machines.PlacementAppeal.INSTRUCTOR_ENDORSED_to_GRANTED
          - state_machines.PlacementDetermination.APPEALED_to_SUPERSEDED
          - state_machines.PrerequisiteOverride.CONSUMED_to_ISSUED
          - calculations.placement_validity_window.variants.appeal_override_bypass
          - entities.PlacementAppeal.fields.minted_determination_id
        distinguishing_aspect: |
          A second depth-5 chain with a different root, a different direction and a
          different conserved quantity from the void cascade: the root CREATES an
          entity (the APPEAL_OVERRIDE determination, whose scores come from the
          appeal_override_bypass variant rather than from C2/C3), HOP 3's filter is
          a set DIFFERENCE (registrations for courses covered by the old placement
          but NOT by the new one), and HOP 4 runs a consumed PrerequisiteOverride
          BACKWARDS to ISSUED while HOP 5's promotion consumes a DIFFERENT
          override forwards. Ordering matters: releasing the seat before returning
          the override would let the promotion consume the wrong grant.
        test_recipe:
          setup:
            - "Logical clock at 2026-08-02T00:00:00Z (determinations were created one day earlier at the 2026-08-01T00:00:00Z default)."
            - "Courses: READ-050 (level_rank 50, units 3.0), MATH-050 (level_rank 50, units 5.0), MATH-100 (level_rank 100, units 4.0), MATH-100S (units 2.0, is_support_course true)."
