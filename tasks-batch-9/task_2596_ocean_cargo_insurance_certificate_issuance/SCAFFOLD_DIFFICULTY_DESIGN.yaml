# =============================================================================
# 1.8 Scaffold Difficulty Design (Test Targeting Index)
# Ocean Cargo Insurance & Certificate Issuance — 9 rule_ids x 2 instances = 18
# Every literal in every `assert:` was computed by executing the relevant
# §1.3 formula (Decimal, ROUND_HALF_UP) before it was written down.
# =============================================================================
scaffold_difficulty_design:

  - rule_id: dual_variant_calc
    instances:
      - name: certificate_insured_value_cif_markup_vs_declared_value
        grounds:
          - calculations.certificate_insured_value
          - entities.Certificate.fields.valuation_basis
          - entities.Certificate.fields.insured_value
          - entities.OpenPolicy.fields.markup_pct
          - entities.OpenPolicy.fields.freight_basis
        distinguishing_aspect: |
          This dual variant lives on the Certificate valuation domain (money the
          insurer puts at risk on a shipment): CIF_PLUS_MARKUP builds
          invoice + duty + prepaid freight and applies the 10% markup to reach
          1155000.00, while DECLARED_VALUE ignores all three components and
          insures 1050000.00 — a 105000.00 divergence on byte-identical shipment
          inputs, which then propagates into every premium component.
        test_recipe:
          setup:
            - "logical clock at its 2026-08-01T00:00:00Z default"
            - "one ACTIVE OpenPolicy with freight_basis PREPAID, markup_pct 0.10, rates 3.500/0.600/0.255 and a limit tower of 2000000 / 3000000 / 10000000"
            - "one APPROVED vessel (year_built 2015, society LR) and two GREEN ports"
            - "two DRAFT certificates with identical invoice 1000000.00, freight 45000.00 and duty 5000.00, differing only in valuation_basis"
          setup_api_calls:
            - call: "POST /ports"
              payload: { unlocode: "SGSIN", name: "Singapore", country_code: "SG", port_accumulation_limit_amount: 4000000, storage_free_days: 30, war_risk_tier: "GREEN" }
              as: Underwriter
              captures: { port_load_id: $.data.id }
            - call: "POST /ports"
              payload: { unlocode: "NLRTM", name: "Rotterdam", country_code: "NL", port_accumulation_limit_amount: 4000000, storage_free_days: 30, war_risk_tier: "GREEN" }
              as: Underwriter
              captures: { port_disch_id: $.data.id }
            - call: "POST /commodity-classes"
              payload: { code: "CC-ELEC", description: "Consumer electronics", susceptibility_rating: "S3", required_packaging_code: "EXPORT_CRATE", rate_loading_pct: 0.35, max_conveyance_share_pct: 0.80, survey_required_above_amount: 500000 }
              as: Underwriter
              captures: { cc_id: $.data.id }
            - call: "POST /vessels"
              payload: { name: "MV Kite", imo_number: "9100001", year_built: 2015, classification_society: "LR", flag_code: "SG", vessel_accumulation_limit_amount: 5000000 }
              as: Underwriter
              captures: { vsl_id: $.data.id }
            - call: "POST /vessels/${vsl_id}/classification-review"
              payload: {}
              as: Underwriter
            - call: "POST /open-policies"
              payload: { policy_number: "OP-2596-A", assured_name: "Kite Trading Pte", inception_at: "2026-01-01T00:00:00Z", expiry_at: "2027-01-01T00:00:00Z", freight_basis: "PREPAID", per_certificate_limit_amount: 2000000, conveyance_limit_amount: 3000000, annual_aggregate_limit_amount: 10000000, premium_rate_per_mille: 3.500, war_rate_per_mille: 0.600, strikes_rate_per_mille: 0.255, warehouse_to_warehouse: true, markup_pct: 0.10, deductible_amount: 2500 }
              as: Underwriter
              captures: { pol_id: $.data.id }
            - call: "POST /open-policies/${pol_id}/activate"
              payload: {}
              as: Underwriter
            - call: "POST /certificates"
              payload: { open_policy_id: "${pol_id}", commodity_class_id: "${cc_id}", vessel_id: "${vsl_id}", loading_port_id: "${port_load_id}", discharge_port_id: "${port_disch_id}", certificate_number: "CERT-A", valuation_basis: "CIF_PLUS_MARKUP", packaging_code: "EXPORT_CRATE", package_count: 120, gross_weight_kg: 18000, sailing_date: "2026-08-10T00:00:00Z", discharge_date: "2026-09-05T00:00:00Z", invoice_value: 1000000, freight_amount: 45000, duty_amount: 5000, war_cover_requested: true, strikes_cover_requested: true }
              as: Assured
              as_user_id: "${pol_id}"
              captures: { cert_a_id: $.data.id }
            - call: "POST /certificates"
              payload: { open_policy_id: "${pol_id}", commodity_class_id: "${cc_id}", vessel_id: "${vsl_id}", loading_port_id: "${port_load_id}", discharge_port_id: "${port_disch_id}", certificate_number: "CERT-B", valuation_basis: "DECLARED_VALUE", packaging_code: "EXPORT_CRATE", package_count: 120, gross_weight_kg: 18000, sailing_date: "2026-08-10T00:00:00Z", discharge_date: "2026-09-05T00:00:00Z", invoice_value: 1000000, freight_amount: 45000, duty_amount: 5000, declared_value: 1050000, war_cover_requested: true, strikes_cover_requested: true }
              as: Assured
              as_user_id: "${pol_id}"
              captures: { cert_b_id: $.data.id }
            - call: "GET /open-policies/${pol_id}"
              payload: {}
              as: Underwriter
              captures: { pol_v1: $.data.version }
          trigger:
            - call: "POST /certificates/${cert_a_id}/issue"
              payload: { expected_open_policy_version: "${pol_v1}" }
              as: Underwriter
            - call: "GET /open-policies/${pol_id}"
              payload: {}
              as: Underwriter
              captures: { pol_v2: $.data.version }
            - call: "POST /certificates/${cert_b_id}/issue"
              payload: { expected_open_policy_version: "${pol_v2}" }
              as: Underwriter
          assert:
            - "Certificate.${cert_a_id}.insured_value == 1155000.00"
            - "Certificate.${cert_b_id}.insured_value == 1050000.00"
            - "Certificate.${cert_a_id}.insured_value - Certificate.${cert_b_id}.insured_value == 105000.00"
            - "Certificate.${cert_a_id}.effective_rate_per_mille == 4.7250 and Certificate.${cert_b_id}.effective_rate_per_mille == 4.7250"
            - "Certificate.${cert_a_id}.total_premium_amount == 6444.91"
            - "Certificate.${cert_b_id}.total_premium_amount == 5859.00"
            - "Certificate.${cert_b_id}.base_premium_amount == 4961.25 and Certificate.${cert_b_id}.war_premium_amount == 630.00 and Certificate.${cert_b_id}.strikes_premium_amount == 267.75"
            - "OpenPolicy.${pol_id}.aggregate_insured_value_booked == 2205000.00"
            - "OpenPolicy.${pol_id}.aggregate_premium_booked == 12303.91"

      - name: claim_adjusted_amount_depreciation_pct_vs_salvage_proceeds
        grounds:
          - calculations.claim_adjusted_amount
          - entities.ClaimFile.fields.adjustment_basis
          - entities.ClaimFile.fields.deductible_applied_amount
          - state_machines.ClaimFile.SURVEY_RECEIVED_to_ADJUSTED
        distinguishing_aspect: |
          This dual variant lives on the ClaimFile indemnity domain (money the
          insurer pays out), a different entity domain from the Certificate
          valuation variant: DEPRECIATION_PCT subtracts the 2500.00 deductible
          after measuring the loss and pays 141875.00, while
          SALVAGE_SALE_PROCEEDS applies the depreciation ratio to the insured
          value net of the deductible and pays 144062.50 — the deductible's
          position in the formula alone moves the payout by 2187.50.
          documentation_complete requires SURVEY_REPORT, BILL_OF_LADING and
          CARRIER_CLAIM_LETTER on the evidence log.
          setup_api_calls uses the same policy/vessel/port fixture as
          certificate_insured_value_cif_markup_vs_declared_value.
          Certificate CERT-A and CERT-B are both CIF_PLUS_MARKUP, so both carry
          insured_value 1155000.00 and deductible_amount 2500.00, isolating the
          divergence to the claim variant.
          Claimed amounts (144375.00) stay under the commodity class's
          survey_required_above_amount of 500000, so §1.4 priority 19 does not
          demand a filed survey report.
        test_recipe:
          setup:
            - "two ISSUED certificates, each with insured_value 1155000.00 and deductible_amount 2500.00"
            - "one ClaimFile per certificate, both with a complete three-document evidence log and warranty_breach false"
            - "claim A on adjustment_basis DEPRECIATION_PCT with damage_percentage 12.5; claim B on SALVAGE_SALE_PROCEEDS with sound_market_value 1200000.00 and damaged_sale_proceeds 1050000.00"
