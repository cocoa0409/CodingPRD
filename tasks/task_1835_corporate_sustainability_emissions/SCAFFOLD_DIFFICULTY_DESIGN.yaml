            - { call: "POST /sustainability/emission-factors/${f_fuel}/transition", payload: { to_state: "PUBLISHED" }, as: SustainabilityManager }
            - { call: "POST /sustainability/cycles", payload: { name: "FY2025-A", reporting_year: 2025 }, as: SustainabilityManager, captures: { cyc_a: $.data.id } }
            - { call: "POST /sustainability/cycles/${cyc_a}/transition", payload: { to_state: "DATA_COLLECTION" }, as: SustainabilityManager }
            - { call: "POST /sustainability/activity-records", payload: { cycle_id: "${cyc_a}", site_id: "${site}", factor_id: "${f_fuel}", activity_type: "STATIONARY_FUEL", quantity: 1050, unit: "therm", period_start: "2025-01-01T00:00:00Z", period_end: "2025-02-01T00:00:00Z" }, as: SiteDataSteward, as_user_id: "steward-1", captures: { rec_a: $.data.id } }
            - { call: "POST /sustainability/activity-records/${rec_a}/transition", payload: { to_state: "UNDER_REVIEW" }, as: SiteDataSteward, as_user_id: "steward-1" }
            - { call: "POST /sustainability/activity-records/${rec_a}/transition", payload: { to_state: "APPROVED" }, as: SustainabilityAnalyst, as_user_id: "analyst-1" }
            - { call: "GET /sustainability/cycles/${cyc_a}", as: SustainabilityManager, captures: { cyc_a_v: $.data.version } }
            - { call: "POST /sustainability/cycles/${cyc_a}/inventory/recalculate", payload: { expected_cycle_version: "${cyc_a_v}" }, as: SustainabilityManager }
            - { call: "POST /sustainability/cycles/${cyc_a}/transition", payload: { to_state: "UNDER_REVIEW" }, as: SustainabilityManager }
            - { call: "POST /sustainability/cycles/${cyc_a}/transition", payload: { to_state: "LOCKED" }, as: SustainabilityManager }
            - { call: "POST /sustainability/cycles", payload: { name: "FY2025-B", reporting_year: 2025 }, as: SustainabilityManager, captures: { cyc_b: $.data.id } }
            - { call: "POST /sustainability/cycles/${cyc_b}/transition", payload: { to_state: "DATA_COLLECTION" }, as: SustainabilityManager }
            - { call: "POST /sustainability/activity-records", payload: { cycle_id: "${cyc_b}", site_id: "${site}", factor_id: "${f_fuel}", activity_type: "STATIONARY_FUEL", quantity: 1040, unit: "therm", period_start: "2025-02-01T00:00:00Z", period_end: "2025-03-01T00:00:00Z" }, as: SiteDataSteward, as_user_id: "steward-1", captures: { rec_b: $.data.id } }
            - { call: "POST /sustainability/activity-records/${rec_b}/transition", payload: { to_state: "UNDER_REVIEW" }, as: SiteDataSteward, as_user_id: "steward-1" }
            - { call: "POST /sustainability/activity-records/${rec_b}/transition", payload: { to_state: "APPROVED" }, as: SustainabilityAnalyst, as_user_id: "analyst-1" }
            - { call: "GET /sustainability/cycles/${cyc_b}", as: SustainabilityManager, captures: { cyc_b_v: $.data.version } }
            - { call: "POST /sustainability/cycles/${cyc_b}/inventory/recalculate", payload: { expected_cycle_version: "${cyc_b_v}" }, as: SustainabilityManager }
            - { call: "POST /sustainability/cycles/${cyc_b}/transition", payload: { to_state: "UNDER_REVIEW" }, as: SustainabilityManager }
            - { call: "POST /sustainability/cycles/${cyc_b}/transition", payload: { to_state: "LOCKED" }, as: SustainabilityManager }
            - { call: "POST /sustainability/targets", payload: { name: "T-5pct", base_year: 2025, target_year: 2030, reduction_pct: 50, scope_coverage: "SCOPE1_2_3", base_year_total_tco2e: 1000 }, as: SustainabilityManager, captures: { t1: $.data.id, t1_v: $.data.version } }
            - { call: "POST /sustainability/targets", payload: { name: "T-4pct", base_year: 2025, target_year: 2030, reduction_pct: 50, scope_coverage: "SCOPE1_2_3", base_year_total_tco2e: 1000 }, as: SustainabilityManager, captures: { t2: $.data.id, t2_v: $.data.version } }
          trigger:
            - { call: "POST /sustainability/targets/${t1}/recalculate-baseline", payload: { base_cycle_id: "${cyc_a}", expected_target_version: "${t1_v}" }, as: SustainabilityManager, captures: { t1_shift: $.data.baseline_shift_pct, t1_sig: $.data.baseline_shift_significant, t1_base: $.data.base_year_total_tco2e } }
            - { call: "POST /sustainability/targets/${t2}/recalculate-baseline", payload: { base_cycle_id: "${cyc_b}", expected_target_version: "${t2_v}" }, as: SustainabilityManager, captures: { t2_shift: $.data.baseline_shift_pct, t2_sig: $.data.baseline_shift_significant, t2_base: $.data.base_year_total_tco2e } }
          assert:
            - "t1: base_year_total_tco2e == 1050.0, baseline_shift_pct == 5.0, baseline_shift_significant == true (>= 5.0 boundary inclusive)"
            - "t2: base_year_total_tco2e == 1040.0, baseline_shift_pct == 4.0, baseline_shift_significant == false (strictly below the boundary)"

  # ===========================================================================
  # Rule 7 — cross_entity_state_dependency: ActivityRecord->ReportingCycle vs
  # RenewableInstrument->Site — DIFFERENT entity pairs
  # ===========================================================================
  - rule_id: cross_entity_state_dependency
    instances:
      - name: record_create_requires_cycle_collecting
        grounds:
          - validations[priority=6]
          - state_machines.ReportingCycle.DATA_COLLECTION_to_UNDER_REVIEW
          - errors[ERR_CYCLE_NOT_COLLECTING]
        distinguishing_aspect: |
          Entity pair ActivityRecord -> ReportingCycle: creating a record is
          gated on the CYCLE's status (DATA_COLLECTION); once the cycle
          advances to UNDER_REVIEW the same create fails with
          ERR_CYCLE_NOT_COLLECTING.
        test_recipe:
          setup:
            - "PUBLISHED SCOPE1_STATIONARY factor GLOBAL = 0.5 covering 2026; active site; cycle FY2026 advanced DATA_COLLECTION -> UNDER_REVIEW"
          setup_api_calls:
            - { call: "POST /sustainability/sites", payload: { name: "Plant", country_code: "US", grid_region_code: "CA" }, as: SustainabilityManager, captures: { site: $.data.id } }
            - { call: "POST /sustainability/emission-factors", payload: { scope_category: "SCOPE1_STATIONARY", region_code: "GLOBAL", unit: "therm", value_tco2e_per_unit: 0.5, library_version: 1, valid_from: "2026-01-01T00:00:00Z", valid_to: "2026-12-31T23:59:59Z" }, as: SustainabilityManager, captures: { f_fuel: $.data.id } }
            - { call: "POST /sustainability/emission-factors/${f_fuel}/transition", payload: { to_state: "PUBLISHED" }, as: SustainabilityManager }
            - { call: "POST /sustainability/cycles", payload: { name: "FY2026", reporting_year: 2026 }, as: SustainabilityManager, captures: { cyc: $.data.id } }
            - { call: "POST /sustainability/cycles/${cyc}/transition", payload: { to_state: "DATA_COLLECTION" }, as: SustainabilityManager }
            - { call: "POST /sustainability/cycles/${cyc}/transition", payload: { to_state: "UNDER_REVIEW" }, as: SustainabilityManager }
          trigger:
            - { call: "POST /sustainability/activity-records", payload: { cycle_id: "${cyc}", site_id: "${site}", factor_id: "${f_fuel}", activity_type: "STATIONARY_FUEL", quantity: 10, unit: "therm", period_start: "2026-01-01T00:00:00Z", period_end: "2026-02-01T00:00:00Z" }, as: SiteDataSteward, as_user_id: "steward-1", captures: { err: $.data.error_id } }
          assert:
            - "error_id == ERR_CYCLE_NOT_COLLECTING (cycle in UNDER_REVIEW no longer accepts new records)"

      - name: instrument_retire_requires_active_site
        grounds:
          - validations[priority=16]
          - state_machines.Site.ACTIVE_to_DECOMMISSIONED
          - errors[ERR_SITE_INACTIVE]
        distinguishing_aspect: |
          Entity pair RenewableInstrument -> Site: retirement is gated on the
          SITE's status; retiring against a DECOMMISSIONED site fails with
          ERR_SITE_INACTIVE. Different pair from ActivityRecord->ReportingCycle.
        test_recipe:
          setup:
            - "Cycle FY2026 in DATA_COLLECTION; site created then DECOMMISSIONED; one PROCURED instrument vintage 2026"
          setup_api_calls:
            - { call: "POST /sustainability/sites", payload: { name: "OldPlant", country_code: "US", grid_region_code: "CA" }, as: SustainabilityManager, captures: { site: $.data.id } }
            - { call: "POST /sustainability/cycles", payload: { name: "FY2026", reporting_year: 2026 }, as: SustainabilityManager, captures: { cyc: $.data.id } }
            - { call: "POST /sustainability/cycles/${cyc}/transition", payload: { to_state: "DATA_COLLECTION" }, as: SustainabilityManager }
            - { call: "POST /sustainability/sites/${site}/decommission", payload: {}, as: SustainabilityManager }
            - { call: "POST /sustainability/instruments", payload: { registry: "M-RETS", serial_number: "S-300", technology: "HYDRO", vintage_year: 2026, quantity_mwh: 10 }, as: SustainabilityManager, captures: { inst: $.data.id } }
          trigger:
            - { call: "POST /sustainability/instruments/${inst}/retire", payload: { cycle_id: "${cyc}", site_id: "${site}" }, as: SustainabilityManager, captures: { err: $.data.error_id } }
          assert:
            - "error_id == ERR_SITE_INACTIVE (retirement gated on the referenced Site being ACTIVE)"

  # ===========================================================================
  # Rule 8 — resource_temporal_overlap: half-open activity periods (adjacent
  # allowed) vs closed factor windows (touching forbidden) — DIFFERENT
  # interval semantics on DIFFERENT resources
  # ===========================================================================
  - rule_id: resource_temporal_overlap
    instances:
      - name: activity_periods_half_open_overlap_and_adjacency
        grounds:
          - validations[priority=10]
          - errors[ERR_PERIOD_OVERLAP]
          - entities.ActivityRecord.fields.period_start
        distinguishing_aspect: |
          Half-open [start, end) semantics on ActivityRecord: an interior
          overlap ([2026-02-01, 2026-04-01) vs existing [2026-01-01,
          2026-03-01)) is rejected with ERR_PERIOD_OVERLAP while exact
          adjacency (start == existing end) is ACCEPTED.
        test_recipe:
          setup:
            - "PUBLISHED SCOPE1_STATIONARY factor GLOBAL = 0.5 covering 2026; active site; cycle FY2026 in DATA_COLLECTION; one record r1 with period [2026-01-01, 2026-03-01)"
          setup_api_calls:
            - { call: "POST /sustainability/sites", payload: { name: "Plant", country_code: "US", grid_region_code: "CA" }, as: SustainabilityManager, captures: { site: $.data.id } }
            - { call: "POST /sustainability/emission-factors", payload: { scope_category: "SCOPE1_STATIONARY", region_code: "GLOBAL", unit: "therm", value_tco2e_per_unit: 0.5, library_version: 1, valid_from: "2026-01-01T00:00:00Z", valid_to: "2026-12-31T23:59:59Z" }, as: SustainabilityManager, captures: { f_fuel: $.data.id } }
            - { call: "POST /sustainability/emission-factors/${f_fuel}/transition", payload: { to_state: "PUBLISHED" }, as: SustainabilityManager }
            - { call: "POST /sustainability/cycles", payload: { name: "FY2026", reporting_year: 2026 }, as: SustainabilityManager, captures: { cyc: $.data.id } }
            - { call: "POST /sustainability/cycles/${cyc}/transition", payload: { to_state: "DATA_COLLECTION" }, as: SustainabilityManager }
            - { call: "POST /sustainability/activity-records", payload: { cycle_id: "${cyc}", site_id: "${site}", factor_id: "${f_fuel}", activity_type: "STATIONARY_FUEL", quantity: 10, unit: "therm", period_start: "2026-01-01T00:00:00Z", period_end: "2026-03-01T00:00:00Z" }, as: SiteDataSteward, as_user_id: "steward-1", captures: { r1: $.data.id } }
          trigger:
            - { call: "POST /sustainability/activity-records", payload: { cycle_id: "${cyc}", site_id: "${site}", factor_id: "${f_fuel}", activity_type: "STATIONARY_FUEL", quantity: 10, unit: "therm", period_start: "2026-02-01T00:00:00Z", period_end: "2026-04-01T00:00:00Z" }, as: SiteDataSteward, as_user_id: "steward-1", captures: { err: $.data.error_id } }
            - { call: "POST /sustainability/activity-records", payload: { cycle_id: "${cyc}", site_id: "${site}", factor_id: "${f_fuel}", activity_type: "STATIONARY_FUEL", quantity: 10, unit: "therm", period_start: "2026-03-01T00:00:00Z", period_end: "2026-05-01T00:00:00Z" }, as: SiteDataSteward, as_user_id: "steward-1", captures: { r3: $.data.id, r3_status: $.data.status } }
          assert:
            - "overlapping create fails with error_id == ERR_PERIOD_OVERLAP"
            - "adjacent create (period_start == r1.period_end) succeeds with status == SUBMITTED (half-open semantics allow touching endpoints)"

      - name: factor_windows_closed_touching_is_overlap
        grounds:
          - validations[priority=11]
          - errors[ERR_FACTOR_WINDOW_OVERLAP]
          - entities.EmissionFactor.fields.valid_to
        distinguishing_aspect: |
          Closed [from, to] semantics on EmissionFactor (different resource,
          different semantics from the half-open activity rule): a new factor
          whose valid_from EQUALS an existing PUBLISHED factor's valid_to is
          rejected with ERR_FACTOR_WINDOW_OVERLAP, while a strictly later
          window publishes fine.
        test_recipe:
          setup:
            - "PUBLISHED SCOPE2_GRID factor CA with window [2026-01-01T00:00:00Z, 2026-12-31T23:59:59Z]"
            - "DRAFT factor f2 same (scope_category, region_code) with window starting exactly at 2026-12-31T23:59:59Z"
            - "DRAFT factor f3 same key with window starting 2027-01-01T00:00:00Z (strictly disjoint)"
          setup_api_calls:
            - { call: "POST /sustainability/emission-factors", payload: { scope_category: "SCOPE2_GRID", region_code: "CA", unit: "MWh", value_tco2e_per_unit: 0.4, library_version: 1, valid_from: "2026-01-01T00:00:00Z", valid_to: "2026-12-31T23:59:59Z" }, as: SustainabilityManager, captures: { f1: $.data.id } }
            - { call: "POST /sustainability/emission-factors/${f1}/transition", payload: { to_state: "PUBLISHED" }, as: SustainabilityManager }
            - { call: "POST /sustainability/emission-factors", payload: { scope_category: "SCOPE2_GRID", region_code: "CA", unit: "MWh", value_tco2e_per_unit: 0.41, library_version: 2, valid_from: "2026-12-31T23:59:59Z", valid_to: "2027-12-31T23:59:59Z" }, as: SustainabilityManager, captures: { f2: $.data.id } }
            - { call: "POST /sustainability/emission-factors", payload: { scope_category: "SCOPE2_GRID", region_code: "CA", unit: "MWh", value_tco2e_per_unit: 0.42, library_version: 2, valid_from: "2027-01-01T00:00:00Z", valid_to: "2027-12-31T23:59:59Z" }, as: SustainabilityManager, captures: { f3: $.data.id } }
          trigger:
            - { call: "POST /sustainability/emission-factors/${f2}/transition", payload: { to_state: "PUBLISHED" }, as: SustainabilityManager, captures: { err: $.data.error_id } }
            - { call: "POST /sustainability/emission-factors/${f3}/transition", payload: { to_state: "PUBLISHED" }, as: SustainabilityManager, captures: { f3_status: $.data.status } }
          assert:
            - "f2 publish fails with error_id == ERR_FACTOR_WINDOW_OVERLAP (closed interval: touching endpoints count as overlap)"
            - "f3 publish succeeds with status == PUBLISHED (strictly disjoint window)"

  # ===========================================================================
  # Rule 9 — compensating_invariant: instrument MWh conservation vs approved
  # emissions-total conservation — DIFFERENT conserved quantities
  # ===========================================================================
  - rule_id: compensating_invariant
    instances:
      - name: instrument_retire_void_conserves_quantity
        grounds:
          - state_machines.RenewableInstrument.PROCURED_to_RETIRED
          - state_machines.RenewableInstrument.RETIRED_to_PROCURED
          - entities.RenewableInstrument.fields.quantity_mwh
        distinguishing_aspect: |
          Conserved quantity: RenewableInstrument.quantity_mwh plus the
          derived market total. retire-then-void-retirement leaves
          quantity_mwh == 30 unchanged, retired_for_cycle_id back to null,
          status back to PROCURED, and scope2_market_tco2e restored to the
          exact pre-retirement value 50.0.
        test_recipe:
          setup:
            - "Site Alpha CA; PUBLISHED grid 0.4 and residual 0.5 factors for CA; cycle FY2026 in DATA_COLLECTION"
            - "One APPROVED ELECTRICITY record 100 MWh; recalc done: scope2_market_tco2e == 50.0 (residual 100 x 0.5)"
            - "One PROCURED instrument, 30 MWh, vintage 2026"
          setup_api_calls:
            - { call: "POST /sustainability/sites", payload: { name: "Alpha", country_code: "US", grid_region_code: "CA" }, as: SustainabilityManager, captures: { site: $.data.id } }
            - { call: "POST /sustainability/emission-factors", payload: { scope_category: "SCOPE2_GRID", region_code: "CA", unit: "MWh", value_tco2e_per_unit: 0.4, library_version: 1, valid_from: "2026-01-01T00:00:00Z", valid_to: "2026-12-31T23:59:59Z" }, as: SustainabilityManager, captures: { f_grid: $.data.id } }
            - { call: "POST /sustainability/emission-factors/${f_grid}/transition", payload: { to_state: "PUBLISHED" }, as: SustainabilityManager }
            - { call: "POST /sustainability/emission-factors", payload: { scope_category: "SCOPE2_RESIDUAL_MIX", region_code: "CA", unit: "MWh", value_tco2e_per_unit: 0.5, library_version: 1, valid_from: "2026-01-01T00:00:00Z", valid_to: "2026-12-31T23:59:59Z" }, as: SustainabilityManager, captures: { f_res: $.data.id } }
            - { call: "POST /sustainability/emission-factors/${f_res}/transition", payload: { to_state: "PUBLISHED" }, as: SustainabilityManager }
            - { call: "POST /sustainability/cycles", payload: { name: "FY2026", reporting_year: 2026 }, as: SustainabilityManager, captures: { cyc: $.data.id } }
            - { call: "POST /sustainability/cycles/${cyc}/transition", payload: { to_state: "DATA_COLLECTION" }, as: SustainabilityManager }
            - { call: "POST /sustainability/activity-records", payload: { cycle_id: "${cyc}", site_id: "${site}", factor_id: "${f_grid}", activity_type: "ELECTRICITY", quantity: 100, unit: "MWh", period_start: "2026-01-01T00:00:00Z", period_end: "2026-02-01T00:00:00Z" }, as: SiteDataSteward, as_user_id: "steward-1", captures: { rec: $.data.id } }
            - { call: "POST /sustainability/activity-records/${rec}/transition", payload: { to_state: "UNDER_REVIEW" }, as: SiteDataSteward, as_user_id: "steward-1" }
            - { call: "POST /sustainability/activity-records/${rec}/transition", payload: { to_state: "APPROVED" }, as: SustainabilityAnalyst, as_user_id: "analyst-1" }
            - { call: "GET /sustainability/cycles/${cyc}", as: SustainabilityManager, captures: { cyc_v0: $.data.version } }
            - { call: "POST /sustainability/cycles/${cyc}/inventory/recalculate", payload: { expected_cycle_version: "${cyc_v0}" }, as: SustainabilityManager, captures: { mkt_pre: $.data.scope2_market_tco2e } }
            - { call: "POST /sustainability/instruments", payload: { registry: "M-RETS", serial_number: "S-400", technology: "SOLAR", vintage_year: 2026, quantity_mwh: 30 }, as: SustainabilityManager, captures: { inst: $.data.id } }
          trigger:
            - { call: "POST /sustainability/instruments/${inst}/retire", payload: { cycle_id: "${cyc}", site_id: "${site}" }, as: SustainabilityManager }
            - { call: "GET /sustainability/cycles/${cyc}", as: SustainabilityManager, captures: { cyc_v1: $.data.version } }
            - { call: "POST /sustainability/cycles/${cyc}/inventory/recalculate", payload: { expected_cycle_version: "${cyc_v1}" }, as: SustainabilityManager, captures: { mkt_retired: $.data.scope2_market_tco2e } }
            - { call: "POST /sustainability/instruments/${inst}/void-retirement", payload: {}, as: SustainabilityManager, captures: { inst_status: $.data.status, inst_cycle: $.data.retired_for_cycle_id, inst_qty: $.data.quantity_mwh } }
            - { call: "GET /sustainability/cycles/${cyc}", as: SustainabilityManager, captures: { cyc_v2: $.data.version } }
            - { call: "POST /sustainability/cycles/${cyc}/inventory/recalculate", payload: { expected_cycle_version: "${cyc_v2}" }, as: SustainabilityManager, captures: { mkt_post: $.data.scope2_market_tco2e } }
          assert:
            - "pre-retirement scope2_market_tco2e == 50.0"
            - "while RETIRED: scope2_market_tco2e == 35.0"
            - "after void-retirement: instrument status == PROCURED, retired_for_cycle_id == null, quantity_mwh == 30 (unchanged)"
            - "after void + recalc: scope2_market_tco2e == 50.0 (exactly restored — no drift)"

      - name: record_approve_void_conserves_approved_totals
        grounds:
          - state_machines.ActivityRecord.UNDER_REVIEW_to_APPROVED
          - state_machines.ActivityRecord.APPROVED_to_VOIDED
          - entities.ActivityRecord.fields.tco2e
        distinguishing_aspect: |
          Conserved quantity: the cycle's APPROVED emissions total (different
          quantity type from instrument MWh). Approve r2 (total 10.00 ->
          15.00) then VOID it: after recalc the total returns to exactly
          10.00 and exactly one APPROVED record remains.
        test_recipe:
          setup:
            - "PUBLISHED SCOPE1_STATIONARY factor GLOBAL = 1.0; cycle FY2026 in DATA_COLLECTION"
            - "r1 (10 therm, Jan) APPROVED and recalculated: total_tco2e == 10.0"
          setup_api_calls:
            - { call: "POST /sustainability/sites", payload: { name: "Plant", country_code: "US", grid_region_code: "CA" }, as: SustainabilityManager, captures: { site: $.data.id } }
            - { call: "POST /sustainability/emission-factors", payload: { scope_category: "SCOPE1_STATIONARY", region_code: "GLOBAL", unit: "therm", value_tco2e_per_unit: 1.0, library_version: 1, valid_from: "2026-01-01T00:00:00Z", valid_to: "2026-12-31T23:59:59Z" }, as: SustainabilityManager, captures: { f_fuel: $.data.id } }
            - { call: "POST /sustainability/emission-factors/${f_fuel}/transition", payload: { to_state: "PUBLISHED" }, as: SustainabilityManager }
            - { call: "POST /sustainability/cycles", payload: { name: "FY2026", reporting_year: 2026 }, as: SustainabilityManager, captures: { cyc: $.data.id } }
            - { call: "POST /sustainability/cycles/${cyc}/transition", payload: { to_state: "DATA_COLLECTION" }, as: SustainabilityManager }
            - { call: "POST /sustainability/activity-records", payload: { cycle_id: "${cyc}", site_id: "${site}", factor_id: "${f_fuel}", activity_type: "STATIONARY_FUEL", quantity: 10, unit: "therm", period_start: "2026-01-01T00:00:00Z", period_end: "2026-02-01T00:00:00Z" }, as: SiteDataSteward, as_user_id: "steward-1", captures: { r1: $.data.id } }
            - { call: "POST /sustainability/activity-records/${r1}/transition", payload: { to_state: "UNDER_REVIEW" }, as: SiteDataSteward, as_user_id: "steward-1" }
            - { call: "POST /sustainability/activity-records/${r1}/transition", payload: { to_state: "APPROVED" }, as: SustainabilityAnalyst, as_user_id: "analyst-1" }
            - { call: "GET /sustainability/cycles/${cyc}", as: SustainabilityManager, captures: { cyc_v0: $.data.version } }
            - { call: "POST /sustainability/cycles/${cyc}/inventory/recalculate", payload: { expected_cycle_version: "${cyc_v0}" }, as: SustainabilityManager, captures: { tot_pre: $.data.total_tco2e } }
            - { call: "POST /sustainability/activity-records", payload: { cycle_id: "${cyc}", site_id: "${site}", factor_id: "${f_fuel}", activity_type: "STATIONARY_FUEL", quantity: 5, unit: "therm", period_start: "2026-02-01T00:00:00Z", period_end: "2026-03-01T00:00:00Z" }, as: SiteDataSteward, as_user_id: "steward-1", captures: { r2: $.data.id } }
            - { call: "POST /sustainability/activity-records/${r2}/transition", payload: { to_state: "UNDER_REVIEW" }, as: SiteDataSteward, as_user_id: "steward-1" }
            - { call: "POST /sustainability/activity-records/${r2}/transition", payload: { to_state: "APPROVED" }, as: SustainabilityAnalyst, as_user_id: "analyst-1" }
          trigger:
            - { call: "POST /sustainability/activity-records/${r2}/transition", payload: { to_state: "VOIDED" }, as: SustainabilityManager }
            - { call: "GET /sustainability/cycles/${cyc}", as: SustainabilityManager, captures: { cyc_v1: $.data.version } }
            - { call: "POST /sustainability/cycles/${cyc}/inventory/recalculate", payload: { expected_cycle_version: "${cyc_v1}" }, as: SustainabilityManager, captures: { tot_post: $.data.total_tco2e } }
            - { call: "GET /sustainability/activity-records", payload: { cycle_id: "${cyc}", status: "APPROVED" }, as: SustainabilityManager, captures: { first_approved_id: "$.data[0].id" } }
          assert:
            - "pre-approve-of-r2 total_tco2e == 10.0"
            - "after approve-then-void of r2 and recalc: total_tco2e == 10.0 (exactly restored)"
            - "GET /activity-records?cycle_id&status=APPROVED returns exactly 1 record and its id == ${r1} (the VOIDED r2 excluded from the approved set)"
