            - { call: "POST /retail/technicians", payload: { full_name: "Dana Reyes", current_shop_location_id: "${s1_id}", credit_line_limit_cents: 100000, months_in_trade: 100, employment_verified: true }, as: FranchiseOwner, as_user_id: "${f_id}", captures: { t_id: "$.data.id" } }
          trigger:
            - { call: "POST /retail/shop-locations/${s1_id}/credit-applications", payload: { technician_id: "${t_id}", requested_limit_cents: 9000000, requested_kind: REVOLVING, employment_verified: true, months_in_trade: 100, prior_delinquency_count: 0, decision_source: FRANCHISEE }, as: FranchiseOwner, as_user_id: "${f_id}", captures: { cap_error: "$.data.error_id" } }
            - { call: "POST /retail/shop-locations/${s1_id}/credit-applications", payload: { technician_id: "${t_id}", requested_limit_cents: 500000, requested_kind: REVOLVING, employment_verified: true, months_in_trade: 100, prior_delinquency_count: 0, decision_source: FRANCHISEE }, as: FranchiseOwner, as_user_id: "${f_id}", captures: { ap_id: "$.data.id", ap_score: "$.data.decision_score" } }
          assert:
            - "the over-cap filing captures ${cap_error} == ERR_CREDIT_REQUEST_ABOVE_CAP with http 402"
            - "the at-cap filing succeeds with CreditApplication.${ap_id}.application_status == SUBMITTED"
            - "CreditApplication.${ap_id}.decision_score == 100, the score at the high-tier boundary"

      - name: validation_order_and_pledge_pass_all_checks_when_conditions_hold
        claim_type: satisfaction_to_pass
        grounds: ["validations[priority=5]", "validations[priority=6]", "validations[priority=13]", state_machines.SalesOrder.DRAFT_to_CONFIRMED, "errors[ERR_INVALID_REQUEST]"]
        distinguishing_aspect: "When every precondition actually holds — required fields present, order DRAFT, stock sufficient, account ACTIVE — the confirm response carries no error envelope and the order advances, proving the checks do not over-reject."
        test_recipe:
          setup: ["Franchisee F CERTIFIED; route R1 IN_SERVICE; shop S1; technician T; approved account A1 (limit 50000); product P1; R1 holds 10 units; clock 2026-09-07"]
