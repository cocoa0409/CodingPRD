  - rule_id: resource_temporal_overlap
    instances:
      - name: version_window_collision
        grounds:
          - calculations.carve_out_window_conflict
          - validations[priority=8]
          - errors[ERR_VERSION_WINDOW_OVERLAP]
          - entities.ContractVersion.fields.effective_date
        distinguishing_aspect: |
          Resource = Contract version effective windows; interval semantics =
          half-open [effective_date, next window): any two DISTINCT effective
          dates partition time without conflict, but an EQUAL effective_date
          collides (ERR_VERSION_WINDOW_OVERLAP). No adjacency concept exists —
          contrast with the carve-out instance.
        test_recipe:
          setup:
            - "Contract in IN_CONFIGURATION"
          setup_api_calls:
            - { call: "POST /networks", payload: { name: "PPO-NET", line_of_business: "COMMERCIAL_PPO" }, as: PlanAdmin, captures: { net_id: $.data.id } }
            - { call: "POST /providers", payload: { legal_name: "Prov A", tin: "TIN-A", npi: "NPI-A", locality_code: "L01" }, as: PlanAdmin, captures: { prov_id: $.data.id } }
            - { call: "POST /providers/${prov_id}/contracts", payload: { network_id: "${net_id}", base_effective_date: "2026-07-01", term_months: 36, escalator_bps: 0, escalator_mode: "ANNIVERSARY", auto_renew: false }, as: ContractManager, captures: { ct_id: $.data.id } }
            - { call: "POST /contracts/${ct_id}/begin-negotiation", as: ContractManager }
            - { call: "POST /contracts/${ct_id}/submit-for-signature", as: ContractManager, as_user_id: "cm-1" }
            - { call: "POST /contracts/${ct_id}/sign", as: ContractLegal, as_user_id: "cl-1" }
            - { call: "POST /contracts/${ct_id}/begin-configuration", as: ConfigurationAnalyst, captures: { ct_v: $.data.version } }
          trigger:
            - { call: "POST /contracts/${ct_id}/versions", payload: { version_number: 1, effective_date: "2026-07-01", expected_contract_version: "${ct_v}" }, as: ContractManager, captures: { v1_id: $.data.id } }
            - { call: "GET /contracts/${ct_id}", as: PlanAdmin, captures: { ct_v2: $.data.version } }
            - { call: "POST /contracts/${ct_id}/versions", payload: { version_number: 2, effective_date: "2026-07-01", expected_contract_version: "${ct_v2}" }, as: ContractManager, captures: { err: $.data.error_id } }
            - { call: "POST /contracts/${ct_id}/versions", payload: { version_number: 2, effective_date: "2026-09-01", expected_contract_version: "${ct_v2}" }, as: ContractManager, captures: { v2_id: $.data.id } }
          assert:
            - "err == ERR_VERSION_WINDOW_OVERLAP (equal effective_date collides under half-open window semantics)"
            - "The rejected attempt did not bump Contract.version: the same expected_contract_version ${ct_v2} succeeds for the 2026-09-01 create"
            - "Version ${v2_id} created with version_status DRAFT (distinct effective dates never conflict, regardless of adjacency)"
      - name: carve_out_closed_interval_adjacency
        grounds:
          - calculations.carve_out_window_conflict
          - errors[ERR_CARVE_OUT_WINDOW_CONFLICT]
          - entities.CarveOut.fields.start_date
        distinguishing_aspect: |
          Resource = carve-out windows on (ContractVersion, service_category);
          interval semantics = CLOSED [start_date, end_date] WITH adjacency
          collision (existing.end_date + 1 day == new.start_date conflicts) —
          strictly different geometry from the version half-open windows, and on
          a different resource entity.
        test_recipe:
          setup:
            - "Contract in IN_CONFIGURATION; version 1 DRAFT"
