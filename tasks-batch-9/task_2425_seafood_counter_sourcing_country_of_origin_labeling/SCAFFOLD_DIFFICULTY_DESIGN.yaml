      - name: case_slot_closed_interval_with_sanitation_buffer
        grounds:
          - validations[priority=45]
          - errors.ERR_CASE_SLOT_OCCUPIED
          - state_machines.SupplierLot.intake_status.CASED_to_DEPLETED
