          assert:
            - "M2 pay succeeds: RecordingMilestone.${m2}.status == PAID and project spent_cents == 1000000 == budget_cents (equality allowed)"
            - "After M2 approve the project posture was AT_RISK (spent 600000 + committed 400000 >= 85% of budget)"
            - "M3 pay rejected: error_id == ERR_PROJECT_BUDGET_EXCEEDED; project spent_cents stays 1000000"

