            - "GET /fundraising/panelists/${p4}/panel-assignments still reports exactly one assignment on ${cyc_id} with submitted_score_count == 0, confirming P4 never scored and priority 23 was never the reason for a rejection"
            - "AllocationCycle.${cyc_id}.awarded_total == 63600.00 and available_undesignated_pool == 236400.00 throughout the trigger - site visits never touch the pool"

  - rule_id: compensating_invariant
    instances:
      - name: cycle_pool_conservation_survives_award_rescind_reaward
        grounds:
          - concurrency_rules.award-create-stale-cycle
          - calculations.community_impact_fund_allocation
          - state_machines.AllocationRequest.PANEL_APPROVED_to_AWARDED
          - state_machines.AllocationRequest.AWARDED_to_PANEL_APPROVED
          - entities.AllocationCycle.fields.available_undesignated_pool
          - entities.AllocationCycle.fields.awarded_total
          - validations.priority_41_ERR_AWARD_ALREADY_REPORTED
          - endpoints.POST_fundraising_allocation_requests_id_rescind_award
        distinguishing_aspect: |
          Conserved quantity: the community impact fund itself -
          available_undesignated_pool + awarded_total == opening_undesignated_pool - which must
          hold before the award, after the award, after the compensating rescind and after the
          re-award, with no cent of drift. rescind-award is a true compensation: it must return
          the EXACT total_award (not a recomputed one) and null out all four award components
          plus awarded_at and outcome_report_due_date, so re-awarding the untouched request
          reproduces the identical figure. The window then closes: once an OutcomeReport exists,
          rescind is refused.
        test_recipe:
          setup:
            - "Agency AG driven to GOOD_STANDING by a review certified at 100.00 and holding designated_passthrough_ytd == 0.00, so designation_offset is 0.00 on every award attempt."
            - "One OPEN cycle: focus FINANCIAL_STABILITY, opening_undesignated_pool 300000.00, max_award_per_agency 200000.00, window [2026-07-01, 2026-12-31), three conflict-free seats."
            - "One request of 60000.00 in HEALTH (no focus match), scored (100,100,100) by all three panelists and finalized to PANEL_APPROVED with composite_score 100.00."
            - "Logical clock left at its 2026-08-01T00:00:00Z default."
          setup_api_calls:
            - call: "POST /fundraising/agencies"
              payload: { legal_name: "Keystone Financial Coaching", ein: "150000001", primary_priority_area: "FINANCIAL_STABILITY" }
              as: UnitedFundAdmin
              captures: { ag: $.data.id }
            - call: "POST /fundraising/agencies/${ag}/reviews"
              payload: { fiscal_year: 2025, program_expense_ratio: 0.9000, admin_expense_ratio: 0.1000, months_operating_reserve: 6.00, governance_checklist_passed_count: 10, audit_opinion: "UNQUALIFIED" }
              as: FinanceReviewer
              captures: { rev: $.data.id }
            - call: "POST /fundraising/agencies/${ag}/reviews/${rev}/certify"
              payload: { audited_program_expense_ratio: 0.9000, audited_admin_expense_ratio: 0.1000, audited_months_operating_reserve: 6.00 }
              as: FinanceReviewer
            - call: "POST /fundraising/panelists"
              payload: { full_name: "Wanda Ellis", email: "wanda.ellis@panel.org", expertise_area: "FINANCIAL_STABILITY" }
              as: AllocationsDirector
              captures: { p1: $.data.id }
            - call: "POST /fundraising/panelists"
              payload: { full_name: "Xavier Boone", email: "xavier.boone@panel.org", expertise_area: "FINANCE" }
              as: AllocationsDirector
              captures: { p2: $.data.id }
            - call: "POST /fundraising/panelists"
              payload: { full_name: "Yara Nasser", email: "yara.nasser@panel.org", expertise_area: "HEALTH" }
              as: AllocationsDirector
              captures: { p3: $.data.id }
            - call: "POST /fundraising/allocation-cycles"
              payload: { cycle_year: 2026, focus_priority_area: "FINANCIAL_STABILITY", opening_undesignated_pool: 300000.00, max_award_per_agency: 200000.00, request_window_start: "2026-07-01", request_window_end: "2026-12-31" }
              as: AllocationsDirector
              captures: { cyc_id: $.data.id }
            - call: "POST /fundraising/allocation-cycles/${cyc_id}/panel-assignments"
              payload: { panelist_id: "${p1}", conflict_declared: false, assignment_role: "CHAIR" }
              as: AllocationsDirector
            - call: "POST /fundraising/allocation-cycles/${cyc_id}/panel-assignments"
              payload: { panelist_id: "${p2}", conflict_declared: false, assignment_role: "SCORER" }
              as: AllocationsDirector
            - call: "POST /fundraising/allocation-cycles/${cyc_id}/panel-assignments"
              payload: { panelist_id: "${p3}", conflict_declared: false, assignment_role: "SCORER" }
              as: AllocationsDirector
            - call: "POST /fundraising/allocation-cycles/${cyc_id}/open"
              payload: {}
              as: AllocationsDirector
            - call: "POST /fundraising/allocation-requests"
              payload: { cycle_id: "${cyc_id}", agency_id: "${ag}", requested_amount: 60000.00, priority_area: "HEALTH", narrative_summary: "Financial coaching for shift workers." }
              as: AgencyRepresentative
              as_user_id: "${ag}"
              captures: { req: $.data.id }
            - call: "POST /fundraising/allocation-requests/${req}/submit"
              payload: {}
              as: AgencyRepresentative
              as_user_id: "${ag}"
            - call: "POST /fundraising/allocation-requests/${req}/scores"
              payload: { priority_alignment_score: 100, outcome_evidence_score: 100, capacity_score: 100 }
              as: VolunteerPanelist
              as_user_id: "${p1}"
            - call: "POST /fundraising/allocation-requests/${req}/scores"
              payload: { priority_alignment_score: 100, outcome_evidence_score: 100, capacity_score: 100 }
              as: VolunteerPanelist
              as_user_id: "${p2}"
            - call: "POST /fundraising/allocation-requests/${req}/scores"
              payload: { priority_alignment_score: 100, outcome_evidence_score: 100, capacity_score: 100 }
              as: VolunteerPanelist
              as_user_id: "${p3}"
            - call: "POST /fundraising/allocation-requests/${req}/finalize-review"
              payload: {}
              as: AllocationsDirector
              captures: { comp: $.data.composite_score }
          trigger:
            - call: "GET /fundraising/allocation-cycles/${cyc_id}"
              payload: {}
              as: AllocationsDirector
              captures: { cyc_v0: $.data.version, pool_0: $.data.available_undesignated_pool, awarded_0: $.data.awarded_total }
            - call: "POST /fundraising/allocation-cycles/${cyc_id}/awards"
              payload: { request_id: "${req}", expected_allocation_cycle_version: "${cyc_v0}" }
              as: AllocationsDirector
              captures: { tot_1: $.data.total_award, sup_1: $.data.strategic_supplement, due_1: $.data.outcome_report_due_date }
            - call: "POST /fundraising/allocation-requests/${req}/rescind-award"
              payload: { reason_code: "PROGRAM_WITHDRAWN" }
              as: AllocationsDirector
              captures: { st_2: $.data.status, tot_2: $.data.total_award }
            - call: "GET /fundraising/allocation-cycles/${cyc_id}"
              payload: {}
              as: AllocationsDirector
              captures: { cyc_v2: $.data.version, pool_2: $.data.available_undesignated_pool, awarded_2: $.data.awarded_total }
            - call: "POST /fundraising/allocation-cycles/${cyc_id}/awards"
              payload: { request_id: "${req}", expected_allocation_cycle_version: "${cyc_v2}" }
              as: AllocationsDirector
              captures: { tot_3: $.data.total_award, base_3: $.data.base_award, off_3: $.data.designation_offset, sup_3: $.data.strategic_supplement }
            - call: "POST /fundraising/allocation-requests/${req}/outcome-reports"
              payload: { reporting_period_end: "2026-07-31", persons_served: 210, outcome_metric_name: "households_coached", outcome_metric_value: 210.00, funds_expended: 61800.00 }
              as: AgencyRepresentative
              as_user_id: "${ag}"
              captures: { rep_id: $.data.id, var_pct: $.data.expenditure_variance_pct }
            - call: "POST /fundraising/allocation-requests/${req}/rescind-award"
              payload: { reason_code: "PROGRAM_WITHDRAWN" }
              as: AllocationsDirector
          assert:
            - "Before the award: available_undesignated_pool == 300000.00, awarded_total == 0.00, and 300000.00 + 0.00 == opening_undesignated_pool"
            - "After the award: AllocationRequest.${req}.status == AWARDED, base_award == 60000.00, designation_offset == 0.00, strategic_supplement == 1800.00 (net 60000.00 sits at SUPPLEMENT_TIER_1_CEILING so the rate is 0.03, not 0.06), total_award == 61800.00, outcome_report_due_date == 2027-01-28"
            - "Invariant after the award: available_undesignated_pool == 238200.00, awarded_total == 61800.00, and 238200.00 + 61800.00 == 300000.00"
            - "After the rescind: AllocationRequest.${req}.status == PANEL_APPROVED and base_award, designation_offset, strategic_supplement, total_award, awarded_at and outcome_report_due_date are ALL null; composite_score is untouched at 100.00"
            - "Invariant after the rescind: available_undesignated_pool == 300000.00 and awarded_total == 0.00 - the exact 61800.00 came back, no rounding residue"
            - "No drift on re-award: the second award reproduces base_award 60000.00, designation_offset 0.00, strategic_supplement 1800.00 and total_award 61800.00 byte for byte, and the pool returns to 238200.00 / 61800.00"
            - "AllocationCycle version advanced monotonically across the three writes (award, rescind, re-award) and the second award had to quote the post-rescind version - quoting the pre-rescind version would have failed priority 8 with ERR_STALE_VERSION"
            - "Outcome report creation moved the request to REPORTING with expenditure_variance_pct == 0.00 (funds_expended equals total_award), and awarded_total stayed 61800.00 because REPORTING is inside the ledger's status set"
            - "The compensation window is now closed: the final rescind-award attempt returns HTTP 409 with error_id == ERR_AWARD_ALREADY_REPORTED (priority 41), and the pool is still 238200.00 / 61800.00"

      - name: pledge_gross_decomposition_survives_designation_amend_round_trip
        grounds:
          - concurrency_rules.designation-amend-stale-pledge
          - calculations.pledge_designation_fee_allocation
          - state_machines.Pledge.CONFIRMED_to_AMENDED
          - state_machines.PledgeDesignation.ACTIVE_to_SUPERSEDED
          - entities.Pledge.fields.designated_amount_total
          - entities.Pledge.fields.undesignated_amount
          - entities.Agency.fields.designated_passthrough_ytd
          - endpoints.POST_fundraising_pledges_id_designations_amend
        distinguishing_aspect: |
          A completely different conserved quantity: the donor's gross pledge, which must always
          decompose as designated_amount_total + undesignated_amount == gross_amount, with
          net_designated_total == designated_amount_total - designation_fee_total, no matter how
          many times the designation set is replaced. The compensation here is a round trip
          (400.00 to one agency -> 300.00/150.00 across two agencies -> back to 400.00 to one
          agency): every SUPERSEDED line must drop out of the campaign aggregates AND out of
          Agency.designated_passthrough_ytd, so the second agency's ledger returns to exactly
          0.00 rather than keeping its 34.78. Double-counting superseded lines is the failure
          this catches - the pool instance cannot catch it because no rounding-per-line is
          involved there.
        test_recipe:
          setup:
            - "One ACTIVE employer with an OPEN campaign."
            - "Agencies AG_A and AG_B both GOOD_STANDING via reviews certified at 100.00, both with designated_passthrough_ytd == 0.00."
            - "One CONFIRMED PAYROLL_DEDUCTION pledge of 1000.00 whose single ACTIVE designation is 400.00 to AG_A (processing_fee 29.00, net 371.00, undesignated 600.00)."
            - "One remittance of 250.00 against that pledge, so collection_status == PARTIAL and the collection ratio is fixed at 0.25 for the whole test - the ratio is what makes the passthrough ledger sensitive to superseded lines."
            - "Logical clock left at its 2026-08-01T00:00:00Z default."
          setup_api_calls:
            - call: "POST /fundraising/employers"
              payload: { legal_name: "Meridian Steel Works", employee_count: 1100, payroll_periods_per_year: 26, historical_shrinkage_rate_bps: 850 }
              as: UnitedFundAdmin
              captures: { emp_id: $.data.id }
            - call: "POST /fundraising/employers/${emp_id}/activate"
              payload: {}
              as: UnitedFundAdmin
            - call: "POST /fundraising/campaigns"
              payload: { employer_id: "${emp_id}", campaign_year: 2026, solicitation_start_date: "2026-07-01", solicitation_end_date: "2026-09-30", loss_reserve_amount: 0.00 }
              as: UnitedFundAdmin
              captures: { camp_id: $.data.id }
            - call: "POST /fundraising/campaigns/${camp_id}/open"
              payload: {}
              as: UnitedFundAdmin
            - call: "POST /fundraising/agencies"
              payload: { legal_name: "Ridgeway Family Center", ein: "160000001", primary_priority_area: "BASIC_NEEDS" }
              as: UnitedFundAdmin
              captures: { ag_a: $.data.id }
            - call: "POST /fundraising/agencies/${ag_a}/reviews"
              payload: { fiscal_year: 2025, program_expense_ratio: 0.9000, admin_expense_ratio: 0.1000, months_operating_reserve: 6.00, governance_checklist_passed_count: 10, audit_opinion: "UNQUALIFIED" }
              as: FinanceReviewer
              captures: { rev_a: $.data.id }
            - call: "POST /fundraising/agencies/${ag_a}/reviews/${rev_a}/certify"
              payload: { audited_program_expense_ratio: 0.9000, audited_admin_expense_ratio: 0.1000, audited_months_operating_reserve: 6.00 }
              as: FinanceReviewer
            - call: "POST /fundraising/agencies"
              payload: { legal_name: "Sunfield Adult Day Health", ein: "160000002", primary_priority_area: "HEALTH" }
              as: UnitedFundAdmin
              captures: { ag_b: $.data.id }
            - call: "POST /fundraising/agencies/${ag_b}/reviews"
              payload: { fiscal_year: 2025, program_expense_ratio: 0.9000, admin_expense_ratio: 0.1000, months_operating_reserve: 6.00, governance_checklist_passed_count: 10, audit_opinion: "UNQUALIFIED" }
              as: FinanceReviewer
              captures: { rev_b: $.data.id }
            - call: "POST /fundraising/agencies/${ag_b}/reviews/${rev_b}/certify"
              payload: { audited_program_expense_ratio: 0.9000, audited_admin_expense_ratio: 0.1000, audited_months_operating_reserve: 6.00 }
              as: FinanceReviewer
            - call: "POST /fundraising/campaigns/${camp_id}/pledges"
              payload: { donor_reference: "D-INV-1", giving_method: "PAYROLL_DEDUCTION", gross_amount: 1000.00, designations: [ { agency_id: "${ag_a}", designated_amount: 400.00 } ] }
              as: UnitedFundAdmin
              captures: { pl_id: $.data.id }
            - call: "POST /fundraising/pledges/${pl_id}/confirm"
              payload: {}
              as: UnitedFundAdmin
            - call: "POST /fundraising/pledges/${pl_id}/collections"
              payload: { amount: 250.00, remitted_on: "2026-08-01" }
              as: FinanceReviewer
          trigger:
            - call: "GET /fundraising/pledges/${pl_id}"
              payload: {}
              as: UnitedFundAdmin
              captures: { pl_v0: $.data.version, des_0: $.data.designated_amount_total, und_0: $.data.undesignated_amount, fee_0: $.data.designation_fee_total }
            - call: "POST /fundraising/pledges/${pl_id}/designations:amend"
              payload: { expected_pledge_version: "${pl_v0}", designations: [ { agency_id: "${ag_a}", designated_amount: 300.00 }, { agency_id: "${ag_b}", designated_amount: 150.00 } ] }
              as: UnitedFundAdmin
              captures: { des_1: $.data.designated_amount_total, und_1: $.data.undesignated_amount, fee_1: $.data.designation_fee_total, net_1: $.data.net_designated_total, amends_1: $.data.amend_count }
            - call: "GET /fundraising/pledges/${pl_id}"
              payload: {}
              as: UnitedFundAdmin
              captures: { pl_v1: $.data.version }
            - call: "POST /fundraising/pledges/${pl_id}/designations:amend"
              payload: { expected_pledge_version: "${pl_v1}", designations: [ { agency_id: "${ag_a}", designated_amount: 400.00 } ] }
              as: UnitedFundAdmin
              captures: { des_2: $.data.designated_amount_total, und_2: $.data.undesignated_amount, fee_2: $.data.designation_fee_total, net_2: $.data.net_designated_total, amends_2: $.data.amend_count }
          assert:
            - "State 0 (one line, 400.00 to AG_A): designated_amount_total == 400.00, undesignated_amount == 600.00, designation_fee_total == 29.00, net_designated_total == 371.00; invariant 400.00 + 600.00 == gross_amount 1000.00"
            - "State 0 ledgers: the single ACTIVE line has collected_designated_amount == 92.75, Agency.${ag_a}.designated_passthrough_ytd == 92.75 and Agency.${ag_b}.designated_passthrough_ytd == 0.00"
            - "State 1 (two lines, 300.00 + 150.00): per-line fees 21.75 and 10.88 (mode-b: each line rounds before the sum, so the total is 32.63 - summing first would give round(450.00 * 0.0725) == 32.63 here only by luck, and the per-line trap is checked by the fee instance), designated_amount_total == 450.00, undesignated_amount == 550.00, net_designated_total == 417.37"
            - "State 1 invariant: 450.00 + 550.00 == 1000.00 and 450.00 - 32.63 == 417.37 == 278.25 + 139.12"
            - "State 1 ledgers: the two ACTIVE lines carry collected_designated_amount 69.56 and 34.78, Agency.${ag_a}.designated_passthrough_ytd == 69.56 and Agency.${ag_b}.designated_passthrough_ytd == 34.78; the superseded 400.00 line contributes nothing (a double-counting implementation would show 162.31 for AG_A)"
            - "State 1 bookkeeping: exactly one PledgeDesignation of the pledge has status SUPERSEDED, the two new lines carry designation_sequence 1 and 2 in request array order, amend_count == 1 and designation_status == AMENDED"
            - "State 2 (round trip back to one 400.00 line): designated_amount_total == 400.00, undesignated_amount == 600.00, designation_fee_total == 29.00, net_designated_total == 371.00 - every conserved quantity is bit-identical to state 0"
            - "State 2 ledgers: Agency.${ag_a}.designated_passthrough_ytd == 92.75 again and Agency.${ag_b}.designated_passthrough_ytd == 0.00 again - AG_B's 34.78 was fully reversed, not stranded"
            - "State 2 bookkeeping: three PledgeDesignation rows now have status SUPERSEDED, exactly one is ACTIVE with designation_sequence 1, amend_count == 2, and GET /fundraising/pledges/${pl_id}/designations returns all four rows"
            - "Collection axis untouched by both amends: collection_status == PARTIAL and collected_amount == 250.00 throughout, so the 0.25 ratio that produced 92.75 is the same one that produced it again"
            - "Campaign aggregates track the ACTIVE set only: after state 2 GET /fundraising/campaigns/${camp_id} reports designated_gross_total == 400.00, undesignated_gross_total == 600.00 and designation_fee_total == 29.00"
            - "Each amend bumped Pledge.version by exactly 1, and replaying the first amend with ${pl_v0} after state 1 would fail priority 8 with ERR_STALE_VERSION"
