      - name: occ_claim_rectified_stale_version_returns_412
        claim_type: occ_stale_version
        grounds: ["concurrency_rules[rectification-stale-deficiency]", "errors[ERR_STALE_VERSION]"]
        distinguishing_aspect: "OCC on PortStateControlDeficiency.version: the version observed right after creation goes stale once begin-rectification mutates the row; claim-rectified with that pre-begin version is rejected ERR_STALE_VERSION (412) while the deficiency is still legitimately RECTIFYING — isolating OCC from the state check."
        test_recipe:
          setup: ["Clock 2026-08-01T00:00:00Z; vessel with APPROVED plan; voyage V9806 IN_PROGRESS; PSC deficiency OPEN; version captured BEFORE begin-rectification"]
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
