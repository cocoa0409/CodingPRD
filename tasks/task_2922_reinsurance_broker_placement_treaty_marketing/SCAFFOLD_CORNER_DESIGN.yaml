            - call: "GET /quotes/${q_a}"
              payload: {}
              as: BrokerPlacementLead
              captures: { q_a_after: $.data.status }
            - call: "GET /signing-lines/${sl_b}"
              payload: {}
              as: BrokerPlacementLead
              captures: { sl_b_after: $.data.status }
            - call: "GET /layers/${layer_id}"
