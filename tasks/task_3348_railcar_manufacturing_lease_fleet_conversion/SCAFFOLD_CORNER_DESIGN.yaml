      assert:
      - LeaseFleetCar ${car_b}.car_type_id == ${car_b_type} == ${ct_b} and LeaseFleetCar ${car_a}.car_type_id
        == ${car_a_type} == ${ct_a}
      - 'The coverage surface holds exactly one row: GET /api/v1/retrofit-program-car-types?retrofit_program_id=${prog_id}
        lists car_type_id == ${covered_type} == ${ct_a}, so ${ct_b} is uncovered'
      - The uncovered work order returns HTTP 409 with data.error_id == ${err_capacity} == "ERR_CAPACITY_EXCEEDED"
      - The identical call against the covered type is accepted with HTTP 201, id ${ok_wo_id}, data.status
        == ${ok_wo_status} == "SCHEDULED" and shop_days == ${ok_wo_days} == 2 == required_shop_days_per_car
      - LeaseFleetCar ${car_b}.status == ${car_b_status} == "HELD", untouched by the rejected call, while
        LeaseFleetCar ${car_a}.status == ${car_a_status} == "UNDER_REPAIR" after the accepted one
      - 'The program was never started: RetrofitProgram ${prog_id}.status == ${prog_status} == "PLANNED",
        so the rejection is the coverage check and not an enrollment or deadline check'
- section: endpoints
  instances:
  - name: endpoint_action_reserve_components_commits_stock_and_requotes
    claim_type: Action endpoint
    grounds:
    - state_machines.ProductionOrder.DRAFT_to_COMPONENT_RESERVED
    - calculations.order_price_quote
    - calculations.component_allocation
    - entities.Component.fields.on_hand_qty
    - POST /api/v1/production-orders/{id}/reserve-components
    distinguishing_aspect: 'POST /production-orders/{id}/reserve-components fires DRAFT -> COMPONENT_RESERVED
      and every declared side effect lands on the re-read entities: both the WHEELSET and the CASTING
      on_hand_qty fall by qty_per_car * quantity, reserved_qty is re-derived from scratch to 0 because
      no order is RELEASED yet, and unit_price_cents is re-quoted to the committed 780000.'
    test_recipe:
      setup:
      - Empty DB; logical clock pinned to 2026-09-01T00:00:00Z.
      - 'Car type CT-A (BOXCAR, build_hours 2, regulatory_life_years 25, line_count_family LINE-A) with
        two bill-of-material rows: WHEELSET WS-A1 at qty_per_car 4 and CASTING CS-A1 at qty_per_car 2.'
      - 'Stock is seeded only through the receipt path — §1.1 declares Component.on_hand_qty as source:
        system, raised by ComponentReceipt — so 100 WS-A1 and 100 CS-A1 are on hand after POST /component-receipts/{id}/receive.'
      - SOLD order of 5 cars with planned_shop_days 10 (= build_hours 2 * quantity 5) and horizon 2026-09-01
        -> 2026-12-01, so worst_lead = max(ceil(20/4), ceil(15/2)) = 8 days clears the §1.3 production_feasibility_gate.
      setup_api_calls:
      - call: POST /api/v1/_clock/set_current_utc
        payload:
          to_iso8601: '2026-09-01T00:00:00Z'
        as: PlatformAdmin
      - call: POST /api/v1/car-types
        payload:
          model_code: CT-A
          car_class: BOXCAR
          build_hours: 2
          regulatory_life_years: 25
          line_count_family: LINE-A
        as: ProductionPlanner
        captures:
          ct_id: $.data.id
      - call: POST /api/v1/components
        payload:
          part_number: WS-A1
          component_class: WHEELSET
          unit_cost_cents: 120000
          lead_time_days: 20
        as: SupplyChainCoordinator
        captures:
          ws_id: $.data.id
      - call: POST /api/v1/components
        payload:
          part_number: CS-A1
          component_class: CASTING
          unit_cost_cents: 80000
          lead_time_days: 15
        as: SupplyChainCoordinator
        captures:
          cs_id: $.data.id
      - call: POST /api/v1/car-type-component-requirements
        payload:
          car_type_id: ${ct_id}
          component_id: ${ws_id}
          qty_per_car: 4
        as: ProductionPlanner
      - call: POST /api/v1/car-type-component-requirements
        payload:
          car_type_id: ${ct_id}
          component_id: ${cs_id}
          qty_per_car: 2
        as: ProductionPlanner
      - call: POST /api/v1/component-purchase-orders
        payload:
          component_id: ${ws_id}
          qty_ordered: 100
          unit_cost_cents: 120000
          order_date: '2026-09-01'
          expected_receipt_date: '2026-09-06'
        as: SupplyChainCoordinator
        captures:
          po_ws: $.data.id
      - call: POST /api/v1/component-purchase-orders/${po_ws}/confirm
        payload: {}
        as: SupplyChainCoordinator
      - call: POST /api/v1/component-receipts
        payload:
          component_purchase_order_id: ${po_ws}
          component_id: ${ws_id}
          qty_received: 100
          receipt_date: '2026-09-06'
        as: SupplyChainCoordinator
        captures:
          rc_ws: $.data.id
      - call: POST /api/v1/component-receipts/${rc_ws}/receive
        payload: {}
        as: SupplyChainCoordinator
      - call: POST /api/v1/component-purchase-orders
        payload:
          component_id: ${cs_id}
          qty_ordered: 100
          unit_cost_cents: 80000
          order_date: '2026-09-01'
          expected_receipt_date: '2026-09-06'
        as: SupplyChainCoordinator
        captures:
          po_cs: $.data.id
      - call: POST /api/v1/component-purchase-orders/${po_cs}/confirm
        payload: {}
        as: SupplyChainCoordinator
      - call: POST /api/v1/component-receipts
        payload:
          component_purchase_order_id: ${po_cs}
          component_id: ${cs_id}
          qty_received: 100
          receipt_date: '2026-09-06'
        as: SupplyChainCoordinator
        captures:
          rc_cs: $.data.id
      - call: POST /api/v1/component-receipts/${rc_cs}/receive
        payload: {}
        as: SupplyChainCoordinator
      - call: POST /api/v1/production-orders
        payload:
          car_type_id: ${ct_id}
          quantity: 5
          planned_shop_days: 10
          disposition: SOLD
          priority_rank: 1
          order_date: '2026-09-01'
          required_delivery_date: '2026-12-01'
        as: ProductionPlanner
        captures:
          po_id: $.data.id
          po_v: $.data.version
          po_price: $.data.unit_price_cents
      trigger:
      - call: POST /api/v1/production-orders/${po_id}/reserve-components
        payload: {}
        as: ProductionPlanner
        captures:
          r_status: $.data.status
          r_version: $.data.version
          r_price: $.data.unit_price_cents
      - call: GET /api/v1/components/${ws_id}
        payload: {}
        as: PlatformAdmin
        captures:
          ws_on_hand: $.data.on_hand_qty
          ws_reserved: $.data.reserved_qty
      - call: GET /api/v1/components/${cs_id}
        payload: {}
        as: PlatformAdmin
        captures:
          cs_on_hand: $.data.on_hand_qty
          cs_reserved: $.data.reserved_qty
      assert:
      - 'The order was quoted at creation with the forecast variant == committed variant (same-day clock,
        no lapse): data.unit_price_cents == ${po_price} == 780000'
      - POST /api/v1/production-orders/${po_id}/reserve-components returns HTTP 200 with data.status ==
        ${r_status} == "COMPONENT_RESERVED"
      - data.version == ${r_version} == 2, i.e. the transition's own version increment landed on top of
        the creation version 1
      - data.unit_price_cents == ${r_price} == 780000 == ceil((4*120000 + 25000)/100)*100 + ceil((2*80000
        + 25000)/100)*100 + 2*45000, the committed order_price_quote
      - Component.${ws_id}.on_hand_qty == ${ws_on_hand} == 80 (100 - qty_per_car 4 * quantity 5), so the
        WHEELSET commit side effect landed
      - Component.${cs_id}.on_hand_qty == ${cs_on_hand} == 90 (100 - qty_per_car 2 * quantity 5), so the
        CASTING commit side effect landed
      - Component.${ws_id}.reserved_qty == ${ws_reserved} == 0 and Component.${cs_id}.reserved_qty ==
        ${cs_reserved} == 0, because component_allocation counts only RELEASED orders and this order is
        still COMPONENT_RESERVED
  - name: endpoint_action_release_applies_approved_endorsement_and_requotes
    claim_type: Action endpoint
    grounds:
    - state_machines.ProductionOrder.COMPONENT_RESERVED_to_RELEASED
    - state_machines.SubstitutionEndorsement.APPROVED_to_APPLIED
    - calculations.order_price_quote
    - POST /api/v1/production-orders/{id}/release
    distinguishing_aspect: 'POST /production-orders/{id}/release fires COMPONENT_RESERVED -> RELEASED
      and its cross-entity side effect lands on a second aggregate: the order''s APPROVED SubstitutionEndorsement
      moves to APPLIED, the substitute''s on-hand stock drops by the endorsed 20 units while the original''s
      is restored, and the quote re-derives to 715000 including the 15000 change fee.'
    test_recipe:
      setup:
      - Empty DB; logical clock pinned to 2026-09-01T00:00:00Z.
      - Car type CT-A (BOXCAR, build_hours 2, regulatory_life_years 25, line_count_family LINE-A) with
        a WHEELSET WS-A1 row at qty_per_car 4 and a CASTING CS-A1 row at qty_per_car 2; 100 units of each
        are on hand via received ComponentReceipts.
      - Substitute WHEELSET WS-A2 (unit_cost_cents 100000) is created with 100 units on hand; the endorsement
        offers it for WS-A1 at substitute_qty_per_car 4 and decides_material false (same component_class,
        so the car's material composition does not change in flight).
      - SOLD order of 5 cars (planned_shop_days 10) is reserved, standing at version 2; the endorsement
        is then created against that version and approved by a different operator, so it stands APPROVED.
      setup_api_calls:
      - call: POST /api/v1/_clock/set_current_utc
        payload:
          to_iso8601: '2026-09-01T00:00:00Z'
        as: PlatformAdmin
      - call: POST /api/v1/car-types
        payload:
          model_code: CT-A
          car_class: BOXCAR
          build_hours: 2
          regulatory_life_years: 25
          line_count_family: LINE-A
        as: ProductionPlanner
        captures:
          ct_id: $.data.id
      - call: POST /api/v1/components
        payload:
          part_number: WS-A1
          component_class: WHEELSET
          unit_cost_cents: 120000
          lead_time_days: 20
        as: SupplyChainCoordinator
        captures:
          ws_id: $.data.id
      - call: POST /api/v1/components
        payload:
          part_number: CS-A1
          component_class: CASTING
          unit_cost_cents: 80000
          lead_time_days: 15
        as: SupplyChainCoordinator
        captures:
          cs_id: $.data.id
      - call: POST /api/v1/components
        payload:
          part_number: WS-A2
          component_class: WHEELSET
          unit_cost_cents: 100000
          lead_time_days: 10
        as: SupplyChainCoordinator
        captures:
          ws2_id: $.data.id
      - call: POST /api/v1/car-type-component-requirements
        payload:
          car_type_id: ${ct_id}
          component_id: ${ws_id}
          qty_per_car: 4
        as: ProductionPlanner
      - call: POST /api/v1/car-type-component-requirements
        payload:
          car_type_id: ${ct_id}
          component_id: ${cs_id}
          qty_per_car: 2
        as: ProductionPlanner
      - call: POST /api/v1/component-purchase-orders
        payload:
          component_id: ${ws_id}
          qty_ordered: 100
          unit_cost_cents: 120000
          order_date: '2026-09-01'
          expected_receipt_date: '2026-09-06'
        as: SupplyChainCoordinator
        captures:
          po_ws: $.data.id
      - call: POST /api/v1/component-purchase-orders/${po_ws}/confirm
        payload: {}
        as: SupplyChainCoordinator
      - call: POST /api/v1/component-receipts
        payload:
          component_purchase_order_id: ${po_ws}
          component_id: ${ws_id}
          qty_received: 100
          receipt_date: '2026-09-06'
        as: SupplyChainCoordinator
        captures:
          rc_ws: $.data.id
      - call: POST /api/v1/component-receipts/${rc_ws}/receive
        payload: {}
        as: SupplyChainCoordinator
      - call: POST /api/v1/component-purchase-orders
        payload:
          component_id: ${cs_id}
          qty_ordered: 100
          unit_cost_cents: 80000
          order_date: '2026-09-01'
          expected_receipt_date: '2026-09-06'
        as: SupplyChainCoordinator
        captures:
          po_cs: $.data.id
      - call: POST /api/v1/component-purchase-orders/${po_cs}/confirm
        payload: {}
