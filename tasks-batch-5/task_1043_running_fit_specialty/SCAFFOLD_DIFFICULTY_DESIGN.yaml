scaffold_difficulty_design:
  # ===========================================================================
  # Rule 1 — Dual-variant calculations across different entity domains
  # ===========================================================================
  - rule_id: dual_variant_calc
    instances:
      - name: order_pricing_provisional_vs_final_diverge_on_subscription_lapse
        grounds:
          - calculations.order_pricing
          - state_machines.Order.PLACED_to_FULFILLED
          - state_machines.Subscription.ACTIVE_to_PAST_DUE
          - entities.Order.fields.provisional_total_cents
          - entities.Order.fields.final_total_cents
        distinguishing_aspect: "Same single line, same member; the provisional variant (subscription ACTIVE, gear 0.20) yields provisional_total_cents 9600 while the final variant (subscription lapsed to PAST_DUE, gear 0) yields final_total_cents 12000 on the Order domain."
        test_recipe:
          setup:
            - "Store; a Staff member for fulfillment; Member M with an ACTIVE CLUB_PRO subscription; GEAR Product priced 12000 with stock 10; Order O holding one line of that product qty 1; O placed (provisional computed at ACTIVE = 9600); then M's subscription renewal FAILED so it is PAST_DUE before fulfillment."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-07-01T00:00:00Z" }
              as: StoreManager
            - call: "POST /stores"
              payload: { name: "Main", region_code: "CA", session_room_count: 1 }
              as: StoreManager
              captures: { store_id: $.data.id }
            - call: "POST /staff"
              payload: { store_id: "${store_id}", full_name: "Sam Staff", role_type: "BOTH" }
              as: StoreManager
              captures: { staff_id: $.data.id }
            - call: "POST /members"
              payload: { email: "m1@x.com", full_name: "M One" }
              as: Anonymous
              captures: { m_id: $.data.id, m_ver: $.data.version }
            - call: "POST /members/${m_id}/subscription"
              payload: { tier: "CLUB_PRO", expected_member_version: "${m_ver}" }
              as: Member
              as_user_id: "${m_id}"
              captures: { sub_id: $.data.id }
            - call: "POST /subscriptions/${sub_id}/activate"
              payload: {}
              as: Member
              as_user_id: "${m_id}"
            - call: "POST /products"
              payload: { sku: "SK-12000", category: "GEAR", name: "Vest", price_cents: 12000, stock_on_hand: 10 }
              as: StoreManager
              captures: { prod_id: $.data.id }
            - call: "POST /orders"
              payload: { member_id: "${m_id}" }
              as: Member
              as_user_id: "${m_id}"
              captures: { ord_id: $.data.id }
            - call: "POST /orders/${ord_id}/lines"
              payload: { product_id: "${prod_id}", qty: 1 }
              as: Member
              as_user_id: "${m_id}"
            - call: "POST /orders/${ord_id}/place"
              payload: {}
              as: Member
              as_user_id: "${m_id}"
            - call: "POST /subscriptions/${sub_id}/renew"
              payload: { payment_outcome: "FAILED" }
              as: StoreManager
          trigger:
            - call: "POST /orders/${ord_id}/fulfill"
              payload: {}
              as: Staff
              as_user_id: "${staff_id}"
          assert:
            - "Order.${ord_id}.provisional_total_cents == 9600"
            - "Order.${ord_id}.final_total_cents == 12000"
            - "Order.${ord_id}.final_total_cents != Order.${ord_id}.provisional_total_cents"

      - name: loyalty_earned_vs_projected_tier_diverge_on_member
        grounds:
          - calculations.loyalty_standing
          - state_machines.Order.PLACED_to_FULFILLED
          - entities.Member.fields.loyalty_tier
          - entities.Member.fields.loyalty_points
        distinguishing_aspect: "On the Member domain, earned_points 600 -> current_tier SILVER while projected_points 1740 (adds a PLACED order's provisional_total) -> projected_tier GOLD; the two variants disagree on tier for identical member data."
        test_recipe:
          setup:
            - "Member M2 (no subscription, BRONZE); Staff for fulfillment; GEAR Product PC priced 60000 stock 5 and GEAR Product PD priced 120000 stock 5; Order OA2 with one PC line placed then fulfilled (earns 600 points -> SILVER); Order OB2 with one PD line placed AFTER the upgrade (provisional at SILVER 0.05 => provisional_total 114000) and left PLACED."
          setup_api_calls:
            - call: "POST /stores"
              payload: { name: "Main", region_code: "CA" }
              as: StoreManager
              captures: { store_id: $.data.id }
            - call: "POST /staff"
              payload: { store_id: "${store_id}", full_name: "Sam Staff", role_type: "BOTH" }
              as: StoreManager
              captures: { staff_id: $.data.id }
            - call: "POST /members"
              payload: { email: "m2@x.com", full_name: "M Two" }
              as: Anonymous
              captures: { m2_id: $.data.id }
            - call: "POST /products"
              payload: { sku: "PC-60000", category: "GEAR", name: "Jacket", price_cents: 60000, stock_on_hand: 5 }
              as: StoreManager
              captures: { pc_id: $.data.id }
            - call: "POST /products"
              payload: { sku: "PD-120000", category: "GEAR", name: "Watch", price_cents: 120000, stock_on_hand: 5 }
              as: StoreManager
              captures: { pd_id: $.data.id }
            - call: "POST /orders"
              payload: { member_id: "${m2_id}" }
              as: Member
              as_user_id: "${m2_id}"
              captures: { oa2_id: $.data.id }
            - call: "POST /orders/${oa2_id}/lines"
              payload: { product_id: "${pc_id}", qty: 1 }
              as: Member
              as_user_id: "${m2_id}"
            - call: "POST /orders/${oa2_id}/place"
              payload: {}
              as: Member
              as_user_id: "${m2_id}"
            - call: "POST /orders/${oa2_id}/fulfill"
              payload: {}
              as: Staff
              as_user_id: "${staff_id}"
            - call: "POST /orders"
              payload: { member_id: "${m2_id}" }
              as: Member
              as_user_id: "${m2_id}"
              captures: { ob2_id: $.data.id }
            - call: "POST /orders/${ob2_id}/lines"
              payload: { product_id: "${pd_id}", qty: 1 }
              as: Member
              as_user_id: "${m2_id}"
            - call: "POST /orders/${ob2_id}/place"
              payload: {}
              as: Member
              as_user_id: "${m2_id}"
          trigger:
            - call: "GET /members/${m2_id}/loyalty"
              payload: {}
              as: Member
              as_user_id: "${m2_id}"
          assert:
            - "response.data.earned_points == 600"
            - "response.data.current_tier == \"SILVER\""
            - "response.data.projected_points == 1740"
            - "response.data.projected_tier == \"GOLD\""

  # ===========================================================================
  # Rule 2 — Combinatorial formulas across different modes
  # ===========================================================================
  - rule_id: combinatorial_formula
    instances:
      - name: fitting_fee_nonlinear_nonincluded_mode_a
        grounds:
          - calculations.fitting_fee
          - state_machines.FittingAppointment.SCHEDULED_to_COMPLETED
          - entities.Subscription.fields.fittings_used_this_period
        distinguishing_aspect: "Mode (a): fee combines >=3 inputs (service_type base, tier training discount, loyalty discount) under a nested min cap and a branch on the included-allowance counter — first GAIT_ANALYSIS completes as included (fee 0), the second (allowance exhausted) computes round_half_up(6000*(1-min(0.10+0.00,0.30))) = 5400."
        test_recipe:
          setup:
            - "Store; Fitter F (role FITTER); Member M with an ACTIVE CLUB_BASIC subscription (included_fittings_per_month 1, training 0.10), loyalty BRONZE; appointment A1 (GAIT_ANALYSIS) already COMPLETED as the one included fitting (fittings_used_this_period now 1); appointment A2 (GAIT_ANALYSIS) SCHEDULED."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-07-01T00:00:00Z" }
              as: StoreManager
            - call: "POST /stores"
              payload: { name: "Main", region_code: "CA" }
              as: StoreManager
              captures: { store_id: $.data.id }
            - call: "POST /staff"
              payload: { store_id: "${store_id}", full_name: "Fay Fitter", role_type: "FITTER" }
              as: StoreManager
              captures: { f_id: $.data.id }
            - call: "POST /members"
              payload: { email: "mf@x.com", full_name: "M Fit" }
              as: Anonymous
              captures: { m_id: $.data.id, m_ver: $.data.version }
            - call: "POST /members/${m_id}/subscription"
              payload: { tier: "CLUB_BASIC", expected_member_version: "${m_ver}" }
              as: Member
              as_user_id: "${m_id}"
              captures: { sub_id: $.data.id }
            - call: "POST /subscriptions/${sub_id}/activate"
              payload: {}
              as: Member
              as_user_id: "${m_id}"
            - call: "POST /fitting-appointments"
              payload: { member_id: "${m_id}", fitter_id: "${f_id}", service_type: "GAIT_ANALYSIS", start_at: "2026-07-10T10:00:00Z", end_at: "2026-07-10T10:30:00Z" }
              as: Member
              as_user_id: "${m_id}"
              captures: { a1_id: $.data.id }
            - call: "POST /fitting-appointments/${a1_id}/complete"
              payload: { gait_result: { pronation: "NEUTRAL" } }
              as: Staff
              as_user_id: "${f_id}"
            - call: "POST /fitting-appointments"
              payload: { member_id: "${m_id}", fitter_id: "${f_id}", service_type: "GAIT_ANALYSIS", start_at: "2026-07-10T12:00:00Z", end_at: "2026-07-10T12:30:00Z" }
              as: Member
              as_user_id: "${m_id}"
              captures: { a2_id: $.data.id }
          trigger:
            - call: "POST /fitting-appointments/${a2_id}/complete"
              payload: { gait_result: { pronation: "OVER" } }
              as: Staff
              as_user_id: "${f_id}"
          assert:
            - "FittingAppointment.${a1_id}.fee_cents == 0"
            - "FittingAppointment.${a2_id}.fee_cents == 5400"

      - name: order_pricing_round_per_line_then_sum_mode_b
        grounds:
          - calculations.order_pricing
          - state_machines.Order.CART_to_PLACED
          - entities.Order.fields.provisional_discount_cents
        distinguishing_aspect: "Mode (b): pinned round-per-line-then-sum. Two lines each gross 105 at eff_gear 0.10 give round_half_up(10.5)=11 per line => discount 22 and provisional_total 188; sum-then-round would give 21 / 189, so the pinned order is observable."
        test_recipe:
          setup:
            - "Store; Member M with an ACTIVE CLUB_BASIC subscription (gear 0.10), loyalty BRONZE => eff_gear 0.10; GEAR Product priced 105 stock 10; Order O with two separate lines of that product (qty 1 each) in CART."
          setup_api_calls:
            - call: "POST /stores"
              payload: { name: "Main", region_code: "CA" }
              as: StoreManager
              captures: { store_id: $.data.id }
            - call: "POST /members"
              payload: { email: "mr@x.com", full_name: "M Round" }
              as: Anonymous
              captures: { m_id: $.data.id, m_ver: $.data.version }
            - call: "POST /members/${m_id}/subscription"
              payload: { tier: "CLUB_BASIC", expected_member_version: "${m_ver}" }
              as: Member
              as_user_id: "${m_id}"
              captures: { sub_id: $.data.id }
            - call: "POST /subscriptions/${sub_id}/activate"
              payload: {}
              as: Member
              as_user_id: "${m_id}"
            - call: "POST /products"
              payload: { sku: "SK-105", category: "GEAR", name: "Socks", price_cents: 105, stock_on_hand: 10 }
              as: StoreManager
              captures: { prod_id: $.data.id }
            - call: "POST /orders"
              payload: { member_id: "${m_id}" }
              as: Member
              as_user_id: "${m_id}"
              captures: { ord_id: $.data.id }
            - call: "POST /orders/${ord_id}/lines"
              payload: { product_id: "${prod_id}", qty: 1 }
              as: Member
              as_user_id: "${m_id}"
            - call: "POST /orders/${ord_id}/lines"
              payload: { product_id: "${prod_id}", qty: 1 }
              as: Member
              as_user_id: "${m_id}"
          trigger:
            - call: "POST /orders/${ord_id}/place"
              payload: {}
              as: Member
              as_user_id: "${m_id}"
          assert:
            - "Order.${ord_id}.subtotal_cents == 210"
            - "Order.${ord_id}.provisional_discount_cents == 22"
            - "Order.${ord_id}.provisional_total_cents == 188"

  # ===========================================================================
  # Rule 3 — Non-linear state-machine shape on different entities
  # ===========================================================================
  - rule_id: non_linear_state_machine
    instances:
      - name: subscription_cycle_active_pastdue_active
        grounds:
          - state_machines.Subscription.ACTIVE_to_PAST_DUE
          - state_machines.Subscription.PAST_DUE_to_ACTIVE
          - entities.Subscription.fields.status
        distinguishing_aspect: "Subscription revisits ACTIVE after passing through PAST_DUE (a genuine ACTIVE<->PAST_DUE cycle on the Subscription entity), not a one-way pipeline."
        test_recipe:
          setup:
            - "Member M with a CLUB_BASIC subscription activated (ACTIVE) then a FAILED renewal moving it to PAST_DUE."
          setup_api_calls:
            - call: "POST /members"
              payload: { email: "mc@x.com", full_name: "M Cycle" }
              as: Anonymous
              captures: { m_id: $.data.id, m_ver: $.data.version }
            - call: "POST /members/${m_id}/subscription"
              payload: { tier: "CLUB_BASIC", expected_member_version: "${m_ver}" }
              as: Member
              as_user_id: "${m_id}"
              captures: { sub_id: $.data.id }
            - call: "POST /subscriptions/${sub_id}/activate"
              payload: {}
              as: Member
              as_user_id: "${m_id}"
            - call: "POST /subscriptions/${sub_id}/renew"
              payload: { payment_outcome: "FAILED" }
              as: StoreManager
          trigger:
            - call: "POST /subscriptions/${sub_id}/renew"
              payload: { payment_outcome: "SUCCEEDED" }
              as: StoreManager
          assert:
            - "Subscription.${sub_id}.status == \"ACTIVE\""

      - name: race_registration_parallel_payment_and_packet_dimensions
        grounds:
          - state_machines.RaceRegistration.RESERVED_to_ALLOCATED
          - entities.RaceRegistration.fields.payment_status
          - entities.RaceRegistration.fields.packet_status
        distinguishing_aspect: "On RaceRegistration, payment_status advances UNPAID->PAID independently of packet_status RESERVED->ALLOCATED; the final row is PAID x ALLOCATED, two independent dimensions on one entity."
        test_recipe:
          setup:
            - "OPEN RaceEvent (packet_capacity 2, entry_fee 5000); Staff; Member M registered (UNPAID/RESERVED) then paid (PAID/RESERVED)."
          setup_api_calls:
            - call: "POST /stores"
              payload: { name: "Main", region_code: "CA" }
              as: StoreManager
              captures: { store_id: $.data.id }
            - call: "POST /staff"
              payload: { store_id: "${store_id}", full_name: "Sam Staff", role_type: "BOTH" }
              as: StoreManager
              captures: { staff_id: $.data.id }
            - call: "POST /members"
              payload: { email: "mp@x.com", full_name: "M Par" }
              as: Anonymous
              captures: { m_id: $.data.id }
            - call: "POST /race-events"
              payload: { name: "10K", event_date: "2026-08-01T08:00:00Z", packet_capacity: 2, entry_fee_cents: 5000 }
              as: StoreManager
              captures: { ev_id: $.data.id }
            - call: "POST /race-events/${ev_id}/registrations"
              payload: { member_id: "${m_id}" }
              as: Member
              as_user_id: "${m_id}"
              captures: { reg_id: $.data.id }
            - call: "POST /race-registrations/${reg_id}/pay"
              payload: {}
              as: Member
              as_user_id: "${m_id}"
          trigger:
            - call: "POST /race-registrations/${reg_id}/allocate"
              payload: {}
              as: Staff
              as_user_id: "${staff_id}"
          assert:
            - "RaceRegistration.${reg_id}.payment_status == \"PAID\""
            - "RaceRegistration.${reg_id}.packet_status == \"ALLOCATED\""

  # ===========================================================================
  # Rule 4 — Transitive cascade chains from different triggers
  # ===========================================================================
  - rule_id: transitive_cascade
    instances:
      - name: order_fulfill_cascades_points_then_tier_then_other_order_pricing
        grounds:
          - state_machines.Order.PLACED_to_FULFILLED
          - entities.Member.fields.loyalty_points
          - entities.Member.fields.loyalty_tier
          - calculations.order_pricing
          - entities.Order.fields.provisional_total_cents
        distinguishing_aspect: "Depth-3 chain from the Order fulfill trigger: fulfilling OA writes loyalty_points (hop1 on Member) -> the new points recompute loyalty_tier to GOLD (hop2 on Member, caused by hop1) -> the tier change recomputes the still-PLACED order OB's provisional_total from 120000 to 108000 (hop3 on a different Order, caused by hop2)."
        test_recipe:
          setup:
            - "Member M (no subscription, BRONZE); Staff; GEAR Product PB priced 120000 stock 5 and GEAR Product PA priced 160000 stock 5; Order OB (one PB line) PLACED with provisional_total 120000 at BRONZE; Order OA (one PA line) PLACED with provisional_total 160000 at BRONZE."
          setup_api_calls:
            - call: "POST /stores"
              payload: { name: "Main", region_code: "CA" }
              as: StoreManager
              captures: { store_id: $.data.id }
            - call: "POST /staff"
              payload: { store_id: "${store_id}", full_name: "Sam Staff", role_type: "BOTH" }
              as: StoreManager
              captures: { staff_id: $.data.id }
            - call: "POST /members"
              payload: { email: "mcas@x.com", full_name: "M Cascade" }
              as: Anonymous
              captures: { m_id: $.data.id }
            - call: "POST /products"
              payload: { sku: "PB-120000", category: "GEAR", name: "Coat", price_cents: 120000, stock_on_hand: 5 }
              as: StoreManager
              captures: { pb_id: $.data.id }
            - call: "POST /products"
              payload: { sku: "PA-160000", category: "GEAR", name: "GPS", price_cents: 160000, stock_on_hand: 5 }
              as: StoreManager
              captures: { pa_id: $.data.id }
            - call: "POST /orders"
              payload: { member_id: "${m_id}" }
              as: Member
              as_user_id: "${m_id}"
              captures: { ob_id: $.data.id }
            - call: "POST /orders/${ob_id}/lines"
              payload: { product_id: "${pb_id}", qty: 1 }
              as: Member
              as_user_id: "${m_id}"
            - call: "POST /orders/${ob_id}/place"
              payload: {}
              as: Member
              as_user_id: "${m_id}"
            - call: "POST /orders"
              payload: { member_id: "${m_id}" }
              as: Member
              as_user_id: "${m_id}"
              captures: { oa_id: $.data.id }
            - call: "POST /orders/${oa_id}/lines"
              payload: { product_id: "${pa_id}", qty: 1 }
              as: Member
              as_user_id: "${m_id}"
            - call: "POST /orders/${oa_id}/place"
              payload: {}
              as: Member
              as_user_id: "${m_id}"
          trigger:
            - call: "POST /orders/${oa_id}/fulfill"
              payload: {}
              as: Staff
              as_user_id: "${staff_id}"
          assert:
            - "Order.${oa_id}.final_total_cents == 160000"
            - "Member.${m_id}.loyalty_points == 1600"
            - "Member.${m_id}.loyalty_tier == \"GOLD\""
            - "Order.${ob_id}.provisional_discount_cents == 12000"
            - "Order.${ob_id}.provisional_total_cents == 108000"

      - name: enrollment_cancel_cascades_waitlist_promotion
        grounds:
          - state_machines.SessionEnrollment.ENROLLED_to_CANCELLED
          - state_machines.SessionEnrollment.WAITLISTED_to_ENROLLED
          - calculations.session_waitlist_promotion
          - entities.TrainingSession.fields.enrolled_count
        distinguishing_aspect: "Depth-2 chain from the enrollment-cancel trigger: cancelling ENROLLED en1 frees a session spot (hop1: session.enrolled_count decremented) -> the freed spot promotes the earliest WAITLISTED en2 to ENROLLED (hop2, caused by hop1)."
        test_recipe:
          setup:
            - "Store; Coach; SCHEDULED TrainingSession capacity 1; Member M1 ENROLLED (enrolled_count 1); Member M2 WAITLISTED."
          setup_api_calls:
            - call: "POST /stores"
              payload: { name: "Main", region_code: "CA" }
              as: StoreManager
              captures: { store_id: $.data.id }
            - call: "POST /staff"
              payload: { store_id: "${store_id}", full_name: "Cody Coach", role_type: "COACH" }
              as: StoreManager
              captures: { coach_id: $.data.id }
            - call: "POST /members"
              payload: { email: "m1w@x.com", full_name: "M1" }
              as: Anonymous
              captures: { m1_id: $.data.id }
            - call: "POST /members"
              payload: { email: "m2w@x.com", full_name: "M2" }
              as: Anonymous
              captures: { m2_id: $.data.id }
            - call: "POST /training-sessions"
              payload: { coach_id: "${coach_id}", store_id: "${store_id}", level: "BEGINNER", start_at: "2026-07-12T09:00:00Z", end_at: "2026-07-12T10:00:00Z", capacity: 1 }
              as: StoreManager
              captures: { sess_id: $.data.id }
            - call: "POST /training-sessions/${sess_id}/enrollments"
              payload: { member_id: "${m1_id}" }
              as: Member
              as_user_id: "${m1_id}"
              captures: { en1_id: $.data.id }
            - call: "POST /training-sessions/${sess_id}/enrollments"
              payload: { member_id: "${m2_id}" }
              as: Member
              as_user_id: "${m2_id}"
              captures: { en2_id: $.data.id }
          trigger:
            - call: "POST /session-enrollments/${en1_id}/cancel"
              payload: {}
              as: Member
              as_user_id: "${m1_id}"
          assert:
            - "SessionEnrollment.${en1_id}.status == \"CANCELLED\""
            - "SessionEnrollment.${en2_id}.status == \"ENROLLED\""
            - "TrainingSession.${sess_id}.enrolled_count == 1"

  # ===========================================================================
  # Rule 5 — Validation priority conflicts across different error-category pairs
  # ===========================================================================
  - rule_id: priority_pair_validation_conflict
    instances:
      - name: return_state_beats_return_window_temporal
        grounds:
          - validations[priority=5]
          - validations[priority=7]
          - state_machines.Order.FULFILLED_to_RETURNED
        distinguishing_aspect: "Category pair {state, business_temporal}: an already-RETURNED order past its return window fails both the state check (ERR_INVALID_STATE, prio 5) and the window check (ERR_RETURN_WINDOW_EXPIRED, prio 7); the state error wins."
        test_recipe:
          setup:
            - "Member M; GEAR Product stock 5; Order O placed and fulfilled at clock 2026-07-01, then RETURNED within window; clock then advanced to 2026-09-01 (> fulfilled_at + 30 days)."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-07-01T00:00:00Z" }
              as: StoreManager
            - call: "POST /stores"
              payload: { name: "Main", region_code: "CA" }
              as: StoreManager
              captures: { store_id: $.data.id }
            - call: "POST /staff"
              payload: { store_id: "${store_id}", full_name: "Sam Staff", role_type: "BOTH" }
              as: StoreManager
              captures: { staff_id: $.data.id }
            - call: "POST /members"
              payload: { email: "mret@x.com", full_name: "M Ret" }
              as: Anonymous
              captures: { m_id: $.data.id }
            - call: "POST /products"
              payload: { sku: "SK-500", category: "GEAR", name: "Belt", price_cents: 500, stock_on_hand: 5 }
              as: StoreManager
              captures: { prod_id: $.data.id }
            - call: "POST /orders"
              payload: { member_id: "${m_id}" }
              as: Member
              as_user_id: "${m_id}"
              captures: { ord_id: $.data.id }
            - call: "POST /orders/${ord_id}/lines"
              payload: { product_id: "${prod_id}", qty: 1 }
              as: Member
              as_user_id: "${m_id}"
            - call: "POST /orders/${ord_id}/place"
              payload: {}
              as: Member
              as_user_id: "${m_id}"
            - call: "POST /orders/${ord_id}/fulfill"
              payload: {}
              as: Staff
              as_user_id: "${staff_id}"
            - call: "POST /orders/${ord_id}/return"
              payload: { reason: "size" }
              as: Member
              as_user_id: "${m_id}"
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-09-01T00:00:00Z" }
              as: StoreManager
          trigger:
            - call: "POST /orders/${ord_id}/return"
              payload: { reason: "again" }
              as: Member
              as_user_id: "${m_id}"
              captures: { err: $.data.error_id }
          assert:
            - "response.status == 409"
            - "response.data.error_id == \"ERR_INVALID_STATE\""

      - name: register_uniqueness_beats_event_full_fiscal
        grounds:
          - validations[priority=8]
          - validations[priority=9]
          - state_machines.RaceRegistration.RESERVED_to_RELEASED
        distinguishing_aspect: "Category pair {business_constraint, business_fiscal}: a member who already holds the only packet re-registers, failing both uniqueness (ERR_ALREADY_REGISTERED, prio 8) and capacity (ERR_EVENT_FULL, prio 9); the uniqueness error wins."
        test_recipe:
          setup:
            - "OPEN RaceEvent (packet_capacity 1, entry_fee 5000); Member M1 registered (active_registrations 1 == capacity)."
          setup_api_calls:
            - call: "POST /members"
              payload: { email: "mu@x.com", full_name: "M Uniq" }
              as: Anonymous
              captures: { m1_id: $.data.id }
            - call: "POST /race-events"
              payload: { name: "5K", event_date: "2026-08-01T08:00:00Z", packet_capacity: 1, entry_fee_cents: 5000 }
              as: StoreManager
              captures: { ev_id: $.data.id }
            - call: "POST /race-events/${ev_id}/registrations"
              payload: { member_id: "${m1_id}" }
              as: Member
              as_user_id: "${m1_id}"
              captures: { reg_id: $.data.id }
          trigger:
            - call: "POST /race-events/${ev_id}/registrations"
              payload: { member_id: "${m1_id}" }
              as: Member
              as_user_id: "${m1_id}"
              captures: { err: $.data.error_id }
          assert:
            - "response.status == 409"
            - "response.data.error_id == \"ERR_ALREADY_REGISTERED\""

  # ===========================================================================
  # Rule 6 — Boundary-precision checks on different metrics/endpoints
  # ===========================================================================
  - rule_id: boundary_precision_check
    instances:
      - name: shoe_mileage_reaches_threshold_exactly_triggers_reorder
        grounds:
          - calculations.shoe_mileage_rollup
          - state_machines.ShoePair.ACTIVE_to_REORDER_DUE
          - entities.ShoePair.fields.total_mileage_km
        distinguishing_aspect: "Numeric threshold on cumulative mileage via POST /shoe-pairs/{id}/run-logs: total_mileage_km reaching exactly reminder_threshold_km 500 (>=) flips ACTIVE->REORDER_DUE; 499 would not."
        test_recipe:
          setup:
            - "Member M; SHOE Product (max_mileage_km 500); ShoePair SP (ACTIVE, reminder_threshold_km 500); one run-log of 300 km appended (total 300, still ACTIVE)."
          setup_api_calls:
            - call: "POST /members"
              payload: { email: "msh@x.com", full_name: "M Shoe" }
              as: Anonymous
              captures: { m_id: $.data.id }
            - call: "POST /products"
              payload: { sku: "SHOE-1", category: "SHOE", name: "Trainer", price_cents: 15000, stock_on_hand: 10, max_mileage_km: 500 }
              as: StoreManager
              captures: { prod_id: $.data.id }
            - call: "POST /shoe-pairs"
              payload: { member_id: "${m_id}", product_id: "${prod_id}" }
              as: Member
              as_user_id: "${m_id}"
              captures: { sp_id: $.data.id }
            - call: "POST /shoe-pairs/${sp_id}/run-logs"
              payload: { distance_km: 300 }
              as: Member
              as_user_id: "${m_id}"
          trigger:
            - call: "POST /shoe-pairs/${sp_id}/run-logs"
              payload: { distance_km: 200 }
              as: Member
              as_user_id: "${m_id}"
          assert:
            - "ShoePair.${sp_id}.total_mileage_km == 500"
            - "ShoePair.${sp_id}.status == \"REORDER_DUE\""

      - name: race_packet_pool_exhausted_rejects_registration
        grounds:
          - validations[priority=9]
          - calculations.race_packet_accounting
          - entities.RaceEvent.fields.active_registrations
        distinguishing_aspect: "Empty-pool count edge via POST /race-events/{id}/registrations: a distinct member is rejected when active_registrations (1) already equals packet_capacity (1); a different metric (count vs capacity) and endpoint from the mileage boundary."
        test_recipe:
          setup:
            - "OPEN RaceEvent (packet_capacity 1, entry_fee 5000); Member M1 registered (active_registrations 1); Member M2 not yet registered."
          setup_api_calls:
            - call: "POST /members"
              payload: { email: "mf1@x.com", full_name: "M F1" }
              as: Anonymous
              captures: { m1_id: $.data.id }
            - call: "POST /members"
              payload: { email: "mf2@x.com", full_name: "M F2" }
              as: Anonymous
              captures: { m2_id: $.data.id }
            - call: "POST /race-events"
              payload: { name: "Marathon", event_date: "2026-09-01T08:00:00Z", packet_capacity: 1, entry_fee_cents: 5000 }
              as: StoreManager
              captures: { ev_id: $.data.id }
            - call: "POST /race-events/${ev_id}/registrations"
              payload: { member_id: "${m1_id}" }
              as: Member
              as_user_id: "${m1_id}"
          trigger:
            - call: "POST /race-events/${ev_id}/registrations"
              payload: { member_id: "${m2_id}" }
              as: Member
              as_user_id: "${m2_id}"
              captures: { err: $.data.error_id }
          assert:
            - "response.status == 409"
            - "response.data.error_id == \"ERR_EVENT_FULL\""
            - "RaceEvent.${ev_id}.active_registrations == 1"

  # ===========================================================================
  # Rule 7 — Cross-entity state dependencies across different entity pairs
  # ===========================================================================
  - rule_id: cross_entity_state_dependency
    instances:
      - name: enroll_requires_parent_session_scheduled
        grounds:
          - validations[priority=6]
          - state_machines.TrainingSession.SCHEDULED_to_CANCELLED
          - entities.SessionEnrollment.fields.session_id
        distinguishing_aspect: "Entity pair (SessionEnrollment, TrainingSession): enrolling is rejected because the parent session is CANCELLED, not SCHEDULED — the child creation depends on the parent entity's state."
        test_recipe:
          setup:
            - "Store; Coach; TrainingSession created then CANCELLED; Member M."
          setup_api_calls:
            - call: "POST /stores"
              payload: { name: "Main", region_code: "CA" }
              as: StoreManager
              captures: { store_id: $.data.id }
            - call: "POST /staff"
              payload: { store_id: "${store_id}", full_name: "Cody Coach", role_type: "COACH" }
              as: StoreManager
              captures: { coach_id: $.data.id }
            - call: "POST /members"
              payload: { email: "men@x.com", full_name: "M Enr" }
              as: Anonymous
              captures: { m_id: $.data.id }
            - call: "POST /training-sessions"
              payload: { coach_id: "${coach_id}", store_id: "${store_id}", level: "BEGINNER", start_at: "2026-07-12T09:00:00Z", end_at: "2026-07-12T10:00:00Z", capacity: 2 }
              as: StoreManager
              captures: { sess_id: $.data.id }
            - call: "POST /training-sessions/${sess_id}/cancel"
              payload: {}
              as: StoreManager
          trigger:
            - call: "POST /training-sessions/${sess_id}/enrollments"
              payload: { member_id: "${m_id}" }
              as: Member
              as_user_id: "${m_id}"
              captures: { err: $.data.error_id }
          assert:
            - "response.status == 409"
            - "response.data.error_id == \"ERR_SESSION_NOT_SCHEDULED\""

      - name: allocate_requires_parent_event_open
        grounds:
          - validations[priority=6]
          - state_machines.RaceEvent.OPEN_to_CLOSED
          - state_machines.RaceRegistration.RESERVED_to_ALLOCATED
        distinguishing_aspect: "Entity pair (RaceRegistration, RaceEvent): packet allocation is rejected because the parent event is CLOSED — the registration transition depends on the event entity's state (a different pair from the session/enrollment case)."
        test_recipe:
          setup:
            - "RaceEvent (packet_capacity 2, entry_fee 5000); Staff; Member M registered and PAID (PAID/RESERVED); event then CLOSED."
          setup_api_calls:
            - call: "POST /stores"
              payload: { name: "Main", region_code: "CA" }
              as: StoreManager
              captures: { store_id: $.data.id }
            - call: "POST /staff"
              payload: { store_id: "${store_id}", full_name: "Sam Staff", role_type: "BOTH" }
              as: StoreManager
              captures: { staff_id: $.data.id }
            - call: "POST /members"
              payload: { email: "mal@x.com", full_name: "M Alloc" }
              as: Anonymous
              captures: { m_id: $.data.id }
            - call: "POST /race-events"
              payload: { name: "Trail", event_date: "2026-08-15T08:00:00Z", packet_capacity: 2, entry_fee_cents: 5000 }
              as: StoreManager
              captures: { ev_id: $.data.id }
            - call: "POST /race-events/${ev_id}/registrations"
              payload: { member_id: "${m_id}" }
              as: Member
              as_user_id: "${m_id}"
              captures: { reg_id: $.data.id }
            - call: "POST /race-registrations/${reg_id}/pay"
              payload: {}
              as: Member
              as_user_id: "${m_id}"
            - call: "POST /race-events/${ev_id}/close"
              payload: {}
              as: StoreManager
          trigger:
            - call: "POST /race-registrations/${reg_id}/allocate"
              payload: {}
              as: Staff
              as_user_id: "${staff_id}"
              captures: { err: $.data.error_id }
          assert:
            - "response.status == 409"
            - "response.data.error_id == \"ERR_EVENT_CLOSED\""

  # ===========================================================================
  # Rule 8 — Resource temporal-overlap conflicts across different interval semantics
  # ===========================================================================
  - rule_id: resource_temporal_overlap
    instances:
      - name: fitting_pairwise_buffer_conflict_on_fitter
        grounds:
          - validations[priority=8]
          - entities.FittingAppointment.fields.start_at
          - entities.FittingAppointment.fields.fitter_id
        distinguishing_aspect: "Resource StaffMember with pairwise-buffer semantics: a second appointment starting 10 minutes after the first ends (< FITTING_BUFFER_MINUTES 15) is rejected even though the windows do not overlap."
        test_recipe:
          setup:
            - "Store; Fitter F; Member M; appointment A1 for F from 10:00 to 10:30 SCHEDULED."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-07-01T00:00:00Z" }
              as: StoreManager
            - call: "POST /stores"
              payload: { name: "Main", region_code: "CA" }
              as: StoreManager
              captures: { store_id: $.data.id }
            - call: "POST /staff"
              payload: { store_id: "${store_id}", full_name: "Fay Fitter", role_type: "FITTER" }
              as: StoreManager
              captures: { f_id: $.data.id }
            - call: "POST /members"
              payload: { email: "mbf@x.com", full_name: "M Buf" }
              as: Anonymous
              captures: { m_id: $.data.id }
            - call: "POST /fitting-appointments"
              payload: { member_id: "${m_id}", fitter_id: "${f_id}", service_type: "SHOE_FITTING", start_at: "2026-07-10T10:00:00Z", end_at: "2026-07-10T10:30:00Z" }
              as: Member
              as_user_id: "${m_id}"
          trigger:
            - call: "POST /fitting-appointments"
              payload: { member_id: "${m_id}", fitter_id: "${f_id}", service_type: "SHOE_FITTING", start_at: "2026-07-10T10:40:00Z", end_at: "2026-07-10T11:10:00Z" }
              as: Member
              as_user_id: "${m_id}"
              captures: { err: $.data.error_id }
          assert:
            - "response.status == 409"
            - "response.data.error_id == \"ERR_FITTER_UNAVAILABLE\""

      - name: session_aggregate_room_conflict_on_store
        grounds:
          - validations[priority=8]
          - entities.Store.fields.session_room_count
          - entities.TrainingSession.fields.start_at
        distinguishing_aspect: "Resource Store with aggregate-capacity, half-open, buffer-free semantics: a second session by a DIFFERENT coach overlapping the first is rejected only because concurrent sessions (2) would exceed session_room_count (1); adjacency without overlap would be allowed."
        test_recipe:
          setup:
            - "Store S with session_room_count 1; Coach C1 and Coach C2; session T1 (coach C1) 10:00-11:00 SCHEDULED."
          setup_api_calls:
            - call: "POST /stores"
              payload: { name: "Main", region_code: "CA", session_room_count: 1 }
              as: StoreManager
              captures: { store_id: $.data.id }
            - call: "POST /staff"
              payload: { store_id: "${store_id}", full_name: "Coach One", role_type: "COACH" }
              as: StoreManager
              captures: { c1_id: $.data.id }
            - call: "POST /staff"
              payload: { store_id: "${store_id}", full_name: "Coach Two", role_type: "COACH" }
              as: StoreManager
              captures: { c2_id: $.data.id }
            - call: "POST /training-sessions"
              payload: { coach_id: "${c1_id}", store_id: "${store_id}", level: "BEGINNER", start_at: "2026-07-12T10:00:00Z", end_at: "2026-07-12T11:00:00Z", capacity: 10 }
              as: StoreManager
              captures: { t1_id: $.data.id }
          trigger:
            - call: "POST /training-sessions"
              payload: { coach_id: "${c2_id}", store_id: "${store_id}", level: "INTERMEDIATE", start_at: "2026-07-12T10:30:00Z", end_at: "2026-07-12T11:30:00Z", capacity: 10 }
              as: StoreManager
              captures: { err: $.data.error_id }
          assert:
            - "response.status == 409"
            - "response.data.error_id == \"ERR_SESSION_ROOM_CONFLICT\""

  # ===========================================================================
  # Rule 9 — Compensating-action invariants across different conserved quantities
  # ===========================================================================
  - rule_id: compensating_invariant
    instances:
      - name: inventory_units_conserved_across_place_then_cancel
        grounds:
          - state_machines.Order.CART_to_PLACED
          - state_machines.Order.PLACED_to_CANCELLED
          - entities.Product.fields.stock_on_hand
          - entities.Product.fields.stock_reserved
        distinguishing_aspect: "Conserved quantity = physical units (stock_on_hand + stock_reserved). Place reserves 3 (10->7 on_hand, 0->3 reserved); the compensating cancel releases them (7->10, 3->0); the sum stays 10 throughout."
        test_recipe:
          setup:
            - "Member M; GEAR Product P with stock_on_hand 10, stock_reserved 0; Order O with one line of P qty 3, PLACED (P now on_hand 7, reserved 3)."
          setup_api_calls:
            - call: "POST /members"
              payload: { email: "minv@x.com", full_name: "M Inv" }
              as: Anonymous
              captures: { m_id: $.data.id }
            - call: "POST /products"
              payload: { sku: "INV-1", category: "GEAR", name: "Cap", price_cents: 2000, stock_on_hand: 10 }
              as: StoreManager
              captures: { prod_id: $.data.id }
            - call: "POST /orders"
              payload: { member_id: "${m_id}" }
              as: Member
              as_user_id: "${m_id}"
              captures: { ord_id: $.data.id }
            - call: "POST /orders/${ord_id}/lines"
              payload: { product_id: "${prod_id}", qty: 3 }
              as: Member
              as_user_id: "${m_id}"
            - call: "POST /orders/${ord_id}/place"
              payload: {}
              as: Member
              as_user_id: "${m_id}"
          trigger:
            - call: "POST /orders/${ord_id}/cancel"
              payload: {}
              as: Member
              as_user_id: "${m_id}"
          assert:
            - "Product.${prod_id}.stock_on_hand == 10"
            - "Product.${prod_id}.stock_reserved == 0"

      - name: race_money_conserved_across_pay_then_cancel
        grounds:
          - state_machines.RaceRegistration.RESERVED_to_RELEASED
          - entities.RaceRegistration.fields.refund_cents
          - entities.RaceRegistration.fields.amount_paid_cents
          - entities.Member.fields.wallet_credit_cents
        distinguishing_aspect: "Conserved quantity = money in cents: amount_paid_cents 5000 splits on the compensating cancel into wallet refund 4500 plus retained RACE_CANCELLATION_FEE_CENTS 500 (4500 + 500 == 5000); no money is created or lost."
        test_recipe:
          setup:
            - "OPEN RaceEvent (packet_capacity 2, entry_fee 5000); Member M registered and PAID (amount_paid_cents 5000, wallet 0, RESERVED)."
          setup_api_calls:
            - call: "POST /members"
              payload: { email: "mmon@x.com", full_name: "M Money" }
              as: Anonymous
              captures: { m_id: $.data.id }
            - call: "POST /race-events"
              payload: { name: "Half", event_date: "2026-08-20T08:00:00Z", packet_capacity: 2, entry_fee_cents: 5000 }
              as: StoreManager
              captures: { ev_id: $.data.id }
            - call: "POST /race-events/${ev_id}/registrations"
              payload: { member_id: "${m_id}" }
              as: Member
              as_user_id: "${m_id}"
              captures: { reg_id: $.data.id }
            - call: "POST /race-registrations/${reg_id}/pay"
              payload: {}
              as: Member
              as_user_id: "${m_id}"
          trigger:
            - call: "POST /race-registrations/${reg_id}/cancel"
              payload: {}
              as: Member
              as_user_id: "${m_id}"
          assert:
            - "RaceRegistration.${reg_id}.payment_status == \"REFUNDED\""
            - "RaceRegistration.${reg_id}.packet_status == \"RELEASED\""
            - "RaceRegistration.${reg_id}.refund_cents == 4500"
            - "Member.${m_id}.wallet_credit_cents == 4500"
